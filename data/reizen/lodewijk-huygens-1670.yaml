  tekst: 'J''ay parlé al Signor Padre touchant vostre dépense chez le frere sans en tirer rien
    de positif. il a dit tantost qu''il falloit luy dire qu''on auroit soin de reconnoistre
    cela, tantost qu''il n''estoit pas tant desraisonnable qu''estant a son ayse comme il est
    il logeast un frere venu expres pour l''assister, et enfin s''est estendu eloquemment sur
    sa necessité presente, le mauvais payement de touts costés &c.

    Pour le bassin je ne voy pas qu''il fasse dessein de le luy remettre s''il ne vient le prendre
    luy mesme. Je croy que le meilleur pour l''un et pour l''autre de ces choses sera que vous
    le persuadiez de venir le plus tost qu''il se pourra aucunement.'
