  tekst: 'A la Haye le 17 Avril 1670.

    Il Signor Padre partit avanthier pour Sevenbergen d''où il sera de retour dimanche prochain.
    Ayant esté tout le matin jusques à midy aupres de Son Altesse avec le Conseil, et estant
    pressé de partir il n''eut pas le temps de respondre à vostre lettre qui nous depeint au
    vif l''estat du pauvre Frere. Le mesme jour que mon Pere la receut je fus incontinent chercher
    Liebergen pour la Consulte que vous desirez d''avoir de Luy. Mais par malheur il estoit
    party pour Rotterdam ou il est obligé d''aller de temps en temps pour assister le Bourgemaistre
    Prins, qui semble aussi d''avoir plus de confiance en Luy qu''en touts les medecins de sa
    ville. Hier à midy pourtant il revint et promit de me faire avoir ce que je desirois mais
    non pas dans l''estendue qu''il faudroit à cause du peu de temps et de l''accablement de
    ses affaires. Tellement que j''attends la dite Consulte de moment à autre pour vous l''envoyer.
    il dit d''entendre fort bien la maladie du frere et que de necessité il faut qu''il garde
    un regime fort exact, et qu''a faute de cela il y auroit de grands inconvenients à craindre.
    Il conseille encore tres-fort qu''on tasche de le faire venir icy par touts moyens possibles,
    ne doubtant aucunement que la respiration de l''air d''Hollande qu''il suppose luy estre
    beaucoup plus utile que celuy d''aucun autre païs dans l''indisposition presente, ensemble
    avec les soins qu''il pourroit luy rendre de pres, ne soyent capables de restablir sa santé.
    Estant sur le lieu vous pouvez mieux juger de toutes choses, mais ayant veu qu''il a encore
    la force de faire des tours par la chambre, et de se tenir à table, nous croyons icy touts
    qu''il en auroit assez pour se faire transporter à petites journees jusques à Gand, ou nous
    l''irions prendre avec la Jachte dont le Capitaine dit qu''elle peut aller jusques la. Tout
    le monde et surtout le parentage conseille cela et m''ont prie de vous le recommander serieusement.
    Depuis la date de vostre derniere le temps est beaucoup raddoucy icy, apparemment il en
    sera de mesme ou vous estes et de cela nous devons esperer d''entendre quelque amendement
    de nostre pauvre malade, dont le mal me cause de grandes inquietudes, le cherissant comme
    j''ay tousjours fait.

    Monsieur Chieze doibt estre à Paris depuis Lundy ou mardy passé si il a fait aucune diligence,
    et sur ce fondement je luy escris cette enclose que je vous prie de luy delivrer. Depuis
    vostre depart j''ay receu par le Sieur d''Axelhoven qui se trouve estre le fils de Monsieur
    Veglin Le Plan de Rome que j''avois prié Monsieur Romf de m''achepter, et dont je vous ay
    prié de m''achepter un autre Estampe dans la croyance ou j''estois que la premiere se pourroit
    estre esgarée, maintenant j''ay receu cette premiere, mais suis bien loing de mon compte.
    Car au lieu de cette Carte qu''a le Beaufrere de Moggershil que j''avois mandee et attendois,
    je viens de recevoir un malheureux plan beaucoup plus petit que l''autre, ou il n''y a que
    les grandes Esglises et les principaulx palais mais le tout si mal fait qu''on n''y connoist
    que peu de chose, en somme pour mon usage je n''en donnerois pas deux sols. Ce n''est pourtant
    pas la faulte de Monsieur Romf qui apparemment n''a veu que ce plan icy, et point l''autre.
    Il se trouve pour ma confusion que l''un et l''autre a esté fait soubs le Pape Alessandro
    et l''autheur ou l''imprimeur dit que c''est un Preludio d''una altra Pianta in forma assai
    maggiore qu''il avoit dessein de faire imprimer qui sera la bonne du beaufrere. J''escris
    a Monsieur Chieze pour me la vouloir chercher en suitte de qu''il a eu la bonté de me promettre,
    je vous prie seulement de dire á Monsieur Romf qu''il ne m''envoye pas cette seconde Estampe
    que j''avois mandee en cas qu''il ne l''ait point fait desja et de rendre a Monsieur Chieze
    ce que pourra avoir cousté une Carte de Rome et un Donatus qu''il a promis de me chercher
    à Paris.

    Voycy qu''apres avoir bien attendu le Sieur Liebergen m''apporte une consulte en verité
    bien maigre, et dont les excuses font la moitjé, mais il dit qu''il luy a esté impossible
    de s''estendre d''avantage faute de temps, allant partir tout à l''heure pour Rotterdam.
    Il me dit encore que par haste il a oublié d''y mettre que le Frere feroit bien de prendre
    quelques jours durant le matin deux onces de Sirop de violette dans une quantité convenable
    d''eau bouillie avec de l''orge (Gerst) que cela luy refraischira les entrailles et detrempera
    cette humeur atrabiliaire. Mardy prochain je luy feray voir ce que vous manderez de la disposition
    du cher Frere des que les lettres seront venues afin qu''il aye plus de loisir de dire ses
    sentiments.

    Il y a un ordre imprimé et affiché par tout portant défense a touts officiers au service
    de Messieurs les Estats d''Hollande de s''absenter de leurs Garnisons durant le temps de
    trois mois; et cassant et annullant toute sorte de congés que Messieurs les Gecommitteerde
    Raden pourroyent avoir donné ou donner à l''avenir. tellement que les suppliants seront
    obliges de s''adresser pour cela aux Estats mesmes.

    Mademoiselle Silver-Croon a ce qu''on dit pour certain se marie avec le Seigneur de Cralingen
    que vous connoissez. Je vous prie de feliciter Monsieur Romf de ma part sur son mariage.

    J''ay demandé encor a Monsieur Liebergen pourquoy il n''avoit pas mis par escrit le moyen
    d''accommoder le laict qu''il touche en passant, mais il dit que premier que de pouvoir
    faire cela il fant de necessite que les vaches soyent aux champs, et secondement qu''il
    ne croit pas que le laict des vaches de France y soit propre comme celuy des nostres.

    Ne manquez pas s''il vous plait mes baisemains a mon Frere.

    Mon Pere n''a pas envoyé avec Monsieur Chieze le bassin et l''aiguiere par ce qu''il esperoit
    que le Frere le viendroit prendre icy luy mesme comme nous croyons qu''il devroit faire
    pour sa santé, le pouvant aucunement, mais s''il n''y peut pas resouldre et qu''il le desire,
    cela s''envoyera par la premiere occasion qui s''offrira.'
