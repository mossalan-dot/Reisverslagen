  tekst: Je n'ay pas voulu mettre dans ma lettre que le bon frere peut estre voudra voir que
    Liebergen dit que son mal est Melancholia Hypochondrica vera et mera, et que s'il ne se
    donne garde de manger de choses nuisibles et sur tout qui pourroyent encor eschauffer d'avantage
    cette humeur atrabiliaire, ce mal facilement pourroit luy attacquer la cervelle et y causer
    le dernier desordre, a quoy je ne puis songer sans m'affliger au dernier point. Prions dieu
    de destourner cela.
