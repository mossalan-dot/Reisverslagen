  tekst: 'A la Haye le 14 d''Aoust 1670.

    La semaine passée je revins icy de Zuylichem avec ma femme, des affaires de pardelà il ne
    vaut pas la peine d''escrire puisque vous estes sur vostre retour. Il y a longtemps que
    je n''ay point eu de vos Lettres, et cellecy ne sert proprement que pour accompagner en
    l''absence del Signor Padre ces deux incloses du beaufrere et de la Cousine Dorp. Ledit
    Signor Padre est avec Monsieur Beaumont à Geertruidenberg pour des affaires de Son Altesse
    et devoit aussi aller a Roosendael; il estoit desja party avant que nous fussions de retour
    de Zuylichem. A son arrivee nous delibererons quand on pourra faire partir la Jachte pour
    vous aller prendre à Gand. Il se pourroit que ma femme et moy viendrions aussi a vostre
    rencontre avec le reste, mais je ne scay comme tout ce monde sur tout avec la valettaille
    pourra tenir dans ce petit basteau.

    J''espere que vous m''aurez achepte cette 3e partie de Don Pietre della valle comme je vous
    ay desja recommandé par deux fois et le fais encore. Je vous prie de m''achepter aussi Le
    Familles Romaines de Fulvius Ursinus avec les additions du Sieur Patin qui a fait imprimer
    de livre. Il est en Folio et traitte des medailles consulaires, escrit si je ne me trompe
    en Latin. Si vous n''en trouvez point de relié, je vous prie d''en apporter un en blanc.
    Si vous avez encor une lettre de Change du Beaufrere je vous prie de prendre la dessus l''argent
    que vous serez obligé de deboursser pour moy; je le luy rendray aussi tost icy. Si non,
    il faudra que vous me fassez credit jusques a nostre entrevue. Adieu. Salut au cher frere,
    nous nous verrons bien tost.'
