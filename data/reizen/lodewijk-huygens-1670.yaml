  tekst: 'Mon Frere m''a dit le 13e Maij 1670.

    Que le changement qu''on a fait aux Pendules de mer

    1. consiste en ce qu''on en a osté les chainettes à cause de l''embaras.

    2. Qu''on esloigne la Pendule de l''horologe de 2. poulces afin qu''elle soit moins sujette
    à toucher.

    3. On la suspend simplement entre les 2  sans autre bride au dessous.

    4. Il faut que les  soyent d''un cuivre bien fort à cause de la pesanteur de la pendule
    qui doibt

    5. Estre de ½ ℔ ou de ¾.

    6. Le poids qu''on attache au bas de la boëte est environ de 80 ou 100 ℔. Le Poids de l''horologe
    de 14. ou 15.

    7. Il faut que la boule à la quelle l''horologe est suspendue soit le moins esloignée qu''il
    se peut de l''horologe, comme aussi de l''endroit ou elle est attachee vers en haut.

    Nota. Monsieur Richer a mandé que durant une tempeste il a mis une petite boule sur l''horologe,
    qui estoit bien 2. minutes avant que de tomber, ce qui marque assez le peu de bransle que
    souffrent ces horologes.

    La Voye Normand fort entendu a ces essaijs sur mer mais Fripon. Il n''avoit rien observé
    au premier voijage qu''il fit, quoij qu''il eust mandé merveilles, mais en suite il fut
    en Candie auec Monsieur de Beaufort et alors il fit de fort bonnes observations dont on
    a les relations.

    Mon Frere luij fit avoir alors 3. cens escus de Monsieur Colbert pour une 3e expedition,
    mais au bout de quelque temps il luij escrivit que la plus part de cet argent estoit mangé
    et qu''il luij en faudroit d''auantage, bien qu''il eut fait marché à cela, etc. de sorte
    qu''on l''a laissé la n''en pouvant tirer raison, et on a employé depuis Monsieur Richer
    qui est à present en mer pour aller aux Indes d''occident.'
