  tekst: 'A la Haye le 22 May 1670.

    Apres vostre derniere escrite vous aurez receu les avis et les consultes touchant le Schey-melck,
    et le cher Frere en aura repris apparemment l''usage, esperons qu''il luy fera du bien.
    Il me tarde bien d''en entendre le succes et ensemble la suitte de ces changements notables
    de l''appetit et de l''evacuation qui luy sont revenus d''eux mesmes. Il me semble qu''il
    y a lieu d''en attendre quelque chose de bon pourveu que cet Appetit ne soit vitieux et
    procedant d''une mauvaise cause, et que, ces selles naturelles qui se sont entresuivies
    de si pres ne degenerent en un flux de ventre comme il en vient parfois a de personnes fort
    extenuées comme vous dites qu''est le pauvre Frere.

    Ce que vous dites de l''amour qui luy reste pour la vie, je puis bien le luy pardonner en
    l''aage ou il est et remply de pensees pour de beaux desseins qu''il pourroit executer si
    Dieu luy allongeoit ses jours. Mais qu''estant en l''estat ou il se trouve, dans lequel
    il devroit comme envisager de pres l''immortalité, il s''amuse a la controverter comme une
    question problematique pour et contre, c''est ce qu''en verité j''ay appris avec beaucoup
    d''affliction. Il me semble que cela ne marque pas une creance comme il faut aux paroles
    du grand Maistre qui nous a enseigné ce qu''il falloit croire touchant l''estat de l''ame
    apres cette vie et son immortalité. Car de s''en vouloir arrester a aucune opinion formée
    à force de raisonner, ou d''esplucher les raisonnements d''hommes faits comme nous, c''est
    s''y prendre d''une maniere et d''un biais mal propres pour nous conduire ou il faut estre;
    les enseignements que le Seigneur, et ceux qui l''avoyent veu et ouy, nous ont laissé sur
    ce subjet, confirmant et garantissant leur dire par leur mort et par leur miracles, nous
    doivent bien estre d''un autre poix. En verité vous devez avoir grand soing d''empescher
    qu''il ne s''esgare du bon chemin et par vos discours propres et par ceux de bons amys que
    vous pourriez aposter expres pour ce subject afin de le mettre sur ces discours quasi aliud
    agendo, puis qu''il semble avoir peur de la veue des ministres. Si l''affaire presse je
    feray comme vous desirez que mon Pere vous en escrive, mais jusques à present je n''ay pas
    trouvé a propos de luy en rien dire ny à aucun autre. Je scay bien que cela luy causeroit
    de la douleur comme il m''en cause en verité. La perte du bon frere me cuiroit bien d''avantage
    si nous venions à le perdre dans ces sentiments. Dieu aura pitié de luy et ne souffrira
    pas que nous en facions duplicem jacturam.

    Pour le Donatus, puis que celuy que vous croyez de m''envoyer et que je desirois d''avoir
    pour la belle reliure vous est eschappé ainsi que vous avez mandé a ma Soeur, ne prenez
    plus de peine a m''en chercher un, j''en ay trouvé un icy dans une vente publicque à leyde,
    ou il a este vendu fort cher. Puis que la Carte ne se trouve pas, patience, j''espere que
    Monsieur Chieze m''envoyera la sienne s''il a receu mes lettres, autrement par le moyen
    du Cousin de Willem on pourroit tout avoir, je vous prie de me dire par quelle voye on peut
    luy faire tenir des lettres.

    Je voudrois vous envoyer des desseins pour le frere, mais je n''en ay pas encore le moyen
    ny l''occasion, en attendant j''envoye ce petit portrait en miniature que j''ay arraché
    le mieux que j''ay pû de la boeste ou il estoit collé. Je vous prie d''avoir soing qu''il
    ne se gaste et de me le renvoyer a quelque temps d''icy ou de le rapporter vous mesme, il
    n''y a point de haste.

    L''on croid pour certain que demain on mettra fin a l''affaire de Monsieur le Prince pour
    ce qui est de sa seance dans le Conseil d''estat avec une voix concluante, non obstant toutes
    les machinations de certaines personnes que vous pouvez deviner, pour le contraire.

    La Tante de St. Annelant reviendra demain d''Oorschot ou elle a este consulter le maistre
    sur le subject de sa veue. Cet Oracle a respondu que pour ce qui est de l''oeil dont elle
    ne voyoit pas il y a desja long temps, il n''y a point de remede, mais qu''il croid de guerir
    l''autre qui empire comme vous scavez de temps en temps, mais que ce ne peut estre que quand
    la cataracte qui s''y forme sera assez forte pour y pouvoir toucher, c''est à dire quand
    elle ne verra plus du tout.

    Adieu mes baisemains à mon bon frere.

    L''on dit que Monsieur de Monmorency comment a t il nom celuy qui est veuf de mademoiselle
    Mierop fait l''amour à madame de Sterrenbourg, au moins il y est fort assidu'
