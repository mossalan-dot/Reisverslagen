  tekst: 'A la Haye le 29 May 1670.

    Mon Pere estant allé saire un tour à Sevenhuysen pour voir secouer les oiseaux des arbres,
    en compagnie avec Monsieur d''Isola j''ay parlé à Monsieur Liebergen par son ordre pour
    scavoir son jugement touchant le changement survenu dans la maladie de mon frere. Il dit,
    que supposé que ces selles et ce laschement de ventre naturel ne luy ayent point fait perdre
    ny de ses forces ny de son appetit comme vous dites qu''ils n''ont point fait, on n''en
    doibt attendre que de bons effets, la nature commençant à surmonter et à se rendre maistresse
    de cette mauvaise humeur, que pour ce qui est de l''emotion febrile qui accompagna cette
    crise il ne faut pas s''en mettre beaucoup en peine, estant chose fort ordinaire que ces
    sortes d''humeurs estants agitees par un essort de la nature donnent une petite fiebure
    qui passe. Il trouve aussi bon qu''on continue de donner de temps en temps des lavements
    au frere, touchant la qualité desquels il dit qu''il faut se remettre à la prudence des
    medecins de par de là, mais qu''il croid que les plus simples comme ceux qui sont faits
    de laist et un peu de sucre ou de miel sont les meilleurs en cette occasion sans y mesler
    aucune decoction d''herbes ou autres ingredients.

    Voila tout ce que j''ay pû tirer de luy apres qu''il a veu dans vostre lettre l''estat de
    la maladie du bon et cher frere.

    Je croy que mon Pere vous aura mandé que l''affaire de l''introduction de Monsieur le Prince
    au Conseil d''Estat a passé dans l''Hollande avec bien de la façon, et soubs de petites
    modifications qui ne sont pas de grande importance comme de ne pouvoir donner sa voix dans
    des affaires qui le touchent luy mesme, qui touchent ses parents jusqu''au quatriesme degré,
    et qui concernent les charges et impositions des Provinces ou il a des terres et des biens.

    Je vous prie de me mander par quelle voye lon peut escrire au Cousin de Willem, ne doubtant
    pas qu''il ne vous ait laissé des addresses pour cela.

    Je voudrois escrire aussi à Chieze mais je ne scay pas ou il faut le chercher en Bourgogne
    ou bien à Orange. Si vous luy escrivez je vous prie de luy faire souvenir de m''envoyer
    la petite carte de Rome qu''il a et qu''il m''a promis de m''envoyer si le malheureux Pedone
    qui en devoit apporter d''autres de Rome, n''estoit de retour a Orange lors que luy y arriveroit.

    La Cousine Ide n''empire point et commence a regaigner quelque appetit. Le Cadet de ses
    freres est encore a Oorschot pour se faire guerir des coups que luy ont donne les paisans,
    et se trouve obligé de faire la Cour au Signor Fey tout de mesme comme feroit un pauvre
    diable qui à peine auroit dequoy le payer.

    Vous scavez apparemment que l''Advocat Fiscal Strijen est decede d''une maladie de peu de
    jours. Messieurs les Estat ont mis par provision en sa place l''Advocat Limburg. ce neef
    limburgh qui a tant fait enrager nostre Bisschop lequel sera mal edifié de cette dignité
    nouvelle de son cousin. Il est à Amsterdam ou se vend presentement le Cabinet tant renommé
    de Reinst.

    Le Receveur de Monnickeland mande que celuy de Zuylichem est malade a l''extremité.'
