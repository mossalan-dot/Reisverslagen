  tekst: 'A la Haye le 4 Juin 1670.

    Les signes d''amendement du frere nous resjouissent comme vous pouvez vous figurer, le beau
    temps qu''il fait touts les jours y contribuera beaucoup. Si vous lisez tousjours nos lettres
    devant luy la mienne vous doit bien avoir embarrassé je seray plus sur mes gardes à l''avenir.

    Quand vous ne voudrez plus du petit portrait par delà je vous prie de me le renvoyer seulement,
    la boeste que j''y ay faite est assez bonne pour ce chef d''oeuvre. Je cherche quelque porteur
    pour envoyer au frere de plus grands desseins mais il ne s''en offre point, la saison des
    marchands estant passée. Je ne negligeray pas la premiere occasion que je trouveray pour
    satisfaire a sa curiosité, je voudrois avoir quelque chose de meilleur que je n''ay pour
    le regaler.

    Je vous prie encore de me dire quel moyen il y a de faire tenir des lettres à D. Sebastiano
    et au Cousin de Willem en Italie. Je voudrois scavoir du dernier entre autres choses si
    le grand Vocabulaire della Crusca se rimprime à Florence comme Romf manda il y a quelque
    temps. J''en ay trouvé un à vendre a Amsterdam, mais comme ils en demandent beaucoup d''argent,
    scavoir 18 ℔ de nostre monnoye, je serois bien ayse comme je dis de scavoir s''il se rimprime
    pour l''avoir a meilleur marché et plus complet.

    Samedy dernier Son Altesse prit possession de sa nouvelle place au Conseil d''Estat, avanthier
    toutes les provinces, chascune en particulier furent le complimenter sur cette promotion.
    La resolution des Estats Generaulx porte que quand il aura atteint l''aage de 22 ans on
    deliberera si le service de l''Estat requerra qu''on le fasse Capitaine et Admiral general,
    mais avec beaucoup de precautions pour l''esloigner des esperances de pouvoir estre Gouverneur
    d''aucune province, io sto a vedere come andara.

    Mon beaufrere est de retour depuis environ 15 jours, bon garçon tout a fait, mais sombre
    comme il estoit avant que de partir.

    Monsieur de Wassenaer semblablement revint avanthier de son Envoy extraordinaire vers le
    Roy, ou lon dit qu''il a este receu assez froidement. Madame de la Lecque avec Mademoiselle
    de Waddingsveen ont esté saluer la Reine a l''Isle et se louent fort de l''acceuil qu''on
    leur a fait.

    Mademoiselle Silvercroon eut sa premiere annonce dimanche passé, vous scavez qu''elle se
    marie avec le jeune Cralingen, beaufrere du Baron.

    Je croy que lundy prochain j''iray à Amsterdam avec ma femme et la Signora Constantia sa
    soeur, pour sept ou huit jours, nous ferons vos compliments.

    Je vous avois prié de me chercher un estat de la France contenant le Gouvernement, et la
    Police de ce Royaume et non pas les simples noms des Seigneurs et des Officiers comme nous
    donne celuy que le bon frere m''a fait avoir, et dont je voudrois fort scavoir le prix pour
    le remboursser.

    Mademoiselle Pauw a gaigné son proces contre van Hoven au Grand Conseil.

    Monsieur Cassini ou quelque autre Italien de connoissance pourroit vous dire si le dictionaire
    della Crusca s''imprime, je vous prie de le scavoir s''il se peut et de me le mander par
    le premier ordinaire par ce que je ne scaurois empescher longtemps que l''exemplaire que
    j''ay trouvé a Amsterdam ne se vende.

    Quelque peu que vous soyez amateur de la peinture ne verrez vous pas les desseins de Monsieur
    Jabach?'
