  tekst: 'A la Haye le 8 May 1670.

    Ces mauvaises nouvelles du mal opiniatre du bon et cher Frere me mettent au desespoir et
    d''autant plus que ce remede du bain sembloit nous promettre quelque chose de bon. Il me
    tarde bien d''entendre si celuy du Laict de femme aura fait quelque effet et s''il aura
    pû se resoudre à le prendre. Je fus hier chercher la Cousine Dorp pour scavoir au vray comment
    elle s''estoit trouvée du Scheijmelck que vous alliez essayer selon vostre derniere en suivant
    le conseil du Sieur Liebergen. Elle me dit que l''Esté passé elle en avoit pris par compasgnie
    plustost que par necessité ensemble avec les Demoiselles Tromp, mais qu''elle avoit trouvé
    que les uns le prennent avec succes et les autres au contraire selon la force et la bonté
    des estomachs a ce qu''elle croid. Mademoiselle Tromp l''aisnée qui l''a fort bon s''en
    trouva tres bien et point chargée du tout. La Cousine Dorp au contraire qui l''a débile
    en sentit une grande pesanteur dans l''estomach meslée de colicque, sur tout avant qu''elle
    eust appris qu''apres l''avoir pris il faut se remuer et faire de l''exercice et non pas
    se coucher ou s''endormir. Mademoiselle Tromp la seconde et le Cousin Arent van Dorp ne
    le purent pas prendre avec succes non plus faute de le pouvoir digerer et furent obligés
    d''en laisser la l''usage. La quantité que beuvoit Mademoiselle Tromp estoit celle d''un
    verre à biere ordinaire. Tout ce que dessus me fait apprehender que l''estomach de mon frere
    ne pourra pas fournir à la concoction de ce laict qui en effect n''est que du beurre un
    pue plus liquide que celuy que lon mange. J''ay plus d''opinion du laict de femme et croy
    qu''il fera plus de bien a nostre cher malade s''il peut ou s''il a pû s''y resouldre. Les
    exemples du succes de ce remede sont infinys à ce que l''on dit, celuy que je puis alleguer
    est d''un Advocat d''icy que je voy touts les jours par les rues et que ce laict a guery
    et tiré de la derniere extenuation delaissé qu''il estoit de touts les medecins. Plaise
    à dieu qu''il en puisse faire autant au bon frere ou du moins luy rendre les forces qu''il
    faut pour l''acheminer vers icy on on le desire tant. Mais quand il plairoit à dieu d''en
    ordonner autrement je scay qu''il a l''ame assez grande pour se resouldre avec courage au
    passage qui mene à la vie dans laquelle dieu rejoindra les membres et les parties de nostre
    famille que de temps en temps il en a retranchées et voudra en retrancher encore pour les
    reunir dans l''heureuse eternité. J''espere pourtant tousjours le meilleur (s''il peut y
    avoir quelque chose de meilleur que d''estre dans la beatitude de bonne heure) et me flatte
    encore de ce que la pluspart des medecins de par là esperent la guerison, il faut apres
    tout se ranger a ce que le destin en ordonnera.

    Dans ma derniere à Monsieur Chieze je l''ay fort pressé de m''envoyer sa Carte de Rome et
    croy qu''il le fera. S''il vous l''addresse je vous prie de l''envoyer à la premiere occasion.
    Je ne croy pas que vous ayez trouvé la mesme Carte à Paris parce que par le dernier ordinaire
    vous ne m''en avez rien dit. Adieu mes recommandations au cher frere que Dieu veuille nous
    conserver.'
- verzender: Constantijn Huygens jr. (1628-1697)
