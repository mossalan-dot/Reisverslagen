beschrijving: Maakte tussen 1649 en 1651 een educatiereis naar Italië, Zwitserland en Frankrijk
  in het gezelschap van Arnout Hellemans Hooft (1629-1680), de dichter Reyer Anslo (1626-1669),
  zijn neef Rombout Hudde (1620-1679), IJsbrand Kieft, Blom en Ooms.
