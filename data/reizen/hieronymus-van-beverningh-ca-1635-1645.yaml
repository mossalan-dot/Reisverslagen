id: hieronymus-van-beverningh-ca-1635-1645
titel: Recueil de l’estat de France, où sont compris les noms des dignitez et familles principales
reizigers:
- hieronymus-van-beverningh
reistype: educatiereis
jaren: ca. 1635-1645
vertrek: ca. 1635
gebieden:
- Nederlandse Republiek
- Frankrijk
beschrijving: Studeerde rechten in Leiden en maakte ergens tussen 1635 en 1645 een educatiereis
  naar Frankrijk. Schotel meldt dat hij ook naar Zwitserland en Italië trok en een verslag bijhield,
  getiteld Recueil de l’estat de France, où sont compris les noms des dignitez et familles principales.
literatuur:
- BWN, II, 494-499; NNBW, VII, 127-129; RAA; Schotel 1847; Van der Meij 2016, 6-25.
bronnen:
- gemaakt-op-reis-database
