beschrijving: 'Rapport van de gedeputeerden te velde Willem van Reesfelt, Everhard van Weede,
  heer van Dijkveld, Johan de Merode, Epeus van Glinstra, Cornelis de Witt, Elbert Anthony van
  Palland, heer van ''t Hampt, Marinus van Crommon, Johan van Reede van Renswoude en Arnold
  van Nijeveen betreffende de veldtocht tegen de bisschop van Munster onder leiding van graaf
  Maurits van Nassau.1665 september 30 - 1665 december 30


  Rapport van de gedeputeerden te velde Johan van Merode, Marinus van Crommon, Epeus van Glinstra
  en Arnold van Nijeveen betreffende hun inspectie van het Nederlandse garnizoen en de voorraden
  in Wesel alsmede over de voorbereiding van de veldtocht tegen de bisschop van Munster vanuit
  deze stad. 1665 november 30 - 1665 december 23'
