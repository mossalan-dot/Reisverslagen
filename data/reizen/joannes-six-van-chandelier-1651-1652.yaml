  beschrijving: In het najaar van 1651 was Six voor de tweede maal naar Italië gereisd, nu door
    Duitsland en over de Alpen. Hij reisde toen niet verder dan Venetië. Bij de heenreis hield
    de jonge Haagse schilder Michiel Soetens hem gezelschap. Nadere bijzonderheden over Soetens
    en over de heenreis zijn te vinden in de Toelichting en Annotatie bij gedicht no. [286].
    Bij zijn thuisreis, in de winter van 1651-1652, zond Six dit sonnet (de versregels zijn
    trocheïsche viervoeters) aan de in Italië achtergebleven Soetens. Het is later afgedrukt
    op p. 44 van zijn bundel van 1657.
  tekst: 'Waarom keer ik, o Tirool,

     

    Van de Veneciaansche daaken,

     

    Niet door ''t Milaaneesch vermaaken,

     

    Maar dit sneeuw, en beerenschool?

    5

    Is dit schraale berghriool,

     

    Waar rivieren ruischen, kraaken,

     

    Waar de menschen doof geraaken,

     

    Van een Nylval uit den pool:

     

    Is dit boerenland, zoo pryslik,

    10

    Als een ander Itals deel?

     

    Soetens, neen, ''t is onbewyslik.

     

    Loop vry met uw jongh penceel,

     

    Naa landouwen, niet zoo yslik,

     

    Maar naa Rome, schoon, en eel.'
- titel: Aan N. v. Liebergen
  dichter: Joannes Six van Chandelier
  aan: N. van Liebergen
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "Evenals Abraham Grenier was N. van Liebergen een ‘reisbroer’ van Six tijdens\
    \ de reis door Frankrijk in 1649. Van Liebergen had Six nadien kennelijk meerdere malen\
    \ uitgenodigd voor een maaltijd, maar had hem, toen hij werkelijk een maaltijd gaf, vergeten\
    \ uit te nodigen. Six bedankt hem enigszins stekelig voor de eer van zijn eerdere uitnodigingen.\
    \ Van Liebergens vergeetachtigheid behoedt hem (Six) voor onhoffelijkheid, laat hij hem\
    \ weten en hij wil daarmee zeggen dat hij een nieuwe uitnodiging zeker zal afslaan.\n \t\
    Over N. van Liebergen heb ik geen nadere bijzonderheden kunnen vinden; hij was mogelijk\
    \ een kleinzoon van de Bosschenaar Paulus van Liebergen (1551-...), die in 1596 poorter\
    \ van Amsterdam was geworden, en een broer of neef van Grietge van Liebergen, die in 1642\
    \ was getrouwd met de wijnverlater Isaäc Jansz. Calkoen (Elias, Vroedschap ii, p. 560-561\
    \ en p. 656). Zijn naam komt in Six' bundel alleen op deze plaats voor. Het sonnet staat\
    \ op p. 45 van Six' bundel."
  tekst: 'Liebergen scherts'', en veinsenhaater,

     

    Die my gestaagh confrater heet,

     

    Sints wy in Vrankryk, goed en leed,

     

    Saam leeden, op het land, en waater:

    5

    Hoe komt het dat ghy, schoone praater,

     

    My tienmaal noodight, op een beet

     

    Van ''t draagmaal, en nochtans vergeet?

     

    Confrater zoo doet geen confrater.

     

    Ik dank u, als nu onverplicht

    10

    Tot dank, om dat ik niet begeerde

     

    Te slachten een ondankbaar wight.

     

    Dat van Grenier, een Rechtsgeleerde,

     

    Ons reisbroer, gefeesteert, ''t gesicht

     

    Hier onbekent quansuis, stout keerde.'
- titel: Dwaasen roem
  dichter: Joannes Six van Chandelier
  aan: Matthijs van der Merwede (1613-1664)?
  datum: '1651'
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Hoogewerff, 1950, p. 90 beweert dat dit sonnet betrekking heeft op de dichter
    Matthijs van der Merwede, heer van Clootwijck (1613-1664) en met name op diens bundel Uyt-heemsen
    Oorlog, Ofte Roomse Min-triomfen van 1651. Dit is zeker niet onmogelijk, maar het stuit
    op enkele bezwaren. Van der Merwede was er, als ik afga op zijn werk, niet zozeer op uit
    overspel te plegen of sodomie te bedrijven (r. 7-8). Hij benadrukt juist dat hij daarvan
    (met name van het laatste) een afschuw heeft. Misschien heeft Six hem dus slecht gelezen
    of heeft dit sonnet niet zo direct betrekking op Van der Merwede alleen, maar meer op een
    bepaald slag Hollanders (waartoe Van der Merwede eventueel ook gerekend kan worden). Six
    kan hem in Rome niet ontmoet hebben, want Van der Merwede was in 1650 teruggekeerd in Nederland
    (vgl. over hem Dr. P.C.A. van Putte in Lexicon, 1986). Het sonnet staat op p. 46 van Six'
    Poësy.
  tekst: 'Een ander Hollands kind trek minnesieke pennen,

     

    Uit wieken van Kupyn, om syn geleschten brand,

     

    Met geilheit, en vermaak, langhs ''t geile Ausoonsche strand,

     

    Aan Vaaderlandsche jeuchd, eersuchtich te bekennen.

    5

    Een ander houde ''t klucht, zoo meenich maaghd te schennen,

     

    Syn saad te saaijen, in een algemeensaam land,

     

    Te planten hoornen, voor een eeman bittre schand,

     

    Of ''t aavrechts poortslot, met een bullans, in te rennen.

     

    Myn gansewiekje, van Minerves hand, bestiert,

    10

    Al vloogh het wyds en syds, by glomme minnevonken,

     

    Wiert nooit gesenght gelyk het reedenloos gediert.

     

    Ik acht het swyghsaam best, met deesen roem, te pronken,

     

    Dat ik myn vry gewis, en welvaard heb geviert:

     

    Nu brengh ik koeler bloed noch uitgeminde schonken.'
