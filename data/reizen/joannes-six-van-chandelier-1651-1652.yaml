  dichter: Joannes Six van Chandelier
  datum: najaar 1650
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht is tot stand gekomen tijdens Six' tweede verblijf in Venetië, in
    het najaar van 1651. Hij droeg het in een begeleidend gedicht (vgl. no. [289]) op aan een
    vijftal bevriende Hollandse kooplieden in Venetië. In korte interpreterende artikelen hebben
    Verkuyl en Van Caspel aantekeningen bij dit gedicht gegeven (Verkuyl, 1974 en Van Caspel,
    1978, vgl. ook Van Es, 1953, p. 150-156, Arens, 1961, p. 119-120 en Michels, 1964, p. 179-181).
    Het gedicht staat op p. 74-85 van Six' bundel.
  tekst: "O hoe gevalt het my, wanneer\n \nIk van Sint Markus Heemelleer,\n \nSyn tooren, in\
    \ dees soete lucht,\n \n't Geberghte sie, soo wyd berucht!\n5\nDat Duitschland afsnydt,\
    \ uit natuur,\n \nVan middagh, met een kromme muur,\n \nTot midnacht, trotser dan het werk,\n\
     \nDat China metste tot een perk.\n \nHoe lustigh is 't, dat d'avondstond\n10\nHier siende,\
    \ naa den rooden mond,\n \nDes morgens, sich baadt in de zee\n \nToeschietende in, en om\
    \ dees stee!\n \nWaar in, terwyl de Sonne schynt,\n \nEen eiland hondertmaal verdwynt,\n\
    15\nOf met een volle schaaduw groeit,\n \nNaa dat het straalgoud laauwt, of gloeit.\n \n\
    Wat zyt ghy Heneciaaner stad,\n \nAntenors werk dan vlak, en plat,\n \nVan ei, aan eiland\
    \ elke reis,\n20\nVan veel palleisen een palleis?\n \nKlim ik beneên, op Markus veld,\n\
     \nNaast Theodoors pilaar gestelt,\n \nWaar uw dry ryken staan te pronk,\n \nElk met een\
    \ steil gevlagden stronk,\n25\nAansiende, als in een winkelhaak,\n \nDat marmre Raadshuis,\
    \ met vermaak,\n \nLangs heen beschuimt van louter zee,\n \nWat lykt hier Sein, en Loevre\
    \ mee?\n \nIk vaar de groote waaterstraat,\n30\nMet gondels oover, onversaad\n \nVan Isters\
    \ steen, die ik beschouw,\n \nEen konst, en kostlik Heerenbouw.\n \nWat swiert hier meenigh\
    \ swarte tent,\n \nRank op vier deeltjes oover end,\n35\nMet ysre tanden, en een staart,\t\
    Over dit hoofdstuk/artikel\nLANDEN\nItalië\n\n[p. 127]\t\n \nAls vischen, met een saagh,\
    \ en swaard!\n \nEen roeit er staande, langhs de kim,\n \nEn scheemert heenen, als een schim,\n\
     \nSy vlichlen sneller heen, en weer,\n40\nDan d'allersnelste swaaluwveer.\n \nMen hoort\
    \ Karros, noch hoefgedreun,\n \nLangs duisend bruggen, sonder leun,\n \nEn steegen engh\
    \ voor sonnebrand,\n \nDoorgaans met klinkert op syn kant.\n45\nEen man, met zoo een lichte\
    \ jol,\n \nVerstrekt kalesse, en koetsgerol,\n \nEn wil men swaare vracht gekruit,\n \n\
    Men neemt een pont, of swaarder schuit.\n \nHou gondelier, daar is u geld,\n50\nIn dertigh\
    \ schellingskens getelt,\n \nIk segh, hou vast, en set my aan,\n \nWaar dat men dichst ter\
    \ beurs kan gaan.\n \nWat maak ik hier? de wyser wyst\n \nMaar sestien uuren, op de lyst,\n\
    55\nVan vierentwintich in de keer,\n \nNoch van de beursuur twee te veer.\n \nSie daar die\
    \ wonderbaare brugh\n \nRialto, die syn krommen rugh,\n \nVan eenen wydgespannen boogh,\n\
    60\nMet swaare winkels tilt om hoogh.\n \nO Tiber, Mansannaar, en Sein,\n \nO Rhoone, Moesel,\
    \ Arn, en Mein\n \nSwygh van uw trotse vouten stil,\n \nHier speelt de zee, als door een\
    \ kil.\n65\nIk klim dat hoogh gewelfsel af,\n \nOntrent den dorpel, dien men gaf\n \nSint\
    \ Bartels naam, recht oover 't huis\n \nDes Duitsch, als in een paapenkluis.\n \nDe Mis\
    \ gaat uit, ailieve aanschouw,\n70\nDaar komt van Chams geslacht een vrouw,\t\n[p. 128]\t\
    \n \nZoo langh, als Basels reusebeen,\n \nGemaalt by Platers seldsaamheen.\n \nEen witte\
    \ tafte wiele dekt\n \nHeur hoofd, terwylse d'aarde lekt,\n75\nSe leunt, aan elke sy, heur\
    \ lyf\n \nOp krukken, schouders van een wyf.\n \nMen denk hoe dat het by my lagh,\n \nAls\
    \ ik dat Hamburghs waapen sach.\n \nEen Borger, die voor by quam gaan,\n80\nSprak my verwondert,\
    \ lachende, aan.\n \nZoo schoeit sich al de rykdom meest,\n \nMet sokkels, naa d'Atheensche\
    \ leest,\n \nEn hooger. Met zoo sloegh ik acht,\n \nHeur lengte was gemaakte pracht.\n85\n\
    Wat heeft de werld veranderingh\n \nIn zeeden, draght, in alle dingh?\n \nElk landschap\
    \ schept behaagen in\n \nDe wysen, naa haar eigen sin.\n \nIk kuijer voort, en gaa naa huis,\n\
    90\nDoor 't meeste dringen, en gedruis\n \nVan menschen, in de Kraamestraat,\n \nAls Mieren\
    \ krielend vroegh en laat.\n \nHoe zyn dees winkels opgetooit,\n \nMet oope vensters, net\
    \ bestrooit,\n95\nBeleit, behangen, en bekleedt,\n \nVan alles wat men weeght en meet!\n\
     \nZoo veel koleuren, goud, en sy,\n \nZoo soeten aam van kruidery,\n \nEn duisend dingen\
    \ van de kunst,\n100\nVerlokken 't hart, om geldbre gunst.\n \nHeel Indie leit hier, als\
    \ bloot,\n \nEn oopent haar onschatbren schoot.\n \nFlorence, en Neurenbergh benydt,\n \n\
    Wat deese Stad hier weeft, en snydt.\n105\nDe reuk twist, met het oogh, dat siet,\t\n[p.\
    \ 129]\t\n \nWie van hun bei het soetst geniet.\n \nIndien ik scheidsman weesen moet,\n\
     \nIk dubbe self, in al dat soet.\n \nO Morgenstond! zoo kort, en bly,\n110\nVergeeten in\
    \ die lekkerny,\n \nDie onvergeetelyk meer heught,\n \nDan hoofsch banket, en keldervreuchd:\n\
     \nIk druk u in het breinpapier,\n \nMet al het Kooninghlyk gecier,\n115\nDat meer dan Kooninghlyk\
    \ geschat,\n \nIk gister noch sach in de Stad.\n \nIndien men spellen zou 't verhaal,\n\
     \nNaa 't waardich dient, van 't Arsenaal,\n \nHet waapen eiland van natuur,\n120\nMet soute\
    \ grachten in syn muur,\n \nVan Leeuwevleuglen dicht bedekt,\n \nSchoon 't wyder dan Livorno\
    \ strekt,\n \nEen stad gelykende als Iudeek,\n \nEn andre, ontrent de selve streek:\n125\n\
    Wie vondt sich niet verwondert dan,\n \nDat dit zoo meenigh duisend man,\n \nCiklopen, en\
    \ veel konstenaars,\n \nBewaaren 's daaghs, en by de kaars,\n \nIn kryghsnood werkende en\
    \ in peis\n130\nOok waapenen voor 't raadspalleis?\n \nVoorsichtich is 't gemeene best,\n\
     \nDat vreedich vreest voor oorloghspest.\n \nWat sietmen daar al waapenkraam,\n \nTe waater,\
    \ en te land bequaam,\n135\nVoor ruiters, voetvolk, en een vloot,\n \nZoo swaar, als licht,\
    \ elk naa den nood?\n \nHoe meenigh braaf galei, en schip,\n \nEn galeas, een vlotte klip,\n\
     \nVan vlas, en staal, en brons, en hout,\n140\nRees daar tot 's Turks verderf gebouwt?\t\
    \nEmendatie r. 122: Schoon < Schoont\n[p. 130]\t\n \nMen reise, en sie een gaalery,\n \n\
    En ander waapenleeger vry,\n \nTe Napels, Augsburgh, Room, Toulon,\n \nDe stommen seggen\
    \ wie het won.\n145\nNiet min verwondert my Muran,\n \nDat schier een pols bespringen kan,\n\
     \nOm al het kristallyne glas,\n \nGevonden naa een waaterplas,\n \nDat naadoet, wat het\
    \ voor siet doen:\n150\nZoo doet geen schildrend Kameleoen.\n \nMen maakt geen kristallyn,\
    \ als hier,\n \nVan spiegels, en voor wyn, en bier.\n \nDie stookebranden sonder end,\n\
     \nEn blaasers maakten u bekent,\n155\nVenecie, om des werrelds kloot,\n \nAl had ghy anders\
    \ geen kleinnood.\n \nMaar wie dat wonderstuk sint Mark\n \nAanmerkt, en meenigh andre kerk,\n\
     \nWaar onder Pauwels met Koljoon,\n160\nGelyk Aureel, in Room, ten toon,\n \nDie reeden\
    \ wikt. Is 't werreldsch trots,\n \nOp huisen, aan 't gebouwsel Gods\n \nIs snyden, schildren,\
    \ marmersteen,\n \nEn konstigh goud niet ongemeen.\n165\nO groote, o ryke, o schoone stad,\n\
     \nIndien men steeden noemt, waar dat\n \nMen poorten sluit, noch hek, noch boom,\n \nMaar\
    \ dagh, en nacht houdt oopen stroom:\n \nO Stadt die eeuwigh niet vergaat,\n170\nOm billike\
    \ orde, die den staat\n \nVoorsichtigh handhaaft, door een kroon,\n \nEn roodgekleede en\
    \ swarte Goon:\n \nKryghsdaadigh, vroom getabbaard hof,\n \nDoelschietster naa Romeinen\
    \ lof,\n175\nHoe meer men 't oogh aandaghtigh slaat\t\n[p. 131]\t\n \nOp u, hoe meer 't\
    \ betoovert staat.\n \nWat feesten eert ghy alle jaar,\n \nNiet minder lust, dan wonderbaar,\n\
     \nGelyk wanneer dat schip van goud\n180\nNeptunus ringh aan Thetis trouwt.\n \nWat is er\
    \ bieswarms, en geswiers,\n \nVan dertich duisend gondeliers,\n \nOm 't fraaist, met rykdom,\
    \ afgerecht,\n \nGetuigen van des Hertoghs echt?\n185\nDan is 't twee weeken, op het perk,\n\
     \nGekraamde kerkmis van sint Mark.\n \nDe sinnen wandlen alle vyf,\n \nDaar tot geneught\
    \ van ziel en lyf.\n \nMaar als de Vaader van Jupyn,\n190\nEn die van allerhande wyn,\n\
     \nSich als van heidnen sien geviert,\n \nIuist naa dat Kristus mensche wierd:\n \nWie dart,\
    \ en kan die week of acht\n \nNaabootsen, met een waare schacht?\n195\nWant elke Borger\
    \ werd dan gek,\n \nGeen tien, sy volgen dat gebrek.\n \nDen Aadel kiest het koopgewaad.\n\
     \nDe Koopman mint den rok, en laat\n \nSyn mantel. d'Arme komt, als ryk.\n200\nDe ryke\
    \ een beedelaar gelyk.\n \nDe man met een gefloerste tuit,\n \nEn syde rokken is de Bruid.\n\
     \nSy, met een pluimen hoed, voor doek,\n \nKomt aan gemantelt, in de broek.\n205\nMen kent\
    \ noch baard, noch gladde kin,\n \nVan beider kunne, schuilswyse in\n \nEen momvel, als\
    \ een uil, een aap,\n \nEen beer, een droes, een non, een paap.\n \nMen trommelt, fluit,\
    \ trompet, en springht,\n210\nMet bellen aan, men veelt, en singht,\t\n[p. 132]\t\n \nMen\
    \ gaat op stelten, hoofd, en hand,\n \nMen buitelt op 't besteende sand.\n \nWie best den\
    \ sot grimmassen kan,\n \nIs onbekent de wyste man.\n215\nIn zulken schyn zoo schept de\
    \ wraak,\n \nIn moorden, dikwils ook vermaak.\n \nDe kraamstraat pronkt, gelyk wanneer\n\
     \nMen purpert een doorluchten Heer,\n \nDie 't syner eer, in 't oogh ontfanght\n220\nHet\
    \ best, dat anders binnen hanght.\n \nFraai opgedaan is half verkocht.\n \nWat winkel werd\
    \ er niet besocht!\n \nMet gaaven kruipen liefde, en min,\n \nDan door bewaakte muuren in.\n\
    225\nSie Sibaris, in't wandlen, vindt\n \nDe schoone Lydie, die hy mint,\n \nHy kendt haar\
    \ aan 't geschoncken kleed,\n \nEergister voor haar aanbesteedt.\n \nMaar Telfus in een\
    \ liverei\n230\nVan groen, die gooit een ambrich ei,\n \nUit korfkens naa heur borst van\
    \ was,\n \nAls sy op straat kykt, uit het glas.\n \nBarine blank, aan hand, en tand,\n \n\
    Lokt op een kleine teenemand,\n235\nMet soet banket, vol mirtegeur,\n \nDe minnaars, naa\
    \ heur aavenddeur.\n \nKanidie de koppleres\n \nVeilt Lalagaatjes goude bles\n \nOmloovert,\
    \ aan het geile vier,\n240\nAls een onnoosel gilde dier.\n \nNeobel vryt, in vremde schyn,\n\
     \nDen tengren Hebrus syn Kupyn,\n \nEn wil, uit wellust, dat hy gaat,\n \nIn syde, en een\
    \ gevlerkt gewaad.\n245\nAsterie, als eer langh de Bruid,\t\n[p. 133]\t\n \nSiet naa heur\
    \ trouwen Giges uit,\n \nDie sy van Smirne wacht, uit zee.\n \nEen ander eert daar Galate.\n\
     \nToonneelen lyden grooten loop.\n250\nMaar op de straat is 't beeter koop.\n \nAlcides\
    \ schoudert hoofd, op hoofd.\n \nEen Os werd met een slagh deurklooft.\n \nDe Son gaat onder\
    \ op Ridot,\n \nDe dobbelschool werd saam gerot.\n255\nMen wisselt sterker, by de kaars,\n\
     \nDan 's middaghs, by de wisselaars.\n \nDe wissel loopt er, naa 't geluk,\n \nDie wispeltuurich\
    \ geeft in druk,\n \nOp steenen, of een tuischers blad,\n260\nVult d'eene sak, maakt d'ander\
    \ plat.\n \nWaar vindtmen vryer vrye bank,\n \nBy aadel, op een kaart in swank,\n \nAan\
    \ taafel ree, met zoo veel geld,\n \nAls mommery daar teegen stelt?\n265\nVan andre hoopen\
    \ werd de nacht,\n \nMet vroolik slempen deurgebracht.\n \nDe tabberd en een slechter ziel\n\
     \nVergast, op 't kost'likst, dat er viel.\n \nHoe meenigh Venus schaft banket,\n270\nIn\
    \ Duitsch Veneetsch een hoer ballet?\n \nDe keel, en cyter, en den dans,\n \nWat meer? verswakt,\
    \ en kost de mans.\n \nGeberghte, en dal, en bosch, en veld,\n \nWat soekt me, en vindtmen\
    \ niet om geld?\n275\nDat leevert twee, en viergevoet,\n \nEn wyn, en fruit, in oovervloed.\n\
     \nDes suikerwerkers vremd fatsoen\n \nSchiet ver te kort, pistaacigroen,\n \nEn mandelwit\
    \ tot toert bereidt,\n280\nOntbreeken aan de dartelheit.\t\n[p. 134]\t\n \nDan leeft de\
    \ speen'ge Kartusiaan\n \nAlleenich, sonder vleisch te slaan,\n \nBehalven 't leste van\
    \ de week,\n \nAls niemand fris naa vleisch om keek.\n285\nTen waar noch imand deegliks\
    \ meer,\n \nDie Karmels lieve vrouw ter eer,\n \nDen woensdagh vierde, met de vis,\n \n\
    Die sout, of soet ontvangen is.\n \n't Geschubde, onschubde, en wat een huid,\n290\nVan\
    \ dikke, of dunne schelpen sluit,\n \nVermeerdert maandlik 't heele jaar,\n \nOntellik,\
    \ puik, van 't net, in 't kaar.\n \nDe keel is vol van spit, en glas,\n \nIn vastelavends\
    \ langh gebras.\n295\nIk wil ook vasten van dien ink,\n \nOp dat se niet te walglik stink.\n\
     \nNu slaa ik licht de klooster geest,\n \nAls Kloosters, met syn looverfeest,\n \nVoor\
    \ by, die heilge daagen viert,\n300\nMeerwerf dan sich de maan quartiert.\n \nEn waarom\
    \ zou my leurery\n \nVerletten, nutter aan een sy?\n \nIk vul, o braave handelstad,\n \n\
    Van handelingh het oovrigh blad.\n305\nGhy handelt op het ryk Levant,\n \nHet kostlik oost,\
    \ aan alle kant,\n \nEn sendt die waaren oover zee,\n \nOf landwaarts, naa een ander stee.\n\
     \nDe droogery, waar op ik leef,\n310\nEn welkers inkoop my meest dreef,\n \nWierd van dien\
    \ vruchthoorn, in uw schoot,\n \nGestort, met ryke vloot, op vloot.\n \nWaar 't Y niet dat\
    \ Oranjes vlag,\n \nOm d'op en neergangh van den dagh,\n315\nEn Suid, en Noordwaarts waaijen\
    \ laat,\t\n[p. 135]\t\n \nGhy waart des werldkloots ringhgranaat.\n \nAi belgh u niet dat\
    \ ik dat sap\n \nVerheffe, als stoffe van myn pap.\n \nWanneer de tongh de waarheit seit,\n\
    320\nSoo blykt dat zy niet geerne vleit.\n \nMaar seedert dat de maatschappy,\n \nMet oost,\
    \ en westens kruidery,\n \nIn Holland quam, zoo wierd men daar,\n \nMeer handels, en hier\
    \ min gewaar.\n325\nDen handel is als ebbe, en vloed.\n \nDit is 't dat my ook keeren doet,\n\
     \nMet minder voordeel, nooit van sins,\n \nOm meer te sien uw klaarsten Prins.\n \nIndien\
    \ uw gunst my gaf verlof,\n330\nIk ondersocht, met waare stof,\n \nWat vrucht dat Holland\
    \ self geniet,\n \nUit handel, die van u geschiedt.\n \nWat scheepsschapraa spyst Asia?\n\
     \nWat schip stuurt ghy naa Afrika,\n335\nEn langs de zeesteen van Euroop,\n \nDat uwe waaren\
    \ voert te koop?\n \nOf dat op andere oevers laadt,\n \nEn weer u graagen buik versaadt?\n\
     \nOf dat den wreeden Turk vernielt,\n340\nDat waaterland niet heeft gekielt?\n \nDit bleek\
    \ in 's Aartszees lesten slagh,\n \nWaar Amstel, u ten dienst, de vlag,\n \nFors van de\
    \ grootste Turks hulk nam,\n \nEn zoo geseegent herwaart quam.\n345\nHier sleept Konstantinopels\
    \ vaan,\n \nVan achter, met een halve maan,\n \nTot schande van gansch Asia,\n \nGestuit\
    \ van 't kleine Kandia.\n \nDit bleek aan andre scheepen meer,\n350\nDeelachtich braaf aan\
    \ heldeneer,\t\n[p. 136]\t\n \nBeneffens Iupiter, de saal\n \nVan hout der dappre Rosendaal.\n\
     \nToen hy by Fooitjes voor u sloegh,\n \nEn heevigh 's Kristverloochners boegh\n355\nWeghnam,\
    \ met entren, swaard, en vuur,\n \nIn min, dan, doch, een bloedige uur.\n \nSyn duure prysvlagh,\
    \ dien ik sach,\n \nDroegh bloed van eenen saabelslagh,\n \nDoor houwer, en het hersendak,\n\
    360\nNaa 's Renegaats pistool ontbrak.\n \nMaar Rosendaal, toen meer verhit,\n \nGelyk een\
    \ Leeuw gequetst van 't spit,\n \nKloof met het stomp het strootich vel,\n \nEn sondt den\
    \ Renegaat ter hel.\n365\nDit tuigde een iegliks luide mond,\n \nWanneer sint Mark in vlammen\
    \ stond,\n \nMet juichen, om dees seegepraal,\n \nLeef Iupiter, leef Rosendaal.\n \nLangh\
    \ leeve Hollands heldensaad,\n370\nDe schild en scherm van onsen staat.\n \nDit tuigde ook\
    \ uw gekroonde Vorst\n \nMet twaalf gou keetnen om hun borst.\n \nBatavia is voortgevoedt,\n\
     \nVan oud, en eedel heldenbloed,\n375\nDat nooit van Rome wierd verheert,\n \nMaar sich\
    \ te hulp heeft vroom geweert.\n \nEn eeven Hadriatisch meeir,\n \nAls Holland wint aan\
    \ vracht, en eer,\n \nZoo trekt haar aaventuur ook baat,\n380\nVan handel, die of komt of\
    \ gaat.\n \nDoch wie bekent, of weet het niet,\n \nDewyl men, in u ryk gebied,\n \nHaar\
    \ kinderen, in groot getal,\n \nSiet woonen, niet om niemendal?\n385\nDit volk soekt allerhande\
    \ lucht,\t\n[p. 137]\t\n \nOm nut, welleeven, en genught.\n \nWaar 't dat wit kan beschieten,\
    \ is\n \nHen aarde, als waater, voor de visch.\n \nMaar, och, haar welvaard, oorsaak ook\n\
    390\nVan uwe welvaart, haal, en stook\n \nGeen hout tot vuur van nydgen haat,\n \nDie bondgenootschap\
    \ schensiek schaadt.\n \nZoo bloeije uw oud gemeene best,\n \nMet Hollands vriendschap,\
    \ tot op 't lest\n395\nDes werlds: zoo knoope diamant,\n \nMet seegen, d'eene en d'andre\
    \ hand."
- titel: 'Op de reise door Tirool, met Michiel Soetens schilder: aan den selven'
  dichter: Joannes Six van Chandelier
  datum: '1651'
  locatie: Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "In het voorjaar van 1651 was Six van zijn reis door Frankrijk, Spanje en Italië\
    \ teruggekeerd, maar in de herfst van dat jaar reisde hij opnieuw naar Italië, nu door Duitsland\
    \ en over de Alpen. Hij werd bij die reis vergezeld door de schilder Michiel Soetens. Over\
    \ deze Soetens zijn mij niet veel bijzonderheden bekend. Hoogewerff noemt hem een schilder\
    \ uit Den Haag. Hij zou in 1626 zijn geboren en in de leer zijn geweest bij Alexander Petit.\
    \ Van 1650 tot 1656 zou hij in Rome zijn geweest, waar hij in de schildersbent zou zijn\
    \ opgenomen met het alias ‘Spreeuwbek’, al voorziet Hoogewerff deze laatste bewering van\
    \ een vraagteken (Hoogewerff, 1950, p. 92-94; Hoogewerff, 1952, p. 143). Kennelijk heeft\
    \ hij zich, niet zeer precies, op Six' gedichten gebaseerd. De gelijkstelling Soetens-‘Spreeuwbek’\
    \ zal zijn ingegeven door gedicht no. [468], r. 51, maar daar behoeft Soetens in het geheel\
    \ niet bedoeld te zijn. Het genoemde jaar van Soetens' afscheid uit Rome zal teruggaan op\
    \ deze gelijkstelling. Soetens' geboorteplaats en zijn leermeester Petit worden genoemd\
    \ in het hier behandelde gedicht (r. 5 en r. 205). Hoe Hoogewerff aan Soetens geboortejaar\
    \ is gekomen kan ik niet zeggen. In datzelfde jaar 1626 zou een ‘Michgyel Soetens’ een bedrag\
    \ van twintig stuivers hebben betaald aan het Sint Lucasgilde in Den Haag (Obreen iv, 1881-1882,\
    \ p. 319). Deze ‘Michgyel’ zal een familielid (de vader?) van Six' reisge-\t\n[p. 500]\t\
    \n\n noot zijn geweest. Het door Bredius bij de veiling Van Pappelendam (1889) bestudeerde\
    \ kinderportret met de signering ‘M. Soetens (?) 1634’ kan van diens hand zijn (Bredius,\
    \ 1889, 604-606). Six' reisgenoot zal het niet geschilderd hebben, anders had Six hem in\
    \ dit gedicht van 1651 geen jonge schildergeest (r. i) meer kunnen noemen. Voorzover ik\
    \ weet is er verder geen werk van een Michiel Soetens bekend. Uit Worps aantekeningen bij\
    \ zijn uitgave van Huygens' gedichten is mij een Cornelis Michielsz. Soetens bekend geworden,\
    \ die penningmeester van Delfland was en in Scheveningen ‘eene kleine villa’ bouwde. Hij\
    \ heeft in 1662 een rol gespeeld bij de voorbereidingen voor de aanleg van de ‘Zeestraat’\
    \ van Den Haag naar Scheveningen. Worp noemt hem ‘een zoon van den schilder’ (Huygens viii,\
    \ p. 44, noot). Dit gedicht staat op p. 353-359 van Six' Poësy. In een later geschreven\
    \ sonnet (no. [86]) neemt Six veel terug van de waarderende woorden die hij hier wijdt aan\
    \ Tirool."
  tekst: "O Soetens, jonge schildergeest,\n \nIn beeld, maar landwerk allermeest\n \nGeoeffent,\
    \ en dies landery\n \nGeleegen verre, van het Y,\n5\nEn van uw wiegh, den hoofschen Haagh,\n\
     \nBesoekende, belust, en graagh,\n \nOm zoo van 't een, en ander dingh,\n \nTe sien des\
    \ aards veranderingh,\n \nEn al dat leeven, soet en eel,\n10\nTe bootsen, met een braaf\
    \ penceel.\n \nWy naadren op Duitsch viergevoet,\n \nItalien waar 't oovervloedt,\n \nVan\
    \ aardsche lust, en dartelheit:\n \nWaar Rome, eer heerschster, binnen leit,\n15\nNoch heerschster,\
    \ maar meest van het hart,\n \nWaardeerster van het schilderbard,\n \nAanhoudster van die\
    \ konstge bend,\n \nDe seilsteen die u derwaarts ment.\n \nMaar waarom loopt ghe deur Tirool,\n\
    20\nEn keurt dat mee niet voor uw school,\n \nOm hier, met ink, of loot, of kryt,\n \nTe\
    \ leesen in den herrefst tyd?\n \nWat sachmen langs dees langen wegh,\n \nNu bar, dan groen,\
    \ weersyds een heg,\n25\nVan bergen, meenigh schoon gesicht,\n \nDat wis veel schilders\
    \ heeft verplicht?\n \nIs 't om dat daar d'aaloudheit praalt,\n \nEn grootsche nieuwheit\
    \ op gehaalt\n \nTen Heemel, met zoo meenigh hof,\n30\nEn swaar gebouw van konstge stof?\n\
     \nOf zyn d'uitsichten, op dien boôm,\n \nDoorslingert van den Tyberstroom,\n \nMet dal,\
    \ geberghte, gaarde, en veld,\n \nAlleen weergaaloos daar gestelt.\n35\nVermaakelyk Florence,\
    \ hoe!\tOver dit hoofdstuk/artikel\nLANDEN\nDuitsland\nOostenrijk\n\n[p. 475]\t\n \nStaat\
    \ uw wellustigh land dit toe?\n \nLydt dat des Hertoghs gaalery,\n \nEn prachtige kapel,\
    \ die vry\n \nTrotseeren aller vorsten pracht,\n40\nMet landschappen, van steen, gewracht,\n\
     \nAlverwigh, uit der zee, en aard,\n \nGelyk met een penceel vergaart?\n \nDaar hof, en\
    \ stad van Medicis,\n \nVol Bonarottes handen is,\n45\nEn zoo veel geesten heeft gevoedt?\n\
     \nAls gansch Italien heeft gebroedt?\n \nOud Napels, eedle, onlykbre kroon,\n \nOm uw Kampaanschen\
    \ vruchtbren throon,\n \nGhy, die met voeten, op het hoofd\n50\nVan 't helbeest syne kaaken\
    \ klooft:\n \nGhy, die kasteelen, in de locht,\n \nGeberght hebt, en het soute vocht,\n\
     \nMet soet ontsprongen nat vermeert,\n \nOp uwen muur en oever keert:\n55\nGhy, die in\
    \ staage lenten bloeit,\n \nEn Kristus lekkre traanen snoeit,\n \nVan Bacchus stok: ghy\
    \ die citroen,\n \nLimoen, oranje, vygh, meloen,\n \nAmandel, graan, olyf, granaat,\n60\n\
    En duure wormen queekt van saad:\n \nO Ghy gemarmert paradys,\n \nLaat ghy aan Innocent\
    \ den prys?\n \nDaar kerk, en kloosters van Titiaan,\n \nEn Cimabu, zoo gaaloos staan?\n\
    65\nWat seit de goude en syde Stad,\n \nIn rysbre landen vlak, en plat,\n \nMet haar zoo\
    \ sorgloos sterk gevaart,\n \nNochtans van duisenden bewaart,\n \nDie Spaans beminnen, voor\
    \ het Frans,\n70\nBraggeerende, op een hoogen trans,\t\n[p. 476]\t\n \nDie met het oogh,\
    \ naa stad, gewendt,\n \nHet volk met koopre toomen ment\n \nDie met den rugh naa d'Alpen\
    \ kykt,\n \nWaar langs het swerk der wolken strykt,\n75\nWerd dat bekent, o Milanees,\n\
     \nVan Karavatsjo, en Korreets\n \nVerrykt, met barden, en papier?\n \nOok loochent dat\
    \ de Ligurier.\n \nHoovaardigh hof van Genua,\n80\nToen ik, uit Spanje, quam zoo naa,\n\
     \nDat ik uw knie, of halven ringh,\n \nVan wit arduin, in 't oogh, ontfingh,\n \nBegolft\
    \ van 't Middellandsche sout,\n \nRechts vlakker, schuiner slinks gebouwt,\n85\nLanghs 't\
    \ omgemuurt geberghte, schoon\n \nOpgaande, en vlechtende, als een kroon,\n \nVeel hooven\
    \ van verscheiden vrucht,\n \nOns schip begeurend met een lucht,\n \nGelyk de lieve soomer,\
    \ dat\n90\nMild offert, uit het aardevat\n \nOntsteeken, als de sonne gluurt,\n \nOp groen,\
    \ met bloemen, geborduurt:\n \nZoo sprongh myn hart, en seide bly,\n \nNooit sach ik mooijer\
    \ schildery.\n95\nWanneer ik op u straaten trad,\n \nBevond ik Kooninglyk de stad\n \nAls\
    \ een beknopt palleis van veel:\n \nDe geevels, als een fyn panneel,\n \nZoo net bemaalt,\
    \ dat self Urbyn,\n100\nOf Bekkafurn verbaast zou zyn.\n \nO! wat voor kerken siet men daar\n\
     \nVan goud, en marmer wonderbaar?\n \nMen looft de moeder van geluk\n \nSchonk seevenmaal\
    \ een wonderstuk.\n105\nAl praalt Romein, zoo fraai, zoo hoogh,\t\n[p. 477]\t\n \nHoe meenigh\
    \ plaats, zoo meenigh oogh.\n \nDe teelsteres van alle dingh,\n \nEn konst, geeft elk iets\
    \ sonderlingh.\n \nDes Heemels wyse Majesteit\n110\nHeeft al het schoonst niet aangeleit,\n\
     \nNoch engh beslooten, aan het land\n \nVan eenen hoek, noch een verstand.\n \nWy zullen\
    \ in een dagh, of vyf,\n \nDen grysen Leeuw verswakt van lyf,\n115\nBekryght van Turken\
    \ ongenaa,\n \nOm 't hondertsteedigh Kandia,\n \nIn zee sien, als een Halcioon,\n \nNiet\
    \ op een nest, maar veele, schoon\n \nEn vreemd, als van geen menschen hand,\n120\nIn 't\
    \ midden van de zee, geplant.\n \nStaat daar verwondert, als sint Mark\n \nUw oopnen zal\
    \ syn trotse kerk,\n \nBeschildert fyn, maar sonder quast,\n \nVan kleurge glaasjes saamgelascht:\n\
    125\nEn als ghy 't oogh, aan Tintoret\n \nEn Palmaas schilderkonst, verlet.\n \nHet teiknen\
    \ werd, te Room, geleert,\n \nMaar hier 't volleert penceel geeert.\n \nDaar naa als ghy\
    \ het vorder pad\n130\nZult vordren naa de heilge stad,\n \nEn koomen aan den Apennyn,\n\
     \nUitbronnende den kleinen Rhyn,\n \nDie door de hende muuren spoelt,\n \nWaar in de Bolonjeser\
    \ woelt,\n135\nDaar zal 't vet landtapyt, om hoogh,\n \nEn laagh, en binnen boogh, aan boogh,\n\
     \nVan roo gebakken steen, waar op\n \nDe geevels klimmen, in het top,\n \nWaar onder ieglyk\
    \ drooger gaat,\n140\nVoor paarden laatende oopen straat,\t\n[p. 478]\t\n \nNiet min behaagen,\
    \ met het koor\n \nVan sint Dominikus, dat door\n \nEen gaauwen Paap, rondom zoo eel\n \n\
    Vertoont een houten tafereel,\n145\nUit Kristus boek, dat seeker vorst\n \nHet hiel voor\
    \ verwe, en schrabben dorst.\n \nVraagh daar na Primatitsjoos hand,\n \nEn Franciaas, soonen\
    \ van dat land.\n \nO wat verswygh ik van dees bei\n150\nGodinnen, in den seevenrei,\n \n\
    Van veele Nimfen opgewacht,\n \nNiet min bekleedt, van konst, en pracht?\n \nDees belgen\
    \ 't sich, met recht, indien\n \nGhy haar kleinachtende aan zult sien,\n155\nAls iets, dat\
    \ minder waardigh scheen,\n \nOf als een schaaduw, die haast dween.\n \nOf zoo ghy, in het\
    \ herssenvat,\n \nDie weesens afgeteikent had,\n \nEn op papier, noch doek geverft,\n160\n\
    Dat eeuwen duurt, 't geheugh versterft.\n \n't Berouw zal knaagen, in 't gemoed,\n \nGelyk\
    \ het nu verdrietsaam doet,\n \nOm 't ooverloopen van den Rhyn,\n \nVan Keulen lustigh tot\
    \ den Mein.\n165\nGelyk het morgen byten zal,\n \nTen einde van 't Tiroolsche dal.\n \n\
    Ai siet, hoe soet werd ons Bolsaan,\n \nAls weer wat nieuws, laagh opgedaan,\n \nIn 't rype\
    \ wynveld, tuschen bei\n170\n't Geberght, dat weinigh leedigh lei,\n \nSints dat den Brander\
    \ booven bleek,\n \nMet sneeuwge kruinen, achterweek.\n \nHoe klautert 't bonte geitjen\
    \ op,\n \nOm kruidjes, langs 't bedende top!\n175\nWat runderkleuren cieren 't dal,\t\n\
    [p. 479]\t\n \nVol echoos, van een waaterval!\n \nHoe spiegelt sich de son daar in!\n \n\
    Hoe glinstert dat veelverwigh tin\n \nDer glaase pannen rood, en blaauw,\n180\nEn wit, en\
    \ groen, en geel, en graauw!\n \nHoe weerschynt, van zoo meenigh bult\n \nDes stads, de\
    \ weerhaan fyn verguldt!\n \nAi sie, terwyl men naadergaat,\n \nHoe doolhooft sich de witte\
    \ straat!\n185\nHier is het kunstigh een vertoogh\n \nTe bootsen, louter diep, en hoogh.\n\
     \nReis naa den Arn, den Eridaan,\n \nDen Sein, den Rhoon, na 't goud getraan\n \nDes Taags,\
    \ en Betis boorden heen,\n190\nKomt dan weer oover Rhyn gereên,\n \nEn Donauw, naa den brugh\
    \ der In,\n \nGhy zult verandert zyn van sin:\n \nGetuigende, met mynen mond,\n \nDat ghy\
    \ wel fraaijer landschap vondt,\n195\nMaar slechter ook dan dit gebied.\n \nBegreep dit\
    \ Soetens lust, hy liet\n \nDen tyd, van achter, sonder haair,\n \nNiet gaan, maar nam het\
    \ voorhoofd waar.\n \nDoch wyl hy niet te suimen hoopt,\n200\nMaar waar men alle schilders\
    \ doopt,\n \nEen braaven bynaam, sonder gunst\n \nTe winnen, door geleerde kunst:\n \nAls\
    \ Uitrechts Bot, als Haarlems Laar,\n \nAls Krabbetje den Yenaar,\n205\nEn als Petit, mee\
    \ van den Haagh,\n \nSyn Meester, tot het schildren traagh,\n \nZoo seegen hem een goede\
    \ geest,\n \nOp heen, en weerreis onbevreest.\n \nHy oovertref de beste hand,\n210\nTot\
    \ ryker roem van 't vaaderland."
- titel: t'Huisblyvens beede, aan Jan Druivestein, te Venecie
  dichter: Joannes Six van Chandelier
  aan: Jan Druivestein
  datum: winter 1651-1652
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht is geschreven in de winter van 1651-1652. Six was voor de tweede
    maal naar Italië gereisd, nu om met name zijn belangen in Venetië te behartigen. Bij zijn
    afscheid van de stad was hij er zeker van dat hij niet meer zou terugkeren (vgl. gedicht
    no. [97], r. 326-328). Jan Druivestein was een van de Hollandse kooplieden in Venetië aan
    wie Six zijn schetse van Venecie heeft opgedragen (vgl. de Toelichting bij het opdrachtgedicht
    no. [289]). Dit gedicht staat op p. 359-360 van Six' bundel.
  tekst: "Vriend Druivestein, de speelens reis beslooten\n \nTer jacht, langs uw gehuurden hof,\n\
     \nTe Dole, geeft my smeekens stof,\n \nOp rym, om die waar 't mooglik om te stooten.\n\
    5\nZoo reeden, op geseggelyke sinnen,\n \nMach hebben plaatse, om wat gehoor,\n \nIk twyffel\
    \ niet, ghy zult het oor\n \nVerleenen, en u laaten ooverwinnen.\n \nWat wellust kan dit\
    \ weer, zoo ongestaadigh,\n10\nU geeven, in de voogeljacht?\n \n't Is wintertyd, de sonne\
    \ lacht\n \nPas eens, het stormt, en reegent ooverdaadigh.\n \nWaar treedt men nu een tree,\
    \ met drooge voeten,\n \nIn kleijigh land? zal om een snip,\n15\nEen musch te krygen, in\
    \ de knip,\n \nUw goede schoe, uw welvaart dat licht boeten?\n \nZal u het vuur der warme\
    \ haard versellen,\n \nWyl ghy, in asch sit, en vermuft,\n \nAls niemand u onleegh vernuft\n\
    20\nDen tyd kort, met genoeghliker vertellen?\n \nGhy hebt de reis acht daagen laaten vaaren,\n\
     \nEn of het noch acht daagen viel?\n \nOch! of het viel, zoo loove ik, hiel\n \nHet onweer\
    \ op, en zou de locht bedaaren.\n25\nDan zouden wy uw lief geselschap morgen\n \nGenieten,\
    \ waar wy zyn genoodt:\n \nMaar anders hoeft de vriend, om brood\n \nEn wyn, voor ons niet\
    \ komstigh, niet te sorgen.\n \nHet lekkerste zou onse tongh niet smaaken:\n30\nUw soete\
    \ praatjes zyn de saus.\n \nAi maak, in 't voorneem, noch een paus:\n \nWy kunnen ons niet,\
    \ sonder u, vermaaken.\n \nWy zullen dit vermaak voor 't leste tellen,\n \nBy zoo veel vriendschaps,\
    \ my gedaan:\n35\nWant myn besluit leit wegh te gaan:\t\n[p. 481]\t\n \nWy zullen nooit\
    \ malkander meer versellen.\n \nIndien ghy ons die beede zult vergunnen,\n \nZoo blyven\
    \ wy aan u verplicht,\n \nAls hem, die 't maal heeft toegericht.\n40\nWy dienen u weer,\
    \ waar wy zullen kunnen.\n \nIk kon myn rym, en schryven selden achten,\n \nAls dikwils\
    \ flaauw, en sonder kracht:\n \nWat of het nu hebbe uitgewracht,\n \nZal ik van uw verbeeden\
    \ gunst verwachten."
- titel: Op geschildert marmer, door Michiel Soetens
  dichter: Joannes Six van Chandelier
  datum: najaar 1651
  locatie: Venetië?, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Over Six' reisgenoot Michiel Soetens zijn enkele gegevens opgenomen in de Toelichting
    bij gedicht no. [286]. Hij was kennelijk ook bedreven in het nabootsen van marmer met verf.
    Ook dit gedicht zal dateren uit de tijd van Six' tweede reis naar Italië, in het najaar
    en de winter van 1651. Het gedicht staat op p. 360-361 van zijn bundel.
  tekst: 'Indien dat marmer is geschildert, met een veer,

     

    Op doek, papier, of hout, zoo segh ik, dat ik sweer

     

    By, holla, want men mach niet sweeren, maar geen braaver

     

    Sach iemand, wed ik, van den Genueeschen graaver.

    5

    Nu loove ik, dat Parrhaas getrotst, met een vertoogh,

     

    Van een gemaalt gardyn, den schilder self bedroogh.

     

    Nu loove ik dat die baas, in syde kamelotten,

     

    Op schryfdoek gebootseert, het gastmaal dorst bespotten:

     

    Meest self bespot, vermids een splinterige hoek

    10

    Des banks hem pronken dee, met billen, deur de broek.

     

    O veenigh vaaderland, roem nu, dat ghy niet armer

     

    Zyt, dan geberghte, dat de moeder draaght vol marmer.

     

    Veel duisend zielen gaan daar swoegen, onder aard,

     

    Als in een helle, om slechts te bouwen een gevaart:

    15

    Maar Soetens die stoffeert alleen uw grootste steeden,

     

    Uit mynen van syn geest, met steen, van lyne kleeden.

     

    Nu slapt het Turksch tapyt, en Sollemans goud leer

     

    Lydt minder neeringh, om dees nieuwe kaamereer.

     

    Had wenschen zoo veel krachts, als ''t slanghoofd van Meduse,

    20

    Sy maakten marmersteen, van hem, en myne Muse.'
- titel: Schetse van Venecie, opgedraagen aan Jan van Aalst, Jan Druivestein, Pieter Sluijer,
    Jan van Uffele, en Abraham Heirmans, kooplieden aldaar
  dichter: Joannes Six van Chandelier
  aan: Jan van Aalst, Jan Druivestein, Pieter Sluijer, Jan van Uffele, Abraham Heirmans
  datum: najaar 1651
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Met dit gedicht draagt Six zijn schetse van Venecie (no. [97]) op aan een vijftal
    Hollandse kooplieden in Venetië. Het is in het najaar van 1651 geschreven. Over Six' vrienden
    heb ik weinig nadere bijzonderheden kunnen vinden. Een Van Aelst was in 1668 koopman in
    Smyrna, de Druivesteins waren een invloedrijke Haarlemse familie. Vele leden van de familie
    Van Uffelen hadden belangen in de Levanthandel en ook Abraham Heirmans' naam komt voor in
    de uitgave van de Bronnen tot de geschiedenis van den Levantschen handel (Elias, Vroedschap
    ii, p. 763, Heeringa, i, i, 1910, p. 84, noot 3; i, ii, 1910, p. 1167; ii, 1917, p. 143,
    noot i). Dit opdrachtgedicht staat op p. 361-363 van Six' bundel.
  tekst: "Van Aalst, doorkneede koopmans geest,\n \nMyn huiswaard, als noch eens geweest,\n\
     \nOnthaalende, op beleefde wys,\n \nEn sonder dat ik wist den prys:\n5\nJan Druivestein,\
    \ niet min doortrapt,\n \nBy wien de schaamte ook my beklapt,\n \nMet roode kaaken, wan\
    \ 't gemoed\n \nGedenkt, aan al 't genooten goed:\n \nO Sluijer, en van Uffle saam,\n10\n\
    In wooningh, taafel, handel, naam,\n \nIn alls, wat een van bei verricht,\n \nAan wien ik\
    \ meede blyf verplicht:\n \nGelyk ik ook de deuchd erken,\n \nDie ik den vyfden schuldigh\
    \ ben,\n15\nKorts schaffer aan Milaan van sout,\n \nNu, aan den Genuees, vertrouwt:\n \n\
    O vrienden, wyl ik reisree staa,\n \nNa huis, om u, langs Hadria,\n \nDat my zoo veel plaisiers\
    \ aandeed,\n20\nTe laaten, met groot hartenleed:\n \nZoo laat ik die een rymer ben,\n \n\
    En groot vermaak schep, met die pen,\n \nEen rympjen, tot een krummel dank,\n \nOp Neederlandsche\
    \ maat, en klank.\n25\nVergeeft het my, soo ik wat swets,\n \nHet is Veneci, maar in schets,\n\
     \nMet kryt beworpen, op 't panneel,\n \nBest waardigh Sannasaars penceel.\n \nIn Holland\
    \ seit men: gaa te mart,\n30\nMet danken. Maar hoe kan het hart\tOver dit hoofdstuk/artikel\n\
    LANDEN\nItalië\n\n[p. 484]\t\n \nDoen blyken, wat de mond verstaat:\n \nAl eer het aankomt\
    \ op de daad?\n \nDan zal geen slechte rymery,\n \nDat anders, was het poësy,\n35\nGeacht\
    \ mocht werden, u weer goed\n \nBetoonen, dan met hartebloed.\n \nVaar wel, vyf vrienden,\
    \ o! vaar wel.\n \nDes Heeren heilige aadem hel,\n \nMet saalge vreede, en seegenryk,\n\
    40\nOp zielen, van u al gelyk.\n \nVaar wel, wy zullen ons nooit sien:\n \nOf 't moest,\
    \ in 't Vaaderland, geschien.\n \nWie weet wat, tusschen ons, geschiet?\n \nGeberghte ontmoet\
    \ geberghte niet."
- titel: Geluk op reis, aan Antoni Duivelaar
  dichter: Joannes Six van Chandelier
  aan: Antoni Jansen, Duyvelaer
  datum: '1652'
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Antoni Jansen Duyvelaer was vice-consul van de Republiek op Cyprus. Six had
    hem in de laatste maanden van 1650 in Rome ontmoet en hij was daar een maand lang Six' taafelbroeder
    geweest. Dit in 1652 geschreven gedicht wenst hem voorspoed op zijn reis van Amsterdam naar
    Venetië, met als eindbestemming Alexandretta, een handelsstad in Syrië. Kennelijk behartigde
    Duyvelaer de belangen van de Republiek (of zijn eigen handelsbelangen) ook buiten Cyprus
    (Heeringa i, i, 1910, p. 569, noot i; i, ii, 1910, p. 1061-1062, noot 3 en p. 1099). Six
    kende ook een Zeeuwse familie Duivelaer (vgl. gedicht no. [172]), maar deze Antoni Jansen
    lijkt geen telg van die familie te zijn geweest. Dit gedicht staat op p. 370-371 van Six'
    Poësy.
  tekst: "O Duivelaar, myn taafelbroeder,\n \nEen maand langh, in de heilge stad,\n \nDoorstroomt,\
    \ van 't geele Tybernat,\n \nDe throon van 's werrelds zielbehoeder:\n5\nWat quelt ghe my,\
    \ om rymgesangen,\n \nGelyk Fokquier verleeden week,\n \nTot Spiegels, my te wyten leek?\n\
     \nDies zal ik hem dat morgen langen.\n \nIk hebbe gister uitgesongen.\n10\nDe druppels\
    \ van myn herssenschaal\n \nVerdrooghde Apolloos sonnestraal.\n \nMyn cytersnaartjes zyn\
    \ gesprongen.\n \nIk was nu, om een teugh, verleegen,\n \nUit Kastals geestigen fontein,\n\
    15\nZoo ik bevruchten zou het brein:\n \nGelyk 't drooge aardryk, om den reegen.\n \nMaar\
    \ ghy, op 't punt, om voort te sette\n \nDe reis, van my ook eens gedaan,\n \nWeer naa den\
    \ eedlen Veneciaan,\n20\nGemunt voorts op Alexandrette:\n \nGhy liet my geene rymens uuren,\n\
     \nIk songh noch anders braaf uw lof,\n \nHoe naarstigh ghy, om 't heiligh hof,\n \nOns\
    \ toonde d'oude, en nieuwe muuren.\n25\nWat grootsheit bleef er onbekeeken,\n \nVan prachtigh\
    \ oud Romeinen werk?\n \nWaar by het nieuw, laat Peters kerk,\n \nZyn duinen, by geberght,\
    \ geleeken.\n \nHet strydperk, tempels, boogen, wanden,\n30\nKolommen, meenigh graf, en\
    \ beeld\n \nTe sien, heeft nimmermeer verveelt,\n \nGeleidt van boeken, in uw handen.\n\
     \nElx heugnis kan ik niet ophaalen:\n \nBy Elsevier, de grootste van\n35\nUitheemsche boekekraamers\
    \ kan\t\n[p. 501]\t\n \nIk die onkryghlik niet betaalen.\n \nGhy hebt se, woud ghe my die\
    \ laaten,\n \nGelyk een goeden fooi te leen,\n \nZoo leidde ik u, met seegen, heen,\n40\n\
    En zou ik altyd met u praaten.\n \nMaar schoon ghe kond se niet ontbeeren,\n \nNoch dankt\
    \ u al myn ingewand,\n \nVoor goed geselschap, buitens land:\n \nDat strekke u weer den\
    \ Heer der Heeren.\n45\nDie geef te land, en onder 't vaaren,\n \nVoor moordery, en roovery,\n\
     \nDen Engel Rafel, aan uw sy,\n \nEn seegne uw goede handgebaaren."
literatuur:
- BWN, XVII, 705-706; NNBW, X, 924-925; Verkuyl 1974, 47-49; Van Caspel 1978, 119-121; Van Bork
  en Verkruijsse 1985, 527; Six van Chandelier 1991, xxxv-xlv; Dijstelberge 1993, 331-336; Schenkeveld-van
  der Dussen 1993, 255-260; Porteman 1997, 123-134.
