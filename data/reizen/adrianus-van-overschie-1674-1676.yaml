beschrijving: 'Onvolledig verslag van een educatiereis van Adrianus van Overschie (ca. 1650-1724)
  naar Italië, Spanje en Portugal in 1674-1676. Van Overschie reisde van Antwerpen naar Duitsland
  en stak over naar Italië. Het verslag eindigt in Rome.


  Meertalig (Frans (1-38; 186-230; 254-358; 484-494), Italiaans (38-186; 230-252), Spaans (359-444)
  en Nederlands (445-483), pp. 494.'
