  opmerking: He entreats G. to send him a resumÉ of everything to remind him and as a refreshing
    heartwarming utterance of a voice on which he hangs. He notifies G. of two codices which
    a Greek, Paissius Ligarides metropolitan of Gaza, who has spent years of study in Rome has
    sent him, one of them consisting of some things of Chrysostom, the other of speeches and
    letters of the patriarch Photius; and suggests that if any one is interested in editing
    his letters this Greek would perhaps supply further material; but many known volumes of
    the letters are in monasteries where they are difficult to come by unless Jurio Moretus
    help is enlisted. The necessary inspection of codices is difficult here where the Keepers
    are harsh and illiterate; and Latin is almost and Greek entirely unknown. But even in this
    dungpit there are hidden jewels. He begs him to repeat with additions everything he had
    said about the old Bratislava, codex of Prudentius. He has received Salmasius' preface from
    Bigotius about whose health he is very anxious. Among further items he mentions that Vossius
    had told him that Blavius had in his keeping the volumes of Meursius which he commenced
    to put to press before M's. death.
