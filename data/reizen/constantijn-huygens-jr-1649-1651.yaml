  tekst: "Mon Frere.\nJe viens de faire le chemin de Voorburgh avecq Mon Pere moitié à pied\
    \ moitié par bateau a cause que l'un de nos chevaux de carosse, estant devenu maladif, est\
    \ envoijé a la foire d'Vtrecht pour ij estre vendu. Vostre hacquenée a ce que nous avons\
    \ appris par les dernieres lettres de Toot court grand risque d'en estre faite autant, car\
    \ apparemment Milord Cravain en revenant de Heidelbergh prendra son chemin par eau, mais\
    \ il n'est pas encore bien certain s'il ira jusques l. Maintenant ils sont à Cassel, et\
    \ c'est aujourdhuij que Mr. l'Electeur se marie. Mr. Crommon a eu sa premiere annonce la\
    \ dimanche passée; je ne vous escriraij pas d'autres particularitez touchant le nom et les\
    \ qualitez de son espouse car je ne doute pas que vous n'en soyez pleinement informé par\
    \ Mr. Kinschot. Il ij a encore un autre mariage à Amsterdam, ou je suis prié aux nopces,\
    \ c'est de la fille du feu drossart Hooft et du Sr Coenraed Burgh, Eschevin de la ville,\
    \ et avecq cela homme fort riche: je ne manqueraij pas de m'ij trouver. Mon Pere a aujourdhuij\
    \ receu lettres d'Amsterdam par les quelles il est prié à l'enterrement du Cousin Visscher,\
    \ qui mourut hier au matin fort subitement d'une apoplexie; il ne s'ij trouvera pas. Voyla\
    \ toutes les nouvelles que j'avois à vous mander, et voicij pourtant encore une nouvelle\
    \ Epigramme d'un nouveau poete qui sera tousjours\nMon Frere \nVostre tresaffectioné frere\
    \ et serviteur Chr. Huijgens.\nVous avez veu les epitaphes de mon Pere, et verrez aijsement\
    \ que ce sont ceux la qui m'ont donné occasion a faire cettuij cij, qu'on n'a pas trouvé\
    \ mauvais."
- verzender: Christiaan Huygens (1628-1695)
