  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "Geneve, 8 Dec. 1649.\nMon frere,\nJe viens de receuoir vostre derniere du 15. qui\
    \ me confirme la mort de la pauvre Madlle van Vlaerdinghen; que j'ay sçeue par une lettre\
    \ de Crommon. Cette perte m'afflige beaucoup, car c'estoit une fille que j'ay fort conneue\
    \ et ay esté dans ces bonnes graces sans me venter autant que personne un peu devant mon\
    \ depart. Maer daer ghaen sulcke schoone blommen op alster onder ghaen. Et cette race la\
    \ ne defaillira pas. Voila Becker qui se marie encore de peur que la race des comardes ne\
    \ defaille. Mais je suis fasché de ce que vous ne me dites pas lequel des Beckers c'est,\
    \ ny qui est la dame que vous designez par le nom d'Indienne par ma foy fort problematiquement\
    \ comme dit Tassin. Ces nopces resjouiront bien la Cousine Dorp qui les desiroit tant, ce\
    \ sera a vous de l'y mener comme je fais estat. J'attends que vous m'informiez du succes\
    \ du festin et de ce qui s'y est passé de remarquable et suis\nMon frere \nVostre bien affectionné\
    \ Frère C. Huijgens."
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
