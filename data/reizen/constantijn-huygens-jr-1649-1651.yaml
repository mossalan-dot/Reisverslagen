  tekst: 'Geneue 16 mars [1650].

    Mon Frere,

    J''ay leu vos vers avec l''admiration qu''ils meritent estants veritablement beaux et bien
    polys. Mon Pere m''en envoya aussi une copie dans un petit billet lequel ayant leu devant
    sa lettre, je n''avois garde de croire si non que ce fust de sa façon. J''ay monstré ceux
    de Mon pere et de Mr. d''Aumale a plusieurs personnes d''icy qui, concordi judicio disent
    touts que ceux de Mon pere sont excellents et que ceux de d''Aumale ne valent rien, et j''en
    juge de mesme. Vous jouissez de toutes les nopces et de tout ce qu''il y a de resjouissances
    par dela pendant que je suis tourmenté icy a suivre un gros Comte qui comme un cheval retif
    ne va ny en avant ny en arriere, dieu scait le plaisir que c''est. Il est vray que le desir
    d''aller en Italie commence presque à me passer comme l''on perd l''appetit à trop jeusner,
    et pourtant s''il me tarde encore quinze jours, il y aura bien du malheur si je l''attens
    d''avantage. Ibimus, ibimus.

    Enfin Crommon se marie et presque en mesme temps la dame a laquelle il en avoit fait a croire
    icy, qui fait pourtant un party bien plus avantageux que n''auroit esté celuy de Crommon.
    Il pourroit bien arriver que je serois des nopces. Het succes met de naeste. Adieu.'
- verzender: Constantijn Huygens
