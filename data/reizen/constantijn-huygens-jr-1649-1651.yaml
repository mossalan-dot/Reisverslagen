  tekst: 'Haye ce 29 mars 1650.

    Mon Frere

    J''aij vû une lettre de M. Schoten a Mon Pere sur le subject de vos vers, que vous avez
    fait a sa priere, sur l''effigie de M. des Cartes qu''il va faire imprimer a cette heure
    que ce grand personnage est mort, il semble qu''il a consulté quelquesuns qui ij ont trouvé
    a redire et l''ont voulu corriger en quelques endroits, mais mon Pere n''approuve pas leur
    corrections, que seulement en ce qu''au dernier vers, Omnia ut aspiciant quod saecula nulla
    tacebunt, ils ont substitué (quem) au lieu de (quod.) L''on ij mettra vostre nom avecq un
    J à fin. Mon pere a fait quantité de vers sur la mort du dit des Cartes, que peut estre
    il vous envoije; ceux que j''aij enfermé icij dedans sont les miens, que je vous envoije
    pour toute nouvelle, et demeure

    Vostre tresaffectioné frere et serviteur Chr. Huijgens.

    En me hastant a depescher cellecij j''aij par mesgarde pris le pot à encre en voulant mettre
    du sable sur mon escriture, c''est pourquoij cette lettre icij a fort mauvaise mine.'
- verzender: Christiaan Huygens (1628-1695)
