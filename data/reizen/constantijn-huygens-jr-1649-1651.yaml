  tekst: "Haye ce 22 de mars 1650.\nMon Frere,\nIl ij a aujourdhuij 3 sepmaines que j'estois\
    \ aux nopces de Madlle Hooft ou le plus grand plaisir que j'aije eu estoit de voir la folie\
    \ de la jeunesse d'Amsterdam qui me semble excessive et insupportable. M. Crommon m'a depuis\
    \ prié aux sienes, a qui je m'en suis excusé, en ayant desia tout mon sou, quoyqu'envers\
    \ luij je ne me sois pas servij de cette excuse là. L'on ma dit à Amsterdam que les promesses\
    \ faites a Madlle Turetini ayant esté sceues, ont grandement reculé ses affaires et manqué\
    \ de renverser tout; de sorte que vostre Lunati n'a pas du tout sans raison prononcé ce\
    \ bel Apopthegme. Neef Zuerius est icij pour quelque temps avecq ses deux filles et l'aisné\
    \ de ses fils, Meerten estant resté a Bolducq malade d'une fievre tierce. Je tasche a leur\
    \ donner du divertissement en les menant quelquefois a la Comedie et ailleurs. Je voudrois\
    \ que vous fussiez icij pour le faire, et que je fusse là ou vous estes, d'aussi bon coeur\
    \ que je me dis\nMon Frere \nVostre tresaffectionné frere et serviteur Chr. Huijgens.\n\
    Toot est revenu."
- verzender: Christiaan Huygens (1628-1695)
