  tekst: 'Haije ce 12 d''Avril 1650.

    Mon Frere,

    Jamais je n''aij esté depourveu de nouvelles comme je le suis maintenant, et si je vous
    escris encore ce peu de mots, ce n''est que pour vous faire voir le desir que j''aij d''avoir
    de vos lettres; et quand je ne le ferois pas mesme en cette consideration je le devrois
    faire par contrainte, et par commendement de Mon Pere, qui a un soin tresparticulier de
    faire continuer nostre correspondence. J''aij de la peine a mettre la main a la plume quand
    je n''aij rien a vous conter, et affin que vous croijez que les nouvelles que je pourrois
    sçavoir ne meritent pas d''estre rapportées, je vous confesseraij, que j''en suis reduit
    là, que pour la plus importante je vous raconteraij ce que j''aij leu dans la gazette. Il
    ij avoit dedans celle d''Anvers le dimanche passé. Dat in Suede een geck gestorven was die
    seijde dat hij soo langh leven kon als hij wilde. Notez que c''est icij M. des Cartes. Je
    suis

    Vostre tresaffectioné frere et serviteur Chr. Huijgens.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 02-08-1650
  plaats_verzender: Den Haag
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
