  opmerking: met een tekening van de Alpen
  tekst: 'Geneue 8. Marty 1650.

    Mon frere,

    J''ay receu vostre derniere, dans laquelle vous gazouillez fort et à loisir sur ma pauvre
    paire des moustaches, dont vous croirez ce qu''il vous plaira, je ne m''en mets pas beaucoup
    en peine. J''en envoyerois bien la mesure et la grandeur si je crojois que vous en voulussiez
    scavoir la façon pour en faire faire des semblables, mais considerant l''estat de vostre
    menton tel qu''il estoit lors de mon depart (doen was gij ruijgh als een paes ey) je me
    suis imaginé que vous n''en aviez pas encore à faire.

    J''ay fait un tour en Suisse c''est a dire en Allemaigne car on n''y parle presque rien
    d''autre. Dans un lieu qui est entre deux a deux journees et demie d''icy on parle un langage
    bigarré et composé du François avec l''Allemand et ils disent Swager preste moy ton wagen
    et choses semblables. Cette villette s''appelle Morat, fort renommée a cause de la bataille
    dans laquelle le Duc Charles de Bourgoigne fut defait des Suisses. On y voit encore touts
    les ossements des pauvres Bourgignons entassés les uns sur les autres ad perpetuam rei memoriam.



    La situation des Alpes a voir du coste du Lac Leman est fort bizarre, et justement il est
    a cette heure nuict sans cela je vous en donnerois le crayon mais ils sont a peu pres comme
    vous voyez cy dessous, toutes blanches de neige en tout temps. Adieu.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
