  tekst: 'Epitaphe de M. Scarron, pour M. d''Aumale.

    Cij gist et fait honneur aux morts

    Scarron le grand autheur burlesque;

    L''esprit qui fut tousiours grotesque

    Enfin s''est mocqué de son corps.

    Apres tant de rude souffrance

    Il s''est couvert d''un autre estuij,

    d''Aumale l''a logé chez luij,

    Qu''on ne le cherche plus en France.

    Mais las! destin puis que ta loij

    Depuis l''heure à Scarron fatale

    A mis son esprit dans Aumale,

    Que n''est celuij d''Aumale en moij!'
- verzender: Christiaan Huygens (1628-1695)
