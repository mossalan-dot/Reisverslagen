  tekst: "Mon frere,\nC'est une chose fafcheuse quand on est si loing l'un de l'autre qu'il\
    \ faut tant de temps pour avoir responce a nos lettres: Il y avoit plus d'un mois que je\
    \ vous avois escrit depuis mon retour de Danemarc, quand mon Pere me monstra vostre lettre,\
    \ par la quelle vous tesmoigniez de desirer les nouvelles et particularitez, que j'avois\
    \ desia escrittes si longtemps auparavant. J'espere que vous serez content de scavoir de\
    \ mon voyage ce que je vous en ay mandè, car il m'ennuie de copier tant de fois mon journal,\
    \ que je n'eus jamais escrit au large comme j'ay fait, a moins que d'en estre pressè par\
    \ Mon Pere. J'ayme mieux vous entretenir de ce qui se passe icy, et maintenant j'en ay belle\
    \ matiere. Ma cousine Marie Bodaen a la fin s'est fiancée avecq un quidam nommè van Sonne\
    \ et a eu hier sa premiere annonce. Il est fol en premier lieu, et avecq cela de fort petite\
    \ extraction, ayant deux freres a Rotterdam dont l'un est ministre et l'autre orfevre, de\
    \ plus il n'a ny charge ny biens: je ne scay quels cousins nous aurons encore a la fin.\
    \ Mon Pere l'en a tencée une fois et bien fort encore, il y a presque deux mois, mais il\
    \ estoit desia trop tard, ce joly serviteur estoit logè chez elle et commandoit absolument\
    \ dans la maison comme ont veu ceux qui se donnoient la peinne de l'aller voir quelquefois;\
    \ il n'y a point de doute qu'ils n'ayent couchè ensemble il y a longtemps. Mon frere Toot\
    \ part apresdemain avecq Milord Creve pour aller faire un tour en Allemagne; ils seront\
    \ quelque temps a Cassel et a Heidelberg, et ne reviendront que vers le printemps. Il y\
    \ a 7 ou 8 jours qu'il y eust un bal chez Mr. de Beverweerdt qui cousta bon a Mr. Toot.\
    \ Toutes les principales dames de la Haye y estoient, et mesme Son Altesse y vint. Pour\
    \ des considerations Ma cousine van Dorp n'y comparut pas. Elle m'a priè de vous escrire\
    \ de sa part, que vous ne luy serez pas le bien venu, qu'en revenant sans perruque; et en\
    \ suite de vous faire ses recommandations, a qui je joins les miennes, a scavoir celles\
    \ de\nVostre frere et serviteur \nChr. Huygens.\nCe 24 de Jan. 1650."
