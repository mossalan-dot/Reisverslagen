  tekst: 'Rome 29 may 1650.

    Mon frere,

    J''aij receu vostre derniere du 4e Apvril et l''eloge que donne le Gazettier à Mr. Descartes,
    qui est tout à fait drolle. Ce coquin la merite que touts les Philosophes luy donnent les
    estrivieres. Je vous souhaitte bien de fois icy avec moy pour considerer ensemble tant de
    belles choses dont il y a icy si grande quantité qu''on s''en soule. Si vous regardez dans
    la moindre maison la porte estant ouverte vous verrez dans la Cour de derriere des grands
    orangers et trois ou quatre belles statues antiques de marbre blanc. Il y a trois jours
    que nous fusmes dans les Catacumbes, ou Roma sotterranea dont vous avez le livre chez nous.
    On y entre aupres de St. Sebastien et a moins que d''auoir un bon guide on s''y esgareroit
    incontinent, car ces labirynthes vont jusques dans le Royaume de Naples et par dessoubs
    le Tibre. Nous passons des jours entiers en pourmenades et a voir tant d''antiquités, Vignes,
    Palais et quid non? Quand on est bien las on va boire dans des maisons qui sont expressement
    pour cela des certaines eaux refraisschissantes qu''ils font icy de toute sorte de goust
    comme de Cerises, de fraises, de Citrons, de l''Ambre, de Canelle &c. ils les font dans
    des certaines petites bouteilles qu''ils mettent dans de la neige meslée de sel et de salpetre,
    ce qui les fait geler incontinent tout autour, et c''est une chose delicieuse de les boire.
    Adieu.'
