  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Mon frere,

    Samedy passe Son Altesse est partie pour Zutphen et nostre Pere aussi malgre qu''il en eust.
    Maintenant c''est par son ordre que je vous escris celle-cy, et vous scaurez de sa part
    que s''il y a apparence que la Cour doibve bientost revenir à Paris, comme il y en peut
    avoir puisque l''accord de Bordeaux est fait, que vous la pourrez attendre la, si vous voulez,
    et employer encore quelques septmaines a la voir et frequenter. Mais en cas qu''elle tarde
    encore longtemps, et qu''il faudroit demeurer jusqu''a bien avant dans l''hyver, il ayme
    mieux que vous reveniez, sans l''avoir veue, tant pour eviter en ce faisant les incommoditez
    du voyage qui n''est desia que trop malaise qu''affin qu''il ne soit frustree de son conte
    et de son desir qui ont tousjours este de vous revoir sur la fin de cet Automne. Voyla ce
    que porte ma commission, a la quelle mon conseil seroit du tout conforme, si c''estoit a
    moy a vous en donner. Je vous doibs encore des remerciments de ce que vous avez pris la
    peine de me copier la chanson que vous m''envoyastes il y a quelque temps, et ne doute pas
    que vous n''en fassiez bonne provision pendant vostre sejour de Paris, mais seulement je
    crains qu''elles seront toutes de la legere sorte, que je scay estre plus selon vostre fantasie.
    Si a vostre retour vous me voulez obliger de quelque chose de plus, ce sera en m''apportant
    un rasoir ou deux du coutelas, et un petit estuy de bonne mine, deux choses qu''on ne scauroit
    trouver icy pour de l''argent. Le temps viendra qu''en pareil cas j''auray aussi souvenance
    de vous, et pour ce qui est du present en tout ce que vous pouuez auoir affaire de moy vous
    m''employerez comme estant

    vostre tres affectione frere et serviteur Chr. Huygens.

    A la Haye, le 12e d''Oct. 1650.

    Monsieur van Leeuwen est maintenant loge la où vous l''estiez a Geneve, et fait estat d''y
    demeurer cet hyver.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 08-12-1649
  plaats_verzender: Genève
  land_verzender: ZW
