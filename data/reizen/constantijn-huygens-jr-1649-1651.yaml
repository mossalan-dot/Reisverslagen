  tekst: 'Haye ce 25 Dec. 1649.

    Mon frere

    Il ij a 5 ou 6 jours que je suis revenu de mon voyage de Dennemarck ou j''aij esté avecq
    Mr. le Comte Henrij comme vous sçavez. Pour luij il n''a pas esté plus loin qu''en Holsteijn,
    mais moij, ayant trouvé bonne compagnie j''aij eu assez de curiosité pour passer plus avant
    j''usques a Coppenhaghe et Elseneur ou les navires ont accoustumé de payer le tribut au
    Roij; et si la saison l''eust permis, j''eusse peut estre passé plus outre en Schonen et
    Suede pour ij voir Mr. des Cartes et la Reine dont il escrit tant de merveilles, mais ce
    n''eust pas esté pour revenir avecq Mr. le Comte. Au commencement j''ay esté avecq luij
    10 ou 12 jours a Flensburgh en Holsteijn ou la Cour estoit; la on n''avoit autre passetemps
    que de manger et boire danser et jouer: L''apresdisner on s''alloit divertir ins frauwenzimmer
    ou il ij avoit 12 damoiselles de la Reine et quelques freuleins, toutes habillées a la Francoise
    mais dont pas une ne parloit Francois. Apres souper d''ordinaire on ij dansa le Roij et
    la Reine aussi bien que le reste; la Reine n''a que 18 ans, mais pour le Roij qui en a plus
    de 43, j''estois bien estonné au commencement de voir qu''il s''amusoit a danser de sessies
    avecq nous autres. Monsr. le Comte estoit tousjours de la partie et Beer estoit le maistre
    qui nous enseignoit de ces contredanses d''Angleterre, ou l''on ne s''en sert plus. Je vous
    pourrois longtemps entretenir de ce que j''aij veu et remarqué en tout ce voijage, mais
    pour abreger je vous diraij seulement ce que j''aij trouvé de nouveau en leur facon de vivre.
    A table horsmis a celle du Roij l''on n''ij a point de serviettes. ils boivent la biere
    hors de grands pots d''argent qu''on a de la peine à lever. dans leur pain saulces et avecq
    beaucoup d''autres viandes ils mettent du cumin. par tout on ij couche entre deux lits de
    plume. on ij disne a 10 et souppe a 5 heures. Je croyois vous en dire bien d''avantage mais
    je ne m''en scaurois souvenir a cet heure. J''espere que vous vous souviendrez mieux de
    me respondre et de ce que je suis

    Vostre frere et serviteur Chr. Huijgens.

    Toot vous escrira sans doute que Frelle Juliane de Brederode est devenüe insensée, et que
    Mr. Kinschot n''en est pas loin en ce qu''il a changé de religion.'
- verzender: Christiaan Huygens (1628-1695)
