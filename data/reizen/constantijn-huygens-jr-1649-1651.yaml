  opmerking: met afbeelding
  tekst: 'Mon Frère.

    A Geneve ce ... janv. 1650.

    J''aij receu celle que vous m''avez escrite depuis vostre retour de Danemarcq. Vous ne me
    dites rien de ce que vous ij avez veu. J''espere que vous aurez tenu un journal comme j''aij
    fait depuis le premier jour de mon depart. Nous les lirons ensemble, quand j''ij auraij
    adjouté celuy d''Italie l''esté proschain, ou il faut que j''aille avant que de revenir.
    Si vous me rencontriez avec une grande perruque et une grande barbe vous me prendriez pour
    un autre asseurement. Nous sommes icij a present dans des grosses neiges, qui rendent les
    grandes pointes des Alpes, que je puis voir de ma chambre terribles a voir. Vous n''en aurez
    pas veu de si hautes a vostre voijage. On passe le tems gaillardement icij a causer, jouer
    et veiller, qui veut dire donner des visites apres souper, chose fort usitée icij et mesme
    par tout en France, dont vous trouveriez les façons de vivre tres differentes, et bien plus
    estranges que celles de Danemarc.

    On fait icij de très bonnes montres et à bon marché & &.

    J''ay trocqué ma petite aveq un peu de rabat contre une autre qui est à la mode aveq la
    boete de Cristal de roche tout lice en sorte que l''on voit le mouvement dedans comme si
    la boete n''estoit que de glace. Le quadrant est esmaillé aveq des belles figures la grandeur
    de ma monstre est cellecy, vous prendrez bien de plaisir à la voir. Je suis

    Vostre tres affectionne frere et serviteur, C. Huijgens.'
- verzender: Constantijn Huygens
  ontvanger: Christiaan Huygens (1629-1695)
