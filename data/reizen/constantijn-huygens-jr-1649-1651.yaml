  tekst: "Mon Frere,\nJe commence a estre malade et mon frere de se porter mieux: il ij a longtemps\
    \ que j'aij preveu ce malheur et je croij que ce sont les restes d'une maladie qui m'a incommodé\
    \ deja quand j'estois à la Cour du Ducq de Holsteijn, ou je la fis cesser en tenant bonne\
    \ diete; Je n'aij pas encore pris medecine et m'en garderaij tant qu'il me sera possible,\
    \ mais cependant j'aij le mesme mal que mon frere avoit quand il en prit; c'est que j'aij\
    \ des enflures au col de costé et d'autre un peu dessous les oreilles, qui font fort mal,\
    \ et apres estre dissipees font tomber des defluxions sur les bras. J'espere pourtant que\
    \ je seraij plus heureux que luij et que je vous manderaij bientost des nouvelles de ma\
    \ santé, qui vous seront plus agreables que cellescij si vous desirez la mienne autant que\
    \ je desire la vostre. L'on estoit fort en peine de vous et sur tout mon pere quand vous\
    \ aviez mandé dernierement que vous aviez peur de devenir Pulmonique. Mais aussi a il esté\
    \ plus aise que pas un d'entendre que vous aviez recouvré vostre premiere santé et que vous\
    \ estiez de si bonne mine et si beau qu'on ne vous appelle maintenant a Geneve que le Beau\
    \ Monsieur. il faut bien que cette perruque que vous avez mise vous ait changé d'importance,\
    \ et qu'elle contribue beaucoup a la beauté, car tant que vous avez esté icij a la Haije,\
    \ je ne vous aij ja[mais] ouij donner le surnom de Beau; Tant que vous n'estes pas icij\
    \ je n'en suis point envieux, mais j'espere pour nostre bien et pour le bien de toutes les\
    \ damoiselles et damoiseaux de la Haije qu'a vostre retour vous aurez quitté la beauté avecq\
    \ la perruque, et qu'on vous verra plustost avecq les cheveux un peu courts comme ils ont\
    \ accoustumé d'estre quand on vient de la quitter. Vous direz sans doute que je ne suis\
    \ pas trop malade encore, puisque j'aij envie de railler, mais scachez que je n'aij autre\
    \ chose a vous escrire puis que Toot vient de m'advertir qu'il vous a fait part de l'unique\
    \ nouvelle que nous avions, et pardonnez la longeur d'une lettre qui ne dit rien a un pauvre\
    \ malade qui ne cessera que le plus tard qu'il luij sera possible d'estre\nMon frere \n\
    Vostre frere et serviteur Chr. Huygens.\nle 17 de Jan. 1650."
- verzender: Christiaan Huygens (1628-1695)
