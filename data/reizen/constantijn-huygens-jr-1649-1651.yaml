beschrijving: Verslag van een educatiereis van Constantijn Huygens jr. naar Frankrijk en Zwitserland
  in 1649-1650. Een tweede verslag naar Italië ontbreekt. Huygens reisde naar Parijs via de
  Zuidelijke Nederlanden, waar hij onder andere Antwerpen en Brussel aandeed. Hij bezocht het
  Loiregebied en vervolgde zijn weg zuidelijk naar Lyon, vanwaar hij uitstapjes maakte naar
  Grenoble en Avignon. Hij stak over naar Genève, waar hij de winter doorbracht. Zijn verslag
  bevat passages in geheimschrift. Huygens verbleef langere tijd in Parijs (4 juni-17 juli 1649),
  Orléans (13-19 augustus), Lyon (17-27 september; 4-27 oktober; 5-14 november) en Genève (17
  november-24 februari 1650).
