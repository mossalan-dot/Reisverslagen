  tekst: 'A Geneve ce 8. de Febr: 1650.

    Je viens de recevoir la vostre du 17. du mois passé. J''espere que vous serez maintenant
    guerij de l''incommodité de Gosier qui vous tourmentoit alors, car ces maux viennent et
    s''en vont de mesme soudainement. Mon Frère Louis ne me mande rien, si non qu''il se porte
    mieux, souhaitteroit aller en France, et n''ij scauroit encore parvenir. en sorte que quand
    vous me renvoijez a lui pour scavoir des nouvelles. Soo wijse mij op een dorp daer geen
    huijsen en staen.

    Vous ne me mandez rien pendant que je cours le monde, mais le temps va venir que je vous
    rendray choux pour choux, ne craignez pas. Je pense que j''iray icy aux nopces de la vieille
    maistresse de Crommon fille de Monsieur Turetini qui a cette heure fait un party beaucoup
    plus avantageux qu''elle n''auroit fait si Crommon auoit tenu sa parole, qu''il avoit donnée
    aveq si bonne forme circonstanciée de bon nombre de faux serments que monsieur Lunati qui
    m''enseigne l''Italien et en ce temps la luy servoit de maquereau d''honneur, dit (ayant
    appris qu''il estoit fiancé aveq Mademoiselle de Gheer) que ce sera grand bonheur pour luy
    si le diable ne l''emporte la premiere nuict de ces nopces.

    Je pense qu''en trois semaines je partiraij pour aller a Rome. Si vous esties icij vous
    verriez bien de belles choses que d''autres gens ne voijent pas, sur tout un paijs qui est
    a peindre de quelque costé qu''on se tourne. Je ne suis pas assez grand maitre pour le desseing
    moij mesme, mais je trouveraij quelque Craeuwer de peintre, qui me le fera, commé j''ay
    deja fait a Lyon.

    J''attache ces pieces dans mon Itineraire, qui en verité est un livre de prix, et que vous
    serez bien aise de voir.

    Je vous prie de m''escrire touts les huict jours et j''en feray de mesme. Adieu.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
