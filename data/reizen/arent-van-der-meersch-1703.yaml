beschrijving: Verslag van een handelsreis van Arent van der Meersch (1683-1768) naar Duitsland
  in 1703 in het gezelschap van zijn zus Anna (1669-1724), Pieter Boek en Giese Mulder. Van
  der Meersch trok via Overijssel naar Hannover en Leipzig. Hij bezocht Bayreuth en verbleef
  twee weken in Neurenberg. Hij spendeerde drie maanden in Leipzig en keerde opnieuw naar Neurenberg,
  waar het verslag eindigt.
