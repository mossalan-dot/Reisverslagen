  tekst: 'Hartelijk dank voor uw boek. - ‘Men heeft my hier aen ''t hoff van Sweden niew werck
    gesneden, maer, tussen ons geseyt, het is maer lapwerck; ick hoop efter, dat eyntelick sal
    kunnen gevonden worden, en een confidente vrintschap getroffen, en ick de belooninge van
    myn langhwylige uytlandigheyt sal weghdraegen. - Men dryght malcanderen hier capitalicken,
    maer men is vervaert eerst te beginnen. De Coninck van Sweden is gewoon ab executione te
    beginnen ende wonderlicke te succederen in syn exploiten van oorlogh. Als syn Mat. syn troepes
    in Pomeren sal afgevoert hebben, is te geloven, dat tot geen halte te brengen sal wesen,
    maer de heer Cheurvorst Brandenburg resolveren sal moeten, op leydelicke conditien hem over
    syn bodem naer Polen te laten marcheren, ofte met gewapender hant zulckx hem te verletten.
    - De dispositie van myn suster, daervan U. Ed.t gelieft te mentioneeren, is my geene klyne
    becommeringe, en voor haer een smertelick en verdrietigh leven. Ick hoope, dat dese somer
    haer sal geven, dat wy van de voorige verwaght hadden; ick bedancke U Ed.t, dat gelieft
    syn compassie over haer leyden te betuygen’.....


    Hamburgh, den 30 April 1658.'
