  tekst: 'Broer

    Danzick den 6 May 1656.

    Vooreergisteren heb ick wesen bestellen den brief aen Hevelius. het is sulcken aerdigh manneken
    dat het my ten hoogsten beroude dat ick den eersten dagh als ick hier quam geen kennis met
    hem gemaeckt had. Hy was seer bly met V brief en billietten te meer omdat hy nu iuyst oock
    heel in Saturnus verwart is. Hy is besigh met een tractaet daer van te schryven dat haest
    vyt sal komen en daer sult ghy het eerste exemplaer van hebben. Hij liet ons 2 of 3 groote
    plaeten sien die daer in komen sullen daer het toe nemen en verminderen van de ooren en
    den tydt wanneer het gebeurt perfect opstaet. Hij seght dat indien de oren nu inde may niet
    enighsins gesien werden soo sullen sy noch achter blyven tot in September van het iaer 47.
    Van de comes en weet hij niet te spreecken en twijffelt of ghy oock al recht gesien hebt.
    hy salder oock eens op letten. Syn grootste Verkijckers syn van 17 of 18 voet met 4 a 5
    glasen die hy slijpt in root kopere schotels die wel 2 mael soo groot syn als de vwe. en
    hy sustineert dat de groote van de schotels veel tot de perfecti van de glasen geeft. Syn
    glasen syn soo suyver soo van stof als van politteure als icker noch oyt gesien heb. Hy
    is nu besigh om Hyperbolische te slijpen en had al eenige kleyne gemaeckt. meynt dat het
    seer wel mogelyck is die heel perfect te maecken en oock dat men daer wel wat anders mee
    vyt sal rechten. Ick heb door syn kykers noch niet gesien om dat het donker weer was maer
    hij seght daer veel goeds af. Van daegh sal ickse op gaen nemen en schrijuenie met den eersten
    brieve daervan. Hy heeft ons een vergrootglas met 3 glasen laeten sien dat wel ruym soo
    goed was als de vwe. Het is een manneken dat seer handigh is hy snydt al syn plaeten seluer
    maeckt oock heel nette instrumenten van koper. Hy snydt sonderling niet op en is seer beleeft.
    Geen cabinet en heb ick oyt soo net gesien als syn studeer kamer. Adieu met groten haest.

    P. Huygens.

    Seght doch sus datse myn wat nieus schryft. ick sal haer een poolse sabel of soo wat me
    brengen. Ick heb in 2 maenden tydt niet gehoort of ie altemael doot of leuend bendt. Eyckberg
    krijght oock geen brieven.

    Dit briefien heeft my Hevel gisteren gegeven om ie te senden.'
