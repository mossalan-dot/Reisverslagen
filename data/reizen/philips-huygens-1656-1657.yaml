  tekst: 'Philippus Hugenius Christiano fratri S.P.

    Quod promiseram me nempe de Telescopiis Hevelij ad te scripturum, etsi tarde, tamen denique
    praestare volui. Post immodicas laudes quibus opera sua mihi commendaverat, ac metu ne a
    nullo fieret vehementer extulerat, valde cupidus eram videndi quid plane de re esset. Cum
    itaque audirem dominos Legatos (quos prout est homo valde sociabilis visitaverat) ad eum
    commeare velle comitem vt soleo me iis dedi. Sed fateor me nunquam magis fuisse deceptum
    quam vbi nos in turrim aut speculum vt vocat in eum finem plane extructum deduxisset, ac
    Telescopia dua, pulchre certo coreo deaurato vestita nobis monstrasset. Optimum quod vocabat
    ac quod 12 pedum circiter erat, constat e sex vitris bene constructis ac optime perpolitis.
    Sed iam dico vos esse praestantissimos verrekyckatorum Slypatores, nam vestrum quod eiusdem
    esst longitudinis ac duo tantum vitra habet Hevelianum plane mortefacit. Iam quaeres an
    valde clare ac dilucide obiecta representet, qualem faciat aperturam, item quomodo magnitudinem
    rerum multiplicet: maer hier sal ick mijn heer op dienen. Satis acute vt vocat omnia refert,
    aperturam facit provt videtur quid volam manus adaequat; sed tam parum multiplicat vt si
    homines dimidiae horae spatio absint, non possis discernere non solum cuius sexus vel an
    fortasse vtriusque sint sed plane impossibile sit diiudicare an homines, canes vel aliud
    quoddam genus animalium sint. Maer a propos van dat utriusque.

    Te Danzick is een manneke van mijn goede kennis, heer Salomons, is koopman: die heeft omtrent
    tot syn 17 of 18 iaer daer inder stede voor joffrouw gepasseert, soo dat sommige andere
    luyden die ick daer ken, my geseght hebben, dat sy dickwils op bruyloften en in andere gelegenheden
    hem altijdt voor joffrouw Flora Salomons opgepast hebben. Dit dier eenige extuberati omtrent
    de middelste quartieren van sijn lichaem vernemende, iae soo veel dat het begost een manneken
    te gelycken: Gelyck een eerlycken huysarmen sulck een dingh al wat vreemt voor behoort te
    komen was seer verbaest en openbaerde het aen syn mamatie. Die in geen kleynder tribulaty,
    riep met luijder stemmen eylacy, maer eyndelyck docht op de collacy, en nooyde de vrienden
    ter stacy. die, nae lange deliberacy, goetvonden om met goeie gracy van die andere natuurlijcke
    spaty te maecken een behoorlycke pullulaty, dat Flora Salomons souw doen een navigaty: zij
    bedancktese voor de presentacy, en nae een algemeene salutacy ging nae Amsterdam by Doctor
    Tulp. Die gelyck hy een groot kunstenaer is gaf haer noch een sne of twe en maeckte dat
    alle dingen voor den dagh quaemen, en dat sy soo wel versien was als een manspersoon soud
    meugen wesen. Daer op treckt sy een broeck aen, gaet voor een iaer of twe nae Vranckryck.
    Komt daer nae weder te Danzick. daer ick wel tien mael met haer of hem ouer straet gegaen
    heb. Hy heet nu Floris en heeft een kleyn baertie, is omtrent nu achtentwintigh iaer out
    en is van de Joffrouwen niet te slaen. Is een seer kleyn manneken en seer onbesckaemt. Mais
    a nos moutons.

    Domini Legati qui nescio quid sibi promiserant ac imaginati erant, risum tenere non potuerunt.
    Maxime cum aliud adhuc perspicillum produxisset incurvum quod nunc a latere tum a superiori
    parte inspiceretur. Pudebat me sane illorum intemperantiae quum hominem qui miracula sese
    ostendere putabat, non solum non laudarent sed risu immodico quasi ludibrio haberent. Vnus
    aiebat: puto me aliquid vidisse sed non certo scio. Alius se vidisse aliquid dicebat sed
    quum parum abiisset artifex, praeter tenebras nihil fuisse iurabat. Duo reliqui se vidisse,
    sed non magni facti momenti. Rosen voor de varkens docht ick, maer ick vergat het te seggen.
    Ars non habet inimicum nisi ignorantem nam revera satis bonum erat hoc perspicillum, etiamsi
    parvum redderet admodum foramen. Aliud adhuc monstrabat quinque pedum quo se fere omnes
    observationes fecisse dicebat. Quod mihi quidem plane impossibile videbatur. Invitabat me
    vt vespertino tempore venirem aliquando: sed interdum occupationes saepius caelum turbulentum
    ac nubibus obductum impedimento fuere. Si Domum redituri iterum Gedanum venimus, non intermittam
    hominem adire ac ac videre an Jupiter Saturnus, ac alij vestrorum amicorum etiam in hac
    mundi plaga reperiantur. Vale.

    Saluta meo nomine Cognatum ac fratres. Cognatum Doublet aliosque qui mihi bene esse cupiunt.

    P. Huygens.

    Marenburgi 30 May 1656.'
