  opmerking: over het overlijden van Philips Huygens
  tekst: 'Oom van Baerle.

    29 Maj. 1657.

    Mijn Heer ende Oom

    Eergisteren is ons de droeve tydinghe toegekomen, hoe dat onsen lieven Broer Philips die
    met de Heeren Ambassadeurs tot noch toe in Pruyssen geweest was binnen Marienburgh den 14en
    deser is komen te overlijden, het welck wij niet hebben konnen naerlaeten VE mids desen
    bekent te maecken, naerdemael dit onverwachte verlies naest ons niemandt naeder is betreffende.
    Men schryft ons dat syn sieckte is geweest een bloedighe loop benevens eene continueele
    koortse die hem in den tydt van 7 daeghen hebben weghgeruckt, niets anders beklagende als
    dat hij sijn Vader en naeste vrunden niet soude moghen den lesten adieu seggen. VE kan wel
    dencken hoe seer ons dese tydinghe verslaegen heeft, hebbende te vooren niet in ''t minste
    van sijn indispositie geweten; en wat een groote afflictie myn Vader aenstaende is, die
    over eenighe daeghen ter oorsaeck van Syn Hoogheyts affairen naer Luyck is verreyst. Doch
    wy hoopen dat den Goeden God die het belieft heeft hem ende ons dese droefheyt te laeten
    overkomen ons mede de sterckte sal geven om die metter tijdt te versetten ende ons bewaeren
    van verder ongeluck. Ick bevele VE met syne gansche familie in sijn heilighe bescherminghe
    ende blyve

    Myn Heer ende Oom

    VE onderdaenighen dienaer ende neeve Chr. Huygens van Zuylichem.'
