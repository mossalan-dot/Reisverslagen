- verzender: Constantijn Huygens sr. (1596-1687
  ontvanger: Hendrik van Nassau-Siegen
  datum: 23-09-1649
  plaats_verzender: Zuilichem
  land_verzender: NL
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg003/XXVII
  tekst: "A Zuijlichem. le 13/23 Septemb. 1649.\nMonseigneur;\n\nDes que le bon temps et mes\
    \ affaires me l'ont voulu permettre, je suis parti de la Haije (qui fut hier) pour me rendre\
    \ en ce païs icij; où les ordres que je doibs donner à mes biens m'obligeant d'arrester\
    \ 3. ou 4. jours, pour en apres passer outre à ma Terre de Zeelhem, qui est à une demie\
    \ heure de Diest sur le Demer, je faij estat que ce voijage m'emportera enuiron 15. jours\
    \ de temps: et aij trouué necessaire de vous importuner de ce recit, par ce que, pour consideration\
    \ importante, j'aij mené aveq moij mon second Fils, qui doibt auoir l'honneur de vous suiure\
    \ au voijage de Danemarq: esperant qu'il aura tout loisir de reuenir aveq moij à la Haije,\
    \ et de la se transporter à Ter Burgh, pour quand il vous plaira me faire la faueur de m'en\
    \ aduertir. Ie me souvien, Monseigneur, que vous faisiez estat de partir pour Ter Burgh\
    \ vers la fin de ce mois, et les 8. ou 10. jours que vous croijiez d'avoir à ij emploijer,\
    \ pour ij receuoir les papiers et informations necessaires au voijage me font juger que\
    \ dans cesdits 15. jours de mon voijage, mon fils ne perdra point de temps; et que si, peut\
    \ estre, il venoit tard d'un jour ou deux vous nous ferez bien la grace de nous les donner.\
    \ ce que je dis icij par auance, parce qu'apparemment quand vostre lettre viendra à la Haije\
    \ nous ne serons pas encor là. En somme le plus juste compte que je puis faire, c'est d'estre\
    \ de retour chez moij environ le 7. ou 8. du mois prochain. Je vous supplie tres-humblement\
    \ d'accommoder un peu vos desseins selon ce calcul, car je ne voudroij pas pour chose que\
    \ ce soit, que mon Fils perdit l'occasion, qu'il vous a pleu luij octroijer, et sur de si\
    \ grands voijages 2. ou 3. jours de plus ou de moins n'importent gueres. Sur ceste confiance\
    \ je demeure\n\nMonseigneur, \nVostre tres-humble et tres-obeïssant serviteur \nC. Huygens."
- verzender: Constantijn Huygens sr. (1596-1687
  ontvanger: Hendrik van Nassau-Siegen
  datum: 09-10-1649
  plaats_verzender: Den Haag
  land_verzender: NL
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg003/XXVIII
  tekst: "Monseigneur;\n\nEn suitte de l'assignation qu'il vous a pleu nous donner, je vous\
    \ envoije non pas le plus cher de mes Fils, car je les aijme esgalement, mais, j'ose dire,\
    \ le plus precieux des quatre, en ce qu'il excelle sur le reste en force d'esprit et de\
    \ sçavoir, et je m'asseure que ceux qui le sonderont aveq cognoissance trouueront qu'il\
    \ n'en manque point en aucune sorte de science dont un jeun 'homme de sa condition doibt\
    \ estre pourveu. Ie l'estime cependant bien heureux, de ce qu'il luij est permis de faire\
    \ son premier apprentissage au grand liure du monde soubs l'honneur de vos directions. Ie\
    \ vous supplie tres-humblement Monseigneur, de les luij departir aux occasions, et au reste\
    \ vous preualoir de son petit seruice comme vous auez droict de le faire de celuij du Pere,\
    \ qui vous demeure tres-particulierement obligé de ceste grace, et taschera de la recognoistre\
    \ par tout ou il sera capable de faire paroistre par ses tres-humbles seruices, qu'il est,\n\
    \nMonseigneur, \nVostre tres-humble, et tres-obeïssant seruiteur \n\nC. Huijgens.\nA la\
    \ Haije le 9e octobre 1649.\n\nIe ne dissimule pas, Monseigneur, pour où il y pourroit auoir\
    \ occasion d'en parler, que je donne ce Garçon pour tres-expert non seulement en l'estude\
    \ de droict, qu'il vient d'achever, mais aussi es langues Françoise, Latine, Grecque, Hebraïque,\
    \ Syriaque et Chaldaïque. Mathematicien au reste par eminence, et Musicien, et Peintre;\
    \ et pour conclusion du plus doux naturel qui se puisse veoir. I'espere que vous trouuerez\
    \ que ce n'est pas la seule affection paternelle qui le dit, et prie qu'on ne l'importune\
    \ pas de boire, ce qu'il n'entend pas."
- verzender: Hendrik van Nassau-Siegen
  ontvanger: Constantijn Huygens sr. (1596-1687
  datum: 16-10-1649
  plaats_verzender: Bentheim
  land_verzender: D
  plaats_ontvanger: Beekbergen
  land_ontvanger: NL
  taal: Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg003/0065
  tekst: "Mijnheere.\n\nUEdl. Soon is gisteren alhier tot Bentheim geluckig gearriveert, nae\
    \ dewelcke ich ter Burgh wel twee à drye daghen met sonderlinghen verlangen hebbe gewacht,\
    \ ende ondertusschen mijne reijse tot hierentoe geavanceert, Mijn heere Schoonvader heeft\
    \ voorsz. UEdl. Soon met sijn Trompete ende een knecht geaccompagneert mij naegesonden,\
    \ ende sullen wij van daghe onse reijse tot Linghen toe vervorderen. Het is mij seer lief\
    \ te vernemen, dat onder andern schoonen scientien meergenoemde UEdl. Soon oock in den Rechten\
    \ is ervaeren, sulcx dat ick in mijn voorhebbende Deensche saecke sijnes raets gebruijcken\
    \ ende hem als mijnen voornaemsten Conseiller houden werde, Verseeckerende UEdl. dat ick\
    \ allerdings goede sorge voor hem sal draeghen, ende, met God, geluckich wederom te rugge\
    \ brengen, Ondertusschen UEdl. in Godes protectie bevelende, sal altijts sijn ende blijven\n\
    \nMijnheere \n\nUEdl. dienstwillighe ente verobligerten Dienar, Henrij Comte de Nassau.\n\
    Benthem, den 16 October 1649."
- verzender: Constantijn Huygens sr. (1596-1687
  ontvanger: Hendrik van Nassau-Siegen
  datum: 30-10-1649
  plaats_verzender: Den Haag
  land_verzender: NL
  land_ontvanger: DE
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg003/XXIX
  tekst: "Monseigneur;\n\nIe redepesche vostre lacquais le plus promptement qu'il m'est possible,\
    \ aveq la lettre de S.A. au Duq de Holstein, à peu pres conforme à celle que nous auons\
    \ escritte au Roij de Danemarc. I'espere que le pacquet ira si viste, que vous ne serez\
    \ pas incommodé de l'attente. Ie souhaitte que vous ne le soijez pas de la compagnie de\
    \ mon Fils; et cependant vous rens tres humbles graces des faueurs qu'il vous plaist luij\
    \ departir. Comme il ne s'en peut assez louër, je ne trouue point aussi de paroles qui puissent\
    \ bien exprimer le ressentiment que j'en aij, mais les effects suppleeront au default des\
    \ paroles, quand je seraij si heureux que d'en rencontrer les occasions. Ie vous supplie\
    \ d'en faire estat asseuré, en me continuant l'honneur de souffrir que je me die\n\nMonseigneur,\
    \ \n\nVostre tres-humble et tres-obeïssant serviteur \nC. Huijgens.\n\nA la Haije ce 30e\
    \ Octob. 1649."
