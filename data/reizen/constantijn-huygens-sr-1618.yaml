  tekst: 'Ce que je viens d''escrire à mon Pere vous pourra servir de responce sur ce qu''il
    a pleu me mander touchant mon retour à Pasques. Je ne sçauroy m''imaginer pourquoy c''est
    qu''on me veut empecher de parachever ce qu''on n''a pas trouvé deraisonable de me faire
    commencer. Je voudroy que l''on creut que ce n''est pas quelque menu plaisir recerché qui
    me tient icy, mais bien une occasion propre et longtemps desirée, laquelle au regard de
    mon aage je ne voy pas comment r''attraper, si une fois elle m''eschappe. Ce n''est pas
    non plus que je perde mon temps à me pourmener; tout au contraire, je suis souvent par deux
    ou trois jours sans bouger seulement du logis, et tache d''avancer mes estudes aussi dru
    que les affaires particulieres de mon petit maistre et ma santé propre me le veulent permettre.
    De façon que ce m''est grande facherie de veoir que je ne sçauroye me satisfaire à moy mesmes,
    sans le desplaisir de ceux qui ont à me commander. Je prie donc que, puisque vous estes
    d''advis que je ne soye pas ici à la despence de mes hostes, on mette un peu ces considerations
    de trop d''obligation à costé, auxquelles je pense avoir aucunement satisfait, et qu''on
    ne borne pas mes desseings si precisement de trois ou quatre jours plus ou moins.

    Le mariage de Van de Weerde à ce qu''on tient est asseuré; c''est une riche heritiere qu''il
    va espouser au despit de beaucoup de Blauwscheen-Heers qui n''avoyent point attendu leur
    cassade de ce coté la. Pour ce qui est de moy, je vous baise les mains pour le bon advis
    que me donnez, d''en cercher une pour moy au mesme prix. Quand la potence vaudroit 100000
    francs, je n''ay pas envie de me faire pendre de si bonne heure.

    De Zierixzee, cet 11e d''Avr. 1618.

    Quand on voudra me r''appeller au logis, je desire qu''on n''oublie pas de me fournir un
    peu la bourse pour ce qui est de mon voyage et la belle chere de la chambriere, car d''y
    employer mon petit patrimoine, je trouve que les desbourssements sont un peu dangereux en
    ces derniers siecles.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
