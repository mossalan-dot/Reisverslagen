  opmerking: over het overlijden van zijn zus
  tekst: 'De droevige tijding van het sterven van zuster Catharina is mij gisteren geworden.
    Ik heb mij goed weten te houden tegenover mijne omgeving, maar het heeft mij moeite genoeg
    gekost. De smart is nog te erger, omdat ik ver van u allen ben in een vreemd land. Ik wil
    niet trachten u te troosten. Gaarne wil ik hooren, hoe zij gestorven is. Het schijnt mij
    beter, hier niet in den rouw te gaan en er niet veel over te spreken. De knecht van den
    heer Dimmer, die hem vooruitgaat over Artois en Henegouwen, neemt dezen brief mede.

    De dehors Londres, à Lambeth, au logis de Monsr. Caron, ce 26e de Juin, stile d''Hollande,
    1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 08-07-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
