  tekst: 'Uw brief van den 12den heb ik den 20sten ontvangen. Hoe gaat het toch met ‘Catelyntgen’?
    Laat dat altijd het eerste zijn, waar gij over schrijft. ‘Devant hier je suis venu prendre
    possession de ma chambre au logis de Mons.r Caron, qui me fait beaucoup de caresse, selon
    sa coustume envers les estrangers, au reste fantasque, morne et facheux envers ses domestiques
    tout ce qui se peut, de quoy je ne me mesle ni ne me soucie nullement. C''est ici un des
    beaux lieux qu''il se puisse veoir en Angleterre. Je desireroye qu''il fust à une lieue
    d''Angleterre ou deux plus proche du corps de la ville, où il faut que je trouve tout ce
    que je desire r''apporter d''ici. Le voyage d''ici en ville avec le retour me coustera touts
    les jours autant qu''un voyage de la Haye à Leyden et d''avantage, tant l''argent est à
    bas prix pardeça’. Met 6 stuiver komt men in Holland verder dan hier met 10. De 20 £ heb
    ik gehaald bij den heer Burlamachi; zij zullen dienen voor mijn reisje naar Oxford en Cambridge,
    waar ik de volgende maand heenga, om academische plechtigheden te zien. De heer Carleton
    zal mij ook daarbij helpen.

    ‘Je reçoy beaucoup d''honneur et de courtoisie chez messieurs Burlamachi, Zuerius et autres
    qui me prient à disner et me fout le plaisir souvent de me loger une nuit ou deux, quand
    j''ay esté en ville si longtemps qu''il fait trop tard pour retourner au logis. Au reste
    fort honeste compagnie partout. Chez Mons.r Biondi il y a un college de musiciens touts
    Italiens, braves et gallantes gents; la nous allons deux fois par sepmaine. Autres m''ont
    promis de me faire entendre la musique de la Reine, qui sont touts François, a[vec]ques
    des voix admirables, tellement que je me trouve ici entierement en mon climat. Pour ce midi
    Caron est prié par Mons.r Cecill à un festin qu''au nom de son pere le conte d''Exiter [il]
    fera au Roy en une siene maison à quelques quatre lieuës d''ici, ou j''auray occasion de
    veoir plus amplement les grandeurs de la cour d''Angleterre qui est superbe et magnifique
    au possible. Mon pere pourra avoir entendu des nouvelles de ce qui se passe ici d''un des
    deux secretaires, Sr. Thomas Laic qui est confiné à sa maison avec grieves accusations sur
    certaines entrefaites d''entre lui et l''ambassadeur d''Espaigne, touchant le mariage du
    Prince, etc. On ne sçait qu''en dire encores, mais il semble que l''affaire s''accommodera.
    Il y a bruit que le Roy fera defendre par edict qu''il ne se face aucune mention du mariage
    d''Espaigne parmi les discours du peuple, qui sera chose autant ridicule que vaine. Demain
    au disné Mons.r Caron a prié Mons.r Trumbull, l''agent à Brusselles, ou j''auray occasion
    de ie saluer encor de vielle cognoissance. Il y a quelque temps qu''il est en cour sollicitant
    le fournissement de sa pension, chose qui s''obtient difficilement par deça, comme je pense
    que Mons.r Carleton en sçait à parler, et d''autre costé Biondi en tant qu''agent de Savoye.
    Mons.r Caron est fort content que je me pourvoye d''un varlet anglois, comme de vray il
    n''est possible que je m''en passe, quand apres il faudra me mettre en voyage. Brouard m''a
    promis de me trouver quelque fidele garçon. Demain au matin je m''en vay trouver Eglisemius,
    à qui desja j''ay fait dire qu''il y a un Hollandois qui desire le veoir, mais il ne sçait
    pas qui je suis. II a obtenu un bon benefice du Roy en recompense de son Ferio Baralipton
    (?) contre Vorstius. Voici qu''on vient m''appeller pour monter en carosse avec Mons.r Caron
    au festin de Cecill à Wimbelton. La prochaine fois je vous sçauray dire ce que j''y auray
    veu.

    De dehors Londres, ce 12e de Juin, vieux stile, 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
