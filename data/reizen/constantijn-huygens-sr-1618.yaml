  tekst: 'Comme le jeudi au midi nous partismes de la Haye, encor le mesme soir nous nous mismes
    en mer de devant la Briele avec un vent tantost Nord, tantost Nordwest et le temps un peu
    rude, qui nous donna un peu bien d''incommodité toute la nuict et le jour ensuivant, tant
    y a que le lendemain au soir nous arrivasmes devant Marigat, ou nous mouillasmes l''ancre
    pour y demeurer toute une malaisée nuit, de peur des sables qui sont à l''emboucheure de
    la riviere; le lendemain sur les neuf heures levasmes l''ancre et ayans fait quelques deux
    ou trois lieues de chemin, le vent nous quitta, de façon que n''arrivasmes que du soir ou
    plustost de nuit entre une et deux heures icy a Gravesende, ou trouvant le porteur de la
    presente, je vous ay voulu envoyer ce petit journal en extresme haste à cause du navire
    qui s''en va faire voile, et le marinier me presse. Tantost à sept heures nous nous acheminerons
    vers London, Mons.r l''ambassadeur estant d''advis d''aller voir le Roy en passant à Greenwich,
    ou il est pour le present .....

    De Gravesende, ce Dimanche de grand matin, 10e de Juin 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 16-06-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans
