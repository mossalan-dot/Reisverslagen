  tekst: 'Avec vostre permission la haste de cette porteuse me dispensera de plus de trois mots
    de lettre pour vous dire que par la grace de Dieu je suis arrivé en cette ville hier, qui
    fut Samedi, environ les six heures du soir, estant parti de Rotterdam le jour auparavant
    environ le mesme temps et ayant eu le bonheur des marées à propos et d''un vent passablement
    bon, tellement que les orages qui semblent nous menacer me donnent subjet de me rejouir
    d''avoir achevé mon voyage justement, comme il semble, avant l''accomplissement de vos prophecies
    pedales. Resteroit que je vous advisasse de mes besognes de pardeça, mais n''y ayant esté
    que une nuit encores avec la moitié d''un sombre et melancholique Dimanche, j''en trouveray
    les excuses en vostre discretion, en intention d''en faire sçavoir les nouvelles à mon Pere
    la prochaine fois, apres que la suite de quelques jours m''aura fait ouverture des apparences
    de ce que je pourray proufiter en cette escole, ou au moins je puis juger d''estre le fort
    bienvenu chez des gens qui me sont fort affectionnez et amiables, et avec cela vont en besoigne
    goet Zeeuws, goet ront. Je vous baise bien-humblement les mains comme aussi à mon Pere et
    tout le reste du mesnage, ou Mad.le Forestiere trouvera sa part s''il vous plait.

    De Zierixzee, ce 18e de Mars 1618, en toute haste.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 25-03-1618
