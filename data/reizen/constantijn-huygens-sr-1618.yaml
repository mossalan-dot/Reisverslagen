  tekst: 'Ik heb er maar niets van geschreven, maar ik voelde mij den laatsten tijd niet goed.
    Ik heb een erge zweer aan mijn hiel, daar kwam koorts bij en ik sliep slecht. Maar nu heb
    ik het ding met eene naald doorgestoken en voel mij oneindig veel beter. Ik zou meer willen
    schrijven, maar de bode moet weg.

    Le 8e, stile nouveau, de Juillet, Dimanche, 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 14-07-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Ik ben nu veel beter, al is de wond niet geheeld. ‘Le drole chirurgien qui est un
    homme rude et grossier, au reste empirique, de grande prattique et fort recerché de touts
    costez, m''a si bien livré mon compte devant hier qu''il m''a fallu luy payer 20 schell.
    sterl. d''avance, à moitié besoigne, selon la coustume d''icy de suppler l''autre moitié
    à la fin de la cure, qui feront deux belles livres sterl. pour somme. Voila que c''est de
    tomber entre les mains de cette vilaine race Hippocratique en un païs ou l''argent vole
    à si bon marché. Et encor je ne veux nullement entrer en contestation avec moy mesmes sur
    l''exces de la despence, considerant combien me doibt valoir en païs estrange ma santé que,
    par la grace de Dieu, j''en ay racheptée. Ce que j''ay eu de bon en cette petite affliction,
    c''a esté de me trouver au logis d''un hoste qui, à la verité, n''a nullement dementi sa
    courtoisie ordinaire envers les estrangers en mon endroit, ne manquant presques point de
    me venir veoir luy mesmes touts les jours une ou deux fois en ma chambre, outre la bonne
    charge qu''il en laissoit à ses serviteurs et domestiques, incliné, comme je trouvois, d''un
    soin et commiseration paternelle envers moy. Je ne sçaurois trouver le diable à moitié si
    noir, comme l''on me l''avoit peint, et m''asseure que parmi tant d''aultres je seray l''unique
    presques qui pourray me vanter d''avoir sceu passer et discretement mespriser les caprices
    d''un homme le plus enormement fantasque et facheux de la terre, au contrepoix des courtoisies
    et faveurs dont il a accoustumé d''obliger le monde, ceux principalement de sa nation. Chose,
    à mon advis, fort aisée, si les gents pouvoyent tant soit peu s''accommoder aux humeurs
    de leur hoste. Mais certes un Joncker Barnevelt et ses semblables n''y duisoyent point,
    par quoy il faut peu estimer les rapports que telles gents font tantost de son accueil et
    tantost de son mesnage et traitement. S''il est vray ce que ses serviteurs me content de
    son gouvernement en privé, je seroy insencé de l''approuver. Mais ce sont choses dont il
    ne me chaut nullement pour ce peu de temps que j''y seray; j''accepte par provision en mon
    endroit les courtoisies dont il m''honore, qui m''obligeront à luy en sçavoir gré toute
    ma vie; aille du reste comme voudra, ick woon op een camer.

    Pour vous dire combien à propos je me suis remis sur le pied, vous sçaurez, s''il vous plait,
    que Lundi passé qui fut le 9e stile nouveau, Mons.r de Schoonewalle estant allé en cour
    à Greenwich pour certaines affaires qu''il avoit avec le Lord Chamberlaine, y apprit par
    ordre du Roy, que sa Majesté avoit desseing de l''aller veoir en sa maison icy à Lambeth
    le lendemain Mardi, selon qu''il a accoustumé de faire quasi touts les ans environ la saison
    des cerises meures, pour en venir manger ici au jardin, ou y en a bonne quantité et de son
    goust. Sur quoy Mons.r Caron, revenant donner l''alarme au logis, et ayant mis ordre à toute
    chose, le Roy presques encor le surprit venant de meilleure heure qu''on n''avoit pensé,
    en intention de disner encor à Wimbelton - qui est la maison de Mons.r Cecill apres la mort
    de son pere - et de coucher la nuit à Otland, à quelques 16 ou 17 lieues de la. Voila donc
    comme il vint petitement accompagné, sçvoir du Prince Charles, du Conte d''Arondel, Mylord
    Mongommery, les Marquis de Buckingam et d''Hamelton, trois carosses et quelque vingtaine
    de chevaux, revenant de la chasse. Entré vistement au jardin, il monta sus un cerisier qu''il
    a trouvé bon autrefois, y estant dressé un escalier tapissé à propos. De la en toute haste
    s''en retournant au logis, il fust mené dans la sale en haut ou il prit collation quelque
    quart d''heure, dont apres s''estre pourmené quelque temps à la grande belle galerie à speculer
    aux peintures qui y sont, avant que remonter en carosse, à l''instance de Mons.r Caron il
    s''arresta à recevoir les baisemains de plusieurs gentilshommes estrangers apostez à ceste
    occasion, avec d''autres Flaments, quorum pars ego quotacumque. Comme il estoit à table
    et touts nous autres retirez au bout de la sale, Mons.r Caron l''entretenant prit occasion
    de luy parler de moy - comme il m''avoit promis, desirant qu''en tout evenement je tinsse
    un lut prest - et me faisant approcher de la table, ou il n''y avoit que le Roy et le Prince,
    luy servant à genoux, il luy dit - tout au plus ample - comme j''estois fils du premier
    secretaire de nostre Estat, et qu''au reste j''avois acquis si bonne perfection sur le lut
    qu''il s''asseuroit que sa Majesté, prenant la patience, je pourrois luy donner du contentement.
    Sur quoy - comme il estoit en fort bonne humeur - il fit aussi fort bonne mine, et loua
    beaucoup d''exceller en un si bel art - ce sont à peu pres ses propres paroles - sans toutefois
    estre du mestier, comme Mons.r Caron - à ce que je l''avois prié - luy fit assez entendre
    que ce n''estoit nullement de ma profession. La dessus il dit que, si le temps le permettoit,
    il seroit fort aise d''entendre ce que je scavoye, mais que, pressé qu''on le voyoit, il
    desiroit qu''on le differast pour quand il viendroit à Backshut, qui est le parc et la maison
    dont il a fait present à Mons.r Caron, ou il l''asseurat de coucher le deux ou troisiesme
    jour de son progres qui sera le 20e de ce mois, viel stile, dont apres je vous sçauray à
    conter la ratelée. Entre autres choses il parla du duël de nos voisins à la Haye, et dit
    avoir en sa pochette la copie des cartels; chose ridicule autant qu''estrange, et dont on
    parle drolement par ici. Je desire que mon frere me face un peu participant du resté de
    ces particularitez. Les affaires de Lake iront mieulx que plusieurs n''avoyent esperé, à
    ce qu''il semble. Il va jouer un grand coup de partie, c''est qu''il a procuré en mariage
    à son fils la fille d''un des intimes amis de Mylord Buckingam, l''unique mignon du Roy,
    favorite beaucoup plus encore que jamais ni Somerseth, ni autres ont esté. Par ou je pense
    que Mons.r Carleton ira songer au retour, et desja on me dit qu''il fait estat de partir
    dans quelques 14 ou 15 jours. Personne me s''en asseure, mais je sçay de bonne main qu''il
    avoit commencé à y former les humeurs et la bienveuillance de l''Archevesque de Canterberry,
    qui luy veut du bien et a beaucoup de pouvoir. Mais je desire qu''il ne soit point divulgé,
    comme venant de moy .....

    De Lambeth, ce 4e de Juillet 1618, viel stile.'
- verzender: Constantijn Huygens sr.
  ontvanger: Maurits Huygens (1595-1642)
  datum: 14-07-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: neef-oom
  taal: Frans en Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Ik schrijf u maar niet dikwijls, want gij hoort toch alles uit de brieven aan onze
    ouders. Gij moet mij wat meer van dat duel vertellen. Ik kan nog niet goed eene laars aantrekken
    en ben dus nog niet naar Cambridge en Oxford geweest. Den 20sten van deze maand gaan wij
    naar Bagshot, waar de Koning ook zal zijn.

    ‘Hier je menay de Gheyn veoir la galerie a peintures du feu prince par l''adresse de certains
    gentilshommes anglois qui m''ont grandement obligé. Celle du conte d''Arondel avec les antiquitez
    etc. de Gheyn m''avoit fait veoir par cy devant. Choses admirables en verité. Au reste nous
    voicy au païs le plus gentil du monde ou journellement nous voyons des palais et païsages
    om op clavecingel-dexels te schilderen’. Mijn knecht bevalt mij erg goed; wij spreken samen
    niets dan Engelsch.

    Ce 4e de Juillet 1618. De Lambeth.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 29-07-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Nederlands en Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Uwe brieven heb ik laat gekregen, want ik ben met Brasser en de Gheyn naar Oxford
    geweest, waar wij heel veel gezien hebben door de hulp van een zoon van den president Metkercken,
    dien ik bij Caron aan huis heb leeren kennen. Caron ‘est après à luy procurer quelque bonne
    prebende aupres de sa Maj.té, comme ainsi soit qu''il manque des moyens egaulx à la qualité
    en laquelle il a pleu à Dieu de le faire naistre. Au reste fort bon escolier en theologie,
    maistre es-arts et bien honeste gentilhomme qui nous a grandement obligez par le soing et
    la peine qu''il a prise à nous faire caresser par ces escoliers, comme c''est la coustume
    en ces occasions des festes publiques, specialement envers les estrangers, qui reçoivent
    beaucoup de courtoisie de cette nation’. - Ik hoorde van het huwelijk van onze nicht; ik
    heb er met niemand over gesproken, want Zuerius, zijne vrouw en juffrouw Burlamachi zijn
    niet in Londen. Het zou dwaas geweest zijn van mij, voor dat huwelijk over te komen; er
    is hier nog veel te veel voor mij te leeren en te zien. Ik moet nog naar Cambridge en zou
    gaarne over Vlaanderen terugkeeren. De meeste paleizen van de Koning heb ik nu bekeken.
    Mijne rouwkleeren moeten maar in den Haag gemaakt en mij overgezonden worden; geld voor
    een mantel heb ik niet over Mijne ongesteldheid en mijn reisje naar Oxford hebben mij veel
    gekost; ook is er nog een paard kreupel geworden. Het heen en weer reizen naar en het varen
    in de stad, noodig wegens de groote afstanden, is duur. Ik moet twee paar zijden kousen
    koopen, die hier goedkoop zijn. Waarlijk, ik gooi het niet weg en doe niet als neef Zuerius,
    die zoo maar 8 of 10 paar zijden kousen en even zoovele handschoenen, enz. koopt. Ik zal
    mij later verantwoorden, maar ik hoop, dat mij wat meer geld zal worden gezonden.

    De South-Lambeth, ce 19e de Juillet, viel stile, 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 12-08-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'La haste impourveüe de ce porteur ne me donne point du loisir pour vous respondre
    particulierement. Seulement je suis bien aise de rencontrer cette occasion pour vous advertir
    de ma disposition, qui s''en va de bien en mieulx, graces au bon Dieu qui, en toute apparence,
    me va donner une bonne petite fin à mon voyage, dont les vrays et solides plaisirs m''ont
    esté empechez jusqu''à present par ces premieres facheries. Voici que Mons.r Carleton s''en
    retourne en son royaume, ayant aucunement bien parachevé ses affaires pardeça. J''espere
    qu''on ne prendra pas de mauvaise part que je ne me soye mis de sa compagnie qui n''est
    pas si souhaitable au voyage, comme belle et bonne en apparence. Pour avoir son aise en
    chemin, il ne fault pas l''aller trouver aupres de ces gents la, comme je vous pourroy particulierement
    faire entendre à mon retour. Mon voyage de Cambrige est encor à faire. Hier au soir nous
    sommes revenus de Bagshot, ou nous avons employé la meilleure part de la sepmaine aux plaisirs
    champestres, sans toutefois avoir trouve le Roy, comme desja auparavant nous sçavions bien
    que le project, qu''ils appellent, de son progres estoit changé, tellement que, pour ce
    qui est de moy, il n''y a point d''apparence que je le revoye, dont je ne suis pas grandement
    marri, la perte estant fort petite pour des raisons que je vous pourroy donner à plus de
    loisir. Je me contente fort d''avoir eu l''heur de luy baiser les mains avant son depart,
    et c''est bien assez. Autant en ay fait passez quelques jours au Prince Charles, par bonne
    adresse, à Richemont apres l''avoir veu à la chasse toute une apresdinée, qui estoit le
    plus plaisant jour que j''aye eu en ce païs. Ne reste que la Reine, à laquelle Monsr Caron
    m''a promis de me mener luy mesme avant mon partement, qui sera la conclusion de mes plus
    grands desseings pardeça. Apres quoy j''iray me disposer au retour, esperant que tant pour
    le voyage par la Flandre, que pour les habits de dueil il vous plaira me subministrer la
    provision que, selon le dernier compte que je vous rendis en gros, vous jugerez estre necessaire
    à honestement parachever ce que j''ay bien commencé. Le bon Dieu vous tienne en sa sainte
    protection.

    De South-Lambeth, en extreme haste, ce 2e d''Aoust, viel stile, 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 16-08-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Dimanche passé la haste du porteur me donna si peu de loisir que j''oubliay à vous
    dire, comment passez quelques jours le bon viel Mons.r Calandrin a enterré sa femme à Potney,
    ou il se tient. Depuis ce temps je n''ay pas eu occasion de le veoir, mais me dit on que
    selon sa sagesse coustumiere il suporte fort patiemment l''affliction dont il a pleu à Dieu
    de le visiter en ses vieulx jours. Cesar, son fils, s''est mis avant hier avec l''archivesque
    de Spalato, son maistre confrere, ou il sera bravement à son aise. Hier au soir je receus
    vos dernieres du 6e, qui me donnerent beaucoup de contentement à veoir que, si la despence
    de deça monte un peu haut, au moins ma preud''hommie et fidele sincerité n''est tirée en
    doubte, dont je tacheray par touts moyens à vous rendre satisfaction pleniere. Aujourdhuy,
    comme je croy, Mons.r Caron me rameine à Bagshot, ou il va trouver Mons.r le prince qui
    y est avec toute sa cour en progres. Je ne doubte qu''au retour il se fera donner audience
    aupres de la Reine, qui est à Oteland, ou j''auray occasion de luy faire la reverence. Reste
    le voyage de Cambridge, auquel j''ay destiné quelques 5 ou 6 jours pour en passant veoir
    les palais du Roy et autres lords qui se trouvent en chemin. Cela fait et puis mes habits
    de deuil prests, mes desseings iront se bander vers le Païs bas et ce par la Flandre, comme
    le bon plaisir de mon pere et l''apparence de bonne compagnie me font esperer. Les courtoisies,
    commoditez et adresses que j''ay receues par Carleton n''ont pas esté telles qu''elles me
    puissent allecher de l''accompagner au retour. Je vous feray entendre par bonnes raisons,
    comment il n''a pas subjet de se vanter de beaucoup d''obligation que je luy aye.

    Voici qu''estant en bon train d''escrire, on me vient advertir que Mons.r Caron s''appreste
    au voyage d''icy a une demie heure, qui est de deux heures plus tempre qu''il ne me dit
    hier au soir, par quoy je suis forcé de finir icy. Puisque vous estes resolus de quelque
    voyage en Brabant, je voudroy estre adverti un peu precisement du temps que serez ou à Anvers
    ou à Breda; peut estre que pourroye trouver moyen de vous y rencontrer. De ma santé je vous
    supplie de ne vous donner pas de peine. Ces pustules grosses ne viennent que par boutades
    et ne me donnent pas tant de peur comme de la facherie et douleur. Encor que pour tout cela,
    tout n''est que jeu au prix de ce qu''il a pleu à Dieu de me faire passer.

    Je remercie à mon frere des nouvelles qu''il me mande et les desireroye bien un peu plus
    amples; tout le monde en veult sçavoir de moy, et semble que celuy qui n''en reçoit n''y
    est pas compte. De deça j''en diray à mon pere de bouche si bonne quantité en particulier
    que ce seroit trop pour escrire.

    De South-Lambeth, ce 6e d''Aoust, viel stile, 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 31-08-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Nederlands en Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Dat mijne brieven u niet eerder ter hand gekomen zijn, komt door den tegenwind; de
    heer Carleton, die 12 of 14 dagen om die reden heeft moeten wachten, zal u daarvan meer
    kunnen vertellen. De Koning heeft op hem gevloekt en gescholden, omdat hij zoo gaarne de
    boodschap van den heer de Boissise wilde hooren. Uwe brieven heb ik ontvangen; zij zaten
    in hetzelfde pakket als die van de Staten aan den Koning. Ik zal spoedig terugkeeren, maar
    moet eerst hier mijn voorgenomen reisje maken; alleen reizen in dit land gaat niet en reisgezelschap
    is niet altijd te vinden. Waarschijnlijk ga ik naar Cambridge met een edelman van den Prins
    en naar Vlaanderen met Brasser en den Fries Geldorp. Dat ik de bruiloft in den Haag niet
    heb kunnen bijwonen, spijt mij niets; dat is meer iets voor mijn broer.

    ‘Les nouvelles des cassations à Utrecht et specialement de Ledenbergh m''ont estonné plus
    que ne pourroyent celles d''une montagne transposée; de ce qu''on dit plus grands changements
    estre à la main, nous donne subjet par ici de beaucoup d''estranges conceptions; je prie
    qu''on ne m''en envie pas les nouvelles plus particulieres. En cette ville pour pouvoir
    demander beaucoup - que j''estime estre le debvoir d''un estranger curieux - il faut avoir
    un peu à dire et puis tout le monde s''imagine qu''un fils du secretaire d''estat ne doibt
    rien ignorer, au moins de ce qui se peut sçavoir’.

    Brouart wil mij in alles graag helpen. Ik heb last van bloedzweéren.

    De South-Lambeth, ce 21e d''Aoust, V. stile, 1618.

    De heer Caron laat u groeten. Ik sluit dezen brief in de kamer van Cesare Calandrini ten
    huize van den aartsbisschop van Spalato, bij wien ik van middag heel gezellig gegeten heb.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 17-09-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A mon retour de Bagshot, ou nous avons employé toute la sepmaine passée, je me suis
    estonné de ne trouver de vos lettres au logis. Pour ce qui est des mienes, je m''asseure
    qu''en aurez receuës deux presques à la fois, dont la nonchalance du porteur de la premiere
    a esté cause, comme les dates vous pourront faire croire. La presente va de compagnie avec
    deux pastez de venaison, desquels Mons.r mon hoste vous envoye l''une, et l''autre au greffier
    Aerssens, ayant changé de resolution qu''il avoit prise d''en envoyer deux à Son Exc.ce
    pour des considerations qu''entre autres siens amis je luy ay mises en cervelle. Ce sont
    les quartiers d''un cerf qui a donné de la peine au Roy depuis les dix heures du matin jusqu''aux
    onze du soir, quand finalement, ayant desja deux blessures au corps - l''une de la main
    du Roy - Mons.r le Prince luy bailla le coup mortel avec son arbaleste justement dans le
    coeur, ce grand animal nageant plus de trois quarts d''heure dans un grand vivier, ou il
    se pensa sauver. Dont pourrez conclure, s''il vault la peine d''estre mangé en reverençe
    et attention. Je me souviens avoir promis à Mad.le van Dorp de luy faire manger de la venaison
    d''Angleterre; je vous prie qu''à cette occasion elle en puisse avoir sa part. Estant à
    Bagshot, ou le Roy coucha deux nuits, Mons.r Caron print occasion de ramentevoir à sa Majesté
    ce qu''autrefois il luy avoit parlé en mon regard, avec beaucoup d''autres bonnes recommandations
    en ma faveur. Sur quoy sa Majesté, se resouvenant encor bien de ce que dessus, comme il
    estoit apres à se botter à la chasse, respondit qu''il me desiroit entendre sonner du luth
    à son retour. Mais le bonheur fut qu''un orage de pluie et de vents extraordinaires - qui
    ce jourd-huy semblerent conspirer à rompre les desseings du Roy pour favoriser les miens
    - l''empecherent de sortir, bien que desja il eut le pied dans le portier pour monter en
    carosse. De façon que, retiré dans sa chambre privée, il s''amusa à passer le temps au[x]
    cartes avec son grand mignon le Lord Marquis de Buckingam et quelqu''autre gentilhomme de
    la chambre. Quelques deux heures apres il se souvint de me mander de dedans la chambre de
    Mons.r Caron, lequel en cette occasion desirant specialement me tesmoigner, combien il a
    mon honneur en recommandation, volontairement et sans que mesme je l''en priasse, me favorisa
    de sa conduite à la presence de sa Majesté, où - je ne sçay quo daemone dextro qui m''encouragea
    à faire quelque chose digne de l''oreille d''un grand roy - une petite demie heure je m''acquitay
    si passablement bien que ce prince, naturellement peu adonné à la musique, fut tiré à interrompre
    par diverses fois son jeu à me donner audience, comme il fit fort debonnairement, sans espargner
    ses serments ordinaires, pour m''asseurer du contentement qu''il y prenoit, me faisant mesmes
    l''honneur de parler à moy avec un visage doux et soubsriant. Sur quoy luy ayant baisé la
    main je prins mon congé omni meliore modo, assez esjouï du bon succes de mes petites affaires.
    Excusez moy, si je me forcours puerilement au contentement d''avoir principibus placuisse
    viris. Le Roy desira que Mons.r Caron me menast un jour à la Reine, comme il me promet de
    faire encor cette sepmaine. Je feray, si je puis, ut nec iste segnis eat dies, tanto petitus
    ambitu, tanto datus; c''est une femme qui se voit fort difficilement, et partant m''en donne
    plus d''envie. Par apres je vous en manderay tout le narré, qui fera l''Odyssée.

    Les subits changements de la Republique pardela ne m''ont point estonné, mais estourdi.
    Ce sont choses au dela de m[a ca]pacité; je n''y sçay que dire. Je revere en silence les
    abysmes des jugements de Dieu qui, à mon petit advis, a donné le grand coup à point, et
    comme ex machina. On attend curieusement pardeça quel pelotton ce filet fera attraper.

    De nouvelles de ce païs je suis peu pourveu, n''ayant esté à Londres de 7 ou 8 jours. Le
    Roy dit à Mons.r Caron, comment sont agent Digby en Espagne luy mande que le Roy de dela
    louë et exalte Mess.rs les Estats pour les bons debvoirs que leurs navires de guerre ont
    fait depuis peu sur les Turcqs et pirates. Suivant quoy Sa Maj.té enchargea Mons.r Caron
    d''exhorter ses maistres à continuer en de si bons desseings, luy mesmes estant prest à
    y contribuer ce que desja par ci devant il eut fait sans qu''il eut attendu la resolution
    du Roy d''Espagne, qui pourtant ne semble encores gueres remuër. Vous pourrez estre adverti
    du trespas du cardinal du Perron et puis de celuy de la Nouë qui m''a touché un peu de plus
    pres, m''imaginant d''avoir perdu une bonne adresse en France, ou de prim'' abord je ne
    trouveray pas tant de cognoissances comme en ce païs ici. Je reçois beaucoup d''honneur
    et de courtoisie au logis de Mons.r Cecell. Il m''a donné à disner l''autre jour en une
    siene maison qu''il bastit à Chelseye à quelques deux miles d''ici, avec beaucoup de caresses
    selon sa coutume, dont je luy ay grandes obligations. Mad.e sa femme, qui est une honeste
    dame au parangon de la premiere, m''a promis un present pour ma mere; c''est un voarre (?)
    fait tout expres à touïller du lait et faire du beurre tout à l''heure, dont il[s] font
    grand cas en ce païs; je n''ay point encor veu l''instrument, mais elle m''en enseignera
    tout le mystere.

    Mons.r de Schoonewale s''estonne pourquoy mon pere ne luy replique rien sur les affaires
    de sa nièce et m''a aucunement donné commission de rendre particulierement raison à mon
    pere de son refus, comme celuy qui cognois le gentilhomme à qui il l''a vouée. Je vous rafle
    toute cette rapsodie en haste, nostre messager porte-pasté ne me donnant plus de loisir.
    Je salue de tout mon coeur touts les amis et vous baisant la main demeure .....

    De South-Lambeth, ce 7e de Septembre 1618, viel stile.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 28-09-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Ik kan waarlijk niet eerder terugkomen. Door allerlei omstandigheden is mijne reis
    naar Cambridge uitgesteld tot heden; ik sta klaar om te paard te stijgen en slaap van nacht
    te Theobalds. Binnen 4 of 5 dagen ben ik in Londen terug en dan zal de heer Caron mij de
    Koningin laten zien. Voor mijn vertrek zullen er dus nog 10 of 12 dagen verloopen. Wees
    niet boos wegens dit uitstel; het kan werkelijk niet goed anders. Laat de schoenmaker een
    paar schoenen maken tegen den tijd, dat ik terug ben.

    De Lambeth, ce 18e de Septemb., stile vieux, 1618.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 06-10-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans en Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Door mijne reis naar Cambridge is mijn vorige brief aan u hier blijven liggen. Mijn
    reisgezelschap door Vlaanderen laat mij in den steek; ik zal dus maar den raad van den heer
    Caron volgen en op dezelfde wijze terugkeeren als ik gekomen ben. ‘Aujourdhuy Mons.r Caron
    envoye à Mess.rs les Estats copie translatée des lettres que luy escrivit hier le secretaire
    Naunton par charge de sa Majesté, pour les advertir d''envoyer quelque bon navire de guerre
    à transporter les quatre deputez au Synode, qui desirent y estre quelques 8 ou 10 jours
    devant la besoigne pour se remettre et raffraichir un peu des incommoditez de la mer, n''estants
    - comme escrit ledit secretaire - que soldats d''eau douce, comme on les appelle en Anglois,
    qui ne sçavent la difference d''entre prora et puppis, sinon par livre, et ne sont batteliers
    qu''aux Aeneïdes de Virgile. Tellement que pour moy, en altera quae vehat Argo; je ne sçay
    comment l''occasion me pourroit favoriser d''avantage, si tant est que non de ponte cadit
    quicum sapientia vadit. Outre ce que de se noyer avec la sagesse, ce seroit aucunement se
    noyer sagem[ent] dialectice. Or ces Messieurs n''ont gueres plus de loisir que moy à attendre
    ici. Pour estre en Hollande environ le 20 ou 21e de ce mois, stile nouveau, il faudra que
    le navire soit bientost ici, comme Mons.r Caron aussi le mande avec grande instance. Il
    s''en va en court demain pour leur dire qu''en cas que le vent attendisse trop à favoriser
    nostre navire à monter, il[s] feront bien d''en apprester un de ceux du Roy par provision.
    Voila que vous sçavez la determination de mon retour dilayé jusqu''à present par les resolutions
    irresoluës d''autres, bien que, comme il semble, aucunement à propos.

    En haste de South-Lambeth, ce 26e de Septemb., stile viel, 1618.

    De ces deputez le premier est un evesque, l''autre doyen d''une eglise cathedrale, les deux
    autres docteurs en theologie et chefs de l''Université de Cambridge. Je suis aise que de
    ceux de France Mons.r du Moulin en est, et ne sçay si pour faire cognoissance avec cet honeste
    homme, il vauldroit la peine d''advertir ma cousine Hortence à Dordrecht de tant faire qu''il
    fust logé chez elle, comme je pense qu''il[s] seront accommodez par toute la ville aux meilleures
    maisons, dont on me dit qu''elle en a une. Cela vauldroit tousjours mieux que d''avoir quelque
    Anglois ou aultre qu''elle ne cogneut point. Per aviso.

    Au chemin de Cambridge j''ay couché deux nuits au palais du Conte de Suffolk, n''agueres
    tresorier, ou j''ay receu beaucoup d''honneur qui me vault le voyage de Cambridge. Mons.r
    Caron s''estonne comment on ne luy respond rien touchant son pasté de venaison. Les affaires
    de Mad.le van den Broeck donnent bien meilleure apparence ici depuis peu, que le gentilhomme
    à qui il l''avoit destinée est mort. Toutefois il ne veut rien resoudre sans en avoir veu
    mon advis apres mon retour. Voyez s''il s''asseure de ma suffisance. Ceci desire estre tenu
    un peu secret.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 01-07-1618
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-vader
  taal: Frans en Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Gelukkig ben ik gezond; ziek zijn zou hier ook dubbel onaangenaam en kostbaar zijn,
    omdat ik even ver van Londen af woon als den Haag van Delft ligt. Neef Zuerius is weer beter
    en zal spoedig afreizen. Men raadt mij aan, hier niet in den rouw te gaan.

    ‘Il y a bien du bruit par ici touchant les affaires du povre viel cavalier Sir Walter Rawley,
    à qui les Espaignols veulent la male mort à cause de certaines outrecuidances violentes
    perpetrées par ses gents en S.t Thomé, dont ils l''accusent comme infracteur de la paix.
    L''ambassadeur d''Espaigne, ayant desja prins congé en court, a esté arresté par un poste
    d''Espaigne tout expres devant hier, ayant charge de le ramener, quand il le trouveroit
    en France ou autre part en chemin, et n''y a point de doubte que ce ne soit à cause de ces
    affaires que je viens de dire. L''Espaignol a desja tant gaigné de credit et respect par
    icy qu''il est à craindre que le malheureux viellard n''y laisse la caboche, bien que fractis
    enatet expes navibus, ayant rendu participant de sa ruine une belle partie de la noblesse
    angloise. Il s''attend à Londres d''heure en heure, encor que, peut-estre, desja il y est,
    tachant de se cacher de devant les loups le plus longtemps qu''il pourra. - Sir Thomas Lake
    le secretaire viendra à bout de sa brouillerie, à ce qu''il semble. On a grandement suspecté
    Mons.r Carleton d''avoir voulu briguer l''estat, et desja Mons.r de Schoonewalle à ce matin
    se trouvant en cour fut serieusement demandé par un des fauteurs de Lake, que c''estoit
    qui l''avoit meu à interceder si favorablement pour Mons.r Carleton envers le Roy, à quoy
    toutesfois il m''asseure n''avoir jamais songé’.

    Voor Sipenesse heb ik nog niets van Aquila gehoord, maar de heer Burlamachi zal zijn best
    doen. Spoedig zal ik mijn broeder schrijven.

    ‘Je raffle cecy à onze heures de nuit, ayant esté en ville tout ce jourdhuy avec Mons.r
    Caron, qui s''y est amusé à jouer aux cartes avec ces marchants jusqu''à neuf heures, qui
    est bien sa coutume, encor que son ordinaire soit de perdre tousjours’.

    Ce premier de Juillet, Dimanche. De Lambeth, 1618.

    Deze week zal ik denken aan mijne reis naar Cambridge en Oxford.'
poezie:
- titel: Constantini Huygens in Angliam abituri ad patriam tumultuantem ἀπόταξις’
  dichter: Constantijn Huygens sr.
  datum: 25-05-1618
  locatie: Den Haag
  taal: Latijn
  bron: Huygens 1892, 110-125
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0013.php
  tekst: "Constantini Huygens in Angliam abituri ad patriam tumultuantem ἀπόταξις\n\nEst aliquid\
    \ Patrys considere molliter aruis,\nEst aliquid Patrios usque subire lareîs:\t\nPatria da\
    \ ueniam, non sunt tua gaudia tanti,\nNon facis ad mores seditiosa meos.\nAnglia uicino\
    \ celebris iacet insula Ponto,\nDiues opum dubites an Pietate magis;\nSed Pietate magis.\
    \ Borean date fata secundum,\nHuc iter, huc animum uertimus: Haga Vale.\nHic ego securo\
    \ placidum pede littus, et illa,\nIlla, sed armorum nescia, Regna premam;\nHic ego de Patria\
    \ cupidam narrantibus aurem\nNunc dabo, nunc faciet littera missa fidem;\nHic ego de Patriae\
    \ surgentes funere planctus\n(Mentiar astra duint) eminus aure legam;\nHic ego, fata meos\
    \ maneant quaecumque Batavos,\nVt modo ne Ciuis sim miser, exul ero;\nHic ego Regales, mundi\
    \ miracula, turres,\nHic ego relliquias, Elisabetha, Tuas,\nHic ego Romuleas aequantia marmora\
    \ moles\nPercontante novus lumine suspiciam;\nHic ego Cambrigias porro, mea summa, Camoenas,\n\
    Vota, salutandi sedulus hospes ero.\nHic ego, nunc animo, tum corpore junctus amicis,\n\
    Fundar in amplexus, Caesar amate, tuos.\nIurgia, dissidium, rixae, furor, ira Valete,\n\
    Pax trabeata uale, pugna togata uale.\nAuehor. aura uocat: pacata Britannia salue,\nMagne\
    \ Britannorvm Rex, Iacobe, faue.\n \nHagae. Com. IIXo. Cal. Iun. (25 Mei)."
- titel: Coram rege Britanniae cithara canturus
  dichter: Constantijn Huygens sr.
  datum: september 1618
  locatie: Londen, Engeland
  taal: Latijn
  bron: Huygens 1892, 110-125
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0013.php
  beschrijving: over zijn ontmoeting met Jacobus I
  tekst: 'Coram rege Britanniae cithara canturus

     

    Applicat augustam Regum ter maximus aurem;

    Suggere non solitos, dextra Thalia, modos.

    Quid pauido prodis passu tremebunda? quis iste

    Virgineo subitus funditur ore rubor?

    Regius, agnosco, percellit lumina splendor,

    Torpida praesenti Numine lingua riget.

    Cui tamen ore loqui Batauo datur, ille Britannos

    Desperet faciles in sua verba Deos?'
- titel: Constantinus Huygens ex magna Britannia redux patriam salutat
  dichter: Constantijn Huygens sr.
  datum: september 1618
  locatie: Londen, Engeland
  taal: Latijn
  bron: Huygens 1892, 110-125
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0013.php
  tekst: "Constantinus Huygens ex magna Britannia redux patriam salutat\n\nAnnuit coepto Deus,\
    \ et remotis\nExulem Terris, per aperta salvum\nRura, per siluas Patriae trementem\nIurgia\
    \ vexit.\nAnnuit Sceptri Triados Britannae\nTriplicis Rector; tetigit Batavum\nQuâ nihil\
    \ toto uiget orbe majus\nDextera labrum.\nAnnuit magno soboles Parente,\nCarolus, uix nunc\
    \ minor: annuisti,\nDigna quae tanto sociata regnes,\nAnna, marito.\nAnnuit Patrum uenerandus\
    \ ordo;\nAnnuit vir, puer; annuit puella,\nAnnuit (ne quid morer) onnis uno\nOre Britannus.\n\
    Ecquid ingressum reduci, Penates\nPatry, laetum datis? ecquid olim,\nQui meos in se Batauos\
    \ agebat\nExcidit ardor?\nEcquid ut voces lachrimae rigarunt\nVltimas, voces lachrimae rigabunt\n\
    Denuo primas; madidumque Salue\nPatria poscis?\nEcquid? hem! sat sit. digito labellum.\n\
    Scilicet, ne non liceat cuinis\nQuidlibet, nobis moderante linguam\nLege loquendum est.\n\
    Veritas fuco pia cessit: heu, heu,\nSaeculi mores! Ego, ne quid obstem,\nCedo: quid tecum\
    \ mihi publicarum\nSarcina rerum?\nQuod licet, Te nunc Domus, et mearum\nSumma curarum,\
    \ gemini Parentes,\nCura, censorem renuente liber\nVoce saluto.\nTeque, dilectum caput,\
    \ ac Parentum\nPrima, Mauriti, soboles amorque\nPrimus: et Vos, heu! duplicata quondam\n\
    Turba, Sorores.\nNempe, ne laudem numeri superba\nVindicet Tellus potioris, harum,\nCoelites,\
    \ binas, retinente binas\nOrbe, uocastis.\nSi tamen Coelo (ueniam dolori\nParca fraterno\
    \ dabis) inuidere\nFas sit, ô quidni, Catharina, coelo\nInuidearis?\nBlanda Vestalis species\
    \ pudoris,\nCandidum pectus, pia virgo, sollers\nArtium custos, Catharina, cur te,\nCur\
    \ careamus?\nCorculum Matris, Patriae senectae\nDulce solamen, praeeunte nullo\nDoctior\
    \ doctis, Catharina, cur te,\nCur careamus?\nMel meum, Sappho mea, Gratiarum\nQuarta, Musarum\
    \ soror, obstupentis\nPlasma Naturae, Catharina, cur te,\nCur careamus?\nSed recens cursum\
    \ dolor institutum\nRumpit: excuset miseranda lapsum\nCulpa; maiores minor auocauit\nCausa\
    \ Poëtas.\nTalis incautum memorata Flaccum\nFlexit Europe, tumidos parantem\nAdriae fluctus\
    \ tumido Puellae\nTollere versu.\nTerminum pono lachrimis, et unde\nSoluerat puppis redeo:\
    \ Valete\nPlurimum toto penitus remoti\nOrbe Britanni.\t\nPlurimum salue Pater, atque Mater\n\
    Plurimum; frater, geminae sorores\nPlurimum; salue Domus, Haga salue,\nPatria salue.\n \n\
    Lambethiae. Septemb. Scr. AEger"
- titel: Ad iuventutem Ziricaeam elegia apologetica
  dichter: Constantijn Huygens sr.
  datum: 31-03-1618
  locatie: Zierikzee, Republiek
  taal: Latijn
  bron: Huygens 1892, 110-125
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0013.php
  tekst: "Ad iuventutem Ziricaeam elegia apologetica\n \nCircaei Iuuenes, facibus deuota Cyprinis\n\
    Pectora, par telo saucia turba pari;\nPer geminas Dominae, totidem tua fulmina, stellas,\n\
    Prima pharetrati, quem colis, arma Dei;\nPer Paphiae delubra Deae; per tela, per arcum,\n\
    Cuius in accenso pectore vulnus habes;\nDesine riualem temere commota Batavum\nInnocuique\
    \ dolos subtimuisse viri:\nNon ego Mattiacis obrepsi proditor oris,\nNon ego Circaeis dissimulator\
    \ agris:\nPone metum. spernenda times. impune Batauis\nCreditur, et fraudum nescia turba\
    \ sumus.\nNon Helenam, si qua est, (neque sum Paris) ambio vestram;\nHospity cultor, non\
    \ violator ero.\nNon mihi fallacis plaudo sub imagine voti,\nNon mihi tam grandis vindico\
    \ jura spei:\nMecum habito, et quam sit noui, neque sero, futurum\nVt cadat in casses casta\
    \ Venila meos;\nIlla quidem (et voueo) felicius eliget, olim\nIn mage se dignos introïtura\
    \ toros.\nAudiat interea, quisquis prior ille Procorum\nOccupat aduentum suspicione meum.\n\
    Fallier humanum est; et habet sua quemque caligo,\nNec magis hic tenebris, nec caret iste\
    \ magis:\nNi tamen insignis dementem decipit error,\nNescio quid miseri nomen Amantis habet.\n\
    Non mihimet comperta loquor, sed naufraga saxa,\nNaufragium passo praemonitore, noto.\n\
    Quas dubio lachrimas, quae non suspiria amanti\nMouerit aspectu torua Puella suo?\nQuis\
    \ misero pallor, quis non furor occupat artus,\nSi, sibi postponi quem velit, ille praeit?\n\
    Et tamen has aliquis (quid non mortalia cogis\nCorda, Tyrannorum maxime, parue Puer?)\n\
    Has aliquis risum lacrumas, hos gaudia fletus\nDixerit, Elysios posthabiturus agros.\nViuite\
    \ felices, quibus importuna calenteîs\nFlamma vorat fibras; Me meus ardor agit;\nEn dudum\
    \ Patrys animo procul euehor oris,\t\nIam mare, jam Terras ultima mente lego: \nHesperidum\
    \ hinc Populi, hinc Phoebo subjecta recenti\nRegna manent oculos conspicienda meos;\nParthenopes\
    \ jamnunc avido obuersatur imago,\nEt cinis Impery, perdita Roma, tui;\nEt quae Caesareo\
    \ pares Germania sceptro,\nEt modo faemineâ Gallia quassa manu,\nQuique per Occiduos Tamesis\
    \ deuecte Britannos\nIuncta Colosseo littora Ponte lauas.\nAurea Libertas, quae non lustrabimus\
    \ arua?\nQuanta sub hos oculos, te comitante, cadent!\nAurea Libertas, priscis adamata Batauis,\n\
    Cum socias junxit foedere Roma manus,\nAurea Libertas, superum data munere Terris,\nQuis\
    \ tibi, quis sanus, vincula praetulerit?\nAurea Libertas, Tibi me, voueoque dicoque,\nTu\
    \ quoque ne gressus desere Diua meos.\nCircaei Iuuenes, per me licet esse maritis,\nIte\
    \ sub optatum si volet illa torum;\nSubdite colla jugo, cippo date crura beato,\nNon facit\
    \ ad Batavum calceus iste pedem.\n \nZiricaeae. Prid. Cal. Aprileis (31 Maart)."
