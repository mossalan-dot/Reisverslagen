  tekst: 'In geen tien dagen heb ik iets van huis gehoord. Ik zal rekenschap geven van wat ik
    hier uitvoer.

    ‘Occasionem - neque me spes pristina fefellit - nactus sum commodissiman, hoc est, homuncionem
    loquacissimum, qui nihil non effutire quam quicquam reticere mallet. Itaque apertissimum
    campum minutissimis quibusque quaestiunculis habeo rerum quotidie cum in oppidis, tum ruri
    occurrentium; earum ne qua pene uspiam sit quam ignorem, meum nunc officium est, quo sedulo
    nunc, si unquam, ac serio fungor, conjuncta undequaque et quoad eius fieri potest praxi
    cum theoria, cui rei suavissimus idem hospes atque praeceptor, praeter confabulationum quotidianarum
    copiam, ne qua benevolentiam mihi praecludi suam velle videatur, libros quoque ex bibliotheca,
    quam habet eleganter instructam, quoscumque visum est sufficere non gravatur. Unde nunc
    facile percipis, quos mihi in hoc oppido progressus unus aut alter mensis polliceatur. Ea
    aetate sum, quâ et doceri velle et quaestionibus, ut rudioribus, ita et juvenilibus, tironem
    profiteri supra pudorem posita sunt. Adde, quod ex autoritate barbatorum doctorum insignium
    divortij libellum imberbi ignorantiae nondum misi. Una denique cautela superest, ne praecipiter;
    parum erit commodi incepisse, nisi tempestive absolvimus et, quandoquidem huic homini magisterij
    honorem ultro detulimus, re infecta vel sane non penitus perfecta, ipsins quidem propensam
    animi benevolentiam negligere, propriorum vero progressuum curriculo metam in ipsis carceribus
    ponere, imprudentiae duxerim’.

    Zierixzeae, 8o Cal. Apr. CIƆIƆXVIII.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 11-04-1618
  plaats_verzender: Zierikzee
  land_verzender: NL
  relatie: zoon-vader
  taal: Latijn
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Equidem quo me vertam vix satis exploratum habeo; hine paterni imperij autoritas,
    hine studiorum propositus finis atque ratio animum in diversa distrahunt. Nisi vehementer
    fallor, eo deventum est, ut mihi vel debitae ac devotae parentibus observantiae negligenda
    religio sit, vel commodissimae et - quantum quidem ego prospicio - nunquam posthac rediturae
    occasioni tergum obvertere cum insigni progressuum meorum jactura necessario debeam. Quo
    fidem verbis, colendissime Pater, non gravate habeas, accipe, quo hactenus ordine negotia
    procedunt mea. Decisionum Curiae Hollandiae nuper editarum lectionem perfunctoriam ante
    aliquot dies aggressi sumus ego atque hospellus meus, cui rei animum eo appuli libentius,
    quo vagas istas atque momentaneas confabulationes nostras certa quadam ac, quantum fieri
    posset, ordinata methodo, quasi per locos communes, colligerem. Itaque praeter selectissimarum,
    quae ibi deciduntur, quaestionum copiam fateor effari non posse, me quanto simul cum fructu
    ac voluptate audiam quotidie hunc homuncionem percurrentem atque eblaterantem quicquid usquam
    vel sibi vel alijs in praxi usu venisse meminerit. Parenthesin parenthesi superinducere
    atque huic iterum aliam, adeo ut, cum ad finem veneris, qua principio de re sermo institutus
    sit, nisi per anacephalaeosin retrogradam recordari aegre possis, inter praecipuos rhetoricae
    Hubertinae flores est. Ex tumultuarijs interim hisce lectionibus, ad quas ego nisi praemeditatus
    et minutissimis quibusque rerum apicibus perpensis atque examinatis non accedo, arbitrari
    tute non ncommode potes, quid lucri, quanta [cu]m animi delectatione, sedulus non modo auditor,
    sed et percontator assidue importunus, percipiam. Potes idem ex animo metiri tuo, quam parum
    bene de studijs ac progressibus meis meriturus sit, qui hisce me delicijs tam utilibus,
    tam fructuosis, tam necessarijs invitum eripuerit. At vero hic in scirpo nodus latet; non
    expedit nimirum uni sese homini tam arcto obligationis vinculo devincire. Fateor ingenue,
    et me, qui lixae vel caloni acceptum non invitus tulerim quidquid erudiendo mihi conferre
    possit, nescio quid movet, cur huic minus garrulo quam ulli obligatus esse velim. Itaque
    dum omnibus in unum coactis co[pii]s serio mecum expendo, qua tandem re, si non solvere
    penitus me [ho]cce meritorum atque officiorum nexu, certe demereri hominem aliquatenus valerem,
    commodum sese mihi obtulit ipse, majorem in modum obtestatus, ut sibi in rebus arithmeticis
    - quarum ille et plane ignarus, et quotidie quantum indigeat experitur - operam meam successivis
    horis commodare vellem. Subrisi tacitus, quasi quam opportune occupatus, acceptaque conditione
    omne illi studium atque diligentiam ilico detuli. Ita nunc absolutis singulis lectionibus
    iuridicis arithmeticam ipse praeceptori meo rependo et, quandoquidem recentior posteriorum
    solet esse recordatio, non unquam e musaeo ipsius decedo nisi cumulatissimis gratiarum actionibus
    onustus; nam de priori lectione ne mentio quidem; tanto arithmeticas numerationes non studio
    tantum, sed et admiratione ad stuporem usque prosequitur. Haec ego apud te pluribus verbis,
    pater colendissime, familiariter edissero, quo nemnpe quicquid illud est perperam de obligatione
    nimia conceptae opinionis, auferam magis quam impugnem. Neque id eo tamen, quo consilij
    atque decreti tui de reditu meo autoritatem subterfugiam; nullo mehercule modo. Quin si,
    omnibus quae modo retuli expensis, revocandum nihilominus duxeris, protinus equidem, quanti
    apud me imperia sint tua, re ipsa comprobabo. Et quidem jam inde ab ipso eo momento, quo
    mihi literae vestrae redditae sunt, domuitionem apparo, nihil promoturus tamen antequam
    consilij vestri certior iterum factus sim, quod te aequi bonique ut consulas, etiam atque
    etiam rogo. Vale.

    Ziericaeae, 3o Id. Apr. 1618.'
