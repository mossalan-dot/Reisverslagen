  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Depuis ma premiere que je vous envoyay de Gravesende je n''ay point eu nulle commodité
    pour vous faire entendre de mes nouvelles. De huit jours que j''ay esté en Angleterre à
    peine m''en suis-je trouvé trois à Londres, ayant continuellement suivi Mons.r Carleton
    par le païs, ou il a esté trouver le Roy en une de ses maisons royales, dite Tibbalts, qui
    est un des superbes palais de l''Angleterre, ou j''ay eu moyen de veoir le Roy et la cour
    fort à mon aise. Cependant Mons.r Caron a esté se jouer aux champs avec quelques uns de
    nos gentilshommes flamens dans un sien parcq que luy a donné le Roy pour sa vie. De façon
    que luy estant sorti d''un costé de la ville et moy de l''autre, je n''ay point eu occasion
    de le veoir qu''hier au matin qu''il est venu saluer Mons.r Carleton. Il m''a fort courtoisement
    receu et fait offre de son logis, me disant que desja il avoit fait apprester ma chambre,
    entendant que j''estoy arrivé. Tellement que mon desseing est de l''aller trouver d''icy
    en un jour ou deux, apres que je seroy de retour de Greenwich, ou je m''en vay accompagner
    Mons.r Carleton pour encor mieux veoir la cour et ce qui en depend, le Roy y estant revenu.
    A ce que l''un et l''autre me preadvertit, j''auray bientost mon saoul du mesnage de Caron;
    je ne sçay ce qui en est, il faut l''aller essayer. Ce sera bien la moindre despence d''avoir
    ma table franche, car à dire la verité, je ne sçauray trouver qu''il face si bon marché
    vivre par deça comme en Hollande à la moitié pres, comme vous pourra bien dire mon cousin
    Zuerius, qui a esté se pourmener par le païs. Je n''ay encor guere fait de despense de bouche,
    à cause que j''ay esté tousjours avec Mons.r Carleton, soit au païs, ou en sa maison. Ces
    honestes gents m''ont grandement obligé de me faire l''honneur de leur table et conversation
    si longtemps. Ils ont cette bonne grace angloise de tenir un peu leur reputation et se faire
    respecter, mais je suppose volontiers l''un pour l''autre, encor que de vray il me semble
    qu''il sera temps desormais de les quitter. Le mal est que chez Caron je n''auray pas tant
    de loisir d''apprendre l''Anglois comme de chez eux, et puis son logis est fort esloigné
    de la ville. De Gheyn a mieux choisi de se mettre à table chez un bourgeois de Londres,
    ou il ne sçauroit parler autre que l''Anglois. Je feray tant d''escapades en ville hors
    du couvent de Caron, que ce fantasque abbé me voudra aucunement permettre. Entre temps,
    Dieu merci, je me porte tousjours bien, voire mieux qu''au Païs bas. L''air est fort doux
    icy et me fait continuellement bon appetit. J''ai esté veoir Mons.r Calandrin devant hier
    en sa maison champestre à Potney, qui est un gentil village à quelques 4 ou 5 lieues d''icy.
    L''honeste viellard m''a fait extremement bon accueil et a receu la lettre de mon pere avec
    tant de contentement qu''il ne se peut empecher de la baiser. Il desire que je luy vienne
    faire compagnie quatre ou cinq jours, qui seroit autant de temps perdu pour ce qui est de
    mon advancement en la langue, à quoy je vise specialement. Cesar s''en vient demeurer en
    ville avec l''Archevesque de Spalato, son symmista, qui est en grand honneur par deça avec
    plus de 800 livres sterlinex de revenu. Cesar aura sa table et sa demeure chez luy, qui
    est à l''hostel de Savoye, une belle et magnifique demeure sur la riviere. La Ravoire, nostre
    Savoyard, luy sert de maistre d''hostel et n''arriva jamais mieux à point. C''est une estrange
    vie ecclesiastique que ces messieurs meinent par ici. Des nopces de Brouard mon cousin Zuerius
    vous en sçaura dire tout plein de nouvelles; il m''a recognu des aussitost qu''il m''a veu,
    mais il avoit esté aucunement averti de ma venue. Je desire grandement d''entendre, comment
    il va de ma povre soeur Catherine que j''ay quitté avec beaucoup de regret. Et puis des
    affaires de religion pardela, car chascun le veut sçavoir de moy. Quand mon frere et mes
    soeurs m''auront escrit et que je seray asseuré de demeure, commejusqu''a present je ne
    le suis pas, changeant de logis presques toutes les nuits, je leur feray responce à chascun
    .....

    De Londres en Westmunstre, ce 6e de Juin, viel stile, 1618.

    Les lettres qu''on voudra m''envoyer il sera bon de les faire tenir au logis de Mons.r Caron.
    Je baise humblement les mains à touts les amis.'
- verzender: Constantijn Huygens sr.
  ontvanger: Christiaan Huygens (1551-1624)
