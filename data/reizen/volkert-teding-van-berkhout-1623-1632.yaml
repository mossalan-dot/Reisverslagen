beschrijving: Was in 1623 edelman in het gevolg van Charles de Lorraine (1571-1640), hertog
  van Guise. Maakte rond 1623-1627 een educatiereis naar Italië en werd benoemd tot consul van
  de Natio Germanica in Siena. Werd tot Maltezer ridder geslagen. Werd na een fataal duel met
  Adriaan van Vrijburch (†1628) gemeden door zijn familie en probeerde vanuit Italië zijn naam
  te zuiveren. Koos voor een militaire carrière en werd lijfcornet in een ruiterregiment. Stierf,
  waarschijnlijk ten gevolge aan een infectie, na de Slag om Neurenberg in 1632.
