  tekst: 'A la Haye le 28 d'' Oct. 1655.

    Mon Frere,


    Par le dernier ordinaire je n''ay rien eu de vous ny du frere Louis et ay este obligé de
    me contenter des nouvelles generales de la famille. Mes airs ne viennent pas non plus, qui
    est chose moult desraisonnable; car je scay bien que je n''auois pas esté si long temps
    à Paris que je n''en eusse desja fait provision de quelques uns. Je vous feray le souhait
    du Sieur Tassin, Dieu vous amende. J''ay receu ces jours passés une lettre du Sieur Kalthoven
    qui me prie d''auoir patience encore pour quinze jours, me promettant que des qu''il sera
    de retour d''un petit voyage qu''il est obligé d''aller faire sa premiere besogne sera de
    nous faire une forme comme je l''ay demandée. Je ne me haste pas par ce que je ne croy pas
    de rien faire que vous ne soyez de retour. Vogelaer m''importune tousjours pour avoir une
    longue lunette; et j''ay resolu de luy en faire faire une de ce verre de dix pieds que j''ay
    encore en reserve et qui est raisonnablement bon. Le Poleiser m''a esté voir ces jours,
    il ne fait rien d''importance, mais il est apres à inventer un instrument pour tourner les
    formes de fer de telle longueur il luy plaira, lequel comme il me le descrivit sera subject
    a beaucoup d''inconvenients, il seroit trop long de vous en donner la description, et mon
    pere me presse pour avoir cette lettre. Du Cousin Huygens nous n''attendons pas encore chose
    d''importance si ce n''est qu''il est à Anvers avec sa bien aymée et se pourmene cà et là
    disant qu''il a desja esté marié quelque temps et vient pour se divertir. La Tante Huygens
    a escrit une lettre assez picquante à Bergaigne et ce de l''advis des parents d''icy et
    de mon Pere; sans que je voys pourtant à quoy cela servira si ce n''est pour le faire enrager.
    Van Ruyven et Messing receurent hier sentence le premier de bannissement pour dix ans, l''autre
    pour toute sa vie. Tant que je puis voir vous ne serez pas tout l''hiver en France pour
    chose que puisse dire l''oncle Doublet; ces billets de huict cent francs l''incommodent
    trop, comme sans doubte il ne s''en cache pas a vous, non plus qu''a moy qui ay ma part
    des presches de menage. Adieu.


    Pour mon frere Chrestien.'
- verzender: Christiaan Huygens
