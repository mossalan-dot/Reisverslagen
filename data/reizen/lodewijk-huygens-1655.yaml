  tekst: '22 Sept. 1655.

    Mon frere,


    Depuis vostre derniere de Tours je n''ay rien eu de vous. Quand vous serez de retour a Paris,
    il faut que nous establissions nostre correspondence un peu mieux. Des que vous y serez
    j''ay deux choses a vous requerir. La premiere est de scauoir un peu ce qu''est devenue
    Mademoiselle Mouchon, ou elle demeure, et quelle vie elle fait. Tassin vous enseignera le
    logis, et je m''asseure que je ne suis pas encore si fort hors de son souvenir qu''elle
    ne soit bien aise d''entendre parler de moy. La seconde priere est, qu''il vous plaise me
    receuillir quelques petits airs nouveaux et gays tels comme les filles les ayment les plus,
    car c''est pour cette sorte d''animaulx que je les demande. depuis environ un mois j''ay
    fait connoissance avec des demoiselles Angloises dont vous ne connoissez apparemment pas
    le nom, et j''y vay assez souvent en partie pour la conversation, partie afin que je ne
    mente point, pour fortifier mon Anglois que j''apprens de Doctor Cate depuis quinze jours.
    Ces creatures la ne me laissent point en paix et a tout moment me demandent des nouvelles
    chansons comme si j''en faisois moymesme, ou qu''il en creût dans nostre jardin; en sorte
    que je me suis engagé de leur en procurer par vostre moyen. Si le frere Louis estoit homme
    de musique je scay bien qu''il seroit ravy d''obliger des beautés Angloises. Raillerie a
    part si vous pouvez m''en trouver quelques unes je vous en scauray beaucoup de gré. La nuict
    du Samedy passé l''on a mis en prison le Sieur van Ruijven avec Mademoiselle sa semme, et
    un certain garçon qui servoit de Clercq au Pensionaire de Wit et tenoit soubs luy het Register
    vande Secrete Resolutien. On accuse ce dernier d''auoir descouvert et subministré quelques
    unes de ces secrettes resolutions au premier, lequel en suite les auroit envoyées à ceux
    de la Province de Frise dont il se qualisie Agent, et au Prince Guillaume de Nassau, qui
    est maintenant icy. On dit que l''affaire a esté descouverte sur ce que ledit Prince dans
    un discours se seroit plaint de quelque chose qui auroit esté dite et faite contre luy dans
    l''Hollande, laquelle ces Messieurs croyoyent estre tres-secrette, et que d''abord ils soupçonnerent
    ce Clerq, lequel incontinent advoua le tout, et noircit en mesme temps van Ruijven. Ce serviteur
    du Pensionaire selon toute apparence n''en sera pas quite a moins de recevoir quelque grand
    et notable desplaisir en sa personne, mais van Ruijven ne court pas le mesme hasard. Madame
    de Treslong est malade a l''extremité. Le Cousin Huygens est a Bolduc depuis quelques quinze
    jours pour attendre sa mere qui vient de Spa et est tombée malade a Maestricht; il loge
    chez le Cousin Bergaigne et y fait comme par tout ailleurs, le diable à quatre. Ie vous
    prie de me mander si a Paris vous n''avez pas veu quelque piece de nostre mestier des lunettes
    d''approche. Adieu.


    A la Haye le 23 Sept. 1655.'
- verzender: Christiaan Huygens
