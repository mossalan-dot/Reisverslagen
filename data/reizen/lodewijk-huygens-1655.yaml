  tekst: 'A la Haye, le 12 d''Aoust 1655.


    Mon frere


    J''en ay receu une de vous il y a huict jours, et hier il m''en vint une du Frere Louis.
    Je ne puis m''estonner assez pourquoy en courant toutes les maisons des Seigneurs vous n''avez
    pas daigné d''une seule visite l''hostel de Mouchon et la dame laquelle y fait sa demeure
    ordinaire. Si tant est qu''elle se treuve encore en vie et son mesnage sur pied, c''est
    bien une grande mesprise à vous autres de n''y avoir pas pris vostre logement plus tost
    que chez Monglas ou lon ne manque jamais nombre de Flamands et de noblesse Allemande, la
    ou chez l''autre vous eussiez eu le voysinage le plus joly du monde, maer ''t kuycken wil
    altoos wijser wesen als ''t eij. Au moins en ma consideration ayez s''il vous plaist la
    curiosité de scavoir, quand ce ne seroit que du Sieur Tassin qui connoit bien Ma dite Demoiselle,
    ce qu''elle est devenue depuis trois quatre ans que je n''en ay point ouy parler. Mon voyage
    de Brabant a esté parfaitement divertissant, et lon nous a fait grand acceuil par tout comme
    sans doubte Mon Pere qui est si satisfait de la Reine de Suede qu''il a de la peine a s''en
    taire, vous aura desja mandé. Chez Mademoiselle de Lorraine surtout nous avons esté tresbien
    receus. La princesse sa fille, est devenue fort grande, elle a beaucoup d''esprit et je
    n''ay guere veu de filles mieux eslevées qu''elle. A Anvers j''estois pour faire la plus
    jolie fortune du monde s''il ne nous eust fallu partir le lendemain. Une dame Angloise m''ayant
    appellée à elle dans une Eglise ou nous nous pourmenions par hasard et commancant d''abord
    a me parler d''amour quoy qu''en des termes ambigues. C''estoit une femme de condition et
    fort jolie. Je ne l''avois veue qu''une seule fois dans une maison ou nous entendions musique
    sans pourtant m''y attacher aucunement. Le conte n''est pas assez important pour en faire
    le recit au long. Phlip m''a defendu de vous mander des nouvelles, disant qu''il avoit tout
    escrit.


    Les Pensionnaires Rixen et Moons de Purmerend et de Rotterdam sont touts deux devenus Conseillers
    au grand Conseil, et mon pere me presse pour avoir cette lettre. Mandez moy un peu si vous
    n''avez point rencontré de faiseurs de lunettes d''approche ou des observateurs et far wel.


    Pour Mon frere Chrestien.'
- verzender: Constantijn Huygens jr. (1628-1697)
