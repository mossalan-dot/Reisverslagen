  tekst: 'A la Haye le 2 de Sept. 1655.

    Mon Frere


    Ne m''ayant escrit qu''une seule lettre vous avez tort de m''accuser de negligence, car
    je vous ay respondu esperant que ma response vous trouveroit encore a Paris. Depuis que
    vous estes partis dela ma foy j''avois fait dessein de ne vous point escrire jusques a ce
    que vous fussiez de retour, dans la crainte que j''avois que mes lettres ne s''esgarassent
    ou bien ne vous fussent rendues que fort vieilles. Mais voyant que vous prenez le tour si
    long, j''ay changé d''advis de peur de vous laisser sans de nos nouvelles. J''escris pourtant
    cecy dans une haste extreme. Belieft den slechten stijl te excuseren.


    Pour ce qui est des lunettes, j''ay a vous dire que je n''ay fait aucune nouvelle observation
    depuis. Mars n''est point en estat de pouvoir estre veu avec des cornes comme vous pouvez
    scavoir. et Venus je ne l''ay point veue de long temps a cause qu''il a tousjours fait mauvais
    temps, et quand il a fait beau je n''ay point fait d''observation ayant esté la plus part
    du temps en voyage. pour Jupiter je l''ay consideré souvent, le soir vers les 10 ou 11 heures
    et parfois a 4 du matin, et j''ay remarqué que le regardant le soir je n''e m''ay jamais
    pu appercevoir de la ligne qui est au milieu, par ce que les vapeurs de la terre m''en empeschoyent,
    mais le matin quand il estoit plus vertical je l''ay veue tres-distinctement. Quand vous
    serez a Paris je vous envoyeray un desseing de mon observation. Il y a au milieu ou un peu
    plus vers en hault une ligne claire et des deux costés dicelle deux autres noires qui la
    bornent. Pain et Vin a envoyé des eschantillons de verre qui sont bien beaux mais non pas
    meilleurs pourtant que nos meilleurs verres convexes. Vous les verrez a vostre retour. Je
    n''ay point eu de response de Kolvius ny de Kalthoven. Aussi je ne scay pas s''il sera fort
    expedient que je travaille avant que vous soyez de retour. en beaucoup de choses je commence
    a ressentir l''incommodité de vostre absence. Van Wijck tourne luy mesme des formes de fer
    a ce que m''a dit mon Pere, je l''iray voir au premier jour, je pense que ce ne sera rien
    qui vaille. Les Cousines Zuerius sont encores icy mais s''en vont lundy prochain. Monsieur
    de Brederode est encore fort mal et on ne croit pas qu''il la face fort longue. On dit que
    soubs main le Prince de Tarente brigue desja sa charge de Mareschal de Camp. Monsieur d''Opdam
    s''en va avec une flotte de 16 vaisseaux dans l''Oostzee. Mademoiselle d''Osmael se devoit
    marier avec le Dyckgraef van der Hoeven a Delft, mais les enfants du premier lict ont controuvé
    tant d''obstacles qu''il semble que l''affaire est et demeurera au croc. Dans la haste ou
    je suis je ne trouve plus rien a vous mander. Adieu.'
- verzender: Constantijn Huygens jr. (1628-1697)
