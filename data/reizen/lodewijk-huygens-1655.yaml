  tekst: 'Mon frere


    Quand j''escris cecy l''ordinaire n''est pas encore arrivé. c''est pourquoy je ne scay si
    vous m''aurez escrit ou non cette semaine et donné satisfaction touchant les deux choses
    que j''avois desirees de vous, scavoir de vouloir enquerir touchant la Mouchon, et de m''envoyer
    quelques petits airs. Quelle est la petite soeur de Ma bonne hostesse dont vous me parlez,
    c''est que je ne scaurois m''imaginer, car lors de mon temps si je ne me trompe fort elle
    n''auoit point de soeur au monde. Je m''imagine que la fille que vous aurez veue aura este
    la Manon qui est sa soeur de laict, et en ce temps la quoy que vous puissiez dire n''estoit
    pas tout a fait desagreable mais d''ordinaire un peu sale. Si vous voyez la Mouchon je vous
    prie de luy demander quelles personnes y sont encore en pension de ceux qui y estoyent en
    mon temps. Je vous envoye un dessein de Jupiter, qui le represente tel comme je l''ay veu
    ces mois passez plus d''une fois, et encore qu''il faille estre accoustumé a se servir de
    la lunette pour bien pouvoir discerner ces lignes, si est ce que je suis bien asseuré que
    je ne me suis pas trompé. Je voudrois bien que fussiez de retour pour pouvoir travailler
    ensemble. J''ay encore escrit a Colvius et a Kalthoven pour une nouvelle forme, laquelle
    le dernier m''a promis de faire s''excusant de ce qu''il ne s''estoit pas acquitté plustost
    de sa promesse sur ce qu''il croyoit que j''estois en France. Si je ne me trompe ils nous
    prennent l''un pour l''autre, mais cela n''importe point. Je ne toucheray pourtant point
    a la forme que uous ne soyez icy, car pour faire des lunettes de 20. pieds nous aurons a
    quoy nous occuper touts deux. Je luy ay mandé d''envoyer la modelle de Cuivre avec la forme
    pour la pouvoir d''autant mieux perfectionner. Je croyois d''escrire une lettre en Anglois
    au Frere, mais le temps m''est eschappé, Doctor Cate estant venu et demeuré plus tard que
    d''ordinaire; ce sera pour l''ordinaire prochain. Nous ne scavons encore pas ce qu''est
    devenu le Cousin Huygens ny mesme fort bien s''il n''est point derechef avec sa mere. Jaques
    Zuerius fils aisné de la Cousine Zuerius a Amsterdam a fait le mesme tour et s''en est alle
    voir le monde sans dire Adieu. Van Ruyven et son compagnon sont tousjours en prison, mais
    en sortiront bien tost sans que probablement on leur fera grand mal, aumoins le premier.
    Le Cousin Jacob de Boisleduc a sollicité icy pour son frere pour l''avoir Eschevin cette
    année mais l''affaire n''est point reussie. Adieu.


    Je vous prie souvenez vous des chansons.


    Pour mon frere Chrestien.'
- verzender: Christiaan Huygens
