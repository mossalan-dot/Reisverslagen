  tekst: "A Paris le 6 Aug. 1655.\nMonsieur mon Pere.\n\nN'ayant jusqu'icy receu aucune lettre\
    \ de vous je m'imagine que les nostres ne vous auront esté rendues que bien tard, et qu'on\
    \ les aura gardé à la Haye jusques à vostre retour. Mon Cousin Eiberghe dans les dernieres\
    \ qu'il escrit à son fils mande que vous estiez revenu avecq mon oncle de S. Annelant du\
    \ voyage de Zeelhem, et que vous estiez demeurè à Zuylichem, c'est tout ce que j'ay pu apprendre.\
    \ j'espere que vous serez maintenant à la Haye. Nous venons de faire une petite course aux\
    \ environs de cette ville estans conseille de ne laisser passer la belle saison sans voir\
    \ une partie des belles maisons qui s'y trouvent en grand nombre. en effect si nous l'avions\
    \ differè jusqu'a nostre retour nous y eussions rencontrè plus de difficultè à cause des\
    \ chemins gastez qui ne sont que trop mauvais mesme en ce temps icy. avecq cela les jours\
    \ fussent devenus plus courts, et les jardins moins beaux. Celuy de Liancourt est merveilleux\
    \ pour l'abondance et diversitè de Fontaines, la beautè du plantage, et de ce qu'il est\
    \ si proprement entretenu que nostre Hofwijck ne le scauroit estre d'avantage. Il s'en saut\
    \ beaucoup que fontainebleau ne le soit pas tant quant a ce dernier point mais au reste\
    \ il me semble plus plaisant et est sans doute beaucoup plus magnifique. Outre ces deux\
    \ lieux nous avons veu Escouen, Chantilly, Verneuil, le Chasteau de Creil Fresne, Monceaux,\
    \ Colommiers et Petit bourg, des quels non plus que de ces autres je ne m'arresteray pas\
    \ à vous faire la description. parce qu'il me semble qu'il n'y a que la veue qui en puisse\
    \ donner une impression assez belle. Pour des bastiments il n'y en a point ny dehors ny\
    \ dedans la ville qui à mon advis vaille l'hostel d'Orleans ny pour le dedans et pour l'ameublement\
    \ qui soit à comparer au Palais Cardinal. C'est icy un tresor inestimable de belles choses,\
    \ à scavoir statues antiques beaux tableaux, riche tapisserie, tables de pierre precieuse\
    \ et cabinets dont il y en à une infinitè. I'ay estè voir Monsieur la Bare, qui m'a fait\
    \ fort bon accueil, et jouè devant moy de ses fantaisies, d'une maniere fort agreable. Tassin\
    \ m'a aussi promis de me mener chez Monsieur de Chamboniere, mais je veux differer les visites\
    \ jusqu' àpres nostre voyage d'Angiers. Cependant je n'ay peu m'empescher d'aller chercher\
    \ quelquesuns des fameux Mathematiciens, desquels j'ay veu Gassendi et Bullialdus. Cettuicy\
    \ ma fait voir la biblioteque du roy et mesne auprez Monsieur du Puis, qui m'a fait la faveur\
    \ de me monster encore la siene et son cabinet. Il demeure dans la maison ou est la bibliotheque\
    \ royale, et c'est la que s'assemblent tous les jours les illustres. Devant que d'entreprendre\
    \ le voyage vers la Loire nous attendrons vostre responce parce qu'il faudra encore quelque\
    \ lettre de change. Mais je croy que mon frère vous aura escrit plus amplement touchant\
    \ cecij, c'est pourquoy je vous prieray seulement de nous l'accorder et de croire que tout\
    \ ne sera employe qu'en depence necessaire.\n\nJe suis \nC.H."
- verzender: Constantijn Huygens jr. (1628-1697)
