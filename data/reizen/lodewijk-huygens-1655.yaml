  tekst: 'Sommaire

    24. Retour par Tours. lettres. Lettre de change. retourner. Aemon, la Bare, Conrart, du
    Mont, pour voir les illustres, gens de condition. Beringhen. Premier Presche. la Cour. Gassendi
    mort. Lambert, Chamboniere. Hotteman, Gaultier 1er. d''Osmael, Peste, Petit, Brederode,
    Pension, van Wijck.


    Monsieur Mon Pere.


    Samedi dernier nous achevasmes nostre voyage, ayant pris le chemin par Tours, à cause que
    le messager de Poictiers a Orleans n''estoit pas encore prest a partir. entre Tours et Paris
    nous avons passè à Vendosme et Chartres, qui n''est pas de moindres villes que nous avons
    veu. En arrivant nous trouvasmes vostre lettre du 2e. qui nous apprit le bon estat de vostre
    santè et de toute la famille. J''espere que Dieu l''y voudra maintenir. et vous asseure
    que le triste voysinage me fait peur. Par ce dernier ordinaire n''ayant rien receu de vostre
    part j''ay pensè que vous pouviez avoir quite la Haije, pour eviter la contagion qui possible
    se seroit estendue jusques la. Mais ou que vous soyez mon Pere je vous prie de vous souvenir
    de nous, et de ce qu''il nous faut pour pouvoir subsister en cette ville. Je vous l''ay
    escrit de Nantes et mon frere encore depuis, que ce que nous avions d''argent a peine suffiroit
    pour nous ramener à Paris et il me semble que comme il est tresvraij aussi est il bien croyable
    que nous ayons depensè chacun 300 francs à faire ce voyage de plus de 5 sepmaines, y estant
    encore compris ce que nous ont emportè les lettres de licence. J''espere qu''au prochain
    ordinaire nous trouverons de quoy nous consoler car à moins de cela nous serons reduits
    à passer fort mal nostre temps. Mon cousin Doublet receut une lettre de change pour luy
    en particulier a nostre arrivée, laquelle encore ne le contente encore gueres, en sorte
    que, quand bien nous l''en rechercherions je ne pense pas qu''il nous en voudroit faire
    part. Nous l''avons laissè chez Monglas et nous sommes mis en pension dans une maison qui
    est sur le quay vis à vis celuy de la Megisserie, tant pour nous separer et defaire de la
    compagnie de Flamans dont il en estoit venu encore la quelques uns, que pour estre à un
    peu meilleur marchè. Il y a 4 Gentilhommes Gascons logez ceans fort honnestes gens, et parmy
    les quels il y en a un qui joue fort bien du luth. Cettuy cy m''a menè chez Monsieur Emon
    qui me fit entendre les pieces que Monsieur du Mont vous à fait avoir de sa facon et d''autres
    fort jolies, Il joue d''une fort belle maniere. et ne cede guere a Gautier à ce que l''on
    m''asseure. Hier nous fusmes avecq le bon homme Tassin à chercher Monsieur du Mont, qui
    demeure a l''autre bout de la ville proche de la Bastille; et ce a beau pied et ne le trouvasmes
    pas chez luy. Encore chez Monsieur Conrard ou nous eusmes pareille fortune. de la chez la
    Barre, qui estoit aussi sorty, mais le plus jeune de ses fils y survint, avecq qui je fis
    connoissance et le fis jouer des pieces de sa composition sur la Teorbe qui n''estoyent
    pas mauvaises. Il y en a un bon nombre d''Illustres dans ce metier les quels il me semble
    necessaire que je voye, comme Chamboniere, Lambert, Hotteman, Constantin du Faut, Gauttier,
    Pinel, Gobert. Voyla des noms que j''ay dans mes Tablettes, et si je ne puis les voir tous
    j''en verray ceux que je pourraij. Mon aisné estoit heureux en ce qu''il avoit le bon Cincler
    qui le conduisoit et donnoit des adresses par tout, Avecq Tassin il n''y a rien a faire;
    il n''a que la bonne volontè. la Cour est a Fontainebleau et monsieur le Premier de mesme;
    l''on dit que elle ne reviendra que dans quinze jours. Apres qu''elle sera revenue je ne
    me soucieray pas beaucoup de rester longtemps icy. car certainement je voy que l''on n''ij
    scauroit estre avecq quelque contentement sans une estrange despense, et à la quelle j''aurois
    trop de peine à vous faire consentir. Aussi bien a ce que j''ay pu conclurre et des vos
    lettres et des dernieres de mon oncle Doublet vous nous rappellerez encore devant l''hyver,
    en sorte que je commence deja à penser quelle route nous devrons prendre pour revenir. Ce
    qu''il vous a plu de me escrire des observations de van Wijck je doubte fort que ce ne soyent
    des visions, comme il m''en à debitè fort souvent. Il faut que je viene pour examiner ce
    qui en est de ces bravades. car si on le laisse faire, a la fin tout ne sera que envers.
    Je ne recus vostre lettre qui m''apprit du mariage de mademoiselle Dosmael que longtemps
    apres que j''estois revenu de Saumur, tellement que je n''ay que faire de faire scavoir
    ce qui en est arrivè depuis a ces messieurs. Pour moy je luy souhaite meilleure fortune
    que d''avoir un mary qui soit fait comme M. le Dyckgrave. Depuis peu de jours est decedè
    M. Gassendi a mon grand regret. j''appris pareille nouvelle de monsieur de Brederode en
    arrivant dans cette ville. ayez la bontè de nous informer de ce qui s''est passè depuis.
    et suis en attente d''apprendre comment on aura disposè de ses charges. Je suis.'
- verzender: Christiaan Huygens
