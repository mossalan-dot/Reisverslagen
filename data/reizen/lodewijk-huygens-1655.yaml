  tekst: 'Mon Frère.

    A Paris le 29 Oct.


    Je ne vous diray pas encore des particularitez touchant vostre bonne hostesse. si vous me
    demandez pourquoy je respondray que les chaises coustent trop cher, et que quand je vous
    fis promesse par ma precedente de l''aller voir, je ne me souvenois pas du mauvais estat
    ou estoit ma bourse. Vous qui avez esprouvè la vie de Paris, vous deviez nous estre utile
    aupres de mon Pere et le conseiller de ne plaindre pas l''argent qu''il nous envoye. Il
    est vray pourtant que hier j''estois dans le quartier ou elle demeure, et que je l''eusse
    pu voir sans beaucoup de peine si je m''en fusse souvenu. Je la verray apresdemain quand
    il m''en devroit couster une pistole. Maintenant parce que selon toute apparence vous serez
    fachè je veux vous adoucir par ce petit air que monsieur Gobert me donna hier. Voyez la
    page suivante.


    Nous avons sçeu par 3 diverses lettres le bel exploit du cousin Huygens, qui est tout à
    fait digne de luy. Mon cousin Doublet n''a jamais tant rij, que quand il l''entendist. omnibus
    nequitijs colophonem imposuit.


    Je vous prie que nos ferremens soyent bien conservez sans se rouiller car selon toute apparence
    je retourneray dans peu à mon mestier. Je suis


    Vostre tresaffectionè frere et serviteur Chr. Huygens de Z.


    Pour mon frère de Zeelhem.'
- verzender: Christiaan Huygens
