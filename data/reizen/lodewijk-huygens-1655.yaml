  tekst: 'A Paris 15 Octobre 1655.

    Monsieur mon Pere


    Je responds a la vostre du 7e qui nous a estè rendue hier au matin en quoy je trouve estrange
    que la poste met tousjours plus de temps a revenir qu'' a s''en aller en de là. le soin
    que il vous plait de prendre à nous introduire chez les gens de condition m''obligeroit
    à vous en faire des remercimens si je n''estois bien asseurè que vous jugez plus favorablement
    pour ce qui est de ma recognoissance que de ce que j''ay de complaisance exterieure. Toutefois
    en nous ordonnant tant des visites je vous prie de ne vous point estonner de la despense
    que nous faisons estant chose certaine que pour hanter les hommes de qualitè il en faut
    passer par là. Il vous plaira donc de nous pourvoir au plustost de quelque billet à Monsieur
    van Gangel et de croire que nous en avons grand besoin, puis que le contenu du dernier s''en
    est allè pour la pluspart à nous habiller et nourir, et qu''à peine le reste pourra suffire
    pour 15 jours. Monsieur Tassin et d''autres qui nous verront icy vous pourront asseurer
    que nous sommes assez bons menagers, n''estans pas mieux habillez que chez nous ny ne faisant
    pas plus grande chere. Et pourtant si ces frais vous semblent monter trop haut, il faudra
    bien nous faire revenir. Je ne demande que de voir cette cour, qui arrivera bien tost, pour
    en scavoir faire quelque rapport a mon retour. Au reste pour ce qui est du sejour de Paris
    je croy bien que tant que j''y demeureraij d''avantage et plus je profiteraij de la conversation
    des gens de cette nation. mais pour revenir tout autrement faict que je n''estois en partant,
    je ne scay si lon le jugera. pour moy je ne m''appercois pas de ce changement, du quel il
    en est peut estre de mesme, que quand on croit en grandeur. Hier nous avons esté regalèz
    par Monsieur de Chamboniere, lequel nous avions este veoir quelques jours auparavant. Il
    nous vint querir avecq son carosse, et premierement nous mena a l''assemblee des honestes
    curieux qu''il a instituè luy mesme comme je vous aij mandè cy devant. de la nous vinmes
    chez luy, ou il joua du clavecin, admirablement bien. Et nous retint à souper en compagnie
    de quelques autres Messieurs et dames. entre autres estoit sa soeur qui a espousè la marquise
    de Lucerne en Piedmont. Je n''ay pas le loisir de vous faire une relation exacte de tout
    le festin ny mesme de vous faire entendre en quoy consiste la beauté du jeu de Monsieur
    de Chamboniere. Il dit avoir grande envie de venir en Holande expres pour vous voir. Et
    je croy que cela pourroit arriver en effet. et qu''il nous fait si bon accueil, dans lesperance
    qu''il a d''en trouver un semblable aupres de vous. Quoy qu''il en soit je tascheraij de
    profiter de ses offres et en le voyant faire. Du fribusculum entre le Cousin et nous il
    n''en est rien ny jamais n''a estè non pas la moindre chose. Ains au contraire nous nous
    voyons encore tous les jours et luy faisons du plaisir en tout ce que nous pouvons, comme
    aussi il nous en a fait dernierement en nous prestant de l''argent. Nous allons souvent
    ensemble, et quelquesfois tous trois à part ce qui ne se peut faire autrement. Je croy qu''il
    aura escrit à mon Oncle sur ce point, et qu''il aura mis hors de sollicitude.'
- verzender: Christiaan Huygens
