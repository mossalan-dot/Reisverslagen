  tekst: 'Mon frere,

    A Paris le 6 Nov. 1655.


    Pour vostre satisfaction j''ay estè hier rendre visite à mademoiselle Mouchon, dont voicy
    mijn wedervaeren. Je la trouvay assise aupres du feu avec 3 ou 4 des messieurs qui logent
    chez elle qui sont tous gens d''Eglise portants soutanes. parmy eux estoit l''abbè de Carbonne
    le seul qui y ait estè de vostre temps. Cettuicy demeura, les autres se retirerent tous,
    peu apres que j''estois arrivè. Mais pour parler de la dame, j''ay bien reconnu d''abord
    que c''estoit une fille fort bien moriginée, et qui a de l''esprit; et sans doute d''avantage
    qu''elle n''avoit il y a 6 ans, puis que l''esprit croit avec l''age. de la beautè il n''en
    est pas de mesme comme vous scavez. Peut estre qu''en ce temps là elle en avoit assez pour
    charmer ses hostes; et de fait elle m''a contè qu''il n''avoit tenu qu''a elle de se voir
    mariée à Ripperda l''aisnè: maintenant elle ne me semble plus estre en estat de faire des
    semblables conquestes. le visage tient desja quelques traits de la viellesse, et ses yeux
    qui sont un peu petits ont des bords de la couleur que devroient estre ses levres. C''est
    pourtant icy une hyperbole car ils ne tirent encore que fort peu sur le rouge, mais il est
    vray qu''ils sont bien petits. Elle me pria d''y venir loger la dedans en cas que j''eusse
    encore quelque temps à demeurer en cette ville, et me promit de me faire avoir cognoissance
    dans le voisinage et aux mesmes endroits ou elle vous avoit adressè cy devant. Deux filles
    que vous y avez cognues se sont marié depuis, dont elle m''a dit le nom, mais il m''est
    eschapè. En partant elle me pria de vouloir entretenir la cognoissance et que l''un de ces
    jours nous ferions quelque rejouissance ensemble. Elle demanda sur tout que je vous remerciasse
    de sa part de l''honneur que vous luy faites en vous souvenant d''elle. a mon retour je
    feray ses baisemains à monsieur de Rijswijck, de qui elle me dit avoir eu une lettre apres
    qu''il a estè revenu en Hollande. mais que la mer luy avoit fait oublier la promesse qu''il
    avoit donnè de revenir la trouver. la fille que j''avois pris pour sa soeur estoit la Manon
    comme vous aviez devinè. Je pense que vous serez satisfait sur ce point a cett heure. Pour
    l''autre qui estoit de vous envoyer des chansons je ne scay pas si je vous auray donnè tout
    contentement, à cause de ma nouvelle façon de tablature. Faites moy scavoir si vous en venez
    a bout. Ma lunette n''est pas trop a ma fantasie, estant sujette à se courber et s''affaiser
    quand elle n''est soutenue que par un endroit. Il faudra trouver quelque remede a cela.
    On ne la cognoist encore icy que de renommée, personne ne l''ayant encore essayee. Mais
    tous estants informez par moy de la nouvelle detection du satellite Saturnien, et de sa
    periode, ils ne peuvent nier que ma lunette ne l''emporte sur toutes celles qui ont jamais
    estè. Si vous donnez la vostre de 10 pieds au cousin de Vogelaer, dites luy qu''il vous
    procure en eschange 2 ou 3 de ces petites choses de verre que fait un certain van Gerwe
    à Amsterdam, qui ne peuvent estre cassèes. Philip en a veu à la Haye, et dernierement j''en
    eus icy une, qu''un gentilhomme de Frise m''avoit donnè à Tours, et que j''ay cassè avecq
    un grand effort et brisè en mille pieces. Je serois ravy d''en avoir un autre, et je scay
    bien que le Cousin cognoit le dit van Gerwe particulierement. au moins pour de l''argent
    on en peut avoir. Vale.


    Votre tresaffectioné frere et serviteur Chr. Huygens de Zuylichem.


    On n''entend plus parler de mademoiselle van Bergen.


    Pour mon frère de Zeelhem.'
- verzender: Gottfried Aloys Kinner von Löwenthurn (º1610)
