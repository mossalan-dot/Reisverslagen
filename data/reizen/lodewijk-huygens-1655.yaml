  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg003/0248
  tekst: 'A Paris le 26 Nov. 1655.

    Monsieur mon Pere


    Ayant appris par vos dernieres que le vaisseau de guerre qui amenera Monsieur Chanut ne
    pourroit pas servir a nostre voyage nous avons choisy de prendre plustost le chemin par
    terre que d''essuyer une autre fois les incommoditez de la marine qui selon toute apparence
    dans cette saison doivent estre beaucoup plus grandes que celles que nous rencontrasmes
    en allant vers icy. En suite nous sommes tombe d''accord de prendre par Sedan comme le plus
    seur et ou nous croyons pouvoir passer sans passeport. et tascherons neantmoins d''avoir
    quelque mot de lettre à Monsieur Fabert ou de Monsieur le Premier ou de Monsieur de Servient.
    On nous avoit fait accroire que Messieurs les Ryngraves estoyent prests à partir par ce
    mesme chemin mais hier nous apprismes le contraire d''eux mesmes, et qu''ils font estat
    de passer icy cet hyver. Tout le monde s''estonne que nous ne faisons pas de mesme et il
    n''y a point de doubte que le vray temps de voir Paris commencera justement apres que nous
    en serons dehors. Mais il est vray aussi que ce temps la requiert bien une autre despense
    que celle que nous avons faite jusques a cettheure et de laquelle toutefois si on regarde
    à l''utilitè qui en reviendroit il me semble que nous pouvons fort bien nous passer. au
    reste nous vous prions Mon Pere de examiner vostre compte qui vous fait monter la despense
    à nous deux jusqu''a 1000 francs par mois. Parce que asseurement avecq ce que nous avons
    empruntè de mon Cousin nous n''avons pas encore touchè 4000 mille, et le voyage sera de
    plus de 6 mois. Mais je ne veux pas vous entretenir plus long temps. Je pourrois vous faire
    le denombrement des deniers receux, mais j''ay peur de vous ennuyer. Depuis ma derniere
    j''ay faic cognoissance avecq Monsieur Scarron. Et Monsieur Gobert m''a fait avoir celle
    de Monsieur Lambert et de Mademoiselle Hilaire, sa belle soeur, qui chante comme un ange
    et pour la voix et pour la belle methode. On ne scauroit entendre rien de mieux adjustè
    ny de plus agreable que les concerts qu''elle fait avecq son frere; en disant de certains
    dialogues ou ils chantent tantost seuls tantost ensemble. Pour sa personne elle n''a guere
    de beautè mais beaucoup de bontè et de douceur. le frere est aussi fort bon garcon, avec
    qui je ne negligeray pas d''entretenir correspondance. C''est icy la derniere que vous aurez
    de nous, le voyage estant arrestè pour mardy prochain, et les places dans le coche qui nous
    portera en 5 jours à Sedan. le Bagage va par mer. J''espere que nous vous trouverons en
    bonne santè avec toute la famille et le parentage. Et suis


    Monsieur Mon Pere.'
- verzender: Valentin Conrart (1603-1675)
  ontvanger: Christiaan Huygens
  datum: 30-11-1655
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg003/0249
  tekst: "Mardy matin,\nMonsieur\n\nJ'accompagne la lettre que je vous ay promise pour Monsieur\
    \ le Marquis de fabert, d'vne autre pour Monsieur le Lieutenant général de Sedan, qui est\
    \ mon intime amy, & homme de Savoir, de probité, & de tres-agréable conversation. Vous prendrez,\
    \ s'il vous plaist, la peine de les faire cacheter toutes deux aprés les avoir leuës, &\
    \ avant que de les rendre. Je vous en envoye aussi vne pour Monsieur vostre Père, laquelle\
    \ je n'ay pas voulu laisser ouverte, par ce que j'y fays des pleintes de vous, & de Monsieur\
    \ vostre frére, qui ne m'avez employé à rien, pendant le sejour que vous avez fait jcy;\
    \ & de ce qu'en me faisant l'honneur de me venir voir à la campagne, vous m'ostastes le\
    \ moyen de vous y recevoir come je devois, & selon mon desir. Je vous en fays aussi des\
    \ reproches à vous mesmes, & si vous voulez faire vostre paix avec moy, vous me donnerez\
    \ quelque occasion de vous rendre service en vostre absence, & de vous témoigner l'estime\
    \ que je fays de vostre vertu. Elle fut hier au soir le sujet d'vn long entretien que j'eus\
    \ avec la belle Demoiselle que je vous avois annoncée, & que vous allastes voir sans moy.\
    \ Elle arriva à mon logis, vn peu aprés que vous en fustes party, & y demeura plus de quatre\
    \ heures, pendant lesquelles nous ne parlasmes presque que de vous. J'eusse bien souhaité\
    \ que vous eussiez esté présent, au hazard de choquer vn peu vostre modestie. Elle m'apprit\
    \ que vous luy avez fait vn présent le plus galant du monde, & qu'elle estime encore plus\
    \ précieux par le dedans, que par le dehors, quoy que le dehors le soit autant qu'il le\
    \ peut estre. J'ay grand regret que vous ne passez l'hyver jcy; car je vous eusse procuré\
    \ des entretiens avec elle, qui vous eussent également satisfait l'esprit à l'vn & à l'autre.\
    \ Si vous faites jcy vn second voyage, il faudra tâcher à réparer ce que vous perdez en\
    \ celuy-cy: & j'espére que vous reconnoistrez que vostre mérite n'est pas ignoré en si bon\
    \ lieu; & par les soins que je prendray à vous y faire recevoir vn parfait contentement,\
    \ vous pourrez juger que je suis véritablement,\nMonsieur \n\nVostre treshumble & tresobeïssant\
    \ serviteur, Conrart.\n\nPermettez-moy, s'il vous plaist, Monsieur, d'assurer jcy Monsieur\
    \ vostre frére de mon tres-humble service, & de vous souhaiter à tous deux vn heureux voyage."
