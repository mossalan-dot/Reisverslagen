  tekst: "A Paris le 22 Oct.\nMon frere\n\nJe vous remercie du portrait de Jupiter, et le communiqueray\
    \ demain avecq Monsieur Bulliau. Il me semble d'en avoir veu un tout à fait semblable dans\
    \ le livre de Kircherus, ars magna lucis et umbrae. Voicy deux petits airs que j'ay notèz\
    \ à ma mode, de la quelle je me serviray doresenavant pourveu que vous n'y trouviez point\
    \ de difficultè. Si j'ay le temps j'en mettray encore un a la fin de cette lettre qui est\
    \ tout nouveau. On n'en voit gueres encore pendant l'absence de la Cour. Je n'ay pas estè\
    \ voir jusqu'a present la belle Mouchon, mais vous promets de vous en dire des nouvelles\
    \ dans 8 jours. Il se peut faire que cette petite guenon n'est pas sa soeur, mais je scay\
    \ bien qu'elle l'appelloit de ce nom; j'en scauray la veritè a la premiere entrevue. Je\
    \ suis bien aise de la promesse que Calthof vous a faite. je ne voy rien icy qui soit à\
    \ comparer a son travail, ny pas une lunette qui approche de la miene. Je l'ay fait monter\
    \ a un bon maistre qui luy fera un tuyau d'un bois fort mince et couvert de parchemin vert,\
    \ comme j'en ay veu avoir icy a d'autres. Il y aura cinq pieces, la plus large qui couvre\
    \ les autres sera de maroquin et dorée. le tout ne pesera pas le quart de la vostre, et\
    \ n'aura que 3 pieds de longueur. Monsieur van Leeuwen me mande que les Estats avoyent donnè\
    \ des apartemens dans la Cour au Pensionaire de Wit, Beaumond et Berckel. Il faut donc qu'il\
    \ y ait eu quelque conspiration a craindre contre leurs personnes, puis qu'il dit que c'a\
    \ estè pour les mettre en seuretè. Et pourtant vous dites que van ruyven et son compagnon\
    \ seront bientost delivrez de la prison. Voyla qui me fait croire qu'ils auront estè soupconnè\
    \ à faux, et que la cabale n'est pas encore descouverte. Faites moy scavoir ce qui en est.\
    \ Comme aussi touchant les charges de Monsieur de Brederode de quelle facon on les a partagees.\
    \ au reste parmy les nouvelles publiques n'oubliez pas les particulieres et domestiques:\
    \ Et entre autres choses escrivez moy si mon pere voit encore Monsieur Casembroot, et s'il\
    \ n'ouvre pas quelques fois nos lettres que nous vous escrivons. Je suis\n\nVostre &c.\n\
    \nMonsieur Monsieur de Zeelhem. \nA la Haije."
- verzender: Constantijn Huygens jr. (1628-1697)
