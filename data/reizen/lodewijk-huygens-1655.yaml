  tekst: Ce matin nous avons receu vostre premiere du... que Monsieur Tassin nous apporta et
    elle nous donna beaucoup de joye. Ie fus marry seulement d'entendre que ma lettre que je
    vous escrivis aussi tost que nous fusmes arrivè icy à manque de vous estre rendue, et par
    ce mesme malheur celle du cousin Doublet. Elles vous auroit tirè d'inquietude en vous apprenant
    que nous n'avions estè sur mer que 3 jours. Vous avez eu la bontè de nous faire scavoir
    le succes de vostre voyage, qui en cette saison et en tel païs ne scauroit avoir estè que
    tres beau, et je m'asseure bien que mon frere aura goustè plus de plaisir en vous tenant
    compagnie que nous autres pelerins jusques a cett heure. Il n'a pas manquè de voir ce beaux
    pais. Car enfin je voy par experience que c'est un grand poinct que de voyager sans avoir
    soin du payement ny de rien. la despence que nous avons faite ne peut sembler que mediocre
    à ceux qui scavent combien toute chose est chere icy. et la Pension ou nous nous sommes
    mes quoyque elle est des meilleures, elle est telle toute fois que si vous ou mon oncle
    Doublet la voyoit, vous ne nous conseilleriez jamais d'en chercher une moindre. Si nous
    eussions passè d'abord vers la Loire sans nous arrester icy, la premiere lettre de change
    nous eust suffi; mais jamais nous n'aurions peu voir ce que nous avons veu des Environs
    de cette ville, aprez avoir laisse echapper les beaux jours d'estè. Nous partons demain
    pour Orleans ou sans faire grand sejour aussi tost qu' aurons un peu considere la ville,
    nous nous embarquerons sur la Loire et mettrons le moins de temps qu'il sera possible à
    parachever tout ce voyage là, n'y ayant personne de nous qui ne soit presque las de voir
    des bastimens et choses muettes. Apres que nous serons de retour et doctores utriusque,
    je m'efforceraij de voir le monde de la facon que vous l'entendez, et je pense qu'il y aura
    moyen de le faire s'il vous plait de m'en donnez le loisir. Je ne scache point d'avoir escrit
    que Monsieur Boreel nous ayt receus avecq froideur mais seulement à mon frere de Zeelhem,
    qu'il tient fort sa gravitè. je pense qu'il en use de mesme envers tous ceux de nostre sorte,
    comme quand il sort le premier de sa chambre, en nous conduisant ce que Monsieur Chanut
    ne voudroit jamais avoir fait. au reste il se monstre fort affable et nous à fait disner
    avecq luy une fois que nous estions pour entendre le presche chez luy. Ce que j'ay escrit
    de Tassin à mon frere n'est aussi que par raillerie. Nous avons suject de nous louer de
    luy à cause du grand zele qu'il monstre à nous servir. il est assez traitable pourveu qu'on
    veuille escouter son conseil et ses contes, sans luy contredire ou l'interrompre. Je suis
    etc.
- verzender: Christiaan Huygens
