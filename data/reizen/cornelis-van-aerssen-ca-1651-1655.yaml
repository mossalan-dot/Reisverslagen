beschrijving: Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk, Italië en Spanje in
  het gezelschap van zijn broer, Justinus II van Nassau (1633-1658) en tutor Antoine de Brunel
  (1622-1696). Mogelijk schoof hij, gezien zijn jonge leeftijd, later aan.
