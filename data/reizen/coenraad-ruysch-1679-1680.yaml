  tekst: 'Denk er aan, nu gij in Westminister logeert, dat de vrouw van Dr. Killigrey, indertijd
    kapelaan des Konings, nu deken van Westminster, prachtig luit en guitaar speelt. Zij is
    echter dikwijls ziek en buiten ''s lands.

    A la Haye, ce 12e de l''an 1680 .....'
- verzender: Constantijn Huygens (1596-1687)
  ontvanger: Coenraad Ruysch
  datum: 03-02-1680
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Londen
  land_ontvanger: EN
  taal: Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg001/7146
  tekst: 'Ik betreur het lot der ongelukkige vrouw en vooral hare laatste daad, om haar land,
    hare kinderen en alles te verlaten. Toch blijf ik belang in haar stellen, vooral ter wille
    van mijn Archimedes. Als gij iets van haar hoort, meld het mij dan. Al noemt zij zich ook
    non, misschien zal zij toch te Parijs met hare luit optreden op een of ander concert. Misschien
    weet haar man, die een groot vriend van mij is, waar zij zich ophoudt.

    3 Feb. 1680.

    De heer van Leewen heeft eene goede hulp aan u.'
- verzender: Constantijn Huygens (1596-1687)
  ontvanger: Diderik van  Leijden van Leeuwen
  datum: 01-06-1679
  plaats_verzender: Den Haag
