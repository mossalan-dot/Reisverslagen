beschrijving: Maakte tussen 1693 en 1695 een educatiereis naar Italië in het gezelschap van
  de Leidse baron Jacob Emmery van Wassenaar van Obdam (1673-1724), Andries Bicker van Swieten
  (ºca. 1670-1696), Keyser uit Lüneburg en tutor Laurens Gronovius (1648-1724).
