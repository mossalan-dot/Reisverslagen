beschrijving: Verslag van een academische reis van Jacob Gronovius naar Spanje in 1672-1673
  in het gezelschap van de buitengewone gezant Adriaen Paets (1631-1686). De reis liep via de
  Zuidelijke Nederlanden naar Frankrijk. Vanwege de dreiging van de Frans-Nederlandse Oorlog
  werden er geen uitstapjes of langere stops gemaakt. Bij Bayonne stak Gronovius de grens over
  een reisde hij naar Madrid en Toledo.
