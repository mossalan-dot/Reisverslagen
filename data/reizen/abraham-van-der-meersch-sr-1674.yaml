beschrijving: Verslag van een handelsreis van Abraham van der Meersch (1643-1728) naar Denemarken
  en Zweden in 1674 in het gezelschap van Philips en Jan van Halmael, Abraham Vorsterman en
  de knecht Frederik Paran. Het verslag wordt voorafgegaan door een beschrijving van Van der
  Meersch’ vlucht uit Amsterdam naar Hamburg tijdens het Rampjaar, waarbij hij werd vergezeld
  door zijn echtgenote Elisabeth Bouttens (1643-1706) en zijn dochters. Waarschijnlijk werd
  deze versie van het manuscript voltooid tussen 1721 en 1728. Van der Meersch reisde via Friesland
  en Groningen naar Hamburg. Hij stak in Denemarken de zeestraten over en bezocht Odense en
  Kopenhagen. In Zweden trok hij noordelijk tot zijn eindbestemming Gotenburg. Hij nam dezelfde
  route terug.
