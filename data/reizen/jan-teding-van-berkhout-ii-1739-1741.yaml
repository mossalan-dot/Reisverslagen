addenda:
- beschrijving: Verbaal van de extraordinaris envoyé en plenipotentiaris Johan Egidius van Egmond
    van de Nijenburg wegens zijn zending naar Napels in verband met onderhandelingen met de
    koning van de beide Siciliën over het sluiten van een handelsverdrag met de Republiek.1739
    februari 18 - 1742 juli 7
  bron: SG 8741
  link: https://www.archieven.nl/nl/zoeken?mivast=0&mizig=210&miadt=22&micode=1.01.02&milang=nl&mizk_alle=staten-generaal&miview=inv2#inv3t6
- beschrijving: Franse en Italiaanse reisaantekeningen, bestaande uit een lijst van Italiaanse
    boeken ([1-2]); Italiaanse aantekeningen over Napels, getiteld ‘Breve e generale cognitione
    di Napoli e suo regno’ ([3-9)]; Franse reisaantekeningen over bezienswaardigheden in Rome
    ([10-41]); Italiaanse aantekeningen ([42-44]); plattegrond van de beelden in het Palazzo
    degli Uggizi in Florence, getiteld ‘L’ordre des statues et des bustes comme elles sont rangées
    dans la galerie du grand duc a Florence’ ([45]); lijst met namen ([46])
  bron: FA Teding van Berkhout 355
- beschrijving: Lijst met meegenomen boeken en kleding
  bron: FA Teding van Berkhout 356
- beschrijving: Lijst van aangeschafte Italiaanse gravures
  bron: FA Teding van Berkhout 358
- beschrijving: Briefwisseling met zijn oom Paulus Teding van Berkhout (1676-1747), getiteld
    ‘Dialogues entre absents’
  bron: FA Teding van Berkhout 354
