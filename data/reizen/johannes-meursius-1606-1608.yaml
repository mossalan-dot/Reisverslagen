beschrijving: Begeleidde tussen 1606 en 1608 de broers Reinier (1588-1623) en Willem van Oldenbarnevelt
  (1590-1634) tijdens hun educatiereis naar Praag, Duitsland, Genève en Frankrijk. Promoveerde
  in 1608 in Orléans in de rechten
