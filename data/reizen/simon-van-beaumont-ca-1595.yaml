  tekst: 'Aen ***


    Waertoe te gaen door verre Landen dwalen,     Verslijten tijd, geld-quisten, breecken wind?     Die sonder moeyt’ en kost in Holland vind     Dat noodigh is, wat hoeft hy ’t verr’ te haelen?     Als men al heeft gheleert de tael der Walen     Hoe Engelsch praet, of Spaensch, een vrou of kind,     En datmen ’t huys gekomen wel versint,     Weetmen in Duytsch sich nauwlijcks te vertalen.     Een wulps gelaet, een valsch bedeckt gemoedt,     Hoererens lust, een dert’le quispel-voet

    Een tongh ghewent tot vloeck en laster-reden,     Sijn het çieraet dat Napels, dat Parijs,     Dat Roome geeft. Hollander, sijt ghy wijs,     Blijft t’ huys, leert wel ’s Lands-recht, ghebruyck en seden'
