beschrijving: Verslag van een handelsreis van Pieter van der Meersch (º1677) naar Zeeland en
  de Zuidelijke Nederlanden in 1700 in het gezelschap van zijn vader Abraham (1643-1728). Het
  afschrift is mogelijk gemaakt door zijn broer Arent (1683-1768) of Abraham jr. (1676-1719).
  De reis liep van Amsterdam via Zeeland naar Gent en Kortrijk. Hij reisde terug via Antwerpen
  en Tilburg.
