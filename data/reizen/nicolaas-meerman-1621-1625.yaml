  opmerking: His excuse for not having written before is epidemic sickness. He laments news
    of the death of Dr. Erpenius and Dr. Vorstius. He has attended the proceedings at the Inquisitors
    presiding over the body of cardinals and the case and fate of Antony de Dominus late Abp.
    of Spalota (complicated story of condemnation, etc.)
