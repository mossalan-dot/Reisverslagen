  opmerking: Concerning the King's invitation to V. to take the chair of theology at Cambridge
    on which he gives his observations and advice (support of the King and great influence of
    the late Bp. of Winchester who put forward the proposal; but the English are against relying
    on foreigners, and reception by Cambridge professors doubtful). He sums up in favour from
    V's. point of view and mentions that V. has a great friend in the ambassador with whom he
    (D) is intimate. He refers to men in Venice who are friendly to V., e.g., the Dominic an
    Molinus.
