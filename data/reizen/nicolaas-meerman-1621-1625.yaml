  tekst: A eulogy of V. gratitude and devotion to whom he can no longer refrain from uttering.
    Would that he could present him with an offering worthy of him. He seizes an opportunity
    of writing at once to Rivetus, whose kind guidance while in France he has been fortunate
    to have, and who is returning to Holland and has offered to convey a letter.
