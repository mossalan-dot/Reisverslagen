  tekst: "Vir Clarissime, Cognate plurimum observande.\n\nLargiter in bonitatem tuam pecco,\
    \ qui nugis ineptiisque meis meliores occupationes tuas distineo. Sed nec impetrare a me\
    \ possum ut, cum tui sacrosancta mihi sit memoria, cumque identidem gratissima tuorum in\
    \ me beneficiorum recordatio se cogitationibus meis insinuet, ut non hoc potius nomine,\
    \ qualiscumque ea demum sit, culpae affinis videri malim, quam ut me neglecti aliquando\
    \ peniteat officii committere. Accedit quod, cum nihil hac te dignum habeant literae, abiici\
    \ nec lectae possint, fructus utique mihi scriptionis constabit quam amplissimus, si Graswinckelii\
    \ dumtaxat conspecto nomine vivere me omni obsequio ac fide semper tuum recordari fueris\
    \ dignatus. Si tamen quid agam scire desideras, paucis habe. Commoror hactenus Lugduni,\
    \ opinione quidem mea diutius, sed ferendum quod mutari non potest. Iter Alpinum nulli extraneo\
    \ patet, transitum prohibente Allobrogum Duce; cuius mihi rei fidem fecere quatuor nobiles\
    \ Angli qui ultra Chamberiacum progredi vetiti, nec non et tres alii, qui cum iam ante edictum\
    \ Ducis Lugduno excessissent, atque adeo Vercellas, Hispanicae ditionis oppidum, pervenissent,\
    \ ad eundem modum iter relegere coacti fuere. Accedit quod Mediolano extranei omnes iussi\
    \ sunt excedere viaeque quaquaversum latrociniis sunt infestissimae. Ambigenti porro mihi\
    \ de itinere maritimo, quod Massilia Genuam ducit, nihil potius videtur quam commodis occasionibus\
    \ intentum esse. De Aligero1 ob illas quas allegasti rationes ne cogitandum quidem esse\
    \ semper credidi: augusta illa dignitas, quae in patrem ipsius Cancellario diem functo collata\
    \ est, venturum ipsum in foelicitatis paternae partem facit ut existimem, aut saltem, reiecta\
    \ in tempus vernum legatione, cum accessione dignitatis mittendum. Quicquid sit, ipsene\
    \ horsum sit venturus necne ex nemine mortalium intelligo. Adest iam plusculos dies Sabaudiae\
    \ Duci Comes Stabuli2, eique se Vobencourtius3 cum legione militum sua propediem adiunget,\
    \ ut et cum suis qui hic agit Aleziae Comes4. Convenere Rhaeti de rerum summa quoque pacto\
    \ Hispanicis aggressionibus obviam sit eundum deliberaturi. Basileae non leviter praetimetur:\
    \ eam quidam obsessum iri, quidam iam nunc obsessam volunt. Qui celeribus equis ex Hispania\
    \ advenit nuntius totam Lusitaniam ad recuperandum Sinum Omnium Sanctorum5 ait armari, ac\
    \ stare omnibus sententiam extrema quaevis malle perpeti quam coeptis excidere, eoque diutius\
    \ orbari loco, cuius iactura tribus locupletissimarum Lusitaniae urbium amissioni aequipolleat.\
    \ Italos castrorum desertores plurimos indies hic videre est. Quidam in Gratianopolitano\
    \ Parlamento consiliarius mihi adfirmavit Hispanos plures ducentis in itinere sibi conspectos,\
    \ exceptis Italis quorum longe maior etiamnum erat numerus. Venerat autem ille Gratianopoli,\
    \ quae biduo itinere hinc abest. Pene hoc omiseram, qualequale sit ipse rectius iudicaveris,\
    \ nempe vidisse me literas ad unum ex iis, dc quibus supra scripsi, Anglis nupere admodum\
    \ datas, quae hoc habebant: praediis ac latifundiis eorum, qui Catholicae essent religionis,\
    \ impositum vectigal, quod aliquot abhinc annis exactum haud fuit, Parlamenti iussu denuo\
    \ coepisse exigi, proposita refractariis exilii poena. Quod ipsum etsi mihi hoc rerum Anglicarum\
    \ statu difficile ad fidem videatur, summa tamen rem ita se habere adseverantium - qui eadem\
    \ et ad se perscripta dicebant - fiducia fecit ut et hoc perscriberem. His quod addam nihil\
    \ est nisi hoc, quod a me nec scribi nec exprimi quoad vivam poterit satis, esse me scilicet\
    \ tibi tuisque quam devinctissimum. Tu quaeso despice ecquid aut fides mea aut opella usui\
    \ alicui inservire possit. Ego eorum qui vivunt foelicissimum me reputabo, si mandatorum\
    \ tuorum honore dignum me iudices. Vota interim pro salute tua facere non desinam, Deumque\
    \ Optimum Maximum rogabo ut te communi patriae nostrae totiusque adeo orbis Christiani bono\
    \ quam diutissime servet incolumem, Mundi delicias, suos amores. Vale et praecipitatae festinationi\
    \ ob discessum tabellarii ignotamque occasionem ignosce.\n\nLugduni 16 Octob. CIƆIƆCXXIV.\n\
    \nTuus ex asse usu ac mancupio \n\nGraswinckel.\t\n\nAdres: A Monsieur Monsieur Grotius\
    \ vis à vis l'ostel de Monsr. le Prince au faulbourg de S. Germain à Paris. Port de Lion.\
    \ 3 s.\nIn dorso schreef Grotius: 16 Oct. 1624 Graswinckel."
