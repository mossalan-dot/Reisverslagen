  opmerking: 'He is enthusiastic in praise of his reception in London by V''s. relative and
    feels himself blessed with benefits rivalling those conferred by V. to whom he is eternally
    grateful and who has shaped his character for 12 years. He has been made at home by V''s.
    relative who has also taken in his two companions: he is getting skilled tuition in English.
    Tomorrow they are to visit the Bp. of Winchester at Farnham Castle. (This gives an interestingly
    detailed picture).'
