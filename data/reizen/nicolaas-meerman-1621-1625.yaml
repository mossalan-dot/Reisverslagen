  opmerking: Concerning theological controversy. Some months ago a young theologian had prophesied
    that the reformed religion would be smashed in England of which the King being informed
    the young man was put in chains. The matter was submitted to Theologians of Oxford and Cambridge.
    The result at Cambridge was a theological dispute of the remonstratensians against the contra
    remonstratensians. He sends V. the reports from Oxford and Cambridge. He gives V. news of
    the King's decree that the bishops should show more clemency to the reformed, and release
    those imprisoned for refusing to swear the oath of loyalty to the King.
