  tekst: "Vir Clarissime, Cognate plurimum observande.\n\nEtsi nihil est quod scribam, scripturio\
    \ tamen: quin ferreus sim si me, cogitationibus dicam an erroribus, suavissimis defraudem,\
    \ quibus inducor ut, cum ea, quae nostra tibi oggerit importunitas, adferuntur, esse te\
    \ Graswinckelii tui memorem, eique haud gravatim ignoscere mihi persuadeam. Ita se res habet,\
    \ quem semel suum fecerit affectus vehementer, vix ullo inhibeas sufflamine: allubescunt\
    \ quippe supra modum cuncta quibus vel tantillam dulcedinem mentis infirmitas affinxerit,\
    \ et confestim in successuum ex voto fluentium non dubitanda cedunt argumenta. Sed quis\
    \ Sabinos quod velint somniare2 prohibeat? Me quod attinet, nae libens tibi tuum illud.\n\
     \nAudacem bonitas tua me notissima fecit\n\nessem repositurus, si non in simili exemplo\
    \ votis obstarent illa merita, quae te tanto quotquot vivunt mortalibus sublimiorem reddiderunt,\
    \ quanto puris illis ac coelestibus mentibus inferiorem te geris. Ne tamen nihil scripsisse\
    \ videar, habe hunc quem literis inclusi libellum4: Dudum est quod lucem tenebris dignior\
    \ aspicit; si tamen omnino me coniectura non fallit, tibi hactenus non est visus. Accedit\
    \ quod et quaedam non mala contineat. Illud vero in eius lectione male me habuit, quod viderem\
    \ nos, ex quo pestilens discordiae virus rempublicam nostram afflavit, etiam iis, qui dissidiorum\
    \ inter nos flabella ventilare non desierunt, miseros afflictosque et tantum non perditos\
    \ ludibrium debere. Sed vibrata in coelum tela in emittentem recidunt. Vivit, ut audio,\
    \ libri auctor et non vitam, sed vitae supplicium profugus circumfert. Caeterum ut inductas\
    \ vulneribus tuis cicatrices detrahat omnino haud timeo, nam praeterquam quod levia sint\
    \ ista, et summam tantum cutem stringant, soli tibi raro Dei beneficio domestica foelicitas\
    \ obvenit, maior omnibus exemplis Constantia, qua suffultus esse viri boni sacramentum ferre\
    \ mortalia semper cogitasti, omniaque illa quae in tuam innocentiam ex transverso arietarunt\
    \ non patiens modo sed etiam volens perferre sustinuisti, certius constantiusque nobis ac\
    \ post venturis Virtutis exemplum, quam aut Hercules fuit aut ille quem adversis rerum undis\
    \ immersabilem poeta5 commemorat. Sed novi ego quam publicis laudibus celebrata virtus privati\
    \ praeconii tenuitatem despiciat. Reprimam ergo me, ac saltem vovebo, uti benignum mihi\
    \ numen concedat tui ad imitationem non quid passurus sed quid facturus sim usque consyderare.\
    \ Te vero salvum valentemque idem nobis conservet numen, ut dum tui viventis etiamnum spirantisque\
    \ cogitationibus se nostris insinuat recordatio, eximias in te virtutes diu venerari liceat;\
    \ tam tu me certe ames, uti ego certissime scio, aliter fieri non posse quin dum earum reverentia\
    \ sanctiora reddat pectorum nostrorum penetralia, boni omnes tam generosis excitati calcaribus\
    \ tecum pro syncero Dei cultu, pro bono publico, proque bona causa vel acerbissimam mortem\
    \ oppetere et lucro et solatio sint reputaturi. Vale. Dabam Lugduno festo divorum Simonis\
    \ et Iudae. Anno reparatae salutis CIƆIƆCXXIV.\n\nTuus ex asse usu ac mancupio \n\nGraswinckel.\t\
    \n\nAdres: A Monsieur Monsieur Grotius vis à vis l'hotel de Monsieur le Prince au faulxbourg\
    \ S. Germain à Paris.\nIn dorso schreef Grotius: Oct. 1624. Grasw."
