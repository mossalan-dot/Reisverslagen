  opmerking: He describes as testimony to the high repute and admiration in which V. is held
    the warm words of the Bishop of Winchester when Dr. Junius took him to call on him and they
    were entertained to dinner, when the bishop raised his cup to V., Erpenius and Grotius.
    He had asked what hope there was of seeing V. in England and declared that when he was absent
    two essentials were missing.
