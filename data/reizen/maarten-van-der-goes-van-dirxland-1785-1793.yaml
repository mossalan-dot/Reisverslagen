id: maarten-van-der-goes-van-dirxland-1785-1793
titel: Diplomatieke reis naar Denemarken
reizigers:
- maarten-van-der-goes-van-dirxland
reistype: diplomatieke reis
jaren: 1785-1793
vertrek: '1785'
gebieden:
- Denemarken
- Nederlandse Republiek
beschrijving: Werkte als gezant in Kopenhagen tussen 1788 en 1793.
addenda:
- beschrijving: Stukken betreffende de benoeming en het ontslag als gezant achtereenvolgens
    bij het Hof van Denemarken te Kopenhagen en de Nederlandsche Kreitz te Hamburg.
  bron: Baron van der Goes van Dirxland 2
- beschrijving: Confidentieele en particuliere grootendeels diplomatieke correspondentie met
    verschillende vooraanstaande persoonlijkheden
  bron: Baron van der Goes van Dirxland 16-19
- beschrijving: Brieven ontvangen van zijn vader, broeders en zusters, 1773-1795
  bron: Baron van der Goes van Dirxland 20
- beschrijving: Ambtelijke correspondentie van Van der Goes als gezant in Denemarken met den
    Raadpensionaris L.P. van de Spiegel.
  bron: Baron van der Goes van Dirxland 24
- beschrijving: Afschriften van en uittreksels en aan teekeningen uit verschillende stukken
    betreffende internationale aangelegenheden, meestal in verband staande tot Denemarken.
  bron: Baron van der Goes van Dirxland 25
- beschrijving: 'Copie des lettres etc. Danemarc.", Register waarin voorkomen: Eenige brieven,
    Korte schets van Denemarken, overgegeven aan den Raadpensionaris van de Spiegel in Aug.
    1788, Beschrijving van de Tolkamer in Kopenhagen, Beschrijving van het "militaire wezen"
    in Denemarken. 1789. Volmacht op Ph. Fr. Tinne als zaakwaarnemer voor V.d. Goes, en verdere
    aanteekeningen.'
  bron: Baron van der Goes van Dirxland 26
- beschrijving: '"Octroy en reglement de la Banque d''Espèces Danoise et Norvégienne pour quarante
    années", verleend door den Koning van Denemarken.'
  bron: Baron van der Goes van Dirxland 27
- beschrijving: Lijsten van de schepen van de "Marine Royale de Danemarc" dietusschen 1775 en
    1792 de Sond zijn gepasseerd.
  bron: Baron van der Goes van Dirxland 28
- beschrijving: Aanschrijving van de Staten-Generaal met afschriften van brieven van F. de Coninck,
    waarnemend gezant in Denemarken, om inlichtingen omtrent de Conincks overige functies bij
    het Deensche Hof.
  bron: Baron van der Goes van Dirxland 29
- beschrijving: Declaraties en verdere stukken betreffende de financieele aangelegenheden in
    verband met het verblijf in Copenhagen.
  bron: Baron van der Goes van Dirxland 30
