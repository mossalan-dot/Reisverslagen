id: wybrand-de-geest-1614-1618
titel: Kunstenaarsreis naar Frankrijk en Italië
reizigers:
- wybrand-de-geest
reistype: educatiereis
jaren: 1614-1618
vertrek: '1614'
gebieden:
- Frankrijk
- Italië
beschrijving: Ging in de leer bij Abraham Bloemaert (ca. 1564-1651) en maakte tussen 1614 en
  1618 een kunstenaarsreis naar Frankrijk en Italië. Was in Rome lid van de Bentvueghels en
  kreeg de bijnaam ‘De Friesche Adelaer’.
addenda:
- beschrijving: Album amicorum (1614-1617) met inscripties uit onder andere Den Bosch, Parijs,
    Aix-en-Provence en Rome.
literatuur:
