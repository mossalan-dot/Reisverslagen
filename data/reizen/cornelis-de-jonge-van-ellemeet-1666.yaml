beschrijving: Verslag van een plezierreis van Cornelis de Jonge van Ellemeet naar Friesland,
  Groningen, Overijssel, Gelderland en Kleef in 1666 in het gezelschap van Nicolaas Anthonij
  Flinck en Nicolaas Ruichaever. De Jonge van Ellemeet reisde van Leiden naar Leeuwarden en
  Groningen, doorkruiste Overijssel, maakte een uitstapje naar Kleef en Xanten en keerde terug
  via Den Bosch en Rotterdam.
reisgezellen:
- naam: Nicolaas Anthonij Flinck
- naam: Nicolaas Ruichaever
addenda:
- beschrijving: 'Varia, ongerelateerd aan de reisverslagen, te weten:  twee gedichten, getiteld
    ‘Aan juffrouw…’ en ‘Aan de heer Bruijnesteijn’ (5-8); uitleg van diverse gezelschapsspelletjes,
    getiteld ‘Petits jeux’ (8-17); historische aantekeningen over de Tachtigjarige Oorlog, gebaseerd
    op P.C. Hoofts Nederlandsche Historien en gerangschikt op jaar (17-42); historische aantekeningen
    over Europese vorstenhuizen (42-68); historische aantekeningen over het Romeinse rijk (69-83),
    gebaseerd op Tacitus; aantekening over de geboorte van een Siamese tweeling in 1669 (83-85);
    spotrekening waarin de schrijver betaalt in “kusjes, bedanckjes, en reverentijtjes” (86-87);
    gedicht over de discussies over het slaan van de nieuwe Hollandse gulden in 1681 (88-90).'
  bron: De Jonge van Ellemeet 1666, 1-90
