beschrijving: Onvolledig en ongepagineerd verslag va naar Duitsland in 1677. De auteur vergezelde
  zijn vader Philip Ernst (1613-1693) die de landerijen van zijn werkgever Hendrik Casimir (1657-1696),
  prins van Nassau-Dietz, moest inspecteren. Vegelin van Claerbergen reisde van Leer naar Hannover
  en maakte verschillende uitstapjes in de buurt. Het verslag wordt door het Tresoar toegeschreven
  aan Hessel Vegelin van Claerbergen (1655-1715).
