beschrijving: Was een leerling van Abraham Bloemaert (ca. 1564-1651) en maakte een kunstenaarsreis
  naar Frankrijk en Italië. Verbleef in Rome tussen 1643 en 1647 en werd lid van de Bentvueghels.
  Zijn bijnaam was ‘Ratel’.
