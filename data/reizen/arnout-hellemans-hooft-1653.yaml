manuscript: arnout-hellemans-hooft-1653-hs
beschrijving: Verslag van een diplomatieke reis van Arnout Hellemans Hooft naar Lübeck in het
  gezelschap van ambassadeur Anthony Oetgens van Waveren (1585-1658) en burgemeester Jacob de
  Witt (1589-1674). Het gezantschap probeerde, overigens zonder succes, te bemiddelen in de
  vredesonderhandelingen tussen Polen en Zweden. De reis liep via Overijssel naar Bremen, Hamburg
  en Lübeck, waar het gezantschap anderhalve maand verbleef. Hellemans Hooft keerde terug per
  schip via de Noordzee.
