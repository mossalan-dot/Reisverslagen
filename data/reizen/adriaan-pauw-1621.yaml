- beschrijving: Verbaal van de gezanten Nicolaes van den Boeckhorst, heer van Noordwijk, Adriaan
    Pauw, heer van Heemstede, Adriaen Manmaker, Adriaan Ploos en Gidéon van Boetselaer van Asperen,
    heer van Langerak, wegens hun zending naar Frankrijk in verband met onderhandelingen over
