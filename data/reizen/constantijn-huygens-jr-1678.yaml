  tekst: 'au Camp de Vilvorden le 30 Juillet 1678.

    Nous avions creû d''auoir de vos nouvelles il y eut mardy dernier huict jours, mais il ne
    vint rien ce jour la ce qui nous surprit d''autant plus que madlle de Haucourt avoit eu,
    ce dit on auis qu''une piece d''estoffe que vostre Gouvernante auoit prise auec elle auoit
    esté delivrée.

    Mardy dernier j''ay esté obligé de partir pour l''armée, auant que les lettres fussent venues,
    tellement que je ne scay encore rien touchant vostre voyage.

    Cependant je doibs vous dire que depuis vostre depart j''ay encore travaillé a la microscopie
    et me suis servy avec succes des methodes que je vay vous dire pour faire les petits verres.

    Pour les detascher du fer sans les pouvoir perdre, ce qui m''arrivoit tres souvent j''ay
    fait dans un petit morceau de cuivre un creux de la maniere que j''ay marqué icy, et faisant
    entrer la petite boule dans  ce creux, je mets dessus une placque de nostre cuivre à enchasser
    et la tenant pressee dessus je retire la queue du fil d''archal qui laisse la petite boule
    dans le creux, sans que cela manque.

    Pour la mettre en suitte dans le petit trou qu''on fait avec l''aiguille avec seureté, et
    sans pouvoir la perdre j''ay fait un petit cercle de cuivre qui a les bords hauts de l''epaisseur
    de deux escalings que je mets a l''entour du petit trou, et y ayant mis la petite boule
    je l''adjuste en suitte dans le trou sans apprehension de la voir eschapper.

    Finalement m''estant souvenu de ce que vous m''aviez dit que Hartsoecker avoit proposé j''ay
    essayé de faire les petites boules en mouillant un peu le bout du petit fer, et en y attachant
    par ce moyen un morceau de verre, sans me servir de ce fil de verre que nous faisions a
    la lampe, et j''ay trouvé que cela alloit bien mieux que de l''autre maniere et que par
    ce moyen je pouvois faire ces boules aussi petites que je voulois, mesme bien plus qu''il
    est necessaire, et qu''elles estoyent tenoyent moins fort au dit fer et par consequent estoyent
    plus rondes, comme en effet, j''en ay fait de la petitesse de vostre moindre et qui me semblent
    representer plus distinctement.

    Voyla ce que j''ay creu devoir vous communiquer des effets de ma diligence, dites moy, comment
    l''invention a esté receue par vos Curieux.

    On commence a mieux esperer de la Paix depuis qu''il est venu des lettres d''Angleterre,
    portant que la France semble de vouloir consentir a l''evacuation.'
