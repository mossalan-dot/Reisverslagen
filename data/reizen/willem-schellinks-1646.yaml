beschrijving: "Vier reisverslagen in drie banden van Willem Schellinks (1623-1678). Het betreft\
  \ een netversie, deels gebaseerd op Lambert van den Bos’ Wegh-wyser uit 1665, waarschijnlijk\
  \ geschreven tussen 1665 en 1668. Het verslag was waarschijnlijk bedoeld ter uitgave. Een\
  \ zeventiende-eeuwse kopie van de laatste drie verslagen ligt in de Bodleian Library in Oxford\
  \ (Ms. D’Orville 558-560). \n\nVerslag van een kunstenaarsreis van Willem Schellinks in 1646\
  \ naar Frankrijk. Hij werd vergezeld door de kunstenaar Lambert Doomer (1624-1700). Hij ging\
  \ scheep in Texel en voer naar Nantes. Vandaar bezocht hij de Loirestreek en Parijs. Schellinks\
  \ verbleef langere tijd in Nantes (17 mei-3 juli), Saumur (10-18 juli), Parijs (11 augustus-7\
  \ september) en Rouen (8-24 september)."
