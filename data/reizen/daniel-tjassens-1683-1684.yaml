  tekst: "Mijn heer en waerde oom,\n\nHebbe u laeste daegs nae dat ick de mine hadde afgesonden\
    \ alhier tot Paris ontfangen, en daer uit verstaen an de ene kante met groote blijtschap\
    \ de goede dispositie van onse familie en an de andere kante met grote moijelickheit het\
    \ misnoegen van de vrienden om dat ick tot Mert dat gelt hebbe getrocken. Ick twiffel en\
    \ wel niet of de vrienden sullen hij het selve pardonneren nae dat ick het gelech van de\
    \ lake hebbe geschreven. Ick ben alhier nie sel weke geweest en ben met Monsieur Wolters\
    \ op een stoffeerde kamer, gaende dan hier dan daer in de ordinarisen te eten, alwaer wij\
    \ een en twintich stuivers voor de maeltijt moeten geven. Nae dat wij alles hebben besien\
    \ wat alhier so in als in acht a negen mile om de stat is so ben wij op het goet vinden\
    \ van mijn heer vanHeel geresolveert om als morgen van hier op Orleans en verders op Mert\
    \ te gaen om aldaer wat weer te menageren, alsoo het mij alhier seer veel uit de gissinge\
    \ is gelopen met het besien van so in als buiten de stad. \n\nWij hebben twemael nae Versaille\
    \ geweest en hebben de komst met het ganse hof gesien Wij ben oock geweest nae Saint Germain\
    \ en verder, alle so konincklike als prinsen huisen die hier om Paris ben. Het is alhier\
    \ so schrickelike duir koop leven so ic de beurse continuelick des morgens met de oogen\
    \ moet open gaen en so wij alhier noch langer soude bliven, wij souden noch kap en kod verteren\
    \ en daer toe noch vergeten het gene wij in de province hebben geleert, alsoo alhier wegen\
    \ de groote menichte vreemdelingen meer Duits als Frans wort gesproken. Wider ben wij van\
    \ voornemen om veer of vijf weken tot Mert te bliven om aldaer schriven af te wachten en\
    \ daer nae de steden die op den rivieren ben als tussken geneve te besien, om alsoo onse\
    \ rese nae het vaderlant voort te setten. Soude dieswegen wel wasken dat oom Tjassens mij\
    \ met een wissel wilde overmaken het mij noch wort toe gelecht om minne messures an te stellennae\
    \ dat oom Tiassens mij liberalick belieft terwijl ick op de andere plaetsen so commede geen\
    \ wissel kan besien. Noch ock so lange over te senden op een plaetse kan blijven om heen\
    \ en weer te schriven sal daer mine volbrengen en trachten daer van te profiteren, so veel\
    \ het mij mogelick fijr mede sluitende so bevele ick oom en moij Tjassens met de gantse\
    \ familie in de bescherminge des Alderhoogsten en verblive,\n\nMijn heer en u onderdanichste\
    \ dienaer en neef Daniel Tjassens,\n\nParis, den 23 Deember 1683\n\nIck versoeke de gebiedenisse\
    \ an oom en moij Krans, Nichte warte en verders alle nichten.\n\nMijn addresse is gelijck\
    \ te voren tot Blois an Monsieur le Rouer."
