  tekst: "Daniël Tjassens (1660-1713)\t\t\tBernard Tjassens\n26 maart 1684\nParijs (fr)\nfols.\
    \ 1\n\nSeer geliefde en waerde Oom,\n\nIck hebbe U Ed. brief van den 4 Martij met de ingeslotene\
    \ wissel wel ontfangen, en daer uit met droefheit versaen de slechte toestant so van de\
    \ regeringe als van ons particulier, het welke mij groote licke troubleert en oorsaeck is\
    \ dat ick mijn gelt op de reise met geen groot vermaeck sal verteren. Ick ben oom Tjassens\
    \ en de vrienden ten hoogsten verplicht voor de sorge die sij hebben gehat van order op\
    \ mijn wissel te stellen en mij alhier niet verlegen hebben gelaten. Ick hebbe de selve\
    \ alhier an een koopman gedaen met order an Messieurs Gouteurs van de selve an een correspondent\
    \ van dien te teller en sal so haest die tot Paris sal siin betaalt hier weder ontvangen.\
    \ \n\nMoris: Wolters en ick ben te samen voor veertiin dage van Mer vertrocken en ben tegenwoordich\
    \ tot Blois, alwaer wij als aenkomende sondach, siinde Paesken, van voornemen ben te communieren\
    \ en als dan voort van hier te vertrecken op Tour en van daer over Lion, Genève en Basel\
    \ en so verders de Rijn af onse reise na huis voort te setten. Hier mede nae herelike groetenisse\
    \ an alle vrienden, verblive, oom,\n\nsijn onderdanichste dienaer en neef Daniel Tjassens\n\
    \n26 Mars\n1684\n\nIck versoeke de gebiedenisse an Moeij Tjassen en alle nichten als oock\
    \ oom en moeij Krans en nichte Swarte"
