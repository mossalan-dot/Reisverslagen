  opmerking: 'He describes his futile efforts to obtain money to pay his way home: no replies
    to his letters to Goesius; and Bidalius has sent nothing. If he could have had the cash
    he could have had 130 splendid codices from Duke Salviatus for the Queen''s library and
    almost all of those of the monks at San Marco in Florence because great toubles here. The
    English have captured a vessel by night in Leghorn harbour and killed all of the crew except
    two who escaped, one of them rescued from drowning by a passing vessel.'
