- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 23-03-1652
  plaats_verzender: Rome
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: Chides V. for keeping him in the dark. He is left in ignorance where to have things
    sent. What he could do at a stroke if at Stockholm he has to spend time over in searching
    out the Queen's representatives at Hamburg and Nuremberg. He has been 5 months in Italy
    and cannot find out whether any of his very frequent letters have ever reached V. He cannot
    hope now to go to Naples or Sicily. He is diligently examining the Vatican library. V. de
    Nojueira has not yet been able to do anything about the Altempsian library.
- verzender: Isaac Vossius
  ontvanger: Nicolaas Heinsius
  datum: 01-04-1652
  plaats_verzender: Amsterdam
  land_verzender: NL
  plaats_ontvanger: Rome
  land_ontvanger: IT
