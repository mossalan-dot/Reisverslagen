- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 11-05-1652
  plaats_verzender: Rome
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: A hotchpotch including gossip from which not much stands out. In it figures many
    names, e.g., Bourdelotius. While still jibing at V. for unresponsiveness he greets his recent
    letter with its promise, e.g., of bringing back gold coins when he returns. He relates punishment
    by the Inquisition and hopes Nojuera (Noijhera) will be freed because on his help alone
    rests his hope of access to the Altempsian library from which he has been fobbed off on
    a ridiculous pretext. Lack of money has prevented him from much work on MS., and also H's.
    failure to send him an index of the codices of the unedited writers which the Queen possesses.
    He has approached Holmius and Bidalius about funds, without result, so he will go to Florence
    to find out what hopes there are of the Altempsian library. No news of the receipt of Nic.
    Crassus' Etruscan ode consecrated to the Queen. Would that he could have been permitted
    access to the Farnese library, which he could have had if he had the letter which the Queen
    had promised to write to the Duke of Tuscany. The voice of the Medicis has great authority
    throughout Italy, and at their word every library opens its doors. He turns rather gloatingly
    to the news from V. that Salmasius is preparing an onslaught on him (V.) and lets himself
    go in scornful invective.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 25-05-1652
  plaats_verzender: Rome
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: Prospect of seeing Altempsian library has deteriorated. He has visited the Farnese
    library and set aside some books from it. Poor progress in the matter of the coins, but
    he has inspected those of Gothofredus and sends a catalogue of them for the Queen. He asks
    600 écus for the whole set. He will have to spend the rest of the summer in Florence. Two
    or three months ago he sent the Queen Crassus' Italian odes, and would send more of his
    if he could be informed by what means parcels could safely reach the royal hands. Lack of
    means is bringing my search for MSS. to a stop. Holstenius, choosing a happy moment, has
    persuaded the Pope to allow his antique lanterns and statues to be transferred to Sweden.
    I have already been 17 months out of Sweden out of the 18 I had asked for from the Queen
    for completing my tour. But I am far from having accomplished all I hoped to do.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 30-06-1652
  plaats_verzender: Rome
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: 'All in all he has doubts about Altempsius'' library and whether the Queen could
    get it at a fair price. He has been through Gothofred''s coins but wonders what the Queen
    will decide: Boncompanius keeps dark about his coins; he has gone off with his jewels to
    Bologna. I have again been living a month at my own expense and shall have to do the same
    in Florence. If only you gentlemen at court were as generous as your kind Mistress! The
    Keeper of the Vatican library has shown himself agreeable and I should like to attach him
    more closely to the Queen with the gift of a golden coin; but they have all been distributed.
    Cardinal Barberini and Braccianus have begged for a living likeness of the Queen stamped
    in colour, and Braccianus has asked me to pass on to him all the news about her I get in
    letters from Sweden. But you never write. Please be more diligent in future. I used to enjoy
    writing to you in Sweden but now I write with disgust. Try to wipe out this blot on man''s
    character of neglecting his friends.'
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 13-07-1652
  plaats_verzender: Florence
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: Shall he accept the offer to buy the Vatican library? We have certainly lost any
    chance of Alciatus' Milan antiquities and volumes of ancient inscriptions. A few hundred
    écus in hand would have enabled me to buy much from private libraries and monasteries. He
    can attest that there are several copies extant of Damascius the Platonist's book. There
    are in this town many Greek and Latin codices in Charles Strozzi's possession, and many
    in St. Mark's monastery. He has found the Keeper of the Vatican library most friendly and
    only wishes he had a golden coin left over to present to him and so tie him closer to the
    Queen. In a P.S. date 10 Kal. Sept. he says on his return he will be coming to see him and
    meanwhile will not cease to grieve until he sees him restored to the position from which
    the avarice and passion of the man whom V. had cherished has ejected him.
- verzender: Isaac Vossius
  ontvanger: Nicolaas Heinsius
  datum: 28-07-1652
