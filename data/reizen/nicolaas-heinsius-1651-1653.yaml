- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 20-08-1653
  plaats_verzender: Frankfurt am Main
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He is on his way back and will be at Leyden shortly, after two years without a
    sight of V. He has sent off by ship 4 chests of books from Venice and two from Leghorn inscribed
    NH. Although bought out of his own pocket he offers most of them to the Queen, especially
    the MSS. He mentions steps intended to safeguard delivery and to inform the Queen.
