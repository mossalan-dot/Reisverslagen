  opmerking: His condition is at the lowest ebb. His plea to Goesius for funds to pay his debts
    and assist his return home has had no response. It is impossible to acquire the Greek codices
    in St. Mark's monastery or those at Milan, but he will answer any call from V. to assist
    towards his edition of Historiae Augustae. So as not to waste his time entirely he is busy
    with Medicean codices of Ovid. And he refers to various further codices and folios of Ovid.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 08-12-1652
