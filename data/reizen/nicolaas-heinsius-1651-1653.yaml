- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 12-11-1652
  plaats_verzender: Florence
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: So the Queen has herself written to summon him back to Sweden! though the correspondence
    has been bungled; and since she does not object to my return home I shall take the opportunity
    of taking in the libraries of Switzerland, Germany and perhaps Vienna en route. But no letter
    of exchange has arrived, and I have written to Bidalius to see to this, for me to visit
    Germany. I shall be kept waiting a long time. Meantime Prince Leopold's 2 volumes of Etruscan
    poetry will be finished, augmented by poems in the Queen's honour by the most notable writers
    of Italy, Dati not the least of them. A secretary of the Queen is reported to have come
    to Venice to buy statues and pictures for her, but he is unskilled and has got himself into
    bad odour. Cecconus remains at Lyons (or Leyden) with his band of musicians, one of whom
    the Pope had carried off to Rome and had arrested. He condoles with V. in the chill which
    he now encounters at court, whereat he waxes polemical against Salmasius and also Fresnius
    as detractors. I will contemplate the Historiae Augustae if I can get to Milan; but I am
    destitute of funds. Of the MSS. on the market at Milan Father Spondratus has kept nothing
    of any value. I have urgently commended to him the business (purchase?) of Stephanus of
    Byzantium. In a P.S. he says he will urge Langermann when in Rome to investigate the two
    Vatican Virgils written in uncial letters. I think I saw a third in the Queen's possession.
