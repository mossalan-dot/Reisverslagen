- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 14-03-1653
  plaats_verzender: Venetië
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: My departure from Italy is delayed because Langermann has not yet returned from
    Cesaena (Forli?) where he went to visit the library of the Malaspinae. I shall return via
    Milan, Geneva and Basel. Holmius has written to say that journey money is to be expected,
    but I know better! I wasted hours over the Florence codex of Historiae Augustae, it was
    so corrupt and covered with dust and kept in a dark hall. Furthermore I was taken ill and
    so could not lay hands on the copy of Ovid, or on Claudian which is kept there, to see if
    that copy of Claudian was as old as our sycophant (Salmasius) boasts. Lagierius though he
    travelled with a splendid retinue has clearly been dismissed from the Queen's court in disgrace
    for abominable tricks of misbehaviour. Yesterday I saw a Martial here which along with Pomponius'
    Mela I should have liked to buy for the royal library. Spondratus has let me down over the
    Valerian library at Milan. I could have had Duke Salviati's library if I could have guaranteed
    the promised 100 écus. But there is a danger that the Duke will be dissuaded of his liberality
    and retract his offer, and Prince Leopold will demand it for himself. He describes preparations
    under our Van Golius for an attack by the Dutch fleet on the English in Leghorn harbour,
    where "the parricides" have six ships and eight more at Elba seeking to join them. The Duke
    of Tuscany is enraged and has imprisoned our legate and the captains of two of our ships;
    but this will not deter Van Golius. I chortle over your account of quarrels between "Alastor"
    and Bourdelotius. They say that Morus has refused the professorship offered him at Harderwick.
    I hope this does not mean that in desperation he is giving in to the Papal camp.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 21-03-1653
  plaats_verzender: Venetië
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He narrates the seafight off Leghorn in which the victorious Dutch ships chased
    the English away after capturing 3 and setting 2 on fire; and describes the bravery of the
    Dutch commander Van Golius who had his foot shot away but continued to fight sitting on
    a raised seat. Previous to the fight the Duke of Tuscany had attempted at London to negociate
    for the return of the Dutch vessel intercepted by the English in Leghorn harbour, but the
    Dutch had rejected the Duke's instruction that both fleets should retire from the harbour
    on the ground that this would facilitate the escape of the English.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 05-04-1653
  plaats_verzender: Venetië
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He glances at news of the repulse of the English ships in the Etruscan sea and
    of a battle between Van Tromp and the English fleet in the Channel in which both sides claim
    victory. He mentions stoppage of communications from friends in Sweden, but he quotes a
    message from Wullenius about Vossius, to the effect that the Queen retains him in her favour,
    and will indemnify for any outlays and decorate with an honiran litle but that he seen in
    opening for V's return to Sweden short of an overt reconciliation with Salmasius, which
    is unlikely if it is true that V. is shortly going to make an utterance that will rub his
    adversary the wrong way. He has come across the "Hannibaika" of Appien in Robert Stephonus'
    edition, in which were visible traces of the Libyan edition.
- verzender: Isaac Vossius
  ontvanger: Nicolaas Heinsius
  datum: 09-04-1653
