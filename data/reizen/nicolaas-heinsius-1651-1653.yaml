  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He has had the kindest letter from Salmasius he has ever had, and indeed the Queen
    invites him to Sweden with all speed; but I cannot safely go till after the winter. Meanwhile
    I await a reply to my request to leave Italy. I will employ the time of waiting in seeking
    out those 3 most ancient copies of Virgil in the Vatican. Prince Leopold of Tuscany is preparing
    a collection of the best extant Etruscan (Tuscan) poems to be prefaced by odes in praise
    of the Queen by all the most outstanding geniuses of Italy (he names 2 or 3). He proceeds
    to items about writers of Historiae Augustae, and Pinellus' codices which Casaubon is said
    to have used.
- verzender: Isaac Vossius
  ontvanger: Nicolaas Heinsius
