  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He complains (with many detailed instances) of breakdowns in correspondence, which
    he attributes partly to interceptions of communications partly to H's. negligence (e.g.,
    in not sending in time a letter of commendation to the Doge). He goes into detail about
    the various sums received through Bidalius, etc., and their insufficiency for travelling
    to fulfil his commission of exploring libraries; let alone for buying books and MS. For
    instance Greek refugees from Crete have many books for sale and there are many Greek codices
    in the monasteries of Florence and Naples. He is like Tantalus athirst among plenty. He
    complains particularly that H. will not put him in touch with an address in Stockholm, and
    seems deliberately to bar him from that one person, the Queen, whom he will ever worship
    above all mortals. He complains that if he sights a store of valuable codices for sale,
    procedure will take many months before the necessary instructions and funds can reach him.
    He resents being driven by lack of response to importune like a beggar. He will be obsequious
    to the Queen if she does not deign to reply, but to no one else. He passes to several isolated
    items, e.g., Ferravius is composing a panegyric and his "de re Vestiaria" for dedication
    to the Queen. Crassus and the illustrious Puteus have received coins, but Cardinal Barberinus
    will seemingly be cheated of his, etc.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 12-01-1652
  plaats_verzender: Venetië
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: A voluminous miscellany. He quelled the proposed offer to Langermann of charge
    of the Ambrosian library, because he felt his services are of great advantage to the Queen.
    He refers inter alia to Ferravius, to whom by the Queen's order a golden necklace ("torque")
    had been awarded; and his (F.'S.) progress with a fuller edition of his commentary "de re
    vestiaria"; and his panegyric, and his request to H. to help him with an edition of Pliny's
    natural history. He turns to considerations as to the purchase of the Altempsian library;
    on the honorary disposal of coins as rewards to several who have earned the Queen's favour
    (some in gold, some in silver, some larger, some smaller). He will go campaigning for purchases
    in the libraries of Naples, but the monks will not be put off by promises, as is well known
    to those who know Italy. Langermann has overspent on a buying visit to Milan and must be
    recouped. His mouth waters to think that Langermann could have bought the flower of the
    Valerian library at Milan if he could only have supplied him with another 200 écus. It would
    be well to ask your Mistress whether to buy whole libraries at cost of 2 or 300 écus. Thevenot
    has written that you have seen in Venice a valuable library of a Belgian merchant full of
    forbidden Italian books and bronze artifacts. It can probably be easily acquired. He refers
    to various poems or odes to the Queen, e.g., that of Crassus which he will send from Florence
    if the inquisitors license its issue. He writes that the library of the Grimani is for sale
    and that it contains about 40 excellent Greek codices, and as many Latin; besides a number
    of books on law, coins and statues. He does not know whether it has been decided to bring
    out in Florence a work about Hippocrates on surgery of which he has seen a huge volume in
    the Royal Paris library.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 28-01-1652
  plaats_verzender: Florence
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: 'No communication from you for a month. Address your next to me at Venice. I shall
    hardly be able to leave Italy before the middle of March, then my address will be Germany.
    Holmius has written very forthcomingly saying that he has frequently mentioned me in his
    Mistress'' presence and pressed for sending me journey money: and that she promises much,
    but that he does not know why fulfilment of her promises lags. Spondratus promises me Stephanus
    of Byzantium. We shall see whether he is as good as his word.'
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 16-03-1652
  plaats_verzender: Rome
  land_verzender: IT
