- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 09-08-1652
  plaats_verzender: Florence
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: 'Warns him as others have done of danger impending from a man (Salmasius) who has
    been working against you at court, and into the bargain milking you of your money, and yet
    you have chosen to back him, following your father''s and Grotius'' mistaken advice. I will
    never forgive him for atrocious allegations against my father in his old age. I have again
    and again asked for my dismissal but had no reply, and the Italians come to look down on
    one who seems to be in contempt at court. Besides, he is in lack of money to support him.
    Supplies are alleged to have been sent but he has not had them; presses V. to see to it
    that communications get through to him. He explains why he has had to disappoint the Queen
    of his journey to Sicily and has written to her of the urgency of his return home and also
    of Rutgersius who has worked 12 years in the service of King Gustavus without any pay. He
    is anxious about the safe conveyance of his treasures to Holland (pirates a danger), especially
    his library, also his Ptolemy collected with the MSS. He has poor hopes of the Altempsian
    library: he is going quietly to work on Duke Salviati''s library: he mentions valuable works
    it contains. He has sent the Queen an index of anecdotal codices in the Medici library which
    Holsten compiled, who is now old and failing: and this excuses his not having responded
    to a request for a catalogue of the MSS. in his Royal Mistress'' library. He is offered
    a choice of books from the Valerian library at Milan. Bourdelotius who was very keen on
    establishing an interchange has lost interest. He mentions Langermann''s scholastic doings.
    [ [The letter is too encyclopaedic to touch on everything in it]. ]'
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 20-08-1652
  plaats_verzender: Florence
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He begins with his concern about the safe passage of various correspondence which
    he details. Then passes to lament for V's. forewarned fall from favour at Court through
    the eternal hatred and scheming of the Trojan horse you introduced into it. I myself have
    learnt by bitter experience to steel myself against all hopes of favour since he joined
    the Queen's entourage. Next he says he is sick of being exiled any longer; and prohibited
    as he is from further library researches, etc. for lack of funds; he has despatched no MSS.,
    indexes of antiquities or poems in praise of the Queen through doubt as to the safety of
    their transit. He has been notified that he is receiving a stipend from the Queen of 500
    imperials a year, which is utterly false; and he is actually being falsely charged with
    some 800 écus which he is said to have lavished on his travels. No doubt that "proto medicus"
    engineered this. He has written to Holmius for a stop to these impositions, and to the Queen
    to permit his return home to save his family from bankruptcy. Rutgersius' fate is a lesson
    to him, who was rewarded for his faithful vital service to the King with a death in beggary.
    We shall never be at peace as long as he (Salmasius) lives. He calls on V. to join him in
    enquiring into and exposing S's. shady domestic life (a Claudius who has got a Messalina
    for a wife). In a P.S. he says he has received from Bourdelotius a recommendation for overtures
    of peace with "Alastor" (Salmasius) on take it or leave it terms; but has replied that "Alostor"
    is a man who will never drop his hatreds.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 22-08-1652
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He has written to Blaevius and is sending one to Gronovius; thanks V. for his letter;
    is awaiting Father S$ reply before seeing about buying the MS. of Stephanus of Byzantium.
    As for himself he has written 3 times demanding his return to his country. He describes
    his reply to Bourdelotius's proposal for concord between me and my adversary which pointed
    out that the Queen esteems Saumaise very highly and that without a reconciliation I could
    not return to Sweden. His reply is a vehement onslaught on that man, in which he exposes
    the lies he had planted on Bourdelotius. about me If the Queen who summoned me to Sweden
    to work for her repents of her favour, well and good, but my adversary shall pay for my
    ill fortune, for I will publish all he has written about the Lutheran church, Sweden, the
    arrogance of the high officials, their poisonous relation to him. Never mind about the sacrifice
    of literary interchanges. I do not think much of friendship between abject, servile souls.
    He appends a note to say he thinks Gratcian is the author of The poem on the war of Granada,
    and is said to be a poet of quality next to Tasso and Ariosto.
