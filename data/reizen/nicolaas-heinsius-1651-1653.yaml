  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: He has received money to pay off his debts and hopes to receive money for his journey
    to Venice and then back to you. Address me meanwhile at Cologne. If I can I shall go to
    Milan to compare the copy of "Historiae Augustae" with the published editions but first
    estimate the importance of the copy possessed by the Franciscans in Florence. The other
    day with Dati I went through the Benedictines' library here and saw valuable Greek codices
    and works (which he details) which I think can be bought, but on this I have had no reply
    from Sweden, and am becoming a laughing stock to the Italians. I have had to put off clinching
    with the offer to give the Queen codices contained in "Bibliotheca Salviata" till I see
    her. I have heard from Holmius and Capellanus holding out promises if I return to Sweden.
