- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 30-04-1653
  plaats_verzender: Milaan
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: After 3 days here I go to Geneva and thence back to you (D.V.) as lack of funds
    which worries and upsets me greatly will force me to do. He has had MSS. Historiae Augustae
    produced from his Ambrosian library; one resembles that of at least 3 or 400 years old of
    the Franciscans at Florence. I have had no time to touch the Ovid codices. I have asked
    Father Spondratus for Stephanus' "de Urbibus". I have entrusted the conveyance by sea from
    Venice 4 chests full of books destined for the Queen; and two more from Leghorn. May they
    not fall into the hands of the English pirates.
- verzender: Nicolaas Heinsius
  ontvanger: Isaac Vossius
  datum: 17-06-1653
  plaats_verzender: Bazel
  land_verzender: ZW
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: Troubles in Switzerland had prevented him from going to Berne to get a catalogue
    of the library, which Buxtorf had told him the Queen wanted. But he will send Langermann
    to copy (describe) the index. He hopes things are better at the Queen's court now that it
    is reported from Paris that the "arch healer's" fortunes have suffered a frost. He proceeds
    to mock the two Frenchmen (Salmasius and Bourdelotius) coupling them together. Choose which
    victim you prefer, the febrile Alaster or the still more febrile medico. Bidalius has treated
    me abominably not answering my repeated letters and I have only had a mere pittance under
    an allegation that the Queen is chary of sending money.
- verzender: Isaac Vossius
  ontvanger: Nicolaas Heinsius
  datum: 10-07-1653
  plaats_ontvanger: Keulen
