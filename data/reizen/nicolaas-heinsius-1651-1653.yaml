  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/forms/advanced?sort=date-a&dat_to_year=1673&dat_from_year=1641&start=100&people=Heinsius,%20Nicolaas,%201620-1681&start=150
  opmerking: Goesius has promised the necessary money and I am now in good heart. I shall go
    to Venice and Padua for some weeks and perhaps then to Milan. I always thought Holmius'
    report of a letter from the Queen to me was false, and my investigations more or less bear
    this out. I regret the loss of your MSS. I wish at least Pliny had been restored to the
    Leyden library. As to your returning to Sweden I advise you to bide your time, as maybe
    the influence of the "protomedici" will wane and the guess is that Salmasius will not return
    thither. I am astonished at the quack's impudence in running down Virgil and Horace. I am
    glad you are thinking of Martial (he mentions several codices he knows of in various libraries);
    he also mentions knowing of Ovids possessed by Gaddius arid Scriverius).
