  opmerking: He describes his doubts how to get his letters and parcels to their destinations
    and is troubled by non arrival of those addressed to him. Holmius has said the Queen wants
    him to go to Sweden, but no instructions yet from her nor the money Holmius said would be
    supplied. Have his three bundles reached him (the contents of which he mentions)? I cannot
    get sufficient access to the Medici library, so shall go to Rome, especially to investigate
    those three very ancient copies of Virgil. Nothing of importance left over in the Milan
    library, but hopes held out of Stephanus. [ [A number of further day to day items]. ]
- verzender: Isaac Vossius
  ontvanger: Nicolaas Heinsius
  datum: 07-11-1652
  plaats_verzender: Amsterdam
