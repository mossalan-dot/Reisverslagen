  bron: Oxford, Bodleian, MS D'Orville 468 pp. 148-149
  link: http://emlo.bodleian.ox.ac.uk/profile/work/4c0c13db-b833-421e-99af-4f0e61c52deb?sort=date-a&rows=50&dat_to_year=1673&dat_from_year=1641&people=Heinsius,%20Nicolaas,%201620-1681&baseurl=/forms/advanced&start=18&type=advanced&numFound=424
  opmerking: He writes in depression at being held up in Paris from his intended journey to
    Italy and at having heard nothing from V., which strikes him as unfriendly. He is loth to
    burden him with entreaties, as Gronovius and others do; but if you want to know what I am
    doing you will not be deceiving yourself if I say my time has been trifled away; but I have
    yesterday given the final touch to some verses I have been urgent to write, and shall shortly
    be sending them by the hand of a merchant, Reinstius by name, who possesses marble statues,
    inscriptions and many other antiquities galore. Has he not a brother Gerard in Amsterdam?
