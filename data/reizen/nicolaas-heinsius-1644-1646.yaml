  opmerking: Chiefly a detailed account of the miserable disordered state of the libraries which
    he found on arrival. The Puteani (Dupuy brothers) rearranging the Royal library and making
    a new catalogue. Thuanus' library he could only see once and that casually. Petavius' he
    found at sixes and sevens, as if he had departed suddenly leaving it unfinished. Nothing
    but trash in St. Victor's monastery, he can mention only having come across a few worth
    while classical works (which he names). Richelieu's books scattered among his heirs. The
    library of the late Stella is said to have been bought by Cardinal Mazarin. He says he has
    a Puteanian codex of Martial, but hopes to see a better one. He will go on to Orleans where
    the library is full of books in MS. etc.
