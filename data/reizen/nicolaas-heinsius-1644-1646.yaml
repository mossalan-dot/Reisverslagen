  opmerking: Laments his failure through mishaps on his journey to embrace V. before my departure
    to France. Let them now foster their friendship through correspondence in which he will
    do his part. He is thinking of publishing Martial in a popular (communis) edition but in
    order not to duplicate the work he would like to know which libraries V. has investigated.
    Both he and other admirers of yours in this city hope you will be soon bringing out that
    author. Menagius is among others here who often refer to you, and he asks what we are shortly
    to expect from you. Petavius has given us to understand that you have Ignatius' letter in
    the press. Your father's "de Barbarismo" issued before my departure from Holland has to
    my surprise not yet reached Paris where it would certainly be in demand.
