  plaats_verzender: Rome
  land_verzender: IT
  relatie: geleerde-geleerde
  taal: Latijn
  bron: Oxford, Bodleian, MS D'Orville 468 pp. 190-196
  link: http://emlo.bodleian.ox.ac.uk/profile/work/018bd60c-c4f8-4506-a579-792416da8a87?sort=date-a&rows=50&dat_to_year=1673&dat_from_year=1641&people=Heinsius,%20Nicolaas,%201620-1681&baseurl=/forms/advanced&start=16&type=advanced&numFound=424
  opmerking: Relief and delight at having heard from him, but laments that correspondence probably
    full of information about the libraries of Italy has not arrived. He has meanwhile instructed
    all friends he has met in Italy to prospect for old books. In Florence he had met with many
    printed books; has begun collecting coins and inscriptions, and he hopes to be allowed to
    describe those in the Pamphylian garden; and many have been dug up lately. Little time for
    study in Rome, almost entirely given up to going to the Vatican, walks and salutations.
    Only the Barberini and Vatican libraries have been open to me, but not much of importance
    to see. Holsten tells me I may get admission to the Farnese library, but only to glimpse
    it. Bullialdus is said to have repeatedly visited the Medici Library and inter alia to have
    transcribed (discripsissi) many works of astronomy, and now is living at Constantinople.
    I wonder that you have not thought about the Medici codexes of Justin of which there are
    very many examples in the Medici library, and 2 very old ones, the earlier in Longobardii
    writing. He mentions several other works, e.g., a much overdue history of our country presented
    to V; a copy of his Italian book sent to Barlaeus by its author Aprosius an Augustinian,
    a monk of the highest character. I wish you would write to him on my behalf and salute him.
    Inter alia he mentions Gronovius as referring to Julius Nypsius' Field measurement.
