id: nicolaas-heinsius-1644-1646
titel: Educatiereis naar Frankrijk en Italië
reizigers:
- nicolaas-heinsius
reistype: educatiereis
jaren: 1644-1646
vertrek: '1644'
gebieden:
- Nederlandse Republiek
- Zuidelijke Nederlanden
- Duitsland
- Frankrijk
- Italië
beschrijving: Reisde in 1641 en 1642 naar Engeland om bibliotheken te bezoeken en tussen 1644
  en 1646 naar de Zuidelijke Nederlanden, Spa, Frankrijk en Italië, waar hij verschillende bibliotheken
  en geleerden bezocht. In Italië was hij in het gezelschap van Adriaen van Blijenburgh (1616-1682)
  en Matthijs van der Merwede (ca. 1625-ca. 1677), heer van Clootwijck.
reisgezellen:
- naam: Adriaen van Blijenburgh heer van Naaldwijk, ridder in de orde van St. Michiel
  jaren: 1616–1685
- naam: Matthijs van der Merwede heer van Clootwijck
  jaren: 1625–1677
