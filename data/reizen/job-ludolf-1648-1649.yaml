beschrijving: Trad in 1648 in dienst als tutor van de kinderen van baron van Rosenhahn, de Zweedse
  gezant in Parijs, en reisde op verzoek van Christina van Zweden (1626-1689) naar Rome, waar
  hij zich toelegde op het Ethiopisch.
