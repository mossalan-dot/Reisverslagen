beschrijving: In april 1654 reisde hij met Grenier naar Engeland en in 1655 maakte hij een tweede
  reis.
poezie:
- titel: Op myne reise, naa Londen, aan myne suster, Katarina
  dichter: Joannes Six van Chandelier
  aan: Katarina Six van Chandelier
  datum: '1655'
  locatie: Engeland
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: In de zomer van 1655 richtte Six zich met dit gedicht tot zijn zuster in Amsterdam,
    waar een pestepidemie woedde. Hij maakte in die tijd zijn tweede reis naar Engeland. Het
    gedicht staat op p. 557-559 van zijn bundel Poësy.
  tekst: "Wyl woeste pest, de graaven mest,\n \nMet vleisch,\n \nZoo doe ik weer, van Amstels\
    \ veer,\n \nEen reis,\n5\nNaa Londen toe. Niet om Gods roe\n \nt'Ontgaan:\n \nIn ieder land,\
    \ daar kan syn hand\n \nOns slaan.\n \nWie sondigh is, loopt nieuwers mis.\n10\nDe dood\n\
     \nSchiet oover al, langhs bergh, en dal,\n \nVeegh loot.\n \nOch of! ik sturf, en rust\
    \ verwurf,\n \nVoor pyn:\n15\nMyn ziele wenscht zoo maar ontmenscht\n \nTe zyn.\n \nIk laat\
    \ ons huis, noch sonder kruis,\n \nMids vrees\n \nVan sterven maar geen kruissen baar,\n\
    20\nAan 't vleesch.\n \nSloopt 's Engels byl een balk, of styl,\n \n't Is God.\n \nGod gaf,\
    \ God nam. 't Is, hoe het quam,\n \nMyn lot.\n25\nLyk 's Vaaders toorn den eenenhoorn,\n\
     \nDeur vier\n \nVerteeren kan, met alle man\n \nGeen sier\n \nTe sengen, zoo kan 's Heemels\
    \ boo,\n30\nMet douw\n \nVan pestigh wee, dees heele stee,\n \nIn rouw\n \nOntsteeken, dat\
    \ het ons niet vat,\n \nEn 't graf,\n35\nAan onse keel, niet meededeel\n \nDie straf.\t\
    Over dit hoofdstuk/artikel\nLANDEN\nGroot-Brittannië (en Noord-Ierland)\n\n[p. 736]\t\n\
     \nVerlies ik bloed, dat God verhoed,\n \nGeduld\n \nGaat neeven my, en ik ben vry,\n40\n\
    Van schuld.\n \nAl reisde ik niet, zou, wat geschiedt,\n \nGeschien.\n \nGods schiklik werk,\
    \ heeft 's menschen perk\n \nVoorsien.\n45\nGeen brein, hoe kloek, ontvouwt dat boek\n \n\
    Des wils,\n \nAl maakt krakeel, daarom zoo veel\n \nGeschils.\n \nDe baan ten end gerunt,\
    \ zoo wendt\n50\nMen niet:\n \nOm dat de geest, op 't vaale beest,\n \nDan schiet.\n \n\
    Geen machtigh vorst keert, op syn borst,\n \nDie pyl:\n55\nMaar gaat zoo bros, gelyk een\
    \ os,\n \nTer byl.\n \nHiskiaas tyd, kreegh wel respyt,\n \nSchoon uit,\n \nIn 't sterflik\
    \ oogh, maar niet na 't hoogh\n60\nBesluit.\n \nMyn toeverlaat, met al heur saad,\n \nHoe\
    \ seer\n \nIk heur bemin, met ziel, en sin,\n \nEn eer,\n65\nKan 's leevens snik, geen oogenblik,\n\
     \nIn 't lyf,\n \nVertraagen, schoon ik in myn woon\n \nVerblyf.\n \nIk gaa in 't myn, als\
    \ elk in 't syn,\n70\nOm 't best.\n \nGod spaar ons dak, voor ongemak,\n \nEn pest."
- titel: Oesters te Kolchester
  dichter: Joannes Six van Chandelier
  datum: herfst 1655
  locatie: Colchester, Engeland
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: De maaltijd vond plaats tijdens een van Six' reizen naar Engeland in de jaren
    1654-1655, vermoedelijk de tweede reis in de herfst van 1655, die hem naar Londen en Northamptonshire
    voerde. Vanuit Colchester zal Six zijn overgevaren. Het gedicht staat op p. 580-581 van
    Six' bundel.
  tekst: 'Hoe meenighmaal, getrouw Kolchester

     

    Verkracht, door ''t kooninghslachtigh heir,

     

    Ten roem van uw kasteel, en vester,

     

    Haakte ik, om oover Noordens meir,

    5

    Na hier, myn leeven te betrouwen,

     

    Al was ''t slechts, met een vischers schuit,

     

    Van dunne planken saam gevouwen,

     

    Te wulps belust, en daar op uit,

     

    Dat ik myn waaterende tanden,

    10

    En onversaadelyke smaak,

     

    Ter deegh mocht tergen, langs uw stranden,

     

    Aan oesterputten, die schier braak,

     

    In slikken van de zeeeb, leggen,

     

    Om zoo de varsche siltigheit,

    15

    Waar oestereeters veel van seggen,

     

    Te proeven, tot recht onderscheid?

     

    O! oestertjen, met groene baardjes,

     

    O! blanke bolle, en volle beet,

     

    Betaal myn snoeplust vry, met schaartjes,

    20

    Aan ''t mes, ter schulpknops breuk, gesmeedt.

     

    Laat nu, en dan een ander vinger,

     

    Met uwe vliempjes, drupplen bloed,

     

    Met ik uw zieltjen glad inslinger,

     

    Zoo krygh ik hart, en nieuwen moed.

    25

    Dat Kent, ons Vlieland, dat oud Baaijen,

     

    En zoo der eedler oester is,

     

    Bereidt, of raauw, om ''t lekkerst kraaijen,

     

    Ik keur Kolchesters raauwen visch.

     

    Geen beeter saus dan d''eige soppen,

    30

    In ''t dubble schulpjen genatuurt,

     

    Met Lissebons limoene droppen,

     

    Met sout, en peeper wat gevuurt.

     

    O! lekkernytje, sonder enden,

     

    Al ooverloopt de volle maagh,

    35

    Hoe langh de tanden konnen schenden,

     

    Zoo blyft de smaak al eeven graagh.

     

    Al had ik Polifemus darmen,

     

    Noch zou ik, van de kleinte, karmen.'
literatuur:
- BWN, XVII, 705-706; NNBW, X, 924-925; Verkuyl 1974, 47-49; Van Caspel 1978, 119-121; Van Bork
  en Verkruijsse 1985, 527; Six van Chandelier 1991, xxxv-xlv; Dijstelberge 1993, 331-336; Schenkeveld-van
  der Dussen 1993, 255-260; Porteman 1997, 123-134.
