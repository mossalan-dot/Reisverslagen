  tekst: 'Uit uw brief van den 25sten dezer en uit een brief van Z.H. aan den overste Erentreiter
    blijkt, wat gij gedaan hebt bij de Heeren van het gerecht. Uw raad zal ik volgen. Tot mijn
    spijt hoor ik ook door u van de ‘miserable conduitte’ van mijn zoon; het is zeker een gevolg
    van de ‘incapacitet’ van dengene, die hem buiten mijn toedoen was toegevoegd. Ik doe nu
    mijn best hem ‘eine capable person’ toe te voegen, ‘der ihm dermasen mag conduisiren, dasz
    er die fruchte von so noble und kostbair reise mag geniesen.’ De drost Marenholts kan u
    over alles nader inlichten.


    Sandhorst, den 31 Januarii Anno 1650.'
