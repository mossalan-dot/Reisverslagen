beschrijving: Maakte in 1651 en 1652 een diplomatieke missie naar Engeland in het gezelschap
  van Jacob Cats (1577-1660) en Paulus van der Perre (ca. 1598-1653). De reis wordt beschreven
  door Adriaen Schagen (1633-1699), Lodewijk Huygens (1631-1699) en George de Mey (1628-1712).
