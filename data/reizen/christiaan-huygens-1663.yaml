  tekst: 'Ultimi Augusti 1663.

    Je n''ay rien d''avantage a vous mander touchant le pastel que ce que je vous escrivis par
    l''ordinaire passè. Un peu de pratique vous enseignera le reste. Ie le trouue aussi bien
    que vous un peu trop cassant, et outre cela le crayon noir ne marque pas bien la ou on a
    peint avec le pastel obscur. A Paris je m''informeray du Sieur Nanteuil comment il fait
    le sien.

    Le portrait de la belle que j''ay copiè chez Lilly a fort bien reussi et ne ressemble pas
    seulement a l''original mais a la dame mesme, avec qui je dinay l''autre jour chez Monsieur
    Brereton. Je voudrois que vous m''envoiassiez vostre dernier ouurage pour veoir si vous
    aurez mieux fait quant au colorit, qui a la veritè avoit trop de noir comme je vis en le
    comparant avec quelques portraits de Couper.

    Si vous me l''envoiez sous condition de le r''avoir, je me fais fort que le Signor Padre
    n''y mettra pas la main dessus comme aux precedents.

    Nous aurons bientost la fin de nos affaires en cette Cour, et je croy que dans 15 jours
    nous pourrons partir.

    Hier l''on me dit que Bart van Vlaerdingen m''auoit estè demander et qu''il se tient a la
    campagne, de sorte que peut estre je n''auray pas le bonheur de le veoir. Monsieur Swan
    est parti ce soir pour nostre pais, et de la s''en va a sa Residence de Hambourg.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
  datum: 14-09-1663
  plaats_verzender: Londen
