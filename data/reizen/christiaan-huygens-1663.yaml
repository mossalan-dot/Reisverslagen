  tekst: "A Paris ce 15. Julliet 1663.\nMonsieur\nJe vous prie d'auoir agreable que Je vous\
    \ asseure de mon affection et que Je vous tesmoigne limpatience que J'ay de vostre retour.\
    \ Vostre personne est si chere a vos amis quils ont dela peine destre si longtemps priuez\
    \ de vostre presence, vous Mobligerez Monsieur de croire que Je conserue pour vous et pour\
    \ Monsieur vostre pere toute lestime et le respect dont je suis capable Et que Je souhaite\
    \ auec passion que vous me fassiez naistre les occasions de vous fair cognoistre que je\
    \ suis veritablement\nMonsieur \nVostre treshumble et tresobeissant seruiteur d'Montmor."
