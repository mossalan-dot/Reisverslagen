  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Londres ce 29 Juin 1663.

    Vostre portrait de miniature estant dans vostre lettre toute ouverte Il Signor Padre s''en
    est emparè le premier et n''a point envie de s''en defaire, c''est pourquoy vous ne devez
    pas me l''imputer si je ne la renvoie point. Je trouve que pour estre vostre premier ouvrage
    il a tresbien reussi, et vous feriez bientost aussi bien que vostre maistre si vous aviez
    la patience de continuer. Mais puis que vous dites qu''il y va tant de temps je ne croy
    pas que ce sera vostre fait. Il me semble que vous avez voulu corriger en quelque facon
    ce qui n''est pas bien dans le tableau de Hanneman, comme la longueur du visage, le trait
    de la bouche, et cela ne vous a pas tout a fait mal reussi, mais d''un autre costè vous
    avez fait l''oeil gauche un peu trop long, de sorte que le portrait ressemble mieux quand
    on couvre cet oeil. Il n''a point estè endommagè par le chemin du tout; c''est pourquoy
    vous pouvez bien m''adresser aussi la belle brune quand elle sera achevée, et je vous promets
    d''en dire mon avis aussi franchement que de cett'' autre. J''ay veu ces jours passez une
    partie des desseins de Lanier, et entre autres une grande quantitè de Raphael qui sont incomparables.
    Lilly ne m''a pas encore donnè sa recepte pour le pastel, parce que je ne l''ay pu trouver
    chez luy depuis, ou bien s''il y estoit, there was a Lady sitting.

    Je demanderay a Monsieur Morray qui est cet habil homme qu''il m''avoit adressè. Pour estre
    of the Royal Society, il ne faut pas que vous vous imaginiez que ce doive estre quelque
    chose d''extraordinaire, Car je voy qu''on y admet assez facilement tout le monde. Il y
    a 2 jours que j''en suis aussi sans que je me trouve plus habile, en quoyque ce soit, qu''auparavant.

    Ayez soin je vous prie de l''enclose a Monsieur van Leeuwen. Celle que vous m''avez envoiee
    de sa part estoit plus vieille de 15 jours que la vostre.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
  datum: 13-07-1663
