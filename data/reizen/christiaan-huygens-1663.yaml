  tekst: 'A Londres ce 6 Jullet 1663.

    Voicy la lettre pour Janus Vlitius que je promis par ma precedente. Il me mande qu''il a
    envoiè chez nous un exemplaire de son livre nouueau, qui est le Prodromus de sa description
    de Breda. S''il se presente quelque occasion pour le faire tenir icy ou a Paris, quand nous
    y serons vous me ferez plaisir de l''envoier. Il se plaint de ceux du Conseil du Prince
    de ce qu''ils s''opposent a l''Edition de la dite description, sur quoy je luy conseille
    de s''adresser au frere de Zeelhem.

    Je n''ay rien a vous mander depuis ma precedente mais j''attens que vous m''escriviez des
    nouuelles de la Haije. Il n''y auoit rien de vostre part la semaine passée ce qui me fait
    croire que vous estes demeurè a Zulichem plus long temps que vous ne faisiez estat dans
    vostre derniere. Hier il y avoit grande joie a la cour par l''arrivee d''un Expres du Roy
    de Portugal qui confirma la defaite des Espagnols des quels il n''y en auroit que 2000 d''eschappez,
    avec la perte de tout le canon. Je ne doute pas qu''on n''ait desia toutes les particularitez
    chez nous de cette deroute.

    Nous vismes hier une teste de Cromwel, moulée sur la siene propre apres sa mort, et peinte
    de couleurs avec des yeux de verre fort bien faits, de sorte qu''il semble qu''on le voit
    tout vivant.

    Elle a estè cydevant avec la figure de tout son corps dans la Chapelle de Westminster, comme
    celles de plusieurs roys et reines, que sans doute vous aurez vues dans des quesses de bois,
    ou ils sont dans leurs propres habits, tout debout. Celuy qui garde le Cabinet du Roy, garde
    aussi maintenant cette belle relique et nous l''a fait veoir. La Lune que Monsieur Wren
    a ebochée se garde aussi dans ce cabinet et est fort plaisante a veoir avec toutes ses taches
    et petites vallees rondes.

    Mandez moy je vous prie comment se porte la dame de Moggershil et si elle n''accouchera
    pas bientost, car il y a longtemps que je n''en ay ouy parler. Je voudrois bien scavoir
    aussi si madamoiselle Tuytie ne peut pas marcher encore et 2 ou 4 des difficiles mots qu''elle
    scait dire.'
- verzender: Christiaan Huygens
