  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "A Londres ce 23 Juin 1663.\nCellecy vous sera rendue par Monsieur de Monconis qui\
    \ est de mes amis, et un fort honnest homme et fort curieux de toutes les belles choses.\
    \ Il est venu icy de Paris avec le fils de Monsieur le Duc de Luines qu'il accompagnera\
    \ a ses voiages d'Allemagne et d'Italie, et passant maintenant d'icy en Hollande il m'a\
    \ priè que je luy donnasse quelque adresse chez nous. Il vous demandera pour veoir ma machine\
    \ du vuide sans que pourtant il soit besoin de la faire agir, et mesme je croy qu'elle n'est\
    \ pas trop en estat de cela. Vous pourez outre cela luy monstrer mon horologe a pendule,\
    \ le cabinet de mon pere et sa bibliotheque, sans oublier dans le cabinet le miroir concave\
    \ et le dessein de Gendt. Il scaura vous rendre compte de l'estat de l'Academie qui est\
    \ icy a Gresham Colleg et des experiences que l'on y fait, que nous avons veues ensemble.\
    \ Il a aussi fort connu Divini a Rome, et vous vous souviendrez peut estre qu'il est souvent\
    \ citè dans le petit livre que le dit Divini escrivit contre moy.\nJe fus voir hier Monsieur\
    \ Lilly le peintre et voyant dans son cabinet des portraits qu'il a faits avec du pastel\
    \ je luy demanday de quoy le sien estoit composè, et il me promit de m'en faire avoir la\
    \ recepte. Il se sert d'un papier un peu grisatre et n'employe de couleurs que dans le visage\
    \ et cela encore legerement, soustenant que l'autre maniere est trop penible et de moindre\
    \ grace. Tout ce qu'il fait est fort beau et je tascheray d'en avoir quelque chose pour\
    \ l'imiter et pour vous le faire veoir a nostre retour.\nA Monsieur \nMonsieur de Zeelhem\
    \ \nA la Haye."
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
