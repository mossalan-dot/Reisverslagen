  tekst: 'A Londres ce 27 Jullet 1663.

    Je voy bien qu''il faudra se consoler de la perte de vos lettres, puis que Monsieur Vlac
    en a demandè en vain des nouuelles aux gens de Monsieur le Greffier.

    Il y a longtemps que Mon Pere a souhaitè une copie de la teste de Cromwel, et je croy qu''il
    la demandera au Roy. le mal est qu''on la peinte de couleurs et que l''on craint qu''elles
    se gasteroient en mettant du plastre par dessus, quoyque ceux du mestier n''en facent pas
    difficultè. Celuy qu''il en consulta est un maistre fort expert et moule tous les jours
    des visages de personnes vivantes, sans leur donner aucune incommoditè; si bien que nous
    avons dessein de nous faire mettre des masques de cette façon l''un de ces jours. L''on
    se tient debout, avec une serviete a l''entour du col seulement, et des emplatres sur les
    yeux et sourcils. Je connois une famille entiere ou il y a 10 enfans qu''il a tous moulez
    avec leur pere et mere.

    Ce que je vous ay mandè de l''enfant de 160 livres est affirmè par des personnes tres dignes
    de foy et fut repetè encore la derniere foy que j''estois a l''aslemblee a Gresham Colleg,
    seulement l''on adjousta encore 4 mois a l''age de ce petit poupon, de sorte qu''il en a
    22 en tout.

    Hier nous sumes veoir dans la ville la maniere de proceder dans la cour criminelle qu''on
    nomme the Kings Benches, et assistames à l''examination et condemnation de plusieurs miserables
    qui se fait d''une toute autre facon que chez nous. Nous y dinasmes avec Messieurs les Sherifs
    a une grande table bien garnie qu''ils sont obligè de tenir pendant tous ces jours du term
    time, et fusmes traitez avec beaucoup de ciuilitè. Il y avoit entre autres un Alderman qui
    me pria fort que je vous fisse ses baisemains, se souuenant du bon acceuil que vous luy
    aviez fait a Hofwijck, alors qu''il fut a la Haije parmy ceux qui vinrent querir le Roy.
    C''estoit un jour que Monsieur van Leeuwen avoit traitè chez luy quelques uns de ces Messieurs
    dont cettuicy estoit l''un.

    Je doute fort si aucune des nymphes que vous avez regalees ces jours passez gardera si longtemps
    de la reconnoissance.

    Pour ce qui est de mon inclination pour les niepces plustost que pour les neveux j''en pourois
    escrire un traitè entier, mais pour avoir plustost fait je vous diray seulement, que lors
    que je vous parlois de ce choix, je pensois a quelques uns de nos cousins et cousines, en
    hoeveel meer men aen d''eene had als aen d''andere. Je ne veux pas dire du mal de personne,
    mais quel oncle n''aimeroit pas mieux d''avoir quelques niepces comme Joffrouw Ida, Juffrouw
    Constantia &c, que des neveux comme messieurs leurs freres, T. Huygens et autres. Voiez
    combien de facheuses reprimandes le bon Pere a estè obligè de faire a ce dernier et jamais
    pas une a Mademoiselle Martha Maria. Beaucoup moins a Mademoiselle Egidia cette merveille
    de bontè et puretè virginale, qui a l''age de 22 ans n''auoit pas encore pensè a mal. Adieu.

    Je m''estonne que le frere de Zeelhem ne m''a point repondu.'
- verzender: Christiaan Huygens
