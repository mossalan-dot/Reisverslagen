  tekst: 'A la Haye le 10 d''Aoust 1663.

    Le Sieur Monconis m''apporta il y a trois jours vostre lettre du 23. Juin. Nous auons conferé
    sur plusjeurs articles et mesme fait essay de sa Lunette de Diuinis, dont je trouve le principal
    verre fort bon, mais elle n''est pas exempte des defaults qu''ont toutes celles qui sont
    de cette longueur quand on s''en veut seruir de jour. Dans les Oculaires aussi dont il se
    sert, on remarque touts les points du verre, puis le tuyau est si gros et si lourd que je
    ne voy rien d''extraordinaire à cette piece. Le maistre est il scauant, scait il les Mathematiques
    ou quelle sorte d''homme est ce? Dans des discours que nous eusmes de Borri, je le trouve
    fort invaghito de la pierre philosophale, qu''il appelle la philosophie par excellence.
    Un de ces philosophes là a depesché en fort peu de jours la mere de Bisschop, au grand contentement
    de ses heritiers.

    Si vous auez moyen de parler encor a ce faiseur de pastel je vous prie de me faire auoir
    esclaircissement sur les doubtes que je vous ay proposés en ma derniere, sur ce que signifient
    ces mots de Bice, blacblew, Russet, et puis de scauoir de luy si auec de certaines couleurs
    il ne faut pas mesler plus de Whiting qu''auec les autres. Hanneman m''a promis de me faire
    auoir de l''indian red, et dit que Whiting s''appelle icy Cryt-wit, dont j''ay envoyé querir
    et vous envoye un petit morceau pour voir si c''est la mesme chose dont ils se servent par
    de là. Le blac blew Hanneman croid que c''est de la Terre de Couloigne (Ceulsche aerde)
    bruslée dans un creuset, qu''il dit devenir par la d''une couleur bleue fort brune et couverte.
    Il faut aussi scauoir au vray quel est le bleu dont il se sert d''ordinaire. Ce Whiting
    me semble si mol que si le Tabax aerde n''y apporte du remede je ne puis comprendre d''ou
    cet pastel peut auoir de la dureté autant qu''il faut. Je vous prie de m''esclaircir sur
    ces scrupules et de m''envoyer dans une lettre deux ou trois petits bouts de vostre pastel
    pour voir un peu comment il marque et de quelle consistence et dureté il est. Vous dites
    aussi que dans le Crayon de Lilly il n''y a du pastel que dans les visages, et ce fort legerement.
    Ce fort legerement je ne le comprens pas fort bien, comment cela va t''il. ne suit il pas
    tout le colory comme il est dans les ombres, le mezze tinte et par tout? ou n''y a t''il
    que du noir dans les enfoncements? J''aurois desja essayé la composition du pastel mais
    je n''ay pû auoir icy du Tabackaerde. Aussi cela ira mieux, quand vous m''aurez fait response
    sur toutes ces questions icy.

    La mouleure de plastre nous la remettrons à vostre retour. Adio.

    Vander Does a raison de dire qu''il y a encor trop de noir dans les ombres de mon pourtrait,
    je l''ay bien reconnu moy mesme. comment fait il le galand. a t il encore sa collection
    de tableaux, dont on nous a parlè icy?'
