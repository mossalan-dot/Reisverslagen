  tekst: 'Londen den 13 July 1663.

    Ick was van desen morgen bij de man daer Monsieur Lilly de schilder my geaddresseert hadde
    om te sien op wat manier hy de Crayons maeckt. Ick sagh hoe hy daer mede te werck gingh
    en informeerde my voorts van alles soo veel als ick kost, en heb onthouden als volght.

    De stof van de Crayons is ontrent 3 deelen van seecker wit, datse hier Spaens wit of witsel
    hieten, daer men oock de mueren me wit; het is in groote klompen, breeckt seer licht en
    is soo fijn dat het niet tusschen de tanden en knarst. Hierbij komt een deel fijne toback
    pijp aerde, die mij docht fijnder en vetter te

    Traduction

    J''étais ce matin chez l''homme auquel Monsieur Lilly le peintre m''avait adressé pour voir
    de quelle manière il fait les crayons. Je vis comment il s''y prit et m''informai ensuite
    de tout, autant que je pus: j''ai retenu comme suit.

    La matière des crayons est d''environ 3 parties d''un certain blanc, que l''on appelle ici
    blanc d''Espagne ou blanc de chaux, avec lequel aussi on blanchit les murailles; il se trouve
    en grands morceaux, se casse très aisément et est si fin, qu''il ne crie pas entre les dents.
    On y ajoute une partie de terre à pipe sine, qui me semblait être plus sine et plus grasse
    que celle que j''ai vue à la Haye. Mais d''abord on casse le blanc sur une pierre à broyer
    avec un couteau, en y ajoutant de l''eau pure, et lorsqu''il est pétri tant soit peu, on
    y mêle la couleur, qui premièrement est broyée à part avec de l''eau, mais pas trop fine.
    Lorsque ceci est bien mêlé, avec aussi peu d''eau qu''on le peut faire convenablement, on
    y ajoute après la terre à pipe, et la pétrit avec le reste, en employant toujours le couteau
    et rien d''autre. Après cela on roule de petits bâtons de cette composition sur un papier
    propre, en formant d''abord la pointe avec les doigts puisque, autrement, il reste facilement
    un creux au milien. Lorsqu''ils ont séché 5 ou 6 heures d''eux-mêmes (car il ne saut pas
    les exposer au soleil ou près du feu, parcequ''alors ils deviendraient trop durs) on les
    roule de nouveau pour les rendre plus droits et plus ronds: après cela on les met de suite
    à sécher, ce qui exige bien 7 ou 8 jours en été, et bien 6 fois autant en hiver, de sorte
    que, ordinairement, on ne les fait pas dans cette saison.

    Pour faire des couleurs foncées, on emploie le même blanc, mais noirci par quelque autre
    matière, qui s''y trouve mêlée, ce qui est vendu ici en cette condition. L''indigo, le stil-de-grain,
    la laque ne peuvent servir pour ces crayons; et au lieu de laque ils employent du Rouge
    Indien, couleur dont je ne sais pas si on la vend en notre Pays. On écrit facilement avec
    ces bâtons sur papier, et ils ne deviennent jamais durs. Le Papier dont Lilly se sert et
    qu''il tient pour le meilleur, est d''un gris pale et n''est pas dur. J''ai fait préparer
    une boîte de ces crayons, dont, à l''occasion, je vous donnerai une part. Hier Lilly susdit
    me montra ses dessins d''ltalie, qui tous sont exquis; ils proviennent pour la plupart du
    cabinet de van der Voort. Il dit en avoir choisi tous les meilleurs, et laissé le reste
    à Uylenburgh, qui les emporta en Hollande. Il y a un Jacob dormant de Raphael qui est merveilleux.

    Dans le papier ci-joint vous trouvez les couleurs diverses, dont on fait usage dans le pastel.

    sijn als die ick inden Haeg gesien heb. Maer voor eerst breeckt men het wit op een vrijfsteen
    met een mes, doende schoon water daer bij, en soo wat gekneedt sijnde, menght men de verw
    daer onder die eerst apart met water gevreven is, maer niet fijn. Als dit wel onder een
    gemenght is met soo weynigh water als bequaemelijck kan geschieden, soo doet men daer nae
    de tabacpijpaerde daer bij en kneedt die met de rest, altijdt het mes, en niets anders gebruyckende.
    Daer nae rolt men penneties van dese compositie op een schoon papier, formerende eerst de
    punt met de vingers, om dat anders lichtelyck een holligheyt in ''t midden blijft. Alsse
    5 of 6 uren gedrooght hebben bij haer selven, (want men moetse niet in de son noch ontrent
    het vier leggen, om datse dan te hard worden) soo rolt mense noch eens, omse rechter en
    ronder te maecken, en dan laet mense voort leggen droogen; daer toe wel 7 of 8 dagen in
    de somertydt van doen sijn, en ''s winters wel 6 mael soo veel, daerom men die dan oock
    niet gewoon is te maecken.

    Om de donckere couleuren te maecken heeft men van het selfde wit maer met seeckere andere
    materie daer onder swart gemaeckt, twelck hier alsoo verkocht wort. Indigo, Schytgeel, en
    Lack sijn onbequaem tot dese crayons, en in plaets van Lack gebruyckense Indiaens root,
    ''t welck ick niet en weet of in ons Landt bekent is. Men schrijft gemackelyck met dese
    penneties op papier, en worden noyt hardt. Het Papier dat Lilly besicht en voor ''t beste
    houdt is licht graeuw en niet hardt. Ick heb een doos van dese crayons laeten gereet maecken
    daer van ickje bij gelegentheijdt sal medeelen. Gisteren thoonde my voorschreven Lilly syn
    Italiaensche teyckeningen die altemael keurlijck sijn, en sijn meestendeel gekomen uijt
    het cabinet van Vander Voort. Hij seght dat hij al de beste daer uijt gekosen heeft en de
    rest aen Uylenburgh gelaeten die daer me nae Holland gingh. Daer is een slapende Jacob van
    Raphael die wonderbaerlyck is.

    Int nevensgaende papier hebje de verscheyde verwen die int pastel gebruyckt werden.

    Au Frere de Zeelhem.'
