  tekst: 'A Londres ce 29 Juin 1663.

    Je n''attendois autre nouvelle de vous que celle de la decision de nostre proces et n''en
    ayant pas aussi de fort importantes a vous mander j''ay laissè passer quelques ordinaires
    sans vous escrire et mesme a cet heure je n''ay guere a vous dire, mais je ne veux pas laisser
    de vous respondre a fin que je ne reste pas privè des nouuelles de la Haye dont d''ailleurs
    que par vostre moyen je me voy tresmal fourni. Vous estes bien heureux d''avoir trouuè de
    quoy vous desenuier dans le voisinage de Zuylichem, ou vous m''avouerez que sans cela l''on
    passe le temps aussi mal qu''en lieu du monde. Vostre bonheur est encore de ce que vous
    vous contentez de choses mediocres, car parmy tout cet Examen Apum je n''ay jamais rien
    vu d''agreable.

    Je suis bien aise que Monsieur Thevenot est satisfait de ses figures. Le secret du poly
    nouveau m''a estè inconnu jusqu''a cet heure que je le voy dans vostre lettre, mais je pense
    que ce n''est que celuy que Monsieur Auzout a trouvè, et non pas celuy de Monsieur d''Espagnet
    que je croy estre encore meilleur par les effects que j''ay veu de l''un et de l''autre.

    En ce qu''il vous escrit de la regale que le Roy veut faire, je croy que vous aurez leu
    Pere, au lieu de frere. Le frere de Zeelhem vous pourra dire a peu pres ce que c''est, car
    il en a eu nouvelles a ce qu''il me mande. Je croy qu''il en sera quelque chose, mais non
    pas tant que l''on dit.

    Je passerois assez bien le temps icy si je scavois un peu mieux m''escrimer de la langue
    du païs. Il y a Comedie icy aupres ou il y a grand concours, mais parce que je ne puis pas
    bien comprendre ces dialogues qui sont prononcez si viste je n''y vay que fort rarement.
    Nous avons dans le voisinage une dame qui joue du luth en perfection et chante assez bien,
    mais faute de luy pouvoir parler je n''ay pas osè y retourner apres la premiere fois.

    Il n''y a que certaines personnes comme Monsieur Moray Monsieur Bruerton et quelques autres
    devant qui j''ose deploier ce que je scay. J''ay trouvè ce dernier dans Gresham Colleg dont
    il est membre, et le trouvay devenu si gros et gras que j''eus toutes les peines a le connoistre.
    Il a espousè la fille de Milord Willouby dont il a 3 enfans. Je l''ay estè veoir chez luy,
    ou il me regala de sa musique, qui est la plus plaisante du monde, car sans avoir jamais
    appris a toucher le clavecin, il en joue avec une asseurance merveilleuse et rien que des
    fantasies qui sont sans regle aucune. Adieu. Mon Pere envoie pour avoir mes lettres.

    Je repondray a Janus par le prochain ordinaire.'
- verzender: Christiaan Huygens
