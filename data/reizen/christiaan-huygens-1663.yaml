  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "A Londres le 14 Septembre 1663.\nVoicy vostre Mistriss Tufton que je vous renvoie\
    \ apres l'avoir monstrée a Monsieur Couper et a Lilly, qui tous deux aussi bien que moy\
    \ y trouuent a redire que vous y avez mis des couleurs trop fortes, tant aux ombres qu'au\
    \ reste du teint. ce rouge des joues et ce jaune si eclatant en gastant toute la delicatesse.\
    \ Dans le portrait de Mistriss Limmon vous l'aviez mieux menagè, et il n'y avoit de l'exces\
    \ que dans les ombres. deplus vous avez fait le nez trop gros vers enhaut et trop bossu,\
    \ les yeux un peu trop rudes, parce que la paupiere d'enhaut s'ouure trop, ce qui tout ensemble\
    \ fait que vostre copie ne ressemble pas fort a l'original. Les cheveux, habits et tout\
    \ le reste sont tres bien faits. Monsieur Couper m'a donnè une adresse pour avoir du Carmin,\
    \ mais estant sur nostre depart et ayant encore beaucoup de choses a faire je ne scay si\
    \ j'auray le temps d'y aller. J'ay corrigè ma copie d'apres Lilly par 2 ou 3 fois sur l'original,\
    \ apres quoy il ressemble beaucoup mieux maintenant que le sien. Je vous recommande cette\
    \ lettre a la Cousine Constancia, qui vient de Mistriss Faris.\nMijn Heer \nMijn Heer van\
    \ Zeelhem \nIn sgrauenhage."
- verzender: Christiaan Huygens
  ontvanger: Lodewijk Huygens (1631-1699)
