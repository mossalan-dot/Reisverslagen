  tekst: 'A Londres ce 20 Juillet 1663.

    Je vous envoyay par l''ordinaire passè la recepte pour le pastel. Par celuy d''Hollande
    je n''ay rien receu, et par consequent point obligè a faire response. Il n''y a rien de
    nouveau icy que l''affaire de Monsieur le Chancelier et Milord Bristol, desquels ce dernier
    à accusè l''autre ce matin, dans la chambre haute, de high treason, mais a sa propre confusion,
    et peut estre sa ruine. car desia auparavant il estoit disgraciè du Roy, et maintenant apres
    cette belle action selon toute apparence il va estre confinè dans la Tour.

    Milord Hollis estant party il y a 3 jours, mon pere fera son possible pour le suivre au
    plustost, de sorte que dans peu nous pourrions plier bagage, ainsi soit il.

    N''oubliez pas je vous prie d''adresser cette response a Monsieur van Leeuwen.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
  datum: 03-08-1663
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Londres ce 3 Aoust 1663.

    Je ne scaurois encore vous resoudre les difficultez qui vous restent touchant le pastel,
    n''ayant pas veu, depuis la recepte de la vostre le Sieur Lilly ni son valet qui les fait.
    Je vous ay dit que l''Indian Red est une couleur qu''on apporte icy des Indes, et que ledit
    faiseur doutoit si l''on en trouueroit chez nous. Pour ce qui est des proportions entre
    la paste et les couleurs, j''ay veu qu''il n''y prend pas garde autrement, mais seulement
    en met tant que la couleur du meslange soit a sa fantasie. La raison pour quoy il ne broie
    pas longtemps les couleurs, est parce qu''autrement le pastel devient trop dur et ferme
    et ne veut point marquer sur le papier. En les essaiant pourtant entre les doigts je trouuay
    qu''elles estoit si fines qu''on n''y sentoit aucun reste de grain. Ce pastel n''est aucunement
    gras, et l''on escrit tresbien par dessus avec le crayon noir. Il marque environ de mesme
    que le crayon blanc pour la delicatesse des traits. Je ne suis pas bien assurè quel est
    le bleu dont il se sert, mais je croy que c''est Blaeuwe Assche.

    Il m''a vendu une boete pleine ou il y a de cette couleur fort belle avec toutes les autres.
    J''en paye 10 schillings, qui a la verité est un peu cher. mais aussi j''en ay a revendre
    parce que de chasque couleur j''ay deux pieces, et il y a 54 couleurs differentes.

    J''ay veu vostre miniature de Mistris Limmon et je trouue que vous y avez tresbien reussi,
    et beaucoup mieux que dans celle de ma soeur. Si vous pouuiez si bien faire apres le naturel
    vous seriez grand maistre. Le Sieur van der Does a qui je l''ay monstrée, y trouuoit a redire
    de ce que dans ies ombres vous auiez emploiè un peu trop de noir. je ne scay quel cas vous
    ferez de sa censure.

    Avant hier je me fis mouler le visage de plastre ce qui reussit fort bien, et un heure apres
    l''on m''apporta mon portrait qui ressembla comme vous pouvez croire. Ce matin l''on a ouvert
    les yeux et dans un jour ou deux il sera tout achevè. Je n''ay pas voulu qu''il y fit une
    teste et un buste parce qu''il y auroit plus de peine a le conserver en voyageant, et de
    plus ce maistre ne s''entend pas fort a faire des cheveux. L''on ne sent point de mal du
    tout estant soubs ce masque ni mesme en le tirant, et l''on n''a pas de plus grande peine
    que celle de se tenir de rire. Si vous desirez de pratiquer cette art, je vous manderay
    une autre fois tout ce qu''il y faut observer, car il me semble que je le scay aussi bien
    maintenant que le maistre luy mesme.

    J''ay receu une lettre de Sluzius avec ce dernier pacquet, avec la quelle il avoit joint
    un livre, que vous aurez jugè de trop grand volume pour m''estre envoiè par cette voie.
    Mais si quelqu''autre se presente de quelque passager ou autrement vous me ferez plaisir
    de me le faire tenir.

    Il y a une maison voor aen inde Speuystraet ou vous envoierez cette enclose pour Liege.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
  datum: 24-08-1663
