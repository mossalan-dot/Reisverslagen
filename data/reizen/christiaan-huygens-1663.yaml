  tekst: 'A la Haye le 24 d''Aoust 1663.

    Cela est bien horrible que vous soyez si auant dans le Gresham College qu''il ne vous reste
    pas un moment pour m''escrire une petite lettre et y mettre dedans deux ou trois morceaux
    de vostre pastel. Il y a trois ou quatre jours que j''essayay d''en faire selon la recepte
    d''Angleterre. Je ne scay s''il n''est pas encor bien sec, mais je le trouve trop mol et
    outre cela fort subject à se casser. Et afin que vous le voyiez aussi je vous en envoye
    un eschantillon, et deux autres de celuy que je fis dernierement auec du plastre.

    Je suis apres a acheuer en miniature le pourtrait de la Lady Tufton qui est cette belle
    brune parmy les portraits del Signor Padre. Ce portrait sera meilleur que les autres precedents
    comme lon apprend en faisant, et je vous l''envoyerois bien pour voir, sed me vestigia terrent
    du premier.

    Monconis a voulu à force apprendre de Borri a faire la pierre philosophale et l''en a sollicité
    auec tant d''empressement que Borri en est tout scandalisé et dit qu''il n''a point de discretione.
    Outre cela je croy qu''il auroit grand'' peine a luy apprendre ce qu''il ne scait pas luy
    mesme. J''ay leu la sentence de l''inquisition contre Borri qui est fort longue et pleine
    des particularités, et fait voir si tout est vray in facto qu''il a eu des desseins qui
    ont beaucoup de rapport a ceux de feu Jan van Leiden. Il y entre beaucoup d''apparitions
    et d''entretiens auec les Anges, sur tout auec l''Archange Michel qu''il dit de simple Ange
    qu''il estoit comme les autres, pour les bons seruices qu''il rendit quand Lucifer fut chassé,
    avoir esté esleué en Archange, auec de semblables bonnes pensées.'
