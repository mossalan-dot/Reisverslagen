  tekst: 'Nobilissime Domine

    Quamuis missam ad te Florentia Timauri Antiatis apologiam aduersus Historiae Trochoidis
    dicam, an cycloidis? ante aliquot annos editae auctorem, plane mihi persuad eam; officij
    tamen mej esse duxj, si forte secus accidisset, exemplar offerre quod nudiustertius accepj.
    Res ipsa quidem mererj non videbatur haec certamina; sed cum Torricellius plagij accusaretur
    ab historico, discipulorum intererat Magistri candorem atque integritatem tuerj. Quod an
    a Timauro praestitum sit ipse dispicies: ego quidem ita sentio, nisi Torricellij literas,
    quas adhuc asseruarj dicit, exhibeat Historicus, caussam eius profligatam esse. Liberé tamen
    fatebor apud te omnino alienum esse me ab hisce λογομαχίαις; sed etiam publicé interest,
    vt sua cuique laus tribuatur. Et quemadmodum Torricellius si aliorum inuenta pro suis venditasset,
    excusationem non mereretur, ita reprehensione non carerent ij, qui viros optimos plagij
    accusant, cum in easdem secum cogitationes forte inciderunt, ϰαὶ ταῦτα μὲν δὴ ταῦτα. Tu
    vir Praestantissime perge orbem literatum tuis εὑρήμασιν ornare, meque quo soles affectu
    semper prosequere.

    Dabam Leodij 20 Julij 1663.

    Tui obseruantissimus

    Renatus Franciscus Slusius.'
