  tekst: 'Nobilissime Domine

    Apologiam Timauri Antiatis, seu potius Clarissimi Caroli Datj, prioribus meis non adiunxeram,
    quod an illam Florentia accepisses, a te certior fieri expectarem, et non magni referre
    arbitrarer hanc modicj temporis moram, cum te Hagae-Comitis esse mihi persuaderem.

    Sed aliquot postquam ad te scripseram diebus, transijt hac Nobilis Vir Dominus Monconisius,
    qui et Parisijs nuper fuisse, et nunc Londinj agere te mihi retulit; multaque adiunxit de
    praeclaris virorum literatorum conatibus, qui Scientiam Naturalem experimentis stabilire
    contendunt. Anceps itaque eram an meas accepisses, cum me sollicitudine liberarunt literae
    tuae datae 3a huius, quibus lectis, continuo mittendam censui Apologiam eadem viâ quà priores
    acceperas. De Celeberrimi Pascalij obitu certiorem me reddidit idem Monconisius, non sine
    magno animj mej moerore, qui viri doctrinam et humanitatem maximj faciebam. Sed, vt ait
    ille, ad hoc sacramentum adacti sumus fere mortalia, ϰαὶ τῇ ἀνάγϰῃ συγχωρεῖν. Non ingratum
    tibi futurum arbitror si adiungam id quod nuper ad me Florentia scriptum est, primam nempe
    experimentorum physicorum in Academiâ Serenissimi Principis factorum, partem, iam editioni
    paratam: Eximium Borellum breui daturum in lucem librum Physicomathematicum de motu animalium;
    Rinaldinum vero artem Analyticam: alium denique, opusculum de Aquarum fluxu, quibus scientiarum
    pomaeria promouenda confido. Nuper etiam Patavio scripsit ad me Pater Stephanus Angeli Mathematum
    illic Professor et celebris Caualerij discipulus, se hac aestate Libellum Geometricum edidisse
    in quo Spatiorum Spiralium mensuras ostendit, et Clarissimi Vallisij errores notat. Res
    hoc schemate explicari potest.


    Jntelligatur centro B circulus AVCG, in quo descripta Spiralis ADB, et quilibet radius secans
    spiralem, BDC. Nunc si spiralis ita composita intelligatur, vt sit eadem ratio CB, ad DB,
    quae est circumferentiae ACGA, ad arcum CGA, spiralis erit Archimedis.


    Sin autem retentâ eadem ratione CB ad DB, intelligatur ita esse quaelibet dignitas circumferentiae
    ACGA, ad homogeneam arcus CGA, tunc producentur illae insinitae spirales quas Pater Stephanus
    examinat, et asserit spatium spirale ABIDA ad circulum, esse in primâ seu Archimedis, vt
    j ad 3, in secundâ vt j ad 5, in tertiâ vt j ad 7 et sic in infinitum in ratione vnitatis
    ad numeros impares. Vallisius vero (si eum recte intellexit) pronunciat primum spatium esse
    ad circulum vt j ad 3, secundum vt j ad 4, et sic semper in ratione vnitatis ad numeros
    ternarium sequentes. Cum vtriusque Auctoris librj non essent ad manum, rem ad calculos reuocauj,
    sed generalius; considerando nempe spirales ita componj, vt eadem sit ratio cuiuslibet dignitatis
    CB, ad homogeneam DB, quae est cuiuslibet dignitatis circumserentiae ACGA, ad homogeneam
    arcus CGA: et regulam facilem invenj quâ totum negotium absoluitur. Est enim semper vt exponens
    dignitatis quae consideratur in radio et eius partibus, ad eundem exponentem, vna cum duplo
    exponentis dignitatis quae consideratur in circumferentiâ et eius partibus, ita totum spirale
    ad circulum, cuius assertionis veritatem....'
