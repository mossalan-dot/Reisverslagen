  tekst: 'A Paris Le 15 Juillet 1663.

    Monsieur

    Encores ne fault il pas que vous partiez de londres sans faire quelques Commissions pour
    vos Amys puisque vous estes party de Paris a leur jnsceu & quils nen ont esté aduertys que
    par le bruit commun & par la voye de Monsieur labbe Bentiuoglio & autres qui ne sont asseurement
    pas plus vos seruiteurs que nous, Monsieur Cheze ensin qui nous lauoit dissimulé au Commencement
    a este oblige de nous l''aduouer quand il a veu que nous le scauions. Nous souhaittons donc
    vostre Retour en bonne sante & de Monsieur vostre Pere Auquel Je suis treshumble seruiteur
    & je vous supplye de len bien asseurer. Nous attendons dans nostre accademie vostre Presence
    pour le paracheuement de la Machine du Vuide. cepandant nous auons fait dans la Maison de
    Monsieur Teuenot a la Campagne des Obseruations de ♄ ou nous auons trouué le petit diametre
    de lanneau plus grand que celuy du Planette. Si le Ciel nous eut esté fauorable nous aurions
    bien trauaille, Messieurs Bouillaud Auzout Frenicle & Moy y estions & y auoient passe quelques
    nuits mais fort Mauuaises & sans vn seul quart dheure de serenité. Monsieur Ausoult a tousjours
    fort bonne esperance de son bassin de 7 ou 8 vingts pieds en ayant fait vn verre dvn coste
    & lautre dvn autre Conuexe qui en tout tire 50 ou 60 pieds & quil croit bon nayant pas eu
    le lieu encores assez propre pour lessayer exactement. dans cette semaine nous en aurons
    de bonnes grandeurs et nous croyons auoir trouué le Moyen de nous en seruir assez aysement
    sans tuyaux. Voyla les nouuelles de nos Curiositez. Pour la Commission que je vous veux
    donner si vous lauez agreable cest de voir chez vn libraire nommé Sadler ad Infigne leonis
    aurati in vico vulgo vocato little Britann, vn petit in 8o jntitulé lexicon Chymicum Guillielmi
    johnsoni 1660 lequel ayant achepté en blanc a londres, il sest trouué a mon aduis quelque
    feuille a dire en le reliant. car au liure 2 la derniere page est 72 & les derniers mots
    du liure sont Energias in se coherent, auec cette reclame fuller cha, qui marquent quil
    y a encores quelque feuille ou demy feuille. Cest ce que je vous prie de verifier car je
    nay sceu trouuer ce liure dans Paris pour le faire. Et comme les libraires sont tenus de
    parfaire leurs liures & qu''a Paris ny en Hollande on nen fait jamais de difficulté Jespere
    quils nen feront pas dauantage a londres & que vous aurez bien la bonté de Mapporter ce
    Manquement, comme aussi le petit liure latin des batesmes & Enterremens de londres. Et semblablement
    de vous informer si on ne traduit pas en latin le Pseudodoxia Epidemica de Brouwn & si lautheur
    le fait ou quelque autre. vous Mobligerez aussj infiniment dasseurer Monsieur Ranala nepueu
    de Monsieur Boyle si vous le voyez de mes treshumbles seruices & de luy dire quil ma bien
    oublye et les promesses quil m''auoit faites de Menuoyer sa petite Boule dyuoire tournee
    en pointe, sil men veut obliger je luy enuoyeray chose plus curieuse, pour le Moins. quil
    se souuiesne de me continuer lhonneur de son amitie quil mauoit tant protestee puisque Je
    lhonore & le cheris de tout Mon pouuoir. Je vousupplye aussi dasseurer Monsieur Boyle de
    mes Respects et si Monsieur Oldenbourg est tousjours a londres & aupres de ces Sieurs Boyle
    ou Ranela jl scaura sil vous plait aussi par vous que Je suis son seruiteur. La Machine
    de Versaille continue tousjours de se faire mais Je nen ay pas pour cela meilleure opinion
    quau commencement, tenez moy tousjours sil vous plait Monsieur pour

    Vostre treshumble seruiteur P. Petit.'
