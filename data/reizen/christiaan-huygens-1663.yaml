  tekst: 'Christiano Hugenio τῳ τάνυ Janus Vlitius S.P.D.

    Non ignarum te esse, Praestantissime Hugeni, consido, me jam ab aliquot annis rebus Bredanis
    illustrandis intentum fuisse.

    Quas tribus complexus sum libris, quorum i. Νομιϰὰ, ii. Ξρονιϰὰ, iii. Τοπιϰὰ continent.
    Dum primum typis tandem Dordrechti nuper trado, et prodromus consuetudinum de Successionibus
    prodire tentat, en interdictum Senatus Principum ne quid tale edam nisi prius a se examinatum,
    et a Principe facultas impetrata fuerit. Delator deprehensus mihi est olim IC. nunc Propraetor
    Bernagius; qui invidia tactus dudum est, quod fidem aliarum, quibus niti solet, supposititiarum
    Consuetudinum mea hac editione elevem, atque diluam. Miratus quorsum illud examen, et ad
    quos cura ejus pertineret, obiter rescripsi me nihil, quod non e re Principis et Justitiae
    consentaneum sit, moliri. Plenius rescribere supersedi, quia rumor de Illustris Parentis
    Tui reditu me recreavit. Capita ejus sunt, ea, quae edo, privatim a me consulta olim, et
    observata a me esse; non me leges novas aut consuetudines condere aut promulgare, sed eas,
    quae ante C. et plures annos ab ipsis Dominis aut conditae, aut agnitae, aut Sententijs
    Curiarum tam Bredanarum quam Brabantiae confirmatae indesinenter sunt, utque hic in archivis
    extant, et in Judicijs in dies allegantur, et legis vim obtinent, plane sequi, et interpretari.
    Id Grotijs, Goris, Sandijs, alijsque bene de patrijs suis meritis integrum semper fuisse:
    uti e aliter sentientibus hos aeque ac me refellere. Denique me nihil editurum, ante quam
    Principi juris sui facto dedicetur universum opus.

    Prodromum tantum experiundi hominum judicia ergo amicis communicare; atque ita quoque Senatui,
    ut ex hoc ungue Leonem noscant, et examinent. Rogo ergo atque obsecro te, Hugeni Amicissime
    (quantumvis sciam te melioribus nunc vacare studijs) ut haec cum Illustri Parente data occasione
    communices, qui domi suae (brevi ut spero) exemplar prodromi inveniet. Non enim operae pretium
    videbatur illum ulterius mittere. Si quid linguae Aremoricae (Bas-breton) monumentum inter
    librarios invenias (nam Dictionarium tale allegatur anni 1590) aut tale quid, summo me mactabis
    officio, si ea mihi comparaveris; uti et figuras optimas fabularum Aesopeiarum. Phaedri
    enim editionem novam, cum figuris, Principi dedicare cogito. At ne Socraticos tuos interrumpam
    dialogos diutius, S.P. tibi, tuoque imprimis Parenti atque amicis repetita, manum tollam.
    Vale, Saeculi nostri Archimedes, et Vlitio tuo haec gratificare. Dabam Bredae vi Junii .

    Burstedij, iaeque te salutant plurimum. Junij Euangelia Gothica et Anglo-Saxonica sub praelo
    fervent. Lexica sequentur. Ego Francica quoque concinno.'
- verzender: Christiaan Huygens
