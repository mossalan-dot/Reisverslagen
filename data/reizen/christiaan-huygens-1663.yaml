  tekst: 'A Londres ce 13 Jullet 1663.

    Iustement quand je vous ay demandè de nouvelles de la Hermana vous avez estè apres a m''en
    donner.

    Je suis bien aise qu''elles sont si bonnes et ne me rejouis pas moins de la scavoir eschappée
    du danger ou les commeres ont jugè qu''elle estoit, que de la production de sa nouuelle
    creature. Je ne doute pas qu''elle mesme et plusieurs autres n''aient souhaitè que ce fut
    un dauphin au lieu d''une lnfante mais pour nous autres oncles je n''y compte point de perte,
    et je croy que les niepces valent bien les neveux. Au reste je voy par ce que vous me racontez
    des deux fugitives Beaumont et vander Meyden et des desseins du jeune Greffier, que l''amour
    regne chez nous plus que jamais; et encore aviez vous oubliè l''histoire du vaillant Breton,
    dont le Seigneur Sebastiani m''a fait part.

    Je n''ay rien a vous dire touchant vostre nid de laine si non que je ne l''ay veu depuis
    que vous me le monstrastes. Si vous m''en pouuiez faire tenir un icy je le ferois bien valoir
    parmy nos Messieurs de la Societè Royale, et le ferois eterniser dans leur Registres. La
    derniere fois l''on y apporta parmy d''autres raretez la figure d''un hareng taillée de
    papier, de la longueur de 16 pouces, et les mesures de la longueur grosseur &c. d''un enfant
    de 18 mois qu''on assura peser 160 ℔. Si j''eusse eu celles de nostre niepce, peut estre
    que pour son age on les auroit trouuè aussi extraordinaires.

    Si vous faites des bons repas chez le Seigneur van Leeuwen, je vous puis dire que nous n''en
    faisons pas des moindres chez nos bons amis les milords d''Albemarle, de Manchester, de
    Devonshire et autres; et sur tout nous fumes splendidement traitez chez la vieille Lady
    of Devonshire a sa maison de Rohampton qui est a 3 lieues d''icy. En somme c''est icy le
    vray pais de bonne chere; et ce sera beaucoup si j''en escappe sans quelque surfet. Hier
    au soir l''on dansa a la Cour, ce que je fus veoir avec le Signor Padre, et fumes honorablement
    placez par Monsieur Bret.

    Ce matin David s''est venu plaindre a moy qu''il y a des esprits dans la chambre ou il couche
    et que cette derniere nuict et par plusieurs autres ils sont venu l''inquieter. J''eus grand''
    peine a m''empescher de rire, par ce que Bruynestein qui avec les autres valets a conspirè
    contre luy m''avoit desia dit ce que c''estoit. La chambre est au dessus de la miene, ou
    les deux garçons de mon Pere couchent dans un lict, et celuy qui est escheu a David dans
    ce mesme lieu a des rouleaux dessous. A ce lict ils attachent une chorde et la font passer
    jusques dans la chambre de Bruynestein qui est plus basse, et quand ma grosse beste est
    endormie, cet autre tire sa corde et fait rouler le lict tout le long de la chambre jusques
    contre la porte, avec grand bruict, ce qui ne manque pas de l''eveiller; et du commencement
    il eut si grande peur qu''il quitta le lict et s''en alla dormir ailleurs, mais peu a peu
    il commence a s''y accoustumer, et se rendort fort bien quoy que tres persuadè que le diable
    s''en mesle.'
