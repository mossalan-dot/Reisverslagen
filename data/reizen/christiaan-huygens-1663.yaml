  tekst: 'Pour Monsieur de Montmor.

    la hauteur de toute la machine AB 2 pieds 9 pouces. CD l''un des costez de la planche superieure
    1 pied. TV le costè du quarrè attachè 7 pouces. EF et GH qui font la croix d''en bas. chacun
    de 2 pieds. la distance entre la planche CD et NM est determinée par le cylindre de cuivre,
    car il faut que les 2 soustiens du cylindre P et Q appuient sur la planche NM, et que le
    dessus du cylindre entre dans la planche CD environ un quart de pouce. l''epesseur des planches
    CD et NM soient d''un pouce et trois quarts et qu''elles soient de bois de chesne.

    MQ et NP sont deux barres de fer de l''epesseur d''environ un demi pouce, les quelles l''on
    passe par dessous les 2 anses du cylindre apres qu''on l''a mis en sa place. Le trou de
    la planche NM, est fait comme dans la figure a costè, afin que le cylindre avec ses anses
    et la piece du robinet y puissent passer.

    Il faut tellement attacher le pignon L et le fer K, que le cric y passe juste entre deux.
    le fer K est attachè sur la planche N, pour empescher que le cric ne puisse aucunement reculer.

    R est un bacquet pour recevoir le peu d''huile et d''eau qui passent par le petit trou S,
    que l''on ferme avec un morceau de cuir huilè lors que l''on tire le cric vers en haut:
    et il faut que ce bacquet se puisse oster pour quand l''on veut retirer et remettre le cylindre.

    Pour empescher que le piston attachè au cric ne puisse monter jusqu''au haut du tuyau (car
    il faut qu''il y reste 2 ou 3 doigts pour contenir de l''eau), il faut boucher avec du plomb
    une dent du cric.

    le petit tuyau par lequel l''air du Recipient s''ecoule dans le cylindre, est soudè d''un
    costè a la platine de cuivre rebordee qui contient le ciment, et de l''autre costè a un
    ½ pouce du bout il a une petite platine quarrée qui se colle avec du ciment mol contre la
    piece du robinet. Ce tuyau est de la grosseur d''environ 3 lignes.'
