  tekst: 'A la Haye le 22 Iuin 1663.

    Je crains que vous ne passerez pas de là si tost que nous voudrions bien touts deux pour
    raisons que je mande à Mon Pere. L''affaire ou vous apprehendez du prejudice et dont vous
    ne voulez rien dire nous a esté connue plusjeurs jours auant vostre lettre par des advis
    que Gentillot et Copes disent d''en auoir receus de Paris, j''espere qu''ils seront veritables.

    J''envoye icy dedans le petit pourtrait de Sus qu''il vous plaira me renvoyer quand vous
    l''aurez consideré. Il faut prendre garde que vous le tourniez du bon consté contre le jour
    et comme il a esté fait. Celuy que j''ay fait apres cette belle brune est le meilleur de
    touts mais n''est pas achevé. Il va tant de temps a ceste sorte d''ouvrage que j''ay de
    la peine a m''y r''attacher.

    Touts les lunettiers me tombent icy sur les bras durant vostre absence, entre autres j''ay
    eu un niais Anglois que Morray vous adressoit auec une lettre, le plus pauvre garçon du
    monde qui court le pais par le moyen d''un Itineraire fait il y a trente ans, et est pourtant
    membre of the Royal Society.

    Je n''ay pas le temps de vous dire d''auantage.'
