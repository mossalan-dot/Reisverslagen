  tekst: 'Sommaire

    Pension. Rel. Voyage. Alderman. du Moulin.

    A Londres ce 10 Aoust 1663.

    Les avis de Monsieur de Gentillot sont des nouuelles pour moy, et mesme un peu suspectes,
    quoy que je souhaite qu''elles puissent estre veritables. Je n''ay jamais ouy que Mon Pere
    fut aussi des participants, et quant a la pension je n''en ay eu jusqu''icy aucune certitude.
    Je sceus seulement en partant de Paris que j''estois fur la liste parmy ces autres beaux
    esprits, dont je n''eus qu''une fort mediocre joie, demit honorem Aemulus Aiaci, non est
    tenuisse superbum, Sit licet hoc ingens, quicquid speravit Vossiolus. Mais que cela demeure
    entre nous s''il vous plait. Ce que vous dites du Mecenas Moliere est une raillerie, que
    peut estre quelques uns des exclus auront controuuée.

    L''Alderman me dit que vous luy aviez donnè du vin avec du succre. Je ne me souuiens pas
    de son nom mais je scay bien que ce n''est pas luy qui s''appelle Robinson. Il est de taille
    assez haute, un peu maigre, le nez bossu, les cheveux blonds et courts, voyez si a tout
    cela vous pouvez le reconnoistre.

    Je suis bien aise d''apprendre la bonne fortune du Sieur van Wijck. Le voila une fois assurè
    comme je croy qu''il n''aura que faire de retourner a son ancien mestier van poleiser.

    Vous aurez desia sceu que Lundy passè le Roy congedia Messieurs du Parlement avec ordre
    de se rassembler le 26/16 Mars. Nous fumes veoir cette ceremonie, qui est assez belle, parce
    que le Roy y est dans son haut appareil, et qu''il harangue luy mesme en suite du Speacker.
    Milord Chancelor n''y estoit pas present à cause de ses gouttes. Son affaire avec Milord
    Bristol est differee jusqu''a la prochaine seance du Parlement. Tous les actes passez dans
    cellecy, y furent lus, (cet a dire les titres) et confirmez pour la plus part par ces mots
    Le Roy le veut, ou bien ceux cy, Soit fait comme il est desiderè, qui sont pour les actes
    concernants des personnes privees. Parmy les autres il y en avoit un touchant l''observation
    du dimanche, par le quel toute sorte de divertissements alloient estre defendus ce jour
    là, jusqu''aux promenades de carosse ou a pied. Mais le bonheur voulut que sur le point
    que l''on alloit lire cette belle ordonnance avec les autres, l''on ne la trouua point,
    ayant estè derobbée fort a propos par quelque bonne ame, qui ne trouvoit pas cette pietè
    incommode a son grè. L''on interrogea un chacun des Milords sur son honneur s''il ne scavoit
    ce que ce papier estoit devenu. Mais pour tout cela point de nouuelles, et il demeura perdu.

    Avant hier je vis faire un experiment notable au Gresham Colleg sur un chien, a qui ayant
    estè faite une ouverture dans le corps, l''on luy coupa par la toute la ratte, les grandes
    veines qui y passent estant premierement liees. Apres qu''on eust recousu le trou il s''en
    alla comme s''il n''eust point eu de mal; et l''on trouue qu''ils vivent fort bien apres
    cela, quoy que privez de cette partie. L''on m''en fera veoir un qui a estè taillè de cette
    facon il y a 6 ans, et que l''on dit estre plus gay et plus enjouè qu''un chien ordinaire.
    Lors que vous entendrez des dames, que nous connoissons, se plaindre du mal de ratte, vous
    leur pourrez parler de cette cure, et mesme les assurer qu''il y a eu une dame en Italie
    en qui elle a fort bien succedè.

    Nous dinasmes hier chez Monsieur Bret. Le Roy s''en va aujourdhuy ou demain a Portmouth
    pour 10 ou 12 jours, ce qui ne fera que retarder nos affaires à mon grand regret.'
- verzender: Christiaan Huygens
