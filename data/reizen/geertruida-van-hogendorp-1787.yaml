beschrijving: Verslag van Truitje W.A. van Hogendorp (ca. 1765-1800) van een vlucht vanuit de
  buitenplaats Sion bij Delft over Den Haag naar het stadhouderlijk hof in Nijmegen en terug
  in 1787. Van Hogendorp reisde met haar moeder Carolina Wilhelma van Haren, haar zus Antje
  (1766-1802) en haar nicht Lucie van Sandick (†1791). Antje hield ook een verslag bij (Van
  Hogendorp 1787).
