  tekst: "Aen de camer in liefd' bloeyende. \nWt Fiorenza. 1600.\n \nWitte Thalia die meer aerdich\
    \ soeckt te heten, \nIn lichaemstierenskonst, en treden welgemeten,\nInt toyen vant blont\
    \ hayr, en in het draeyen eel,\nVan u groen lieflijck óóch, en van u hoge keel;\nDan in\
    \ 't onsichlijck slot van vastbeleyde reden,\nWaerof Melpomene, en ghij dick t saamen streden\n\
    Als ghij haer neuswijs noempt en sij diet kintsheit acht,\nDe rimpels voor int hóóft verbreende\
    \ soetlijck lacht: \nDie meer de soete myrt' mint onder t spel, en t dansen,\nDan onder\
    \ t heerschen hóóch, de gróótsche laurencransen:\nTóónt jonst aen die u acht, o jeuchdige\
    \ Godin,\nBrengt tot geluckigh eyndt, mijn reuckelóós begin \nDewijl ick hard en groen,\
    \ door Phebus ongenaden\nSchrijf aen een boom, vol vruchten rijp in konst, geladen;\nVoorspoet\
    \ wenscht, die niet weet, constrijcke geesten al\nOft hij u broeders oft sijn meesters noemen\
    \ sal.\nAlsoo de bergen wit, en moyelijcke wegen,\nDe bosschen dick, bree waters tusschen\
    \ ons gelegen,\nEn menich cierlijck velt, en acker mij belet\nMijn geest met u gespreck\
    \ te voeden altemet,\nSoo doe ick bij gebreck van die gewoone weelden, \nTgeen dat ick can,\
    \ dat is, u doen mijn in te beelden.\nEn d'wijl ick u constrijcke reen niet mach verstaen \n\
    Laet ick dees dichten ongehavent tuwaerts gaen\nGetuigen van mijn doen, en van mijn wille\
    \ teken,\nOm, soo ghij tot mij niet en cunt, tot u te spreken.\nDe stadt dier van haer eygen\
    \ lieden siet verheert \nEn tegens haere moet drie sterkten grof gekeert\nDie'r veronwaerden\
    \ trots, gebaert tot groter pijnen\nDoen tusschen t siedent hart, en lippen weer verdwijnen,\n\
    Fiorenza schóón, wiens schoon landouw en ackers goet\nDen schóónen Arno ciert met sijn seer\
    \ schoone vloet\nDoet om haer cierlijckheit van tael mij in haer blijven \nWaer mij gebeurden\
    \ laest, het geen dat ick gae schrijven.\nAurora latend' haeren grijsaert in sijn dróóm,\n\
    Die had haer paerden nau gegeven tróóde tóóm.\nBehalven Venus, doock s Maens gulden sleep\
    \ int Weste\nDie staech int proncken d'eerst, in 't ruymen is de leste.\nEn t was noch nacht\
    \ noch dach, als ick nae buiten tradt\nWalgend' het dom geswerm vande verresen stadt\nEn\
    \ ginck nae mijne lust (latend' geselschap varen)\nDaer Phebus bleke licht speelde op de\
    \ soete baren\nVan d'Arno die in sijn cristal ontrent de cant \nVerdobbelden t geboomt van\
    \ sijn begraesde strant,\nDoor t heftich peysen liet hem hier mijn geest verleyen\nDat ick\
    \ nau conde schijn van waerheit onderscheyen. \nEn soo ick d' eene voet voorsetten, nae\
    \ t geviel,\nWasser, k' en weet niet wat, dat d'ander achter hiel\nWanneer voor mij verbaest,\
    \ haer schielijck quam vertógen,\nEen vrouw gewijnbraeuwt swert, en swart als gidt, van\
    \ óógen, \nVan lip en kaken róót, blondt was haer vlees, en blont\n't Welrieckent hayr gevlecht\
    \ met een gentile vont\nWtheemsch van maecksel tcleet, van verwen wast verscheyde\nHeel\
    \ sachmen hals noch borst, dan eensdeels alle beyden\nHet wesen, gróótser nochte lichter\
    \ dan t betaemt,\nWas gemaniert, niet slecht, noch óóck niet onbeschaempt\nAen haer besneen\
    \ gedaent, scheent dat haer dagen waren\nNiet min dan twee, noch meer dan vijf, en twintich\
    \ jaren. \nHaer hant droech myrt, haer arm slinx een fruithóren schóón\nEn de perucq' een\
    \ cleen gesloten laurencróón.\nVeel jonckmans die int spel en 't singen eendracht houwen\n\
    En mengdent ondert spel en sanck van jonge vrouwen\nVolchden haer achter naer, vermompt\
    \ som voort gesicht\nVertrecken vreemde Mins verwarring in gedicht.\nVan d' eene comen blij,\
    \ van d' ander droev' óóchslagen\nEn beyde sijnse gayl in schijn van min te dragen.\nDewijl\
    \ verwondert ick stae in gedachten stijf\nEn niet dan thóóft en t' ooch leeft aen mijn gansche\
    \ lijf\t\ndier, die zich; haer eygen lieden, de Medici; verheert, overheerscht.\nOntsluyt\
    \ de gróótse vrouw, die naerder quam getreden\nHaer lippen van corael, en sprack mij dese\
    \ reden:\nO vreemdelinck, wien trock van huis, ons brede lóf,\nItalia siet ghij hier Princes\
    \ met al haer hóf, \nVlijt die ghij tot dit eint met moeyt hebt aen gaen wennen\nIs waerdich\
    \ van ons lof te waerheit te bekennen.\nD'óórsaken dat ons naem is overal verbreyt\nSijn\
    \ ingeboorner daên, schoon lants gelegentheit\nEn, (sonder welck dees onverwondert souden\
    \ blijven)\nOns ingeboorner geest in wel haer spraeck te schrijven.\nHier vloeyt het al\
    \ van daen, dien dees lóf is bekent,\nDie weet van d' ander twee tbeginsel en het ent.\n\
    Van die dan, die mijn doen door gansch de werelt noemen \nSal ick, want dats genoech, mij\
    \ maer alleen beroemen.\nOns ouw Latijnsche tael van voor tweeduisent jaer\nEn weeck de\
    \ Griexsche niet in geen manier, noch haer\nWijckt ons Toscaensche nu, in die, en dese tijden\n\
    Mijn geesten cloeck in schrift met al de werelt strijden. \nOns roemen is niet ijl. Soo\
    \ seydse, en met haer handt\nTóóndsij voor mijn om laech een gróót wellustich lant, \nWelx\
    \ eene eindt gebercht en dickbesneeude wegen\nBeschutten voor tgewelt der volcken aengelegen.\n\
    Thooft steeckend' wt in see, met d' een en d' ander sij\nDreycht middach en opganck met\
    \ trotse slavernij.\nEen stat die dalderheerlijxt lach van timmerage\nRijck van Galeyen\
    \ en seer machtich in seylage\nDaer naer steech ons gesicht. Doen sey de grootsche vrouw\n\
    Tgemeen en is hier niet bij tborgerlijck gebouw;\nDit sijn van Genoua de dickbemuerde wallen,\n\
    Wiens borgers Princen sijn, en selfs ist niet met allen.\nMaer t' ijverich gesicht van hier\
    \ keert en siet aen\nHet frans en spaens crackeel, de gróte stadt Milaen.\nVan Alciato roempt\
    \ haer dees, die tmoeylijck twisten \nDer wetten seer verwart met wenich moeyte slisten\n\
    En onder t suyr gekijf, t sam mengden t soet gedicht \nEn t' een, en t' ander houwt sijn\
    \ naem in ewich licht.\nDe stadt die Ginswaert leyt met haer begraven muiren,\nDees weet\
    \ het Rome danck dat haere tytels duiren\nEen Padoaen wast, die 't geen t Roomsch volck\
    \ oyt bedreef \nMet sijn vermaerde pen in soo veel boecken schreef.\nU óóch volch die Rievier\
    \ wiens canten gins en weer\nVerciert sijn doort gebouw van menich rijcker heer.\nDaer leyt\
    \ de rijcke stadt in de Slavoensche baeren \nDaer Pietro Bembo' eertijts en meer geleerden\
    \ waeren.\nDriedubbelt in geluck is wel dees heerschappij\nRijck, vreedlijck en vol glans\
    \ van Heerlijckheit daer bij.\nVan hier wilt weer tgesicht naet vaste lant toe stieren\n\
    Nae den vermaerden Po, den Coninck der Rivieren.\nDaer leyt Ferrara dat sijns eers geen\
    \ eynt en weet\nOm de geboortnis van den Godlijcken Poëet,\nWiens schrift Spangiaert, Franchoy\
    \ en Arabier ontvouwen.\nDie sulcke gonste wan bij ridders en bij vrouwen,\nDie g'lijck\
    \ sij schuldich sijn, hem eeuwich tóónen danck\nDat hij haer daden cloeck, Haer Min, en\
    \ heusheit sanck.\nDees sanck de deucht en oock d'ondeucht van d'oude tijen\nCarels bedaertheyt\
    \ wijs, Agramants raserijen.\nDits die Rolands gemoet en daen vol deuchts bewijst,\nDie\
    \ soo d' Hollantsche trouw, in sijn Olympia prijst.\nIn t cortst, t is Ariost. Wat lant\
    \ leyt soo verscheyden\nDoor berch oft baren, daer dees naem haer niet verbreyden?\nDan\
    \ laet Ferrare, en laet Bolognaes boulant vedt\nAenmerkt al t' ander eer dan gh' op Toscanen\
    \ let.\nSiet ghij dat Grof gebouw van wit gehouwe steenen \nWiens ront hovaerdich hóóft\
    \ drinckt door de wolcken henen.\nDe goon beducht, soo trots steeckt het ten hemel waert,\n\
    Vermoent bijcans een gaef gelijck t Troyaensche paert\nEn achten bij dit Ossa' op Pelion\
    \ niet met allen,\nDoor vrees van onversiens te werden overvallen.\nDits Rome daermen nu\
    \ niet meer vint eenich werck,\nDat Romes waerdich is dan dees S Peters kerck,\nT' oudt\
    \ Rome leyt daer neer beweechlijck te bewenen\nEn van die grote naem siet men maer wenig\
    \ steenen\nDen hemel sloech het hóóft, en 't was de blixems buit,\nD' aerde heeft de voet\
    \ bewelt, de rest schuilt onder t cruit. \nO stadt hoe swaer valt mij op uws gedacht te\
    \ comen!\nHoe ongelijck sijt ghij u selven nu o Rome.\nGhij waert het gróódt onthouwt inden\
    \ voorleden tijt\nVan wetenschap en Mars; van alle canten wijt\nVersaemden binnen u de gróótgeestige\
    \ lieden\nWiens lichaem wan de Dóót, maer voor haer naem moet vlieden.\nHier was de Mantuaen\
    \ die t lant verbetert heeft\nIn wiens godlijck gedicht Anchises soone leeft,\nVan Phebo\
    \ selfs benijt, soo die hem niet benijden\nTen minsten moest hij hem voor sijns gelijck\
    \ belijden. \nAlhier was Naso die selfs door sijn const verblint\nNiet dan van Cyprys droomt,\
    \ en van haer dertel kint.\nHoratius deed den Thyber hier sijn snelheit laten\nDie sachter\
    \ ginck doort hooren vande nieuwe maten.\nDe vader van goe spraeck was hier en duisent meer, \n\
    Die door haer geest en vlijt verdienden naem en eer.\nDan Romes lof is claer, laet de vernaemde\
    \ muiren\nEn nae Parthenope wilt u gesicht toestuiren\nT' eel Napels twelck ontveyst verstoort\
    \ door t Spaenschejuck \nDoor wtwendige pracht den inwendigen druck.\nWilt sijne straten\
    \ breet vol paerden trots aenschouwen\nVan Ridders, en vergulde wagens vol Joffrouwen.\n\
    Voorts siet van Maro', en óóck van Zannazaro tgraf \nDie mee dit Coninckrijck door sijn\
    \ lof naeme gaf\nPozzoles oude strandt, de bergen en de dalen\nDie Celiaes soete naem dick\
    \ plagen te verhalen\nWanneer Angeriaen vertrock sijn waere min\nPoëterij geacht, van sijne\
    \ wree godin,\nWiens pijn en tijtverlies geen ander lóón mocht beuren\nLas dan met eigen\
    \ hant sijn lijf en siel versteuren. \nBeweenlijck ongeluck, waerom wert (dits mijn vraech)\n\
    Bedruckte min gestraft! die self doch is een plaech?\nDan moylijck sijn misschien voor u\
    \ ons lange reden \nDaerom laet ons van hier een stuck te rugghe treden\nEn sien die stadt\
    \ die voor ons leyt int vlacke velt\nDiemen voor d' eerste van het out Hetrurien telt\n\
    Wiens kerck van marmor blinckt, wiens recht' en effen straten\nTgebouw verciert van haer\
    \ voorvaders naegelaeten,\nFiorenza schoon, van gróte geesten cloeck vruchtbaer\nDie Pallas\
    \ cuisch vercoos, wt hondert steen, voor haer,\nAls t' Asiaensche juck, 't welck doet Europe\
    \ beven,\nHet wijs Athenen dwanck sich onder hem te geven.\nPetrarca was van hier, die al\
    \ sijn leven lanck\nMet schaempt sijn tijtverlies, hoe seer them moyde sanck,\n't Versiersel\
    \ godlijck meer dan menschlijck wtgesproken,\nSou beesten wreet getemt, en clippen hart\
    \ gebroken\nWel hebben door t geluyt, en t hadde noyt de macht\nDat het een schoone vrouw\
    \ haer cuyscheit t' onderbracht.\nDees van Cupido sanck den triumphanten wagen\nWaer voor\
    \ de gróótste lien de swaerste ketens dragen.\nDe wijsheidts minnaers grijs, de Princen\
    \ trots, en Goon \nDi' om aertsche schoonheits liefd den hogen hemel vloon,\nSoo d' aldersachtste\
    \ sijn d'aldergemeenste plagen,\nWie sou sijn smert, met sulck geselschap niet verdragen?\n\
    Dit Vaderlant compt toe een deel van Dantes lof \nDiet Aertrijck docht te laech tót hoger\
    \ dichtens stof.\nDees twee sijn óórsaeck van mijn breedt Hovaerdich treden\nFiorenze gaet\
    \ te boven al mijn ander steden\nIn grote menicht van verstanden hóóch en eel\nWaer van\
    \ ick niemant noem om dat se sijn soo veel\nDats s'al onnoemlijck sijn. Want soo'ck maer\
    \ sommich roemden\nIck dee gróót ongelijck aen die ick niet en noemden\nDoorsoeckt maer\
    \ dees, ghij vint licht, dat u niet en looch\nDe grote naem die u van sóó verr' herwaerts\
    \ tooch.\nDit is tvoorneemst dat ick u sochte te verclaeren,\nK' wensch u geluck, en dat\
    \ gh' in ons lant wel moocht vaeren.\nHier maeckt de vrouw een eint en keerd' haer van mij\
    \ snel\nMaer ick vant mijn alleen en hoorden sanck nóch spel.\nDan glijck ick voort mijn\
    \ treen heel peysent wilde strecken,\nVoeld' ick mijn onversiens te rug van achter trécken\n\
    En ommesiende, door het schielijck trecken ras\nMerck inde lucht een vrouw dye overtogen\
    \ was\nGansch van een bruine wolck, die riep Sijt mijns gedachtich\nHóóft, laet het geen\
    \ ghij siet in u niet sijn soo crachtich\nAls het fruit Lothos was voor d' Ithacoysche vloot, \n\
    Die 't wederkeren tot haer vaderlant verdroot.\nIn Hollant climtmen mee tot lof langs des\
    \ Deuchts trappen\nAl can ick niet van mij gelijck Italia clappen.\nIn Amsterdam men vint\
    \ die met sijn hóóch gedicht \nDe duister wech, die leyt tot ware vreucht, verlicht,\nEn\
    \ vechters die omt best tgemeen beloop der dingen\nTot goedts en quaets beken, met aengenaemheit\
    \ singen,\nVeel geesten jonck en out, die cloeck en welbespraeckt, \nMet wesen nut verhalen\
    \ haer gedicht volmaeckt.\nDit riepse soo van ver, gelijcks' haer quam vertógen \nEn met\
    \ het laetste wóórt verloor icks' wt mijn óógen.\nEn bleef gelijck een stock stijf op des\
    \ Arnoos cant\nDaer ick mij voor tverschijnen van Italia vant.\nNu treckt mijn hart naer\
    \ huis, naer ouders en naer neven \nEn soo 'r yets lievenswaert is sonder mijn gebleven, \n\
    En u geselschap lief mijn haesten doet mijn gang \nAls daer ick mee, gelijck het ander naer\
    \ verlang,\nGodt spaer u mijn tot vreucht, dat ick u sien en spreken,\nGelijck als van te\
    \ voor, mach, binnen weenich weken.\n \nVerandren cant\n \nP.C. Hóóft.\n \nIn Fiorenza A.\
    \ 1600\nJulij 8."
- titel: In Venezia 1601. Chanson a Madame
  dichter: P.C. Hooft
  datum: '1601'
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Hooft 1899, 11-12
  link: https://www.dbnl.org/tekst/hoof001plee03_01/hoof001plee03_01_0009.php
  tekst: "In Venetia 1601. \nChanson a Madame.\nL'air: Si quelquefois je fu du traict d'Amour\
    \ atteinte etc. Esprits qui souspirez. etc.\n \nSoo 'ck heb gemint, en min, en ongetroost\
    \ moet blijven, \nK' en laster u daerom jonge Cupido niet; \nK' en sal de tedersachte Venus\
    \ niet bekijven, \nNoch oock niet de Godin oorsaeck van mijn verdriet.\n\nMedogent Venus\
    \ is, haer soon can niet bedroeven,\nEn mijn godin versmaet t' onwaerdich met bescheyt;\n\
    Soo die het blinde kint sijn schicht niet mochte proeven, \nDat wijt ick de fortuin, en\
    \ mijn onwaerdicheit.\n\nDe vlam, die sonder eindt mijn harte brant van binnen,\nDe sachte\
    \ wont des pijls mij niet te lijden geeft;\nDe Min doet mij geen smert; maer haer gebreck\
    \ van minnen,\nDie d' overschone borst te seer bevrosen heeft.\n \nVoor u altaer Godin ick\
    \ dickwils heb gaen knielen,\nU biddend' om vergif soo ick rechtvaerdich lee;\nMaer mijn\
    \ versmaen gebeên, soo s' wt de mont mij vielen,\nVoerd'se de lichte wint al naer de dulle\
    \ see.\n \nWist ick dat in mijn smert u Godtheidt schiep behagen,\nGelijck als die in mij\
    \ geen húlp te tonen doet,\nEn dat u was een lust de wreetheit mijner plagen,\nIck werd'\
    \ licht altemilt van eigen syel, en bloet.\n \nOft meend' ick door de dóót van Liefde vrij\
    \ te raeken,\nDie, sonder wederliefd, veel beter waer verjaecht,\nEen Spaensche lemmer,\
    \ in mijn borst, de wech soud maken,\nVoor d' ongemeten brant, dier in besloten knaecht. \n\
    \nMaer is mijn droeve clacht onwaerdich uwer óóren?\nIck kent, helas! en neem in tegenspoet\
    \ gedult; \nNiemant sal u voor wreet van mij beclagen hooren,\nIck geef mijn avontuir, en\
    \ cleen verdienst de schult. \n \nVer wt de straten drang, op berch, in woeste dalen\nAls\
    \ snachts slaeprige wint het bosch sacht overweyt,\nAen Echo ick alleen mijn clachten sal\
    \ verhalen, \nDie niet en antwoort, dan t' geen datmen selve seyt.\n \nEen jager diet verstaet,\
    \ dewijl hij leyt sijn lagen, \nSal seggen, nae mijn doot, al waer sijn hart versteent:\n\
    Alhier ist daer den armen minnaer plach te clagen,\nDie nu in Plutoos hof sijn avontuir\
    \ beweent.\n \nDiego die van huis mistroostich was gaen vluchten, \nVerhaelde dus sijn clacht\
    \ in d' hooge Pyreneên: \nDe steile rootsen groen medoogent met hem suchten,\nDan tharte\
    \ van sijn vrouw was harder als de steen."
