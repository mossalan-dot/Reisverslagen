  opmerking: "Ik heb uw eerste op 14 december ontvangen en de tweede de 20ste. Ik schreef een\
    \ antwoord en wachtte tot de dienaar het kwam halen maar omdat hij maar niet kwam heb ik\
    \ het naar Rome gestuurd naar de Heer Floris met verzoek om het aan u te bezorgen.\nIk (kan)\
    \ u voor 't ogenblik alleen zeggen dat mijn plan om daarheen te gaan mislukt is, zodat als\
    \ u zo goed wilt zijn hier terug te komen wij het besluit zullen nemen dat u behaagt. Intussen\
    \ bid ik u, houd mij altijd in uw genegenheid en wees overtuigd dat ik ben en eeuwig zal\
    \ zijn\nMijn Heer\n \nUw zeer nederige toegenegen om u te dienen Isabella\n \nDe grote reis,\
    \ die de jonge P.C. Hooft, volgens de in zijn kring bestaande gewoonte, ter voltooiing van\
    \ zijn opvoeding maakte, duurde van 11 juni 1598 tot 8 mei 1601. Hij bezocht, natuurlijk,\
    \ Frankrijk en Italië en was van 21 augustus tot 3 december 1599 de gast van Francesco Vrient,\
    \ een van de voornaamste Nederlandse kooplieden in Venetië (vgl. 2). Daarna vertrok hij\
    \ naar Rome, bleef er zes weken, logeerde er ten huize van de koopman Damiano Pallia, die\
    \ door Brulez - zie beneden - herhaaldelijk genoemd wordt als gevolmachtigde van Nederlanders\
    \ in Venetië, was vier weken in Napels en reisde via Rome, Siena, Pisa, Livorno, Lucca en\
    \ Pistoja naar Florence. Na zeven maanden vertrekt hij ‘in compagnie van de Sigr Jaques\
    \ Badouer’ - zie 3 e.v. - weer naar Venetië en van 19 oktober 1600 tot 27 maart 1601 logeert\
    \ hij weer bij Vrient. Behalve het beknopte reiskroniekje dat hij heeft nagelaten1 getuigen\
    \ brief 1 en de rijmbrief uit Florence aan de rederijkerskamer In Liefd'Bloeijende te Amsterdam2\
    \ van deze reis.\nBrief nr. 1 heeft Hooft zijn leven lang bewaard. Het is onder de aanwezige\
    \ ontvangen brieven de enige liefdesbrief. De chronologische publicatie van Hooft's brieven\
    \ begint dus met een zeer uitzonderlijk stuk. Erbij ingesloten waren twee, evenals de brief\
    \ in het Frans geschreven, petrarquistisch-pléiadistische sonnetten die, of ze door de schrijfster\
    \ van de brief zelf gemaakt of alleen maar gekozen zijn, de ernst van haar liefdesgevoelens\
    \ moeten bevestigen (Bijlage 1a). Uit de brief blijkt, dat Hooft en Isabelle een plannetje\
    \ gemaakt hadden: zij zou hem achterna reizen naar Rome (‘mon deseigne d'aller par dela’).\
    \ Blijkbaar had zij een afspraak kunnen maken met reisgezelschap, want alleen reizen kon\
    \ een vrouw niet. Daarna is er een spaak in 't wiel gekomen - geen wonder - het plan is\
    \ ‘rompu’. Zij voegt er evenwel aan toe, dat als Hooft over Venetië terugreist, er een besluit\
    \ genomen kan worden ‘qui vous plaira’. Hieruit valt op te maken dat een tweede verblijf\
    \ te Venetië niet van te voren vaststond, en op 8 juli 1600 belooft Hooft danook aan de\
    \ Amsterdamse Kameristen dat hij ‘binnen weinich weken’ thuis zal zijn. Het werden tien\
    \ maanden, waarvan ruim vijf in Venetië. Dit betrekt het enige gedicht waarvan vaststaat\
    \ dat het in Italië ontstaan is, bij deze beschouwing, de Chanson a Madame, waarvan het\
    \ handschrift, boven deze titel, vermeldt: In Venetia 1601. Dr. P. Leendertz Jr. heeft,\
    \ toen hij brief 1 publiceerde3, de vraag gesteld en bevestigend beantwoord, of Isabelle\
    \ dezelfde is als Madame. Hij geeft geen argumentatie, maar de vraag is belangrijk. Toen\
    \ Hooft het gedicht negen jaar later voor een liedboekje Den Bloem-Hof van de Nederlantsche\
    \ Ieucht2, 1610) afstond, maakte hij eerst ‘het autobiografische element onvindbaar’ (Zaalberg)4\
    \ door de regels 29-31 te veranderen en daardoor de Venetiaanse ambiance weg te nemen. Hij\
    \ liet ook de titel en het opschrift weg. De oorspronkelijke versie is hierachter opgenomen\
    \ als Bijlage 1b.5\nNadat de dichter in r. 16 conventioneel over de ‘dulle’ zee gesproken\
    \ heeft, fluistert hij in r. 29 e.v. over een andere zee, waar hij komt als hij de nauwe\
    \ straten en woelige kanalen van Venetië wil ontvluchten:\n29\nVer wt de straten eng, en\
    \ woelige canalen,\n \nAls snachts slaeprige wint de zee sacht overweijt,\n \nIck op de\
    \ stille vloedt mijn clachten sal verhalen,\n \nDie niet en antwoort, dan 'tgeen datmen\
    \ selve seijt.\nDit is overduidelijk de lagune, in tegenstelling tot de dulle zee in de\
    \ verte, buiten Lido. Het is zo stil, dat een visser die met zijn netten bezig is, de klachten\
    \ van de dichter hoort. Hooft's gastheer bezat behalve een huis in S.Maria Formosa6 een\
    \ tweede op het lagune-eilandje Murano. Hooft logeerde in S. Maria Formosa en in de lagune.\
    \ Dit autobiografische element verborg hij door het water in bergen te veranderen en de\
    \ visser in een jager.7\nDe strekking dat de dichter afgewezen is, maar dit liever aan zichzelf\
    \ wijt dan aan de liefdesgodin of de geliefde, blijft. De vermomming nog na 10 jaar, verraadt\
    \ dat het gedicht niet uit een oppervlakkige ervaring is ontstaan. Op de tegenvaller van\
    \ december 1599 was, in plaats van ‘quel resolusion qui vous plaira’ in oktober 1600 een\
    \ afwijzing gevolgd. Deze tweede teleurstelling trof natuurlijk veel harder.\nMen heeft\
    \ over het hoofd gezien, en dat is begrijpelijk omdat brief 1 bijna onbekend en door Leendertz\
    \ zelf niet goed gelezen was, dat in de eerste woorden van de Chanson de vraag, of Isabelle\
    \ dezelfde is als Madame, bevestigend beantwoord wordt:\n \nSoo 'ck heb gemint, en min,\
    \ en ongetroost moet blijven-\ndeze vermelding van 's dichters liefde achtermekaar in het\
    \ perfectum en in 't praesens is geen topos, maar noemt de feiten: bij hem was de liefde,\
    \ na het weerzien, weer opgelaaid, bij haar niet, zodat hij ongetroost moet blijven. Ook\
    \ dit laatste woord draagt nog iets mee van verleden jaar, en het muzikale accent dat het\
    \ vers daaraan ontleent maakt het als openingsregel van een renaissancegedicht verrassend\
    \ veel mooier.\nHellinga8 en Keersmaekers9 hebben op de onbekende Air gewezen die boven\
    \ de oorspronkelijke lezing van de Chanson staat: ‘Si quelquefois je fu du traict d'Amour\
    \ atteinte’, en de laatste voegt eraan toe: deze vrouwelijke vorm ver-\t4\nC.A. Zaalberg,\
    \ Uit Hoofts lyriek4, Culemborg 1975, blz. 21.\n5\nde veranderde versie LSt. I 10, de oorspronkelijke\
    \ regels 29 v. in deel II, blz. 474.\n6\nW. Brulez, Marchands flamands à Venise I (1568-1605)\
    \ Brussel-Rome 1965, in dato 4 mei 1604.\n7\nUitvoerig uiteengezet door prof. dr. A.A. Keersmaekers\
    \ in Hulde-Album J.F. Vanderheyden, Langemark 1970. In dit betoog komen de latere lezing\
    \ en de later ingevoerde figuur van Don Diego beter dan elders tot hun recht.\n8\nW. Gs\
    \ Hellinga, De nieuwe P.C. Hooft-editie. Over winst en verlies. Handelingen van de Zuid-nederlandse\
    \ Maatschappij voor Taal- en Letterkunde en Geschiedenis VIII (1954).\n9\na.w. blz. 122.\n\
    [p. 68]\t\nraadt dat Hooft háár die woorden in de mond legt, ‘L'air is klaarblijkelijk het\
    \ lied van een vrouw die weleens door de pijl van Amor beroerd was, maar voor wie dat voorbij\
    \ is en voor wie het zelfs niet eens belangrijk schijnt te zijn geweest: Si quelquefois...’.\
    \ Keersmaekers schoot in de roos zonder brief 1 te kennen.\n \nMet het bovenstaande houdt\
    \ het volgende geen rechtstreeks verband.\nVoor een systematisch onderzoek naar Isabelle's\
    \ identiteit ontbreekt het materiaal vrijwel helemaal. Maar tijdens een onderzoek in Venetië\
    \ viel het oog van onze Italiaanse medewerker, Dr. F. Musarra, in de bronnenpublicatie van\
    \ W. Brulez, Marchands flamands à Venise6, op een mogelijkheid. Dit werk bevat bijna 2000\
    \ regesten uit de protocollen van die Venetiaanse notarissen die speciaal Nederlandse, met\
    \ name Antwerpse, cliëntele hadden. Hierin compareert Hooft's gastheer Vrient als primus\
    \ inter pares - zie 2 - en de Antwerpse koopman Cornelius Hoens (Hoons) met wie hij herhaaldelijk\
    \ in één zaak genoemd wordt, had een dochter Isabella. Hoens was in 1582 getrouwd (huw.\
    \ voorw. Keulen 18 juli 1582) met Johanna van Eelen, ook van Antwerpsen huize, komt van\
    \ 1585 af (Parma neemt Antwerpen in) te Venetië voor en testeert er met zijn vrouw 26 juli\
    \ 1595.10 Zes dagen later overlijdt zij. Blijkens achtergelaten en ingezonden volmachten\
    \ keert hij in de eerste jaren van de 17de eeuw naar Antwerpen terug.\nToen kwam allereerst\
    \ de vraag, of het Frans van Hooft's Isabelle uit deze situatie te verklaren zou zijn. Prof.\
    \ Keersmaekers was zo vriendelijk, met zijn collega's romanistiek te onderzoeken, of het\
    \ Frans haar moedertaal was, of aangeleerd. ‘Het laatste’, was de conclusie: er komen ‘absoluut\
    \ onfranse’ vormen en uitdrukkingen in haar brief voor, maar zij kon de taal goed spreken.\
    \ Dus van deze kant geen bezwaar tegen identificatie met een uit Antwerpse ouders geboren,\
    \ in Venetië opgegroeid meisje. Dat Hooft en zij Frans en geen Italiaans spraken is begrijpelijk,\
    \ want hij was juist twee jaar in Frankrijk geweest en sprak nog niet vlot Italiaans. Om\
    \ van beider Nederlandse streektalen maar te zwijgen.\nEr deed zich nu een mogelijkheid\
    \ voor om de eventuele identiteit van Isabelle N.N. met Isabella Hoens te toetsen: haar\
    \ handtekening onder brief 1 zou vergeleken kunnen worden met een op te sporen handtekening\
    \ van Isabella Hoens in het stadsarchief van Antwerpen. Want in die stad is zij in 1613\
    \ getrouwd en veel later overleden, dat was uit gepubliceerde genealogieën gebleken. De\
    \ stadsarchivaris, Dr. J. van Roey, was zo bijzonder welwillend, dit onderzoek te doen:\
    \ op 18 januari 1973 zond hij het door fotokopieën toegelichte bericht: ‘Naar mijn gevoelen\
    \ is de handtekening van dezelfde persoon.’ Reproduceert men nu beide handtekeningen naast\
    \ elkaar, dan worden de verschillen gereleveerd, terwijl een veel belangrijker effect ontbreekt,\
    \ namelijk dat iemand die honderden handtekeningen de revue laat passeren door déze getroffen\
    \ wordt\t10\nBrulez a.w., nr. 611.\n[p. 69]\t\nop grond van algemene gelijkenis. Voor de\
    \ verschillen zijn verklaringen aan te voeren: de Venetiaanse is haastig geschreven door\
    \ een jong meisje dat op 't punt stond zich in een avontuur te storten, de Antwerpse is\
    \ door een 51-jarige weduwe op het kantoor van haar notaris gecalligrafeerd11. De krullen\
    \ achter beide, waarvoor geen andere verklaring bestaat dan dat het identiteitsbevestigingen\
    \ zijn, komen wel enigszins maar niet beslissend overeen. Daarna is aan het Gerechtelijk\
    \ Laboratorium van het ministerie van Justitie verzocht, de handtekeningen te vergelijken.\
    \ De directeur gaf de vraag door aan de schriftkundige van het laboratorium, de heer A.\
    \ Etman, en deze was zo welwillend, er zijn aandacht aan te geven. Met het resultaat dat\
    \ het materiaal te beperkt en het leeftijdsverschil te groot bleek om een grafologische\
    \ conclusie mogelijk te maken. Daarna heeft prof. Keersmaekers nog, maar tevergeefs, naar\
    \ een oudere handtekening te Antwerpen gezocht.\nDe lezer begrijpt dat de uitgave van Hooft's\
    \ briefwisseling tòch moet beginnen met ‘Isabelle N.N. aan P.C. Hooft’. Er zijn ettelijke\
    \ rapprochementen mogelijk, zoals de plaats, de tijd, de leeftijd, de strak omlijnde maatschappelijke\
    \ kring van de marchands flamands, de taal. Pikant persoonlijk is de omstandigheid, dat\
    \ Isabella Hoens geen moeder had, en dat haar vader 16 januari 1600 in Antwerpen hertrouwde\
    \ en dus in december 1599 op reis ging: wegneming van het beletsel bij uitnemendheid! Maar\
    \ de enige positieve aanwijzing blijft de handtekening. Dat Isabella in 1613 in Antwerpen\
    \ trouwde met François Tholincx uit 's-Hertogenbosch12, terwijl Hooft's zuster Grietje in\
    \ 1610 in Amsterdam getrouwd was met Herman, zoon van Arent Tholincx uit 's-Hertogenbosch13,\
    \ wordt hier pro memorie vermeld."
  tekst: 'A Monsieur Monsieur Piere Hooft Roma

     

    iace al m s Damiano palea

     

    Monsieur. J''aij receu la Vre premier le 14. decembre le seconde le 20. Je vous fiet responce
    et attendois que le serviteur le debvoit venir querir mais voiant quil tardoit trop a venir
    Je laij envoie a rome A Monsir Floris que Jaij prie de le vous faire venir, / Je ne Vous
    dire aultre chose pour le present sinon que mon deseigne d''aller par dela est rompu de
    fason que si vous plait retourner par icy nous prendrons quel resolusion qui vous plaira.
    Cependant Je vous prie Conserve moy tousiours en voz bonnes graces et soies assure que Je
    suis et sera eternelement Monsieur

     

    Vre treshumble affectione a vous faire service Isabelle'
