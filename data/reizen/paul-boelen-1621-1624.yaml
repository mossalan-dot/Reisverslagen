beschrijving: Ongedateerd verslag van een diplomatieke reis van Paul Boelen naar Engeland en
  Frankrijk uit 1621-1624 in het gezantschap van François van Aerssen van Sommelsdijk (1572-1641),
  Diederick Bas (1569-1637) en Hendrik van Tuyll van Serooskerken (1574-1627). Boelen arriveerde
  in Engeland en maakte vanuit Londen uitstapjes naar Oxford, Cambridge en Bath. Hij stak het
  Kanaal over tussen Dover en Wissant, bezocht Parijs en het Loiregebied en reisde zuidelijk
  naar Bordeaux. Het verslag eindigt in Montauban.
