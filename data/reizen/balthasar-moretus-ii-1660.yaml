beschrijving: Verslag van een reis van Balthasar Moretus II naar Parijs in 1660 in het gezelschap
  van zijn oudste zoon Balthasar III (1646-1696). Moretus reisde van Antwerpen via Brussel naar
  Parijs, waar hij twee weken verbleef. Hij nam dezelfde route terug.
