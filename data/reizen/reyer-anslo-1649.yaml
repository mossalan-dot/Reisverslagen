poezie:
- titel: Afscheit van Amsterdam
  dichter: Reyer Anslo
  datum: 12-09-1649
  locatie: Bingen am Rhein, Duitsland
  taal: Nederlands
  bron: Anslo 1713, 273-274
  link: https://dbnl.org/tekst/_gid001190601_01/_gid001190601_01_0045.php
  tekst: "Afscheit van Amsterdam\n \nHier, daer de Ryn met radde watren stroomt \nDoor bergen\
    \ hardt van steenen, vol geboomt, \nOf wyngaartranken, \nHier reize ik heen; maar gy, myn\
    \ voetstervliet, \nMyn Amstelstroom, al zie ik u hier niet,\nIk wil u danken\t\nVoor al\
    \ uw gunst, waar van ik roem en boog.\nO Waternimf, gy zyt my uit het oog,\nNiet uit het\
    \ harte.\n't ls waar, myn stadt, dat ik van u niet lang \nBen afgeweest, maar 't is my reets\
    \ te bang\nEn groote smarte:\n \nMyn hart wordt flaau, als 't denkt om al zyn bloet\nOm\
    \ vrient en vreemt, in myn zoo teer gemoet\nZoo diep gekropen;\nIk acht my aan myn bakermat\
    \ verplicht,\nEn toen ik nu uit Hollant en het Sticht\nWas uitgeloopen,\n \nToen keerde\
    \ ik my heel twyflend langs de brug\nBy Nieuwersluis tot driemaal toe te rug\nNaar Amstels\
    \ vesten,\nTot dat myn geest, bevangen met een' tocht\nTot reizen, my weêr aan het reizen\
    \ brocht,\nEn sprak op 't leste:\n \nOp, maak u op, om met een' hoogen toon\nTe Rome voor\
    \ des Tybers Myterkroon\nLatyn te spreken.\nIk stond verbaast, en even als die geen,\nDie\
    \ voorwaarts dryft, en door de stroomen heen\nNiet ziet te breken;\n \nMaar ziet nogh eens,\
    \ zoo ver nu van den kant,\nZoo deerlyk om naar 't lieve vaderlant,\nZoo waardt als 't leven:\n\
    Zoo is 't met my, die om het Roomsche feest\nU, die zoo lang my zyt zoo lief geweest,\n\
    Nu moet begeven.\n \nOp den Rynstroom, den\n12 September 1649,\nby 't Bingerlogh."
- titel: Antwoord, op mijn klinkdicht, van Rynbrand Anslo, te Rome
  dichter: Reyer Anslo
  aan: Joannes Six van Chanderlier (1620-1695)
  datum: december 1650
  taal: Nederlands
  bron: Six van Chandelier 1991, 468-469
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0257.php
  beschrijving: Anslo schreef dit gedicht in antwoord op Six' sonnet afscheid uit Rome (no.
    [80]). Het dateert van december 1650. Joan de Haes, de samensteller van Anslo's Poëzy (Anslo,
    1713), zal het uit Six' bundel hebben overgenomen in zijn uitgave (het gedicht aldaar op
    p. 277, onder de titel Aan den Heere J. Six Van Chandelier). Anslo's gedicht staat op p.
    332-333 van Six' bundel.
  tekst: "Antwoord, op mijn klinkdicht, van Rynbrand Anslo, te Rome\t\n\nDe schilder deed een\
    \ loosen trek,\nDie Alexanders scheeven nek\nBedekte, als hy dien werreldvooghd\nAfschildert,\
    \ zoo dat hy beooght\nDen Heemel, en in zulk gelaat,\nDat hem syn misstal niet misstaat.\n\
    Of als hy, met een schutjen, dekt\nHet geen, dat hem, tot nadeel, strekt.\nZoo doet ghy\
    \ ook, o Six, als ghy\nVan my maalt zulken schildery.\nUw dicht, schoon of het my behaaght,\n\
    Heeft my roo wangen aangejaaght. \nO groote geest, ik prys uw kunst:\nMaar neem uw oordeel\
    \ aan, voor gunst.\nUw klinkdicht voert myn naam, maar siet\nIk sie my self, maar ken my\
    \ niet."
- titel: Afscheid uit Rome van R. Anslo. aan den selven
  dichter: Joannes Six van Chandelier
  aan: Reyer Anslo
  datum: december 1650
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991, 82
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0080.php
  beschrijving: In december 1650 verliet Six Rome, waar hij in oktober of november van dat jaar
    was gearriveerd. In Rome was hij opgezocht door de Amsterdamse dichter Reyer Anslo, die
    daar toen reeds een jaar verblijf hield. Op het afscheid schreef Six dit sonnet, dat werd
    gevolgd door een antwoordgedicht van Anslo en een wederantwoord van Six (no. [332] en no.
    [333]). Uit Six' enkele jaren later geschreven brief, aan R. Anslo, te rome (no. [468])
    is op te maken dat Six Anslo bij zijn tweede reis naar Italië, in het najaar van 1651, heeft
    teruggezien. Hij ontmoette hem toen in Venetië en Padua. Dit sonnet staat op p. 41 van Six'
    bundel.
  tekst: 'Afscheid uit Rome van R. Anslo. aan den selven

     

    Vaar wel, o jonge Prins der Amstelsche Poeëten,

    In ''t juitinghjaar, ik keer, naa offringh van myn dienst,

    Lyk ghy my welkom eerst besocht op ''t onvoorsienst,

    Vaar wel in Rome, op u, als d''oudheit, korts vermeeten.

    Heb Vatikaan in ''t hoofd, door d''oogen, opgegeeten,

    En brengh syn Musen, wyl ''t de purpere Kapoon

    U gunt, wanneer ghe volght, noch zal ons Y een toon

    Te hooger singen, om uw wiegh, in haar, versleeten.

    Voor jaaren merkte ik al een goddelyken swier,

    In ''t kristallyne dicht, als veel getuigen weeten,

    Ik sprak, onse Anslo dinght naa d''uiterste laurier.

    Ghy streekt een silvre schaal voorheen, en goude keeten.

    Vaar wel o jonge Prins, t''huis hoop, door Gods bestier,

    Te rymen, welkom Prins der opperste Poeëten.'
- titel: Mijn antwoord, aan den selven
  dichter: Joannes Six van Chandelier
  aan: Reyer Anslo
  datum: december 1650
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991, 439-440
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0258.php
  beschrijving: In antwoord op het voorgaande gedicht van Anslo schreef Six het hier behandelde
    gedicht, waarin hij het geheel mannelijke, gepaarde rijm en het metrum van Anslo's gedicht
    overneemt. Het gedicht staat op p. 333-335 van zijn bundel.
  tekst: "Myn antwoord, aan den selven.aant.\n \nSich self te kennen is een reên,\nDie, van\
    \ den Heemel viel beneên.\nWel saaligh, wie in syn gemoed\nKent, wat hy is, en wat hy doet.\n\
    Die heeft de hielen op den nek,\nVan veele swakheit, en gebrek.\nGhy seght, ghe kent u selven\
    \ niet,\nSchoon ghy, in 't dicht u toenaam siet:\nMaar wyl ghe seedigh u niet kent,\nZoo\
    \ blykt dat ghy een kenner bent.\nUw seedigheit, in zoo een kleed,\nVan needrigheit, dat\
    \ niets vermeet,\nMaar waaren prys, en lof versmaadt,\nRyst zoo veel hooger in der daad.\n\
    Hoe slecht een fraaije ziel sich hult,\nHoe fraaijer men heur deuchd verguldt.\nUw heuscheit,\
    \ Anslo, noem my dan\nGeen loosen schilderenden man:\nNoch lyk myn maagre poësy,\nNiet by\
    \ een valsche schildery.\nWant schoon die schilders eel penceel,\nZoo soet, den kyker, naa\
    \ 't panneel,\nBedrieght, noch blyft die groote Held,\nDaar buiten, aan syn hals, misstelt.\n\
    Lyk schoon Apel de scheele koon\nVerberght, van Kooningh Antigoon,\nWanneer hy sydlinghs\
    \ 't ander deel\nGesond vertoont, noch blyft hy scheel.\nMaar scheur het klinkdicht, u ter\
    \ eer,\nUw lof nochtans sweeft min, noch meer,\nAls vooren, ruim, en sonder my,\nVolmaakt,\
    \ om 't ronde zeegety.\nDoch zoo 't uw swaane zoo geviel,\nDat ik een schilders naam behiel,\n\
    't Is wis, dat nooit gelykenis\t\nMy aardiger gegeeven is.\nGelyk men, schoon een konstenaar,\n\
    Hoe seer beroemt, hy immer waar,\nEn hoe vernuftigh, dat syn hand\nEen beeld kan schildren\
    \ op den wand,\nGetuight, de schildery lykt wel:\nNoch schort er vlees, en ziel, en vel,\n\
    Als wy, in 't prachtigh Vatikaan,\nVan Rafel, gister saagen aan,\nDien naakten vluchtelingh,\
    \ uit vuur\nVan Trooijen, hangen, aan een muur:\nWat schort er dan de huid, en stem,\nOm\
    \ hulp te roepen, in de klem?\nAl eens is myn gedight geweest,\nEen schets slechts van uw\
    \ grooter geest,\nDan myne, indien een geestge luim\nOoit vloeide, van myn drooge pluim.\n\
    En zoo veel brak er leevens in,\nDat 's meerder waarheits, dan ik min\nUitdrukte, dan de\
    \ waarheit waar.\nOm dat een arme lierenaar\nDe toonen, van zoo hoogen maat,\nTe heffen,\
    \ al te laage slaat.\nDoch speelde ik wat, de radde dachs\nZal oopenbaaren, dat men sach,\n\
    Langh van te voor, een slecht poeet,\nOok somwyl was een waar profeet."
- titel: Op het kontrefeitsel, van R. Anslo. Door Bronkhorst, te Venecie, aan den selven
  dichter: Joannes Six van Chandelier
  aan: Jan Jansz. van Bronckhorst en Reyer Anslo
  datum: najaar 1651
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991, 453
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0267.php
  beschrijving: "De Utrechtse schilder Jan Jansz. van Bronchorst (1626-...) is volgens Hoogewerff\
    \ ‘van 1649 tot minstens 1651’ in Rome geweest. Het is niet bekend wanneer en waar hij is\
    \ gestorven, maar Hoogewerff vermoedt een jeugdig overlijden in den vreemde (in Italië).\
    \ Hij neemt aan dat de schilder voor een nadere oefentijd in Venetië is geweest,\t\n[p.\
    \ 482]\t\n\n omdat de stijl van een tweetal naaktfiguren van zijn hand daarop wijst. ‘Waren\
    \ zij in Rome ontstaan, dan zouden zij waarschijnlijk een meer academisch en minder schilderachtig\
    \ voorkomen hebben. Ook zou de toon licht minder verzadigd zijn. Er zijn echter geen gegevens\
    \ beschikbaar om deze gissing te staven’. Ik meen echter op grond van Six' werk steun te\
    \ kunnen geven aan zijn veronderstelling. Volgens Hoogewerff zou Six zijn gedicht in Venetië\
    \ hebben geschreven, in december 1650, na het portret ‘kort te voren in Rome te hebben bewonderd’.\
    \ Dit laatste is mijns inziens niet juist. Uit de titel van het gedicht blijkt dat het is\
    \ geschreven toen Van Bronchorst (waarschijnlijk evenals zijn schilderij) in Venetië was,\
    \ hetgeen mij doet vermoeden, dat het niet in december 1650, maar in het najaar van 1651,\
    \ bij Six' tweede reis naar Italië, tot stand is gekomen. Six ontmoette toen ook Anslo in\
    \ Venetië en Padua (vgl. gedicht no. [468], r. 7-14) en die kan hem aan zijn portrettist\
    \ hebben voorgesteld. Van Jan van Bronchorst zijn bekend (gesigneerd of toegeschreven):\
    \ twee naaktfiguren, een heilige Sebastiaan, een heilige Bartholomeüs en een driedubbelportret\
    \ van één persoon: de dichter Matthijs van der Merwede van Clootwijck, van wie hij ook een\
    \ portret etste. Het is niet bekend waar zijn portret van Anslo zich thans bevindt (Hoogewerff,\
    \ 1959, met name p. 155 en p. 159-160; Staring, 1966). Six' gedicht op het portret staat\
    \ op p. 343-344 van zijn bundel Poësy."
  tekst: 'Op het kontrefeitsel, van R. Anslo. Door Bronkhorst, te Venecie, aan den selven.

     

    Wat moeit ghy, Bronkhorst, uw penceel,

    Met verw, zoo leevende, op ''t panneel,

    Om Anslo, Amstels geestgen soon,

    Te brengen, naa syn dood ten toon?

    Uw schildery, die dringht, en byt,

    Door eeuwen heen, nochtans se slyt,

    En werd verteert van lucht, en wind,

    Als dat ontkleede, speelsche kind

    Blaast, in dien ydlen waaterbel,

    Die strax zal barsten van geswel.

    Ghy beeldt, op syn begeer, den waan,

    Waar ''t werreldsch van is ooverlaân,

    Vol ydelheits, met zoo een niet.

    Maar d''oope blaaren, die men siet,

    Van Seneka, op ''t taafelkleed,

    Waar aan hy peinsend sit, en meet

    Een treurspel, of een ander dicht,

    Daar steekt wat in, van meer gewicht.

    Dit meester is dat u bedrieght,

    Want syne geest die swiert, en vlieght,

    Met die papieren, uit dat boek,

    En wyl ghe schildert, is te soek.

    Men siet wel Ansloos bloote beeld,

    Maar ''t eigentlyke leeven speelt,

    In dat geschrift, dat, door den druk,

    Den tyd zal dryven, onder ''t juk.

    Zoo zal hy eerder niet vergaan,

    Dan Heemel, starren, son, en maan.

    De dood houdt geen vernielend feest,

    Op d''eer van een geleerden geest.

    Dus leeft die groote treurenaar,

    Van Kordua na duisend jaar.

    Zoo hy uw konst, in syne, maalt,

    Zoo werd de konst, met konst, betaalt.'
- titel: Brief, aan R. Anslo te Rome
  dichter: Joannes Six van Chandelier
  aan: Reyer Anslo
  datum: '1656'
  locatie: Nederlandse Republiek
  taal: Nederlands
  bron: Six van Chandelier 1991, 793-796
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0468.php
  beschrijving: In 1656 bereikte Six wat nieuws uit Italië over Reyer Anslo, met wie hij zes
    jaar eerder, in de laatste maanden van 1650, te Rome had kennisgemaakt en die hij een jaar
    later, elders in Italië, opnieuw had ontmoet. In de tussenliggende jaren was er weinig contact
    geweest tussen de vrienden. Six had alleen wat praatjes over Anslo's toetreding tot de katholieke
    kerk gehoord en wist in 1656 zelfs niet zeker of Anslo nog wel in leven was. In dat jaar
    kreeg hij echter een gedicht van Anslo in handen, dat was bijgesloten of opgenomen In een
    briefjen, aan een ander Amsterdamschen Neederlander (r. 79-80). Hij zond Anslo daarna dit
    briefgedicht, waarin hij hem herinnert aan hun vriendelijke omgang in 1650 te Rome en in
    1651 te Venetië en Padua (vgl. ook de gedichten no. [80], no. [257] en no. [258]). Dit gedicht
    staat op p. 600-604 van Six' Poësy.
  tekst: "Brief, aan R. Anslo, te Rome.\n \nAnslo, geest in poesy,\nDie veel geesten aan het\
    \ Y\nSomtyds nydigh om deed kyken,\nAls uw pen de prys gingh stryken,\nVan een ander, nergens\
    \ naar,\nNoch zoo geestigh, noch zoo klaar:\nGoede kennis, maar te tanger,\nWant de vriendschap\
    \ wierd eerst swanger,\nVan ons beiden, binnen Room,\nTe Veneci, uit haar soom,\nVoor ses\
    \ jaaren pas gebooren,\nEn te Padua, alvooren\nMyn vertrek, van uw gelei,\nAangequeekt,\
    \ met geen gevlei,\nMaar met melk van vroomen yver,\nOm te huis die styf, en styver,\nTot\
    \ bedaaghtheit op te voen:\nSinneryke dichter, toen\nWy malkander veele daagen,\nDeur Liëer\
    \ glaasjes saagen,\nEn deur misten van tobak,\nBy de vrunden, zoo ontbrak\nOns onnoodigh\
    \ pen, noch boeken,\nOm malkander te besoeken.\nMaar terwyl we, duisend myl\nZyn gescheiden,\
    \ waar de styl\nVan besoek, noch groeten gelden,\nDan de penne, en boo kan melden,\nMaakt\
    \ er geen van bei gewach,\nWaar aan of het faalen mach?\nLieve waar aan mach het faalen?\n\
    Weet men niet een pen te haalen?\nVindt men swaanwiek, gans, noch end?\nIs de waatermoole\
    \ ontwent,\nVan 't gemaal der postpapieren?\t\nBlyven inkten aan 't verdieren?\nMynt men\
    \ potloot, noch rood kryt?\nKan men naa den ouden tyd,\nNoch in palm, noch schorsseriemen,\n\
    Syne meiningh fyntjes vliemen?\nReist er post, noch reisend man,\nDie een boodschap brengen\
    \ kan?\nLieve waar aan mach het faalen?\nSeeper wist ik t'achterhaalen,\nWaar dat Anslo\
    \ is belendt,\nMaakte ik hier en daar bekent,\n'k Moest de kennis, half begraaven,\nDoen\
    \ verrysen, somtyds laaven,\nEn gesonder dan te voor\nMaaken, met het brief tresoor.\nSpreeuwbek,\
    \ doch wat twyffelachtigh,\nSnaaterbekte, hy in 't machtigh,\nEn trots Rome hiel syn woon,\n\
    By den Kardinaal Kappoon.\nHy had Menno uitgetrokken,\nGingh in lange knunnikrokken,\nHongh\
    \ de seilen, naa den wind,\nVan den mytergod bemint,\nWelkers stoel hy kon verplichten,\n\
    Met hooghvliegende eergedichten,\nAls een oud, of nieuw Romein,\nIn uitheemschen ongemein.\n\
    Dies, om dat de pest, van Napels\nSchier ontvolkt, deur heele staapels,\nPutten vol van\
    \ lyk, op lyk,\nLanghs den Tyber, 't Pausche ryk,\nVoortgeslaagen, uitgelaaten,\nMet heur\
    \ seissen heele straaten,\nHof, en huis had omgesneen,\nDacht ik leedsaam, tien om een,\t\
    \nOf myn kennis is gekorven,\nVan dat vuurswaard, en gestorven.\nMaar myn kennis, o! hoe\
    \ gaauw\nSchiep myn boesem angh, en flaauw,\nAam en sterkte? o! wat een luister\nKreegh\
    \ myn aanschyn, naa dat duister,\nEn beneevelt morgenlicht,\nMet de son van uw gedicht,\n\
    In een briefjen, aan een ander\nAmsterdamschen Neederlander,\nDeurgebrooken helder blonk,\n\
    En men u gesondheit dronk?\nSchenk my ook een glas, met saanen,\nLaat myn oogen ook eens\
    \ traanen,\nVan een frische Mentser pint:\nGeeft my daadlik pen, en int,\nEn een doek, om\
    \ 't hoofd te doeken,\n'k Wil myn kennis gaan besoeken,\nMet een bly ontworpen rym:\n'k\
    \ Wil myn kennis, half in swym,\nKloeker, dan te voor, oprechten,\nRiep ik yvrigh tot de\
    \ knechten.\nGoede kennis, heeft het val,\nSegh hoe staat het leeven al?\nGoede kennis laat\
    \ my weeten,\nOf ik u noch zoo mach heeten?\nOf uw kerk, en grooter staat\nKleiner, en de\
    \ werld niet haat?\nKrygh ik antwoord, 't is een teeken,\nVan gespraaksaamheit, met leeken.\n\
    Uwe hand, om myne hand,\nZoo gevouwen, zal een band\nVan de voorste kennis blyven,\nEn de\
    \ vriendschap trouwer styven.\nLieve, segh dan, of voortaan\t\nUwe liefelyke swaan,\nSich\
    \ nu pluisende, in de straalen,\nDie van Sweedens Pallas daalen,\nDie, in plaatse van olyf,\n\
    Keetens, om uw schouders, styf\nVan fyn goud sondt, om te loonen\nUwe vaarsen, heure kroonen,\n\
    Nooit ons oor zal streelen meer,\nTeegenwoordigh, noch van veer?\nWat al flaauwe geesten\
    \ snakken,\nOnder Amstels ypetakken,\nNa veranderingh van lucht?\nAl wat Vondel singht,\
    \ en sucht,\nAl wat Huigens luitesnaaren,\nOnder Haaghsche lindeblaaren,\nSpeelen, op gemeeten\
    \ toon,\nSmaakt wel lekker, klinkt wel schoon:\nMaar de maagen, naa 't versaaden\nVan gesooden,\
    \ van gebraaden,\nWenschen, dat er ook banket,\nOp de taafel, werd geset."
