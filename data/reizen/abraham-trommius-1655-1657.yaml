beschrijving: Maakte tussen 1655 en 1657 een educatiereis naar Duitsland, Zwitserland, Frankrijk,
  Engeland en de Zuidelijke Nederlanden met Louis Wolzogen de Meningstorf (1631-1690) en Johannes
  Hotton. Hij bezocht onder andere Keulen, Heidelberg, Bazel, Genève, Nîmes, Montpellier, Bordeaux,
  het Loiregebied, Parijs, Londen en Oxford. Gedrukt verslag in zijn autobiografie, getiteld
  ‘Bevindingen van hem selven geduirende syn levens-loop tot soo verre hy hadde opgetekent ende
  by een versamelt (Trommius 1720).
