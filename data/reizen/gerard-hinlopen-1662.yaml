beschrijving: Kort verslag van een plezierreis van Gerard Hinlopen naar Zeeland en de Zuidelijke
  Nederlanden in 1662 in het gezelschap van burgemeester Cornelis Olfertsz en Cornelis Jacobs
  Segen. De reis loopt van Hoorn naar de Zuidelijke Nederlanden, waar Hinlopen Antwerpen en
  Brussel aandoet. Hij keert terug via Vlissingen en Middelburg.
