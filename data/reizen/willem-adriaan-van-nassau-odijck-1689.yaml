beschrijving: 'Diplomatieke reis van de extraordinaris gedeputeerden Nicolaes Witsen, Willem
  van Nassau-Odijck, Everhard van Weede, heer van Dijkveld, en Alexander Schimmelpenninck van
  der Oye wegens hun zending naar Engeland in verband met conjunctie van de Engelse en Nederlandse
  vloot en de troonsbestijging van prins Willem III als koning van Groot-Brittannië.1689 januari
  11 - 1689 november 11


  Verbaal van de extraordinaris ambassadeurs Alexander Schimmelpenninck van der Oye, Nicolaes
  Witsen, Willem van Nassau-Odijck, Everhard van Weede, heer van Dijkveld en de ordinaris ambassadeur
  Arnout van Citters wegens hun zending naar Engeland in verband met onderhandelingen over een
  nadere alliantie met de Republiek, de terugbetaling van de onkosten van de expeditie naar
  Engeland en de oorlogsverklaring aan Frankrijk.1689 maart 7 - 1689 december 3'
