beschrijving: Maakte tussen 1606 en 1608 een educatiereis met zijn broer en tutor Johannes Meursius
  (1579-1639), eerst in het gevolg van keurvorst Ernst van Keulen (1554-1612) naar het hof in
  Praag, daarna naar Duitsland, Genève en Frankrijk. Studeerde in Heidelberg en Genève. Werd
  door Hendrik IV (1553-1610) aangenomen als edelman.
