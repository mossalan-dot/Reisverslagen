beschrijving: Leefde en werkte in Rome tussen 1659 en 1666, waar hij meermaals in aanraking
  kwam met de politie wegens vechtpartijen en het verboden bezit van een degen. Zijn jongere
  broer Engel (ºca. 1641) reisde met hem mee. Sloot zich aan bij de Bentvueghels en kreeg de
  bijnaam ‘Geestigheit’.
