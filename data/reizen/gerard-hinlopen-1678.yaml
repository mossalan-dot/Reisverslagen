beschrijving: Kort verslag van een plezierreis per boot naar Utrecht, Zuid-Holland en Gelderland
  van Gerard Hinlopen in 1678 in het gezelschap van zijn neef Nanning Hinlopen en Voljard Schellinger.
  De reis liep naar Utrecht, Dordrecht en Nijmegen en terug via Den Haag en Amsterdam.
