beschrijving: Kort verslag van een zeereis naar Engeland van Constantijn Huygens sr. in 1624
  in het gezantschap van François van Aerssen van Sommelsdijk en Albert Joachimi (1560-1654).
  De reis wordt beschreven tot Gravesend.
