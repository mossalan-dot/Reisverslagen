  tekst: 'A Paris ce 24 May 1675.

    J''auray soin d''observer dans la fabrique de la montre et de la boete ce que vous me mandez.
    le chiffre sera mieux de GG et HH simplement. Je feray mettre des cristaux des deux costez,
    a fin que sans ouvrir la montre ou puisse voir le mouvement du balancier. Elle pourra couster
    environ 200 ℔ et la chainette d''or 33 ℔ tellement que vous n''aurez qu''a m''envoier une
    lettre de change de 100 escus afin que j''y adjoute encore ces autres choses que vous demandez;
    et si je n''emploie pas tout cet argent, je vous feray rendre le reste; de celuy que mon
    Pere a de mes rentes a vie. Je voudrois estre un peu assurè du transport quand tout sera
    prest et j''attens pour cela de voir arriver un pacquet que ma soeur devoit m''envoier par
    la voiture que vous dites. Tout estant plein de trouppes sur la route il me semble qu''il
    y a beaucoup a apprehender.

    Je ne doute pas que le Sieur Oosterwijk et tous nos horlogeurs n''ayent grande impatience
    de voir la nouvelle montre, car asseurement ce ne leur sera pas un petit avantage, d''apprendre
    sans aucune peine ce qui m''en a coustè beaucoup, et a l''horlogeur que j''employe, à defricher.
    Rien ne leur pourra estre difficile si ce n''est la fabrique du petit ressort. Pour ce que
    est du contretemps qui fait arrester, et du remede, j''en escris amplement a mon pere. l''Experience
    me fait voir que ce defaut n''est pas assez considerable pour meriter qu''on le corrige
    en adjoutant quelque chose au volume de la montre, car autrement j''en scay un moyen asseurè,
    et dont l''invention est belle et simple.

    Si l''ouvrier qui veut entreprendre le miroir ardent sçait faire une bonne mixtion pour
    la matiere, et entend le poly, il ne luy manque pas beaucoup de ce qu''il faut pour cet
    ouvrage. Il faut que le miroir ait environ ½ pouce d''espaisseur, qu''il contiene 1/12 de
    la circonference du cercle, et qu''il ait la figure spherique tres exacte. Le nostre a ces
    proportions; il brusle a 3 pieds de distance et a autant de diametre. ces pieds sont plus
    grands de 5 lignes que ceux de Rhynland. Il y a un homme icy qui a estè 5 ans a travailler
    a un miroir plus grand que le nostre de 6 pouces, mais ni la matiere ni la forme sont comme
    il faut. On dit que l''ouvrier de Lion qui a fait le nostre en a fondu un de 4 pieds, mais
    qu''il fait difficultè d''entreprendre a l''achever si on ne luy avance de l''argent. Adieu,
    je souhaite pour le moins autant que vous la fin de cette facheuse guerre, et que je vous
    puisse voir tous en santè apres la fin de la campagne.'
