  tekst: 'A Paris ce 9 Aoust 1675.

    Je suis bien aise de ce que la montre vous a esté rendue en bon estat, et que Monsieur le
    Prince la trouve a son gré. Il n''est pas malaisè d''en faire de forme ronde, et il y en
    a plusieurs comme cela, entre autres celle que je porte sur moy, mais elles ne scauroient
    porter un balancier si pesant, au moins jusqu''icy on n''en a pas trouvè la maniere. L''on
    fait pourtant des essais pour cela et dans peu vous en scaurez le succes. J''ay veu une
    montre de la vielle façon que mon horlogeur avait rajustée comme le Sr. Meester se l''est
    imaginè, mais le balancier n''estoit pas a beaucoup près si grand que celuy que vous avez
    veu. Peut estre que luy trouvera quelque chose de meilleur pour cela et il vaut la peine
    d''y songer. Celle que je viens de dire ne laissoit pas d''aller incomparablement plus juste
    que les montres anciennes. Ce qu''on vous a dit de mon plagiaire est vray, qui n''osant
    paroistre lui mesme a s''opposer a l''Enregistrement de mon privilege, a suscitè un petit
    fol d''Abbè sous le nom duquel il agit. Et quoy que la pretension de cet Abbè soit chimerique
    et sans fondement, (car elle consiste en ce qu''il avoit essayé sans succes, il y a un an,
    d''appliquer un ressort droit au lieu de pendule qui estoit menè et faisoit des balancemens
    de mesme que les longs pendules) la chicane n''a pas laissè de me traverser jusqu''icy,
    et je n''aurois jamais vu la fin de cette affaire au Parlement par les brigues et menees
    de ce fripon d''horloger, mais je l''ay evoquée au Conseil du Roy, ou Monsieur Colbert m''a
    promis de me faire depescher un arrest par lequel j''auray autant, que si le privilege estoit
    enregistrè. Je verray quel en sera l''effect, et je suis resolu ou d''avoir raison de ce
    coquin et la satisfaction que je desire, ou de quitter tout en ce pais icy. Meester a bien
    jugè que ce petit bout qui sort a la pointe de la poire est pour aider a demonter le grand
    ressort, que l''on retient avec la clef pendant qu''on lache un crochet qui respond a ce
    petit bout. Cela ne sert que quand on defait toute la montre.

    J''espere au moins que Monsieur le Prince ne la met pas dans une poche ou il y a des clefs
    ou autre chose, qui la pourroit endommager, n''estant pas bien forte d''or, et sans estuy.
    Mais le meilleur seroit d''avoir une petite poche apart et peu profonde, et la portant ainsi
    je responds de l''arrest.

    Le tour qu''on vous a fait voir est surprenant mais nous le scavions icy. Celui du baston
    qu''on casse sur deux verres sur lesquels il appuie par ses bouts est fondè sur la mesme
    raison.

    Je vous ay peut estre nommè cy devant le Sr. Borel pour avoir trouvè moyen de polir sans
    papier, mais sa methode ne vaut pas celle de le Bas parce qu''elle n''acheve pas le poly
    dans cette perfection. Je ne vous ay rien dit de ce que j''avois decouvert du depuis touchant
    cette methode parce qu''il faudroit copier des memoires que j''en ay escrits, et cela ne
    vous serviroit de rien.

    L''on a bien de la peine a avoir de l''ouvrage de le Bas, parce qu''il n''a point de santé,
    crachant du sang et estant incommodè d''une toux qui est de mauvais presage.

    J''ay deux de ses lunettes de 3 pieds a 4 verres, dont l''une est dans un baston peint de
    ce beau vernis. J''en ay achetè une pour Mr.... a Amsterdam, de 20 pieds qui a cousté 20
    pistoles. Et nous en avons deux pareilles a l''observatoire, avec une de 60 pieds mais qui
    n''est pas tout a fait parfaite, a cause de la matiere du verre. Celle de Campani de 36
    pieds est tres bonne, et dont on se sert le plus, parce que les 60 pieds sont tres difficiles
    a manier. Il y en a autrement une de cette longueur de Divini, qui est bonne. Borel se vante
    d''en avoir de 150 pieds, mais il est Gascon.

    Ces desseins dont vous parlez ne sont pas ceans mais aux Gobelins chez M. le Brun. J''en
    ay veu autrefois la plus grande partie chez Jabach, mais pour vous en pouvoir faire raport
    je les iray bien encore voir chez M. le Brun.

    les oculaires chez le Bas se polissent de mesme que les objectifs, mais dans une forme qui
    tourne. Il en fait aussi de petites a 4 verres, mais l''on estime plus celles d''un pied
    a 2 verres qui grossissent autant que celles de 3 pieds a 4 v.

    Je vis hier M. de Ruytenburg qui est tousjours au lict d''une blessure qu''il s''est faite
    en voulant sauter hors d''un carosse, et il n''en sortira encore de 3 semaines. Il me dit
    qu''il vous avoit escrit par 2 fois pour vous prier d''envoier un passeport pour Mad. la
    grand duchesse de Toscane qui veut faire venir des chevaux de nostre païs, et me prie de
    vous en faire souvenir. Je vois bien qu''il en souhaite fort l''expedition parce qu''on
    luy en demande souvent des nouvelles.'
