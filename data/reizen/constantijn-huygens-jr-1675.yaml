  tekst: 'A Paris ce 19 Juillet 1675.

    Je crois que mon Pere vous aura fait scavoir il y a longtemps que vostre montre vous seroit
    apportée par Monsieur Boreel, qui estant parti il y a 8 jours doit estre arrivè au camp
    de Monsieur le Prince a l''heure que je vous escris. Je luy ay aussi donnè la garniture
    d''espée et les 4 estuis avec des ciseaux, chaque paquet estoit cachetè apart et la montre
    dans une boete, ou j''ay aussi mis une lettre pour vous, qui contient la maniere de gouverner
    cette montre. Ie doute si j''y ay adjoutè qu''il faut la porter dans une petite poche apart
    et qui ne soit pas profonde.

    Vous me ferez plaisir de me le mander quand vous l''aurez receuë, et comment vous l''avez
    trouvée a vostre grè.

    Le Sieur du Pont m''est venu trouver mais trop tard. Je n''ay pas le temps presentement
    de vous entretenir comme vous souhaitiez touchant la Lunetterie. Je vous diray seulement
    que je pense avoir decouvert encore quelque chose de plus que ce que je vous ay communiquè
    cy devant, touchant la fabrique de verres. Mais le bon le Bas ne me dit pas pourtant tout
    son secret. Il fait tourner la forme dans la quelle il acheve ses occulaires et il a accommodè
    une petite machine pour cela, avec la quelle sa femme fait de ces verres au lieu de filer.
    Il avoit dessein d''en faire une autre pour faire 10 ou 12 verres a la fois. Il est a une
    maison de campagne depuis quelque temps pour tascher de se guerir du crachement de sang
    et d''une petite toux, que j''apprehende fort qu''elle ne luy soit fatale.'
