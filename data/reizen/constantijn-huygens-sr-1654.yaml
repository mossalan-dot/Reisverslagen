  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Je rens graces à Dieu de tout mon coeur de la nouvelle qui nous vient que V.A. rentre
    tout de bon aux apparences d''une reconvalescence parfaicte, jusques à se disposer au dernier
    remede des malades relevez, qui est le changement de l''air. Il est vray que V.A. le va
    cercher plus loing que nous ne le souhaitterions pour les interests de la Maison, mais cest
    autre bon subject qui l''y convie si puissamment, nous ferme la bouche et faict terminer
    toutes nos pensées dans les voeux et les prieres à Dieu, qu''il vueille benir ce voyage
    de l''un et l''autre succes que V.A. s''en propose. Le Roy de la Grande Bretaigne qui est
    icy depuis quelques jours, m''en parle tout de mesme, avec des expressions fort vives de
    son affection pour V.A. et pour la prosperité de la Maison de Brandenbourg. C''est un Prince
    plein de generosité et de toute autre belle qualité requise en une personne de sa condition,
    et la douceur de sa conversation seulement oblige tout le monde à l''aimer. Il m''honore
    en particulier d''une bonté dont je me reconnois tres indigne, parle fort sagement sur le
    subject de nos brouïlleries passées, dit les avoir tousjours detestées et travaillé à les
    faire cesser; que c''a esté tres-mal faict à des personnes interessées de les susciter dans
    la Maison et sans subject, en avouänt pleinement ce que je luy ay representé, que le Prince
    demeurant orphelin du costé paternel, debvoit estre pourveu de tuteurs de celuy là mesme
    d''où provient tout le bien, et qu''il n''y avoit rien de si aisé que d''ajuster cela entre
    V.A. et la Princesse Royale, dont les interests sont debrouïllez de part et d''autre, chascune
    estant assignée pour son douaire, et ne restant plus que le soin du pupille. Il tesmoigne
    enfin d''avoir apprins de sa soeur aveq beaucoup de satisfaction que l''on s''est entendu,
    continuant tousjours de dire, que cela eust esté facile, sans faire deschirer la Maison
    par advocats et procureurs, qui a esté chose honteuse et n''a servi que de matiere de contentement
    à ceux qui se resjouïssent de la voir par terre. Quand je luy ay dit que nous avons besoin
    de son authorité, pour faire durer la bonne intelligence dont les fondemens sont posez,
    il m''a asseuré qu''il y tiendra tousjours la main en telle sorte qu''on remarquera que
    c''est tout de bon qu''il l''entend ainsi. C''est grand domage que V.A. n''a occasion de
    s''aboucher aveq ce Prince; elle en demeureroît extremement satisfaicte, et il le seroit
    autant de son costé. Je voy que son intention est bien de passer en Escosse, mais comme
    l''on sçait que ses adversaires le guettent vers tous les ports de la coste, il sera bien
    necessaire d''attendre que la saison plus avancée et la mer plus rude les en fasse desloger.
    Cependant il ne manque pas de gens qui aimeroient mieux de vivotter aveq luy dans les ayses,
    et dans la subsistence des pensions qu''ils luy mangent; mais j''espere qu''ils ne seront
    point escouttez. Icy il passe le temps en d''assez bonnes compagnies qui s''y trouvent,
    et la dance n''y manque pas, ce Prince s''en acquittant de meilleure grace que qui que ce
    soit, comme il a l''oreille toute bonne, entend et affectionne la musique de passion, de
    mesme que le feu Roy son pere. La Princesse se trouve reglement à la fontaine au bois, où
    il y a plus grande presse que jamais, nonobstant les incommoditez de tant de pluyes, qui
    nous rabattent beaucoup de la bonté des eaux. Je m''y lave la rate comme les autres, esperant
    d''en recueïllir quelqu'' allegement, et puisque j''y suis engagé, me dispose à parachever
    comme il faut, pour apres faire ce à quoy je suis deputé aux terres de S.A. en Luxembourg,
    qui ne sont qu''à peu de journées d''icy, et ont besoing d''estre un peu examinées de près.
    En suitte de mes ordres je doibs passer de là à Moers, oû peut estre je pourray rendre quelque
    bon service. Tout ce que je regrette là dedans, c''est qu''à mon compte le commencement
    du voyage de V.A. doibt prevenir la fin du mien. Ce que je la supplie de n''attribuer point
    à la consideration de mes interests, qu''en tant que je souhaitterois recevoir l''honneur
    de ses commandemens et benedictions sur moy et ma famille à son depart, et luy tesmoigner
    de bouche avec combien de zele et d''affection je poursuivray le succes de ses desseins
    en quelque part qu''elle aille; quand mesme elle pourroit avoir trouvé dans son coeur de
    m''exposer aveq mon fils, ensemble aveq le president Dedel, en raillerie et passetemps à
    ceux que V.A. sçait s''y attendre de bon coeur. J''ose toutefois repeter icy, que je ne
    sçaurois apprehender ceste disgrace de la bonté de V.A. tant qu''il luy plaira de tourner
    la veuë, non pas sur mes services, qui ne meritent pas son souvenir, mais sur les asseurances
    qu''elle m''a tant reïterées de sa bonne volonté aux occasions qui pourroyent survenir.
    Car, pour tout dire, cela concerne V.A., et de si près, que voyant ceste affaire tirée en
    longueur, j''ay souvent souhaitté n''avoír point donné à parler au monde en l''entamant;
    les meilleurs serviteurs de V.A. et mes amis jugeans, qu''elle ne debvoit point estre comprise
    dans le rang des affaires fascheuses que V.A. a eu raison d''esloigner de son lict d''infirmité.
    Je ne sçaurois empescher les gens de discourrir; suffit que ma conscience me tesmoigne que
    là oû il y est allé du service de V.A., je n''ay jamais rien trouvé de fascheux; et c''est
    veritablement la disposition que je pretens garder jusques au bout. V.A. me fasse la grace
    de s''en tenir tres asseurée, et que jamais je ne cesseray de prier Dieu pour la grandeur
    et prosperité de sa precieuse personne et de ceux qui ont l''honneur de luy appartenir.

    Spa, 3e Aoust 1654.'
