  tekst: 'Hierbij gaat iets uit de contradeductie der Staten van Holland; men kan het nauwelijks
    gelooven. Er staat o.a. op folio 53, dat de Prinsen van Oranje wel 20 millioen gulden genoten
    hebben van dezen staat. De Witt heeft de predikanten Trigland, Streso en Technaeus op het
    avondeten genoodigd en hun toen een exemplaar van dat stuk geschonken ..... ‘La lettre de
    Beauregard requiert qu''on ne demeure oisif a faire cognoistre les causes et raisons de
    ce changement selon les plaintes qu''on a faites contre luy, comme vous scavez. J''ay peur
    que le cardinal Bichi ne se mesle de cest affaire et quelques autres. M. le gouverneur est
    parti pour Orange sans avoir rien fait pour M. vostre fils, a ce que je puis entendre, dont
    neantmoins il a este requis et avoit donne quelque esperance..... On ne peut parler a Son
    Altesse Madame a cause de son indisposition, ce dit on. Cependant elle a derechef parle
    au pensionaire de Witte assez longtemps, mais je ne scay sur quel subject. Pour Madame de
    Dona, elle donne de bonnes paroles, mais je ne voy pas encore aucun effect, ce qui me fait
    croire qu''il y a du mystere en ce fait de la charge de Geertrudenberg. M. vostre fils m''avoit
    dit qu''il requerroit M. le president a redoubler sa poursuitte. Mais je ne scay s''il l''a
    fait et quelle response on lui peut avoir donne’ .....

    A la Haye, ce 11 d''Aoust 1654.'
- verzender: David le Leu de Wilhem (1588-1658)
  ontvanger: Constantijn Huygens sr.
  datum: 14-08-1654
  plaats_verzender: Den Haag
