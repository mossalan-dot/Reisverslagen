beschrijving: Verslag van een reis van Constantijn Huygens sr. naar de landerijen van de Oranjes
  in 1654. Huygens inspecteerde de heerlijkheden Eindhoven en Cranendonck en bezocht Maastricht,
  Luik, Aken en Spa. Hij inspecteerde de domeinen in Luxemburg en reisde ten slotte naar Moers.
brieven:
- verzender: Constantijn Huygens sr.
  ontvanger: Amalia van Solms-Braunfels (1602-1675)
  datum: 03-08-1654
  plaats_verzender: Spa
