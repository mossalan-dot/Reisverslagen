  tekst: 'Gaarne wil ik een paspoort van u hebben, om langs de Moezel en den Rhijn naar Holland
    terug te keeren.

    Vianden, 28 Aoust 1654.'
- verzender: Constantijn Huygens sr.
  ontvanger: Marguérite Claire van Noyelles
