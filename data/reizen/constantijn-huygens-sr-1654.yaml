  tekst: '‘J''ay tardé de respondre a la vostre du 28 du passé pour obtenir quelque esclaircissement
    sur l''affaire de M. vostre fils. Mais voyant qu''on le differe de temps en temps sur l''indisposition
    de S.A. Madame, je suis oblige de vous dire librement que je crois que cest affaire souffrira
    quelque difficulte d''estre bientost resolue a vostre satisfaction. C''est une fille a marier,
    dont le mariage se fera par raison d''estat peut estre. Il y a du mystere en cest affaire;
    le gouverneur d''Orange est sur son depart; il n''attend que le retour de Busero, lequel
    est alle en Zelande avec M. de Knuyt des le 26 du passé. Je tascheray d''en tirer quelque
    lumiere a sa venue devant la partense du conte. Je fis devant hier l''honneur de vostre
    maison a la semonce de M. Swaen, qui vint chez moi pour cercher ma femme et l''amener aupres
    de la sienne, laquelle estoit en vostre maison. Ma compagne estant alle a la metairie de
    nostre frere Doublet, il m''a prie de m''y transporter. Ce que je fis, accompagne de M.
    le resident Carisius, apres avoir este querir la femme dudit resident, le tout a la requisition
    dudit M. Swaen, lequel dit en sousriant que nous trouverions la des bons amis qui nous attendoient.
    Y estant arrive nous trouvasmes la la Royne de Boheme et la Princesse Louise et force autre
    monde. La Royne - qui avoit fait esloigner ses carosses - s''escria tout hault a nostre
    venue: Je vous ay bien trompe. Mais c''est pour vous faire entendre M. Swaen, mon fidler,
    qui jouera de l''espinette et chantera de sa belle voix. Elle s''enquist de vostre sante
    et partist joyeusement apres avoir entendu et honnore de sa presence son fidler. - Pour
    des nouvelles nous n''avons autre chose sinon que la Royne de Suede est parti de Hamburg
    et a licentie son train, ou bien fait retirer en quelque lieu par ordre secret, s''en estant
    escarte a l''improviste de nuict, elle troisieme sans qu''on scache ou elle est allee. Il
    ne se parle ici que de ses actions extravagantes desquelles je ne vous feray point le recit,
    croyant que M. vostre fils vous en aye entretenu par ses lettres abondamment. Mais je vous
    dis par relation de M. le resident Carisius que la Royne de Dennemarck s''est desguisee
    en chambriere et a fait semblant de servir en l''hostellerie a Hadersleben où la Royne de
    Suede logeoit, et a par ce moyen este tesmoin oculair par l''espace de trois ou quatre heures
    des propos que la Royne de Suede tenoit et de ce qu''elle faisoit. Comme elle avoit entendu
    que ladite Reyne s''estoit desguise en homme, lorsqu''elle a passee par le Denemarc, elle
    a voulu avoir ce plaisir d''estre spectatrice de ses deportemens. - On m''a parle d''une
    liste qu''on monstre en cachette contenant les noms de ceux qu''on sera oblige de chasser
    d''ici comme rebelles et perturbateurs de la tranquillite publique. Mais je tiens que quelque
    esprit turbulant l''aye dresse a plaisir pour aigrir les matieres. On fait neantmoins quelque
    recerche pour cognoistre ceux qui pourroient avoir veu et leu la liste. Cela fait acroire
    qu''il y pourroit avoir matiere de soubcon, nommement pour les Anglois, puisqu''il y a desja
    longtemps qu''on en parle et que c''est leur coustume de faire courre le bruict des choses
    qu''ils veulent arrester, comme pour sonder les esprits et scavoir ce qu''on y puisse trouver
    a redire. C''est leur politique.’ - Te Amsterdam is de Deductie van Zeeland gedrukt; de
    Staten van Holland geven eene Contradeductie, waarin zij de daden van den overleden Prins
    van Oranje zeer afkeuren. Ook de Knuijt wordt er in aangevallen. Het stuk zal spoedig gedrukt
    worden. ‘Je vous prie de ne me faire autheur d''aucun advis odieux. Car on va introduire
    une inquisition et je ne scay ce que nous deviendrons a la fin. Sullaturiunt. Il faut bien
    prendre garde a ce qu''on dit et fait en ce temps auquel la malignite a tant de part. -
    Les pieces cy jointes vous informeront du voyage de la Reyne de Suede, auxquelles je n''ay
    rien a adjouster, sinon que j''entens qu''elle a donne, a ce qu''on dit, 30 m[ille] r[ycxdalers]
    a M. le conte de Dona, en papier comme je croye, et deux attelages de chevaux et une pension
    de trois mille r[ycxdalers] par an jusques a ce qu''une baronie luy soit donnee de beaucoup
    de revenu, laquelle sera bientost vaquante. On ne parle que de sa generosite et liberalite.
    S''il est vray ce qu''on dit, sa liberalite sera bientost tarie. - Je vien de recevoir vostre
    lettre du dernier du passe et suis bien aise d''entendre que M. de H. aye change de dessein.
    Il a de bons retours pourveu qu''ils durent. Je communiqueray demain vostre lettre a Messieurs
    du Conseil, je dis la lettre de M. Tassin touchant la vente de Chasteau Renard. Dieu veuille
    qu''elle reussisse. Car nous avons besoing d''argent. M. Rotting est alle a Breda pour toucher
    l''argent des adjects[?] et destourber - van de moeren - et nous n''avons pas encore paye
    la moytie entiere des debtes de l''annee cinquante, dont quelques creanciers murmurent grandement,
    se voyans postposes et a leur jugement frustrez et deceus en leur dessein. Je les plains
    bien et que je ne les puis soulager. Mais moins mal, si cela va a la longue et que nous
    ne nous entremissions par telles discontinuations et delais. M. Tulp, burgmaistre d''Amsterdam,
    m''a parle et declare qu''ils ont ordre de s''addresser au Conseil pour nous ramentevoir
    le deu de nostre charge a nous acquitter de la promesse faite. J''ay reitere l''ancienne
    responce qu''on leur donnera satisfaction a son temps du premier terme. Mais je suis sur
    ce subject transporte de douleur, et ne vous en diray point davantage .....

    A la Haye, ce 3 d''Aoust 1654.'
- verzender: David le Leu de Wilhem (1588-1658)
  ontvanger: Constantijn Huygens sr.
  datum: 11-08-1654
