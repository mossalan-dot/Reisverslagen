  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: '‘Je suis oblige de respondre a la vostre du 21, non comme je vouldrois, mais comme
    je puis, a cause du depart de mes amis d''Amsterdam, et qu''il nous fault assembler de meilleure
    heure pour mettre fin a plusieurs affaires commandez par Son Altesse Madame. Elle partira
    vendredi, a ce qu''elle dit, et j''estime qu''on la laissera partir sans luy donner aucune
    satisfaction sur la demande qu''elle a faite de bouche par M. le pensionnaire de Wit, pour
    avoir les 20 m[ille] francs, ayant prise l''occasion a propos de son depart, pour avoir
    de quoi faire la depense du voyage. Ledit pensionnaire aura donne belle esperance, comme
    par ci devant, sur le temperament d''Angleterre qu''on empescheroit l''extradition. Je vous
    laisse les consequences des demandes et du refus. Au reste il y de la fatalité en ses desseins;
    elle n''est pas entierement remise et cependant veut faire ce voyage. Elle scavoit le procedé
    et l''inclination de ceux d''Hollande contre la Maison, et ce neantmoins fait ces belles
    demandes, et se laisse amadouer par belles paroles. Voila pour le public. Pour ses actions
    particulieres comme tutrice de nostre Maistre, vous en pouvez juger par la piece qu''on
    vous a faite. Nous ne luy parlons d''aucun affaire. Mais Mess.rs Widman et Copes viennent
    de sa part a faire force propositions touchant le mesnage et les moyens de contenter les
    creanciers et autres pretendans pour la pluspart desquels nous flottons encore entre les
    vagues d''incertitude. M. Knuijt n''a peû vendre les parties de Martensdyck, Scherpeniss,
    etc. Nous serons contraints peut estre de passer par ses mains. Comme les seuls susnommez
    parlent avec S.A. Madame, vous pouvez de la juger a peu pres quel pli prendront les affaires.
    Qui signera les actes de grace et autres pieces des choses qui ne souffrent aucun delay,
    nous le scaurons aujourdhui ou demain. A Noel le magistrat de la Vere sera creé; il faut
    scavoir qui le fera et ainsi de plusieurs autres. Il me fasche de vous decouvrir ces confusions.
    Vous scavez avec combien de peine en sa presence ces affaires ont este manies et ce que
    pourront causer les desfaveurs en son absence. Et je ne scay, si lesdites affaires ne requierent
    quelque changement. A ellos. J''estime qu''il est du service du Prince que les choses demeurent
    en l''estat, qu''elle les laisse, si cela se peut. Pour le proces de Bruxelles nous ferons
    autant que nous pourrons pour recommander l''expedition favorable, d''iceux je ne voy pas
    qu''on aye grand envie d''y aller. - Le Lantgrave Fritz a este envoye du Roy de Suede pour
    persuader la Royne de retourner au pays sans vagabonder de la facon a l''opprobre de sa
    nation.’ Zij heeft overal schulden gemaakt. En wij weten er alles van, wat dat wil zeggen.

    A la Haye, ce 25 d''Aoust 1654.'
- verzender: Constantijn Huygens sr.
  ontvanger: De Marolles
