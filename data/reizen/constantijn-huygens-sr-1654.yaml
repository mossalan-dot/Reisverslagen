  tekst: 'In Mosellam


    Nihil Mosellâ floret elegantius;

     

    Quocumque vultum flexeris, pleni deo

     

    Montes loquuntur succulentum gaudium.

     

    Hilares, Amici, transigamus hos dies;

    5

    Utrimque nauigatur inter pocula.

     

    Ib. infra Zellam.'
