  tekst: 'Uit de zaken van Oranje is moeilijk wijs te worden; veel houdt men voor ons verborgen.
    ‘Nous avons receu lettres de M. Boreel, l''ambassadeur, qui nous envoye ce que M.e de Chastillon
    luy escrit touchant Chasteau Renard, a laquelle terre elle est persuadee que peu de personnes
    peuvent pretendre a son prejudice, parce que son fils a droit de la retirer de qui que ce
    soit, estant sorti de sa maison, le priant de luy vouloir estre favorable en cest affaire.
    M. Tassin nous avoit promis que nous aurions la conclusion de sa negotiation par cest ordinaire.
    Mais je m''imagine que l''affaire est acroché’. ..... ‘Cleobuline’ is te Antwerpen; zij
    heeft de juffrouwen Duarte hooren zingen en vond het mooier dan la Barre ..... Men heeft
    de garde samengesmolten met vier andere compagnieën; de soldaten en officieren zijn er erg
    boos over. Parcheval is er nu kapitein over en scheldt voortdurend op het Huis van Oranje.
    Men zegt, dat de man van Sibylle de betrekking in quaestie heeft gekregen .....

    A la Haye, ce 14 d''Aoust 1654.'
- verzender: David le Leu de Wilhem (1588-1658)
  ontvanger: Constantijn Huygens sr.
  datum: 18-08-1654
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Spa
  land_ontvanger: ZN
  relatie: schoonbroer-schoonbroer
  taal: Frans en Nederlands
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Uw zoon heeft dus de betrekking niet gekregen. Men vertelt, dat de Koning van Groot
    Brittannië zich eenigen tijd in Meurs zal ophouden, maar dat zou tegen het verdrag met Cromwell
    zijn, want in Meurs liggen troepen van de Staten in garnizoen. Het zou dus de zaak van onzen
    Meester zeer benadeelen. De Koning kan immers naar Aken gaan, waar de Prinses Royale ook
    is. In Schotland ziet het er voor hem niet gunstig uit. - ‘Samedi dernier Messieurs les
    Gecommitteerde Raden ont fait querir la clef de la gallerie par ou S.A. passe pour entrer
    au jardin, et en firent quatre clefs pour les quatre capitaines qui font à cest heur le
    corps de garde, afin de se tenir la pour veiller a la seurete publique. Men sal daer de
    groote cour de garde - de ces braves gens - houden. Men seyt van de Mennisten, dat, alsser
    iemant in haer vergaederinge is, die se ongern aldaer sien, dat se denselven niet slaen
    oft stooten, maer sy beginnen elckanderen te dringen, en dringen also, dat den gehaeten
    door het dringen gedwongen wordt al wijckende uyt te gaen, wilt hij rust hebben. Sic protendunt
    libertatis et imperii terminos. Je ne me promets rien de bon de ces innovations si frequentes
    au desavantage des interests de la Maison’ .....

    A la Haye, ce 18 d''Aoust 1654.'
- verzender: David le Leu de Wilhem (1588-1658)
  ontvanger: Constantijn Huygens sr.
  datum: 25-08-1654
  plaats_verzender: Den Haag
