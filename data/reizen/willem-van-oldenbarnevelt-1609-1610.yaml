beschrijving: Vervolgde zonder zijn broer zijn reis naar Italië in 1609 en 1610, onder begeleiding
  van zijn zwager Cornelis van der Mijle (1579-1642), gezant te Venetië. Studeerde in Padua
  en Siena en keerde terug via Frankrijk en Engeland, waar hij in 1611 door Jacobus I (1566-1625)
  werd geridderd.
