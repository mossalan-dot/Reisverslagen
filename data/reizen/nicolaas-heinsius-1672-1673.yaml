beschrijving: Reisde als diplomaat in 1669 en 1670 naar Moskou en in 1672-1673 naar Oostfriesland
  en Bremen.
brieven:
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 27-08-1672
  plaats_verzender: Paderborn
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/ddbe177a-afc0-4e58-bec5-570056d8572c?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=28&type=advanced&numFound=59
  opmerking: Having completed his business in E. Frisia, Bremen and Minden, he paid a visit
    to our Prince armed with G's. observations on Suetonius, which as he had confidently hoped
    were very gladly accepted by the Prince, who will certainly be writing his thanks to G.
    He is taking the waters here which will keep him till the end of the month. He advises him
    to write again to Chapelain as G's. letter clearly had not reached him. He refers to Gronovius'
    recent edition of Tacitus, and explains his own emendation of a passage in the Annals book
    6 which he quotes.
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 23-09-1672
  plaats_verzender: Scholl Neuhaus
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/ddbe177a-afc0-4e58-bec5-570056d8572c?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=28&type=advanced&numFound=59
  opmerking: The noble Prince is delighted with G's. Suetonius which H. has handed to him and
    pleased with the no mean tribute to his name which heads G's. dedication. But the two copies
    which G. had written to say were on the way have not yet made their appearance here. His
    return will have to be deferred till the continuous passage of the Imperial and Brandenburg
    soldiery through the Paderborn diocese is finished, and the medicated waters have had effect
    an his legs. He is eagerly awaiting a letter from G. and ones from Elsevir, and he asserts
    G. has no cause to fear they will not get through.
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 28-10-1672
  plaats_verzender: Frankfurt am Main
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/ddbe177a-afc0-4e58-bec5-570056d8572c?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=28&type=advanced&numFound=59
  opmerking: He reassures him that he will not be let down financially. He proceeds to round
    and about discussion of textual reading with an incidental hit at Frankfurt booksellers
    for their jejune assortment of classics.
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 10-12-1672
  plaats_verzender: Mainz
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/60bc4642-d7b9-49ee-b1a3-3ebb087d9f58?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=30&type=advanced&numFound=59
  opmerking: He begins with lengthily argued advice offered to console G's. troubled mind not
    to commit himself at present to acceptance of the Elector's invitation to succeed to Ludovic
    Fabricius' chair at Heidelburg University. The rest of this immense letter is a pot pourri
    including points about money concerns and French barbarity in destruction of a bridge; but
    mainly scholastic concerns, e.g., Vorstius is author of the index to Nepos. At Frankfurt
    Bocclerus had promised to help him to excerpts from the codex of Virgil's Catalects; discovery
    of rare codices of (Virgil's) Culex; and notes on a passage from another poem ("Cirus")
    on which he differs from Scaliger's version and Barthius' and Reinesius' conjectural reading
    of a passage. H. expatiates with minute erudition, finding objection to many points of the
    phraseology.
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 07-01-1673
  plaats_verzender: Wiesbaden
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/bb0525d6-a9f8-4893-8fa7-f4fc9e5b8ee3?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=31&type=advanced&numFound=59
  opmerking: A letter of very great length and multiple detail. He begins with rejoicing that
    G. has taken his advice in good part, and assures him that communications shall be quick
    off the mark henceforth; but he describes perplexing hitches in getting things through which
    Spanheim had undertaken. He had saluted the Elector of Heidelberg, but did not accompany
    him to Mannheim. Ludovic Fabricius had signified the notion of inviting G. to Heidelberg,
    but financially G. was better off remaining at Utrecht. He hopes to be able to return home,
    subject to recovery of his feet in the thermal baths. No worthwhile codices in libraries
    of Germany except one at Spier, which strange to say, Gruterus in his edition of so many
    ancient authors had missed. He has found few men of learning in these parts. It would not
    have been safe to travel to Fulda; he had heard that no ancient books survived at the abbey
    there. He had had a cold reply to his enquiry from Erfurt about the codices of Cicero. The
    last part of the letter is a morass of scholastic material and verbal alternatives, e.g.,
    "corruptor" or "correptor"? and in penetralibus caligenis, "coliginis" or "Trojugenis".
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 31-01-1673
  plaats_verzender: Keulen
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/83bb6c4b-9d9e-437f-b198-f886596ba5f9?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=32&type=advanced&numFound=59
  tekst: Complications about payments. He had intended to make over to him the parcel containing
    the money assigned to G. by the "Princeps Celsissimus", but there occur complications on
    top of that. Exhausted by his travels and dubious health he is staying here and intends
    to investigate libraries and would like G. to procure for him at his own cost any MSS. codices
    on sale, and to know of scholars at Antwerp from G. He fears some important work has gone
    astray. Vorstius's Valerius Maximus which he had designed to give G. and the sources on
    which he has observations had been left behind at Mainz. He refers to Reinesius' inscriptions
    in the possession of Queen Christina, and he asserts his desire for the publication of these
    and all the others of Reinesius' hitherto unprinted writings.
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 03-02-1673
  plaats_verzender: Keulen
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/136f3c3c-f837-4681-8038-dafd4bcc6867?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=33&type=advanced&numFound=59
  opmerking: Consists almost entirely of variants in and emendations of texts of passages in
    Virgil's Cirus and in various quoted passages of Tacitus. He surveys textual tit bits through
    a microscope; emendation seems his life's mission. There are other odds and ends thrown
    in, e.g., he presumes that the communications entrusted to Spanheim for G. have reached
    him.
- verzender: Nicolaas Heinsius
  ontvanger: Johann Georg Greffe (1631-1703)
  datum: 24-02-1673
  plaats_verzender: Keulen
  land_verzender: D
  relatie: geleerde-geleerde
  taal: Latijn
  link: http://emlo.bodleian.ox.ac.uk/profile/work/d3f3c117-2c64-4c68-8d81-151376ab57b3?sort=date-a&rows=50&dat_to_year=1673&people=Heinsius,%20Nicolaas,%201620-1681&dat_from_year=1669&baseurl=/forms/advanced&start=34&type=advanced&numFound=59
  opmerking: He writes in depression. The "Princeps" is being so sponged upon that he cannot
    fend for himself, let alone give his friends largesse, and can think only of his own calamity.
    He describes the lack of MSS. for sale, the disappointing state of the Laurentian library
    which contains important codices, the refusal of access to the Cathedral library; the handicap
    of the cold weather. He is however resigned to ill fortune. He has not taken advantage of
    the King's munificence, feeling that he must {clear} off the litigation in claim of his
    patrimony. He expatiates on his adversities in self pity. [ [Rather baffling Latin]. ] He
    mentions having sent Duke Montoserius a letter and copy of an elegy. He touches on the news
    to the effect that French successes have been overrated, that Turenne refused to confront
    the Imperial and Brandenburg army. The French troops he met on the way from Mainz were a
    sorry rabble shivering with cold. He has been attracted by reports of many very ancient
    codices lying hidden at Worms Cathedral and at Spier.
