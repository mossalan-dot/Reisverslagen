beschrijving: Maakte tussen 1627 en 1628 een educatiereis naar Frankrijk en Italië. Studeerde
  rechten in Orléans in 1626-1627 en bezocht de paardrijschool in Angers in 1627. Overleed in
  1628 na een duel in Rome met Volkert Teding van Berkhout (1601-32). Een grafmonument werd
  geplaatst in de Santa Maria dell’Anima.
