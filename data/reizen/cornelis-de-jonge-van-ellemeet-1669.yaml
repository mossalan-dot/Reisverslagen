beschrijving: Verslag van een plezierreisje van Cornelis de Jonge van Ellemeet naar Antwerpen
  en Brussel in 1669 in het gezelschap van zijn moeder Margaretha Briel (1617-1685), zijn zussen
  Johanna (1643-1694) en Cecilia (1645-1686), familievriend Agatha de Jong en haar kinderen.
  De Jonge van Ellemeet reisde per boot van Brielle naar Antwerpen en Brussel en keerde terug
  via Zierikzee.
