  bron: FA Huydecoper 68
  tekst: 'Monsieur mon Pere


    Vous aves comme l’espere, receu per la meme du 20 janvier les nouvelles, que vou m’avez
    en vou per la vostre du 2 janvier. Tellement que je crois que Amsterdam a plustost part
    du plusiurs choses qui ce passent en france, (le nostre ville de Saumur. A present on trent
    que S. Germeijn en aschese de 60000 hommes, q’on a refuse sauf conduit a monsieur le cardinal
    et qu’il ce sovera comme il pourra, et comme ceste armé a le desseijn de remmener le Roij
    en Paris, elle a faict faire pour ce suject un chariot de triuphe. Nostre hiver a commcanse
    le 1. fevrier et continué ave tant de riguer. 3 colemaries des suite qui on passoiut la
    riviere per tout, a cheval, et en arosse. Monsieur le mareschal de Brese arrivoit le 4 de
    le mois en ceste ville, accompagne de la noblesse, et les estrangers ‘dici, entre le quelles
    l’estoit aucij, monte sur mon spagnol a present a monsieur le baron le CHACE. Pour la somme
    de 80 pistoles, je lui aij vendu aucij le frison, pour la sommeide 30 frestol, estant contreijn
    de le quitter pius qui il ne vouloit pas l’un sans l’autre Tellement s’il y avoit le moun
    de aller en Italie, et de m’envoier 2 chevaux per Nantes. Je suis assez assure que aprez
    les avoir vendu, le voiage d’Italie, ne vous cousteroit 1000 francs. Pour la quesse de Geneve
    voila la lettre de monsieur Florencij, que vous domera assurance, de la vente de ceste affaires,
    et aucij la copie de ce query envoie. J’ay tire au mois de fevrier 196 francs, ce que je
    vous eusse fait sçavoir si on eut eu la commodite d’escrire, iesfrere que celle ci vous
    sera rendu juris 1ue ceste nouvelles, pour ont estre avantagieuse pour l’amour, et desire
    que je porte pour voiager en Italie, cependant je demeure vostre fils etc. IHVM


    SAVMVR XXII maert ACIDIDCXLIX'
