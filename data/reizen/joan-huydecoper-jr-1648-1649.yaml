  relatie: broer-zus
  taal: Nederlands
  bron: FA Huydecoper 68
  tekst: 'Beminde suster LEONOOR


    Soude Ue eerder geschreven hebben maer naedemal de groote troeblen, de gemene cours van
    de pas beletten, hebbe sulcks niet kinnins bij brengen; de affectie niettemin en de nootsaeckelijckheijt
    waer in ick mijn selven op het onversient in verwand vindt hebben mijn deselven aen UE doen
    adresseren. Nademal dan ick seer groote begeerte heb gehadt om naer Italien te gaen en soo
    het scheen, een vaste hoop uijt soo veel brieven van mijn vaeder genomen hadde. Ben van
    deselve tenaemel verstooten geworden, door ordre van mijn vaeder, in seekeren brief onlangs
    behandicht geloove niet of ue intereedeneren sal veel  te weeg kunnen brengen en lichtelijck
    hem detourneren tot de vorige permissie. Ue beloovende soo sulcks succedeere, een oorlogie
    te sullen senden van 100 gulden blijve ondertussen Ue onderdaenige Broeder IHVM


    SAVMVR 11 Mart'
- verzender: Joan Huydecoper jr.
  ontvanger: Leonora Huydecoper (1631-1663)
  datum: 26-03-1649
  plaats_verzender: Saumur
  land_verzender: FR
  relatie: zus-broer
  taal: Nederlands
  bron: FA Huydecoper 68
  tekst: 'Waerde suster


    De absentie van Ue. valt mijn soo hande, datse mijn continueel doet dencken, om Ue op het
    selve subijet te onderhouden. Naedemael daer in want is van die Ue kennis, die sig meer
    door Ue. verobligeert vinden, en consequentelijck soo door hoi een, als door het ander meer
    inter esse lijden bij Ue. persoon als ick. Dit van ons synde gelove met of Ue. rsteert noch
    enig recentiment aende gernstigheijt om mijneige dachten, ende naedemael die nootsaeckelijckhet
    van Ue. affaires, die Ue. verobligeren, lichtelijck enig uijtstel soude kunnen lyden, versoecke
    ick Ue. de gepanste buijck eens op te willen setten en te sien of vaeder met en is te detourneren
    vant geen ick de man heb geschreven. Dit doende sult mijn meerdrens doen, als iemant als
    synde met meerderpassie Ue. Broeder IHVM.


    SAVMVR XVI maert CIDIDCXLIX'
- verzender: Joan Huydecoper jr.
  ontvanger: Vandesande
  datum: 17-04-1649
  plaats_verzender: Saumur
  land_verzender: FR
  taal: Nederlands
  bron: FA Huydecoper 68
  tekst: 'Monsieur Vandesande


    Den oorlog die Ue soo wel als mij beproeft heeft sig door de leste quartieren verspeijt
    hebbende, heeft een generael inconvenient geweest, om de goede correspondentie te continueren,
    soo dat de passagie liber sijnde gelijck te voren de vrijheyt gebruyk, Ue met dese te incommoderen,
    versoeckende soo daer iets voor mijn bij Ue resteert met den eersten mijn te doen gewanden.
    Duncke niet nodig te verhalen het debordi dat dese rivier in december gedaen heeft, noch
    den grooten winter, als synde dingen die generael door heel Vranckrijck geweest sijn. Monsieur
    le mareschal de Brese (hebbende sijn residentie uit hants vande troublen hier gehouden)
    is 3 a 4 daegen verleden vertrockken, sijnde gefacieert tegens die van Angiers daermen segt
    4000 man naer toe te komen, hebbe mijne paerden verkoft aen den baron de Chace voor 80 den
    spaniaerts en den vries voor 30 pistolen gelove deselve wel verkoft te sijn, verwacht hier
    alle daeg ordre of om naer Hollandt of naer Italien te gaen dog altijt in qualiteijt van
    Ue monsieur IHVM


    SAVMVR XVII April A CIDIDCXLIX'
