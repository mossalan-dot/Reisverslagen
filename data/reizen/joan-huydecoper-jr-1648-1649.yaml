  bron: FA Huydecoper 68
  tekst: 'Anno CIDIDCXLIX SALMVRY


    Monsieur mon pere


    Aient reicu la vostre du XXVII decembre et veu les mescontentements et couleres conceu contre
    moij mont reduit en desezpaijr de vous contenter iamais, veu qu’ils sont tires des sompsont
    moins avantaguises pour moij. En fin comme ie suis negligent pour escrire et frequente la
    companie des vagabonts, comme mes letters sont escrits en movaises termes. Auci que ie ne
    vous aij faict savoir mes exercises. Vous savez monsieur mon pere que ie n’aij iamais manque
    a vous respondre et aicij a vous faire savoir ce qui passou le plus noveau en france. Ie
    ne suis pas aucij culpable de paresse quand on m’envoie de Paris 3 de vos lettres dans un
    mesme paquet entre les quelles il ij avoit une date depuis 2 mois. Pour la companie ie frequente
    le fils de monsieur Diodati de Geneven gouverneur de 3 freres gentilshommes francoises et
    de messieurs de cette ville. Auci ceucx de nostre paij dont nous avons ici quantite aschavoir
    monsieur Donselaer d’Amsterdam, Barck et sons cousijn d’Vtrecht, monsieur Vandervliet de
    La Haije, monsieur Vanderscheur fils de celui la ches qui i’aij demeure. Driewegen et son
    frere Rosiers de Selande. Ravenswaij cosijn de feu General van diemes, Schrijver d’Amsterdam.
    Blaulacc ses d’Hoorn et monsieur freres d’Vtrecht. Mon cosij Schaep est partij d’icij le
    V de ce mois pour la ville de Blois. Sores donc assure que ie fais tout mon possible pour
    vois obeir et escrire en bonnes termes. Mais comme presque vos lettres sont ramsili des
    reprimendes, ne faut il pas que ie me defens le plus qui m’est possible me sachant que respondre,
    quand on [2] me reproche si souvem les temps passe et chose que ie crovois desta estre assoupir
    et qu’en faisaint mon possible pour vous obeir et donner toutes les sorter de contentements,
    ie me trouve nonobesant reduit dans des extremistes estranges, pour obtenir ce que ne souchaijte
    les plus. Ie vous aij fait savoir souvente fois, commant ie passois mon temps, comme ie
    avois un maismede langue, de la guiterre et de danse. Des quelles ie n’aij pomu a present
    croiem pantir d’icij. Mais aient entendu par la derniere le miscontentement que vous aviez
    de la nouvelle de mon desseijn pour Orleans, ie mestme extrement henneus, de n’estre pas
    encore parti, ce que ie ne feraij sans vos ordres et commandements demeure me encor ches
    monsieur Chaumont Bour iois de la ponte deila Bilange en qualite de vostre fils IHVM'
