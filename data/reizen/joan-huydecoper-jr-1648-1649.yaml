  relatie: zoon-vader
  taal: Latijn
  bron: FA Huydecoper 68
  tekst: 'Reverende Pater


    Quoniam ex posteriori tua, ilud quod priorita contriebatur, confirmatum inveni, relicta
    nempe Italia, Hollandiam mistante estate petendam mihi atque in his nesmea quam niax nine
    agatur operae puelium duxi de eo paneis tibi inquietari. Quod ne quidem ausus fuissem, nisi
    totreris ultro, et sponte tuis, tam benigne, huius res servior, et securus factus fuissens,
    neve hanc meam expostu latrionem non sine ratione, fir missivinis que fondamentis nixam
    considerassem.  Amicus et 1/2 est ex quo patriam egressesus in Galliam oberravis existimans
    iam satis modestiam, ac frugaluatens meam ex pertam te habere, atque soelmis illud obedientia
    cuius strimulas semper agitat vis, numquam a mandato tuo discessi, summio in luero atque
    felicitate ponens, si forte aliquain ne tibi gratificari possem, ita ut non abeque mendacio
    quisquam male de me loquat vir. Non ennis necesse est, multis de ijs veritatem tibi asserere,
    cuous secundimus proverbium, mentem boni consciam, in pectore reconditam fero, et un nunquemque
    bonum, abstrientiae sobrietatisque mea testem, in contrarium eorum, tibi per suadentimus,
    in diversorijs me delitessere. Atque (cuius hisse in regio mihis nullus usus est) To. baio
    deditum. Cumque egre fers tantum percunia peregrinationibus meis impendis promitto venditis
    meis equis, ablegatoque familo, si ita tibi visum fuerit, dumdia eius parte contentimus
    fore, inde facile colligi, atque elicri posterit non tam desiderio libertatis, atque ut
    pecora di vagandi veditus dilationem peti (te enim ut sivae sentem semper veneor) vermus
    visendi regiorem; omnis terrarrium orbe charans, mio clariorens ob quinquagenarium incidentem
    amissis iubileum. Finitimus itaque ne verende, Pater precor, ut hec omnia bene perpendas,
    in animumque vevoces, quam familiaris oluis avum culis fuerit 3 meos cognatos Duytsios Roma
    degere dominos van Geel quam splendidissime eam peragrasse, uti et etiam tirra, marique
    Balthasarum Coijomaris. Baromus ille Oxensternivis dediq nabatur sueciam petere, mi visa
    latina ditione. QUa quidem felicitate, tua benignitas, me compotem reddere, potenu, tunq
    denius olium et operam in salvo, etropenque dealbatmus fore quod saxu Deus manco insterim
    tuis IHVM


    SAVMVR XIII maert A. CIDIDCXLIX'
- verzender: Joan Huydecoper jr.
  ontvanger: Joan Huydecoper sr. (1599-1661
