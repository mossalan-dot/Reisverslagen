  tekst: 'SAVMVR Le XX Ianuari A. CIDIDXCLIX


    Les plus recentes nouvelles de Paris que le Roij la Raijne son eminence, monsieur le cardinal,
    monsieur le prince, monsieur de la Milneraije et son retire a 4 heures de matin de Paris
    a S. Germeijn. Que le mesme prince i’a batu en duel contre monsieur d’Henrecourt estent
    legerement blessei dans les espaules. Qu’on a ascheic cette villa, demoli 3 moulins a vent
    et que les autres eussent estre prince, sans la sortie des habitans. Qu’on a publie un arrest
    touchaint monsieur le cardinal de ce retirer en 2 mois de la court. Dont estre 2 jours et
    en 8 la France et qui cinq l’aura rancontre de de pius. de ce saisir de sa parsomme. Le
    parlement a prive la raijne du gouverement et l’offens a monsieur d’Orleans, aucij monsieur
    de la Milieraije [3] du tristre de grand maistreude france. Ils ont 50000 hommes en armes
    3000 a cheval et 2000 a pie paient chasque cavalier 4 frances les autrals rosols per iour.
    Monsieur le marechal de grese, gouverneur de ceste ville, et province d’Engou faici demeubler
    sa maison a milie 4 lieus de SAVMVR et apporte les meubles au chateau de cestre villa. On
    lui attant en personne avec son treijn. Aucij monsieur de Savurij et sa familije non habitanssont
    en armes. Aient faire la garde aijourdui our la primiere fois, aient peur voient que toute
    la noblesse, a l’entour d’icij ce leve. Tellement qu’on dresse les canons pertout ne perlant
    que d’une guerre civile.. Nous avons eu le X de mois la Riviere fort violente estent creu
    d’une neu plus de 6 pieds toute la villerempli de lo estant contreint d’aller en bateau
    per les rues 6 piliers du pont furent emportes. En fin le dige ou la leve per ou on va a
    Orleans ,ne ce trouvant asses forte, pour resister la riviere, c’est ne ie quantite des
    maisons importes, hommes enfants bestiaeux noiez. Tellemt qy’on vou partout grane miseres.
    Estimant la parte cose per endebordrement plus que 6 tonnes d’or. On ne vodrour rien que
    une mer pertout nous avons depuis 12 jours eu mi poste, mi lettre tant a cause de cestre
    diluve, que de la guerre civile. Le VII de ce mois mourur icij ceate monsieur trotter anglosis
    d’une maladie ala teste. Mon frison a estre extremementmalade .D’une coligue ventense aient
    estre 7 jours sans manier, en fijn aient estre en peu remis. Per le moien d’une brevage
    qui lui frise dome per un expant marechal il commence a ce porter mieux. Tellement Quil
    es hondu peril. Le spanol est galiande faisant touionns mon delboir de le vendre les plus
    qui sera possible. Mon homme et de venu malade aivondu d’une fierce esperant qu’elle ne
    sera pas de longedure.'
- verzender: Joan Huydecoper jr.
  ontvanger: Joan Huydecoper sr. (1599-1661
