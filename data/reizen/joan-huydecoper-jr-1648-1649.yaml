  tekst: "Reverende Pater,\n\nPostquam Gallia ut expertum habes, bellis civilibus aquaretur,\
    \ idque tanto cum furore, ut plerisque videbatur eam ad periodim omnium malorium pervenisse\
    \ liliaque illa tanquam sub torrenti sona, martis furore estuantia, rusnam minitarentur.\
    \ Homicidium fraus iniustitial atque infidelitas in tuto grassaretur serminantes, tanquam\
    \ furia quaedam internales, furestras discordia scintillas, perumversum inperium. Ciniq\
    \ sanguis, sanguiri apponentur, et absque ullo respectu filius parenti. Parens filio, frater\
    \ fratri, misidiaretur tanta crudelitate quanta olum asrud garamantas, aut nidos nati uti\
    \ dicebantur unaque furo vincia civitas, iuro  ut hic experti sictus, sub urbaia proprio\
    \ arterentur iure. Denegantes deo quod Deo, casari quod caesari competit. Atque tandem ad\
    \ eiusmodi augustias perventum esset, ut nec quod sperani, nec aut timeri debuerie, ignoranetur.\
    \ Dies huius mensis 7. proverbio, post nubula plebus, veritatem prebuit. Quo victorial flamma\
    \ gradivi faces, extingui videbantur. Laurus portas, antea vigilijs nunitas, tu tabatur.\
    \ Tormenta in suburbium viridi crucis versa (ob contentum ducis nostri, let is correspondebant\
    \ civium acclamatro nibus, cuius resonantia domus quassata participes huius lestria videbant\
    \ venetur enim a sapientio nibus, pacem ex necessitate dactam, haud stabilem fore, cuius\
    \ coniectiura confirmatur ex 4000 hominum. Andegavuus huius pro vincia capuit, petentium.\
    \ Non dubito quin incas accefreris primam 13 secundam 22 martij, dictantem equos meos venditos\
    \ esse 19 martij, his parivis 80. pistoles frisum 30 manco interim. Filius tuus obedientissimus.\n\
    \ SAVMVR XVII Aprilis CIDIDXCLIX IHVM"
