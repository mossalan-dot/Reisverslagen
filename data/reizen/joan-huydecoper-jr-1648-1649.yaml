  relatie: neef-neef
  taal: Nederlands
  bron: FA Huydecoper 68
  tekst: 'Monsieur mon cousijn Schaep.


    De asseuransi van Ue. affectie, is mijn soo wel bekent dat ick (deselve Ue mijn soo strickt
    versekerende) mijn ongeluckkig acht t’ geen Ue schrijft ick te menteren, is meer dor Ue
    groote beleeftheijt, als door mijne obligatien, oock en hoeft Ue geen swarigheijt te maecken
    mijn iets te belasten, aengesien ick bekommert ben enige fouten te soude mogen committeren
    in Ue dienst. Ende als het meeste geinteresseert sijnde, bij Ue vrintschap, oock alsoo de
    meeste glori stel inde qualiteijt van Ue dienaer. Het selve effectuerende, door desen ingesloten
    van Paris. Den siecken onsieur Trotter is tot onsent gestorven. De rivier is soo hoog geweest
    dat het waeter ins onse sael quam, en te paert naer La Portens moesten gaen. De pilaeren
    vande eerste brug weg gespoelt, soo dat den dyck overwel dicht door de forsen vant waeter
    1 1/2 mijl van hier naer Tours is doorgebrooken. Mensen en beesten verdroncken, twelck mijn
    tot nochtoe belet heeft van mijn reijs, gelijck oock te vooren mijnheer Vries, die 6. daegen
    sonder eten sijnde meende te sterven, doch is nu weder wel te pas, gelovende monsieur Schrijver
    hem wat te veel op de proef heeft geset, doen hij daer mede naer Tholenaers was. Het kasteel
    wort gefortificeert, watse aen alle poorten en fauxbourgs gehouden, soo dat men monsieur
    le mareschal de Brise hier alle daeg verwacht, blijvende ondertussen Ue onderdaen cousijn
    IHVM.'
- verzender: Joan Huydecoper jr.
  ontvanger: Jacob Hinlopen (1618-1671
  datum: 26-03-1649
  plaats_verzender: Saumur
  land_verzender: FR
  relatie: zwager-zwager
  taal: Nederlands
  bron: FA Huydecoper 68
  opmerking: echtgenoot van zus Maria (1627-1658)
  tekst: 'Mijn heer en Broeder,


    Ue van mijn affectie en schuldigen plicht te verseekeren, geloove niet nodig te sijn naedemael
    de preuven van dien tot mijn groot geluck goede effecten bij Ue hebben gesoorten, welcke
    ick altijd vervonden soude hebben. Ten waerden borgerlijcken oorlog alle passagie had afgesneden
    om de goede correspondentie te vervorden, dewelcke ons geopent is door een boode gesonden
    aen monsieur le marechal de Brese, schoon van monsieur le prince verkondigende de langewenste
    vrede geslooten tussen het parlement en den koninckin. Ondertussen gelovende den reijs en
    lang gewenste resolutie vast te sijn van mijn Italiaensen tocht. Ben door 2 brieven vanden
    baes gecommandeert om tegens het voorjaer tuijs te koomen. Naedemael den reijs te kostelijck
    valt. Hebbe seekere missive tot antwoort gesonden, dewelcke ick met en gelof soo wel ingestelt
    te sijn, datse hem sonder Ue autoriteijt van sulcks sullen kunnen detourneren. Niettegenstanede
    belove met 15 hondert gulden int iaer to te sullen komen en soot hem goet dunckt sal mijn
    paert (daer voor den gouverneur 500 biet verkoopen en op suijnige den reijs aen leggen,
    versoecke ondertussen Ue hier van eens te vertrecken, sullende mijn opt hoogst verobligeren
    in qualiteijt mons van Ue. Ue dienaer IHVM


    26 maart'
- verzender: Joan Huydecoper jr.
  ontvanger: Brouer
  datum: 23-04-1649
  plaats_verzender: Saumur
  land_verzender: FR
  relatie: neef-neef
  taal: Nederlands
  bron: FA Huydecoper 68
  tekst: 'Mijn heer en cosijn Brouwer


    Ue. affectie en de continuatie van dien is ons door monsieur Schrijver al gebootschapt,
    niet naerlatende de memori ditmael te vervarsen. De gesontheijt van Ue met een glas continuerende
    niet sonder op het hoogen begerig sijnde naer Ue compagni. Hebben mijne paerden hier verkoft.
    Den spaniaert voor 80, en den vries 30 pistol aen seeker marquies de Chase gelove deselve
    wel verkoft te sijn. Vertrecken dese maent naer Lions en van daer de rivier de Rone af,
    naer Italien. Gelove dat mijn cousijn Schaep mijn compagni sal houden tot Orleans, die dan
    van daer naer Hollandt gaet, want het is tijt dat hij van hier vertreckt, hebbende seecker
    monsieur du Meniescuier lahier een sufflet gegeven op de volle straet, die hem nu te vier
    en te waeter vervolgt, wense ondertussen dat ick de enigen dienst kost doen, als synde op
    het hoogst desireus altijd te blijven in qualiteijjt monsieur van Ue. IHVM


    SAVMUR XIII April A CIDIDXCLIX'
