beschrijving: "Ongedateerd derde verslag van een educatiereis naar Frankrijk van Joan Huydecoper\
  \ in 1649. De reis liep van Saumur naar Lyon. \n\nHet eerste deel, van Amsterdam tot Genève,\
  \ en de delen na het bezoek aan Lyon zijn verloren gegaan."
