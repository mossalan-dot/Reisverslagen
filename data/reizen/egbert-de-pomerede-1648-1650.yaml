beschrijving: Ongedateerd verslag van een educatiereis van Egbert de Pomerede (º1628) naar Frankrijk,
  Zwitserland en Italië in 1648-1650 in het gezelschap van zijn neef Nittard. De Pomerede ging
  scheep in Vlissingen en arriveerde in Dieppe. Hij bezocht Parijs en het Loiregebied en ging
  via de westkust zuidelijk naar Bordeaux en Bayonne. Hij vervolgde zijn weg naar Toulouse en
  Marseille en keerde noordelijk naar Lyon en Genève. Hij stak de bergen over naar Italië en
  spendeerde een paar maanden in Genua en Milaan. Hij reisde per boot langs de westkust, waar
  hij Livorno en Napels zag. Hij voer naar Palermo, Malta en Messina en reisde verder per land
  vanaf Napels. De Pomerede trok naar Rome, waar hij werd rondgeleid door zijn oom Johan Everard
  Nittard, een Romeinse jezuïet. Hij bezocht Florence en verbleef vier maanden in Venetië, alvorens
  de Zwitserse Alpen over te steken en door Duitsland terug te keren naar Middelburg. De reis
  terug wordt kort opgesomd. Het tweede verslag, per abuis toegeschreven aan zijn vader Joan
  Daniëls, bevat stadsbeschrijvingen van Italiaanse steden.
