  bron: Van Asch van Wijck ms. 1272
  opmerking: 'Ms. VAvW 1272, no. 5, fols. 3, folded in quarto with the top right part missing,
    without an address.


    Synopsis: Just as in nr. 3, Gronovius discusses the matter of his sister’s marriage. Answering
    a question of his brother, he relates his search for a certain passage published by Lubin,
    possibly in his Mercure geographique. After arranging a meeting, Lubin claims Gronovius’
    colleague Rycke stole these pages under the guise of another scholar, that of Gisbert Cuper.
    He discusses the recent works of Thévenot, Hardouin, Bigot and Lubin and writes that Huetius
    will arrange to send an ornate bound copy of the Livy edition to Colbert. He has not yet
    received the requested books from Elzevier or Hacke and discusses who he will gift the Livy
    edition in Italy, stating that it would not be of interest to Queen Christina of Sweden.
    He includes a collation of works he found in the Colbertine and the Abbey of Saint Victor,
    most likely the aforementioned Livy and Columella. He will also send the Columella collations
    to Elzevier and gives Jacobus permission to send them to Graevius. He once again tries to
    inform after the supposed errors in his brother’s work on Meibomius. Gronovius instructs
    his brother how to deal with his finances and discusses the costs and financial details
    of his upcoming voyage to Italy. Jacobus has arranged lodgings in Florence, but Laurentius
    states he would first like to learn Italian elsewhere. He relates the travels of fellow
    Dutchmen in Paris. He would also like to travel to Saumur and Angers, but sees no possibility
    to do so.'
  tekst: "[1r] Mon Tres Cher et Tres Honoré,\n\nDesen tot antwoordt van uwen laesten dienende,\
    \ soo segge ick dat ick tegen sijn persoon niet te seggen hebbe ofte weet ende soo hij soo\
    \ is gelijck U Ed. mij deselve beschreven hebt, dat ick dan meer verwagte dat die saecke\
    \ ten einde lopen mach en ick wensche suster voorsigtigheijt en welvaert in die saeck. Ick\
    \ bedancke haer voor dese eer als mede hier voormaels aen mij genoeg bewesen en soo ick\
    \ haer niet daer in van mijne zijde voldaen hebbe, belove ernstelich dat soo wanneer ick\
    \ mijn sin tot die saech [mede] gegeven [sal] hebben haer mede tot mijn tweede raedt [te]\
    \ gebruicken. Tot een teecken hier van wilde ick wel selver geschreven hebben aen haer,\
    \ maer de tijt die met mij nu wat anders omspringt, als in den Haegh wesende, laet sulcks\
    \ niet toe en ick versoecke U Ed. ernstelick mij te willen bij haer Ed. te excuseren en\
    \ dat mij dit saeck genoeg bevalt, als sij daer in soo contentement heeft. Ick hebbe hier\
    \ ijets verstaen van een juffer, die ieck wel gesproken hebbe, dat mij niet alte wel behaegt\
    \ en soo U Ed. ijets goets kan sien in de juff(ers) op het Noorteinde, soo soude ick U Ed.\
    \ noch meer van haer qualiteijten verhalen, die ick kenne, en als ick U Ed. sin weet soo\
    \ wil ick het canon wel soo setten dat het niet missen sal en soo U Ed. daer sin in heeft\
    \ soo doet ghij mij verdriet aen met te wagten nae mijn wederkomst. Ick wil wel met U Ed.\
    \ en haer vrolick wesen, maer ick hebbe groote aversie van bruiloften en sulcken geklap.\
    \ Ick belove U Ed. de mijne oock wel ter gelegener tijt te sullen vinden al wort mij die\
    \ op bruiloften niet opgedrongen. \n\nAls ick bij pere Lubin eerst onbekent quam, nae dat\
    \ ick alvorens al de geleerden daer nae gevraegt hebbe, doch te vergeefs, soo vroeg ick\
    \ hem nae dat boeck, doch hij negeerde dat en seijde Cuper, een lang persoon, hem eenige\
    \ bladen getoont te hebben, maer niet van U Ed. als [alleen] wel te kennen, maer niet dat\
    \ U Ed. hem ijets getoont heeft, veel min hij sulcks geschreven te hebben. Hier was ick\
    \ niet mede tevreden en lopende sijn boecken te soecken, hebbe icker seven vergeefs doorgelopen\
    \ en in specie 2 mael sijn Mercure Geographique in (octa)vo 1678. Daer ick de opinie van\
    \ hadde van dese morgen gaen ick kom a dieu seggen, omdat hij sich meertijts anders liet\
    \ excuseren en doen weder nae die plaets vraegende, dat ick die overal gesogt hadde en niet\
    \ konde vinden, doen heeft hij mij rondt uit bekent nergens dat geschreven te hebben, maer\
    \ dat Rijcke met een valse naem [van Cuper] bij hem gekomen is en die bladen getoont heeft\
    \ en dat hij, Rijcke, twee plaetsen van hem gestolen [heeft], dat hij wel wist het originale\
    \ te Romen te wesen, maer dat Rijcke wel kost copie hebben en dat hij heel niet twijffelde\
    \ of daer souden veel van anderen onder gemengt wesen. Quod miror. Als hij seide [1v] van\
    \ sijn noten te stelen, vroeg [ick] of hij dat ergens in de bladen van Elzevier mede gebragt\
    \ gesien hadde, doch seide geen tijt gehadt te hebben om te examineren. Hij laet U Ed. groeten.\
    \ En nu kan ick dat voor als noch niet geloven voor dat U Ed. mij dat boeck noemt. Daegs\
    \ te voren liet hij mij door een ander monnick sijn Mercure Geographique tonen, daer ick\
    \ het van te voren al gesien hadde, en dese monnick seide mij pere Lubin weder belet te\
    \ wesen, maer dat hij gesegt hadde die plaets in dat boeck moest sijn en daerop weder te\
    \ vergeefs soeckende. Soo ick U Ed. alles pertinent soude verhalen, dit alleen soude een\
    \ brief vullen. \n\nThevenot is besich met sijn huijs te timmeren van 50 kamers dat hem\
    \ veel tijt wech neemt. Is meest tot Parijs, doch seer belet. Als dat gedaen is, sal hij\
    \ met de Persische Geographie voortgaen. Heeft tegenwoordich niets onder de pers. Ick agte\
    \ hem seer om sijn geleertheijt en sinceerheijt als mede Huet, die nu U Ed. epistolen aen\
    \ Sr. Colbert sal presenteren met gelegentheijt kostelick gebonden. Mij staet mede voor\
    \ van op die tijt, ut scribis, gesonden te wesen [die boecken] in een parkamente witte en\
    \ vergulde bant, doch dese bant kan ick niet vinden, sijnde Sr. Colberts Livius in root\
    \ vergulde leer met sijn waepen daer op. Seeckerlick sal ick een Livius in des konings bibliotheec\
    \ laten brengen en met Thevenot en Huet raedt daer over nemen hoe ick dat besorgen sal.\
    \ \n\nMaer siet eens nog de Livius van Elzevier, noch het packet van Hacke is hier te vinden,\
    \ daer ick soo nae verlange. Hacke beloofde mij binnen 2 a 3 weeken te konnen een packet\
    \ over Antwerpen senden en nu is het wel 5 weecken. Doch sondag worden wagens van Antwerpen\
    \ verwagt of het daer in is weet ick niet, altoos het smert mij sulcken schoonen tijt te\
    \ ontglippen. Als ick dat packet van Hacke hebbe, sal ick wel niet wagten nae Elzeviers\
    \ Livios ende sij sijn al te groot om in mijn valijs te doen en sullen al te veel kosten\
    \ en bij de konigin kan die niet aengenaem wesen (alsoo ni fallor de dedicatie verandert\
    \ is, want een in (duodecim)o haer is gedediceert geweest (soo ick misse ick sal U Ed. antwoort\
    \ daer over verwagten bij Magliabecqui). Itaq(ue) certus, sum non offerre Liviu(m), maer\
    \ misschien uwe noten of orationes. Soo ick de Livios noch hier vinde, sal ick packen soo\
    \ veel ick kan en vooral unu(m) principi. Maer heeft Magl(iabechi) uwe noten niet al en\
    \ sijn deselve oock niet genoeg om vrienden te maecken? ick sal oock misschien geen noten\
    \ van Elzevier konnen erlangen, doch dese praet snijde ick af & consiliu(m) rapiam ex re\
    \ praesenti. \n\nHier neffens een collatie van t MS. van St. Victor en oock van Colberts\
    \ MS. seer out, doch in eenige passagien die ick sag mij mishagende en oock sonder eenige\
    \ rode of vergulde letteren, als alleen met swarten inckt, en inhoudende [2r] de X eerste\
    \ boecken, en eindigen alle even gelijck met de editis Justel. Wagtende tot dat Mr. Azut,\
    \ Italiaen en mathematicus en vriendt van Thevenot, sijn boeck soude weder geven, is hij,\
    \ Azut, vertrocken met t boeck. Dese man hebbe ick eens besogt met een briefie van Justel\
    \ en versogt uwe errores, alsoo het van hem van daen quam. Dese man seide mij geen fautes\
    \ geobserveert te hebben als Justel in dat briefie schreef, maer dat hij U Ed. boeck weder\
    \ op nieuw wilde naesien daer ick hem instantelick om badt te willen doen en ick wone schuijns\
    \ over hem. Dese man is al nae Italien weder en Justel begeer ick geen ander exemplaer meer\
    \ te leenen, sullende hij dat seeckerlick houden. Ick hebbe hem geklaegt en nu ijder een\
    \ dat hij mij vandaeg tot dagh ophoudende en nu moetende vertrecken de errores niet heeft\
    \ willen tonen. Als ick dit [eerst] hoorde was ick eens met texemplaer van Sr. Colbert bij\
    \ hem en versogt [hem] om gesamentlick te lesen, alsoo ick doen van te voren 2 a 3 mael\
    \ dien brief doorlopen hadde, waer door mijn ijver noch meer onsteecken was, doch hij seide\
    \ als hij sijn exemplaer wederkreeg. Eens seide hij ijets int wilt van de proportie en als\
    \ ick wilde schrijven, soo liet hij dat niet toe, belovende U Ed. selver te schrijven. Hij\
    \ laet U Ed. even wel groeten en ick sal hem noch maer eens spreecken en oock a dieu seggen\
    \ en bedancken voor sijne recommandatie of hier of daer. \n\nMijne ordonnantie sagh ick\
    \ liever dat weder belegt wierdt op de beste manier alsmen sal konnen, en daer is niet aengelegen\
    \ of de rente maer 5 of minder is, als het maer geschiedt op de beste en seeckerste manier\
    \ en dat ick dat gelt op den verschijndag altijt kan magtig worden, evenwel hoe hoger renten\
    \ hoe liever. Dat U Ed. mij die renten betaelt is mijn gantselick onaengenaem. Ick wil U\
    \ Ed. dat gelt wel langen sonder renten, soo U Ed. dat nuttelick om ijets anders daer mede\
    \ te kopen ofte doen of op rente te leggen van doen heeft en dat soo sijnde is alles wel.\
    \ Maer niets daer van vernomen hebbende en denckende dat U Ed. het nu eens soo sal maecken\
    \ dat alle jaer ijets wort gelegt tot een quaden dag, soo hope ick geheel anders, namelick\
    \ dat U Ed. dese somme sal liever vergroten en dat voors daer mede handelen als behoort.\
    \ En dit geschiet wesende en als ick dat wel bevinden belegt te sijn, soo wil ick U Ed.\
    \ uwe penningen ter gelegener tijt wel weer geven, of U Ed. kan se dan mij weder [geven].\
    \ Ick versoecke ernstelick U Ed. eens een begin mach maecken van die goede saeck en het\
    \ sal mij vreugt wesen tselve te horen al was het maer met een 100 gl., siende ick U Ed.\
    \ vlijt voor u eigen self en ick kan niet twijffelen of U Ed. sal soo [2v] leven datter\
    \ ter minsten ijets overblijft. \n\nIck hebbe noch gelts genoeg om die reise uit te harden\
    \ naer Italien, doch evenwel sal ick 100 of 150 [gl.] min of meer hier lichten en voors\
    \ in nov(ember) hebbe ick ijets te verwagten. Soo ick nu bloot was, soude meer van doen\
    \ hebben, maer een goede somme noch bij mij hebbende van 900 gl., soo pistolen als ducaten,\
    \ en dan noch ijets hier lichtende, soo mij geen ongeluck rencontreert, sal ick [daer mee]\
    \ wel overkomen en voor een ongeluck sette ick mijn binnenste van t lessenaer int bovenste\
    \ kassie. Ick hebbe dit eenige dagen overlegt en kan niet anders oordelen of ick sal daer\
    \ wel heen komen. De eer hier heeft mij vrij wat gekost, maer berouwt mij geensins en soo\
    \ ben ick van humeur dat ick ijets goets van te voren considerende, daer nae noijt berou\
    \ hebbe van de onkosten, hoe veel het oock kost. Ick ben verwondert dat Rouse soo met mij\
    \ omspringt en [dat men] dat soo toelaet. Heeft hij wel eens die 3 maenden [van] 500 gl.\
    \ en van de rest tegen 6 per 100 van dit jaer betaelt op sijn tijt. Kome ick tot Deventer\
    \ ick sal hem eens spreecken en de tweede mael sal ick hem wel doen tot mij komen. Wat hebbe\
    \ ick qualick gedaen soo ras van Deventer over een iaer vertrocken te sijn! En wat hebbe\
    \ ick te verwagten van Lhaer. U Ed. kan die gedagten wel hebben dat ick niets soude uitgevoerdt\
    \ hebbe, maer hebbe ick soo een ordonnantie weten te beleggen, ick meen ick soude dese luiden\
    \ oock wel wat anders konnen handelen, doch wie hoort gaven klaghten! Ick soude versoecken\
    \ men nu en dan een loper tot Deventer gebruicte om Lhaer te gaen maenen en die elcker reis\
    \ een schelling gaf, doch uit gemeen voor soo lang de geemene renten noch dueren en de rest\
    \ op mijn reeckening setteden. \n\nVoor U Ed. onderrigtingen nae Italien sal ick wel onthouden\
    \ en wilt dat mijn huijshuur nu eerst ontfangen wert. Gelooft niet dat mij dat vermaecken\
    \ kan, als ick hore andere menschen met mijn goedt [soo handelen] en betalen, als t haer\
    \ wel gevalt, doch met dit huijs sal ick ten gelegener tijt wel anders handelen. Het is\
    \ mij genoeg dat dat eenigsins in mijn macht is. Hier is een boeckverkooper uit Italien\
    \ gekomen, seggende tot Florence(n) een medicus gesproken te hebben, aen wie U Ed. geschreven\
    \ heeft dat ick in sijn huijs logeren soude. Ick vroeg desen man of hij pensionnaires hield.\
    \ Hij seide te geloven van jae, maer niet te weten en dat die medicus met U Ed. naer Perugia\
    \ geweest was. Ick vinde wel niet quaet eens tot Romen of Pisa of Milan of andere [kleine]\
    \ plaetsen, daer men goet Italiaens spreekt, mij eerst wat onbekent op te houden om wat\
    \ Italiaens te leeren, doch dese praet moet ick nu afsnijden, alsoo ick geen antwoort kan\
    \ hebben. \n\nVoors soo daer noch iets is en U Ed. in de sin quam mij nootsaeckelick te\
    \ wesen om te weten, soo moet U Ed. dat schrijven binnen ses of 8 weecken aen Magliabecqui.\
    \ Van Florence of daer omtrent sal U Ed. mijn gesontheijt en verdere gelegentheijt wel laten\
    \ weten. De Italianers sullen misschien oock weinich Latin speecken, daer ick dan mede verlegen\
    \ sal sijn. Voors hebbe ick hier al vernomen van Elemans insolventie, daer De Koning op\
    \ de butter mart 12000 gl. bij te kort komt, als [3r] mede de doot van Maesdam, Vander Dussen\
    \ tot Delft en onsen groten vriendt Goes. Sijn soon is noch tot Orleans. Dese plaets wilde\
    \ ick oock wel sien, als mede Saumeurs en Angers om de academien, maer d'een segt mij het\
    \ niet de pijne waert te sijn en een ander dat de tijt al verlopen is, altoos ick wilde\
    \ Fabri filiam wel eens spreecken. Voors sal ick aen Elzevier de Columella geven met het\
    \ out MS. geconfereert en licht eenige kleine dingen, die ick al aen U Ed. addresseren sal\
    \ en als U Ed. goedt vindt kont ghij deselve Columella aen Graevius sturen. \n\nMeerman\
    \ is verleden dingsdach mede naer Italien vertrocken, als mede Huijbrecht die van hier nae\
    \ Caen en Rennes en soo verder nae Geneve gaet, soo dat ick het ongeluck hebbe van sijn\
    \ geselschap te moeten missen en ick sal nu wel voorsichtiger wesen om mij met geselschap\
    \ te engageren. Voors Mr. Friderich versoeckt dat U Ed. die 2 casen met de boter wil addresseren\
    \ aen Antoni vander Hulst, koopman tot Rouaan, wel bekent, en die mij vriendtschap gedaen\
    \ heeft. U Ed. kan dit soo over Rotterdam senden, of anders Mr. Dispontein versoecken of\
    \ sijn Ed. suster niet gelegentheijt wist tot 2 casen en [een] boter tonneken tot Rouaen\
    \ aen haer swaeger Vander Hulst over te maecken [om te senden nae Paris]. \n\nLe pere Hardauin\
    \ jesuit heeft hier veel uitgeschreven notas marginales van Plinius, die in haer bibliotheecq\
    \ gevonden worden en a defuncto gelegateert en voornamentlick [met] vele MSS. geconfereert.\
    \ Dit heeft hij bearbeijt en nae ick hem hebbe horen spreecken, hebbe ick daer goede opinie\
    \ van. Hij is voor 4 weecken soo hart aengetast van een coors, dat hij niet meer kentbaer\
    \ was en van niemant aengesproken mach worden als alleen uit nootsaeckelicke oorsaecken,\
    \ gelijck ick mede als ick hem maer a dieu segde. Hij wenst commerciu(m) literaru(m) met\
    \ U Ed. dat ick seide U Ed. hem niet soude weigeren als hij wilde schrijven, dat hij seide\
    \ te willen doen en soeckt een drucker voor sijne noten over Plinius, daer hij privilegie\
    \ toe heeft voor 15 jaeren. Hacke wil het niet drucken als ick van hem gehoort hebbe. \n\
    \nOock is hier Cuilon bij De Houst op de Breedestraet gewoont hebbende en altijt wel van\
    \ humeur geweest. Hij komt uit Italien. Ick sal hem eenigsins vraegen nae de wech als ick\
    \ vertrecken sal en niet eerder. Hij sal mij seeckerlick oock wel seggen dat Magliabecqui\
    \ mij verwagt, maer ick weet wel datmen sonder haer tael te kennen oock weinich aengenaem\
    \ kan wesen. Bigot is nu besich geduriglick met Chrijsostomi vita a Palladio conscripta,\
    \ daer hij seeckerlick goede [3v] geleerde dingen sal bij brengen. Le pere Lubin heeft mij\
    \ wel geklaegt over de traegheijt en ontwetentheijt van de Franse druckers en dat hij noch\
    \ wel 12 boecken heeft gereet om te drucken, doch nu seijdt hij dat Mr. Elzevier een boeck\
    \ van hem wil drucken over de Geographica van de 5 boecken Moisis. U Ed. meen ick heeft\
    \ eenige kennis met de bibliothecaris tot Milan. Waerom hebt ghij mij dat niet laten weten\
    \ hoe sijn naem is? \n\nQuod tibi in aurem, alter consul, alter in summa fortuna constitutus,\
    \ die hebben mij nae susters gesontheijt dickwils gevraegt en ick antwoorde seer beleefdelick\
    \ en een van dese of andere soude wel kans voor haer geweest hebben en ick sogt maer bequaeme\
    \ tijden, die nu scheenen te komen, maer ick hebbe gehoort dat eenige menschen tot Deventer\
    \ het u en mij in Avi haereditate hebben willen vergelden en nu sij anders niet konnen.\
    \ Of sij ons daer mede regaleren weet ick niet. Altoos voor mij neme het soo quaedt niet\
    \ op. Wensche maer dat susters selver contentement mach hebben. Hadde ijmant noch geleeft,\
    \ t was niet geschiedt uit reden om dat hij eens op een tijt mij seide lelick en t hooft\
    \ schuddende met sulcke beweeglicke woorden die hem scheenen t hart af te snijden en oock\
    \ maer half gesproken te hebben, versmaedt wiert van twee luiden tot Deventer. Maer [ick]\
    \ vinde goedt als U Ed. oock wel schrijft, dat elck sou toetasten in sijn plaisir te nemen\
    \ daer hij denken mach dat het sou te krijgen sijn. En ick ben wel voldaen van alle respect\
    \ en genegtheijt die mij suster altijt en nu oock overvloedelick bewesen heeft. Wat voor\
    \ goede conditien suster diergelijcke menschen sullen voorhouden, kan ick wel dencken en\
    \ misschien salmen daer niet op sien en ick kan dat oock wel laeten lopen. Dat ick nu van\
    \ eenige andere menschen tot Deventer geen goede vertrouwen hebbe, dat raeckt dese persoon\
    \ niet en niemandt moet mij dat qualick afnemen. Mijn raedt sal suster wel niet van doen\
    \ hebben, maer evenwel soo hadde ick wel gewenst deselve haer wat eerder opgeoffert te hebben.\
    \ Doch Godt biddende dat hij alles ten besten, als wij hopen, keeren wil en suster goede\
    \ voorspoedt geven. \n\nVerblijve nae mijnen dienst aen U Ed. en onse susters en swagers\
    \ en andere vrienden gepresenteert te hebben, als mede aen oom prof(essor) die Bigot en\
    \ Vallerius doen groeten, soo stappe ick over naer Italien binnen korte tijt. Hebbe ick\
    \ nu met 500 of 600 gl. dese 4 a 5 maenden konnen doorbrengen, wat hebbe ick te vreese(n)\
    \ als ick de reis sal afgelegt hebben. Of sal noch wel 6 a 7 maenden in Italien met minder\
    \ doorbrengen. Altoos ick hope U Ed. binnen 2 maenden wel 600 a 700 gl. voor mij suiver\
    \ uit mijn renten te hebben en soo daer wat van Deventer komt, sal winst wesen en dat sal\
    \ ick wel recken tot meij of april. Over 8 weecken sal ick U Ed. daer van beter onderrichten,\
    \ doch de winter ist duurder sed portea videbimus en ick bidde, soo ick te kort kome, wil\
    \ ick liever hebben dat U Ed. mijn gout aentast als die ordonnantie, daer U Ed. wel kan\
    \ mercken dat ick vrees voor gehadt hebbe en nu noch meer. Soo U Ed. wat beters weet, en\
    \ daer toe belegt is, alles wel, en sonder mij te vragen. En dese tijt moet U Ed. noit nae\
    \ Deventer gaen om mijn saeken, alsoo mij dat niet vermaeken sou en een verkeerde mesnagie\
    \ sou wesen, daer ick niets van houde. \n\n15 sept(ember) 1679. Paris. A dieu."
