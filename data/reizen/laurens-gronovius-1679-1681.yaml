  tekst: '[1r] Mon Tres-Cher et Tres Honore Ferere,


    /De port heeft dese Ingeslotene geopent, die U Ed. dan moet calefateren\


    Als geschreven hebbe dit convoij hier wesende, en eenig linnen ontfangen en voors eenige
    boecken naer patria gepackt hebbende, meende daer mede voort te gaen. Doch is verre van
    daer, want dit convoij heeft 60 dagen tot Genua quarantena gehouden, en sou het selve tot
    Livorno moeten doen, waerom sich in zee hout en vertreckt dese weeck. De goederen en passagiers
    moeten 40 a 50 dagn int lazaret quarantena doen, vorders eenige intervenienten mij veele
    tijt doende verliesen, maecke geen andere gissinge als naer eenige maenden te repatrieren,
    soo evenwel U Ed. of U Ed. Liefste oordeelde dat dit een ontijdige schadelicke begeerte
    voor mij is, sal mij hier noch wel langer ophouden. Naer Romen om de vicatie tot Bremen
    te houden, hebbe aen Illmo Sigr. Stefano Pignatelli door Magliabechi geschreve en wij twijffelen
    niet van favorabel antwoort, desen Heer kent Heinsius wel en vermag seer veel bij te Koningin.
    Inde vite Plutarchi in de Abdie hebbe niets gevonden. Daer is oock Seneca Ms. niet seer
    out in Hijppocrites Ubi Glacies levis elissus. deest. en leest Menander voor Meander. Noch
    is daer een Grieckse Ptolomeus Membran. soo groot als de Atlas doch dun met caerten. Speculerende
    in Italia vonde errores notabiles. Bij exempel stelt Pibbal floosenpa over de Arno, en faisolai
    bij Hosa de volgende rivier. Dat is afgaende van Fesulte /naer Florence\ men de Arno an
    de rechter handt heeft van verre. Daer ter contrarie van Fersule afkome de men de Arno ande
    lincker heeft als in de gedructe Ptolemeus en alle ander kaerten met de waerheijt te sien
    is, en is niet geloofelick Fesule of Florence tijt van situatie verandert is, hebbe noch
    meer errores in de kaerten gevonden. Doch de Geographica konden van een Mathematicus veel
    uit dit Ms. verbeteert worden. Is oock tamelick out. Dit geschreven sijnde ontfange U Ed.
    aengename sonder vatum, waerom de reijs nu teenemael laet lopen. En komt mij ter rechter
    uur, Plutarchus de Tride p. 364 achichlamei asav et alsoo in 2 mss. chartas. En meer Mss.
    vinde daer niet van. Noch oock van de Symposia. Pluteo 55 in vol. Epicteti sijn veel Tactici,
    en U Ed. heeft mij nooit geschreven eenige daer van te copieren, maer wel pl 57 n .31 als
    geschiedt nis. Wie U Ed. hebbe wil, moet mij expresselick de titel daer van laten toekomen.
    Ben verwondert dat U Ed. niet meer gesien heeft ofte weet in dese boeckwinkels geene of
    seer weinige literratores noch oock niet codex Flicod. of Bellonise sulck u Nasonis of Panite
    Numismatica of Nili opera gevonden te worden. Magliabechi heeft verscheiden daer van gesproocken
    om te kopen, doch is vergeefs soo daer niet selfs noch eens tot Romen kome is onmogelick
    te hebbe. Ick hebbe groote stimeover Lemoine, doch wilde wel de brief niet gecommuniceeert
    was van Chrijsostomus, altoos is ons maer seer schadelick, met recht of onrecht wil ick
    niet disputeren. Oock Magliabechi wiste niet dat wijse hadden. Ben nu maer in vreese en
    in alle geval wilse Lemoine laten uitgeven, dat hijse hier selver van daen haele, het sal
    den hertoch oock niet aengenaem wesen soo hij hoort ick sulcken brief gecopieert hebbe.
    Die mij noch ontlsangs goet faveur tegen de Gardiaen van St. Croce heeft laten toekomen


    /voor al soo se Lemoine uitgeeft ,laet hij niet seggen dat hijse van ons heeft. Hadrianus
    Valerius hebbe dickwils gesproocken, en meer van hem gehoort als Megae. Vitam Henri. Valerij
    hebbe niet gesien en is intmimus Bigotii als mede Baluzius. Jellis Ten Nuijl kan U Ed. wel
    helpen, sonder mij te laten weten. Hercuels Furens sal  U Ed. saelver overbrengen, alsoo
    meene daer nu sulcken grooten haest niet mede is. De kousen van U Ed. liefsten is mij ten
    hoogsten aengenaem, wenste maer meer van sulcke dingen. Haer Ed. konden dienen met cordiale
    groetenis verblijve U Ed. Onderdanige en Dienstwillige Dienaer Laurentius Theodorus Gronovius
    26 Aug. 1681 verwagt een dubbele wissel van 31 ducatons ec.'
