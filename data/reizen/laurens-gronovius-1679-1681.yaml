  tekst: "1r] Mon Tres Chere et Tres Honoré Frere, \L\LAu commencement je vous demande pardon\
    \ de mes fautes qui vous trouverez en bonne memoré de ces lettres et aussi de ma tardivité,\
    \ que j’ay commis, et si vous voulez ouyr quelq(ue) excuse, je vous puis donner beaucoup\
    \ de raisons, mais ce sera un autre fois moijennant la grace de Dieu. Je suis bien arrivé\
    \ au St. Vaillerij l’huytiéme du mois passé et de la par l’Eu au Diepe et de la Diepe par\
    \ cheval a Rouen le dixieme du mois méme, mais avec grandes fatigues et lassetes de mon\
    \ corps. \n\LA Rouen maintes-fois je suis venu voir Mr. Bigot, qu’est maintenant a Paris\
    \ chez Mr. Mesnage, ou il quelq(ue) mois demeuvera. Il vous aime, il m’a mené par quelque\
    \ cloistres. Il m’a monstré aussi sa grande et excellent bibliotheque, mais je n’ay veu\
    \ aucun livre MS. Il m’a raconté que Mr. Meiboom fut l’an passé a Rouen et quelque il s’a\
    \ trouvé en la college des hommes scavants, qui sont tous les jeudis ensembles au maisson\
    \ du Mr. Bigot, et que quelq(ue) fois estoit une desceptation de gravibus et asperis s(ancti)s(simis)\
    \ locis. Il discit je puis bien expliquer et estancher toute la difficulté, mais je ne veux\
    \ premierement ouvrir mon entendement, qu’un prince m’a payé mes travailles et ita devidendum\
    \ se propinavit. Encore quand il estoit arrivé a Rouen, il luy faut ouvrir sa farda<> des\
    \ livres, que n’a voulu pas, pourquoij le douanier luy a donné un coup a la bouche. En maison\
    \ de Mr. Bigot j’ay veu icy Mr. Ferrari, a quoij j’ay offert vostre livre et il a promis\
    \ de vous rendre graces per lettres. Il est fort occupé et empeché. Je suis joyeux de luij\
    \ avoir veu. Quand je suis partis de Rouen, il estoit hors de la ville au champ. Mr. Bigot\
    \ il a me persuadé que je ferays apporter nostros Tacitos chez Mr. Ménage, que j’ay fait\
    \ et maintenent sont icij, a pres quelq(ue) jours Mr. Bigot me conduira aupres Mr. Huet,\
    \ a fin que je pars avec luij au Versailles pour offrir etc., mais quand j’ay prié Mr. Bigot\
    \ ut munus ornetur verbis, il a respondu nil proderit, et nous faisons fant de dépens frustratoires.\
    \ Une fois j’ay salvé Mr. Mesnage, mais presentement il est un peu malade. Il ne parle qu’en\
    \ la lange Françoise. Mr. Bigot il a receu Heinsii Virgilios Dedicatos Regi, quos propediem\
    \ tradet etiam Grevii epistolas Ciceronis. \n\nEn Rouen Mr. Vander Hulst m’a invité au super\
    \ en son jardin fort plaisant hors de Rouen et je suis luij obligé de tant de services.\
    \ Son fil il demeure chez proc. Dispontein, frere de mon hote. Je vous prie si vous pouvez\
    \ rendre graces n’oubliez pas, car il a me tres bien traitté et j’offre mon service au Mr.\
    \ Dispontein pour ces lettres de recommandation. J’ay aussi bien addresse les lettres de\
    \ senateur Dierques en La Haije, pourquoij se lui suis oblige, car je voicis chez la dame\
    \ Dierques la veufe, deux belles damoiselles et tres-jolij, mais la lange me manque. L’une\
    \ est appellé la perle de Rouen. \n\nMr. Friderich et sa femme avec sa fille j’ay trouvé\
    \ facilement en bonne sante. Il m’a pourveu une chambre en troiéme hiement, mais pourtant\
    \ que j’estois las (car par deux jours je suis monté a cheval de Rouen a Paris), je ne cherce\
    \ rien que mon repos, mais apres une semaine j’aij changé et demeure en premier triement\
    \ [et une chambre] laquelle le soleil ne resplendit point et aussi plus proche au Pont Neuf\
    \ que l’autre. La fille de Mr. Friderich m’a dit, que vous et aussie blesnoye avez promis\
    \ un tonnelat de beurre Hollandois avec frommage. Mr. Thevenot a quelque fois vous demandé\
    \ chez Mr. Friderich, connu il m’a dit, apres quelq(ue) jours j’iraij voir Mr. Thevenot\
    \ au champ. Mr. Meerman et Van der Es, intimus amicus Melderi vestri, hier m’ont fait l’honneur\
    \ de me voir. Tout aussi tost que j’auray offert et sacrifié Tacitos, je vous eseriray encor\
    \ que m’advient. \n\nNa Limburgs Adv. hospes vragende, ontfang ick sulcke vriendschap. Ick\
    \ hoop ghij alles wel en ordentlick sult gevonden hebben. Hoe smaeckt u den arbeit? Hout\
    \ ghij al collegie? Le bon Dieu veuille verser sur vous de toutes parts de bonnes rosees\
    \ de ses graces et benedictions et consembler de toute, prosperite et felicite. C’est ce\
    \ que souhaite de tout son ceur.\L\LJe demeure chez Mr. Soulas, marchand de vin au chasteaux\
    \ de bon repos, Rue Guenegaug, Faubourg St. Germain. \n\nA Paris, 9 Juni 1679. \L\LVostre\
    \ tres-humble et tres-devot frere, Laurentius Theodorus Gronovius. Mon service a tous bons\
    \ aussi que me demande. \L\L[Je n’ay pas encore veu Mr. Goes. Iteru(m) vale.]"
