  opmerking: Ms. VAvW 1272, no. 6, fols. 2.
  tekst: "[1r] Mon Tres Honoré et Tres Cher Frere,\n\nIck hadde wel gewenst dat U Ed. mij hadt\
    \ laten weten aen wien dat Mr. Hacke uwe Orationes geaddresseert hadde of aen Leonard of\
    \ een ander boeck al enseigne de St. Paul Rue St. Jacques. Dese twee hebbe ick gisteren\
    \ over acht dagen gevraegt en soo dagelicks de ganse weeck of sij niet ijets van Mr. Hacke\
    \ verstaen hadden wegens hare verwagte boecken, seggen van neen en oock soo verwagten sij\
    \ hare boecken over zee en niet over Antwerpen als Mr. Hacke mij belooft hadde te willen\
    \ doen als men daer haest bij hadde, soo dat ick seer ontset ben waerom U Ed. dat gedaen\
    \ heeft soo laet in de tijt. Ick hope oock U Ed. daer een goet opschrift aen mij of Mr.\
    \ Friderich sal bij gedaen hebben, [soo] dat ick wel naer Italien sal gaen, maer niet geen\
    \ meer vermaeck als naer Vranckrijck en U Ed. recommandeert wel vroligheijt, doch ik weet\
    \ niet hoe een mens vrolick kan sijn als hem alles tegen loopt. Ick soecke liever redenen\
    \ en gelegentheijt van vroligheijt en dan volgt van selfs de vroligheijt bij mij. Ick sal\
    \ ten minsten wagten tot vrijdag 8 dagen den 6 oct(ober) doch soo ick U Ed. packet van dese\
    \ weeck noch ontfang, gaen ick vrijdag den 29 sept(ember) noch voort. Hoe meer ick a dieu\
    \ seggen, hoe meer menschen mij bedroeven, niet konnende weten waerom dat ick soo laete\
    \ vertrecke, daer de dagen soo kort sijn, regen en verder ongemack op handen.\n\nVerleden\
    \ weeck sijn aen een galg bij Pont Neuf aen eene zijde 21 aen d'ander 24 in effigie opgehangen,\
    \ meest voleurs des grandes chemines. Ick sal evenwel vertrecken en dese winter geenszins\
    \ tot Parijs doorbrengen en sal hebben 4 Livios van Elzevier gehaelt voor de koning, die\
    \ mij oock koninglick gelt kost, doch dat sijn sumptus salutares et honesti en die geven\
    \ vroligheijt, en Mr. Huet salse overgeven, want ick die tijt van binden niet kan afwagten\
    \ en oock is dat niet geraden. \n\nHuet is een vroom en naerstig abt, en sal wel bischop\
    \ worden. Hier is niemant soo bequaem van wien men dit versoecken kan als van S. Ed. Hij\
    \ laet U Ed. en Grevius weder groeten. Tan. Fabri filia is bij S. Ed. geweest, ick sal haer\
    \ Ed. tragten te sien. Drie Livios neme ik mede naer Italien die wel niet minder van vragt\
    \ sullen kosten dog twee Livius sullen de laeste betalen, soo ick die die kosten niet waerdich\
    \ agten, namentlick de prins en Magl(iabechi) en misschien de derde voor card(inaal) Barberino\
    \ en niet reginae, reden ut vides in prioribus. Nu U Ed. packet was seer bequaem om vrienden\
    \ te maecken sonder eenige onkosten en dat is dan soo veel te meer aengenaem. \n\nMr. Ozut\
    \ is n<och niet n>aer Italien, maer is gisteren van Fontainebleau wederkome<nde ge>weest\
    \ en soo discourerende dan segt [1v] hij van neen en ontkent de proportie, reeden om dat\
    \ de Malthesers, Venetianen en noch een vander natie galeazzen hebben (misschien even groot)\
    \ en de een twee, d’ander 4 roeijen meer als de vorige. Concedeba(m) inter diversas gentes\
    \ dat U Ed. konde wesen, maer een galeaz van een Maltheser en een dubbelde galeaz of een\
    \ groot oock van een Malthezer of daer niet soude iuijst de numeris remigu(m) verdubbelt\
    \ sijn. Daer op vinde hij van Claudii triremis (daer ick meen oock eenige swarigheijt van\
    \ U Ed. gemaect te wesen en aengeroert te sijn, dat die niet wel konde over een gebragt\
    \ worde met de andere. Ick hadde U Ed. boeck garen gewenst ad manum maer ick hadder geen)\
    \ en dat Meiboom daer nae misschien gerekent hadde en dat U Ed. geen auctores noemde waer\
    \ nae U Ed. reeckende en of ick Polijbus, Memnon en Plinius noemde die mij doe in gedagten\
    \ quamen. Soo sprack hij daer over en ick hadde doen weinich lust meer met hem te discoureren\
    \ als ick dat hoorde dat U Ed. geen auctores noemde. Hij is een seer geleert mathematicus\
    \ en is vriendt van Thevenot, Justell en meest van alle Franse geleerden. Is oock sacht\
    \ van humeur als men hem wat toegeeft. Wij scheiden goede vrienden. In t’ eerst meende ick\
    \ dat hij als ijets hadde gevonden, maer op het laest hadde ick soo grooten contentement\
    \ niet. Ick badt hem ijets in geschrift mij te geven, doch te vergeefs. Mr. Thevenot sach\
    \ garen ick met S. Ed. na Italien ging, alsoo hij al de wegen wel weet en wel in ommegang\
    \ is. Van tevoren in sijn huijs hebbe ick hem een copie van de prins sijn brief getoont,\
    \ daer hij over verset stont. \n\nBullialdus heeft Columella wel geconfereert voor 20 jaren,\
    \ als hij segt, maer denckt daer niet meer op. Hij seide de codex sine punctis te wesen,\
    \ dat ick nogtans anders bevonden hebben en blijcken uit mijne contenta capitu(m) in die\
    \ Columella. Hij wilde wel uwe Epistolica observa. hebben, maer ick kanse hem niet geven,\
    \ alsoo Elzevier daer geen en heeft en verlangt die brief van Meiboom te sien. Ick aestimere\
    \ hem om sijn verstant. Leeft in een convent gans alleenlick en soberlick. Kent oock Ozut\
    \ seer wel, seggende van S. Ed. meer swarigheijt te konnen voor den dagh brengen als wel\
    \ te solveren. \n\nNoch als ick vertreck, sal ick van Elsevier 200 gl. opnemen op wissel.\
    \ Versoecke U Ed. sich die moeijten te troosten. Voors voor nov(ember) maeckte ick staet\
    \ dan geen gelt meer te ligten. Ick verlange [oock] seer U Ed. te onderrigten wat ick van\
    \ doen sal hebben en ick reeckene bij U Ed. nu omtrent 300 gl. Nov(ember) 400 gl., Aytencamer\
    \ 120, Condewijn 60, soo dat in dec(ember) 900 voor mij gereet sijn. Ick kan niet anders\
    \ bemercken of  ick sal daer wel een half [jaer] of langer mee toe, dat ick U Ed. pertinentelick\
    \ sonder eenich manckement in decemb(er) sal konnen seggen en verkeekeren als ick tot Romen\
    \ of Florencen een kamer sal gehuurt hebben. \n\nVoor hebbe ick Cottelerius gesprooken.\
    \ Hij was seer beleeft tegens mij, vroegh mij nae U Ed. en Grevius en laet U Ed. beide gedienstlich\
    \ groeten, is stil van humeur doch sonder twijfel geleert. Vroeg nae U Ed. arbeit, en dat\
    \ <ge>sien hadde op Biblioth(eca) Regia A. Gellius [2r] confereren. Is dit waer? Soo hebbe\
    \ wij beide eene moeijten genomen, dat ick wel wat te voren hadde willen weten en die moeijte\
    \ sparen. Thoinard is mij weder op straet gerencontreert en hij laet U Ed. groeten. Ick\
    \ ken hem niet en daerom hebbe ick soo geen sin in hem. Hadde hij int begin met mij willen\
    \ discoureren, hij hadde uwe epistolen doch oock gehadt. \n\nHet is gebeurt dat U Ed. mij\
    \ d’eerste mael schreef van de vrijage, doch noch onseecker of het gaen soude of diergelijck\
    \ en twee a 3 dagen daernae op de reijs nae St. Denijs van een Overijsselaer is mij dat\
    \ al voor de waerhejt gesegt, soo dat U Ed. niet meer van die saeck mij geinformeert heeft\
    \ als alle menschen weten, jae minder mij geschreven heeft. Evenwel segge ick van onse suster\
    \ genoech voldaen te wesen van alle eer en respect en ick soude het voor een hoger eer al\
    \ mijn leven gehouden hebben, hadde sij mij dat laten weten eer ick vertrock of ten minsten\
    \ eer andere menschen dat wisten. Dock ick moeter om lacchen hoe sommige menschen haer tijt\
    \ weten waer te nemen en toe te tasten, daer misschien het alsoo eerlick voor haer geweest\
    \ was andere eens te verwittigen of ijets te laten weten als men alles in opregtigheijt\
    \ en goede vriendtschap kan verhandelen en het andere agte ick politica, die sij mogen hoog\
    \ agten, maer ick niet in het minste en maer voor een practijck en geen rechte politica\
    \ houde. Doch U Ed. en ick konnen nu gerust sijn, sijnde het laeste wonderlick wel afgelopen\
    \ even als U Ed. van Deventer en ick even van U Ed. afgeruckt, dat wij malkander niet konnen\
    \ spreecken. \n\nWoonsdag [27 sept(ember)] kan ick noch een brief verwagten van U Ed. soo\
    \ die onder wech is of oock noch woonsdag agt dagen den 4 oct(ober) soo ick U Ed. packet\
    \ van dese weeck niet ontfang. Want ontfangende, wagte ick geen dagh meer. Ick gae direct\
    \ op Lion. Orleans, Saumeurs en andere plaetsen moet ick al laeten vaeren. Ick sag garen\
    \ Geneve nu maer sie daer weinich kans toe. \n\nValerius a dieu seggende, soo bevinde ick\
    \ hij U Ed. grotelicks aestimeerde als oock Grevius en hij sal aen Grevius tragten te senden\
    \ Harpocration met de noten van S. broeder zal(ige)r op conditie als hij verseeckert is\
    \ van restitutie. \n\nHier mede Godt bevolen verblijve U Ed. onderdanigen en dienswilligen\
    \ broeder L. Th. Gronovius. \n\nHier nevens mijn gebiedenis van onse susters en swagers\
    \ en Grevius en alle andere vrienden. \n\nMaendag 25 sept(ember) n(ieuwe) stijl 1679."
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 28-11-1679
