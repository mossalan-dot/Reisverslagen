  opmerking: Ms. VAvW 1272, no. 4, fol. 1.
  tekst: "1r] Mon Tres-Cher et Tres-Honoré Frere, \n\nDe brieven worden alle wel bestelt en\
    \ tot antwoordt van uwen laetsten van den 26 juli dien <> dat ick met compassie sie de nootsaeckelickheijt\
    \ van dat ons Vaderlandt soo een veelen CCste penning weder begeert heeft en dat U Ed. die\
    \ voor den 1 aug(ustus) betaelt heeft. Bedancke U Ed. hooglick, versoecke geliefs te continueeren\
    \ met diergelijcke voorsigtigheijt over mijn saecken. Morgen sal mij Cappelen doen tellen\
    \ 15 scudi. Een scudi is tot Florence 10 schellingen en een half, doch tot Romen was hij\
    \ maer 10 schellingen Hollants gelt. Voort hebbe geweest sonder credijt bij sigr. Cappelen\
    \ en U Ed. moet ten eersten Sigr. De Bannis laten schrijven een credijt voor mij aen Sigr.\
    \ Cappelen tot 200 rixd(aelders) boven dese 15 scudi. Gelieft dit niet te vergeten. Sigr.\
    \ Cappelen maeckt swarigheijt van 60 rixd(aelders) voor mij te tellen. \n\nIck moet gaen\
    \ slaepen en de oogen doen mij seer uit de Laurentiana komende en daerom kort schrijve,\
    \ doch kan niet naerlaten U Ed. te bidden om voor mij te kopen sulcke twee obligatien ijder\
    \ van 1000 g(ulde)n. Van Guerven, soon van de advocaat Las, op de Breedestraet of noch twee\
    \ klercken in de secretarie souden U Ed. in een uur konnen helpen en tot Amsterdam Elzevier,\
    \ Gaesb, of Pincior souden best daer van kennis hebben of de pedel. En nu ick dese winter\
    \ hier blijve om mede voor U Ed. te arbeiden en alsoo een half jaers seeckerlick noch van\
    \ huys blijven soo versoecke, etc.\n\nDe collatie van Strabo sal daer door eenigsins versagt\
    \ worden. Ick ben in het agste boeck. Hier nevens van Herodotus int agste boeck staet ΗΓΟΔ\
    \ met een lenis, doch in alle andere MSS. en eenige plaetsen van dit MS. is alti vides.\
    \ Viaggio del Carolo Magni is een verhael van rencontres sonder de minste geleertheijt.\
    \ Itaque non emam. Verle versoekt te hebben sijn Anatomia tot Amsterdam int latijn gedruckt,\
    \ als in de cataloog van Francfort gesien hebbe. U Ed. gelieve dit boecken te kopen en te\
    \ senden bij stucken met gelegentheijt of wanneer U Ed. mij schrijft. Victata in Grotium\
    \ gedruck te wesen. Ben daer over verset. Ick soude mijn sentiment seggen, hadt ick geweten,\
    \ voor soo veel het mij toekomt. Ick ben gefrustreert nu van mijn troost tot eenige herstellinge\
    \ van mijn groot erreur en schaede. Mijn beste oogmerck en perle voor de MSS. is mij nu\
    \ ontvallen. Van alle de rest van de MSS. kan U Ed. nu wel disponeren naer sijn welgevallen,\
    \ alsoo ick daer sulcke aestime niet voor hebbe. Ick kan niet weten waerom dat ick sulcks\
    \ niet mocht weten, dat ick immers deselve MSS. soo duur betaelt hebbe als U Ed. dat het\
    \ gedruckt wort en van de menschen gelesen is goet maer etc. Mijn oogen n(on) permittunt.\n\
    \nVale en groet U Ed. Liefste. Unus Grotius debetur Principi <stro>: alter Magliab(echi)\
    \ en damnu(m)\n\n[Naer vier weecken sal gelegentheijt wesen tot Livorno. Sal ick gaen? Versoecke\
    \ antwoort. Iteru(m) vale 27 Aug(ustus). Doch vergeet de wissel niet tot 200 Rixd(aelders).\
    \ Ick gae of te niet is altijt goet dat het daer soo blijft staen, doch soo mijn silver\
    \ te kort valt, tast maer vrijelick mijn gout aen. De mande met het schip Isabella, schipper\
    \ Verburg: vragt sal wesen 1 g(ulde)n 10 c(en)t sonder avarie. Moest haest daer wesen. Behaegt\
    \ U Ed. Liefste de confecturen van Tivoli? Iteru(m) Valete et civite felices."
