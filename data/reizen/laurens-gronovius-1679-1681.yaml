  opmerking: "Ms. VAvW 1272, no. 2, fol. 1. \L\nSynopsis: Gronovius informs his brother of his\
    \ attempts to get an audience with Louis XIV and asks for letters of recommendation, addressed\
    \ to Colbert and count Montausier. Bigot advises him to improve the bindings of the Tacitus\
    \ edition. He hires a private tutor to improve his French. Gronovius relates an anti-Dutch\
    \ rumour he heard while visiting Ménage (see excerpt). An acquaintance from Leiden will\
    \ travel to Orléans and Gronovius asks if he should join. He also discusses the possibility\
    \ of travelling to Italy. He informs his brother about Étienne Baluze’s recent publication\
    \ of Firmianus’ Lactantius and his own poor health."
  tekst: "[1r] Mon Tres-Honoré et Tres Chere Frere,\n\nMr. Friederich seide mij dat Mr. Thevenot\
    \ grote kennis hadde aent Hof, waerom ick wagtende nae S. Ed. ben ick gisteren de tweede\
    \ mael bij Thevenot geweest en gevraegt nae goeden raedt in onse boecken over te geven,\
    \ alsoo ick meen hij onsen vriendt is. Ick vroeg S. Ed. of hij geraden vondt dat U Ed. schreef\
    \ te gelijck an Colbert en Montauser. S. Ed. seide van jae en voor al aen Montauser. Dese\
    \ twee brieven sal ick van U Ed. verwagten met de eerste gelegentheijt, waer nae ick de\
    \ Tacitos aen Thevenot sal overgeven om die alleen (of ick met hem dat ick wel niet geloof)\
    \ tot Versailles aen Montauser te presenteren. Thevenot heeft mij oock belooft libru(m)\
    \ Valerii. \n\nKonde ick Frans spreecken, ick was wat geluckiger. Ick hebbe alle dagen een\
    \ meester bij mij. Kost een pistool smaendts. Bigot heeft grote sin in gout op te wisselen.\
    \ Hij klaegt over de slordigheijt van tbinden van de Tacitus en raedt mij deselve te veranderen,\
    \ dat ick moede sijnde te horen nae ontfang van uwe brieven terstont andere mesures sal\
    \ nemen. \n\nEergisteren was ick in de conferentie van den abt Menage, daer een monnick\
    \ verhaelde datmen in Hollandt luiden uit de collegien die niet en behaegden terstont voorstelde\
    \ of een beecker vergift of een publike schandale doot en dat hem dat van een goedt coopman\
    \ gesegt was. Daer wiert noch gelesen eenich pasquil op de Hollanders. \n\nThe day before\
    \ yesterday, I was in a meeting with abbot Ménage. A monk told the story that people from\
    \ the colleges in Holland, who do not receive approval, are told to either drink a goblet\
    \ of poison or to face a public, scandalous death. This was told to him by a good merchant.\
    \ Many a broadsheet is written here about the people of Holland.\n\nIck heb daer joncker\
    \ Goes gegroet. Ick hoop mijn eerste brief U Ed. wel behandigt is. U Ed. brieven mosten\
    \ geaddresseert worden au Fred(ericus) Michielsen chez Mr. Pefferin apotecaire nae St. Margariete,\
    \ Faubourg St. Germain. Desen heer sal altijt weten waer ick ben, want over 12 dagen sal\
    \ ick weder verhuijsen en soo altijt tot dat ik eerlicke luiden vinde. Ick hebbe hier eenen\
    \ Leijenaer, Huijbregt Med. D. en groot vriendt van Melder, Cranen en Drelincourt, met een\
    \ knegt. Hij maeckt staet oock nae Italien te reysen, soo dat wij wel licht samen mochten\
    \ gaen. Sijn broeder woont op de Breedestraet, naest Eleman, niet de burgem(eester). Hij\
    \ is seer wel, als alleen dat hij over een maendt Parijs meent te verlaeten en nae Orleans\
    \ te gaen om sich daer wat langer op te houden. Soude ick soo ras dat oock doen? Hij versoeckt\
    \ mij wel met hem. \n\nMr. Renaudot is tot St. Germain Dr. Med. wonende niet eigentlick\
    \ in Rue Honoré maer in een straetien daer in lopende. Kent ghij niet Steph(anus) Ballusium?\
    \ Edidit Miscellanea in quibus integer liber lactantii de... etc. Bigot prijst hem seer.\
    \ Hier is mevrouw Drelincourt, die Mr. Huijbregt besocht heeft, dat haer welaenstondt, doch\
    \ haer man heeft dat op Huijbregt door een brief versocht. Dese dame heeft gesegt mij gesien\
    \ te hebben en wel te weten dat ick te Parijs ben. \n\nIck hebbe weinich gesonde dagen tot\
    \ noch toe gehadt dat mij een gedagten gaf te retourneren, nu vinde ick mij wat beter. Ick\
    \ mach dat niet schrijven. Het is mij altijt genoeg als ick weet dat het met U Ed. wat beter\
    \ gestelt is. Hier mede Godt bevolen en Van Alsem sal een groote kaerte van Parijs van de\
    \ laeste druck van mij mogen verwagten, sijnde van sins die dubbelt over te stuuren, alhoewel\
    \ se duur is. Iteru(m) vale.\n \nDie 22 Juni 1679 sum [tuus] qui fui semper Laurentius Theodorus\
    \ Gronovius\n\LWat reedt ghij van een reysken nae Italien, of niet en in wat tijt? Iteru(m)\
    \ vale."
