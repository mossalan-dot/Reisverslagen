  tekst: "[1r] Mon Tres Cher et Tres-Honoré Frere,\n\nTot antwoort van uwen eersten brief noch\
    \ in Paris door Mr. Friederich ontfangen (dien ick t port betaelde. Hij beloofde U Ed. te\
    \ antwoorden. Hij seide mij eens besich te sijn met een Hoogduits tractaet de Chiromantia\
    \ in t Frans te setten, versogt mij U Ed. te vraegen of Elzevier of een andere drucker op\
    \ eerlicke conditien daer geen lust toe hadden. Nae eenigen tijt hebbe ick S. Ed. geantwoort\
    \ U Ed. daer geen drucker toe kon vinden. Of hij daer weder oock om geschreven heeft aen\
    \ U Ed?). Dient [tot antwoort, red.] als dat ick van onse jongste suster niet meer durf\
    \ schrijven, sijnde die [saeck] te teer en al te onmatuur. Versoecke vergetenis. Met gelegentheijt\
    \ sal ick wel verwagten haere begeerte, doch behaegt U Ed. de propotie tussen de juweelen,\
    \ t huwelicks goet? Het kan wesen dat de kinderen wijser sijn of sick inbeelen te sijn als\
    \ haere ouders, want onse ouders hebben anders gedaen. \n\nDe juffer die ick gesproken hebben\
    \ etc. is Crucii Galatae en Vogelaer is een man daer geen staet op te maecken is. Nu sij\
    \ U Ed. niet en raeckt, valeat. Van het Noordeinde kan U Ed. sagtjes aen mij schrijve(n),\
    \ alsoo ick haere deugden beminne. Ick hadde gewenst ander antwoort U Ed. mij van Deventer\
    \ in taldereerst hadt laten toekomen, daer U Ed. [schreef] dat ick dat al te licht veragt\
    \ hadde of diergelicks. Seecker ick hadde voorsigtiger geweest en sij kon U Ed. doe wel\
    \ bekent wesen, daer haer gebreken geensins heimelick sijn, maer eer haere deugden en onse\
    \ suter konden U Ed. haer wel beschrijven. Nu dat is verbij en verre van mij ut invito tibi\
    \ obtuiderem. Verder dat ick omtrent Paessen aen Couw particulier gevraegt soude hebben\
    \ nae een juff(er) van Rotterdam, dat ick dat weet gedaen te sijn sonder de minste uwe kennis.\
    \ Is gant niet waer. Couw velde mij gedurich aen de ooren van trouwen en ick most met hem\
    \ disputeren altijd bijkans, waerom dat ick selver niet en trouwde. Hij doet niet wel dat\
    \ hij dat in mijn afwesen seijt en ick hebbe niet konnen dencken dat U Ed. buiten Leijden\
    \ of Den Haegh soude trouwen, jae ick hebbe groote swaerigheijt daer voor of sij Rotterdam\
    \ al sal willen verlaten en oock goederen soo verre van Leijden gelegen en misschien huijsen\
    \ en landen. Die sijn seer swaer om te administreren. Nu ick kenne haer gans niet. Hadde\
    \ gewenst daer nae gevraegt te hebben. Ick soude misschien dan soo lang niet wagten met\
    \ antwoort. En naedemael ick haer Ed. niet en kenne, soo kan ick daer niets van schrijven.\
    \ Versoecke maer U Ed. gelieve voorsichtich te wesen in soo een saeck, want multi gaudebunt\
    \ soo U Ed. mis tast, en misschien meer als U Ed. selver weet, waer voor ick eenige vrees\
    \ hebben. Vorder daer is soo veel en wat hebbe ick meer van noden? Dese laeste tael gelt\
    \ bij mij niet met al [in persona patris familias]. Ick soude met vele redenen en droevige\
    \ exempelen deselve tael konnen impugneren. Het behaegt mij beter dat U Ed. in den laesten\
    \ brief schrijft ‘ick sal voor mij sien’, hebbende voor ogen soo een droevich exempel van\
    \ prof. Coeman, en wat is ons langer tijt belooft? Nu van dese saeck verwagt ick geen brieven\
    \ meer en soo U Ed. dat wil voorsetten, ick magh het wel lijden, en of ick h<>len  magh\
    \ of niet, U Ed. is meester in die saeck en U Ed. sal daer moete <> leven en sterven. En\
    \ soo haer Ed. begeert [ick soude U Ed.  bidden matig te wesen in juwelen, en alsoo sij\
    \ buiten twijfel genoeg juwelen sal hebben van hare ouders, haer Ed. te regaleren met silverwerck\
    \ dat U Ed. heeft of eenig gout. Juwelen is een groote luxyrie in ons vaderlant en int jaer\
    \ 1672, 73 en 74 menich mens tot armoede heeft gebragt, sulcke tijden konnen weerkomen.\
    \ Daer is ijmant die het sien sal soo U Ed. dese saeck niet bedagtelick overlegt en meer\
    \ regart neemt op u eigen begeert als uwe erfgenamen. Sed ignoree mihi nimiu(m) libero.\
    \ Deus opt(imus) max(imus) geve U Ed. goede sinnen en sijnen segen in soo een saeck.]\n\n\
    [1v] Te weten mijn willen, respondeus quaeso, omnia mihi placere et me minorem libenter\
    \ parere maiori. Vintimiglia bij Genua sijnde en ick tot Turin geen lust hebbende om vier\
    \ pistolen te geven nae Genua en 4 van Genua op Milaen, hebbe ick Genua agtergelaten, soo\
    \ dat ick Aprosius niet hebbe konnen spreecken, sijnde gereist met een caros van Turin op\
    \ Milaen. \n\nWat uwen tweden brief belangt, doleo sortem, nostrae maioris en haere gesontheijt\
    \ vermindert geweldicht. Verlange te horen haere eenige blijdtschap mach geboren sijn. Ben\
    \ meer perplex over U Ed. alsoo die koors slimmer is en de oorsaeck gans swaer om te genesen.\
    \ Ick weet niet dat ick oijt koorsich geweest ben of altijd heeft mij ijmant van ons gevolgt.\
    \ Nu of dat oock soo is, altoos tot Geneve omtrent 12, 13 en 14 oct(ober). Wat later als\
    \ U Ed. was ick van hem besocht en met een scherpen hoest vermengt, doch dat quam alleenlick\
    \ omdat wij 3 a 4 dagen in gedurigen regen te paerdt geseten hadden in de Alpes, waer door\
    \ ook mijn valijs door nat wat en al mijn linnen bedorven, doch tot Geneve mijn lichaem\
    \ gekoestert hebbende, is alles verdwenen en ben nu in goede gesontheijt, die ick van herten\
    \ wenst U Ed. mach genieten. Altoos ick verlange te weten hoe het tegenwoordich met U Ed.\
    \ gesontheijt gelegen is. \n\nNu d’ordonnantie buiten onsen wille is afgelost, is alles\
    \ wel, doch soo U Ed. eenige gelegentheijt weder voorkomt, gelieft niet te versuimen, maer\
    \ geensins dat U Ed. daerom moeijten aenwent of alle mensen bekent maeckt. Het sijn saecken\
    \ die stil moeten geschieden of het behaegt mij niet. Nu of ick segge datmen met Rouse sal\
    \ regten, is vergeefs, doch een ding sach ik dan noch garen: datmen effen was en niet int\
    \ rouwe die 100 ducatons ontfing en liever wat minder ontfing indien die 100 ducatons oneffen\
    \ somme maecken. Nu watter geschiet moet ick patienteren. Hadde ick geweten Elzevier niet\
    \ meer als 100 gl. soude eijsschen, ick hadde meer genomen. Hij seide daer [is] 120 gl.\
    \ Ick seide Frans geldt, XI pistolen en een gl. aen silver. Is net 100 gl. in Hollandt.\
    \ Ick bedanke hem voor sijn dienst en U Ed. voor de moeijte om dit gelt te tellen. \n\n\
    Tot Paris hebbe ick een Livius (en 3 sijn bij mij hier), kostelick laten binden, S(ijne)\
    \ K(oninklijke) M(ajesteit) met uwe oratie en de Lege Regia, die Huetius sal presenten.\
    \ Hij is geleert en groot aent hof en seer gewellich tot die saeck. Ick wenste U Ed. hem\
    \ familiaer was. Ick hebbe tot Paris geen beter discoursen gehoort als van S. Ed. Ben verwondert\
    \ de Livius gedruckt te worden Delphine, daermen mij seide Tijpographia Regia stil stont.\
    \ Noch hebbe ick uwe oratie kostelick laten binden Colberto, Duc Monto en Huetio. Ick ben\
    \ verobligeert ipsi ducis alsoo hij wonderlick wel alle gelegentheijt waernam om etc. waer\
    \ door ick S. Ed. niet genoeg kan bedanken. Noch bragt ick een ongebonden voor Menage en\
    \ Bigot, die ick de knecht langde, alsoo ick geen tijt hadde om haer Edd. te spreecken.\
    \ Een ongebonden gaf ick aen Thevenot, die U Ed. bedanckt en onse vrient is. \n\nOp mijn\
    \ reijs hebbe niet konnen schrijven, soo groot waren de ongemacken en schelmstucken van\
    \ voerluiden. Ick ben wel gelogeert geweest, alwaer een uurt te voren 4 gespo>erden personen\
    \ waren geweest, doch ick ben gesalveert en mijn mi<> ongemack en dat ick bedrogen was,\
    \ is [2r] geweest in Apennino. Geen wonder hoe nader ick aen Parnassus quam, hoe spitser\
    \ en scherper hij moet geweest hebben. \n\nIck quam wel den 22 nov(ember) nae middag in\
    \ Florencen, doch doe ter tijt hadde ick niets bedogt waer mede ick Musani(m) praeside(m)\
    \ incomparabil(m) soude begroeten. Ging alsoo meditatus. Den 23 ad monte(m) Parnassu(m)\
    \ en met eenige vrees bevangen sijnde en willende groeten ipsu(m) praeside(m), soo occupeerde\
    \ hij mij et admittebat in omnia sacra penetralia etiam illustratum, et dat niet genoeg\
    \ sijnde vult me ducere per omnes Musano(rum) domos, doch alsoo hij een fluxie hadde aent\
    \ been, waer deur bij belet was uit te konnen jn aliud tempus distulimuti. Nu sijn twee\
    \ Livius te vinden aenu(m) alteru(m) [sibi] daer S. Ed. met gewelt mij wil bij leiden, alhoewel\
    \ ick mij excusere, sed postea de ea re. \n\nS. Ed. gaf [mij] U Ed. brief van den X oct(ober),\
    \ waer door ick ongerust ben over uwe gesontheijt, te meer kennende uw lichaem als mede\
    \ S. Ed. en wij waren in eene sin. Sij was opgebroken van de port en geparfumeert om oorsaeck\
    \ van de sieckte. S. Ed. liet mij sijn brief oock lesen sed nimis indulgebus commendationes\
    \ nec tantis mihi altribus. \n\nNu ick hebbe noch geen gebreck, maer <>mijn pistooltjes\
    \ gaen nae het einde, waerom ick versoecke U Ed. gelieven sal met de eerste of tweede post\
    \ als U Ed. best sal konnen wagten mij met een wissel te versien tot 200 rixd(aalders) niet\
    \ hoger, maer eerder dat in schrijven, dat ick 100 of 200 of 300 gl. mach halen van de koopman\
    \ en tot 200 rixd(aalders) incluijs of daeromtrent. U Ed. kent hier de munte en daerom niet\
    \ meer toe dat ick niet al te veel voor wissel tot opgelt geve. Ick wilde dese wissel liever\
    \ in Florence hebben, hope d’Heer le Plaa dit wel sal konnen effectueren, dien ick vriendelick\
    \ laet groeten. \n\nIck logere alla Croce Blance. Of ick daer lang sal blijven weet ick\
    \ niet, vertrouwe wel van [neen]. Is seer verre van Magliabecqui. Nu wat gaf U Ed. wel daegs\
    \ in sijn logement, prope S. Lorenzo? Magl(iabechi) vraegt mij waerom U Ed. mij niet eenige\
    \ boecken hebt opgeschreven om te confereren, dat ick dan als noch verwagte, doch hebbe\
    \ niet een goet gedruct boeck bij mij. U Ed. soude best doen de brief te addresseren aen\
    \ Magliabecqui, die altijt sal weten waer ick ben. S. Ed. wil mij een andere camer verschaffen.\
    \ Ick hebbe hier noch niets betaelt. Hebbe wel gevraegt nae de reeckening, maer etc. Alewijn\
    \ van Deventer leeft hier noch. \n\nTot Lion hebbe ick Dr. Spon besocht. Hij is nu besich\
    \ met eenige inscriptien in fol(io) uit te geven. Ick hebbe tien a 20 bladen daer van gesien,\
    \ sonder dat ick weet of het nu niet stilstaet. Daer is ijmant die tegen sijn vojagie geschreeven\
    \ heeft. Hier op heeft hij Spon weder geantwoort int Frans, in (octa)vo en dat boeckjen\
    \ gaf hij Spon aen mij om aen Magliabecqui te behandingen, gelijck ick oock gedaen hebbe.\
    \ Het is hier vrij out.\n\nWensche U Ed. weder gesontheijt en verblijve,\n\nFiorenze, dindag\
    \ den 28 nov(ember) 1679 \n\nHeeft U Ed. Columella waer in het gedructe bladt van Balusius\
    \ door Elzevier ontfangen? Columna Antonini en oock Troiani sijn tot Romen voor IV jaeren\
    \ omtrent herdruckt cum notis, soo ick gele<> [weet] uijt deselve over te sende aen U Ed.\
    \ emam."
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 05-12-1679
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 8, fols. 2.
  tekst: "[1r] Mon Tres-Cher et Tres-Honoré Frere\n\nIck wil niet twijffelen of mijnen vorigen\
    \ van den 28 nov(ember) sal U Ed. wel behandigt wesen, waer in ick antwoorde op uwe vorige\
    \ twee brieven als mede een wissel versoecke omtrent 100 of 200 ricd(aalders), die ick als\
    \ noch verwagte, want mijn gelt seer vermindert is en die wissel sal [ick] oock maer ligten\
    \ als al mijn gelt sal opwesen. Ick hope U Ed. dit wel sal konnen te weeg brengen door d’heer\
    \ le Plaa aen Fontaine tot Livorno en Fontaine heeft hier sijn correspondenten die het mij\
    \ hier konnen tellen. \n\nVoors ben ick den 3 dec(ember) ter audientie geleijt, alwaer S(ijne)\
    \ Hoogheijt alleen stont oock ongedeckt. Ick was daer noch eens met Sr. Magliabecqui geweest,\
    \ doch als doen het te laet werdende, gingen wech, het welck ter ooren van S(ijne) H(oogheid)\
    \ komende, qualick heeft opgenomen en indien het S(ijne) H(oogheid) als doen was te de deegh\
    \ aengeregt geweest, soude terstont audientie verleent hebben. Nu ick was den 3 nov(ember)\
    \ soo ras niet op t hof gekomen, of d’andere heerren mosten wagten en mij voor haer laten\
    \ passeren. Voor S(ijne) H(oogheid) komende, wilde mij ten eersten verwellekomen en sprack\
    \ “O Gronovius”, waer op mij 3 mael buigende et seren(issim)ae cels. princeps venia(m) prae[fationis]\
    \ etc. Tot omtrent een quarter uur, horende S(ijne) H(oogheid) mij met groote genegentheijt,\
    \ & ut puto, placui. Onder dese oratie de Livius overlangende, ontfingse S(ijne) H(oogheid)\
    \ met sijn eigen handen en soo nederleggende tot ick gedaen hadde, kreeg hijse weder in\
    \ handen en mij daer nae heel familiaer aenspreeckende, vroegh mij naer U Ed. en soo in\
    \ de Livius eenigsins bladende en siende Dedicatorium et Magliabecqui nomen lagte S(ijne)\
    \ H(oogheid) en seijde “de patrono nostro”, dat ick soo drae niet weder gekomen wesende,\
    \ S(ijne) H(oogheid) beloofde selve tot Munster te refereren.\n\nDaer mede ging ick weg\
    \ en nae mij een geleert monnick, [Nicolaus Bartorinus sorius confessionavii Pontificis],\
    \ oock audientie verkregende hebbende en S(ijne) H(oogheid) begroetende, most hij onverhoopt\
    \ wech gaen en dien avont spendeerde S(ijne) H(oogheid) tot de Livius. Daer was uwe oratie\
    \ oock bij, die S(ijne) H(oogheid) oock doorblaedede als mede de Lege Regia, alles op de\
    \ rugge alleen vergult, seggende mij Magliabechi dat het alsoo S(ijne) H(oogheid) behaegde.\
    \ Terstont daer op wierdt ick geregaleert uit de naem van S(ijne) H(oogheid) met 12 boetellies\
    \ schone wijn, waer van dien avont op S(ijne) H(oogheid) als mede Grevius en U Ed. gesontheijt\
    \ droncken met Magli(abechi) en dien monnick (hij is seer welspreeckende. Kent U Ed. wel\
    \ en is seer goed Latijn dat hij segt. Hij wil een boeck laten uitgaen in t Italiaens waerin\
    \ U Ed en Grevius sullen gepresen worden) en dan noch een Dr. Gioianni Battista Verle, die\
    \ mij sijn tractatien De anatomia oculi gegeven heeft, int Italiaens geschreven. \n\nNu\
    \ kan ick de banden niet betaelen van de Livius, willende mij Magl(iabechi) niet seggen\
    \ hoe veel die kosten en in alles hij, Magl(iabechi), is al te beleeft en durf daerom hem\
    \ niet meer afvergen, als S. Ed. mij selver presenteert, anders soude ick versoecke de Pandectus\
    \ Florentinas, die ick [1v] als noch verlange te sien en S. Ed. mij belooft heeft te verschaffen.\
    \ Ick hebbe noch Laurentiana Bibliotheca van binnen niet konnen sien, als alleen de cataloog,\
    \ die mij wel aenstaet, en is hier wercks genoeg te vinden soo men maer tijt hadde. Een\
    \ Dr. Cinelli heeft mij oock de eer gegeven van te besoeken. \n\nTot Romen is gedruckt een\
    \ discours van een bladt in quarto over de Stephanus van Pincebo als mede uwe noten int\
    \ Italiaens en voor andere boecken, doch de Stephanus gaet voor [et laudatur maxime]. Dit\
    \ Magliab(echi) voor 3 a 4 dagen van Romen gestuurt wesende, liet hij het mij sien en ick\
    \ versocht het te mogen lesen, dat ick als noch verwagte.\n\nTot Milaen is de bibliothecaris\
    \ beleeft en is een liefhebber van schilderijen en andere beelden, die hij, bibliothecaris,\
    \ mij liet sien, doch de boecken sag ick maer van verre, waerom de cataloog eijschende,\
    \ vont daer een Polijbus de Bazelze druck doorgaens gecollationeert en voor een int Italiaens\
    \ stont genoemt unicu(m) exemplar Alexandrii nuovae, aliud Alexandri Justiniani Chij, aliud\
    \ Florentiae a Barbadoro. En achter [dat boeck] codex Sambuci, soo als Mezzabarbe voor mij\
    \ op mijn versoeck uitschreef. Op alle bladen stonden van variae lectiones, maer niet uit\
    \ Wiens MS, noch oock niet of 2 a 3 MSS. over een quaemen. Waerom dan ick nae 2 a 3 dagen\
    \ den bibliothecaris weder begroetende, versocht ick de Polijbus nader in te sien, doch\
    \ hij excuseerde, maer indien ick over 3 a 4 dagen wilde weerkomen dat hij mij dan dat boeck\
    \ wilde laten sien. Is wel Magliabecqui vrient, doch is van Magliab(echi) wel bekent. Nu\
    \ soo U Ed. dit noodich acht nader te hebben uitgeschreven, moet ick dat bij tijts weten\
    \ om mij daer nae te reguleren int weerom komen, want anders kome ick niet weder tot Milaen.\
    \ \n\nMezzabarbe tomo nobilis et amicus Magliabecqui est istius bibliothecarii dede mij\
    \ eenige vriendtschap, want Dr. Spon tot Lion gaf mij een brief mede aen S. Ed. Hij Mezzabarbe\
    \ is besich met Occoniis numismata per columna(m) edita te verbeteren en te augmenteren,\
    \ hebbende ongelooflick veel penningen en alles seer curieus en net op onder in sijn cabinet\
    \ geleijt. \n\nIck sal wel altijd verblijven alla Croce Blanca, soo lang ick tot Florencen\
    \ ben, sijnde tamelick wel, en de luijden mij gedienstich. Den hospes is een Duijtser en\
    \ nae ick uit de eerste reeckening bemerck, eenigsins civil en de luijden eerlickm soo dat\
    \ U Ed. sijn brieven nu direct kan addresseren aen mij, sijnde dit huijs [2r] oock wel bekent.\
    \ De naem van de straet weet ick niet. Soo U Ed. sijn brief adresseert aen Mr. Magliabecqui,\
    \ sal hij het port betalen en van mij niet willen wederhebben, dat al te civil is. Jae,\
    \ hij heeft mij door een brief aengepresenteert en gelt en boecken en alles. \n\nS. Ed.\
    \ seijdt mij van een historie van de Biblioth(eca) Laurent(iana) die hij daer gevonden heeft\
    \ in Hollandt te willen laten drucken om dat Pontifex Max(imus) et Cialli daer in verhaelt\
    \ worden en versoeckt mij of ick die weet over te brengen, die ick wel seeckerlick sal mede\
    \ [nemen] in mijn valijs soo S. Ed. dat begeert. Het Latijn segt S. Ed. is treffelick wel.\
    \ \n\nNu wenste ick U Ed. eenige boetellies wijn toe en hebbe daerom gesocht nae gelegentheijt\
    \ onse nae Livorno te senden, doch men seijdt mij deselve de zeelucht niet kan verdraegen.\
    \ Evenwel soo daer weer wat komt sal ick niet naelaten deselve over zee aen U Ed. te senden.\
    \ \n\nNu hebbe ick even een uur of wat gepraet met onse vriendt Magliab(echi) en seijdt\
    \ mijn camer te wesen daer S. Ed. Alexander Morus sieck seijnde besocht. Et Liviu(m) tertium\
    \ destinat Barberino, doch de banden te betalen is nu vergeefs en ben beschaemt daer over.\
    \ Als ick de wissel sal hebben, sal ick misschien wel haest nae Romen reijsen en daer kopen\
    \ Columna Traiani en Antonini en oock andere soo U Ed. begeeren sal en dan weder nae Florencen\
    \ keeren, en soo nae Venetien weder naer huijs. Of U Ed. ijets anders noch begeert, gelieft\
    \ het in tijts te laten weten, want nu schrijve ick niet weder voor dat ick antwoort hebbe.\
    \ Mr. Magliab(echi) wilde oock wel antwoort wederom hebben van U Ed. dat ick niet weet of\
    \ geschieden sal konnen, soo door U Ed. onpasselicheijt als menichvuldige occupatien, doch\
    \ vergeet niet mij te laten weten uwe constitutie van t lichaem hoe die nu gestelt is, daer\
    \ ick seer voor becommert altijd ben geweest naer tlesen van uwen laetsten, doch hope met\
    \ de verandering vant weer dieselve oock sal verandert wesen. Soo niet, blijve liever te\
    \ Florence en lope te post weer naer U Ed., want mij daer te veel aengelegen is. \n\nIck\
    \ hebbe hier noch niet eenen dagh nevel gesien als in Hollandt, waer over mij ten hoogsten\
    \ verwondere in dese tijt, het hier soo een schone en droge lucht te wesen, doch vinnich\
    \ kout. \n\nHier mede Godt bevolen nae mijn hertelicke groetenisse aen U Ed. en onse susters\
    \ en heer Grevius als andere vrienden verblijve,\n\nDe principe quam largissime scripsi\
    \ uit scives omnia sese bene habere, sed nulli alii debes illa significare, nisi principe(m)\
    \ benigne nos respicere et quam benissime. Iterum vale. \n\nDen 5 dec(ember) 1679. \n\n\
    U Ed. onderd(anige)  en dienstw(illige) dienaer en broeder,\nLaurentius Theod. Gronovius"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 12-12-1679
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 9, fol. 1.
  tekst: "1r] Mon Tres-Cher et Tres Honore Frere,\n\nDoor desen ingeslotenen vinde mij genootsaeckt\
    \ oock desen aen U Ed. te addresseren, sijnde den derden brief van Florencen en ick wil\
    \ niet twijffelen of mijne twee vorigen sullen U Ed. wel behandigt wesen, waer in ick versoecke\
    \ een kleine wissel, daer ick wel niet nae vaste, maer evenwel om verseeckert te konnen\
    \ sijn etc. En nu eerst krijge ick blijde boodschap van de Pandecta daer al 3 weecken gepasseert\
    \ sijn, doch aen princen hoven etc. Roept niet al te seer van dese eer. Het is een groote\
    \ eer voor ons, maer het past niet dat wij dat an de klock hangen. \n\nDat ick vergeten\
    \ hebbe, is dat U Ed. gelieven sal d’heer adv(ocaat) Van der Marsche seij die noch in Den\
    \ Haeg woont of Mr. Cobmoijer de ouste, of d’heer adv(ocaat) Limborg of imant anders die\
    \ in Den Haeg woont en sorichvuldich is, dat hij mij gelieve te laeten recenseren op den\
    \ eersten dag nae de vacantie van nieuwe jaer bij de secretaris Van Alphen op de volle op\
    \ koppeltjesmaendag, gelijck de manier is van de advocaten. Daer is mij veel aengelegen\
    \ dat dit niet versuimt wort, met name Laurentius Theodorus Gron(ovius) dat U Ed. op een\
    \ briefje gelieve te schrijven en dat briefjen dan geven aen die mij sal laten recenseren.\
    \ Nu sal ick wel niet eerder nae Romen gaen of wil afwagten U Ed. antwoort op desen senza\
    \ inaugio scriva a S.A.S. en ick of Sr. Magl(iabechi) (want ick doe niets sonder S. Ed.\
    \ weten en soo als hij goedt vindt, schicke ick mij in alles) salse overgeven. Seecker ick\
    \ hadde eenige vreugt, om dat ick geloofde alles wel afliep, maer hadde daer nae lassigheid\
    \ genoeg en t was niet wel gemackelick voor mij sulcken werck en als ick het verbij kan,\
    \ wil ick liever andere dat overlaten en heeft mij oock eenige nagten sonder slapen gekocht,\
    \ doch valeo et bibo vinum nunc generosissimu(m). \n\nIck vinde hier veel MSS. wel, doch\
    \ evenwel soo heel out niet. Ondertussen ben ick wat besich te confereren A. Gellius in\
    \ Bibliot(heca) S(an) Marci in charta. Of U Ed. dae oock gecollationeert heeft weet [ick]\
    \ niet. Elzevier moet U Ed. oock nootsaeckelic laten weten wanneer ick te Romen ben en nu\
    \ met gelegentheijt dat ick te Florencen ben, want ick vinde mij verobligeert aen S. Ed.\
    \ tot Paris en hij, Elzevier, versocht van mij te weten wanneer ick in Italien mocht wesen\
    \ en nu late ick mijn dienst aen S. Ed. presenteren. \n\nIck verlange te weten U Ed. gesontheijt\
    \ en voors soo daer wat nieuws is. Ick bidde datmen doch nu en dan een maender nae vrouw\
    \ Lhaer tot Wie mach sturen, of oock haer int recht roepe, soomen [wette]lick sal vinden.\
    \ Och konde ick voor onse susters soo vorderlick wesen als het nootlot nu gewilt heeft,\
    \ dat sij mij konnen sijn, sij souden mij wonderlick gereet vinden en ten minsten daer resteren\
    \ noch jaeren voor t gemeen. Nu ick sal wel patientie gebruicken tot mijn wederkomste dewijl\
    \ ick moet. \n\nHier mede Godt bevolen en verblijve U Ed. onderd(anige) en diensw(illige)\
    \ broeder en dienaer\nFiorenze, dingdag den 12 dec(ember) 1679\n\n[Mijn dienst aen de heer\
    \ Grevius en d’adv(ocaat) Van der Marsche en alle andere vrienden,\n\nLaurentius Theodorus\
    \ Gronovius\n\n[<M>ijn pacht tot Raelte sal in februario ut puto eindigen en ick wil geensins\
    \ een nieuwe pacht aengegaen <>toben buiten mijn presentie, hope dit sal agtervolgt worden.\
    \ Iteru(m) vale. Seeckerlick ick blijve wonen alle Croce Blanca.]"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 20-03-1680
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 10, fols. 2.
  tekst: "[1r] Mon tres cher et tres-honoré frere,\n\nIck ben ten hoogsten verblijdt dat mijne\
    \ droevige en sorgvuldige suspicien, gaende op de postdag altijt bij de patroon of hij geen\
    \ brieven hadde [en] van neen, vermeerderde mijn smerte, denckende of S. Ed. mij niet wilde\
    \ met eenige quade tijdinge ontrusten, daer Mr. Hybrecht mede sijn suster verloren heeft\
    \ en het moet al vrij hart tot Leijden gegaen wesen, daer soo vele bekenden gestorven sijn.\
    \ \n\nAl U Ed. brieven sijn wel bestelt. Voor de wissel bedancke U Ed. voor de moeijten\
    \ en ick hebbe al geschreven en oock antwoort. Ick sal dat gelt noch wel eenige maenden\
    \ bij Fontaine laten, want ick noch goiets genoeg bij mij hebbe en nu het gereet is, sal\
    \ ick wagten wanneer ick naer Romen sal gaen en Napoli. Doch wenste wel U Ed. wat meerder\
    \ contentement tot Deventer ontmoet was, doch ick wensche onse suster en onse swaeger veel\
    \ goedt toe. Meum iudicium daer is ergens copije van, maer ick weet nu niet waer ick het\
    \ gelegt hebbe en is een slecht klein papierken. Ick hope niet dat ick van haer gedwingen\
    \ sal worden dit te moeten veranderen. U Ed. is het onmogelijk gansch Deventer verbij te\
    \ gaen en ijder als mede voor mij moet U Ed. (sed pabeavit iociin reseria) ten minsten 500\
    \ gl. laten. Ick moet meer dan om etc., te meer daer Camener Nilant [heeft] gesegt nescio\
    \ op wat voor een vraegh, dat men fructus voor Trebellianica kan reeckenen en U Ed. kan\
    \ doen wat hem belieft, sed habet, en de onnoselen sijn genoeg geteickent, 500 het U Ed.\
    \ niet bekennen wil, U Ed. kan wel wijser vraegen, doch wetet dat het niet is al wat U Ed.\
    \ begint. En niet alleen in het Deventers goedt, maer oock al het andere. Wie U Ed. verwijt\
    \ van mij naer Italien geraden te hebben, soo ick mach weten wie, sal ick wel antwoorden,\
    \ doch mijn oogen souden tot Deventer meer vermaeck gehadt hebben en alle die leckernijen\
    \ als hier deselve te pijnigen met uijtgegetene letteren naer te speuren ende wil ick wel\
    \ ter bruijloft gaen maer met [aengenaemheijt]. Ick bedancke U Ed. van Rouse en dat is mij\
    \ nu bruiloft genoeg. Van de boecken te kopen en confereren sal ick goede memorie houden.\
    \ Al S. Al.S. sal de patroon U Ed. sijn brief wel behandigen, bedancke U Ed. voor de moeijten.\
    \ De patroon heeft U Ed. Noris boeckien tegen Garnerius in het packet gesonden, dat d’heer\
    \ Goes door Elzevier ontfangen heeft en ben verwondert U Ed. packet verloor[en] is, alsoo\
    \ het met een ende selve schipper gesonden is. S. Ed. sal mij een ander geven soo U Ed.\
    \ het sijne niet kan weder vinden van Elzevier, die hier een schult van Carlo Dati pretendeert.\
    \ U Ed. kan alle brieven aen mij eerst opbreecken en lesen of sij het oversenden waerdich\
    \ sijn, doch Elzevier wil ick wel helpen soo ick sal konnen. \n\nWat het proces van Lhaer\
    \ belangt: voor eerst kan ick niet wel noch resolveren om op mijne onkosten een geheel proces\
    \ [1v] te beginnen voor het gemeen en daer naer als het voor mij soude wesen wederom een\
    \ nieuw proces. Want nu ter tijdt soude men konnen ageren tot betalingen van de renten,\
    \ doch daer moeijten genoeg voor vallen sullen en onkosten, maer in januario soude ick weder\
    \ een proces moeten beginnen voor capitael, want nu ter tijt voor interest en capitael is\
    \ onmoogelick et ante diem causa cadit, en die onkosten hadde ick seeckerlick aen het been\
    \ te binden. Nu ick ben niet vervaert voor eenige onkosten te doen. Men mach seggen voor\
    \ mij of tgemeen hoe men will, maer in dese saeck kan ick voor al noch niet resolveren,\
    \ daer men nu maer soo een kleine pretensie wil kaelgen aen een proces. Ick sag liever datmen\
    \ Lhaer de wed(uwe) in nov(ember) daer capitael en rente te pretenderen sijn, met proces\
    \ of anders die saeck termineerde. Doch ick daer eens van gesprooken hebbende en wetende\
    \ wat mijn stem in tgemeen gelt, didici tacere. Ick meen voor een vierendeel jaers of eerder\
    \ van Lhaers verschijndag tot Hollo wel te huijs te sijn en hem het capitael met de rente\
    \ op te seggen en soo ick gesont te huijs kome, heeft niemant te twijffelen of ick sal hem\
    \ satisfactie daer van doen hebben ende niets doen sonder consent soo verre het gemeene\
    \ aengaet. Soo U Ed. anders oordeelten het de pijne waerdich acht nu een proces voor de\
    \ rente, tegen de verschijndagh weder een proces, ficet, ick mach het wel lijden, want alle\
    \ beide nu te gelijck is onmogelick. Horende dat Willem Nilant seijde van de stad Deventer\
    \ het capitael te konnen opseggen, soo hebbe ick hem daer ernstig naer gevraegt, maer hij\
    \ gaf geen antwoort. Focking, wie is de ander? Is die niet Willem Nilant, die soo onrechtveerdich\
    \ compromis hebben gesmeet en ick haer oock wel anders wil leeren, soo ick gesont te huijs\
    \ komen, doch ondertussen quantas molestias mij dat slach van menschen excitant. \n\nTegenwoordich\
    \ ben noch al besich met de Pandecten en sal noch drie weecken duren, soo langsaem gaet\
    \ dit werck voort en pas wel op als de sleutel gehaelt is alle dagen van de camer, daer\
    \ ick ben om te confereren te weten, somtijts daer het goet en silverwerck di S.A.S. is\
    \ en somtijts daer Il Sr. Marquese sijn verblijf tot Florencen heeft en altijt een oppasser\
    \ bij mij hebbe. Tot Pisa is men jaeloers daer over, dat mij dan meer doet oppassen en ben\
    \ in lib. 40 eerst. Als dit gedaen is, sal ick Epictetus eindigen en dan de andere boecken\
    \ daer U Ed. van schrijft. \n\nHet is niet wel mogelick voor mij alhier af te breecken en\
    \ naer Romen en Napoli te gaen, waer over oock met de patroon consulerende, segt eerst naer\
    \ de hitte naer Romen te gaen. En ick ben van meeninge seeckerlick oock Napoli dan aen te\
    \ doen. Mr. Hubrecht is op wech naer Napoli en dan naer Rome, gaet in juni naer Hollandt.\
    \ \n\nTegenwoordich ben ick oock gelogeert in Palatio Vecchio [2r], daer den marboren David\
    \ en Hercules aen de poort staen, soo dat nu wel bewaert ben. Doch mijn kost koopt voor\
    \ mij, die het gout en silverwerck aen aen de bekijckers alhier laet sien en hij sijn profijt\
    \ van mij hebbende, is wel te vreeden en ick oock met hem daer mij geen onkosten nu te duur\
    \ konnen vallen. De Stephanus Maffei is al weder naer Romen gesonden van de patroon. Ick\
    \ hadde garen gewenst of ickse hier eens mocht hebben tot Florencen, daer ick nu met gemack\
    \ ijets kan schrijven, doch de patroon segt als ick tot Romen sal [wesen] en daer sal ick\
    \ misschien andere dingen te doen vinden et ero in habitu pregrinanti. De patroon mij latende\
    \ wetende dat Noris mij te gast weder nodigde omtrent voor 4 weecken, soo seide ick aen\
    \ de bestelder dat ick de patroon wilde selver gaen spreecken en hem smorgens groetende\
    \ wilde ick mij excuseren, waer op hij mij geen verl<of> wilde geven, doch ick insterende\
    \ en dat het niet eerlick voor mij was en oock geen vermaeck bij Noris mij kon aendoen,\
    \ soo admitteerde mij de patroon, en ick quam daer niet, doch sonder de patroons consent\
    \ hadde ick niet gekont. Nu meene ick voor eeuwich van hem wel ontslaegen te sijn. Naederhant\
    \ als U Ed. brieven gekomen waren, heeft mij de patroon belast in de Laurentiana smorgens\
    \ te wesen, als dat doende soo komt S. Ed. met Noris en in sijn tegenwoordigheijt laggt\
    \ mij de patroon U Ed. aengenaemen, waer op oock met de patroon consulerende of ick Noris\
    \ noch eens in memorie soude brengen U Ed. gespreck [in de] Gallerie di S.A.S. Heeft hij\
    \ het niet willen hebben en bij Noris weest mij eenige versen in de bekende Virgilio achter\
    \ de Eclogas: dixtinxi emendaris grasum mihi munus amici sed sic succederi operi sedulus\
    \ incubus: succedens is het niet et havemus et sunt alicuius consulis. Omtrent 500 post\
    \ I.N. dat ick oock meene gans op te schrijven en is treffelick wel. De naem is mij vergeten.\
    \ Desen letteren van die vaersies is deselve character als de Pandecten. Alleen sijn sij\
    \ cleinder soo de ganse Vergilius geschreven is, met die letteren in somtijt titulus geschreven,\
    \ die even wel altemets istis litteris currentibus [oock] geschreven wort. \n\nMijn linnen\
    \ goet heel te niet en daerom sagh ick gaeren dat mijn ongebleickt linnen tot Deventer mocht\
    \ gebleickt worden nu in dese somer. Hier valt niet waerdich voor om te schrijven, waerom\
    \ dan oock niet dickwils kan schrijven, soo Elzevier een proces wil oversenden ick hope\
    \ hij het port ten minsten sal presenteren te betalen. De Livius destineert de patroon den\
    \ cardinael Cibo toe. U Ed. vers aen Patin heeft de patroon wel bestelt doch de patroon\
    \ segt U Ed. daer geen eer van kan hebben met Patin versen toe te sturen, daer hij Patin\
    \ tot Padua in weinich eer schijnt te wesen. \n\nIck ben gesont, als alleen dat ick kleine\
    \ hitte van dorst binnen in mij gevoele en meen nae eenige dagen dat te remediceren met\
    \ te slapen daegs, en tsavonts of snachts beter mocht gestelt wesen, daer mij dit soo swaer\
    \ niet [is] of ick kan die dorst wel eenigsins verdragen et miror causam. Verblijve naer\
    \ presentatie etc.\n\nFirenze, den 20 maert 1680. Laur. Theod. Gronovius\n\n[1v] Met de\
    \ Columella kan U Ed. handelen nae sijn goedtduncken, doch ick sie [niet] hoe mense Graevius\
    \ nu onthouden kan daer ick hem in mijn laeste brief deselve beloof, doch U Ed. moet altoos\
    \ seggen van restitutie. Hij sal mij wel weder aen boort komen naer ick gisse, doch hij\
    \ moet weten propior sum egomet nobis. S. Al. S. schrijft gedurich van Pisa met sulcke beleefde\
    \ woorden van U Ed. als geen kint kan doen en daerom oock met de patroon spreeckende of\
    \ ick ijets vonde in de Pandecten, dat noch [1r] verre is en wel jaeren sal aenlopen. Of\
    \ ick oock genootsaeckt was S. Al. S. oit te dediceren, hij seide van neen, en liet sich\
    \ ontvallen onse epistolas “fore gratiores S.A.S.” en dit is mij 2 a 3 mael voorgekomen,\
    \ doch voor het laest nam ick het op en loofde sulcks sed frigidissime. De patroon scripsit\
    \ hoc S.A.S. cuius me nunc panitet te inconiulto id dixisse et quod fieri possis ni<>\n\n\
    [2r] Het palleis is een sacellum alwaer Evangelium Graecum Johannis met goude letteren beschreven\
    \ en omtrent een pinck groots wort gesegt van Johannes ipso conscriptum. Als ick het sag\
    \ met 2 clerici decentus dat het uit het Hebreeus was overgeset. Ick meen daer noch eens\
    \ nae te vragen. Hij, Johannes, is voor in geschildert, et literra placent. Iteru(m) vale.]"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 21-04-1680
  plaats_verzender: Rome
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 11, fols. 2.
  tekst: "[1r] Mon Tres Cher et tres Honoré Frere,\n\nWoensdag den 10 april discessi Florentia\
    \ et Roma(m) veni die solis. Ick sag op de wech Radicofani, een casteel op sulcken hoge\
    \ [steen]klip als ick nergens gesien hebbe. Als mede te <> Siena op bergen gelegen en ongemackelick\
    \ om te bewandelen. Wij sagen domu(m) Ara Catharina en haer hooftpeluwe van eenige steenen.\
    \ Aquapendente licht oock hoog op een berg en heeft een bischop, is van eeuwige consideratie.\
    \ Montefiascone of Faleni of Faliscu(m) ubi Camillus ludimagistrum etc. legt oock op een\
    \ berg en quam mij out genoeg voor, doch vergaet nu tenemael. Volsinii, liggende op een\
    \ hoeck vant meer, hebbe ick maer van buiten gesien. Ligt oock op een klip en onder aen\
    \ staen kleijne huijsen. Viterbo quam mij schoon en out voor. Het was mij leet dat ick daer\
    \ niet eenige voetstappen mocht insetten en floreert noch al wel. Buiten de poort naer Romen\
    \ waren grote steenklippen doorgehouden, dat geweldige onkosten mij scheenen geweest te\
    \ sijn. Hier voren sag ick noch Vico, eertijt op een hoge klip gelegen en eenichsins florerende,\
    \ doch nu tenemael verdroncken in Lago di Vico. [Tot] Baccano staen geen huisen meer als\
    \ een herberg. Hier agter sag ick noch eenige vande torenties, omtrent een man hoog boven\
    \ de aerde. Men seide mij dat het aquaeductus waren, als oock wel waerschijnelick is. Borco\
    \ di Baccano of Mestra Silva is teenemael verbrant en afgehouden door ordre van de pausen,\
    \ doch ingang is noch blijven staen met eenige struicken van bomen en wildernissen omtrent\
    \ eene a 2 bergen, daer het van te voren Hercenia Silva scheen. \n\nQuamen hier op Via Triumphalis,\
    \ soo ick in de lantkaert sie, die met blauwe steen bevloert is geweest, doch nu weinich\
    \ van overich. Op midden van dese wech staet een out graf van marmer. In de caert et rustici\
    \ aiunt del imperator Nerone dat met Suetonius niet overeen komt. Ick hebbe hier van wijser\
    \ gevraegt, en seggen dat Nero in de stad in colle aliquo begraven was, tegen Suetonius.\
    \ Doch die inventie sijn ronde letteren en niet staende ut CD non M item P non en alle die\
    \ letteren hadden soo een kromme streeck bij haer et credo illas litteras non iste aevi\
    \ Neronis. Nu Via Triumphalis brengt ons op Ponte Molo of Milvius, die niet op Via Flaminia\
    \ en alsoo buiten de stadt noch over den Tiber rijdende, quamen per Porta del Popolo in\
    \ de stadt. \n\nVia Flaminia ging olim tot Ponte Milvius en soo neffens den Tiber nae Porta\
    \ di Castello Enza o Elia en soo in de stadt ging deselve over Pons Triumphalis, wiens rudera\
    \ een half man hooch noch boven twater van de Tiber te sien is, sijnde niet verre van Ponte\
    \ Angelico, die licht over Moles Hadriani, sive sepultura. Hanc molem vidimus intus is grooter,\
    \ dicker en hoger als den burg van Leiden aiunt, dat den moles haec van binnen al met steene\
    \ is getimmert geweest. Doch daer naer hebben de pausen dese moles van binnen laten uithouwen\
    \ en kappen daer in gemaeckt, als mede kameren. Dese moles is een halve man van de <>usen\
    \ boven met een muur verhoogt, doch evenwel sijn oude muur is noch hoger als den burg en\
    \ hier int casteel del’Angelo. Om dat heel boven alwaer beschrijft een boven stont, die\
    \ door blixem is neergeslagen, een paus een mamaeren engel heeft laten setten, die oock\
    \ al eens van boven door onweer is geslagen, doch nu met stucken weder ongerecht. In dese\
    \ moles is een kamer daer de paus sijn kronen in opgesloten sijn. [1v] Oock hebbe ick daer\
    \ gegroet Borri met een prins di Madril, die al 33 jaren daer geleeft heeft. Dit casteel\
    \ is nu van nieus met een ander muur om laeg en vijf bolwercken versterckt en heeft Engels\
    \ geschut en ander geweer in menigte. Vant Vaticaen tot dese moles is oock een secrete galerie\
    \ op manier als tot Florence van t paleis Pitti tot de Galleria, doch de gallerie tot Romen\
    \ is een weinich langer. Ick sag nog geschut dat een paus Barberin hadt laten gieten van\
    \ het deksel van Pantheon, waer over Pasquin seide “Quod non fecerunt barbari fecerunt Barberini”.\
    \ Dese moles is van gebacken steen getimmert, alleen heeft hij van buiten ommegetrocken\
    \ geweest van groote harde steenen, op manier als tot Florencen de huijsen. Dat is lange,\
    \ dicke, harde steen. Dese steenen sijn op veele plaetsen door outheijt oock uitgevallen,\
    \ doch is noch wel te sien hoe het geweest is. \n\nNu aiunt dat Pantheon altijt boven open\
    \ is geweest en dese Pantheon met sijn pilaren al uit een stuck (en omtrent soo groot en\
    \ dick als in de nieuwe kerck tot Leiden) staen noch gans heel. Alleen dat hij midden boven\
    \ open is sonder dat ick weet of dat olim oock soo geweest is. En van binnen sijn dae nu\
    \ altaren ingemaeckt, waer mede men sijn religie oeffent. De Columna Traiana en Antonini\
    \ hebbe ick van buiten gesen en haere teickeningen kan men noch seer wel sien, alleen dat\
    \ sommige beelden die seer uitstaecken de neus verloren hebben. 6 a 7 obelisci sijn hier\
    \ en daer, als mede voort Vaticaen een seer hooge obeliscus, allemael in de aerde gevonden\
    \ en uitgegraven met hierogliphisce letteren of figuren, die niemant verstaen kan. \n\n\
    Donderdag voor Paessen sag ick de tafel daer de cardinaels soude eten, en als mede van de\
    \ 13 discipelen, die treffelick wel met bancket als anders versien waren, doch eerst sag\
    \ ick de paus van boven uit een bassecour de benedictie geven. Daer naer gedragen in een\
    \ capel of camer en hij daer een weinich op een throon geseten hebbende, stont op, en soo\
    \ wiert gelesen et lavit pedes eorum etc., waer waer hij van sijn throon afging en waste\
    \ 13 discipelen de rechter voet uit een gouden schotel en daer nae diende hij voor dese\
    \ 13 discipelen aen hare tafel. Ben noch geweest in de bibliotheecq om de ornamenten te\
    \ sien, siende treffelick wel beschildert en uittermaten groot. Ick hebbe noch gesien de\
    \ tuijnen, en in een twee vergulde kopere pauwen, die men seide dat noch overich waren en\
    \ mole Hadriani et die daer sulcke twaelfe geweest waren. \n\nVito tot hier toe gaen morgen\
    \ naer Napoli en die reijs sal vijftien dagen duren, waer naer ick weder naer Romen en Florence\
    \ sal keren. Ick hebbe Stephani Gradi, Bibliotheca della Vaticana, een brief van recommandatie\
    \ van de patroon Magliabechi overgelangt en seide of ick naer Pascha wilde wederkomen. Oock\
    \ aen Paolo Maffei en liet mij terstont sijn Stephanus de Urbibus sien en presenteerde mij\
    \ die te gebruicken. Doch ick hebbe nu geen tijt daer toe. Noch hebbe ick Stefano Pignatelli\
    \ een recommendatie brief van Magliabechi overgelangt en die wil mij leiden bij Regina,\
    \ die ick dan de Livius sal behandigen, etsi ingratu(m) munus, ut puto, illi. \n\nTot Florence\
    \ voor mijn wegreisen hebbe ick U Ed. laeste brief al S.A.S. selver overgelangt en versoecke\
    \ de continuatie van mijn kamer, soo seide S.A.S. bene serrate et parrete teco la clave,\
    \ soo dat ick oock eenich goet daer gelaten hebbe. Voors hebbe ick hondert silvere ducatons\
    \ of schudi tot Romen van een koopman op ordre van Fontaine gelicht, die mij betaelt sijn\
    \ met schillingen en testoni. Dat sijn stucken van [2r] drie schillingen. En ick hebbe twee\
    \ quitantien onderteickent, [dog in de tweede] is geschreven dat de een betaelt sijnde,\
    \ d’ander niet sal gelden. Daer is eenich misverstant in de wissel geweest, et inde fastodium,\
    \ dat ick niet hebbe wille schrijven, doch is nu te recht gekomen. De collatie van de Pandecten\
    \ hebbe ick ook geeindicht, en soo ick diergelijcken arbeijt konde vinden, soude ick mij\
    \ hier wat langer ophouden als wel anders. Ick hebbe oock an Gradi gevraegt naer de Amm(ianus)\
    \ Marcellinus, maer kreeg geen antwoort als ick wel wenste. Van Romen sal ick nu wel niet\
    \ meer schrijven of daer moste nootsaeckelike oorsaecke voorvallen, die ick niet kan weten.\
    \ Ick hebbe mijn reijs van Florence met groot contentement volbragt, alsoo ick een goedt\
    \ paert hadde en het weder soo schoon als men soude konnen wenschen met noch twee Duitsers\
    \ en waren tot Romen te samen en houden een knecht. Doch als ick van Napoli wederkome, sal\
    \ ick mij van haer afscheiden en alleen wonen om het een of het ander curieuser te ondersoecken.\
    \ Soo U Ed. mij tot Romen noch belieft te antwoorden raccomandata al Sigre. Gaetano Chiari,\
    \ die alle weeck bij de post gaet en brieven in menigte soo hij seijdt, ontfangt. Meerman\
    \ is van daegh naer Hollant vertrocken. Mr. Huijbrecht hebbe ick hier verscheide maelen\
    \ gesproocken en gaet in augusto naer vaderlant. Ick moet sluiten. Verblijve naer mijn schuldige\
    \ en onderdanige aanbieding mijnes geringen dienst.\n\nU Ed. dienstwillige en gehoorsamen\
    \ broeder\n\nLaurentius Theod. Gronovius\n\nRoma parchate, den 21 april 1680"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 11-05-1680
  plaats_verzender: Rome
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 12, fol. 1.
  tekst: "Mon tres cher et tres honoré frere,\n\nIck ben van Napoli gesont weder gekomen tot\
    \ Romen. Voor 2 dagen gaf ick de Livius met 2 orationes gebonden als behoort aen de Konigin,\
    \ diese beleefdelick ontfing en daer nae met mij een gans uur discourreerde, wandelende,\
    \ en spreeckende goet Latin, Italiaens, Frans en Hollants. Als ick wech ging, seide “ick\
    \ wil dat ghij dickwils bij mij komt.” In de Vaticana hebbe ick omnia capita Marcellini\
    \ met het Ms., sijnde seer out, geconfereert op een morgen. Ick vonde wel variantes lectiones,\
    \ maer niet een begin of einde capitum als de gedructe van Valerius, waerom ick se niet\
    \ kan confereren. Steph(ano) Gradi bibliothecario is een out man. Ick ben hem verobligeert\
    \ wegens sijne beleeftheijt, doch dat hij mij alle boecken soude tonen, durfde ick van hem\
    \ niet eijsschen en is voor hem oock onmogelick. \n\nHier is noch een heer Curtius, hebbende\
    \ auctoriteijt over de ganse soldatesche, soo dat sij marcherende en hij, Curtius, van achteren\
    \ komende haer sullen rengeren en Curtius alsoo met eer verbij haer sullen laten marcheren,\
    \ als sij voor geen cardinalen doen sullen. Desen heer segt men evenwel staet eer[st]daegs\
    \ cardinael te worden. Desen heer hebbe ick begroet en heeft mij seer beleeft bejegent.\
    \ \n\nIck besie nu de stadt wat en dan meene weder naer Florence te keren int korte. Int\
    \ Vaticaan segt Gradi dat een Ms. Polybii is, doch dat het selve Casaubonus gehadt heeft\
    \ en gesonden is geweest naer Paris. Ick hebbe het niet gesien, sijnde dese bibliotheec\
    \ soo uitnemende groot en lang gebouw dat men daer in moede wort van gaen. \n\nIck hebbe\
    \ 200 scudi hier gelicht en sijn haest verteert. Een scudi is 10 juli of schellingen, dat\
    \ net met ons gelt over een komt, en alsoo 100 scudi is net 300 guldens in ons gelt. Ick\
    \ sal verlange wat U Ed. voor dese wissel sal moeten geven. Naer ick sie, sal ick meerder\
    \ moeten hebben als 200 rixd(aalders), waerom met gelegentheijt U Ed. ick versoecke dit\
    \ an de heer Bannis te willen bekent maecken. Dock voor ick vertreck van Fiorenze naer te\
    \ vaderlant, hebbet niet van doen. Tot Romen wone ick bij Gaetano Ciari, daer U Ed. oock\
    \ bij gewoont heeft, doch hebbe het ongeluck gehadt van eenich gelt daer verloren te hebben.\
    \ \n\nMonte Vezuvio hebbe ick soo dicht geweest als ijmant kon, dat is van de hoge klip,\
    \ waer in dese berg met een omloop besloten is, ging ick af in de verbrande as of steentie\
    \ tot soo lang, tot dat mij de praeciptie, die noch wel 2 mannen hoog was, mij belettede\
    \ verder af te klimmen. Ick hebbe geen vlam, maer alleen roock gesien. Tot Putzolo hebbe\
    \ ick de antiquiteiten [1v] gesien, soo die gemeenlick getoont werden: dat is de vermaeckelicke\
    \ stadt Baia, heelemael in de zee verdroncken, en piscina mirabilis van Augustus, een heerlick\
    \ gebouw onder de aerde, waer van nu noch 48 vierkante dicke columnen overich staen, al\
    \ met marmer bekleet en dan centum camerella, seggende ergastulum fuisse Neronis. Ick klom\
    \ daer in, doch met seer groote moeijte en leeck daer heel wel naer naer een gevangenhuijs.\
    \ Voors campos elisios, mare mortum, lacum Avernum, sepulturam Agrippina, en alle andere\
    \ antiquiteiten toonde ons cicero, die seide dat hij noch van dat geslacht was, doch klaegde\
    \ seer over keijser Carel de vijfde, die haer alles ontnomen hadde. \n\nIck ben op wech\
    \ verwondert geweest over die schoone en treffelicke Via Appia, een werck dat sijns gelijcken\
    \ niet en [heeft]. Loopt door den Apennin altemets en daer heeft hij sijn wijtte en is soo\
    \ plat, dat men denckt niet eens in bergen te wesen. Daer sijn soo veel groote heeren die\
    \ hier en daer een berg plat gemaeckt hebben, doch komt bij dese wech geensins. \n\nTot\
    \ Mola sag ick een huijs waer boven een tuijn was met orangie bomen. Dit huijs ligt langs\
    \ de zee en alle kameren hebben haer uitsicht op de zee. Wort gelooft Villa Ciceronis geweest\
    \ te hebben, dat mij niet vreemt [voor] quam, quia locus optimus ad latitandum. Nu in de\
    \ tuijn soude sijn begraeffenis geweest sijn met inscriptie daer boven op, doch is van de\
    \ Spangiaers wech genomen. Dese tuijn besit nu de gouverneur van Caieta. \n\nIck recommandere\
    \ U Ed. den almagtigen Godt, sijnde belet meerder te schrijven. \n\nColumna Traiani et Antonini\
    \ et admiranda urbis Roma vestigia et arcum triumphalem Severi hebbe ick al gekoft. Verlange\
    \ naer gelegentheijt om die te konnen senden. Verblijve\n\nU Ed. onderdanigen en dienstwilligen\n\
    \nLaurentius Theod. Gronovius\n\nRome, den XI mei 1680"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 05-08-1680
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 13, fol. 1.
  tekst: "[1r] Mon tres cher et tres honoré frere,\n\nHet is mij ten hoogsten aengenaem geweest\
    \ te horen den staet van U Ed. liefste. Ben wel door andere tussenkomingen verset geworden,\
    \ soo dat wellicht van mijn reijse naer Turckien soude veranderen, doch hope alles [ter]\
    \ besten. Sal met patientie verwagten eerst de mande en dan verder goede gelegentheijt hebbende,\
    \ meene in de name Godes die reijs voort te setten. \n\nDoch dat het lichaem vergaen is,\
    \ is geensins wonder en hij selver seide mij dickwils sijn bloet quijt te wesen. Den Engelsen\
    \ doctor hem dit confirmerende ende datter maer vier weecken noch overich waren, doch uit\
    \ de facie beter moedt scheppende, is hij seer gerust geweest en haelde omtrent noch 3 weecken,\
    \ hebbende een einde gehadt als gewenst heeft. U Ed. moet weten dat wij meerder occasie\
    \ hebben om ons lighaem te versorgen en wel voornamentlick U Ed. die nu sulck een vreede\
    \ binnen huijs hebt, als bij noch weinige menschen hebben. En daerom oock wat U Ed. van\
    \ buiten mocht rencontreren. Ick bidde schudt het stof af eer U Ed. in huijs treedt. \n\n\
    Pluteo 50 Act Rufum Nautitiu(m), staet in Ms. πηὸς του μον μετίλιον Ms. in charta. Tot St.\
    \ Croce is mede een Ms. Hieronijmi ad Gal., doch heeft geene veranderinge in het bekende\
    \ woor<d> en is ouder als tot St. Laurens. Ben verwondert tribi locis in servio legi Monumentu(m)\
    \ quasi monitio mentis, gelijck in de Iustit(ia) Testamentu(m) q. testatio mentis, daer\
    \ doch alle rechtsinnige interpretes dit verwerpen, soo dat wel een vierde Ms. van Servius\
    \ soude wenschen. \n\nHebbe weder 16 scudi 6 gratz. ontfongen en sal in de ander weeck weder\
    \ een eijschen hopende eens die mande te ontfangen, daer ick soo lang naer verwagt hebbe.\
    \ Oock is tot Livorno een convoij geweest en vertrocken, dat mij leet [doet] sulcke schone\
    \ gelegentheijt en tijt versuimt te hebben. Ben al uijt geweest om Napelse zijde hemtrockies\
    \ te kopen, doch hebbe maer een konnen vinden en soo geen andere vinden sal U Ed. sich daer\
    \ soo mede moeten consenteren als het is. \n\nHier is mede een cristalhuijs doch hebbe al\
    \ [voor] 24 dagen eenige flesken belast te blaesen, doch altijt vergeefs, sijnde dan de\
    \ form te klein, te wijt, te plomp etc. Soo wagte nu weder naer woensdag als wanneer mij\
    \ seijden het fijnste cristal te blasen. Ick sie wel dat sij haer cristal willen betaelt\
    \ hebben, dat is niet aengelegen, soo sij U Ed. maer aenstonden. Ick sal daer eenige voor\
    \ mij kopen, en U Ed. kan mij dan de groote en form en hoe sij U Ed. aenstaen laten weten.\
    \ Ick gaf de wercklieden een drinckpenning en seggen mij soo goedt te willen arbeiten als\
    \ tot Venetien, doch dit moet U Ed. naer desen examineren. De negotie is hier weinich. \n\
    \nBen verseeckert dat soo men sich te regt kan addresseren an de konigin alles herstellen\
    \ sal, doch ick weet niet hoe, kostende mij soo een reijs 14 ducatons en daerenboven vinde\
    \ geen tijt, doch U Ed. kan vrijelick gebieden. Kan oock niet goedt vinden soo alle tot\
    \ Bremen  <>rede is het te laten lopen.\n\n[S(i)g(no)r(e) Magliab(echi) segt mij dat het\
    \ boeck van Noris al op wech is en dat hij Grevius daervan wil informeren. Verleden sender\
    \ wist niet beter of soude met mij eeten met Verle, alsoo hij mij deselve gerecommandeert\
    \ hadde, doch Verle een uitvliegt vinglende. Soo weet ick niet, wanneer ick nu de eer genieten\
    \ sal, Verle seijt mij dat sig(no)r(e) Magl(iabechi) alle dagen zig een pistool in sijn\
    \ bibliotheeck besteden. Ick wilde dese brief voor de derde mael veranderen, en dog de tijt\
    \ etc. \n\nFlorence 5 aug(ustus).]"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 13-08-1680
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 14, fols. 2.
  tekst: "[1r] Mon tres cher et tres honoré frere,\n\nIck mach niet langer wagten met antwoordt,\
    \ alhoewel ick wel wilde U Ed. wat seeckerder mij aengaende laten weten. U Ed. aengenamen\
    \ dan van den 28 juni is mij gevonden, doch wat langsaem, alsoo de heer Magl(iabechi) met\
    \ sinckinge doen ter tijt op het oogh gequelt wesende, mij deselve niet ter rechter tijdt\
    \ konde behandingen, als mede de hoogwaerde en seer lieve hand van U Ed. Liefste, die mij\
    \ soo wellekom was en van mij met handen en oogen is omhelst geworden, dat ick deselve alle\
    \ daegen lese, herlese, en mijn oogen niet versaedicht worden van de soete woorden en letteren\
    \ die deselve in heeft. Sij dient mij alle avont tot een herstellinge van mijn vermoeijt\
    \ lichaem uit de Laurentiana. Ick stae verbaest over de uitnemende affectie, beleeftheijt,\
    \ eere en alle andere expressien van goede ongeveinsde vriendtschap, waermede selve is opgevult.\
    \ Sij is mij gekomen geheelick buijten verwachtinge, om dat ick in mijn uitlandigheijt geleert\
    \ hebbe veracht te worden van mijns gelijcken en daerom geen de minste hoop dorst scheppen\
    \ om van mijn meerder beantwoordt te worden, veel minder op soodanigen heerlicke manier\
    \ als mij nu geschiedt is. Ick ben daer door verstomt geworden en kan voor tegenwoordich\
    \ geen sachte woorden genoech vinden om haer Ed. met gelijck respectueusen [brief] te beantwoorden,\
    \ waerom wederom U Ed. intercessie bij haer Ed. versoecke en mij te excuseren op soodanigen\
    \ manier als ick niet kan schrijven. <Se>nde hier nevens een brief, niet omdat ick meen\
    \ U Ed. deselve soo aen<ge>naem sal wesen als mij U Ed. liefsten handt was, maer ook omdat\
    \ ick anders niet en kan en mijn onmacht behoort mij bij U Ed. voor excuus te dienen. \n\
    \nSij is uit de bibliotheecq kas, en formaet, en uit een volumen, daer Anastasius in was,\
    \ als Bigot heeft uitgeschreven. Ick mach nu de patroon daer niet meer omvraegen, nu ick\
    \ dit soo in secreet hebbe uitgehaelt. Sijn hier noch meer sulcke staelties. Ick wil deselve\
    \ wel gaen besoecken. Sij moet oock secreet bij U Ed. wesen, want Bigot wil deselve in secunda\
    \ edit(io) laten uitgaan en heeft oock begeert dat de patroon niemant de selve sal tonen\
    \ en mij oock niet sal willen tonen. Petrus Martijr, afvallende van de paus, segt in een\
    \ plaets van de Eucharistia “exstat Chrijsostomi” Epistola in Biblioteca Florentina etc.\
    \ Canisius heeft een ander stuck van dese brief laten uitgaen als de patroon segt. Ick hebbe\
    \ maer eene stoel gehadt met groen overtrocken, en drie sitkussen bij een gebonden. \n\n\
    [1v] De wissel is eerlick betaelt en ben daer wel mede te vreden. Maer wat sal ick seggen,\
    \ ben gedurich met gedagten van reijsen swanger geweest nae de receptie van den uuren, sonder\
    \ dat ick als noch weet naer over een maendt bedencken wat ick doen sal. Ick hebbe evenwel\
    \ mij soo verre toegegeven dat soo daer gelegentheijt was, ick gaen soude en die niet sijnde,\
    \ wel seeckerlick soude te huijs komen in octob(er). Derhalven hebbe geschreven an Sigr.\
    \ Cappelen mij te laten wesen of [tot Livorno] gelegentheijt is om te vertrecken naer Constantinopel.\
    \ De patroon raedt mij seeckerlijck te gaen. Ick, soo ick met gesontheijt die reijs voltrocken\
    \ konde, vinde wel dat ick geen berouw daer over sal hebben, maer niet gaende dat ick wel\
    \ eenigsens gedurich dit in mij hooft soude hebben. Soo verwachte ick als noch antwoort\
    \ van sig(no)r(e) Cappellen. \n\nIck weet oock noch seer wel hoe dat ick met geele plecken\
    \ ben besprenckelt geweest een langen tijt naer dat mij de koors al verlaten hadde en bijkans\
    \ despereerde van dese geele plecken oijt quijt te worden, doch met <>quaemheijt van tijt\
    \ en veel wassens, ben ick deselve teenemael quijt nu geworden. \n\nDaer sijn hier vier\
    \ Strabones. Dat is de 10 eerste boecken dubbelt, de rest in de twee andere vol(umes), allemael\
    \ in charta in quarto. Het eerste boeck hebbe ick dubbelt geconfereert, en d’een Ms. soo\
    \ vitieus gevonden dat ick berouw haest soude hebben van die tijt. In de ander gaen ick\
    \ voort, doch weet niet van considerabels ijets gevonden te hebben. Soo U Ed. geen beter\
    \ collatie begeert, sal ick inde Strabo arbeiden tot mijn vertreck, maer ick kan die niet\
    \ afdoen, alsoo de tijt te kort is. U Ed. schrijft deselve heel out sijn, dat ick geensins\
    \ sien kan en daer sijn geen andere. In de catalogus van Holstenius staet oock [niet] denus\
    \ of antiquis codex als hij pleeg te seggen. Daer is een seer oude Theophili Institutiones\
    \ en daer soude seeckerlijck meer in te vinden wesen, maer ick laet dat nu vaeren. Hier\
    \ is noch Stephanus de urbibes van Joannes <Ro> omtrent 200 iaer in pergam(entum) geschreven\
    \ en soo U Ed. die collatie niet en heeft of noch begeert, het is hoge tijt U Ed. mij daer\
    \ van advertere. Hier is noch Cebesto in een volumen in charta daer Herodianus meae in is,\
    \ die ick tot [in] het derde boeck confereerde en nu late vaeren, omdat het nu niet goet\
    \ is. En van deselve handt is Cebus geschreven, soo dat daer weinich te halen sal wesen.\
    \ \n\nHet is anderhalfve weecke dat ick van Livorno antwoort te vergeefs gewacht hebbe,\
    \ en ter contrarie hebbe ick met leetwesen verstaen dat daer nu schone gelegentheijt geweest\
    \ [is] van [met] onse straetvaerders naer Smirna en Constantinopelen te varen, die verleden\
    \ weeck vertrocken sijn, sonder dat mij Cappelen heeft willen adverteren, die op die tijt\
    \ oock mijn brief ontvangen heeft, en nu wel haest geen gelegentheijt meer sal wesen, soo\
    \ maecke ick nu [2r] anders geen staet als ick de toekomende maendt mij van hier naer het\
    \ vaderlandt te begeven, waer naer ick wel groot verlangen hebbe en noch meerder naer U\
    \ Ed. en U Ed. liefste te salveren, en nu ick verstae dat alles soo wel is, hebbe ick anders\
    \ geen voornemen als [op] de beste wijse te tonen dat sulcke excellente groote weldaden\
    \ mij eenigsins hebbe opgeweckt om mijn traegh lichaem te exerceren, het sij om landen,\
    \ menschen of boecken te besien en daerom soo U Ed. mij daer toe verder gerede raedt gelieft\
    \ te geven. Ick sal daer op wachten, waer naer ick mij ten eersten promtelick sal reguleren,\
    \ het sij te repatrieren, hier te blijven of verder te gaen. Het soude mij berouwen soo\
    \ ick geen goede [raedt] van U Ed. hadde gehoorsaemt. \n\nSijnde tien piasten aen mij tot\
    \ Livorno door Sig. Cappelen getelt al betaelt. Hij, Cappelen, seide mij deselve te betalen\
    \ aen d’heer de Bannis en ick hadde nu liever gewilt aen Sr. Heldevier tot Amsterdam en\
    \ gelijck ick geschreven hebbe, verwachte verder credentie tot 100 of 150 scudi door Heldevier\
    \ of De Bannis, soo U Ed. best oordeelt. Il viaggo del Cornelio Magni seijdt de patroon\
    \ niet veel te beduiden wesen. Het vers van de Vergilius is mij aengenaem gevonden te hebben.\
    \ Noris wil dit uitgeven, als inedita. Ick hebbe oock geen verder antwoort vande mande met\
    \ boecken, of sij bestelt is of niet. Sij is wit en midden op is een briefken wat slordich\
    \ gehecht aen Sr. Elzevier tot Amsterdam om etc. Is tamelick groot met een klein hang sloottjen\
    \ op dese manier. Daer sijn noch twee tarantula in. De eene heeft vergif, de ander loopt\
    \ in de huisen, sijn in een bedeckt glaesien gebonden. \n\nHiermede Godt bevolen, die ons\
    \ malkanderen haest in gesontheijt wil laten sien, verblijve naer presentatie mijnes geringen\
    \ dienst aen U Ed. en U Ed. Liefste\n\nU Ed. onderdanige en dienstwilligen broeder en dienaer\n\
    \nLaurentius Theodorus Gronovius\n\nFirenze den 13 aug(ustus) 1680"
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 27-08-1680
  plaats_verzender: Florence
