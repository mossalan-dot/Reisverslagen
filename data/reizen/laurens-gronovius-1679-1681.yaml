  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 21, fols. 2.
  tekst: '[1r] Mon Tres-Cher et Tres Honore Ferere,


    Daer sijn twee oorsaecken die mij dwingen om U Ed. met dese moeijelick te vallen: de eene
    van te willen uit mijn beurs nemen 3 gl. 12 st. dat is 1 gl. 4 st. voor U Ed. en twee gl.
    8 st. naer Deventer, ter oorsaecke van de leeninge, als ick onder mij hebbe van 120 gl.
    cap. verschijnende in Juni. De tweede oorsaek is dat ick /in\ de andere maendt verwagtende
    het convoij naer Smirna geresolveert ben daer mede een reijs naer Constantinopel ofte daer
    omtrent voor te setten, bij aldien mij geen hinder voorkomt. Soo daer dan noch ijets is
    dat /ick\ moet weten, versoecke mij ten eersten gelieft te antwoorden. De perikelen op de
    reijs ten regaert van mijn traeg lichaem, sijn niets, waerom daer mede mij sal troosten.
    Ondertussen de mande ontfangen hebbende, sal deselve ten eersten weder senden met boecken
    en schriften, die mij niet mogelijck sijn in mijn valijs te sluijten. Soo oock die mande
    wat overquam, ick wedergekomen wesende van Constantinopel soude tragten ijets te remedieren.
    pl. 59, XI etc de compositione nominum sijn dese woorden mankerende in Langii cataloog ad
    Rustum Nauvitium. Het is mij aengenaem te horen de administratie van onse swaeger, waerom
    U Ed. hem altijt gelieve te dancken en te groeten uit mijne naem, en komt mij wel te pas
    dit te horen, nu ick noch verder vant vaderland gaen sal. In Plutcharchus hebbe veele mss.
    tot St. Lorens doorgelopen, doch een collatie niet waerdich bevonden. U Ed. moet mij niet
    bedenken in Seneca Trag. Het sal mij de grooste hertseer wesen, die U Ed. mij doen kan,
    maer wel Magliabechi U Ed. gelieve te weten, at ick mijner herten meeninge altijt aen U
    Ed. laet weten. Segt maer een nieuwe collatie te hebben, of van U Ed. selfs /of\ van Magliabechi
    of van niemants altoos geensints van mij. Winschoten is geleert, en acht U Ed. veel, en
    is trouw, U Ed. mach hem vrij groten met gelegentheijt uit mijn naem. Munckens is seer onversichtich
    en temerarius gewesen, blijckt uit al sijn actien tot Delft. Higin fabule sal ick wel gedencken,
    doch tot noch toe hebbe niets waerdich gevonden, alhoewel hem gesogt hebbe. Tot Romen soude
    wel ijets wesen mischien, of oock inde Biblioteeck della Regina. Daer was codex Theodosianus
    in 2 vol. De form als mede de letters, sonder iuijst daer op gelet te hebben, doch altoos
    groote letters en mede per columnas gelijck dese pandecten, en is gekomen uit de Bibliotheeck
    van Petavius. Hebbe groote lust tot die collatie, soo U Ed. mijn sijn [boe] codex Theodosius
    gesonde hadde. Haer Bibliotheeck is voor mij open en is wel versien van Mss. Haere Kon.
    M. is ons wel genegen, soo tot Bremen alles herstelt is, ist te bedenken, of ick niet genootsaeckt
    worde haer K.M. te begroeten selver in persoon, is weinich te bedencken of sal alles weder
    geven. Doch ick ben onwetende of het de pijne waert is, als mede wat voor saecken het sijn.
    Magliabechi correspondeert met Belleri haer Bibliotheeck en een ander Heer, die mij ter
    audientie leijde, en alle dagen sijn Hove komt. Doch is verdrietig traegsaem werck /degrander
    vreem gehanden\ Nili opera, daer Epictetus Christ. in is, sijn sonder noten. En Iuarez segt
    in de prefacie dat Nilus Epictetus soo geemendeert heeft, sonder eenig woort verder te seggen
    wat Mss. hij gesien heeft, generaelick segt Nilus uit de Mss. Barberini uit te


    /geven, en segt dat Epictetus in dat selve Ms. was. Doch dese Epictetus van Iuarez verscheelt
    soo veel vant Ms. van St. Lorens, als U Ed. weet, dat dit Ms. verscheelt van Epictetus Stoicus,
    waerom oock geen ander troost vonde als te copieren en collationeerde dit Ms. /met\ de Epictetus
    Stoicus. Dese Nilus sijn 2 ordinaire vollumes in folio niet van de grooste sonder noten,
    en naer lang wagten, schrijft ons il signore Maffei te kosten 2 goude pistolen, die ickse
    geensins waerdich agte. En dan noch het port en etc. Tot Lion segt Magliabechi soude hem
    beter koop hebben, alsoo een boeckverkoper uit die stadt veele exemplaeren heeft, alsmede
    numismata parutes die als noch ben verwagtende wat kosten sal. Al voor 5 maenden hebben
    beloften gehadt van te sullen weten, doch niet van Il Sigr. Maffei. Doch gelove niet\ [1v
    ] ick hem soo beestiael betalen, o[] hoewel goede genegentheijt hebbe om hem te kopen. Daerenboven
    een eenich boeck uit ROmen mag gaen moet /tol\ [post] betaelt worden, als ick mede voor
    de mande gedaen hebbe. Alheir in de Abdie staet dese titel Justini Hispani praefatio, alleen
    maer op die plaets, en niet int einde van [de] /het\ boeck, of oock laeste bladt. Als alle
    goede mss. plegen te hebben van alle boecken als mede hetoude ms. tot St. Lorens achter
    elck boeck POMPEII TROGILIBER ETC EXPLICIT. en oock de Longbobarden IN IUNANI IUSTINI EVITHOMA
    EXPLICIT et dit soo van het 16 boeck tot [het] in 44. boeck. Maer De Plutarchus was met
    de letter als Thucijdides tot St. Lorens in folio non in quarto als U Ed. meent, en oock
    met grooter letters als de Herodotus, Artemides Epictetus etc. Sulcken Plutarchus hebbe
    ick tot noch toe in St. Lorens niet gesien, naer desen sal tragten hem te collationeren.
    Doch sal langsaem voortgaen. Als mede de Solinus in dese abdie. Van daeg hebbe begonnen
    Servius tot St. Croce, sal hem tragten af te doen, en daer mede die bibliotheeck laten varen.
    Daer sijn 3 a 4 Prisciani seer out. Doch hebbe geen griekse mss. daer konnen vinden. Daer
    sijn 2 Justini mss. niet seer out ende een altijt POMPENTROCI etc. Doch Servius sall mij
    alleen wel een maent kosten. Om naer Venetien te gaen sprack daer van al Signore. Magliabechi,
    doch rade het af. Ick hadde oock in die tijt weinich gelegentheijt, siende mij doen ter
    tijt soo verwarrt van arbeijt, soo ick het gedaen hadde, soude evenwel geen berouw gehadt
    hebben. Is nu verbij. Doch gelijck ick segge, sal dese mande terstont werder senden, en
    ondertussen een reijsken naer Smirna doende wil hopen U Ed. die mande wel sal behandigt
    worden, en dan wederkomende het nootsaeckelikste hier noch af te doen, en dan naer Venetien
    mij te begeven, hebbe goede genegentheijt in die bibliotheeck te arbeiden soo die duer mocht
    open vinden, doch Magliabechi geeft goede moet daer toe. De Fransche Heeren sullen misschien
    wel noch daer soo lang blijven. Soude mijn reijs nemen seeckerlick op Venetien, of dan verder
    door Vranckrijck of Duijtslandt langs den Rijn soude nemen. Ben twijffelachtich, wat is
    daer weder te doen op de Rijn? Ick hore hierter werelt niet nieuws. In Ptolemaeus hebbe
    veel bedagt, verstaen oock de manier als U Ed. voorschrijft seer wel, doch hebbe bevonden
    mij niet mogelijck is naer te bootsen, hebbe daerom een schilder daer van gevraegt, en eijst
    4 scudi voor ijder kaert, dat mij wat te veel schijnt. Twijffele of Bertius of Mercatoris
    tabb. Magliabechi sal hebben. Huijbrecht seijde tot Parijs aen een Duijtser dat hij wedergekomen
    wesende de beste juffer uit Leijnden niet geweigert worden. Als hij bij andere lantsluijden
    was, toonde genoeg een lange tont sonder oordeel en onverdraeglick, sal ijmant eerst prijsen,
    daer naer hevig veragten, sprack divwils van de privilegie van de Academie, doch ick hoorde
    het sonder te verstaen. Hier tot Florence mij in in St. Lorens salverende versogt hem sondaegs
    daer aen volgende met mij te eeten, alsoo andere dagen geen tijdt hebbe, doch weigerde mij,
    en hij nodigende tsavonts een glas wijn met hem te drinken, wilde oock. Doch is seer goedt
    dat hij U Ed. niet begroet heeft, soo hij het doet, U Ed. moet niet van mij praeten, en
    naer geene studien. U Ed. moet hem ophouden met te horen vertellen sijn loffelicke reijs.
    Is groot vriendt van Rijcke en Drelincourt


    /doch versocht Drelincourt dickwils seer grouwelick. Hij klaegde mij dickwils over sijn
    knegt, en met weinich fondament, dat seer belaggelick is. Soo ick oock voortgae nae Smirna,
    U Ed. moet niemant een woort daer van laten weten. Het is mij ten hoogsten leet dat Capepelen
    verleden iaer daer soo van gepraet heeft. Van de wissel sal ick nu oock selver wel behertigen,
    alsoo hij sijn factoor tot Smirna en contant heeft, en sal U Ed. daer meerder naerdelen
    van laten weten, wanneer tot Liv. gelegentheijt sal weten] [2r] Het is mij lief te horen
    dat de jonge Dirpentein sijn studie soo verre gebragt heeft, is waerdich een plaets te hebben
    int collegie. Hij is een deugtsaem iongelingen wel leerende, soo ick te huijs waer soude
    hem wel met goede raedt bijstaen, alsoo daer eere van te verwagten is. Soo U Ed. hem siet,
    groet hem vrij alsmede al sijn volck. De moeder bemint hem, seer om sijn leersaemheijt.
    Ctier meende ick Prof tot Harderwijck was, of laet men die Academie vergaen? Tot Genua is
    Aprosius eindelick mede gaen slaepen. Onder andere oock in Iuarez Epictetus cap. 32 ei de
    sxopesesti ekseis apo ty deipus sijn niet te vinden, maer ick siende dese woorden int. Ms.
    ben eindelick te regt geraeckt. Noris heeft een boeck gedruckt in Folio met titel Pisa COlonia
    Roma. Doch is een wijdtlopich disecurs over de inscriptie van Pichena in de Tacitus. Soo
    dat dese inscriptie nu niet en treffelick gedruckt is. Dit boeck sal U Ed. gesonden worden
    door de groot hertoch en als mede an Grevius en Hensius, die alle daer in genoemt werden.
    Ondertussen hebbe het selve met Magliabechi gelesen en segt Author, alsoo moet geschreven
    worden, omdat Strada alsoo schrijft. Doch is moij gedruckt, dat men moet prijsen. En voor
    al sal mij versien van dese inscriptie. In alle oude mss. eenpariglick is altijd auctor.
    Hij Noris heeft Magliabechi weder een kunsken gespeelt, doch Magliabechi kan sich wel wapenen
    daer tegen. Om niet te vergeten tot St. Croce was was eht een Ms. Justini bekladt met varie
    lectiones in margine, ren, magni laboris et animi et operis stont in margine. Weet nu niet
    meer te schrijven als datmen over een duel of doodtslach geen iustitie hier doet. Magius
    is hier seer qualick te vreeden omdat soo langsaem wort voortgevaren, dat hier heeft. Doet
    U Ed. groeten. Ick verlange te weten hoe U Ed. Liefste gemoet is, en hoe alles met vreugde
    sal geeindicht werden.  U Ed. bidde hooglich mij in haer Ed. gratie te insinueren. Het doet
    mij wonder U Ed. mij niet het minste heeft laten weten van eenige galanterien, die U Ed.
    hier soo lang geweest hebbende wel kan kennen, en weten welcke haer Ed. niet soude teenemael
    verwerpen. Ick soude versoecken ernstelick het eene of het ander U Ed. mij gelieve te laten
    weten. Hier mede Godt bevolen die ons haestelick kan zegenen sal tragten te wesen U Ed.
    als mede U Ed. Liefste soo even ontfange desen met de effigies Ambro. Camaldulcensis die
    Adr. Haelweg dediceert Jacobo Magliabechi seide dit te mij, om dat desen brief te swaer
    mij schijnt te weten, doch U Ed. kan antwoorden of het gesien hebt. Iterum vale.


    Gehoorsaemste en onderdanige Dienaer


    Florence den 17 Juli 1681.


    Tot Capaldula segt de patroon veele Mss. te wesen, weet U Ed. daer ijets particuliers, alsoo
    ick sal daer eens heen gaen. Ubi Meander super inequales. lese wel in een Ms. tot Sr. Croce,
    doch is niet out. Ick gelove U Ed. alsmede U Ed. niet qualick fabriceren, soo ick mij verder
    vant vaderlandt begeve, alsoo dat dog niet intentie om wat meerder mij op te wecken, en
    mij teeniger manier niet onwaerdich mocht geagt worden W. Eddele affectien. valere van herten
    gegroet.


    Laurentius Theodorus Gronovius'
