  tekst: '[1r] Mon Tres-Cher et Tres-Honoré Frere,


    Ick hebbe den 15 februari deses iaers weder ontgangen 16 scudi of silvere ducatons met 6
    gratz. of 4 stuivers en een half. Sal dese maent weder moeten van noden hebben noch deselve
    somma. Hieronymus bekleet bijkans een heele banck van mss. en de Laurentius de Omilia eti
    een volumen epistola sijn met Longobardische letteren. De rest omtrent twee hondert iaren
    out gelick mede die prfatio commentariorum ad Gal. en  dit ms. ahlhier heeft sonder eenige
    twijffel [] .Histaneotes\ als ick uit het ms. uitgeschreven hebbe. En de andere mss. van
    Hieronijmus sijn andere werken, die wel naukeurelicx insagh om noch andere te vinden. Waer
    uit weet U Ed. in San Marco tot Venetien en in quo scammo /te wesen\ Dion Cassius met Athenaeus.
    Hier in de Laurentiana sijn bij mij geweest twee Franse edellieden van de Franse ambassadeur
    tot Venetien. D. Pretra de Preuille Bulteaw mij versoeckende dat ick tot Venetien haer wilde
    besoecken en offereerden mij haer dienst om in St. Marco te arbeijden. Sij kenden meest
    de geleerden van Paris. Doch in October van verleden iaer ick haer beloovende nuin martio
    bij te komen, soo weet ick niet of deselve daer soo lang sullen blijven. Interim soo kan
    mij U Ed. alles wijtlopich van dese twee auctores onderwijsen. Item waer spreeckt Holstenius
    van een /oude of sulck niet vinde\ Horatius alhier of dese verste van Hierocles pl. 52.
    De translateur is Aurispa wel bekent in sijn tijt, is gedediceert Nicolao V. die leefde
    omtrent 1445 en segt in de praef. dat dese Beatiss. Pater Doctor praemius afficit, en over
    al geleerden sent om boecken te komen, en dat hij aucteur als tot Venetien vont /dese Hierakles\
    en daer van dese versie maeckte. Daer volgt agter Hermes Trismegistus doch gelijckt van
    een ander hant geschreven. Is in charata en van die tijt als dese paus leefde. Alle de lacuna
    van Pl. XXII tot 28 etc. sijn oock soo in dese cataloog, doch Johannes Ernstii catalogus
    gedruct tot Amsterdam in octavo alhoewel een grolletien wenste wel dat wij hadden, en is
    eenigsins nootsaeckelick. De messis begint  hier den 15 jun en soo door geheel Italien,
    en men weet hier naer van geen onderscheijt, doch tot Romen enverder tot Napoli daer begint
    deselve wel een weinich vroeger. De reden is om dat het daer heeter is [doch kan niet maecken
    en sij seggen mij vondt uijt dat geen onderscheijt van tijten] /en hoe verder van de bergen
    af gelegen, en naer de zeekant, of in vlacklant als Pisa etc. daer is de messis. wat eerder,
    als naer de kant van Florence dichtbij de bergen, daer het kouder is\ Ben nu met de Latijnse
    aucteurs besich, en daerom soude versoecken pertinentelick wat voor auteurs wilt gecollationeert
    hebben. S. Fylarginus is eens soo groot als in de cist van P. Danielis, doch gelijckt vermengelt
    met Servius te wesen. Heeft mij veel tijt gekost doch laet hem nu lopen. Servius /tot St.
    Croce\ sal mij [noch] wel een maent kosten. c. 32 Epicteti vonde die woorden niet ei de
    bxopesys pekseis ape tij deipus en met gelegentheijt moet U Ed. mij seeckerlick seggen hoe
    verre hem gecollationeert hebt. Die Observatio Religiosa Pl. 55 l. 3. continet praecepta
    miletaria, en in het lest sijn maer 3 a 4 regelen siende op illam obseer. Sal hem wel gedenken
    als mede Plutarchi Symposium. Thyes. in forte in corpore Byzantino inter notus Pervii ad
    Nicephorum! Heeft Gaerbeec geensins uwe epistolen. Magliabechi segt dese dedicatie hoort
    verhaest te worden. Met de tractices kan U Ed. die wel behangen doen in dit papier videbis
    oliam collationem Hippolo cet alis lectiones scepe habet in marg.


    /Versoecke ootmoedelick U Ed. intercessie voor mij bij U. Ed liefste, alsoo de girigheijt
    van de post mij belet mijn schuldigheijt tegenwoordich bij haer Ed. af te leggen. In wat
    schip is het linnen? En wanneer sal ick verwagten Pandecta Florentina sonder welcke ick
    niet vertrecken kan of mag?


    Den 12 mart. 1681. Valete.\'
