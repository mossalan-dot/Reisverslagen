  opmerking: Ms. VAvW 1272, no. 15, fol. 1.
  tekst: '[1r] Mon Tres-Cher et Tres-Honoré Frere,


    Sende hier nevens een brief open om van U Ed. gelesen te worden. Het is de pijne waert,
    die plaets van Manutti Orthographie als de kaert van uwe Virgilius geteickent wort, en wat
    U Ed. verder nodich sal vinden. Ick meen U Ed. dit voldoen sal wegens de Virgilius. Als
    mede het Excerptum van de Mss. alwaer staet describam is niet nodich U Ed. mij verder daer
    van schrijve, want soo drae als ick Artemiderus gedaen sal hebben, ben van meening daer
    aen te gaen. Waer de titel qualick is, is onmogelijck te remedieren. Soo U Ed. verder ijets
    naders noch begeert, soo sal ick een ander excerptum verwachten. De Strabo is af, maer het
    is vergeefs dat men die Mss. van Strabo met die Herodotus of Artemidorus vergelijcke, sijnde
    allemael nieuw als uit de letteren en alle andere teickenen genoech blijckt. Daer is Strabo
    dubbelt, dat is vier volumina, en elck 2 voll. maecken eene Strabo. De besten, soo ick meene,
    hebben heelemael geconfereert, en in veele plaetsen dubbelt, als voor naementlicht inteinde
    van t laetste boeck. En waer Casaubonus die sterreties gehaelt heeft, weet ick niet, in
    de editie van Aldus sijn geen sterreties als mede geene leege plaetsen in de Mss. En wat
    van deselve Mss is, sal U Ed. met gelegentheijt konnen sien. Naer Strabo ging ick dit excerptum
    naersien, en hebbe gevonden als U Ed. uit de anteickeningen sal sien. Ick ben nu aen de
    Artemidorus voor op pag. 93 int einde is een lacuna, en in het Ms. is het gesuppleeert,
    doch U Ed. kent dat Ms. wel iegenwoordich vinde mij heel vrich en gesont beter als ick in
    dese gansche somer geweest ben, waerom niet twijffele of over 3 weecken Artemidorus mede
    sal afwesen, en voors sal ick dan gaen afschrijven het geene int excerptum etc. De Servius
    alleen sal mij veel tijts kosten en U Ed. soude liever andere boecken soecken, want mischien
    de eene of de ander dat qualick sal nemen, en nergens toe nut is, vianden te maecken. Voor
    eerst hebbe wercks genoech, en konnen nu daer wel over dencken. Ick kan niet geloven daet
    daer in soo veel te vinden sal wesen als U Ed. meent, doch ick se wel beginnen soo U Ed.
    dat wil hebben. Ick wenste onse catalogus van de Laurentiana hier te hebben, soude deselve
    teenemael collationeren, ende dat is wel nootsaeckelick. Wat het collationeren van andere
    boecken belangt, ick dat wel gedencken, en als ick tijt sal vinden daer mede aengaen. Want
    ook deselve allemael hebbe opgeteickent, en daer manckeert mij niets als de tijt. Dat U
    Ed. getwijffelt heeft of ick noch tot Florence ben, kan ick niet gebeteren, want ick mij
    daer gaeren van de tijt diene, en het is soo, dat soo Sigr. Cappelen mij ter goeder hadde
    willen crediteren en waerschouwen als daer gelegentheijt was in de somer ick was voort gegaen.
    Iegenwoordich is tot Livorno wel gelegentheijt, maer U Ed. daer meer swarigheijt in vindende
    als ick ben geresolveert dese pinster teenemael in de Laurentiana deur te brengen, men kan
    niet anders doen als een goet voornemen te maecken, en dan oock met alle vlijt hetselve
    uitte voeren en se soo het den hemel belet, het is evenwel prijsselick dat men in goede
    dingen sijn best gedaen heeft. Doch het is mij ten hoogsten aengenaem te horen van U Ed.
    geluckigen staet, doch dat U Ed. schrijft mijne saecken in Hollant niet qualick te staen,
    wil ick hopen, want dat  is mijn eenich toeverlaat. Dat U Ed. verder schrijft mijne saecken
    tot Deventer niet sullen versuimt worden. U Ed. kan mij hier naemaels maer laten weten dat
    ofte dat voor mij [tot] /tot Deventer\ niet versuimt te wesen, want ick mij ander bewust
    ben, en kan U Ed. staelties genoeg ter contrarie aenwijsen, en Lhaer op Holloo sal mij wel
    haest hetselve beter doen gevoelen, daer ick wel weet dat niet een haijr om soo te spreecken,
    in mijn absentie sal uitgevoert worden, wat ick oock mach schrijven. Doch daer over hebbe
    ick patientie kruit genoech ingenomen, en dat sal mij uit niets bewegen, om hier mijne dingen
    te versuimen. De laeste wissel hebbe ick /den 28 <>resti\ getrocken van 15 scudi d’oro,
    uitmaeckende 16 silvere /scudi of\ ducatons en 4 gratzien of 3 stuivers en een half. Over
    drie a vier weecken meene deselve prijs noch eens te trecken. Met de Konigin hebbe ick veel
    in tgenerael gesproocken en vroegh mij naer U Ed. sijn staet, of getrout waer, en dat vader
    zaliger van haer genodicht was om naer Sweeden te trecken, en prees U Ed. oratie, en dat
    sij eenige dagen de ionge Heinsius de kost gegeven hadde, ick geloof H. Kon. Mai. hem daer
    naer het hof ontseijt heeft. Een hoveling vroegh mij wat religie hij hadde, waerom ick lagte,
    en dien Hoveling seide oock, hij gaf sich hier voor catolijck uijt, maer sijn religie soo
    veel niet ter herten ging. Tot Napels reisde mij onse Consul dat seecker Hollander voor
    eenige dagen bij S. Ed. was geweest, seggende hij een staten soon was, waer op de consul
    seide hetselve niet geloven /of\ most brieven hebben, en desen Hollander hadde 2 a 3 dagen
    daer naer sijn cameraet een duijtscher een wissel ontstolen, doch alles in tijts bekent
    wordende heeft dese Hollander de wissel moeten wederom geven. Nu wie het is, daer is ons
    niet aengelegen. Dat tot Deventer ijmant gecondemneert is, alhoewel hij het feijt ontkent,
    moet soo vreemt niet voorkomen. Sande verhaelt in Vrieslant een dootslaeger, ontkennende
    hij sulcks gedaen te hebben, doch evenwel aen de raetsheeren blijckende uit onwederspreeckelicker
    teickenen, dat hij de dootslach gedaen hadde, is evenwel gecondemneert, en Sande prijst
    sulcks. En in Hollant is exempel van ijmant te pijnigen en blijvende bij ontkentenis, evenwel
    gecondemneert te wessen. De groot hertoch hier is gisteren ader gelaten, sijnde met een
    koors aengetast, de Alm Godt. wil ons sulcken patroon voor verdere instortingen bewaeren.
    Is het Schip Isabella schipper Dirck Verburgh noch niet gekomen? Heeft van Juli af zeil
    voor Livorno gelegen. Hier Godt bevolen naer mijne hertelicke groetenis,


    aen U Ed. en U Ed. Liefste, darr ick meer verlangen naer hebbe om te sien, als om mijne
    saecken besorgen.


    Florence, Maend. 14 Oct. 1680'
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 11-11-1680
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 16, fol. 1.
  tekst: '[1r] Mon-Tres-Cher et Tres-Honore Frere


    De nootsaeckelickheijt van Grotius hebbe niet geweten, doch soo deselve aen nimant gedediceert
    is, wat heerlick voor ons geweest deselve te dediceren aen Duc te Montausier, hem bedanckende
    voor de eerst etc., alhowel het met onse schaede geschieden soude, en daer niets meer van
    te wagten hadden. De Tacitus behaegde S. Ed. beter als de Virgilius. Hebbe Sigr. Magliabechi
    dickwils gevraegt in sijn huijs nae dien brief van malam linguam, doch segt deselve niet
    te konnen vinden. Doch als hijse gevonden sal hebben, sal ickse copieren. Schrijve an Grevius
    sijn boecken ter ede te draegen alsoo ick meene eerder een schip in Hollant sal arriveren,
    daer ick dat sal indoen als ick. Die 2 graeven in Portugael kent Sigr. Magliabechi niet.
    Seijdt U Ed. gebruick te hebben, sijn Stobaus gedruckt tot Basel 1549. Heeft pag. 630 buiten
    de index. De Flores is op wech voor Sigr. Magliabechi. Ick ben van sins Magliabechi Pandecten
    van mij seer bekladt over te senden. Waerom U Ed. wil gebeden mijne Pandecten met ten eersten
    mij over te senden, en noch andere boecken die U Ed. dan wil gecollationeert hebben. En
    al is mijn pandecte een legatum Scaligerien veel perikel onderworpen sal wesen, evenwel
    versoecke U Ed. mij ten eersten dat wils toegeven en addresseren dor de Bane an Cappelen,
    of soo U Ed. best oordeelt, en voor al anatomia oculi van Verle gedruckt tot Amsterdam,
    daer mij de patroon al dickwils om gevraegt heeft, en 3 linnen hembden 3 nacht mutsen en
    4 paer sockken. Ick hope ten eersten te verstaen, dat U Ed. dit sal maecken op wech te wesen
    en wat U Ed. verder van boecken mij nootsaeckelick sal agten. Ick weet niet wanneer d’Heer
    Capitein de Liefde sal arriveren tot Livorno, doch tegenwoordich kan soo schielick afbreecken
    van het collationeren in de Laurentiana. Maer ben geresolveert in de naeme Godes in Februario
    een reijse heijer op te nemen te water van Livorno De reijse van Tavernier hebbe ick niet,
    maer van Cornelio Magni van Livorno geseijlt den 5 Nov. en een beter del Sigr. Sortier te
    water van Marsilien met de Ambassadeur Haka hebbe gekoft. Mijn kamer sal ick behouden, en
    daer is alles wel bewaert. Meene niet de Groot Hertog daer nu Ministers heeft, sal anders
    lichtelick recommandatie obtineren. De ingeleiden hebben an Cappelen bestelt, doch Fontaine
    gaf mij de wissel vrij beter koop, doch moet dat u soo patienteren. Hebbe weder ontfang
    16 (scudi, ijder scudi 10 schellingen een een half) en 5 grarzien 4 stuivers en een half.
    Nu soo mij saecken te slecht staen in Hollant gelieft mij in tijts te waerschouwen, hebben
    noch 100 Rixd. in gout bij mij. Plureo 59, 45 Thracis Grammatica weet niet of gedruckt is
    of niet. Kan U Ed. eenige teeckenen mij schrijven om die Seneca te kennen, alsoo Pancearice
    Magliabechi execemplaar heeft. Den abt int klooster del Monte Carina kan die Plinius niet
    verkopen, en soo die te koop was, daer was Barbaerin, of oock voor het Vaticaan, is geloofelick
    gestolen te wesen Ick hebbe daer niet geweest. Hebben wij Romam Nardinii niet, en is ons
    dat boeck niet nootsaeckelick. Heidanus de origine erroris staet boven aen inter prohibitos
    van dit iaer. Vergeet doch niet de Pandecten te senden met den eersten met Verle Anatomia.
    Mijne hertelicke groetenis aen U Ed. en Ued. allerliefste. Blijve valete. Het is al nacht,
    den 11 nov. 1680.'
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 07-01-1681
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 17, fol. 1.
  tekst: '[1r] Mon Tres-Cher et Tres-Honoré Frere,


    Nu eens verlost wesende uit groote benauwheijt, dancke den Almachtige Godt, dat U Ed. weder
    kragten begint te krijgen, hopende alengskens verder tot volkomene gesontheijt sult raecken.
    Van Grotius segge dat ick wel gewenst hadde het niet gedruckt was doch het niet konnende
    beletten, neme daer in patientie. Ick hadde groot speculatie in dat boeck, soo U Ed. dit
    wel trecken tot alle andere Mss. die best waren sat sij gedruckt wierden, dat kan ick niet
    beletten. Van suspicie weet ick niet, altoos soo U Ed. mij eenige suspicie gaf, ick soude
    al mijn saecken soo open en sonder eenige aenteickeninge <> U Ed. niet laten berusten. Ick
    kan U Ed. geen klaerder teicken geven, en de Heere kent mijn hert. Bidde maer mijn uur voor
    de uwe mocht komen. Van dat ick ijets wil hier hebben, is mijn meeste speculatie geweest
    mijne pandecten 2 volumen in folio gedruct in Florence en voor in []nu Thuningii dat het
    is legatum Scaligeri, is in leer of diergelijck ingebonden sijnde 2 groote stucken in Folio,
    en licht te kennen. Ick hebse gehadt in den Haegh, soo U Ed. die mede in de mande gedaen
    heeft. Is alles /wel\ soo niet versoecke als noch met de eerste gelegentheijt /deselve\
    over te senden, per occasie van dit boeck, dat mij hier nootsaeckelick is, en ick verwagten
    moet, hebbe eenige boecken opgeteickent, soo U Ed. siet in dit papierken; het moesten drucken
    van Aldus wesen, met groote marginalen en goet papier, doch oude editien, dewelcke soo verloren
    wierden, ons geen schade konnen doen, en lichtelick mogen gewaegt worden. Mijn corpus iuris
    in quarto sal ick wederom senden, soo als het komt, want ick dat niet begere. Bedancke U
    Ed. hooglick van dat linnen, dat mij willekom sal wesen, doch siende dat U Ed. meer sent
    als ick begeert hebbe, neme de vrijmoedigheijt van noch een paer witte goede gebreide kousen.
    Ick hope het linnen geen camerdoeck of met kant sal wesen, soo ick dat sie, worde genootsaeckt
    het selve wedrom te senden soo als het komt, doch ordinaris goet linnen sal mij wel te pas
    komen, hope alles met dancbaerheijt waer ick sal konnen te recompenseren. Ick sal U ed.
    mandeken wederom senden, soo ras als ick sal gelegentheijt vinden, naer dat ick het onfangen
    hebbe met de Pandecten. Want daer wrde genootsaeckt nauw te wagten. Epictetus Christianus
    heeft mij U Ed. van te voren niet een woort van gesegt of geschreven, doch is nu gedruckt
    onder ander wecken Nili tot Romen /Tygris Barberinis\ 1673, dat ick verwonderde, omdat naer
    die tijt U Ed. hier geweest is, en 1673 sie ick seer wel in dat boeck nu op mijn kamer,
    alsoo het van Magliabechi geleent hebbe, uitgegeven van Suares in folio. Ick sal het kopieren
    en daernaer confereren. Epictetus begint pag. 327 tot pag. 353 quo pluteo est nisis. Cap.
    32 is omtrent de helft van Epictetus. Meent U Ed. het Mss. grooter is of completere. Parutce
    numismata in folio kost de patroon 2 /goude\ pistolen, maecke swarigheijt voor een boek
    soo veel te geven, en dan noch te wagen over zee. Plutarchus hebbe niet eens noch ingesien,
    maer hebbe hem voor eenige weecken gehaelt van de patroon, om de sijmpatiaca naer Terian;
    doch om de koude en sware lucht moet wagten naer de winter als mede Dion. Thrax. soo ick
    niets nootsaeckelicker vinde, sal hem wel uitschrijven. Elcemosinam Hamburgum consentio
    tantam, quantam petit, non maiorem, nam si quid essem libe valis, alii ex io lucrum caperent,
    quod nolo, en ick voor niemant anders ijets hebbe als alleen voor haer, dat ick wel garen
    doe, doch durf mij niet openbaren. Ick geloof niet dat verder gae, want mijn tot teenemael
    te kort is, iae niet toe sal laten mijn arbeijt alhier soo verre te bre<> als wel wenste,
    dat mijn arbeijt alh<ier>


    /wil voor eerst continueren. Versoecke vriendelick U Ed. niet een woort van dese mijne collatie
    ad Senecam spreeckt, is facis invidebis parcurium sudori. Maer alleen dat etc. Doch U Ed.
    moet altijt gedencken in andere boecken de patroon, et dignus est. Hier wort een comeet
    gesien wel om soo lang van staert, als voor 17 iaeren. De dot van oom doe de mij wel an
    therte, sijnde het eeuwige steunsel geweest etc. Is steno condiuter tot Munster, dat hij
    lang geweest is? Ick hebbe geen sins gehadt om Turcks of Hebreeus te leren, maer meest om
    eenige steden te besien. Naer mijn hertelicke groetene, bezie U Ed. als mede U Ed. Alderliefste
    den ALmachtige Godt, den 7 Janua. 1681.'
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 30-01-1681
  plaats_verzender: Florence
  land_verzender: IT
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
  taal: Nederlands
  bron: Van Asch van Wijck ms. 1272
  opmerking: Ms. VAvW 1272, no. 18, fols. 2.
  tekst: '[1r] Mon Tres Cher et Tres-Honore Frere,


    Ick kan niet naelaeten of moet U Ed. oock noch dese toesenden, sijnde den vierden brief
    uit Florencen aen U Ed. gesonden. Den eersten was van den 28 november en soo twee achter
    malkander met twee brieven van Sr. Magliabecqui. Ick konde al wel antwoort op deselve van
    U Ed. hebben, soo die brieven of wel bestelt, of U Ed. in goede gesontheijt waer. Ick hebbe
    gesien uit uwen laesten aen Sr. Magliabechi dat U Ed. heftig met de coors bevangen is, waerom
    ick nu noch geen wissel begeer, voordat ick eerst antwoort van U Ed. sal hebben. Ick kan
    hier noch wel wat recken met mijn beurs, maer als ick uit Florencen gae moet ick seeckerlick
    eerst wissel trecken. Ick hebbe U Ed. dan geschreven hoe ick alles meene wel bestelt te
    hebben in Paris, soo van een Livius Regi als uwe oratie. Als mede hoe ick hier een Livius
    aen S.A.S. gegeven hebbe, die Sr. Magliabechi tegen mijn wil bekosticht heeft te laten binden,
    en daer op kreeg ick 12 a 14 boetelies wijn. Nu is S.A.S. tot Pisa en heeft 2 brieven aen
    Sr. Magliabecqui geschreven in groot faveur voor ons, en in de een ordre voor mij om de
    Pandecten te confereren en in Bibliotheca Laurentiana alles te doen naer mijn brieven. Voor
    eerst dan houde ick mij op inde Pandecten, en sal noch 2 maenden dien arbeit duren. En alsoo
    ick mij sie overvallen van de tijt, weet ick niet hoe ick mij sal reguleren, en ick hebbe
    vrees voor de groote hitte, sijnde ick hier nu in de winter daer ick van buiten kout ben
    evenwel van binnen seer dorstich. Dat ick met abstinentia moet soecken te verdrijven. Ick
    hadde wel lust naer Romen te gaen, en alles daer te sien watter mocht overich wesen van
    oude reliquien, doch U Ed. kan mij daer niet beschrijven, en soo moet nootsaeckelick eerst
    hier een briefien van U Ed. afwagten en voor al laet mij doch weten uwe gesontheijt. Daer
    gaet qualick een dagh verbij of Sr. Magliabechi doet mij nieuwe vriendtschap en geschenken,
    en soo dat soo hij uit sijn eigen vel voor mij soude lopen, ick ben beschaemt soo dickwils
    als ick S. Ed. sie, en tis niet gelooflick [wat] hoe seer sijn Ed. mij bemint, ten ick U
    Ed. daer voor bedancke hooglick soo een patroon voor mij opgespeurt te hebben. S. Ed. presenteert
    mij gelt, boecken iae selver een sleutel van sijn huijs. Het is niet nodich dat ick U Ed.
    weder verhale mijn reijs, hope ten minsten een van mijne drie brieven sal te recht gekomen
    wesen. En oock als ick op wech ben mach ick niet schrijven om de schelmstucken en bedriegerijen
    van de menschen die mij rencontreren, en ick kan niet uidrukcken hoe vervaerlick ick bedrogen
    ben tot Bonenien en Monte Apennino En dit is dese menschen haere daegelickse gewoonten.
    Bij Padres Noris ben ick heerlick getracteert geweest, doch als mij nodigde excuseerde ick
    mij, waer op hij Padre ijmant gesonden heeft tot Sr. Magliabechi S. Ed. en Padre Bartolini
    en mij versoeckende [1v] ter maeltijt. Sr. Magliabecqui sich verlegen vinden met mij, om
    dat ick niet wilde en oock Padre Bartolini weinich lust hebbende met hem te eten. Soo merckte
    ick dat hem de oogen traenden, waer op ick terstont resolveerde. Maer ick kan niet vergeten
    dat Sr. Magliabechi soo vreest voor een vijant dat ick wel wel oordelen. Hij Padre Noris
    wil weten sollemnia hoe dat geschreven wort. Item Acc 4mel in is daer ick dan eenige plaetsen
    voor hem hebben opgeschreven en altijt sollemn. Noch verlange ick te weten of ick in den
    Haegh gerecenseert ben bij de secretaris van Alphen, soo niet wenste wel U Ed. Laurentius
    Theodorus Gronovius op een briefien schreef en dat aen de adv. van der Marsche of Cobmeijer
    of wie het oock isnoch dedet. Ick hebbe U Ed. oock geantwoort op Couwenhoven leugenachtige
    tonge, waerom U Ed. in die saeck door kan alles wat U Ed. goeden raedt gedragen sal sijnde
    haer Ed. mij onbekent. En mijn [pot] spaerpot kan U Ed. aentasten als het U Ed. beliven
    sal en alles. Doch als ick mij wel bedencke, hope ick U Ed. in alles tussen de 2100 a 200
    gl voor mij selver sal hebben, twelck soo sijnde en U Ed. het niet van doen sal hebben en
    dit gelt 100 selver bij U Ed. sal sijn daer onder gereeckent 100 Ducatens van Rouse dat
    ick niet weet of ontfangen /is\ of niet. Soo soude ick versoecken dat bij aldien de obligatien,
    90 het soo gelden. U Ed. voor mij 2000 koftet dat is 1800 gl in gelt voor 2 obligatien ieder
    in 1000 gl. en geen andere sommen. Als 2100 en 900 of 2000 alleen in een obligatie. Als
    ick vertrock golden volbergens obligatien noch soo veel niet, doch sij sullen alle daegh
    nu hoger lopen, waerom ick U Ed wel wilde gebeden door Hilverding of ijmant anders liet
    vernemen. Dese obligatien sijn mij nootsaeckelick en ick ben teenemael geresolveert alvoor
    lang die te kopen. Doch heeft mij aen de macht onttrocken, en sij sullen mij tot Deventer
    wonderlick wel ter gelegen tijt konnen dienen. Ick soude U Ed. mijne redenen daer toe verder
    verhalen doch sonder droefheijt kan ick dat niet doen, en daerom soo U Ed. mijn gelt niet
    van doen heeft, dit eerst, of soo U Ed. ijets /daer\ wil bij doen. Item soo ick ten minsten
    suijver voor silvere ducatons kan overhouden, niet minder maer wel meerder en soo die obligatien,
    het sij van Volbergen die wel het minste kosten, of Pauw of Leijden hoger sijnanders deliberandum
    censeo niet dat ick verandere van resolutie, die wel vast bij mij is maer om dat mij de
    macht ontbreeckt. En oock /een\ van die twee obligatien haere datums of verschijndag most
    wesen in Februario of Martio. Alles om grote redenen. Doch U Ed. op de maer dat hij sijn
    gesontheijt weder krijge, en dan sal alles wel wesen. In de Pandecten hebbe ick oock al
    ijets gevonden, soo dat mijn dien arbeijt wel niet berout, doch U Ed. moet daer niet veel
    van spreecken, daer ick het meest doe om mijn eigen verneederhejt en curieusheijt. U Ed.
    brief moet altijt geaddresseert werden aen A. Magliabecqui, want als ick meende bij eerlicke
    luiden te wesen, soo hebbe ick vernemen weder naer 2 maenden verloop [weder] lelick bedrogen
    te wesen, waerom Sr. Magliabecqui niet meer wil bij mij komen, en wij ons best doen om een
    ander kamer op te soecken, die doch swaerlick te vinden is soo dicht bij het oude paleijs
    daer ick alle daegen naer toe gae om de Pandecten te confereren. Item soo U Ed. [2r] eenige
    boecken wil oversenden, sendse niet door de post, want Sr Magliabechi sullense wel altijt
    aengenaem wesen, doch om redenen moet U Ed. ander gelegentheijt te water soecken. Mijne
    cameraets sijn alle al vertrocken of naer Venetiens om den Vastenavontsgecken te sien of
    naer Romen, en sij wat later tot Florencen komende als ick sijn weinich beter gevaren. Voors
    hebbe ick de Galleria en Villa Imperialis alle gesien, stae verset over de al die kostelickheden
    en wonderlicke rariteijten en dat soo veel. En oock soo out. Het packet voor eenige maenden
    van Sr. Magliabechi met boecken aen U Ed. gesonden heeft Elzevier tot Amsterdam, al voor
    sijn vertreck nae Vranckrijck in sijn huijs gehadt, soo als ick uit d’Heer Goes sijn brief
    verstaen hebbe aen Magliabecqui, en ben seer verheugt dien patroon weder levendich geworden
    te sijn, dien men mij tot Paris al verdroot opgegeven hadde. In dat packet meene ick was
    oock eenige boecken voor U Ed. Nu sal ick wel in een maendt niet weder schrijven, en soo
    ick op desen brief geen antwoort ontfange, of soo die oock niet bestelt wort, weet ick verder
    geen andere raedt als eenich gelt dan van Sr. Magliabecqui te lichten en wederom te repatrieren.
    Hier mede Godt bevolen en soo ick mij moet op wech begeven sonder tot Florencen een letter
    van U Ed. ontfangen te hebben, soo sal ick wel weder niet verder schrijven, maer mij met
    sorchvuldige gedachten aldien tijt moeten ontrusten. Heeft U Ed. mijn Columella met het
    bladt van Baluzius al ontfangen? Blijve nae schuldige opofferinge mijner geringen dienstes
    en [gegroet] hertelicke groetenis soo aen U Ed. als alle andere vrienden en goede bekenden


    U Ed. Onderdanige n Dienstwillige Broeder


    Florencen, den 30 Jan. 1618

    en wensche U Ed. met den ingang van het nieuwe iaer, nieuwe gesontheijt, nieuwe zegen en
    nieuwe vreugden.


    Laurentius Theodorus Gronovius'
