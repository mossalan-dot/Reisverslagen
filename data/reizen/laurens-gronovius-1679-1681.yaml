  tekst: '/Pl. 66 Historia Accirionum, et Vares Phrygius, et Apollonius Tyrii Historia Admirabilis,
    ut ait Holstenius quae aut qualis haec Historia Assiriorem? Vidistine. Vares Phrygius, ut
    puto, stilo agresti et rudi scripsit fabulas. et non dignus collatione. Apud Tyrium non
    novi. Quaeso doceas me de his auctenis. quid faciendum, an reliquendi an confereni aut deseribendi
    /sint\ codex est Longobard. inscripsio Mss. INCIPIT HISTORIA APOLLONII REGIS TYRIE Incivitate
    Antiochided erat rex etx. Infinis deest.\


    [1r] Mon Tres-Cher et Tres Honoré Frere,


    Ick hebbe gisteren eerst ontfangen u Ed. aengenamen van den XI April, waer in U Ed. mij
    bekent maeckt te sullen induceren die U Ed. lief heeft en tegens Meij met U Ed. onder een
    dack te wonen. Ick hebbe sulcks noijt seeckerlick geweten dat U Ed. soo geluckich was, daer
    ick maer seer flauwelick van te voren van onderricht ben geweest, sijnde geweest van die
    tijt af in gedurige vrees voor U Ed. Ick soude mij noch gewacht hebben desen brief alhier
    ingesloten af te vaerdigen, soo u U ed. mij nu niet vastelick verlost haddet van die vrees,
    waerom mij ten eersten hoochlich schuldich geacht hebbe subitelick te betuigen hoe lief
    en aengenaem mij dese boodtschap geweest is, versoeckende van U Ed. ernstelick dat soo daer
    noch eenich schrupel mocht resteren, dat ick niet wil hopen desen ingesloten achter te houden,
    [of oock] en alleen mondelick dan mijn hertelick verlangen daer nae wilt bekent maecken,
    en waer het in mijn vermogen sal wesen altijt te tragten om haer Ed. geene de minste redenen
    van berouw ofte leetwesen te geven van dat ick haer [Ed] naer desen mij verstoute met broederlicke
    affectie te begroeten. Ick bidde U Ed. hertelick mijn schuldige plicht bij haer Ed. af te
    leggen en mij te excuseren, soo ick in dese hoochwichtige saeck, waer op ick antwoorde ten
    anderen dage, naer dat ick daer van onderricht ben, niet promptelick genoech hebbe geantwoort.
    En het doet mij leet dat ick niet ter selver uur soo als ick die aengenaeme tijdinge ontfange
    hadde, ten eersten mach antwoorden, daer ick nu moet toelaeten dat desen brief soo langsaem
    en traegelick sal bestelt worden tot groot veragtinge van mij en onuijtspreeckelick verlies
    van affectie, daer ick nu wel wenste een Leijdtsche duijf deselve brief onder de vlercken
    te binden, om deselve brief van soo veel gewicht oordele, maer ten minsten dat daer uit
    blijcken kan hoe gaerne en aengenaem het mij is een goeden ingang van vriendtschap te maecken,
    en deselve daer naer heijliglick te onderhouden, en sonder een goedt begin is vriendtschap
    seer brosch en lichtelick verwerpelick. U Ed. verruime doch niet dese mijne [1v] langsaemheijt
    ten besten te keeren, dat ick soo verre van huijs ben, dan hier, dan daer, en iuijst nu
    ter tijt wonderlick geswerft hebbe, en onseecker onder wiens dack mij nederlegge, ben heele
    dagen oock nu op de straet, om d’een of d’ander antiquiteijt te ondersoecken, en nu van
    achtermiddach was /ick\ in de tuijn van de cardinael Farnese. Daer Augusti Palatium geweest
    is en van veele andere keisers grootelicks vermeerdert sijnde, is nu niet meer kendbaer.
    et locum in ipso loco nonnumquam quaero, alhoewel ick de plaets in een kaert voor mij hebbe
    afgeteickent. Bellorium salutavi en die heeft mij schone antiquiteijten getoont, is een
    heer seer stil en geleert. Admiranda veteris urbis vestigia van hem uitgegeven, emi Columna
    Traiani tab. 59 en 61 sal ick moeten van verre sien, alsoo ick deselve altijt besloten vinde,
    daer ick in de Antonina heel boven geweest ben. Ick hope haestelick te verstaen dat U Ed.
    van de koors sal verlost wesen, mijn vriendt die mij naer middags plag te begroeten, begint
    mij allengskens te verlaten, soo dat hij sijn reeckening bij mij niet vindende andere Bacchus
    meer beminnende moet opsoecken. Hoe U Ed. beiegent wort van mijnent wegen, is mij ten hoogsten
    leet, en die menschen moeten weten dat het wel waer is, U Ed. mij sulcks geraeden heeft,
    maer dat ick oock een weinich selver mij ondersocht hebbe, of ick sulcks de pijne waert
    geacht hebbe van sulcke moeiten en onkosten te doen, daer ick geensins berouw van hebbe,
    als alleen nu, dat ick [in] U Ed. wel wilde sien sitten gekroont van soo een heerlicken
    en treffelicken arm, wiens deugden ick wel eenichsins van Ial. Celkart gehoort hebbe. U
    Ed. laet doch nimant van Deventer dese brieven sien of horen, die mij wel kennen, en ick
    haer oock. En soo sij U Ed. verder verdriet aendoen om mijnent wille, soo versoecke ick
    het te mogen wie, en soo hij lust sal hebben goede gesonde redenen te voeren, ick sal hem
    niet schuldich blijven. Ick worde weder verlaten van de tijt, en meene over twee weecken
    weder naer Florence te keeren. De patroon schrijft van Florence, het scande is van Rome
    te gaen sonder in de Vaticaen gearbeijt [2r] te hebbem, waerom dan soecke bij de boeckv.
    een Amm. Marcellinus om die /te\ confereren, daer ick groote moeijte sal toehebben om dese
    licentie te konnen verkrijgen. Maffeus heeft sijn Stephanus wel willen langen om hier tot
    Romen te confereren, doch kan hier geen ander editie kopen. Gli medaglioni van Bellorius
    sal ick wel gedencken. Verblijve


    U Ed. Onderdanige en Dienstwillige Broeder


    Romen den 19 Maij 1618.


    Laurentius Theodorus Gronovius


    /Jo Gaetano chiari fo Umilma. Reverenea all’crudi.mo Sig. Giacomo Mis Sig.re. con vicordarli
    la mia anticho servitù egia che mitrouo priuo della sua deolce vista mi specchio in quello
    del suo sigre. Fratello mio Riverito Sigre.\'
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 17-07-1681
  plaats_verzender: Florence
