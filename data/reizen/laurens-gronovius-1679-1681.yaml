  opmerking: 'Ms. VAvW 1272, no. 3, fol. 1.


    Synopsis: Gronovius informs his brother of his disapproval of their sister Maria’s upcoming
    marriage to Joan Nylant. He asks around about the general opinion of Meibomius, whose work
    Jacobus Gronovius has discredited in a recent letter (see excerpt). He discusses the matter
    with Huetius, Thévenot, Justellus, and Toinard. Justellus and Auzout claim Jacobus Gronovius
    is mistaken in his calculations and Laurentius tries, fruitlessly, to inform what errors
    these are. He informs his brother about recent publications in Paris, including Huetius’
    Demonstratio Evangelica, the collected works of Saint Augustine and Baluze’s Lactantii liber.
    He relates his visits to the Colbertine (see excerpt) and the Royal library, as well as
    his collations of Columella’s De re rustica for Graevius in the Abbey of Saint Victor. Gronovius
    writes that he has offered his brother’s and his father’s letters studies to Count Montausier,
    as thanks for his introduction to the dauphin and Colbert. After a failed attempt, he manages
    to offer his father’s Tacitus edition to Louis XIV (see excerpt). On request of Thévenot,
    he asks his brother to send copies of the Livy letters, his brother''s Leiden oration, the
    Oratio de ratione studiorum suorum, and J.F. Gronovius’ Oratio de Rege Regia proconcione
    (see excerpt). His host asks for butter and cheese from Holland. Gronovius instructs what
    should happen with his finances.'
  tekst: "[1r] Mon Tres-Cher et Tres-Honoré Frere, \n\nIs het mogelick dat U Ed. soo vergeten\
    \ heeft een discours over die saeck tot Deventer? Dedita opera heb ick niet geantwoort daer\
    \ op, et literis scripta manent. Evenwel sal ick niet nalaten U Ed. gehoorsaemheijt te betone,\
    \ alhoewel misschien met mij haet op de hals te jagen. U Ed. vraegt mijn sentiment en laet\
    \ mij niet eens weten waer het meest op aenkomt: of hij practijck of ijets anders heeft\
    \ en soo hij dat niet heeft, wat vreugt is daer van te verwagten? En reeckent eens al de\
    \ deugden (waer tegen hij niet kan halen in sijn persoon) van onse suster waer mede sij\
    \ excelleert. Al hadde hij goede practijck of een officie, evenwel is sij hem gelijck en\
    \ sonder dat behoort hij te wijcken voor haer. Ick hebbe haer in Hollant willen hebben doch\
    \ U Ed. of sij hebben daer geen treck toe. Wat houwelicks goudt sal hij doch mede brengen?\
    \ Daer nimant misschien op sien sal, daermen in Hollandt evenwel altemets een houwelick\
    \ om afstaet, en men siet datter altemets juweelen voor de bruits gelt gekoft worden. Ick\
    \ segge oock recht uit dat ick een houwelick van leeggangen disapprobere in sijn brief,\
    \ die U Ed. kan inhouden en mij te laeten weten of senden. Maer ick twijffele niet of het\
    \ is al te laet en ick vergeefs pampier bekladt. Doch ick wasse mijn handen in onschult\
    \ en betuige onwetende te sijn van sijn conditie, en [het] valt misschien contrarie als\
    \ ick mij inbeelde, dat ick met blijtscap horen sal. 50 ecus alle vierendeel jaers is soo\
    \ veel niet als U Ed. sich inbeeldt en ick geef niet veel minder. \n\nHet was het uytterste\
    \ opschrift dat Montausier niet behaegde, alsoo ick de voornaem daer had bij gedaen en dat\
    \ kon ick tot St. Germain niet veranderen, soo dat ick de Tacitos alleen [doe] opofferde,\
    \ en weder tot Parijs komende liet ickse Mr. Huet sien, die mij de erreur toonde en dat\
    \ verandert sijnde, heeftse Mr. Huet overgegeven. Ick gaf [aen Huet] uwe epistolen, en vraegende\
    \ nae Meiboom, soo seide S. Ed. audacem esse en prees hem niet. \n\nHuets Demonstratio Evangelica\
    \ in fol(io) hebbe ick bij Thevenot gesien, die het boeck prees. Ick geloof niet U Ed. gesien\
    \ te hebben ofte weten dat dit boeck in t licht is. Noch is hier uitgekomen Augustini opera\
    \ door hulp van vele monnicken en met veele MSS. geconfereert in veele stucken in fol(io)\
    \ Balluzii Miscellanea en een boeck van Cotellier in (quar)to. Sal U Ed. Hacke mede brengen.\
    \ Kosten 10 gl.. Chronicum Orientale sal ick oock kopen soo ick gelegentheijt vinde om tselve\
    \ over te senden. Dat ander van Constantini Porphijrogenii daer wort noch aen gedruckt.\
    \ \n\nDe eene Livius op Colberts bibliotheecq was tamelick out, de ander was op papier geschreven.\
    \ Wat voor boecken daer in waren, is mij vergeten en ick meene ouder MS. bij vader gesien\
    \ te hebben. In de conincks biblioth(eek) sijn stucken van Herodotus, Strabo, Pausanias,\
    \ Epictetus, Livius en Gellius als ick in de cataloog gesien hebbe, sonder de boecken te\
    \ hebben gehandelt. In dese MSS. was wel wat te doen en ick hadde oock wel lust, indien\
    \ tvergeefs lopen mij niet berouwde en tegen hield. \n\nThat Livy in Colbert's library is\
    \ rather old, the other is written on paper. I have forgotten what kind of books there are\
    \ in this. I think I have seen an older MS. in father’s collection. In the catalogue I have\
    \ seen that the Royal Library has documents of Herodotus, Strabo, Pausanias, Epictetus,\
    \ Livy and Gellius. I did not request these books. There is some work in here, which I would\
    \ gladly do if I was not discouraged and halted by my continuous walking around. \n\nIck\
    \ hebbe uwe epistolen door een boeckverkoper Daniel sijn bibliothecaris laten geven aen\
    \ Montausier, alsoo ick hem verobligeert ben door sijn moeijte om mij te brengen eerst bij\
    \ den Dauphijn, en van daer nae [bij] Colbert. Nae eenige weecken quam ick weder tot St.\
    \ Germain door anraeden van Mr. Thevenot. Daer gekomen sijnde, vonde ick de Tacitos niet\
    \ overgegeven aen S(ijne) K(oninklijke) M(ajesteit), alhoewel ick sulcke ordre aen Mr. Huet\
    \ gegeven hadde ut scripsi tibi en [ick] wist oock niet beter of alles was gedaen, doch\
    \ mijn vriendt Thevenot was qualick tevreden dat ickse niet retour gegeven hadde. Tot St.\
    \ Germain [dan] vindende de Tacitos seide mij den duc een uur omse aen S(ijne) K(oninklijke)\
    \ M(ajesteit) te offereren, doch was vergeefs. Tsanderen daegs quam ick ter gestelde tijt\
    \ weder en den duc doen gelegentheijt (die hij mij wonderlick wel scheen te soecken) krijgende,\
    \ leide mij bij S(ijne) K(oninklijke) M(ajesteit) en se uit mijn handen nemende, seijde\
    \ ‘Je vous remerci’. En den duc seijde dat ick nu wel vertrecken kon, dat ick gehoort hadde\
    \ wat S(ijne) K(oninklijke) M(ajesteit) seijde. \n\nI have given your letters to the bookseller\
    \ Daniel’s librarian who has given it to Montausier, since I am obligated to him for his\
    \ hard work to introduce me to the dauphin and to Colbert. After some weeks I arrived in\
    \ Saint-Germain again, as had been recommended by Mr Thevenot. Arriving there, I found that\
    \ the Tacitos had not been given to His Royal Highness, even though I had given Mr. Huet\
    \ orders to do so, ut scripsi tibi. I would not have known better or it had been done. However,\
    \ my friend Thévenot was displeased I had not returned it. In Saint-Germain the duke told\
    \ me to offer the Tacitus within the hour, but that did not happen. The other day I arrived\
    \ at the same time, and the duke had the opportunity (which he seemed pleased to find) to\
    \ lead me in front of His Royal Highness. Taking the Tacitus from my hands, he said: “Je\
    \ vous remerci.” The duke said I could leave now, since I had heard what His Royal Highness\
    \ had said.\n\nThevenot is wonderlick blijde hier over, sonder dat ick weet waerom en seijt\
    \ men moet nu alles geven [van boecken wat ick hebbe. Daerom hebbe ick uwe epistolen kostelick\
    \ laten binden voor sigr. Colbert, met een oratie. In de konings biblioth(eek) is geen Livius\
    \ in (octa)vo. Ick hebbe oock geen noten meer. Duc de Montausier heeft oock geen Livius,\
    \ soo dat ick niet geloven kan die noten hem aengenaem te sullen sijn, doch Thevenot en\
    \ de bibliothecaris Daniel seggen anders. Ick hebbe noch een exemplaer aen Mr. Thevenot\
    \ van uwe noten [gegeven] dat S. Ed. mij niet seggen konde voor wien het was. Ondertussen\
    \ raeckte ick uwe boecken en mijn gelt quijt, doch soo dat ick noch geen berouw hebbe, want\
    \ ick haer meer schuldig kenne. En soo ghij soo gesint sijt, soo most ghij senden een heele\
    \ Livius voor S(ijne) K(oninklijke) M(ajesteit), een voor Montausier, en 4 a 5 noten, [4]\
    \ orationes de lege Rege en 10 a 14 orationes van de uwe. \n\nThevenot is exceedingly pleased\
    \ about this, even though I do not know why, and he told me to present other books I carry.\
    \ That is why I have asked for your epistles and your oration to be costly bound for signeur\
    \ Colbert. In the Royal Library there is no Livy in octavo, nor do I have any notes. Count\
    \ Montausier does not have a Livy either, so I cannot imagine that the notes will be pleasant\
    \ to him, even though Thevenot and the librarian Daniel say otherwise. I have presented\
    \ a copy of your notes to Mr Thevenot, but he could not tell me for whom they were meant.\
    \ In the meanwhile, I am losing your books and money, even though I do not feel remorse,\
    \ for I have a larger debt to them. If you so feel like it, you should send me one whole\
    \ Livy for His Royal Highness, one for Montausier, and four or five copies of your notes,\
    \ four Orationes de lege Rege, and ten to fourteen of your orations.\n\nHacke segt eenige\
    \ gelegentheijt te weten over Brussel op Antwerpen, daer U Ed. moet spreecken en overleggen\
    \ of het te veel is, of anders door Elzevier ordre geven, maer ick gelove niet hier soo\
    \ lange te verblijven. Ick hore Elzevier] [1v] sal hier komen. \n\nJustelllus is seer qualick\
    \ te vreden over [uwe] laeste epistel van Meiboom, eerst seggende dat Meiboom een geleert\
    \ man is, dat ick tegen spack in literis. Daer op seide hij van mathematicus, historicus\
    \ en alles, dat ik seide niet te willen tegenspreecken, maer ick bleef bij mij text van\
    \ litens [Humanistibus] dat hij al te scherp van u met comitus wierdt uytgemaeckt. Ick seide\
    \ die soo te pas quamen, en dat U Ed. sich daer niet in ophield, maer terstont ad rem ging\
    \ ik u tweeden seide hij U Ed. hier en daer in remis errare (dit is wel 4 weecken al geleden\
    \ en ick hebbe gewenst U Ed. alles te gelijck te schrijven). Ick gae dagelicks aen sijn\
    \ huys om de errores te horen, hem seggende ick hier gekomen was om dat te leeren, maer\
    \ tot noch toe hout hij mij op en heeft mij nu belooft alles selver te willen schrijven\
    \ en segt sijn boeck geleent te hebben aen een mathematicus en die mathem(aticus) neemt\
    \ ook qualick. Justel is niet vast in een discours. Ick disputeer altijt met hem dan van\
    \ politie, dan van studie, doch hij wort niet quaet alsmen hem tegenspreeck, anders [soude\
    \ hij] onverdraegelick wesen door sulke slechte discoursen. Hij heeft mij gerecommandeert\
    \ aen de bibliothecaris van S(aint) Victor, dewelcke mij alles heeft laten sien, en een\
    \ Livius op pergament tamelick out. \L\nJustellus is very displeased about your last epistle\
    \ about Meiboom. First he said Meiboom was a learned man, which I countered in literis.\
    \ Then he said he was a mathematician, historian and the like, and I said I did not want\
    \ to argue that, but I stuck to my text of litens humanistibus that he had been pointedly\
    \ called comitus by you. I said all that I thought of and that you do not tarry in that\
    \ but immediately go on ad rem in your second letter. He said you are in remis errare here\
    \ and there. This had been four weeks ago, and I have wished to write you this. I go to\
    \ his house every day to hear the errores, telling him I came there to learn them. Up to\
    \ now he is still delaying and he has promised me to write it all down and says he has leant\
    \ his book to a mathematician, and that mathematician takes it poorly as well. Justel is\
    \ not headstrong in conversion. I always argue with him, either about politics or study,\
    \ but he does not become mad when you disagree with him. Otherwise he would be unbearable\
    \ because of so many poor conversations. He had recommended me to the librarian of Saint-Victor,\
    \ which he has shown to me, and it has a very old Livy on parchment.\n\nIck hebbe oock niet\
    \ een gedruckt Livius bij mij en tegenwoordich slendere ick nae de bibliotheecq van St.\
    \ Germain voor Grevius alle dagen om de Columella te confereren, dat mij verdriet soo veel\
    \ tijt heen en weer te verliesen, doch dewijl suster segt dat de Hollanders de Fransen moeten\
    \ volgen en gehoorsaemen oock in ons eigen landt, soo ist dat ick dat soo inschicke. \n\n\
    Uwe epistolen hebben Menagius, die ick niet kan te spreecken krijgen, Cappelain, die mij\
    \ wel besocht heeft en ick hem, maer hij praet meest van de joden en van de lector juris\
    \ tot Leiden, Kozole, die hij wel kent, en oock heef se Baluze. Altoos sij sijn nu alle\
    \ wech. Thoinard is mij in t jesuiten convent tegen gekomen en hij van U Ed. spreeckende\
    \ onbekent voor mij, vroeg mij nae U Ed. gesontheijt en seide epistolen van U Ed. tegen\
    \ Meiboom gesien te hebben. Daer vroegh ick sijn oordeel, maer S. Ed. seide niet van errores\
    \ en dat Meiboom te kort soude schieten in antwoort. Hiernae bekent wordende, sijn wij gescheiden.\
    \ Hij is mij noch eens tegengekomen op de straedt. Renaudot sprack ick de laeste mael tot\
    \ St. Germain en die heeft uwe epistolen niet. Ick kanse hem oock niet geven alsoo ick er\
    \ geen meer en hebbe en hij laet U Ed. groeten. Dat van pere Lubin sal ick eens gaen naesien\
    \ [in sijn boeck] en daer nae met geleerden van die saeck spreecken. \n\nDen brief aen Limborch\
    \ kan U Ed. weder an Volder geven en seggen dat ick op het vertreck van Paris stae nae Italien,\
    \ dat ick niet doen sal of ick sal U Ed. nader schrijven en mischien 200 a 300 gulden hier\
    \ lichten. Van Rouse laet mij doch geen woorden meer toekomen, maer alleen of hij gelt gegeven\
    \ heeft op sijn tijt of niet. Ick ben sat daer van [te horen] dat het geschieden sal en\
    \ diergelicks, hetwelck langh genoeg geduurt heeft en mischien tot mijn wederkomst. Of U\
    \ Ed. d’ordonnantie weder beleggen sal konnen tegen een ander ordonnantie sal swarigheijt\
    \ wesen, alsoo die tijden sijn verandeert. Vraegt oock Wijnbergen niet, maer al mijn losgelt\
    \ van Deventer kan U Ed. bij sich ontbieden en mij van laten weten, alsoo ick dan wel gemist\
    \ sal wesen als het U Ed. ontfangen heeft. Ick hebbe hier eenige Spaense pistolen en die\
    \ kan ick niet wel uitgeven, soo dat ick ander gelt sal van noden hebben. Ick hore dat prof.\
    \ Lemoine sullen hier komen van dese somer. \n\nFrederick Michielsens dochter praet gedurich\
    \ van een tonnetien boter van U Ed. soo lang belooft, en U Ed. soude best doen met Hacke\
    \ of ijmant anders daer van te spreecken hoemen een tonnetie met twee roode ronde kasen\
    \ soude oversturen. Ick seide U Ed. wel een kaes soude sturen, maer men dorst twee voor\
    \ een eijschen van die roode soetemelck caesen. En tonnetien boter moet geen vierendeel\
    \ wesen maer een half vierendeel. Is groot genoeg, als sij maer goet is en duren kan, gelijck\
    \ in septemb(er) gemaeckt wort. \n\nHier mede Godt bevolen. Hoe staet mijn brief aen Nilant\
    \ aen? Houtse bij U Ed. soo sij mishaegt en in al geval daer is geen haest in. \n\nVale,\
    \ Paris den 12 aug(ustus) 1679.\n\nHacke sal U Ed. desen brief behandigen, wien ick Balusii\
    \ miscellanea en een boeck van Cotellier met de kaert van Parijs en een paer oude hantschoenen\
    \ die mij veel gekost en in Holland kan laten wassen, vol van apricoosteenen, die hier drooger\
    \ sijn als in Hollant. Iteru(m) vale."
- verzender: Laurens Gronovius
  ontvanger: Jacob Gronovius (1645-1716)
  datum: 15-09-1679
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Leiden
  land_ontvanger: NL
  relatie: broer-broer
