beschrijving: Verslag van Antje C.W. van Hogendorp (1766-1803) van een vlucht vanuit de buitenplaats
  Sion bij Delft over Den Haag naar het stadhouderlijk hof in Nijmegen en terug in 1787. Het
  verslag is gericht aan een vriendin. Van Hogendorp reisde met haar moeder Carolina Wilhelma
  van Haren, haar zus Truitje (ca. 1765-1800) en haar nicht Lucie van Sandick (†1791). Geertruida
  hield ook een verslag bij (Van Hogendorp 1902a; Van Hogendorp 1902b).
