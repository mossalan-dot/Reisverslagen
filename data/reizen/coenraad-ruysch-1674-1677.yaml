  tekst: 'Gij hebt het dus goed op reis. Wilt gij, nu gij te Rome zijt, eens informeeren naar
    Signora Anna Bergerotti, de voortreffelijke zangeres, die ik vroeger te Parijs heb leeren
    en die nu met een ‘marchese’ gehuwd moet zijn? Als gij haar vindt, ga haar dan mijne groeten
    brengen en vertel mij alles van haar en hare familie. Groet ook de Koningin van Zweden.

    A la Haye, ce 28e Mars 1675.'
