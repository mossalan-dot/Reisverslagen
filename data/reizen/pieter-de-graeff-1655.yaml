beschrijving: Verslag van een diplomatieke reis van Pieter de Graeff (1638-1707) naar Duitsland
  in 1655 in het gezelschap van Joan Corver (1628-1716), Joan Huydecoper (1599-1661) en diens
  zoon Joan (1625-1704). In Berlijn sprak het gezantschap met Frederik Willem I (1620-1688),
  keurvorst van Brandenburg, over een alliantie tegen Zweden en woonde de doop bij van kroonprins
  Karel Emiel (1655-1674). De Graeff had met name oog voor ceremonieel en de verschillende tafelschikkingen,
  waarvan hij diagrammen opnam. De reis liep van Amsterdam via Overijssel naar Bremen en Hamburg.
  Vanaf daar reisde het gezantschap naar het hof in Berlijn. De terugweg verliep via Maagdenburg,
  Hamburg en Groningen.
