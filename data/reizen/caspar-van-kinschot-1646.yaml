  tekst: 'De geschenken van den Prins voor mijn gedicht maken mij erg verlegen. Ik was in den
    beginne niet eens van plan, mijn naam onder het vers te zetten.

    A Munster, ce 27e Febvr. 1646.

    Maar als Z.H. het verlangt, moet ik de geschenken wel aannemen'
