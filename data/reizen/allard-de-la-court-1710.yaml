beschrijving: Verslag van een zakenreis van Allard de la Court naar Engeland in 1710 in het
  gezelschap van Florius Drabbe en Johannes Buckingham. De auteur besteedde extra aandacht aan
  de Londense textielindustrie. De la Court ging scheep in Brielle en stak over naar Harwich.
  Vanuit Londen maakte hij uitstapjes naar Oxford, Bath en Exeter.
