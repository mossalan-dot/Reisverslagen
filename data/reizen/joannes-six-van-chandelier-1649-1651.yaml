  tekst: 'Seldsaame dronkenschap, van V.M.

     

    Als M - - dronken is, zoo zou hy nuchter zyn,

     

    En als hy nuchter is, zoo, seit hy, is hy dronken:

     

    Hoe dikwils als hy eens beschonken is van wyn,

     

    Zoo is hy, by gevolgh, twee daagen dan beschonken.'
