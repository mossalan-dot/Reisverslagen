poezie:
- titel: Op den oploop te Parys, om een drukker van een lasterschrift, op de kooninginne en
    kardinal, door 't volk van de galge verlost
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Parijs
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Op 17 juli 1649 werd de drukker Claude Morlot in zijn werkplaats ‘dans la rue
    de la Bûcherie, à l'enseigne des Vieilles Étuves’ betrapt bij het drukken van een fel anoniem
    pamflet tegen het Franse hof. Hij werd in de gevangenis geworpen en veroordeeld tot de strop.
    Op 20 juli, de dag van de executie, werd hij echter door een oproerige menigte bevrijd.
    De massa vernielde de galg en de ladder op de Place de la Grève en bewerkte de kleine politiewacht
    met wapens, stenen en stokken, zodat verscheidene beambten zwaar gewond raakten en één het
    leven liet. Het gewraakte pamflet is een aantijging op rijm aan het adres van de koningin-moeder
    en kardinaal Mazarin. Het presenteert zich als het verslag van een kamermeisje dat zegt
    luistervinkje te hebben gespeeld bij een ontmoeting tussen de koningin en ‘Iulle’, dwz.
    Jules de Mazarin, de eerste minister, in het boudoir van de koningin. Zij zouden zich bij
    het samenzijn niet alleen aan bedenkelijke staatszaken, maar ook aan ‘l'infame vice d'Italie’
    (anale sexualiteit) hebben gewijd. De titel van het om begrijpelijke reden uiterst zeldzame
    pamflet luidt La Custode De La Reyne Qui Dit Tont [zonder plaats of naam van de drukker],
    1649 (Knuttel 5896; Moreau 1, 1850, p. 256-258). Dat Six de gebeurtenissen persoonlijk heeft
    bijgewoond blijkt uit een passage in gedicht no. [235], r. 9-11. Dit sonnet staat op p.
    15 van zijn Poësy.
  tekst: 'Op den oploop te Parys, om een drukker van een lasterschrift, op de kooninginne en
    kardinal, door ''t volk van de galge verlost.aant.

     

    Wie kan de diepten van uw wonderboek doorgronden,

     

    Waar in de streeken staan van werreldlyk beloop,

     

    Van eeuwigheit gedrukt, op aarde niet te koop,

     

    O wender van de kloot, uit niet, door u gevonden?

    5

    Wanneer men heilich recht, van onrecht, siet geschonden,

     

    Op een schavot door beul, en byl, voor krielend volk,

     

    Dat als behaagen schiep in ''t klinken van dien dolk,

     

    Door Kooningh Karels nek, een eeuwge smet voor Londen?

     

    Daar ''t Fransche Hof, geen bloed, die laster heeft gedrukt,

    10

    Verweesen hanght, om dat hem ''t volk den Beul ontrukt,

     

    De karre en galge breekt, ten spyt des wachts vol wonden.

     

    Weeght nu een schaamel riet meer dan een goude staf?

     

    Of helt de werreld naa syn dood en brandend graf?

     

    Wie kan de diepten van dit wonderboek doorgronden!'
- titel: Op een schilderye aan de solderinge eenes kaamers te Fonteinebleau
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Fontainebleau
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: "Fontainebleau werd door Six bezocht tijdens zijn reis door Frankrijk naar het\
    \ zuiden (1649). De plafondschildering die hij in dit sonnet bespreekt is die in de zgn.\
    \ ‘Chambre en Ovale’ van het paleis. Het schil-\t\n[p. 28]\t\n\n derij verbeeldt de nog\
    \ zeer jonge Lodewijk xiii, die in 1601 in deze kamer is geboren. Pierre Dan vermeldt in\
    \ zijn Le Tresor Des Merveilles De La Maison Royale De Fontainebleau (1642) dat de toekomstige\
    \ koning is afgebeeld ‘tenant un Sceptre d'une main, un Laurier de l'autre, & une couronne\
    \ Royale sur sa teste, soustenuë par quelques petits Amours, tandis que d'autres versent\
    \ sur luy des fleurs en abondance.’ Het werk is van de hand van ‘monsieur du Bois’, d.i.\
    \ Ambroise Dubois (1543-1614) (Dan, 1642, p. 143-144). Het sonnet staat op p. 16 van Six'\
    \ Poësy."
  tekst: 'Waarom Fontainbelleau, schoon bronnend kristallyn,

     

    Omlommert spiegelnat, sulks Febus, en Diaane,

     

    Dees ''s nachts, die ''s daaghs verlieft, hun weesen, Son, en Maane

     

    Sien spieglen op hun oog, net uit uw weederschyn:

    5

    Waarom o duur gebouw, van ruimte, in zoo een lyn

     

    Betimmert, dat men telt vyf hondert schoorsteen perken,

     

    Vol goud, vol schildery, vol konstelyke werken,

     

    O speelhuis van Lowys weergaaloos langs den Sein:

     

    Waarom vlieght langs ''t verdek, in een van ''s Koonings saalen,

    10

    De Kooningh luchtich op de faame alom bekent,

     

    Rechts met een oorloghsstaf, slinks met een olient,

     

    Als of men krygh, of vree kon uit syn handen haalen?

     

    Uw Kooningh is een God, maar is hy niet een kind?

     

    En Masaryn syn voogd, die ''t kryghswaard maar bemint?'
- titel: Op myne eensaame reise, een groot stuk weeghs door Vrankryk
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Frankrijk
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Tijdens zijn reis van 1649 had Six zijn reisgenoot Grenier in Angers achtergelaten
    (vgl. gedicht no. [53]) en was verder gereisd richting Spanje. Dit sonnet staat op p. 16
    van zijn bundel.
  tekst: 'Hebt ghy dan draavende tweehondert myl gemeeten,

     

    In Vrankryk, wel te pas, door bosch, gebergte, en veld,

     

    Een vreemdelingh, schier stom, en nimmermeer verselt,

     

    Dan van uw schaaduw in de Son schuin bygeseeten?

    5

    Wat zult gy dan den dank van zoo veel voorspoeds weeten?

     

    Dat ghy niet siek wierd noch veel mylen had mistelt,

     

    Noch deerelyk vermoort, van roofsiek straatgeweld,

     

    Noch van een graagen wolf, of beer waart opgevreeten?

     

    Uw dubble wysheit, Six, eenvoudich van verstand?

    10

    ''t Was groote sotticheit alleen zoo ver te trekken.

     

    Toen ik niet beeters kon, vertrouwde ik Gods gesant

     

    Zou, stuurende myn geest, een seeker leidsman strekken.

     

    Dien loof, myn blyde ziel, dien dien bid dat syn hand

     

    U verder leide door gevaarelyker plekken.'
- titel: Op het koopergeld in Spanje
  dichter: Joannes Six van Chandelier
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Het sonnet staat op p. 18 van Six' Poësy.
  tekst: 'Trots Spanje Kooninghryk, niet wooninghryk geheeten,

     

    Ommuurt met steengeberght, omgraaven van de zee,

     

    Laat uw hol hout geberght de Peruaansche ree

     

    Gaan soeken, met besaans, op ''t wysen der planeeten.

    5

    Doe d''arme slaaven daar, op ''t silver bloedich sweeten,

     

    Wanneer sy ''t uit den Hel, versuchtende, en gedwee,

     

    Ontmynen, vaar daar mee, naa sinte Lucas stee,

     

    Om aan ''t gebrekkigh volk te schaffen dat sy eeten.

     

    De needrige Amstelaar in laagh, en waatrich veen,

    10

    Scheept door een enger plas, uw hongerigen seetel,

     

    Syn vreemde graanen toe, en alle vreemdicheên.

     

    Dat sich uw silvre baar smolt in syn koopre keetel

     

    Tot quarten, waaren krygh, en dat de naaste reên.

     

    Hy die dan silver heeft, niet hadde, zy vermeetel.'
- titel: Op des kooninghs weigeringe aan syn soon, versoekende om dry uuren te moogen regeeren
  dichter: Joannes Six van Chandelier
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Ik kan niet aangeven op welk incident Six in dit gedicht precies doelt en weet
    ook niet op welke bron hij zich heeft gebaseerd. Het sonnet staat op p. 19 van zijn bundel.
  tekst: 'Met pyn, en afgeparst sond endelyk de Son

     

    Syn soon den Heemel om, met ''s Heemels sonnewaagen,

     

    Om voor een eenge dagh, langs ''t aardryk, op te daagen,

     

    Maar die stond Febus duur, en doodde Faëton.

    5

    Ghy, o Filip, wanneer uw fiere soon begon

     

    Te nyvren, en versocht dry uuren maar te draagen

     

    De volmacht van uw kroon, dorst Ninus doen niet waagen,

     

    Bevreest dat hy vergrimt iet schrikliks onderwon.

     

    En zynde om dat geheim t''ontmynen in verlangen,

    10

    Sprak hy in ''t midden niet van sidderende raân,

     

    Zoo staande vyf of ses griffioenen op zou hangen?

     

    Wie weet of niet het lyf, met leeden ooverlaân

     

    Van goudsucht, in uw ryk geneesingh had ontfangen?

     

    En of uw soon niet leefde, indien ''t was toegestaan?'
- titel: Hoe nietich dat de pracht der kooningen zy
  dichter: Joannes Six van Chandelier
  datum: 15-11-1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Het gedicht beschrijft de tocht van het pasgetrouwde koninklijke paar van het
    Escorial (ongeveer 50 km ten noord-westen van Madrid) naar het Buen Retiro-paleis aan de
    oostrand van de stad. Filips iv was op 7 oktober 1649 getrouwd met zijn nichtje Maria Anna
    van Oostenrijk. Zij was voor het huwelijk overgekomen uit Wenen. Het paar had de eerste
    weken van het huwelijk doorgebracht in het Escorial en reisde nu naar Buen Retiro, vanwaaruit
    Maria Anna op 15 november 1649 haar plechtige intocht in Madrid zou houden (Hume, 1906,
    p. 366). Six was in die tijd in Madrid. Dit sonnet is afgedrukt op p. 19 van zijn bundel.
  tekst: 'De Madrillees staat ree met paarden, en met muilen,

     

    Gemant, en in gespan van Koetsen, sonder tal,

     

    ''t Verscheiden lievery der Princen over al

     

    Doet ''t verweloose land van lentgebloemte oppuilen.

    5

    De Kooningh, met syn stoet, komt langhs de wegh vol kuilen,

     

    Door ''t herfstweêr, in syn koets, van ''t heerlik Eskuriaal,

     

    Syn Venus sit ter sy, vol diamantepraal,

     

    Syn Dochter over hun laat geen juweelen schuilen.

     

    Hy houdt syn Majesteit, gelyk een Kooningh past,

    10

    Syn hoed staat prachtich op, waar uit twee starren blinken,

     

    Op al ''t ontdekte volk. Maar schoon die staat zoo vast

     

    De Son, die nieusgier mee, komt in syn oogen sinken,

     

    Ontbloot syn kruin, en als den Kooningh blind verrast.

     

    O wat een kleintje doet de pracht een''s Kooninghs slinken.'
- titel: Blyde welkomst der kooninginne te Madrid
  dichter: Joannes Six van Chandelier
  datum: 15-11-1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: De Blijde Inkomste van Maria Anna van Oostenrijk vond plaats op 15 november
    1649, tijdens Six' verblijf in Madrid. Het sonnet staat op p. 20 van Six' Poësy.
  tekst: 'Madrid de Throonstad van de Kastiljaansche ryken,

     

    De sceptersweister langs een groot deel van Euroop,

     

    Lagh in een droeve nacht op sterven, sonder hoop,

     

    Om weer de blyde dach des leevens aan te kyken.

    5

    Jupyn ontfarmend sprak: al gingh die Son beswyken,

     

    Myn uitgekooren Son, wiens straalen ik, ach mis,

     

    Ik help u weer myn volk uit deese duisternis,

     

    Strax komt een nieuwe Son, uit Oostenryk aanstryken.

     

    Voorts rees Maria, op een wit gebooren paard,

    10

    Met twaalef Nimfen, ''t volk, dat juichende op haar staart,

     

    Werd straalblind met Filip, zoo als haar glansen gloeijen.

     

    Hy die jaa smolt in haar omarmt in ''t Eskuriaal,

     

    Omarmt syn Kooningin hier in syn hoofsche saal,

     

    Uit welke Spanje hoopt een beeter Prins zal groeijen.'
- titel: Schrobbe aan een onweetenden Spanjaard
  dichter: Joannes Six van Chandelier
  datum: najaar 1649
  locatie: Spanje, Madrid
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Tijdens zijn reis door Spanje (1649) bezocht Six ook, vanuit Madrid of op weg
    naar Madrid, het Escorial. Dit sonnet staat op p. 20 van zijn bundel.
  tekst: 'Al wie een vreemdelingh hoort vreemde spraaken spreeken,

     

    En lacht om dat syn oor, staagh huisich, ongewoon

     

    Was vreemden ommegangh, en Leeraars klein van loon,

     

    Belacht syn eigen self, recht by een dwaas geleeken.

    5

    Ik, wyl ik ''t Eskuriaal, dat wonder heb bekeeken,

     

    Sprak met de Priester, die ''t ons oopende ten toon,

     

    Door mangel van veel Spaans, de spraake van Ausoon,

     

    Een plompe Kastiljaan dorst my de guigh naa steeken.

     

    O slimmer dan een Moom, dacht ik, en borst op ''t lest,

    10

    Ghy smaalt vilein op my, ''k mach beeter op u smaalen,

     

    Rhinocerosche lerv'', die slechts syn darmen mest:

     

    Ik heb een kleine tongh gehoonight wat in taalen,

     

    Doch altemets geterght, zoo euvel als de pest,

     

    Die van Latyn kan noch een Bastaard ooverhaalen.'
- titel: Sluikerye in Spanje door behulpsaamheit der paapen
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: 'Het sonnet zal blijkens hier (r. 9) in Spanje geschreven zijn. De regels 10-14
    sluiten bij het voorafgaande aan als een argument dat de voorstelling in de regels 5-9 kracht
    moet bijzetten: zoals de koning zijn belasting verzwaart met hulp van de paus, zo kan hij
    zich op even oneigenlijke wijze op het verschil in geloof beroepen om uit begeerte naar
    geld de oorlog met de Republiek te hervatten, ook na de vrede van Munster. Over de belastingkwestie
    (in 1649?) en de rol van de paus daarin heb ik geen nadere gegevens kunnen vinden. Het sonnet
    staat op p. 21 van Six'' bundel.'
  tekst: 'In Holland ''t schuilland waar de steege ketters woonen,

     

    Naa Roome seit, daar wierd ''t voordeelich swaard de schee

     

    Bevoolen, en men sloot, om vryheit, eeuwigh vree,

     

    Met Spanjes opperhoofd, een van des Pausen soonen.

    5

    Maar dees benydde vree zal geensins eeuwich woonen,

     

    Noch langer ongekrookt, in ''t hart van deese twee,

     

    Dan tot de pook met baat het Spaansche leer ontglee.

     

    Men hoeft de plicht des eeds geen Ketters te betoonen.

     

    Zoo gaan hier Machiavels, met list, op baatsucht uit.

    10

    De Kooningh had den tol met swaarder eisch verheeven,

     

    Op alles door het ryk: de Paap steef dat besluit

     

    By ''t volk, dat met gesluik daar teegen aan dorst streeven,

     

    Ter bieght geweigert, tot hy deilde van den buit:

     

    Toen brak de text, men moet den Keiser ''s Keisers geeven.'
- titel: "Op het blanketten van 't vrouwvolk in Spanje. \nI-X"
  dichter: Joannes Six van Chandelier
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: 'In deze reeks van tien sonnetten geeft Six zijn gedachten weer over (of eerder:
    naar aanleiding van) het gebruik van blanketsel en andere cosmetica door de vrouwen in Spanje.
    Vanaf het vierde sonnet verschuift het onderwerp van make-upgebruik naar overspel, maar
    in het achtste keert het weer terug tot het uitgangspunt. De reeks staat op p. 21-26 van
    Six'' Poësy.'
  tekst: 'Zoo, naa men segt, de Spaansche vrouwekaaken,

     

    Met afgangh van Hegdissen, grys fenyn,

     

    En rooserood van floers geschildert zyn,

     

    Zoo dar ik dat er schoone zyn versaaken.

    5

    Zoo veel ik sach, een voddetje van laaken,

     

    Of een penceel had, in een ronde lyn,

     

    Haar wangen met een bloosend aangeschyn

     

    Gewit, wie kan daar van dan schoonheit maaken?

     

    Waarom, dan om een wangeschaapen huid

    10

    Te helpen, zal de konstnaar haar bekleeden?

     

    Zoo schudt een bes alle uur wat oudheits uit.

     

    O poppery ontvonkt in aarde leeden,

     

    Prometheus schort er maar met Heemelbuit,

     

    Voor schooner steen, van Fidias gesneeden.


    II


    De schoonheit van de reedelyke dieren

     

    Schuilt in geen konst van verwen fyn, of grof,

     

    Schuilt in geen nooit vergankelyke stof,

     

    Of die vergaan men weer weet op te cieren.

    5

    Maar vrouw Natuur, met eedler kieremieren

     

    Van melk en bloed, uit haar gesielden hof,

     

    Leent aan ''t gesicht de waare schoonheits lof,

     

    Hervindeloos, naa haastighlyk vertieren.

     

    Hoe sneeuwwit pronkt de teedre sesamyn?

    10

    Hoe sparkelt ''t velt ontgloeit van rooselaaren?

     

    Wat schilder rekt haar dach met fraaijer schyn?

     

    Maar maalt Apel ons schooner dan wy waaren

     

    Gebooren, of verwelkt door tyd, of pyn,

     

    Dat moetmen maar voor Bastert schoon verklaaren.


    III


    Wat hoeft een Vrouw, die eens heeft uitgekooren,

     

    Haar lichaam als een schilders taafereel

     

    Te schildren, dat sy suiver in ''t geheel

     

    Te spaaren, met een Trouwringh heeft geswooren?

    5

    Haar andre ziel, voor wien se was gebooren,

     

    Schiep syn vermaak, in haar geschaapen deel,

     

    Schoon leelik, sy geleek hem schoon en eel.

     

    Met recht ontsteekt haar lyfwacht dan van tooren.

     

    Wat wellust kan hy van syn bedgenoot

    10

    Genieten, die haar welgesonde wangen,

     

    Met verwery, gaat kleuren blank en rood?

     

    Sulks als hy kust, en hoonigh meint t''ontfangen,

     

    Gelyk een bie uit bloempjes, in haar schoot,

     

    De vuile salf hem smeerich aan blyft hangen?


    IV


    Indien den man dat tienmaal heeft verdrooten,

     

    En tienmaal tien, met smeekingh, met gekyf,

     

    Maar sy vervolght hartnekkigh haar bedryf,

     

    Hy loopt gevaar, ontrent syn wyngaard looten.

    5

    Sy oopent die, voor dartle swyne pooten,

     

    Die aangelokt, door ''t kruydige geryf,

     

    Geil wroeten in, en om het groene lyf,

     

    Sulks sy den grond van wortelen ontblooten.

     

    Sy quol sich, om besnoeide hoovaardy.

    10

    Of liet sich, om een Kosche-Amint, bekooren.

     

    Dit lyden bracht veel mannen in de ly.

     

    Men sluit heur op een dichtbewaakten tooren.

     

    Sie wat al gouds boort Danaes geile sy.

     

    Verloos se schaamt, het waaken was verlooren.


    V


    Dit porcelyn, waar uit u pleegh te schuimen

     

    Den Nectar die uit Venus druiven seep,

     

    Dit tengre vat kryght hier, of daar een neep,

     

    Waar van ''t syn oor verliest, door wulps versuimen.

    5

    Zal uwe toorn ''t vermors''len, en verkruimen,

     

    Niet vraagende of een silversmid een reep

     

    Kon smeeden, waar men ''t handich weer by greep?

     

    Zal uwe voet ''t vertreen, en ''t huis doen ruimen?

     

    De bakker van zoo kostlik porcelyn

    10

    Verkocht het u, op trouwicheit in ''t slyten,

     

    Mids brak het daar met stukken vry zoud zyn,

     

    Om half verlies, waar om ''t dan wegh te smyten?

     

    ''t Welk als u dorst, naa ''t snellende verdwyn

     

    Der gramme vlam, u wroegende zal spyten.


    VI


    Zoo dan misschien uw bed van jonge Schaapen,

     

    De vrucht des echts, begroet werd met een lach,

     

    Aan Vaader en de Moeder, met den dagh,

     

    En Moeder slaapt niet, waar se plagh te slaapen:

    5

    Wat wist ghe voor de lammers die daar gaapen,

     

    Slecht om en om, en jonghst een reegenslagh,

     

    Myn Moedertje, myn moeder schreijen, ach,

     

    Ach, wat voor troost wist ghy hen op te raapen?

     

    Dat naar gehuil spookt in de Leedekant.

    10

    De wurm die u de zielaâr af wil steeken,

     

    Schoon lyveloos, groeit binnen ''t ingewand.

     

    Nu merkt ghy eerst, wat vat ghe quamt te breeken,

     

    Sleipscherven voor ''t vermoen van lastertand,

     

    Om uw geslacht, als Basterds, aan te spreeken.


    VII


    Maar schoon de Vrouw had u geen naam gegeeven,

     

    Van Vaader, noch was Moeder ooit geweest,

     

    Zult ghy daarom, verwoeder dan een beest,

     

    Uw beulsche hand bemorschen in haar leeven?

    5

    Van wie, en waar is zoo een wet geschreeven,

     

    Daar dikwils ook de moorder onbevreest,

     

    Self ''s buurwyfs leer versnippelt op syn leest,

     

    Met dubble kost, als zynde niet misdreeven.

     

    Leon, o Leeuw, Kastilie o Kasteel,

    10

    10 Wat kryt al bloeds, om wraak, naa ''s Heemels daaken?

     

    Zoo man, als wyf, elk heeft een duur juweel,

     

    Dat niemand dan sy saamen moogen raaken.

     

    Lydt een van bei van anderen gestreel,

     

    ''t Zy wie ''t dan zy, ''t is eeven veel te laaken.


    VIII


    O Eva van den Heemel fris geschaapen,

     

    Met wangetjes, waar ik twee roosjes sie,

     

    Zoo gloorende, dat ook een Hoonighbie,

     

    Daar op verlieft, syn suiker wenscht te raapen.

    5

    Ai wilt u aan blanketsel niet vergaapen:

     

    Want zoo ik eens uw kaakjes valsch verspie,

     

    Ik kusse liefst uw ooverrokte knie,

     

    Of hemde, van u seevenmaal beslaapen.

     

    Waarom zoud ghy ''t goede eevenbeeld van God,

    10

    Als Adams, wiens gebeente u tot een deure

     

    Ten leeven wierd, daar naa met vleisch in slot

     

    Geslooten, met quaksalvery koleuren?

     

    Zoo dryft sy met Gods welgeval den spot,

     

    Die ''t fraai panneel, om fraayer gaat besmeuren.


    IX


    t Gebeure, jaa, dat hier, of daar ter sy''en,

     

    In ''t aangesicht een plekje is van geboort,

     

    Of dat de kleur niet lykt, gelyk ''t behoort,

     

    Gods schildery wil geen verschildringh ly''en.

    5

    Een Schilder heb mismaakte schilderyen

     

    Uithangen, om te veilen, voor syn poort,

     

    Sulks wie se siet mispryst, en laakt se voort,

     

    Hy wil nochtans ''t penceel van andre my''en.

     

    Apelles die onsterfelyke geest,

    10

    Maar welkers konst verdweenen is te soeken,

     

    Sprak, lapper gaa niet hooger dan uw leest.

     

    Zyn menschen zoo jeloers op hout, en doeken,

     

    Wat is dan God, die Schepper is geweest,

     

    En eeuwigh blyft de Meester aller kloeken?


    X


    Hoort niemand dan gebreeken te geneesen?

     

    Want smetten in ''t gelaat zyn een gebrek.

     

    Wat baaten ons geneeskonst, en ''t gerek

     

    Des artsenys, zoo Goddelyk gepreesen?

    5

    Dat heilsaam licht geensins vergeefs gereesen,

     

    Heeft eevenwel syn lynen van bestek,

     

    Dat lyk de mensch, uit ''t algemeine hek,

     

    In ''t leeven kroop, hy blyven most van weesen:

     

    Ten waar de kunst een wangebooren kind,

    10

    Of ouder van wat leeliks kon verschoonen,

     

    Sy sie dan, of sy ''s Heemels seegen vindt.

     

    Maar anders waar de hoovaardy, haar koonen,

     

    Natuur ten trots te schildren onderwindt,

     

    Daar komt de slangh syn vleijige appels toonen.'
- titel: Op de ongelykmaaticheit der bruggen oover de rivieren van Sivilie en Madril
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  locatie: Spanje, Madrid
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Ook dit sonnet zal dateren uit de tijd van Six' reis door Spanje (1649-1650).
    Het staat op p. 26 van zijn bundel. Dr. H. de Vries wees mij erop dat dit sonnet opvallende
    overeenkomsten vertoont met enkele van de Sonetos satiricos y burlescos van Luis de Góngora
    y Argote (1561-1627). Six zou dus ook Spaanse poëzie hebben gelezen (vgl. Góngora, 1981,
    p. 327-328 en p. 354-355 en met name ook de toelichting op p. 328 aldaar). Zie ook de Toelichting
    bij gedicht no. [237].
  tekst: 'Sivilie en Triaan doen niet dan stroomen huilen,

     

    Uit d''arme vlotbrugh in den stroom Guadalquebier,

     

    Sy ascht beschaamt haar rugh langs zoo een hoofdrivier,

     

    Onnoodiger om hoogh gekroont van steene suilen.

    5

    De Segoviaansche brugh, langhs Guadarramaas kuilen,

     

    Weent niet dan kalk en gruis, om dat se haar zoo dier,

     

    En prachtich aanschyn niet mach spieglen trots en fier,

     

    In een rivier, waar in rivieren koomen schuilen.

     

    Senjoor hoe paait men se? wat dunkt u, waart ook quaad,

    10

    De Kooningh last gaf, dat de Madrillees syn muilen

     

    Dee stallen, in de vliet, tot Mansannares baat?

     

    De Siviljaansche brugh, die kan men licht verruilen,

     

    En metslen van de steen, in overvloed op straat

     

    Te soeken, sonder dat men gaaten maakt en builen.'
- titel: Sucht naa het vaaderland, op de reise door het geberghte Morena
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Bij zijn reis door Spanje (1649-1650) passeerde Six de Sierra Morena. Dit sonnet
    staat op p. 28 van zijn bundel.
  tekst: 'O Amstel aardsche Son, Europes dachlantaaren,

     

    Die om de werreld licht, om wien de werreld keert,

     

    Myn kleine werreld, met uw goude bloem vereert,

     

    Wendt naa uw Majesteit, omreisende, syn blaaren.

    5

    O gloênde barnesteen, gebooren uit de baaren,

     

    Met welke Apol syn kar juweelende vermeert,

     

    Als om syn soon getraant, van Iovis vlam verteert,

     

    Lyk stroo van u verhit, wensch ik u staagh te naaren.

     

    Myn kostlik Vaaderland, hoe dikwils ik den ringh

    10

    Meer omtrek, met een trek van aarde voorgenoomen,

     

    Zoo trekt uw seilsteen myn gedachten sonderlingh.

     

    Men kent uw waarde, o Y, besiende vremde stroomen.

     

    Beklim ik hier een bergh, die in de wolken hingh,

     

    ''k Sucht t''uwaarts zal ik in ''t beloofde land weer koomen?'
- titel: Aanvechtinge geleeden te S. Lukas
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  locatie: Sanlúcar de Barrameda, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Blijkbaar richt Six zich in dit sonnet tot een aanbeden Spaanse schone, die
    hij stelt boven de Antieke Helena. Om redenen van betamelijkheid ziet hij af van verdere
    toenadering tot haar. In eerder instantie heb ik de aangesproken Helena thuisgebracht als
    een Hollandse schone, die de dichter alleen in zijn gedachten zou zijn verschenen toen hij
    in Sanlúcar was (Jacobs, 1989, ii, p. 163-164), maar ik geef nu de voorkeur aan de hier
    gegeven interpretatie, waarnaar Prof. Dr. E.K. Grootes en Dr. H. de Vries mij de weg wezen.
    Het sonnet staat op p. 28 van Six' bundel Poësy.
  tekst: 'Heleen wanneer ik uw Argoolsche naam hoor spellen,

     

    Die lieffelyke naam, dan denk ik wat Heleen,

     

    Of in Andalusy, dat Paradys, verscheen,

     

    En''k voel de lieve min het ingewand strax quellen.

    5

    Maar wend ik myn gesicht dan naa uw oogeschellen,

     

    Waar uit dat paar zoo glanst van diamante steen,

     

    In''t bloosend blanke veld, met syn volkoomentheên,

     

    Zoo voel''k de heete min myn leever meer ontstellen.

     

    Dan miesemees ik bangh, och Nimf, kyk my niet aan,

    10

    Of ghy beluistert wat myn stomme wangen spreeken,

     

    Door''t uitgeslaagen vuur des boesems, als verraân.

     

    O min, o soete min, o minnelyke streeken,

     

    ''t Betaamt my immers niet u hier ter hand te slaan,

     

    Wat baat in Spanje dan myn lust met min t''ontsteeken?'
- titel: Aandacht op myn dertighjaarigen ouderdom en quellycke miltsucht
  dichter: Joannes Six van Chandelier
  datum: 19-02-1650
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Dit gedicht is tot stand gekomen tijdens Six' reis door de landen aan de Middellandse
    zee in 1649-1651, waarschijnlijk naar aanleiding van zijn dertigste verjaardag op 19 februari
    1650. In een interpreterend artikel heb ik dit sonnet uitgebreider aan de orde gesteld (Jacobs,
    1988). Het gedicht is afgedrukt op p. 29 van Six' bundel van 1657.
  tekst: 'Geen wys Egyptenaar bedriegh sich in myn handen,

     

    De cyffer kruist myn vleisch, met Golgathaas getal,

     

    Toen Jesus een van dry, ook dertigh jaar, voor ''t Al

     

    Gekruist wierd, aan syn ziel, met oopen ingewanden.

    5

    Ik reeken flus half west, waar zoo veel stuurmans stranden,

     

    Op neegen seevens, langs een sichtbre klipge wal,

     

    Al duidt de lely van ''t kompas door mooi kristal,

     

    Van naalde ontstelt, naa ''t oost, op ''t dieploot, sonder sanden.

     

    De vaste lym ontlymt, ''t gedy my voor een preek.

    10

    ''t Huis kraakt en dreight met stof in tyds daar uit te vaaren.

     

    Ik runde schier ten eind van myn bepaalde streek.

     

    Geen Son, ''t is een Komeet, getuit met bloedge haairen.

     

    Elke uure schaaft een dagh, en elke dagh een week,

     

    En elke week een maand, en elke maand schaaft jaaren.'
- titel: Op myne doolreise tusschen Port S. Marye, en Granade
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Het sonnet heeft betrekking op Six' reis door Zuid-Spanje, rond de jaarwisseling
    van 1649-1650. Het staat op p. 29 van zijn bundel van 1657.
  tekst: 'Waar zal de slinger van ''t vast noodgeheim my dryven?

     

    Ik sweef, door Spanjes locht, geslingert van haar hand,

     

    Maar traager dan een schicht, die d''Afrikaaner spant,

     

    En afschiet, om een Draak, of Tyger in te lyven.

    5

    Of wil men hier ''t geloof van ''t blinde luk mee styven,

     

    Dat my, om d''aarde voert, verdoolt van land, in land?

     

    O neen. Daar is geen luk dan dat aan vasten band

     

    Van ''t noodlot werd bestuurt, dit enkel toe te schryven.

     

    Zoo swurf de Broeder van syn Broeders wegh gebrocht,

    10

    Om hem geen eer te doen, verkocht aan verre landen:

     

    Maar noch van hen geëert, om dat hy wierd verkocht.

     

    Maar weinigh wist hy toen de put, en toen de banden

     

    Hem praamden, van den Ringh die ''t noodgeheim hem wrocht.

     

    ''t Geheim was God. O God ''k beveel my in u handen.'
- titel: Aademscheppinge langhs de riviere Dauro
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  locatie: Granada, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Het gedicht dateert van Six' verblijf in Granada, rond de jaarwisseling van
    1649-1650. Het staat op p. 30 van zijn Poësy.
  tekst: 'Moe van ''t Alhambre, dat trots Moorenwerk, de hooren

     

    Van d''ooverschoone stad, die ''t ryk Granade heet,

     

    Dat Chiko noch van veer verooreloght bekreet,

     

    Daal ''k Dauro t''uwaarts, om myn aadem schier verlooren:

    5

    Rivier uit Albaisyn, oostwaarts vier myl, gebooren,

     

    Die, door twee bergen heen, een ruwe loopgracht sleet,

     

    Met uwen waaterval, die steen, en aarde vreet,

     

    En van den Sonnebergh geroert bruist met goud kooren:

     

    Hoe laaft ghe myn gemoed geseeten langs uw boord,

    10

    By luisterend geboomt, naa uw gekeide snaaren,

     

    Dat graagh den selven toon van uwen strykstok hoort.

     

    Ha lekkere Kastaal verquik myn dorstige aaren.

     

    Gaat nu uw goudvliet door de stad, van Guadix poort,

     

    Met silver van Genyl, uit Bibarramble paaren.'
- titel: Afbeeldinge en wydinge van Roselle, en haare bestraffinge
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  locatie: Granada, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: 'In het hier behandelde reeksje van zes sonnetten stelt Six het voor alsof hij
    in Granada een beeldje van zijn geliefde heeft laten maken. Hij doopt het ‘Maria’, blijkbaar
    de eigenlijke naam van de geliefde die Six in zijn erotische poëzie gewoonlijk ‘Roselle’
    noemt. Over deze Maria zijn mij geen nadere gegevens bekend. Six laat haar in het vijfde
    sonnet als het ware zelf aan het woord: zij reageert boos op Six'' gedrag en woorden. In
    het laatste sonnet bindt Six ijlings in. De sonnettenreeks heeft hem intussen ruim de kans
    geboden met de verering van de andere Maria in Granada de spot te drijven. De reeks dateert
    van omstreeks de jaarwisseling 1649-1650. Ze staat op p. 30-33 van Six''-bundel van 1657.'
  tekst: 'O beeldenaar, wat loopt ghy straaten slyten?

     

    Granade geeft aan leege handen werk,

     

    Met beelden voor een klooster, of een kerk.

     

    Een Maribeeld zal immers niet vermyten.

    5

    Onnoodge vrees. Sa, saa, aan ''t saagen, splyten,

     

    En snyden, met een geestigh oogenmerk,

     

    Snyd my een vrouw, van eenen gaaven berk,

     

    Zyt seeker dat uw kost, noch loon zal spyten.

     

    Beeld ''t aangesicht, gelyk een frische maaghd,

    10

    Doe ''t bloote haair, langhs ''t halve rughkleed, daalen,

     

    Maak dat se slinks een Kupidootjen draaght,

     

    Sorgh dat se rechts mach met een scepter praalen,

     

    Let dat haar kruin een Kooninghs kroone schraaght,

     

    Omcier haar hals met parlende koraalen.


    II

    Dit lieve blok zoo sneenet op te hulden,

     

    O leeger beurs, betaalde ik een dubloen:

     

    Toen was er noch een dubbele van doen,

     

    Voor ''t fyn penceel, tot schildren en vergulden.

    5

    Maar waarom moet Korinthen nu niet dulden,

     

    Dit pronkbeeld my, in zoo een goed fatsoen,

     

    Haar Venus lykt voor welke Achaje toen

     

    Ten offer quam, met minnelyke schulden?

     

    Gelykt dees vrouw geen groote Kooningin,

    10

    Of een Godes, gaan Gooden zoo geschaapen?

     

    Gelykt dit kind den God niet van de min?

     

    Wech ''k wil my aan geen heidendom vergaapen.

     

    Hoe ik ''t nochtans zal doopen, moet myn sin

     

    Bepeinsen, en noch deesen nacht op slaapen.


    III


    Ter goeder uur moet ghy Marye heeten,

     

    Niet naa Mary de Heemelkooningin,

     

    Uit Adam, vry van erfsond niet te min,

     

    Wiens omgangh nu acht daagen heeft versleeten.

    5

    Om dat se met een hartvangh had gesmeeten

     

    Dien sieken Paap te Roome, wyl hy in

     

    Gods woord van haar opnam een andren sin,

     

    En tot bewys, aan ''t schryven was geseeten.

     

    Ghy zult den naam bekleên van myn meestres,

    10

    Wyl ''k van haar lief geselschap om gaa swarmen,

     

    Zal sy in u ontsien zyn, als Godes.

     

    Hier jonge tilt dat jongsken, uit heur armen,

     

    En haal my voor een quartjen vyf of ses

     

    Aan Wierook, om heur neusgat soet te warmen.


    IV


    Al eevenwel, nooit gingh myn uitverkooren,

     

    In zoo een praal van kooninghlyke kleên,

     

    Noch kleedt se haar, naa ''t kleeden van ''t gemeen,

     

    En volght te voet, op middelweeghsche spooren.

    5

    Hoe gingh Mary, wanneer heur wierd gebooren,

     

    Dat kind, die God, aan wien met alle reên,

     

    Alle eer behoort, meest van inwendicheên,

     

    In Bethlems stal, hoe gingh se naa, hoe vooren?

     

    Zoo braaven gloor beduidt haar hoogen staat,

    10

    Gelyk Godin verheeven in Gods throonen,

     

    Waar sy op Son, en Maan, en starren gaat.

     

    De myne draaght de welverdiende kroonen

     

    Een''s werrelds, die in vleisch sich sluiten laat,

     

    Dat is een mensch, myn hart, waar sy blyft woonen.


    V


    Maar Six, maar Six, dit praatjen wat ter syden,

     

    Wat my van u, door vreemden, is vertelt,

     

    Uit Spanje, hoe ghe my daar had gestelt

     

    Een beeld dat ghy met afgodsdienst ginght wyden?

    5

    Wat al verdriets deed deese kuur my lyden!

     

    Foei schaam u ghy die Kristus letters spelt,

     

    En u een gast van syne taafel meldt,

     

    Die ik u dus ontreinight maan te myden.

     

    Verbeeld, gebiedt Gods andere gebod,

    10

    Geen dingen, die om hoogh zyn, of beneeden,

     

    Ghy beelde my, toen buiten twyffel sot.

     

    Hoor hier, om dat uw vryens mallicheeden

     

    My argeren, en ghy u stelt ten spot,

     

    Zoo zult ghe nooit myn drempel meer betreeden.


    VI


    Is ''t ernst me me me Ioffrouw zoo te kyven?

     

    Heeft dan een duifje, als haagel blank van pluim,

     

    Met raaven swart, als roet, zoo bitter schuim

     

    Van gal gemein, dat nu komt booven dryven?

    5

    Kan nu de tongh myns Engels quaade wyven

     

    Naabootsen, met een geemelyke luim?

     

    Nochtans ik zal myn eigen selfs versuim,

     

    En misdaad aan uw straffinge verblyven.

     

    Ik sach tot aan de Daure, en daar noch meer,

    10

    Maryes beeld verrot voor duisend jaaren,

     

    Zoo eeren, dat myn liefde docht, wat eer

     

    Bewys ik dan myn bloênde rooselaaren?

     

    Vergeef, myn lief, vergeef ''t my deese keer,

     

    Zoo ''t weer gebeurt, zal ik uw drempel spaaren.'
- titel: Aan de rivier Genyl
  dichter: Joannes Six van Chandelier
  datum: 1649-1650
  locatie: Granada, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: "Dit sonnet op de rivier de Genil zal dateren van Six' verblijf in Granada (rond\
    \ de jaarwisseling 1649-1650).\t\n \tHet gedicht is incompleet overgeleverd; in het sextet\
    \ is een regel weggevallen, blijkens het rijmschema na r. 8 of na r. 13. Van Es bespreekt\
    \ in zijn aantekeningen bij dit gedicht alleen de mogelijkheid van een onder r. 8 weggevallen\
    \ versregel, ‘gezien de gangbare rijmstructuur van Six' sonnetten: c d c d c d, waarin d\
    \ slepend is; ook vormt iedere terzine bij hem gewoonlijk een afgerond syntactisch geheel’\
    \ (Van Es, 1953, p. 148). Voor van Es' opvatting pleit ook de ongebruikelijke opeenvolging\
    \ van vrouwelijke rijmklanken in r. 8-9; elders in Six' Klinkdichten volgt op de rijmklank\
    \ van r. 8 altijd een versregel met een rijm ‘van het andere geslacht’. Voorts merk ik op,\
    \ dat na de ontbrekende versregel 8' ook het inspringen van de regels in het ongerede is\
    \ geraakt; gewoonlijk springen in Six' gedichten alleen de regels met mannelijk eindrijm\
    \ in. Voor een echt goed begrip van het sonnet lijkt me de missende versregel helaas van\
    \ cruciaal belang. Het sonnet staat op p. 33 van Six' bundel."
  tekst: 'Genyl, o kleine Nyl, die uit gehuifde klippen

     

    Van sneeuwdoek, ook gebleikt, een blanke schoonsoon bent,

     

    En maar reusinnen voor uw silvre moeders kent,

     

    Uit wier kristalbuik ghy geborsten snel komt glippen:

    5

    Hoe ruist ghe met de Dar zoo gulsich mee te slippen,

     

    Niet traager dan de Moor syn pylen heeft gewent,

     

    Daar ghy, wanneer ghe reist, en hier, en daar ontrent,

     

    Stil dorstigh drinkt, en drenkt alle oope vlakke lippen?

     

    Klaarspiegelende post, myn sangnimf wil u spreeken,

    10

    Een bee, een kleine bee, ai toom u lossen swier.

     

    Hoe trotse suiper zult ghy heur de guigh naa steeken?

     

    Zoo voel haar straffe van de vloed Guadalquebier,

     

    Die haar te wil uw hals, en naam, en glans zal breeken.'
- titel: Op het mirakel van een schielyken storm te Granade, aan onse Lievrouwe
  dichter: Joannes Six van Chandelier
  datum: februari 1650
  locatie: Granada, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: De in dit gedicht besproken feestelijkheden waren mogelijk die rond ‘Maria lichtmis’
    op 2 februari 1650 (vgl. de vele kaarsen in r. 7). Het sonnet staat op p. 34 van Six' bundel.
  tekst: 'O heemelkooningin, die ''t perk der Elementen,

     

    Met alle heiren door, en met uw soon bestiert,

     

    Wat laat ghe toe de wind, zoo stout, om verre swiert

     

    Uw heilgen, u, uw Soon, in poppen, en in prenten?

    5

    Sie wat al loovergoud, wat bloemen van de lenten,

     

    Sie wat tapyt de straat, en taafels had verciert,

     

    Sie wat al vlammen van het vlugge wasgediert,

     

    Strax offerde u de Dar noch in deese oope tenten.

     

    O wat een klein verwoest zoo groote heilicheên!

    10

    Zal dit mirakel, aan ''t verbaasde volk, iets leeren?

     

    Waar laat een aardsch Princes haar beeldselen vertreên?

     

    Sy sliep licht, of men riep niet lui genoegh in ''t eeren.

     

    Zoo schreeuw, Granade, schreeuw, daar schiet een straal beneên,

     

    Van Heemelsch vuur, dat zal het lichtlik al verteeren.'
- titel: Afscheid van Granade
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Granada, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: Het sonnet staat op p. 34 van Six' Poësy.
  tekst: 'Granade, dat den rook der barrenende steeden,

     

    Van solfer, noch van pek, als van een ooven siet,

     

    Als in een ooven siet, rondom, en sonder iet

     

    Te sengen aan den brand van Davids volk geleeden:

    5

    Een hert omheininkt werd, om vryheit, min bestreeden,

     

    Gelyk ook schubbigh vee waarom een vyver schiet,

     

    Dan ik in uwen muur, en ruimgeslooten vliet,

     

    Op dat de slaande geest daar binnen niet zou treeden.

     

    Zoo klaaghde ik dagh aan dagh, om reisbroers wel een maand.

    10

    Meer druppels uit de stroom, meer steenen uit de straaten,

     

    Besprongen myn gesicht, dan bloed u heeft gegraant.

     

    Nu zyn we sterk, vaar wel, o kostlike Granaaten,

     

    Vaar wel, o Dar, die al van ouds hebt goud getraant,

     

    Vaar wel, waarande, ik springh, en swem nu uitgelaaten.'
- titel: Op de sodomiterye van Florencen
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Florence, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/
  beschrijving: 'Six bezocht Florence in 1650, tijdens zijn eerste reis naar Italië. Florence
    was indertijd berucht wegens de daar min of meer openlijk blijkende homosexualiteit. De
    Italiaan Antonio Marganetti schreef speciaal voor de grand-tourist Aernout Hooft een ‘Breve
    Instruttion’ met nuttige wenken voor het reizen in Italië en waarschuwde hem daarin niet
    te veel contact te hebben met de Florentijnen, ‘Per il più gl''huomini di questa Provintia
    sono Inclinati à Ragazzi, [...]’ (geciteerd naar Frank-van Westrienen, 1983, p. 58, vgl.
    p. 61 en p. 328 aldaar). Aernout Hooft maakte zijn ‘Groote Tour’ juist in dezelfde tijd
    als Six door Italië reisde: van 1649 tot 1651. Six'' sonnet staat op p. 35 van zijn Poësy'
  tekst: 'Florencen bloeyend land, en stad, langs Arnus grensen,

     

    Dat in de grooticheit geen Hertochdommen wykt,

     

    O Stad die om vermaak de kroon van steeden strijkt,

     

    Uw heerschappye, en land baart wat men konde wenschen.

    5

    Maar ''t is beklaaglik dat een reex van boose menschen,

     

    Onmenschelyk uw boôm te weelderigh verrykt,

     

    Dat gansch Italien by Sodoma gelykt,

     

    En meedefeitich segt zoo leeft men te Florencen.

     

    Wat baaten macht, en schat, pallaisen, kerk, en hof,

    10

    Godvruchticheit, en recht, zoo Godvrucht werd gevonden,

     

    Of recht, alwaar men leeft dus onnatuurlik grof?

     

    Geen pillen suivren u van die verdoemde sonden.

     

    En ''t waar een artseny te heet voor ''t Lelylof,

     

    Indien het swelgen moest, wat Sodom heeft verslonden.'
- titel: Op het voorspreekerschap van Abraham Grenier den iongen van Middelburgh, te Angiers
    verdient
  dichter: Joannes Six van Chandelier
  aan: Abraham Grenier (1626-1660)
  datum: '1650'
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0052.php
  beschrijving: Abraham Grenier (1626-1660) was Six' reisgenoot bij zijn reis door Frankrijk
    in 1649. Hij was een Middelburger van geboorte en had vanaf 1644 rechten gestudeerd in Leiden.
    In 1649 reisde hij naar Frankrijk om in Angers te promoveren (De la Ruë, 1741, p. 539-541;
    Nagtglas i, 1890, p. 293). Six reisde alleen door naar Spanje, waar hem het bericht van
    zijn vriends promotie bereikte. Vanuit Madrid zond hij hem een brief en twee gedichten (vgl.
    gedicht no. [71], r. 10-13), waarvan dit sonnet er één zal zijn. Het staat op p. 27 van
    Six' Poësy.
  tekst: 'Op het voorspreekerschap van Abraham Grenier den iongen van Middelburgh, te Angiers
    verdient

     

    De Zeeuwsche Ceres kroon haar pruik met goudgeele aaren,

    Van ''t vetste Tarwgewas, sy bralle met die prys,

    En doof de Poolsche gloor, en kroonen die uit ys,

    En feller frost haar oegst vry maagerder vergaaren.

    Die luister scheen te flaauw. Nu kroonen Febus blaaren,

    Van heiligh Lauwerier, haar ombeschuimden tuit,

    Dewyl uit Themis schoot ambroos van booven spruit,

    In haare Koorenschuur, dat geene landen baaren.

    Droegh ik niet naa de zee den lauwer van Angier?

    Zoo tuigh de Zeeuw, als hy dat rechte brood zal smaaken,

    Wat kostlik manna hy besit in een Grenier.

    Grenier zoo korts gebouwt, ik sie uw volle daaken

    Noch slissen pleitend volk, om kooren schaars, en dier,

    En dies op ''t Raadhuis, jaa, de Haaghsche solders raaken.'
- titel: Aan Abraham Grenier den jongen, rechtsgeleerden van Middelburgh, teegenwoordigh te
    Angiers
  dichter: Joannes Six van Chandelier
  aan: Abraham Grenier (1626-1660)
  datum: '1650'
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Naar alle waarschijnlijkheid heeft Six dit sonnet, evenals het voorgaande, in
    Spanje (Madrid) gedicht. In Frankrijk had hij van zijn reisgenoot Grenier afscheid genomen,
    maar er was afgesproken elkaar in Italië weer te treffen. In dit gedicht gaat Six nog van
    die afspraak uit en legt Grenier de voordelen van zijn komst naar Italië voor. Later zou
    hij echter te horen krijgen dat Grenier was teruggekeerd naar Zeeland (vgl. gedicht no.
    [71], r. 1-4).  In de Parijse bibliotheek had Grenier Aulus Gellius' Noctes Atticae (tweede
    eeuw na Chr.) bestudeerd aan de hand van een codex. De aantekeningen die hij daarbij maakte
    zijn onder ogen gekomen van Nicolaas Heinsius, die er iets over heeft meegedeeld aan Isaac
    Vossius, al is niet duidelijk wat. Heinsius' brief is nl. verloren gegaan en zijn mededeling
    nog slechts te reconstrueren uit een terloopse opmerking in Vossius' antwoordbrief van 19
    augustus 1651 (‘Grenirius iste Zelandus, qui in Gellium notas scribit, quis sit vellem addidisses’,
    Burman, 1727, iii, p.622-623). Grenier is met Heinsius ook over andere zaken in contact
    geweest. Ik vond een briefje van Greniers hand, dat een aan de hoogleraar gezonden ‘pack’
    heeft vergezeld, zoals blijkt uit een vermelding op de adreszijde. Blijkens de eerste regel
    van het briefje (‘Ecce tibi tandem Canisii antiquas istas lectiones, [...]’) zal de jurist
    Grenier in dat pak de in 1601-1604 verschenen zesdelige Antiquae Lectiones van de rechtsgeleerde
    Henricus Canisius hebben verstuurd. Het pak met het briefje is vanuit Den Haag naar Leiden
    gezonden en heeft als datering slechts ‘24 Maij’ (ub Leiden, Handschrift Burm. f 6 a). Ook
    met de in dit gedicht (r. 11) genoemde Claudius Salmasius is Grenier in correspondentie
    geweest. In een brief brengt hij de beroemde hoogleraar zijn reis naar het zuiden en zijn
    codicologische belangstelling onder de aandacht en noemt daarbij ook Gellius' werk. De brief
    is vanuit Middelburg naar Leiden gestuurd en alleen ‘14 kalend. Julias’ gedateerd (ub Leiden,
    Handschrift Pap. 7). Uit r. 10 van dit gedicht blijkt het niet duidelijk, maar ook Six moet
    zich met variantenonderzoek hebben beziggehouden. In de Leidse universiteitsbibliotheek
    bevindt zich een Horatiusuitgave van 1613 (signatuur 758 e 261) met aantekeningen in het
    handschrift van Joan van Broekhuizen (1649-1707). Tegenover de titelpagina verklaart deze
    dat hij in het onderhavige exemplaar varianten heeft overgenomen uit een bijgeschreven Horatiusexemplaar
    van Six van Chandelier. Six zou die varianten hebben verzameld uit een ‘codex regius’, leest
    Van Broekhuizen uit een aantekening in Six' exemplaar, maar het is hem niet duidelijk in
    welk koninkrijk hij die zou hebben geraadpleegd. Hij neemt aan dat het handschrift een Frans
    of een Spaans bezit is, want hij weet dat Six in die twee koninkrijken is geweest. Ik heb
    een aantal van de door Van Broekhuizen overgenomen varianten vergeleken met de variantenopgave
    in een moderne Horatiuseditie (Horatius, editie Bo), maar moet bekennen dat het mij niet
    is gelukt onomstotelijk aan te tonen welke codex Six onder ogen moet hebben gehad, al wijzen
    de meeste door mij vergeleken varianten op de codex met het sigle a (Parisinus 7900 a, een
    tiende-eeuws handschrift, vgl. Horatius, editie Bo, i, p. vii-viii). Ik kan dus, mede op
    grond van r. 10 van dit gedicht, slechts aannemen, dat Six een van de in Parijs bewaarde
    Horatiushandschriften heeft bestudeerd, toen hij daar in het gezelschap van Grenier verbleef.
    Dit sonnet staat op p. 27 van Six' bundel.
  tekst: 'Aan Abraham Grenier den jongen, rechtsgeleerden van Middelburgh, teegenwoordigh te
    Angiers

     

    O kriekelende Son, die juist den Burghschen tooren

    Roost middel in de locht, noch bruin, met flaauw gestraal,

    Geleerde jongelingh gun, dat ik u zoo maal,

    Wiens dach, dat Zeelands dach, flus groet, uit u gebooren.

    Wat swerven wy zoo langh, ghy my, ik u verlooren,

    En langer? want de Loevre, en ''t moedigh Eskuriaal

    Doodvyanden, haar ryk, elk prysende, en haar taal,

    Van ons hersaam, naa Room, weerstreevich praaten hooren.

    O wist ghy vriend Grenier? ghy vloogt door ys, door sneeu.

    Waar ik ''s daaghs Flaccus sleet, sleet ghy Atheensche nachten.

    Hier hoefde ik geen Salmaas, een Eenlingh onser eeuw.

    Myn krachtich voorschrift was den Paap een stuk van achten.

    Toen leek Parys een dorp, meest voor een kloeke Zeeuw.

    Hier leeft Alexandrye, in perkament, en schachten.'
- titel: Aan Florencen
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Florence, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het sonnet staat op p. 35 van Six' Poësy
  tekst: 'De mond van alle man weet niet genoegh te looven

     

    De goude vryicheit, heel sorgeloos in swangh,

     

    Voor wie uw land bewoont, of door den ommegangh,

     

    Syn vremde reisen neemt, van ondren, en van booven.

    5

    Maar vryheit is de bron van alle quaad der hooven,

     

    Meest soo se lyk een paard mach hupplen sonder dwangh.

     

    Sy is een weel''ge boom, die van geen mes in langh

     

    Besnoeit, maar schaaduwen, voor vruchten kan belooven.

     

    Sy dartelt op uw grond, en lydt noch toom, noch wet,

    10

    Gelyk ten tyde van aaloude Tiberynen,

     

    Van ''t weelich Asien, in vrye vree, besmet.

     

    Men siet, Florencie, dees Son niet lange schynen,

     

    Indien dat speelwyf, aan geen halsband, werd geset,

     

    Maar eer uw heerlikheit, dan die van Room, verdwynen.'
- titel: Aan Raimond de Smeth
  dichter: Joannes Six van Chandelier
  aan: Raimond de Smeth
  datum: '1650'
  locatie: Genua?, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Dit briefgedicht zond Six vanuit Italië (Genua?) aan Raimond de Smeth, een rijke
    Amsterdamse koopman en een ver familielid van Six (vgl. gedicht no. [109], r. 19). De Smeth
    handelde ook op de landen aan de Middellandse zee (vgl. Wätjen, 1909, p. 359). Dit sonnet
    staat op p. 36 van Six' bundel.
  tekst: 'De Smeth die, op uw kas, de beurs van ''t Y doet draaijen,

     

    Gelyk de werreld draait, op ''t een, en ''t ander punt,

     

    En die zoo wysselyk met Argos oogen kunt

     

    Aanleggen, dat u nooit de Bankrotiers bekaaijen.

    5

    Ik dreighde al om een blad te laaten ooverwaaijen,

     

    Van Vrankryk, of den Taag, met booden, of een vrund:

     

    Maar met een bloote groet, schoon hartelyk gegunt,

     

    En sonder koopmans praat, hiel ik dat ongeraaijen.

     

    Ik kende Betis wol, noch Toersche syde kleên.

    10

    Ghy lacht met Ganges kruid, en wilt haar gom vergeeten.

     

    Maar hier valt marmersteen, voor ons verstand, gemeen.

     

    Een steen licht noodich, want uw blaauwe wierd versleeten,

     

    Van vryers sonder tal. Dit seit my ieder een.

     

    Begeert ghe marmer, laat uw trouwe Neef ''t maar weeten.'
- titel: '''t Leeven van meenigh reiselingh in Italien, aan een vaader'
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het sonnet staat op p. 37 van Six' Poësy.
  tekst: 'Wat leeven dat veel jeuchds verslyt by Italjaanen?

     

    De Heeren taaflen wel des noens, op sangh, en snaar.

     

    De maage kookt de spys, in wynen licht, en swaar.

     

    Den vroegen aavond werd vernacht, by kortisaanen.

    5

    Of andre gaan ter kroegh, op Bacchus dartle traanen.

     

    De kaart houdt aan. De schyf loopt elke slach gevaar.

     

    ''t Smookt rondom van tobak, of ''t in de helle waar.

     

    De wyste hoortmen van tonneelgespel vermaanen.

     

    De Waard schaft ''t nachtmaal laat. Men wandelt naa men at,

    10

    Ook sonder maaneschyn. Men moet een kuur bedryven.

     

    Men sluimert tot de Son den halven dagh vergat.

     

    Of ryst men, ''t kost een dans, van tweetjes, of van vyven.

     

    Nu is uw lieve soon geleerdt, al kosten ''t wat.

     

    Maar, als ik Vaader ben, myn soon zal binnen blyven.'
- titel: Op het ontbeeren van den waaren godsdienst
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het buitenland, waarvan in dit gedicht sprake is (r. 7), zal betrekking hebben
    op Italië (door Six in 1650 bereisd) en de aanduiding den waaren godsdienst in de titel
    zal dan ook bedoeld zijn als contrasterend met het katholicisme in dat land. Frederiks,
    1883, p. 240 suggereert dat het gedicht slaat op Six' reis door Frankrijk, ‘voorbij Nantes’,
    maar ik zie voor die plaatsbepaling geen argumenten. De Klinkdichten-afdeling in Six' bundel
    is min of meer chronologisch geordend en die ordening wijst voor dit sonnet in de richting
    van Italië. Het staat in die afdeling op p. 39.
  tekst: 'Men treedt de seegeningh des Heemels vuil met voeten,

     

    Gelyk een swyn, wanneer se daauwt, in onsen schoot:

     

    Maar naa ''t den goeden God rechtvaardich eens verdroot,

     

    Weerhoudt hy die genaade, en doetse dorstigh boeten.

    5

    Hoe dikwils goede God, heb ik te huis dien soeten,

     

    En saalgen daauw versuimt, van uw gesant genoodt?

     

    Dies blyve ik, buiten ''s lands, te recht daar van ontbloot,

     

    En myn vergeefsche beên die schuld besuuren moeten.

     

    Och mocht een drupje van die koele volle beek,

    10

    Ontsprongen door uw geest, op Holbeeks rots geslaagen,

     

    De drooge tongh myn''s ziels nu laaven met een preek.

     

    Zal ik my naamaals van versuimenis beklaagen?

     

    Vergeef ''t my Heer, en geef een eer versuimden week,

     

    Ik zal, op elken dagh, een volle kruik wegh draagen.'
- titel: Rome wel besiens waardich
  dichter: Joannes Six van Chandelier
  datum: oktober-november 1650
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six was in het najaar van 1650 (oktober of november) aangekomen in Rome en was
    daar tot in december gebleven. In dit sonnet kijkt hij terug op zijn verblijf aldaar. Het
    staat op p. 39 van zijn bundel.
  tekst: 'Wat was u, aan ''t gesicht van Rome, veel geleegen?

     

    Wat lagh my aan Parys? wat roerde my Madril?

     

    Dry hoofden van Euroop bestuurt naa hunnen wil,

     

    Maar dat munt uit, en draaght dry kroonen saam gereegen.

    5

    Ik sach dien werreldgod, die noch dry werreldweegen

     

    Syn kloosterduiven sendt, om sien of ''t waater vil

     

    Van ''t droevich ongeloof der heidnen sonder bril,

     

    Die Afgod kruiste my van self, jaa, met syn seegen.

     

    O wat al vryheits is voor Tyters in dat land!

    10

    Sy streelen Amaril, ook als een Ram de Schaapen.

     

    Wy kussen Galate t''huis vry van Sodoms brand.

     

    Men mach aan Rome wel een duure maand vergaapen.

     

    Al is er Keiser, Held, noch d''oude trotse stand,

     

    Noch stoft de Paus met recht, op ''t pakhuis van de Paapen.'
- titel: Op een ontsegh my gedaan
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Rome?, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Ik kan over de ruzie waar dit sonnet over gaat, geen nadere bijzonderheden geven.
    Als de afdeling Klinkdichten van de bundel chronologisch geordend is, zal het in Italië
    (Rome?) tot stand zijn gekomen. Het staat op p. 40 in Six' bundel.
  tekst: 'Hoe? daaght ghy een Poeët? syn penne kan maar vechten.

     

    Hy wierp sich liever met de vlucht in een rivier,

     

    Dan hy, op ''t wraaksiek punt van ''t sondich dootsch rapier,

     

    Onnoosel een krakeel, belachlik zou beslechten.

    5

    Wie heeft van beiden schuld? gaa vriendlik saamen rechten,

     

    Besaatight van gemoed. Uw tongh die sonder bier,

     

    Of wyn te proeven, naa syn eer stiet, als een stier,

     

    Of syne rymlans, met die in uw borst te hechten?

     

    ''t Is noodloos dat hy wroete in ''t gootgat, of vervarsch

    10

    Zoo stinkend nieuwsch, op dat geen jeukerige tanden

     

    Sich kootren, ons ten hoon, op ''t snappen van de pars.

     

    Men dekt syn eigen schand, met syn gebroeders schanden.

     

    Men blyve vrinden schoon men eens lagh oover dwars.

     

    Uw woorden waaijen wegh. Doet ghy myn rymen branden.'
- titel: Op den bergh Vesuvius, en het Swaaveldal
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Napels, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Vanuit Rome bereisde Six ook Napels en de streek rond Napels. Iwema heeft het
    vermoeden uitgesproken dat Six met het in de titel van dit sonnet genoemde swaaveldal de
    zgn. Grotta del Cane (de Hondsgrot) bedoelt (Iwema, 1957, p. 171-172). Ik geloof echter
    dat dit swaaveldal Six' verhollandsing van ‘Solfatara’ of ‘Solfaterra’ is, de naam van een
    in de nabijheid van de Grotta del Cane gelegen vulkanische vlakte, die eigenlijk de krater
    is van een half-uitgewerkte vulkaan. Uit de hete bodem van de vlakte (ongeveer 300 m in
    doorsnede) stijgen zwaveldampen op. De Solfatara ligt in de nabijheid van Pozzuoli, het
    Antieke Puteoli aan de Golf van Napels, ongeveer 25 km ten westen van de Vesuvius. Een beklimming
    van de Vesuvius en een bezoek aan het gebied rond de Antieke plaatsen Puteoli en Cumae behoorden
    tot de vaste uitstapjes van de toeristen in Six' tijd (Beloch, 1890, p. 123; Iwema, 1957,
    p. 171-172; Schudt, 1959, afb. 21 op p. 89; Frank-van Westrienen, 1983, p. 296 en afb. 21
    op p. 297). Six' bezoek aan de Vesuvius en de Solfatara is te dateren in de laatste maanden
    van 1650. Dit sonnet staat op p. 40 van zijn bundel.
  tekst: 'Wy saagen staande, op ''t spits, omwolkt, laagh Pluto branden,

     

    En, in de scheemersmook, hem heerschen op syn stoel,

     

    Omringelt met een heir van ongetelt krioel,

     

    Gepynight van de vlam, aan eeuwige ysre banden.

    5

    Wy lieten, na Puzool, ons oover waater landen:

     

    Hier sengde ons schoensool, in een gloenden swaavelpoel,

     

    Naa gissingh buurende, aan dat yslik berghgewoel,

     

    Onse ooren slooten, van de knarselingh der tanden.

     

    De leidsman sei, dit werd te Napels ''t vaagevier,

    10

    ''t Geberghte flus gesien, den mond des hels geheeten,

     

    Al leek nu pas verschil, aan ''t kryschen, en getier.

     

    Wy vraagden, vriend, waar is den Heemel nu gespleeten?

     

    Hy stont gelyk verset, en sprak niet eenen sier.

     

    God zy gelooft, dat wy dien saalgen ingangh weeten.'
- titel: Op het aanhooren van oovereenstemmend gesangh en snaarspel
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Venetië?, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het kan zijn dat Six dit gesangh en snaarspel heeft gehoord in Venetië, waar
    hij in 1650 wat eer dan Gods geboorte dagh (gedicht no. [84], r. 11) was gearriveerd (vgl.
    r. 4 van dit sonnet). Het gedicht staat op p. 42 van Six' Poësy.
  tekst: 'Ha blyde Heemelen! myn ingewanden springen

     

    Van vreuchde, in d''ooren, soet gekittelt op den toon

     

    Van orgels, violons, en fluiten duisendschoon,

     

    Gepaart aan keelen, die uw soons geboorte singen.

    5

    Ha blyde Heemelen! kan ''t aardsche ons hart doordringen,

     

    Zoo lieflik, en van hier op voeren, naa Gods throon?

     

    Waar voer de ziel van hen, die ''t baaren van syn soon,

     

    Uit lofgesangen, van uw Englen selfs, ontfingen?

     

    Ha blyde Heemelen! verheught my dit gesingh,

    10

    Verheught de Harders dat van duisend Engeltoonen,

     

    Wat vreuchde schiep hy, die uw saalicheit ontfingh?

     

    Haa blyde Heemelen! vol millioenen kroonen,

     

    Staagh juichende, op den aam dier starren onderlingh,

     

    Myn geest verlanght by dat halleluja te woonen.'
- titel: Aan den brandenden Vesuvius
  dichter: Joannes Six van Chandelier
  datum: najaar 1650
  locatie: Napels, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six' bezoek aan de streek rond Napels is te dateren in de laatste maanden van
    1650. Hij zal de stad vanuit Rome, waar hij van oktober of november tot in december van
    dat jaar verbleef, hebben bereisd (vgl. ook de Toelichting bij gedicht no. [79]). Dit sonnet
    staat op p. 42 van zijn bundel.
  tekst: 'Men timmer Gode een kerk, de Droes bouwt een kapel.

     

    Schynheil''ge boosheit woont, naast waare heilichdommen.

     

    Al werd de Heemel op, de helle neergeklommen,

     

    De hel raakt ''s Heemels ringh, de Heemel raakt den Hel.

    5

    De haamer van den God gethroont, langs ''s Tybers wel,

     

    Ontsloot de jubelpoort van ''s Heemels innekommen:

     

    ''t Was kermis in den hel, Kampanjes duiveldrommen

     

    Ontslooten weer Vesuuf, en schooten Montgibel.

     

    O vuurige kolom, oud barnende Salmander,

    10

    Natuures piramyd, ghy Fenix uit uw asch,

     

    Naa twintigh jaar hergroeit, de selfde, en nooit een ander,

     

    Hoe komt dat wie uw gloed, van zoo veele eeuwen las,

     

    Uit d''afgrond van een niet ontglommen, niet zoo schrander

     

    Kon meeten af, hoe dat de hel licht eeuwigh was?'
- titel: Aan myne vrienden
  dichter: Joannes Six van Chandelier
  datum: 1650-1651
  locatie: Venetië?, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Dit sonnet is korte tijd na kerstmis 1650 tot stand gekomen. Six schreef het
    misschien voor zijn kennissen in Venetië, waar hij toen was, maar het is ook mogelijk dat
    hij het opstuurde naar vrienden in Nederland. Het staat op p. 43 van zijn bundel.
  tekst: 'Wat wiltmen dat ik schryf van Rome ''t jongste Babel,

     

    Die onbeschaamtheits bron, dat hof van veel gedool,

     

    Die Moeder des verderfs, die Goddeloose school,

     

    Waar Pieters sleutels zyn, met sinte Pauwels saabel?

    5

    Men hou veel geestlykheits niet dan Esopus fabel,

     

    Die waar zal werden, zoo een meester, die wel spelt,

     

    Een b in plaats van g aan geestelykheit stelt.

     

    Sy scheelt van ''t geestlyk meer, dan Kain scheelt van Abel.

     

    Ik dank den Heemel ik dat heiligh Romen sach,

    10

    Nochtans onheiliger niet zynde hier gekoomen,

     

    By Markus Leeuw wat eer dan Gods geboorte dagh.

     

    ''t Is nu wat laater, sints heeft hy zoo toegenoomen

     

    In aapery dat ik de menschen lyken mach,

     

    By sichtbre Duivelen in mommen en in Momen.'
- titel: Op de vastelaavond te Venecie, aan de selve
  dichter: Joannes Six van Chandelier
  datum: '1651'
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Dit sonnet is opgedragen aan Six' vrienden (vgl. het voorgaande sonnet), maar
    blijkens Veneciaan (r. 1) is het een aanspraak aan de inwoners van Venetië. Het staat op
    p. 43 van Six' Poësy.
  tekst: 'De maskers, Veneciaan, baldaadigh opgetoogen,

     

    In veelerlei gewaad, dat naa geen mensche scheen,

     

    De man een vrouw, de vrouw een man, in andre kleên,

     

    Verwisselt van gelaat, met ooverschoorsteende oogen,

    5

    Gaan veel met vreuchdespel, en houden ''t jaar bedroogen,

     

    Van ''s Vaaders soons geviert, in andre paapsche steên,

     

    Als of ghy teegenstreefde, als ghy wel in ''t gemeen

     

    Hem teegenstreeft, om geen gebieden te gedoogen.

     

    De trommel onderwyl werd in het spel misbruikt,

    10

    Eer noodich, om ''t geweld der wreede Mametaanen

     

    Te weeren, dat naa ''t ryk van ''t kruidryk Kreten ruikt.

     

    Men vreest dat droevigh kalf voorseit noch lange traanen,

     

    En fnuikt dees dartle vlught, wel eer van u gefnuikt.

     

    Gebruik den trom, en stuit den was der halve maanen.'
- titel: '''s Amsterdammers Winter'
  dichter: Joannes Six van Chandelier
  aan: Simon Dilman
  datum: 1650-1651
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six schreef dit gedicht tijdens zijn eerste reis naar Italië, in de winter van
    1650-1651. Hij droeg het op aan zijn arts, vriend en verre verwant Simon Dilman (vgl. de
    opdracht, gedicht no. [308]). Het gedicht is eerder uitgegeven en van commentaar voorzien
    door Van Es, 1953, p. 56-79 en p. 158-168 en Schenkeveld-van der Dussen, 1988 (vgl. ook
    Michels, 1964, p. 184-193). Het staat op p. 51-74 van Six' bundel Poësy van 1657.
  tekst: "Ik singh den guuren Winter tyd,\n \nAls Amsterdam die 's Winters slyt.\n \nDe slachtmaand\
    \ heeft dit jaar het recht\n \nVan jaarliks offer afgeleght,\n5\nMet bloed van gras, en\
    \ eik gediert,\n \nTot 's menschen nooddruft, tam getiert.\n \n't Westfaalsche Verken is\
    \ gekuipt.\n \nDe Mastenbroeker Os deurdruipt\n \nSich traagh, van Oleronner sout.\n10\n\
    De schouwen rooken meenigh bout,\n \nIn Amsterdam, tot bloedkoraal,\n \nMet mosterd, kooninghlyk\
    \ onthaal.\n \nDe worst, en beulingh zyn bereidt,\n \nEn kroonen kok, en keuken meid.\n\
    15\nDe vruchtbre Soomer viel in 't sand,\n \nGeschudt van herfst, en winterhand.\n \nOm\
    \ dat de Son, die jaar, en uur,\n \nMet hooghte, of syn verleegend vuur,\n \nLeert kennen,\
    \ van zoo hoogh niet keek,\n20\nNu vliende langs een laager streek,\n \nVan waar hy 't volk,\
    \ dat onder leeft,\n \n't Ontneem van onse Sonvrucht geeft.\n \nDe velden kortlinghs groen\
    \ geweest,\n \nGeschooren van zoo meenigh beest,\n25\nWaar van de milde booterpram\n \n\
    Der Koeyen, op geen slachtbank quam,\n \nDie, onder schuurriet, geurich hooi\n \nHerknaauwen\
    \ in een warme kooi,\n \nDie velden, waar men soet, in 't gers,\n30\nDe gersjes bondt, met\
    \ syn meesters,\n \nVertreuren leedich, ros en vaal,\n \n't Verwelkte klaaver maaktse kaal.\n\
     \nNu rygt Auroor geen parlen op\n \nEen groenen, koelen, klaaren top,\n35\nDie langs d'ontblaade\
    \ schors gedekt,\t\n[p. 102]\t\n \nVan alabastre rymen lekt,\n \nAls Feros boom, die wonderbron,\n\
     \nIn 't straalen van d'opgaande Son.\n \nWanneer de spaade daagraad blikt,\n40\nZoo werd\
    \ men schier van pest verstikt,\n \nOpdryvende als een bange nacht,\n \nVol stanks, en tastlik,\
    \ uit de gracht.\n \nDe schaaduwryke Lindetuin\n \nVerloos de pluimen, van syn kruin,\n\
    45\nDor afgerolt, elke oogenblik,\n \nOp straat, en in het waater, dik.\n \nAl wat de Peer,\
    \ en appel droegh,\n \nAls kars, en Beesistam, sweem vroegh.\n \nOf was het van een taaijer\
    \ aard,\n50\nDat werd, in huis, op strooi bewaart.\n \nWat naamen draaght, van boom, of\
    \ kruid,\n \nHeeft kaale takken, of is uit.\n \nBehalven 't dubble bedcieraad\n \nVan Palm,\
    \ die staagh in groente staat,\n55\nEn dat misschien ook God Apol\n \nIn hooi, een mat,\
    \ of warmer hol,\n \nOp Dafnes loover, gaade slaat,\n \nOp dat het niet voor hem vergaat.\n\
     \nGeen hof kan 't fraaije bloemtapyt\n60\nVan d'ooverschoone Lentetyd\n \nVerbeelden, dies\
    \ gaat d'aarde in rouw,\n \nOm 't schenden van haar weefgetouw.\n \nMen kan geen lieve Rosemond,\n\
     \nMet bloemen varsch geplukt, en rond\n65\nGevlochten, hullen, om het hoofd,\n \nBetaalt\
    \ met kusjes heusch gerooft.\n \nMen siet geen simple leeuwerwerk,\n \nLangs wendeltrapjes,\
    \ met gevlerk,\n \nVan 't nestjen vlichelen ter lucht,\n70\nMet staadich schaatrend soet\
    \ genucht,\t\nEmendatie r. 56: warmer hol < warmerhol\n[p. 103]\t\n \nSulks blindlinks 't\
    \ volgende oor op 't lest\n \nLooft hy, om hoogh, ook heeft syn nest.\n \nMen hoort nu by\
    \ een steekelbey,\n \nWaar 't wyfje sat, en broeide op 't ei,\n75\nVan 't mannetjen, den\
    \ Nachtegaal,\n \nGeen keel verandren duisendmaal.\n \nWaar hoort men, teegen dat de Son\n\
     \nDen vroegen ondergangh begon,\n \nSchoon dat haar vyand, ver van hier,\n80\nAl langh\
    \ vloogh naa een reeuwsch quartier,\n \n't Gebrikkekik, koak, koak,\n \nZoo aangenaam, uit\
    \ meenigh rak,\n \nVan 't stille veen, waar in de vis,\n \nVoor hangelaars, niet schrikkigh\
    \ is?\n85\nDe sjirrelende Swaaluw, die\n \nSnel ooverloopende, een spie\n \nElk jaar verstrekt\
    \ van land in land,\n \nDie uit Afrykens braadend sand,\n \nOns bykomt, als een keerelingh,\n\
    90\nVerspiedde al vroegh de linderingh\n \nVan 't warme weer, en wierd gewaar\n \n't Kleppentren\
    \ van den Oijevaar,\n \nDie met den bek syn jonger tyd\n \nVan Lente, en Soomer, dus verblyd\n\
    95\nBedankte, en staande op reis den Heer\n \nBadt, om een lente, en soomer weer.\n \nZoo\
    \ volght een schynvriend 't makklik luk,\n \nMaar schuwt de komst van harden druk.\n \n\
    Getrouwer streek, uit 's Heemels kot,\n100\nDe Gans, boo van den Wintergod.\n \nMen spelt\
    \ de Grieksche groote l\n \nNu somwyl, in 't doorluchtich vel\n \nDes Heemels, van syn konstge\
    \ pen,\n \nGetrokken, strax een kleine n,\n105\nOf i, dan weer een halve maan,\t\nEmendaties\
    \ r. 84: is? < is. \nr. 86: een < en een\n[p. 104]\t\n \nNaa dat de streek en winden gaan.\n\
     \nDan volght licht, door de strenge lucht,\n \nEn gonst, en quaakt een endevlucht,\n \n\
    Die Spitsbergh, met den veigen dagh,\n110\nIn d'oegst, mak westwaarts scheiden sach,\n \n\
    Al voogels welkers beenge borst\n \nLivreirood afbeeld van de vorst.\n \nMen pronkt nu weinigh\
    \ met gewin\n \nVan Seres draad, of wormgespin,\n115\nUit Thisbes witte, en swarte blaân.\n\
     \nMen trekt een dikker harnas aan\n \nDe deelen twintighmaal getakt.\n \nMen houdt het\
    \ lichaam dicht gepakt,\n \nIn duisendverwge Spaansche wol,\n120\nIn 't omgekeerde vellenhol,\n\
     \nVan Moskous kostlik saabel bont,\n \nVan Getaas kat, van Gotlands hond,\n \nVan Neerlands\
    \ mol, van Haarlems knyn,\n \nEn van d'Armener armelyn.\n125\nMen voelt hoe, op den middagh\
    \ self,\n \nHet laage licht, van 't schuin gewelf,\n \nZoo flaauwtjes straalende, pas warmt.\n\
     \nHoe ook geen kleed het diep gedarmt\n \nBeschut, voor 't krimpend Noordgeblas,\n130\n\
    Dat wolken stort, met plas op plas,\n \nDat dak, en straat, met haagelsteen,\n \nBetikketakkende\
    \ onder een,\n \nEn dan, met een besneeuwden vlaagh,\n \nOnse oogen scheemren doet by daagh.\n\
    135\nDe blanke sneeuwge handgranaat\n \nBotst boetsende op de lui op straat.\n \nDe Markt,\
    \ en straaten zyn beslykt,\n \nSulks nergens gangbaar pad gelykt.\n \nGaa siet, en hoort,\
    \ hoe fel, hoe dol,\n140\nDie blaaskaak d'eike muuren quol,\t\n[p. 105]\t\n \nGetraalyt,\
    \ als een hek, in 't y.\n \nHy blaast de golven van ter zy,\n \nSoo kapplende, of hy fors\
    \ om veer\n \nWou kappen al het teegenweer.\n145\nLagh daar een ongeankert schip,\n \nHy\
    \ slongh het aan die houte klip.\n \nWie weet wat bergen nu wel gaan,\n \nEn daalen in den\
    \ Oceaan,\n \nDe Vaader van een ieder Zee?\n150\nHier splyt de last een kiel in twee,\n\
     \nDaar ryst er een den Heemel in,\n \nEen derde sinkt, naa 't Helsch gesin.\n \nWat voor\
    \ Hirkaaner monster most\n \nHy weesen, die de vaart begost?\n155\nHy had drydobbel grof\
    \ metaal,\n \nOm 't roekloos hart, die d'eerstemaal\n \nSich waaghde, met een brosse boot,\n\
     \nOp 't grondloos diep, een nieuwe dood.\n \nWie nu niet noodich buiten moet,\n160\nDie\
    \ vaart, noch rydt, noch gaat te voet.\n \nHet woudkind, d'eedle taaye pyn,\n \nUit Noorweeghs\
    \ dichte boomwoestyn,\n \nMet kroonen om, steil opgericht,\n \nOmhelst van d'eik haar lieve\
    \ nicht,\n165\nMet haar nu onbevruchten schoot,\n \nSwak van de leste draagens nood,\n \n\
    Die sy ontfingh van Piersemyn,\n \nIn 't weste, planter van syn wyn,\n \nWaar mee sy groot\
    \ gevaar op zee,\n170\nEn schier een duure misval lee,\n \nSoekt in de stille waal wat troost,\n\
     \nBy duisend susters uit het Oost\n \nEn Suid, en Noord, gekoomen mat,\n \nHet seildrigh\
    \ bosch van Amstels stad.\n175\nDe dennejaagster licht, en ras,\t\n[p. 106]\t\n \nDie in\
    \ de gulde waaterplas,\n \nDoorweemelt van het leeven, van\n \nHet volk met silvre schubben\
    \ an,\n \nGelyst met bies, en riet, waar in\n180\nDat Pan verandren sach syn min,\n \nGeoeffent\
    \ in een gaalery\n \nVan weegen, huis, en hof ter zy,\n \nMet sneller winden jaaght langs\
    \ 't land,\n \nWanneer se 't seilbaar wand ontspant,\n185\nDan winden jaagsters van Diaan,\n\
     \nNiet naa een hart, met waapens aan,\n \nNoch naa een vreesselyken Beer,\n \nMaar om plaisier,\
    \ en loutere eer,\n \nMet teegenjaaghsters in een loop,\n190\nEer is om beesten niet te\
    \ koop,\n \nDie vliegster sluit het jachtenhuis,\n \nDaar vry voor onweer, stil, en kuisch.\n\
     \nWie wil sich nu verkleumen gaan,\n \nNaa Spaarendam, of Oostersaan,\n195\nLanghs 't Y,\
    \ of langhs den Amstelstroom,\n \nOf naa den engen Overtoom,\n \nOm daar een greetich soodjen\
    \ post\n \nTe peuslen, voor syn middaghkost?\n \nWie rydt er nu van 't waagenveer\n200\n\
    Quinkleerende, om de Diemermeer?\n \nOf 't groote, of kleine loopveld om,\n \nEens peistrende,\
    \ om een paartje Mom?\n \nWie nu dees weegen, sonder steen,\n \nVan enkel licht doormoddert\
    \ veen\n205\nWou ryden, als in een moerasch\n \nSonk met gespan, en waagen asch,\n \nAls\
    \ Amfiaräus, door den mond\n \nVan d'aarde, op gronden, sonder grond.\n \nWie kuijert ook\
    \ naa Houtewaal,\n210\nOm melk, of room, of zulk onthaal?\t\n[p. 107]\t\n \nAl zyn de dyker\
    \ klinkerts kuisch,\n \nMen krimpt, en komt bedrekt weer t'huis.\n \nDe Vryer gaat noch\
    \ Keisersgracht,\n \nNoch Cingel om, gelyk hy placht,\n215\nOm, wandlende onder 't koele\
    \ loof,\n \nOp steentjes, uit een bakkers stoof,\n \nDie 't aansicht dekken van de wal,\n\
     \nBevloeit van Amstels klaar kristal,\n \nEen schoone Joffer, hier, of daar,\n220\nDoor\
    \ 't spiegelglas, te neemen waar,\n \nVan 't kooppallais, wyl sy de naald,\n \nDoor Kamrixdoeken,\
    \ huislik haalt.\n \nHy vreesde voor onnoodich leed,\n \nVan wind, of kildich lindesweet.\n\
    225\nDen Dam is van een ebbe leegh,\n \nFlus vloeide een ieglyk in de weegh.\n \nDe Koopman\
    \ om de kleine vaard,\n \nEn wyl het gryse jaar verjaart,\n \nEn 't nachtkleed Neerland\
    \ ooverspreidt,\n230\nMet sestien uuren duisterheit,\n \nKontoort den dagh, met kandelaars,\n\
     \nGelyk de langhste Son des jaars.\n \nGroet met de pen 't geeffent boek,\n \nMet een vaar\
    \ wel, voor 't jongst besoek,\n235\nNaa hy, wees welkom seide, aan 't nieuw,\n \nDat hy\
    \ voor nieuwe jaaren hieuw.\n \nEen ander drukt den nacht in 't hoofd,\n \nMet letters,\
    \ die hy, uit soet ooft\n \nVan blaaren las, gelyk een by\n240\nDen bykorf vult, met morgenty.\n\
     \nEen derde sluimert tot den noen,\n \nHoudt beurs, met weinigh daar te doen,\n \nHy taafelt\
    \ wel, en weet niet hoe\n \nTe futslen, tot vier uuren toe,\n245\nWyl hy om 't weer niet\
    \ trantlen kan,\t\n[p. 108]\t\n \nBy Slyterdam den tydinghman.\n \nDe klok die slaat, en\
    \ is noch warm,\n \nHy hanght syn mantel om den arm.\n \nDaar schoolt hy nu, op 't Heeren\
    \ huis,\n250\nOf telt in Doelens, met getuisch,\n \nOp 't vierkant van den dobbelsteen,\n\
     \nDen aavond in minuuten heen.\n \nOf slytse, met de twistge kaart,\n \nGemerkt met Meffers\
    \ beste paard.\n255\nOf weet niet waar se bleef zoo ras,\n \nVergeeten in het Mentser glas.\n\
     \nOf dryftse met Verinis touw,\n \nVan stankbre blaaren door de schouw,\n \nWyl ieder van\
    \ syn kinders graagh\n260\nUit school gekoomen, op 't gevraagh\n \nVan Moederlief een booterham\n\
     \nVan rogge, of tarwe dankbaar nam,\n \nZoo gaande, naa 't gebed, naa bed,\n \nEn wyl sy\
    \ eerbaar, trouw, en net,\n265\nOp 't haare naarstighlyk den disch\n \nDoet dekken, met\
    \ het geen er is.\n \nWaar voor haar liefste, dan gekeert\n \nEen geurigh kusjen, fy, vereert.\n\
     \nEen Rentenier broeit op het geld\n270\nIn d'ysre kist, niet uitgetelt,\n \nOp syn geheele\
    \ reekenbank,\n \nVan veel bankroeten bangh en krank.\n \nGeen waaghman, die nu waaren woegh,\n\
     \nHy suft in huis, of vult de kroegh,\n275\nLyk 't Bootsvolk, en verquist, van wyf,\n \n\
    En kind bestraft, syn tydverdryf,\n \nEn suur verdienden kost, in stank,\n \nAan 't swarte\
    \ pypje, een vinger lank,\n \nOf achtste deeltjen van 't geheel,\n280\nGesoogen uit Barbados\
    \ steel,\t\nEmendatie r. 275: Bootsvolk, < Bootsvolk.\n[p. 109]\t\n \nDroogh klein gekerft,\
    \ die hy, met smaak,\n \nWeer uitrookt, met een oopen kaak,\n \nOf kunstigh, uit het neusgat,\
    \ snuift.\n \nZulks, naa syn seggen, dooit en schuift\n285\n't Gestremde weerslym, naa den\
    \ mond,\n \nVan 't brein, langh vry, maar ongesond.\n \nZoo draait de dagh, en aavond uur,\n\
     \nMet tusschen beiden voor goed vuur\n \nTe praaten, wyl hy 't gorgel gat\n290\nBeschuimt,\
    \ met Rotterdammer nat,\n \nWaar voor de waard een vaan of twee,\n \nMet kryt, op 't lachberd\
    \ waaijen dee.\n \n't Krakeeligh geldloos appelwyf,\n \nDat al den Dam, dan met gekyf\n\
    295\nDan meest met schreeuwen, om het fruit\n \nTe veilen, door elks ooren tuit,\n \nDat\
    \ schier noch kou, noch hette ontsiet,\n \nNoch of het drooght, noch of het giet,\n \nIs\
    \ met haar stoof, en waagen heen,\n300\nEn spintse wat 't is ongemeen.\n \nMaar d'Oesterman\
    \ roept even dol,\n \nHaal Oesters, haal, varsch, blank, en vol,\n \nHy siet noch storm,\
    \ noch stortingh aan,\n \nOp dat syn waar niet zou vergaan,\n305\nBederflik in een dach\
    \ of acht,\n \nDies van Kolchester niet gebracht.\n \nDe Vischmarkt, diergelyken dat,\n\
     \nNoch Sidon, noch geen plaats besat,\n \nOm oovervloed, uit soet, en sout,\n310\nNaa 't\
    \ jaarty varsch, wat schuin gebouwt,\n \nDruipt een Rivier, van 't leijendak\n \nAfruischende,\
    \ in het dammerak,\n \nEn krocht, om dat de Wyker gul,\n \nFlus styf, en krom, als in een\
    \ krul,\n315\nVerslenst werdt, op de natte bank.\t\n[p. 110]\t\n \nEn steent, om dat de\
    \ kuitertvank\n \nVan swarten Ybot, sonder vocht,\n \nIn 't vlootje, en d'ongewende locht,\n\
     \nVerbleekt, vergaande, als al de visch\n320\nDie, uit syn element, daar is\n \nTe koop,\
    \ maar gansch geen koopers heeft,\n \nWaar 't anders ongelooflik leeft\n \nVan menschen,\
    \ als een miergekriel,\n \nWaar d'een den andren teegenhiel.\n325\nDoch al die drommel hindert\
    \ niet,\n \nMet koopen, dat er ooverschiet.\n \nOntelbre buiken werden sat,\n \nNoch blyft\
    \ in korf, en ben vry wat.\n \nDe vollikryke Kalverstraat\n330\nLydt mensch, noch sleede,\
    \ die men laadt.\n \nDe gooten kletsen op 't gesteent,\n \nEn elke luiffe huilt en weent.\n\
     \nElk kraamer onbeslooten veur\n \nSloot veinsters, en syn winkeldeur.\n335\nDe vloer en\
    \ muuren, binnens muur,\n \nWeêrsweeten, als een mensch voor vuur.\n \nMen jaaght noch kat,\
    \ noch honden uit,\n \nMeelydich om hun kaalen snuit.\n \nDe trotse haagelblanke swaan,\n\
    340\nNajaade in Amstels waaterlaan,\n \nDie aan de lindewortels lekt,\n \nIs van de poortwacht\
    \ dicht om hekt.\n \nHoor, luister, hoe de stormer woest\n \nOntstooken luider gilt, en\
    \ broest,\n345\nGeklieft van touw, en koorde, en mast\n \nDer kaagen, aan een Damringh vast,\n\
     \nGelaân, die met de steigerboots,\n \nAls om te sloopen leggen dootsch.\n \nOei, sok,\
    \ de wind snept door de wand,\n350\nMyn kleume schryfpen traaght de hand,\t\n[p. 111]\t\n\
     \nEn weigert, om 't swart stremmend git\n \nDes galnoots, letters aan het wit.\n \nMy dunkt\
    \ hy draaide, als d'Oosterhaan.\n \nZoo sietmen morgen, met nieuw maan,\n355\nDen vloed\
    \ bevloeren synen rugh,\n \nNaa morgen tot een vlakke brugh\n \nVan Semlaas marmer, klaarder\
    \ dan\n \nHet blanke Parus mynen kan.\n \nDan schynt des Heemels rond gecier,\n360\nZoo\
    \ blaauw, en helder als safier:\n \nHaar oogh, als een karbonkelsteen,\n \nStraalt uit een\
    \ klaaren ringh beneên.\n \nDe drooge Nabatheesche kou\n \nBlies al den neeveligen douw,\n\
    365\nEn 't quaad fenyn, met kracht, naa 't west.\n \nHy dempt de dampen van de pest.\n \n\
    Hy doodt op aarde al 't ongediert,\n \nDat in syn hoolen krielt en tiert.\n \nAls mier,\
    \ en pier, en muis, en mol,\n370\nWaar van een vruchtbaar bouland vol,\n \nWerd opgeknaaght,\
    \ en omgewroet,\n \nAls rupsen noch niet uitgebroedt,\n \nIn poppen, om een hoogen tak,\n\
     \nAls spinnen, vliegen, mugh, en slak.\n375\nHy sluit het oopen lyf, en dryft\n \nDe fluimen\
    \ uit, daar in verstyft.\n \nHy maakt de viese maagen graagh.\n \nHy lokt en leidt weer\
    \ man, en maagh,\n \nOp wegh, die als een spiegel blinkt,\n380\nEn waater, dat als yser\
    \ klinkt,\n \nWaar in de vaart, als in een net,\n \nDicht van metaalen is beset.\n \nOp\
    \ straat kan imand nauwliks staan,\n \nEn sonder spoor, of val niet gaan.\n385\nHet schoolkind,\
    \ dat van koude kromp,\t\n[p. 112]\t\n \nSiet dikwils toe, met klomp, op klomp,\n \nVan\
    \ aarde, of steen, hoe vast, of los\n \nHet ys was, lyk de loose vos\n \nWantrouwich eerst\
    \ daar 't oor op leit,\n390\nEn aan de stroom vraaght wis bescheid.\n \nHet werd van dartelheit\
    \ gequelt,\n \n't Schynt op de burghwal, als beknelt,\n \n't Wil ruimte om laagh, op 't\
    \ drooge nat,\n \nEen nieuwtje in lange niet gehad.\n395\nWat kuurtjes recht het niet al\
    \ aan?\n \nNu sult het op een gladde baan,\n \nWaar flus een veeger loon af heeft,\n \n\
    Wien elke schaatse een oortjen geeft.\n \nDaar valt het eens, bots een planeet,\n400\nIn\
    \ 't slipprigh ys, waar op 't gereed\n \nEen spreuk past, teegen 's maats gequel,\n \nDe\
    \ harde slaagen leeren wel.\n \nDan klikt het met een kleine kloot,\n \nAan 't paaltje,\
    \ of in een oopen boot.\n405\nNu schuift het op dry barden, met\n \nTwee krukken, onder\
    \ spits beset.\n \nOf laat sich in een grooten bak,\n \nAan steunsel achter, met gemak\n\
     \nVoorts stooten, quistigh van plaisier,\n410\nHet denkt om tyd, noch kost, noch vier.\n\
     \nZoo slaat de noenklok op het meest.\n \nVeel losse jeuchd wykt onbevreest\n \nNaa buiten,\
    \ op de waatervest.\n \nEen deel keurt d'Emster voor het best.\n415\nHier kryght het speelen\
    \ eerst een aard.\n \nEen onbeslooten Heemel baart\n \nEen onbeslooten lustigh hert.\n \n\
    Zoo speurtmen dat de gelvisch verd\n \nGesiener neert, in 't oopen meir,\n420\nDan in een\
    \ omgegraaven weer.\t\n[p. 113]\t\n \nWat braave swaanpluim is bequaam,\n \nOm 's winters\
    \ speeltuigh, hier te saam,\n \nWaar mee het ys geschaaft werd, wyl\n \nHet aanbakt in veel\
    \ grooter yl,\n425\nEn al de wysen van het spel,\n \nNaa eisch, te teiknen, op een vel?\n\
     \nDie zal schier 't ongetelde vier\n \nVan 't nachtlicht tellen op papier.\n \nHoe meenigh\
    \ hoofd, zoo meenigh spul:\n430\nElks hair heeft een besondre krul.\n \nDen hoop hoopt aan.\
    \ Den ouderdom\n \nVermenght sich, onder al den drom.\n \nHet zeedigh vrouwvolk woelt er\
    \ mee.\n \nElk maakt sich in syn waapnen ree.\n435\nDe schaatsen raaken aan de voet\n \n\
    Van meesters, en die leeren moet.\n \nDe kolver bindt syn ysspoor aan,\n \nOf heeft iet\
    \ strams om op te staan,\n \nWant 't gladde glas, is 't onbesneeuwt,\n440\nMet effe soolen\
    \ lacht, en spreeuwt,\n \nEn naa het looten van paarty,\n \nSchrapstaande slaat syn esp,\
    \ met bly\n \nVerswaart, of syne schotse klik,\n \nVan palm, dry vingers breed, een dik,\n\
    445\nMet loot der in, den Pennebal\n \nVan 't druifje onsichtbaar voor haar val,\n \nVan\
    \ ballemerkers opgemerkt,\n \nVoorts kolvende aan een paal geperkt.\n \nOf slaat om 't verdste,\
    \ slach om slach,\n450\nOm witjes, of een vaan in 't lach,\n \nGekorven op een dunnen tak,\n\
     \nDie ieder veur in 't wambais stak,\n \nMids wie syn kerfstok niet neemt waar,\n \nUitveegen\
    \ zal voor allegaar.\n455\nGins komt een sterk gevolghde Boer,\t\n[p. 114]\t\n \nVolwinds,\
    \ gereen, uit 't Veener moer,\n \nRuigh om syn ongekemde kin,\n \nMet lange keegels ys er\
    \ in,\n \nDat als een kraalbos, om het haair,\n460\nGelaasich ramm'lend wiewauwt swaar.\n\
     \nHy heeft een blaauwen raagbol op,\n \nVan schaapen, als een tweede kop.\n \nHy houdt\
    \ een bootshaak, op den nek,\n \nEn slingert fraai een staagen trek\n465\nVan halve maanen,\
    \ of gelyk\n \nEen paalingh bochtich woelt in slyk,\n \nWyl voet, voor voet, fel zydlinks\
    \ roeit,\n \nEn girst in ys, en locht, geschoeit\n \nOp ysers scherp, en smal, en langh,\n\
    470\nVoor krom, gelyk een halve tangh,\n \nGedekt van wilgen naa 't fatsoen\n \nVan syne\
    \ koussool, of syn schoen,\n \nDie hy onroerlik daar op bindt,\n \nEn snellik zoo steekt\
    \ door den wind.\n475\nEen vond die 't geestigh Holland vond.\n \nEen wonder in des Spanjerds\
    \ mond,\n \nDie dat, met bloedge schaade, sach,\n \nWanneer hy Haarlems muur belagh.\n \n\
    Twee Boeremeisjes van Abkou,\n480\nDie slooven ook, met douw, op douw,\n \nMet handen, en\
    \ gesicht voor uit,\n \nHaar rokken, waar veel winds op stuit,\n \nDraaistaarten, als een\
    \ drabblende eend,\n \nHaar trooni, door den wind, beweent,\n485\nGloeit, als van winterroos\
    \ gequelt,\n \nHaar lip barst oopen, en vervelt.\n \nDe Stad geharnast, aan den voet,\n\
     \nMet ysre vleuglen, vlieght te moet,\n \nEn schaaverdynt voor wind voor by\n490\nDe melksters,\
    \ en dien langen ry.\t\n[p. 115]\t\n \nEen schytvalk, in die vreesbre tocht,\n \nGlipt met\
    \ de beenen in de locht,\n \nOp 't achter aansicht, en hy glydt,\n \nZoo ongeblutst, twaalf\
    \ roeden wyd.\n495\n't Gedrangh dus swierend, krom en recht,\n \nEn gins en weer, door een\
    \ gevlecht,\n \nGelykt het, of men schermutseert,\n \nMaar niemand werd met wil gedeert.\n\
     \nWie 't siet! die meint, dit vlugge volk\n500\nZyn schimmen, die een duistre wolk,\n \n\
    Fel voortgewaait, van 't buijend suid,\n \nDoor straalen van de Sonneschuit,\n \nLangs d'aarde\
    \ somtyts scheemelblikt,\n \nDat als een geest den mensch verschrikt.\n505\nDe schaats schoof\
    \ qualik op het ys,\n \nHet wulpsche narpaard werd het wys.\n \nDaar draaft het stoute belgedruis,\n\
     \nMet kleurde pluimen van een Struis,\n \nOp d'ooren, en de styve staart,\n510\nGescherpt\
    \ voor struikelingh bewaart.\n \nHet sleept een waagen sonder rad,\n \nOf wielen, langhs\
    \ 't gestremde nat,\n \nOp staale latten, als een slee,\n \nGespannen, aan een Rusche rhee.\n\
    515\nHet maaksel is een blanke swaan,\n \nMet sachte warme donsen aan.\n \nOf lykt een wreede\
    \ Waaterstier,\n \nBebeitelt uit een populier,\n \nGevoedert van een ruigen Beer,\n520\n\
    Gehardt in Groenlands winterweer.\n \nDaar binnen sit die schoone Maaghd,\n \nWaar meenigh\
    \ saage van gewaaght,\n \nEurope, warm gekleedt, gestooft,\n \nMet handschoen, moffel, maske,\
    \ en 't hoofd\n525\nOmsluijert, die als van een God\t\nEmendatie r. 501: buijend suid <\
    \ buijendsuid\n[p. 116]\t\n \nGevoert werd, in dat basterdvlot,\n \nTer beede van een jongelingh,\n\
     \nDie vryende laaveeren gingh.\n \nDe minnaar sonder mantel, die\n530\nSyn Joffers hals,\
    \ en hand, en knie\n \nVerwarmt, omgordt van een rapier,\n \nHeel lustigh sit, en staat,\
    \ aan 't stier\n \nVan achteren, syn schoensool viert,\n \nOf pint, naa dat de sleede swiert,\n\
    535\nHet ys, met staal door d'eene lat,\n \nEn elke hand, die ment, en vat\n \nHet mondstuk,\
    \ aan langh haairigh touw.\n \nZoo beesich weet hy van geen kou.\n \nDe liefde ontglommen,\
    \ in een borst,\n540\nBrandt teegen d'yselykste vorst.\n \nZoo druischen hondert bellekleên,\n\
     \nOrdentlik draavende, achter een,\n \nMet allerlei gediert van hout,\n \nVol Nimfen. Wat\
    \ er blinkt is goud,\n545\nEn silver, fyne wol, en sy,\n \nDie, in de kuip der verwery,\n\
     \nVerscheide schoone verwen dronk.\n \nDe maaikleur sweemt, op 't ys, te pronk,\n \nDat\
    \ niet te sterk, beswaart, versteurt,\n550\nAl scheurend knort, al knorrend scheurt.\n \n\
    Een Loener huisman blygemoed,\n \nOm al syn welverkochte goed,\n \nDie van de Markt laat\
    \ huiswaarts rydt,\n \nEn schier den leegen waagen splyt,\n555\nVan schokken, langhs het\
    \ hobbligh pad,\n \nDit speulen siende, volght op 't glad,\n \nEn rinkelt, op het waaterveld.\n\
     \nDe schuit van jaalousy gequelt,\n \nOm 't misbruik, op het element\n560\nAlleen haar\
    \ ryden aangewent,\t\n[p. 117]\t\n \nVlieght, seilende op een nieuwe wys,\n \nDe paarden\
    \ naa, op 't dreunende ys,\n \nGedreeven door een sterken aâm,\n \nUit d'oosterlippen, juist\
    \ bequaam.\n565\nHy, die dit merkt, vol vuurs, braveert\n \nHet jacht, hy ryst, hy schreeuwt,\
    \ en smeert\n \nAcht hoeven wakker met de swiep,\n \nAls of men om d'olyfvlecht liep,\n\
     \nVan Herkles dankbaar ingestelt,\n570\nIupyn ter eer in 't Grieksche veld.\n \nOf dat\
    \ Kloanth, met Gias, stree,\n \nEn Mnestheus op een binnenzee,\n \nWie radst den groenen\
    \ eik geplant\n \nOmroeijen zou, en weer aan land,\n575\nOm d'eere van een lauwerkroon,\n\
     \nOp 't oordeel van Anchises soon.\n \nDen binnen Emster langs haar boord,\n \nEn Reguliers,\
    \ en Teunis poort,\n \nIs onderwyl een werld ontvloeit.\n580\nGelyk als 't Suider sout gegroeit,\n\
     \nSyn paalen inbreekt, door den dyk\n \nVan Diemen stroomende, en heel ryk\n \nVan vimmen,\
    \ die plaisierich weidt,\n \nWaar musch, en kievit eijren leit.\n585\nDe meeste hoop neemt\
    \ 't gladde hard,\n \nNoch woelt de sandwegh, wit en swart.\n \nWat kykt, en swiert er al\
    \ een drom,\n \nVan dichte als verre, als voogels om\n \nEen nachtuil, in het Songeblik,\n\
    590\nSpotswyse dwerlen, bol en dik.\n \nMaar sommge kleiner van gemoed,\n \nPisander, en\
    \ die bloode bloed,\n \nDie Plutus hiet by Luciaan,\n \nEn Niesje naast de zy gegaan\n595\n\
    Van Mops, en Thirsis mingenoot,\t\nEmendatie r. 567: Acht hoeven < Achthoeven\n[p. 118]\t\
    \n \nMet honderden, zoo klein, als groot,\n \nIn 't oor verneemende al 't gedruis\n \nVan\
    \ bellen, keelen, windgeruis,\n \nEn buigend kraakend waaterglas,\n600\nDat krik krak opbarst,\
    \ en een plas\n \nVan 't duister en benaauwde nat,\n \nDoet bortlen, uit het lengend gat:\n\
     \nEn siende zoo een snellen vaart\n \nDes kiels, de raaders al genaârt,\n605\nDie vluchten\
    \ onbesuist verbaast,\n \nd'Een hier, en d'ander daar met haast.\n \nd'Een soekt den omval,\
    \ d'ander vindt\n \n't Swarthuis, of waar men, om een pint,\n \nSich warmt, van zielen zoo\
    \ gepropt,\n610\nAls kooren, in een mud geschopt.\n \nZoo spreiden angstich, in de lucht,\n\
     \nOnnoosle Duiven, op de vlucht,\n \nWanneer het gloeijend Haaviks oogh\n \nFel op haar\
    \ aanschiet van om hoogh.\n615\nHet ruim gewelf des Heemels slaat\n \nEen weergalm, van\
    \ zulk wangelaat,\n \nDat luider schalt, dan 't schallend veld\n \nVan saamen slaande kryghsgeweld.\n\
     \nIn al dit swieren rukt de wind\n620\nDe hoeden, zoo van man, als kind,\n \nEn speelt\
    \ er mee, als goeden buit,\n \nEn lacht d'ontdekte kruinen uit.\n \nMeest spotse met een\
    \ jongh gesel,\n \nOm 't hoofd geschoeit, met bokkevel,\n625\nEn noch een ander pronker,\
    \ met\n \nEen haairkuif van een doode slet,\n \nOf galgebrok, die maal op maal\n \nHun hand\
    \ misslaande in 't achterhaal\n \nDer hoeden, sy ook op het laatst\n630\nParruik, en mutsjen\
    \ schierlyk blaast\t\n[p. 119]\t\n \nVan 't hair, en d'afgeschrabde pan,\n \nTer lange guigh\
    \ van alle man.\n \nHier werd de witte, en geele koek\n \nDes seeven ooghmans, met een vloek\n\
    635\nVan die ook op de koekmand viel,\n \nOm veer gesmeeten, met de hiel.\n \nDaar doet\
    \ er een een seeren val,\n \nOp een verlooren kollefbal,\n \nOm welk een jonge, met een\
    \ knecht,\n640\nAan 't grab'len raaken, en gevecht.\n \nVier schaatsen snappen teegen een,\n\
     \nEn stuiten om, d'een breekt syn been,\n \nAl struiklende, onder 't lyf geraakt,\n \n\
    Wyl 's anders schaatse, om 't ander haakt.\n645\nOntrent de wal, waar bomys leit,\n \nWerd\
    \ yslik, help, help, help geschreit,\n \nEen man in 't waater, deesen roep\n \nBaart meerder\
    \ schrik, met maaken sloep\n \nEn waagenaar ruimbaan, daar glydt\n650\nEen Jood uit, dien\
    \ hy ooverrydt.\n \nHier leit de Jesusdooder dood\n \nGeviervoet, met de harssnen bloot,\n\
     \nHy vreesde 't ys van onder, maar\n \nDe dood was booven alzoo naar.\n655\nMen draaght\
    \ hem, in een tappers tent,\n \nVan seil gespannen daar ontrent,\n \nOm hoogh met een Oranje\
    \ vaan,\n \nAls soetelaars, in 't leeger staan.\n \nOf in de beste kaamer van\n660\nDe pannekoek,\
    \ en waafelpan,\n \nOm neeringh daar, terwyl de Stad,\n \nZoo leedich als Armuide sat,\n\
     \nDat in een Libie van sand\n \nVergeeten treurt, meer dan het strand\n665\nVan Middelburgh,\
    \ in koopvaardy,\t\n[p. 120]\t\n \nBerucht geweest langs 't zeegety.\n \nDe Sonne neight\
    \ naa Westerwyk,\n \nDe daagraad kriekt in 't onderryk\n \nDes ronden werrelds, met rood\
    \ licht,\n670\nIn 't naarstigh slaapens sat gesicht.\n \nDe stad vertoont van verre schier\n\
     \nZoo meenich baaken, als er vier\n \nKan rooken, van beneeden, uit\n \nDe daaken, door\
    \ een steenen fluit.\n675\nWie dit gewaar werd, die betracht\n \nMet dat geruchte, voor\
    \ den nacht,\n \nVerkoud, warm, huivrigh, speelens moe,\n \nTe druipen naa syn wooningh\
    \ toe.\n \nZoo d'Oosterblaasbalk morgen dan,\n680\nAl eeven styf, van nu af an,\n \nBleef\
    \ waaijen, met een heldre locht,\n \nVan tintelend gestarnt doorwrocht,\n \nEn zoo 't gestremde\
    \ waaterdek,\n \nVan onder, met een oovertrek,\n685\nVerdubbelt wierd, zoo heeft die dagh\n\
     \nDe Suider zee geen meer ontsach,\n \nAls d'Ooster had, toen Hamburgh vry\n \nDaar oover\
    \ ree op koopvaardy.\n \nDe volle boerslee, aan een paard,\n690\nVerstrekt een vrachtschip,\
    \ langs de vaart.\n \n't Kompas dat komt dan ook te pas,\n \nIndien het geern te Harlingh\
    \ was.\n \nHy die, ontrent den ysbren Pool,\n \nSyn huisingh in een waagen school,\n695\n\
    Dicht gesamaart, met 's beerenhuid,\n \nWaar d'oogen snogger kyken uit,\n \nLaadt, als de\
    \ Don bevrooren is,\n \nDaar op geen meer beswaarenis.\n \nDe waaterstraat werd zoo gemeen,\n\
    700\nVoor alle voeten, als de steen.\t\n[p. 121]\t\n \nDan trekken vaandels, op 't gelui,\n\
     \nEen uur langh 's middaghs van Stadspui,\n \nMet Kapiteinen, sonder trom,\n \nMet byl,\
    \ en haak, op schouder, om\n705\nEen gracht te kappen, in de gracht\n \nVan Amstels veste,\
    \ om niet by nacht,\n \nVan vriend, of onvriend ooverval\n \nTe lyden: want het Sondigh\
    \ Al\n \nIs nu zoo valsch, en hoogh van moed,\n710\nDat niemand sich te wel verhoedt.\n\
     \nDe heele stad deur werd gebyt,\n \nAan elke straathoek, om in tyd\n \nVan sorgelyke buuren\
    \ brand,\n \nTe hebben waater by der hand.\n715\nDe duure ysbreeker, en de byl,\n \nDie\
    \ ys, als hout, en glas, twee myl\n \nNaa Weesop toe, doorkloof, en brak,\n \nAan schorre,\
    \ en gruis, tot brouwgemak,\n \nDie stuiten, wyl het oopen ys,\n720\nVol brokken, weeder\
    \ staapelwys,\n \nDicht toevroor tot een vaste klip,\n \nTe dik en duur voor 't waaterschip,\n\
     \nAl langh jeloers, dat Rotterdam,\n \nLangs ys, haar brouwsels veilen quam,\n725\nDat\
    \ anders vol, ook voordeel heeft,\n \nIn 't reegenwaater ons begeeft.\n \nDat zoo het door\
    \ te fellen vrost\n \nNiet meer ter Vecht vaart, om de kost,\n \nEen giergen Brouwer dan\
    \ wel ys,\n730\nTe soeter van verteerde spys,\n \nOf ingevrooren hond of kat,\n \nRaadt\
    \ voor syn deur, van 't brakke nat,\n \nTe brouwen, uit de burrichwal.\n \nO bier wat heeft\
    \ uw smaak een val!\n735\nWie zulken winter klemmen voelt,\t\n[p. 122]\t\n \nEn lindren\
    \ kan, op leegh gestoelt,\n \nOntrent een disch vol kost, en drank,\n \nMet kluchtjes, speeltjes,\
    \ en gesank,\n \nVoor vlammen van een Vlaamsche vreuchd,\n740\nIs hy geen ys, laat ongeneughd,\n\
     \nEn armoe hem ter harten gaan,\n \nVan armen, die voor deuren staan,\n \nDan beedelvry,\
    \ en die half dood,\n \nHelaas, van allerhande nood,\n745\nGetroffen janken om een kleed,\n\
     \nOm waater, en een roggenbeet.\n \nMaar zoo die snuiver 't warme bed\n \nDes opgangs,\
    \ in het Sonnewed,\n \nBewaart had, en de soele vorst\n750\nVan 't weste, met een dronken\
    \ borst\n \nVan swarte wolken, uit de zee,\n \nAl snuivend', langs den maanboogh glee,\n\
     \nEn slingrend Suid, en Noordelik,\n \nAan 't suisebollen, met een hik,\n755\nAan heevigh\
    \ braaken was geraakt,\n \nOp alles wat den aardboom maakt.\n \nDan sietmen meenigh natte\
    \ voet,\n \nDat 's nachts de buik besuuren moet,\n \nVan die noch fooi, en wat geneught,\n\
    760\nBegeerden van de wintervreuchd.\n \nDan sietmen, by het smeltende ys,\n \nEen kind,\
    \ of moeder, met gekrysch,\n \nBedroeft staan vloeken, met een stok\n \nIn handen, smytende\
    \ op een brok\n765\nOf scholle, grammer, dan op zee,\n \nDie Prins was, die se geess'len\
    \ dee.\n \nDe moeder treurt, om 't lieve kind,\n \nDat sy daar, laas, verdronken vindt.\n\
     \nSy wringht de handen in de lucht.\n770\nSy scheurt het hair vol ongenucht.\t\n[p. 123]\t\
    \n \nHaar boesem sucht zoo heftigh, dat\n \nDe leevens geest het hart vergat,\n \nBevrooren,\
    \ wyl het dooit, tot ys,\n \nOf hardsteen, op Niobes wys.\n775\nHet soontje soekt syn vaaderlief,\n\
     \nDie licht noch uitree, tot gerief\n \nVan Kooplui, met een swaaren bak,\n \nOm groote\
    \ vracht, voor ieder pak,\n \nOf ergens noch uit speelen was,\n780\nGeschooten onder 't\
    \ brosse glas.\n \nDat arme jongske, eilaaci, klaaght,\n \nMyn vaaderlief, och, och, en\
    \ vraaght\n \nAan man, en maaghd, waar vaader bleef.\n \nDaar weent het by de wyde schreef,\n\
    785\nBedrukt vol wanhoops in 't gemoed,\n \nDe drupplen bigglen langs syn voet,\n \nOp 't\
    \ doodende ys, van hem gestraft,\n \nMet traanen, tot een traanend graft.\n \nWie op het\
    \ waater soekt plaisier,\n790\nDie waaght syn leven, als een sier.\n \nWie waater om de\
    \ kost bemint,\n \nLeeft op genaa van weêr en wind.\n \nNiets neemt zoo veel gevallen aan,\n\
     \nAls waater, Proteus onderdaan.\n795\nDoch elk die werd getrokken van\n \nBesondre wellust.\
    \ Aan my kan\n \nNoch sneeuw, noch sorgelyk kristal,\n \nDat in de Son ontdooijen zal,\n\
     \nBehaagen, om te fleddren gaan,\n800\nMeer dan de slord'ge reegenmaan.\n \nIk strek ons\
    \ huis, indien 't gesin\n \nUitkuijert, voor een wacht, daar in.\n \nOf schryf myn boeken\
    \ liever of,\n \nOf neem, om wat verpoosinghs, stof\n805\nVan Drukkers, in verscheiden taal,\t\
    \n[p. 124]\t\n \nOm eerlik tydverdryf, of maal,\n \nZoo ik de geesten voel bereid,\n \n\
    Een rym. O soete soeticheit!\n \nVermoeit my dit zoo vind ik Pook,\n810\nMet praatend ysvolk,\
    \ by den rook\n \nVan warmend veen, en klooster puik,\n \nDat ik veel liever suigh, dan\
    \ ruik.\n \nOf gaa gebeên, of ongebeên,\n \nOns bloed besoeken een voor een,\n815\nUit vriendschap,\
    \ of versoek een vrund,\n \nDie my syn lief geselschap gunt.\n \nMet deesen praat ik aavondwaart,\n\
     \nGenoeglik aan den heeten haard.\n \nHier, Jakob, Jakob, krygh wat hout,\n820\nEn turf,\
    \ sok, sok, 't is wakker koud,\n \nGaa naa uw vaader toe, en segh\n \nZoo 't zyn kan, dat\
    \ het hem syn wegh\n \nGelief te neemen naa ons huis,\n \nNaa hy de sieken trooste in kruis.\n\
    825\nVerseeker hem, dat ik ook krank,\n \nDoch om een praatjen ben, syn gank\n \nZal ik\
    \ betaalen, met saucys,\n \nOf worst van osse, of verkenvleisch,\n \nMet Tubans peeper wel\
    \ gekruidt,\n830\nGekookt, of in de pan gefruit,\n \nWaar by myn tongh de Bolonjees,\n \n\
    Schoon puik, als smaakeloos, verwees.\n \nOp 't welke, uit Heilbrons groen kristal,\n \n\
    d'Anjousche druif wel smaaken zal,\n835\nUit d'allerjongste vloot met wyn\n \nGekipt. Waar\
    \ by uit Limosyn\n \nEen lekkre hoop Kastânjen waar,\n \nIk braad er ook een schootel gaar.\n\
     \nOf lust hem aakers, mals, en wit,\n840\nUit aarde van de Vecht gespit,\t\n[p. 125]\t\n\
     \nDe keetel raakt flux op den haard.\n \nOf lust hem Moskous kaaviaart,\n \nNiet langh\
    \ ontlaaden, uit het hoen,\n \nMet Oli, Peeper, en Limoen,\n845\nWy hebben 't ook. Maar\
    \ zoo misschien\n \nSyn laauwe maagh niet kan versiên\n \nZoo raauwen kost, dat klein gebrek\n\
     \nVerhit Sereetsche drooge sek.\n \nBegeert hy meer, myn heele hert\n850\nVerschaf hem,\
    \ op een taafelberd.\n \n'k Wacht antwoord, spoed u als een man,\n \nSpreek, onder weegen,\
    \ nergens an."
