  dichter: Joannes Six van Chandelier
  datum: najaar 1650
  locatie: Napels, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "Zoals zovele reizigers in zijn tijd maakte ook Six vanuit Rome een uitstapje\
    \ naar Napels en omgeving (Schudt, 1959, p. 149-150; Frank-van Westrienen, 1983, p. 295-298).\
    \ Zijn excursie moet dus in de laatste maanden van 1650, de tijd van zijn verblijf in Rome,\
    \ hebben plaatsgevonden. Hij beklom de Vesuvius, bezocht de Solfatara nabij Pozzuoli (vgl.\
    \ gedicht no. [79]) en reisde ook door naar Cumae, waar hij de grot van de Sibylle bezocht.\
    \ Deze Sibylle van Cumae had Aeneas vergezeld bij zijn tocht door de onderwereld (Aeneis\
    \ vi). In een van de vele bij Cumae liggende grotten meende men de woning van de Sibylle\
    \ te hebben teruggevonden. De grot was daarmee een toeristische trekpleister geworden. Six\
    \ dringt diep in de grot door en heeft daar, in een grotwoning, een ontmoeting met een oud\
    \ wijf, niet de Antieke Sibylle, maar een dochter van de rykdoms God, een geldzuchtig oudje,\
    \ door Six zo beschreven dat de lezer in haar de personificatie van de gierigheit, de hebzucht\
    \ (avaritia), herkent. Six' beschrijving van de oude vrouw vertoont nl. opvallende overeenkomsten\
    \ met elementen in de iconografie van de avaritia, zoals die te vinden zijn in Ripa, 1644,\
    \ p. 168-171: ‘Een oude magere bleecke Vrouwe, in wiens wesen hertzeer en swaermoedigheyt\
    \ uytblinckt, hebbende ter syden eenen mageren Wolf, [...]. Mette geslooten Beursse isse\
    \ gestelt, als meer vermaeck scheppende om dieselve uyt lust te besien, als om die tot nut\
    \ en nodruft te gebruycken. [...] zy wort genaemt Moeder van alle schelmerye, [...]. De\
    \ tange of haecke in de rechter hand is een gereetschap dat altijt nae sich treckt [...].’ Ripa\
    \ licht verder toe: ‘De Gierige [...] sullen veel liever, met een inslockende begeerlijckheyt,\
    \ 't geene zy hebben, laeten bederven, als dat zy 't souden gebruycken, en de behoeftige\
    \ onderstant doen.’ Het bijzondere van Six' beschrijving is, dat men de indruk krijgt dat\
    \ er een werkelijke ontmoeting tussen hem en Vrouw Gierigheit heeft plaatsgevonden. Iwema\
    \ denkt niet aan een werkelijke ontmoeting, naar ik meen op te kunnen maken uit zijn artikel\
    \ (Iwema, 1957). Hij vraagt zich af ‘wat Six ertoe gebracht zou kunnen hebben zijn allegorische\
    \ voorstelling der gierigheid juist in déze omgeving te plaatsen’. Als mogelijkheid noemt\
    \ hij, dat Six een verband heeft willen leggen\t\n[p. 154]\t\n\n tussen de Antieke Sibylle,\
    \ die haar voorspellende kracht zou hebben Gekocht van Pluto, met heur bloed, En offerhande\
    \ van 't gemoed (r. 15-16) en Vrouw Gierigheit, die een dochter van de rykdoms God heet\
    \ (r. 19) en dus een dochter van dezelfde Pluto zou zijn. In de Oudheid had er dus een verband\
    \ tussen Pluto en de grotbewoonster bestaan en dat verband kan Six hebben ingegeven de huidige\
    \ (door hem gefantaseerde) bewoonster in verband te brengen met dezelfde Pluto, nu niet\
    \ langer als god van de onderwereld, maar als rykdoms God. De plaatsing van de gepersonifieerde\
    \ hebzucht in juist deze grot zou dus zijn ingegeven door de dubbele functie van Pluto. Iwema\
    \ is niet heel zeker van bovenstaande verklaring. Hij noemt ook een andere mogelijkheid:\
    \ het kan zijn dat de grot, om welke reden ook, bekend stond als een plaats waar rijkdommen\
    \ verborgen lagen. In de zestiende eeuw was een Spanjaard inderdaad in de grot op zoek geweest\
    \ naar zulke rijkdommen (Iwema, 1957, p. 174). Uit Vergilius' Georgica ii, 165-166 kon zelfs\
    \ blijken dat er goudmijnen op deze plaats waren geweest en men bracht het verhaal van de\
    \ door Aeneas geplukte gouden twijg (vgl. Aeneis vi, 136-148 en 210-211) wel in verband\
    \ met deze mijnen (vgl. Volkman v, 1774, p. 235). Inderdaad kunnen deze verhalen Six op\
    \ de gedachte hebben gebracht zijn Vrouw Gierigheit in juist deze grot te plaatsen. Het\
    \ lijkt mij echter ook mogelijk (Iwema noemt deze mogelijkheid niet), dat Six wel degelijk\
    \ een werkelijke ontmoeting heeft gehad in de grot. Het kan immers zijn, dat de grot bewoond\
    \ of beheerd werd door een oude vrouw, die de reizigers de grot liet bezichtigen. In die\
    \ oude vrouw kan Six (misschien omdat zij de reizigers entreegeld vroeg?) een toonbeeld\
    \ van hebzucht hebben gezien, en die kijk op haar kan hem op het idee hebben gebracht het\
    \ oudje met vele fantastische overdrijvingen te portretteren als Vrouw Gierigheit, daarbij\
    \ gebruik makend van hem bekende iconografische gegevens en verwijzingen naar de mythologie\
    \ van de Sibylle en Pluto. Dit gedicht is afgedrukt op p. 91-101 van Six' bundel."
  tekst: "Het wonderlykste, op reis gesien,\n \nVertellens waardigh, aan de liên,\n \nDie nimmer\
    \ zyn van huis geweest,\n \nDan in de Boeken met den geest,\n5\nWas gierigheits gestaltenis,\n\
     \nEn waar, en hoe haar wooningh is.\n \nTe Bajen, by Avernus lak,\n \nWaar noch een steene\
    \ tempel wrak\n \nBekeeken werd, den God Apol\n10\nEer toegeheilight, duikt een hol,\n \n\
    In heuvlen noordwaards, doodsch, en stil,\n \nDe woonst der Kumasche Sibil.\n \nWaar sy\
    \ voorseggende, als van aart,\n \nVersierde waarheit heeft gebaart,\n15\nGekocht van Pluto,\
    \ met heur bloed,\n \nEn offerhande van 't gemoed.\n \nMaar nu beseeten van een bes,\n \n\
    Een vrekke, en nimmer satte tesch,\n \nEen dochter van de rykdoms God,\n20\nNoch arm, by\
    \ machtigh ooverschot.\n \nDicht rondom, in een dikke locht,\n \nDie 't staande waater ooverbrocht,\n\
     \nZoo schynt het niet dan een woestyn,\n \nVerlaaten van de werld te zyn.\n25\nDe wegh\
    \ daar heen is sonder wegh,\n \nGelyk een doolhof dicht van heg,\n \nVol neetels, distels,\
    \ en narcis,\n \nKles, adiant, en ciparis,\n \nEn noch een kruid van zulke kracht,\n30\n\
    Dat imand listigh voorbedacht\n \nDaar koomende, om vrou gierigheit\n \nTe plundren, eeuwigh\
    \ werd misleit,\n \nVan most natuurlik ooverwrocht,\n \nVol wolven, adders, en gedroght.\n\
    35\nDie heele streek daar nestelt niet\t\n[p. 145]\t\n \nDan kleiner voogelen verdriet.\n\
     \nMen vint het sonder geen gevaar.\n \nDe mond is naauw. Men laat er haair,\n \nEn noppen\
    \ van sijn wolle kleed,\n40\nTerwyl men in, deur braamen, treedt.\n \nEen leidsman, met\
    \ een talkekeers,\n \nDaalt voor, langs trappen recht en dweers,\n \nMet spaaden in den\
    \ bergh gemaakt,\n \nTot hy naa twintigh vaam genaakt\n45\nEen groote duistre gaalery,\n\
     \nVan nachtgespensen nimmer vry.\n \n's Lantaarens helle vlam verflouwt,\n \nVan groover\
    \ stank, dan van rot hout.\n \nDes kykers hart beswykt, indien\n50\nHy in geen wynglas heeft\
    \ gesien.\n \nMen stapt op droogh by aventuur,\n \nTast, als een blinde naa den muur,\n\
     \nDie klei, en keijich is, en sypt.\n \nHoe verder tree, hoe meer het pypt,\n55\nSist,\
    \ querkt, en kryt, van slangh, en muis\n \nMet vlerken, padde, en uil daar t'huis,\n \n\
    In hun afschouwlik aengesicht\n \nVervaart van 't ongewoone licht:\n \nDat, als een baaken,\
    \ veel gesnor\n60\nMoet uitstaan van de swarte tor.\n \nVan booven drupt er op het kleed\n\
     \nSomtyts een bruine druppel sweet.\n \nMen gaat al schuiner, naa om leegh,\n \nEen halve\
    \ myl schier uit de weegh.\n65\nTot dat het gat sich self verraadt,\n \nDoor geld, dat op\
    \ malkander slaat,\n \nEn dat men voelt een smalle gangh,\n \nOntrent een stap, en treede\
    \ langh,\n \nU stuitende, op een houten deur,\n70\nMet een verroesten ringh er veur.\t\n\
    Emendaties r. 60: swarte tor < swartetor \nr. 67: smalle gangh < smallegangh \nr. 69: houten\
    \ deur < houtendeur\n[p. 146]\t\n \nMet dat men ringkelt, weergalmt daar\n \nZoo snaauwschen\
    \ stem, en groot misbaar,\n \nVan schriklik bassen eener hond,\n \nGevloogen op de deur\
    \ terstond,\n75\nDat 't hart schier in de schoenen sinkt.\n \nHet rammelt, klaatert, en\
    \ het klinkt,\n \nVan kas, en koffers, daar men geld\n \nIn haast getelt, en ongetelt,\n\
     \nEn ongemunte stof van goud,\n80\nEn silver schoffelt in, en stouwt.\n \nMet dat er grendels,\
    \ en een boom\n \nDe deur verlaaten traagh, en loom,\n \nEn met de herren knerssen gaan,\n\
     \nSie daar die korte alvinne staan.\n85\nMet heur Molos by 't lappigh oor.\n \nDie boos,\
    \ en booser geen gehoor,\n \nVergunt, swart als een Wolf zoo groot.\n \nSyn ribben leggen\
    \ wel zoo bloot,\n \nIn 't vel, als in een haasewind.\n90\nHy is zoo grof, en ruigh gekint,\n\
     \nAls eendehonden. Syn gebit\n \nIs swynich, waar veel schuims om sit.\n \nTwee koolen,\
    \ als een gloende haard,\n \nStaroogen nimmermeer bedaart.\n95\nHy mist syn start, en is\
    \ soo woed\n \nVan klaauwen, als de leeuwevoet.\n \nEen bufflen ringkraagh scherp gepent\n\
     \nIs om syn smallen hals gewent.\n \nSy grynsbekt, als een weerwolvin,\n100\nHoudt vlammend\
    \ harsigh kennep in\n \nDe linkerhand, die naagels heeft,\n \nZoo langh, als schaaren van\
    \ een kreeft.\n \nHeur puilend valkoogh, anders flaauw,\n \nKykt deur bejaarde brillen gaauw.\n\
    105\nd'Afgryselyke trooni lykt,\t\n[p. 147]\t\n \nVan bleeke rimpelen bedykt,\n \nWaar tuschen\
    \ dat een teerigh spoor,\n \nLangs schraal bevelt gebeent, loopt door.\n \nTwee vaale lippen,\
    \ om den bek,\n110\nOntdoen een bruin vervallen hek.\n \nSy toont een holle keeverkin,\n\
     \nWaar snot, en seevers hangen in.\n \nDeur luisich grysend haair onttuit\n \nKykt, van\
    \ den rugh, een bochel uit.\n115\nWanneer men op heur kleeren let,\n \nHet booven lyf is\
    \ slordigh net,\n \nGelascht van wolven tot een jak.\n \nDe mouwen van een panthers sak.\n\
     \nDe rokwol, van gemengde kleur,\n120\nDaar sietmen bloote billen deur.\n \nDe sleutelriem,\
    \ om 't lyf gehaakt,\n \nZyn haaviksklaauwen saam gemaakt.\n \nTe rechter weeght daar aan\
    \ een tasch\n \nGenaait, van 't stroopsel van een dasch.\n125\nDe schorteldoek is bontsinkleer,\n\
     \nOm stryt met geuren van goor smeer.\n \nDen hals pronkt met een vosse staart,\n \nGekraaght,\
    \ en voor de kou bewaart,\n \nDe toffels draaghtse van geen os,\n130\nMaar van een wree\
    \ rhinoceros.\n \nUw welkomst hanght aan goed bescheed,\n \nDat ghy van haare kinders weet.\n\
     \nHaar kinders heeten Argelist,\n \nBedrieger, Loogen, Meineed, Twist,\n135\nHaat, Moordenaar,\
    \ Nyd, Woekeraar\n \nMuntbootser, Schrooijer, Dobbelaar,\n \nMaatkorter, Tweederhandeschaal,\n\
     \nKymist, en Myner van metaal,\n \nDie sy beslaapen van haar man,\n140\nHaar eigen vaar,\
    \ in droom gewan.\t\n[p. 148]\t\n \nDeese elk, als een getrouwe knecht,\n \nDoor hun kassiers,\
    \ doen weekliks recht,\n \nEn reekeningh van al 't profyt,\n \nMet vlyt, deur al de werld\
    \ bedyt.\n145\nMet nooddruft, en goed handgerek\n \nVan alles, wat se kreegh gebrek,\n \n\
    Zulks dat se niet een enkle reis\n \nOnrustigh laat heur ryk palleis.\n \nZoo deese in voorspoed\
    \ zyn geeert,\n150\nSe laat schier sien wat ghy begeert,\n \nSluit strax den hond schoorvoetend\
    \ vast,\n \nIn keetens, aan de post gelascht,\n \nEn schopt den basser met gehuil,\n \n\
    Al knorrende, in syn heine kuil,\n155\nRondom vol been, dat vreeslik stonk,\n \nVan wat\
    \ hy at, en wat hy dronk.\n \nHaar wooningh waar se waakte, en sliep,\n \nTelt twintigh\
    \ voeten hoogh, en diep.\n \nIndien men sestigh andre meet,\n160\nDat is se langh, ruim\
    \ half soo breed.\n \nDees huisingh waar de lichte Son,\n \nNoch Maan verminderde, of begon,\n\
     \nIn warme soomeroegsten koel,\n \nIn wintersche saisoenen soel,\n165\nGelykt den ingangh\
    \ aarde, en steen,\n \nVan hun geschaapentheit aan een.\n \nMet spaaden, en houweel gedelft,\n\
     \nGevloert, gewandt en schurft gewelft,\n \nBespinracht en van slakkeslym,\n170\nVol streepen,\
    \ wit, als glinstrend rym,\n \nVermuft, besnot, berachebelt,\n \nVan stof en roet zoo toegestelt,\n\
     \nDat neus, en honger walgen moet,\n \nWan aadem tocht die oopen doet.\n175\nHoe leit het\
    \ kot van die harpy\t\n[p. 149]\t\n \nBelemmert aan een ieder sy,\n \nVan kisten uitgeslaagen\
    \ wit,\n \nDat daar, als vingers dik, op sit:\n \nTe nauwer nood blykt daar een gank,\n\
    180\nU leidende aan heur wisselbank,\n \nEn slaapvertrek, en eetschapraai,\n \nTentswyse\
    \ omkleedt van geel karsaai,\n \nMet swarte lysten aan de kant,\n \nHalf rot, aan latten\
    \ van de wand.\n185\nTien leesten van een manneschoen\n \nOm hoogh, daar hanght een paaviljoen,\n\
     \nVan 't welfsel weegende, aan een koord,\n \nVan Krokodils te saam geboordt,\n \nHeel\
    \ kunstigh met den rugh om leegh,\n190\nZoo dat het sweet van booven seegh,\n \nIn d'uitgebreide\
    \ taaije buik,\n \nAls op een dichte reegenluik,\n \nAfwaatrende, in een leere goot,\n \n\
    Die 't kleed bevrydt van waatersnood.\n195\nDes kaamers breedte is zoo bedekt,\n \nSchier\
    \ vyftien voet voor uit gestrekt.\n \nWaar langs sy, aan een ronde roe\n \nVan yser, twee\
    \ gardynen toe,\n \nEn opschuift, van de selve stof,\n200\nAls deuren van het binnenhof.\n\
     \nDit is alleen bekykens waard,\n \nHoewel van luister seer ontaardt.\n \nVoor naast de\
    \ bank, een blauwe serk,\n \nWat hol van daagliks slytrigh werk,\n205\nDaar rust een rosse\
    \ kei gerolt,\n \nIn klei gemetselt, opgevolt\n \nVan oude plunjen, smoddigh vet,\n \nWaar\
    \ sy sich, als op kussens, set.\n \nOp taafel leit het reekenboek,\n210\nDeur vingren, op\
    \ het reeknen, kloek\t\nEmendatie r. 193: leere goot < leeregoot\n[p. 150]\t\n \nNiet half\
    \ volreekent, van heur schat,\n \nIn schuld, en diese reeds besat.\n \nHier neeven heeft\
    \ se schryfpapier,\n \nGemerkt met sperwers, en een mier:\n215\nEen seegel als een griffioen,\n\
     \nIn staal, om brieven toe te doen:\n \nDoorteert harpuis, in plaats van lak:\n \nEen pen\
    \ mes dat haar broer doorstak:\n \nEen hoornige bekladde kom,\n220\nMet gallen, seik, alluin,\
    \ en gom:\n \nSchryfpennen uit een Arends arm:\n \nSand uit Charibdis waaterswarm:\n \n\
    Kryt van het bloedich Britsche strand:\n \nEn sponsen van de selve rand,\n225\nVan mossigh\
    \ steenigh zeegeberght,\n \nGelijk die Kristus heeft geterght.\n \nOok kleeft daar by tot\
    \ ondersoek,\n \nVan geldswaardye, meenigh boek.\n \nNoch kryghtmen toetsteen, goudgewicht,\n\
    230\nBallans, en schrooischaar in 't gesicht.\n \nEen koopere uur, die konstnaars tart,\n\
     \nHoe kon die koop die pry van 't hart?\n \nEn eeuwighduurende almanach,\n \nStaan daar,\
    \ tot reekningh van den dagh.\n235\nEen neegenhondert jaarge lamp\n \nVan pottebakkers geeft\
    \ syn damp,\n \nEn licht, wie weet van wat voor smout,\n \nVerheeven met een draad, aan\
    \ hout,\n \nSchuins door 't behanghsel in de wand.\n240\nSe snuit het lemmet met de hand,\n\
     \nVoor aan vereelt, en kraauwt het weer,\n \nMet naagels, hooger uit het smeer.\n \nAan\
    \ 't opper einde van den disch,\n \nVertoontse waar heur slaapstee is,\n245\nJuist op een\
    \ diepgegraaven hol,\t\n[p. 151]\t\n \nVan 't oudste potgeld, boorde vol.\n \nDe bultsak\
    \ is een ruige beer.\n \nHet hoofd, en d'ooren leggen neer,\n \nOp peulwen van een tigerdier,\n\
    250\nGevult met pluimen van een gier.\n \nHet deksel is een luiparts vacht,\n \nMet soomen\
    \ van een slangh, omwracht,\n \nWelks schoone marmre kleur indien\n \nMen bukkende in de\
    \ hand wilt sien,\n255\nMen plet de weeghluis met die greep,\n \nEn kryght terstond een\
    \ heele sleep,\n \nVan springhsche vlooijen, oover 't lyf,\n \nOp vetter wei, dan op dat\
    \ wyf.\n \nBy 't hoofdenleeger heeft se een laa,\n260\nWaar in se 't vuurslagh houdt te\
    \ raa.\n \nZoo kruiptse met de vodden in,\n \nOntkleedt, noch kleedt, om tydgewin.\n \n\
    Zoo droomtse niet dan bergen geld.\n \nSe schiet verblydt uit slaap, ontstelt,\n265\nEn\
    \ droevigh, met se mist heur hoop.\n \nDan seitse, tyg ik op de loop,\n \nVlughs naa myn\
    \ opgeslooten schat,\n \nEn oopen lustich vat, voor vat,\n \nIn welke morgenspiegels ik\n\
    270\n't Belast gemoed ontlast van schrik.\n \nAan 't gins eindt is een spint geboort,\n\
     \nIn 't deel, dat aan den bergh behoort,\n \nBeschooten met een voose deel,\n \nOpdoende\
    \ door 't tapyt, sijn keel.\n275\nDat laat se, met een teegenlust,\n \nDen graagen reiser\
    \ zyn bewust,\n \nZoo seer niet om 't beschimmelt brood,\n \nAls om het vleisch der ruwe\
    \ dood,\n \nEn berke kitten roode wyn,\n280\nZoo 't maar geen menschedrupplen zyn.\t\nEmendatie\
    \ r. 257: 't lyf < tlyf\n[p. 152]\t\n \nDe schootel, en 't rond stinkrigh berd,\n \nDat\
    \ nimmermeer gewaschen werd,\n \nVerloochenen den naam van hout.\n \nDe kroes, ook 't vat\
    \ met taanigh sout\n285\nVan loot, rondom gekuilt, gebult,\n \nDie blinken eeven braaf besmult.\n\
     \nHet krielt 'er vol van ongenaa.\n \nVan pisbed, oorwurm, myt, en maa,\n \nEn slak en\
    \ mier en kakkerlak.\n290\nWat quellingh, dat er niet gebrak,\n \nDat wysen duisend keutlen\
    \ uit.\n \nMaar hier van werd ik minst gebruit,\n \nZoo vloektse, want myn radde kat,\n\
     \nLeeft op de vangst, is dik en glad.\n295\nTer syden hanght een stokkebeurs,\n \nMet penninghsakjes,\
    \ voor veel keurs,\n \nWaar onder krauwels, schup, en sift,\n \nOp dat se 't geld te rasser\
    \ schift.\n \nHier tuschen spint, en taafelvak,\n300\nStaan weersyds banken van een tak,\n\
     \nMet eesels leer, en haair gevult,\n \nWaar op se heur besoek verguldt.\n \nNu sie myn\
    \ schaamel hof voorts om,\n \nDit ruil ik, voor geen Keiserdom:\n305\nDit zyn de Gooden,\
    \ die ik eer,\n \nOm welke ik 't Heemelsch Hof afsweer,\n \nIndien 'er Heemel is, of Hel,\n\
     \nWaar mee ik mynen geest niet quel:\n \nZoo stoftse met een schampre mond,\n310\nWyst\
    \ met de rechter trots in rond,\n \nOp al het silver, goud, en geld,\n \nZoo dat 't gevoorent\
    \ vel glad swelt.\n \nO bestemoeder, ryke vrouw,\n \nZyn al die koffers geld, ik trouw,\n\
    315\nGeen mensch op aarden is zoo ryk,\t\n[p. 153]\t\n \nNoch in vernoegingh uws gelyk,\n\
     \nDus bad ik: lieve, laat myn oogh,\n \nPlaisieren, in dat ryk vertoogh,\n \nVan zoo veel\
    \ kostelyk metaal,\n320\nOp dat ik t'huis wat vremds verhaal,\n \nEn elken reiser, naa dees\
    \ kust,\n \nVoor al, te reisen, maak belust.\n \nMaar hoe men flikvlooit aan dat oor,\n\
     \nSmidsdochter is, en blyft er voor.\n325\nDit 's 't wonderlykste op reis gesien,\n \n\
    Vertellens waardigh, aan de liên,\n \nDie nimmer zyn van huys geweest,\n \nDan, in de boeken,\
    \ met den geest."
- titel: Aan Abraham Grenier den iongen rechtgeleerden te Middelburgh
  dichter: Joannes Six van Chandelier
  aan: Abraham Grenier (1626-1660)
  datum: '1650'
  locatie: Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0071.php
  beschrijving: Het gedicht is Grenier in 1650 vanuit Italië toegezonden. Six had in Frankrijk
    afscheid van hem genomen en was doorgereisd naar Spanje, maar de reisgenoten hadden afgesproken
    elkaar in Italië weer te treffen (vgl. gedicht no. [53]). Dit sonnet staat op p. 36 van
    Six' Poësy van 1657.
  tekst: 'Aan Abraham Grenier den iongen rechtgeleerden te Middelburgh

     

    Wat soek ik, langhs den Arn, myn reisgesel, gelaaten

    In Vrankryk, met versegh, naa Ital saam te gaan,

    Die, wyl ik Spanje liet, syn reis heeft afgedaan,

    En onverhoopt zoo draa betradt de Zeeuwsche straaten?

    Zoo Thesëus die Griek, in trouw schier booven maaten

    Een voorbeeld, waar ontmoet, met zoo een onvermaan,

    Van syn Perithöus, hy hadde nooit bestaan

    De minste vriendschap, maar hem naamaals moeten haaten.

    Ik ken Grenier nochtans myn vriend, indien hy ''t acht.

    Indien hy ''t niet veracht, zoo zal hy gloove geeven,

    Ik drymaal, op Angiers, hem uit Madril bedacht.

    Men schreef, hy klaaghde neen. Sie wat ik heb geschreeven,

    Twee dichten met een brief, dan niet te recht gebracht.

    Ai antwoord met myn rym, op Oostkapel geweeven.'
- titel: Blyde begroetinge, aan Abraham Grenier den ouden, oover de weederwelvaarentheit van
    synen soone
  dichter: Joannes Six van Chandelier
  aan: Abraham Grenier (1626-1660)
  datum: 1651-1653
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0314.php
  beschrijving: Het gedicht is moeilijk precies te dateren. Op grond van r. 68 en r. 77-80 neem
    ik aan dat het betrekking heeft op de tijd na de promotie van de jonge Grenier in 1649 (vgl.
    ook gedicht no. [52]). Abraham Grenier senior was ouderling in Middelburg in 1629 en overleed
    in 1653 (vgl. gedicht no. [353]). De regels 73-76 kunnen wijzen in de richting van de periode
    na de zgn. Grote Vergadering van de Staten (1651). Het gedicht zou dan dateren uit de periode
    1651-1653. Het staat op p. 392-395 van Six' Poësy.
  tekst: "Blyde begroetinge, aan Abraham Grenier den ouden, oover de weederwelvaarentheit van\
    \ synen soone\n \nWel aan, zoo zyt ghy dan, o! God,\nEn uw besluit, van 't menschlik lot,\n\
    Niet onverbidlik, rolt de daagen\nTe rughwaarts, die al voorwaarts laagen?\nDen Heemel heeft\
    \ u lief, Grenier,\nWyl hy uw haairsneeuw goedertier\nOmhoepelt, met een lentekroone,\n\
    Van uw, uit koorts, herbloeinden soone.\nDer vroomen, neevens uw, gebed,\nDat heeft den\
    \ Heemel wis verset,\nEn hem, alree ter dood beslooten,\nOntrukt des doods verstaalde pooten.\n\
    Zoo deisde 't sonlicht wat op reis,\nMet leevens lenghte op 's Kooninghs eisch:\nZoo heeft\
    \ ook Kristus, van den dooden,\nEen eengen soon weer op ontbooden.\nNiet elk, van talloos\
    \ volk gequetst,\nHeeft dat geluk, in heeten pest.\nOf zou men 't zoo niet noemen derven?\n\
    't Is pests genoegh waar aan wy sterven.\nGods fix bedreeven schietende oogh,\nMet duisend\
    \ pylen, op syn boogh,\nVan scherpen toorn, gaat nimmer jaagen,\nOf mikt hy, 't kosten heele\
    \ laagen.\nHy noemt besonder elken schicht,\nPest, kanker, hartvank, koortse, gicht,\nGraveel,\
    \ steen, teeringh, laaserye,\nGeraaktheit, steekingh in de sye.\nHy schiet er onder, elke\
    \ bout\nRaakt onverscheidlik jongh, en oud.\nDe wyse tuimlen, met de dwaasen,\nDe schaamlen,\
    \ met de ryke baasen.\nEen machtigh leeger blyft mors dood.\nEen deel sterft langhsaam,\
    \ van dat loot.\nHy werpt een deel, in 't kot van suchten,\tOver dit hoofdstuk/artikel\n\
    Om hen verwildert hart te tuchten.\nEen andre hoop behaaght mischien,\nMet hem bevalligh\
    \ aan te sien.\nHy salft, en heilt de sieke wonden.\nHy sendtse, in vryheit, ongebonden.\n\
    Wan hy geen doodelyken schicht,\nUit syn rechtvaarden kooker licht,\nZoo leert hy, oover\
    \ al, uit weiden,\nBarmhertigh, leevend kruid bereiden.\nViel 't aan de geisers niet te\
    \ suur,\nTe snufflen, in het boek Natuur,\nMen zou hier raad voor sieken graaven,\nEn niet\
    \ na verre ryken draaven.\nWat voor een dankbaarlyk gemoed\nZal dan een slaave, op vryen\
    \ voet,\nVan krankheits sterke boei ontslaagen,\nSyn goedertieren Heer niet draagen?\nDe\
    \ wreede Leeuw, een reedloos beest,\nKent hem, die synen poot geneest,\nIn 't bosch, en\
    \ volght getrouw, door steeden,\nGelyk een hondje tam van seeden.\nWat is elk anders dan\
    \ een slaaf,\nOf beest, ten prooije van den raaf,\nOf dooden wurm, op aarde, in d'oogen\n\
    Des Heeren, Heer der Heemelboogen?\nWat is elk dan een waaterbel,\nVol ydlen aâm, in kinderspel?\n\
    Wat zult ghy slaaven, beesten, bellen,\nO menschen, goeds, aan God vergellen?\nWyl dan Gods\
    \ Engel goedertier\nDen slagh weerhiel, van 't slaans rapier,\nOm vaaders eengen soon te\
    \ sloopen,\nVan wien de Zeeuwen veel verhoopen,\nZoo zult ghy, vaader Abraham,\nAlleen niet\
    \ offren, met den ram,\t\nVan uwe lippen, in de doornen\nDes harts, gegreepen, by de hoornen:\n\
    Maar al het seevenlyvigh land,\nWiens zielen, in den Haaghschen band\nVan eendracht, sterk\
    \ zyn saam gebonden,\nZal, naa wat tyds, dien dank verkonden.\nWanneer hy, als een landpilaar,\n\
    Het recht zal schiften oopenbaar,\nVan duistre kromheit, op haar banken,\nUit Justiniaans\
    \ orakelklanken.\nGod seegne uw oogh, met zoo veel vreughds.\nGod gun de Staaten zoo veel\
    \ deughds.\nGod doe dit saad zoo weeligh wassen,\nAls koorensolders graantjes tassen."
- titel: Afscheid uit Rome van R. Anslo. aan den selven
  dichter: Joannes Six van Chandelier
  aan: Reyer Anslo
  datum: december 1650
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991, 82
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0080.php
  beschrijving: In december 1650 verliet Six Rome, waar hij in oktober of november van dat jaar
    was gearriveerd. In Rome was hij opgezocht door de Amsterdamse dichter Reyer Anslo, die
    daar toen reeds een jaar verblijf hield. Op het afscheid schreef Six dit sonnet, dat werd
    gevolgd door een antwoordgedicht van Anslo en een wederantwoord van Six (no. [332] en no.
    [333]). Uit Six' enkele jaren later geschreven brief, aan R. Anslo, te rome (no. [468])
    is op te maken dat Six Anslo bij zijn tweede reis naar Italië, in het najaar van 1651, heeft
    teruggezien. Hij ontmoette hem toen in Venetië en Padua. Dit sonnet staat op p. 41 van Six'
    bundel.
  tekst: 'Afscheid uit Rome van R. Anslo. aan den selven.aant.

     

    Vaar wel, o jonge Prins der Amstelsche Poeëten,

    In ''t juitinghjaar, ik keer, naa offringh van myn dienst,

    Lyk ghy my welkom eerst besocht op ''t onvoorsienst,

    Vaar wel in Rome, op u, als d''oudheit, korts vermeeten.

    Heb Vatikaan in ''t hoofd, door d''oogen, opgegeeten,

    En brengh syn Musen, wyl ''t de purpere Kapoon

    U gunt, wanneer ghe volght, noch zal ons Y een toon

    Te hooger singen, om uw wiegh, in haar, versleeten.

    Voor jaaren merkte ik al een goddelyken swier,

    In ''t kristallyne dicht, als veel getuigen weeten,

    Ik sprak, onse Anslo dinght naa d''uiterste laurier.

    Ghy streekt een silvre schaal voorheen, en goude keeten.

    Vaar wel o jonge Prins, t''huis hoop, door Gods bestier,

    Te rymen, welkom Prins der opperste Poeëten.'
- titel: Schrikspiegel, om niet naa Engeland te reisen
  dichter: Joannes Six van Chandelier
  datum: '1649'
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht dateert vermoedelijk van 1649 (vgl. r. 9). Het geeft de reden voor
    Six' afkeer naar Engeland te reizen; hij vreest represailles voor zijn (als pamflet uitgegeven?)
    gedicht of gedichten op de terechtstelling van Karel i. Vijf jaar later zou hij echter van
    dit standpunt afwijken en een rechtvaardiging dichten van zijn reis naar Engeland in 1654
    (vgl. de Toelichting bij dat gedicht, no. [404]). Dit gedicht staat op p. 296-297 van zijn
    bundel.
  tekst: "Zou ik om droogery na 't Engelsch ryk gaan vaaren,\n \nDat ryk, wel waardigh zulken\
    \ naam,\n \nToen daar alleen de vree moest scheppen haaren aâm,\n \nMaar nu een hel, of\
    \ bosch, vol Duivels, of Barbaaren?\n5\nIk, die myn swarte gal, verbittert heb gespoogen,\n\
     \nLyk gansch Europe was ontstelt,\n \nOp 't bloedigh aanschyn, van die Karel heeft gevelt,\n\
     \nDien goeden Kooningh, om geen Kooningh te gedoogen?\n \nIk, die hier, uit 't palleis,\
    \ sach voeren, om te hangen\n10\nEen drukker van een vel papiers,\n \nDat op de Kooningin\
    \ niet spoogh dan vlammen viers,\n \nZou ik een lasteraar na Engeland verlangen?\n \nEer\
    \ zullen d'aaders van de blanke dorre bergen,\n \nVol krytsteen, groeijen, uit den grond\n\
    15\nDes Teems, en stoppen toe haar handelenden mond,\n \nZoo dat se, aan Amstel zal gebreklik\
    \ alles vergen.\n \nEer zal dat Vloekenhoofd, dat monster Holland naâren,\n \nAls een aansienlyk\
    \ hofgesant,\n \nOm daar door Engelsch volk te raaken aan een kant,\n20\nEn, in 't verduivelt\
    \ ryk, by Dorislaar te vaaren.\n \nDat honderthoofdigh beest zal, van myn kloeke leeden,\n\
     \nSyn helhol, met geen muur, versien.\n \nHet pooge, om meer ontsachs de distels uit te\
    \ wiên,\n \nDie distelpriemen zyn, daar is voor my gebeeden.\n25\nHet storte, indien het\
    \ kan, van Londens Pauwelstooren,\n \nAl 't manlike oor der Britsche staf:\n \nHet plengh\
    \ de Kooningin, op 't kooninglyke graf,\n \nMet haar Princessen, om dien ryksstam voorts\
    \ te smooren:\n \nHet heersch, door kryghsgeweld, met beulen, byl, en stroppen,\n30\nHet\
    \ maak besloote zielen vlugh:\n \nHet delge al wie het schelde, aan poorten, deur, of brugh,\n\
     \nGeen vrekke galghraaf zal sich aan myn oogh verkroppen.\n \nOf kan 't drykruisdrigh Y,\
    \ dat alle werelds vloeden,\n \nIn vieren kruist, en rond beseilt,\n35\nEn daar haar waaren\
    \ haalt, en daar haar waaren veilt,\tOver dit hoofdstuk/artikel\nLANDEN\nGroot-Brittannië\
    \ (en Noord-Ierland)\n\n[p. 394]\t\n \nEen kleinen handelaar, met handelingh, niet voeden?\n\
     \nZoo blyf nochtans de Teems, in eeuwigheit, vergeeten:\n \nEn d'arme onnoosele arremoe\n\
     \nLei my gerust, met eer, na d'asch myns vaaders toe.\n40\nO Amstel dek myn lyk, wanneer\
    \ ik ben versleeten."
- titel: Brief, aan Joannes Hoornbeek, te Uitrecht
  dichter: Joannes Six van Chandelier
  aan: Joannes Hoornbeek (1617-1666)
  datum: '1649'
  locatie: Bayonne, Frankrijk
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: De brief is Hoornbeek in 1649 vanuit Bayonne gestuurd. Six noemt de bekende
    Utrechtse hoogleraar in de godgeleerdheid (1617-1666) zijn ‘Neef’. Ik heb de precieze familierelatie
    echter niet kunnen reconstrueren. Hoornbeeks moeder was een Haarlemse en heette Jacqueline
    Baert (De Bie en Loosjes iv, 1931, p. 277) en Six heeft zijn gedicht fooi met inleidende
    brief (no. [211] en [212]) opgedragen aan de Haarlemmer Hans Baard, die mogelijk een familielid
    van Jacqueline is geweest en door Six ook ‘Neef’ wordt genoemd. Zie voor Hoornbeek ook het
    Register van namen. Dit gedicht staat op p. 298-299 van Six' Poësy.
  tekst: "Parys, schier elken dagh, een werld van nieuwigheeden,\n \nSondt, Neef, myn eersten\
    \ brief, in rymeloose reeden,\n \nVan oproer daar. Nu zal het Fransch Bajoon verhaalen,\n\
     \nOp rym, hoe vreemd, op reis, myn Psalmboek quam te dwaalen.\n5\nTerwyl myn loome ruin\
    \ Britanje gingh ontwyken,\n \nEn Nantes, naa myn rugh, Rochelwaarts om liet kyken,\n \n\
    Droegh ik, in elke tasch, van twee gelaân pistoolen,\n \nHier Davids gulden harp, daar Flakkus\
    \ lier verhoolen.\n \nNu om myn ziel, met sangh, ten Heemel, uit te storten,\n10\nEn, met\
    \ een heilge vreuchd, de lange wegh te korten:\n \nDan om het eensaem vleisch ook somwyl\
    \ te vermaaken,\n \nIn styl van poesy, en werreldwyse saaken.\n \nGelyk een reisiger, die\
    \ anders, met gesellen,\n \nDen wegh onmoeilyk maakt, door veelerlei vertellen.\n15\nTerwyl\
    \ een diep gepeins my eens had wegh genoomen,\n \nDat d'eensaame achtervolght, en ik begost\
    \ te koomen,\n \nTot eerste aandachtigheit, zoo hoorde ik, in de straalen\n \nDes Sons,\
    \ die toen bly loech, in nooteryke daalen,\n \nEen lieve melody, van voogelkeeltjes klinken,\n\
    20\nDat dee myn lochte geest, als in myn oor verdrinken.\n \nDat kittelde myn ziel, en stookte\
    \ zulken yver,\n \nDat ik een orgellied, uit dien godsaalgen schryver,\n \nWou mengen, met\
    \ den toon, van streelend quinkeleeren:\n \nVoorts greep ik naa myn boek, maar miste mijn\
    \ begeeren.\n25\nDe rechter zy was leegh, de slinker zyde als vooren.\n \nSie 't werreldsch\
    \ hingh my aan, maar 't Heemelsch was verlooren.\n \nEen waare schildery, van 't menschelyke\
    \ leeven,\n \nInsonderheit van my, o God, wil 't my vergeeven.\n \nHy die een duur juweel\
    \ slinks, aan de pink, gedraagen,\n30\nUit erfnis, miste, in gras, stond niet zoo seer verslaagen.\n\
     \nMyn draalende ooverlegh, wou 't onheil oopenbaaren,\n \nWanneer, en waar, en hoe de sanger\
    \ was vervaaren.\n \nIk wist noch uur, noch plaats waarschynelyk te gissen,\n \nOf had,\
    \ schoon in Poitou, hem licht niet moeten missen.\n35\nIk hadde niet gedooght het heilige\
    \ van honden,\t\n[p. 396]\t\n \nOf afgodisten vuil, en doemlik wierd verslonden.\n \nMaar\
    \ als ik ooverwoegh de wyse te beklaagen,\n \nDie was de swaare draf, of wegh vol valsche\
    \ slaagen.\n \nOm dat myn viergevoet geen stappen konde stappen,\n40\nEn 't daar heel rotsigh\
    \ was, vol halfgekuilde trappen.\n \nGelyk 't wynachte Anjou, waar dat de straaten klinken,\n\
     \nHol van de leigrond, rechts om paarden te verminken.\n \nO neen, myn boesem swol van\
    \ droeviger gedachten:\n \nDaar waaren andre reên, die my van David brachten.\n45\nO man\
    \ na 's Heemels hart, vertrooster in het treuren,\n \nDankleeraar vol gebeen, na 's Vaaders\
    \ saalge deuren,\n \nDaar was een wie, of wat, dat my socht af te leiden,\n \nWanneer het\
    \ ydel hart sich wou, tot God, bereiden.\n \nSaad kooren goed van aard, ook in een geestlike\
    \ akker,\n50\nd'Onsichtbre Onkruidenier is ook, tot saaden, wakker.\n \nWerpt hy, de loose\
    \ droes, geen lokaas om te vinden,\n \nGelyk een hangelaar, visch, die hy mach verslinden?\n\
     \nHy pooght, op bitter soet, d'onnooselen te nooden.\n \nHy schaft oneetbre steen, voor\
    \ smaakelyke brooden.\n55\nMyn vaste Flakkus riep my, om syn disch te smaaken,\n \nVol ydelheits\
    \ geschaft, om Davids niet te naaken.\n \nGeleerde Hoorenbeek, o Priester van Apollo,\n\
     \nDe Kriste Orakelgod, te Sion, waar geen hol zoo\n \nTweesins 't gevraaghde duidt, als\
    \ Delos, siet, ik vraage,\n60\nAan Uitrechts Priesterschap, of daar geen helsche laage\n\
     \nVerborgen lagh, in schyn van roosen, onder dooren?\n \nMyn willge pen kan u geen ander\
    \ nieuws doen hooren.\n \nWanneer se weer papier, met letters, zal bevryven,\n \nDan zal\
    \ se Kerkelyk, en aangenaamer schryven."
- titel: Nahuiswensch
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht is tot stand gekomen tijdens Six' reis door Spanje in 1649 (vgl.
    r. 51). Het staat op p. 300-302 van Six' Poësy. Dr. H. de Vries wees mij erop, dat Six in
    de eerste vijftien regels van dit gedicht het begin van Canción v van Garcilaso de la Vega
    (± 1501-1536) blijkt na te volgen (vgl. Garcilaso de la Vega, 1980, p. 47-51 en vgl. ook
    de Toelichting bij gedicht no. [51]).
  tekst: "Indien myn kleine lier,\n \nZoo doof, niet was van snaaren,\n \nMaar datse, door een\
    \ Heemelsch vier,\n \nKon temmen wilde baaren,\n5\nVan felle wind, aan brand:\n \nEn dat\
    \ se kon versetten\n \nDe bergen, uit hun vasten stand,\n \nWaar reusen onder pletten:\n\
     \nEn datse hecht geboomt,\n10\nEn wyde woeste dieren\n \nKon naa my trekken, als getoomt,\n\
     \nUit boschen, en rivieren:\n \nSe speelde van geen krygh,\n \nWaar braave helden smooren,\n\
    15\nVan eedel bloed, en stof ontygh,\n \nHen zoo van 't lot beschooren.\n \nSe speelde van\
    \ geen Vrank,\n \nDie, door syn oorloghsswaarden,\n \nDe werreld soekt, in syn bedwank,\n\
    15\nGelyk een God op aarden.\n \nMen hoorde ook datse sweegh\n \nDen vreede van Oranje,\n\
     \nDie hy zoo loflik eeuwigh kreegh,\n \nOp 't punt geparst, van Spanje.\n25\nSe zou myn\
    \ Vaaderland,\n \nDat, door haar wyse mannen,\n \nDe wetten stelt, voor meenigh strand\n\
     \nDer machtighste Tirannen,\n \nSelf laaten ongelooft,\n30\nMet 't Y, dat trots haar hoorens,\n\
     \nOp 't Keiserlyke waapenhoofd,\n \nSteekt, in de locht, met toorens.\n \nAl op een krachtger\
    \ maat\n \nZou ik heur snaaren klinken.\n35\nDe zee moest luisteren besaadt,\t\n[p. 398]\t\
    \n \nEn al het swellen slinken.\n \nWat langs den Heemel sweeft,\n \nWat, in bedekte mynen,\n\
     \nKan stormen, dat het aardryk beeft,\n40\nMoest daadelyk verschynen.\n \nWat in de groenten\
    \ eet,\n \nWat in de diepe stroomen,\n \nSyn kuuwen waatert, moest gereed,\n \nEn vaardigh,\
    \ tot my, koomen.\n45\nWaar 't alles, tot myn dienst,\n \nVerlokt door lieflik singen,\n\
     \nDan wou ik snel, op 't onversienst,\n \nMet 't snelste, eens Ywaarts springen.\n \nDie\
    \ breede soute plas,\n50\nEn aarde wyde streeken,\n \nSchoon ik nu in Kastilje was,\n \n\
    Maar eenen sprongh geleeken.\n \nWat zou er sneller zyn,\n \nDan vleugelen van winden?\n\
    55\nWat is 't, o schimmen, my een pyn,\n \n't Y zoo niet eens te vinden?\n \nOch! dat ik\
    \ eens, op 't rad,\n \nMocht klimmen, vlugh van draaken,\n \nWaar op die groote saaijer\
    \ sat,\n60\nOm saad gemein te maaken.\n \nOch! dat ik eens den toom\n \nVan vrouw Mede mocht\
    \ mennen:\n \nOf, Perseus, langs den Heemelsoom,\n \nMocht vliegen, op uw pennen.\n65\n\
    Ach! dat ik nu niet mach\n \nMyn lieve vrunden groeten,\n \nEn vroolik, voor een enklen\
    \ dagh,\n \nMet saamenspraak, ontmoeten.\n \nDies zal ik, slechte lier,\n70\nVoor sulke\
    \ plompe snaaren,\t\n[p. 399]\t\n \nU geeven, om, door gulsigh vier,\n \nDen schoorsteen\
    \ uit te vaaren.\n \nMyn speelenssieke geest\n \nZult ghy niet meer, met klinken,\n75\n\
    Vermoeijen, gaat ghe hebt geweest,\n \nGaat, in den haard, versinken."
- titel: Onweer, op de grensen van Spanjen
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "In dit gedicht vergelijkt Six het hevige onweer tijdens zijn nachtelijke tocht\
    \ over de grens tussen Frankrijk en Spanje (1649) met dat bij de begrafenis van Gaspar de\
    \ Guzmán, graaf van Olivares (1587-1645). Olivares was van 1621 tot 1643 Spanjes eerste\
    \ minister. Het debâcle van de Spaanse politiek in die jaren werd hem persoonlijk aangerekend.\
    \ Hij werd in 1643 van zijn taak ontheven en verbannen naar het plaatsje Loeches buiten\
    \ Madrid en vervolgens naar het verder weg gelegen Toro, waar hij in 1645 overleed. De reis\
    \ van zijn dode lichaam van Toro terug naar het familiebezit Loeches, waar het is begraven,\
    \ voerde langs Madrid en juist toen, in augustus 1645, woedde er een hevig onweer boven\
    \ de stad (Marañón, 1939, met name p. 392 en vgl. ook Elliott, 1986, p. 670-671).\n \tUit\
    \ een aantal details (bijvoorbeeld r. 81-84) blijkt dat Six goed op de hoogte was van wat\
    \ zich vier jaar voor zijn komst in en bij Madrid had afgespeeld. Het is mij echter niet\
    \ gelukt vast te stellen welke informatie hij benut kan hebben. Het gedicht is afgedrukt\
    \ op p. 302-307 van Six' Poësy."
  tekst: "Naauw swaarder onweer kon ontstaan,\n \nToen 't deerlik lyk van Olivares,\n \nIn Spaansch\
    \ verdoemt, voor by zou gaan\n \n't Gekroonde dorp, aan Mansannares:\n5\nDan als ik sint\
    \ de Lus verliet,\n \nEn naa Sebastiaan gingh wyken,\n \nWaar d'arreme Iron tuschen schiet,\n\
     \nEn scheidt twee vyandlyke ryken.\n \nDie Graaf rampsaaligh, om den val,\n10\nVan 't stout\
    \ meineedigh Barceloone,\n \nGevolght, van 't trouwloos Portugal,\n \nTwee parlen der Kastilsche\
    \ kroone,\n \nIn Torros, van syn engen geest,\n \nMeelydigh, door de dood, ontbannen,\n\
    15\nQuam grafwaarts, in syn jonghste feest,\n \nNa 't dorp Lüetsjos, ingespannen.\n \nDe\
    \ Son had deesen dagh den oost\n \nSyn goud, en purper aangestreeken,\n \nEn liet vermoeit\
    \ de locht gebloost,\n20\nVan straalen, die allengsjes weeken.\n \nGestarnte had wat lichts\
    \ gevat,\n \nGelyk een waskaars, eerst aan 't glimmen,\n \nOm waar Madril, in duister, tradt,\n\
     \nTe lichten van de Heemelkimmen.\n25\nZoo als de doodkist meer, en meer,\n \nDe moede\
    \ bergen afgedreeven,\n \nHaar bange lucht, na 't hof, van veer,\n \nToeaassemde, door naauwe\
    \ schreeven.\n \nHet hoogh gewelfsel wierd besmet.\n30\nVrouw Juno, die 't jeloes vermoedde,\n\
     \nEn noch den haat niet had verset,\n \nWaar mee sy, op syn leeven, woedde,\n \nOntstak\
    \ de vlam ook in Jupyn:\n \nEn swoer, by alle d'elementen,\n35\nDat sy langs d'aarde haar\
    \ fenyn,\tOver dit hoofdstuk/artikel\nLANDEN\nSpanje\n\n[p. 401]\t\n \nEn om, en op dit\
    \ krengh, zou prenten.\n \nSe toogh den Heemel stil, en klaar,\n \nFlughs in een sak van\
    \ swarte wolken,\n \nGeswangert, om een misgebaar\n40\nTe lossen, op die hoofsche volken.\n\
     \nO! wat een Heemel moest het syn?\n \nDe mensch gemaakt, om haar t'aanschouwen,\n \nSach\
    \ niet dan helle, sonder schyn,\n \nEn kreegh een koortse met verkouwen.\n45\nElk liet de\
    \ straat, elk socht het huis.\n \nDe poorten, deuren, vensters slooten,\n \nMet zulk gebons,\
    \ geklets, gedruis,\n \nAls geen gelyknis kan vergrooten.\n \nDe harder, daar ontrent te\
    \ veld,\n50\nIn 't strooijen hutjen, moe gedooken,\n \nNaa 't vee ombaaliet was getelt,\n\
     \nHad d'oogescheelen pas gelooken.\n \nDe beestjes die ook onweer sien,\n \nVan dit benaauwder,\
    \ blaetten naarlik.\n55\nDe wachters quaamen, aan syn knien,\n \nBangh snuifflen, jankende\
    \ vervaarlik.\n \nDe schaamle bloed schoot uit syn kooi,\n \nBedwelmt, in zoo een duisternisse,\n\
     \nDaar 't eeven scheen zoo klaar, zoo mooi,\n60\nHy suchte vol bekommernisse.\n \nHy docht\
    \ nu om geen wolven meer,\n \nMaar waar hy met zyn vee zou vaaren.\n \nOch! klaaghde hy,\
    \ och! lieven Heer,\n \nWat zal den Heemel seldsaams baaren?\n65\nMet stoof een dolle storm\
    \ voor uit\n \nGehitst, ontkeetent uit syn kuilen,\n \nEn loeide zoo een naar geluit,\n\
     \nVry meer dan 's nachts de wolven huilen.\n \nDe ronde Heemel vloogh in vier,\n70\nVan\
    \ rotsen, die de wolkvooghd rolde,\t\n[p. 402]\t\n \nGeklonken, met zoo dom getier,\n \n\
    Of Heemel, teegen Heemel, bolde.\n \nDe slachvonk viel van booven neer,\n \nMet zoo een\
    \ drift van donderslaagen,\n75\nDat meenigh huisraad dreunde om veer,\n \nEn veele zielen\
    \ trillend saagen.\n \nDe kostelyke sint Martyn\n \nMoest, van die vinnge roe, getuigen,\n\
     \nDaar syn, na hem genoemden, wyn,\n80\nOp straat liep, uit geborste duigen.\n \nOok zy\
    \ des Keisers afgesant\n \nGetuige, wien de blixemstraalen\n \nSyn toorentjen, in klaaren\
    \ brand,\n \nOntsteeken, deeden 't hoofd afhaalen.\n85\nDe locht, uit een gepropt gemoed,\n\
     \nVan leed, borst schrikkelyk, aan 't weenen,\n \nEen ieder droppel was een hoed,\n \n\
    Vol waaters, kletsende op de steenen.\n \nDe schuine straatwegh van Retier,\n90\nEn Alkalaas\
    \ fontein verdronken,\n \nIn een afbruisende rivier,\n \nEen elle hooger dan de schonken,\n\
     \nToen vloekte meenigh, uit een mond,\n \nHier koomen al de Duivels saamen\n95\nAanspooken,\
    \ van dien dooden hond,\n \nOm ons noch, naa syn dood, te praamen.\n \nHy kom maar riep,\
    \ ontrent de poort\n \nVan leem, een hoop met eed verbonden,\n \nHier binnen door, hy zal\
    \ strax voort\n100\nEen lekkre huspot zyn der honden.\n \nWanneer ik, op een duistre nacht,\n\
     \nDe grensen inree van Hispanjen\n \nLangs vochtige aard, als klei, zoo sacht,\n \nDoor\
    \ scherpe takken van kastanjen,\n105\n't Is waar, de blaasbalk van de wind\t\n[p. 403]\t\
    \n \nScheen hingh te pronk, in Eols muuren,\n \nAls of hy stil, en wel gesint,\n \nGeen\
    \ ongestuimigh weer wou stuuren:\n \nMaar 't was op dat de donderaar\n110\nSyn rol te ruimer\
    \ zoude speelen,\n \nMet reegengolven, en misbaar,\n \nVan donderende vuurkareelen.\n \n\
    Myn luistrende ooren leeken doof,\n \nZoo sweegen d'ooverboomde spooren,\n115\nBehalven\
    \ als de muil my 't loof\n \nDee raaken, en syn hoeven hooren.\n \nGeen nachtraaf, bosch,\
    \ noch akkermuis,\n \nNoch huiben, roerde gras, of ipen,\n \nGeen vleermuis, noch alzulk\
    \ gespuis\n120\nBestond te quettren of te piepen.\n \nIk sach geen bernmaai, en de locht\n\
     \nSloot dichter, dan een dieflantaaren.\n \nMyn siende halleve eesel socht,\n \nEn wist,\
    \ met my, den wegh te vaaren.\n125\nMet schimde een oogenbliksche dagh,\n \nVan blixem reis,\
    \ op reis, van booven,\n \nSulks ik een klaaren Heemel sach,\n \nDan weer een hel, of dooven\
    \ ooven.\n \nDat schierlyk scheemerende vuur,\n130\nZoo snel verkeert, in duisternissen,\n\
     \nMisleidde 't paart eens op een muur,\n \nEn dee de rechte straaten missen.\n \nVoorts\
    \ sloegh de donder in myn oor,\n \nDie 't welfsel, voor den blixem, braakte,\n135\nDe dreuningh\
    \ roerde 't vaste spoor,\n \nHet bosch, met al syn houten, kraakte.\n \nToen scheurde een\
    \ wolk, een Oceaan\n \nVan waater stortende plots needer,\n \nAls of de werreld zou vergaan,\n\
    140\nIn Noachs reegenachtigh weeder.\t\n[p. 404]\t\n \nIk loof de werreld had versmoort,\n\
     \nTe boos, in Gods verlenghden tooren,\n \nHad 't buigeloos gebooghde woord\n \nGod niet\
    \ gelicht, in 't licht geswooren.\n145\nMaar d'ondergangh was niet ontrent,\n \nDe vlam\
    \ had anders 't Rond ontsteeken:\n \nWant vuur, en waatrigh element,\n \nOm stryd, malkander\
    \ naauwliks weeken.\n \nMet elke helblik storte een zee,\n150\nDoorklooven van een feller\
    \ donder.\n \nStierf toen geen onbeslooten vee,\n \nVan vuur, of waater, 't was groot wonder.\n\
     \nHet scheen of 's daaghs de heete son,\n \nMet oosen, 't diep had opgesoogen,\n155\nVergaadert\
    \ in een wolkenton,\n \nDat lastigh 's nachts wierd neergespoogen.\n \nKon 't keerende onrust\
    \ van de klok\n \nWel seeven keeren tikketakken?\n \nEer voelde ik door myn py, en rok,\n\
    160\nJa hemde, 't waater huivrigh sakken.\n \nHet muilpaard sopte meer, en meer,\n \nIn\
    \ 't lymen, van de vloênde weegen,\n \nNu stapte hy, dan swom hy weer,\n \nMet my, en ik,\
    \ met hem, verleegen.\n165\nIk suchte, en suchte meenigh reis,\n \nOch! goedertieren Albeschikker.\n\
     \nDan morde myn verdrietigh vleisch,\n \nHier woedt Jobs uitgelaaten Ikker.\n \nOch! dacht\
    \ ik, die nooit Spanje sach,\n170\nMaar t'huis sat, in syn aavond kaamer,\n \nMet lekkre\
    \ boeken, als hy plach,\n \nBy 't bed, wat waar 't my aangenaamer?\n \nDe makkelyke slaapens\
    \ tyd,\n \nZoo ongemakkelyk verloopen,\n175\nHad my voor swaarer quaad bevrydt,\t\n[p. 405]\t\
    \n \nVan Fontarabers, die daar stroopen.\n \nDus weet het preutelend gemoed\n \nZoo schaars,\
    \ wat baaten kan, of hinderen.\n \nBeveel u God, die alles doet,\n180\nEn schikt ten beste\
    \ van syn kinderen."
- titel: Beedelmusyk, te Tholouse
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Toulouse, Frankrijk
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six' verblijf in Toulouse is te plaatsen in 1649, het jaar van zijn reis door
    Frankrijk naar Spanje. Dit gedicht is door Minderaa besproken in een interpreterend artikel
    (Minderaa, 1964; vgl. ook Van Es, 1953, p. 168 en Michels, 1964, p. 193-194). Het staat
    op p. 308-309 van Six' Poësy.
  tekst: 'Wat vroege morgenhaanen

     

    Doorkraaijen myn poortaal, en luije leedekant,

     

    Om my den daageraad onnoodigh te vermaanen?

     

    Hoe? nam de Son dan reeds syn breidels, in de hand?

    5

    O Neen, myn ooren droomen,

     

    Dit lykt geen haanekeel, maar eer een harmony

     

    Van snaaren. Hoe zou hier gespeel van snaaren koomen?

     

    Myn slaapen viel te kort, ''t is noch geen daghgety.

     

    Zoo zyn myn ooren dronken

    10

    Van slaap. Nochtans ik waak, en praat, en hoor geveel.

     

    Wegh donkere gardyn. Sie daar de sonne pronken,

     

    In glas, van ''s buurmans huis, aan ''t opperste kanteel.

     

    Waar seegh ik op dees pluimen?

     

    Was ''t in Tholouse niet, de tweede steedekroon,

    15

    Van Vrankryks grootste steên? placht ik hier niet te sluimen,

     

    In dit vertrek, zoo vroegh geen violons gewoon?

     

    Men leest in wyse boeken,

     

    Van diepe droomers, die, als wakker, ''t duistre bed

     

    Verlieten, praatende, en doorsnufflende alle hoeken.

    20

    Noch twyffel ik myn brein van droomen is beset.

     

    Hoor daar, hoor daar de snaaren

     

    Verheffen streek, op streek, veel luider haaren trant,

     

    Als of se dieper in myn ooren, wilden vaaren,

     

    Om my te lokken, van de warme leedekant.

    25

    Nu sie ik wel ''t zyn Fransjes,

     

    Landloopers, beedelaars, gelyk se te Parys,

     

    Aan taafel, viddelen: dees, met hun lichte dansjes,

     

    Om Gods wil bidden, ik zoo biddende verrys.

     

    Op luijaard, soek Lowysen,

    30

    Van Sweeds metaal, of soek wat stuivers, met een merk:

     

    Gaat, als aalmoessenier, die bloedjes elders wysen.

     

    Wie ''s morgens armen troost, begint, met heiligh werk.'
- titel: Uitroep om hoornafsetters
  dichter: Joannes Six van Chandelier
  datum: '1649'
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: 'Het gedicht heeft betrekking op Six'' verblijf in Madrid in 1649. De door hem
    bespeurde ontuchtigheid van de Spanjaarden geeft hem in een sarcastisch verband aan te brengen
    tussen de Spaanse ‘hoorndragers’ en zijn eigen beroepsmatige belangstelling: hij vat hun
    hoorns op als een te verhandelen produkt. Het gedicht staat op p. 313-315 van zijn bundel
    van 1657.'
  tekst: "Wie dat leergierigh, met vyf sinnen, reist, door steeden,\n \nOf, als een koopman,\
    \ soekt profyt,\n \nDie oeffent sich, in deuchd, in taalen, en in seeden,\n \nOf wint licht\
    \ syn wingraagen tyd.\n5\nIk blyf my selven meest een swaare boete schuldigh,\n \nOm achtloosheit,\
    \ op 't eerste, en 't best:\n \nMaar op myn handelingh beken ik sorrighvuldigh\n \nGeweest\
    \ te zyn, in elk gewest.\n \nIk sach nu hier, dan daar, een plaatse, om wat te winnen,\n\
    10\nIn myn beroep van droogery:\n \n't Zy ik, met meerder geld, of minder, wou beginnen,\n\
     \nNa dat de waar was, en 't gety.\n \nTot dat ik, in Madrid, ook schoenen had versleeten,\n\
     \nIn dat ontyge vuilnisgat,\n15\nDat, volgens haar natuur, hoovaardigh derft vermeeten,\n\
     \nDe Loevre naauwer plek besat.\n \nHier quam een koppelaar, of maaklaar, tot my loopen,\n\
     \nWie arrigh denkt, vaar argh, in 't hart,\n \nOpveilende vast goed, om niet met al, te\
    \ koopen,\n20\nJa bood noch penningen te bard.\n \nIk vraaghde, vriend, wat is 't? syn antwoord\
    \ was, 't syn hoorens,\n \nMadrils uitsteekenste cieraad:\n \nWant op haar kerken staan,\
    \ gelyk men siet, geen toorens,\n \nOm dat de man getoorent gaat.\n25\nHet quelt hem langer\
    \ een doorboorden hoed te toonen.\n \nHebt ghy tot deese raad, en sin?\n \nMen zal, voor\
    \ elken tak, u hondert goude kroonen\n \nBetaalen, als een vast gewin.\n \nIk wingraagh\
    \ seide, ik daar aandachtigh op zou letten,\n30\nAls zynde koopwaar, die my past,\n \nOm\
    \ onse winkelton geleeght weer voor te setten,\n \nDie juist op myn versorgen vast:\n \n\
    't Zy 't blanke hoornen zyn, als van de Rusche harten,\n \nOf van een Libische Olifant,\n\
    35\nDie 't vinnighste fenyn, als teegenstrydigh tarten:\t\n[p. 415]\t\n \n't Zy datse rauw\
    \ zyn, of gebrandt.\n \n't Zy swarte hoorenen, als van Rhinocerooten,\n \nOok kostlik om\
    \ hun teegengift.\n \n't Zy van een eenhoorn, die zoo fraai verguldt komt stooten,\n40\n\
    Voor uit, om hoogh, aan ons gestift.\n \nMaar om die monsters, van dat ooverwight, t'ontlaaden,\n\
     \nHeb ik geen oeffningh, noch verstand:\n \nDies soek ik iemand, die my konstigh weet te\
    \ raaden,\n \nEn hulp te bieden met syn hand.\n45\nHoor, Amsterdammers, hoor, hoor weetende\
    \ doktooren,\n \nHoor meesters in de sirurgy,\n \nKomt u iets, uit Pare, of uit Galeen te\
    \ vooren,\n \nGedienstigh tot die artseny:\n \nHoor, quakkesalvers, hoor, hebt ghy een sprookje\
    \ onthouwen,\n50\nOf daar, of elders van een bes,\n \nDie 't by de spinrok vondt, probatum,\
    \ by de vrouwen,\n \nAi oopenbaar die goude les.\n \nWie 't beste pleistren kan, om hoornen\
    \ af te heelen,\n \nZal al 't profijt, met my, van al de hoornen deelen."
- titel: Vraage, van een Spanjaard, aan den Turkschen ambassadeur, en syne antwoorde
  dichter: Joannes Six van Chandelier
  datum: november 1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: De in dit gedicht behandelde vraage is gesteld naar aanleiding van de Blijde
    Inkomste van de nieuwe Spaanse koningin in Madrid, op 15 november 1649. Six was toen in
    Madrid. Het gedicht staat op p. 315-317 van zijn bundel van 1657.
  tekst: "Dat eigen kittlende gemoed\n \nGebooren, in Kastiljes bloed,\n \nDat nooit een tweeden\
    \ lyden kon,\n \nGelyk den Heemel maar een Son,\n5\nOpborrelde, uit een Kastiljaan,\n \n\
    Een trotse vraage te bestaan,\n \nAan 't ambassaatschap van den Thraak,\n \nIn Spanje, een\
    \ schaars gehoorde saak.\n \nHy vroeg den steegen Mametist\n10\nNa Rome seit, den Antikrist,\n\
     \nNa 't sien van ongesiene pracht,\n \nWat dat hem van hun kroone dacht.\n \nHy sach hoe\
    \ Oostenryks Princin,\n \nDe bruid, Madril quam ryden in,\n15\nDoor d'oover al behangen\
    \ straat,\n \nMet seegeboogen, trots van staat,\n \nMet danstooneelen van Musyk,\n \nEn\
    \ mommery, van kleedingh ryk,\n \nOntfangen, binnen d'eerste poort,\n20\nVan gulde Heemlen,\
    \ gaande voort,\n \nOp silvre stangen, in de hand\n \nDer goude Magistraat geplant.\n \n\
    Gelyk Penthesile te paard,\n \nMaar, als een Mingodin, van aard,\n25\nGevolght van meenigh\
    \ Amasoon,\n \nDoor konst, en van natuure schoon,\n \nMet zoo veel Princen, die verblydt,\n\
     \nHaar strekten, tot een straattapyt,\n \nEen rei getrokken, van Retier,\n30\nTot aan 't\
    \ palleis des Kooninghs schier:\n \nEen lenghte van de Haarlmer poort,\n \nTot aan den buiten\
    \ Emsterboord,\n \nLanghs welkers harten dat sy treedt,\n \nOp 't voorgery, van hun gereedt,\n\
    35\nAls spiegels, in de sonneschyn,\t\n[p. 417]\t\n \nDie niet dan goud, en silver zyn,\n\
     \nEn als een bergh van diamant,\n \nEn van robyn, aan alle kant,\n \nOp sy, met parlen\
    \ geborduurt,\n40\nDe dierste, die hen Ormus stuurt.\n \nElk op een henghst van Kordua,\n\
     \nIn schoonheit, sonder weedergaa,\n \nMet saadels, barden, pluim, en toom,\n \nZoo kostlik,\
    \ als 's bereyders soom.\n45\nVan eedle knaapen, en laqueis\n \nGevolght, met duure livereis.\n\
     \nGeleidt van karabyn, en lans,\n \nTrompet, en keeteltrommendans.\n \nEen flaauwe doodverw,\
    \ van 't penceel\n50\nDer ryke leeden, maar een deel\n \nTe hoof, om dat de schrikbre pest\n\
     \nVeel grooten sloot, in hun gewest,\n \nUit weeligheit zoo opgeciert.\n \nWat werkten\
    \ sy van nood gestiert?\n55\nWy laasen wat de Persiaan,\n \nVoor prachten, voormaals heeft\
    \ gedaan,\n \nOnse oogen loofden nimmermeer,\n \nHy dooven kon zoo grootsen eer.\n \nDies\
    \ loosde die gesonde mond,\n60\nDit woord, dat op een pyler stond.\n \nDit is de grootste\
    \ Monarchy,\n \nOf kent haar macht, noch heerschappy.\n \nO waare filosoofsche baard,\n\
     \nZoo bruin, zoo breed, zoo langh gehaairt,\n65\nHoe moest dat oor van Arragon\n \nVerwondert\
    \ staan, in syn balkon?\n \nOrakel diep, en ryp van sin,\n \nWat steekt hier niet een waarheit\
    \ in?\n \nHaar rykdom, van onweeghbaar wight,\n70\nMaakt alle Kooninghs schatten licht.\t\
    \n[p. 418]\t\n \nMen roeme die van Salomon,\n \nMen twyffelt, of hy meerder kon.\n \nWoogh\
    \ maar de swaare wysheit niet,\n \nOp d'eevenaar, van haar gebied,\n75\nWat lichter, dan\
    \ de goedigheit,\n \nVan gierge stuurmans slecht misleidt:\n \nMen sach haast wat de Fransman\
    \ waar,\n \nGedient oprechter voor, en naar,\n \nAl schreef hy Vrankryk trots, ten hoon,\n\
    80\nZoo dikwils, als Filip een kroon.\n \nO man, men smeede uw spreuk van goud,\n \nOp dat\
    \ de werld se wel onthoud:\n \nNiet min dan, van een afgesant\n \nGesprooken eer, in Griekenland."
- titel: Tempel, aan den kooningh van Spanje
  dichter: Joannes Six van Chandelier
  datum: november 1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "Dit gedicht zal de kern hebben uitgemaakt van een aantal gedichten op het huwelijk\
    \ van Filips iv met Maria Anna van Oostenrijk en de daarop volgende Blijde Inkomste van\
    \ de nieuwe koningin in Madrid op 15 november 1649 (vgl. met name de annotatie bij r. 38\
    \ van gedicht no. [241]). Six heeft die gedichten naar Holland opgestuurd, maar ze vielen\
    \ daar, zo lijkt het, niet altijd in goede aarde. Men begreep blijkbaar niet dat er veel\
    \ sarcastische spot in Six' prijzende\t\n[p. 444]\t\n\n woorden stak. Kennelijk verweet\
    \ men hem een al te welwillende beoordeling van de Habsburgers. Dat de kritiek Six niet\
    \ geheel onberoerd liet, kan blijken uit zijn gedicht no. [75]. In zijn verdediging wijst\
    \ hij met nadruk op de vrede van Munster, die in het voorgaande jaar was gesloten en die\
    \ van de Spanjaarden ‘bondgenoten’ had gemaakt, hoewel hij toegeeft dat de Spaansche tirannye\
    \ niet vergeten mocht worden. Evenals het hierboven al aangehaalde gedicht no. [241] is\
    \ deze tempel op het eerste gezicht zeer complimenteus voor het Spaanse hof, maar Six is\
    \ hier al te complimenteus. In de overdreven loftuitingen laat zich zijn spot met het vorstelijk\
    \ paar lezen. Six hekelt sarcastisch de praalzucht van Madrid. Zijn tempel staat op p. 317-321\
    \ van zijn bundel Poësy."
  tekst: "Och! dat die swaare straf, van 't al te trotse Babel,\n \nMyn tongh nu snoert, als\
    \ met een kaabel,\n \nEn dat myn sanghgodin haar toegeneege luiten,\n \nGeensins op eedel\
    \ Spaansch kan uiten.\n5\nNochtans, o Klio, doe myn geest ten Heemel vaaren,\n \nOp luide\
    \ Neederduitsche snaaren:\n \nEn voer, met braaven toon, den roem van Flip daar binne,\n\
     \nGehuwlikt aan dees Kooninginne:\n \nFilip den vierden van dien wydgevreesden naame:\n\
    10\nMaar d'eersten, wien de schelle Faame\n \nDus groot, en waardigh droegh, op haar vermaarde\
    \ pluimen,\n \nZoo rond, als d'Oceaan gaat schuimen.\n \nNiet juist om dat hy dooft den\
    \ glans van andre kroonen,\n \nDie dicht, en wydgeleegen woonen,\n15\nWanneer hy, als een\
    \ God, in seetels van yvooren,\n \nSyn heiligh haair, met goud der Mooren,\n \nVol konsts,\
    \ uitmuntend kroont, waar zoo veel duure steenen,\n \nVol sonnestraalen, niet uitscheenen,\n\
     \nAls groote Vorsten, met hun ryke kooninghryken,\n20\nHun staaven voor syn voetbank stryken.\n\
     \nWat baat de heerschappy der onomvatbre werreld,\n \nIs 't hart, van grooter goed, ontperrelt?\n\
     \nDus merktmen dat Filip de locht doorboort, met kuilen,\n \nOm dat er, in syn boesem schuilen,\n\
    25\nAls deuchdestaapels, die geleit, op eeveschaalen,\n \nMeer millioenen wights ophaalen,\n\
     \nDan Limaas swangre schoot, hem lost, in silvre gaaven,\n \nOp Kadix, of sint Lukas haaven.\n\
     \nLaat 't machtige Madril haar trouw, en liefde teiken,\n30\nHun waarden Kooningh dan toereiken,\n\
     \nMet opbouw hier, en daar, van gulde seegeboogen,\n \nEn andre prachtige vertoogen:\n\
     \nWan hy doorluchtigh, met syn Kooningin, komt ryden\n \nDe straaten in, tot haar verblyden:\n\
    35\nNabootsende, met meer cieraeds, de Scheldenaaren,\tOver dit hoofdstuk/artikel\nLANDEN\n\
    Spanje\n\n[p. 420]\t\n \nAls Spanjes soon quam ingevaaren.\n \nOf doende, als Room, toen\
    \ haar gelauwerierde Augusten\n \nInreeden, van gewonne kusten.\n \nLaat d'ondersaat, uit\
    \ lui metaal, met snelle vieren,\n40\nEn vlugge brandende papieren,\n \nAls booden senden,\
    \ naa de Heemelhooge saalen,\n \nDat Jupiter verlieft quam daalen,\n \nOm by syn Juno hier,\
    \ op aarde, een poos te woonen,\n \nIn plaats, van op gestarnde throonen.\n45\nAi sie, waar\
    \ is de glans van al dat weerlicht heenen,\n \nDat naauw gespoogen, was verdweenen?\n \n\
    Waar bleef 't orduin gebooght, zoo kostlik, van den Tiber?\n \nVeel min zal 't greine, van\
    \ den Iber,\n \nVerduuren weer, en wind, en knaagen van de tyden,\n50\nDat steen, noch yser\
    \ konnen lyden.\n \nIk die myn moeder heb, den moeders naam gegeeven,\n \nToen ik, aan 't\
    \ Y begon te leeven,\n \nIn die beroemde stad, die met oranje vaanen,\n \nDe werreld niet\
    \ laat om te baanen,\n55\nNa dat het langh getraan, van oorlogh, sterk gesoogen,\n \nAls\
    \ scherpe ajuin, uit tweesydsche oogen,\n \nWas van de vree gedrooght, naast d'eerste quam\
    \ besoeken,\n \nOm voordeel Kastiljaansche hoeken,\n \nWil eene kleine straal van varsche\
    \ sucht doen blinken,\n60\nDie my d'olyfboom gaf te drinken.\n \nNiet met geswaavelt kruid,\
    \ om ydlen rook te maaken,\n \nNoch met verganghbre seegestaaken.\n \nOok schoon ik wou\
    \ der een, waar zou ik silver haalen\n \nVan dertigh duisend acht reaalen?\n65\nIk wil een\
    \ tempel van onsterflike gedichten,\n \nTer eer van Spanjes Vreegod stichten.\n \nNiet langs\
    \ den Mansannaar, maar midden in vier stroomen,\n \nAls bronnen van de deuchd genoomen.\n\
     \nDie Ganges en den Nyl, met, die te saamen stryken,\n70\nDen Tyger, en Eufraat gelyken.\t\
    \nEmendatie r. 62: seegestaaken. < seegestaaken.,\n[p. 421]\t\n \n't Fondeersel van den\
    \ bouw zal goude wysheit weesen,\n \nEen seekre grondsteun, vry van vreesen,\n \nVoor stormen\
    \ van den haat, met oovervloed van golven,\n \nDie sich daar op te barste kolven.\n75\n\
    Daar op stond Salmons ryk, en al syn rykdoms schaaren,\n \nMaar starren, by die maanglans,\
    \ waaren.\n \nDan sal viersyds een muur van amethisten rysen,\n \nDie maatigheits vioolkleur\
    \ prysen.\n \nIn 't middelste van 't plein, zal ik de kloekmoed planten,\n80\nOp pylers\
    \ van twee Diamanten.\n \nGerechtheits heerschappy, zal 't hoogh gewelf vercieren,\n \n\
    Met d'allerhelderste safieren.\n \nEen silvere Kolos, na Haroos lyf, gesneeden,\n \nZal\
    \ voor den geevel hoogh bekleeden.\n85\nSyn beenen zullen voor een goed poortaal verstrekken,\n\
     \nVoor die sich binnen wil vertrekken.\n \nMen treede langhs een vloer, en karneoole drempel,\n\
     \nEerbiedigh in zoo schoonen tempel.\n \nDaar zal ik een altaar van olistammen bouwen,\n\
    90\nNa 's Kooninghs vreedsaam hart gehouwen.\n \nWaar naast, van klaar agaat, de beide Godheen\
    \ zullen\n \nDe syden, als pilasters vullen.\n \nTer rechter syde zal hy rechts het ryksswaard\
    \ swaaijen,\n \nEn slinks de kloot des werrelds laaijen.\n95\nSy meede vol ontsachs zal\
    \ hier den ryksstaf voeren,\n \nDaar 't boek des wysheits, sonder snoeren.\n \nHun kruinen\
    \ zullen, met beperlde goude kroonen,\n \nElks majesteiten braaf vertoonen.\n \nHy op syn\
    \ borst, met 't vlies, sy met gewyde roosen,\n100\nVan Innocent voor haar verkoosen.\n \n\
    Die heilge Vaader kon, uit syn geheilight koffer,\n \nDees Kriste Venus, met geen offer,\n\
     \nBetaamliker versien: het zyn haar eige blommen,\n \nMen siet se-ook, op haar wangen,\
    \ brommen.\n105\nHy schonk se haar van goud, op dat se sou verduuren,\t\n[p. 422]\t\n \n\
    De ryken van haar nydge buuren.\n \nDat hy se wydde was, om haar gewyde krooningh,\n \n\
    Gehouwlikt, aan zoo grooten Kooningh.\n \nDe pylers zullen elk, niet sonder ciersel, blyven,\n\
    110\nMaar sich, met eedle schilden, styven,\n \nVan twee Kasteelen, en twee Leeuwen, die\
    \ sich paaren,\n \nMet Ferdinandus Aadelaaren.\n \nVoorts zal de ronde muur, met waapenkroonen\
    \ pronken,\n \nAls voor Filippus klooster blonken.\n115\nWanneer dit trots gebouw, o Kooningh,\
    \ is voltoogen,\n \nZoo bid ik wilt een bee gedoogen:\n \nDat ik, als Priester, voor het\
    \ outer, d'eerste reijen,\n \nAan Eeuwigheit gewydt, mach leijen.\n \nDan zal ik, met de\
    \ schaar van Kastals Sanggodinnen,\n120\nAldus een jaarliks lied beginnen.\n \nApollo groote\
    \ God, en Vaader der gesangen,\n \nDoor wiens genaa dit aangevangen,\n \nEn uitgewrocht,\
    \ ghy die gedichten geeft het leeven,\n \nWilt myn gedicht dat eeuwigh geeven.\n125\nGun\
    \ dat die Kooningin, naast haar onwinbren Kooningh,\n \nVereeuwe, met dees heilge wooningh.\n\
     \nGun dat de Spaansche jeuchd, en jonglingen, en maagen,\n \nHier, alle jaaren, offer draagen.\n\
     \nNiet uit Faliskus wei, met witte, en gulde stieren,\n130\nMaar dat se, met myn lofsangh,\
    \ vieren.\n \nUw heiligh outer zal ik, met een hals, berooken,\n \nDie, onder 't juk, nooit\
    \ heeft gedooken.\n \nIndien die Vaader dan dit ryk is toegeneegen,\n \nZoo zal het bloeijen,\
    \ in syn seegen.\n135\nMy dunkt dat ik gewoon, om Febus lof te speelen,\n \nMerk, hem myn\
    \ dichten niet verveelen.\n \nMy dunkt dat self Jupyn, en zoo veel Heemelgooden,\n \nSich\
    \ eeven gunstigh laaten nooden."
- titel: Opdracht van den tempel, aan den Kooningh van Spanje
  dichter: Joannes Six van Chandelier
  datum: november 1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "Met dit gedicht draagt Six zijn tempel, aan den kooningh van spanje op aan\
    \ Filips iv, al zal van een werkelijke aanbieding van het gedicht geen sprake zijn geweest.\t\
    \n[p. 450]\t\n\n De fontein, die Six in r. 5-12 van dit gedicht beschrijft, maakte deel\
    \ uit van de feestversiering ter ere van de Blijde Inkomste van de koningin op 15 november\
    \ 1649. Justi, 1888, ii, p. 287 beschrijft haar als volgt: ‘Hier [nl. nabij het Buen Retiro-paleis]\
    \ erhob sich der Parnass, in natürlichem und künstlichem Blumenschmuck, Herkules und das\
    \ Flügelross mit der Hippokrene von Wein auf seinen beiden Gipfeln, im Thal Apoll mit den\
    \ Musen, und zu deren Seiten die Statuen der grossen spanischen Dichter des Alterthums:\
    \ Seneca, Martial, Lucan; der Renaissance: Juan de Mena, Garcilaso und Camoens; die jüngstverstorbenen\
    \ endlich: Quevedo, Góngora, Lope. An den Parnass schlossen sich die elyseischen Felder,\
    \ deren Abschluss der Bogen an der Carrera d.S. Jerónimo bildete’. Het werk zou zijn ontworpen\
    \ door de architect Cano. In totaal waren er vijf triomfbogen in de stad opgericht (vgl.\
    \ r. 13 van het hier behandelde gedicht), die behalve door Alonso Cano ook door de architect\
    \ Sebastian de Herrera Barnuevo waren ontworpen (vgl. voor een beschrijving van de andere\
    \ bogen de Toelichting bij gedicht no. [249]). Deze opdracht staat op p. 321-322 van Six'\
    \ Poësy."
  tekst: 'O Kooningh, schoon dit rym, met moeite, was volweeven,

     

    Al swaarder dan tapyt, op weefgetouw, bereidt:

     

    Noch stree ik, met ''t gemoed, of ik ''t zou derven geeven,

     

    Om syn geringe styl, uw groote Majesteit.

    5

    Maar, voor Retire, uw hof, Parnassus siende blinken,

     

    Die aan de slinker syde ontspringht, van Pegas hoef,

     

    Waar uit een suivre stroom, heel geestigh om te drinken,

     

    Komt straalen, die een beek, in lauwerdaalen, groef:

     

    En dat Apollo staat, in ''t midden van syn kruinen,

    10

    En Herkules, gelyk een schermheer booven op:

     

    En dat er drymaal dry Poeëten, langs de duinen,

     

    Hun beste aanwenden, om te klimmen, op het top:

     

    Ook siende, om hoogh gerecht, vyf trotse seegebouwen,

     

    Gemarmert van ''t penceel, van goud, en silver styf,

    15

    Ter eer uws Kooningins, waar in men leest gehouwen,

     

    Veel geestigheits, en konsts, uit ''s dichters tydverdryf:

     

    Zoo houde ik seeker ghy dat heilige geslachte

     

    De lommerschaduw gunt, van onverdiende gunst,

     

    Op dat een leege geest, met naarstigheit, betrachte,

    20

    Om lengsjes, op dien bergh, te raaken, door de kunst.

     

    Zyt ghy dan Herkules, op Spanjes singhfonteinen,

     

    Laat myn Spaansch Duitsch gesangh uw voorspraak niet verkleinen.'
- titel: Op d'aanstaande wandelinge van de kooninginne, na Casa del Campo, of het landhuis
  dichter: Joannes Six van Chandelier
  datum: januari 1650
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: De feestelijkheden rond Maria Anna's intrede in Madrid voorzagen blijkbaar ook
    in een plechtig eerste bezoek aan het koninklijke landhuis met omliggende tuinen aan de
    westrand van de stad. De gebeurtenis zou zich kennelijk eerst in januari 1650 afspelen,
    maar was reeds lang van tevoren aangekondigd. Six' gedicht staat op p. 322-323 van zijn
    Poësy.
  tekst: 'Wellustigh Landhuis, laagh gescheijen,

     

    Door Mansannares waaterreijen,

     

    Van ''s Kooninghs hoogh palleisend glas,

     

    Sich spieglende, in die waaterplas,

    5

    Send vry een offer van uw bloemen,

     

    Die zoo veel taalen roosen noemen,

     

    Aan Cipria, die in Madrid

     

    Geeert, als uw Godinne sit.

     

    Dit lykt wat wonders in den winter.

    10

    Maar als die rooselaare splinter

     

    Ontbloemt zal weesen, naa ik sach,

     

    Eer veertien daagen, naa den dagh:

     

    Bedroef u niet, al zyn de roosen

     

    Misschien, van Loumaand, uitgevroosen.

    15

    Men seit, daar zal geen heele maan,

     

    Door haar quartieren ommegaan,

     

    Of Venus zal u sien, wiens oogen

     

    Een klaare sonneglans vertoogen,

     

    Wiens kaakjes, blanker dan een spier,

    20

    Braaveeren leelie gecier,

     

    Waar oover purperende bloosjes,

     

    Al eeler sparkelen van roosjes,

     

    Dan die in ''s soomers sonneschyn.

     

    Wat zal er dan een soomer zyn?'
- titel: Spanjes heerschappye, afgebeeldt aan een der triumfboogen
  dichter: Joannes Six van Chandelier
  datum: november 1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: In dit gedicht stelt Six een schildering centraal, die was aangebracht op een
    van de vijf erepoorten die in Madrid waren opgericht ter gelegenheid van koningin Maria
    Anna's Blijde Inkomste. Van die vijf maakte er één onderdeel uit van de Parnassusfontein
    die Six in zijn opdracht van den tempel (no. [247]) beschrijft, de overige vier, ontworpen
    door Sebastian de Herrera Barnuevo, ‘stellten [...] die Idee der spanischen Weltherrschaft
    dar, ethnographischen Statuen und Gemälde vergegenwärtigten die Besitzungen in den vier
    Welttheilen’ (Justi, 1888, ii, p. 287). De Spaanse toneeldichter Pedro Calderon (±1600-1681)
    heeft een beschrijving van deze vier poorten later verwerkt in zijn komedie Guárdate del
    agua mansa (derde bedrijf, veertiende scène) en daaruit blijkt dat de vier bogen achtereenvolgens
    Europa, Azië, Afrika en Amerika uitbeeldden en dat die werelddelen in de voorstellingen
    in verband werden gebracht met respectievelijk lucht, aarde, vuur en water (Calderon ii,
    1862, p. 397). Ik heb echter niet kunnen vaststellen aan welke boog de door Six bedoelde
    schildering was aangebracht. Het gedicht staat op p. 323 van Six' Poësy.
  tekst: 'Hoe geestigh heeft ''t penceel, vermaaghschapt aan de pennen,

     

    Die sich, in Poësye, wennen,

     

    Syn konst te werk geleght, aan een der seegeboogen,

     

    Met Atlas torssen te vertoogen?

    5

    De Kooningh stut de kloot, die syne schouders draagen,

     

    Gelyk of hy de werld hielp schraagen.

     

    De Kooninginne schynt haar hand daar naa te breiden.

     

    Een bruid betaamt geen arrebeiden.

     

    Maar zoo die lootlast quam ter slinker zy te buigen,

    10

    Verviel de werreld niet, in duigen?'
- titel: Op de schoonheit van de Kooninginne, aan de selve
  dichter: Joannes Six van Chandelier
  datum: november 1649
  locatie: Madrid, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: 'Ook dit gedicht heeft betrekking op de Blijde Inkomste van de nieuwe Spaanse
    koningin in Madrid, op 15 november 1649. Six'' oordeel is, al spot hij ook hier, heel wat
    milder dan dat van Justi, die de zeer jeugdige koningin, kennelijk mede op grond van Velazquez''
    schilderijen, aldus beschrijft: ‘Der Gegenstand dieser Feste war eine kleine, kindische,
    unwissende und eigensinnige Person. Das platte Gesichtchen, in dem der Verstand noch schlummerte,
    zeigte keine schönen Linien, das einzige was man behielt, war der Familienzug um den'
  tekst: 'Zoo d''eer gestreeden stryd, van dryerlei Godinnen,

     

    Op Ide, om schoonheit, noch, aan d''Iber, zou beginnen,

     

    En ghy Marye mee mocht, om uw maare, reijen,

     

    Ghy zoud de goude prys verdient, Madridwaarts leijen.

    5

    De vrouw van God Jupyn, in pyn, zou bleek besterven.

     

    Minerve liet haar haat, op Paris, niet min erven.

     

    En Venus zou venyn, aan minnepylen, stryken.

     

    Ghy zoud alleen Godin, van vier Godinnen, lyken.'
- titel: Brief, aan Theodore Dodeur
  dichter: Joannes Six van Chandelier
  aan: Theodore Dodeur
  datum: '1650'
  locatie: Cádiz, Spanje
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six schreef deze brief vanuit Cádiz, korte tijd voor zijn overtocht van Spanje
    naar Italië. Over zijn vriend (en handelsrelatie?) Theodore Dodeur heb ik weinig nadere
    gegevens kunnen vinden. Six noemt alleen hier zijn naam voluit, maar zal hem ook op het
    oog hebben in zijn gedichten aan T.D. (no. [81]) en weerstuit, aan T.D. (no. [160]), waaruit
    blijkt, dat de omgang tussen beide vrienden niet altijd even vriendschappelijk is gebleven.
    Dodeur dichtte zelf ook, maar van zijn werk lijkt slechts weinig overgeleverd te zijn (vgl.
    de Toelichting bij gedicht no. [160]). De hier behandelde brief van Six aan Dodeur is afgedrukt
    op p. 324-327 van de bundel Poësy. Het briefdicht-karakter van dit gedicht is aan de orde
    gesteld in Schenkeveld-van der Dussen, 1987 a, vgl. met name p. 122-123 aldaar.
  tekst: "Van hier, waar Herkules een kerk had, en altaaren,\n \nEn, als op Westens schrank,\
    \ geplant heeft twee pilaaren,\n \nGestoelt, in schaaduw van Oranje, en groene vruchten,\n\
     \nEn blos, op eenen boom, in loumaand soet om luchten,\n5\nWierd dit besoek, twee reis\
    \ besonnestraalt, geschreeven.\n \nMyn antwoord uit Bajoon, heeft Hartgers u gegeeven.\n\
     \nNiet dat ik 't selve las, uit naa ontfange vellen,\n \nMaar dat van Keulen 't my quam\
    \ onversiens vertellen,\n \nAan 't diep Guadalquebir, zoo d'Arabiersche Mooren\n10\nDen\
    \ Betis noemden, die dees naam schier heeft verlooren,\n \nZoo hoogh den stroomwal op, tot\
    \ daar de vloênde baaren\n \nDes zees haar souten, eens versilvrende alle jaaren.\n \nHoewel\
    \ ik twyffel niet, of ghy hebt weer papieren,\n \nGoedgunstigh, met wat nieuws, gepooght\
    \ my toe te stieren.\n15\nIk derve, in dit geloof, my met bewys verkloeken,\n \nOm dat ghe\
    \ vroeger my, dan ik u quam besoeken:\n \nMet opgesochte stof, die naamaals u gegeeven,\n\
     \nZoo zyt ghe daar gebeên niet schuldigh op gebleeven.\n \nGelyk ghe 't huis begont van\
    \ vriendschap voort te bouwen,\n20\nZoo hebt ghe 't, naa volbouwt, ook willen onderhouwen.\n\
     \nDrysins, met kleine kost kan iemand vuur doen branden,\n \nEn voeden, in den haard, van\
    \ vrienden ingewanden.\n \nSlechts met een nieuwen hoed, een teersjen wyn t'ontsteeken,\n\
     \nEn met een boek papier, voor tweeenvyftigh weeken.\n25\nWanneer we, in 't vaaderland,\
    \ ontrent malkander, quaamen,\n \nZoo teerden wy vernoeght twee, van die dry, te saamen.\n\
     \nMaar nu de Heemlen met zoo grooten rek ons scheiden,\n \nZoo moet getonght papier sich\
    \ wiss'len tuschen beiden.\n \nWie deese wissel vondt, vondt een der nutste vonden.\n30\n\
    Ik loof de vriendschap heeft den eersten brief versonden.\n \nMisschien heeft Kain, naa\
    \ den doodslagh, gaande sweeven,\n \nSyn wanhoop, op een schors, syn vaader, toegeschreeven.\n\
     \nWant dat er voor de vloed der sonden schryvers waaren,\n \nTuight Enochs schrift, op\
    \ een der Sirische pilaaren.\n35\nLicht vraaght ghe, wat 's een brief? in 't kort iets ver\
    \ te seggen.\t\n[p. 429]\t\n \nOm meiningh van, en aan afzynden, uit te leggen.\n \nEen\
    \ sneeuwit lichaam, van vermaalde vuile doeken.\n \nEen swarte ziel, beinkt, met haaken,\
    \ streepen, hoeken.\n \nWaar ieder in kan sien, als hy den rugh, met kleuren,\n40\nVan lak,\
    \ van was, of deegh beseegelt, op wil scheuren.\n \nEen lyf, en ziel, die droogh beslooten\
    \ eeuwigh leeven,\n \nMaar in de locht, zee, aarde, of vlamme saamen sneeven.\n \nDie waar\
    \ de wind een spleet verrast, om in te sluipen,\n \nHet spyt, of muur, of deur, daar binnen\
    \ deur kan kruipen.\n45\nEen tydinghbrenghster, klein van kost, te zee, en lande,\n \nTe\
    \ paarde noch te voet, nochtans van dryerhande,\n \nGedraagen in een sak. En vreest se rooveryen,\n\
     \nOf heeft se haast, se vlieght, ook sonder tooveryen.\n \nAan wien, en waar se wil toont\
    \ 't veurhoofd, klaar, met woorden.\n50\nDaar spreekt se, met een tongh van 't suiden langh,\
    \ in 't noorden.\n \nDaar spreekt se, sonder tongh, en elk, ook sonder ooren\n \nMet oogen\
    \ slechts daar by, die kan heur boodschap hooren.\n \nDaar stelt se naakt den geest des\
    \ senders afgescheiden,\n \nVan 't lichaam, eevenwel zoo stelt se geen van beiden.\n55\n\
    Al wat se spreeken moet, dat spreekt se, sonder schaamen:\n \n't Zy dat se seegent, vloekt,\
    \ of prysen zal, of blaamen.\n \nMaar wyl ik, naa Latyn, een brief heb kort beschreeven,\n\
     \nZoo heeft se my te ver, van 't rechte spoor, gedreeven.\n \nSchoon ghy dan andermaal\
    \ de meesters van de posten,\n60\nEn boôn verryken hielpt, ik had geen andre kosten,\n \n\
    Indien het kosten zyn te reek'nen, onder vrienden,\n \nHet schynt daar zyn er, die sich,\
    \ van myn brieven, dienden.\n \nIk las maar, in Madrid, twee groeten, van myn moeder,\n\
     \nEn seedert niets van haar, van suster, vriend, noch broeder.\n65\nDaar ik, tot in Bajoon\
    \ van Vrankryk, alle weeken,\n \nMyn moeders lieve hand plagh welkom op te breeken.\n \n\
    Doch wyl ik ryme ontfangh ik een vertoefden boode,\n \nWel anderhalven maand, of eerder\
    \ noch, van noode.\n \nLet, hoe baatgierigh zyn de handelende menschen,\n70\nOm voordeel\
    \ doende, wat sy, aan sich self, niet wenschen.\t\n[p. 430]\t\n \nIk echter staakte nooit\
    \ myn schuldighlyke brieven,\n \nOm vrienden, of ons huis niet, met verlangh, t'ontrieven.\n\
     \nIk twyffel niet, of die gaan veiligh, en heel seeker.\n \nIk bruike een boo bekent, voor\
    \ geenen oopenbreeker.\n75\nDees liet ik, om meer spoeds, de Spaansche zee doorvaaren,\n\
     \nVertrouwt op goeden wind, het postpaard, langs de baaren.\n \nMaar deese, vrind Dodeur,\
    \ rymde ik, op voet, en maate,\n \nBewust dat ghy de spraak van poësy niet haatte.\n \n\
    Maar deese Heemelnimf, zoo minlik, plaght te minnen,\n80\nDat ghy wel rymsy haar, tot een\
    \ cieraad, kost spinnen.\n \nDies wyl geen nieuwe maar besonders kan vertellen,\n \nZoo\
    \ gaan hier neevens noch bekrieuwelrymde vellen.\n \nAl schuilt er somtyds, by het ernstigh,\
    \ eerlik mallen,\n \nAi laat, uw heusche gunst, die vryheit welgevallen.\n85\nWeet d'andere\
    \ oorsaak vry, waarom ik u wil deilen\n \nDit buitenvaarsekraam: ik vreese, voor onheilen,\n\
     \nGelyk t'Angiers, waar dat myn knecht een heeft verlooren.\n \nDat kost laatdunkenheit:\
    \ want ik wou meede vooren,\n \nEn hy moest achter gaan: gelyk veel groote heeren,\n90\n\
    Die, sonder hallef geld, het heele trots verteeren.\n \nO! arme hoovaardy. Jan kom de maale\
    \ pakken.\n \nMen gaat beneên, terwyl vergeet Jan wat te sakken.\n \nHy had te veel in 't\
    \ hoofd. Hy gaf de paarden t'eeten,\n \nTwee maatjes flus, nu een, de haaver dee 't vergeeten.\n\
    95\n't Waar niet vergeeten, zoo men hem een jongen lakker,\n \nTot hulp, had bygevoeght,\
    \ of self geweest de pakker.\n \nZoo siet men dat de knecht, de heer, de meester, knecht\
    \ is.\n \nHy zy syn eigen knecht, die alles wil wat recht is.\n \nNoch zyn er, buiten dit,\
    \ ontelbaarlyke sorgen,\n100\nWaar deur ik meer van daagh verliesen mocht, of morgen.\n\
     \nWie reist, is niet een uur, verseekert, van het stroopen,\n \nDat d'arme reiser ook,\
    \ met 't leeven, moet bekoopen.\n \nAl is dit vry geringh, 't verliesen zou my grieven,\n\
     \nZoo veel, als Cicero het scheuren eenger brieven,\n105\nBearbeidt, en geschaaft, maar\
    \ nimmermeer versonden.\t\n[p. 431]\t\n \nVerlies ik 't nu, zoo leeft het afschrift ongeschonden:\n\
     \nMids ghy het niet verveeght, of tot de mosselvuuren\n \nGebruikt, maar spaar, ik bid,\
    \ spaar my zoo dankbaare uuren.\n \nMoeit ghy u naaderhand, om andwoord te vereeren,\n110\n\
    Laat die niet hier, maar naa Toskaanens zeestad keeren.\n \nIk zal myn herssenen in Spanje\
    \ niet meer moeijen,\n \nMet dichten gaande korts door Alikante spoeijen,\n \nNa Ital, of\
    \ den Vrank. Ik laat de dichtlust vaaren,\n \nTot dat se daar ontsteeke, of by onse Amstelaaren.\n\
    115\nWat of in Itals ryk, of Vrankryk op zal rysen,\n \nDie alle beide zyn, als aardsche\
    \ paradysen,\n \nDaar Spanje een land is, vol van ongebouwde landen,\n \nLeert d'onbeleefde\
    \ tyd, meesterse der verstanden.\n \nMaar zoo 't den goeden God gelieve op wegh te stuuren,\n\
    120\nDat ik gesond mach sien myn lieve vaaders muuren,\n \nDan laat my nieuwe stof, tot\
    \ Ylof, niet verleegen:\n \nWant die, van hand, tot hand, reeds blyde heb gekreegen.\n \n\
    Almachtigh soet gesel, wees my daar toe een hoeder,\n \nEn hoed myn vaaderland, en vrienden,\
    \ neevens Moeder."
- titel: Jooden kerkhof te Livorno
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Livorno, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "Six bezocht dit joodse kerkhof tijdens zijn reis door Italië in 1650. Livorno\
    \ was in Six' tijd een centrum van buitenlandse handel. Men trachtte de rol van Livorno\
    \ als havenplaats te vergroten door eenieder bedrijfs- en handelsvrijheid te verlenen en\
    \ door een voor die tijd ongehoorde verdraagzaamheid aan de dag te leggen; ketters, joods\
    \ of protestants, werden niet lastig gevallen. De handel was in handen van Grieken en uitgeweken\
    \ Spaanse joden, maar vooral ook van Hollanders en Engelsen; Livorno was het hoofdkwartier\
    \ van de hele zgn. Straatvaart en een stapelplaats voor de Levanthandel.\t\n \tDe protestanten\
    \ werden te Livorno ter aarde besteld in een tuintje buiten de stad, dat toebehoorde aan\
    \ de Lutherse ingenieur Constantijn Lambert (vgl. r. 13-14 van dit gedicht). Eerst in de\
    \ laatste jaren van de zeventiende eeuw kreeg de Nederlands-Duitse gemeente in Livorno een\
    \ heus kerkhof, waar de overledenen onder zerken begraven mochten worden (Hoogewerff, 1927,\
    \ met name p. 149-151 en p. 168). Over het joodse kerkhof in Livorno is mij niets naders\
    \ bekend. Het gedicht staat op p. 328-329 van Six' bundel."
  tekst: 'Ghy die de werldkloot kruist, en rondt,

     

    Met winkbrauw, oor, neus, hand, en mond,

     

    En uit wat nieuws, en vreemd gelykt,

     

    O Kristelingh, uw voordeel strykt,

    5

    Staa hier, en swygh een weinigh stil.

     

    Raad wat zoo veele marmers wil.

     

    Misschien deede iemand u ''t verhaal,

     

    Of ''t opgeschrift, in Adams taal,

     

    Wees, onder elken grafsteen, d''asch,

    10

    Van die, in Spanje, een Kriste was:

     

    Maar, in Italie, den dood

     

    Stierf, in ''t geloove van een Jood.

     

    Ghy saaght misschien ook ''t lykenhof,

     

    Van andere begraaven stof,

    15

    Van Engelschen, van Sweed, van Deen,

     

    Of van een kind, uit Hollands veen,

     

    Na Luther, of Kalvyn genoemt,

     

    Die ''t heiligh huisje, als ketters, doemt,

     

    Al saam gedekt, van teeder gras,

    20

    Tot leeringh wat hun nasaat was:

     

    Of lydende de palmebol

     

    Der kollefhaamer, met gerol:

     

    Maar niemand van aandachtigheit,

     

    Gaf reeden van het onderscheid.

    25

    Die sachte lykaard leert, en duidt,

     

    Hun hart, zoo murw was, als hun huid.

     

    Maar deese, in ''t leeven, als een kei

     

    Zoo hard, ontspruiten rei, op rei,

     

    Als takken van een marmren grond,

    30

    Hoe wel men hier geen marmer vondt.

     

    Plant iemant weekelyk kattoen,

     

    Hy trekt weer wolle, van ''t plantsoen.

     

    Maar saait hy steenen van de straat,

     

    De vruchten blyven ''t selve saad.'
- titel: Schenk van Italjaanen, aan een Hooghduitschaard
  dichter: Joannes Six van Chandelier
  datum: 1650-1651
  locatie: Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht zal slaan op een situatie in Italië, waar Six in 1650 en 1651 geweest
    is. Het staat op p. 329 van zijn Poësy.
  tekst: 'Dees Duitschaard, aan den dronken Rhyn

     

    Gebooren, stoft hem daagliks wyn,

     

    In flessen, puik, en ongesmeert,

     

    Van Italjaanen werd vereert.

    5

    Hy weet niet wat het seggen wil.

     

    Maar elke fles is een pasquil.'
- titel: Damspel, om geld teegen ooverblyfselen van heiligen, van Kapucynen, met den scheepskoopman,
    op zee tusschen Alikante en Genua
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Genua, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: In de eerste maanden van 1650 stak Six over van Alicante naar Genua. Het zal
    op deze reis zijn geweest dat hij dagh, aan dagh, Door Zeegeraas, en teegenweêren in Oristano,
    aan de westkust van Sardinië, werd opgehouden (vgl. gedicht no. [110], r. 21-22). In het
    voorjaar van 1650 kwam hij aan in Genua. Zijn aankomst is uitvoerig beschreven in zijn latere
    gedicht no. [286], r. 79-104. Het hier behandelde gedicht staat op p. 329-332 van zijn bundel
    van 1657.
  tekst: "Godsdienstge heilge Kapucynen,\n \nDie heilger, binnen 't Pausdom, schynen,\n \nDan\
    \ d'allerheilighste persoonen,\n \nDie onder geestlike ordens woonen:\n5\nWat tuischt ghy\
    \ om der heilgen beenen,\n \nAl is 't juist, met geen dobbelsteenen,\n \nWaar 't lot 't\
    \ gewys werd toegeschreeven,\n \nMaar dat de dam werd voortgedreeven,\n \nOp 't scherpen\
    \ van des speelers sinnen,\n10\nZoo geld nochtans verlies, en winnen.\n \nWat is dit min\
    \ dan tuischerye?\n \nMeer dan verdoemde Simonye.\n \nHet heilighdom te berd, na 't schatten,\n\
     \nHanght aan een wel of qualyk vatten,\n15\nEn is verlooren, of gewonnen,\n \nTot blydschap,\
    \ of tot smert begonnen.\n \nDe heilgen loopen oover schyven.\n \nLicht ryst er kibbelen,\
    \ en kyven.\n \nDe kooplui kennen nimmer paapen,\n20\nAls 't beursen kost. Daar, daar aan\
    \ 't raapen,\n \nEn grabblen, in malkanders haairen.\n \nMen martelt weer de martelaaren.\n\
     \nZoo werden d'ongebrooke beenen\n \nDes Gods, en menschs van Nazareenen,\n25\nIn syn gemartelde\
    \ uitverkooren,\n \nVertuischt, verbrooken, en verlooren.\n \nVeel beeter deeden die soldaaten,\n\
     \nDie om den rok geheel te laaten,\n \nVan Gods gekruisten soon gesleeten,\n30\nMet teerlingen\
    \ daar oover smeeten,\n \nOp die, o! lukkige porfuuren,\n \nGekust, in Jan Latraanens muuren.\n\
     \nWat voorspraak houdt ghy, in de Heemelen,\n \nIndien ghy, om wat silvre seemelen,\n35\n\
    De deelen van hun lyf durft waagen,\tOver dit hoofdstuk/artikel\nLANDEN\nItalië\n\n[p. 436]\t\
    \n \nEn in hun rust zoo rustloos plaagen?\n \nVolght dit niet Neroos wreede voeten,\n \n\
    In d'opgesneeden buik te wroeten,\n \nNieusgierich waar hy had geleegen,\n40\nWanneer ghe\
    \ hun, die langh versweegen,\n \nAan 't loove lyf te rusten gaaven,\n \nUit 's Moeders darmen\
    \ opgegraaven,\n \nDus oneerbiedigh om gaat sollen,\n \nVerschuiven, stooten, huts'len,\
    \ rollen?\n45\nMen schroomt een mensch in slaap, t'ontwaaken:\n \nHoe durft ghy heilge lyken\
    \ raaken?\n \nWaar Mośes grafstee niet verschoolen,\n \nHy zou noch om de werreld doolen:\n\
     \nGelyk syn koopre slangh geheeven,\n50\nVoor Isrel, te Milaan, in't leeven.\n \nMaar Vaaders,\
    \ fyne religieusen,\n \nWy loopen, met geen houte neusen,\n \nAls reukeloose Tempelgooden,\n\
     \nVergeefs den wierook aangebooden:\n55\nWy ruiken wel, die brokkelingen\n \nNiet bleeven,\
    \ van geheilghde dingen,\n \nOf schoon een nette greine kasse,\n \nVoor elk een laadjen\
    \ had van passe,\n \nVoor oogen weigerigh, met deurtjes,\n60\nEn syde strikjes, van veel\
    \ kleurtjes,\n \nWaar in, beschreeve ceeltjes laagen,\n \nMet antwoord van den naam, op\
    \ vraagen.\n \nDie beentjes sommige uitgebranden,\n \nVan kruinen, ribben, schenkels, tanden\n\
    65\nGelyken alzoo wel van stieren,\n \nEn bokken, als bereende dieren:\n \nGelyken alzoo\
    \ wel van fielen,\n \nOf ongesaaligde, als gesaalgde zielen.\n \nGhy braght se, seght ghe,\
    \ mee van Romen,\n70\nSe konden ook, van Tunis koomen.\t\n[p. 437]\t\n \nWat zou ons niet\
    \ in twyffel stellen?\n \nWy sien geen bul, noch tuignisvellen,\n \nVan Paus, noch Bischop,\
    \ noch prelaaten,\n \nGebruiklik, by zoo heilge vaaten.\n75\nGhy schynt lichtvaardigh dan\
    \ te speelen:\n \nMaar 't strekt, om Godsdienst voort te teelen.\n \nVerliest ghe, daar\
    \ is niets verlooren.\n \nUw liegen lykt ook, naa behooren.\n \nWant loogens, list, bedrieghlikheeden,\n\
    80\nOm beste wille, zyn geleeden.\n \nZoo heeft die saalge hoer geloogen,\n \nEn Jericho\
    \ deurtrapt bedroogen,\n \nAls sy de spieders opgeslooten,\n \nUit 't heir, van Jakobs erfgenooten,\n\
    85\nMissaakte, en 't lieve leeven spaarde.\n \nUw streeken zyn van hooger waarde,\n \nMet\
    \ sorge voor de ziel van 't leeven.\n \nDen winner werd een spoor gegeeven,\n \nDewyl syn\
    \ aandacht raakt, in 't midden,\n90\nVan al die heilgen, om te bidden.\n \nAls die een kruis,\
    \ of beeld ontmoeten,\n \nDat met ontdekten hoofde groeten.\n \nWant aansien doet ons saaken\
    \ weeten,\n \nDie ongesien licht zyn vergeeten.\n95\nVerwint ghy eens, of meerdermaalen,\n\
     \nGhy kont er reisgelt uit betaalen.\n \nZoo werd de geldhaaf toegelaaten,\n \nMaar anders,\
    \ als den dood, te haaten.\n \nEn wien ghe silver hebt ontstreeken,\n100\nBedankt ghe, voor\
    \ een liefde teeken,\n \nMet toesegh, uw gedachtenisse\n \nHem reeknen zal, in d'eerste\
    \ misse.\n \nIs 't zoo niet heilge Kapucynen,\n \nDie heilger, binnen 't Pausdom schynen,\n\
    105\nDan d'allerheilighste persoonen,\n \nDie onder geestlike ordens woonen?"
