  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: In de laatste maanden van 1650 was Six in Rome en bezichtigde daar onder meer
    de Sint Pieter. Het gedichtje staat op p. 336 van zijn bundel.
  tekst: 'De Roomsche kerk werd voor de rechte kerk geeert:

     

    Maar sinte Pieters kerk, te Rome, is self verkeert.

     

    Dit missen is zoo groot, als daar de groote mis,

     

    Die, werd se recht bedient, zoo dikwils aavrecht is.'
- titel: Op het koopre beeld van Sinte Pieter, in de groote kerk, hem toegewydt, te Rome
  dichter: Joannes Six van Chandelier
  datum: '1650'
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht staat op p. 336-337 van Six' Poësy.
  tekst: 'O heilge Pieter, die van kooper, binnen Roomen,

     

    Pronkt, in uw kerk, van d''aarde, om hoogh, den vyfden schoen,

     

    Met machtge sleutels slinks, rechts seegnende al die koomen,

     

    Om uw gereikten voet, godsdienstigheit te doen:

    5

    Die van gekus, gesoen, en kransjes langs te schyven,

     

    Om heiligheit, van ''t volk, besmeurt, verhit, besweet:

     

    Hoe kont ghe, goede man, dat foolen, troetlen, vryven

     

    Verdraagen, want het vleisch reeds, tot het been, versleet?

     

    Hoe! is se geen metaal? hoe komt se dan versleeten?

    10

    Wat slyt niet van gebruik slechts, met de tongh, gelekt?

     

    Maar is ''t sint Pieter niet, die veelen heeft geweeten

     

    Hun breuk te heelen, jaa, die dooden heeft verwekt?

     

    ''t Is sinte Pieter niet, maar zoo naa hem geleeken.

     

    Waarom werd dan syn beeld geeert, en aangebeên?

    15

    Syn Godheit is daar, met mirakelen, gebleeken.

     

    Hoe! spaart hy ''t wonderwerk, aan syn vergaanden teen?

     

    ''t Is een onnoosel God, die anderen wil baaten:

     

    Maar, als ''t de nood vereischt, sich selve vindt verlaaten.'
- titel: Welkomste in Rome
  dichter: Joannes Six van Chandelier
  datum: oktober-november 1650
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six bereikte Rome in oktober of november 1650. Dit gedicht staat op p. 337-338
    van zijn bundel.
  tekst: "Het aardryk drinkt den reegen,\n \nGeboomte drinkt den seegen\n \nDes aards. De zee\
    \ drinkt wolken,\n \nDe Son drinkt heele kolken.\n5\nSy scheppen hun verheugen,\n \nIn loutre\
    \ waater teugen.\n \nDus laat ons, reisgesellen,\n \nFlorencens reis vertellen,\n \nEn vroolik,\
    \ welgekoomen,\n10\nOok drinken, binnen Romen.\n \nMaar laaten ons de traanen\n \nVan Bromius\
    \ Albaanen,\n \nHeel suiver syn geschonken,\n \nEn lustigh uitgedronken.\n15\nAi wil den\
    \ wyn niet plengen,\n \nMet waater in te mengen:\n \nGelyk ghe lekkre wynen\n \nVerdorft,\
    \ by Florentynen.\n \nFalernens parssers roepen,\n20\nOm goeden wyn te hoepen.\n \nGod werd\
    \ van ons gebeeden,\n \nElk jaar, om puike sneeden,\n \nEn oovervloed van ranken,\n \nUit\
    \ velden van de Vranken.\n25\nGod hoorde die tuinieren.\n \nGod schonk ons hier, voor bieren,\n\
     \nOf glaase Fransche wynen,\n \nTopaasen, en robynen,\n \nDie oogh, en geest verquikken,\n\
    30\nMet sien, en in te slikken.\n \nDaar waater maar een plaage\n \nIs, voor de soo der\
    \ maage,\n \nEn in het brein een eevel\n \nSendt, van een swaaren neevel.\n35\nWaarom soud\
    \ ghy de wynen,\t\n\t\n \nIn waater, dan verdwynen?\n \nIk ben een waaterhaater.\n \nGod\
    \ maakte wyn van waater.\n \nDat was de feest een wonder,\n40\nEn blyder, en gesonder.\n\
     \nHier jongen, schenkt my soppen,\n \nIn onvervalschte koppen.\n \nWie loutren wyn verbastert,\n\
     \nDie heeft Gods gaaf gelastert."
- titel: Op den toenaam van Adriaan Geldhof
  dichter: Joannes Six van Chandelier
  aan: Adroaan Geldhof
  datum: 1650-1651
  locatie: Venetië, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Six ontmoette Adriaan Geldhof waarschijnlijk in Venetië, in 1650 of 1651. Six
    noemt de naam Geldhof een Vlaamschen toenaam, zodat Adriaan Geldhof van Zuidnederlandse
    origine zal zijn geweest. Hij komt, behalve in dit en in het volgende gedicht, niet nader
    ter sprake in Six' gedichten. Dit gedicht staat op p. 341-343 van de bundel Poësy.
  tekst: "O Geldhof, groot, en ryk van naam,\n \nNa uwen rykdom, en versaam\n \nVan aardsche\
    \ middlen, vraagh ik niet,\n \nMaar slechts wat deesen naam bediedt.\n5\nEen naam heeft\
    \ syn beteekeningh,\n \nIn elke taal, van eenigh dingh.\n \nVan waar of dees syn oorspronk\
    \ nam?\n \nVan u, of van veel ouder stam?\n \nMyn gissingh is, ghy erfde die.\n10\nAi segh\
    \ dan hoe, wanneer, van wie?\n \nWas iemand van uw vaaders eer,\n \nVan zoo een hofgrond\
    \ eigen heer,\n \nDie weinigh inkoops wierd betaalt,\n \nWaar van hy ryklik heeft gehaalt\n\
    15\nDe rente, als hy se weer verkocht,\n \nOm dat se was, in stad, gebrocht,\n \nMet dat\
    \ de muur wierd uitgeleit,\n \nGelyk men van veele Ynaars seit?\n \nOf was het een verdronken\
    \ grond,\n20\nWaar weinigh van te hoopen stond,\n \nTot oorloghsvoordeel ooverslykt,\n \n\
    Dat nu ontallik volk verrykt,\n \nHerdykende, met groote lust,\n \nIn vreede, langs de Vlaanderkust?\n\
    25\nOf was 't een hof die applen droegh,\n \nZoo kostlik, dat men se ooverwoegh,\n \nMet\
    \ goud, geent, van Hespers hand,\n \nIn wel geseegent boogaard land?\n \nDit kan niet weesen,\
    \ want dat geld\n30\nHad hofgeld uwen naam gespelt.\n \nOf heeft men ergens grooten schat\n\
     \nGedolven uit een aarden vat,\n \nBegraaven van een vluchtelingh,\n \nVerdreeven, door\
    \ des oorloghs klingh,\n35\nToen 't arme Neerland, dreef, in bloed,\t\n[p. 451]\t\n \nDat\
    \ Albaas honden heeft gevoedt?\n \nGelyk in Keiser Karels tyd,\n \nNa hy Granaade had bevrydt,\n\
     \nDat seeven hondert jaar gedwee,\n40\nDer Mooren dwinghlandye lee:\n \nDaar naa vondt\
    \ meenigh lukkigh man,\n \nEen goude kist, of volle kan.\n \nHeeft uwe vaader, van zulk\
    \ goud,\n \nEen wonderbaaren hof gebouwt?\n45\nAlzulken hof werd recht geseit\n \nEen geldhof,\
    \ van die geldicheit.\n \nO Geldhof, dat de Veneciaan\n \nDien Vlaamschen toenaam kon verstaan,\n\
     \nTerwyl hy zoo heeft geld van doen,\n50\nHy kreegh, op u, een sterk vermoen,\n \nVan dat\
    \ ghe vol van silver steekt,\n \nEen stof, die, tot den krygh, gebreekt.\n \nGhy liept in\
    \ huis, en hof gevaar,\n \nSchoon 't geld daar diep verschoolen waar.\n55\nIk raade u, vriend,\
    \ verruilt dat woord,\n \nEer hy zulk Neerlands leert, en hoort.\n \nHy hebbe een Geldhof,\
    \ in syn land,\n \nMaar 't koome nooit, in syn verstand."
