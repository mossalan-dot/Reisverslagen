beschrijving: Om handelsbelangen te behartigen reisde hij in 1649 naar Zuid-Europa samen met
  Abraham Grenier (1626-1660). Hij reisde naar Parijs, Toulouse en Bayonne en bezocht in Spanje
  Madrid, Cádiz en Granada. In 1650 ging hij scheep in Alicante en arriveerde in Genua, vanwaar
  hij naar Florence, Rome, Napels en Venetië trok.
