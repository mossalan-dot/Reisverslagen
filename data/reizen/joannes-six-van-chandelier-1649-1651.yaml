  beschrijving: Over deze Deense schilder heb ik geen nadere bijzonderheden kunnen vinden. Thieme-Becker
    en Hoogewerff, 1950, p. 91 kennen zijn naam alleen van deze plaats bij Six. Six zal hem
    in 1650 in Rome hebben ontmoet. Het gedichtje staat op p. 335 van zijn Poësy.
  tekst: 'Een bakker bakt van rogge, en terwe,

     

    Om leevenden te voeden, om te leeven:

     

    Ghy Bakker bakt, met konstge verwe,

     

    Om ''t leeven aan de dooden weer te geeven.'
- titel: Op het schelden van J.O. te Rome, van de schilders Virgilius gedoopt
  dichter: Joannes Six van Chandelier
  aan: Jan Ossenbeeck (ca. 1624-1674)
  datum: '1650'
  locatie: Rome, Italië
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: 'De naar Rome reizende Nederlandse schilders werden in Six'' tijd opgenomen
    in een schildersbent, een genootschap van schilders die elkaar te hulp schoten bij tegenslag
    en vooral veel tijd doorbrachten met feesten. Men werd in de bent opgenomen met een doopplechtigheid:
    de schilder kreeg een vast alias, een bijnaam. De leden van het genootschap, de zgn. ‘bentvogels’,
    voerden hun alias ook buiten Rome en signeerden hun werken er soms mee. De bent was in de
    jaren 1620-1627 tot stand gekomen en duurde voort tot 1720. Nadere gegevens over de bentvogels
    zijn te vinden in Hoogewerff, 1952. De door Six'' genoemde J.O., wiens alias ‘Virgilius’
    luidde, is door Hoogewerff gelijkgesteld met de Rotterdamse schilder Jan Ossenbeeck (± 1624-1674),
    die van 1647 tot 1655 in Rome verbleef. Later reisde hij naar Wenen, waar hij in 1670 hofschilder
    werd en in 1674 overleed. Over de gelijkstelling Ossenbeeck-Virgilius had Hoogewerff in
    1950 nog twijfel (hij kende ook een eveneens ‘Virgilius’ gebijnaamde bentvogel De Backer,
    die echter pas in 1675 in Rome verbleef), maar hij liet die varen in zijn later verschenen
    standaardwerk over de bentvogels (Hoogewerff, 1950, p. 91-92; Hoogewerff, 1952, p. 97 en
    p. 141). Het gedicht staat op p. 335-336 van Six'' Poësy.'
  tekst: 'Poeeten, seght ghe, die syn gek.

     

    Zoo ''t waar is, ''t is geen klein gebrek.

     

    Zoo is Virgiel dan gek geweest.

     

    Maar ''k weet niet dat men ''t ergens leest.

    5

    Syn wondre werken wysen uit,

     

    Dit geklik schelden weinigh sluit.

     

    Men eert, te Napels, dies een steen,

     

    Noch oover syne grafstee heen,

     

    Van sneeuwwit marmer afgesaaght,

    10

    Die een verargert grafschrift draaght.

     

    Ghy self saaght nieusgier wat men leest.

     

    Maar hebt ghy ook te naar geweest?

     

    Heeft ook een kleine vuile locht,

     

    Noch oovrigh, u, in ''t brein, gerocht?

    15

    ''t Moet weesen, want de schilderbend,

     

    Die iegliks geest, naauw wikt, en kent,

     

    Herdoopte u, met den naam Virgiel,

     

    Een schaaduw, van die groote ziel.

     

    Sy sach wis dit, of dat gebrek.

    20

    Zoo is Virgilius nu gek.

     

    Of dan een gek zoo quaalik spreekt,

     

    Wyl, vrienden, hem verstand gebreekt,

     

    Heb meely, laat den suffer gaan,

     

    Poeeten leit er weinigh aan.'
- titel: Geheim in den misbouw van Sint Pieters kerck, te Rome
  dichter: Joannes Six van Chandelier
  datum: najaar 1650
  locatie: Rome, Italië
