beschrijving: Kort verslag van een plezierreis van Arnout Hellemans Hooft naar Overijssel en
  Bentheim in Duitsland in 1652 in het gezelschap van Van Leeuwen. Hellemans Hooft trok via
  Overijssel naar Bentheim, waar hij zijn vriend Ernst Willem (1623-1693), graaf van Bentheim,
  bezocht. Hij keerde terug via Deventer en Arnhem.
