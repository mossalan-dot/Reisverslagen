manuscript: martinus-geisweit-1736-1737-hs
beschrijving: Verslag van Martinus Geisweit (1706-1787) van een reis naar Frankrijk in 1736-1737.
  Geisweit verbleef enkele maanden in Parijs om operaties bij te wonen en met verschillende
  medici en vroedvrouwen mee te lopen. Hij schreef zich in bij het stadshospitaal Hôtel Dieu
  en volgde chirurgielessen bij Henri François Le Dran (1685-1770). Het manuscript was oorspronkelijk
  waarschijnlijk bedoeld als rekeningboek.
