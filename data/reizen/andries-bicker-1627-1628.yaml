  opmerking: Hooft schrijft aan Simon van Beaumont en Andries Bicker om de benoeming van Reael
    tot gezant te Venetië te bepleiten. Hij herinnert eraan dat prins Maurits in zulke gevallen
    iemand door een van zijn secretarissen aan de Staten van Holland en de Staten-Generaal liet
    voordragen en stelt voor, dat de afgevaardigden van Amsterdam hierop bij Frederik Hendrik
    zullen aandringen, waarna Huygens bereid zou zijn een pleidooi voor Reael's benoeming te
    voeren.
  tekst: 'Aen de Heeren Beemont ende Bikker elk besonder: mutatis mutandis.*

    Ede etc oft Mijn Heere,

     

    Dat ick zoo seker gae inde goede geneghenheit uwer E tot den H. Generael Reael, is ''t geen
    mij verlejt om dus te komen vallen midden in haere besigheit over wichtigher werk. Want
    ick vertrouwe dat mij de moejte niet zal geweten werden, die ick UE maek om sijner E eenighen
    dienst te doen, noopende de zake van Venetien: in de welke men zeit dat hem de wegh sterk
    gedraejboomt wordt 8 door anderen die gaeren voorgingen. Doch word mij bericht, dat zijn
    E vijf voor ujt zoude hebben, zoo ''t zijner Vorst: Doorl: gelieven moght deselve den leden
    der Vergaederinge van Hollandt, ook daernae dien van de Generalitejt, voor te draeghen ende
    te bevelen: een wijze van begunstighen, die de laest overleden Prins Ho: ged: plagh te doen
    door ijemant sijner secretarisen. Waer op mij ingevallen is dat de Secretaris Hujghens als
    zijnde den H Reael t'' eenemael toegedaen sich van soodaenigh een plicht geschaepen waer
    vierighlijk ende met ijver te quijten, indien op zijne Vorst: Doorl: sulx als deser stadt
    te geval wert verworven, door UE ende d''andere Heeren gedeputeerden. Den selven ende voor
    al uwer E rijpe bescheidenh heb ick ''t belejdt van ''t stuk te bevelen, gelijk mij in UE
    goede gunste ende alle den almoghenden, <die>

    Mijn Heere,

    UE deughdelijke toeleggen zeghene nae wensch van

     

    Ujt Amsterdam, den

    8en Jan 1627.

    UE

    Verplichten dienstwen'
poezie:
- titel: Sur la blessure de Roy de Suède
  dichter: Simon van Beaumont
  datum: '1627'
  locatie: Polen en Zweden
  taal: Frans
  bron: Van Beaumont 1843
  link: https://books.google.nl/books?id=U5pFAAAAcAAJ&printsec=frontcover&dq=simon+beaumont+1843&hl=nl&sa=X&ved=0ahUKEwiRuY7ZiN3cAhUD2xoKHV7OAwgQ6AEIKDAA#v=onepage&q=blessure&f=false
  beschrijving: Op het ongeluk van Gustaaf II Adolf, koning van Zweden (1594-1632)
  tekst: 'Sur la blessure du Roy de Suède


    Qui faites vous, Grand Roy d''invincible courage,

    Clair Soleil eschaussant le froid Septentrion,

    De Mars, dieu guerroyant, representant l''image,

    Que ta valeur nous met en apprehension?


    Vistule, qui baignez la Polonoise rive,

    Que tu as mis à terre un gage precieux!

    Tes flots sont bienheureux que ce Monarque vive

    Sauvé d''un grand danger par la faveur des Cieux.


    Grand Prince, l''ennemy a treffailli luy mesme

    Saisi d''estonnement, et de passe frayer

    A eu le coeur glacé et le visage blesme,

    Et loue Dieu d''avoir failly ce grand malheur.


    Soldat, de qui la balle et poudre foudroyante

    A menacé ce chef August et sacresaint,

    Bien que ta volonté fust damnable et meschante

    Encor as tu bien fait qui son flancq fust attaint.


    Tous ces braves guerriers, nourris dedans les armes,

    Ont supplié leur Roy, mais de souhaits perdus,

    De ne se mesler trop es sanglantes alarmes,

    Et voyant ce malheur se trouvent esperdus.


    Coup d''honneur et bonheur, avec plus d''efficace

    Tu parleras au coeur de Grand Roy pour nous,

    Et tireras de luy, bien qu''a peine, la grace,

    Que conservant sa vie il nous conserve tus.'
