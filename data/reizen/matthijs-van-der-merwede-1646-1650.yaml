- titel: De bundel Uyt-heemsen oorlog ofte Roomse min-triomfen (1651), met circa honderdzestig
    Nederlandse gedichten geschreven in Italië, waaronder ‘Dell’istessa, & ho scritti stiversi
    fuor ch’il fine in su la sponda del Tevere, fuor’ della Porta del Popolo
  dichter: Matthijs van der Merwede
  datum: '1650'
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "Dell' Istessa, & ho scritti stiversi fuor ch'il fine in su la sponda del Tevere, fuor'\
    \ della Porta del popolo.\n \nHOE menigmael siet my den graeuwen Tyber,\n \nGaen denken,\
    \ niet op't smallen van den Iber,\n \nEn't swellen van de Seyn, wat raekt die pest aen mijn?\n\
     \nOf't scheuren van den Tams, of 'twoeden van den Rhijn.\n \nNiet op den Munt-raed van\
    \ den Roomschen Hemel;\n \nNiet op dit Visser-rijk sijn trots gewemel;\n \nNiet op der Keys'ren\
    \ schier verdwenen over-schot,\n \nEn dik niet meer als een vervallen duyve-kot;\n \nNiet\
    \ op den grooten Schutter, die sijn flitsen,\n \nMet auter-gal, en kerk-fenijn wil spitsen,\n\
     \nDie daer om hoog een Vorst en Bed'laer stelt gelijk,\n \nEn't hellend Hof benukt van\
    \ sijn verbastert Rijk;\n \nNiet hoe ik het verhit gespan wil mennen,\n \nDat my geduyrig\
    \ na de Dood doet rennen;\n \nNiet op mijn groen, en vers gesplist Bourgoenjes kruys,\n\
     \nMaer op het Kind, dat my soo vaek jaegt uytten huys;\n \nDat onse zielen noch aen een\
    \ wil knoopen,\n \nDat al te schoon is om met geld te koopen,\n \nDat mijn, gelijk ik haer,\
    \ soo geeren spreekt en siet,\n \nDat ons niet anders, als't beschrijden over-schiet.\n\
     \nMaer als ik daer mistroost koom op te vallen,\n \nDan stort ik van dees Tybers hooge\
    \ wallen,\n \nDan ben ik t'enden loop, dan staet mijn uyr-werk stil,\n \nEn 'khiet dan t'onrecht\
    \ 'tsoete Dier mijn Amaril.\n \nDoch weer te rug, en in mijn self getreden,\n \nLeg ik de\
    \ schuld, met wel-gegronde reden,\n \nOp't droevig lot, dat al mijn doen en laet' verbolgt,\n\
     \nEn waer ik swier, met helsche nijd en spijt vervolgt.\n \nEn eer ik weer ben uyt het\
    \ gras geresen,\n \nVind met mijn min een seer gelijkend wesen,\tOver het gehele werk\n\
    LANDEN\nItalië\n\n[p. 20]\t\n \nDees modderige vloed, die ik seg, met een sucht,\n \nSijt\
    \ gy schier sonder visch, mijn vlam is sonder vrucht.\n \nMaer siet, wie dat mijn ydel vyer\
    \ moet tuygen,\n \n(Dat recht noch reen, dat hard noch sacht kan buygen)\n \nDaer ik hier\
    \ leg en rhijm het ongesout geboert;\n \nDat niet begrijpt wat my het hart en oog vervoert.\n\
     \n'kWensch haer een strop, en gae met lege fuyken,\n \nEn mymrend breyn weer nae de Stad\
    \ toe duyken:\n \nDen slimmen Wachter van de Poort del popolo,\n \nDenkt, dat ik vaek mijn\
    \ Lief daer buyten leg op stroo.\n \nMaer neen, verdoolden Man en Vrouwen-dryver,\n \nGy\
    \ vond noch mond, noch grond, van desen Vyver,\n \nGy sult my noch al menigmael sien buyten\
    \ gaen,\n \nEer gy sult weten wat mijn boesem heeft gelaen."
- titel: Checha mourij, à fatto fatta Republica
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: 'Checha mourij, à fatto fatta Republica.

    Sonnetto.

     

    ''kGAE buyten Roomen aen den Tyber leggen,

     

    En seg, na veel verstroyde Min-gedachten,

     

    Sy sal niet meer in mijnen arm vernachten,

     

    ''kWil haer mijn gunst voor eeuwig op gaen seggen.

     

     

     

    Ik set mijn geyle lust by sijne stroomen,

     

    En seg, de soete vocht van mijne sprongen,

     

    Door heeten hol self uyt mijn bron gedwongen,

     

    Heeft in haer meer een bitt''ren smaek genoomen.

     

     

     

    ''tIs waer haer eer is in mijn brand verdwenen,

     

    Maer ''tis veel beter een goed inne-komen,

     

    Als in een arm en naeuw-gebrek te leven,

     

     

     

    Daer ik''t gequetst geweer heb door gedreven,

     

    Met sterk verdelg van Maechdoms viese droomen,

     

    Dat kan hy nu met winst, en woeker lenen.'
- titel: Quello che si passó colla mia Checha, nella Vignandi Papa Gjulio, fuor’ del popolo
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "Quello che si passó colla mia Checha, nella Vignadi Papa Gjulio, fuor' del popolo.\n\
     \nIk gong Paus July sijnen Lust-hof kiesen,\n \nOm van mijn wild' den smaek niet te verliesen,\n\
     \nOm dat ons minne-kies, steeds aen den disch geset,\n \nVerandering van saus sijn dert'le\
    \ lusten wet.\n \nDaer vond ik, soo mijn* Haen begon te prachen,\n \nEen plekjen dat ons\
    \ selfs scheen toe te lachen,\n \nEn nooden tot het werk, omcingeld met het Dier,\n \nDat\
    \ door Apolloos min een kroon van Keysers wier.\n \nDaer recht een steene Tafeltjen in't\
    \ midden,\n \nDen Autaer scheen om Venus aen te bidden,\n \nWaer op mijn lief geset af hellend\
    \ van de kant,\n \nVeel schoonder pronkten als den rijxten Sant van 't land.\tOver het gehele\
    \ werk\nLANDEN\nItalië\n\n\n*\nGelijkenis genomen van de Calicutse Hanen/die verlieft ofte\
    \ boos sijnde/haer selven seer opblasen en̄ aen't pronken tijen.\n[p. 33]\t\n \nMaer soo\
    \ wy effen zijn aen't binne-benen,\n \nSien wy door 'tlof de boeren stil staen lenen,\n\
     \nEn grijnen op haer spa, ik steek mijn wild' ras af,\n \nEn seg dat ik haer geern het\
    \ spit te lekken gaf.\n \nDaer gaen wy voort na het Palleys toe lopen,\n \nEn vinden al\
    \ de beste kamers open,\n \nMaer bed-steen sonder bed, doch by gebrek van brood\n \nSijn\
    \ korsten van pastey ook voor den hongers-nood:\n \n'kBeroof de deuren van't behangsel-laken,\n\
     \nEn ga daer van een bed en bulster maken;\n \nMaer schoon daer 'twapen van Colon op geborduert,\n\
     \nMijn vaste Min-colon soo veel te beter stuert,\n \n'tEn had geen val; Ik schort haer\
    \ in mijn bouten,\n \nEn ga mijn min tot swaerder last verstouten,\n \nAls immer Samson\
    \ droeg, en wandel met het Dier\n \nGeseten in mijn hand, gevest op mijn rappier.\n \nEen\
    \ stap een steek, ah! aengenaem vervoeren\n \nVan mijne bruyd uyt 'tspiën van de Boeren;\n\
     \nAls 'twerk is op sijn best klamp ik haer aen de wand;\n \nAls d'alderbesten buyt van't\
    \ oude Romer-land.\n \n'kLach met de Juffers die met sang' en danssen\n \nDen boogard-god\
    \ hier oyt gongen bekranssen,\n \nEn na ik't werk besie van desen stouten sprong,\n \nSweer\
    \ ik, dat aen Priaep noyt schoonder krans en hong.\n \n* Ik hou mijn gek met 'thangen van\
    \ de hoven,\n \nDat schier geen eenig Mensch en wil geloven,\n \nDaer ik hang in de lucht\
    \ soo wis en tastelijk,\n \nDen hof die heeft geteelt het heele Kristen-rijk.\n \nEn die\
    \ my seyd dat dese praetjes galgen,\n \nDie sal ik noch op 't lest doen water-balgen\n \n\
    Na dese galg en strop; schoon men sach als een Sant\n \nEn had 'tschijn-heyligst oog van\
    \ heel mijn Vaderland.\n \nWat Meysjen sou niet na dees' galg verlangen,\n \nDaer sy haer\
    \ aen haer eygen strop verhangen,\t*\nHorti pensiles.\n[p. 34]\t\n \nDaer 'tgallig-diefje\
    \ van het Richtertje werd baes,\n \nDaer wy zijn Beul en galg, sy strop en galgen-aes."
- titel: Dell’istessa
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "Dell' istessa.\n \nNA langen twist van re'en, en minne-tochten,\n \nVan allen achter-docht\
    \ en vrees ontvlochten,\n \nNeem ik het schemer-licht tot mijn verlore vyer,\n \nMaer neen,\
    \ een koele stond verseld het nukkend Dier.\t\n \nSy sweerd geen straet, of tempel te betreden,\n\
     \nMet 't swak gestel van hare teere leden,\n \nEn lang verstuykte voet, door Tybers hoog\
    \ versoek:\n \nWaer door ik synen loop tot in der hellen vloek.\n \nMaer 'k weet niet wat\
    \ myn muytend breyn wil dinken,\n \nIk vrees dat haer een ander quaed doet hinken,\n \n\
    Uyt gruwelijke min, en duvels vyer gebroud,\n \nOf dat een swaet verraed haer van myn kamer\
    \ houd.\n \nOm my het garen over 't hooft te snappen,\n \nEn in ontgonne maegdom te betrappen,\n\
     \nMet dwang van Houlijx-goed. neen neen, dat was te mal,\n \nNeen neen, een ouwe rat raekt\
    \ selden in de val.\n \nOf sou daer noch wat anders willen schuylen?\n \nMaer siet, daer\
    \ komt myn knecht myn sotg ontvuylen,\n \nTerwijl ik besig ben met dit verwerde lied,\n\
     \nEn seyt my, dat sy doet al wat myn min gebied,\n \nEn allen loop van vryers wil ontseggen,\n\
     \nEn mergen nacht wil in mijn leger leggen,\n \nEn haren teeren schoot, soo rijp van my\
    \ gevrijd,\n \nWil rijpen in den brand van myne rijpicheyd.\n \nHa trouwen Minne-bood! ha\
    \ blyden Engel!\n \nDit botjen schiet na myn verlaten hengel:\n \nLof heb het lokkend aes\
    \ van u vergulde tong,\n \nDie my het pad bereyd tot sulk'en konings sprong."
- titel: La mia malinconia nel Carnovale dell’anno 1650
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "La mia malinconia nel Carnovale dell' anno 1650.\n \nIK voel mijn sinnen stille staen,\n\
     \nMijn dertel rijmen is gedaen;\n \nDewijl ik mis het soete Lam,\n \nWaer van mijn Lied\
    \ sijn oorsprong nam.\n \n \n \nDe vremde greepjes van mijn pen,\n \nDie ik nu t'eenemael\
    \ ontwen,\n \nSchoon ik daer al mijn doen na stel,\n \nGetuygen een gedwonge spel,\n \n\
     \n \nSijn herd, en stijf, en ongerijmt,\n \nTerwijl al mijn gevoel beswijmt,\n \nEn't lichaem\
    \ als een peerd verstijft,\n \nDat immer-meer ter stalle blijft.\n \n \n \nNeem ik een boekjen\
    \ in de hand,\n \nDaer ik altijd vermaek in vand,\n \nDat eenig wakker Romer schreef,\n\
     \nEer hier den eersten Martyr bleef,\n \n \n \nIk vind mijn hert ver van't gesicht\n \n\
    Uyt mijn vervremde borst gelicht,\n \nIn een verwerde wildernis,\n \nDaer geen begrijp noch\
    \ reden is.\n \n \n \nBen ik ten droeven disch gegaen,\n \n'kTast mes in plaets van lepel\
    \ aen,\n \nEn met een mijmerend gelaet,\n \nVraeg ik na't sout dat voor my staet.\n \n \n\
     \nIk scherrem sonder punt te bien,\n \nIk ster-oog sonder yet te sien,\tOver het gehele\
    \ werk\nLANDEN\nItalië\n\nOver dit hoofdstuk/artikel\nDATUMS\n1650\n\nLIED\nNaar de Nederlandse\
    \ Liederenbank\n\n\n[p. 149]\t\n \nMen spreekt my aen, men vraegt my yet,\n \nIk antwoord,\
    \ en ik hoor het niet.\n \n \n \nRaek ik op straet, ik sta en sie\n \nSoo ik maer doe een\
    \ schree twee drie,\n \nEn koom weer t'huys, noch ongedaen\n \nWaerom dat ik ben uyt gegaen.\n\
     \n \n \nHet alder-kluchtigste Gelach\n \nEn bracht mijn lach noyt voor den dach;\n \nSchoon\
    \ dat ik, daer men Schilders doopt,\n \nEen Vrou sach als een Teef geknoopt.\n \n \n \n\
    Hoe gaen my al mijn dingen af!\n \nHoe loom, hoe heel, hoe flaeu, hoe laf!\n \nHoe ongesouten\
    \ is mijn praet,\n \nAls yemand die de ziel ontgaet!\n \n \n \nDat ik hem wensch, die in\
    \ mijn Land\n \nVeroorsaeckt mijn gesplisten brand,\n \nWaer door ik soo verandert ben\n\
     \nDat ik mijn selven niet en ken;\n \n \n \nEn dat ik, daer ik op mijn spond\n \nGoed Kersten\
    \ steeds een Engel vond,\n \nDaer Sinte Peters Setel is,\n \nDe Hel vind, en den Hemel mis.\n\
     \n \n \nEn dat een dert'le Klooster-kous\n \nSpeeld met het potje van mijn sous,\n \nWaer\
    \ door ik hier in druk en rou\n \nEen mag'ren Vastelavont hou."
- titel: Sonnet. Op den Tyber, ende de Dong
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "DEN⋆ droeven Tyber sach mijn alderklaerste dagen,\n \nSpijt mijnes tegenspoeds verwerde\
    \ dwerrel-winden,\n \nDaer my de klare Dong ging droeve buyen vinden,\n \nDaer't heele ....\
    \ noch wil een dag van wagen.\n \n \n \nDen Tyber sag mijn leste beste minne-vlagen,\n \n\
    De Dong sag d'eerste Son, die mijne ziel verblinde,\n \nd'Een breekt mijn minne-knoop, en\
    \ d'ander gaet mijn binden,\n \nd'Een gaet mijn naem en eer, d'ander mijn ziel ontdragen.\n\
     \n \n \nEn schoon de soete Dong in Merwens soete stroomen,\n \nHaer korte naem en loop,\
    \ maer niet haer soet gaet enden,\n \nIs't alderbitterst gift uyt sijn gebergt gekomen,\t\
    Over het gehele werk\nLANDEN\nItalië\n\n\n⋆\nDat is troebel, dik, drabbig.\n[p. 157]\t\n\
     \nMaer schoon des Tybers droevig soet in't brak belenden,\n \nEn ik een vremdling was in't\
    \ lang vervremde Romen,\n \n'k Vond daer⋆ mijn naeste bloed by die my niet en kenden.\n\
    Alle dese voor-gaende veersjes / beginnende met / door't scheyden van haer ziel &c. zijn\
    \ te Venetien gemaekt.\n \nDese volgende zijn noch te Roomen gemaekt / en overgeslagen geweest\
    \ in't copieren/ op de dood van N. vander Straten, Neerlands koopman tot Livorno, in den\
    \ schoot van sijn Lief dood gebleven.\n \nIN d'ermen van sijn Lief na d'andre Weerld te\
    \ glyen,\n \nWie kan Verstraten niet die soete straet benyen?\n \nWat ongehoorder greep\
    \ van sachten Vrouwen schoot!\n \nDaer hy het leven kreeg daer snikt hy na de dood.\t⋆\n\
    Dat is, daer ik meest na trok, en dat meest na mijn trok.\nAnder.\n \nDat hem het leven\
    \ gaf, dat stiet hem in sijn graf,\n \nO onbegrijplijk lot! wie kan u duyster gronden?\n\
     \nIk seg, hy heeft verdient, spijt Auter-byters raf,\n \nDat sijn verhuysde ziel in Venus\
    \ boesem rust,\n \nDie d'ongemeene straet van kussen heeft gevonden,\n \nEn in sijn kussen\
    \ sterft, en in sijn sterven kust.\t\nAnder.\n \nDoen vander Straten was na d'andre Weerld\
    \ gegaen,\n \nEn heel dees Weerld een gat dee in den Hemel slaen,\n \nQuam 'sWeerelds Minne-moer\
    \ strax van den Hemel af;\n \nEn vont in't geestig Dier, dat in haer boesem socht,\n \n\
    Of sy sijn zieltje daer noch ergens vinden mocht,\n \nHaer min sijn siekt, haer borst sijn\
    \ baer, haer schoot sijn graf."
- titel: Een verachting van Roomen
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "Een verachting van Roomen,\nDa dat ik drie 'f vier dagen daer geweest hadde/ ende\
    \ van sins was daer maer twee drie maenden huys te houden; zijnde die wonderlijke Stad van\
    \ sulken natuer/ dat sy u in het eerst seer mis-haegt/ maer als gy daer over-jaert hebt/\
    \ dat gy daer qualijk van daen kont geraeken.\nAen de Heer Nicelaes de Heyns te Venetien\
    \ zijnde.\n \nWAT doet den roep in vergelege Landen\n \nEen machtig vyer van wonderheden\
    \ branden\n \nVan yet dat eenigsins met re en was prijsens weerd!\n \nHoe roert dan 'tmoedig\
    \ Dier sijn sacht gestreelde steert!\n \nHoe schout het, spijt⋆ de hoog-geschoende Wijven,\n\
     \nWiens trotsen stap twee Maegden moeten stijven,\n \nHoe schout het alle ding, dat na\
    \ sijn roem wil staen\n \nMet een verachtend oog, en kleyn genoegen aen!\n \nSet nieuwen\
    \ pracht by sijn gestorte wallen\n \nTen wist nochtans van sakken noch van vallen,\n \n\
    Want selden Reyser, daer sijn wieg en Voedster stond,\n \nBy't buytelands vermaek yet te\
    \ gelijken vond,\n \nEn't rontom wonder van die verre dingen;\n \nDie mennig wakker Geest\
    \ wist door te dringen\n \nVer boven Babels top, die vremden Alchimist\n \nSijn yserachtig\
    \ Land vol gouds te blasen wist.\n \nDit vind ik, die my nimmer vind verloren\n \nIn vremden\
    \ prael te sien of aen te hooren,\n \nIn't ver-geroemde Room, daer Romels herders-lied\n\
     \nNiet eenen voed-stap van sijn eerste Boeren liet.\n \nDaer sijnen staf, na sijn verreykend\
    \ Rijken,\n \nMost voor een Boots-mans riem en netten wijken,\n \nVoor Mensche vissery,\
    \ op schrift-en Hemel-baek,\n \nEn voor dien wonderlijken crrif-sleutel raek.\t\n⋆\nd' Edel\
    \ Iuffren te Venetien.\n[p. 166]\t\n \nSoo ik die sware Hemel-sorg laet blijven,\n \nWat\
    \ vind ik veel van't moedig Room' te schrijven?\n \nLaet ik sijn hoog-gebou met Priester-pracht\
    \ belaen,\n \nEn oude beytel-konst, en geestig malen staen.\n \nHet lest werd ook in't konstig\
    \ Land gevonden,\n \nDaer't wakker Volk de vryheyt heeft ontbonden,\n \nVan d'Erf-Vorst\
    \ van haer kroon; die haer soo slecht bewaert,\n \nNa haren droeven Hol een eygen land verklaert.\n\
     \nDaer Maes, en Wael, en Rhijn te samen spoelen,\n \nEn rijk van visch, steeds ebb en vloed\
    \ gevoelen;\n \nDaer't water af-gewald staet hooger als het land,\n \nEn daer den slimmen\
    \ Boer sijn eygen gronden brand.\n \nWat anders als slik-slepend, slecht-bevaren,\n \nEn\
    \ daerom eertijds⋆ geel gedoopte baren\n \nVan Tybers smallen vloed; die op mijn kleyn gevoel;\n\
     \nWel over-schryen sou een moedig Hinnen-boel;\n \nBy't wye diep en krachten vergeleken,\n\
     \nDie Hollands dijker met sijn griend te breken,\n \nEn spae te dwingen weet; Maer vaer\
    \ ik hier op uyt,\n \n'kBeschuldig dese reys, en vind ons geld verbr...\nS. Andries van\
    \ Francesco Fiamingo, ofte Frans Kenoy van Brussel, in S. Peeters Kerk te Roomen gemaekt/\
    \ en door d'Italiaenen, ende meest Bernin sijn nydicheyd/ van plaets ende licht verandert\
    \ / dat Francesco voorn: nevens noch eenige andre affrontjes, van spije sijn sinnen / ende\
    \ daer na sijn leven kosten/ werd ook van velen gesegt dat hem d'Italiaenen, met yet in\
    \ sijn wijn te werpen/hebben simpel gemaekt.\n \nDAT herden nijd van spijticheyd dee bersten,\n\
     \nDoor wissen beytel van een Neerlands Kersten,\n \nEn d'heele Moeder-kerk met sijnen glans\
    \ bestraelt,\n \nEn wierd niet sonder re'en van sijne plaets gehaelt.\t⋆\nVidimus flavum\
    \ Tiberim retortis &c. Horat.\n[p. 167]\t\n \nSoo lang den blijden dag sijn licht quam vleyen,\n\
     \nKost daer geen In-lands hert sijn oogen spreyen,\n \nOf wierd verblixemt door sijn goddelijke\
    \ kracht,\n \nEn diep gedrongen in een schaemts verblinde nacht.\n \nMet recht daer selfs\
    \ sijn Meester 'thert liet blijven,\n \nEn door sijn vremde kracht en konst verstijven,\n\
     \nIk loof, komt immer hier de beelde-stormery,\n \nS. Peeter raekt alleen door sijnen luyster\
    \ vry.\t\nOp het selve Beeld.\n \nWaer-om aen S. Andries het minste licht gegeven,\n \n\
    In Sinte Peeters Kerk?\n \nWaer-om niet boven alle beelde-konst verheven?\n \n'tVerdoofd'\
    \ al't ander werk.\t\nNoch op't selve.\n \nSach 'toude Roomen op, het gaf een Winners wagen,\n\
     \nOm dit vergode Beeld als in triomf te dragen;\n \nEn liet Praxiteles ses Hengsten daer\
    \ voor spannen,\n \nEn al het Auter-werk,\n \nVan Sinte Peeters Kerk,\n \nAls Slaven achter't\
    \ spoor van sijne raeyen bannen,\n \nEn spijt 'tmisgunstig oog van haet en nortsen nijd,\n\
     \nHem wierdt alleen den ruymen Tempel toe-gewijd.\nAen de Heer Nicolaes Heyns dese na-volgende\
    \ verskens/ rakende den Cavaglier dal Pazzo, in't begin van mijn brandende siekte den 16.\
    \ Novemb. 1647. van Roomen op Venetien gesonden.\n \nHET ongeveynst gelaet van't vrindelijke\
    \ wesen,\n \nDat rechten Adel in sijn bly onthael doet lesen,\t\n[p. 168]\t\n \nDaer my't\
    \ verhit gedermt in't sieke leger leyt,\n \nVleyd mijn gevoelig hert met smerts vergetenheyd.\n\
     \nGelijk een Vader met mijn swaren ramp bekommert\n \nHeeft hy, mijn vremde quael met sijne\
    \ min belommert,\n \nDie my met weldaeds schult oneyndelijk bevracht,\n \nDe wijste meesters-konst\
    \ heeft voor mijn bed gebracht.\n \nU hondert dusent dank die my den weg bereyden,\n \n\
    En met beleefde pen in sijn beleeftheyd leyden,\n \nDie my doet vinden in dien vremden bloed-verwant,\n\
     \nSoo ongehoorden sorg voor mijn siek ingewant.\n \nIk wil laet my den Hemel oyt behouden\
    \ komen,\n \nDaer ik mijn eerste mem heb blijde vrucht genomen,\n \nNoch hel doen klinken,\
    \ spijt onreedlijkheyd van bloed,\n \nSijn naem aen Maes, en Wael, en Merwens klaren vloed.\n\
     \n'kWil mijn misgunstig Land doen verren Roemer weten,\n \nAls ik weer eenmael ben aen\
    \ eygen heerd geseten,\n \nDat ik aen desen⋆ Put, die staeg van gonsten brand,\n \nMeer\
    \ emmers toe-gereykt, als ginder druppels vand.\nIn mijn onuytsprekelijke pijnen uyt het\
    \ bed krom-gekropen sittende aen mijn Tafel dese volgende versk: geschr.\n \nIK breng mijn\
    \ smerten op't papier,\n \nIk wil gaen spreken van het vyer\n \nDat my het breyn doet hellen,\n\
     \nEn schrijf van't blakend ingewand,\n \nDat by een ongelukkig strand\n \n'tGescheurde\
    \ wand doet swellen.\n \n \n \nGeen dertle vlam, geen malle pijn\n \nVan min, van sacht\
    \ gevleyd venijn,\n \nVan Rosemond haer luyster,\n \nUyt laffe ledicheyt gebrout,\n \nEn\
    \ in de lucht en wind gebrout,\n \nMet stroyen band en kluyster.\t⋆\nHy hiet, als boven\
    \ geseyt, dal Pozzo, dat is van Putten.\n[p. 169]\t\n \nNeen neen, wat anders leyt'er t'huys,\n\
     \nEen ander leet, een ander kruys\n \nKomt dese leden plagen,\n \nEn dreygt te slikken\
    \ in sijn kolk;\n \nEen swertter nacht, een dikker wolk,\n \nBedroeft mijn blijde dagen.\n\
     \n \n \nGeen blik van hulp, geen schijn van gunst,\n \nAls door Aptekers droeve kunst,\n\
     \nEn onbekende kruyen,\n \nGeen oogen-swenksel sonder pijn\n \nAls met bedrog, en valssen\
    \ schijn,\n \nVan in-getoge buyen.\n \n \n \nDus met beklemde ziel en hert\n \nIn ongemeene\
    \ smert verwerd,\n \nMet hoop en vrees besprongen,\n \nSpreek ik mijn swaren Tuchter aen,\n\
     \nEn laet de stem ten Hemel gaen\n \nDaer mijne feylen hongen.\n \n \n \nDaer mijne saken\
    \ staen bepleyt,\n \nDaer, 'tgeen my nu in't kussen leyt\n \nMet traen-gekropten regen,\n\
     \nMy in mijn volle jeugdens-lamp\n \nWerd toe-gesonden desen ramp,\n \nDoor diep verhole\
    \ wegen.\n \n \n \nIk seg, waerom vergrimde Vorst\n \nNiet liever in dees sieke borst\n\
     \nEen trage koorts ontsteken,\n \nDie my de leden metter-tijd,\n \nEn door een langsaem\
    \ vyer verslijt\n \nEn niet soo straf doet breken.\t\n[p. 170]\t\n \nSen uwen grooten blixems\
    \ trots\n \nOp een verherde Heydens rots,\n \nOp rouwe laster-spitsen,\n \nEn knee mijn\
    \ week en buygsaem hert\n \nMet sijnes krachts gelijke smert,\n \nEn laet u thoorn onthitsen.\n\
     \n \n \nSoo houd mijn tong noch smeekens kracht\n \nSoo werd mijn stem voor u gewacht,\n\
     \nOm uwen lof te singen\n \nSoo mach ik hier van Tybers kant\n \nU in mijn eerste Vader-land\n\
     \nEen reyne ziel toe-bringen.\nMijnen brand wat vermindert zijnde / doch op straet komende\
    \ door beweging van't lichaem / 'tzy te voet of in de karros, weder onsteken / ende voor\
    \ den dag gekomen.\n \nVertroude hulp doet alle droefheyd weeren,\n \nEn dat noch eens een\
    \ blijde kans sal keeren\n \nNa druk en tegenspoed, die dese quael my geeft,\n \nDie in\
    \ mijn ingewand met duystre vlammen leeft,\n \nEn soo verheft dat 'talles schijnt te bersten,\n\
     \nAls ik in't giftig Room, nieusgierig Kersten,\n \nDaer eenig Martelaer wel-eer ten Hemel\
    \ voer,\n \nOf om een oud gebou mijn gaeuwe dgyen roer, &c.\nSwaerhoofdicheyd op het hedensdaegs\
    \ Roomen.\n \nDIE na't verteerend vyer van sijn verhit vergrimmen,\n \nLiet sijn verdrukte\
    \ Kerk soo hoogen top beklimmen\n \nVan sachten voorspoed; aen des graeuwen Tybers kant,\n\
     \nKan haren hoogen moed weer werpen in het sand;\t\n[p. 171]\t\n \nKan weer haer swaer\
    \ gebou in puyn en assen leggen,\n \nKan weer 'tna-latig volk sijn vaste gonst ontseggen,\n\
     \nEn al haer tempel-trots, en dertel priester-bloet,\n \nWeer stooten van sijn stoel, en\
    \ treden met de voet.\n \nHaer zijd' en guld-gewaer kan weer in sakken keeren;\n \nDat aen\
    \ Jerusalem sijn dubblen val kan leeren,\n \nHaer prachtig Auter-werk, met e'el gesteent'\
    \ geçiert,\n \nKan huysen metter tijd een giftig muer-gediert;\n \nKan wel een Trantel in\
    \ sijn blijden boesem voeyen,\n \nEn met verborgen vyer van slang en adder gloeyen,\n \n\
    In ongeboren eeuw van ongesien verderf,\n \nEn in den Hemel staen voor Turk en Mahoms erf.\n\
     \nDit geestlijk hof-gesin, dat op fluweel moet knielen,\n \nDat met sijn trotsen staet,\
    \ en hoog-geschore zielen,\n \nOok Prinsen overtreft, en Koningen beschaemt,\n \nKan wel\
    \ een swaren dag hier boven sijn geraemt.\n \nWat was't? of't gloeyend rood van haer gedrage\
    \ slepen,\n \nEens in een slechten boot quam vluchteling te schepen,\n \nMet Boots-mans\
    \ rouwe py vermangelt en vermomt;\n \nVoor eeuwig af-geschaft 'tgeen nu sijn gif verblomt?\n\
     \nWat was't? of eens den ramp in haer gestorte daken,\n \nSag Uyl en Fleer-muys sijn gehaette\
    \ nesten maken?\n \nEn datmen voor een Luyth, een lieflijk stem-gevley,\n \nMet Slang-gelisp\
    \ verselt, Nacht-ravens droef geschrey,\n \nEn Vorsch, en Pad, en Rat, en Buns, en Wesel\
    \ hoorden,\n \nEn datmen Va'er en Kind, en Min en Soogling moorden,\n \nHet smeekend aen-gesicht\
    \ in bittren daeu geweykt,\n \nAen't neer-gerukt Autaer, en laes! vergeefs bereykt,\n \n\
    En aen't omhelsde kruys een swaren balg ging rijten,\n \nEn sijne slappe vrucht flux voor\
    \ de Honden smijten,\n \nWat was't? of Krist'doms Heer en hoog-bemytert hooft,\n \nEens\
    \ voor een schou-spel wierd met bijl of kling geklooft?\n \nHoe was u 'thert te moe? dat\
    \ van de rouwe Ruyters,\n \nEn dertle Plonderaers, en ongebonde Buyters,\t\n[p. 172]\t\n\
     \nU Nonnen eerbaerheyd, u Wijfs en Dochters schoot,\n \nSelfs voor u oog, tot allen wel-lust\
    \ wierd ontbloot?\n \nWat seyt gy Roomeling? die naeu een oog kunt ly'en,\n \nDat maer een\
    \ schijn heeft van u Bed-genoot te vryen,\n \nHoe smaekten u die gal, in wraex vergeefsen\
    \ dorst,\n \nDe sabels voor de neus, de trompen op de borst?\n \nJa dese droomen niet vergeefs\
    \ aen my gegeven,\n \nKost wel in verre eeuw u prats geslacht beleven,\n \nDaer nu al-ree\
    \ den borg, die in den Hemel staet,\n \nVan slappen Gods-diensts walg, en wreeken swanger\
    \ gaet.\n \nTen zy u rechte boet, met ongeveynsde lippen,\n \nSijn swaren blixem weerd van\
    \ uwe herdste klippen,\n \nDoor leet-bewijs vermurwt, door tranen-vlied bestroomt,\n \n\
    Soo mach dien woesten ramp zijn in de wind gedroomt.\nOnser Voor-oudren Gulde Eeuw.\n \n\
    Gulde, maer Gulde sonder Gulden regen,\n \nEn lang-vergete ongeveynsde wegen;\n \nVan onser\
    \ Oudren diep verouden ouden tijd,\n \nUlang-vereeuwde eeuw werd dit Gedicht gewijdt:\n\
     \nDit rouwe lied, dees ongepronkte dingen\n \nWil ik in u verlate wijsheyd dringen,\n \n\
    En op het Auter van een groene soy of struyk\n \nTen offer brengen aen u loflijk oud-gebruyk.\n\
     \nAh! wat besat u kleynicheyd al Rijken,\n \nDoen u genoegen noch niet wist van dijken!\n\
     \nDoen Merwens kleynen loop, op sijn begraesde kant,\n \nGeen Ridder-hoven, noch gebijlde\
    \ Schouten vant;\n \nDoen sijn Besitter, ver van naem en wapen,\n \nSelf gade sloeg op d'ongeschore\
    \ Schapen,\n \nEn in het naeste bosch, door Vorst noch Graef beheert,\n \nSocht daghelijxen\
    \ brand tot sijnen blooten heert.\t\n[p. 173]\t\n \nEn wel te vrede met de wilde vruchten,\n\
     \nNiet na bedurve spijs en saussen suchten,\n \nEn sonder wisseling was altijd even graeg,\n\
     \nEn sterker als een eyk, wist van geen flaeuwe maeg.\n \nDoen d'eekel self haer honger\
    \ ging ontblooten,\n \nDoen't Swijn wel over 'sMeesters disch quam stooten,\n \nDoen hy\
    \ sijn wissen pijl maer had tot kleedings-jacht,\n \nEn met een Beere huyt den winter over\
    \ bracht.\n \nEer dat de Mee, die zijd' en wol ging drenken,\n \n'tVerbasterd oog quam met\
    \ sijn gif beschenken,\n \nEer dat de vadse tong had haen en vee gemest,\n \nEn sijnen lekkren\
    \ dorst met druyven had gelest.\n \nEer dat sijn giftig vyer 'tbordeel ging sterken,\n \n\
    En stillen moord in's Princen hoven werken,\n \nIn plaets van't klare nat, aen groene water-kant,\n\
     \nMet dorst gedronken uyt een volle holle hand.\n \nEer datmen ging Gericht en Akkers palen,\n\
     \nEn lands verderf uyt vremde Landen halen,\n \nEer dat d'ontrouwe Zee met plank en wand\
    \ bezeylt,\n \nEn sijn veranderlijken bodem was gepeylt.\n \nEer datmen wist van pleyten\
    \ of van rechten,\n \nVan't dulle stormen, en't onreedlijk vechten,\n \nEer dat een Vrouwen-schoot\
    \ had Mannen eer verkracht,\n \nEn't trotse Troyen had tot asch en puyn gebracht.\n \nEer\
    \ datmen ging met achter-denken minnen,\n \nEn Velsens moed soo wakkren wraek beginnen,\n\
     \nEer dat het prachtig lijk met beelden wierd beboudt,\n \nEn eer de naekte doot soo kostlijk\
    \ wiert berout.\n \nIn plaets van by versturven eyk te delven,\n \nEn sulken dood te speuren\
    \ in haer selven;\n \nOm dat haer vaste jeugd kreeg worm aen scheut noch blom,\n \nMaer\
    \ vielen grijs van kruyn door dorren ouderdom.\n \nEer datmen naem of daed van staet-sucht\
    \ kenden,\n \nEer datmen lere kar of koetsen menden,\t\n[p. 174]\t\n \nEer't sware Weese-bloed,\
    \ door Diefsen wrek gebraekt,\n \nHad rijke Kinders, en verdoemde Vaers gemaekt.\n \nEer\
    \ dat het eerlijk root van't Vrouwen wesen,\n \nWas meer aen haer gewaed als wang te lesen.\n\
     \nEet 't mannelijk gelaet met kleeding wierd gesocht,\n \nEn eer den swerten nijd had kling\
    \ en loop gewrocht, &c.\n \nAh! Hemel, ah! waer zijn die gulde Tijden\n \nDie my noch met\
    \ her-denken doen verblijden?\n \nMaer weer bedroeven als ik, laes! haer wesen mis,\n \n\
    En maer het minste deel van haer gelukken gis.\n \nKost ik haer eerst' onoselheyd beloopen,\n\
     \n'k Wou heel des Weerelds haet gewillig koopen,\n \nVan baet en vrinden-sucht ontfusfelt\
    \ en ontdaen,\n \nEn blijden Pelgrim na dat heylig Land toe gaen."
- titel: Wel-levens Leeringen
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "Wel-levens Leeringen.\n \nWILT gy den nijd in eygen strikken worgen,\n \nLeef wel,\
    \ en laet dan voortu Schepper sorgen,\n \nLeef wel geruste ziel, en schoon den Hemel stort,\n\
     \nDoet niemand, en voor al, u selven niet te kort, &c.\nAen de Heer Nic: Heyns, my schrijvende\
    \ om wat nieuws van Napels, van Romen op Padua gesonden.\n \nNU weder fris en uyt den band\
    \ gebroken,\n \nDie my in't sieke kussen had gedoken,\n \nTrek ik mijn flaeu gedicht sijn\
    \ lang benaeud geluyd,\n \nEn tranen swanger oog, en treurend roxken uyt.\n \nEn wilde wel\
    \ mijn lust vol op gaen boeten,\n \nIn u verdubbelt schrijven te begroeten,\n \nDat gy uyt\
    \ 'thellend school van de besluysde Brent,\n \nMy aen het geestlijk Hof, en graeuwen Tyber\
    \ sendt.\tOver het gehele werk\nLANDEN\nItalië\n\n\n[p. 175]\t\n \nMaer ik moet my tot u\
    \ versoek verlegen,\n \nEn schrijven 'tgeen nu hier een maend geschreven,\n \nDewijl mijn\
    \ heeten storm ook Dichten heeft gestrand,\n \nHangt onder verscher vrucht vergeten aen\
    \ de wand.\n \n⋆ Maer even-wel, en niet te min, en echter,\n \nGiet ik u dit door een gescheurden\
    \ trechter,\n \nEn seg dat ik geen rechte sekerheyd en tref,\n \nVan't rouw-verwerd bestier\
    \ van Napels dulle hef.\n \nd'Een houd het met 'tlaet-dunkend Lely-schuymsel,\n \n† En met\
    \ haer ydlen droom van Ibers ruymsel,\n \nVan d'aller Kristen-kroon bewaerd voor 't swakke\
    \ hooft,\n \nDat haer voor duydend breyn van alle re'en berooft;\n \nEn d'ander met den\
    \ trotsen Borrig-voerder\n \nEn 'swoedens Rijx onschuldigen boroerder,\n \nHet leeger zeils\
    \ gebroed door uyterlijken schijn,\n \nDe grooten door gewin, en Piasters sacht venijn,\n\
     \na Selfs, met door's eens en 'sanders schild en kroonen,\n \nHaer veyle zielen voor haer\
    \ deur te thoonen,\n \nDaer, door gewoonlijkheyd, schaemts, eer, en redens ban\n \n'tOnredelijke\
    \ graeu niet in bespeuren kan.\n \nd'Een seyt den Adel sal dien draey-wind splijten,\n \n\
    En d'ander hy geen stroo aen stuk' kan bijten,\n \nd Een seyt de Borgery geen toe-voer en\
    \ gebreekt,\n \nEn d'ander dat de mot haer in de dermen steekt.\t⋆\nDese woorden om te lachen\
    \ op den andren gesmeten, als ook hier beneden.\n†\nDit siet op een sekere voorsegging of\
    \ profecie, die ik te Romen gesien heb, seggende, dat desen Koning van Vrankrijk niet alleen\
    \ Monarhb van Kristenrijk, maer ook van de gansche Weereld soude worden.\na\nDe Cardinalen\
    \ en Princen te Romen, door groote pensionen, van eenige dusenden kroonen 'sjaers, houden\
    \ het met den Keyser, Spanjen, of Vrankrijk &c. tot blijk van dat, groote Wapenen van een\
    \ Mans hoochte, van die sy toe-genegen zijn boven de Poorten van haer Palleysen hangende.\n\
    [p. 176]\t\n \nEen deel dat Guyse daer sal middel vinden\n \n⋆ Om sig van sijn geëchten\
    \ schoot t'ontbinden,\n \nEen deel dat sijnen glans en sijn aen-sienlijkheyd\n \nHeeft al\
    \ haer koppens lust, en knoopens neer geleyt.\n \nDoch trouwens, evenwel, en sonder twijfel,\n\
     \nVoorwaer, nochtans, wat weet men waer den wijfel\n \nVan sijn verdraeyt gehern en laffe\
    \ ziel belend.\n \nIk scheyer uyt, en wacht na't een of't ander end."
- titel: De Pastey-bakker, naest onse deur alla Fiamma d’oro, ontrent de Post van Venetien,
    zeder het schriklijk overloopen van den Tyber, niet gebakken
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "De Pastey-bakker, naest onse deur alla Fiamma d'oro, ontrent de Post van Venetien,\
    \ zeder het schriklijk overloopen van den Tyber, niet gebakken.\nGemaekt doen ik noch niet\
    \ lange te Romen had geweest.\n \nEN was't den hoogen Tyber niet,\n \nDat onsen Buer-man\
    \ 'tbakken liet?\n \nEn dat sijn heeten oven\n \nEen ganssen stroom ging dooven?\tOver het\
    \ gehele werk\nLANDEN\nItalië\n\n[p. 186]\t\n \nNeen neen, 'ten was den Tyber niet,\n \n\
    Dat onsen Buer-man 'tbakken liet,\n \nHet was den vloed van Makkers,\n \nEn vremde Koekke-bakkers.⋆"
