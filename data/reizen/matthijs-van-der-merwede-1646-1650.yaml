  tekst: "Den Vloek van Napels en Napolitanen, hebbende niet uytmuntends onder haer gevondē\
    \ als ongeachte Fransse pokken, en zijnde in't Quartier van het Popel eens in levens-gevaer\
    \ geweest, ende in't wederkeeren na Romen, over Zee in handen van 9. Banditen, alle Napolitanen,\
    \ ontrent Nettuno, een Zee-plaetsken, op't strand' gevallen; maer door list en geluk ons\
    \ besloten verderf en dood ontkomen, in de Maend April 1649.\n \nHET Sodoms vyer moet op\
    \ haer daken storten,\n \n'tFrans niere-gif moet al haer min begorten,\n \nHaer Manne-suchtig\
    \ oog steek Kraey of Raven uyt,\n \nDen blixem sla dat schuym de brillen van de snuyt.\n\
     \nDe Dochter gae vergeven hare Moeder,\n \nDe Soon sijn Va'er, den Broeder sijnen Broeder,\n\
     \nDe Bruyd haer Bruygom, eerst met lonken aen-getast,\n \nDen liesten Knecht sijn Heer,\
    \ den besten Weerd sijn Gast.\n \nHaer manne-min zy't minst van schellem stukken,\n \nSy\
    \ moeten groeyen in haer ongelukken;\n \nEen eeuwig duyster ga verschuylen haren dach,\n\
     \nDat 't tot een mantel van haer bloed-schand dienen mach!\n \nHaer godloos bloed moet\
    \ op haer Akkers stollen,\n \nEn vers vergoten hare bronnen vollen.\n \n'kWens dat den Hemel,\
    \ swert geswollen van haer straf,\n \nAen hare Buren self een donker wesen gaf.\n \nHaer\
    \ Kroon moet stadig steygeren en vallen,\n \nGedurig storten haer volmaekte wallen,\n \n\
    Haer hooge Borgten uyt den grond staeg op-gemaekt,\n \nEn in een oogen-blik weer in den\
    \ brand geraekt,\n \nGaen dusenden in haren val versmoren,\n \nDaer toe weer andre dusenden\
    \ geboren,\n \nUyt bloed-schands swanger Echt, tot steunsel van haer straf,\n \nSteeds mogen\
    \ vloekken vyer en vlam ten Hemel af.\n \nDaer mach noyt graentjen in haer Landen wort'len,\n\
     \nDen hagel moet haer boom-gewas vermort'len,\tOver het gehele werk\nLANDEN\nItalië\n\n\
    Over dit hoofdstuk/artikel\nDATUMS\napril 1649\n\n[p. 188]\t\n \nIn 't midden van haer Stad,\
    \ spijt Weeuw en Wees gesucht,\n \nSpring Somm' of Etna uyt, en werp haer in de lucht.\n\
     \nHaer Zee mag niet als Slang en Adder baren,\n \nDaer mach noyt Vremd'ling langs haer\
    \ Oever varen,\n \n'tVervloekte strand, daer om ons leven wierd gespeelt,\n \nWensch ik,\
    \ dat haer verderf tot 'tleste oordeel teelt.\n \nHaer druyf moet van het slimste gif geswollen,\n\
     \nHaer veegen balg met dusent Beulen vollen,\n \nSy moeten stikken, in een swerten hongers-nood,\n\
     \nAen haer bebedeld, ja bemoord, beplundert brood.\n \nOf wel, behouwens slechts mijn lieste\
    \ Vrinden,\n \nHaer eygen self tot 'tleste snikje slinden.\n \n'kWensch, dat sy scheuren,\
    \ met een hongerigen tand,\n \nEn mag're wang, haer eygen rookend ingewand.\n \nAl haer\
    \ gebergt moet 'tonderst' opperst' keeren,\n \nSy moeten aen den Duvel manschap sweeren,\n\
     \nDie haer dan daedlijk in den Af-grond storten mag,\n \nDat niemand vragen derf, waer\
    \ immer Napels lag."
- titel: Op de Guglie of Piramida van Donn’ Olimpia, Swagerinne van Paus Innocent, op-gericht
    in ‘t jaer 1649. op de Piazza Navonna, veel Menschen als doen te Romen van honger stervende
  dichter: Matthijs van der Merwede
  locatie: Rome, Italië
  taal: Nederlands
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  beschrijving: over Olimpa Maidalchini (1591-1657)
  tekst: "Op de Guglie of Piramide van Donn' Olimpia, Swagerinne van Paus Innocent, op-gericht\
    \ in 't jaer 1649. op de Piazza Navonna, veel Menschen als doen te Romen van honger stervende.\n\
     \n't GEEN ons de weeld' van 't Rijk Egipten thoonden,\n \nEn het versturven Hooft wel-eer\
    \ bekroonden\n \nVan eenig machtig Heer, met vremd geschrift belaen,\n \nWaer in sijn wakkerheyd,\
    \ en vrome daden staen.\n \nDat spits daer storm noch draey-wind op kost hechten,\n \nDat\
    \ somer-lucht noch winter kon bevechten,\n \nDat sneeu, noch nevel, noch gedreven regen\
    \ sleet,\n \nNoch van den donder viel, noch van den blixem spleet,\n \nDat sal ook Vrou\
    \ Olimp' haer weeld' gaen tuygen,\n \nDie sy uyt Swagers slappicheyd ging suygen.\tOver\
    \ het gehele werk\nLANDEN\nItalië\n\nOver dit hoofdstuk/artikel\nDATUMS\n1649\n\n\n[p. 189]\t\
    \n \nEn haer gehaette macht, en maechschap dragen om,\n \nDie in soo korten tijd soo kit'lich\
    \ Spits beklom.\n \nSy wil het gronden op gekreukte schoud'ren,\n \nDie in gebrek en hongers-nood\
    \ veroud'ren,\n \nEn kuyssen sijnen mosch, met in-gekankert leet,\n \nMet Kinder-tranen,\
    \ en met Man en Voedster-sweet.\n \nSpijt herden wensch, en vloekens wervel-winden,\n \n\
    Spijt 'tswijmend rot van Krepelen en Blinden,\n \nSpijt Somer-smachten, en het vinnich Winter-weer,\n\
     \nDat in soo naeuwen nood helpt Man en Peerd ter neer.\n \nSpijt suchten-damp, en heeter\
    \ tranen buyen,\n \nSpijt klok en klepel, die de Uyt-vaert luyen,\n \nNiet van een machtig\
    \ Lijk, dat in den Tempel lag,\n \nMaer vander er men bee, die end noch uyt-komst sag.\n\
     \nDit ongeacht, dit in de wind geslagen,\n \n⋆ Wil dese Wasters vuyst de vlagge dragen\n\
     \nVan haren stillen moord, dat moet, dat salder staen,\n \nAl sou heel Romen sonder storm\
    \ te gronde gaen.\t⋆\nDewijl de Lieden te Romen seggen dat sy, of haer Moe't, een Waster\
    \ is geweest.\nSonnet Op het selve.\n \nHET spits, dat Vrou Olimp, spijt bitse Dichten,\n\
     \nSpijt Wasters vloek, en Kinders holle balgen,\n \nSpijt mor van Prinssen, die haer roof\
    \ doet walgen,\n \nSpijt Eerd, spijt Hel en Hemel, op gaet richten,\n \n \n \nGing eertijds\
    \ 'tGraf van eenig Prins verçieren,\n \nMaer nu den hongers-nood van Romen tuygen,\n \n\
    Dat noch, mijns hoops, eens bersten wil of buygen,\n \nSoo mag dit dienen om haer val te\
    \ vieren.\t\n[p. 190]\t\n \nSoo niet, soo mach men in sijn letters vinden,\n \nNa verre\
    \ ongebore bet're tijden,\n \nDat sy gansch Romen ging de keel af-snijden;\n \n \n \nMaer\
    \ beter had gedaen, met al haer Vrinden,\n \nHaer handen noyt in 't sweet van 't Volk te\
    \ steken,\n \nEn Sinte Peeters staf aen stuk' te breken."
- titel: Aen den Adel van Venetien
  dichter: Matthijs van der Merwede
  locatie: Venetië, Italië
  taal: Frans
  bron: Van der Merwede 1651
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: "Aen den Adel van Venetien.\nOp de maet van Phillis la plus part des amans, &c.\n \n\
    Belle race de Gondeliers,\n \nHors de mon gibier,\n \nCocus, poltrons,\n \nMeslez de bardasche'\
    \ & de bougerons,\n \nQue le Diable vous creve de verole,\n \nDans vos gondoles,\n \nEt\
    \ vos putains\n \nPour caleçons se chaussent de poulains.\n \n \n \nSi la terre ne vacrever,\n\
     \nVoyant vos baisers,\n \nEt vostre orgueüil\n \nEn precipice donne le Soleil,\tOver het\
    \ gehele werk\nLANDEN\nItalië\n\nOver dit hoofdstuk/artikel\nLIED\nNaar de Nederlandse Liederenbank\n\
    \n\n\n[p. 195]\t\n \nSi le ciel ne se sent de vostre crime\n \nIllustrissime,\n \nJe ne\
    \ croyray,\n \nJamais Sodome & Gomorre abismé."
- titel: Seltsaame dronkenschap, van V.M.
  dichter: Joannes Six van Chandelier (1620-1695)
  aan: Matthijs van der Merwede (ca. 1625-ca. 1677)
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/merw001uyth01_01/
  tekst: 'Seldsaame dronkenschap, van V.M.

     

    Als M - - dronken is, zoo zou hy nuchter zyn,

     

    En als hy nuchter is, zoo, seit hy, is hy dronken:

     

    Hoe dikwils als hy eens beschonken is van wyn,

     

    Zoo is hy, by gevolgh, twee daagen dan beschonken.'
- titel: Dwaasen roem
  dichter: Joannes Six van Chandelier
  aan: Matthijs van der Merwede (1613-1664)?
  datum: '1651'
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Hoogewerff, 1950, p. 90 beweert dat dit sonnet betrekking heeft op de dichter
    Matthijs van der Merwede, heer van Clootwijck (1613-1664) en met name op diens bundel Uyt-heemsen
    Oorlog, Ofte Roomse Min-triomfen van 1651. Dit is zeker niet onmogelijk, maar het stuit
    op enkele bezwaren. Van der Merwede was er, als ik afga op zijn werk, niet zozeer op uit
    overspel te plegen of sodomie te bedrijven (r. 7-8). Hij benadrukt juist dat hij daarvan
    (met name van het laatste) een afschuw heeft. Misschien heeft Six hem dus slecht gelezen
    of heeft dit sonnet niet zo direct betrekking op Van der Merwede alleen, maar meer op een
    bepaald slag Hollanders (waartoe Van der Merwede eventueel ook gerekend kan worden). Six
    kan hem in Rome niet ontmoet hebben, want Van der Merwede was in 1650 teruggekeerd in Nederland
    (vgl. over hem Dr. P.C.A. van Putte in Lexicon, 1986). Het sonnet staat op p. 46 van Six'
    Poësy.
  tekst: 'Een ander Hollands kind trek minnesieke pennen,

     

    Uit wieken van Kupyn, om syn geleschten brand,

     

    Met geilheit, en vermaak, langhs ''t geile Ausoonsche strand,

     

    Aan Vaaderlandsche jeuchd, eersuchtich te bekennen.

    5

    Een ander houde ''t klucht, zoo meenich maaghd te schennen,

     

    Syn saad te saaijen, in een algemeensaam land,

     

    Te planten hoornen, voor een eeman bittre schand,

     

    Of ''t aavrechts poortslot, met een bullans, in te rennen.

     

    Myn gansewiekje, van Minerves hand, bestiert,

    10

    Al vloogh het wyds en syds, by glomme minnevonken,

     

    Wiert nooit gesenght gelyk het reedenloos gediert.

     

    Ik acht het swyghsaam best, met deesen roem, te pronken,

     

    Dat ik myn vry gewis, en welvaard heb geviert:

     

    Nu brengh ik koeler bloed noch uitgeminde schonken.'
