beschrijving: Reisde naar Engeland in 1646 en naar Frankrijk en Italië tussen 1646 en 1650 in
  het gezelschap van Adriaen van Blijenburgh (1616-1682) en Nicolaas Heinsius (1620-1681). In
  Italië verbleef hij in het gezelschap van onder andere de Bentvueghels, Arnout Hellemans Hooft
  (1629-1680) en Reyer Anslo (1626-1669). Bij thuiskomst publiceerde hij de dichtbundels Roomsche
  Min-Triomfen (1651) en Geestelijke Minne-vlammen (1653). De eerste bundel, die libertijnse
  gedichten over seks met jonge meisjes bevatte, leidde tot veel rumoer.
