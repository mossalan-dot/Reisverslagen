beschrijving: Maakte tussen 1641 en 1644 een peregrinatio academica naar Engeland, Frankrijk,
  Italië en Zwitserland. Verbleef achtereenvolgens in Londen, Cambridge, Parijs, Lyon, Marseille,
  Florence, Rome, Napels, Venetië, Milaan en Genève. Promoveerde in Orléans in 1644.
