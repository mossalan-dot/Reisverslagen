beschrijving: Studeerde in Franeker en gaf privéles aan Willem van Haren (1626-1708), wie hij
  begeleidde tijdens diens reis naar Frankrijk tussen 1647 en 1649. Vervolgde de reis naar Italië
  en promoveerde in Padua in de geneeskunde.
