beschrijving: Werd in 1739 als buitengewoon gezant naar Napels gezonden om koning Karel VII
  (1716-1788) te feliciteren met zijn huwelijk met Maria Amalia van Saksen (1724-1760) en een
  handelsverslag te ondertekenen. Jan Teding van Berkhout (1713-1766) reisde mee.
