beschrijving: 'Ongedateerd tweede verslag van een educatiereis naar Frankrijk van Joan Huydecoper
  in 1648. De reis liep van Bordeaux naar het Loiregebied en eindigde in Saumur.


  Het eerste deel, van Amsterdam tot Genève, en de delen na het bezoek aan Lyon zijn verloren
  gegaan.'
