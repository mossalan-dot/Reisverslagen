beschrijving: In 1655 reisde hij met zijn zoon Joan (1625-1704), Joan Corver (1628-1718) en
  Pieter de Graeff (1638-1707) naar het hof van Brandenburg om te spreken over een bondgenootschap
  tegen Zweden en op te treden als peetoom bij de doop van Karel Emiel (1655-1674), keurvorst
  van Brandenburg.
