  tekst: 'Yvoore Kop, door zyn Keurvorstelyke Doorluchtigheidt Van Brandenburg gedreit, en aan
    den Ed. Heer Joan Huidekooper, Ridder, Heer van Maarseveen, &c. Gezant weegens Amsterdam,
    te Berlyn vereert.

     

    Is ''t zeeker dat de kunst een keurigh oog kan trekken? 

    Zoo geeft de Keurvorst, door dit proefstuk, keurigh stof.

    Zyn handt die ''t aardtryk, door het zwaardt, met doôn quam dekken,

    En dwingelanden dwong, verdient geen minder lof

    Door beitel, dan door kling, by die de kop beoogen.

    De kunst heeft op ''t gemoedt der menschen groote macht.

    Zoo wordt men in het school van Pallas opgetoogen,

    En in het veldt van Mars ten oorlog opgebracht.

    Door kunst en dapperheidt is alles te verkrygen.

    Twee gaaven in een Vorst zyn heilzaam voor ''t gemeen.

    Nooit kan men hooger dan door braave Vorsten stygen.

    Hy heeft de randen met geen zeegepraal besneên;

    Hier hoeft geen oorlogsroem van zyn vergoode vaadren:

    De Faam heeft ons al lang hun wapendeugdt verbreit.

    De helden pronken best in ''t veldt met lauwerblaadren.

    Zoo ziet het krygsvolk ''t loon van fiere dapperheidt.

    Eneas wierdt weleer van Helenus beschonken:

    Maar nooit met zulk een kunst als onze Maarseveen,

    Toen hem den Keurvorst zelf, een eer om meê te pronken,

    Voor d''Afgezant van ''t Y, met deeze kop verscheen.

    Laat andre giften vry met goudt en steenen praalen,

    Die door een ruwe handt gevormt zyn voor het hof;

    De roem bestaat niet in de glans van kop en schaalen.

    De kunsten zyn bywyl veel dierder dan de stof.

    Nu ziet men Maarseveen, omheint van dischgenooten,

    De kop, ten kim vol wyn, ombrengen, op ''t geluk

    Van ''t machtigh Brandenburg, tot schrik van heir en vlooten.

    Een strydbre Stam, zegt hy, verdraagt geen lastigh juk.

    Zoo leeft de schenker, door zyn gift, by dankbre menschen.

    Een Vorstelyk geschenk baart loffelyke wenschen.'
