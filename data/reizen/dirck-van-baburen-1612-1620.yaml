beschrijving: Maakte tussen 1612 en 1620 een kunstenaarsreis naar Italië, waar hij langere tijd
  in Parma en Rome verbleef. Hij was vermoedelijk een van de oprichters van de Bentvueghels.
  Zijn bijnaam was ‘Biervlieg’. Werkte onder andere voor kardinaal Scipione Borghese (1577-1633)
  en vervaardigde voor de Spaanse diplomaat Pierro Cussida het schilderwerk in de San Pietro
  in Montorio in Rome.
