beschrijving: Tussen 1621 en 1623 maakte hij een diplomatieke reis naar Engeland in het gezantschap
  van François van Aerssen van Sommelsdijk (1572-1641), Diederick Bas (1569-1637) en Hendrik
  van Tuyll van Serooskerken (1574-1627).
