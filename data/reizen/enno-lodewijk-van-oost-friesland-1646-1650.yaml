  tekst: 'Mijnheere,

    Den camerlinck van mijn soon Grave Enno Lodewijck is uyt Vranckrijck onversiens tot Aurich
    angecomen, affgesonde met brieven van den gouverneur Wangenheim die hierbij gelecht worden.
    Daerin wort geclaecht dat d’onruste in Vranckijck soo grooten onseekerheyt veroirsaeckt
    dat geen brieven offte wesselen eenen geruime tijt heerwaerts hebbe connen bestelt worden.
    Weshalver mijn soon oick t’sedert den 23 november laestleeden geen ordre offte brieven hebbe
    becomen, sulcx dat hij niet ende weete waernaer sij hem angaende sijn verblijft offte vertreck
    uyt Vranckrijck hebbe te reguleren. Versocht alsoo eigentlijcke antwoorde ende last bij
    den camerlinck noopende sijn verblijff offte vertreck om sijn saeken daernaer te schicken.
    Hierom hebbe ick een dobbel laeten maeken van alle mijn brieven op dit subject an hem gesonden,
    dewelcke den camerlinck bij hem heeft. Denselven keerende naer Vranckrijck hebbe ick gedienstich
    bevonden over Den Haye te seinden, met brieven an Sijn Hooch.t. ende aen Mijnvrouwe de Princesse
    van Orangen ende Douarière. In welcke brieven van Mijnvrouwe de Princesse ick dienstelijck
    versoucke dat de voorige resolutie alldaer genoomen om noch voor een tijt lanck in Vranckrijck
    te continueren bij rescriptie mach worden gerenoveert ende bij den camerlinck anderwaerts
    an mijn soon off den gouverneur overgesonden. Ick hebbe van gelijcken an hem geschreven
    om het advijs van Mijnheere den Prince ende van de Vrou Princesse preciselijck naer te comen,
    als mij daermeede of het niewe gelijck voor deese oick ten eenemaele conformerende.

    Dienvolgens dan versoucke ick mits deesen dat UEdele gelieve met Haer Hooch.t eens hier
    aff te spreken ende de brieven ende expetital van den camerlinck gonstich te seconderen,
    oick te bevorderen dat den camerlinck daerop anhoudende een pass bij Sijn Hooch.t mach worden
    verleent, om seeker wederom naer Vranckrijck te keeren. Ben oick seer ongerust dat den camerdiener
    door Hollant gepasseert sonder Hare Hooch. ten ende Princesse Henriette een brieff van mijnen
    soon te brengen, hebbe derhalven eene goede reprimonde aen den gouverneur geschreven. Ick
    versoucke UEdele gantsch vrientlijcken sij gelieven de affectie jegens het huys van Oost-Vrieslant
    & veerder, gelijck duslange geschiet is, te betoonen. Sich verseekert houdende dat het altoos
    met een danckbaer herte sal wederom gerecognosceert werden naer behooren. Dus ick mits deesen
    beveele in de protectie des Alderhoochsten. Gegeven op het huys tot Aurich den 20/30 martij
    1649. UEdele, freundtwillige alle Zeith, Juliane.

    P.S. De resolutie van Haer Ho. Mogh. angaende het anneemen van het executeurschap over het
    testament van wijlen mijn beminde heer ende gemael, is mij uyt Den Hage overgesonden. Ick
    ben verblijt dat sij soo wel is uytgevallen, ende hebbe reden UEdele ten alderhoochsten
    te bedancken, dat UEdele gelieft heeft in het uytwercken van deselve met raet, daet ende
    recommendatiën soo getrouwlijck t’assisteren. De courtoisie van UEdele in deesen ende bij
    ander occurentiën betoont sal ick nimmermeer mancqueren met een danckbaer herte wederom
    te verschulden.

    [Adressering] À Monsieur. Monsieur de Zuilichem, chevallier, conseillier ordinaire et secretaire
    de Son Altesse le Prince d’Orange, à La Haye.'
- verzender: Juliana van Hessen-Darmstadt (1606-1660)
