  tekst: 'Mijnheere,

    UEdele laetsmaels hier gewest sijnde is ingedachtich dat gesproken is van mijn 2 jongste
    soons, dewelkcke om verscheiden reden willen van importantie meede dienden of een ander
    bequaeme plaetse versonden te worden. Dienvolgens hebbe ick sij nu meer affgeveerdicht om
    op Haer Hooch.t advis te gaen op de Academie van Breda, waertoe sij goede addresse ende
    aenwijsinge hooch van nooden hebben. De courtoisie ende belofften van UEdele verseekeren
    mij t’eenemaele dat UEdele haer onbeswaert daerin sal assisteren, ende helpen bevorderen
    dat sij aldaer mogen ondercomen ende sooveel immers doenlijck naer haere gelegenheyt worden
    geaccommodeert. Ick blijve geobligeert sulcx bij alle occasiën om UEdele wederom te verschulden,
    deselve mits deesen beveelende in de protectie des Alderhoochsten. Gegeven op het huys tot
    Aurich, den 28 martij ouden stijls, anno 1649.

    UEdele freundtwilligen alle Zeith, Juliane.

    [Adressering] À Monsieur. Monsieur de Zuylichum, chevallier, conseillier ordinaire et secretaire
    de Son Altesse le Prince d’Orange.'
