  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Een paar dagen geleden kreeg ik het bericht, dat de Prinses Royale gestorven is; ik
    wist, dat zij ziek was, maar dacht niet, dat het gevaar zoo groot was. ‘Je fus avanthier
    ches Don Antonio Carnero, premier secretaire du Roy, luy recommander expedition de mes memoires,
    et singulierement touchant son Altesse et Madame la douariere, qui me dist que sa M.e en
    avoit pris le deuyl tout de meme qu''il avoit faict pour le duc de Closter, et quand a ceste
    pretantion, que sa M.e avoit autre intention que de donner satisfaction antiere, mais que
    le mariage de la Reyne de France et la guere contre le Portugal avoit espuise beaucoup d''argant,
    que au retour de la flote des Indes, laquelle on atand en bref, on pouvoit peut estre trouver
    quelque moien, que la somme estant tres grande, difficilimant cela se pouvoit payer tout
    d''un coup. Je luy repliqay que la dette estant juste, le retardemant du paiemant la faisoit
    ancor acroistre, que s''il plaisoit a sa M.e de faire fournir une somme asses considerable
    par provision, je croiois q''on se contenteroit estre assigne pour le reste sur quelque
    terres au Bais bas, de qoy on pouvoit convenir; il me promit d''en parler au Conseil et
    tenir l''affaire en recomendation.’ Ik zal mijn best blijven doen, een gunstig antwoord
    te krijgen, maar men weet hier van uitstellen. Misschien zouden ‘quelques persuasions essentieles
    pour quelques uns’ iets helpen.

    De Madrid, le 4 Febr. 1661.'
