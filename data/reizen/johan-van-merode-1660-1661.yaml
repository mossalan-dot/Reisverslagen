  tekst: 'Le 6 Janvier 1661.

    J''ay receu vostre premiere du 8e. decembre, et suis bien ayse que soyez à Madrid, m''imaginant
    que la correspondence doresenauant pourra estre un peu mieux reglée. Pour ce qui est du
    passé Mon Pere vous a escrit par touts les ordinaires, moy trois ou quatre fois, Monsieur
    van Leeuwen par deux, et la Soeur et Frere de Moggershil semblablement par deux ou trois
    fois; et je ne puis m''imaginer ce que peuvent estre devenues toutes ces lettres, que lon
    a tousjours envoye à Cunis pour les enfermer dans les paquets de Messieurs les Ambassadeurs,
    je pense que depuis vostre derniere depesche elles vous auront este rendues. dans une des
    miennes je vous ay escrit au large ce que j''auois fait avec Blondel qui est le plus franc
    coquin du monde. Le Sommaire en est qu''il me vint trouver il y a plus de deux mois et me
    promit de m''aller de ce pas querir vostre monstre pour ravoir la sienne, mais il n''en
    a rien fait jusques à present, et je n''ay point ouy parler de luy depuis ce temps là tellement
    que je garde encore sa monstre de cristal et la garderay jusques à ce qu''il la vienne rançonner.
    Je n''ay pas encor reçeu l''argent des livres, mais ayant fait sommer nostre homme il m''a
    promis de venir conter encore cette sepmaine. de Monnickelant il est venu pour vostre part
    153. livres qui est le reste de l''année 1660 apres que j''en eus fait bien d''instances,
    j''ay encore cet argent là soubs moy, en attendant que je reçoive celuy de vos livres, pour
    voir ce que je pourray payer de l''un et de l''autre. Le receveur de Monnickelant me promet
    dans sa lettre de nous faire toucher encore quelque argent vers Caresme prenant sur l''année
    qui court, de sorte qu''il est à present en assez bon train. La principale des nouvelles
    que nous auons icy est la grande maladie de la Princesse Royale, laquelle estant tombée
    malade de la petite verole en Angleterre, estoit encore si mal vendredy passé au soir quand
    le dernier ordinaire partit de là que lon craignoit fort pour sa vie, la petite verole ne
    sortant pas encor, et luy causant des accidents si facheux, qu''elle dit elle mesme qu''elle
    ne croyoit pas de vivre cette nuict la. doctor Freser pourtant qui est son medecin et celuy
    du Roy ne desesperoit pas encore à ce que mande Oudart. S''il venoit faute de cette Princesse
    vous pouvez vous imaginer quels grands changements cette mort entraisneroit avec elle, sans
    que je m''estende icy sur des subjects si chattouilleux dans une lettre laquelle je ne suis
    pas assuré qu''elle courra meilleure fortune que mes precedentes. J''ay fait une partie
    de vos recommendations ou vous avez desiré, et feray vos baisemains aux Demoiselles Rijckert
    quand je les verray, mais il semble que Joffrouw Margrietje ne se contentant pas de cette
    forte de caresses, pourroit bien auoir envie de se faire baiser autre chose, et ce par un
    galand qui luy a fait la cour depuis quelques mois avec grand empressement, et afin que
    scachiez le personnage, c''est le Sieur de Nieuwerkercken. Je voy grand apparence à l''affaire,
    bien que jusques à present on la desavoue fort et ferme comme de tout temps c''est la coustume.
    Monsieur Drost en veut à la cadette à ce qu''on peut juger, mais cela n''est pas encore
    si avancé comme la poursuite de l''autre. L''on parle encore bien fort de deux autres mariages
    qui sont celuy du Comte de Flodorp avec Mademoiselle Desloges, y ayant des gens qui disent
    en avoir veu les promesses signées, ce que j''ay pourtant de la peine à croire, et celuy
    de l''aisnée des Paeuwtjes avec Monsieur Wevelinckhoven, lequel je juge aussi se deuoir
    faire dans peu si ce n''est que le refus qu''il vient de remporter de la place de Conseiller
    au Conseil de Brabant, ne le recule. Cette charge est venue à vaquer par la mort du Sieur
    Panhuijsen et a este donnée au Sieur du Tour de Leyden que connoissez.

    Le Frere qui est à Paris commence à parler de s''en revenir, et au bout de quelques trois
    sepmaines ou d''un mois je croy que nous pourrons l''avoir icy, dont je ne seray pas marry
    n''ayant point de compagnie pour mon soupper qu''une vieille que sa bile et sa jaunisse
    ne rendent gueres agreable. Tout le monde vous fait saluer, entre autres la soeur de Moggershil,
    qui est derechef grosse d''enfant, faites dire une messe à l''Escurial pour son heureux
    accouchement. Adieu.'
- verzender: Christiaan Huygens (1629-1695)
