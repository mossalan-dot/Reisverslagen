  tekst: 'Ik ben er u zeer dankbaar voor, dat gij mijn zoon onder uwe hoede hebt willen nemen.
    Als het verblijf al te lang duurt - ik ken de langzaamheid der Spaansche diplomaten - is
    het misschien beter, dat hij alleen terugkeert. Ik koester wel eenige vrees voor den goeden
    afloop van uwe zending.

    10 Mart. 1661.'
