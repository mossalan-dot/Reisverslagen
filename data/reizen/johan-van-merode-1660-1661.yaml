  tekst: 'A la Haye. le 17 Febrier'' 1661.

    J''ay receu vostre lettre du 20. Janvier et une autre de quatre lignes servant de couverte
    à un poulet pour Mademoiselle Rantwyc, lequel j''ay eu soing de faire addresser chez Monsieur
    d''Amerongen, tellement que vous n''en devez plus estre en peine. Si vous persistez à vouloir
    revenir sans l''Ambassade je croy que nous nous pourrons voir dans le mois d''Avril, car
    il me semble que mon Pere n''y consentira pas mal volontiers; mais si touts ces messieurs
    les nobles plient ainsi bagage, que diable deviendra l''honneur de l''ambassade, de laquelle
    il me semble qu''elle courra les rues comme un cocq que l''on a plumé tout vif, ci ce n''est
    que d''icy l''on mande une nouvelle recreüe de noblesse pour la renforcer; aussi bien dans
    peu de jours il y aura bon nombre de gens qui ne scauront que faire, s''il est veritable
    comm'' on le donne pour asseuré, qu''on reformera vingt compagnies d''Infanterie de celles
    qui sont payées sur cette Prouince, chose dont plusjeurs personnes ne se resjouissent pas
    bien fort. L''Aymant de l''Escurial est tout à fait admirable, mais c''est tres mal fait
    à vous d''auoir obmis en vostre description de dire si pour attirer 25. ℔. de fer il estoit
    armé, ou non. d''un costé l''on diroit que si, veu le grand effort qu''il fait, et de l''autre
    l''on en pourroit doubter à cause de ce que vous dites de vostre cousteau auquel il auoit
    tant donné de force.

    Vostre colombier est encor en assez bon estat, et ses habitants en parfaite santé tant que
    j''ay peu voir dernierement quand j''y passay. Hier on fit present à Mon Pere de quatre
    Faisants blancs trois poules avec un cocq lequel est tres beau et grand, estant tout blanc
    comme de la neige et ayant ces grandes taches vermeilles autour des yeux. Le Prince Maurice
    qui va en Angleterre est arriué à Amsterdam et sera icy aujourdhuy et demain, pour attendre
    le vent favorable pour le faire passer la mer. des qu''il sera party mon Pere en donnera
    advis au Frere qui est en France pour l''aller trouver. de sorte que vous ferez bien de
    n''envoyer plus vos lettres a Paris quand vous voudrez luy escrire, mais icy pour les addresser
    là ou il sera. Vous auiez escrit à Mon Pere de prendre vostre chemin par l''Angleterre mais
    je voy qu''il n''est pas portè a cela, croyant que le plus court est le meilleur, comme
    sans doubte il vous en parlera au large. Cependant j''admire les charmes de mistris Price,
    laquelle à mon advis possede une vertu aussi attractive que l''aymant de l''Escurial et
    laquelle se fait voir en ceux lesquels s''y sont une fois frottés. Au reste il n''y a rien
    de nouveau icy si ce n''est qu'' hier fut mariée la fille de Monsieur Vet qui est des Estats
    avec un grand Zelandois nommé Munnix frere ou Cousin de ceux que vous connoissez. de l''affaire
    de Margrietje dont on disoit qu''elle retrogradoit je commence derechef à avoir bonne opinion
    et vers le mois de may je croy qu''il s''y fera quelque crise notable.

    Les nouvelles d''Angleterre vous auront desja dit sans doubte comment on pendu et mis en
    quartiers His Hignis the Lord Protector, et apres fiche sa teste triomphale au bout d''une
    perche, en compagnie de celles de Ireton et de Bradshaw. Adieu.'
