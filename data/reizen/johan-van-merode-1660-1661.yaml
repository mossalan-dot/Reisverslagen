  tekst: 'A Paris ce 18 Decembre 1660.

    Mon frere

    Vostre lettre m''a donnè d''autant plus de joye que passè peu de jours l''on a eu icy nouuelles
    que 5 navires Hollandois avoyent estè eschouez sur la coste d''Espagne. Car quoy qu''on
    asseurast que c''estoyent des navires marchands, je ne laissay pas d''apprehender pour les
    vostres qui du moins devoyent avoir endurè les mesmes tempestes, tellement que cela me fit
    souuenir de l''invention, dont une foij vous me parlastes, croyant qu''en cas de telle necessitè
    l''on s''en pourroit servir. Mais vous voyla enfin hors de danger et dans le plus beau païs
    que l''on scauroit s''imaginer. Ce sera grand dommage si parmy vostre compagnie il ne se
    rencontre quelque peintre qui vous fasse des desseings de ces hautes montagnes, et agreables
    orengeries, afin que nous en participions a vostre retour. Je suis bien aise que vous ayez
    fait la remarque touchant le mouuement du navire si peu compatible avec celuy de mes pendules.
    toutefois je voudrois bien aussi sçavoir ce qui vous en semble lors que le vent n''est que
    mediocrement fort, car encore que quelquefois parmy une tempeste l''on fut contraint de
    laisser reposer les horologes, ils pouroyent pourtant servir utilement le reste du temps.
    car en quelque lieu que l''on recommence a les faire aller on scaura par leur moyen apres
    quelque temps combien de degrez le navire aura avancè vers l''Est ou Ouest a compter du
    dit lieu, comme vous pouuez comprendre facilement. S''il y estoit arrivè quelque inconvenient
    a l''horologe qu''apporte Monsieur de Merode, ayez soin je vous prie de le redresser en
    tant que pourrez, ou bien d''instruire un peu l''horologer qui y sera employè. Cette invention
    avec celle du Systeme de Saturne et quelques autres m''ont assez fait connoistre icy, ou
    il y a quantitè de gens de toute condition qui sont curieux de belles choses, de sorte que
    je ne manque pas de visites à rendre et a recevoir. Chez Monsieur de Montmor il y a assemblee
    tous les mardis, ou l''on trouue tousjours 20 ou 30 illustres ensemble parmy lesquels il
    y a des maistres de Requestes et quelques cordons bleus. Je ne manque jamais d''y aller,
    et mesme depuis que j''en suis, l''on y comparoit, a ce qu''on dit, plus reglement. J''ay
    aussi estè quelques fois chez Monsieur Rohaut qui explique la philosophie de Monsieur Des
    Cartes, et fait des belles experiences, et la dessus des beaux raisonnements. la derniere
    fois il y eust parmy grand nombre d''auditeurs aussi quelques dames qui estudient cette
    Philosophie, lesquelles me prierent de venir a leur conference qu''elles tiennent tous les
    samedis. Je croy que ce sera quelque chose de bien plaisant que ce Senatulus, lequel je
    verray demain. Je veux bien gager qu''en toute l''Espagne vous ne scauriez trouuer rien
    de tel, quoy que les femmes y ont tout autant d''esprit qu''icy. Je me souuiens, a propos
    de cecy, de ce que nostre Jesuite Espagnol el Signor Fresneda, que j''ay rencontrè a Bruxelles,
    a voulu que je vous fisse scavoir de sa part. Il vous exhorte secundum suam sapientiam de
    vous donner garde du vin et des femmes de son paîs. Il ne tiendra qu''a vous d''en profiter.
    le dit Fresneda est a present le Confesseur du marquis de Caracena. et Monsieur d''Alamont
    le chanoine, Evesque de Ruremonde. Nos Ambassadeurs Extraordinaires qui ont estè plus d''un
    mois en cette ville, n''ont pas encore fait leur entrée, et l''on parle diversement de la
    cause de ce retardement. l''on tient pourtant que la cerimonie se fera lundy prochain. Hier
    je fus veoir Madame de Gent ou je trouuay aussi Mademoiselle Taillefer, qui autrement n''est
    plus logée la dedans, mais à la Rue St. Martin chez une dame de la connoissance de Madame
    de Flavacourt, jusques a ce que cellecy soit revenue de la campagne. Je luy lûs l''endroit
    de vostre lettre qui la concerne, dont elle se mit a rire, et nous dit quelle estoit la
    commission que Madame sa mere vous avoit donnée. Pour ce qui est de l''effect de ses charmes,
    je n''ay pas encore ouy parler ny de morts ny de blessez. les galands qui frequentent en
    l''hostel d''Hollande sont la plus part ceux qui ont autrefois passè chez nous, comme Monsieur
    de la Chastre, le Comte de Roye &c. Monsieur van Beuningen est le galand domestique, et
    assez assidu, n''ayant encore guere d''autres connoissances. Vale.

    Lepidus consul vous escrira bientost. Il est encore empeschè a sa sollicitation.'
