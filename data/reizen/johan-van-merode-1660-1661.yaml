  tekst: 'A la Haye le 18 Novembre 1660.

    Selon les apparences que vous nous donnez par vostre derniere escrite sur la coste d''Angleterre
    nous faisons estat que devez avoir mis pied à terre en Espagne il y a long temps, ce qui
    estant, les incommodités de vostre voyage sont passées et le plaisir va venir, lequel je
    vous souhaitte grand et parfait. Tout le monde se porte bien icy à la reserve de la grosse
    Cousine Zuerius laquelle a languy quelque temps d''une jaunisse ayant un teint de vray or
    bruny, mais elle s''en quasi remise et en est quitte pour y auoir laissé un peu de son lard.
    Le Seigneur Sixti s''est marié à Dantzic y ayant espousé une fille belle, de bonne maison,
    et assez accommodée mais non pas comme lon auoit publié icy au commencement. Il luy avoit
    fait l''amour durant le sejour de son oncle en cette ville, mais le pere s''y opposa alors,
    lequel estant venu à mourir alors depuis il a renoué ses intelligences par lettres et enfin
    est venu à bout de son affaire. Lampson se marie aussi dans peu de jours avec Mademoiselle
    Coeymans que vous connaissez.

    Le reste de jeusnes gens de vostre connoissance ne se dispose pas à subir le joug tant que
    je puis voir, et se contente de mener les belles à la comedie, et de leur donner le bon
    soir. Qui plus est on dit que Mademoiselle de Nieuveen est à present sans galands, Monsieur
    de Buat. partant, ou bien estant party pour la France, le pauvre Capelle estant en la mer
    mediterranée ou dans la Candie et s''efforcant d''estendre les limites de la Chrestienté,
    et Languerac ne faisant pas fort l''empressé à ce que lon dit, tellement qu''il faudra qu''elle
    songe à trouuer quelqu''autre dupe. dans le partage des biens de Monsieur Cats Sorgvliet
    est demeuré à Madame de Scornisse, avec la charge de ne le pouvoir aliener, ce qui ne s''estend
    pourtant que jusques aux enfants de ses filles exclusiuè. Mademoiselle de Nieuwveen me dit
    l''autre jour qu''elle regrettoit infiniment l''absence de son amy me priant de luy faire
    ses recommandations gelijck ick ben doende mits desen. Vous aurez desja entendu parler des
    affaires de mistris Hide et comme le duc de Yorck a pris la peine de s''accoupler charnellement
    avec elle, implevitque uterum generoso semine, dont au bout de neuf mois est sorty un joly
    petit duc. Estant en travail d''enfant, elle a declaré que l''enfant estoit au duc de Yorck,
    et de plus qu''elle estoit sa femme et qu''il y auoit mariage legitime entre eux deux, et
    lon dit qu''elle commencoit a avoir des grandes esperances pour estre reconnue pour telle.
    mais depuis on a sceu que tout cela ne sera rien, quelques uns disants qu''il est venu des
    diuerses personnes qui confessent d''auoir jouy d''elle aussi bien que ce Prince, et d''autres
    disent qu''il n''y a que Barclay seul, et qu''on fera en sorte qu''il l''espousera, et que
    le Roy fera si bien pour luy, qu''il ne se desplaira pas dans son cocuage. Le petit Blondel,
    duquel vous m''avez donne la monstre de cristal en garde me vint trouver il y a quelques
    jours avec grand empressement, me demandant si vous ne m''aviez pas laissé sa monstre et
    comme je luy dis qu''ouy, et qu''il la pouvoit rauoir en me rapportant l''autre ou bien
    60 livres au lieu dicelle, il me dit qu''il estoit bien marry de n''estre venu plus tost,
    mais qu c''auoit esté pour n''avoir pû avoir l''argent des promesses et que maintenant l''ayant
    receu il m''alloit de ce pas querir l''autre monstre et estant party la dessus il n''est
    pas revenu encore, y ayant plus de trois sepmaines qu''il me dit ces choses; en verité c''est
    un grand coquin, et en qui il ne fait pas bon se fier. Adieu, tout le monde vous salue,
    et il nous tarde fort de scavoir que soyez en terre ferme.

    Le Frere mande de Paris qu''il s''est trouvé dans une assemblée chez Monsieur de Montmor,
    ou il y avoit plus de 30 beaux esprits ensemble, dans laquelle ne fut traité autre chose
    si non an punctum geometricum sit ens revera existens, ce que Monsieur des Argues que connoissez
    ayant soustenu par un long discours, il se suscita un adversaire qui se mit a luy contredire
    avec une furie si grande qu''à touts coups il sembloit se mettre en posture de luy fauter
    au col. et autre chose ne se traita pour lors.'
