beschrijving: Kort verslag van een plezierreisje per boot naar Zeeland en de Zuidelijke Nederlanden
  van Gerard Hinlopen in 1675 in het gezelschap van Dirck Pont. Hinlopen reisde van Hoorn via
  Dordrecht naar Antwerpen. Op de terugweg bezocht hij Middelburg en Vlissingen.
