beschrijving: Reisde tussen 1649 en 1651 naar Italië, gedeeltelijk in het gezelschap van Arnout
  Hellemans Hooft (1629-1680), de dichter Reyer Anslo (1626-1669), Rombout (1620-1679) en Joannes
  Hudde (1628-1704), Blom, Ooms en zijn neef IJsbrand Kieft. Promoveerde in Padua in oktober
  1649.
