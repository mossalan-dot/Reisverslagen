beschrijving: 'Diplomatieke reis van de gedeputeerden Dirck Bas, Albert Joachimi, Johan van
  Gogh en Sweer van Haersolte wegens hun zending naar Wesel in verband met onderhandelingen
  over bemiddeling in de Kleefse geschillen tussen de keurvorst van Keulen en de markgraaf van
  Brandenburg en Palts-Nieuburg, 1614 juni 14 - 1614 juni 27


  Diplomatieke reis van de gecommitteerden Dirck Bas, Albert Joachimi, Johan van Gogh en Sweer
  van Haersolte wegens hun zending naar Xanten in verband met bemiddeling van de Republiek,
  Frankrijk en Engeland, alsmede van de geünieerde keurvorsten, vorsten en standen van het Duitse
  Rijk in een geschil over een akkoord tussen Georg Wilhelm prins van Brandenburg en Wolfgang
  Wilhelm Paltsgraaf op de Rijn en hertog van Nieuburg, 1614 november 13 - 1614 december 5'
