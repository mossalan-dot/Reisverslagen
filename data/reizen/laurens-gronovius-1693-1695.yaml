beschrijving: Verslag van een educatiereis van Laurens Gronovius naar Duitsland, Oostenrijk
  en Italie in 1693-1695. Gronovius was tutor van Andries Bicker van Swieten (1670-1696), baron
  Jacob Emmery van Wassenaar van Obdam (1672-1724), Jan Pieter Alderwerelt en Keyser uit Lüneburg.
  De reis liep van Leiden naar Duitsland, waar het gezelschap langs de Rijn naar Frankfurt en
  Neurenberg voer. Bij Innsbruck stak Gronovius de Oostenrijkse Alpen over. In Italië bezocht
  hij achtereenvolgens Venetië, de oostkust bij Rimini, Rome en Napels. In Noord-Italië reisde
  hij langs Livorno, Bologna, Genua, Turijn en Venetië. Hij stak de Alpen weer over en volgde
  tot aan Augsburg dezelfde route als eerst. De groep keerde in Augsburg oostwaarts en bezocht
  langere tijd Wenen. Vandaar keerde de groep terug via Praag, Dresden en Leipzig. Via Duitsland
  keerde de groep huiswaarts naar Leiden. Gronovius verbleef langere tijd in München (7-13 december
  1693), Venetië (24 december-7 maart 1694; 19 augustus-17 september), Rome (18 maart-20 april;
  9-26 mei), Napels (24 april-5 mei), Livorno (2-22 juni), Bologna (27 juni-2 juli), Genua (6-28
  juli), Milaan (9-16 augustus), Augsburg (30 september-6 oktober), Regensburg (9-16 oktober),
  Wenen (21 oktober-12 maart 1695) en Praag (15-23 maart).
