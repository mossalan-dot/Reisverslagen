beschrijving: Verslag van een educatiereis van Johannes Lieshoud (1628-1663) naar Duitsland,
  Oostenrijk en Italië in 1652 in het gezelschap van Nicolaas Langendeijk. Lieshoud trok van
  Amsterdam door Gelderland en volgde de Rijn tot Mainz. Hij bezocht Neurenberg en Augsburg
  en trok bij Innsbruck de Alpen over. In Italië reisde hij van Venetië via Florence naar Rome,
  waar hij meerdere maanden spendeerde en vanwaar hij een uitstapje maakte naar Napels. Hij
  bezocht Ancona aan de oostkust en trok toen opnieuw naar Florence. Het verslag eindigt in
  het dorpje Empoli. Lieshoud verbleef langere tijd in Venetië (8-17 mei 1652), Rome (30 mei-24
  augustus), Napels (28 augustus-8 september) en Florence (26 september-3 oktober).
