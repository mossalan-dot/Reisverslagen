beschrijving: Verslag van een educatiereis van Cornelis de Jonge van Ellemeet naar Frankrijk
  en Engeland in 1666-1667 in het gezelschap van neef Pieter Pieterson, Justus van der Cijs
  en (vanaf Parijs) neef Cornelis de Jonge van Oosterland (1645-1694). De Jonge van Ellemeet
  trok van Leiden naar Parijs via de Zuidelijke Nederlanden, waar hij Antwerpen en Brussel aandeed.
  Hij trok door het Loiregebied en bracht de winter door in Angers, waar hij promoveerde in
  de rechten. Hij trok zuidelijk naar Bordeaux, Toulouse en Marseile. Hij bezocht Lyon en Genève
  en keerde terug naar Parijs, waar hij vierenhalve maand verbleef. Hij ging scheep in Dieppe
  en arriveerde in Rye. Hij spendeerde twee weken in Londen en keerde terug naar huis. De Jonge
  van Ellemeet verbleef langere tijd in Parijs (9 oktober-10 november; 16 juni 1667-30 oktober),
  Saumur (21 november-4 december), Angers (7 december-14 april 1667) en Londen (6-20 november).
