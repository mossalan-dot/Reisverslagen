  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Paris ce 26 Janvier 1661.

    Mon frere

    J''ay receu vostre lettre escrite de Laredo, et depuis celle de Madrid, et n''ay encore
    respondu qu''a la premiere en quoy j''auoue qu''il y a un peu de ma faute. Mais croyez que
    j''entretiens aussi mal toutes mes autres correspondances depuis que je suis en cette ville,
    ou je ne scay quelle humeur vagabonde me chasse continuellement hors de ma chambre. J''ay
    estè tres aise d''apprendre que vous aviez heureusement passè tant de dangers et incommoditez
    du chemin. au retour vous n''en aurez pas tant. du moins je le souhaite ainsi, et que nous
    nous puissions reveoir salvi in patria. Vous m''avez fait grand plaisir de me communiquer
    vostre observation du triple arc en ciel, du quel je me fais fort de vous expliquer la cause
    apres que j''auray fait quelques experiences touchant la refraction de l''eau froide et
    chaude, car je m''imagine fermement, puis que cette Iris vous est apparue en descendant
    dans la vallee, que la pluye qui tomba dans les lieux plus bas devoit estre plus chaude
    que celle des plus elevez; que cela causa diversitè de refractions et par consequent plusieurs
    arcs. Je vous prie si vous remarquez encore quelque chose de semblable, ou generalement
    quelque nouueautè en matiere de physique ou mechanique, d''en tenir memoire, pour m''en
    faire part a vostre retour. Je fais estat de sejourner icy encore 3 ou 4 semaines pour veoir
    la foire St. Germain et quelques autres choses remarquables dont ont veut que je rende conte
    en revenant. Je pourrois faire et veoir d''avantage si j''avois un carosse a moy; mais la
    despense en est trop excessive: c''est pourquoy je me suis contentè d''acheter une chaise,
    et d''employer des porteurs lors que j''en ay a faire, c''est a dire une fois ou deux par
    jour. car d''aller a pied il n''y a pas moyen. Ie ne vous diray pas combien je fais tous
    les jours de visites et a quelles personnes, puis que vous ne les connoissez pas, si ce
    n''est ou nous avons estè autre fois ensemble, chez Monsieur le Premier, Chapelain, Menage,
    Conrart; mais il y en a tant que je n''ay pas encore pu trouuer le temps pour aller veoir
    chez elle Mademoiselle Taillefer, qui demeure maintenant avec Madame de Flavacour. Ie la
    rencontray dimanche dernier chez Madame de Gent, ou je vis aussi en mesme temps la dite
    dame qui est une petite femme desia un peu vieille, mais qui semble avoir estè belle autre
    fois. Ie fis vos baisemains à Taillefer qui nous raconta comment elle avoit estè a 2 ou
    3 bals, ce qui fait qu''elle commence a se plaire d''avantage a la vie de Paris que du commencement.

    Madame de Previgny apres avoir estè icy quelque temps a persecuter son pretendu mary, enfin
    pour se rendre plus forte, a changè de religion et obtenu par ce moyen promesse des deux
    Reines d''estre secourue dans ses affaires par leur authoritè, ce qui sans doute donnera
    bien de la peine a ce pauvre homme, et le contraindra a la fin ou a l''espouser ou a s''en
    racheter par une bonne somme. Je vous envoye avec cellecy une lettre du Cousin Zuerius,
    qui comme je croy vous escrit ce qui se passe icy parmy les jeunes gens de nostre paijs,
    car il est continuellement avec eux. c''est a dire avec Vlaerdingen Bogaert van der Nis
    et autres, et passent le temps a jouer et faire bonne chere. Entre tous Jantie van Vlaerdingen
    est plaisant, a qui j''ay veu tantost qu''il avoit carosse et chevaux, tantost un cheval
    seulement pour aller par la ville, apres une chaise, et quelques fois rien du tout, selon
    que sa bourse estoit garnie. Et maintenant elle est tout a fait vuide. Si j''avois le temps
    je vous dirois plus de particularitez. Mais vous scavez a peu pres la vie de Paris. Escrivez
    moy, je vous en supplie, ce que vous faites a Madrid, et si vous ne commencez pas a vous
    accoustumer aux choses qui vous ont chocquees d''abord, car je n''en doute pas que vous
    ne les trouuiez beaucoup plus supportables a cet heure, de mesme qu''il m''en est arrivè
    icy. Vale.'
