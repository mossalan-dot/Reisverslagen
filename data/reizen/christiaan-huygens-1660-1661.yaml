  tekst: 'Monsieur

    a Paris. 18 Febrier 1661.

    Ayant veu il y a quelque jours entre les mains de Monsieur Tevenot vostre grand amy et le
    mien la lettre qu''il venoit de recevoir de vous, dans la quelle vous me faites aussi l''honneur
    de parler de moy et de mon Systeme de Saturne avec quelque sorte d''approbation, je l''ay
    priè de souffrir que j''accompagnasse sa responce de ce peu de lignes, et que je me pusse
    servir de cette occasion pour vous tesmoigner une fois combien j''ay de veneration et de
    respect pour vostre grand merite. Il y a longtemps que j''en suis instruit et par la renommee
    universelle, et par ce que Monsieur Sluze, Monsieur Ghisoni et d''autres m''en ont appris,
    qui m''assurent tous que parmy grand nombre de rares qualitez vous possedez encore celle-cy
    d''estre l''unique a Rome et presque en toute l''Italie qui ait penetrè les plus profondes
    subtilitez des Mathematiques. Cela estant Monsieur je ne m''estonne point de ce que Son
    Altesse le Serenissime Prince Leopold se confie en vostre jugement devant tous les autres
    des productions qui sortent de son illustre academie. Mais j''ay bien suject de me rejouir
    de ce que vous ayez approuvè ces dernieres qu''il vous a voulu communiquer tout le premier
    a scavoir les doctes dissertations touchant mon dit Systeme. Il y a longtemps que j''ay
    escrit a Monseigneur Son Altesse le Prince combien je les estime et en effect elles me semblent
    confirmer si fort mon hypothese que je ne doute presque point que mesme le Sieur Eustachio
    avec le Reverend Pere Honoratus Fabri ne se soyent depuis rangè de mon costè, et que la
    response que je leur ay faite n''ayt estè superflue. Mais je ne veux pas pourtant me trop
    flatter de cette esperance, ny vous entretenir icy de nos controverses. ne m''estant proposè
    autre chose dans cette lettre que de vous demander la continuation de vostre bienveuillance,
    et si je l''ose pretendre quelque part dans vostre amitiè. C''est le plus grand bien Monsieur
    que vous puissiez m''accorder, et lequel je tascheray de reconnoistre tousjours par mes
    services quand il me viendra des occasions ou je puisse m''employer pour vous. faisant profession
    d''estre avec sinceritè et respect &c.'
