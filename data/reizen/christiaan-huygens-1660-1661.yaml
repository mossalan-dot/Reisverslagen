  tekst: 'A la Haye le 18e Novembre 1660.

    Nous avons bien ry de cette belle assemblée chez Monsieur de Montmor, et ce qui se passa
    en cette συόδα τῶν ἀλόγων lors que vous y fustes, nous crée opinion peu honorable dans l''entendement
    de ces Messieurs les Academiciens qui se donnent la patience d''entendre jaser des pedants
    des heures entieres sur des subjets de neant, à dire ce que j''en croy il me semble que
    ces Messieurs de Florence valent mieux que ces Parisiens de beaucoup et traitent les choses
    avec prevoyance et retenue. Il n''y a rien de nouveau icy pour vous en faire part. Messieurs
    les Estats commencent à s''assembler, et nous verrons bien tost s''ils se resoudront à combiner
    les compagnies vaquantes, ce qui feroit mourir quantité de pauvres diables, qui n''ont autre
    chose au monde pour subsister que ce que leurs charges leur donnent. les lettres et les
    personnes qui viennent d''Angleterre donnent des tout autres advis touchant les affaires
    de mistris Hide, de laquelle les grandes et vaines esperances vont tousjours en diminuant;
    les uns disent que depuis son accouchement, diverses autres personnes ont advoué d''avoir
    jouy d''elle aussi bien que le duc de Yorck, et que sa mauvaise vie est entierement auerée;
    d''autres rapportent que Barclay seul auroit confessé cela, et partant qu''on la luy fera
    espouser, et que le Roy luy fera des auantages qui luy rendront son cocuage supportable,
    enfin on verra bien tost ce qui en doit arriuer. Bruno est icy derechef apres avoir fait
    quelque temps la vie avec Hereboord a Leyden. Estant la dimanche passé, il sit des vers
    pour le jour de naissance de son Altesse. Le Prince fut traitté ce jour la du Magistrat
    de la Ville au Doelen, vers lequel il se transporta avec ses vers pour les aller presenter
    luy mesine en personne, mais les soldats qu''on auoit mis aux portes luy disputant l''entrée
    il s''assit la tout devant eux et tirant son escritoire de sa poche mit ses vers dans une
    couverte de papier, y fit une adresse à un des Bourgemaistres, et pria quelquun des gardes
    de les luy aller porter ce qu''il ne scait s''ils ont fait. Il porte deux camisoles et autant
    de caleçons de laine soubs ses habits, et par dessus une casaque de drap doublée de peau
    de renard qui luy touche au jarret, et un bon manteau par dessus le tout, tellement qu''il
    est gros comme un ours et ne scauroit quasi se remuer. Le Baillif de Beyerlandt frere de
    Mademoiselle Casembroot a esté suspendu de sa charge, il semble qu''on luy veueille encore
    imputer les mesmes crimes de concussions adulteres et choses semblables pour lesquelles
    il fut mis prisonier il y a quelque temps. Si on luy oste sa charge on dit qu''elle pourroit
    bien estre pour le Ruart de Putten frere du Pensionaire, lequel a esté commis des la suspension
    de l''autre pour l''exercer durant icelle. Je vous prie d''auoir soing de mon Giouanni Baglione,
    et de faire en sorte que vous le trouviez. Adieu.

    J''ai trocqué mon livre de Callot pour une bonne quantité de desseins que vous verrez à
    vostre retour avec un peintre d''icy nommé vander Does. mais comme ce livre n''est pas fort
    complet, je me suis chargé de vous prier de regarder à Paris si lon y pourroit recouvrer
    quelques pieces dont il manque. Ie vous envoye donc une liste de ces pieces, et vous prie
    d''aller un peu chez Israel Hernichet qui de mon temps avoit la plus part des planches de
    Callot, et de scavoir de luy, quelles pieçes il a de celles qui sont specifiées dans ma
    liste, et de mettre aupres à quel prix il les vend, pour me renvoyer apres la liste, afin
    que je puisse choisir les quelles je pourrois faire achepter. car pourveu que j''en fournisse
    quelques unes cela suffira. Je vous prie bien fort de faire cecy comme je le desire et le
    plus tost que faire se pourra. car je serois marry que mon marché se rompit. Je croy que
    vous trouverez peu de ces choses, d''autant qu''elles sont des plus rares.'
- verzender: Constantijn Huygens jr. (1628-1697)
