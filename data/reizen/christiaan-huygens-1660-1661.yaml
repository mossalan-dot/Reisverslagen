  tekst: 'Lundy apres disné.

    Vous aués bien du croire que je me portois mal puis que je nestois pas allé ches vous receuoir
    vos ordres auant vostre depart et vous demander la continuation de vostre amitié qui m''est
    si vtile et si agreable. Je suis encore detenu aujourdhuy a la chambre et je ne scay encore
    si je pourray sortir demain par la bizarrerie de mon incommodité. Mais si vous demeures
    encore icy quatre ou cinq jours j''iray vous rendre vn si juste deuoir et vous embrassant
    vous souhaitter vn heureux voyage. Cependant songes vn peu a ce que vous me voudrés commander
    et me croyes tousjours tout a vous'
