  tekst: 'A Paris ce 26 Novembre 1660.

    Les jours sont si courts et j''ay tant de choses a faire que je n''ay pas encore eu le loisir
    de veoir Nanteuil ni Israel, pour m''informer touchant ce que vous desirez scavoir des tailles
    douces. Mesme je croy qu''il faudra garder le logis pour quelques jours, pour me guerir
    du rheume qui m''incommode depuis que je suis icy. Je veux esperer que vous aurez trocquè
    vostre livre de Callot sans perte, toutefois je nescay comment vous pouvez resoudre a vous
    defaire d''un si bel ouurage. Je me souuiens qu''encore dans ma derniere lettre j''ay oubliè
    a vous parler des hauteschausses et des rabats. voicy donc en recompense depuis la teste
    jusqu''aux pieds ce qui est de la mode. On porte des chapeaux un peu plus hauts et pointus
    que chez nous et les bords plus estroits. les cheveux tousjours longs. les rabats mediocres
    et vous n''avez que faire d''aggrandir ceux que vous avez. les manchettes doubles et simples.
    les pourpoints plus courts que cydevant, et un peu coupez par devant afin de se tenir plus
    ouverts. les manches courtes avec des rubans horsmis par embas, afin qu''il ne se graissent
    pas dans les plats. les hauteschausses de la longueur accoutumée, larges de 3½ aunes des
    nostres chasque jambe, ou bien 3 seulement car on commence a retrograder. point passez avec
    un ruban par embas. et 16 ou 18 neuds a chasque costè. des canons j''en ay dit dans une
    autre lettre. les souliers sont de bonne forme comme on les fait a la Haye, quoy qu''il
    y en ait icy qui les portent fort larges par devant, mais a la Cour on ne le fait pas. l''on
    porte des manteaux et des casaques. Voila tout si je ne me trompe, mais l''on attend tous
    les jours une reforme tresgrande aux habits, qui viendra de la Cour. et l''on croit que
    peut estre ce sera un composè de la mode Espagnole et Francoise. de sorte qu''il sera beau
    nous veoir avecques des manches pendantes par derriere, et des hautechausses en pointe,
    comme le roy en avoit mis il y a quelques jours.

    Je voy que Bruno continue tousjours dans ses actions heroiques. assurement il s''en va tout
    droit aux petites maisons.

    Dans la premiere gazette hollandoise qui vint icy depuis que j''y suis, il y avoit un advertissement
    a la sin, qu''a Amsterdam l''on fabriquoit des horologes, qu''il n''estoit besoin de jamais
    remonter. Je voudrois bien scavoir si vous n''en avez pas oüy parler, et ce que ce pourroit
    estre. Pour les mienes il y a icy 3 ou 4 maistres qui en font, et mesme l''on commence a
    en mettre aux clochers de quelques paroisses.

    l''on dit icy que Languerac va espouser Mademoiselle de Niveen. escrivez moy je vous prie
    ce qui en est. aussi comment se portent nos demoiselles de de là, les Aerssens, les Rijckers
    et Pauwties &c. Vale.'
- verzender: Christiaan Huygens
