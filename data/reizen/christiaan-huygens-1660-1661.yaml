  tekst: 'Chr. Hugenius Nicolao Heinsio S.S.P.

    Cum primum in hanc urbem venissem atque è vestigio Capelanium nostrum adijssem, ostendit
    mihi quas a te paulo ante acceperat, quibus inter alia et de adventu meo certiorem faciebas,
    eaque insuper addebas quae nisi a studiosissimo mei atque amicissimo proficisci non poterant.
    sic etiam absentem tua me benevolentia prosequitur, imo praevenit. Ad eas vero literas nuper
    responsum quod Capelanius dederat inclusi meis ad parentem literis, nec dubito quin id acceperis,
    deque itinere a me prospere confecto fueris edoctus. Ignosces autem si per temporis angustiam
    prohibitus ipse hactenus nihil ad te scripsi. Illustrissimus Beuningius cum reliquis Oratoribus
    nostris ante dies tres huc advenit, ac confestim misit mihi fasciculos binos literarum,
    alterum a te alterum a patre meo inscriptos, promissaque Academicorum Florentinorum opuscula
    ferentes, ipsiusque Serenissimi Principis Leopoldi literas. Quantum ex Dati verbis colligo,
    eodem tempore omnia isthuc perlata fuere, sed quaedam eorum ipse perlegere voluisti, atque
    hac ratione a reliquis separata venerunt. Quantum tibi debeam qui toties jam literas Florentia
    missas ad me deferri curaveris, toties quasi meo nomine Clarissimo Dato responderis, saepe
    coram testatus sum, et ecce iterum hic testor. deinceps vero hac molestia ut spero te liberabo.
    dabo enim, quas ad Serenissimum Principem Leopoldum scripturus sum, recta hinc in Italiam
    perferendas, tum quia brevior est via, tum ut ea occasione Datum quoque compellem defungarque
    gratiarum actione, quas illi debeo sane maximas. Non aegrè feret autem vel ipse vel Princeps
    Serenissimus sero adeo me rescribere, si modo ultimas meas quas Haga discedens dedi, quibusque
    de suscipiendo mox itinere mentionem feci, recte accepit. Cappellanio salutem ut jusseras
    dixi tuo nomine, cum die martis praeterita in aedibus Monmorij una essemus, ut solemus singulis
    hebdomadis. Menagium nondum vidi, sed habebo brevi qui ad illum me deducat. Clarissimum
    Vossium quamprimum videbis, quaeso ut Brunetti nomine eum roges ut Chinicas picturas absolvi
    curet. Speraveram Beuningium illas allaturum, sed frustra ut video. de caetero salutem plurimam
    imperties tum ipsi tum alijs amicorum. Vale. Dabam Parisijs 19 Novembris 1660.

    Tabulas Graeciae Capelanus accepit.'
