  tekst: 'A Paris, ce 11 Febrier 1661.

    Je n''ay rien eu ny de mon Pere ny de vous par ce dernier ordinaire et aussi je ne vous
    escris rien. ne croyez pas pourtant que c''est pour me revencher mais par ce que je n''ay
    pas le temps de vous rien mander ayant rodè tout ce jour avec le duc de Roanes par toute
    la ville, qui vient seulement de me ramener a cet heure chez moy. Je vous ay acheté l''eventail
    de Callot et le portrait de Cosmus de Medicis pour 2 escus. voila ce que j''ay de plus important
    a vous faire scavoir. Mon Pere aura la bontè de me pardonner pour cette fois, et me fera
    bien tost scavoir comme j''espere si je dois venir en Hollande ou en Angleterre. Vale et
    ayez soin je vous prie de cette lettre a Heinsius.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
  datum: 12-04-1661
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Londres ce 12 Avril 1661.

    Je vous prie de monter a ma chambre dont j''ay donnè la clef en garde a ma Cousine. Vous
    trouverez là dans la boete qui enferme la machine de Monsieur Pascal qui est sur ma table,
    la clef du plus grand de mes 2 cabinets. l''ayant ouvert il faut encore l''ouvrir par dessus
    ou j''ay mis mes verres de la grande lunette, lesquels vous prendrez la peine s''il vous
    plait d''empacqueter dans une boete un peu forte avec du cotton ou chose semblable, et ayant
    fait la superscription a Monsieur van Hulst Secretaire de nos Ambassadeurs vous envoyerez
    cette boete par la poste si quelqu''autre occasion ne se presente. l''on m''a dit que la
    femme de Monsieur van Hoorn l''un des Ambassadeurs devoit venir bientost, mais elle sera
    peut estre desia partie. Je ne fais pas volontiers cecy de hazarder ainsi mon bon verre,
    mais apres que je me suis vantè qu''il estoit meilleur et de plus grand effect que ceux
    de 35 pieds que l''on m''a fait veoir icy, l''on ne me laisse pas en repos, et je ne seray
    pas creu a moins que l''on ne les aye comparè ensembles. Ne manquez donc pas pour quoy que
    ce soit, de me l''envoyer. J''espere que mon Pere aura receu ma derniere du 8 de ce mois
    et je m''estonne de ce que je n''ay pas receu de response a celle que j''escrivis de Calais,
    car ce dernier ordinaire ne m''a rien apportè. Je luy aurois escrit a cet heure, mais il
    faut que j''aille encore trouuer le Marquis de Montjeu pour ajuster ensemble nostre voyage
    que nous avons resolu de faire demain vers Oxfort, et il est desia tard. Je laisse icy cette
    lettre pour l''ordinaire de vendredy, ne devant estre de retour que dimanche ou samedy au
    soir au plus tost. Adieu.'
- verzender: Christiaan Huygens
