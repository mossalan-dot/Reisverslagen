  tekst: 'Vir Illustris Eruditissimeque

    Quas antehac ad Serenissimum Principem Leopoldum literas Haga Comitis dedi Vir Clarissimus
    mihique amicissimus Nicolaus Heinsius suis inclusas tibi commendavit, quem quidem saepius
    rogavi ut tum salutem tibi meo nomine adscriberet, tum et gratiarum actione pro me defungeretur,
    quas tibi summas de bere me intelligebam, ut qui toties mearum literarum Principi offerendarum
    curam subijsses; toties de rebus ijs quas mea scire intererat per eundem Heinsium certiorem
    fecisses. Nunc vero absque internuncio ipse te importunus licet adire compellor, ne per
    ambages sed recta hinc ad Serenissimum Principem literae meae perveniant, quas hisce conjunctas
    mitto. Exposui in ijs Celsitudini Suae qua de causa non citius rescripserim, tardè nimirum
    redditas mihi in hac urbe ipsius literas fuisse, deinde et dies aliquot praeterfluere me
    sivisse, invitum, sed cogente vi morbi quo vixdum huc adveniens correptus fui. De caetero
    plurimum tibi obstrictus sum Vir Eximie, quod ingeniosissimas Diatribas Dominorum Borelli
    et Magalotti ab auctoribus suis extorscris, quo mecum eas communicares. Illa vero ab omnibus
    publicè conspici merentur, quippe doctrinae atque elegantiae singularis, idque ut siat,
    in primis mea quoque referre existimo, ut nempe appareat viros subtilissimos de veritate
    hypotheseos meae circa ♄ in tantum jam nunc persuasos esse, ut operae praetium ducant de
    generatione ac materia annuli studiose inquirere, quod profecto ego in libello meo facere
    ausus non fui, non intellectis adhuc doctorum de verisimilitudine systematis mei sententijs.
    Quod si vero nunc idem illud de annulo Saturni examen aggrediar, non puto equidem melius
    quid invenire me posse ijs quae a Viris Clarissimis allata sunt, sed occurrent fortasse
    rationes aliquae, quae dubias reddant illorum opiniones; et in his quidem praecipua haec
    mihi videtur, quod sive ex vaporibus non concretis constare annulus Saturnius dicatur ut
    Borellius disputat, sive gelu duratis ut Magalotus aegrè intelligi possit cur tantum ex
    minimae latitudinis circulo Saturnus vapores exhalet, curve in altum jam sublati non latius
    aliquanto se diffundant sed annulo tenuissimo omnes contineri perseverent. Nam hunc tenuiorem
    etiam multo quam ego Academia Vestra statuit. Borellus quidem aliam quoque genesin annuli
    proponit, quasi ex sphaera vaporum pellucida ♄ ambiente, media regio tenui tractu opaca
    evaserit, subeunte eam certo halituum genere. Sed profecto non ignorat ipse quam audax licet
    ingeniosa ea sit conjectura. Idemque de congelatione illa Nobilis Magalotti mihi videtur,
    cui interim egregij experimenti historiam debeo de rarefactione aquae glaciatae. Mihi itaque
    nihil adhuc verisimilius videtur quam solidum atque opacum esse annulum Saturnium. qua materia
    vero constet et an aliquando et quo modo formam illam quam habet, nactus fuerit, de eo nihil
    quod exponere operae pretium sit adhuc in mentem venit. Scriptis porro istis ita usus sum,
    ut in literis ad Heinsium nostrum edixisti, etsi ut dixi desiderarem summopere, et de illo
    quidem praecipuè quod Academiae nomine Serenissimo Principi oblatum est, ut in lucem emittantur.
    Praeter haec aliam exercitationem quam tuae literae pollicentur avidè expecto, ac perhonorificum
    mihi duco sublimibus vestratium ingenijs scribendi materiam suppeditasse. Quid autem bonus
    Eustachius cum Fabrio rerum gerunt? de quibus nuper quidam ex amicis mihi scripsit systema
    suum duobus imo quaternis globulis eos adauxisse, et ad imitationem vestrorum Academicorum
    factitium Saturnum qui phaenomena utcunque referat ostentare. Si quid ultra inaudivisti,
    rogo te vir doctissime ut me facias certiorem megue credas

    Tui obseruantissimum Chr. Hugenium de Zulichem.'
