  tekst: "Monsieur\nJay retrouué l'extrait de la lettre ou il est parlé de la machine dont Je\
    \ vous auois promis la description. vous le trouueres joint a ces lignes.\nLon ma enuoié\
    \ d'Italie vn liure nouuellement jmprimé qui traite des lunettes et dont l'autheur a eu\
    \ grande communication auec Eustachio Diuini. Je vous laures desia enuoié si J'auois sceu\
    \ quelque voie de le pouuoir faire car Je m'imagine qu'estant dans la pensée den ecrire\
    \ vous seres bien aise de veoir tout ce qui en a esté ecrit par les autres et principalement\
    \ par vn Italien. si vous aues icy quelqu vn a qui Je le puisse donner vous mobligeres de\
    \ m'en faire scauoir l'adresse.\nL'Experience dont Je vous ay parlé ma fort bien reussy\
    \ layant faite depuis peu dans vn petit vaisseau et Je ne doute point que dans vn nauire\
    \ elle ne tira fort prontement leau qui seroit au fonds de calle mais cest vne epreuue a\
    \ faire dans vn port de mer.\nJe feray vn essay de cette composition de verre dont vous\
    \ aues la description et dans peu de jours Je vous manderay ce qui en aura reussy. J'espere\
    \ que vous me feres la grace de me faire quelque part des decouuertes que vous aures faites\
    \ en Angleterre en matieres de curiosité, vn personne de ce pays ma asseuré quils auoient\
    \ quelque conduite particuliere pour la nauigation des Indes Orientales et quils la faisoient\
    \ communement en moins de temps que les Portugais et les Hollandois.\nJe m'imagine que lon\
    \ vous aura fait veoir beaucoup d'experiences curieuses dans l'academie de Londres, que\
    \ vous aures veu Walis Wren et ce Willis qui a ecrit depuis peu de Fermentatione et lautheur\
    \ des pneumatiques nome Boyle lequel a ce que J'aprens de Monsieur Oldenbourg a diuerses\
    \ experiences de la fluidité et fermeté du nitre, des elemens &c. Je conterois pour vn grand\
    \ auantage davoir veu toutes ces belles choses auec des yeus aussy connoissans que les vostres\
    \ et de scauoir le Jugement que vous en faites. Je suis auec vne passion extreme\nMonsieur\
    \ \nVostre tres humble et tres Affectioné seruiteur, Theuenot.\nA Paris ce 7 May 1661."
