  tekst: 'Nicolaus Heinsius Christiano Hugenio Viro Nobilissimo S.P.D.

    Quanquam nihil causae erat, cur te inviderem Urbium principi Lutetiae, aut dignissimis tuo
    conspectu Celtis, laetabar tamen haud modice, cum frater tuus nuper admodum spem mihi fecit
    mox fore, ut pedem ad nos referres. Unice enim cupiebam te praesentem amplecti ante meum
    ex patria discessum. At nunc intelligo obsecutum te sententiae ac voluntati Illustris Viri
    Parentis Tui de adeunda Britanniê cogitare, priusquam patriam revisas. quem sane nuncium
    tam ingratum indigne, ne quid dissimulem, tuli, deiectus omni spe ac fraudatus maturandi
    recursûs ad nos tui, quem mihi votis flagrantissimis nuper promittebam. Vossium vero, Vir
    nobilissime, apud Britannos fore a te inveniendum, non est quod opinere: cum is suâ omnino
    arbitretur interesse, ut Reginam Christinam Aprili mense nobis adfuturam expectet ac praestoletur.
    Affirmat quippe Silvercronius, ex Suecia ante biduum redux, dubium sibi non esse, de herili
    ad Batavos nostros sub id tempus excursu. Velim equidem plurimas ob causas profectionem
    Suecicam differri a me posse in adventum Reginae, sed vix reor integrum id mihi per Proceres
    nostros fore. Florentia epistolam nuper habui, sed quae flagitaret indicem a me operum Francisci
    Vietae ineditorum, nihil praeterea contineret aut prae se ferret studiorum nostrorum, nisi
    quod Datus noster (is enim exararat epistolam) dissertationem de Saturni tui Zonâ, quam
    nuper contexuit, sperare brevi nos iubet. Bullialdum Hamburgum advenisse ex Langermanni
    literis proxime sum edoctus, qua in urbe aliquamdiu videatur haesurus. Capellanum si Beuningio
    sistes, multum me demereberis. Opinor enim homini advenae et ingeniorum maximo fautori nihil
    gratius, praestantiusque ac numeris omnibus absolutius-ostendi posse, quam hunc virum, in
    quo virtus cum elegantia atque urbanitate certat. Simultates, inter illum Menagiumque me
    invito ac nolente exortae sunt: optemque vehementer tuam operam conferre nonnihil posse
    instaurandae inter viros egregios concordiae. Menagij officijs multum debiturus est meus
    Naso, cum codices manu exaratos suppeditarit mihi nonnullos vatis optimi, quos lucubrationibus
    meis utiles atque oportunos sim expertus. Caeterum quod persuades tibi, hominem officiosum
    mea potissimum de causa tuis commodis studere, nimis profecto modeste de te sentis. cum
    nulla comitas cuiquam tanta sit, ut meritis tuis ingentibus antevertat. Audio Amstelaedamum
    appulisse fasciculum illum, in quem Commentarij de Maximis et Minimis sui exemplaria nonnulla,
    inter viros hic terrarum literatos dividenda, Vivianus congessit. Verum cum inseriptio fasciculi
    non me sed Turrianum Legati Hispanici vicinum spectet, non video, qui destinata nobis munera
    consequamur, nisi copiam eorum Turrianus nobis faciat. Vale, Vir Summe.

    Dabam Hagae Comitis. CIƆIƆCLXI. ad diem XVII. Februarii.

    Decreveram nonnihil literarum ad Capellanum nostrum his addere, sed per temporis angustias
    non licet. proxime tanto uberius ac verbosius id fiet.'
