  tekst: 'Signor Christiano Vgenio.

    Con non ordinario mio contento ho riceute, e la lettera di Vostra Signoria e la risposta
    al libretto del Diuini che ella in stampa mi há mandata. La lessi subito attentamente et
    l''hó fatta uedere a molti intendenti et tuttj unanimemente restono di essa sodisfatti,
    riconoscendo nella medesima i soliti trattj della scienza, e dell'' auuedutezza di Vostra
    Signoria, ne ió saprei dare altro giudizio sopra la di lei oppinione sopra Saturno, se non
    che a me si rappresenta per ancora cosa alcuna che repugni all'' osseruazioni che hó potuto
    fare, si come all'' incontro non posso dar perfetto giudizio dell'' oppinioni del Padre
    Fabbri, quando io per altro fussi capace (che non sono) di darlo, mentre non uengono ancora
    da esso dichiarati i periodi dei moti de i Pianetinj che egli si figura e da quanto io scrissi
    a Vostra Signoria con altra mia, e dal contenuto delle scritture che annesse a quella lei
    saranno comparse, potrà più chiaramente conoscere questi sentimenti miei, corroboratj dal
    concorso ne i meddi quelli che bene intendono di simili materie. Il Signor Carlo Dati le
    farà peruenire un cenno di un'' arbitrio che io mi son preso di fare ristampare questa sua
    risposta perche possino godere della lettura della medesima i possessori, e gl''amatori
    della virtù in queste nostre bande. Resta che Vostra Signoria si compiaccia al suo ritorno
    di Francia di arricchire il Tesoro della Republica Litteraria con nuoui parti del suo sapere,
    come ella mi accenna; Et credendo che all'' arriuo di questa possa essere in Parigi, per
    quella strada io la inuiò, con la confermazione del mio affetto parzialissimo per ogni suo
    interesse, pregandolei dal Cielo ogni uero contento

    Al Piacere di Vostra Signoria Il Principe Leopoldo.

    Di firenze. 5 Novembre 1660.'
