  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A la Haye le 17. Febrier 1661.

    Vostre derniere de l''11e. escrite du stile dont usoyent jadis ceux de Lacedemon, m''a esté
    rendue, et j''ay eu soin de celle que m''auez envoyée pour Heinsius qui me fut voir hier.
    Je vous remercie beaucoup des deux Tailledouces que m''auez acheptées, et vous prie de me
    les envoyer par le prochain ordinaire dans une lettre que pour cet effect vous pourrez faire
    de la plus grande sorte qu''il se peut. Pour les plys que les Tailledouces recevront je
    ne m''en mets nullement en peine et scay assez d''expedients pour les en oster tout a fait,
    c''est pourquoy je vous prie de ne point manquer en cecy. Je m''estonne comme vous ne dites
    rien du nouveau Comete, dont tout le monde s''emancipe à dire tout ce qui luy vient en fantasie,
    en attendant le jugement que vous en ferez, quelques uns mesmes ne luy voulant pas accorder
    le rang parmy les Cometes de marque, et disants que c''est le vieil qui parust il y a quelques
    ans, d''autres que c''est l''estoile nouvelle qui parust l''an 1572. d''autres et les plus
    foux de touts, que c''est un satellite de Venus vers ou Vossius me sembla pancher l''autre
    jour m''estant venu voir icy; tellement que vous ferez bien d''y mettre le haut là le plustost
    qu''il se pourra. Le Frere Louis nous mande par ses dernieres que jusques à ce temps là
    il n''auoit encore rien reçeu de vous dont il se plaint fort, voyez par quelle voye vous
    faites adresser vos lettres. Il parle à mon Pere de reuenir vers le mois d''Avril en cas
    qu''il le trouve bon n''y ayant point encore d''apparence que l''Ambassade revienne de quatre
    ou cinq mois et peut estre pas de tout l''esté; il auroit bien envie de reuenir par l''Angleterre,
    pour y voir couronner le Roy et aller faire la reverence a Mistris Price mais mon Pere tesmoigne
    qu''il desire de le faire revenir par le chemin le plus court, sans pourtant s''hasarder
    sur mer. Il mande encore qu''il a esté voir l''Escurial, et qu''entre plusjeurs autres choses
    rares il y a trouvé une pierre d''aymant qui ne pese que 5. ℔. et en attire 25. de fer,
    et dit qu''en ayant frotté un cousteau, plusjeurs jours apres il en pouvoit lever deux paires
    de ciseaux et une clef tout ensemble, qui vrayement est chose estrange. je voudrois qu''il
    y eust adjousté si la pierre estoit armée de fer ou point dont il ne fait aucune mention.
    Le Prince Maurice qui va en Angleterre est encores à Amsterdam mais sera icy aujourdhuy
    ou demain et dans quelques jours il s''embarquera si le vent est bon, tellement que selon
    toute apparence vostre sejour par de là ne sera gueres long; il me tarde fort de que vous
    soyez en Angleterre, quand ce ne seroit que pour voir un peu leurs grandes lunettes d''approche,
    et de quelle façon ils s''y prennent pour les faire. La Fille de Monsieur Vet qui est icy
    des Estats generaulx fut mariée icy le jour d''hier, elle espouse un grand garcon nommé
    Munnix frere ou cousin de ceux que vous connoissez. de l''affaire de Margrietje de laquelle
    on disoit l''autre jour qu''elle commencoit à retrograder, je commence derechef à auoir
    bonne opinion et je croy que vers le mois de may il y arrivera quelque crise notable. Adieu,
    n''oubliez pas mes tailledouces.'
- verzender: Constantijn Huygens jr. (1628-1697)
  ontvanger: Christiaan Huygens
  datum: 28-04-1661
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Londen
  land_ontvanger: EN
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A la Haye ce 28 Avril 1661.

    J''ay receu vostre derniere du 12me par la quelle vous me mandes d''envoyer les verres de
    vostre grande Lunette, ce que je fais maintenant, et l''aurois fait plustost, si on m''eust
    lassé faire, mais mon Pere m''a ordonné de les delivrer au Sieur Copes Resident du Monsieur
    l''Electeur, qui a promis d''en avoir soin. Je crois qu''il les envoyera par la Poste. c''est
    pourquoy je les ay accommodées dans une boette de Fer blanc. Saschant bien qu''ils ne scauroyent
    estre en seureté sans cela, car les lettres a la poste sont empacquetees en forme de balots
    a grand coups de marteau. J''espere qu''a leur arrivee vous trouverez qu''ils n''auront
    rien paty, et qu''ils serviront a rabattre la bonne opinion que les Anglois ont des leurs,
    apres quoy je crois qu''ils seront les meilleurs de toute l''Europe. Avant hier encore je
    vis Jupiter de ma senestre avec ma grande Lunette tresbien. Je n''ay que faire de vous faire
    souvenir de tout examiner qui concerne ce metier saschant bien que vous n''aurez rien oublié.
    Sur tout ne manquez pas de scavoir, ou ils trouvent du bon verre pour leurs Lunettes, et
    si on ne pourra pas lier quelque commerce pour en avoir de par dela. Je suis ravy que vous
    faites estat de revenir aussytost apres le Couronnement, pour vous entendre sur ce que vous
    aures fait d''acquisitions par dela.'
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 29-10-1660
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "Vendredy au soir.\nMonsieur\nJ'ay fait la diligence aupres de Monsieur de Monmaur,\
    \ il nous attendra demain a midy auec joye et sera rauy de vous voir et de vous embrasser.\
    \ Vous passerés donc s'il vous plaist icy demain a cette heure la pour me prendre. Je suis\
    \ sans reserue\nMonsieur \nVostre treshumble et tresobeissant seruiteur Chapelain."
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 02-11-1660
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "Mardy 2 Nouembre.\nMonsieur de Monmor ma fait scauoir quil attendra aujourdhuy Monsieur\
    \ Huggens a disner. Je le prie de me mander si sa santé luy permettra d'y venir afin que\
    \ je luy en donne auis. En ce cas il se rendra ches moy sur les onze heures et demie afin\
    \ que je luy face compagnie et luy serue de guide.\nC'est son tres humble seruiteur \nChapelain."
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 04-11-1660
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Jeudy martin 4 Nouembre.

    J''enuoye, Monsieur, apprendre des nouuelles de vostre sante et vous prier de vouloir mettre
    sous vostre enueloppe de demain la Response que je fais a nostre Amy et de bien recommander
    quon la rende auec soin a son addresse. Elle ne grossira guere vostre paquet, lequel vous
    m''enuoyerés par vostre valet afin que je le face conduire par le mien a la rue Quiquempoix
    au bureau de cette poste.

    Si vous trouués aussi a propos de menuoyer vn Exemplaire de vostre response a Eustachio
    de diuinis pour Monsieur de Monmor je le luy enuoyerois de vostre part et cela me semble
    de la bienseance.

    Quand vous visiterés Monsieur vostre Ambassadeur presses le au nom de tous les habiles curieux
    de donner enfin sa Relation des nouuelles Descouuertes au Midy. Il sen fera honneur et a
    son Païs en faisant ce present au public.

    Je suis a vous sans reserue.'
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 15-11-1660
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Ce lundy 15 Nouembre.

    Je fus tres mortisié Samedy au soir quand j''appris à mon retour la peine que vous auiés
    prise de passer ches moy deux fois l''apresdisnée. Jauois disné dehors et perdis par la
    la consolation de vous voir et de vous entretenir. Ce sera lors que le chemin sera beau
    que j''iray ches vous jouir de ce bonheur la. Cependant jespere dauoir demain la joye de
    vous embrasser ches Monsieur de Monmor ou vous verres de nouueaux Partisans de vostre merite.
    Je suis tout a vous

    Chapelain.'
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 25-01-1661
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Ce 25. Januier.

    Monsieur

    je me promettois d''auoir l''honneur de vous voir hier chez Monsieur de Monmor, mais la
    mort de sa belle fille qui luy fit tenir sa porte close me priua de cette joye et de cette
    consolation a mon grand regret. En attendant la huitaine je vous conjure de bien assurer
    Monsieur de Beuning de l''impatience que j''ay de luy rendre mes respects et de luy aller
    demander chés luy quelque part en ses bonnes graces. Sur ce que j''auois prie Monsieur Heinsius
    dagir aupres de Monsieur vostre Pere pour vous faire laisser icy pour quelque temps encore
    voicy ce que je vous voulois monstrer dans sa lettre.

    Obligés moy de mettre dans vostre paquet l''incluse pour luy et de la bien recomander. Je
    suis tout a vous.'
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 02-02-1661
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Monsieur

    j''enuoye apprendre de vos nouuelles dont je suis en peine, ne vous ayant point veu hier
    ches Monsieur de Monmor ou vous estes asses assidu et ou en attendant vn temps fauorable
    je me rens aussi volontiers pour vous y rendre mes visites. Si vous vous portes bien comme
    je le souhaite, et que vous ne soyés point engagé a quelque affaire pour cette apres disnée
    je vous enuoyeray vn carosse pour vous amener chés moy ou sera Monsieur Ampiou le Conseiller
    au Parlement dont je vous parlay dernierement pour vous y voir et vous offrir son amitié
    et son seruice et quil vous eust esté offrir chés vous si jeusse peu souffrir le carosse
    vn si long chemin en l''y accompagnant.

    Dans la mesme apres disnee nous irons ches Monsieur Hardy Conseiller au chastellet homme
    de grand nom parmy nous et qu''vne pareille incommodité que la mienne empesche de sortir
    de chés luy par quelque voye que ce soit, sans quoy il vous auroit esté chercher par lestime
    qu''il fait de vostre vertu et par la prosession quil fait d''estre Amy et seruiteur de
    Monsieur vostre Pere. Je seray rauy de vous rendre ces deux petits offices puisque je n''ay
    pas lieu ni occasion de vous en rendre de plus grands. Je ne le seray gueres moins de passer
    cette couple dheures en vostre compagnie, a la quelle je ne prefere rien. Mandes moy donc
    je vous supplie par vn billet si vous estes libre pour cette apres disnée et ne faites pas
    difficulté du carosse, dont vous pouues vser sans scrupule. Il sera ches vous incontinent
    apres deux heures. Si vous n''estes pas en estat mandés le moy aussi afin que je contremande
    ces Messieurs. Je suis tout a vous

    Chapelain.

    Ce Mecredy 2 Feurier'
- verzender: Jean Chapelain (1595-1674)
  ontvanger: Christiaan Huygens
  datum: 06-02-1661
  plaats_verzender: Parijs
  land_verzender: FR
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Dimanche 6. Feurier.

    Monsieur

    je vous conuie de la part de Monsieur Ampiou le Conseiller au Parlement auec qui nous passasmes
    Mecredy l''apres disnée, pour disner demain auec luy si vostre commodité le permet et que
    vous n''ayés point d''autre engagement. Vous en connoissés le merite aussi bien que la qualité,
    et je ne doute point que vous ne luy donniés volontiers cette complaisance où vous trouués
    vostre propre honneur. Si mon valet ne vous rencontre pas je vous prie de ne pas manquer
    a m''enuoyer demain matin sur les huit heures la response a ce billet afin que je la face
    scauoir a mon Amy et que les choses ne reçoiuent point dobstacle ni de desordre. Sil vous
    rencontre escriués moy vostre volonte par luy.

    Chapelain.'
