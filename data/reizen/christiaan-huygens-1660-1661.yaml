  tekst: 'A la Haye le 1. Decembre 1660.

    J''ay receu aujourdhuy la vostre qui me rend conte de la mode et de l''apparent changement
    qui va venir, dont je vous rends graces. du trocq que j''ay fait des plans tailledouces
    de Callot je ne me repens nullement et l''ay fait auec advis de personnes tresintelligentes
    dans cette matiere. Il y a plus de huict mois que je taschay de me defaire de ce livre par
    le moyen d''Uylenburg à Amsterdam, lequel n''en put jamais auoir plus de 50. livres et me
    le renvoya. la cause est en partie qu''il est fort defectueux y manquant plus de trente
    pieçes, partie le peu d''estime que les Curieux de par deça font des choses de Callot, lesquelles
    pourtant en leur espece sont tresbonnes. mais les choses Italiennes ont tellement la vogue
    que tout le reste n''est rien auprix d''icelles. J''ay trocqué mon dit livre à un Peintre
    d''icy nommé Vander Does qui fait bien en Animaulx, lequel se repentit du marché le mesme
    soir et dit qu''il estoit prest de me faire un tableau de quarante livres si je le voulois
    casser. dont je n''eus point d''envie. Jl le trocqua donc à Barleus contre un petit tableau
    de Poulenburg et une autre bagatelle; cestuy la l''a encore, et il en a brouillerie encore
    à present avec son beaufrere Bisschop dont le recit ne vault pas la peine. Bisschop advient
    icy touts les matins pour desseigner ces deux petites figures d''ivoire qu''a mon Pere,
    et que vous connoissez. Madame part aujourdhuy pour Cleues avec toute sa Cour et famille.
    Avant son depart il a encor esté parlé de cette place dont elle a donné une expectative
    a mon Pere, et il s''est trouvé qu''auant quelque temps elle en a donné une quasi de la
    mesme teneur a celui qui l''a pourchassée il y a long temps et que vous connoissez. Elle
    dit ne s''en estre pas souvenu quand elle nous donna la nostre, et qu''allant maintenant
    à Cleves ou ce jeune homme viendra aussi, elle taschera de faire en sorte que Monsieur l''Electeur
    luy donne quelque autre chose, et qu''alors on le fera demordre de cellecy en nostre faveur,
    chose que je crois estre pourtant subjecte a beaucoup d''accidents, il faudra voir ce qui
    en arrivera. En tout cas il est necessaire que cela demeure secret, car s''il en auoit le
    vent, il ne voudroit jamais prendre autre chose pour perdre celle que vous scauez. Je vous
    ay recommandé et vous recommande encore de tascher d''envoyer mon livre avec le bagage de
    Messieurs de Villers en cas qu''il l''envoyent par terre car je ne voy point de voye plus
    courte. Je croy que mon Pere vous parlera aussi de luy faire tenir quelque chose par le
    mesme moyen. Les dames d''icy se portent tres bien et font l''honneur a leurs galands de
    venir à la Comedie auec eux tres souvent en estant requises sans gueres refuser ces parties.
    Il y a deux jours qu''on representa l''Andromede de Corneille et il se trouva que le Pegase
    sur lequel estoit monté Pesseurs, n''ayant pas esté assez bien attaché par devant, ou bien
    le Cavalier se demenant trop dessus, ses deux pieds de devant se destacherent, et il versa
    son Heros tout net et le fit mestre pied a terre (ou cul plus tost) plus viste qu''il n''avoit
    envie, tombant d''assez hault pour se pouvoir faire du mal. Il se releva pourtant de sa
    cheute et se resolut de combattre a pied son monstre marin, ce qu''il fit avec bon succes.
    J''ay esté quatre jours sans pouvoir quitter la maison a cause d''une fluxion sur les dents
    à laquelle je suis fort subjet, cela est fait presentement, et j''iray apprendre des nouvelles
    pour vous en mander par le prochain ordinaire. Adio. je vous prie d''auoir soin de mon livre,
    mais de ne l''envoyer pas par mer.'
- verzender: Constantijn Huygens jr. (1628-1697)
