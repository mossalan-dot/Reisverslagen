  tekst: 'Nicolaus Heinsius Christiano Hugenio Viro Nobilissimo S.P.D.

    Quod postremae tuae quas nuper admodum a te accepi, sollicitudinem prae se ferebant, super
    ijs literis, quas Serenissimum Etruriae Principem Leopoldum ad te scripsisse, nec curatas
    esse, affirmabas; si fugitivae et errones forsan in viam reduci possent, paucis nunc verbis
    te compellandum duxi. Significat quippe in ultimis suis ac me monet Datus, primo Lutetiam
    literas eas fuisse missas, ac postea Amstelaedamum, quod Lutetiae non compareres sub id
    tempus, quo te illic futurum esse spem dederam. Sed certe, quicunque tandem is est, cui
    literae fuere commissae, oportet eum officio parum diligenter esse perfunctum, qui ipsas
    literas ad parentis tui aedes non curavit perferendas. Rogabo mox Datum, ne gravetur nomen
    eius mihi indicare, ad quem Florentia Parisios missae fuere literae. Ita spes est fore,
    ut ex fuga retrahantur. Tu interim inquire apud illos, qui Magni Etruriae Ducis res Lutetiae
    agunt. Addit praeterea Datus Apollonium Pergaeum jam spectare lucem. Sed ei addendum esse
    Archimedis libellum. Habes hic ad Capellanium. Vale, Vir ex amicis summe. Dabam manu praepropera.

    Hagae Comitis CIƆIƆCLXI ad diem XXIV Februarii

    Tuus omni cultu Nicolaus Heinsius.'
