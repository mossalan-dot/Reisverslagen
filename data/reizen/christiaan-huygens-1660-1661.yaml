  tekst: 'A Paris ce 5 Nov. 1660.

    Je vous rends graces des nouvelles dont il vous a plu me faire part, et vous prie de continuer
    a m''en donner a tous les ordinaires, car mon Pere s''en raporte a vous et ne m''en mande
    gueres. Pour ce qui est de la mode des habits dont vous desirez estre informè, elle n''est
    pas fort assurée ny universelle. toute la cour et ce qu''il y a de plus hupez sont en deuil,
    portants du drap d''Espagne qui est plus cher que le drap ordinaire, quoyque moins beau.
    auparavant ce deuil l''on portoit des ferrandines et autres estoffes unies, pendant l''estè,
    et maintenant l''on prend du drap gris couleur de souris, de mesme que l''hyver passè chez
    nous, et je m''en vay a cet heure en faire un habit qui sera de mesme que mon frere de Moggershil
    avoit. a la cour quelques uns portent de canons blancs, mais non pas si grands que par cy
    devant, d''autres des bas d''Engleterre gebreijt, avec les canons assez estroits de la mesme
    pièce et des petits portecanons. et cecy noir ou gris selon la couleur des habits. Je n''ay
    pas encore estè a la rue S. Jaques pour chercher le Vite de Pittori dont vous m''escrivez
    mais a la premiere occasion je tascheray de l''avoir.

    7 ou 8 jours devant que j''arrivasse le bon Sçaron s''estoit laissè mourir, et l''on crie
    icy par les rues son testament et autres pieces que l''on a composees sur sa mort. l''on
    raconte qu''apres qu''il se fut confessè, et que le prestre luy eust donnè l''absolution,
    il luy dit Et bien mon Pere est ce tout fait a cet heure, n''y restent y plus rien? Et l''autre
    ayant dit que non, et qu''il estoit desormais en bon estat pour mourir chrestienement. Ca
    mon Pere dit il, parlons un peu a cet heure des vers; et en mesme temps en tira quelques
    uns qu''il avoit mis derriere le chevet de son lict. et commenca a les lire. d''aucuns adjoustent
    que c''estoit un sixain sur son dernier hocquet.

    J''ay trouvè icy Joncker Jan van Vlaerdingen qui portant une grande perruque je ne le connus
    pas d''abord, comm'' il entra en l''eglise chez Monsieur l''Ambassadeur. Il fut tres aise
    de me veoir et me dit que depuis qu''il estoit icy il n''avoit pas encore parlè que sa langue
    maternelle que Busero estoit logè avec luy, et que je devois y venir aussi. Il a un valet
    de chambre et 2 laquais, et une chaise a luy. Encore assez souvent il va en carosse, dont
    je pourrois profiter si j''avois assez de complaisance pour passer quelque fois le temps
    avec luy. Je l''ay estè veoir une fois en sa chambre qui est belle et bien tapissée, et
    le trouuay au lict ou il avoit couchè cette nuict luy troisiesme avec Monsieur D''Ouwerkerc
    et un autre academicien le comte d''Ille. Cestuicy s''habilloit et estoit couvert de la
    robbe Japonnoise de Vlaerdingen qui en attendant gardoit le lict. Par la vous voyez a peu
    pres quelle vie font ces messieurs. Pour moy je suis en pension chez une dame de la religion,
    fort maigre avec le nez pointu Et les souppes n''y sont gueres grasses. la me sont suivis
    le consul Zuerius et Monsieur Vorstius; la compagnie que j''y trouvay sont des Allemans
    horsmis un qui est Francois, maer weynich van woorden. Il pourroit bien arriver que je delogeasse
    d''icy dans peu. Je suis

    Vostre tres humble serviteur et frere, Chr.H.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
