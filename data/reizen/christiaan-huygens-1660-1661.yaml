  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "Monsieur,\nJ'ai appris auec ioye mais non pas sans quelque espece de ialousie que\
    \ mes amis de Paris ont l'honeur de uous posseder depuis quelque temps. Je uous asseure,\
    \ Monsieur, que si ma samté estoit assés forte pour les uoyages, ijrois auec grand plaisir\
    \ prendre ma part de leur bonheur. Ce n'est pas daujourdhui, ni par la relation seulle de\
    \ Monsieur de Carcaui que ie suis persuadé de uos qualités tout extraordinaires. Jestois\
    \ a uous auant que vous fussiés en france. Et lors qu'on m'a demendé mon sentiment de uostre\
    \ Saturne, i'ai respondu hardiment, et sans mesme l'auoir encore ueu que puis qu'il partoit\
    \ de uostre main il ne pouuoit manquer, quoy que ce soit, a sa perfection. Vos autres ouurages\
    \ que i'ai ueus et admirés m'ont obligé d'en parler de la sorte. Et i'ai eu plus de raison\
    \ d'en user ainsi que celuy\nQui nunquam uisae flagrabat amore puellae.\nVostre grande et\
    \ iuste reputation est le seul et ueritable garend de touts uos liures. Jl me tarde de les\
    \ uoir et de me confirmer par leur lecture au iugement que i'en ai faict par aduance, et\
    \ en la passion que uos autres escrits m'ont donnée, d'estre toute ma uie auec grand respect,\n\
    Monsieur \nVostre tres humble et tres obeissant seruiteur Fermat."
