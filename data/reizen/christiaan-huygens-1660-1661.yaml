  tekst: 'Ad incomparabilem Mathematicum, Dominum Christianum Hugenium, Constantini Magni filium
    etc. cum Nicolao Heinsio scribens, Danielem eum nominâsset.

    Praenomen Heinsi, Christiane, perperam

    Cur exarâsti, qui facis nil perperam,

    Sed cuncta scribis, tam stupenda gentibus

    Quàm praedicanda semper, at nunquam satis?

    Nicolaus ergo est Daniel factus tibi?

    Immò ille soli talis haud factus tibi est,

    Sed et Camaenas illius legentibus,

    Et dîa totum scripta quae spirant patrem.

    Rectè profectò, Christiane, haud perperam,

    Sic exarâsti; nomen et famam patris

    Est consecutus, et tuetur filius.

    Hallucinata penna, non mens, est tibi,

    Fuitque dulcis error in praenomine.

    Nicolaus ergo Daniel sit Heinsius,

    Quoniam superstes alter est in altero.

    Henricus Bruno.

    Hagae-Comitis XXIV. Novembris CIƆIƆCLX.'
- verzender: Pierre de Fermat (1601-1665)
  ontvanger: Christiaan Huygens
  datum: 01-12-1660
