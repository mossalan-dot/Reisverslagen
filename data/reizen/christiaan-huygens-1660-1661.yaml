  tekst: 'Il medesimo Signore Principe Leopoldo Al Signore Cristiano Vgenio li xi di Gennaio
    1660 Ab Incarnatione [1661].

    Havendo io inteso che Vostra Signoria non si sia partita altrimenti da coteste Parti come
    mi haveva significato, hò stimato bene mandare a Vostra Signoria, stante l''occasione molto
    opportuna e sicura che mi si porge del Signore Marchese Giovanni Vincenzo Salviati mandato
    dal Serenissimo Gran Duca mio Signore fratello in qualità di suo Ambasciatore straordinario
    a Sua Majesta Britannica, un libro dato pochi mesi sono alla luce dal nostro Viviani Matematico.
    Lo invio al Signore Franćesco Ferroni, accio che egli si contenti farlo havere a Vostra
    Signoria con ogni maggior sicurezza. Voglio sperare che ella sia per cortesemente gradirlo
    et riconoscere anche da questo il desiderio che io ho d''incontrare ogni suo gusto. Le ne
    mando due copie, accioche se ella volesse darne una al Signore Golio possa sodissarsi. Et
    mentre io confermo a Vostra Signoria la mia effettiva volontà d''impiegarmi sempre in suo
    servizio, goderò che da lei me ne siano porte le occasioni, et resto augurandole ogni prosperità.'
