  tekst: "de la Haije le 20e Januier 1661.\nMonsieur mon frere.\nJay receu la vostre du 7e de\
    \ ce mois a Amsterdam ou j'estois allé la semaine passee pour quelques affaires domestiques\
    \ et en partie aussi pour voir ce qu'on fait en ce quartier la. le Seigneur Gleser aijant\
    \ la complaisance de m'y accompagner quoij qu'il ny eust rien a faire. Le Sieur Hanniwood\
    \ y est tousjours et fait sa cour auec beaucoup d'assiduité chez madame Vlooswijck. Gleser\
    \ l'estant allé voir un matin chez luij il l'entretint fort des rares qualitez de sa maistresse\
    \ disant mesme qu'il n'y en auoit aucune en toutte la Haije qui luy soit comparable en beauté\
    \ nij en esprit, on jugeroit par la qu'il doit estre fort amoureux, quoij que je sache d'ailleurs\
    \ qu'elle le traitte auec beaucoup de sierté comme elle a de coustume a traitter tout le\
    \ monde. Les Bartelottis se portent aussi fort bien mais souffrent une grande jndigence\
    \ de galants, et viuent en une grande solitude qui ne les ennuije pas peu comme vous pouuez\
    \ penser, personne de ces jeunes gens d'Amsterdam nij vient et se moquent fort d'elles comme\
    \ elles se sont moquees cy deuant d'eux. dont je croij qu'elles ont regret a present quoy\
    \ qu'elles ne le tesmoignent pas. Pour le mariage de deux Coenes auec les deux Bergagnes,\
    \ cet une chose dont on ne parle point du tout, il est vray que d'Anne Marie et de Coene\
    \ le cadet on en a parle cij deuant, mais ceux de Boileduc mesme disent qu'il n'en est rien,\
    \ et de l'autre personne n'en a jamais ouij parler. Mademoiselle Jenneken nous mande que\
    \ la semaine passee il ij a eu grand festin, jeu, Ball et toutte sorte de rejouissance chez\
    \ les Zuerius, où touttes les dames de Boileduc et tous les galants furent en bel equipage,\
    \ et apres le souper qui estoit fort magnifique le Seigneur Jacobus, alla prendre madame\
    \ Bergagne pour commencer le bransle, qui d'abord s'excusa un peu sur son age etc., mais\
    \ en fin se laissa persuader et fit non moins que le reste. on voit par la que ces deux\
    \ familles voisines ne sont pas presentement si mal d'accord comme il arriue par fois. Mademoiselle\
    \ d'Absalon estoit aussi de retour a Boisleduc apres auoir esté fort longtemps en Brabant,\
    \ et comme touttes les dames et ce qu'il y avoit de sa cognoissance eurent estez la voir\
    \ cinq ou six jours de suitte et qu'on n'eust point lassé de parler auec elle comme auparavant\
    \ la nommant tousiours par son nom accoustume d'Absalon, sans qu'elle fist rien paroistre.\
    \ quelques jours apres elle fit diuulger par toutte la ville par sa seruante qu'elle estoit\
    \ marriee il y auoit 3 semaines, dont tout le monde estoit fort surpris personne n'en aijant\
    \ jamais ouij parler. Elle a epousé un gentilhomme Brabancon tres richea ce qu'on dit et\
    \ de bonne maison, mais malgre ses parens a luij. il la deuoit suiure a Boilduc mais son\
    \ carosse et les habits de ses pages (notez) n'estoient pas encore en ordre.\nVenons astheur\
    \ a la Haije; le grand abord a present est chez les Aerssens scauoir alternatiuement chez\
    \ les jeunes et les vieilles. c'est la que se voit tout ce qu'il y a de beau monde a la\
    \ Haije s'entend des hommes, ce qui ne cause pas peu de jalousie parmi le sexe. Amarante\
    \ fait rage a discourir et depuis qu'elle a veu cette admirable madame de Bassecour, a Spa,\
    \ elle l'jmite si bien que vous seriez stupefait a l'entendre jaser comme elle fait. Le\
    \ seigneur de Cats en est fort amoureux entre autres, car elle a des amants a dousaines\
    \ et la plus part mariez, ce qu'on juge icij de consequence un peu dangereuse. Anne est\
    \ dans la grande approbation pour la beauté, mais comme elle est autant taciturne, comme\
    \ l'autre est parlante, l'autre attire la plus grande partie du gibier. Le Duc est partij\
    \ il y a quelques jours pour son paijs d'ou il pretend passer en Jtalie et reuenir a la\
    \ Haije vers le moijs de mars prochain, Monsieur Vickefort qui fait ses affaires m'a dit\
    \ aujourdhuij qu'il venoit de luy louuer la maison où a loge dernierement milady Stannop\
    \ sur le Buijtenhoff. On pensoit auoir icij des diuertissemens merueilleux cet hijuer mais\
    \ la mort de la Princesse Roijale a dissipe touts ces desseings, et tout le monde s'habille\
    \ de dueil. Chez mademoiselle de Nieveen il ij a un tres grand calme a present, elle n'a\
    \ point d'autre galant astheur que le portugais Aluarez Ribera, qui l'jmportune auec une\
    \ assiduté sans egale ce qui la desespere tout a fait et ne s'en peut defaire quoij quelle\
    \ le maltraitte d'une etrange facon, ce qui loin de le rebutter, le rend encore plus amoureux\
    \ car selon la coustume d'Espagne il prend touttes ses siertez et cruautez pour autant de\
    \ faueurs. le mariage de sa soeur auec Boetzelaer est accordé il ij a quelque temps ils\
    \ cherchent maison, et se marieront vers pasques quand ils auront quitté le dueil du grand\
    \ pere deffunct. on parle aussi d'un mariage de Margriete Rijckers auec le Sieur de Nieuwerkerck,\
    \ il en est fort amoureux et fort assidu aupres d'elle, mais s'il se fera cet dont on ne\
    \ scait encore rien. Le frere de Zeelhem vit encore comme de coustume et ne voit que les\
    \ Rijckerties et les Pauwties, comme cij devant. Cest tout ce qui se passe icij de galanterie,\
    \ sy ce n'est qu'on parle aussi de mademoiselle d'Aernhem auec l'aisné de Villers nouuellement\
    \ reuenu de France, et du Conte de Flodorp auec mademoiselle des Loges, quoij que plusieurs\
    \ jugent que ce soit hors d'apparance, joubliois a vous dire que Gans le gros, fait l'amour\
    \ a une des Pauwties. On parle aussi d'un mariage entre mademoiselle de Beuerwaert auec\
    \ le jeune Hijde frere de la duchesse de Jorck. J'ay rencontré a Amsterdam chez de Pont\
    \ le Sieur Buliaud qui m'a prié de vous baiser les mains de sa part, il pensoit partir en\
    \ deux jours au plustard pour la Pologne.\nIcij joint, va un petit mot de lettre pour le\
    \ Sieur van Gangelt asin qu'il luy plaise de vous compter la somme de cinquante ecus pour\
    \ ma marchandise. S'il sest fait quelque bon portrait en taille douce de la jeune Reijne\
    \ je desirerois bien l'auoir. il s'en est fait un fort beau du Roij depuis peu, que j'ay\
    \ apporté d' Amsterdam la semaine passee, il est graué par un certain van Schuppen, sur\
    \ le dessein de Vaillant, tout deux Flamans, mais il ne cede guerre a ceux de Nantueil a\
    \ mon auis. Pour les ouurages du Pautre vous pouuez librement m'achepter tout ce qu'il a\
    \ fait depuis un An en ça, car j'aij comme je croy tout ce qu'il a fait auparauant et j'estime\
    \ fort ses ouurages pour la grande varieté du desseing et parce qu'ils sont si bien entendus.\
    \ Post n'ij atteindra jamais et son fils aussi peu. Jl y a un certain Marot, qui est aussi\
    \ fort habille homme pour l'Architecture, s'il a fait quelque chose depuis un an ou enuiron\
    \ vous me ferez plaisir de me l'achepter, et ce qu'il y aura de pareille etoffe. J'ay grande\
    \ jmpatience de voir les planches de Vau, d'Israel, mais je ne pense pas qu'ils soijent\
    \ prest auant vostre retour. Sachons s'il vous plaist si vous auez veu mademoiselle de Scuderi\
    \ ou son Frere et quels personnages ce sont, on admire icij leur dernier ouurage d'Almahide,\
    \ qui paroist depuis peu, mais je ne me suis pas pu donner encore la patience de le lire.\
    \ Nous ne scavons rien encore du bon Tassin, et Cheureau, ce bel esprit est il encore au\
    \ monde, Adieu mon temps est escheu. Ma mere et ma femme vous saluent et moy je suis\nMonsieur\
    \ mon Frere \nVostre tres affectione serviteur et frere Ph. Doublet.\nJe vous envoije le\
    \ Billet pour le Sieur van Gangel ouuert, vous le pouuez cachetter si bon vous semble ou\
    \ le luij donner comme il est."
