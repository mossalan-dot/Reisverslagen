  tekst: 'Signor Cristiano Vgenio.

    Non ordinario contento hò sentito dall''auuiso, che Vostra Signoria habbia riceuta la mia
    risposta, et che ella resti sodisfatta e della particolare mia affettuosa uolontà uerso
    di lei, e della stima non ordinaria che fò della sua uirtú; amendue questi miej sentimenti
    Lei confermo con ogni più adequata espressione, et desidero che Vostra Signoria alle occasioni
    con ogni confidenza maggiore mi esperimenti nell'' opere a suo prò. Tralasciai di rimostrare
    nella lettera che Lei scrissi il modo di sostenere il Cannochiale uicino all'' Occhio per
    esser cosa a noi comunissima


    e facile, mentre ci uagliamo solo, ó di due canne incrociate, et legate con una funicella,
    ó di due legni lauorati in tondo come si uede nella quì semplice figura, alzandosi piú ó
    meno l''incrociatura, e legatura secondo il bisogno richiede, et sappia che ottimamente
    serue. Procurerò di fare qual che studio sopra il comporre vetri puri, et atti al miglior
    uso della fabrica de gl'' Occhiali et se mi sortirà il trouarne il modo, e ridurlo all''
    atto pratico, io glie ne auuiserò, acciò Vostra Signoria per quello che tocca alla materia,
    possa restare più sodisfatta. Intanto staró attendendo l''inuenzione del suo nuouo modo
    di Cannochiali, et doppo il suo ritorno in Olanda quelle opere che ella ne promette. Hauerà
    intanto in Parigi riceuta Vostra Signoria altra mia lettera nella quale io le auuisauo la
    comparsa della sua dotta risposta al Libretto del Diuini. Mi farà Vostra Signoria ben cosa
    grata ad auuisarmi quali persone degne da stimarsi nella Geometria et Astronomia habbia
    ritrouate in Parigi, doue Lei auguro felice stanza et appresso fortunato ritorno alla Patria,
    et con tutto l''affetto ogni altra più desiderabil felicità.


    Al Piacere di Vostra Signoria Il Principe Leopoldo.

    Di firenze 19 Nouembre 1660.'
