  tekst: "a Vaumurier le 11. 9bre 1660.\nMonsieur\nAussytost que ie suis arriué icy i'ay dit\
    \ a Monseigneur le Duc le bonheur que i'ay eu de uous rendre mes tres humbles respects a\
    \ Paris, et ie luy ay montré les papiers que uous auez eu la bontè de me confier et que\
    \ ie uous renuoye, auec un fragment de lettre que le Serenissime Prince Leopolde m'a fait\
    \ l'honneur de m'escrire sur uostre suiet par le quel uous ne uoirez pas moin que par celle\
    \ que Son Altesse Serenissime uous a escrite a uous mesme l'estime toute particuliere qu'il\
    \ fait de uostre merite. Monseigneur le Duc se porte mieux de sa goutte, c'est pourquoy\
    \ il pourroit se rendre bientost a Paris; cependant il m'a ordonnè de uous saloüer de sa\
    \ part, e de uous tesmoigner la ioye qu'il aura de uous y uoir, et principalement si l'occasion\
    \ se presentoit de uous y rendre quelque seruice. Je tacheray de faire sçauoir a Monsieur\
    \ du Gas uostre arriuée, et en attendant le bonheur de uous reuoir et seruir a Paris ie\
    \ demeure a iamais et de cout mon coeur\nMonsieur \nVostre treshumble et tres obeissant\
    \ seruiteur l'abbé Brunetti.\nEstant a Paris i'ay oublié a uous demander si l'on imprime\
    \ en Hollande la nouuelle relation de la terre Australe et si c'est en françois ou en autre\
    \ langue. Comme aussy si Monsieur Vossius a quelque chose de cela ou de la Chine, et quoy."
