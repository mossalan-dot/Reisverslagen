  tekst: 'Sommaire

    Comeet. Engelandt. Academici.

    dat ick 2 van syn brieven teffens gekregen heb van den Bisschop de Besiers van den 5 en
    19 november. dat de reden waerom die soo laet ontfangen heb is dat hy se (niet wetende waer
    ic in Parys gelogeert was) naer Holland gesonden had. uyt de eerste [significavit] heb ic
    verstaen dat myn antwoord niet mishaeght en heeft en weerdigh gedacht om herdruckt te werden
    met eenige verandering nochtans dat hij nochtans sijn sententie op houdt tot dat Fabri de
    periodus van syn planeeties sal gevonden hebben, het welck ic vrees dat lang aenlopen sal,
    want ic weet wel dat de annulus (?) van ♄ in de toekomende 4 a 5 jaer niet merckelyck van
    figuer sal veranderen. sed nec video hoe dat de stelling van Fabrius planeeties kan overeenkomen
    met de figueren die door V.E. ''s beste brillen geobserveert en my academicorum nomine toegesonden
    sijn. die na my dunckt door haer experimenten soo veel preuven van de seeckerheyt van myn
    stelling in de ring gevonden hebben, dat Fabrius self indien hy de waerheyt bemint en deselve
    gesien heeft behoort van sijn opinie af te staen. De inventie van de 2 stockjes die malkander
    kruyssen om de verkycker by t'' oogh te onderstutten elegans certe est atque eo melior quo
    simplicior. en ick bedanck V.E. seer daervoor en denc my daer van te dienen als ick thuys
    sal sijn. Hier en heb ic geen langer verkijckers (en die goet waeren) als van 10 of 11 voet
    gesien die op een stut genoech konnen gehouden werden. de observatien oock sijn weynigh
    in vogue.


    Traduction

    Que j''ai reçu 2 de ses lettres à la fois, par l''intermédiaire de l''évêque de Beziers,
    du 5 et du 19 novembre. que la raison que je les ai reçues si tard, est que celui-ci, ignorant
    où j''étais logé à Paris, les a envoyées en Hollande. De la première [significavit] j''ai
    compris que ma réponse ne lui a pas déplu, et qu''il la jugée digne d''être réim primée
    en y introduisant pourtant quelque changement. que néanmoins il réserve son opinion jusqu''à
    ce que Fabri ait trouvé la période de ses deux petites planètes, ce qui, je crains, durera
    longtemps, car je sais bien que l''anneau [?] de ♄ dans les 4 à 5 années prochaines ne changera
    pas notablement de figure, sed nec video comment l''hypothèse des petites planètes de Fabri
    peut convenir avec les figures qui ont été observées par vos meilleures lunettes, et qui
    m''ont été envoyées academicorum nomine, qui, à mon avis, ont trouvé par leurs expériences
    tant de preuves de la certitude de mon hypothèse sur l''anneau, que Fabri lui-même, s''il
    aime la vérité et s''il les a vues, doit renoncer à son opinion. L''invention des 2 cannes
    croisées pour soutenir le télescope auprès de l''oeil elegans certe est, atque eo melior
    quo simplicior; je vous en remercie beaucoup et je pense m''en servir quand je serai de
    retour. Ici je n''ai pas vu de télescopes (qui soient bons), plus longs que de 10 à 11 pieds,
    ceux-ci peuvent se tenir assez bien sur un soutien. Aussi les observations sont peu en vogue.'
