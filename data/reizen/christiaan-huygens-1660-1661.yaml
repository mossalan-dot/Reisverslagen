  tekst: 'A Paris ce 10 Decembre 1660.

    Je trouuay hier Israel Henriette et luy ayant expliquè toute vostre liste, il dit qu''il
    n''en avoit pas une des pieces que vous demandez, mais il me donna adresse a un autre liefhebber
    qu''il croyoit mieux pourveu de ces raretez les quelles pourtant il m''assura couster extremement
    cher. Pour luy il me monstra une taille douce de Calot qu''il ne vouloit pas vendre a moins
    de 3 louis d''or; c''estoit un in 4o ou un ambassadeur d''Espagne faisoit hommage au Pape
    du Royaume de Naples, en luy presentant un cheval blanc, il y a environ 200 figures et quelques
    bastimens, et personne que luy n''en a d''exemplaire a ce qu''il dit.

    Je donneray vostre livre de'' pittori a Monsieur de St. Agathe qui a bien voulu s''en charger,
    estant prest de partir la sepmaine prochaine.

    Je ne vous escris que cecy par ce qu''il est temps que j''envoye mes lettres, et que j''ay
    estè interrompu par quelques visites de musiciens et mathematiciens. Quest ce que j''entens
    de quelques navires qui seroyent demeures sur les costes d''Espagne au nombre de 5. l''on
    ne scait pas me dire si ce sont des Hollandais ou d''autres. Dieu garde les nostres de mal.
    Je suis &c.'
