  tekst: 'Sr. Cristiano Ugenio 4 Marzo 1661 ab Inc.ne.

    Essendo uscita alle stampe in questa Citta la traduzione dall''Arabo dell'' quinto sesto
    e settimo libri di Apollonio non ho voluto che per altro mezzo che del mio le pervenga nelle
    mani, in segno ancora della continuazione del mio affetto verso del merito e virtù di V.S.E
    sentirei volentieri se Le sia comparso un libretto che le inviai sotto nome di Eustachio
    Divini, non ne avendo da V.S. avuto alcuno Cenno ma le confermo ad ogni buon fine, e....
    V.S. si accerti che vivo desidero io d'' Incontrare ogni sua sodisfazione, e con tutto l''animo
    le auguro ogni felicità.'
