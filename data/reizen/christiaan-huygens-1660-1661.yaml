  tekst: 'Constantin a Chrestien.

    A la Haye le 25 Nouembre.

    J''ay receu vostre derniere et vous rends graces de m''avoir cherché mon livre, lequel il
    me tarde fort d''auoir, e''est pourquoy je vous prie de scauoir s''il ne part de là quelque
    personne de connoissance, qui me le pourroit apporter parmy son bagage. Les fils de Monsieur
    de Villers sont sur le point de revenir, a ce que dit l''autre jour le Pere, et comme l''aisné
    est de mes amys, il voudroit bien s''en charger. Mais je vous prie de ne le donner à personne,
    qui en prenant son chemin par terre envoye ses hardes par mer, car cela est subject à des
    grandes longueurs, et j''aymerois encor mieux attendre vostre retour. A propos des Peintres
    je vous diray que ce fourbe de Matham mourut il y a deux jours d''une mort fort soudaine
    ayant esté atteint d''une sorte d''apoplexie comme il venoit de se lauer les mains à la
    pompe, et cet accident si inopiné l''aura empesché d''auoir le repentir conuenable à l''article
    de sa mort de m''auoir tant dupé durant sa vie, dans mes jeunes ans. Mon Pere a fait dessein
    de nous faire peindre touts trois dans un mesme tableau et j''ayesté chez Hanneman à fin
    qu''il en forme un desseing, pour l''examiner avec nos amys qui entendent l''art, et puis
    luy faire commencer mon pourtrait en attendant que vous deux soyez de retour. Le Seigneur
    de Cronestein qui est Conseiller au Conseil de Brabant agonise, et suivra Matham de pres.
    Tellement que voila une place vacquante au Conseil, et pour l''auoir environ douze pretendants
    en campagne, et parmy ce nombre deux parents du Pensionaire qui sont Viuien, et le petit
    Persyn auditeur des contes de son Altesse. Ce grand nombre de douze a fait tellement peur
    à mon Pere, que je luy ay fait comprendre qu''il n''estoit pas expedient que je fusse le
    treiziesme, pour aller chercher un rebut de gayeté de coeur, dont je suis tres aise. J''espere
    que vous aurez eu soin de vous enquerir chez Henrichet ou quelque autre vendeur de tailledouces
    de ce qu''il y pourroit auoir des pieces mentionnees dans mon memoire. Mon intention n''est
    pas d''en achepter grand nombre quand mesme on les pourroit auoir, estant desja tombé d''accord
    avec mon homme de luy donner un equivalent consistant en quelques pieces d''Alberdurer en
    cas que je n''en puisse recouvrer de Callot, mais pourtant je serois bien aise d''en auoir
    au moins deux ou trois ou quatre pour le contenter en quelque sorte, c''est pourquoy je
    vous prie de regarder un peu ce qu''il y a comme je vous ay mandé dans ma precedente et
    de me le mander; ayant achepté quelque chose, vous pourriez aisement me l''envoyer dans
    une lettre. Nous n''auons encor eu aucune nouvelle du Frere qui est en Espagne (au moins
    à ce que nous croyons). Madame de Vlooswijc vient d''envoyer icy tout presentement, ayant
    ouy dire dire que nous auions eu des lettres, scauoir ce qui en est, par ce que son fils
    est aussi de la noblesse de l''Ambassade. Madame la Princesse partira la sepmaine qui vient
    pour Cleues, ou viendront en mesme temps l''Electeur et le Prince d''Anhalt avec leurs femmes.
    Le Prince Guillaume y va aussi avec la sienne, et le Comte de Dona, feu Gouverneur d''Orange,
    avec eux, encore qu''on dise qu''il est tres mal avec l''Electeur à cause des choses passées,
    mais Madame raccommodera tout cela. Si vous voyez Nanteuil je vous prie n''oubliez pas de
    scauoir de luy par le menu cette invention van deur te trecken que scavez et dont je vous
    ay escrit dans une de mes precedentes. Ce fol de Bruno vient de me porter ces vers icy enfermés,
    qu''il veut que je vous envoye, il me jure qu''il en a fait et escrit la moitjé en pleine
    rue, là ou le Molstraet aboutit au Wagestraet. Il se tresmousse plus fort que jamais, d''ores
    en avant on ne scauroit remuer un pied là ou il est qu''incontinent il ne rime dessus. Adieu,
    Je vous prie songez aux moyens de me faire auoir ce livre.'
