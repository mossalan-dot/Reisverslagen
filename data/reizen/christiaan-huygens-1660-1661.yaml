  tekst: 'Jeudy matin.

    Je vous dis, Monsieur, encore vne fois Adieu bien mortifié de ne vous le pouuoir dire chés
    vous de viue voix comme il estoit bien raisonnable que je fisse. Donnes moy de vos nouuelles
    quand vous serés a Londres pour m''oster d''inquietude et mandes moy si Milton y est encore
    et sans estre recherché du passé. Je receus hier vn paquet de Monsieur Heinsius. I''enuoye
    la Response a Monsieur de Beuning. Obligés moy de luy bailler la lettre latine que je vous
    remis hier afin quil la joigne a la mienne et quelles aillent ensemble dans son paquet.
    Je suis a vous sans reserue.

    Chapelain.'
