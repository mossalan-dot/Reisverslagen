  tekst: "de la Haije le 10e Febrier 1661.\nMonsieur mon frere.\nJe vous rends graces de la\
    \ relation exacte que vous me faittes en vostre derniere de la visite que vous auez faitte\
    \ chez l'Illustre Sapho. que je m'estois jmaginé a peu pres comme vous me la descriuez,\
    \ sur ce que j'en aij leu cij deuant dans la 10e partie du Cijrus ou elle a fait le portrait\
    \ de soij mesme soubs ce nom jllustre. Jl me fache que nous ne pourrons voir de si longtemps\
    \ encore, les tailles douces de Veau. cependant il faudra que nous contentions nostre curiosité,\
    \ par la description que vous me marquez dans la Clelie, que j'auois rencontree il y a desia\
    \ quelque temps, et soubconnois dez lors que ce ne pouuoit estre que Veau, par la circonstance\
    \ qu'il y a d'un Escureul, que je scauois estre les armes de Monsieur Foucquet. J'auois\
    \ aussi heureusement deuiné que Meleandre deuoit estre Monsieur le Brun, ce qui m'est arriué\
    \ encore en d'autres endroits du mesme liure ou je pensse auoir descouuert auec assez de\
    \ succes le veritable lieu des belles discriptions de Palais et Jardins que l'autheur en\
    \ fait. car comme vous scauez que je suis grand batisseur je prens beaucoup de plaisir a\
    \ lire et par ce moijen renouueller l'jdee que je conseruois encore de ces beaux endroits\
    \ ou je me suis promené auec tant de plaisir il ij a cinq ans. Cest pourquoij vous m'obligeriez\
    \ jnfiniment si vous me pouuiez faire auoir par le moijen de la cognoissance que vous venez\
    \ de faire auec Mademoiselle de Scuderij, une Clef ou explication de tous les noms veritables,\
    \ propres de descriptions des beaux Palais et Jardins etc. qui sont dans les Ouurages de\
    \ la ditte donzelle. car tous les plus beaux lieux de toutte la France se trouuent dans\
    \ son Cijrus et sa Clelie, et dans son dernier ouurage d'Almahide, j'en aij trouué quelques\
    \ uns assez beaux mais que je n'ay pas pu deschifrer. Je feuillette ses ouurages seulement\
    \ pour cette sorte de choses, qui sont fort de mon goust. comme aussi les pourtraits de\
    \ personnages jllustres de France tant pour leur condition que scauoir, qui sij trouuent\
    \ aussi en grand nombre, mais dont je ne decouure pas si aisement les veritables noms que\
    \ de l'autre sorte de descriptions, s'il sen pouuoit recouurer quelque elucidation par le\
    \ moijen sus dit, dont je ne doutte point, ce me seroit faire plaisir.\nJe vous prie de\
    \ me faire scauoir si vous auez touché les cinquante escus dont jauois prié Monsieur van\
    \ Gangel, afin que je les puisse au plus tost faire paijer icij au Sieur Hoeuft.\nSans doutte\
    \ vous aurez desia fait quelque obseruation sur la Comette qui a parue icij depuis quelques\
    \ jours. depuis quattre heures du matin jusques a six vers le Suijd Oost. A Leijde on en\
    \ a fait des obseruations sur l'Uraniburgum qui est sur l'accademie depuis quelques jours\
    \ en ca mais je n'en scaij point des particularitez encore, sans doutte le frere de Zeelhem\
    \ vous mandera ce qu'il en a veu par ses lunettes d'approche.\nJl ne s'est rien passé de\
    \ remarquable icij depuis ma derniere, peut estre vous aura t'on dit que la nouuelle du\
    \ Conte de Flodorp et Mademoiselle des Loges est fausse, et tout le monde icij commencoit\
    \ a croire qu'il nen estoit rien. mais le Seigneur van der Mijl en a parlé tout autrement\
    \ peu de jours passez a nostre Papa. tellement que je ne doutte nullement que cela ne se\
    \ fasse.\nL'autre jour le Sieur Gronouius a esté eleu Rector Magnificus en la place du Sieur\
    \ Vorstius, a Leijde a ce que me mande van Leeuwen, qui nous a tenu compagnie quelque cept\
    \ ou huict jours chez nous auec sa femme, et s'en sont retournez a nostre grand regret.\n\
    On parle de quelque dessein du cadet de Watervliet pour mademoiselle Jda. mais je ne puis\
    \ encore m'aperceuoir si c'est auec fondement.\nJe suis rauij d'entendre que vous allez\
    \ faire encore un tour en Engleterre, et marrij tout ensemble, pour estre reculé de l'esperance\
    \ que j'auois de vous pouuoir reuoir bien tost en ce paijs, pour apprendre mille belles\
    \ choses de vostre bouche que je ne puis pas scauoir par vos lettres, qui me sont jnfiniment\
    \ agreables. Le frere Espagnol sera sans doutte bien jaloux du voijage que vous allez faire,\
    \ car je vois bien par ces lettres, qu'il a doresnauant tout son saoul de l'Espagne et qu'il\
    \ prefereroit bien Londres pour Madrid. Adieu je suis\nMonsieur mon Frere \nVostre tres\
    \ affectioné Seruiteur et Frere Ph. Doublet.\nToutte nostre famille vous baise les mains."
