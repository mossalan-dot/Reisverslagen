  tekst: "A Whitehall ce 22. March 1661.\nMonsieur\nSi Je neusse pas rencontré ce jeune homme\
    \ vous n'auriez pas eu si tost le pacquet dont Je l'ay chargé, quoy qu'il y ait un mois\
    \ qu'il est prest. parceque ne sçachant point si vous estes encor à paris Je n'ay pas voulu\
    \ l'enuoyer par l'ordinaire, de peur qu'il ne fust perdu. Je n'ay rien a present à y adiouster\
    \ si ce n'est que vous verrez par le liure que le porteur vous presentera que J'ay eu raison\
    \ de vous persecuter comme J'y ay fait, de ce que vous tardez tant de donner au iour les\
    \ traittez dont Je vous ay si souuent parlé. au reste, le jeune homme ne souhaitte plus\
    \ au monde que d'auoir vostre approbation de son liure. peut estre y trouuerez quelque chose\
    \ a redire: toutesfois pour une personne qui a esté nourri dans un lieu, ou il n'a pu auoir\
    \ ny maistre qui l'enseignast, ny des liures comme on a ailleurs, ce n'est pas peu de d'auoir\
    \ appris ce qu'il sçait des matieres dont il se mesle. Escriuez moy souuent. Soyez ciuil\
    \ au porteur et aimez tousiours\nMonsieur \nVostre treshumble et tresaffectionné seruiteur\
    \ R. Moray."
