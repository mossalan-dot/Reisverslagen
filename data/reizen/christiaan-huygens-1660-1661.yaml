  tekst: Monsieur le Cheualier Neal m'a apporté ce liure ce matin. lisez le, & ayez en soin.
    J'auois enuie de faire quelque memoire pour ceux qui obserueront la coniunction du ☉ & de
    ☿ des choses qu'ils ont a remarquer. Mais il faut que Je m'en remette à vous. Je vous prie
    donc d'en dresser un, & Je tascheray de le faire obseruer exactement. Je suis revenu hier
    a la maison iustement comme vous en estes sorti. J'y seray encore ce soir dieu aidant a
    7. heures sans saute, iusqu' a cette heure là Je ne puis point m'y trouuer ny vous aller
    voir.
- verzender: Cosimo Brunetti
