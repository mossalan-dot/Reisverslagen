  tekst: 'A Paris ce 27 Fevrier 1661.

    Mon frere

    Je ne scaurois vous dire combien cela me fache d''entendre que les 2 lettres par les quelles
    j''ay respondu a autant des vostres ont estè esgarees, et ne puis comprendre comment cela
    est arrivè. Je les ay adressees chez les Ambassadeurs d''Hollande à Madrid avec la superscription
    de vostre nom, mais je suivray maintenant vostre conseil et mettray cellecy sous la couverte
    de Monsieur Boreel. Vostre observation du merveilleux arc en ciel m''a plue infiniment,
    et je vous en auois remerciè, et mesme touchè quelque chose de la cause dont je croy qu''il
    est provenu. Je vous manday aussi beaucoup de particularitez touchant les personnes que
    je frequente icy et les divertissements de Paris. entre autres je vous parlay de l''assemblée
    chez Monsieur de Montmor, et d''une autre chez une Dame, ou l''on examine les Principes
    de Monsieur des Cartes. Je ne scaurois vous redire toutes ces choses, mais je m''en remets
    a ce que je vous en raconteray quand j''auray le bonheur de vous revoir, car je tiens memoire
    de tout. J''ay veu il y a 2 mois une Comedie Italienne en musique avec des entrees de ballet,
    et Monsieur le Premier m''avoit si bien placé, que je sus assis tout proche des 3 niepces
    de Monseigneur le Cardinal, de sorte que je pus les considerer a loisir. Voyla toute la
    familiarité que j''ay eu avec elles, de la quelle vous n''avez pas subject d''estre envieux.
    Hier au soir je vis danser un autre ballet au Louvre, ou je fus aussi tresbien placè et
    mesme j''y fis entrer avec moy Monsieur Harsholte, (fils du Drossart de Brevoort qui sauta
    en l''air avec toute sa famille par le malheur que vous scauez) et Monsieur Falck fils d''un
    Bourgemeester de Zutphen. Nos ambassadeurs avec Madame de Gent et ses filles et Mademoiselle
    Taillefer y furent aussi, mais je ne voulus pas les incommoder en augmentant leur train,
    et aymay mieux d''avoir cette obligation a un conseiller au Parlement qui est de mes amis.
    la presse estoit grande par ce que la sale ne l''est gueres; le feu, dont sans doute vous
    aurez ouy parler, ayant emporté la galerie des Peintures ou l''on avoit basti un beau theatre,
    pour y faire danser ce mesme ballet. J''ay fait plusieurs fois vos baisemains a Taillefer,
    et je l''ay estè veoir chez Madame de Flavacour, je luy ay dit ce que vous m''escrivistes
    de vostre commission la quelle aussi tost elle me revela et a Mesdemoiselles de Gent, ou
    elle vient au presche tous les dimanches.

    J''attends tous les jours ordre pour passer en Angleterre ou le Prince Maurice qui s''y
    en va en ambassade de la part de Monsieur l''Electeur de Brandenbourg a promis à mon Pere
    qu''il me logera et donnera sa table. Je croy que vous seriez bien aise de m''y veoir, a
    ce que je puis entendre par les lettres du frere de Zeelhem. Mon Pere parle d''un voyage
    a Orange ou il auroit enuie de nous mener avec luy, mais qui ne sera pas encore si tost,
    de sorte que je croy qu''auparavant nous nous reverrons in patria. le frere m''escrit qu''il
    y a observè le comete qui paroit depuis quelque temps, et je suis si malheureux icy, que
    je ne l''ay encore pu voir a cause du temps couuert. J''espere que vous aurez eu la curiositè
    de le considerer et de bien remarquer sa forme et autres circonstances. Si Monseigneur le
    Cardinal meurt pendant cette apparition ce qui pouroit bien arriver, car il est assurement
    tresmal, les poetes diront que cet astre a estè fait pour luy comme autrefois il y en eut
    un a la mort de Jules Caesar. La Reine d''Angleterre est arrivée icy depuis 6 ou 7 jours
    et j''espere de la veoir devant que je parte. Je ne m''imagine pas qu''en Angleterre, quand
    mesme je scaurois tres bien la langue, je me puisse aussi bien divertir qu''icy ou j''ay
    fait un grand nombre de connoissances, qui a l''envy l''un de l''autre s''estudient a me
    procurer toute sorte de plaisir. Entre autres je suis fort obligè a Monsieur Menage, qui
    m''a donnè connoissance a plusieurs personnes illustres, comme à Mademoiselle de Scudery,
    Madame de Rambouillet, et autres. a propos de ce nom je vous diray icy derechef que Madame
    de Previgny apres avoir persecutè quelque temps son pretendu mary a enfin changè de religion
    croyant de trouuer par ce moyen beaucoup d''appuy parmy les catholiques, et en effect on
    dit que les Reines luy en ont fait esperer. On a racontè cette conversion et du Seigneur
    van der Voort son fils dans la gazette burlesque. Adieu.'
- verzender: Christiaan Huygens
