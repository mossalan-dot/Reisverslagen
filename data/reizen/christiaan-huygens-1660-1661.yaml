  tekst: 'Probleme propose par Monsieur Chauueau le 10. mars 1661. Resolu par Buot.

    Estant donné les 2 droittes ED. DB trouuer le point A dans la droitte BD. dou tirant la
    droitte AE, le ▭ DBA soit au ▭ AED ‖ r | s ou BD. | DZ.

    Construction.




    EBV. ut -.

    ED | DZ ‖ BC | CE,

    EO | OB. et OP ⟂ sur EB. OC | CB ‖ EC | CV.

    CAV est ☉ descrit sur le diametre AV coupant DB en A.

    Je dis que A est le point requis. du quel si on tire la - AE on aura le

    ▭ DBA | ▭ DEA ‖ r | s

    Preparation.

    QEAB est ☉ et ACP est -.

    Demonstration.

    A cause de la ressemblance des ∆ COP. CAV. CO | CP ‖ AC | CV.

    Donc le ▭ OCV ‖ ▭ ACP. mais par construction OC | CB ‖ EC | CV. donc le ▭ OCV (ou ACP).
    ‖ ▭ BCE et par la. 35. 3. 3 les E.A.B.P. sont a la circonference du ☉ qui a son centre dans
    la ⟂ OP. et larc EP ‖ ◠ BP. et ∠ EAP ‖ ∠ BAC. et partant par la 3.6. BA | AE ‖ BC | CE,
    mais par construction ED | DZ ‖ BC | CE. donc BA | AE ‖ ED | DZ. et le ▭ BADZ ‖ ▭ AED Mais
    le ▭ ABD | ▭ AB. DZ ‖ DB | DZ. 1.6. donc le

    ▭ ABD | ▭ AED ‖ DB | DZ. ou r | s. ce quil fallait demontrer.'
