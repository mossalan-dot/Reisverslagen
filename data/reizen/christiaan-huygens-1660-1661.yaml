  tekst: 'Vendredy matin.

    Je vous supplie, Monsieur, de faire tenir a Monsieur vostre Pere, la lettre que Je vous
    envoye pour luy. Je ne vous céle point que je luy fays des pleintes de vous, & que je luy
    conseille mesme de vous venir querir en diligence, s''il ne veut vous perdre par ce que
    de la sorte que vous estes recherché icy de tout le monde, on vous y arrestera pour toûjours,
    pour peu que cela augmente. Cependant, faites moy la faveur de me mander, si je vous pourray
    trouver demain chez vous, & si je pourrois avoir l''honneur de voir, avec vous, Monsieur
    de Beuninghen; car, dans la foiblesse ou je suis, ce me seroit vne grande peine de faire
    vn si grand voyage inutilement. Je vous donne le bon jour & suis tout á vous

    P.A.'
