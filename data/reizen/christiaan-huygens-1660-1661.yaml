beschrijving: Verslag van een reis naar Frankrijk en Engeland van Christiaan Huygens in 1660-1661.
  Huygens reisde door de Zuidelijke Nederlanden, waar hij stilhield in Antwerpen en Brussel.
  Huygens reisde van Parijs naar Calais en ging daar scheep naar Dover. Hij spendeerde langere
  tijd in Londen, waar hij onder andere de kroning van Karel II bijwoonde. Het verslag eindigt
  in Londen.
