  tekst: 'A la Haye ce 10 Nouembre 1660.

    J''ay reçeu la vostre du 5e. qui n''a mis à venir que quatre jours, en sorte que nous pouvons
    auoir des nouvelles bien fraisches l''un de l''autre. dans celle de mon Pere vous parlez
    d''une autre lettre laquelle n''a jamais esté rendue et pour dire ce que j''en croy, ne
    vous a pas coustè beaucoup de peine à escrire. Je m''imagine que vous auez appris cette
    invention de Monsieur Conrard, qui paya mon Pere l''autre jour d''une longue lettre comme
    scavez, laquelle je croy semblablement imaginaire. Je vous prie bien fort de n''oublier
    pas mon Giouanni Baglione della Vite dei pittori e architetti estant une piece, tres necessaire
    à des amateurs de nostre art, et tout autant, ou peut estre plus que Vasari. J''ay augmenté
    mon livre de desseings depuis vostre depart de six a sept pieces d''importance toutes Italiennes,
    qui vous agreeront infiniment, aussi ne les ay je pas à fort bon marché. Il y en a deux
    de la main del Caualiere Giuseppino, une de Tintoretto, une de Palma Vecchio et une de Rottenhamer
    apres un tableau de Paolo Veronese, tres bien faite, et j''en poursuis encore deux ou trois
    autres qui ne sont pas moindres. Entre les choses dont vous me mandez la mode je trouve
    à dire les rabats et les chausses dont vous ne dites rien à mon tres grand estonnement.
    Les lettres d''Angleterre sont venues aujourdhuy, et a ce qu''on peut conjecturer de ce
    que mande Oudart et Mademoiselle du Moulin, laquelle est la chez son Frere, l''affaire de
    Mistris Hide, à laquelle le duc de Yorck a fait un enfant dont elle vient d''accoucher,
    et est un Fils, pourroit bien encore causer d''autres suites que l''on ne s''en est promis
    jusques à present, et aboutir finalement à un mariage. Le Roy ayant envoyé expres des Seigneurs
    et de dames pour l''aller trouver et examiner estant en travail d''enfant, auxquels elle
    declara en premier lieu que l''enfant estoit au duc de Yorck, elle n''ayant jamais fait
    faveur de sa personne à aucun homme qu''a luy seul, et secondement qu''entre ledit duc et
    elle, il y auoit mariage legitime, et qu''elle estoit sa femme. On dit que cela a beaucoup
    surpris la Princesse Royale, sur tout quand des personnes en sa presence auroyent bien osé
    donner a cette dame la qualité de duchesse laquelle luy appartenant une fois tout de bon,
    seroit cause qu''elle pretendroit rang deuant sa maistresse, chose de dure digestion. Tant
    y a que le putanesimo pourroit bien triompher; ce qui estant, sans doubte va donner courage
    aux dames pour entreprendre des choses hasardeuses. Il est arriué icy ces jours passes une
    chose assez plaisante d''une putain qu''un certain Godin d''Amsterdam auoit mise en pension
    chez mademoiselle Nelsum que vous connoissez, luy faisant accroire que c''estoit une sienne
    niepçe dont il estoit tuteur. Cette creature se voyant icy inconnue et en estat de pouvoir
    abuser le monde, ayant estant entretenue de toutes choses de son galand qui luy donnoit
    des belles juppes et luy nourrissoit et une servante laquelle estoit sa soeur, aussi bien
    qu''elle faite au badinage, se resolut d''essayer un peu si elle pourroit bien faire l''amour
    en fille de bien; et laissant courir le bruict qu''elle auoit quelques quatre vingt mille
    livres de bien, aussi tost ne manqua pas de grand nombre de courtisans, et sa maison crevoit
    touts les jours d''advocats, procureurs, eschevins de la ville &c. qui luy faisoyent l''amour
    avec grand empressement, et quelques uns mesme la demandant en mariage. Elle rebutoit les
    uns, traisnoit les autres et jouoit si bien son rolle que cela a duré des trois a quatre
    mois, cherchant comme je croy de bien prendre son temps pour faire quelque bon coup. mais
    à la fin la mine a este esventée par un certain galand dont j''ay oublié le nom, lequel
    luy en voulant tout de bon depescha ce Bernarts qui sert de Secretaire à Monsieur l''Ambassadeur,
    pour Amsterdam, afin de s''informer un peu au vray de l''estat des affaires de sa maistresse.
    Bernarts estant là a sçeu que c''estoit une garce assez connue, quil''auoit este des ses
    treize ans et qui n''auoit autre revenu que celuy qu''elle tiroit de sa personne et du mestier
    qu''elle faisoit. Ce rapport fit passer au Galand la fantasie de l''espouser aussi bien
    qu''a touts ses rivaulx, et a la dame l''envie de plus sejourner icy, s''estant retournee
    tout doucement à la grande confusion de ses courtisans, lesquels sont raillés comme pouvez
    croire. Monsieur Boy a perdu son fils aisné ces jours passés, c''estoit un beau jeusne homme
    et d''apparence comme lon dit, et le pere regrette tres fort. Mademoiselle Kien nostre voysine
    est encore fort malade, mais pourtant il y a apparence qu''elle en reschappera. Je croy
    que vous aurez desja entendu que Sixti espouse une fille de Dantzic ou il est maintenant,
    bien belle et assez accommodée, a laquelle il a fait l''amour estant en ces quartiers avec
    Monsieur van den Honaert son Oncle. la ratification du traité que le Cousin Huygens a fait
    pour la charge de drossard de Kranendonc avec Monsieur Througmorton est venue d''Angleterre,
    et il est allé s''informer sur le lieu de toutes les choses qu''il faut qu''il scache. Morin
    est encore en Zelande comme lon croit pour poursuivre ses amours. Je vous prie de me mander
    un peu comment et en quel estat vous avez trouvé le pauvre Tassin, et s''il respire encore.
    Si vous voyez le Seigneur Nanteuil je croy que vous vous souviendrez de scavoir un peu de
    luy au vray et par le menu comment c''est que lon fait ces choses de Vislijm om deur te
    trecken. Je vous recommande encore le livre des pittori, et si le trouuez je vous prie de
    me mander un peu quelle sorte d''escriuain c''est, et s''il rapporte les vies de plusjeurs
    maistres et quels en sont les principaulx. Si vous voyez Vlaerdingen saluez de ma part,
    le mesnage qu''il fait est tres beau, aussi je ne m''en suis jamais imaginé autre chose.
    A tant je prie le Createur.'
