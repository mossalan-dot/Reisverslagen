  tekst: 'A la Haye le 20 Janvier 1661.

    Apres avoir constamment attendu vostre Marquis de S. Agathe dans une ferme esperance de
    le voir icy d''heure à autre, à la fin nous apprismes il y a sept ou huit jours que depuis
    pareil espace de temps il se rejouissoit a Amsterdam, sans se soucier de nous faire avoir
    nos paquets, pour mortifier, comme je croy, nostre impatience et curiosité. A la fin j''en
    ay escrit au Cousin Becker de luy en faire souvenir et de nous faire avoir nos hardes s''il
    est d''intention de rester encore d''avantage par de là. Si vous eussiez donné mon livre
    a Monsieur de Seventer il y a plus de quinze jours que je l''aurois en icy. La mort de la
    Princesse causera encores aparemment du bruit. Le Roy qu''elle a nommé Tuteur à son Fils,
    pretend d''en faire la charge en toutes ses parties, et par consequent d''avoir en ceste
    qualité la disposition de la moitié des charges et benefices dans les terres de Son Altesse,
    et c''est ce qu''à Cleve l''on entendra pas ainsi selon l''apparence, et les bruits sourds
    qui en courent, bien que jusques à present l''on ne se soit point declaré. Madame fait escrire
    seulement au Conseil, de tenir toutes les choses en l''estat ou elles sont, et d''user de
    ces premieres precautions dont on se sert dans les maisons mortuaires, comme de mettre le
    seau au coffres et armoires etc. Au reste la Princesse a fait sa nièce la Reine d''Angeleterre
    son heritiere avec charge expresse de payer ses debtes, et de satisfaire à ses legataires.
    Au Prince son fils elle ne laisse rien, mais ordonne que les joyaux qu''elle a cus de son
    Pere luy soyent restitués (comme sans cela ils le devoyent estre en vertu du contract de
    mariage) et desire qu''il donne des recompenses a ses domestiques. Ce Testament selon nos
    loix seroit Inofficiosum, et par consequent sans aucune valeur, mais en Angleterre l''on
    dit qu''on en peut faire des semblables, et que les peres et meres ne sont pas obligé de
    laisser à leur enfans plus qu''ils ne veulent. Elle desire encore que le Roy veuille avoir
    soin de sa Regence d''Orange, chose qu''on trouve icy hors de toute raison, scavoir qu''elle
    dispose d''une chose comme par testament, qui est purement personelle, et qui luy avoit
    esté deferée comme mere du Prince, de mesme comme si une personne pourveue de quelque charge
    publique (prenez de Pensionnaire d''Hollande) la laissoit par testament à un autre de ses
    amys. Cependant on dit que le Roy y a desja envoyé à Orange pour se faire recognoitre Regent,
    ce qui estant veritable fera du bruit asseurement, si Dieu n''y met la main, car à Cleves
    on parle aussi fort hault. Il faut voir ce qui en arrivera. On dit que le Prince Maurice
    va en Angleterre de la part de Monsieur l''Electeur, et d''aucuns s''imaginent que ce pouroit
    estre pour des affaires de mariage de la Princesse Marie. mais tout cela est fort incertain
    pour ne dire pas de peu d''apparence. Mais s''il y va il y fera de bons offices sans doubte
    et empeschera les parties de s''aigrir. Pour l''evenement de toutes ces choses je croy que
    vous viendrez l''attendre icy avec nous, et serez de retour avant qu''il soit long temps,
    mon Pere qui vous en escrit commence à en parler tout de bon, et mesme je croy qu''il vous
    en mande quelque chose par cet ordinaire s''estonnant de ce que dans vos deux dernieres
    vous ne luy en dites chose qui soit.

    Monsieur Navander nostre voysin et amy mourut lundy passé d''une maladie de deux jours,
    et est fort regresté. Mademoiselle Scion languit encore et apparamment ne la fera pas longue.
    Pour reparation de semblables pertes pour le genre humain, Messieurs de Wevelinckhoven,
    de Nieuwerkerk et Drost sont l''amour à outrance aux demoiselles Paeuw, l''aisnée des Ryckert
    et la cadette respectivelyck. Monsieur Bisschop fait encore rage de desseigner, et cinq
    ou six qu''ils sont ils ont estably une academie de peintres, ou quatre fois la sepmaine
    ils vont desseigner un homme nud et afin que connoissiez leur modelle, c''est un grand garçon
    nommé Antony, et dont le nom de guerre est de vliegende Platluijs.

    Je vous prie de me mander un peu ce que fait Jan van Vlaerdingen et quelle vie il mene.
    Je suis

    Vostre frere et serviteur C. Huygens.

    Il faut prendre garde de parler avec circonspection des affaires de la Princesse Royale
    et en tout cas ne produire pas cette lettre.'
- verzender: Constantijn Huygens jr. (1628-1697)
  ontvanger: Christiaan Huygens
  datum: 27-01-1661
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A la Haye ce 27e Janvier 1661.

    Vous ne receurez pas des lettres de mon Pere ny par cet ordinaire, ny par celuy qui le suivra.
    Vendredy il reçeut une lettre par laquelle on le mande pour aller trouver Madame à Cleves
    à l''occasion de la mort de la Princesse Royale. Comme le lendemain il partit, et selon
    le calcul que j''en fais, aura estè la hier au soir. Il pourroit bien arriver, qu''on luy
    feroit faire le voyage d''Angleterre, et mesme dans la lettre, dont je viens de parler,
    il en est touché quelque chose, et en ce cas il m''a parlé de vous faire venir la aupres
    de luy, et de tascher puis apres de se saire donner quelque commission pour Paris, que scavez
    qu''il a tousjours eu grande envie de voir. Mais tout cecy est encore bien incertain; et
    c''est pourquoy vous n''en devez rien dire à personne, qui que ce soit. Ce voyage se feroit
    pour les affaires de la Tutele, comme sans doubte il en sera bon besoin, pour prevenir des
    brouilleries qui ne se pourront eviter à moins qu''il soit fait des fort bons offices entre
    deux. d''Angleterre on nous mande que la Princesse Henriette d''Angleterre est aussi tombée
    malade de la petite verole, estant desja embarquee pour aller en France espouser le Frere
    du Roy, mais cecy vous le sçaurez par des voyes plus courtes. Icy la Princesse Kien mourut
    dimanche passé apres une longue maladie de trois mois, tellement que vous ne devez plus
    craindre d''auoir la teste rompue des nouvelles de sa santé. Tootbroer nous escrit les plus
    plaisantes lettres du monde de Madrid, et se plaint fort de vous, dont il dit n''auoir receu
    lettre aucune jusques au 29. decembre datte de ses dernieres. Vous n''aviez que faire de
    prendre le deuil pour la mort de la Princesse mon Pere n''ayant pas jugé necessaire que
    moy je le fisse. Adieu.

    Ce fol de St. Agate est encore à Amsterdam et ne m''a pas envoyé mon livre.'
- verzender: Constantijn Huygens jr. (1628-1697)
  ontvanger: Christiaan Huygens
  datum: 10-02-1661
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Parijs
  land_ontvanger: FR
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A la Haye le 10 Fevrier 1660

    J''ay receu vostre derniere du 4e au commencement de laquelle vous parlez du Sieur de St.
    Agate, duquel j''ay enfin eu mon liure apres le luy auoir fait demander par deux fois. Il
    n''a point encore esté icy, et à moins de faire ce que j''ay fait probablement mon livre
    seroit encor à venir. Peu de temps apres qu''il fut arriué à Amsterdam, il fut nominé pour
    estre escheuin, comme en suite il l''a esté fait, cette affaire ayant esté preparée par
    son Pere comme je croy auant qu''il partit d''icy ce qui luy estoit aisé par le moyen de
    Monsieur de Polsbrouck, lequel est fort de ses amys. Mon Pere est revenu de Cleue bien satisfait
    de l''acceuil qu''il y a receu, mais n''ira pas en Angleterre ou Monsieur l''Electeur envoye
    le Prince Maurice et le Sieur Wyman comme sans doubte mon Pere vous mande, et de mesme comment
    il a dessein de vous faire passer dans le dit païs pour y aller trouver ce Prince, chose
    dont je m'' asseure que serez trescontent, deuant auoir occasion par là tant pour vous perfectionner
    dans la langue comme pour aller voir touts ces faiseurs d''Almanacs et de lunettes d''approche,
    qui sont de vostre connoissance. Je suis tres aise d''entendre que la Mouchon est encores
    en estre, et tres fasché de ce que vous ne luy avez pas parlé ny rien dit de moy. Je fais
    estat maintenant que je scay qu''ell'' est encor au monde de luy escrire un compliment par
    le prochain ordinaire pour l''asseurer du souvenir que j''ay de ses potages. Je ne doubte
    pas que n''ayez veu le nouveau Comete qui paroist icy depuis quelques jours du coste de
    l''Orient. Je me levay hier a 3 heures et montay par un grand froid au hault de nostre maison
    sans le pouvoir trouver, estant encore trop proche de l''horizon, mais depuis y estant retourné
    a 5. je le vis d''abord qui estoit desja esleué de quelque 30. degrés, et reconnoissable
    mesme sans lunettes d''approche, auec lesquelles je le puis voir de ma chambre à l''aise.
    Je l''ay veu avec les grandes que nous avons, mais par ce que sa lumiere est assez foible,
    je trouve qu'' avec celles de cinq pieds on en decouvre tout autant de perfection qu''avec
    les autres. Je n''ay que faire de vous dire les particularités de mon obseruation par ce
    que je scay que vous en aurez fait par de là vous mesmes auec la lunette qu'' avez emportée.
    Je vous diray seulement que cette nuict passée je croy que la moitjé des habitants de ce
    lieu a esté en campagne pour aller voir ce nouveau phenomene, et que depuis les trois heures
    jusques a ce qu''il a commencé à faire jour je n''ay pû dormir à cause du tintamarre que
    faisoyent les gens qui alloyent et revenoyent par la rue comme en procession. Il me tarde
    fort d''entendre quand et comment cette Comete vous est apparue, estant chose que je scay
    qu''il y a long temps que vous la desirez.

    Des mariages dont je vous puis auoir escrit par le passé il ne s''en fait aucun jusques
    à present, mesmes plusjeurs de ces affaires qu''on croyoit bien avancées reculent plus qu''elles
    n''auancent comm'' entr'' autres celle de Margrietje laquelle s''est terminée à ce que l''on
    dit par un refus, ou quelque chose de bien approchant, le Caualier pourtant continue tousjours
    ses visites et ne quitte pas encore la partie, tellement que je ne scay ce qu''il en faut
    juger. Drost fait tousjours la cour à la cadette avec grand empressement, mais je doubte
    pourtant beaucoup du succes. de l''affaire de Flodorp on parle avec quelque certitude, mesme
    chez la fille, et l''on dit qu''il s''est donné des promesses de costé et d''autre. Je vous
    prie de voir les pieces de Callot qu''a le Blond, et si lon en pourroit auoir une a deux
    a bon marché, car à moins de cela il vaudra mieux de les laisser là, mandez moy aussi un
    peu quels desseins d''Italie il a et s''ils vous semblent bien bons. Adio.'
- verzender: Constantijn Huygens jr. (1628-1697)
  ontvanger: Christiaan Huygens
  datum: 17-02-1661
  plaats_verzender: Den Haag
