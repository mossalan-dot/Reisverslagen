  tekst: "A Monsieur \nMonsieur Chr: Huijgens de Zuijlichem \na Paris. \nde la Haije le 3 mars\
    \ 1661.\nPuisque vous allez faire encore un tour en Angleterre auant que de retourner par\
    \ deça, vous m'obligerez s'il vous plaist de bailler les choses que vous auez pris la peijne\
    \ de m'achepter a Paris, empacquettees ensemble, a quelqu'un de nos marchands de la Haije\
    \ qui sont a present a Paris pour faire emplette de nouelles nippes, comme Prangan ou van\
    \ Heteren qui est partij de la haije pour cet effet il ij a enuiron quinze jours, sans doutte.\
    \ ils viennent quelque fois a l hostel de Messieurs les Ambassadeurs tellement que vous\
    \ ne pourrez pas manquer d'en trouuer quelqun, s'il vous plaist seulement de donner ordre\
    \ chez les ambassadeurs que quand quelqun d'eux ij vient qu'on vous l'envoije chez vous.\n\
    C'est la à mon auis le plus seur et meilleur moijen de me les faire tenir, et vous en serez\
    \ en mesme temps dechargé, je vous ay donné assez de peijne en vous chargeant de ces commissions,\
    \ sans que j'embarasse encore vos coffres de mes hardes et vous suis infiniment obligé pour\
    \ la faueur que vous m'avez faitte, je tacheray a vostre retour de m'en acquiter le mieux\
    \ qu'il me sera possible, cependant je souhaitte auec beaucoup de passion de pouuoir trouuer\
    \ occasion de vous rendre pendant vostre absence quelque seruice agreable icij.\nJe vous\
    \ manday il y a quelque temps que j'auois rencontré le sieur Bouilleau a Amsterdam sur le\
    \ point d'aller commencer son voijage de Pologne cette semaine il est venu une lettre de\
    \ luy a monsr. l'Ambassadeur de France dattee de Lubec d'ou il deuoit partir le lendemain,\
    \ tellement qu'il doit estre desia bien loin presentement.\nPour nouuelles, le venerable\
    \ monsr. Chappuseau se trouuant un peu trop importuné par ses creanciers s'est trouué obligé\
    \ un de ces jours passez de se retirer subitement bij noorderson (comme l'on dit) au grand\
    \ regret de beaucoup d'honnestes gens non pas pour l'amour de sa personne mais de l'argent\
    \ qu'il auoit emprunté presque de tous ceux qui l'ont cognu. Je ny ay pourtant point de\
    \ part dieu mercy. Monsieur Machaut qui est son Patron et qui l'a poussé a la fortune ou\
    \ il estoit paruenu dit partout qu'il est allé faire un petit voijage en France pour y vendre\
    \ quelque bien et a la poursuitte d'une pretension d'environ vingt mille francs. Vous pouuez\
    \ juger ce qui en est qui l'auez cognu aussi bien que nous autres, Gueux de nud comme un\
    \ rat.\nMa femme se porte redelijckjes naer den [vleesche?] Vous demeurez encore quelques\
    \ quatre ou cinq mois dehors, sans incidans facheux et un malheur comme la premiere fois\
    \ vous pourrez voir s'il plaist a dieu a vostre retour a quoij nous auons estez occupez\
    \ pendant vostre absence. de nouuelles particulieres de Galanterie de ce paijs il n'y a\
    \ rien que je sache d'arriué depuis ma derniere gazette qui merite de vous estre escrit.\
    \ tellement que je n'ay qu'a vous prier de me vouloir faire la faueur de me conseruer l'honneur\
    \ de vos bonnes graces estant de tout mon coeur\nVostre tres humble et tres affectionné\
    \ seruiteur et Frere \nPh. Doublet."
