  tekst: "de la Haije le 9 Decembre 1660.\nMonsieur mon frere.\nSi jaij manqué jusques astheure\
    \ a vous rendre mes deuoirs, ce n'a pas esté faute de scauoir ce que je vous doibs, ni aussi\
    \ par paresse comme l'on se pourroit peut estre jmaginer, mais pour ne vous pas estre jmportun\
    \ en vous escriuant des choses que vous pouuiez scauoir a schasque ordinaire du Sire de\
    \ Zeelhem, qui vous a fournij touttes les nouuelles de ce paijs cij. Comme je me suis donc\
    \ jmaginé que pour cette fois vous pourriez n'en point receuoir que les miennes, (le dit\
    \ frere s'estant plaint a moy l'autre jour qu'il ny auoit que luij qui voulust prendre la\
    \ peijne d'estre le Gasettier de France et d'Espagne; mais qu'il n'en feroit plus rien a\
    \ l'auenir si nous n'escriuions tous a nostre tour,) (aussi je trouue qu'il a raison car\
    \ c'est un trop pesant fardeau pour un homme chargé d'affaires comme luij, d'escrire tous\
    \ les huict jours une lettre,) je n'ay pas voulu laisser eschapper cette occasion pour vous\
    \ rendre ce petit seruice de vous jnformer de ce qu'on fait icij, en attendant que vous\
    \ me donniez occasion de vous pouuoir tesmoigner par quelque chose de plus d'jmportance\
    \ combien je suis vostre tres humble seruiteur. Mais laissons la les complimens je commencois\
    \ desia a mij engager si auant, qu'apres j'aurois de la peijne a m'en bien degager. Comme\
    \ donc la cour est petitte il ne se passe presque rien qui vaille la peijne de vous estre\
    \ mandé, tout ce qu'on fait c'et d'aller a la Comedie, tout le monde est si acharné apres\
    \ ce diuertissement la qu'on ne parle d'autre chose, et tout ce qu'il y a de beau monde\
    \ a la Haije y court sur le cinq heures du soir auec tant d'empressement que rien plus.\
    \ Les dames qui n'y vont pas, ou pour nij prendre point de plaisir, ou pour n'oser a cause\
    \ de leur age, ou veufage et autres telles raisons incommodes, ne laissans pas d'auoir la\
    \ volonté bonne, entre les quelles est nostre bonne Tante de W., se trouuent furieusement\
    \ jncommodees et passent leur temps fort mal. car apres cinq heures sonnees, elles n'ont\
    \ point d'autres diuertissement que de s'entretenir elles mesmes, et alors la Haije est\
    \ une solitude pure, on nij voit point de lumiere aux fenestres, point de carosses deuant\
    \ les portes, ni du monde par les rues. Pour ce qui est des Commediens, vous vous en jmaginez\
    \ sans doutte quelque chose d'extraordinaire, sur ce que je viens de vous dire, mais tels\
    \ qu'ils sont on s'en diuertit, fautte de meilleurs. Jl y a trois femmes qui font fort bien,\
    \ mais il y en a une de celles la, qui ne cede en rien au jugement de tout le monde, a tout\
    \ ce que l'hostel de Bourgogne a jamais produit. On lappelle la du Rocher, elle est belle\
    \ comme un ange et joue en perfection, au jugement mesme de madame la Barre, qui se connoist\
    \ un peu a ce mestier. Entre les hommes il ij en a deux qui font bien, Monsieur Donoy ose\
    \ presque comparer l'un a Floridor. le reste ne vaut pas grand chose. la plus part de nos\
    \ dames, s'entant les plus zelees pour la Commedie, ont de petits retranchemens ou Loges\
    \ de trois ou quattre personnes dans le parterre, quelles loüent pour cinquante francs par\
    \ mois, s'entant chasque place, et de la sorte les Aerssens ij vont pour 250 francs par\
    \ mois. Les autres a l'aduenant, tellement qu'on les meijne a fort peu de frais a la Comedie,\
    \ en paijant pour soij mesme, et fautte de galands les dames et demoiselles y vont touttes\
    \ seules, comme a l'Eglise sans scandale aucun. Celles qui ont de ces Loges comme je vous\
    \ dis sont madame de Hoorn, de Mompouillan, de Cats, de Düuenvoorde, de Valckenbourg, qui\
    \ s'est assosiee auec la cousine Dorp et mademoiselle de Nieveen, les Aerssens, et encore\
    \ quelques autres. Le duc de Lunebourg est de retour depuis quelques jours a la Haije, et\
    \ a fait faire tout expres un retranchement pour luij tout contre celuij des Aerssens pour\
    \ entretenir la belle. Ce qui donne bien de la jalousie aux autres et de la vanité a elles.\
    \ Jl se dit que un de ces jours passez la Reijne luij aijant dit entre autre choses, que\
    \ c'estoient des belles paijsannes, le duc auroit respondu que de paisannes comme celles\
    \ la on pourroit bien faire des duchesses. S'il est vraij je n'en scaij rien, je vous le\
    \ donne comme on me l'a donné. Madame de Carisius doibt arriuer ce soir a la Haije de son\
    \ voijage de Dannemarck. elle rameine sa fille Sophie, et l'autre demeure en Dannemarck.\
    \ Les Paeuwties, Ryckerties, Bellen et le reste de cette volee sont encore au mesme estat\
    \ que vous les auez laissees. Le mariage de mademoiselle de Waesdorp, se fera en peu a ce\
    \ qu'on dit, ils font desia emplette de meubles. Aupres de mademoiselle de Nieueen les places\
    \ sont vacantes et par un je ne scay quel reuers de fortune il ne luij reste de tous ces\
    \ adorateurs, que la seule cousine Dorp. on attend de jour a autre quelque nouuelle recreue\
    \ de galans pour elle. Languerack ne luij parle plus jamais quoij qu'il soit tous les soirs\
    \ fort proche d'elle a la Comedie.\nPendant que j'escris cecij ma femme recoit une lettre\
    \ du frere Louijs escrite a la Rade de St. Antonio en Biscaije le neufjesme du mois passé.\
    \ jusques la ils estoient venus sans aucune jncommodité. Jl escrit beaucoup de la beauté\
    \ du paijs, quoij qu'il en ait encore fort peu veu, tout le paijs ou ils sont est tout pleijn\
    \ d'orangers et citroniers charges de fleurs et de fruict, en la saison ou nous sommes.\
    \ mais les personnes plus semblables a des Egiptiens, qu'a des Chrestiens, et n'ont point\
    \ la prattique de mettre le blanc d'Espagne en usage. Le sieur Leeuwen est auec sa famille\
    \ depuis quelque jours a la Haije et y demeure encore quelque temps pour l'amour de la Comedie.\
    \ Voila tout ce que je scaij pour le present.\nJe vous prie de nous faire scauoir un peu\
    \ de ce qu'on fait par de la, comme quoij on vit a l'hostel d'Hollande, ce que fait mademoiselle\
    \ de Taillefer la pauure fille, on dit icij qu'elle ne trouue pas son compte a Paris. Si\
    \ le bon Tassin est encore en vie, c'est ce que je desire fort de scauoir. Sans doutte vous\
    \ voijez ca et la bien de belles choses et il ne se peut que vous n'aijez desia veu les\
    \ Sieurs Nantueil, Bosse, Israel et autres de leur sorte, vous m'obligeriez jnfiniment si,\
    \ quand par hasard vous voijez quelque chose de nouueau de ce messieurs, vous vouliez prendre\
    \ la peijne d'en faire quelque emplette pour moij, comme aussi du Pautre, Marot, et telles\
    \ gens, qui nous donnent de si belles choses en l'architecture. Je vous en tiendray bon\
    \ compte a vostre retour, ou bien si vous le trouuez bon je vous pourrois faire tenir pour\
    \ cet effet quelque somme d'argent de cent Escus ou enuiron pour les emploijer en telles\
    \ marchandises, liures nouueaux, Comedies etc. Je laisse tout a vostre discretion, vous\
    \ y cognoissant aux belles et bonnes choses comme vous faittes. Vous me feriez plaisir aussi\
    \ de m'aschepter les Oeuures Geographiques du Sieur Sanson. Jl vous souuient sans doutte\
    \ de l'Exemplaire que vous auez veu il y a enuiron un an au Comte de Dhona, il estoit enluminé,\
    \ sur touttes les limites des Prouinces et Royaumes, et tout le reste scauoir les ornemens\
    \ etc. estoient en blanc, s'il estoit possible je desirerois de l'auoir de mesme. On m'a\
    \ parlé de planches en taille douce. qui auroient esté faittes des Arcs Triompheaux erigez\
    \ a Paris lors de l'Entrée du Roij. S'il en est quelque chose je seraij bien aise de les\
    \ pouuoir auoir, s'entend s'ils le merittent, comme aussi des nouueaux bastimens du Louure,\
    \ sachons un peu s'il vous plaist comment ce vaste édifice auance, je me l'jmagine tresgrand\
    \ et superbe. Je suis jnciuil me direz vous ou au moins vous le penserez mon cher frere,\
    \ d'oser vous scharger de tant de commissions, mais je serois marri que vous en fissiez\
    \ quelque chose, sinon a vos heures perdues et que vous n'auriez rien autre chose a faire,\
    \ et si cependant je vous puis estre utile par deca en quelque chose que ce soit vous n'auez\
    \ qu'a commander celuy qui tiendra a grand bonheur de vous pouuoir tesmoigner combien je\
    \ suis\nMonsieur mon Frere \nVostre tresaffectionné serviteur et Frere Ph. Doublet.\nMa\
    \ Femme vous baise les mains et ne laisse pas pour cela de se plaindre de ce que vous ne\
    \ vous souuenez plus d'elle. c'est ce qu'elle me commande de vous dire. adieu."
