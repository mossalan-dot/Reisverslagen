  tekst: 'Lundy matin

    N''ayant pu auoir des hier vostre response pour la partie de Monsieur Ampiou je viens dapprendre
    de luy qu''elle ne pourra sexecuter qu''apres demain Mecredy a cause qu''il en desire faire
    Monsieur de Monplaisir Lieutenant de Roy dArras son Amy et le mien et vn des plus honnestes
    hommes du monde. Si donc Monsieur vous pouués Mecredy luy faire cette grace comme je l''espere,
    il vous ira prendre entre onze heures et midy ou plus tost mesme ou vous enuoyera son carosse
    pour me venir prendre ensuitte afin d''aller ensemble chés luy. Mandés moy je vous prie
    entre cy et midy aujourdhuy si vous pouués accomplir cette partie la Mecredy et en ce cas
    soyes sil vous plaist ches vous Mecredy matin depuis dix heures jusqua midy

    Chapelain.'
