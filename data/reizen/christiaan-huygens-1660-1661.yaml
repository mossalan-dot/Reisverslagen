  tekst: 'Nobilissime Vir,

    Litteras cum acceperim diebus proxime elapsis Florentia a Serenissimo Principe Leopoldo
    tibi tradendas eas, ne quid in me morae esset, viro illustri Parenti tuo confestim credidi,
    quod iam hinc discessisses. Adjunxerat ijs duas dissertationes Mathematicas Carolus Datus,
    alteram Joannis Alphonsi Borelli, Laurentij Magalotti alteram. Utramque hic mitto, cum ipsa
    Dati epistola ut intelligas, quid fieri ille de dissertationibus velit. Eam tamen ut mox
    ad me remittas rogo: ne responsione mea fraudetur vir amicissimus. Iter ex voto te confecisse
    spero. de quo proximos nuncios certiorem me facturos augurari licet. Amicos Parisienses
    meis verbis velim officiose salutes, Celeberrimum imprimis Capellanum, quem ego virum in
    oculis assidue, ut scis, fero. Plura vellem, sed urgent abitum Oratores nostri, quibus hunc
    fasciculum commisi. Vale et me ama. Dabam Hagae Comitis Anno cIɔIɔclx. Kal. Novembr.

    Tuus omni studio ac cultu Nicolaus Heinsius.'
