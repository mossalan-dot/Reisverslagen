  tekst: 'Xerxes Comedie Italiene en musique.

    A la galerie des peintures. le theatre estoit un bastiment d''une grand sale, d''ordre Corinthien,
    ou plustost de trois sales l''une derriere l''autre, en sorte que de la premiere on montoit
    par 3 ou 4 degrez dans la seconde, et de celle cy de mesme a la troisieme. les murailles
    et les colonnes estoyent toutes couvertes des tapisseries brodees d''or sur un fonds de
    velour bleu. les chapitaux avoyent au lieu du feuillage accoustumè des plumes blanches et
    rouges, et les bases d''un vernis rouge luisant. toute la route estoit aussi couverte d''autres
    tapis brodez semees. Et tout cela estant esclairè de quantitè de bougies partie dans......
    de crystal, partie en bas sur le theatre et derriere les colomnes, avoit un esclat et magnificence
    tresgrande. le theatre occupoit a peu pres la moitiè de la galerie, l''autre moitiè estoit
    toute pleine des bancs horsmis une place ou estoient les chaises du Roy des Reines et de
    Monsieur. l''on avoit aussi fait une grande loge a costè gauche pour les Ambassadeurs et
    une de mesme de l''autre costè pour placer quelques dames et on me dit que Monsieur Inselin
    y estoit aussi.

    Monsieur Des Champs m''avoit envoyè un biliet estant a table, par le quel il me fit scavoir
    que Monsieur le Premier m''attendroit à 2 heures, pour me faire bien placer a la Comedie,
    à la quelle assignation m''estant trouuè Monsieur le Premier eut la bontè de s''en aller
    au Louvre avec moy et jusques a la sale de la Comedie, ou il parla un lieutenant des gardes
    et me fit donner une fort bonne place sur un banc qui estoit soubs la loge a main droite.
    Il falloit attendre la plus de 2 heures devant que le Roy vint, a scavoir depuis 4 jusques
    a 7, mais le temps ne m''ennuyoit point.'
- verzender: Christiaan Huygens
  ontvanger: Constantijn Huygens jr. (1628-1697)
