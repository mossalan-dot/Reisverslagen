beschrijving: Verslag van een educatiereis van Joannes Kool naar Frankrijk en Italië in 1698-1699
  in het gezelschap van Lucas van Voorst. Zijn reis was academisch van aard. Kool trok van Utrecht
  via de Zuidelijke Nederlanden naar Parijs, waar hij langere tijd verbleef. Hij trok naar Lyon
  en Genève en stak de Alpen over naar Turijn. In Italië bezocht hij onder andere Genua, Milaan,
  Bologna, Florence en Rome. Vanuit Rome maakte hij een uitstapje naar Napels. Hij keerde via
  de Adriatische kust noordelijk naar Venetië. Hij stak bij Innsbruck de Alpen over en vervorderde
  zijn tocht noordelijk naar Augsburg, Frankfurt, Keulen en Aken. Hij bezocht Maastricht en
  Den Bosch en arriveerde in Utrecht. Kool verbleef langere tijd in Parijs (49 dagen), Florence
  (47 dagen) en Rome.
