beschrijving: Ongepagineerd verslag van een plezierreisje per schip van Johan Vegelin van Claerbergen
  naar Amsterdam in het gezelschap van zijn broer Assuerus (1687-1771), Wijnout Leffring en
  zijn vrouw, Anne Bijters en zijn gezin en Geringa en zijn vrouw. Vegelin van Claerbergen reisde
  van Joure naar Alkmaar en Amsterdam.
