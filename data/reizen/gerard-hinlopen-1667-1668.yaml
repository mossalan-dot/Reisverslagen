beschrijving: Verslag van een educatiereis van Gerard Hinlopen naar Frankrijk en Engeland in
  1667-1668. Zijn tante Judith de la Bretonnerie en neef Reinier Hinlopen vergezelden hem tot
  Parijs. Hinlopen ging scheep in Vlissingen en arriveerde in Duinkerken. Hij bezocht Parijs
  en reisde langs de Loiresteden, waar hij tweeënhalve maand in Angers doorbracht. Aan de universiteit
  van Orléans promoveerde hij in de rechten. Hij stak het Kanaal over tussen Dieppe en Rye en
  spendeerde meer dan een maand in Londen, alvorens in Margate scheep te gaan en terug te keren
  naar Hoorn. Hinlopen verbleef langere tijd in Parijs (6-27 juni 1667; 12-27 februari 1668),
  Angers (8-15 augustus 1667; 19 augustus-9 september; 6 oktober-28 januari 1668), Rennes (14
  september-5 oktober) en Londen (7 maart-16 april).
