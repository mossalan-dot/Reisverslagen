  link: ttp://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg001/0085
  tekst: 'Gelukkig, dat het u allen goed gaat; ook wij zijn gezond, ik vooral. Over 8 of 9 dagen
    vertrekken wij van hier; morgen heeft de gezant zijne derde audientie en de volgende week
    de laatste. Het is wel jammer, dat ik zoo weinig van Italië zie; eenigen der onzen, Pau,
    Boelesz en misschien Linteloo blijven hier en gaan later verder op. Het is onaangenaam,
    dat wij langs denzelfden weg zullen terugkeeren; de gezant had door Savoye willen gaan,
    maar de gezant van dat land te Venetië heeft hem niet eens een bezoek gebracht, en men maakt
    bezwaar ons een paspoort te geven door het land van Milaan. En wij moeten er voor oppassen
    niet in handen te vallen van hen, die maar al te zeer het oog op dit gezantschap gevestigd
    houden. Wij gaan weer den Rijn langs. Ik tracht den gezant te overreden, zijn vroeger plan
    te volgen en Sédan aan te doen; dan zou ik in 2½ dag te Parijs kunnen zijn. In elk geval
    denk ik over Frankrijk terug te reizen, waar ik de Prinses van Oranje kan ontmoeten. Uit
    den Haag kan aan den heer van Langerack worden geschreven.


    ‘S''il y avoit moyen que je peusse me ranger de la suite de Mad.e la Princesse, ce seroit
    bien le meilleur mesnage; autrement la despence en pesera un peu d''avantage, notamment
    à raison des fraix de la promotion, que je ne negligeroye pas volontiers.’ .....


    De Venise, ce 25e de Juin 1620.


    Aan moeder zal ik over zee een spiegel zenden.'
- verzender: Constantijn Huygens
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 02-07-1620
  plaats_verzender: Venetië
  land_verzender: IT
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-ouders
  taal: Nederlands en Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg001/0086
  tekst: 'Wij vertrekken spoedig van hier.


    ‘J''avoye eu dessein de me destourner d''avec Mons.r l''ambassadeur en chemiu pour employer
    le reste de cet esté en France, mais il m''a conseillé d''eviter les dangers des armées
    en Lorraine, pouvant aussi aisement aller de la Haye en France, comme de la ou je le quitteroye,
    avec d''autres meilleures considerations, dont il luy a pleu me faire ouverture. Parquoy
    je me suis ravisé de ne l''abandonner point, et espere qu''en 4 ou 5 sepmaines ne pourrons
    estre guere loing a patrio fumo. Tout le mal est, comme dernierement je pense vous avoir
    escrit, qu''il faudra nous resoudre à sortir par ou sommes entrez et remacher encore les
    amertumes que pieça pensions avoir avallez. Car, à la verité, ce sont la des plus ennuyeux
    passages des Alpes, et nous fait enrager que devons laisser à deux costez des chemins plus
    aisez de si loing, comme sont celuy de la Savoye et notamment celuy de Trente, où presques
    il ne se trouve ni difficulté, ni danger. Bien est vray, que les neiges ne pourront nous
    incommoder comme par ci devant, qui sera tout ce qu'' aurons de diversité, et puis en 10
    ou 12 jours nous voila hors de l''Italie et ses monts, aille puis du reste comme il voudra,
    car tout n''est que jeu apres. 1er de Juillet.’


    Gisteren avond kreeg ik uwe brieven van 16 Juni en zag daaruit, dat gij allen gezond zijt.
    Ik hoop, dat Dedel de betrekking krijgt; waarom zouden anderen hem voorgetrokken worden?


    ‘De ma promotion à Padouë vous pourrez bien entendre qu''il n''y a eu moyen d''en venir
    à bout. A tout le moins falloit il sejourner 8 ou 10 jours à l''Academie, comme a fait le
    fils du Sr. Schagen; or connoissant l''estat de mes affaires, je sçay que ne voudriez me
    conseiller d''estre absent d''avec Mons.r l''ambassadeur pour un seul jour; je n''ay eu
    garde de bouger d''un lieu où il alloit et de mon honneur et de mon proufit et avancement.
    Pour ce qui est de la petite reputation que tant par le rapport du Doge l''autre jour, comme
    en d''autres ocasions, je me suis acquise aupres de Mons.r l''ambassadeur, vous en pourriez
    particulierement entendre la rapport à son retour.’

    Wij krijgen allen een gouden keten, Woestinghoven en ik den grootsten na den gezant en zijn
    zoon. Ik schrijf haastig, want ik moet nog drie of vier missiven voor den gezant schrijven.


    ‘Les marchands à qui j''estoye recommandé me font beaucoup de caresses, mais, pour n''en
    avoir besoing, ce me sont à peu pres autant d''importunitez. D''argent je n''en ay point
    levé d''eux, pouvant eviter la despense des charges par la courtoisie de Mons.r l''ambassadeur,
    qui nous fournit. J''ay prins de luy 40 ducats d''Hongrie pour diverses emploittes en livres,
    etc. pardeça, et n''ayant besoin de tout ce à quoy mon pere a voullu s''eslargir en mon
    endroit, j''ay trouvé à propos de m''en remettre à sa liberalité pour une autre fois.’

    Wij rekenen er op overmorgen te vertrekken.


    A Venise, ce 2e de Juillet 1620'
- verzender: Constantijn Huygens
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 02-07-1620
  plaats_verzender: Venetië
