  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg001/0087
  tekst: 'Apres cette derniere audience de Mons.r l''ambassadeur je suis entré en communication
    avec luy sur le dessein de mon voyage de France. Il m''a dit qu''à raison de la longueur,
    incommodité et mesmes du danger des chemins, il ne pouvoit croire de faire chose agreable
    à mes parents en me le consentant. Qu''en tout evenement il trouvoit bon que je l''accompagnasse
    jusqu''au logis, la ou il avoit intention de faire entendre à Mess.rs les Estats Generaulx
    et à son Exc.e, comment en cette ambassade il s''est servi de ma personne, avec quantité
    de bons rapports à mon advantage. Qu''au cas que nos ambassadeurs pour France ne soyent
    partis à nostre arrivée, il fera bien que de par Mess.rs les Estatz je soye nommé secretaire
    encor de cette ambassade, par ou j''auray occasion de me satisfaire pour ce qui est de la
    France. Que selon ce qu''il avoit proposé à la Seigneurie pardeça, ilz estoyent entierement
    portez à une ambassade ordinaire d''un costé et d''aultre, ayants desiré qu''on leur voulust
    envoyer quelque gentilhomme de bonne maison, qualité, experience, etc., comme de leur part
    ilz avoyent resolu de faire. Suivant quoy il voyoit moins d''apparence à mon advancement
    qu''il n''avoit esperé - je remarquay toutefois qu''il ne le tenoit si entierement pour
    chose inouïe, bien qu''à la portée de ma propre ambition je m''en tienne esloigné, comme
    sont hauts sur la terre les cieux - et ce à raison de mon bas aâge, etc. Mais que en cas
    d''agent, il avoit eu tousjours l''oeil sur moy, avec confiance de pouvoir avoir demené
    cette affaire à mon contentement. Je respondis, comment je consideroye bien que souvent
    pour entrer en une grand'' sale il faloit se baisser par un petit portail, et que pourveu
    que je peusse me veoir honoré d''une ou d''autre telle petite charge par le publiq, j''en
    seroye fort content, pour avoir seulement la main à la paste, esperant que, par le moyen
    de sa bonne faveur et adresse, ce pourroyent estre des commencements honestes à quelque
    plus grand advancement. Il loua mon dessein et intention la dessus et m''asseura cordialement
    de son assistence en ce qui se pourroit presenter. Me parla beaucoup sur les apprentissages
    des jeunes employez en des charges comme cela, etc. A la fin me descouvrit un petit point
    qui merite bien la consideration; il me demanda pourquoy je ne voudroye un peu jetter l''oeil
    sur la place de Caron en Angleterre; que la charge en estoit plus aisée que d''aucune autre
    ambassade, qui seroit justement l''entrée qui me duiroit, notamment au regard de la langue
    qu''il sçavoit m''estre bien cogneuë; que puisque ni le jugement, ni la capacité, ni la
    volonté me manquoit, il falloit tacher de se mettre de bonne heure aux affaires à son exemple,
    etc. Nostre discours fut interrompue par l''heure du disner. Tant y a que je me presume
    d''avoir acquis en luy un patron et Mecaenas par ce voyage ici, estant venu à cette occasion,
    comme je luy dis, au bout de mon dessein principal, d''avoir ce bien que de me mettre aucunement
    en sa cognoissance. Mon pere pourra un peu alembiquer tous ces projets à par soy, jusqu''à
    tant que soyons de retour; puis nous aurons moyen d''y songer à bon escient. Ne laissons
    pas de bien esperer et hautement, quanto si può, honestement, car selon la methode de cet
    homme ici il faut desormais renoncer en ce monde au petit souhait du povre coeur, à qui
    desire se faire valoir. Dieu pourvoirra à tout.


    Le negotiation qu''avoit faicte Mons.r l''ambassadeur par devers ces Mess.rs à la requeste
    et en faveur du Roy de Boheme estoit en fort bons termes, et avoit le Senat deliberé de
    faire declaration de sa bonne volonté sur le secours qu''il avoit dessein de donner à sa
    Ma.té, quand l''inopiné incident d''une dispute que, par le moyen du premier visir de Constantinople,
    la Maison d''Autriche mouvoit à cette Republique, ce bon dessein a esté interrompu. Car
    le Turq ne leur dispute pas seulement les confins de la Dalmatie, mais leur demande promptement
    six cent mille sequins et une isle pres de Candie, et au refus les menace de guerre. Par
    ou il n''y a apparence que pour encores ils se desnuent de leur[s] propres moyens au secours
    dudit roy, à quoy toutefois ilz sembloyent fort portez par les vives remonstrances que leur
    a faites Mons.r l''ambassadeur sur la consideration de leur propre interest. Rien est à
    esperer qu''apres avoir surmonté ces difficultez du Turq, ils reprendront serieusement cette
    matiere en main.


    Dans le duché de Milan il y a presentement douze mil hommes, la pluspart venuz de Naples,
    en partie levés sur les lieux. Ilz publient de voulloir passer vers la Flandre; les plus
    judicieux estiment qu''ilz ont dessein de former un corps avec les trouppes que Spinola
    doibt lever pour entreprendre le Palatinat. Arcana horrenda, dum redierimus.'
