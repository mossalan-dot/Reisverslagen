  ontvanger: Christiaan Huygens (1551-1624)
  datum: 04-07-1620
  plaats_verzender: Venetië
  land_verzender: IT
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: zoon-ouders
  taal: Nederlands
