  tekst: 'Wij zijn niet te paard, maar per schip verder gereisd, hebben den 4den Mei te Coblenz
    en den 5den te Mainz geslapen en kwamen den 6den hier te Frankfort. Heden vertrekken wij
    per rijtuig naar Heidelberg. Wij zijn allen gezond. Te Heidelberg blijven wij een paar dagen;
    de Keurvorst is er niet, maar wel de Hertog van Zweibrücken.


    De Francfort, ce 7e de May 1620.'
- verzender: Constantijn Huygens
  ontvanger: Christiaan Huygens (1551-1624)
  datum: 19-05-1620
  plaats_verzender: Stuttgard
