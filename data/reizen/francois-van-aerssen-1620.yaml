  tekst: 'Sedert ons vertrek uit den Haag hebben wij geslapen te Bodegraven, te Utrecht, Sonsbeek,
    Neusz en nu te Keulen, waar wij vandaag rustig blijven; wij kunnen dan tevens de groote
    processie zien. De stad is vol vreemdelingen. Morgen gaan wij naar Frankfort - de tocht
    zal 2½ dag duren - en dan naar Heidelberg; er zijn 19 paarden voor ons gehuurd, want wij
    reizen niet per rijtuig, wegens het gevaar voor de troepen van den Heer van Anholt, en gaan
    hier den Rhijn over. Wij zijn allen gezond.


    De Coulogne, ce 1r de May 1620.'
