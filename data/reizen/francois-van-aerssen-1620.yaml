  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg001/0088
  tekst: 'Morgen verlaten wij Venetië; gisteren zagen wij de wapenzaal van den raad der 10 en
    heden het arsenaal en andere merk waardigheden. Van morgen ontving de gezant een gouden
    keten van 14 snoeren, zijn zoon een van 6 en de secretaris een van 4. Wij zeggen Venetië
    vaarwel, waar sommigen van ons zich beginnen te vervelen.


    De Venise, ce 4e de Juillet, n. st. 1620.


    Laat een paar schoenen voor mij maken.'
- verzender: Constantijn Huygens
  ontvanger: Dorothea van Dorp (1592-1657)
  datum: 18-05-1620
  plaats_verzender: Stuttgard
  land_verzender: D
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/letter.html?id=huyg001/0080
  tekst: 'Songetgen. Je me trouve esloigné de vous de beaucoup de journées. Cependant je vous
    asseure du dedans de moy, qui vous demeure perpetuellement affectioné apres ceux que Dieu
    et nature me font honorer autant qu''aimer, je trouve mon grand contentement au resouvenir
    de vostre amitié, laquelle je voudroye vous pouvoir exprimer combien j''estime. L''occasion
    ne veut pas que j''en jouïsse en presence; au lieu de cela je desire que les miens en puissent
    tirer contentement et proufit. Ce sont mes bonnes soeurs que je vous recommande et supplie
    de leur vouloir servir de salutaire exemple, continuants tousjours parensemble cette honeste
    amitié que je me vante d''avoir gardé quelques années avec vous. Je souhaitte qu''elles
    puissent tirer de vous ce que j''eusse desiré qu''eussiez proufité de ma conversation. Prestez
    leur la main au chemin de la crainte de Dieu, qui est la source de toute vertu, et je m''asseure
    que vous les trouverez sorties de l''apprentissage de deux honestes et soigneux parents
    qui n''y ontrien planté que bonnes herbes, qui doibvent s''avancer quelque jour en des fruits
    saints et salutaires. Je ne touche point au soing que devez avoir de vous mesme, car de
    vous mesme vous le sçavez; en un mot, faites moy l''honneur de vous resouvenir quelquefois
    de ces exhortations à gravité et modestie dont je vous ay battu les oreilles si souvent.
    Si les plus avisez ne s''y conforment, je veux qu''à tousjours mais ma parole soit hors
    de credit chez vous. Or, Thehen, Dieu sçait que je soigne de bon coeur à l''avancement de
    vostre bonne reputation, pour vous aider à la rendre impenetrable à toute sorte de calomnie.
    Je suis vostre sincere ami, donc je vous parle rondement; si cela vous deplait, j''en dois
    estre adverti en temps. Voici des pieces mal cousuës que je verse en toute haste environ
    minuit, mais le contentement de parler avec vous m''oste tout autre souvenir. Kint, ne vous
    alienez jamais de moy, et que pour si peu de mois je ne puisse trouver du changement en
    vostre coeur; c''est cettuy la seul que je m''approprie; resolvez du reste comme maistresse
    du logis, je n''y pretens rien. Mais encor, si peut estre en mon absence l''envie vous prend
    de vous engager à quelque autre-vous, je supplie, choisissez le un peu selon mon humeur,
    et vous reglez au petit contentement de celuy qui fait estat de vous continuer une immortelle
    amitié, mesme apres le jour qui vous aura rendu proprement propre à un mari, car, Thehe,
    ce me sera un des grands plaisirs de vous pouvoir aller trouver en vostre mesnage, si notamment
    le chef en soit tel et qualifié comme je vous le souhaitte. Je remets tout à vostre discretion
    et apprens mon scel desasteure à tout ce que resoudrez. Adieu Kint, j''attendray de vos
    lettres à Venise. Si vous desirez nouvelles de nostre voyage, enquestez en vous chez nous
    ou à la Plate, de buermeyt. Den Trello, den Van Santen, den Dimmer et toute la cabale soit
    saluée s''il vous plait tres affectionnement en mon nom. Devant touts Mad.e d''Eussum, etc.
    Mandez moy si avez receu le pourtrait. Adieu, adieu.


    En haste de Stutgard, au païs de Wirtembergh, ce 18e de May 1620.'
poezie:
- titel: Italia decolor
  dichter: Constantijn Huygens
  datum: 14-07-1620
  locatie: Chiavenna, Italië
  taal: Latijn
  bron: Huygens 2004, 202-207
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0015.php
  tekst: "ONTAARD ITALIE\n\nHesperisch schimmenrijk, voorafschaduwing van de ondergang der wereld,\
    \ droesem der garde, prachtlievend land van barbaren, verwelkte bloem, as, schaduw van uzelf,\
    \ gegroet, Italiaanse bodem, gij hebt een inwoner van een kouder land binnen uw grenzen;\
    \ een zoon van een kouder, niet van een minder land, die vraagt om het recht van gastvrijheid\
    \ krachtens bondgenootschappelijke band. De Faam, destijds verbreid door grootse overwinningen\
    \ en tot boven beide polen gestegen, door wie gij als heerser alom hoofd en sieraad van\
    \ de wereld wordt genoemd, heeft deze ogen, deze voeten gedreven, [II] heeft bevolen weg\
    \ te gaan van de Noordzeegolven aan het strand, ?waar het zand van de Hollandse bodem zijn\
    \ bron niet kent, heeft bevolen een reusachtige top te beklimmen temidden van onherbergzame\
    \ wolkenflarden en verstijfde ledematen door zomerse sneeuw te slepen, en, ach, had toch\
    \ uw reputatie, die vergleden tijden memoreert, maar niet de onwetende bedrogen met hersenschimmen!\
    \ Immers, ongelukkige, hoe zeldzaam zijn de sporen die ge bezit van de oude luister, hoe\
    \ schaars die van de helden, hoezeer afwezig die van levenskracht, afwezig die van eergevoel\
    \ en van het Licht dat (zo mag men zeggen) de redeloze aangeboren is, dat de Wilde dieren\
    \ aangeboren is die gijzelf voedt. Gij neemt, goddeloze, onder het mom van vroomheid de\
    \ onmetelijke God, die uw daden gadeslaat, Zijn heilige eredienst af. Wat gij vereert, maakt\
    \ gijzelf, gij vereert iets wat gij eet (ik huiver bij deze woorden), gij bevat uw Schepper\
    \ niet in uw geest, gij vermaalt Hem met uw kaken. Hem aan wie ge vrome klachten recht uit\
    \ het hart, aan wie ge het diepste verschuldigd bent, de heilige ? gaven van een berouwvol\
    \ hart, houdt ge als geschenken kindergoed voor, veracht door mannen, door kinderen: koper,\
    \ kaarsen, schilderingen, beelden, wierook, muziek. Gij doet, verdorvene, familie de hand\
    \ slaan aan eigen vlees en bloed; alom bent ge rood van het bloed van broers, alom van dat\
    \ van vaders. Gij maakt burgers vertrouwd met gesels, dolken, gif, niet met eerlijke strijd;\
    \ bedrog dat mensen doodt is tot de aanvaarde vormen van tijdverdrijf gaan behoren. Gij\
    \ loopt, schandelijke, over van extravagantie; al wat de eeuwen samen hebben laten zien,\
    \ brengt gij alleen tot voltooiing of overtreft ge. De verkrachter komt niet in aanraking\
    \ met het zwaard, de overspelige vrouw niet met de wet, zo ook sodomie, zo ook wellust die\
    \ met pek gestraft behoort te worden. Mijn pen gebiedt me meer aan te voeren, meer aan te\
    \ voeren gebiedt mijn verontwaardiging, als aangeboren gene dat niet verbood. Ik houd mijn\
    \ hand stil, mijn voet verlaat, onwaardige, uw beschermgoden; misschien zal er ooit iemand\
    \ zijn die zich door hen laat verschalken. De trouwhartigheid en de uitzonderlijke geestkracht\
    \ in staat tot verheven daden, waarmee de oude Bataven hun bondgenoot Rome voor zich innamen,\
    \ vlammen nog altijd op en verafschuwen daarbij STANDVASTIG uw voorkeuren, Rome, maar\n\
    (ach!) hoezeer een ander Rome nu. Zie, geliefd Holland, gij hebt uw burger terug; vergun\
    \ dat hij niet als een onbekende vreemdeling de velden van vroeger betreedt. Anderen mogen\
    \ een hang naar dwaze nieuwigheid mee terug hebben genomen, ik alleen breng alleen weerzin\
    \ tegen Italië mee. \n\nChiavenna in het gebied der Raetiers, juli 1620, op de terugreis\
    \ uit Italie. \nVergeef het me, edele, vrome en geleerde heren, van wie temidden van zoveel\
    \ barbaarsheid een enorm aantal over is, zoals ik als ooggetuige staande houd. Ik heb de\
    \ ondeugden van deze tijd bij u bekritiseerd; mijn verwijten zijn zo geheel en al niet op\
    \ u van toepassing, dat ze u vooral tot lof lijken te strekken; u toch verdient wegens ongebroken\
    \ deugd een plaats aan het firmament, als het iets zou betekenen sterren naar de hemel te\
    \ brengen."
- titel: Libellus lectori
  dichter: Constantijn Huygens
  datum: 25-07-1620
  locatie: Basel, Zwitserland
  taal: Latijn
  bron: Huygens 2004, 202-207
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0015.php
  tekst: 'HET CAHIER TOT DE LEZER


    Toen een bondgenootschap de Venetiaanse krachten met de Hollandse bundelde en beide leeuwen
    hun zwaarden, heeft hij die op last van de hoge heren zorg droeg voor zo belangrijke onderhandelingen,
    in mijn gezelschap deze wegen in den vreemde afgelegd. Vandaar dat ik, eerst Licht, door
    geleidelijke toename een klein gevaarte ben geworden, zoals bij wenteling door zich vasthechtende
    sneeuw de bal groter wordt. Wie evenveel landen zal willen kennen zonder ze te bezoeken,
    ziehier, laat hij de vlijtige aantekeningen van mijn meester ter hand nemen, en de aardigheden
    zonder stekels, uren zonder schuld, nachten vrij van blaam en dagen zonder smet. Hij heeft
    gezien, de lezer zal weten; hij verdroeg het ongemak, de lezer ontloopt het. Ik vraag u:
    Wiens vreugden zullen voor wie het duurst zijn? Ik vergis me als niet een onpartijdig scheidsman
    het zal aflezen van een onpartijdige weegschaal: de lezer droeg zijn geest waarheen de ander
    zijn voeten droeg. Ja, in het vervolg zou je dwaas zijn de voorvaderlijke akkers te verlaten,
    als het kan dat je plaatsen die je kent, niet hebt bezocht.


    Standvastig.


    Basel, 25 juli 1620.'
- titel: Pro eodem
  dichter: Constantijn Huygens
  datum: 29-07-1620
  locatie: Spiers, Duitsland
  taal: Latijn
  bron: Huygens 2004, 202-207
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0015.php
  tekst: 'Wie vindt dat in dit boek niet zo veel verschillends geschreven mag worden, en dat
    ernst geen vermenging met scherts toelaat, laat hij luisteren hoe hij zulke belegen bakerpraatjes
    uit zijn lijf bant. De scherts in dit boek is voor moeder, de ernst voor vader. Zij die
    twee en dezelfde zijn, die getweeen een geest hebben, gaan dit lezen; waarom mag dit boek
    niet dubbel van aard zijn?


    Standvastig.


    Spiers, [?29] juli 1620.'
- titel: Passando l'Alpi
  dichter: Constantijn Huygens
  datum: 10-06-1620
  locatie: Verona, Italië
  taal: Italiaans
  bron: Huygens 2004, 202-207
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0015.php
  beschrijving: "Ot., II, 65. Naar het HS. op het schutblad van Huygens' Reisjournaal van Den\
    \ Haag naar Venetië (No. XXXIX der HSS.). \nDen 25sten April vertrok H. in het gevolg van\
    \ den gezant François van Aerssen naar Venetië. De gezant had in last, om den Senaat aan\
    \ te sporen een werkdadig aandeel te nemen in den strijd tegen Spanje en Oostenrijk, de\
    \ protestantsche Grauwbunders in zijne bescherming aan te bevelen, en zoowel de Venetiaansche\
    \ Republiek als de Duitsche vorsten, wier gebied hij doortrok, op te wekken, om den Koning\
    \ van Boheme te steunen. De weg liep over Frankfort, Stuttgart, Schaffhausen, den Splügen\
    \ en Verona. Den 12den Juni werd Venetië bereikt, waar het gezantschap tot 5 Juli vertoefde,\
    \ om langs ongeveer denzelfden weg terug te reizen en 7 Augustus weder in Den Haag te komen.\
    \ H. was op den tocht door Aerssen tot secretaris van het gezantschap gekozen. (Zie over\
    \ de reis: Jorissen, t.a.p., blz. 50-66; Serm. lib. I, vs. 566-848, en Aerssen's Rapport\
    \ in de Berigten van het Hist. Genootschap, V, 1ste stuk, blz. 45, vlgg. Huygen's Reisjournaal\
    \ hoop ik spoedig uit te geven.) \nOp de heenreis kwam het gezantschap den 9den Juni te\
    \ Verona en vertrok den 11den (HS.). Vert. Thérèse Peeters en Matthijs Catsman"
  tekst: "Passando l'Alpi.\n \nGiunto con stanchi passi\nAlla cima de' sassi,\t\nOue il piu\
    \ chiaro giorno\nFa nuuole d'intorno;\nOue i diletti horrori,\nLe neui sono fiori,\nEmmi\
    \ vicino al Cielo,\nDissi nel mezzo gelo:\nFa tu, ch'in Cielo siedi\nPadre del Ciel Signore,\n\
    Ch'acostandone i piedi,\nNon n'allontani il core.\n\nScrissi à Verona a 10. di Giogno (Juni).\t\
    \n\nOver de Alpen\n\nAangekomen met vermoeide passen\nop de top van de rotsen,\nwaar ook\
    \ de helderste dag\nnog wolken omheen laat komen,\nwaar plezier in afgrijzen verandert,\n\
    waar de sneeuwvlokken bloemen zijn.\nDaar dichtbij de hemel\nzei ik in de vrieskou:\n“Maakt\
    \ u, die in de hemel verblijft,\nVader van de Hemel, Heer,\ndat terwijl mijn voeten er dichterbij\
    \ komen,\nik mijn hart er niet vanaf keer."
