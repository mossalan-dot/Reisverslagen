  opmerking: Postscriptum
  tekst: 'Nu de gezant eene missive naar den Haag zendt, voeg ik daar een brief bij. Het gaat
    mij goed, maar ik vind het erg, dat ik geen kans heb iets van u te hooren, voordat wij in
    Venetië komen, en dat duurt nog meer dan drie weken. De reis zal sneller gaan dan in het
    begin, daar de gezant nu bijna al zijne bezoeken aan de verbonden vorsten heeft afgelegd.
    Bijzonderheden kunt gij hooren uit een langen brief van den heer van Sommelsdijck aan zijne
    moeder; mijn reisjournaal, dat ik zoo nauwkeurig mogelijk bijhoud, bewaar ik tot mijne terugkomst.
    Van Heidelberg uit hebben wij een omweg gemaakt naar Rotenburg, om daar den Markies van
    Ansbach op te zoeken. ‘Mons.r l''ambassadeur, Dieu merci, se porte tousjours bien et gagliardement,
    comme il est personnage vigilant et sobre, qui n''a garde de beaucoup se surcharger de viandes’.

    Ik mis hier het lichte Hollandsche bier. Wij zijn van Frankfort hier gekomen met rijtuigen
    en gaan daarmede naar Zwitserland; de 30 paarden, die wij zouden moeten huren, komen te
    duur. Morgen gaan wij naar Tübingen.


    En haste de Stutgard ... ce 19e de May, stile nouveau, 1620.

    Daar er onder het gevolg niemand geschikt is voor secretaris, heb ik den gezant mijne diensten
    aangeboden. Hij verzekerde mij, dat hij reeds besloten had, mij tot secretaris te maken,
    niet van hem zelf, doch van het gezantschap, maar eerst, wanneer wij te Venetië zijn. Het
    is niet kwaad, als dit een beetje bekend wordt; ook de Venetiaansche gezant mag het wel
    hooren.


    Toen ik mijn brief al gesloten had, droeg de gezant mij op de missive te schrijven, en zoo
    aanvaard ik dan mijn nieuw ambt. De brief aan Z.E. is door mij geschreven, die aan de Staten-Generaal
    door Leewen.'
- verzender: Constantijn Huygens
  ontvanger: Christiaan Huygens (1551-1624)
