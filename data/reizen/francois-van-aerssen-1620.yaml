  opmerking: tweede brief aan zijn vader
  tekst: 'Na eene reis van 50 dagen zijn wij te Venetië aangekomen; bijzonderheden over onzen
    tocht kunt gij hooren ten huize van den heer van Aerssen. Ik ben volkomen gezond, heb niets
    geen last van de verandering van lucht en geniet van al het moois, dat ik zie. Ik was van
    plan, vader mondeling verslag te doen van mijn onderhoud met de Keurvorstin-Moeder te Heidelberg,
    maar wil ook wel, volgens mijn reisjournaal, meedeelen, dat ‘ayant presenté en particulier
    ma lettre à Mad.e l''Electrice, elle me recent d''une façon tres benigne et amiable, s''enquesta
    cordialement apres mon pere, sa disposition, son mesnage, ses enfants, le faisant remercier
    de la bonne affection qu''il continuoit de porter aux descendants de feu Monseigneur le
    Prince, son pere, avec offres et asseurances de toutes sortes de faveurs et bienvueillances
    envers touts les nostres. Me dit aussi que desja s''estant informée que le fils d''un tel
    estoit de la suite de Mons.r l''ambassadeur, son dessein avoit esté de ne le laisser partir
    sans le veoir en particulier; me lona d''avoir prins la resolution d''un si beau voyage,
    pour avoir occasion de veoir ce qu''il y a de plus beau en tant de divers païs, avec plusieurs
    autres discours. Je prins congé de Son Altesse et ensemble baisay les mains à dame Catherine,
    sa fille, qui estoit aupres’.


    Te Heidelberg heb ik veel gehad aan den beroemden Dionysius Gothofredus, een aardig man.
    Te Rotenburg en te Stuttgart is mij persoonlijk weinig bijzonders overkomen; ‘bien ay-je
    trouvé des gents sçavants et honestes partout, qui ont esté autant aises de mon accointance
    que peut estre d''aucun des nostres, qui sont gents de peu de curiosité ou diligence pour
    la pluspart, et qui se contentent prou d''avoir bien beu et mangé et passé outre’.


    Te Schaffhausen en te Zürich zijn wij erg aardig ontvangen, maar bij de Grisons heeft men
    in het openbaar niets geen werk van ons gemaakt. De ridder Hercole Salice te Ciavenna was
    heel beleefd en ook de ridder Sprecherus, dezelfde, die onlangs met de hulp van Cluverius
    eene kaart van Rhaetië heeft uitgegeven; aan Salice had ik een aanbevelingsbrief van den
    heer Carleton. Van Tusano uit hebben wij den Splügen beklommen en later den Morbegno; het
    is zonder ongelukken afgeloopen en wij kwamen plotseling in het paradijsachtige Lombardije.
    Overal werden wij met vele eerbewijzen ontvangen. Te Bergamo vond ik neef van Eyck en anderen,
    te Brescia den heer de Rocquelaure, die vader laat groeten. Te Padua zijn wij tot mijn grooten
    spijt maar heel kort stil geweest en ik weet niet, hoe ik den tijd zal vinden, om daar mijne
    zaken te behartigen. Misschien kan ik mijn terugweg over Frankrijk nemen, in het gevolg
    van de Prinses eenigen tijd te Parijs blijven en dan even naar Orleans gaan. Vader moet
    daar eens over denken en mij dan bericht zenden te Bazel of te Genève. Er zijn menschen,
    die mij mijne betrekking benijden en die, als ik wegging, er zich meester van zouden maken,
    maar de gezant is zeer tevreden over mij en klaagt over de ongelukkige keuze van zijn gevolg.
    Het is hier niet de gewoonte, de gezanten dadelijk bij hunne komst plechtig te ontvangen,
    en wij zijn hier dus als het ware incognito.


    ‘Le lendemain de nostre arrivée j''ay esté envoyé parler au Prince pour demander la reception
    et l''audience à quoy les ambassadeurs d''ordinaire employent leurs secretaires. Je l''ay
    trouvé en son siege ducal au palais de S.t Marco - je vous donne à penser si la langue italienne
    me vient à point - et luy ayant fait mon message, il me repondit en une petite harengue
    - comme il est personage bien parlant et reputé pour tel - qui me seroit longue à reciter,
    bien qu''en aye tenu note. Tant y a que pour la feste de S. Vito il assigna le jour de l''entrée
    sur Mardi le 16e. Iceluy venu nous nous sommes retirez hors de la ville à S. Georgio d''Aliga,
    monastere, d''où tost apres 22 senatori du Pregadi nous sont venus prendre un pour un dans
    sa gondole et nous baillerent touts la main droitte, gents aagez à la barbe grise, vestus
    de robes rouges de tafetas. En cet arroy nous fumes menez au logis, où les tambours, trompettes
    et violons nous receurent. C''est ici le premier acte. Le lendemain ces messieurs s''en
    sont revenus au nombre de 62, environ les 7 heures du matin, qui sont 11 par ici, et ont
    mené Mons.r l''ambassadeur avec nous touts en mesme ordre que devant jusque dans le college
    avec grandissime presse du peuple. Le Prince l''y attendit avec ses conseigliers, savii,
    etc. et apres la reverence faite luy bailla audience publicquement et en face de tout le
    monde y accourant; cela dura un bon ¼ d''heure - car aussi bien ces propositions ne consistent
    qu''en compliments et termes generaulx - quand nous nous advançames touts à baiser les mains
    à Sa Serenité. Mon tour estant venu, le bon Prince me recogneut encores. J''entendis qu''il
    dit a Mons.r l''ambassadeur: Questo è suo secretario, giovane discreto è savio. Mais - à
    ce que depuis Mons.r l''ambassadeur m''a rapporté - il adjonsta bien autre chose, c''est
    que passé 2 jours je luy avoye fait mon message si modestement, si sagement et en si bons
    termes italiens, qu''il en avoit esté grandement estonné, etc. Ceci sont des comptes qui
    convienent mal à mon propre rapport, mais le contentement que je m''asseure vous en recevrez
    me fait parler librement’.


    De gezant is steeds zeer vriendelijk en goed voor mij, maar ik heb het druk met officieele
    brieven en bezoeken; daardoor is deze brief op verschillende dagen geschreven; laat hem
    dus maar aan niemand lezen. Aan vader''s hand kan ik zien, dat hij nog niet geheel hersteld
    is.


    De Venise, ce 18e de Juin.


    Vandaag is de groote processie van het corpus Domini, morgen de tweede audientie van den
    gezant bij het college. De heer Carleton mag wel eens bedankt worden voor zijne vele aanbevelingen;
    ook die van den heer Nicquet blijken geholpen te hebben. De gezant zorgt voor mijne financies.
    De heer Melander, die te Verona zeer gezien is, laat vader groeten.


    Pour Mon Pere.


    De quelque commission pardeça nihil. Je sçay que Mons.r. l''ambassadeur a charge de leur
    bailler le choix ou d''agent ou d''ambassadeur, qui sera pris de fort bonne part ici, mais
    aussi ilz ne verroyent rien plus volontiers qu''un ambassadeur ordinaire de part et d''autre,
    qui ne tiendra à eux. Tellement que voila de la nouvelle brigue en nostre païs, comme ici
    il s''en fait et fera du broglio assez. Je feray encor quelques ouvertures à Mons.r l''ambassadeur
    par forme de discours et je supplieray mon pere de m''aider à songcr si, en cas d''ambassade
    ordinaire, il y auroit quelque apparence d''avancement ou proufit pour moy en l''une ou
    l''autre qualité. Je trouve que c''est une belle chose d''avoir la main à la paste. D''un
    Pau on ne sera pas trop content ici, car ce n''est pas pour contrepeser à un Nobile Venetiano,
    qui sera de la. Sans doubte qu''il faudra un gentilhomme, et à mon advis ceux de Gueldres
    l''emporteront.'
- verzender: Constantijn Huygens
