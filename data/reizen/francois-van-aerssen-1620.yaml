  opmerking: tweede brief aan zijn vader
  tekst: 'Heden heb ik uwe brieven ontvangen; gelukkig, dat vader weer hersteld is. Ik heb geen
    tijd om veel te schrijven, maar zal, als wij in Venetië zijn, wat uitvoeriger zijn. Gedurende
    de geheele reis ben ik gezond geweest en heb zelfs nooit hoofdpijn gehad, waar ik in Holland
    zooveel aan lijd; ook het vele paardrijden van ''s morgens vroeg tot ''s avonds laat hindert
    mij niet. Wij komen langzaam vooruit tengevolge van de vele bezoeken in Duitschland en Zwitserland,
    en nu hier in dit paradijs van een land door de vele beleefdheden, die men ons bewijst.
    De gezant dacht morgen in Venetië te komen, maar de magistraat hier wil ons niet zoo spoedig
    laten vertrekken, evenmin als die van Bergamo, Brescia, Verona, enz.; overal worden wij
    prachtig ontvangen en onthaald. Dat zal ook het geval zijn te Venetië. Groet alle familieleden,
    de geheele buurt, ‘vryers en vrysters’, en Mevr. van Aerssen.


    Vicenza, minuit, 11e Juin 1620.


    Pour Mon Pere.


    Ik blijf steeds den titel van secretaris houden en leer goed Italiaansch. Vader moet eens
    spoedig aan den gezant schrijven op de wijze, die wij besproken hebben, want wij blijven
    niet lang te Venetië.


    ‘Seulement qu''il y eut moyen de m''y laisser par petite provision, comme Mons.r Carleton
    sçait qu''il y en a un pour le Roy d''Angleterre qui se nomme secretaire de l''ambassade,
    sede vacante. Ce dit ambassadeur y pourra donner les meilleurs advis, comment on pourroit
    baptizer le fait’. Zeker had Pau zoo iets op het oog, toen hij ons te Heidelberg verliet,
    om per post naar Venetië te reizen.'
- verzender: Constantijn Huygens
  ontvanger: Christiaan Huygens (1551-1624)
