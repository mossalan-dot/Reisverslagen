beschrijving: Verslag van een militaire reis naar Spanje van scheepspredikant Petrus Zaunslifer
  (1677-1739) in 1702. Zaunslifer reisde van Hellevoetsluis naar Engeland en Spanje. Hij bezichtigde
  St. Helena, zag de gevechten bij diverse versterkingen nabij Cádiz en de plundering van een
  Spaanse zilvervloot in de baai van Vigo.
