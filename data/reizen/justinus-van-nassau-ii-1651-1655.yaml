beschrijving: Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk, Italië en Spanje in
  het gezelschap van zijn de broers François (1630-1658), heer van Plaat, en Cornelis van Aerssen
  (1637-1688), heer van Sommelsdijk, en tutor Antoine de Brunel (1622-1696).
