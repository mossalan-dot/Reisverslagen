beschrijving: Maakte tussen 1718 en 1723 met Samuel van de Putte (1690-1745) een educatiereis
  naar Italië, gevolgd door een grote reis naar het Midden-Oosten. Zijn verslag, bewerkt door
  Johannes Heyman (1708-1788), werd postuum uitgegeven als Reizen door een gedeelte van Europa,
  klein Asien (...).
