  tekst: 'le 30 Novembre 1661.

    Cellecy vous trouuera a Paris. Je vous recommande donc les visites aux Personnes a qui s''adressent
    mes lettres sans oublier Monsieur Petit, quoy que vous les luy ayez desia envoyees. Mais
    sur tout voyez Monsieur Thevenot qui vous donnera quelques livres pour moy, les quels ayant,
    j''espere que vous trouuerez bientost quelque occasion pour me les faire tenir, et vous
    prie d''y songer. Monsieur de Montmor avoit aussi un livre de poesies qu''il me destinoit,
    mais je ne scay s''il n''est pas desia en chemin.

    On fait icy des preparatifs pour les feux d''artifice que Madame l''Ambassadrice fera allumer
    ce soir, touchant lesquels Monsieur d''Armainvillers parfois m''est venu consulter et demander
    mon avis. Je voy 7 ou 8 tonneaux de vin touts prets dans sa cour, que l''on laissera couler
    apresdisner, dont il y aura beau bruict dans la rue, qui n''est pas fort large. les tonnes
    pour brusler seront sur la plaine, et les fusees &c. seront allumees sur un eschaffaut dressè
    au milieu de nostre longue muraille du jardin; ce qu''il a falu permettre puis que la dite
    Dame nous en a priè. Vous pouuez bien croire que nous ne manquerons pas de spectateurs et
    spectatrices icy dedans, parmy les quels les Cousines Dorp avec l''amie nomen profitentur
    suum.

    Ma pompe pneumatique a commencè d''aller depuis hier, et toute cette nuict une vessie y
    est demeurée enflee, (sans que pourtant il y eust auparavant presque aucun air dedans) ce
    que jamais Monsieur Boile n''a pu effecteur. Demain il en coustera la vie a quelque moineaux
    et souris dont j''ay desia fait provision. Une des premieres choses aussi sera d''y faire
    casser un des petits verres a quoy je croy trouuer moyen sans faire autre ouverture que
    celle d''en bas, car je ne me sers que d''une bouteille renversee qui a le col fort large.

    Aujourdhuy je ne feray rien par ce qu''il faut aller disner chez le cousin Dedel, ou nous
    aurons la race des Zuerius et ma soeur avec son mary. Adieu. Je n''escris pas a Mon Pere
    parce que l''aisnè a dit qu''il le vouloit faire.'
