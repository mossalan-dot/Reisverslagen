  tekst: 'A la Haye ce 21 Jul. 1661.

    Mon frere

    Ce dernier ordinaire ne nous a rien apportè de vous, c''est peut estre que vous commencez
    a trouuer qu''a Paris on n''a pas tant de loisir pour escrire qu''en Espagne. Puis que vous
    y estes souffrez que je vous donne une commission a la quelle je vous prie de ne point manquer.
    Ce n''est que d''aller porter cette enclose a Monsieur Thevenot a qui j''escris pour un
    livre qu''il a receu d''Italie pour moy, lequel il vous donnera, n''ayant pu jusq''icy trouuer
    d''occasion pour me le faire tenir. Vous l''avez vu autre fois, dont je ne sçay si vous
    aurez memoire, mais c''est assurement le meilleur et le plus honnest homme que l''on puisse
    veoir, et qui m''a beaucoup obligè pendant mon dernier sejour a Paris, de quoy vous ne manquerez
    pas de luy tesmoigner mon ressentiment &c. Il demeure dans la rüe de Touraine qui est vers
    l''hostel de Guise, et c''est a la premiere porte cochere a main droite.

    Monsieur Chapelain ne demeure pas loin de chez vous a qui j''ay escrit que vous l''iriez
    veoir. Que ce ne soit pas je vous prie sans l''assurer de mon tres humble service. Si vous
    le desirez il vous mesnera a l''assemblée chez Monsieur de Montmor, ou vous trouuerez plusieurs
    de mes connoissances, qui vous diront du bien de moy, et du mal aussi, à cause de ma paresse
    en matiere de correspondence. En cas que vous y allassiez n''oubliez pas mes respects au
    dit Seigneur. Puis que vous avez envie de rester la quelque temps je croy que vous ne serez
    pas sans faire quelques visites, parmy les quelles je vous recommande celles la. Monsieur
    van Beuningen m''a tousjours traitè fort obligeamment de quoy en le voyant vous luy tesmoignerez
    mon ressouuenir et ma gratitude. Voicy vostre lettre qui arrive, la quelle il faudra envoyer
    a mon Pere qui est a Buren.

    Le frere de Zeelhem est aussi absent depuis trois semaines. Il est allè veoir Miralinde
    a Bolduc, de la quelle il est fort amoureux depuis qu''elle a estè icy, en dat in sijn oude
    daghen. Il compose pour elle en rime et en prose, c''est la plus belle chose du monde.

    L''accouchée se porte assez bien depuis ces 3 jours que la fieure ne revient plus.

    J''ay fait separer la chambre, autrefois a ma cousine, en deux, dont la moitiè vous attend,
    et j''en accommode l''autre pour moy, qui est celle a main gauche. Vous n''auez done qu''à
    reuenir, car aussi bien que feriez vous là plus longtemps, quid struis aut qua spe Lybicis
    teris otia terris?

    Si c''est pour vous engraisser, je vous assure que c''est plustost icy que la que vous y
    reussirez. Adios.'
- verzender: Christiaan Huygens (1629-1695)
