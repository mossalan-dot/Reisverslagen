  tekst: 'A la Haye le 16 Novembre 1661.

    Je suis marry qu''estant a Paris vous n''ayez pas pu trouuer le temps pour distribuer mes
    lettres. Monsieur Thevenot a qui j''ay encore escrit depuis, me mande qu''il attend vostre
    retour avec impatience, tant a cause de la lettre qu''il scait que vous luy gardez, que
    pour presenter a mon Pere et a vous son service, ainsi qu''il m''escrit et veut que je vous
    fasse ses baisemains par avance. Je vous prie, puis que vous ne le verrez pas encore si
    tost, de luy envoyer ma lettre par le moyen de quelqu''un de vostre connoissance a Paris.
    Pour les autres il sera mieux que vous les portiez vous mesme, et j''ay dessein de vous
    en envoyer encore quelques unes.

    I''ay fait un petit voyage a Amsterdam avec le frere de S. Anneland et Monsieur van Leeuwen.
    Cettuicy nous donna a dejeuner a Leiden, en allant, et nous y ramena d''Amsterdam avec son
    carosse. I''ay compris par ses discours que d''icy en 2 ou 3 mois il pourroit bien entrer
    dans le Vroetschap, ou l''on a gardè une place vaquante. Il est incommodè d''une fluxion
    fur un pied, qu''il n''ose pas appeller par son vray nom, et qui cependant affoiblit fort
    sa vertu caminante. I''espere qu''il ne nous donnera pas subject de dire quelque jour de
    luy ce que nostre bon Resident à Cologne manda l''autre jour a Messieurs les Etats d''un
    seigneur du païs de Liege que les Chanoines avoient eleu a je ne scay quelle charge, dewelcke
    ick U Hoogh moghende verseeckere dat den podagreusten heer is die men soude moghen sien.
    C''estoit ses termes et comme vous voyez une nouuelle fort importante pour les Hogens mogens.

    Miralinde est a Delf chez sa tante d''ou le frere a receu desia une lettre, mais a cause
    de son mal de dents dont il a le visage enflè et un peu irregulier, il n''a pu encore l''aller
    veoir. De la elle passera a Leiden chez son cousin dont je viens de parler, et peut estre
    puis apres a la Haye; sa tante Catherine cependant et autres vielles dames n''approvant
    aucunement cette humeur vagabonde et promenades hors de saison. Voila qu''on m''apporte
    la nouvelle qu''elle est arrivée a la Haye avec son frere Jac. Ferdinand et qu''ils ont
    pris des chambres a une maison ou 2 du baigneur au Scheelhol. C''est assurement avec dessein
    d''y resider quelque temps. Ie fus veoir a Amsterdam Monsieur Bartelotti, ou je trouvay
    leur frere Henry, de qui les affaires tendent a la conclusion. Adieu, et n''oubliez pas
    de faire mes baisemains a Monsieur Chaise.'
