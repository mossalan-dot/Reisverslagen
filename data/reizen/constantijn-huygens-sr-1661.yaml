  tekst: 'A la Haye ce 9 Juin. 1661.

    Je croyois qu''on n''envoyoit plus des lettres a Messieurs vos Ambassadeurs comme estant
    incertain si elles les rencontreroient en chemin, mais ayant appris aujourdhuy le contraire
    de Bisdommer, je vous escris encore cellecy pour vous faire scavoir que je suis de retour
    a la Haye depuis 12 jours, et que j''espere que nous vous y verrons bientost. Je n''ay receu
    qu''une des vostres pendant que j''ay estè en Angleterre, à la quelle j''ay fait response,
    et vous ay mandè que je ne trouvois pas le sejour de Londres si charmant qu''il semble que
    vous l''ayez trouuè puis que vous tesmoignez tousjours avoir tant d''envie d''y retourner.
    Je prevoy que nous aurons grande dispute pour cela, car je vous soutiendray tousjours que
    la puanteur de la fumée y est insupportable, et tresmalsaine, la ville mal bastie, des rues
    estroittes et mal pavees, rien que des chetifs bastimens. car enfin cette piazza et tout
    le common garden est fort peu de chose et rien aupres de ce qu''on voit a Paris. Le peuple
    y est melancholique, les gens de condition assez civils mais peu sociables, les femmes de
    fort mediocre entretien et non pas du tout si spirituelles ny si animees comme en France:
    mais peut estre le monde y estoit autrement fait lors que vous y fustes, et il y a de l''apparence
    qu''apres le restablissement de la cour, l''on y verra revenir quelque sorte de politesse.
    Je puis dire au reste que j''ay eu a faire auec de fort honnestes gens, la pluspart des
    quels avoyent voyagè en France et ailleurs, qui m''ont traitè, regalè, et defrayè par tout
    fort noblement. A ceux qui ne scavoient que leur langue du pais, je la parlois aussi fort
    hardiment, et me faisois assez bien entendre. Mon maistre estoit Mistris Mary la fille du
    logis que tenoit le Prince Maurice a la quelle tous les soirs apres souper je rendois visite
    en sa chambre avec Messieurs Coenen Monsieur Chaise et quelques autres. Van Vliet m''avoit
    promis de me mener chez vostre Mistris Briggit, mais il fut longtemps sans pouuoir sortir
    de sa chambre, a cause de sa jambe qui s''estoit reouuerte, et peu apres je partis, de sorte
    que je n''ay pas vu cette belle; de la quelle pourtant il m''a racontè qu''a present elle
    estoit tout a fait dans la devotion, apres qu''un certain mariage avec un doctor en Theologie
    luy avoit manquè, et qu''elle fuyoit toute conversation et galanterie. Mademoiselle Catharina
    Smits n''estoit pas de cette humeur là, que j''allois veoir assez souvent et beaucoup d''honnestes
    gens avec moy comme Messieurs de Montpouillan, La Lecq et autres. Elle avoit appris a chanter
    des bons maistres qui sont là, et en avoit profitè beaucoup. Au reste personne ne scavoit
    ce qu''elle y estoit venu faire, ny ce qu''elle pretendoit.

    Ceux de la nouuelle academie de Physique, qui s''assemble a Greshams College m''ont fait
    veoir quantitè de belles experiences touchant le vuide, les quelles ils ne font pas avec
    le vif argent dans des petits tuyaux, mais en tirant par le moyen d''une certaine pompe
    tout l''air hors d''un grand vase de verre, ou ils mettent auparavant dedans l''un animal
    ou l''autre et diverses autres choses. Je vous monstreray le livre qu''un d''eux en a fait
    imprimer. A la priere de ces Messieurs j''avois fait venir mes verres de ma grande lunette,
    les quels ils ont veu par experience qu''ils estoient beaucoup meilleurs que les leurs,
    et m''ont sceu beaucoup de grè de ce que je leur ay appris le secret d''en faire. Le Duc
    de York et Madame la Duchesse venoient aussi quelques fois observer Saturne et la Lune,
    le lieu d''ou nous regardames estant le jardin derriere Whithall. Le Roy n''y a jamais estè,
    ce qui n''est pas estrange toutefois, car il avoit bien d''autres choses en teste pendant
    tout ce temps là. Je n''ay point receu d''autre faveur de Sa Majestè si non qu''il me dit,
    J am very glad to see you, lors qu''a Winsor je luy fis la reverence. Je ne vous dis rien
    des ceremonies et magnificences que j''ay vues, mais vous en reserve l''histoire jusqu''à
    vostre entrevue. Adieu.'
