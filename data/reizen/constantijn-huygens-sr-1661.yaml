  tekst: 'Ce 7 décembre 1661.

    Je suis bien aise qu''en fin vous ayez vu Monsieur Thevenot qui assurement est un des meilleurs
    et des plus honnests hommes de Paris. Vous pouvez l''assurer, que je feray tout mon possible
    pour luy faire avoir de Vossius, ce qu''il desire, et quant au livre de Caron je l''envoieray
    si tost, que j''en pourray trouuer la commoditè. Mais ne vous a t il pas aussi parlè d''un
    livre Italien, qu''il a gardè pour moy plus de 6 mois? Il y a quelque temps qu''il me demanda
    de la part de Monsieur Viviani de Florence si je n''avois pas receu un exemplaire de son
    livre de Maximis et Minimis, qu''il disoit avoir adressè a Monsieur de la Torre icy a la
    Haye. J''y envoiay encore hier, mais il dit que jusqu''icy il n''a rien receu; ce que je
    vous prie de faire sçavoir a Monsieur Thevenot, afin qu''il l''escrive a Viviani.

    Je ne scay pas ce que l''on vous mande touchant les amours de &c et la belle Coureuse, mais
    il me semble a moy qu''elles sont beaucoup refroidies. Cependant elle et les siens font
    tout ce qu''ils peuvent, et encore a cet heure mesme elle luy donne visite dans sa chambre,
    en quoy pourtant je croy qu''elle ne prend pas le chemin qu''il faudroit pour avancer ses
    affaires. ''t hoij nae ''t peerdt, vous scavez que cela succede rarement.

    J''ay fait dans ma bouteille l''experience avec la larme de verre dont je parlay dans ma
    precedente; je croiay qu''elle ne se casseroit pas ainsi que dans l''air, ou du moins avec
    peu de violence; mais le succes fut tout autre, car elle si brisa en poudre sans aucun respect
    du vuide.

    Un petit oiseau que je mis dedans, mourut de mesme que celuy du quel raconte Monsieur Boile.

    L''experience de l''eau chaude, qui dans son livre est la derniere, me reussit extremement
    bien, et l''eau sauta hors de la phiole qui la contenoit plus de 6 pouces de haut, et continuoit
    assez longtemps apres a bouillir comme si elle eust estè sur un grand feu.

    Une montre sonnante estant mise dans la bouteille sur un peu de filasse fut ouie beaucoup
    plus foiblement quand l''air estoit dehors qu''auparavant. Et peut estre on ne l''entendroit
    point du tout si on pouvoit vuider la bouteille entierement, au lieu qu''il y demeure maintenant
    tousjours 1/20 ou d''avantage de l''air qui la remplit d''ordinaire.

    Si vous voyez Monsieur Rohaut qui fait le vuide avec du vif argent, vous pourez luy communiquer
    ces experiences, et luy demander s''il n''en scait pas quelques unes dont je puisse faire
    l''essay pour luy.

    J''ay fait vos baisemains et ceux de Monsieur de Gentillot aux Aerssens, que je n''avois
    pas vues de long temps, a cause des continuelles maladies tantost de Monsieur de Sterrenburgh
    tantost d''elles mesmes ou de quelquun de leur freres, dont a cet heure elles commencent
    de respirer. N''oubliez pas les miens a Monsieur Chaise et dites luy qu''il loüe a tort
    ma continence pour ce qu''il en a vu chez Monsieur Bennet, puis qu''il n''y avoit rien là
    qui me pust tenter. Je n''ay pas encore estè veoir ce que vous mandez a ma soeur du traitement
    de Monsieur Hesselin, a cause que ces deux jours il a fait un temps horrible. mais je ne
    m''imagine pas moins que chere entiere.'
