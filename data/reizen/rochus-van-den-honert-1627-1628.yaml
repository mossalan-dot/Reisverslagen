beschrijving: Maakte in 1627 een diplomatieke reis naar Polen en Zweden met medegezanten Andries
  Bicker (1586-1652) en Simon van Beaumont (1574-1654). De reis werd vastgelegd door Abraham
  Booth (1606-1636).
