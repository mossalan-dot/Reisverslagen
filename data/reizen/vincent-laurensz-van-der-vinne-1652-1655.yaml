beschrijving: Verslag van de kunstenaarsreis van Vincent Laurensz. van der Vinne naar Duitsland,
  Zwitserland en Frankrijk in 1652-1655 in het gezelschap van de schilders Guillaume Dubois
  (1623-1661), Dirck Helmbreeker (1633-1696) en Cornelis Bega (1631-1664) en de schoenmakersgezel
  Joost Boelen. Een tweede en vermeerderde versie van het verslag lange tijd na de reis opgeschreven.
  De eerste versie is getiteld Memoriael ofte dagelijcxse aentekeninge (...). Daarnaast is er
  een afchrift van de tekst in particulier bezit, gemaakt door de nazaat Vincent Janszn. van
  der Vinne (1736-1811). Van der Vinne reisde van Haarlem naar Duitsland en volgde de Rijn tot
  Keulen, waar hij vier maanden verbleef om te werken. Hij vervolgde zijn weg zuidelijk naar
  Straatsburg en Bazel en verbleef driekwart jaar in Genève. Vanuit Lyon maakte hij verschillende
  uitstapjes naar Grenoble, Chambéry en Tournon. Hij trok noordelijk naar Parijs en verbleef
  daar twee maanden, alvorens in Le Havre scheep te gaan naar Rotterdam. Hij verbleef langere
  tijd in Keulen (27 augustus-11 september 1652; 6 december-18 april 1653), Frankfurt am Main
  (17-25 september 1652), Heidelberg (27 september-30 november), Yverdon-les-Bains (19 mei-6
  juni), Genève (9 juni-21 september 1654; 12 april-31 mei 1655), Lyon (26 september-27 oktober
  1654; 8-29 november), Tournon (4 december-19 februari 1655; 24 februari-30 maart), Montluel
  (2-9 april) en Parijs (12 juni-17 augustus).
