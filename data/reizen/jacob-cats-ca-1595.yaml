poezie:
- titel: Jongelinck. T’samen-spraeck tusschen Philemon en Pudens
  dichter: Jacob Cats
  taal: Nederlands
  bron: Cats 1862, 761-763
  link: https://www.dbnl.org/tekst/cats001jvan02_01/cats001jvan02_01_0351.php
  beschrijving: gedicht over educatiereizen, apodemische waarschuwing
  tekst: "Jongelinck. \nT'samen-spraeck tusschen \nPhilemon en Pudens.\n \nPhilemon.\nWel Pudens,\
    \ wat veranderingh is dit? ick vinde u nu een jongelingh, daer ick u onlancks niet als een\
    \ kint en liet; te rechte seyt men:\nGroene kersen worden root,\nKleyne kinders worden groot.\n\
     \nPudens.\nIs 't wonder?\nAd virile robur per pueritiam itur. Sen.\nDe boom daer ghy nu\
    \ vrucht af leest,\nDat is wel eer een rijs geweest.\n \nPhilemon.\nMaer hoe dus gekleet,\
    \ als of ghy tot reysen vaerdigh stont?\n \nPudens.\nIck meyne, dat het voor my langh genoegh\
    \ onder den roock van mijns moeders schouwe geseten is. Hier goet en elders goet.\nNul en\
    \ pris En son païs.\nNiemant is in weerde\nIn sijn eygen eerde.\nSie ick 't niet alle dage?\n\
    Men acht geen verstant\nIn sijn eygen lant.\n\nEn daerom (nae my dunckt) is 't best wat\
    \ te reysen, om alsoo, door vreemde talen ende aenneminge van heusche manieren, aensienlicker\
    \ t'huys te komen; want anders plagh men ons licht te seggen:\n \nDie t'huys sijn jonckheyt\
    \ heeft versleten,\nEn by den bry-pot heeft geseten,\nEn daer geen letters heeft gegeten,\n\
    Wat kan de goede slocker weten?\nIn tegendeel:\nDie lange leven en verre reysen,\nDie leeren\
    \ op haer saken peysen.\n \nPhilemon.\nIck sie dat ghy uw seggen met spreeck-woorden en\
    \ spreucken soeckt vast te maecken; maer als ick u met de selve munte soude betalen, heb\
    \ ick niet wel eenige spreucken gehoort die vry al wat anders klincken?\n \nHoe, seyt men\
    \ niet in 't gemeen:\nAl reyst een los-hooft buytens lants,\nNoch blijft hy wel een domme\
    \ gans?\nEn daerom:\nGae, sent een esel nae Parijs,\nGhy krijght hem weder even wijs.\n\
    En voor reden:\nWie over zee veel plagh te swieren,\nVerandert lucht, en geen manieren.\n\
    Tot besluyt:\nHoe dat'et gaet, of hoe het is,\nDe botten blijven plat-vis.\n\nEn of al schoon\
    \ de manieren van de soodanige somtijts al wat verandert worden, 't is selden in beter:\n\
     \nJamais bon cheval, ou homme\nN'amenda pour aller à Rome.\nTe Romen gingh noyt man of\
    \ peert,\nOf 't was des vry te minder weert.\n\nEn wat de vrouwen aengaet, die al mede somtijts\
    \ reysen willen, sonderlinge onder decksel van bedevaerten, om in 't voorbygaen daer van\
    \ mede wat te seggen, daer heeft het Spaens spreeckwoort het stuck, mijns oordeels, wel\
    \ geraeckt:\n \nIr romera y bolver ramera d.i.\nAller pelerine & revenir putain.\n\nHier\
    \ is te letten, om de aerdigheyt van de spreucke recht te vatten, dat Romera, het welck\
    \ is een pelgrimessche, oste een vroumensch die in bedevaert gaet, maer een letter en verschilt\
    \ van Ramera, beteyckenende een oneerlick wijf, dat wy een hoere noemen:\n \nReyst vrou\
    \ of maeght in bedevaert,\nSy krijght wel licht een lichten aert.\n \nPudens.\nDaer is misschien\
    \ al wat aen, Philemon, maer des niet te min soo houde ick vast, dat vreemde landen, vreemde\
    \ oogen, en vreemde streken, die men in 't reysen dickwils ontmoet, ons al vry wat leeren\
    \ konnen:\n \nDie hier en daer eens wort genepen,\nEn dickwils by den neus gegrepen,\nAl\
    \ is hy plomp, hy wort geslepen.\nDe reden daer van is klaer:\nAprès domage\nChacun est\
    \ sage.\nHarde steenen slijpen yser,\nHarde stooten maken wijser.\n \nPhilemon.\nMen segge\
    \ wat men wil, en men soecke waer men wil, ons Nederlandts spreeck-woort luyt ende sluyt\
    \ meesterlick:\n\nWilje wel zijn, wilje rusten?\nSoeckt het niet op vreemde kusten;\nEygen\
    \ huys en eygen dack,\nDat is vry een groot gemack.\nA chacun oiseau\nSon nid est beau.\n\
    Elck vogel prijst sijn nest;\nGhy dan, vaert nae Oost of West,\nEygen huys is alderbest.\n\
     \nPudens.\nHier stelle ick een ander tegen, dat mede sijn bescheyt heeft:\n \nPatria est,\
    \ ubicunque bene est:\nAl waer men is in goeden stant,\nDat is al med' ons Vaderlant.\n\
    En wat het rusten aengaet, daer op seghe ick:\nGeen jonghman mach op rusten peysen,\nDie\
    \ buyten is gesint te reysen;\nMaer is men oudt, of sieck, of moê,\nDien stae ick eerst\
    \ het rusten toe.\n\nPhilemon.\nGelooftet, waer dat men komt daer vintmen sijn weert t'huys.\n\
     \nWant:\nEn tout païs mordent les chiens.\nHonden hebben tanden,\nIn alle landen.\n\nMen\
    \ houde soo veel van reysen als men wil, ick hebbe nochtans eens gelesen een seecker boecxken\
    \ van D. Joseph Hal, in 't Engels geschreven, daer van het opschrift is: Quo vadis? daer\
    \ in hy veel goede redenen bybrenght, die soo geheel seer voor het veel reysen niet en zijn.\
    \ Alle beweginge, seyt hy, maeckt onruste, en die beyde ongenoegen; daer in het tegendeel\
    \ de geluckige stant des hemels wort afgebeelt by ruste. Ghy dan, die soo genegen schijnt\
    \ te zijn tot reysen, sie toe dat ghy niet eenmael met berou en komt uyt te roepen, soo\
    \ als onlangs seker jongelinck, ons niet onbekent, met leetwesen dede, ten tijde als hy\
    \ veel en lange door de werelt gedwaelt en gemaelt hadde. In 't reysen, seyde hy, heb ick\
    \ menigen Engelot uytgesonden, die noyt haren meester eenige tijdinge weder en brachte,\
    \ en dit dede ick soo lange tot dat ick een borger van al de werelt was geworden, ende een\
    \ vreemdelinck soo in mijn vaderlant, als aen mijn eygen selven, en quam alsoo t'huys, meer\
    \ beladen met gebreken, als met gelt, meer met waen, als met wijsheyt. Dan niet-te-min soo\
    \ bekenne ick, dat de gene die met een goet voornemen uytgaen, niet te lange uyt en blyven,\
    \ ende een goede reyslesse mede nemen, somwijlen wel yet goets t'huys konnen brengen.\n\
     \nPudens.\nIck wenste wel soo een reys-lesse te hebben, ick soude die voor my, als een\
    \ draet in een doolhof, en als een leyts-man op de wegen gestadig aen de handt houden; ghy\
    \ daerom, is'er yet sulcks by u, ick bid u en spaert geen broot voor de vrienden.\n \nPhilemon.\n\
    My is onlancks soo een reys-lesse ter handt gekomen, en my dunckt soo ghy die met ernst\
    \ woudt in 't werck stellen, ghy soudt'er u wel by bevinden; doch op dat ghy des te meerder\
    \ kennisse mochte krijgen, soo wil ick u deselve jegenwoordelick eens voorlesen.\n \nGhy,\
    \ hoort toe,\nEn staet wat stil.\n \nPudens.\nSoo ick doe,\nEn soo ick wil.\t\n \nPhilemon:\n\
    Een vader had een raeuwen quant,\nDie wou gaen reysen uyt het lant,\nOm eens te leeren metter\
    \ daet,\nHoe dat'et in de werelt gaet;\nHy, die wist hoe de jonckheyt malt,\nEn waerse dickmael\
    \ henen valt,\nBysonder alsse, buyten dwangh,\nMagh hebben haren vryen gangh,\nRiep sijnen\
    \ soon ter zijden af,\nDaer hy hem dese lesse gaf:\nNadien, seyt hy, mijn weerde kint,\n\
    Dat ghy tot reysen zijt gesint,\nSoo hoort doch hier op mijnen raet,\nDie ick geleert heb\
    \ uyt de daet:\nEerst, waer ghy u tot reysen set,\nBegint den dagh met uw gebet;\nWant haver\
    \ geven aen uw beest,\nEn Godt te bidden in den geest,\nSchoon dat'et beyde tijt vereyst,\n\
    En doet geen hinder als men reyst\nDan is noch vorder mijn bevel,\nGaet, kiest voor u een\
    \ reys-gesel;\nWant reysen sonder mede-maet,\nEn was noyt wijse lieden raet:\nMaer kiest\
    \ een vrient van uwen aert,\nDie hant en herte reyn bewaert,\nEn niet en helt naer vuyl\
    \ bejagh,\nDat jonge lieden schaden magh;\nNoyt speelt'er iemant met het peck,\nDie niet\
    \ en hiel een vuyle vleck.\nMaer ghy, die u tot reysen stelt\nBegintet nimmer sonder gelt;\n\
    Want die wil reysen achter lant,\nDie hebbe munte by der hant,\nDat is een kruyt van groote\
    \ kracht,\nWaer op de gansche werelt acht,\nEn als u dat geselschap faelt,\nSoo wort ghy\
    \ selden wel onthaelt.\nDoch gelt te dragen overal,\nDat baert by wijlen ongeval,\nGhy,\
    \ vrijdt u van dat ongerief,\nEn dient u van een wissel-brief;\nWant dat en is geen lastigh\
    \ pack,\nMaer voor die reysen groot gemack.\nVoorts, wilt ghy reysen met verstant,\nSoo\
    \ hebt een kaerte byder hant\nVan yder rijck dat ghy betreet,\nOp dat ghy daer de gronden\
    \ weet,\nEn kent bynae de gansche kust,\nOock eer ghy daer oyt hebt gerust.\nEn is'er onder\
    \ wege dan,\nEen wijs, geleert, of deftigh man,\nEn laet niet of besoeckt den vrient,\n\
    Vermits het u ten nutte dient;\nDe wijsheyt is een rijcke schat,\nWie die genaeckt ontfanght'er\
    \ wat.\nWanneer ghy van den peerde sit,\nEn van het reysen sijt verhit,\nEn eyst terstont\
    \ geen bier of wijn,\nWant dat en kan maer hinder zijn;\nToomt hier en elders uwe lust,\n\
    Dat is de grondt van uwe rust;\nNiet al, niet al, dat ons behaeght,\nEn dient den mensche\
    \ naegejaeght.\nStelt u dit voor een vaste wet,\nDat ghy op alle dingen let,\nDat ghy gestaegh\
    \ uw voordeel doet,\nMet al wat iewers u ontmoet,\nDe werelt is een wonder boeck,\nHet maeckt\
    \ sijn leser wonder kloeck,\nMaer wie het sonder oordeel leest,\nDie blijft gelijck hy is\
    \ geweest;\nGhy, doet niet als den meesten hoop,\nMaer doet met aendacht uwen loop;\nHoort\
    \ ghy een sneêgh, en geestigh man,\nDaer hoorje dat u leeren kan;\nSiet ghy een ongesouten\
    \ geck,\nLeert noch al iet uyt sijn gebreck:\nLeert mijden dat hy qualick doet,\nEn hoe\
    \ men sotten vieren moet.\nIn 't korte, waer ghy d'oogen keert,\nSiet, datje 't een of 't\
    \ ander leert.\nAl watmen hoort of watmen siet,\nDie leeren wil, die leert'er iet.\nWat\
    \ is'et of ghy verde rijdt,\nEn in een groot geselschap sijt,\nEn dan, in eenigh lustigh\
    \ velt,\nVeel cristalijne beken telt,\nOf elders, in een open wout,\nVint schoone sloten\
    \ op-gebout;\nVint Princen huysen neêr-geruckt,\nVint torens in het stof gedruckt,\nVint\
    \ puyn, en ick en weet niet wat,\nDaer eertijts stont een schoone stadt;\nVint weder dreven\
    \ nieu geplant,\nTot ciersel van het gansche lant,\nVint hoven na de kunst gemaeckt,\nDaer\
    \ van dat ghy de vruchten smaeckt;\nVint rotsen uyttermaten hoogh,\nOock verre boven 's\
    \ menschen oogh;\nVint ander vreemt en nieu gewas,\nDaer van men noyt te voren las;\nVoorwaer\
    \ al dat en acht ick niet,\nTen zy dat ghy wat verder siet,\nTen zy uw dom en grilligh hert\n\
    Besetter, en oock beter wert.\n't Is niet gereyst, 't is maer gedwaelt,\nIndien men daer\
    \ geen wijsheyt haelt.\nWaer ghy oyt gaet of henen treckt\nHout staegh uw beurs en hert\
    \ bedeckt3);\nEn melt niet, door een lossen praet,\nVan waer ghy komt of henen gaet,\nEn\
    \ min noch wat uw herte jaeght;\nWant dat heeft menigh man beklaeght.\nSiet, waer men gaet\
    \ of waer men reyst,\nNoyt dient geseyt al watmen peyst;\nEen heusche mont is altijt goet,\n\
    Doch meest voor een die reysen moet.\nNu voorts, op dat ghy schouwen meught\nVeel malle\
    \ grepen van de jeught,\nSoo laet geen dranck uw meester sijn,\nHet sy van bier of heete\
    \ wijn;\nWant die gebruyckt in overvloet\nEn is te gener plaetse goet,\nMaer als ghy uyt\
    \ den lande sijt\nSoo dient hy boven al gemijt.\nDoch soo ghy eens wert over-last,\nOf van\
    \ een heeten damp verrast,\nSoo mijdt noch al een vorder quaet:\nEn loopt niet mallen over-straet,\n\
    Maer hout u stil soo langen tijt,\t\nTot datje weder nuchter zijt.\nBegeeft u noyt des avonts\
    \ laet,\nNoch op den wegh, noch op de straet:\nVroegh uyt te gaen, vroegh onder 't dack,\n\
    Dat is gesont en groot gemack.\nDes nachts te loopen hier en daer,\nDat is niet anders als\
    \ gevaer.\nGhy, laet den nacht en haer bejagh,\nEn doet uw saken by den dagh;\nWant dat\
    \ men in het duyster doet\nWort op den lichten dagh geboet.\nKijft niet in 't bed of aen\
    \ den heert,\nEn twist oock niet met uwen weert,\nMaer is hy vils, of niet te pluys,\nBetaelt,\
    \ en soeckt een ander huys.\nEn twist niet met uw reys-gesel:\nSpreeckt iemant qualick?\
    \ antwoordt wel;\nSchoon spreken is van groote kracht,\nHet maeckt oock harde koppen sacht.\n\
    Bewaert uw oogh, uw mont, uw beurs,\nEn hoedt u voor een vrouwe-keurs,\nEn mijdt u voor\
    \ een mede-maet,\nDie op de gladde wegen gaet,\nOock wacht u voor den dobbelsteen;\nWant\
    \ dit sijn kanckers in het been.\nEen dingh dat ghy niet sparen moet,\nDat is de rant van\
    \ uwen hoet;\nGrijpt die vry dickwils metter hant,\nEn hier, en in een ander lant,\nWant\
    \ 't is een saeck die gunst verweckt,\nEn die tot geenen kost en streckt;\nIck achte voor\
    \ de jonckheyt goet\nEen trage beurs, een rappen hoet.\nGeen oogh in iemant anders brief,\n\
    Geen hant-spel met een anders lief,\nGeen vingers in een anders tas,\nWant dat geen man\
    \ oyt lief en was.\nEn kiest niet licht een nieuwen vrient,\nOf weet te voren of het dient;\n\
    De werelt is te lijdigh boos,\nDe menschen al te bijster loos;\nDus niemant al te licht\
    \ betrout,\nWant dat heeft menigh man berout.\nWanneer u iemant noodt te gast,\nGhy, doet\
    \ uw maegh geen over-last.\nLet meer, op dat ghy leeren kont,\nAls lust te geven aen den\
    \ mont;\nEn brenght misschien dan iemant voort,\nEen goet, een sneêgh, een geestigh woort,\n\
    Ontfanght dat met een vrolick hert,\nGelijck een schat ontfangen wert;\nEn als ghy tot de\
    \ woon-plaets keert,\nSeght dan: wat heb ick daer geleert?\nWat brenght of schenckt my desen\
    \ dagh,\nDat my ten goede dienen magh?\nEn, naer een neerstigh ondersoeck,\nSoo schrijft\
    \ in uwen tafel-boeck\nAl dat uw herte wel beviel,\nDat is al voetsel aen de ziel;\nDat\
    \ is u beter in den mont,\nAls al dat op de tafel stont.\nMijn kint, houdt altijt desen\
    \ sin,\nGelijckt de By, en niet de Spin;\nAl wat ghy hoort en wat ghy siet,\nAl wat'er hier\
    \ en daer geschiet,\nDat weeght, dat proeft, en kipter uyt\nDat wel, dat soet, dat geestigh\
    \ luyt:\nMaer komt'er eenigh vuyl bejagh,\nHaelt dat noyt weder aen den dagh,\nMaer wijstet\
    \ spoedigh van der hant,\nEn laet'et uyt het vaderlant.\nGhy treet nu uyt mijn huys alleen,\n\
    En keert noyt weder met u tween,\nBrenght ons doch hier geen bastert-kint,\nDat maeckt een\
    \ vader ongesint;\nBrenght ons doch hier geen dertel wijf,\nMet u gepaert uyt tijt-verdrijf,\n\
    Jae, noyt op vryen eens en peyst\nSoo lange ghy daer henen reyst;\nTe trouwen als men leeren\
    \ moet,\nDat dede noyt een jonghman goet;\nMen queelt hier om sijn gansche jeught,\nEn dat\
    \ al om soo korten vreught.\nGhy daerom, wat ick bidden magh,\nBehoedt u voor een quaden\
    \ slagh,\nEn, om een blijde nacht of twee,\nEn steeckt u in geen eeuwigh wee.\nMaer om hier\
    \ van te zijn bevrijt,\nSoo maeckt dat ghy voorsichtigh zijt,\nEn woont of koopt uw kosten\
    \ niet,\nAl waer ghy vlugge dochters siet;\nIck weet, hoe licht de losse jeught\nWort om-gevoert\
    \ door geyle vreught;\nEn als men dan te samen malt,\nWaer is'et daer men niet en valt?\n\
    Daer stroo en vyer te samen koomt7),\nWat onheyl dient'er niet geschroomt?\nNu, Soon! gaet,\
    \ vordert uwe reys,\nEn houdt mijn les in uw gepeys,\nEn als ghy dan eens weder-keert\n\
    Gesont, beset, en wel geleert,\nSoo sal men hier, van stonden aen,\nVoor u 't gemeste kallef\
    \ slaen.\n \nPudens.\nGewisselick, dese reys-lesfe, bestaende in korte verskens, is van\
    \ langh bedencken, en daerom soo ter loops niet in te nemen; want (naer ick die begrijpe)\
    \ soo steeckt'er meer in als in een ylen haringh; ick bidde u, laet my een keersse aen de\
    \ uwe ontsteken, ick wil seggen, laetse my uytschryven, soo ben ick geholpen, sonder uw\
    \ verlies.\n \nPhilemon.\nIck ben des te vreden, Pudens, doch met dit bespreck, dat ghy\
    \ sult aen-nemen, niet alleenlick op uwe reyse de selve vlijtelick in 't werck te stellen,\
    \ maer oock acht te nemen op allerhande voor-vallende spreucken en spreeck-woorden, en de\
    \ selve by memorie opnemen, om ons daer van deelachtigh te maken, soo wanneer ghy weder\
    \ in 't vader-lant keeren sult; op dat also het mes, dat den appel gesneden heeft (als de\
    \ kinderen plegen te seggen), al lacchende mach t'huys komen.\n \nPudens.\nGansch ondanckbaer\
    \ moeste ick wesen, so ick sulcx op uw begeerte niet aen en nam te doen: siet daer mijn\
    \ handt, ick verbinde my sulcx nae te sullen komen, en neme met een van u mijn afscheyt.\n\
     \nPhilemon.\nDoet ghy nae uw woort, soo wil ick vertrouwen dat ghy uwen naem met een letter\
    \ wel mocht vermeerderen, en, in plaetse van Pudens, Prudens sult mogen heeten op uwe weder-komste.\
    \ Maer dewijle ghy my vermaent hebt geen broot voor vrienden te willen sparen, soo moet\
    \ ick, voor mijn afscheyt, u onder andere mede deelachtig maken van een vreemt geval, dat\
    \ ick verstont een reysenden man bejegent te zijn; waer op ick een seker bedencken t'anderen\
    \ tijde gehadt, en op 't papier gebracht hebbe; ontfanght dat by geschrifte voor een Vaer-wel-gifte\
    \ op dese uwe reyse, ende voor al op de groote reyse van hier in de andere werelt; en op\
    \ dat ghy de meyninge des te beter vatten mogt, soo wil ick 't u eenmael voor-lesen; de\
    \ galm van de stemme kan al mede wat geven:"
