  beschrijving: Frederiks, 1883, p. 240 suggereert dat dit gedicht dateert van 1649, van het
    begin van Six' reis door Frankrijk, Spanje en Italië, maar het zal eerder betrekking hebben
    op Six' reis naar Engeland in de herfst (vgl. r. 1) van 1654, die hem via Duinkerken naar
    Londen voerde (vgl. gedicht no. [435]). Dit gedicht staat op p. 563-564 van Six' bundel
    van 1657.
  tekst: "Hoe haalt de soomer 't herrefstweer,\n \nZoo koulik in, met reegenvlaagen,\n \nEn\
    \ suider stormen, op dit veer,\n \nDer Flessenaars, die niet ontsaagen,\n5\nTen hoone van\
    \ den landtiran,\n \nDen neef van Alba op te hangen:\n \nDie eeven rustigh man, voor man,\n\
     \nMet waapentuigh, en blixemslangen,\n \nD'onmenschelyke tiranny,\n10\nVan hun manhafte\
    \ muuren wurpen?\n \nHoe bruist, en kluist het zeegety,\n \nAls of het Vlissinge in wou\
    \ slurpen,\n \nBenydende myn reis, na Sluis?\n \nDe locht bestolpt, met bruine wolken,\n\
    15\nBestraalt des daaghs noch mensch, noch huis,\n \nBestaarent 's nachts geen soute kolken.\n\
     \nHoe blyven wind, en waaterheer,\n \nZoo gram te waater, en te lande?\n \nWaar mee set\
    \ ik hun gramschap neer?\n20\nZyn sy gedient met offerhande\n \nVan stieren, en dolfynen\
    \ bloed?\n \nWie zyn de zoo verbolge gooden?\n \nIs 't Eol, in geberght gevoedt?\n \nEn\
    \ volght Neptunus syn gebooden?\n25\nWegh, wegh, met deese afgoodery,\n \nWaar in de heidenen\
    \ verdronken,\n \nOnsterflike eer van poësy,\n \nAan konstge menschen, licht geschonken.\n\
     \nDie Heemel, Aardryk, en de Zee,\n30\nMet synen geest, uit niet, kon scheppen,\n \nDoor\
    \ eenigh woord, bestormt de ree,\n \nWaar schuit, noch schipvaard seil durft reppen.\n \n\
    Hy die de valschgenaamde Goôn,\n \nIn graavenasche langh verdweenen,\n35\nEens daagen zal,\
    \ voor synen throon,\t\n[p. 743]\t\n \nAls ziel, en lichaam weer vereenen,\n \nDie allergod\
    \ viert zoo den toom,\n \nAan ongestuime storremwinden,\n \nEn d'alvernielend graage stroom,\n\
    40\nDie hy, in synen vuist, kan binden.\n \nO alvermoogende oppermacht,\n \nBedaar uw toorn,\
    \ hoewel rechtvaardigh,\n \nBedaar het onweer, deesen nacht,\n \nEn straf ons niet, al zyn\
    \ wy 't waardigh.\n45\nOch laat de nieuwe daageraad,\n \nMet zeegeschrei, ons niet ontwaaken,\n\
     \nOm scheepsverlies, en teegenbaat,\n \nDie armen, en die weeuwen maaken.\n \nMaar laat\
    \ het vriendlik sonnelicht\n50\nNoordoostlik labberkoeltjes waalen,\n \nDat wy, aan uw genaa,\
    \ verplicht,\n \nHet zeil, in top, niet zeewaarts, haalen.\n \nOm dat de Fransman buiten\
    \ om,\n \nLangs Vlaandren, teegen recht, loopt stroopen:\n55\nDoch voert ons, met uw Engeldom,\n\
     \nWy vaaren wel, waar dat we loopen.\n \nHet offer van een dankbaar hart,\n \nDat u voor\
    \ stallen kan behaagen,\n \nWerd, van uw knechten, op het bard,\n60\nVan lofaltaaren, dan\
    \ geslaagen."
- titel: Klachte, oover Ypren
  dichter: Joannes Six van Chandelier
  datum: herfst 1654
  locatie: Ieper, Zuidelijke Nederland
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Op zijn eerste reis naar Engeland, in de herfst van 1654, bezocht Six de stad
    Ieper, waar hij vijftien jaar eerder al eens was geweest (vgl. gedicht no. [136], r. 13).
    Deze klachte staat op p. 565-566 van Six' bundel.
  tekst: 'O Ypren, naa de soete beeken

     

    Die, door uw straate, soetlik leeken,

     

    Geheeten, nu ik uw landouw,

     

    En seeven eeuwgen bouw aanschouw,

    5

    Waar is uw gulde glans gevaaren,

     

    In min dan twintigh oorlooghsjaaren?

     

    Hoe vreedigh blonk uw steenen wal?

     

    Hoe bloeide toen uw koorenhal?

     

    Hoe ryk was uwe markt van linnen,

    10

    Van vlas, en hennip, om te spinnen?

     

    Hoe opgeswollen was de beurs

     

    Der borgery, van geld, vol keurs?

     

    Hoe praalden uwe jongelingen,

     

    En dochters, by gedans, en singen?

    15

    De dischen hadden opgedischt,

     

    Al wat men slacht, en vanght, en vischt.

     

    Ghy kost, met wyn, en bier, als heeren,

     

    Geheele nachten banketteeren.

     

    Maar nu, maar nu zyt ghy een weeuw,

    20

    Bedrukt rondsom, in kryghgeschreeuw,

     

    Berooft van uwe morgengaave,

     

    En schier als ''s lands, en bruilofts haave.

     

    Uw bedgenoot viel, door het swaard,

     

    Met d''erven, die ghy had gebaart.

    25

    Men siet het gras, op straaten, groeijen.

     

    De steedegracht, van traanen, vloeijen.

     

    De poorten sluiten ''s aavonds vroegh.

     

    Het vruchtbaar land vergeet den ploegh.

     

    Men wilt aan schattingh d''akkers offren:

    30

    Maar oorlogh eischt de vrucht der koffren.

     

    Men plukt u kaaler dan een hoen,

     

    En ''t is om al de rest te doen.

     

    Helaas! wat zal het eindlik werden!

     

    Hoe kan ''t de droeve Moeder harden!

    35

    Sy geeft sich Spanje, en Vrank ten roof.

     

    Noch blyven geld, en staatsucht doof.'
- titel: Duinkerken in swym
  dichter: Joannes Six van Chandelier
  datum: najaar 1654
  locatie: Duinkerken, Frankrijk
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: In de herfst van 1654 reisde Six door de Zuidelijke Nederlanden en stak over
    naar Engeland. Tijdens die tocht bezocht hij ook Duinkerken, waar hij al eens was geweest,
    lang voor de vrede van Munster (vgl. r. 17-18). Dit gedicht staat op p. 566-567 van zijn
    bundel Poësy.
  tekst: 'Hoe nokt dees zeehond, sonder tanden,

     

    Die kerken, in het barre duin,

     

    Met vischen, aan de geusestranden,

     

    De schaaren van den God Neptuin,

    5

    Prop vol pleegh, van den roof, te maaken?

     

    Hoe schon de vree syn bloende kaaken?

     

    Nooit gingh dit zeegedrocht te waater,

     

    Of al de zee keek anghstigh uit:

     

    Of keerde bly, met vimgeklaater,

    10

    Met muil, en klaauwen, vet van buit,

     

    Van ryk gelaade koopmans scheepen,

     

    Met groot, of klein geweld gegreepen.

     

    Wanneer pas twaallef galeoenen,

     

    Het restjen van Okquendoos vloot,

    15

    Met aangetrokke loopers schoenen,

     

    In ''t scheurtjen, schuilden, uit den nood,

     

    Toen sach ik solders, kelders, haaven

     

    Te klein, om ''t roofaas te begraaven.

     

    Nu sie ik niet dan leege schuuren,

    20

    Te licht verslampampt, en versmeert.

     

    Blyft deese flaauwte langer duuren,

     

    Dat Mars dien roofkaak niet vereert,

     

    Met ysre tanden, koopre kiesen,

     

    Zoo zal hy voorts den geest verliesen.

    25

    Dus wensch ik deese week te Londen,

     

    Dat ons zoo valsch heeft aangerandt,

     

    Te sien haar grooter waaterhonden

     

    Zieltoogende, op ''t verraadersch strand.

     

    Zoo zal ik welkom, in ons paalen,

    30

    De Beurs wat nieuws, en liefs verhaalen.'
- titel: Afscheid van Engeland
  dichter: Joannes Six van Chandelier
  datum: 1654-1655
  locatie: Engeland
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Het gedicht dateert van 1654 of 1655, de jaren van Six' eerste en tweede reis
    naar Engeland. Engeland gold in Six' tijd als het textielland bij uitstek; het leverde de
    grondstoffen voor de textielindustrie op het vasteland van Europa. Het gedichtje staat op
    p. 586-587 van Six' Poësy.
  tekst: 'O Engeland, myn rymgeest slacht het dier,

     

    Dat nu een schaap gelykt, of kleine sier,

     

    Langs uw geberght, van verre, of van na by:

     

    Dat van heur werk, voor laakenweevery,

    5

    Onpynlik laat, en sachte vlokjes spilt,

     

    Wanneer ''t ontrent een braamhaagh boompjes schilt.

     

    Had ik belust uw doornbosch niet deurgaan,

     

    Schoon eer vervloekt, ghe zoud myn wol niet laân.'
- titel: Onweer, op weeromreis, uit Engeland, aan matroos
  dichter: Joannes Six van Chandelier
  datum: najaar 1654
  locatie: Engeland
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: Tijdens een storm in het najaar van 1654 stak Six op de terugtocht van zijn
    eerste reis naar Engeland het Kanaal (vgl. r. 5-6) over en schreef daarop dit gedicht. Het
    staat op p. 587-588 van zijn bundel.
  tekst: "Hoe raast het diep, zoo woest, zoo dol,\n \nGeswollen van de herrefstwinden,\n \n\
    Tot waaterbergen, om dit hol\n \nVan oorlogh honghrigh te verslinden?\n5\nOf om te slingren\
    \ teegen strand,\n \nVan Vrankryk, of van Engeland?\n \nVergat de vreeselyke zee,\n \nDie,\
    \ om de gansche werld, loopt golven,\n \nHoe sy, op 't meeir van Galile,\n10\nHet schip,\
    \ met waater, had bedolven,\n \nMaar hoe de Nazareener held\n \nHeur stilde, en vlak streek,\
    \ als een veld?\n \nOf bleef in heur de selfde macht,\n \nDie tusschen Joppe, en Tharsis\
    \ woedde,\n15\nWanneer het stuur, van storm, verkracht,\n \nTe wonderlyk iet vremds vermoedde,\n\
     \nWes Jona, door het lot, verklaart,\n \nIn zee gesmakt, de zee bedaart?\n \nVervaarde\
    \ hopman, en matroos,\n20\nMen loote niet, wie hier mach weesen,\n \nZoo ongehoorsaam, en\
    \ zoo boos,\n \nDat wy de wreede baaren vreesen.\n \nMen werp my rustigh, oover boord,\n\
     \nGod is alleen, op my, verstoort.\n25\nAl smoor ik in des afgronds buik,\n \nGhy blyft\
    \ rechtvaardigh, in uw weegen,\n \nO bakker van myn zielekruik\n \nGescheurt, met morsich\
    \ werk, te pleegen:\n \nMaar, o Verlosser, laat myn vel\n30\nNiet eeuwigh rotten, in den\
    \ hel.\n \nIk weet dat myn verlosser leeft,\n \nDie al myn sonden zal vergeeven,\n \nDie\
    \ dood, en graf geheilight heeft,\n \nDen wegh gebaant, naa 't saaligh leeven:\n35\nDie\
    \ zal myn lichaam, uit het slyk,\t\t\n \nVersaamen in syn Kooninghryk.\n \nMyn ziel verlichaamt,\
    \ en verlicht,\n \nZal, neeven Englen, in Gods hooven,\n \nVan aangesicht, tot aangesicht,\n\
    40\nHeur troost, en saalighmaaker looven,\n \nMet Heemelvreughde om eeuwigh goed,\n \nBegryplik\
    \ in geen aardsch gemoed.\n \nWat mart dit bange, en bloode volk?\n \nKom dolle zee, en\
    \ vul uw tanden,\n45\nBevreedigh uw ontsteeken kolk,\n \nMet werldversmaadende offerhanden.\n\
     \nUw balgh is doch myn heemelpoort.\n \nKom stort, en ruk my buiten boord."
literatuur:
- BWN, XVII, 705-706; NNBW, X, 924-925; Verkuyl 1974, 47-49; Van Caspel 1978, 119-121; Van Bork
  en Verkruijsse 1985, 527; Six van Chandelier 1991, xxxv-xlv; Dijstelberge 1993, 331-336; Schenkeveld-van
  der Dussen 1993, 255-260; Porteman 1997, 123-134.
