- titel: De waarom, van myne vrymoedige reise, naa Engeland
  dichter: Joannes Six van Chandelier
  datum: Engeland
  locatie: '1654'
  taal: Nederlands
  bron: Six van Chandelier 1991
  link: https://www.dbnl.org/tekst/six_003gedi01_01/six_003gedi01_01_0053.php
  beschrijving: "De in dit gedicht verantwoorde reis is die van de herfst van 1654, Six' eerste\
    \ reis naar Engeland. Sinds zijn schrikspiegel, om niet naa engeland te reizen (gedicht\
    \ no. [235], vermoedelijk van 1649) is Six kennelijk tot andere gedachten gekomen. In een\
    \ bewijsvoering met enkele exempla toont hij aan dat een argumentatie als in dat gedicht\
    \ voorkomt, geen steek houdt.\t\n \tGrosheide, 1951, p. 101-103 neemt op grond van dit gedicht\
    \ (met name op grond van r. 18-24) aan, dat Six bij Cromwell zelf een vriendelijke ontvangst\
    \ heeft genoten en dat dit persoonlijk contact hem tot een radicale wijziging van zijn beoordeling\
    \ van de Protector heeft gebracht: ‘We zitten hier wel een heel eind af van de vervloeking\
    \ van het Kontrefeitsel’ (nl. gedicht no. [349]). Van Es, 1953, p. 180-181 denkt hier kennelijk\
    \ anders over. In zijn annotatie geeft hij aan dat r. 48 ironisch bedoeld is en verklaart\
    \ op eenzelfde wijze de passage die Grosheide tot zijn opvatting bracht: ‘18 en volgende\
    \ verzen zijn sterk ironisch’.\n \tIk denk echter dat Six in r. 17-20, net als in r. 2-4\
    \ van dit gedicht, de mensen aanhaalt die hem naar de waarom van zijn reis hadden gevraagd\
    \ en hem zijn overtocht kennelijk hadden kwalijk genomen. Uit hun door Six geciteerde woorden\
    \ blijkt dat zij die hadden voorgesteld als een verwerpelijke daad van hoffelijkheid en\
    \ nederigheid jegens Cromwell (vgl. r. 18-20) en dat zij hem, toch de dichter van het felle\
    \ Kontrefeistel van Olivier Kromwel (no. [349]), hadden gevraagd of hij zijn reis, zo bekeken,\
    \ in overeenstemming met zijn geweten achtte. Six antwoordt hen in r. 17-20 dat hij niet\
    \ zou zijn afgereisd, als dat in strijd met zijn geweten was geweest, maar laat de gechargeerde\
    \ voorstelling van zijn reis voor hun rekening. De toon waarop hij hun woorden aanhaalt,\
    \ is inderdaad sterk ironisch.\n \tIn zijn gedicht staat overigens meer kritiek op Cromwell\
    \ dan men na vluchtige lezing zou kunnen denken: de voor het betoog gekozen exempla (bijvoorbeeld\
    \ een al te ambitieuze wereldveroveraar, een tiran en een vorstendoder) zijn niet erg vleiend\
    \ voor Cromwell en ook elders klinken bedenkingen door, al is de toon ontegenzeggelijk milder\
    \ dan in Kontrefeitsel van Olivier Kromwel. Inmiddels is immers ook de vrede van Westminster\
    \ getekend en het directe Geroof en doodslaan is vergeeten, en vergeeven. Het gedicht staat\
    \ op p. 521-523 van Six' bundel van 1657."
  tekst: "Al 't vraagen steekt my eens de walgh,\n \nOf ik niet vreesde Londens galgh,\n \n\
    Toen daar myn handlingh voer uit speulen?\n \nWant quaat doen werd vervolgt van vreese,\
    \ vrees van beulen?\n5\nWat quaadheit heb ik dan gedaan?\n \nOf snoof, en sloegh myn bloote\
    \ swaan\n \nGestoort van aas, in 't nat, te soeken,\n \nStuursch naa een ysren man, met\
    \ schelden, en met vloeken?\n \nHeb ik geterght, van Olivier,\n10\nMet syn geweldigh krygshrapier,\n\
     \nTe waater, op myn goed, aan 't rooven,\n \nDaar voor syn beeltnis, met een swartselschacht,\
    \ bestooven?\n \nWat was 't, och arm! een arm geweer?\n \nHet deede Kromwel niet eens seer.\n\
    15\nGeterghde mierkens hebben gallen.\n \nZou ik dies vreesen, in een schelmschen strop,\
    \ te vallen?\n \nVoer myn geweeten ongerust,\n \nIk had syn handen niet gekust:\n \nNoch\
    \ staarelinghs geooght, op oogen,\n20\nVoor welkers sterke son de mijne eerbiedigh boogen.\n\
     \nEen godheit straalt uit dat gelaat,\n \nDie Kooningen, op 't voorhoofd, slaat:\n \nDie\
    \ schrander, met het vuurigh schittren\n \nDes deegens, Kristenryk doet daavren, en doet\
    \ sittren.\n25\nDie roover eer, met weinigh maats,\n \nOp waater, deede veel meer quaads:\n\
     \nNochtans toen al de werrelddwinger\n \nHem roofde, sach de Vorst dat diefken door den\
    \ vinger.\n \nPisistratus, Atheens tiran,\n30\nGelastert, jaa bespoogen van\n \nThrasip,\
    \ een van syn dischgesinden,\n \nOntstak niet eens, maar hiel den hooner onder vrinden.\n\
     \nToen ik maar wind, en woorden schoot,\n \nSchoot Oorlogh dood, met kruid, en loot.\n\
    35\nNu is het vree, nu laat men leeven,\n \nGeroof en doodslaan is vergeeten, en vergeeven.\t\
    \n[p. 691]\t\n \nMen neem, die ryksbeschermer had\n \nMy, in het kryghssaisoen, gevat,\n\
     \nMeint iemand dat hy my zou hangen,\n40\nOm konterfeitsels, op een blad vertoornde sangen?\n\
     \nO! neen: al min dan een soldaat,\n \nOf busseschuts gevangen maat,\n \nDie, met geschut,\
    \ een schip, en booten,\n \nVol Engelschen, in 't slaan, had in den grond geschooten.\n\
    45\nO! neen: daar toe kent Olivier,\n \nDer opperschoolen Kancelier,\n \nTe kostlik die\
    \ men noemt poeeten,\n \nWier heldenmaat de werld syn daaden toe kan meeten.\n \nSyn hoogheit\
    \ is daar toe te goed,\n50\nSyn bloed grootmoedigh t'eedlen bloed,\n \nDat trots, als Tigris\
    \ stroom, geschooten\n \nIn d'aarde, trotser met syn bruishoorn op komt stooten.\n \nHy\
    \ weederstaat de hoovaardy,\n \nMaar needrigheit vindt meedely.\n55\nHy rukt voorby der\
    \ kleinen wooningh.\n \nHy dryft syn lemmer eer, door 't nekbeen van een kooning.\n \nHy\
    \ slacht den leeuw, die sich niet heft\n \nVan leeger, schoon een hondje keft,\n \nMaar\
    \ die syn seenuwen, en spieren,\n60\nVlughs oeffent met gebrul, op sterk gehoornde stieren.\n\
     \nSyn webbe, dagh aan dagh gesterkt,\n \nVan kaabels wyd te saam gewerkt,\n \nVerstrekt\
    \ om trotsaards in te knoopen,\n \nDe grooten hanght hy op, de kleinen laat hy loopen.\n\
    65\nZoo werd hy Cesar ook gelyk,\n \nDie met Pompejus doodpalm 't ryk,\n \nBeheerschende\
    \ aan den bitsten schryver,\n \nEn aan het steekdicht geern vergaf hun gloenden yver.\n\
     \nDie held nu, onse rechterhand,\n70\nAls wy de syne, door verband,\n \nMoet langh in vreede,\
    \ en voorspoed bloeijen,\n \nGod laate Teems, en Y, ten schrik des werrelds vloeijen."
