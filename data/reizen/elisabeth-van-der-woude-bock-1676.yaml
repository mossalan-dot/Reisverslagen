beschrijving: Verslag van Elizabeth van der Woude (1657-1698) van een reis naar de Oyapockrivier
  in Frans-Guyana in 1676-1677 in het gezelschap van haar vader Herman Hartman (1621-1677),
  broer Johannes (º1658) en zus Margaretha (1661-1677). Haar vader was vicegouverneur van de
  kolonie Orange in Frans Guyana, maar stierf onderweg, evenals zijn dochter Margaretha. Na
  een kort verblijf keerde Van der Woude terug naar de Republiek, maar werd onderweg gevangengenomen
  door kaper Jean Bart. Later werd ze overgedragen aan een Engelse koopvaarder.
