beschrijving: Maakte tussen 1693 en 1695 een educatiereis naar Duitsland, Oostenrijk, Italië
  en Tsjechië onder supervisie van tutor Laurens Gronovius (1648-1724). Hij werd vergezeld door
  baron Jacob Emmery van Wassenaar van Obdam (1672-1724) en Jan Pieter Alderwerelt (1648-1724)
  en Keyser uit Lüneburg.
