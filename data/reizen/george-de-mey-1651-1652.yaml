  tekst: 'Monsieur Mon frère, a Londres.


    Vos lettres de la facon qu''estoit celle que nous leusmes hier peuvent fort contenter mon
    Pere, qui vous exhorte seulement de continuer, en luy faisant avoir de semblables toutes
    les semaines. Il paroit que vous vous evertuez, ut praestes caeteris animalibus, qui se
    sont embarquez avec vous. Mademoiselle Z. dit que nul Prophete est estimé en sa Patrie,
    aussi cela est il tres vray, et c''est une des belles et notables sentences de l''Evangile.
    Quand je parle d''Animalibus, j''entens ceux qui le sont, et je vous prie escrivez moy en
    gros quelle vie ils mesnent la.


    Mon Pere veut que je vous envoye un exemplaire de mon petit livre, peutestre que Monsieur
    Johnson ou quelqu''autre vous scaura dire a quel Mathematicien vous le pourez donner. Pere
    Gregorius m''a a la fin repondu, et je receus hier sa lettre pleine de civilités, mais par
    la quelle il est evident, qu''il n''est pas fort pres a faire replique a mes objections.
    Une autre lettre qui venoit du Pere Sarasa qui est avec luy, estoit de mesme argument et
    plus ample encore. Je commence a estre fort conneu parmi les Reverends Peres, et le seray
    encore d''avantage quand Pere Seghers aura distribué les Exemplaires qu''il a demandé pour
    envoyer en Espagne, et autre part aux hommes Scavans de sa Compagnie et connoissance. La
    Harangue de Monsieur Cats a esté imprimée icy et depuis encore en Flamend. Les Estats l''ont
    voulu supprimer en faisant defense de la vendre. On la trouve bien froide icy partout et
    qui sent son bon homme.


    Le 19e Janvier 1652.'
