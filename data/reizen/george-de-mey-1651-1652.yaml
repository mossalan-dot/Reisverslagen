  tekst: 'Mon frere,


    Les particularitez du voijage de Frise qu''il semble que vous desirez de sçavoir, sont de
    si petite importance qu''a peine elles meritent d''estre racontées de bouche. Jamais il
    ne m''a esté permis encore de voyager en des païs qui soyent meilleurs que le nostre, et
    pour la Frise que je viens de voir maintenant, il faut que vous scachez qu''elle tire fort
    sur le Dennemarck sur tout si l''on considere l''esprit et les moeurs des gens qui l''habitent.
    Quand on vient de passer la mer à Staveren, il ij a un village pres de la qui s''appelle
    Molckwern, digne à estre consideré. les maisons y sont bastiés fort pres l''une de l''autre,
    mais tout en confus sans qu''il y ait des ruës aucunes, en sorte qu''on se trouve bien empeschè
    à en sortir quand on ij est entre. le langage qu''on ij parle est beaucoup differant de
    celuij des autres frisons, qui ne l''entendent pas mesmes; les femmes sont belles et blanches,
    au reste fort honestes, et quoyque leurs maris soyent loin de la (car toute l''este ils
    la passent sur mer) on n''y entend jamais parler d''aucun desordre. J''aij passè 8 jours
    à Lewarden, pendant lesquels j''ay encore este voir Franeker et Harlingen, et en revenant
    nous passames à Sneeck et Bolswert Worcum et Hindelopen. Apres j''aij veu la pluspart des
    villes de la Noorthollande excepté Alcmaer. Mais à entendre des abbreges de cette sorte
    vous ne prenez guere de plaisir, nij moij à escrire des histoires de si peu d''importance,
    scaschant que vostre retour n''est pas loin. C''est pourquoy je m''en remets à ce que je
    vous en raconte cij aprez. la belle histoire de vander Vorst, comment il à esté chassé de
    sa propre maison par Monsieur de Privignij, et comme ils se sont reconciliez depuis, je
    pense que mon frere de Zeelhem vous la deduira par le menu. Escrivez moij si vous avez receu
    les livres que Raef à emporte avecq luij et à qui vous les avez donné. Je suis


    Vostre tres affectionné frere et serviteur. Chr. H.

    5 Jul. 1652.'
