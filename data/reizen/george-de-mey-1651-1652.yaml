beschrijving: Kort en incompleet verslag van een diplomatieke reis van George de Mey (1628-1712)
  naar Engeland in 1651-1652, als predikant in het gezelschap van Jacob Cats (1577-1660), Gerard
  Schaap (1599-1655) en Paulus van der Perre (ca. 1598-1653). Lodewijk Huygens (1631-1699) en
  Adriaen Schagen (1633-1699) schreven ook een verslag over de reis (Huygens 1651-1652; Schagen
  1651-1652). Het manuscript is zoek en alleen de negentiende-eeuwse editie is overgebleven.
  De Mey reisde van Hellevoetsluis naar Gravesend. Hij spendeerde meer dan zeven maanden in
  Londen, vanwaar hij een uitstapje naar Cambridge maakte.
