  tekst: 'Mon Frère


    Il faut confesser que vostre voyage à este tresplaisant et je voy que vous faites tout ce
    que vous pouvez pour me faire repentir de ce que n''ay entrepris celuy d''Angleterre au
    lieu de vous. J''espere que Monsieur van Leeuwen bientost nous en contera toutes les particularitez,
    car pour vous, je ne pense pas que vous serez de retour devant que les Ambassadeurs le soyent.
    Nous sommes revenu de Cleves le 12 de ce mois, apres ij avoir fait un sejour de 8 jours
    seulement, lesquels 8 jours ont pourtant coustè bon a Monsieur l''Electeur, qui à fait toute
    la depense absolument. Il ij avoit si grans concours de monde dans la ville qu''on eust
    grand peine a se mettre la nuit à couvert, et j''ay changè trois fois de logis, pour en
    trouver de moins sales et inquiets. le mariage se fit le 2. en grande magnificence, aveq
    les cerimonies accoustumées d''Allemagne, par quoij il vous faut remettre en memoire seulement
    ce que vous avez vu à Cassel, ou un peu d''avantage. le 6. je vis le carousel qui fut bien
    autre chose pour la magnificence d''habits que celuij qui se fit icij aux nopces de Monsieur
    de Brederode. l''un parti estoyt habille à la Romaijne, d''ont le chef estoit l''Electeur;
    l''autre à la Moresque, celuy du Comte de Waldec. ainsi il firent leur marche en bel ordre,
    et aprez coururent les 3 testes, je pense que vous en scavez la maniere. le jour ensuivant
    il coururent encore la bague sans estre deguisez, mais ce que j''aij oublie de dire, est
    le beau spectacle de feu d''artifice qu''on vit le 4e. ou il y eust fort souvent 3 a 400
    fuzees jetté en l''air en mesme instant. le balet fut dansé le 8e, mais il n''y eust rien
    d''extraordinaire là, pour ceux qui en ont veu de semblables icy à la Haye. Outre tout cecij
    on ij avoit presque toutes les apresdinees le divertissement de voir la Comedie, que representoit
    la mesme bande Francoise que vous avez tant vu jouer icij du vivant de Son Altesse, et le
    soir il ij eust bal d''ordinaire, mais il n''ij dansoit que de des [sic] Princes et Contes
    (tant ij en avoit), si bien que les gentishommes et damoiselles se devoyent contenter d''en
    estre les spectateurs. Je disnaij tantost avecq les Gentilshommes, qui remplissoit 3 ou
    4 tables, tantost avecq le Frauwentzimmer, dont il avoit aussi belle quantitè. souvent aussij
    avecq mon Pere chez le Comte Maurice, qui disnoyt tousjours dans son quartier et à son aise
    avecq peu de personnes seulement. Monsieur de Brederode nous promena une apresdinée en carosse
    jusques à Santen, ou l''on dit que Jules Caesar a dominè en son temps, quand on le nomma
    Castra Vetera. Le mesme Seigneur nous donna à manger tout ce jour la, et en bonne compagnie
    car toute sa famille estoit avecque luij. le jour ensuivant il nous mena encore voir les
    plantage du Comte Maurice ses gardins et grottes qu''il a ajuste d''une belle facon et à
    peu de frais, la situation estant de soymesme tresplaisante. Je n''aij pas le loisir de
    vous conter d''avantage sur ce subject; autrement je prens plaisir à m''en resouvenir, car
    j''ay eu beaucoup de contentement pour le peu de temps que j''aij estè dehors.


    Il y a quelques jours que Raef est partij pour l''Angleterre, à qui j''aij donne 2 exemplaires
    de mon livre, affin qu''il les adresse à vous, et que vous les fassiez tenir à Hobbes et
    Cavendys. J''en eusse donnè encore autant si j''eusse sçeu ce que je viens d''apprendre
    par la vostre, mais maintenant je suis d''avis, si adhuc integrum est, que vous envoyez
    l''une à Oxfort et l''autre à Cavendis. Je voudrois que Brereton fut à Londres pour la luij
    porter, et pour montrer ce que je luij aij envoijè par ma derniere et premiere lettre. Je
    suis

    Vostre tresaffectionné frere et serviteur Chr.


    Hier j''aij dit ce que vous desiriez à ma Cousine Jet, qui se recommande à vous et vous
    baise les mains.


    Monsieur d''Asperen mourut hier à 8 heures apres diner.


    24 May 1652.'
