manuscript: anon-1664-1665-1664-1665-hs
beschrijving: Ongepagineerd verslag van een educatiereis van Leeuwarden via Zeeland en de Zuidelijke
  Nederlanden naar Frankrijk in 1664-1665, met een rondreis door de Loirestreek, een verblijf
  van ca. vier maanden in Blois en een verblijf van ca. vier maanden in Parijs. Na een bezoek
  aan Grenoble keerde de anonymus terug via Genève en Duitsland tot aan Amsterdam. De reiziger
  verbleef langere tijd in Brussel (14-20 juni 1664), Moret-sur-Loing (28 juli-7 augustus),
  Blois (14 augustus-14 december), Parijs (19 december-1 mei 1665), Straatsburg (30 mei-5 juni),
  Mannheim en Mainz (7 juni-4 juli).
