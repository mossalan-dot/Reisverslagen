  tekst: "Hamtoncourt le 27 Sept. 1689.\nJ'ay receu deux de vos lettres dans lesquelles vous\
    \ me parlez de la charge vacquante par la mort de Mr. Petcum, et me priez de la demander\
    \ pour vous au Roy. J'aurois souhaitté de pouvoir parler avec vous sur cette affaire avant\
    \ que d'en parler au maistre ou du moins d'avoir pû vous dire mes considerations par escrit,\
    \ mais voyant que vous me pressiez par une seconde lettre j'ay fait ce que vous avez desiré\
    \ de moy, et ay dit au Roy qu'ayant appris à vostre arrivée en Hollande la mort dudt. Petcum\
    \ vous m'aviez prié de luy dire que vous preniez la hardiesse de luy offrir vostre treshumble\
    \ service pour cette place. Il me repondit, en parlant un peu bas, qu'il ne scavoit pas\
    \ encore s'il la devoit remplir et qu'il n'avoit pas encore resolu sur cette affaire. Ne\
    \ pouvant pas le presser pour le faire haster, je luy dis que je le priois de songer a vous\
    \ quand cela seroit et que je ne doutois point que S.M. ne fust fort bien servie faisant\
    \ choix de vous, que vous aviez le jugement net, et qu'aux choses que vous preniez entre\
    \ les mains vous vous y appliquiez extremement. Il dit la dessus qu'il le croyoit et qu'il\
    \ estoit persuadé que vous aviez des pensees bien plus relevées que celles qu'il faut pour\
    \ examiner des Contes de Receveurs et choses semblables. Je repliquay que vous aviez toujours\
    \ assez bien reussy en toutes les choses que vous aviez entreprises et que je m'asseurois\
    \ que vous employant S.M. seroit satisfaite de vostre service.\nVoyla une conversation qui\
    \ ne conclut rien de positif. Je doubte mesme s'il m'a dit tout ce qu'il auoit dans le coeur\
    \ et s'il ne songe pas a quelqu'autre personne, dequoy pourtant je n'ay appris ny ouy dire\
    \ quoy que ce soit. Je vous conseillerois de parler à Schuylenburg et luy faire ouverture\
    \ de la chose en luy raccontant ce que m'a dit le Roy. Il peut vous servir et aussi vous\
    \ informer de ce qui se fait, ou s'est fait en cette affaire. Cependant il auroit bien mieux\
    \ valu d'avoir embrassé en cecy le party que vous proposa le bon Pere avant sa mort auquel\
    \ malaisement on auroit pû refuser la faveur qu'il auroit demandée pour vous et les 200mes\
    \ deniers estoyent une chose dont on voyoit bien que nous ne serions pas tousjours exemts.\
    \ Il faut esperer que les choses continuant d'aller comme elles font nous ne serons pas\
    \ longtemps soubs cette oppression.\nJe menay ma femme a Gravesend il y eut avant hier huict\
    \ jours au bord du vaisseau de kolckman mais le malheur a voulu que les delays continuels\
    \ et puis les vents contraires ont tant fait qu'elle est encore dans la riviere avec tout\
    \ le reste du convoy. adieu il est plus d'onze heures.\nMijn Heer \nMijn Heer Christiaen\
    \ Huygens Heer van Zeelhem \nten huyse van den Heer van Zuylichem \nin SGravenhaghe."
