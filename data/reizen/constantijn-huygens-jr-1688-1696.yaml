  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Au Camp de Melé ce 30 de Juin 1692.

    J''ay eu vos lettres du 17 et du 25 de ce mois et vous remercie beaucoup de la peine que
    vous avez prise de parler à Mr. Carré. L''homme dont il vous a parlé et qui devoit me venir
    parler icy n''est point venu jusques à present, sans que je scache quelle en est la raison.
    Je l''attends tousjours, et ne m''engageray avec personne que je ne l''aye veû ou que du
    moins j''aye eû de ses nouvelles.

    Le Gouverneur du parent de Mr. Ireton me parle d''un autre nommé Guiran et croid qu''il
    seroit mon fait, mais cependant il ne le connoist que par des rapports qu''on luy en a faits.
    Comme il doibt partir d''icy dans peu de jours avec son jeune homme pour la Haye il m''a
    prié de ne me point haster, et de luy donner le temps de s''informer plus particulierement.

    Il dit de plus que lon pourroit le faire aussi par le moyen d''un nommé Mr. Teron Gouverneur
    de deux jeunes hommes nommés du Bosc avec lesquels ce Teron demeure à la Haye. Asseurement
    Carré le connoist bien, ces du Bosc estant parents du ministre connu de ce nom.

    D''oster mon fils de ses estudes en un temps ou il luy reste tant de choses à apprendre
    pour luy faire suivre la Cour et les armées, c''est de quoy je ne suis point d''avis. Car
    outre qu''il doit encor estudier pour se rendre capable de devenir quelque chose, il seroit
    a craindre, qu''estant icy parmy des jeunes gens dont il y en a grand nombre qui ayment
    le vin, le jeu et les femmes, il ne fust dans une escole plus mauvaise de beaucoup que celle,
    ou il est à present. Dans la Gazette Flamande j''ay trouvé ce que je vous envoye touchant
    l''homme qui fait des telescopes aupres de Leide et qu''on trouve a vendre chez le Libraire
    van Velsen a la grand sâle. Je vous prie de me dire quelle sorte de marchandise c''est.

    Ne poussez vous plus vostre invention ou celle de Newton des Lunettes a miroirs concaves?

    Pour l''affaire d''un ministre de Zuylichem je croy qu''il faut faire une fin, mais qu''il
    importe pourtant de scavoir au vray si cet homme de Mr. Verbolt depend en aucune façon de
    ce cocquin de Schoock. Vous pourrez vous en informer, et tout ce que vous trouverez a propos
    de faire en suitte entre vous trois vous pouvez estre seurs que je l''approuveray comme
    je fais des a cette heure. L''affaire de la digue et de voir comment on pourroit sauver
    le chasteau et les terres que nous avons encore est de plus d''importance, et il ne seroit
    pas bien que nous y songerions quand il sera trop tard. Je m''estonne comme le frere de
    Rotterdam assez attentus ad rem ne s''en inquiete pas d''avantage.

    Le Chasteau de Namur tient encore mais on craint que ce ne sera pas pour long temps, la
    contrescarpe ayant à ce que lon dit este emportée hier.

    Je vous prie de me dire comment on a fait de cette affaire du jeune Breackelerweert.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 08-08-1692
