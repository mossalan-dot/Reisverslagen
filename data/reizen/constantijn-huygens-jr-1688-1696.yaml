  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Londres, ce 1r Janv. 1691.

    Suivant ce que vous aviez souhaité, j''ay remis a Mr. Fatio vostre Traitté de la Lumiere,
    pour le donner a Mr. Bernard. Il me fut voir il y a 4 ou 5 jours. Nostre discours fut interrompu,
    sans cela je luy aurois demandé quelque chose de l''estat de ses affaires, et ce qu''il
    avoit dessein de faire de sa personne. Il me dit qu''il estoit d''intention de publier une
    seconde edition du livre de Mr. Newton, et d''y adjoûter l''eclaircissement des passages
    obscurs et difficiles desquels vous scavez qu''il y a bon nombre.

    Je tascheray de deterrer le petit livre de Mr. Craigue et vous l''envoyeray a la premiere
    occasion. Fatio en parle comme contenant de bonnes choses, mais rangées en mauvois ordre.

    Il me tarde de scavoir ce que vous avez appris de vos Pendules par les derniers vaisseaux
    venus des Indes. Quelques curieux icy m''en ont demandé des nouvelles.

    Je n''ay pas encor donné mon verre de 120 a la Societé icy. D.r Stanley devoit le leur mettre
    entre les mains, mais depuis nostre retour de Hollande je ne l''ay veu qu''une fois icy
    comme il est tousjours plein d''affaires ou voudroit bien qu''on le crust qu''il l''est.
    Il m''a propose une fois ou deux d''aller a un repas Philosophique ou 8 à 9 membres de lad.te
    Societé vont une fois ou deux chasque mois, et ou Sr. Robert Southwell presentement President
    devoit se trouver aussi. Mais n''ayant pas bien eu le temps pour aller chercher mon disner
    si loing, je n''y ay pas esté. Mais nous sommes convenus que demain au matin Stanley viendra
    me trouver chez moy avec m.r Hoock, et alors je verray si je leur remettray le verre, en
    apprenant comment ils pretendent s''en servir, et ou ils pretendent de planter le mast.
    Je ne voy pas qu''ils ayent un autre endroit pour cela que la place carrée qui est dans
    Gresham College. Demain j''en scauray d''avantage.

    Par l''ordinaire arrivé ce soir, j''ay appris que nous avons gaigné nostre proces contre
    Schoock et que ceux de la Cour ont trouvé que le quart des Ecritures qu''on a faites de
    nostre part auroit pû suffire.

    Tien a escrit a ma femme touchant la permission que vous luy aviez demandee de pouvoir vous
    servir quelque fois de ses chevaux durant son absence. Elle est encore contente que cela
    se fasse ainsi; mais comme ce sont des chevaux de prix et dont on luy a offert 850 livres
    elle sera bien aise que cela se fasse avec de la precaution et que lon ne les laisse point
    devant les maisons dans la neige et dans la pluye. Pour ce qui est de la calesche qui est
    a la Haye, et qui a cousté au de la de 400 francs à la raccommoder elle souhaitte de la
    garder pour son retour, l''ayant toujours menagée elle mesme quand il ne faisoit pas beau
    et se servant de son carosse à deux fonds, comme vous pourrez faire aussi, ou bien faire
    mettre les chevaux devant quelque calesche de louage qui se trouvent tousjours à la Haye
    et de toute sorte.

    Le Roy parle tousjours d''estre en Hollande a la fin du mois prochain pour aller de bonne
    heure en campagne cette année, que je vous souhaitte tres heureuse.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 16-07-1691
  plaats_verzender: Voorburg
