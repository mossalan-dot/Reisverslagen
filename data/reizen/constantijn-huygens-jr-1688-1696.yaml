  tekst: 'A la Haye ce 7 Jan. 1695.

    Madame de Zuylichem me dit il y a quelques jours que dans vostre derniere lettre vous vous
    estiez enquis où j''en estois avec mon Traitè des Planetes, que l''on souhaitoit de voir
    en Angleterre. J''ay donc a vous dire qu''aujourdhuy j''ay parlè a Moetjes le libraire touchant
    l''impression, et que nous sommes demeurez d''accord. C''est d''icy en 15 jours qu''on commencera
    d''y travailler, et il pourra estre achevè d''icy en 2 mois, dans quel temps vous serez
    peut estre icy de retour.

    Williet me dit souvent qu''on demande les ouvrages postumes de mon Pere. Si vous le trouvez
    a propos, nous pourrions les revoir le frere de S.t Annelandt et moy, et les commettre aux
    soins du ministre et Poete Vollenhove, qu est des plus assidus sollicitants, et s''offre
    de corriger les epreuves. N''avez vous point eu occasion de voir le Dr. Burnet autheur de
    l''Archaeologia? Il semble par la preface de ce livre, qu''il avoit dessein de faire quelque
    Traitè du mesme sujet que le mien, mais qu''a cause de son age avancè il en avoit desistè.
    Je voudrois bien scavoir s''il n''a pas veu les ouvrages du Cardinal de Cuse, dont il ne
    parle point, et qui pourtant a avancè des premiers, des sentiments comme luy touchant la
    Genese. Il doit estre bien scavant, et escrit mieux en Latin que ne font les Anglois d''ordinaire.

    Souvenez vous je vous prie du livre des voiages que vous avez marquè dans vos tablettes.
    Toutefois voiez s''il vaut la peine d''estre lu, car si c''est le mesme dont Mr. de Berkestein
    m''a parlé, ce n''est qu''une rapsodie, et des traductions pour la plus part, de quelques
    voiages de nos Hollandois. Il me semble que l''auteur ou le compilateur de ce livre s''appelle
    Narborrough. Berckestein m''a aussi sçu dire, que vous aviez achetè de nouveau quelques
    desseins a la derniere vente des choses de Lely, lesquels je verray avec plaisir. Le vent
    aiant changè, on espere d''avoir des lettres d''Angleterre demain ou le jour d''apres. On
    est curienx de scavoir a quoy aboutira l''affaire du Parlement Triennal. Vous aurez estè
    sans doute surpris et bien fachè de la perte qu''a fait Mad. de Zevenaar de sa fille unique.
    Je vous souhaite de la santè et une heureuse année.'
