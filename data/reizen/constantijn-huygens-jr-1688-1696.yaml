  tekst: 'Whitehall ce 18 de Janv. 1692.

    J''ay receu la vostre de l'' 11me. A la recommandation de Fatio, j''ay esté chercher et
    ay trouvé le petit Traitté de Craige dont j''ay pris un exemplaire pour vous et un autre
    pour moy. Ils seront relies aujourdhuy et je les mettray entre les mains dudit Fatio pour
    la sin que scavez. Il demeure tousjours avec le jeune Hamdon, qui est un grand Republicain,
    et connu pour tel, ce qui ne nous importe pas.

    J''ay remis a Stanley et Hooke me venant voir ensemble le verre de 122 pieds avec les dependences.
    La raison pourquoy je l''ay plustost mis entre les mains du dernier que celles d''un autre,
    est que je le crois le plus propre pour le mettre en usage, comme il m''a promis d''avoir
    soin de faire et au plustost. Il s''imagine de pouvoir le faire par le moyen de trois poultres
    longues jointes en hault et soustenant un mast qu''il ne seroit pas necessaire de faire
    si long a beaucoup près que le nostre. Je luy ay recommandé d''en prendre soin temoignant
    que nous serions bien aise de voir qu''on rendist la chose plus aisée qu''elle n''a esté
    jusques icy.

    Cependant on ne s''en fie pas a luy seul. Stanley me mena avanthier a un disner, ou il y
    avoit 10 ou onze de la Societé R. entr''autres Sr. Robert Southwell le President, Mr. Henshaw,
    Dr. Sloane personnes de fort bons sens, Sir Patience Ward et autres membres tres dignes.
    Mr. Southwell m''asseura qu''ils avoyent donné ordre pour faire dresser un Pole et qu''il
    seroit fait au premier jour. Pour Hooke luy mesme, ce n''est pas l''homme, a qui je me fierois
    le plus; Stanley luy mesme m''asseurant qu''il n''a pas les qualités qu''il faut pour cela,
    que c''est un homme a faire quelque meschant trait, comme vous pourriez dire, de vendre
    nostre verre, et en supposer un autre ou chose semblable mais mon nom y estant et la longueur
    marquée de ma main je n''apprehende point qu''il entreprenne cette sorte de choses.

    Les Transactions de la Societé pour les mois d''Octob. Nov. et Decembre ne font que 9 a
    10 feuilles imprimees, et quand j''ay demandé a Sr. Robert la raison, il ne m''a dit autre
    chose si non qu''il croyoit qu''apres la Paix faite il croyoit que la chose iroit mieux.

    Ils venoyent de recevoir un nouveau Traité de Leeuwenhoeck fort estimé de la Societé a ce
    qu''ils disent. Son portrait estoit (ce disent ils aussi) tousjours dans la ruelle du lict
    de feu Mons.r Boyle, decedé depuis quelques jours et mort de Phtisie.

    Vers la fin du mois prochain le Roy a ce que l''on croid passera encore la mer pour aller
    en Hollande, s''il n''arrive quelque chose qui luy fasse haster son voyage, ce qui n''est
    pas impossible.

    La semaine passée un medecin d''icy nommé Quinch que deux hommes venoient querir en grande
    haste, s''estant mis avec eux dans un carosse de louage y fust estranglé avec un mouchoir
    de toile d''Indes, sans qu''on ait attrappé les criminels.

    Et une femme, a ce que l''on dit, mariée il n''y avoit gueres, ayant esté trouvée dans les
    rues a heure indue et mesnee en quelque lieu pour y estre gardée jusques au jour suivant,
    s''y pendit elle mesme avec la petite centure que les femmes portent.

    Pour cette affaire du ministre a Zuylichem, il faut se donner de garde de rien faire contre
    nos prérogatives. Pour une seule fois nous pourrions bien deferer à la recommandation de
    l''Amptman, mais il faudroit que cela allast toujours par les voyes ordinaires et que ce
    ministre fust presenté par nous sans que Mr. van Elst fust nommé la dedans ny eust aucune
    part à l''affaire. Vous ferez bien d''en parler au Frere.

    L''histoire de Hesterke est rare. Sequitur leviter filia matris iter.

    J''escris par cet ord.re des compliments de remerciement à monsieur de Ripperda president
    a la Cour de Gueldre et à mons.r de Roosendael. Je n''ay pas pû procurer au premier les
    Recommandations qu''il auroit voulu avoir du Roy au Hofgericht d''Ostfrise, le Roy ayant
    crû que c''auroit este au dessous de luy demander quelque chose a un si petit Tribunal subalterne.'
- verzender: Constantijn Huygens jr.
