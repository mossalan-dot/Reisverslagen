  tekst: 'Au Camp de Grammon ce 8 de Septembre 1692.

    J''ay receu la vostre du 6e de ce mois. Pour ce qui est de l''affaire du ministre a Zuylichem
    je croy que nous ne ferons pas mal de suivre ce que vous proposez et de complaire a Mr.
    Verbolt quoyqu''en effet il en ait usé un peu estrangement en faisant faire cette nomination.
    Vous ne me dites pas de quel sentiment sont le Frere de Rotterdam et celuy de Ste Annelt.
    Il y a quelque temps que n''ay pas appris l''estat de la santé du premier, ce qui me fait
    croire qu''il n''y aura pas grand changement.

    Il ne me souvient pas que vous m''ayez rendu conte de ces trois objectifs de Hartsoeker.
    Mais il me semble qu''une fois nous en avons essayé un, qui n''estoit pas trop bon. Comment
    est ce que vous n''avez pas eu la curiosité de faire l''essay de ces derniers, cela estant
    une chose si aisee comme elle est, de la maniere comme nous fismes au mail avec nos grands
    verres. Si je m''en souviens bien sa maniere de polis estoit fort longue et ennuyeuse suivant
    ce que vous m''en avez racconté. Vous m''avez dit aussi que Hartsoeker vouloit publier sa
    methode et en faire un livre, dites moy un peu s''il persiste dans cette resolution, pour
    la quelle je vous ay escrit, que je ne sais pas.

    Je n''auray pas a faire de ce Toussain de Mr. Carré, Guiran m''ayant mandé avec bien de
    l''honnesteté qu''il vouloit bien me servir, laissant le salaire a ma discretion. J''ay
    dessein de luy [donner] la mesme chose qu''il a eue chez le neveu de Mijlord Portland dont
    il a esté Gouverneur il y a peu et qui luy a donné cent escus. On me loue cet homme la beaucoup
    et je croy qu''il sera nostre fait. Entre autres choses il y a cela de bon que Tien pourra
    apprendre de luy la Langue Francoise qu''il importe de se rendre familiere à teneris.

    Nous sommes depuis 8 ou 9 jours en ce camp icy, et y pourrions bien encore rester quelques
    jours si le manque de fourage ne nous en fait deloger. Il faut esperer que pendant que nous
    y sommes nos detaschements pourront faire quelque chose ailleurs avant la fin de cette campagne
    ce qui se scaura dans peu. Adieu je vous prie de me faire scavoir comment vous aurez trouvé
    les verres de Hartsoeker.

    Il faut songer tout de bon comment nous ferons pour dresser un autre mast au jardin.'
- verzender: Constantijn Huygens jr.
