  tekst: 'Au Camp de St. Quintyns Linnike le 3.e de Sept. 1693.

    J''ay receu vos deux lettres du 16. juillet et 1. de Sept.

    Pour l''article à mettre dans le Dictionnaire j''approuve assez vostre projet.

    Pour ce qui est de donner le mesme memoire aux deux autheurs des Dictionnaires, pour le
    faire inserer dans leurs dictionnaires il me semble qu''il ne seroit pas bien de la mettre
    dans l''un et l''autre de mesme, mot a mot, par ce que cela feroit connoitre clairement
    que cela seroit de nostre saçon.

    Si Cools me vient trouver, comme vous luy avez escrit de faire je luy diray ce que vous
    me mandez, quand je luy ay parlé aux environs de Diest, je ne scavois pas bien ou vous en
    estiez avec luy autrement je luy aurois un peu lavé la teste. S''il ne vient pas je ne laisseray
    pas de faire agir Feron.

    Je me suis tiré assez heureusement du malheur de la Bataille de Needer hespen ou de Landen
    comme l''appellent les Francois, par ce que je trouvay moyen d''entrer a fort Leeuwen avant
    que la nouvelle y arrivast à travers d''une surieuse quantité de monde et de bagage qui
    bouchoit le chemin. Un peu de temps apres le commandant de ce lieu ayant sceu la perte de
    la bataille et craignant d''estre pris ou du moins investy fit fermer les escluses, et inonda
    les marais autour de la ville, et comme par la il resta peu de chemin, pour en pouvoir faire
    le tour, chacun voulant passer le premier quantité de chariots tomberent dans les dits marais
    et grand'' quantité fut pillée entr''autres un des mulets du Roy ou estoit le meilleur de
    sa garderobbe le fut aussi, et on n''a recouvré que bien peu de ce dont il estoit chargé.
    Cependant comme j''ay dit j''estois passé avant ce desordre, avec mon bagage que j''avois
    tout entier avec moy et le fis passer le mesme soir de Leeuwen a Diest et encor plus avant
    a un petit village ou je passay la nuit dans ma calesche. Deux jours apres nous trouvâmes
    le Roy, qui avoit passé Malines, et se trouva a Eppighem. J''en fus quitte a bon marché,
    car si j''avois esté pillé aussi, la perte auroit esté considerable. On commence a dire
    icy qu''au bout de quinze jours nous pourrions bien quitter l''armée mais cela depend des
    evenements.

    Il me tarde de voir vostre nouveau tuyau de Lunette, mais comme vous en parlez comme s''il
    estoit tout fait je m''estonne que vous ne me marquez pas l''effet qu''il fait ny ce que
    vous voyez des 5 satellites.

    Ma femme ne m''a point escrit par le courrier arrivé ce matin, et par ce que vous ne me
    mandez rien de la maladie du Cousin de St. Annelandt je croy qu''il n''est pas plus mal.

    Mr. l''Electeur a une lunette a deux tuyaux, Telescopium binoculum mais les tuyaux ne sont
    longs que de deux pieds environ. Cependant ou la prone beaucoup et le Roy m''a dit qu''a
    la distance de quatre lieues il avoit distingué l''heure a Brusselles.

    Je n''ay pas encore eu occasion de la voir. L''Electeur en a payé 40 pistoles a ce qu''on
    m''a dit. Elle est faite a Paris, mais on ne dit pas par qui.

    Mylord Lexington m''a conté l''autre jour, qu''il connoit une femme en Angleterre, qui a
    mis au monde 36 enfants masles tout d''une suitte et d''un seul pere et puis une fille.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 05-03-1694
