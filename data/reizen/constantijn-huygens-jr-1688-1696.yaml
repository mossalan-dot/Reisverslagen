  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijck le 16 Jul. [16]93.

    Ceux qui ont entrepris une nouvelle Edition du grand Dictionaire de Moreri m''ont fait prier
    de leur faire avoir quelque memoire touchant la vie de mon Pere du quel ils veulent faire
    un Article dans le volume d''Additions dont ils augmentent ce Dictionnaire, parmi d''autres
    personnes Illustres de nostre pays. J''ay cru qu''il faloit les satisfaire, parce que cela
    nous fait honneur, et qu''il vaut mieux que nous reglions cet article, que de permettre
    qu''ils le dressent selon leur fantaisie ou sur des informations peu fidelles. J''ay donc
    conceu la dessus ce que vous verrez dans le papier icy enfermè que j''ay voulu vous communiquer
    parce que la chose vous regarde comme a nous autres. Le frere de S.te Annelant le trouve
    bien ainsi. Vous verrez si vous l''approuvez, ou si quid habes rectius illis. Monsieur Baile
    a Rotterdam travaillant aussi a un grand Dictionaire m''a encore demandé un pareil memoire
    a qui j''ay remontrè qu''il y paroistroit de l''affectation et de la superfluitè de publier
    presque en mesme temps ce qui regarde nostre famille dans deux dictionnaires differents.
    Mais il ne laisse pas d''insister, souhaitant ce memoire pour s''en servir dans l''occasion.

    Je ne scay si vous avez lu le livre de Burnet, qui a le titre de Archaeologia. On me l''a
    fait voir, et j''y ay trouvè, qu''il soutient bien ouvertement que Moïse a donnè l''histoire
    de la creation du monde non pas selon la veritè, mais selon la capacitè des Juifs de son
    temps. Je vois que le Cardinal de Cuse, de qui j''ay les oeuvres et qui vivoit quelque temps
    devant Copernicus, estoit du mesme sentiment (sans s''en expliquer si clairement pourtant)
    et qu''il tenoit que la Terre se mouvoit, et que les planetes avoient des habitans, sans
    que je sasche qu''il en ait estè repris. Cependant je m''estonne de la hardiesse de Burnet,
    qui a dediè son livre au Roy, à qui il se dit estre a sacris.

    Je ne scay pas comment je fairay pour avoir raison de mon receveur de Zeelhem Adr. Cools,
    qui contre ce qu''il m''avoit promis l''annee passée par ses lettres, ne m''envoie point
    d''argent, ni ne vient point pour compter. Mons.r Feron m''avoit promis de me servir en
    cette affaire par le moien de son frere, qui a quelque employ dans ce quartier de Diest;
    c''est pourquoy je vous prie de luy en dire un mot, a fin qu''il ait la bontè de faire parler
    à Cools et luy faire entendre que s''il ne fait ce qu''il doit je l''iray trouver pour y
    mettre ordre. Il n''a pas comptè il y a 6 ans, et le S.r van Asten estant mort, qui faisoit
    mes affaires, il ne se soucie de rien. Il est fascheux de voir qu''un fripon jouisse de
    mon revenu pendant que je suis obligè de vendre mes obligations.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 01-09-1693
  plaats_verzender: Voorburg
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "A Hofwijck ce 1 Sept. 1693.\nIl y a longtemps mon Frere que j'attens vostre responce\
    \ a ma lettre avec laquelle je vous envoiay la minute du memoire touchant la Vie de mon\
    \ Pere, que Messieurs les autheurs du Dictionaire Historique m'ont demandè. Ils me font\
    \ scavoir qu'il est temps qu'ils l'aient. C'est pourquoi je vous prie de m'en mander vostre\
    \ sentiment, et corrections si vous croiez qu'il en faut, autrement tacens pro consentiente\
    \ erit.\nJe vous avois aussi recommandè mes assaires de Zeelhem. Maintenant j'ecris a mon\
    \ impertinent Receveur Cools, qu'il vous aille trouver, pour rendre raison de son procedè,\
    \ et pour vous remettre l'argent qu'il me retient depuis si longtemps, et qu'il m'a mandè\
    \ luy mesme avoir prest. Il n'a point rendu compte depuis l'an 1686. Je le menace dans cette\
    \ lettre, que s'il manque a faire ce que je luy mande, je l'iray trouver moymesme, et que\
    \ ce ne sera pas sans me ressentir comme je dois du tort qu'il me fait. Il s'est fort louè,\
    \ en m'escrivant cy devant de la protection dont jouissoient les habitans de Zeelhem par\
    \ vostre moien. Je ne scay comment cela va a cette heure, mais je luy mande qu'il auroit\
    \ bien du vous aller trouver, soit pour vous remercier, ou pour demander vostre assistence.\
    \ Vous pouvez luy parler fortement, et en cela vous m'obligerez. Noubliez pas aussi de prendre\
    \ l'argent.\nJ'ay estè en peine de vous pendant quelques jours qu'on n'entendoit point de\
    \ vos nouvelles depuis la bataille de Neer Hespen. Il y avoit suject de tout craindre dans\
    \ une deroute comme celle-là. C'est beaucoup de ce qu'on s'est si bien remis, et d'avoir\
    \ fait en sorte que cette affaire n'a pas eu de plus mauvaise suitte. Illo Virgilium me\
    \ tempore dulcis alebat, Parthenope, c'est a dire que pendant vos combats, je passois tranquillement\
    \ le temps à Hofwijck, où depuis peu de jours j'ay fait construire un bon tuyau quarré d'ais\
    \ de sapin pour mon verre de 45 pieds, tant pour la satisfaction des personnes de qualitè\
    \ qui me prient de leur montrer la Lune et les Planetes et qui ont trop de peine a se servir\
    \ du fil sans tuyau que pour moy mesme; parce qu'on observe mieux et plus commodement de\
    \ cette façon. Car puisque Mr. Cassini asseure qu'il voit tous les 5 Satellites de Saturne\
    \ avec des lunettes de moindre longueur, pourquoy ne les uerrois je pas aussi? Je regrette\
    \ de n'avoir pas emploiè de tuyau il y a 6 ans, car asseurement cela vaut mieux, que de\
    \ la maniere que j'avois inventée, laquelle il faut pratiquer dans des longueurs au de la\
    \ de 80 pieds, ou les tuyaux ne peuvent aller. J'ay eu assez de peine de venir a bout de\
    \ celui de 45 pieds, qui pese plus de 200 livres, et en a autant pour contrepoids de l'autre\
    \ costè de la poulie. Vous le verrez avec plaisir, comme aussi le pied pres de l'oeil qui\
    \ est tres commode.\nMijn Heer \nMijn Heer van Zuylichem \nSecretaris van Sijne Koninglijcke\
    \ Maj.t van Groot Brittannien \nIn 't Leger."
