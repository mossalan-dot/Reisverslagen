  tekst: 'A Hofwijck ce 6 Jul. 94.

    Mon Receveur de Zeelhem Cools m''ayant mandè qu''il attendoit mon ordre pour vous remettre
    la somme de 200 ℔ pour mon compte, je luy envoie cet ordre presentement et je n''ay pas
    voulu manquer de vous en avertir, afin que non seulement vous vouliez bien accepter cet
    argent pour moy, mais que mesme vous l''en fassiez souvenir, lors qu''il vous viendra supplier
    et recommander la protection du village, car je scay par experience qu''il est sujet à ne
    se pas souvenir de ce qu''il promet, lors qu''il s''agit de donner de l''argent. Les pauvres
    habitants de Zeelhem au reste souffrent beaucoup cette annee par les troupes qui y logent
    et fouragent, et je n''ose pas me promettre que vous puissiez beaucoup les soulager. Est
    enim vis major.

    Il semble de ce que vous aviez mandè dernierement a Mad.e vostre femme, qu''on parle plus
    de paix dans vostre armée qu''icy, quoy que tout le monde la souhaite pour le moins autant
    icy que là. Je suis bien aise toutes les fois que les nouuelles m''apprennent qu''on demeure
    sans se battre, parce que je crois que nostre Roy ne scauroit mieux faire presentement que
    de suivre l''Exemple du general Romain qui avoit a faire à Hannibal, qui cunctando restituit
    rem. Mon mal ne veut pas encore me quiter et me contraint de m''abstenir du travail, de
    peur de pis.'
- verzender: Christiaan Huygens (1628-1695)
