  tekst: 'Kinsington le 3. de Mars 1690.

    J''ay receu vostre derniere du 24.e passé, et vous diray pour vous mettre l''ame en repos
    que Dr. Stanley m''a dit, qu''il avoit distribué touts les exemplaires de vostre livre,
    apres que je les luy ay mis entre les mains pour la raison que je vous ay marquée dans ma
    precedente; Fatio estant a ce qu''il semble party.

    Pour mylord Pembroke je ne doubte aucunement, qu''il n''entende le Francois, et je croy
    que vous luy feriez du plaisir de luy envoyer un exemplaire.

    J''ay achepté icy un livre in quarto escrit et dessigné de Leonardo da Vinci. Il traitte
    du desseing des figures nues hommes et femmes et enfants, il y a quelque chose aussi des
    chevaux et de la perspective. Les figures pour la plus part ne sont que contournées, et
    les muscles marqués legerement, mais elles sont fort belles, et paroissent estre d''une
    grande main.

    Le dessein de l''autheur est de rendre compte de toutes les proportions des membres et des
    parties du corps. J''en ay payé 3½ Guineas mais je ne le donnerois pas pour quatre fois
    autant. Mais a quoy bonnes toutes ces choses là pour des gens qui vont passer leur temps
    dans le pays barbare d''Irlande.

    Berkestein est toujours icy, mais parle de partir dans quinze jours. Il y a icy quelques
    desseins de la vente de Lely que je n''ay pas encore veus. Il y en a un, qui fust poussé
    par les Virtuosi entestés et opiniâtres jusques a 65 ℔ Sterling, et lors celuy qui acheptoit
    pour Bergesteyn (scavoir Sonnius) cria tout d''un coup j''offre 100 ℔. Le prix que par consequent
    Bergesteyn fust obligé de payer mais n''ayant appris cette histoire que depuis qu''il est
    icy, il enrage de bon coeur et donne Sonnius a touts les diables.

    Le sujet du dessein est un Marc Aurele haranguant son armée. Ayant escrit ce que dessus
    je suis allé a l''Antichambre du Roy, ou par hazard j''ay trouvé un mylord Ecossois homme
    d''aage et de bonne mine, qui m''a accosté d''abord, et m''a dit, qu''il me prioit de luy
    faire scavoir si c''estoit mon Pere ou mon Frere, qui avoit inventé les Pendules, dont il
    extremement loue l''invention, puis estant entré en discours avec luy j''ay trouvé qu''il
    estoit un Virtuoso, comme ils les appellent icy, et mesme a ce qu''il m''a semblé, entendant
    l''Algebre.

    A la fin il m''a parlé le premier de vostre Fatio et m''a dit qu''il estoit encore a Londres,
    et demeuroit non pas chez mylord Paget, mais tout joignant sa maison chez monsieur Hampden.
    Tellement que mon sot de valet aura mal entendu ceux qui au Suffolcke-Street luy dirent
    a ce qu''il croyoit, qu''il logeoit chez ce Lord. Le mylord Ecossois me dit qu''il viendroit
    me voir avec Fatio. Mais quant a vos livres, ce sera trop tard, ils sont desja ou ils doivent
    estre. Pour Sr. Christopher Wren et pour Fatio vous devriez bien encore envoyer des exemplaires.'
