  tekst: 'Whitehall ce 24 Fevr. 90.

    La vostre du 7.e m''a estè rendue a son temps, mais vos livres ensemble avec des couvertures
    pour des chevaux que ma femme m''a envoyé ne m''ont este delivrés que Lundy passé je croy
    que cela est arrivé par l''embarras ou Orange s''est trouvé pour avoir voulu faire passer
    sans le Custome quelque piece de toile de Hollande et des dentelles qu''il avoit toutes
    cachees sur son corps nud, mais ayant esté fouillé on luy a tout osté.

    Ayant receu les livres j''allay chercher dhilliers en Suffolkestreet, mais on me dit, qu''il
    avoit decampé de là, il y avoit desja du temps, et qu''il logeoit chez mylord Paget in Blombury-Square
    qui est fort eloigné de la dite rue. Ayant trouvé a la fin la maison de ce Lord, j''appris
    en mesme temps qu''il n''y avoit personne dedans; un seul valet qui la gardoit estant sorty,
    et le Lord depuis bien du temps estant party pour trouver l''Empereur a Augsbourg. Peut
    estre que Fatio y sera allé avec luy, au moins personne de ceux a qui j''ay parlé de luy
    ne m''a sceu indiquer ce qu''il est devenu.

    J''ay donc donné vos exemplaires au Dr. Stanley qui s''est chargé d''en faire la distribution
    et comme il n''y en avoit point pour luy, et qu''il eust esté peu civil de le charger de
    cette peine, sans aucune douceur pour sa peine, je luy ay donné l''exemplaire de Fatio,
    a qui vous pourrez en procurer un autre quand il apparoistra derechef.

    Le voyage d''Irlande n''est que trop certain, et les preparatifs et les equipages qu''on
    fait en sont des marques assez seures. Ceux que je suis obligé de faire pour mon particulier
    de dix ou douze chevaux etc. ne me permettent pas de songer a l''achapt des estampes de
    Mr. Ockertsen. On se flatte icy de ce que cette expedition ne nous occupera pas longtemps,
    quelques uns voulant mesme aller encore cette année en France, mais a tout cela il y a bien
    de l''incertitude. Le vieux Parlement ne donnera plus des conseils au Roy estant congedié
    et pour le nouveau qui s''assemblera le 20 de Mars vieux stile, on ne croid pas qu''il sera
    contraire a ce voyage, qui pourroit pourtant causer des accidents facheux.

    Wiljet pourroit bien me servir durant ce voyage mais quelle apparence qu''apres tant de
    fraix que je seray obligé de faire je m''aille encore charger d''un homme par dessus 5 autres
    que j''ay desja ou auray au premier jour?'
- verzender: Christiaan Huygens (1628-1695)
