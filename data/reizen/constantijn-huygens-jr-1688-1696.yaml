  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Whitehall ce 5. de mars 1694.

    J''ay voulu vous dire, que ce dont vous m''avez chargé pour Fatio luy a esté delivré apres
    que l''on eust este longtemps a le deterrer dans cette grande ville, ou a la fin selon que
    j''apprens il a esté obligé d''embrasser la condition d''un Tutor ou Pedagogue des enfants
    d''un Lord, j''ay oublié son nom, la Fortune ne rendant pas tousjours justice au merite.

    J''ay achepté il y a deux jours, le 17. volume des Transactions de la Societé R. que depuis
    un an on imprime derecher touts les mois. Waller Secretaire de la Societé a le soin de l''impression
    qui se continue d''ores en avant sans interruption. Vous serez bien aise de voir ce 17.e
    volume ou il y a de jolies choses.

    On m''a asseuré, que la Description de la Tartarie de Mr. Witzen est imprimée il y a desja
    quelque temps et se vend: je vous prie de me mander ce qui en est. J''ay bien de l''impatience
    de la voir, ainsi que tout le monde, dites moy quelle sorte de volume c''est.

    Les gens icy sont dans une pareille impatience de voir iortir en lumiere vostre livre des
    Planetes, de quo salivam illis movi, dites moy aussi ce qu''il en faut attendre et en quel
    temps, a peu près.

    Fatio avoit dit qu''il viendroit me remercier de luy avoir fait tenir vos papiers, mais
    je ne l''ay point veu.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 30-03-1694
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Londen
  land_ontvanger: EN
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Sommaire

    le 19 mars 94. Fatio s''est fait précepteur pour voyager. Horological instructions qu''il
    me le cherche. Slydrecht. Graverol contra Burnet ne paroit point. Horloge nouvelle commence
    a promettre beaucoup. de Planetis moitié francois encore. Je l''adresse à luy. Bien aise
    des Transactions, qu''il apporte ce 17e volume. Witsen Tartarie pas encore. Nous avons la
    satire de Boileau contre les femmes. Item Harlequiniana.

    Je vous remercie d''avoir eu soin des lettres et papiers pour Mr. Fatio. Je m''etonne qu''il
    n''est pas venu de lui mesme les querir, puis qu''il scavoit que vous les deviez apporter.
    La condition de Tutor qu''il a acceptée, a ce qu''on m''a dit icy, n''est que pour avoir
    occasion de voiager avec ce fils de Lord. Quand vous le verrez, demandez lui un peu ou il
    en est avec son invention de vaisseau, qu''il medite depuis longtemps pour aller plus viste
    que les bastiments ordinaires.

    Je suis bien aise qu''on continue les Philosophical Transactions, et je vous prie de n''oublier
    pas d''apporter avec vous, lors que vous passerez la mer ce 17me volume.

    Je me suis informè de Mr. Berckesteyn et de Mr. Beauval, touchant la Tartarie de Mr. Witsen
    qui m''assurent qu''on ne la debite pas encore, quoyque peut estre elle soit achevée d''imprimer.

    Mon Traité des Planetes est achevè, mais il est encore moitiè Latin moitiè Francois, de
    sorte qu''il y reste une grande partie a traduire, et puis des figures a faire, qui pourtant
    sont peu en nombre. Je depescheray le plus que je pourray, et d''autant plus que par la
    nouvelle que vous avez donnée de mon dessein, il se pourroit faire que quelqu''un entreprist
    le mesme sujet, en taschant de me prevenir.

    Je crois que vous aurez maintenant le livre de Burnet Archaeologiae &c., un imprimeur d''Amsterdam
    m''a dit il y a plus de 6 semaines qu''il imprimoit le Moses Vindicatus du Sr. Graverol
    qui devoit estre une refutation de ce livre, mais je n''entens pas qu''il soit encore prest
    de paroitre. Informez vous, je vous prie, s''il n''y a personne que ce Graverol qui ait
    escrit contre.

    L''on m''a dit qu''on a publiè un Traitè a Londres avec le titre de Horological Instructions.
    Il faudra necessairement que je le voie, ou que je scache ce que c''est; c''est pour quoy
    vous me ferez plaisir de le faire chercher. Tempion scaura asseurement ce qu''il contient
    et ou on le trouve. Je suis apres a faire construire ma nouvelle invention d''Horloge de
    Mer, et j''en ay desia vu assez pour en avoir fort bonne opinion. Cela m''occupe un peu
    beaucoup et est cause que mon Traitè des Planetes s''est avancè moins viste. J''ay a vous
    dire encore touchant ce petit ouvrage, que je l''ay escrit comme en m''adressant a vous,
    et je crois que vous voudrez bien que vostre nom y paroisse; autrement je pourray le deguiser
    sous quelqu''autre, et l''on scaura pourtant que je parle a vous, parce que je fais mention
    des observations que nous avons fait ensemble. Mais je ne songe pas que nous aurons assez
    de temps d''en conferer quand vous serez revenu.

    Nous avons icy depuis peu la nouvelle satire de Boileau contre les femmes, qui est bonne,
    mais non pas tout a fait de la force des precedentes a mon avis. On a aussi imprimè les
    Harlequiniana, ou il y a quelques plaisanteries qui rejouissent.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 13-04-1694
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Whitehall ce 13. d''Avril 1694.

    Je viens de recevoir la vostre du 2.e de ce mois, qui a esté bien long temps en chemin.
    J''ay aussi receu celle du 19. mars, qui est venue bien tard aussi. Les vents de West, qui
    continuent depuis si long temps sont cause de tout cela. Je vous ay mandé que j''allois
    vous envoyer les Horological Instructions par Jannetje Jagers, mais cette femme là n''est
    pas encore partie, et voudra apparemment attendre le convoy que l''on croid devoir partir
    d''icy, demain en huict jours. Or je croy que le Roy partira vers le mesme temps et qu''il
    n''y aura point de temps perdu si je les apporte moi mesme. Apres tout je ne croy pas que
    vous y trouviez de fort grandes decouvertes, l''autheur n''estant qu''un Horologier et un
    virtuoso du 3.me rang. Dans son Traité il ne met pas son nom, et dit luy mesme qu''il escrit
    pour instruire les ouvriers.

    Je n''ay pas encore veû Fatio, depuis que je suis icy. Il a dit (je croy que c''est à Wiljet)
    qu''il viendroit me voir mais il n''en a encore rien fait.

    Je chercheray ces oeuvres de Wallis dont vous parlez et ce traité de Harmonia.

    Il y a eu icy ces jours passes une vente d''un grand nombre de desseins et de Tailledouces
    du Lord Yarmouth. Je vous en feray voir quelques uns a mon retout. On avoit fait accroire
    au pauvre Lord, qui vend ses desseins pour avoir de l''argent, qu''il en avoit pour 22000
    livres, et il se trouve qu''ils ont esté vendus pour environ 7000. Encore ont ils esté vendus
    assez bien.

    Ce Pacquetboate qui a esté pris est le mesme avec lequel je suis venu icy. Le Capitaine
    s''appelle Stevens. Le pauvre Marot mandé par la Reine pour venir icy y a esté fait prisonier
    aussi.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 08-07-1694
  plaats_verzender: Roosbeek
  land_verzender: ZN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Au Camp de Roosbeec ce 8de Juillet 1694.

    J''ay receu ce matin la vostre du 6. de ce mois et cy devant une autre du 8. de Juin.

    Pour Zeelhem j''ay une sauve garde preste et j''attends que Cools vienne pour la prendre,
    mais depuis deux trois jours je n''entends plus parler de luy, en mesme temps je prendray
    de luy les 200 ℔ dont vous me parlez. Je suis fort fasché de ce qu''apparemment la Terre
    de Zeelhem aura souffert par ces Cantonnements icy, mais c''est une chose sans remede. J''espere
    que v[ost]re Intermission de poulx ne sera pas de mesme. Mais comment se font ces Cessations
    du mouuement du coeur, sont-elles accompagnees de quelques foiblesses et maux de coeur?
    et durent-elles quelque temps? C''est estrange comme l''estude et l''application les font
    venir. Je suis veritablement bien marry de vous scavoir incommodé de ce mal; je croy que
    le traitte des Planetes en souffrira aussi et ne verra pas le jour si tost, qu''il auroit
    fait autrement qu''est ce que les medecins vous disent? ne vous precrivent ils point d''autres
    remedes que l''abstinence des estudes?

    On ne parle pas encore de decamper d''icy mais le manque de fourage nous y obligera bientost.
    Toute l''herbe est mangée par icy, et depuis hier on a commencé a fourager le seigle qui
    n''est pas en grande quantité et qui estant mangé nous obligera de tourner du costé de la
    Flandre, ou il y a encore du fourage.

    Ma femme me manda l''autre jour qu''on auoit adresse un gros pacquet de Livres qui estoit
    pour vous, s''il y a quelque chose de curieux, je seray bien aise de le scauoir.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 12-07-1694
  plaats_verzender: Roosbeek
  land_verzender: ZN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Au Camp de Roosbeeck le 12. Juill. 1694.

    Vostre Receveur Cools est icy au Camp depuis un jour ou deux, je l''ay assisté en ce que
    j''ay pû et lui ai fait auoir des Sauvegardes, sans qu''il luy en a cousté. Je luy ay parle
    de l''argent qu''il a pour vous et il m''a dit qu''il me le fera auoir dans un jour ou deux,
    adjoutant qu''il y a trois cent francs au lieu des 200 dont vous parlez. Je voudrois ensuitte
    vous le pouvoir faire tenir en Hollande sans l''exposer au danger des larrons des batailles
    etc., mais je n''en scay pas encore le moyen.

    Cependant nous pourrions bien marcher d''icy dans un jour ou deux. Les ennemys ont fait
    une petite marche et sont presentement campés entre Boschloon et Tongres a 3. lieues de
    Mastricht, qu''ils menacent de bombarder, et ainsi il se pourroit qu''on en viendroit aux
    coups, dans peu de temps.

    Adieu il fait icy depuis hier au matin le plus vilain temps du monde.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 23-02-1695
  plaats_verzender: Londen
  land_verzender: EN
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Kensington ce 23 Febr. 1695.

    N''ayant point eu de vos lettres depuis quelques semaines je n''ay aussy rien appris des
    choses, qui font l''objet de nostre curiosité, desquelles je vous prie de me donner quelqu''information.
    Comment va t''il de vostre Planetographie? N''avez vous rien appris du livre que Hartsoeker
    vouloit faire imprimer touchant la Polisseure des verres? Comment en est il du livre de
    Monsieur Witsen de la Tartarie? Si je ne me trompe, vous m''avez dit qu''il estoit sous
    la presse. Ce que je souhaiterois extresmement avec une infinité d''autres personnes.

    Outre les desseins et les estampes que j''ay eu il y a quelque tems de la collection de
    Lilly, j''en ay trouvé quelques cinq ou six fort jolis et que j''ay eu a juste prix par
    l''ignorance du possesseur. Tout cela contribuera a la Phtysie de Monr. de Berkestein.

    Il ne me souvient pas bien, si vous m''avez parlé ou escrit pour vous faire avoir le livre
    qu''un Warren a fait contre l''Archeologia de Burnet que je trouve dans le Catalogue de
    ma Bibliotheque que j''ay icy, et que pour cette raison, je ne scaurois m''imaginer comment
    vous n''auriez pas encore veu. Si vous le desirez, je vous en apporteray un.

    L''enterrement de la Reine n''est pas encore tout a fait reglé, ny le jour fixé.

    Je seray tourmenté par le monde, qui voudra voir passer le convoy devant mes fenestres.
    Tempion l''Horloger me fust voir l''autre jour, et me dit qu''il travailloit a la construction
    d''une machine pour servir sous l''eau a pescher les choses noyées, et elle devoit avoir
    un tuyeau qui sortira de la superficie de l''eau, et fournira de l''air au travailleurs.
    Je luy ay conseillé de se tenir a celuy qu''il peut avoir dans le Fleet-street.

    J''ay eu l''autre jour aussy Quare l''Horloger Quaeker, qui se mest fort sur les rangs,
    et pretend de disputer la superiorité a l''autre. Il fait des Barometres qu''on peut transporter
    de lieu a autre sans peine et sans les gaster ny mettre en desordre. On croyoit icy estre
    quitte de l''hyver, mais aujourdhuy il est encore tombé une aussy grosse neige, qu''il y
    en a encor eu de toute cette année. On achete les perdrix a 5. et 6. sols la piece tant
    qu''on veut, leur pied les trahissant dans la neige. N''y a t''il point eu de rupture des
    digues, par ce dernier degel? Adieu.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 30-10-1688
  plaats_verzender: Voorburg
  land_verzender: NL
  plaats_ontvanger: Apeldoorn
  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijck ce 30 Dec. 1688.

    C''a estè une chose bien facheuse pendant vostre longue absence qu''il n''y a pas eu moyen
    de vous faire tenir des lettres, mais Dieu mercy cela ira mieux dorenavant; du moins les
    chemins en Angleterre ne seront plus obsedez. Vous pouvez bien vous imaginer avec quelle
    joye nous avons appris le grand et heureux succes des affaires par de là apres toutes les
    inquietudes et apprehensions depuis le commencement de cette expedition, soit pour les dangers
    de la mer soit pour l''evenement incertain de la guerre, car quoyque des vostre debarquement
    les nouvelles aient tousjours estè assez bonnes, l''on ne laissoit pas d''apprehender quelque
    combat tant que l''armée du Roy demeuroit sur pied, et l''on ne pouvoit pas s''imaginer
    un renversement si soudain comme celuy qui s''est fait depuis la bien heureuse retraite,
    que vous ne scaviez pas encore en escrivant vostre derniere a Mad. vostre espouse. Maintenant
    on attend avec impatience la nouvelle de vostre arrivée a Londres, et de la reception qu''on
    y aura faite a Mr. le Prince qui sera sans doute une chose admirable a voir. Quelle joye
    pour la nation et quelle gloire pour luy d''estre venu a bout de cette noble et hardie entreprise.
    Nous entendrons apres cela comment toutes choses seront establies et reglées, tant par de
    là qu''icy, qui n''est pas une petite attente. L''on ne scait pas, si vous retournerez ou
    si vous resterez là ou vous estes ce qui entre autres n''embarasse pas peu certaine dame
    que vous connoissez. Il y en a beaucoup qui apprehendent les menaces et grands preparatifs
    de la France, ce qui n''est pas sans raison, et vous deviez bien nous renvoier les troupes,
    a cetheure que vous n''en avez plus besoin, afin que nous ne recevions icy quelque grand
    affront, pendant que nous secourons nos voisins. Je crois pourtant que ces dernieres nouvelles
    d''Angleterre rompront en quelque sorte les mesures de Louis le Grand, et que de vostre
    costè on pourra faire telle diversion qu''il perdra l''envie d''attaquer la Hollande. Si
    vous restez là, vous verrez que vers le printemps il y aura bien des gens qui iront faire
    un tour en Angleterre et peut estre je seray du nombre. Je suis demeurè jusqu''icy à Hofwijc
    et pretens d''y rester pendant tout l''hyver. Il y a quelques soirees facheuses, quand il
    fait mauvais temps, mais je vois qu''on s''accoutume a tout. Je voudrois seulement y pouvoir
    rester en repos sans que Mrs. les Francois par quelque ravage, ou Mrs. les Estats par leurs
    frequents deux centiemes deniers m''en chassassent.

    Quand est ce que nous travaillerons derechef ensemble aux grands verres? J''aurois bien
    envie d''en avoir un de 34 pieds, mais qui fust grand comme ceux que nous avons de 120 pieds,
    afin de luy donner une ouverture de 6 pouces, au lieu de 3, car cela feroit le mesme effet
    pour decouvrir les satellites Saturniens, que fait maintenant un verre de 120 pieds, l''oculaire
    seroit de 6 pouces. J''ay calculè tout cela et je me tiens assurè du succes. Avec le temps
    vous pourrez apprendre a connoitre a Londres les illustres et ceux qui s''entendent a nostre
    grand Art. Il y avoit un Mr. Smetwick qui m''a une fois envoiè des verres de sa façon (ce
    n''estoient pourtant que des oculaires) et pretendoit qu''il en scavoit plus que beaucoup
    d''autres. Je pense que la Soc. Royale fait de grandes vacances presentement. Cependant
    vous pourrez avoir occasion de voir Mr. Boyle et autres des membres. Je voudrois estre a
    Oxford, seulement pour faire connoissance avec Mr. Newton de qui j''admire extremement les
    belles inventions que je trouve dans l''ouvrage qu''il m''a envoyè. Je pourray vous envoier
    une lettre pour luy, que vous trouverez facilement moyen de luy faire tenir. Ma seur vous
    escrira les nouvelles de la Haye. Hier au soir on attendoit Mr. l''Electeur de Brandebourg
    avec Madame.

    Je vous souhaite une heureuse Année.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 05-02-1689
  plaats_verzender: Voorburg
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Hofwijck le 5 fevr. [16]89.

    Je ne doute nullement que ce ne soient vos continuelles occupations qui vous empeschent
    de me faire response et que ce ne soit aussi par la mesme raison que vous n''ayez encore
    vu personne, qui vous pust apprendre ce qui se passe en ce païs la en matiere de sciences
    ni de curiosités. Je vois cependant que le Sr. de Hautefeuille vous a sceu trouver, par
    la lettre qui m''est venue de sa part. Il y a longtemps que je le connois, et pendant ma
    demeure a Paris, il proposoit assez souvent de nouvelles inventions, mais dont je n''en
    ay jamais veu qui reussissent ou qui fussent de quelque importance. Ce que je puis encore
    dire de celle qu''il avance dans cette lettre, qui consiste a faire assembler en un point
    les rayons de plusieurs verres objectifs mis a costè les uns des autres, dont il esperoit
    un mesme effect que d''une ouverture aussi grande, que feroient toutes celles cy ensemble.
    Mais il a bien reconnu par l''experience que la chose ne succede point, dont je luy feray
    voir la raison (que je croy qu''il ne la scait pas) lors que je feray response a sa lettre
    ce que je ne puis pas encore, mais s''il vient vous revoir dites luy je vous prie que ce
    sera au premier jour.

    Il y a 2 jours qu''estant a la Haye aupres de Mad. de Z. elle me fist paroistre quelque
    chose du dessein que vous aviez de vous retirer des affaires et de venir demeurer en ce
    païs, ce que je vois bien qu''elle souhaite beaucoup, et a dire la veritè je le souhaitte
    autant qu''elle. Car je serois fort faschè de vous voir eloignè pour tousjours par l''etablissement
    que vous pourriez avoir en Angleterre, quand mesme il seroit meilleur qu''il n''a estè en
    ce païs icy. Vous attendrez pourtant, comme je croy, à declarer la resolution que vous prendrez
    la dessus jusqu''a ce que vous ayez vu quel train prendront les affaires et de quelle façon
    le tout sera reglè. Il seroit bien a souhaiter que Mr. le Pr[ince] en recompense de vos
    services vous pust procurer icy quelque employ qui vous fist considerer, car je prevois
    que sans cela, et eloignè de la personne de celuy dont on devroit attendre la protection
    il ne sera pas bon de demeurer en ce païs, ou l''on va estre ruinè par les deux centiemes
    deniers, et plus que les autres ceux qui n''ont point de voix au chapitre. C''est pourquoy
    il me semble qu''en toute maniere vous devez tascher de ne point quiter gratis.

    Madame la Princesse va partir dans 2 jours a ce qu''on dit pourveu que le vent serve, et
    l''on voit des a cet heure, combien la Haye sera deserte par la quantitè des meilleures
    maisons qui sont a louer et par le rabais du louage de toutes en general. Il n''y a que
    l''Angleterre enfin qui profitera de cette grande revolution et tout l''avantage que nous
    en tirerons c''est, comme je crois, que sans cela nous serions tombè dans de plus grands
    malheurs. C''est ce dont il faut nous consoler, et du grand bien qui en revient a toute
    la Chrestientè, et a toute l''Europe, qui doit l''emporter sur nos interests particuliers.
    J''aurois grande envie de pouvoir continuer dans cette demeure solitaire ou je suis mais
    avec ces grandes exactions, j''ay peur que je ne pourray pas, mesme en quitant mon equipage
    comme je vais faire bientost. J''ay estè soliciter Mr. de Schuylenburg pour le paiement
    que vous scavez, qui a promis qu''il le procureroit effectivement devant son depart pour
    l''Angleterre, et que sans cela il auroit honte de vous rencontrer. Le Thresorier l''a aussi
    promis pour la semaine prochaine. Il faudra voir ce qui en arrivera.

    Mad.e la comtesse de Stirum quite sa charge aupres de Mad.e et apres l''avoir accompagnee
    en Angleterre s''en vient demeurer avec Mr. son mari.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 22-03-1689
  plaats_verzender: Voorburg
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Hofwijck ce 22 Mars 1689.

    Il y a longtemps que l''on m''a priè de vous envoier la Requeste cy jointe d''un certain
    van Loo, qui demande la charge vacante de Richter van ''t Nieuwe Broeck op Veluwe, ce que
    j''ay negligè de faire, voiant le peu d''apparence qu''il y avoit que Mr. le Prince alors,
    dans le fort des affaires, songeast a celle de ce suppliant. Cependant il ne laisse pas
    de me soliciter, et par luy mesme et par des amis et amies que je veuille vous recommander
    ses pretensions, alleguant qu''il a eu des promesses de Mr. le Prince pour quand il vaqueroit
    quelque place, et que vous luy avez promis aussi, plus d''une fois, de luy estre favorable;
    enfin que vous le connoissez tres bien et les services qu''il a rendus. Peut estre que ses
    esperances son[t] mieux fondees que je ne scay, du moins j''auray de grands remerciments
    si vous pouvez faire quelque chose pour luy.

    Je vous ay mandè par une de mes precedentes que j''avois quelque dessein de vous aller voir,
    et peut estre je l''executeray dans peu; non pas pour estre spectateur du couronnement,
    mais pour voir quelques anciens amis, outre ceux qui sont passez nouvellement, et ce qu''on
    fait en matiere de sciences, tant a Londres qu''a Oxfort et Cambrig ou partout je suis assez
    connu. Icy depuis vostre depart, je n''ay pas un seul homme a qui parler touchant des choses
    de cette nature. Je fus ces jours passez a Leiden pour voir si je trouverois quelque libraire
    qui voulust imprimer certain traitè que j''ai envie de publier, a quoy P. van der A. s''offrit
    avec joye, qui est maintenant un des fameux libraires de la ville.

    Je lui laissay les figures, pour graver lesquelles il devoit chercher quelque ouvrier a
    Amsterdam, mais je n''ay pas eu depuis de ses nouvelles, et peut estre alleguera t il quelque
    excuse pour n''en rien faire comme Leers a la Haye, qui trouva celle de la trop grande chertè
    du papier, a cause de la guerre avec la France. Je vois bien en effect que le temps n''est
    guere propre au debit de livres de science, tout le monde estant uniquement occupè aux nouvelles
    et a raisonner sur ce qui se passe et sur ce qui arrivera. Outre les deux 200me deniers
    de 87 et 88 l''on vient d''en arrester trois autres pour cette annee, ce qui est bien facheux
    mais il faut s''en consoler en se representant combien pis il nous auroit pu arriver sans
    ce grand succes de l''affaire d''Angleterre.

    Je fus voir a Leyden le professeur de Volder qui me montra un verre de 50 pieds que Hartsoecker
    a fait pour l''Academie, selon l''inscription qu''il a mise dessus. Il avoit un bord de
    maroquin rouge, avec quelque dorure de la largeur de 2 doigts. Il est de matiere tres belle
    a ce que j''ay pu voir et bien espaisse, mais quant a la bontè je n''en suis pas bien certain,
    n''y aiant pas de place chez de Volder pour l''essaier si non une allée de sa maison, ou
    je m''en enloignay tant que je vis les pierres des maisons de l''autre costè du canal renversées,
    mais seulement avec les yeux sans oculaire, parce que pour cela il auroit falu de l''obscuritè
    tout au tour. Ce Mr. de Hautefeuille, de qui vous m''avez envoiè une lettre et a qui vous
    pouvez dire, s''il vient vous revoir, que mon dessein est de passer la mer, me fit sçavoir
    que Hartsoecker estoit venu a Londres avec un nommè Mr. Gayot que j''ay veu icy, et qui
    travaille aussi aux verres, et a autres choses, avec beaucoup d''adresse. Peut estre vous
    les aurez vus. Du moins vous n''aurez pas estè là si longtemps sans decouvrir quelques amateurs,
    quoyque vous ne me mandiez rien, apparemment a cause de toutes vos affaires.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 03-09-1689
  plaats_verzender: Voorburg
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijck ce 3 Sept. 1689.

    J''arrivay a la Haye le 30me Aoust, ayant employè 8 jours a faire ce voiage depuis Londres.
    Estant parti comme vous scavez le 22, qui estoit lundij, nous couchames cette nuict et celle
    d''apres a Gravesend en attendant le bon vent. Le 24 au matin nous nous embarquames dans
    le vaisseau la Brielle, et comme le vent estoit a souhait nous aurions pu passer en 24 heures,
    s''il n''eust falu attendre quelques vaisseaux, qui estoient au Duijns, et à qui nous devions
    servir d''escorte. du depuis le vent fut tousjours contraire, de sorte que nous avons passè
    6 nuits dans le vaisseau tres rempli de passagers, hommes et femmes. Trois ou quatre (desquels
    j''estois), nous eusmes de petits lits, le reste estoit couchè sur des matelas et sur les
    planches. les provisions n''auroient servi de rien car le Capitaine van der Kolck nous traita,
    et fort bien, ayant un bon cuisinier. Le 27 Samedy, on vit des le matin venir droit a nous
    3 grands vaisseaux, que l''on crut estre des François, et d''autant plus qu''on avoit estè
    averti a Londres, qu''il en estoit sorti quelques uns de Dunkerke. On prepara donc tout
    pour le combat, les passagers mesme prirent chacun un fusil et une bandouilliere hors mis
    2 ou 3. Il y en eust aussi qui avec les Dames se mirent dans le cabelgat et y furent plus
    de 2 heures. A la fin avec ma lunette je commencay a decouvrir les banderoles d''Orange
    blanc et bleu, et l''on reconnut peu apres que c''estoit des bastimens d''Amsterdam. Ils
    estoient envoiez pour croiser sur nos costes. Ainsi finit cette fausse alarme qui avoit
    durè plus de 6 heures. Le 30 lors que nous arrivames devant la Meuse il fit fort beau, nous
    sortismes du vaisseau dans un lootsboot, qui nous mena a la Briele. A Maeslandssluys nous
    prismes des chariots qui nous menerent le mesme jour a la Haye, d''ou le lendemain je suis
    venu icy.

    En arrivant a la Haye j''appris une nouvelle qui me fit regretter de n''estre pas restè
    encore quelque temps en Angleterre. C''estoit la mort de Mr. de Petcum, car estant par la
    venu a vaquer une place dans le Conseil j''aurois offert mon service a sa Majestè et je
    crois que vous auriez bien voulu m''aider dans cette solicitation. La nouvelle de cette
    mort sera arrivée a Londres peu apres mon depart, et je ne doute pas qu''il n''y ait desia
    plusieurs pretendants en campagne. mais le Prince n''a pas accoustumè de se haster à disposer
    des choses de cette sorte, tellement qu''il sera peut estre encore temps de faire la demande.
    Je scay que vous ne vous chargez pas volontiers de solicitations aupres du Maitre, et que
    vous en pourrez faire plus de scrupule dans la presente conjoncture, que vous attendez l''occasion
    de soliciter pour vous mesme. Toutefois j''espere que vous voudrez bien me rendre service
    en cette affaire qui est la premiere dont je vous aye jamais importunè. Je n''ambitionnerois
    point de charge comme celle la, si ce n''estoit que je vois qu''il m''est impossible de
    subsister honnestement avec ce peu de bien que j''ay dans ce temps d''exactions, dont on
    ne voit pas la fin. Au reste cet employ est honorable et assez aisè, qui ne m''obligeroit
    pas de renoncer a mes autres estudes, et je ne crois pas qu''on doutera si je suis capable
    de m''en acquiter. Je vous prie donc de ne pas perdre cette bonne occasion de me mettre
    un peu mieux a mon aisc, car en veritè je ne vois rien en ce pais qui soit propre pour moy
    qu''une des places de ce Conseil, et je regrette de n''avoir pas acceptè l''offre que mon
    Pere me fit peu devant sa mort de me la procurer en cedant la siene. mais je ne sçavois
    pas encore que j''en aurois si bien besoin. Le Roy me parla avec beaucoup de bontè lors
    que j''eus l''honneur de le saluer. Mr. le Comte de Portland me recut aussi fort bien lors
    que je dinay chez luy avec Monsr. Hambden. Peut estre si vous luy parliez de cette affaire,
    qu''il ne refuseroit pas de me rendre service. Il y en a qui disent que vous pourriez avoir
    la place de Petcum comme President du Conseil mais je ne pense pas que vous soiez prest
    d''accepter ce change. Hier je trouvay le frere de St. Annelant de retour avec sa famille,
    ils ont estè a Hulst et a Anvers.

    Mr. de Rosemael est mort il y a 3 jours, ce qui fera du changement dans le gouvernement
    de Rotterdam ou il estoit le maitre. le jeune Mr. Cauw le vef fils de T. Schadé espouse
    mad.le de Ginhove. Madame de Buat est partie pour Paris.

    Le Capitaine van der Kolck me dit en le quitant qu''il avoit ordre de croiser entre icy
    et l''Angleterre et qu''il attendroit celuy d''y retourner, de sorte que si Mad.e de Zulichem
    ne veut partir qu''avec luy, elle peut faire estat que ce ne sera pas encore si tost. Je
    luy souhaite un voiage plus heureux que celuy que j''ay fait. Je luy ay temoignè en partant
    combien je luy estois redevable et a vous, de m''avoir nourri pendant pres de 3 mois a vostre
    table. Je n''avois pas cru rester en Angleterre que 6 semaines, mais le temps s''est prolongè
    peu a peu et Dieu mercy je ne m''y suis point ennuiè'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 09-09-1689
  plaats_verzender: Voorburg
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijck ce 9 Sept. 1689.

    Je vous escrivis il y a aujourdhuy 8 jours; mais ayant quelque doute que peutestre ma lettre
    ne vous aura point trouvè parce que je l''ay adressee à Hamtoncour, je vous envoie cette
    seconde pour y repeter le contenu de l''autre en abregè, l''histoire de mon voiage estoit
    que nous fusmes 6 jours et autant de nuicts sur mer, que samedy le 27 Aoust nous eusmes
    une fausse alarme a cause de 3 vaisseaux qu''on crut estre enemis, si bien qu''on prepara
    tout pour le combat, que le 30e nous arrivasmes a la Briele et le mesme jour a la Haye.
    Je vous donnay avis de la mort de Mr. Petcum, et vous proposay de demander au Roy pour moy
    la place qui vaque au Conseil par cette mort. Je vous dis le besoin que j''en aij pour pouvoir
    subsister honnestement dans ces temps facheux, ou l''on me fait contribuer presque tout
    mon revenu, et que je ne voiois rien ou je pusse aspirer icy qu''a une charge comme celle
    la, qu''il y en a qui croient que vous pourriez soliciter pour vous de remplir cette place,
    mais dans la mesme qualité qu''avoit Mr. Petcum; de quoy je doute, quoy que cela vaille
    la peine d''y penser. Si vous ne jugez pas que ce soit vostre fait, je vous prie de voir
    s''il y a apparence de faire quelque chose pour moy. Je suis bien fachè de n''estre pas
    restè un peu plus longtemps a Londres, jusques a ce que cette nouvelle de Petcum fust venüe.

    Je vous manday dans ma susdite lettre quelques autres nouvelles d''icy, qu''il n''est pas
    necessaire de repeter. Le frere de St. Annelant avec son espouse ont estè toute cette semaine
    a Amsterdam et en reviendront demain, je crois que c''est pour des emplettes pour la Reine.
    J''ay vu M.e de la Fertè, mais non pas encore Mr. le Chevalier qui peut estre m''evite.
    Elle est fort changée er ne se porte pas bien. Avanthier deux des directeurs de la Compagnie
    des Indes me vinrent parler touchant l''affaire des Longitudes, me priant de vouloir preparer
    les horloges pour un second voiage vers le Cap de B. Esperance. Il semble que sur l''avis
    du Professeur de Volder, a qui ils ont donnè a examiner le rapport que je leur avois fait
    du premier essay, ils ont conceu bonne opinion de cette affaire, qui en effect pourra fort
    bien reussir pourveu qu''ils y veuillent tenir la main.

    Je salue tres humblement madame de Zulichem et luy souhaite un heureux voiage, dans vostre
    maison tout va bien et Lena a receu sa lettre.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 04-10-1689
  plaats_verzender: Voorburg
  land_verzender: NL
  plaats_ontvanger: Londen
  land_ontvanger: EN
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijck ce 4 Oct. 89.

    Je reçus vostre lettre du 27 du passè samedy dernier qui estoit le 1 de ce mois et le lendemain
    a minuict arriva Madame vostre femme chez elle, ou je la vis hier avec Tiene en bonne santé
    et, nonobstant la longueur et les incommoditez du voiage, bien resoluë, à ce qu''il semble,
    de vous aller retrouver au prochain printemps. Je vous remercie beaucoup de m''avoir si
    bien recommandè au maitre, dont la response, quoy qu''elle ne determine rien, me laisse
    pourtant quelque esperance de succes. Je fus hier parler, suivant vostre avis, a Mons.r
    Schuijlenburg, qui me dit qu''il avoit eu une lettre de Milord Portland, mais de la part
    du Roy, dans laquelle il luy mandoit que S.M.tè n''avoit pas encore resolu si elle rempliroit
    la place vacante de mesme qu''elle vous avoit respondu. Cette lettre estoit a ce qu''il
    me dit du 23e Sept. d''ou vous pourrez juger si elle a estè escrite depuis vostre recommandation,
    (ce qui ne seroit pas de fort bon augure pour moy) ou si elle a eu en vue quelques autres
    solicitants touchant lesquels Mr. Schuylenburg avoit escrit a S. M.tè desquels il m''a dit
    qu''estoit Mr. Rivet qui demeure a Leyden. Comme cette affaire passe par les mains dudict
    Milord, je croij que vous pourriez sçavoir de luy quelle apparence il y a que cette place
    puisse estre remplie, et luy proposer en mesme temps ma pretention, ou sa faveur pourroit
    grandement me servir. Mons.r Schuylenburg me promit fort obligeamment que quand il apprendroit
    d''avantage touchant la resolution du Roy, il m''en donneroit avis. Lors que vous luy escrivez,
    comme je scay que vous faites quelquefois, je vous prie de luy recommander aussi mon affaire.
    Il me dit quelque chose touchant le rang, comme s''il se doutoit que je pretendisse la place
    de Mr. Petcum, dont je l''assuray du contraire. Il me dit aussi qu''il ne croioit pas que
    personne succederoit a cette place avec la mesme qualitè qu''avoit eu le defunct. Je vous
    supplie de continuer, comme vous avez commencè, a seconder ma poursuite dont je vous auray
    la mesme obligation de quelque costè qu''elle reusisse.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 18-10-1689
  plaats_verzender: Voorburg
  land_verzender: NL
  plaats_ontvanger: Londen
  land_ontvanger: EN
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Hofwijck ce 18 Oct. 1689.

    Par ma derniere, à laquelle je n''ay point encore eu de response, je vous rendis compte
    de ma visite chez Mr. Schuylenburg, et je vous priay de parler touchant mon affaire à Mr.
    Benting. ce que je vous recommande derechef afin que nous scachions, s''il se peut, s''il
    y a quelque chose a esperer, ou si c''est une resolution prise de ne point remplir la place
    vaquante. Je n''ay point appris jusqu''icy qu''il y ait d''autres solicitans, que s''il
    en vient, ce sera une marque que la chose est impetrable, et ce seroit alors le temps d''y
    veiller si vous pouviez en estre informè. Puisque nous avons parlè les premiers, il seroit
    facheux de voir preferer un autre. Songez tousjours je vous prie à ce que je vous ay desia
    fait entendre quod dominus opus habet, sans quoy je n''aurois garde de vous estre importun.
    A la fin de ce mois je vais loger a la Haye, ou j''ay pris des chambres au Nordende, pas
    loin du Hooghstraet, m''estant impossible de passer icy l''hyver dans la solitude, sur tout
    parce que je manque de carosse.

    Je voudrois que vous y fussiez aussy, positis ponendis s''entend. Nous observerions ensemble
    Mars et Jupiter dont le premier est pres de la Terre maintenant et paroit fort grand tous
    les soirs. Estant seul j''ay de la peine a m''y resoudre pour n''avoir personne a qui parler.
    Je suis occupè depuis mon retour a l''édition de mon Traité de la Lumiere dont plus de la
    moitiè est achevè.

    Je viens de recevoir une lettre du Sr. Leeuwenhoeck, qui me mande qu''il vous a adressè
    par le Beurtman de Rotterdam a Londres (Schipper Jeroen Vinck) 4 exemplaires reliez de ses
    dernieres observations, pour la Reine, qui en a eu d''autres cy devant a ce qu''il dit,
    pour vous, pour le Dr. Stanley et pour la Societé R. lequel dernier le dit Docteur pourra
    faire tenir a ces Messieurs, et il pourra en mesme temps leur faire les plaintes de la part
    de l''autheur, qui a sept lettres qu''il leur a escrites, dont j''ay estè porteur de la
    derniere, n''a jamais eu de response, ce qui marque que nihil est quod agatur apud vos.

    Je m''acquite de ce qu''il m''a priè en vous donnant cet avis. Faites moy reponse je vous
    prie quand vous en aurez le loisir.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 23-12-1689
  plaats_verzender: Den Haag
  land_verzender: NL
  plaats_ontvanger: Londen
  land_ontvanger: EN
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A la Haye ce 23 Dec. 1689.

    Il y a bien 2 mois à ce qu''il me semble, que je vous ay mandè que le Sr. Leeuwenhoeck vous
    avoit adressè quelques exemplaires de ses observations microscopiques, parmi lesquels il
    y en avoit un pour la Reine et un pour vous. Cependant il n''est venu aucune nouvelle que
    vous aiez receu ce pacquet, dont ce bon homme est fort mortifiè. Je vous prie donc de me
    faire scavoir ce qui en est quand ce ne seroit que par quelque mot en escrivant a madame
    vostre femme.

    Je ne vous dis plus rien touchant ma sollicitation ne voyant pas qu''il y ait rien a faire
    tant que S. M.è sera d''avis de ne point remplir la place vacante. On me dit pourtant dernierement
    qu''un Mr. Hoeuft, parent de Mr. d''Oyen, la demandoit pour luy, dont peut estre vous aurez
    ouy parler. Mons. d''Ablancourt vient de me dire, que Mr. Justel a estè fait Bibliothequaire
    du Roy, avec d''assez bons appointements. Quelque chose de cette nature seroit bien mon
    fait, et je l''aimerois autant en Angleterre qu''icy, si vous estiez pour y rester, de quoy
    je commence a douter croiant que peut estre vous vous accoutumeriez a cette maniere de vie.
    Je suis logè a la Haye depuis 5 semaines au Noordende, derriere la maison de Mr. van Buttinghe,
    un peu etroitement mais assez bien au reste. J''ay preferè cela a la solitude trop melancholique
    de Hofwijck au milieu de l''hyver. J''ai presque achevè l''edition des Traitez de la Lumière
    et de la Pesanteur dont je vous envoieray des exemplaires. Le Grand dictionnaire de Furetiere
    se vend desia et je l''ay vu chez le frere de St. Annelandt qui en est tres content. S''il
    y a quelque chose de nouveau par de la en ces matieres vous me ferez grand plaisir de m''en
    avertir. J''ay receu les Ephemerides de Mr. Flamsted pour les satellites de Jupiter, que
    je crois qu''il vous aura envoiées pour moy. Elles pourroient servir a des observations
    tres utiles, mais ou sont les gens icy pour les faire? J''en parle assez souvent a nos Professeurs
    de Leiden, mais aussi bien icy que la ou vous estes, il y a grand refroidissement pour toutes
    ces belles choses.

    J''ay tant prechè madame vostre Espouse, qu''a la fin elle a fait attacher le grand mast
    aux arbres du voisinage pour l''assurer contre le vent de Nord West. Cela paroit si peu
    qu''on ne le voit pas qu''en y prenant garde expres.'
- verzender: Christiaan Huygens (1628-1695)
