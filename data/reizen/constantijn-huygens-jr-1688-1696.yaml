  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijc ce 6 juin 1694.

    Je vous ay priè cy devant de vous souvenir du Capitaine van Asten lors que l''occasion s''offriroit
    de le recommander au Roy. Il me mande quil est mort dans son Regiment, scavoir celuy du
    Brigadier l''Ecluse, un Capitaine nommé Fumal, et souhaiteroit bien de pouvoir avoir sa
    compagnie vacante, au lieu de celle qu''il a, qui est chargée d''une pension incommode.
    Je ne puis luy refuser mon intercession aupres de vous, puis que je luy suis obligè de ce
    qu''il a soin de mes affaires de Zeelhem, comme cydevant son frere, et qu''il m''en a fait
    depuis peu toucher de l''argent, et une somme assez considerable, que sans luy je ne sçay
    comment j''aurois pu avoir de mon impertiment receveur. Il ne manquera pas de vous recommander
    sa propre affaire, dans la quelle si vous le pouvez faire reussir vous me ferez un fort
    grand et singulier plaisir.

    J''ay appris ces jours passé une chose que je m''estonne, que vous n''aiez sceue estant
    a Londres, qui est que le celebre Mr. Newton a eu une atteinte de phrenesie, qui luy a duré
    18 mois. Je le tiens d''un Ecossois, venu depuis peu d''Angleterre, qui m''en a mesme raconté
    des circonstances. Il me dit aussi que ses bons amis l''avoient tenu enfermè quelque temps,
    et tant fait a force de remedes, qu''il estoit a la fin gueri de ce mal, et qu''il commençoit
    a entendre derechef son livre Principia Philosophiae Mathematica. Voila pourtant un homme
    confisquè et comme mort pour les Estudes, comme je crois, ce qui est grand dommage. M.rs
    les Anglois, a ce qu''il semble, avoient taschè de cacher cet accident mais en vain. Outre
    ses estudes trop vehementes, on croit qu''un malheur qu''il a eu d''une incendie, qui a
    emportè son Laboratoire et quelques escrits, aura contribuè a luy troubler ainsi l''esprit,
    qui est bien le pire de tous les maux, qui peuvent arriver a un homme.

    Je ne suis pas encore delivrè de ces interruptions et battemens inordonnez du pouls, mais
    les ressens de temps en temps. Je suis bien faschè de n''y trouver point d''autre remede
    que l''abstinence des estudes, que je compte pour autant de temps perdu. Ma Traduction de
    Verisimilia de Planetis s''avance pourtant.'
