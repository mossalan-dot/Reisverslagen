  tekst: 'Whitehall 2 Dec. 1692.

    J''ay fait voir au Roy les lettres qui vous ont esté addressées par le S.r Prion Secretaire
    de milord Dursley et en mesme temps je luy ay monstré ce que vous me mandez la dessus, mais
    nous n''y avons rien pû connoitre ny l''un ny l''autre. Le Roy me dit de parler au dit milord
    ce que faute de temps je n''ay pas fait encore. Cependant resvant sur cette affaire, et
    cependant voyant clairement que cette bonne dame d''Alençon n''a pas eu dessein d''escrire
    a moy en escrivant cette lettre, car elle parle comme a une personne avec qui elle avoit
    correspondence, il m''est venu dans la pensée, qu''il y a icy, ou du moins y a eu un petit
    Ecossois louche, qui se mesloit d''intrigues et fit il y a environ 18. mois un voyage en
    France soubs pretexte d''y accompagner une dame de ce Pays icy. Il se pourroit bien que
    ce seroit la l''homme dont Prion dit que le nom estoit dans la superscription de la lettre
    qu''il a ouverte par megarde à ce qu''il dit, car s''appellant Higgins il affectoit de se
    faire appeller Huijgens et auroit fort souhaitté que j''eusse voulu le faire passer comme
    ayant nostre nom. Mais je me mocquois toujours de luy. Voyez un peu si vostre Mr. Prion
    ne peut pas vous donner un peu plus d''eclairçissement touchant ce petit homme, et s''il
    ne l''a pas jamais veu, et en cas que non, comment c''est luy qui a soin d''adresser ses
    lettres.

    Je suis bien marry de ce que nous ayons tant de peine a trouver un Precepteur pour Tien
    et je crains qu''estant si long temps sui juris il n''abuse de cette liberté. Je vous prie
    d''assister ma femme pour en deterrer un quelque part. Tout le monde parle de la debauche
    qui regne entre ces escoliers a Leyde.'
- verzender: Constantijn Huygens jr.
