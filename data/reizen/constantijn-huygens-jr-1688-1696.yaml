  tekst: 'Whitehall ce 25 d''Avril 1690.

    Hier Fatio me vint apporter la lettre qui va cy jointe pour vous, dans laquelle il vous
    rend compte de la composition et de la nature des liqueurs, qui s''enflament estant melées,
    et qu''a Monsieur Boyle. Comme je luy dis, que vous aviez dessein de faire un objectif de
    Telescope par le moyen duquel vous croyiez qu''il y auroit moyen de mieux decouvrir les
    petites Planetes et estoiles, il me dit qu''il croyoit de scavoir de quelle maniere vous
    aviez dessein de vous y prendre, et me dit effectivement la maniere telle que vous me l''avez
    proposée, estant icy. Il adjousta que Mr. Halley Secretaire de la Societé Royale icy, lui
    avoit communiqué il y a desja quelque temps qu''il s''estoit servy d''un objectif de six
    pieds, ayant une ouverture fort grande, et que regardant le ciel avec ce verre il avoit
    decouvert partout autant d''estoiles a proportion, que l''on en voit dans l''Estoile qu''on
    appelle Poussinierè. Si cela est vous en verrez un furieux nombre par celuy que vous avez
    dessein de faire, et dont il me tarde d''entendre le succes, mais je crains fort, que vous
    trouvant seul dans le laboratoire, l''ouvrage n''avancera pas bien viste. J''aimerois bien
    mieux de vous y assister que de traverser le canal de St. George pour aller en [Irlande].
    Le temps de nostre depart n''est pas encore fixé, et le manque des choses necessaires, sur
    tout celuy de l''argent le retarde encore, on espere qu''il y sera mis ordre. Par une lettre
    de Tien j''apprens aujourdhuy que vous estes tourmenté du mal de dents et le frere de St.
    Annelandt de la goutte, l''un et l''autre me fache beaucoup.'
- verzender: Constantijn Huygens jr.
