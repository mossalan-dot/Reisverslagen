  tekst: 'A la Haye ce 16 Maj. 1690.

    Depuis ma derniere, Madame de Zulichem m''a montrè ce que vous luy avez mandè touchant les
    2 Exemplaires dont j''estois en peine, il ne reste maintenant que celuy que j''avois destinè
    pour Mr. Boyle, du quel le Dr. Stanley doit vous rendre compte.

    J''ay promis au Sr. Dan. Libot, cydevant conseiller privè du Comte de Benthem, de vous escrire
    en sa faveur, a fin que si cela se peut il ait apres la mort d''un capitainerefugiè nommé
    Nobilois, la pension que M.rs les Estats luy donnent de 750 ℔. Ce Nobilois s''est fait tailler
    de la pierre et pourra mal aisement echapper. Le Sr. Libot a eu tout son bien aupres de
    l''Isle, confisquè par les François, parce qu''il n''y veut pas aller demeurer en changeant
    de religion. Je l''ay connu a Breda lors que j''y estudiois. Vous pourrez tousjours dire
    que je vous l''ay recommandè si vous en entendez parler a ceux qui auront receu des lettres
    en sa faveur de la part de Mr. Schuylenburg ou des Marets. Mais il y a apparence que ces
    pensions venant à vaquer se donnent à d''autres officiers refugiez.

    Par les dernieres lettres venues de dela nous avons sçeu comment Mil. Shrewsburry a voulu
    desister de sa charge, et l''on attend encore pour sçavoir comment cette affaire se sera
    terminée. Il faut avouer que ces Mess.rs les Anglois sont difficiles a gouverner, car on
    entend parler a chaque fois de pareils mescontentemens et mutineries....Ce qui mesme fait
    croire à bien de gens que le voiage d''Irlande ne se fera point. En ce cas vous estes seur
    d''avoir une visite de Mad.e vostre Espouse. Et le frere de St. Annelandt pourroit bien
    l''accompagner, quoy qu''il semble faire quelque difficultè par la crainte des attaques
    de sa goutte. Il partit hier pour la Nordhollande. Nous fumes ensemble a voir la feste de
    Mil. Dursley à la maison du Bois, le jour de la naissance de la Reine, mais n''y restames
    que jusqu''a 10 heures du soir.

    Souvenez vous je vous prie de Salinas.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 01-11-1690
  plaats_verzender: Voorburg
  land_verzender: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'Hofwijck ce 1 nov. 90.

    Puis qu''on nous assure que devant la fin de ce mois le Roy sera en ce païs, je me serois
    presque passè de vous escrire la presente, toutefois parce que des accidents impourvus font
    quelque fois changer les resolutions les plus sermement prises, a fin de ne rien hasarder
    dans une affaire, dont je suis obligè d''avoir soin pour le bien de la famille, je n''ay
    pas voulu manquer de vous envoier la lettre cy jointe du Sr. van Lith, qui vous fera voir
    ou nous en sommes avec ce vilain proces contre Schoock, que nous avions perdu a la Banque
    de Zuylichem, et dont on a appellè a la Cour de Gueldre, comme je crois que mad.e vostre
    femme vous aura fait sçavoir. Nostre procureur et l''avocat Op ten Oort, comme vous voiez,
    demandent quelques lettres de vous a messieurs nos juges, et je ne doute pas qu''elles ne
    soient tres necessaires, a moins que nous ne veuillons nous laisser condamner. J''escris
    cependant a van Lith qu''il ne pousse point cette affaire, mais qu''il tasche de la faire
    delaier en attendant vostre arrivée en Hollande, et si vous estes fort seur de devoir venir
    bientost, ces lettres de recommandation pourroient estre differees jusques là, mais a moins
    de cela, je vous prie de ne rien negliger. Il semble que ce mr. van Eck nous est bien affectionnè,
    et qu''il a quelque pouvoir. C''est pourquoy il seroit bon de s''adresser a luy pour le
    prier de continuer dans cette bonne volontè. Vous verrez qui sont les autres dont vous puissiez
    requerir la faveur, et leur pourrez mander hardiment que ces beaux juges de Bommel nous
    ont fait la plus haute injustice qu''on puisse s''imaginer, en laissant Schoock dans la
    possession du bien hypothequè, et nous condamnant pourtant de paier tout ce a quoy il pretendoit
    que Mon Pere s''est obligè.

    Il y a fort longtemps que nous n''avons eu de lettres de là par le vent contraire au retour
    des pacquetboot, qu''on dit estre tous du costè de decà. Mais depuis deux jours le vent
    est à l''Est, de sorte qu''ils seront parti sans doute. L''on souhaite sort d''aprendre
    s''il est vray que Mr. d''Oye a quitè le service et quelle en peut estre la cause.

    Vous voiez peut estre quelque fois monsr. Justel, car pendant l''absence du Roy vous aurez
    eu tout loisir de cultiver cette connoissance. Je vous prie, de luy dire qu''une lettre
    par la quelle il me recommandoit un de ses amis m''a estè rendue cet estè passè, mais que
    celuy pour qui il l''avoit escrite n''a point paru. Je quite demain ma demeure de campagne
    pour me retirer a la Haye dans mes chambres garnies comme je fis l''hyver passè. J''auray
    bien de la joye de vous y voir et de plaisir de vous entendre raconter tout ce que vous
    avez vu dans l''Expedition d''Irlande.

    Cette lettre estant demeurée a la Haye jusqu''aujourdhuy 3 Nov. j''y adjoute la nouvelle
    de ce qui vient d''artiver au Voorhout où le Geschuthuys vient d''estre ruinè par quelque
    quantitè de poudre ou le feu s''est mis. On dit que ce n''a estè que deux tonneaux pleins
    de grenades chargees, telles qu''on jette a la main; cependant cela a fait un furieux coup,
    et a enlevè les toits et les vitres de plusieurs maisons voisines, et entre autres chez
    le frere de S. Annelandt, ou l''on n''a pas estè peu alarmé. Plusieurs personnes ont estè
    blessees et plus que les autres un nommè van der Smalen frere de mon Procureur, qui devoit
    oster la poudre de ces grenades, et qui est cause du malheur par son imprudence. J''estois
    icy au Noordende dans ma chambre ou je ne scavois ce que je devois juger lors que le coup
    se fit entendre, car ce fut un bruit qui continua quelque temps, de sorte que je m''imaginay
    que quelque maison tomboit dans le voisinage. Tout le peuple a estè dans la rue et y est
    encore en partie. J''ay estè au cabinet de ma soeur de St. Annelant ou les vitres sont casees,
    mais rien du tout de ses porcelaines. On a fait saigner mad.e d''Oye et sa soeur a qui le
    feu a enfoncè les vitres pendant qu''elle se coiffoit.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 26-07-1691
  plaats_verzender: Londen
