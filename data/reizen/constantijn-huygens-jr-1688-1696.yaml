  tekst: 'A la Haye ce 2 May 1690.

    Je responds a vos deux lettres, l''une du 28 mars, l''autre du 25 Avril. En escrivant la
    premiere vous attendiez encore les 4 exemplaires de mon livre que j''avois recommandè au
    Sr. Meester, lesquels comme j''espere, vous auront estè rendus depuis, ce que je vous prie
    de me mander, et si vous les avez distribuez ou fait distribuer par Mr. Fatio, suivant les
    noms que j''y avois marquez.

    Quoy qu''alors vous n''eussiez point ouy parler de cette affaire de J. Hol, il ne se peut
    que vous n''en ayez estè informè du depuis, et que vous n''ayez vu un imprimè qui a pour
    titre Legende van Amsterdam &c. C''est une etrange affaire, et quoy qu''on dise que ces
    Mess.rs d''Amsterdam font semblant de s''en mocquer, je ne vois pas comment ils s''en excusent,
    et je doute si quelque jour elle ne sera pas relevée d''une autre maniere.

    J''ay estè voir Mr. de Berkesteyn le lendemain de son arrivée, qui entre autres choses m''a
    comptè des raretez, que possede ce Mr. Gaillard, avec qui vous avez fait connoissance. Mais
    que l''urne, dont la figure est au livre de Spon, n''est pas tout a fait si belle que l''estampe
    la represente.

    Dans vostre derniere vous dites qu''une lettre de Fatio y va jointe, et vous avez oubliè
    de l''y enfermer. Si vous ne l''avez envoiéc depuis, je vous prie d''en avoir soin, parce
    que cela m''importe que je fasse remercier Mr. Boyle de sa recepte, et que je voije ce que
    Fatio repond a la lettre que je luy ay escrite. J''avois demandè a Mr. Boyle la maniere
    de faire de la glace, sans se servir de glace ni de neige, c''est pourquoy je suis surpris
    de ce que vous dites avoir appris de Fatio qu''il m''enseigne de faire du feu par le meslange
    de deux liqueurs, qui a la veritè est aussi un joli secret et dont j''ay vu l''experience
    chez Mr. Boyle.

    Fatio pouvoit bien scavoir comment je pretens de decouvrir plus d''étoiles et de satellites
    par le moyen de mon objectif, puis que je luy en ay parlè estant à Londres, si je ne me
    trompe fort. Mais Mr. Haley pourquoi n''a til pas observè ni les 2 ni les 4 satellites de
    Saturne, que Mr. Cassini a decouvert? Car tant s''en faut qu''on les eut vu en Angleterre
    quand j''y estois l''estè dernier, qu''ils osoient dire que ces satellites n''estoient point
    in rerum naturâ.

    Ce sont de pauvres faiseurs de Telescopes, que ces M.rs les Anglois quoy que de longtemps
    ils s''y soient estudiez. De mon travail il en est a peu pres comme vous dites, non pas
    toutefois seulement a cause de la solitude, mais parce que j''ay estè imcommodè tous ces
    jours par des maux de dents et de teste. J''ay pourtant preparè mon verre, et l''ay rendu
    d''egale epaisseur, mais il sera de 30 pieds, parce que je ne trouve pas des pieces bleues
    mises en oeuvre pour corriger la forme de 12 pieds.

    Hier mourut subitement nostre bonne Cousine Egidia de Wilm, s''estant habillée et coiffée,
    et estant descendue pour s''aller mettre a table. Mad.me vostre femme n''aura pas manquè
    de vous le mander, et vous aurez een Rowbrief de la part de la famille. Escrivez moy, je
    vous prie, devant votre depart, car apres le passage en Irlande nous serons peut estre long
    temps sans avoir de vos nouvelles.'
