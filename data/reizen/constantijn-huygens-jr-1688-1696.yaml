  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A la Haie ce 2 avr. 1694.

    Je suis surpris de ce que Mad.e de Zuylichem m''envoie dire que vous me demandez response
    a la lettre que vous m''avez escrite du 5me mars. Car je vous ay fait cette response dès
    le 19 du mesme mois, et il faut que chez Williet on n''ait pas eu soin de ma lettre comme
    il faloit. Le contenu estoit a peu pres, que je vous remerciois d''avoir fait tenir a mr.
    Fatio tout ce que je vous avois donnè pour luy, sur quoy je m''etonne qu''il ne m''ait encore
    rien escrit. qu''on m''avoit dit qu''il s''estoit engagè avec les jeunes milords pour voiager
    avec eux. que j''estois bien aise de ce qu''on continuoit les Philosophical Transactions,
    vous priant de ne pas oublier d''apporter avec vous cette 17e et autres que vous auriez
    pu avoir. Je vous priois aussi de faire chercher pour moy un traitè publiè depuis peu, dont
    le titre est Horological instructions, ce que je vous prie derechef. Je vous mandois que
    le livre de mr. Witsen ne paroissoit pas encore en public, quoyque il y en a qui disent
    qu''il est achevè d''imprimer. Que mon Traitè de Planeticolis estoit achevè, mais comme
    il estoit moitiè en Latin moitiè en Francois, il me restoit a mettre tout en Latin. que
    j''estois occupè a cela, mais que la construction de ma nouvelle Horloge pour les Longitudes
    me causoit beaucoup d''interruption. que nous avions icy la nouvelle satire de Boileau contre
    les femmes, et Harlequiniana où il y a quelques bons mots. que le Moses Vindicatus du Sr.
    Grauerol contre les Archaeologiae de Burnet ne paroissoit pas encore, quoy qu''il y ait
    longtemps qu''on ait commencè a l''imprimer a Amsterdam. Voila tout ce qui estoit dans ma
    lettre, a quoy je n''ay pas beaucoup a adjouter maintenant si ce n''est de vous prier de
    faire chercher un Traitè de Harmonia, je crois qu''il est en Anglois, ecrit depuis peu.
    Les oeuvres de Wallis doivent desia se vendre comme je crois, mais je n''en veux point parce
    qu''elles seront trop cheres, et que j''en ay une grande partie separement. Si vous n''avez
    pas son Traitè d''Algebre en Anglois in fol.o vous feriez bien d''acheter cette nouvelle
    Edition de ses ouvrages, où elle est traduite en Latin, avec quelque chose de Newton qu''on
    estime beaucoup.

    Je scay qu''en partant d''icy je vous ay recommandè la requeste du Sr. van Asten Capitaine
    dans le Regiment du Brigadier l''Ecluse. Je vous recommande derechef sa personne et ses
    interests, parce qu''il me rend de bons services a Bruxelles en ce qui regarde mon cocquin
    de Receveur Cools. Car sans luy je ne scay comment faire pour le mettre a la raison, ou
    pour tirer quelque chose du revenu de Zeelhem dont j''ay si fort besoin. Vous ne scauriez
    me faire plus grand plaisir que de dire ou faire quelque chose en sa faveur quand il y aura
    occasion pour cela. Il paroit fort honnest homme et son frere a estè fidelle serviteur de
    sa Majestè et de ses ancestres. J''espere que nous vous verrons dans peu, et vous souhaite
    un heureux passage.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
