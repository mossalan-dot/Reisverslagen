  tekst: 'A la Hofwyck ce 27 Jul. 1694.

    Jay receu vos lettres du 8e et 12e de ce mois. Je vous rends graces de la Sauvegarde pour
    Zeelhem. Pour ces 300 ℔ que Cools avoit promis de vous apporter, je souhaite qu''il l''aura
    fait, mais j''en doute, par ce que je connois le personnage. En cas qu''il y ait manquè.
    je vous prie de luy tesmoigner que vous en estes mal satisfait lors qu''il s''adressera
    encore à vous. Je viens aussi de luy en escrire.

    Je me trouve mieux depuis quelque temps pour ce qui est de la cessation du pouls, et j''ay
    beaucoup avancè dans 3 ou 4 jours mon Traitè des Planetes. Quand ce mal me venoit je ne
    sentois qu''une petite pression a l''endroit du coeur, et tastant alors le pouls, je trouvais
    qu''il manquoit par fois d''un coup, et puis reprenoit d''un mouvement fort irregulier.
    Il faloit alors me lever et promener et quiter toute meditation. Le medecin Lieberghe me
    dit, que cela venoit de quelque pression vers l''orifice de l''estomac, et en effet je trouvay
    qu''il en montoit des vents, et que cela me soulageoit. Pour remede il me conseilloit d''abstenir
    ab alimentis crudioribus et leguminibus. mais je crois pourtant que le rafraichissement
    du sang qui vient de manger des cerises et des groseilles rouges m''a fait du bien.

    Depuis que vous estes decampè avec l''armée, on est icy dans une grande attente d''une bataille.
    Pour moy je souhaite qu''il n''en arrive rien, et je suis bien aise que les Enemis, a ce
    qu''il semble, ont assez grande opinion des nos forces pour ne point chercher le combat.
    On parle aussi de paix, et on veut que le voiage que Mr. de Dyckvelt est venu faire signifie
    quelque chose a cet esgard.

    La perte qu''a fait Mr. Citters est terrible, et ce n''est pas sans fraieur que je pense
    que deux fois l''an vous estes obligé de passer cette mesme mer et le Roy aussi.

    Le pacquet de livres dont Mad.e vostre femme vous a escrit estoient ceux que j''attendois
    il y a longtemps de Paris, et dont on m''a bien voulu faire present comme aiant estè de
    l''Academie des Sciences, et ayant contribuè quelques traitez que ces livres comprennent.

    Vous en achetastes 2 Volumes de Van Bulderen peu devant nostre depart pour Angleterre, et
    le 3me qui vous manque, si je ne me trompe, est celuy, qui contient quelques Autheurs grecs
    des Tactiques et Hydrauliques, que l''on m''a envoié avec les 2 autres.

    En recompence je desabuse M.rs les Francois pour la seconde fois de leur fausse Theorie
    de la manoeuvre des vaisseaux, par une Replique que j''ay inserée dans l''Histoire des Ouvrages
    des Scavans pour confirmer la Remarque que j''avois publiée auparavant sur le livre du Sr.
    Renau, Ingenieur General de la Marine, qui m''avoit envoiè une Réponse imprimée.'
