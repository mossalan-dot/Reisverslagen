  tekst: 'Kensington ce 30e Mars 1694.

    Apres la recepte de vostre derniere j''ay esté chez Mr. Smith l''Imprimeur des Transactions,
    pour achepter ces Horological Instructions dont vous parlez dans vostre lettre que j''ay
    trouvées et voudrois avoir occasion pour vous les envoyer. Je verray si je pourray le faire,
    par Jannetje Jagers si elle n''est pas encore partie. Je ne puis pas vous rien dire touchant
    ce qu''elles contiennent n''ayant pas eu le temps de les lire.

    J''ay demandé audt. Smith si l''on avoit imprimé des livres pour combattre les sentiments
    de Burnet dans son Archeologia il m''a dit qu''il y avoit des personnes, qui y travailloyent
    mais que rien n''avoit encore paru.

    Ce Smith passera avec le Roy en Hollande et souhaitte fort de vous connoitre, j''ay promis
    de le vous amener alors, il est assez honneste homme pour un homme de sa profession.

    Hier commença icy au Commingarden une vente publique de desseins et de Tailledouces, que
    fait vendre mylord ou parmy le grand nombre qu''il y en a il s''en trouve quelques bonnes
    pieces; mais depuis quelque temps le goust pour cette sorte de choses est icy tellement
    accreu que ces jeunes virtuosi acheptent les choses trois fois plus qu''elles ne valent
    et je vis vendre hier une seule figure dessiegnee de crayon rouge par Rafael et qui fait
    partie de son massacre des petits enfants, pour 11 livres Sterl. et encore n''estoit elle
    pas fort finie. Si je voulois vendre ma collection j''en ferois bien de l''argent. Mais
    je n''en ay point d''envie.'
