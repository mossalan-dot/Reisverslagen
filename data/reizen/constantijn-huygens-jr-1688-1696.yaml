  tekst: 'Whitehall ce 26 de Janv. 1692.

    J''envoyay le livre de Craige a Fatio, il y a environ 8 jours mais il ne me l''a pas encor
    renvoyé, ny fait les corrections que scavez. Me venant voir hier il me dit que cela auroit
    esté fait, mais qu''il ne s''estoit pas bien porté depuis quelques jours et avoit eu un
    fascheux mal de teste. Qu''au reste il ne scavoit pas s''il seroit necessaire ou mesme a
    propos de faire rimprimer ce livre de Craige avec les corrections et les explications dont
    il est question Mr. Neuton ayant fait un ouvrage qui est quasi prest pour la presse ou cette
    matiere de la nature des Lignes Courbes sera traittee si bien, et si amplement, que ce qu''en
    a donné le dit Craige ne sera rien en comparaison.

    Mr. Haley de la Société Royale vient avec Fatio et me dit qu''ils venoyent de sa part me
    remercier du present que je luy avois fait, mais qu''ils souhaittoyent de scavoir, si ce
    n''estoit pas proprement a la Societé que j''avois donné mon verre, parce que Mr. Hooke
    sembloit s''en vouloir rendre maistre et faisoit difficulté de le faire voir a d''autres.

    Je leur dis qu''asseurement je l''avois donné a la Societé a la priere que Dr. Stanley m''en
    avoit faite a diverses fois. Sur quoy je m''imagine qu''ils l''osteront des mains de cet
    homme là, que l''on me dit estre un drosle fort interessé, et auquel on ne peut pas trop
    se fier. Aussi je ne le luy aurois pas remis si Stanley ne m''eust asseuré qu''il estoit
    le plus propre pour enseigner la maniere de s''en servir, quoy que quelque temps apres il
    me dit aussi, qu''il estoit capable de faire quelque mechanceté.

    Haley me parla beaucoup de son invention pour aller sous l''eau et d''y faire tout le travail
    qu''on fait sur la terre. Il dit qu''il y a esté plus d''une heure entiere a la profondeur
    de 60. pieds sans la moindre incommodité, qu''il se met dans une Cloche de bois, dont il
    peut faire sortir l''air devenu inutile et y en faire entrer du frais qu''il a en reserve
    par un robinet que pour sa personne il est dans un habit de toile cirée doublé de fourrure
    qui l''empesche d''avoir froid. Qu''estant sous l''eau il voit tout distinctement, et qu''il
    avait reconnu toutes les sortes de poissons, dans la compagnîe desquels il se trouvoit.

    Van Merlen qui m''a tourmenté longtemps en vertu de sa Genealogie, qu''il dit vous avoir
    monstree et d''une lettre de recommandation que vous luy avez donnee est venu courir encor
    icy, pour faire abjuration de sa premiere Religion, qu''avec moins de peine et de fraix
    il auroit pû faire en Hollande. C''est un garçon qui n''a aucune conduitte ny prevoyance
    et qui fait des contretemps les uns apres les autres, comme je vous racconteray, quand je
    seray venu. On parle toujours du passage du Roy, vers la fin du mois prochain.

    Vous aurez sceu, que le fameux Mr. Boyle est mort. Son Testament n''est pas encor ouvert,
    mais on croit qu''il a laissé des legats considerables pour des oeuvres pies &c.'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 02-06-1692
  plaats_verzender: Leuven
