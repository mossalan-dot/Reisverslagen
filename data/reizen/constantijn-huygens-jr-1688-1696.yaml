  tekst: 'Schoock en sal ons niet toestaen de exceptien van prematuricheyt &c ten principale
    te emploieren voor ''t gerecht van Zuylichem, om dat hij niet wist dat wij dan in ons appel
    tot....weder deselve exceptien souden komen te allegueren. maer indien wij nu voort ten
    principalen quamen te pleyten sonder t'' appelleren van de gegeven sententie dan soude het
    gesententieerde aengaende onse exceptie in rem judicatam...gaen. dat wij goedvinden te volgen
    het advijs van de Hr. Op ten Oort, te weten dat indien Schoock ons toestaet ofte het gericht
    verstaet dat onse exceptieve middelen ten principale worden geallegeert, dan van het appel
    te desisteren, soo niet, dan ''tselve voort te laten gaen.

    Wat sal het hof van Gelderlandt voor sententie geven? alleen dat onse exceptie niet en magh
    werden geregistreert, maer sal niet ten principalen de saecke afdoen. Doch schijnt het dat
    wij dan genoeghsaem souden triumpheren indien de exceptie praematuri moet geaccepteert werden,
    want aengaende de schult, voor soo veel onse partije daer van niet voldaen is, en hebben
    wij niet sonderling tot onse defensie t''allegueren. Of men sal laeten aen de Rentmeester
    of Schout van Zuijlichem om t''inquireren de waerdije van de goederen die Dr. Schoock van
    Korsten Pellen onder sich heeft, volgens t''advis van Op ten Oort. Oock wat die voor dien
    syn waerdt geweest. Wie de 50 gulden van t'' fel appel sal fourneren.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 07-02-1690
  plaats_verzender: Den Haag
