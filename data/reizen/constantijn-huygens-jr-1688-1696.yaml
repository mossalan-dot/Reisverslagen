  link: v
  tekst: 'A la Haye ce 12 May 1690.

    Ce matin madame vostre femme m''a envoyé l''imprimé du Chronological Automaton, que vous
    luy aviez adressè pour cela, comme je crois. Apparemment vous aurez eu la curiositè de voir
    cet ouvrage qui, a ce qui paroit par la description, ne represente que les apparences des
    choses celestes, et non pas ce qu''elles sont dans la veritè et par rapport au systeme entier,
    ainsi que ma machine. Il faut pourtant que l''ouvrier ait de l''industrie, et quelque connoissance
    de l''Astronomie que je juge estre mediocre, parce qu''il met le mouvement des fixes ou
    des Equinoxes d''un degré en 100 ans, au lieu de 70 environ. Ce que j''y trouve de meilleur
    est l''indication des Eclipses, pour vu qu''elle soit un peu exacte. Mr. de la Hire me mande,
    qu''il a inventé une machine pour ce mesme effect, qu''il dit estre plus simple et plus
    correcte que celle de Mr. Romer que j''ay veu a Paris; et il m''a promis de m''en envoyer
    la description imprimée quand il en poura trouver l''occasion.

    Il me demande aussy la description de mon Automate Planetaire pour la faire imprimer, ainsi
    qu''ils ont fait de plusieurs petits ouvrages qu''ils ont trouvé de moy dans les Registres
    de l''Academie, mais je n''en ay encore rien pu avoir.

    Je vous prie derechef de me dire, si Meester ne vous a pas rendu les 4 Exemplaires, qui
    je luy ay confiez. Et s''il les a rendu, d''ou vient que milord Pembrock et Mr. Wallis n''ont
    pas eu les leurs. Pourquoy aussi le Dr. Stanley n''a pas fait tenir le sien a Mr. Boyle.

    Ayant besoin de voir quelque chose dans Salinas autheur de musique, je l''ay cherché dans
    le Catalogue Alphabetique que vous avez laissé, mais ne l''y ay point trouvè, quoy qu''il
    me semble que vous l''ayez eu dans vostre partage. Si cela est je vous prie de le chercher
    dans le Catalogue que vous avez la et de m''en mander le numero.'
