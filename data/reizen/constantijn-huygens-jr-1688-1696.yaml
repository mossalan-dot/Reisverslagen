  tekst: 'Kinsington ce 28. de Mars 1690.

    J''ay receu vos deux lettres du 21 & 24 courant, et j''auray soin de faire rendre celle
    que vous escrivez a Fatio, et de mesme les exemplaires de vostre livre qu''apportera Meester,
    qui n''est pas encore arrivé, si ce n''est qu''il se soit mis dans le Pacquet boot qui a
    apporté vos lettres, ce que nous scaurons bien tost.

    J''espere que vous aurez quelque succes avec la nouvelle sorte d''Objectifs que vous allez
    entreprendre. J''escris à ma femme pour qu''elle vous ouvre le laboratoire ce qu''elle n''auroit
    pas manquè de faire sans cela.

    Nous n''avons rien ouij icy de ces lettres qu''on auroit trouvées sur un nommé J. Holl et
    je suis fort curieux, de scavoir ce que c''est. On dit que ceux d''Amsterdam continuent
    a ne point vouloir se trouver a l''Assemblée ensemble avec Mylord Portland. Si les affaires
    vont bien en Irlande, je croy qu''ils deviendront plus traitables. Apres demain nostre Parlement
    icy s''assemble et alors on sera plus asseuré de ce qui sera de nostre voyage, lequel je
    tiens cependant bien seur nostre homme ne se laissant pas facilement detourner d''une chose
    qu''il a conceue en son esprit. Je ne croy pas qu''il y ait sujet d''en doubter, quoy que
    je souhaitterois fort qu''il y en eust.

    Un Refugié Francois nommé Gaillard m''est venu parler l''autre jour icy a Kinsington desirant
    de faire connoissance. C''est un homme qu''on dit avoir une fort belle collection de medailles,
    de belles pieces antiques, et toute sorte de raretés. Il me dit qu''entr''autres choses
    il a cette Urne (ou quoy que ce puisse estre) de cuivre, dont la figure en estampe se trouve
    dans un petit livre in octavo de Spon. Il y a trois figures moitjé femmes moitjé poisson
    a l''entour du creux du Vase, et une figure entiere sur le haut, toutes merveilleuses. J''aurois
    desja esté voir ce Virtuoso, si j''avois sceu son logis dans la ville, lequel il ne voulut
    pas m''enseigner par compliment, pretendant de me venir voir le premier.

    Le Roy rappella avanthier les commissions des trois Commissaires de la Thresorie, dont Mylord
    Monmouth en est un. Le quatriesme, Hambden le Pere est demeuré dans l''employ.'
