  tekst: 'Sommaire

    Eodem a mon frere de Zuylichem. Pour recommander la lettre de Fatio. que je luy envoie 4
    Exemplaires par Meester qui doit partir avec Mil. Portland. De l''impertinente lettre de
    dewilm. De l''affaire d''Amsterdam accommodée. des lettres dont a este trouvé saisi J. Hol,
    qu''on a imprimees, qu''on ne demesle pas bien cette affaire. que j''espere que le voiage
    d''Irlande ne sera pas necessaire.

    A frere Huygens.

    J''ay perdu de temps a escrire une longue lettre a Mr. Fatio pour respondre a une que jay
    reçuë de luy, ainsi il ne m''en reste que pour vous recommander cette lettre, pour la quelle
    il m''envoie seulement l''adresse que j''y ay mise dessus. J''ay donnè à Meester qui partira
    dans peu avec Mil. Portland, 4 exemplaires reliez, qu''il m''a promis de vous faire tenir,
    ils sont pour Mil. Pembrok, Mr. Wren, Wallis, et Fatio, de qui l''exemplaire aura estè donnè
    au Dr. Stanley. J''ay vu l''admirable lettre du Cousin de Wilm avec ce que vous en dites
    au frere de St. Annelant et a ma soeur. A t''on jamais vu une pareille impertinence. Je
    crois que le frere luy aura envoiè et sa lettre et la vostre, au moins je le luy ay conseillè.
    L''affaire d''Amsterdam s''est accommodée comme vous scavez mais ces lettres qu''on a imprimees
    icy qui ont estè trouvees sur ce J. Hol sont quelque chose d''estrange et que l''on ne scauroit
    pas bien developper encore, non plus que cette interception des lettres au Roy, que l''on
    dit a cette heure avoir estè rendues. Il me tarde de scavoir ce que deviendra vostre voiage
    d''Irlande et souhaiterois qu''il n''en fust pas besoin.'
