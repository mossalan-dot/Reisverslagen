  tekst: 'Kinsington ce 21e Novembre 1690.

    J''ay receu la vostre du [?] de ce mois, et vous envoye cy jointes quatres lettres de recommandation
    pour servir a nostre proces. Une a Monsr. de Ripperda President de la Cour de Gueldre, la
    seconde a Mr. van Essen Frere du Drossart du Veluw qui est fort de mes amis, la troisieme
    a Mr. Verbolt qui m''a depuis peu fait asseurer de son service, et la derniere a Mr. de
    Roosendael conseiller de la Cour, et comme je croy bien intentionné pour nous. Je n''ay
    pu recommander nostre affaire qu''en de termes generaux, par ce que je ne me souviens pas
    fort bien de ce qui en fait la substance.

    Il faut louer Dieu de ce que le malheur de Voorhout n''a pas esté plus grand, comme il l''auroit
    asseurement esté s''il y eust eu une plus grande quantité de poudre.

    Pour Monsieur Justel il m''a esté voir une fois, il y a desja du temps, et un peu de temps
    apres luy ayant rendu visite, il n''est pas revenu et ne l''ay pas reveu depuis ce temps
    la.

    Il y a trois ou quatre jours qu''un certain virtuoso m''est venu voir sur l''avis de Mylord
    Sidney. Il s''appelle Mr. Write, a esté plusieurs fois et souvent longtemps en Italie connoit
    touts les maistres et leurs ouvrages. Je scay que Lily a eu de luy plusjeurs de ses meilleurs
    desseins Italiens. Il se connoit aussi fort bien en medailles, agates &c. Demain j''iray
    chez luy pour voir des choses qu''il dit avoir encore.

    Stanley me tourmente furieusement, pour que je fasse present a la Societé Royalle d''un
    de mes verres de Telescop et a bien l''effronterie d''oser demander celuy de 210, ou 160
    pieds. Mais je luy ay dit, qu''ils seront bien heureux, si je leur en donne un de 120. Ils
    veulent faire dresser un mast aussi haut que je voudray dans une basse court de Gresham-College.
    Nous parlerons de tout, quand Dieu aydant je seray là; mais de dire quand ce sera precisement,
    c''est ce que je ne scaurois, celà dependant des affaires qui sont sur le tapis. On parle
    pourtant du commencement du mois prochain.

    Noyelle, le Duc de Schomberg, Sommelsdijck et Madame Danckelman sont arrivés non sans danger
    et beaucoup de peine, apres avoir croisé la mer quinze jours durant, estant a veue de la
    coste ils se mirent dans la chalouppe et gagnerent la terre, mais non sans bien du danger
    comme j''ay dit.

    Lundy Messr. de l''Estang et de la Lecque partent, pour aller devant le Roy en Hollande
    avec 80 Gardes du corps.

    P.S. Ayant escrit cecy j''ay trouvé a propos d''envoyer la lettre a Mr. Verbolt par de Wilde
    qui est son parent.'
