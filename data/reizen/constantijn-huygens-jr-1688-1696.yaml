  land_ontvanger: NL
  relatie: broer-broer
  taal: Frans
  bron: ePistolarium
  link: v
  tekst: 'Au Camp proche de Louvain ce 2.de Juin 1692.

    Je n''ay pas encore repondu à vostre derniere du 22e de May quoy que le contenu m''ait fort
    resjoui. Voyant que vous temoignez quelque dessein d''essayer la maniere de Newton laquelle
    reussissant seroit une des belles choses dont on a ouy parler jusques a present. Je suis
    bien fasché de ne pouvoir pas vous assister et prester la main. Ce seroit un grand dommage
    qu''ayant trouvé la Theorie de cette methode vous n''en viendriez pas a en faire l''essay
    et la mettre en pratique.

    J''attends avec impatience que vous me mandiez encore quelque chose de la maniere de Hartsoecker
    et du grand verre bruslant d''Amsterdam. Mais a propos de manieres je n''espere pas que
    vous voudriez penser a rendre publique nostre ou plustost vostre methode de faire les grands
    verres et de rendre commune une si belle chose qui pourroit donner a manger a qui n''auroit
    autre chose au monde. Peu de gens vous en scauront du gré et il viendra de la canaille qui
    diront qu''ils ont eu l''invention devant vous ainsy qu''il vous est arrivé a l''egard de
    celle des Pendules.

    Je suis fort en peine de trouver un homme capable pour le mettre en qualité de Precepteur
    avec mon Fils au lieu de Keyser qui est un flasque, maladif et mal propre pour cet employ;
    outre qu''il est bien difficile qu''un homme seul puisse servir à deux garçons dont l''un
    à bon besoin d''en avoir un luy seul. J''escris donc à Mr. Carré nostre vieille connoissance
    [pour] scavoir s''il ne connoist pas quelque Refugié ou autre propre pour cette affaire.
    Ma femme vous montrera ma lettre, et je vous prie de luy en parler.

    Ce matin a 5 heures est venue icy la bonne nouvelle de la defaite de la Flotte de France
    que vous aurez eue ou plustost ou le mesme temps. Il nous tarde bien d''en apprendre les
    suittes, car le maistre des Postes d''Ostende mande au Roy que quelque temps apres le combat,
    auquel un brouillard survenu mit fin, on avoit encor ouy tirer de nouveau et tres fort.
    Nos gens ont eu le grand bonheur que comme ils fussent attaqués par les enemys peu de temps
    apres le vent changea et devint favorable pour nous'
- verzender: Constantijn Huygens jr.
  ontvanger: Christiaan Huygens (1628-1695)
  datum: 30-06-1692
  plaats_ontvanger: Den Haag
  land_ontvanger: NL
