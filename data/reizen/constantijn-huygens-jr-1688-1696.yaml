  tekst: 'Whitehall le 6de Janvier 1690.

    Pour response a la vostre du 23e dec. je vous diray que je n''ay receu les livres de Mr.
    Leeuwenhoeck que 8 ou dix jours passés et que les ayant receus j''ay donné trois exemplaires
    a Stanley, pour les adresser selon les intentions de l''autheur, qui sans doubte aura reponse
    la dessus du dit docteur ou la recevra au premier jour. Je vous prie de le remercié de l''exemplaire
    dont il m''a fait present. J''en ay lu la plus grande partie avec du plaisir. Pag. 254 il
    semble qu''il est d''opinion que les semences des plantes et des animaux contiennent des
    animaux, qui dans leurs semences en contiennent d''autres derechef in infinitum et qu''il
    ne se fait point de nouvelles creatures dans le monde mais que celles qui sont desja faites
    ne font que croistre et augmenter, ce qui seroit une chose merveilleuse. De la charge vacante
    de Mr. Pettecum je n''ay point ouy parler depuis quelque temps et ainsi il ne semble pas
    que l''on aye dessein de la remplir. Pour scavoir au vray ce qui en est vous pourriez parler
    a Mr. Schuylenburg qui connoist je m''asseure, les intentions du Roy la dessus. Je luy en
    ay escrit une fois, quand vous me touchates cette affaire, mais il ne m''a point repondu
    sur cet article la de ma lettre. La sollicitation de Hoeuft pour cette place n''a point
    eu d''effet, ny mesme la moindre apparence de succes, aussi, si j''estois Roy, il seroit
    un des derniers dont mon conseil seroit composé. Il m''a tourmenté aussi pour cette affaire,
    mais il y a desja du temps qu''il a quitté la partie, et s''en est retourné au Pays. Ne
    croyez pas, que j''aye perdu l''envie d''y retourner aussi quand j''auray moijen de le pouvoir
    faire avec honneur et en sauvant au moins les apparences et je doubte fort si vous trouveriez
    fort vostre compte en ce pays icy. Mr. Justel a esté fait Bibliothequaire comme vous dites;
    l''on ne m''a pas dit precisement quels sont ses appointements, mais en general qu''ils
    ne sont que bien mediocres. Il vint hier me rendre visite pour la premiere fois, et je pretends
    d''entretenir connaissance avec luy, trouvant sa conversation agreable. Mais on l''accuse
    de n''avoir pas d''assez bons sentiments pour le Roy, mesme encore pour le present. Il me
    dit qu''il croyoit que bientost la Societé Royale recommenceroit a donner au public ses
    Transactions et que mesme de temps en temps, on avoit imprimé quelque chose, entre autres
    une relation qu''il avoit produite luy mesme, l''ayant receue de France touchant une sepulture
    fort ancienne, qu''on avoit trouvée sous terre aupres de Maintenon aux environs de Chartres
    ou l''on avoit trouvé quelque nombre de corps morts d''une taille beaucoup au dessus de
    celle des hommes de ce temps icy, et de plus plusjeurs sortes d''armes, dont le trenchant
    estoit fait d''une pierre fort dure et non d''aucun metail, ce qui asseurement marquoit
    une grande antiquité; veu que dans les temps les plus anciens dont on a connoissance les
    Gaulois se servoyent d''armes faites de fer et d''acier. On vend icy aussi le Dictionnaire
    de Feuquieres, et je crois que je seray obligé de l''achepter en ce pays icy, ou il sera
    pourtant plus cher qu''en Hollande, pour eviter les incommodites du transport et les embaras
    des Customes qui sont facheux.

    On a aussi imprimé icy les Lettres du vieux Vossius et on y est allé d''une maniere, qui
    fait enrager son petit fils, car l''Imprimeur Scot s''estant rendu maistre du manuscrit
    a dedié le livre au Roy à l''insceu de l''autre et a meslé parmy ces lettres plusjeurs qui
    ne parloyent que de petites affaires particulieres et domestiques, entr''autres quelques
    unes ou il donne de bonnes reprimendes a quelques uns de ses fils. Ce Scot refuse de rendre
    a Vossius le manuscrit susdit avant que trois ans soyent passé pour l''empescher de faire
    faire une nouvelle impression, dont il a pourtant le dessein, et pretend de se servir pour
    cela de celle d''icy, et d''y adjouster plusjeurs lettres d''Isacus et autres pieces, qu''il
    a entre les mains.

    Il tasche de s''accommoder avec l''Université d''Oxford pour la vente de la Bibliotheque
    de son Oncle mais quand il fust avec moy la derniere fois l''affaire n''estoit encore gueres
    avancée.

    Sr. Christopher Wren a receu bien du deplaisir et de bonnes reprimendes au sujet de ses
    beveues commises aux bastiments de Hamptoncourt et de Kensingtonhouse, de l''un et de l''autre
    desquels une bonne partie est tombée de soy mesme en faisant perir 6 ou 7 des ouvriers.

    Vos Livres de la Lumiere et de la Pesanteur seront asseurement les tres bienvenus icy. Isac
    pourra les apporter qu''on attend de jour a autre.

    Flamstead m''a envoy''e la Table qu''il fait touts les ans de la haute marée au Pont de
    Londres.

    Mylord Portland partira comme je croy demain pour l''Hollande, ou il va pour les affaires
    du Roy. Il fait estat d''y estre environ un mois, je croy que vous l''irez saluer.'
