  tekst: 'Sommaire

    Recommandé Mr. Voorburgh, a la charge de Secretaire de ''s Gravesande Honselerdijk &c. que
    j''ay dessein de travailler à un grand verre objectif pour 12 pieds qu''il en escrive a
    Me. sa femme. Eclipse.

    A la Haye ce 24 Mars 1690.

    Hier au soir assez tard me vint trouver un Mr. Voorburgh fils de madl. van den Bosch de
    son premier mari (vous scavez que depuis peu elle est vefve du second) Je ne l''avois vu
    depuis ses nopces, au quelles je fus priè je ne scay par quelle rencontre. Il me dit qu''il
    s''estoit depuis quelques annees appliquè a la Pratique du Droit, mais que n''y ayant guere
    a profiter, et estant venu a vaquer la charge de Secretaire de ''s Gravesande Honselerdijck
    &c. il s''etoit rendu un des sollicitants pour l''obtenir. Que Madl. sa mere en avoit escrit
    a Mr. le Comte de Portland, et qu''elle avoit promesse de Mr. de Marets qu''il intercederoit
    pour luy. Et me pria de vous vouloir escrire en sa faveur, ce que je ne pus refuser, et
    que j''execute maintenant, quoy que je sçache bien que vous ne serez pas fort prest a entreprendre
    cette recommandation d''un homme a vous inconnu, car que pouvez vous dire si ce n''est qu''il
    vous a este recommandè par lettre. Cependant je considere que ces gens font mieux de chercher
    ainsi partout ce qu''ils croient pouvoir contribuer en quelque façon a leur avantage que
    nostre beste de Cousin, qui ne voulut pas seulement faire parler pour luy au Conte de Portland.
    mais il ne vaut pas la peine qu''on en parle.

    Dans ma lettre que je vous escrivis il y a 3 jours j''oubliay de vous dire que j''avois
    dessein de travailler a un objectif de 12 pieds seulement, mais. d''un fort grand diametre,
    afin de luy donner une ouverture comme a un verre de 80 pieds, et voir quel effet cela fera
    pour decouvrir des Estoiles et des Satellites ce qui m''a roulè depuis longtemps dans la
    teste. l''Oculaire sera foible ce qui fera que cette lunette grossira beaucoup moins qu''une
    ordinaire de 12 pieds, mais elle sera aussi distincte et incomparablement plus claire. Que
    si je vois que cela reussit bien, j''en feray apres de plus grandes comme de 33 ou de 60
    pieds, lesquels verres seront aussi grands que ceux que nous avons pour 120 pieds. Je ne
    crois pas que Mad. vostre espouse fasse difficultè pour me laisser travailler dans vostre
    laboratoire: toutefois je voudrois bien que vous voulussiez l''avertir de mon dessein, et
    faire qu''elle en fust contente. Je viens d''apprendre que Meester que j''ay chargè de 4
    Exemplaires de mon livre n''attendra pas le Comte de Portland, mais qu''il profitera du
    bon vent, de sorte que dans peu ce paquet vous pourra estre rendu. Je vous ay envoiè une
    lettre pour Mr. Fatio que je vous prie de ne pas oublier de luy faire rendre. Je m''en vais
    observer l''Eclipse de la Lune avec quelques Messrs qui croient qu''ils la verront bien
    mieux en ma compagnie.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
