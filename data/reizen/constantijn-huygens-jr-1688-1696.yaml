  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: "Sommaire\n7 feb. 90. Au frere de Zulichem a Londres. L'orange tafeldecker a ce que\
    \ dit wiliet. livres 5 et 3. 1 pour luy. les autres a Fatio si Fatio u'y est plus, que le\
    \ dr. Stanley fasse la distri bution, avec ma lettre. \nJe n'ay pas vu Benting, mil. Portland\
    \ tout affaires importantes. \nLeeuwenhoek. Opinion de la semence de Swammerdam vraisemblable.\
    \ \nLettres de Vossius pas vues icy. \nSepulture anciene jay eu un manuscrit de cela. voiage\
    \ accrochè pour l'Irlande. \nCatalogue van Ockerse. \nWilliet recommandè.\nA la Haye ce\
    \ 7e Febr. 1690.\nVostre lettre du 6e Jan. m'a estè rendue a son temps. J'espere que celle\
    \ du Dr. Stanley a Leeuwenhoek l'aura estè de mesme pourvu qu'il l'ait escrite. Je le scauray\
    \ dans un jour ou deux, car j'ay dessein d'aller a Delft pour faire 2 ou 3 visites. Cette\
    \ opinion de l'inclusion infinie des animaux et herbes, les uns dans les autres a esté avancée\
    \ premierement par Swammerdam à ce que je crois, et elle me paroit assez probable. Il y\
    \ a pourtant quelque objection a faire en ce qui regarde les arbres, parce qu'il y en a\
    \ dont les branches estant plantees en terre, produisent des arbres entiers et leurs semences,\
    \ et il en est de mesme de tous les autres arbres entez ou greffez. Car cela marque encore\
    \ une autre infinitè par les branches, outre celle qui procede par la seule graine. et il\
    \ paroit que cette autre auroit estè inutile, sans la propagation artificielle. Natura autem\
    \ nihil frustra facit. Hier je vous ay adressè 8 exemplaires de mon Livre nouvellement imprimè\
    \ par le moyen d'un domestique du Roy, qui avec d'autres a receu ordre de se transporter\
    \ en Angleterre, il s'appelle l'Orangeois, et sa charge est Tafeldecker, à ce que m'a dit\
    \ Williet, qui m'a indiquè cette commoditè. Il y a 2 paquets, dont l'un contient 5 Exemplaires\
    \ reliez l'autre 3 non reliez, et qui sont separez chacun en 3 parties pour pouvoir estre\
    \ pliez plus facilement. Apres que vous aurez pris pour vous un des Exemplaires reliez,\
    \ vous aurez la bontè d'envoier les autres a Monsr. Fatio avec la lettre cy jointe, dans\
    \ laquelle je luy nomme les personnes a qui il doit les distribuer. Il loge dans Suffolcstreet\
    \ next to Mr. Maigret French Apothecary, c'est vers le milieu de la rüe a main gauche en\
    \ y entrant. Mais comme il y a fort long temps que je n'ay point eu de nouuelles du Sr.\
    \ Fatio, il se pourroit qu'il fust delogè de la; et mesme qu'il ne fust plus a Londres,\
    \ au quel cas je vous prie d'en commettre la distribution au Dr. Stanley, qui par le moyen\
    \ de Mr. Boyle, ou de Mr. Hamden pourra trouver ces autres Messieurs. J'espere pourtant\
    \ que Mr. Fatio s'y trouvera et qu'ainsi le Dr. n'aura pas besoin de prendre cette peine.\n\
    Je n'ay pas encore vu Mil.d Portland, quoy que j'aye estè plusieurs fois pour cela, mais\
    \ la cour y est si nombreuse, et il a rencontrè tant et de si grandes affaires, (dont vous\
    \ aurez assez ouy parler) qu'il ne faut pas s'etonner s'il est difficile d'avoir audience.\
    \ Je tascheray pourtant d'y parvenir, et luy toucheray quelque mot de mon affaire, quoyque\
    \ je n'y voie point d'apparence de succes, depuis la lettre que ce Seigneur en escriuit\
    \ a Mr. Schuylenburgh.\nCes lettres de Vossius ne se voient pas encor icy, a cause du peu\
    \ de commerce des libraires de ce païs las et le nostre. Je me souviens d'avoir vu en escrit\
    \ cette relation de l'ancien sepulchre pres de Chartres et je crois que c'est Mr. Guiran\
    \ Conseiller d'Orange qui me l'avoit prestée. C'est la une antiquité bien grande.\nVan der\
    \ A. vous aura envoiè un Catalogue d'Ockersen ou il y a beaucoup de ces livres d'Estampes,\
    \ pour les quels peut estre vous donnerez commission. Je pourray les aller voir, mais mes\
    \ affaires ne permettent pas que je fasse de telles emplettes.\nL'on tient icy que le voiage\
    \ du Roy en Irlande ne se fera point a cause des instances contraires de ceux du Parlement,\
    \ de quoy certes je vous felicite, me pouvant facilement imaginer l'embaras et l'incommoditè\
    \ d'une pareille Expedition.\nLe Sr. Williet vient de me prier de faire mention de luy dans\
    \ cette lettre, et de vous le recommander en cas qu'il se trouve quelque place en vostre\
    \ Secretairie ou vous jugiez qu'il puisse vous servir. Il dit que Mad.e vostre femme intercedera\
    \ aussi pour luy. Vous pouvez le croire fidelle et bien affectionnè et de quelque service\
    \ a cause qu'il sçait les deux langues.\nCe billet pour mes Exemplaires est pour Mr. Stanley\
    \ en cas que Mr. Fatio ne se trouve plus a Londres."
