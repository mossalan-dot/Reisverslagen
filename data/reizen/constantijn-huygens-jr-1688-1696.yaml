  taal: Frans
  bron: ePistolarium
  link: http://ckcc.huygens.knaw.nl/epistolarium/
  tekst: 'A Hofwijck ce 26 Jul. 1691.

    Ce n''est pas pour croire que ma recommandation produira beaucoup d''effet que je l''emploie
    auprès de vous, mais parce que je n''ay pu la refuser a l''instante priere de celuy qui
    vous fera tenir cette lettre. C''est un Professeur a Louvain natif de la Haye, nommé van
    de Velde, qui m''est venu voir il y a un an, et m''a paru bien scavant en Philosophie. Depuis
    peu il a publiè et soustenu des Theses, ou il n''avance pas seulement les sentiments de
    Des Cartes, et la mobilitè de la Terre suivant le Systeme de Copernic mais il reprend outre
    cela un peu librement l''inutilitè de la Philosophie Scolastique, ce que quelques uns de
    ces anciens docteurs ne pouvant souffrir, ils l''ont accusè aupres de Mr. le Nonce du Pape
    qui est a Bruxelles, a fin de le faire agir aupres du Recteur de l''Universitè pour faire
    mettre en prison nostre Philosophe qui pourroit ainsi devenir martyr de la doctrine Cartesienne.
    Il a eu recours jusqu''icy au Conseil de Brabant ou il a presentè requeste contre le decret
    de prise de corps qu''on avoit obtenu. Mais comme il apprehende surtout que le Marquis de
    Gastanaga ne preste main forte a ses adversaires, qui l''en sollicitent par l''authoritè
    de l''Internonce, il a creu que Mr. le Marquis venant quelques fois faire sa cour au Roy
    dans vostre Armée, vous pourriez avoir occasion de luy dire un mot en faveur de luy Suppliant
    a fin qu''il fust delivrè de cette persecution. Voiez je vous prie s''il y aura moien de
    faire quelque chose en sa faveur, et jugez qu''il doit estre bien en peine de sa personne
    puis qu''il vient rechercher une protection si eloignée. Je crois que tant Mr. le Marquis
    de Gastanaga, que vous, avez bien d''autres choses a penser, presentement, que ce que disputent
    entre eux les Philosophes, car on dit que dans peu il pourroit y avoir bataille entre les
    deux Armées. Dieu veuille, qu''elle soit heureuse, et que nous vous puissions revoir, sain
    et contant.'
- verzender: Christiaan Huygens (1628-1695)
  ontvanger: Constantijn Huygens jr.
  datum: 16-07-1693
