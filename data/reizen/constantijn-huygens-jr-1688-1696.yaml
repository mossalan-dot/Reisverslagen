  tekst: 'Whitehall ce 30. de Dec. 1692.

    J''ay receu la vostre du 23. décemb. et ayant consideré ce qu''il y aura à faire dans cette
    affaire de Zuylichem (je dis pour le Ministere) je croy que le plus court et le meilleur
    sera de suivre l''advis de Mr. Verbolt et de presenter au nom de dieu ce van Holten, car
    de croire qu''on pourrait faire escrire le Roy a la classe je croy que ce seroit se tromper
    et de la peine perdue de l''entreprendre. Je croy que cet homme la y estant mis de la main
    de Verbolt susdt. se gouverneroit par ses conseils et selon ce qui est de nos interests
    et que d''autre costé on pourroit eviter toutes ces fascheuses disputes touchant le droit
    de Presenter, etc. duquel droit estant une fois estant [sic] en possession ils ne pourront
    pas bien nous le disputer à l''avenir.

    Depuis nostre retour en cette ville, je n''ay point eu de conversation avec Mess.rs de la
    Societé R., ny veu aucune de leurs Transactions. Je m''informeray pourtant pour scavoir
    si lon en a imprimé depuis quelque temps, et scauray par le moyen du d.r Stanley si ces
    Mess.rs ont eu quelque relation particuliere touchant le σεισμὸς de Jamaicque pour vous
    en faire part.

    Je n''ay rien appris non plus touchant ce qu''ils ont fait de mon verre dont je leur ay
    fait present n''ayant point veu d.r Flamstead, lequel je ne scay si je vous ay mandé qu''il
    est marie icy apres le depart d''icy du Roy. Je croy que cela causera de l''interruption
    a ses observations nocturnes.

    Touchant les affaires de Zuylichem et s''il sera a propos d''en venir a l''admodiation que
    l''on propopose [sic] je m''en rapporte entierement a ce que vous avec les Freres trouverez
    bon de faire.

    J''ay esté l''autre jour chez ce Beverland, qui a demeuré quelque temps avec Vossius, et
    a escrit le livre que vous scaurez de Peccato Originali, pour lequel il fust banny de l''Hollande.
    A l''intercession de Monsieur Halewijn et autres il aura sa grace du Roy. Il me fist voir
    sa Bibliotheque qui est de livres choisis, et un grand nombre de tailles douces parmy les
    quelles il y en a de belles. de desseins il n''en a point.'
- verzender: Constantijn Huygens jr.
