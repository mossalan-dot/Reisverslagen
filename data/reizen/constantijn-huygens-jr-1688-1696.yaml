  tekst: 'A la Haye ce 28 fevr. 90.

    J''ay receu ce matin vostre lettre du 24 de ce mois. Je vous remercie de la peine que vous
    avez bien voulu prendre vous mesme de chercher Mr. Fatio. C''est ma faute de n''avoir pas
    entretenu le commerce avec luy, car si je l''avois fait, nous ne serions pas maintenant
    en peine de le chercher. Sans luy je n''auray point de response des autres à qui j''ay envoiè
    de mes Exemplaires, parce qu''il n''y a que luy a qui j''ay escrit. S''il estoit parti pour
    l''Allemagne avec ce Mil. Paget, il devroit estre passè icy et comme je ne l''ay point vu,
    cela me fait esperer qu''on le trouvera encore en Angleterre, ce que le Dr. Stanley pourra
    apprendre, ou aura desia appris, de ceux à qui il aura fait tenir les d[it]s Exemplaires,
    sur tout de M. Boyle ou de Mr. Locke. Il est tres juste que ce Dr. ait un Exemplaire pour
    sa peine, pourvu qu''il le veuille, ou qu''il scache qu''en faire. Monsr. Dalonne a escrit
    icy a ses amis pour en avoir, mais je ne crois pas qu''ils se vendent encore parce que le
    Sr. P. van der Aa en pretendoit faire le premier debit a la foire de Francfort.

    Je puis croire facilement que le voiage d''Irlande ne vous doit pas faire plaisir, comme
    estant de grand embaras et dans un mechant païs. quelle peine d''aller embarquer, passer
    la mer, debarquer, et apres cela suivre l''armee.

    Je n''avois pas la moindre pensée que Williet seroit a vos gages, mais aux depens de Ms.
    nos Estats; comme il l''avoit aussi entendu; et soutient, qu''on vous l''auroit accordè
    a la place de ces messagers que vous aviez cydevant, si vous l''eussiez voulu demander.
    C''est a vous a songer si cela merite que vous preniez cette peine, mais en veritè je souhaiterois
    que vous eussiez plus de compagnie de gens affidez dans ce futur voiage qu''il me semble
    que vous n''aurez. L''un de vos commis estant de peu de fatigue et maladit.

    Lors que je vous ecrivis ma derniere du 24e de ce mois on croioit que l''affaire d''Amsterdam
    s''alloit accommoder, mais il en est tout autrement, et ces gens semblent s''eloigner de
    plus en plus. Latet nescio quod magni mali. Tous les mecontants se dechainent et parlent
    de bien autres choses que de la creation des Echevins d''Amsterdam. Avanthier mourut le
    Sr. de Warmenhuijsen, ne s''estant pu remettre apres certaine debauche faite a Leijden ou
    il s''estoit trop chargè de vin. Cette mort n''a rien d''etrange pour un Heemraedt, qui
    estoit sa nouvelle dignitè.

    Si le Dr. Stanley decouvre quelque chose touchant Mr. Fatio, je vous prie de me le mander,
    et qu''il ait ma lettre s''il est possible. Autrement il faudra que j''ecrive à M. Newton.'
