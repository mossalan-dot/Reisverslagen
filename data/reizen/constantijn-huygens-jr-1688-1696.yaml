  tekst: 'A la Haye ce 24 fevr. 90.

    Je vous ay escrit du 7 de ce mois, pour vous donner avis que je vous envoiois par le moien
    d''un nommé L''orangeois ou l''Orange, domestique et Tafeldecker de sa Majestè, 8 Exemplaires
    de mon Livre nouvellement imprimè desquels je vous priois d''en remettre 7 à Mr. Fatio,
    ou s''il n''estoit plus a Londres, au Dr. Stanley pour en faire la distribution au [x] personnes
    que je vous nommay dans ma lettre. Je crois que celuy qui s''est chargè de ces livres aura
    estè longtemps arrestè a Helvoet en attendant le vent, mais je ne doute pas qu''il ne soit
    maintenant arrivè a Londres. Mandez moy donc je vous prie s''il vous a rendu ce paquet,
    et si vous avez fait tenir les 7 Exemplaires et ma lettre à Mr. Fatio. Je n''en ay point
    envoiè à Mil. Pembrock parce qu''on tenoit pour certain qu''il alloit venir icy pour assister
    a la conference des Alliez. J''en devrois bien envoier aussi a Mr. Wren, et Dr. Wallis,
    mais je ne sçay pas s''ils entendent le François.

    J''ay vu ces jours passez Mil.d Portlant qui me reçut avec beaucoup d''honnesteté, mais
    lors qu''entre autres choses je luy parlay touchant mon affaire, il fit semblant de n''en
    avoir point de connoissance, ou peut estre la quantitè d''affaires de plus grande importance
    qu''il a dans la teste depuis qu''il est icy, luy en a ostè le souvenir. Il me fit pourtant
    de belles offres de service en cas qu''il se presentast d''occasion, soit en cette affaire
    ou ailleurs. L''affaire d''Amsterdam, que ces Messieurs avoient entreprise tres mal à propos,
    a ce qu''on tient sera accommodée et terminée dans peu de jours, et on attend pour cela
    le retour de leur[s] deputez qui partirent d''icy il y a 3 jours.

    Vous aurez sceu la mort du Philosophe Heemskerck, de qui le Testament fut ouvert avant hier,
    contenant un lais pour Mad.lle Cab. de 1200 liv. par an, à payer par quartiers; ce qui joint
    au tesmoignage de Mr. Vollenhove, a qui le deffunt a protestè que dans le commerce qu''il
    a eu avec lad.te Damoiselle, il ne s''est rien passè que de fort honneste, la sauve heureusement
    et du costè de la subsistence et de celuy de l''honneur, quoy qu''il y ait des gens qui
    ne veulent pas ajouter soy a cette declaration, et disent qu''en la faisant il n''aura plus
    estè dans son bon sens.

    Je vous prie de ne pas oublier de me faire scavoir touchant mes livres, quant ce ne seroit
    que par un mot en ecrivant à Mad.me vostre Femme.'
