beschrijving: Eerste verslag van een educatiereis van Jacob van Foreest naar Frankrijk in 1660
  in het gezelschap van Nanning van Loon. Het manuscript is op sommige plekken vervaagd en moeilijk
  leesbaar. De auteur arriveerde per schip in Le Havre en bezocht Caen, Parijs en het Loiregebied.
  Het verslag eindigt in Avignon.
