id: constantijn-huygens-sr-1621-1623
titel: Diplomatieke reis naar Engeland
reizigers:
- constantijn-huygens-sr
reistype: diplomatieke reis
jaren: 1621-1623
vertrek: 03-12-1621
terugkeer: 12-02-1623
reisdagen: '436'
gebieden:
- Nederlandse Republiek
- Engeland
beschrijving: Tussen 1621 en 1624 reisde hij als diplomaat naar Engeland in het gezantschap
  van François van Aerssen, Diederick Bas (1569-1637) en Hendrik van Tuyll van Serooskerken
  (1574-1627).
