  opmerkingen: gentilhomme
brieven:
- opmerking: Circa 156 brieven tijdens zijn diplomatieke reis naar Engeland in 1621-1624, waaronder
    negenenzestig brieven met zijn ouders, veertien brieven met zijn oom Maurits, veertien brieven
    met Jacob Cats (1577-1660), negen brieven met Daniël Heinsius (1580-1655) en zeven brieven
    van Dorothea van Dorp (1592-1657).
poezie:
- titel: Sonnet tot afscheyt, staende opde reyse naer Engelandt, aen heere P.C. Hooft’
  dichter: Constantijn Huygens sr.
  aan: P.C. Hooft (1581-1647)
  datum: 17-01-1621
  taal: Nederlands
  bron: Huygens 1892, 197-239
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0016.php
  tekst: "heere P.C. Hooft\n \nDanck hebbe 't Leeuwen merch, en grove' Achilles schoncken\n\
     \nDie mijn vercleumde handt van kramp styff maeckten rap,\n \nEn stelden teghen 'tHooft\
    \ der hoofden hooftstuck schrap,\n \nDaer sy te voren lach jn schimmelschae versoncken.\n\
    5\nOch hadd' jck eenen drop op Helicon gedroncken\n \nVan dat daer boven heet het Caballynsche\
    \ sap,\n \nEn onder 'tgroene hout van 'tvochtich Vryerschap\n \nEen blaeckend' vier gestoockt\
    \ jn plaets van dese voncken!\n \nWat hadd' jck langh myn stem, myn danckbaerhertich dicht\n\
    10\nMyn snaren opden toon van v loff aff gericht!\t\n\n \nDaer nu myn onmacht js den reghel\
    \ van myn zeden.\n \nVaert wel vol-herssent Hooft; myn Schipper steeckt van Landt\n \nDaer\
    \ gae ick springhen heen op Thetis baren-trandt,\n \nIck ghev' V d'eerste eer, gunt mij\
    \ de leste reden.\n \n16o. Cal. Feb. (17 Jan.)"
- titel: Academiae Oxoniensi perpetuum florere
  dichter: Constantijn Huygens sr.
  datum: 17-09-1622
  locatie: Londen, Engeland
  taal: Latijn
  bron: Huygens 1892, 239-282
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0017.php
  tekst: "Academiae Oxoniensi perpetuum florere\n\nOxonii colles, et quae neglectius olim\n\
     \nCredite (si qua tamen fidei faex licta Batauis,\n \nNec uel apud Musas perfida turba\
    \ sumus)\n5\nCredite Musarum uirides habitacula syluae,\n \nCredite numinibus vota sacella\
    \ meis,\n \nCredite, qui quot onus gestat paritura Britanno\n \nViximus, inuiti viximus\
    \ orbe dies:\n \nViximus inuiti; quia nam quae summa uidendi\n10\nVos fuit, et tantum spes\
    \ fuit, illa fuit:\n \nNec reditura fuit; ita nunc procliuis adegit\n \nPraecipiti pronam\
    \ Cynthius axe rotam,\n \nEt modo multa nimis coelo bacchata Noti vis\n \nEripiet coecas\
    \ imbribus aucta vias;\n15\nNec si summa quidem placeant incommoda, vel nunc\n \nAnnuat\
    \ officijs blandior aura meis:\n \nCarcere torpendum est (sic Dij uoluistis) eodem,\n \n\
    Sola nec exilij credita plaga satis,\n \nBis miserum jubet esse, cui semel esse Batauo\n\
    20\nSors dedit, et geminae mortis obire necem.\n \nSic ego Brutiadum pariter summotus Athenis\n\
     \nSummoueor Tempe, dulcior Haga, tuis;\n \nSic patrijs vicinus agris, sic proximus idem\n\
     \nOxonijs, isthinc exul et inde vocor.\n25\nQualis ad Euxinos (proh Caesaris ira) Tomitas\n\
     \nPerdidit in Scythicas irrita uerba niues,\n \nQui Patriâ voluit Vates ubicumque carere,\n\
     \nNe modo non gelidis fas caruisse Getis.\n \nDa ueniam ueneranda tamen, da summa Britanni\n\
    30\nLondinum Imperij gloria, summe decor,\n \nDa ueniam immensi, quantus patet, Orbis imago,\n\
     \nDa ueniam Regni Regia congeries,\n \nNon ego Sauromatas Tamisi compono paludes,\n \n\
    Non ego vel celebres quas vehit Ister aquas,\n35\nNon ego Ponticolûm demens tua marmora\
    \ caulis,\n \nNon ego tam populis, barbara terga, tuis.\n \nSanius insanimus, et unus taedia\
    \ (si fas)\n \nOxonius vestri mouit et auxit ager:\n \nIlla meis unquam si non occurrat\
    \ imago\n40\nSensibus, immemorem quo sinat esse sui,\n \nForsitan esse tuas aliquid tum\
    \ turbida turbas\n \nAula minus dubiâ suspicione rear,\n \nEt tenerâ necdum demulsi fruge\
    \ palati\n \nEmicet ad glandes mota saliua tuas;\n45\nNunc mihi tam memori tam blandas undique\
    \ circum-\n \n-gestanti mecum pectore relliquias,\n \nEt modo Woolseias recolenti coepta-ruinas,\n\
     \nMarmora de domini sorte notata sui,\n \n(Quam bene quam subito quantum vaesana leuarat\n\
    50\nGratia, contriuit Caesaris ira caput!)\n \nEt modo Bodleias congesta uolumina gazas,\n\
     \nRufe tuis pariles, vel Philadelphe tuis,\n \nPulpita Lutetijs tam nil debentia capsis,\n\
     \nQuam Vaticano proxima Roma tuo;\n55\nQuaeque superba nouo stringens laquearia crusto\n\
     \nPergula Bodleiam poscit et ipsa manum.\n \nEt modo lustranti tot in illo lucida coelo\n\
     \nSidera, tot limo de potiore viros;\n \nIllustres animas, deductos aethere ciues,\n60\n\
    Reddendum stellis (tarda sit hora) genus,\n \nPalladij Mystas, quorum se tota reclusit,\n\
     \nTota sinum votis Virgo-virago dedit;\n \nQuorum si totidem tollas oracula linguas,\n\
     \nIntuitus quiddam quo doceamur habet:\n65\nEt modo Woodstochios peragranti mente recessus,\n\
     \nEt loca Virgineo carcere nota nimis,\n \nHeu! indigna tamen, (quis enim te vincula Minos,\n\
     \nQuis te diua ferat Elisabetha pati;\n \nVt tulerit Soror, illa Soror, nisi fata vetassent,\n\
    70\nNon male supplicijs credita digna tuis?)\n \nDenique nunc vicina uagos per caedua saltus,\n\
     \nNunc Vada peruecto, nunc iuga summa, mihi,\n \nOxonijs obuersanti per somnia cliuis,\n\
     \nOxonij pleno quantus ubique feror,\n75\nQuis plateae turbas, subigentes saxa couinos\n\
     \nObjiciat, Rhedas, plaustra, pilenta, trahas,\n \nCalcar agasonis, gemitum obrudentis\
    \ aselli,\n \nHinnitum stabulo profugientis equae.\n \nCausidicûm turmas, spumantes jura\
    \ patronos,\t+\n\n80\nEffusa in pauidos nomina dura vades;\n \nChrysidis ante fores extinctâ\
    \ cum face carmen,\n \nAnte diem surdas Chrysidis ante fores;\n \nImportuna popinales in\
    \ prandia bombos,\n \nFercula clamores singula nacta suos;\n85\nCompita pestiferis passim\
    \ consepta cloacis,\n \nFusa per angustas vasa pudenda vias;\n \nContiguas quoquo versum\
    \ quot tecta, tabernas,\n \nMurmura, stridorem, sibila, flagra, minas?\n \nQuis populi phaleras,\
    \ torto uelaria bysso,\n90\nPocula de Tuscis gemmea facta scyphis,\n \nInterfusa per augustas\
    \ aulaea fenestras,\n \nIamque graues auro non elephante toros,\n \nBalsama, pastillos,\
    \ stacten, diapasmata, fumos,\n \nCinnama, odoratas, Persica jura, dapes.\n95\nCoccina,\
    \ pelliceas, strictos adamante capillos,\n \nEt vario semper more, colore, peplum?\n \n\
    Quis rerum salebras, ciuiles jurgia spinas,\n \nAurea perpetui semina dissidij,\n \nIndigno\
    \ Batauis commissos Marte Britannos,\n100\nIn sua fraternas signa reuersa manus,\n \nPraelia\
    \ retrorso longe contermina Gangi,\n \nEoö tristes litore naumachias,\n \nEt piper et palmas,\
    \ et adusto cinnama libro,\n \nEt laser, et calidas, ignea pruna, nuces?\n105\nSingula certatim,\
    \ nec iniquâ lance pependi,\n \nMulta nec aetatem non subiere meam;\n \nAetatem, nisi uana\
    \ fides, cui non male rerum\n \nExacuant iuuenem splendida quaeque sitim,\n \nOxonii fontes,\
    \ sic vos tamen una videndi\n110\nDecollet nullo spes rediuiua die,\n \nSic modicos inter\
    \ Patriae meruisse poëtas\n \nNotus, abhinc nullo, nec nouus, ore legar,\n \nNi vestris\
    \ habitare jugis, ni vestra supremos\n \nAd Vada praetulerim consenuisse dies,\n115\nLassa\
    \ super vestro componere tempora musco,\n \nEsse soporiferas murmura vestra dapes;\t+\n\n\
    Nesciri Mundo, Mundum nescire; latere\n \nPerpetuum instabiles, turbida fata, vices;\n \n\
    Me quoque qua fas est; nec quas collegerit angi\n120\nQuando resoluendas quisque Cometa\
    \ minas;\n \nQuid moueant Reges; quid ab Hesperio Hymenaeo\n \nSidera portendant hinc spei\
    \ et inde metus;\n \nQuatenus esse nouerca suos, sua viscera, ciues\n \nPerget, et insanum\
    \ Gallia posse nefas;\n125\nSummane inabrupto ferient impune uolatu\n \nSidere Pannoniae\
    \ signa gemella Ducum\n \nVictrices Aquilae, nec erit cui longa superbi\n \nProsperitas\
    \ môrit nominis inuidiam,\n \nVel, patrio procul orbe, alieno proxima Regum\n130\nPosteritas\
    \ exul jussa latere solo;\n \nVllane pacato post tot discrimina Belgae\n \nLuxerit haud\
    \ socio sparsa cruore dies,\n \nAn Batauas iterum, tam culta noualia, ripas\n \nBarbarus\
    \ infando Marte reuiset Iber,\n135\nEt lacrymis iterum et sanie turbatior ibit\n \nRhenus,\
    \ et infames deuehet ater aquas.\n \nSed uirides uariare toros, prosternier umbris,\n \n\
    Languida fragranti condere membra thymo,\n \nHic uiolas amplecti, hic perpetuos Amaranthos,\n\
    140\nHic crocon, exuuias hic Hyacinthe tuas:\n \nHic Satyros Dryadesque et alacria numina\
    \ Faunos\n \nConcutere ad Batauam, qua patet umbra, fidem:\n \nSecuros inhumare dies, destertere\
    \ noctes,\n \nSidera Phoebaeae nectere sera faci;\n145\nOtia deglutire: horum si largior\
    \ olim\n \nSuaserit alternas copia delicias,\n \nTum tua, tum vero Bodlaee in fercula ferri,\n\
     \nAethereos animi, mella meraca, cibos;\n \nAmbrosiam saecli, monumenta tot ultima tecum\n\
    150\nPeruicturorum saecula semideûm,\n \nPalladios, totidem cerebrorum semina, partus,\n\
     \nMille sui versos in simulacra viros.\n \nHeu! mea continuis aeternum saucia plagis\n\
     \nBelgium, et aerumnis nunc quoque strata nouis,\n155\nSi bene natales quisquam contemnere\
    \ cunas\t+\n\n \nSustinet, et patriae vix memor esse suae,\n \nHac Batauas mercede queam\
    \ contemnere fines,\n \nHac patriae ualeam vix memor esse meae.\n \nSed pudor hoc et fata\
    \ vetant; crudelia fata,\n160\nIngenuus, pueri gloria prima, pudor;\n \nIste domum vocat,\
    \ illa foris impune morari\n \nEt placido Batauum claudier orbe vetant,\n \nDum totus furit\
    \ ungue Leo, dum proximus ardet\n \nGuelder, et ancipiti sternitur ense Brabas.\n165\nAudi\
    \ Brutiadum Pater, audi, maxime Regum,\n \nImproperant longas fata pudorque moras;\n \n\
    Si satis Hesperios imbelli Marte cachinnos\n \nMouimus, et calami strinximus arma satis,\n\
     \nSolue tuo Belgas Tamisi, post pene quot anno\n170\nConstituit menses Romulus ire suo;\n\
     \nPoscimur altrouersum. et, quae nunc nubila nigrent,\n \nExulibus miserâ non uacat esse\
    \ domo.\n \nOxoniae valles, en quam discordia votis\n \nObuia conueniunt undique vota meis;\n\
    175\nQuam tristes Patriae simul aspectare ruinas\n \nEminus, et ciui non datur esse pio.\n\
     \nAuehor, opto, tremo, feror in contraria, findor,\n \nQuo decet ire piget; quod libet\
    \ esse, vetor;\n \nBellorum pacisque Dij laurique potentes\n180\nOmnis in hoc unum turba\
    \ voluta caput.\n \nArma citant, pietas urget, spes, vota reclamant,\n \nPar agit in partes\
    \ ardor utrimque pares;\n \nPraeualeat pietas, fuge spes, ignoscite Musae\n \nVestra minus\
    \ quassae gaudia mentis erunt.\n \nLondini. 15o. Cal. Octob. (17 Sept.)1)."
- titel: Muyden, ick kom
  dichter: Constantijn Huygens sr.
  datum: '1623'
  taal: Nederlands
  bron: Huygens 1892, 239-282
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0018.php
  tekst: "Muyden, ick kom, hertgunt mij de gunst die 'ck langhe geleden\n \nVan uw' beleefden\
    \ Heer, van uw' Heerinne genoot.\n \nHad ick van harten verhardt hun weldaet konnen vergeten,\n\
     \nHadd' ick, als sonder verdienst, sonder gevoelen geweest,\n5\nGhij soudt buyten de vrees\
    \ en uw meester buyten 't gevaer sijn,\n \nBeij vande selve ongenucht, beyde van 'tselve\
    \ verdriet,\t\n\nBey vande sorgh, en beij vande pijn, en bey vande quelling,\n \nBey vande\
    \ moeyt die V bey met mijn genaken genaeckt.\n \nMaer hun onthael was te soet; en, moet\
    \ ick 't nauwste bekennen,\n10\n'Kwaer met de toespijs alleen sonder hun spijse verleydt."
- titel: Op een’ mis-luckte Muydsche reyse, vermits het afwesen des heeren drossarts Hooft
  dichter: Constantijn Huygens sr.
  datum: juni 1623
  taal: Nederlands
  bron: Huygens 1892, 239-282
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0018.php
  tekst: "heeren drossarts Hooft1)+.\n \nMuyder Slot, onthoofde Romp,\n \nZedert V de glimp\
    \ ontglomp,\n \nZedert ghij de stercke stralen\n \nWestelijck saecht van V dalen\n5\nVan\
    \ het Sonne-lijcke Hooft\n \nDat de sterckste Sterren dooft;\n \nStomme Steen, bedaeghde\
    \ muren,\n \nHebt ghij vande suijcker-uren,\n \nVande halve honich-nacht\n10\nNoch een schemerigh\
    \ gedacht,\n \nDie ick, minste vanhet gilde,\n \nBinnen uw' bepalingh spilde,\n \nDoe het\
    \ Sonn-rad om sijn ass\n \nDrijmael buijtlens t' achter was;\n15\nDelft in uw' bedolven\
    \ boghen\n \nDese weijnigh' adem-toghen\n \nDie mijn half-gebelght gemoet\n \nOnder V betrouwen\
    \ moet:\n \nEn soo ras ghij weer 't gereutel\n20\nSult vernemen vanden Sleutel\n \nDaer\
    \ uw' Vrij en Veijligheijt\n \nOnder is te pand geleijt,\n \nSeght hem die hem in 'tbewint\
    \ heeft\n \nDat hij bet en bet bemint leeft\n25\nVande waerdelooste Vrundt\n \nDie bij emmer\
    \ heeft begunt;\n \nDat die zess en zoo veel weken\n \nHeeft gehongert nae sijn spreecken,\n\
     \nSints hij, deser zijde 't Natt,\n30\nHollands oever jongst betradt;\n \nDat hy dien geswollen\
    \ ijver\n \nDocht te losen in een' Vijver\n \nVan genietens volle vreucht,\t\n\nNaer hem\
    \ d' Amstelandsche jeught\n35\nMet het moeijelycke melcken\n \nVan haer opgedrongen kelcken\n\
     \nMoed gepijnight, moed gequelt,\n \nVrij en vredich had gestelt:\n \nDat hij onder dat\
    \ vertrouwen,\n40\nSonder achterdencks berouwen,\n \nVan het honck geweken is\n \nDaer hij\
    \ eerst gebleecken is,\n \nDaer hij, boven 't aengeboren\n \nBlinde Vaderlandts bekooren,\n\
    45\nEn dat kinderlijck gewoon,\n \nAller schoonheyt schoonste schoon,\n \nAller Hagen soetst\
    \ behagen,\n \nAller wagens dichtsten Wagen,\n \nAller Lanen liefste Laen\n50\nWaerdeloos\
    \ heeft laten staen;\n \nGragher nae de ziele-spijsen\n \nVan sijn tuchtich onderwijsen\n\
     \nDan becommert metten toij\n \nVan het onnutt Haeghsche moij.\n55\nDoe hij nu sijn' pijl\
    \ sach staken\n \nEer hij doel-wit kon genaken,\n \nDoe hij nu sijn afscheijt las\n \nEer\
    \ hij half ten ancker was,\n \nDatmen hem sijn ooren-lellen\n60\nOp sijn' schouders heeft\
    \ sien vellen,\n \nEven als de Droomer placht\n \nDie sijn slaperigh gedacht\n \nMet de\
    \ swarte nacht-pinceelen\n \nHeeft Paleijsen, heeft Juweelen,\n65\nHeeft een onvertelbaer\
    \ Geld\n \nOpgeschildert, opgetelt;\n \nTot hij endelijck, de knoopen\n \nVan sijn mijmering\
    \ ontkroopen\n \nDoor de venster van sijn oogh,\n70\nVindt sich van dat blijde hoogh\n \n\
    Inde droeffelijckste dallen\n \nVan vergiste vreucht gevallen,\n \nOngeluckigh des alleen\n\
     \nDat hij korts geluckigh scheen.\n75\nGrauw gebouw, vereewde Wallen,\n \nSoo en moet ghij\
    \ nemmer vallen,\n \nSoo en moet ghij nemmer sien\t+\n[krit] vs. 36 opgedrongen K.a.: opgedroncken\n\
    [p. 305]\t\n \n+\n \nDie Oragnen tegendien',\n \nKluijstert dese klamme klachten\n80\nTot\
    \ ghij wederom uw' Nachten\n \nDaghen sult geworden sien;\n \nMogelijcken kon 'tgeschien\n\
     \nDat sij onder uijt uw' kelder\n \nDonderlijck, soo holl als helder,\n85\nVoor het voorhooft\
    \ mochten slaen\n \nDat vw Hooft-Heer heeft gelaen;\n \nMog'lijck off s' uyt sijn bewegen\n\
     \nYet medoogentlijcks verkreghen,\n \nMog'lijck off s' hem seggen dêen,\n90\nOnverdiende\
    \ blauwe scheen\n \n'Kben onschuldich aen vw' buijlen;\n \nEn dat huijlen en dat pruijlen,\n\
     \nEn dat hagelijck beclach,\n \nZal ick noch een' witter dach\n95\nMet een heuchelijck\
    \ onthalen,\n \nAchterstell en all, betalen.\n \nHag. Iunio1)."
- titel: Behouden reis, naer Engeland door den heere Drossart Hooft, aen mij
  dichter: P.C. Hooft (1581-1647)
  aan: Constantijn Huygens sr,
  datum: januari 1621
  taal: Nederlands
  bron: Huygens 1892, 197-239
  link: https://dbnl.org/tekst/huyg001jawo09_01/huyg001jawo09_01_0016.php
  tekst: 'Behouden reis, naer Engeland door den heere Drossart Hooft, aen mij

     

    Trompetter van Neptuin heb jck op V een beê?

     

    Rondt met de wanghen, en te wercke leght V longhen;

     

    Op dat de stijven aem ten hooren uyt-gewronghen

     

    Doe luistren weer en windt: En kundight over zee,

    5

    Wt uwes Conincx naem, soo trouwe vaste vreê,

     

    Als wordt geviert wanneer d''Ysvoghel js in''t jonghen.

     

    Syn Volck, Oost uytgeseidt, houde Aeol al bedwonghen,

     

    Soo lang tot Huighens heb beseilt gewenschte reê.

     

    Oft draelt ghij en wilt eerst V meester Oorlof vraghen?

    10

    Geen noodt oock. Schipbreuck can Arion niet vertzaghen:

     

    Dien de Dolfijn, als ''t nauwt, moet dienen tot een'' schuyt.

     

    Syn sang sal baren bats, en luytruftighe buyen

     

    Licht, tegen eighen aerdt van tochten woest, opruyen;

     

    En maken zeedigh zee en stormen met syn Luyt.

     

    Omnibus idem.'
