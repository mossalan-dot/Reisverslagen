- beschrijving: Rapport van de ambassadeurs François van Aerssen van Sommelsdijk, Diederick
    Bas en Hendrik van Tuyll van Serooskerken wegens hun zending naar Engeland in verband met
    onderhandelingen over de walvisvaart, de Oost-Indische Compagnie, de West-Indische Compagnie,
    de koning van Bohemen en vernieuwing van de alliantie met de Republiek, 1621 december 3
    - 1623 februari 12
