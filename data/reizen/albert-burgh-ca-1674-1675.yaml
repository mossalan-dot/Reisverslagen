  tekst: "As I was leaving my country I promised to write to you if anything worth mentioning\
    \ happened on the trip. Something of the greatest importance has happened, and I am keeping\
    \ my promise by letting you know that by God’s infinite mercy I have been brought back into\
    \ the Catholic church, as a member. You’ll be able to understand in more detail how this\
    \ happened from what I have written to Professor Craenen at ·the University of Leiden·;\
    \ here I shall add a few words that concern your welfare.\nThe more I have admired the subtlety\
    \ and acuteness of your intelligence, the more I now lament and weep for you. Although you\
    \ are a most intelligent man and have received a mind endowed by God with excellent gifts,\
    \ although you love the truth and are indeed eager for it, you have let yourself be led\
    \ astray and deceived by that wretched and very proud Prince of wicked spirits. What is\
    \ your whole philosophy but a mere illusion and fable? Yet you commit to it your peace of\
    \ mind in this life and the eternal salvation of your soul.\n\nSee what a wretched foundation\
    \ all your ideas rest on! You presume that you have finally discovered the true philos-\
    \ ophy. How do you know that your philosophy is the best of all that ever were, are, or\
    \ will be taught? Leaving the future out of it, have you examined all the ancient and modern\
    \ philosophies that are taught here and in India and all over\nthe planet? And even if you\
    \ have examined them all properly, how do you know that you have chosen the best?\nYou will\
    \ say: ‘My philosophy agrees with right reason, and the others are contrary to it.’ But\
    \ all the other philosophers— except for your disciples—disagree with you; with the same\
    \ right they proclaim the same thing about themselves and their philosophy as you do about\
    \ yours; and they accuse you of falsity and error as you do them. So if the truth of your\
    \ philosophy is to shine forth, you must offer reasons that don’t help the other philosophies\
    \ and bring support only to yours—or else you must admit that your philosophy is as uncertain\
    \ and trifling as all the others.\n\nBut now, confining myself to your book (to which you\
    \ have given that impious title ·Treatise on Theology and Politics·), and mixing together\
    \ your philosophy with your theology, I proceed further. (For you yourself mix them together,\
    \ though with devilish cunning you pretend that one is separate from the other and that\
    \ they have different principles.)\nPerhaps you will say: ‘The others haven’t read holy\
    \ Scripture as often as I have, and I prove my opinions from Scripture itself, the recognition\
    \ of whose authority makes the difference between Christians and everyone else in the world.’\
    \ But how? ‘I explain holy Scripture by applying the clear passages to the more obscure\
    \ ones, and from that interpretation I compose my doctrines, or confirm doctrines that I\
    \ have previously thought up for myself.’\nBut think about what you are saying. How do you\
    \ know that you are making this application properly? and that the application, ·even if\
    \ it is· rightly made, is sufficient for the interpretation of holy Scripture? and thus\
    \ that you are establishing your interpretation of holy Scripture properly? Especially when\
    \ the Catholics say, rightly, that the whole word of God hasn’t been given to us in writings,\
    \ and thus that holy Scripture can’t be explained from holy Scripture alone—by one man or\
    \ even by the Church itself, which is the only ·legitimate· interpreter of holy Scripture.\
    \ We must also consult the apostolic traditions, as is •proved from holy Scripture itself\
    \ and the testimony of the holy fathers, and is •equally in agreement with right reason\
    \ and experience. So given that that principle of yours is quite false and leads to ruin,\
    \ where does that leave your teaching, which is wholly built on and dependent on this false\
    \ foundation?\nSo if you believe in Christ crucified,\n•recognise that wicked heresy of\
    \ yours,\n•recover from the perversion of your nature, and •be reconciled with the Church.\n\
    \nYou support your heresies in the same way that all heretics have done, do now, and will\
    \ do in leaving God’s Church— namely by appealing to holy Scripture alone. Don’t flat- ter\
    \ yourself that perhaps the Calvinists (the so-called ‘Re- formed’), the Lutherans, the\
    \ Mennonites, the Socinians, etc. can’t refute your doctrine. They are all just as wretched\
    \ as you are, sitting with you in the shadow of death.\n\nBut if you don’t believe in Christ,\
    \ you are more wretched than I can say—though the remedy is easy:\n•Recover from your sins,\
    \ realise the fatal arrogance of your wretched and insane reasoning.\n\nYou don’t believe\
    \ in Christ. Why? You will say: ‘Because the teaching and life of Christ don’t agree with\
    \ my principles, any more than the teaching of Christians about Christ agrees with my teaching.’\
    \ Are you then so bold that you think you are greater than all those who have ever risen\
    \ up in the State or in God’s Church—greater than the patriarchs, the prophets, the apostles,\
    \ the martyrs, the doctors, the confessors, and the virgins, greater than innumerable saints,\
    \ greater indeed (blasphemously) than the Lord Jesus Christ himself? Do you alone surpass\
    \ them in teaching, in your way of living, in everything? Will you—wretched little man,\
    \ base little earthworm, indeed food for worms—exult that you are better than the incarnate,\
    \ infinite wisdom of the eternal Father? Do you alone reckon yourself wiser and greater\
    \ than all those who have ever been in God’s Church since the beginning of the world, and\
    \ who have believed, or even now believe, that Christ will come or has already come? What\
    \ basis is there for this rash, insane, deplorable, and accursed arrogance of yours?\n\n\
    You deny that Christ, the son of the living God, the word of the eternal wisdom of the Father,\
    \ was made manifest in the flesh, suffered for mankind, and was crucified. Why? Because\
    \ this doesn’t agree with your principles. But even if your (false, rash, absurd) principles\
    \ were true and you built everything on them, you still couldn’t account for everything\
    \ that has happened or is happening in the world. Nor could you boldly assert that when\
    \ something seemed contrary to those principles it must be really impossible or false. For\
    \ there are countless things which, even if certainty is sometimes possible in natural things,\
    \ you won’t be able to explain at all. You won’t even be able to remove the manifest contradiction\
    \ between such phenomena and your explanations of other things that you take to be most\
    \ certain. You will not explain completely from your principles any of the events brought\
    \ about in witchcraft,....of which I personally have seen examples. . . .\n\nEven if some\
    \ of your ideas do agree adequately with the essences of the things whose ideas they are,\
    \ what will you be able to judge about the essences of all things? For you can never be\
    \ confident about whether the ideas of all created things are possessed in the human mind\
    \ naturally, or whether many if not all of them are produced in it by •external objects\
    \ and also by •the suggestion of good or evil spirits and •an evident divine revelation.\
    \ Consider these:\n •a divining rod for detecting metals and underground water;\n•the stone\
    \ the alchemists seek [for turning lead into gold]; •the power of words and symbols ·in\
    \ charms and\nincantations·;\n•the apparitions of various kinds of spirits, good and\nevil,\
    \ and their powers, knowledge and activities;\n•the reappearance of plants and flowers in\
    \ glass flasks\nafter they have been burned;\n•sirens;\n•the gnomes that men say often appear\
    \ in mines; •the antipathies and sympathies of many things; \n•the impenetrability of the\
    \ human body.\n\nHow will you be able to define these things precisely and establish for\
    \ certain whether they can actually exist in nature? I’m asking how you can do this from\
    \ your principles, without consulting the testimonies of other men or empirical evidence\
    \ (not to mention subjecting your judgment to God’s omnipotence).\n\nNo, my philosopher,\
    \ you couldn’t determine anything about these things, even if your native intelligence were\
    \ a thousand times more subtle and acute than it is. And if you trust your own unaided intellect\
    \ in judging these and similar matters, certainly you are already thinking in the same way\
    \ about things that are unknown to you, or that you haven’t experienced. You regard them\
    \ as impossible, though really they ought to seem to you only uncertain until you have been\
    \ convinced by the testimony of a great many credible witnesses.\n\nJulius Caesar, I imagine,\
    \ would have judged the same way, if someone had said to him that a powder can be made,\
    \ and will become common in later ages, whose power is so great that it makes castles, whole\
    \ cities, even mountains fly up into the air. . . . He wouldn’t have believed this man,\
    \ and\nwould have mocked him with hearty laughter, as wanting to persuade him of something\
    \ contrary to his judgement and experience and to the sum total of military science.\n\n\
    But let’s get back on track. . . . What rash judgements will you make about the awe-inspiring\
    \ mysteries of the life and passion of Christ, which even the Catholics who teach them warn\
    \ are incomprehensible? What trifling, use- less raving will you babble about the countless\
    \ miracles and signs which after Christ’s ascension his apostles and disciples—and subsequently\
    \ several thousand saints—made known in testimony to. . . .the truth of the Catholic faith,\
    \ and which. . . .even in our days throughout the earth? And since you can’t contradict\
    \ these things, why continue to cry out against it? Give in, recover from your errors and\
    \ sins, clothe yourself in humility, and be born again.\n\nBut I should like to get down\
    \ to the truth of what has happened, which is the foundation of the Christian religion.\n\
    (1) Think of the power of the consensus of so many tens of thousands of men—thousands of\
    \ whom have far surpassed you in learning, in refined solidity, and in perfection of life—who\
    \ unanimously declare that\nChrist, the incarnate son of the living God, suffered, was crucified,\
    \ and died for the sins of the human race; was resurrected, transfigured, and reigns in\
    \ the heavens as God with the eternal Father, in unity with the holy Spirit,\nand all the\
    \ other things related to this—the countless mira- cles that have been done in God’s church\
    \ by the same Lord Jesus and then in his name by the apostles and the other saints,. . .\
    \ .miracles that not only elude men’s grasp but also contradict common sense, miracles that\
    \ still occur today. How will you dare to deny. . . .all this?\n[Burgh now likens Spinoza’s\
    \ scepticism towards the gospel narratives with the crazy view that Julius Caesar never\
    \ existed, that China was never occupied by the Tartars, or that Constantinople wasn’t the\
    \ capital of the Turkish Empire. Anyone who accepted any of these, in face of all the evidence,\
    \ would be regarded as mad.]\n\n(2) Consider the fact that God’s church has been been spreading\
    \ without interruption since the beginning of the world, and continues unchanged and solid;\
    \ whereas each of the other religions, whether pagan or heretical, had a beginning after\
    \ the world began, and some have also ended. The same holds for the monarchs of kingdoms\
    \ and the opinions of any philosophers!\n\n(3) Consider that through the coming of Christ\
    \ in the flesh, God’s church was transformed from the worship of the Old Testament to that\
    \ of the New, founded by Christ. . . .and then spread by the apostles and their disciples\
    \ and suc- cessors. These were by the world’s standard unlearned men, yet they confounded\
    \ all the philosophers [meaning: beat them in arguments], although they taught the Christian\
    \ doctrine, which is contrary to common sense and exceeds and transcends all human reasoning.\
    \ They were by the world’s standards undistinguished low-class men who got no help from\
    \ the power of kings and earthly princes, and were indeed persecuted by them with every\
    \ kind of tribulation, and suffered all the other misfortunes of the world. The most powerful\
    \ Roman emperors tried to. . . .crush their work, killing as many Christians as they could.\
    \ . . ., yet the more they did this the more Christianity increased.\n\nConsider that in\
    \ this way Christ’s church quickly spread throughout the world, until eventually the Roman\
    \ emperor himself was converted to the Christian faith along with the kings and princes\
    \ of Europe, after which the Church hierarchy increased its power to such an extent that\
    \ today it is a thing of wonder. All this was brought about through love, gentleness, patience,\
    \ trust in God, and all the other\nChristian virtues (not by the din of warfare, the force\
    \ of large armies, and the devastation of territories, as worldly princes extend their boundaries),\
    \ so that—as Christ promised—even the gates of Hell won’t prevail against the Church.\n\n\
    Weigh also here the terrible and unspeakably severe pun- ishment by which the Jews were\
    \ forced into utter wretched- ness and disaster because they were the authors of Christ’s\
    \ crucifixion. Read the histories of all times, and think about them thoroughly, and you\
    \ won’t find that anything similar has happened to any other society, not even in dreams.\n\
    \n(4) Notice the properties that are included in the essence of the Catholic church and\
    \ ·therefore· are really inseparable from it, namely:\n•Antiquity: having replaced the Jewish\
    \ religion, which at that time was the true religion, it counts its beginning from the time\
    \ of Christ, sixteen and a half centuries ago. Through that period it traces an unbroken\
    \ line of pastors, through which it has divine, pure and uncorrupted sacred books as well\
    \ as an equally certain and unstained tradition of God’s unwritten word.\n•Immutability,\
    \ by which its doctrine and administration of the sacraments are preserved inviolate, as\
    \ they were estab- lished by Christ himself and the apostles, losing none of their power.\n\
    •Infallibility, by which the church determines and decides everything relating to the faith\
    \ with the utmost authority, security and truth, according to •the power bestowed on it\
    \ by Christ for this purpose and •the direction of the Holy Spirit, whose bride the Church\
    \ is.\n•Unreformability: it can’t be corrupted or deceived, and can’t deceive; so obviously\
    \ it never needs reform.\n•Unity, by which all its members believe the same thing, teach\
    \ the same thing regarding faith, have one and the same\n96\n\nCorrespondence Baruch Spinoza\
    \ 59–84: 1675–1676\n altar and all the sacraments in common, and work together towards a\
    \ single goal, obeying one another.\n•No soul is separable from it, under any pretext whatever,\
    \ without at once incurring eternal damnation, unless before death it is reunited with the\
    \ church through repentance (from which it is evident that all heresies have departed from\
    \ it, whereas it always remains the same as itself, constant, steadfast, and stable, as\
    \ built on a Rock);\n•Its tremendous extent, as it visibly spreads itself throughout the\
    \ whole world. The same is not true of any other society— schismatic, heretic, pagan—or\
    \ of any other political regime or philosophical doctrine, because none of those do or can\
    \ have the cited properties of the Catholic church.\n•Perpetuity to the end of the world,\
    \ concerning which the Way, the Truth and the Life himself [i.e. Jesus Christ] has made\
    \ the church confident, and which is also manifestly demon- strated by the experience of\
    \ all the properties mentioned, promised and given to it likewise by Christ himself, through\
    \ the Holy Spirit.\n(5) Consider that the admirable order by which the church, such an immense\
    \ body, is directed and governed indicates plainly that it depends very particularly on\
    \ God’s providence and that its administration is arranged, pro- tected and directed amazingly\
    \ by the Holy Spirit (just as the harmony seen in all the things in this universe indicates\
    \ the omnipotence, wisdom and infinite providence that has created and still preserves everything).\
    \ In no other society is such an excellent and strict order preserved without interruption.\n\
    (6) Reflect on the following. Countless Catholics of each sex, many of whom are still alive\
    \ today (I have known some of them), have lived wonderful and most holy lives, and have.\
    \ . . .performed many miracles in the name of Jesus\nChrist; every day many people undergo\
    \ a sudden conversion from a bad life to a better, truly Christian and holy life; the holier\
    \ and more perfect Catholics are, the humbler they are, the more they consider themselves\
    \ unworthy. . . .; even the greatest sinners retain a proper respect for sacred things,\
    \ confess their own wickedness, accuse their own vices and imperfections, and wish to be\
    \ freed from them. . . . So it can be said that the most perfect heretic or philosopher\
    \ who ever lived hardly deserves to be considered among the most imperfect Catholics. This\
    \ clearly shows that Catholic teaching is the wisest, and wonderful in its profundity—in\
    \ a word, that it surpasses all the other teachings in the world because it makes men better\
    \ than those of any other society, teaches them the secure path to peace of mind in this\
    \ life, and delivers the eternal salvation of the soul to be achieved after this.\n(7) Reflect\
    \ on the public confession of many heretics hardened in obstinacy, and of the most serious\
    \ philosophers, that after receiving the Catholic faith they at last realised that they\
    \ had been wretched, blind, ignorant—indeed foolish and mad—when in their pride and arrogance\
    \ they falsely persuaded themselves that they were elevated above every- one else in teaching,\
    \ learning, and perfection of life. Some of these went on to lead a holy life, leaving behind\
    \ the memory of countless miracles. Some faced up to martyrdom cheerfully and with the greatest\
    \ rejoicing. Some also (among them St. Augustine) became the subtlest, deepest, wisest and\
    \ therefore most useful doctors of the church. . . .\n(8) Finally, reflect on the wretched\
    \ and restless life of the atheists. Although sometimes they manifest great cheerful- ness\
    \ and want to seem to be leading a pleasant life with great internal peace of mind, look\
    \ at their unfortunate and horrible deaths. I myself have seen some examples of this, and\
    \ I know of countless examples, from the accounts of\n others and from history. Learn from\
    \ the example of these men to be wise while there is time.\nI hope you see from this how\
    \ rashly you are committing yourself to the opinions of your brain. For if Christ is the\
    \ true God and is at the same time man, as is most certain, see what you are reduced to!\
    \ For if you persevere in your abominable errors and most grievous sins, what else can you\
    \ expect but eternal damnation? Reflect on how horrible that is. How little reason you have\
    \ to mock the whole world (except for your wretched disciples)! How foolishly proud you\
    \ are, puffed up with the thought of the excellence of your intelligence and with wonder\
    \ at your vain, false and impious teaching! How shamefully you make yourself more wretched\
    \ than the beasts by denying yourself freedom of the will! If you don’t actually experience\
    \ this freedom, how can you deceive yourself by thinking that you are worthy of the greatest\
    \ praise, and indeed, of the most exact imitation?. . . .\nCome to your senses, philosophic\
    \ man. Recognise that what you deem foolishness is wise and what you deem wisdom is mad.\
    \ Go from pride to humility and you will be healed. Worship Christ in the most holy Trinity,\
    \ so that he may have mercy on your wretchedness, and receive you. Read the holy fathers\
    \ and the doctors of the Church, and let them instruct you about what you need to do. .\
    \ . .to have eternal life. Consult Catholic men who have been thoroughly instructed in their\
    \ faith and are living a good life; they will tell you many things you never knew, things\
    \ that will astound you.\n\nI am writing this letter with a truly Christian intention: first,\
    \ that you may know the love I have for you, although you are a pagan; and second, that\
    \ I might call upon you not to persist in corrupting others too.\n\nSo I conclude with this:\
    \ God wants to snatch your soul from eternal damnation, provided you are willing. Do not\n\
    hesitate to obey the Lord, who has called you so often through others, and now calls you\
    \ again, perhaps for the last time, through me. Having attained this grace by the inexpressible\
    \ mercy of God himself, I pray that you will attain it also. Do not refuse. If you don’t\
    \ listen to God now when he is calling you, his wrath will be inflamed against you and you’ll\
    \ risk being left behind by his •infinite mercy and becoming a wretched victim of •divine\
    \ justice, which consumes all things in its wrath. . . ."
