  tekst: 'I could hardly believe it when others told me, but now I have it from your letter:
    you have not only joined the Roman church but have become a vehement defender of it, and
    have already learned to revile your opponents and rage against them impudently and aggressively.


    I hadn’t intended to reply to your letter. I was certain that to restore you to yourself
    and your family you needed the passage of time more than you needed argument, not to mention
    other reasons that you approved in our conversation about Steno, whose footsteps you are
    now following. But friends who had had great hopes for you because of your natural ability
    pressed me •not to fail in the duty of a friend, •to think of what you recently were rather
    than of what you are now, and so on. So I have finally been persuaded to write you these
    few lines, asking you earnestly to be so kind as to read and weigh them fairly.

    Opponents of the Roman church usually relate the vices of the priests and popes, but I shan’t
    try in that way to turn you away from them. Those stories are often brought up maliciously,
    more to irritate than to instruct. I concede that the Roman church contains more men of
    great erudition and personal virtue than any other Christian church. (That’s because it
    has more members than any other Christian church, and therefore more men of every kind.)
    But if you haven’t lost your memory along with your reason, you can’t deny that in every
    church there are many honourable men who worship God with justice and loving-kindness. We
    know many men of this kind among the Lutherans, the Reformed, the Mennonites, and the Enthusiasts;
    and among others there are your own ·Protestant· ancestors, who in the time of the Duke
    of Alva suffered all kinds of torture for the sake of religion, with equal constancy and
    freedom of mind.


    So you ought to concede that holiness of life is not exclusive to the Roman church, but
    is common to all. And because we know by this—as I say with the apostle John (4:13)—that
    we remain in God, and God remains in us, it follows that whatever distinguishes the Roman
    church from the others is completely superfluous and thus has been established only by superstition.
    For as I have said, with John, the unique and most certain sign of the true universal faith
    is justice and loving kindness. They are the true fruits of the Holy Spirit; wherever they
    are present, Christ is really present; wherever they are absent, Christ is absent; for only
    by the spirit of Christ can we be led to the love of justice and loving kindness. If you
    had been willing to weigh these things rightly, you wouldn’t have lost yourself, and you
    wouldn’t have driven your parents, who are now lamenting your misfortune, into bitter grief.


    However, I return to your letter, in which first you lament that I let myself be led astray
    by the Prince of wicked spirits. Cheer up! and return to yourself. When you were in possession
    of your faculties, unless I’m mistaken, you worshipped an infinite God by whose power absolutely
    all things happen and are preserved. But now you are dreaming that •there’s a Prince, an
    enemy of God, who against God’s will leads astray and deceives most men (good ones are rare),
    and that •for that reason God hands these men over to this master of wicked acts to be tortured
    to eternity. So divine justice allows the Devil to deceive men with impunity, but the men
    the Devil has wretchedly deceived and led astray don’t go unpunished.


    Would these absurdities still have to be tolerated if you worshipped an infinite and eternal
    God, instead of that one. . . .? And you weep that I am wretched? And you call my philosophy,
    which you have never seen, a fable? Young man bereft of understanding, who has bewitched
    you into believing that ·in the Eucharist· you are eating that highest and eternal being
    and have him in your intestines?


    Yet you seem to want to use reason, and you ask me: ‘How do you know that your philosophy
    is the best of all that ever were, are, or will be taught?’ I can ask you the same thing,
    with far better right. For I don’t presume that I have discovered the best philosophy, but
    I know that I understand the true one. How do I know this? In the same way that you know
    the three angles of a triangle to be equal to two right angles. No-one will deny that this
    is enough—as long as his brain is healthy and he isn’t dreaming of foul spirits who fill
    us with false ideas that are like true ones. For the true is the indicator both of itself
    and of the false.

    But you, who presume that you have at last discovered the best religion—or rather the best
    men, to whom you have abandoned your credulity—how do you know that they are the best among
    all those who ever did, do, or ever will teach other religions? Have you examined all those
    religions, both ancient and modern, that are taught here and in India and everywhere throughout
    the globe? Even if you had examined them properly, ·I would still ask· how do you know you
    have chosen the best? since you cannot give any reason for your faith.


    You will say that you’re trusting in the internal testimony of the spirit of God, and that
    the others are led astray and deceived by the Prince of wicked spirits. But all those others
    will make the same boast about their teachings.


    As for what you add about the common agreement of many thousands of men, and about the uninterrupted
    suc- cession of the Church, etc.—that’s the same old song of the Pharisees [referring to
    the adherents of the rigidly ritualistic Judaism of his own time.] With no less confidence
    than the adherents of the Roman church, they display many thousands of witnesses who report
    •things they have heard as •things they have experienced, with as much stubbornness as the
    Roman witnesses. They trace their lineage all the way back to Adam, and they boast with
    equal arrogance that their church has spread to this day, and remains unchanged and genuine,
    in spite of the hostility of the pagans and the hatred of the Christians.


    They defend themselves most of all by their antiquity. They claim, unanimously, that their
    traditions were received from God himself, and that they alone preserve his written and
    unwritten word. No-one can deny that all heresies have left them, but that they have remained
    constant for thou- sands of years without any state compulsion, solely by the effectiveness
    of ·what I call· their superstition. The miracles they tell of are enough to weary a thousand
    babblers.


    What they are most proud of is that they count far more martyrs than any other nation, and
    that the number of those who have suffered for the faith they profess increases daily. This
    is not a fable. I myself know among others a certain Juda, known as ‘Juda the Faithful’
    [a Spanish nobleman who converted to Judaism] who in the midst of the flames, when he was
    already thought to be dead, began to sing the hymn ‘To thee, Lord, I offer my soul. . .
    ’, and in the middle of it he breathed his last.


    I grant that the organisation of the Roman church, which you praise so highly, is well-designed
    politically and prof- itable for many. I don’t believe there’s any order more suit- able
    for deceiving the people and repressing men’s minds— except for the Mahommedan church, which
    surpasses it by far because it has had no schism ever since it began. [Spinoza is clearly
    unaware of the division in Islam between the Sunnis and the Shiites, which began immediately
    after the death of Mohammed.—note by Curley]

    So if you make the calculation correctly, you’ll see that only your point (3) [on page 96]
    is in favour of the Christians: namely, that unlearned and base men were able to convert
    almost the whole world to the faith of Christ. This, though, supports not the Roman church
    but everyone who professes the name of Christ.


    Anyway, suppose that the reasons you cite do all favour only the Roman church, do you think
    you can use them to demonstrate mathematically the authority of that church? Of course you
    can’t; so why do you want me to believe that my demonstrations come from the Prince of wicked
    spirits while yours are inspired by God? Especially given that in becoming a slave of this
    Church you have (as your letter clearly shows) been guided less by the love of God than
    by the the sole cause of superstition, namely the fear of hell. Putting no trust in yourself,
    and relying solely on others whom many people condemn—is this your humility? Using reason,
    and trusting in this true word of God that is in the mind and can never be distorted or
    corrupted—is this my arrogance and pride?


    Away with this pernicious superstition! Recognise the reason God has given you, and cultivate
    it, unless you want to be considered one of the brute animals. Stop calling absurd errors
    ‘mysteries’, and don’t shamefully confuse •things that are unknown to us. . . .with •things
    that are demonstrated to be absurd, as are the terrifying secrets of this church. The more
    contrary these are to right reason, the more you believe they are simply out of our intellectual
    reach.


    The Treatise on Theology and Politics is based on the the- sis that Scripture must be explained
    only through Scripture. You fiercely announce that there are no reasons supporting this,
    and that it is false; but it’s not something that I merely supposed—I conclusively demonstrated
    it to be true or solidly grounded, especially in chapter 7 where rival views are also refuted.
    And see also what I demonstrated at the end of chapter 15. If you’re willing to attend to
    these things, and also to examine the histories of the church (of which I see that you are
    most ignorant) so as to see how falsely the Popes transmit many things, and by. . . .what
    tricks the Bishop of Rome had himself made Prince of the Church 600 years after the birth
    of Christ, I don’t doubt that you will at length recover. I heartily desire this for you.'
