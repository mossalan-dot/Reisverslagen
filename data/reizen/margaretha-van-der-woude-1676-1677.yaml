beschrijving: Reisde in 1676 en 1677 samen met haar vader, zus Elisabeth (1657-1698) en broer
  Johannes (º1658) naar Frans-Guyana, waar haar vader gouverneur zou worden. Overleed een dag
  na aankomst, waarschijnlijk aan een ziekte.
