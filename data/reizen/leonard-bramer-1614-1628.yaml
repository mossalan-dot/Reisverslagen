id: leonard-bramer-1614-1628
titel: Kunstenaarsreis naar Frankrijk en Italië
reizigers:
- leonard-bramer
reistype: educatiereis
jaren: 1614-1628
vertrek: '1614'
gebieden:
- Nederlandse Republiek
- Frankrijk
- Italië
beschrijving: Maakte in 1614 een kunstenaarsreis naar Frankrijk en Italië, waar hij onder andere
  Arras, Amiens, Parijs, Aix-en-Provence, Marseille, Genua, Livorno, Rome, Mantua en Venetië
  aandeed. Hij was een van de oprichters van de Bentvueghels en had de bijnaam ‘Nestelghat’.
  Kreeg in Italië ook de bijnaam ‘Leonardo della Notte’ vanwege zijn vele nachttaferelen.
