manuscript: carolus-casparus-neander-1680-1683-hs
beschrijving: Verslag van een educatiereis van Carolus Casparus Neander naar Frankrijk, Zwitserland
  en Italië als tutor van Gerard Horenken (1663-1712), heer van Dijksterhuis. Het verslag vangt
  aan met een reis van Groningen naar het westen van de Republiek, waar Neander lange tijd in
  Utrecht verbleef. Hij doorkruiste de Zuidelijke Nederlanden op weg naar Parijs. Hij bezocht
  het Loiregebied, waar hij achtenhalve maand in Angers verbleef. Hij trok zuidelijk naar Bordeaux,
  Nice en Marseille en trok vervolgens naar Lyon en Genève. Neander verbleef twee manden in
  Genève en trok vervolgens naar Italië, waar hij de westkust volgde naar Florence en Rome.
  Vanuit Rome maakte hij een uitstapje naar Napels. Hij keerde om en volgde de oostkust naar
  Ancona, Bologna en Venetië, waar hij een maand stilhield. Hij volgde dezelfde route terug
  naar Genève en na een verblijf van twee maanden trok hij door Zwitserland en Duitsland. Hij
  deed onderweg Straatsburg, Frankfurt en Keulen aan. Neander ging scheep in Brielle en arriveerde
  in Gravesend. Vanuit Londen maakte hij een uitstapje naar Oxford. Hij stak het Kanaal over
  tussen Dover en Calais en trok via de Zuidelijke Nederlanden terug naar Amsterdam en Groningen.
  Neander verbleef langere tijd in Utrecht (15 april-20 mei 1680; 12 juni-14 mei), Den Haag
  (26 mei-11 juni 1680; 28 augustus-16 september 1683), Parijs (26 mei-10 juli 1681); Saumur
  (20-26 juli), Angers (27 juli-28 april 1682), Nantes (29 april-4 mei), Lyon (27 juni-8 juli),
  Genève (10 juli-26 september; 4 maart-26 mei 1683), Rome (26 oktober-3 november 1682; 16 november-19
  december), Venetië (4 januari-8 februari 1683), Londen (11 juli-16 augustus) en Amsterdam
  (20-26 september).
