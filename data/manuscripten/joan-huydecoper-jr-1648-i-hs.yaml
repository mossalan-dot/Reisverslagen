beschrijving: "Ongedateerd eerste verslag van een educatiereis naar Zwitserland en Frankrijk\
  \ van Joan Huydecoper in 1648. De reis wordt beschreven van Genève tot Bordeaux. Huydecoper\
  \ reisde naar het zuiden en bezocht Grenoble, Orange en Montpellier en volgde vanaf Toulouse\
  \ de Garonne naar Bordeaux. \n\nHet eerste deel, van Amsterdam tot Genève, en de delen na\
  \ het bezoek aan Lyon zijn verloren gegaan."
