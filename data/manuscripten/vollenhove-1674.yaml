beschrijving: Verslag van een diplomatieke reis van Joannes Vollenhove (1631-1708) naar Londen
  in 1674 als predikant in het gezantschap van Coenraad van Beuningen (ca. 1622-93), Willem
  van Haren (1626-1708), Willem Adriaan van Nassau-Odijck (ca. 1632-1705) en Frederik baron
  van Reede tot Renswoude (ca. 1630-1715) en in het gezelschap van de edellieden Johannes
  Baptista Bartholotti (1644-1703, Gerardus Joannes Vossius (1646-1716) en Ludolphi, de secretarissen
  Abel Tassin d’Alonne (1646-1723) en Ezechiel Spanheim. De gezanten schreven een verbaal
  over de reis. Vollenhove ging scheep in Brielle en arriveerde in Gravesend. Hij verbleef
  langere tijd in Londen en bezocht meermaals Windsor. Het verslag eindigt in Londen.
