beschrijving: Verslag van een reis naar Frankrijk, Zwitserland en Duitsland in 1682. De anonymus
  had familie in Genève en bevond zich in de directe omgeving van de Friese stadhouder Hendrik
  Casimir II, prins van Nassau-Dietz. Hij reisde van Leeuwarden via de Zuidelijke Nederlanden
  naar Parijs. Vanaf Parijs trok hij naar Lyon en Genève, waar hij twee weken verbleef. Via
  Zwitserland en Duitsland keerde hij terug naar huis. Het verslag eindigt in Keulen.
