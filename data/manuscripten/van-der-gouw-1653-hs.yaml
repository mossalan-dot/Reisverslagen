beschrijving: Verslag van een reis van Van der Gouw naar Duitsland in 1653. De reis liep van
  Amsterdam via Gelre naar Duitsland, waar de reiziger Düsseldorf, Keulen en Spiers bezocht.
  Hij keerde via dezelfde weg terug. Van der Gouw verbleef langere tijd in Wesel (31 augustus-10
  september), Keulen (16-23 september; 2-8 november), Mainz (6-12 oktober), Worms (13-19 oktober),
  en Spiers (19-25 oktober).
