beschrijving: Ongepagineerd derde verslag van een educatiereis van Jacob van Foreest naar
  Frankrijk in 1660-61 in het gezelschap van Nanning van Loon. De reis liep van Toulouse naar
  Parijs, waar het verslag eindigt. Blijkens het bovengenoemde kasboek ging de reis door naar
  Rouen, Dieppe en Londen.
