beschrijving: Verslag van een diplomatieke reis van Adriaen Schagen naar Polen in 1656 in
  het gezantschap van Govert van Slingelandt (1623-90), Frederik van Dorp (1612-79), Pieter
  de Huybert (1622-95) en Johan Isbrandtsz (1621-1702). Schagen reisde per schip naar Hamburg
  en reisde via land naar Lübeck en Gdańsk. Hij keerde terug per schip via Kopenhagen.
