beschrijving: Verslag van een plezierreis per boot naar de Zuidelijke Nederlanden en Zeeland
  van Gerard Hinlopen in 1683 in het gezelschap van zijn echtgenote Margaretha Hooghtwoudt (1648-1684)
  en het gezin van Gerard van Tongen en Rutger Groot. De reis ging naar Goes en Vlissingen in
  Zeeland en Antwerpen en Brussel in de Zuidelijke Nederlanden.
