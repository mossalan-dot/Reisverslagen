titel_aanduiding: Rapport gedaen bijden heere van Sommelsdijck aende Hooge ende Mogende heeren
  Staten Generael der Vereenichde Nederlanden, den XI augusti 1620, van zijne legatie aende
  republycque van Venetien, vertrocken den 25 aprilis ende wedergekeert den 7 augusti.
