beschrijving: Verslag van een educatiereis van Nehemia Vegelin van Claerbergen naar de Zuidelijke
  Nederlanden, Frankrijk en Spanje in 1718-1719. Vegelin van Claerbergen reisde door de Zuidelijke
  Nederlanden naar Parijs, waar hij enkele maanden spendeerde. Hij reisde zuidelijk naar Spanje
  en bezocht Pamplona en Madrid. Hij keerde terug naar Frankrijk. De eerste band eindigt in
  Bayonne.
