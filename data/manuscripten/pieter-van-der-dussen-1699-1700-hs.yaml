beschrijving: Onvoltooid reisverslag van een educatiereis van de broers Jacob (1671-1728) en
  Pieter van der Dussen (1673-1726) naar Duitsland, Italië en Zwitserland in 1699-1700. De reis
  liep via de Rijn tot aan Frankfurt en vanaf daar oostwaarts tot aan Wenen. Na een bezoek aan
  die stad trokken de broers naar München en staken ze bij Innsbruck de Alpen over. In Italië
  bezochten zij Venetië en trokken zij tot aan Ancona langs de oostkust. Ze verbleven langere
  tijd in Rome om de ceremoniën van het katholieke Jubeljaar bij te wonen en maakten een uitstapje
  naar Napels. Daarna reisden zij via Livorno, Bologna en Padua terug voor een tweede bezoek
  aan Venetië. Na een bezoek aan Genua staken ze de Mont Cenis over naar Frankrijk. Het verslag
  eindigt in Genève. De broers verbleven langere tijd in Wenen, Venetië (28 oktober-18 november
  1699; 30 april-28 mei 1700), Rome (27 november-25 januari 1700; 1-23 maart), Napels (27 januari-25
  februari), Livorno (27 maart-3 april), Florence (5-17 april), Genua (10-20 juni) en Turijn
  (21-26 juni).
