beschrijving: Verslag van een militaire reis naar Duitsland en Oostenrijk van Cornelis Hop
  in 1707 in het gezelschap van luitenant-generaal der cavalerie Daniël van Dopff (ca. 1655-1718).
  Het verslag was gericht aan een vriend. Hop reisde door Duitsland en verbleef langere tijd
  in Wenen.
