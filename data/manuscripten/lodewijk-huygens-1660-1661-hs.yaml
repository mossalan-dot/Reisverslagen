beschrijving: Verslag van een diplomatieke reis van Lodewijk Huygens naar Spanje in 1660-1661
  in het gezantschap van Johan van Merode (1607-1666), Godard Adriaan van Reede van Amerongen
  (1621-1691), Philips Aebinga van Humalda (ca. 1616-1674), verschillende andere diplomaten,
  gentilhommes en bedienden. Huygens ging scheep in Hellevoetsluis en arriveerde in Santoña.
  Hij reisde naar Madrid en bezocht verschillende plaatsen in de buurt. Het verslag eindigt
  in Madrid.
