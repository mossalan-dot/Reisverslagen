addenda:
- Franse en Italiaanse reisaantekeningen (Teding van Berkhout 1739-1741c), bestaande uit een
  lijst van Italiaanse boeken ([1-2]); Italiaanse aantekeningen over Napels, getiteld ‘Breve
  e generale cognitione di Napoli e suo regno’ ([3-9)]; Franse reisaantekeningen over bezienswaardigheden
  in Rome ([10-41]); Italiaanse aantekeningen ([42-44]); plattegrond van de beelden in het
  Palazzo degli Uffizi in Florence, getiteld ‘L’ordre des statues et des bustes comme elles
  sont rangées dans la galerie du grand duc a Florence’ ([45]); lijst met namen ([46]). Lijst
  met meegenomen boeken en kleding (Teding van Berkhout 1739); lijst van aangeschafte Italiaanse
  gravures (Teding van Berkhout s.d.); verbaal van het gezantschap (SG 8741).
correspondentie:
- Briefwisseling met zijn oom Paulus Teding van Berkhout (1676-1747), getiteld ‘Dialogues
  entre absents’ (Teding van Berkhout 1739-1741b).
poezie:
- Twee sonnetten getiteld ‘A l’occassion du heureuse arrivée à Florence de Monsieur le baron
  Bakhaut’, mogelijk van de hand van de reiziger (Teding van Berkhout 1740).
