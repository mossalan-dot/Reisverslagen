id: teding-van-berkhout-1739-41
titel_aanduiding: Journal de mon voiage fait avec Monsieur Egmond vander Nieuwburg, envoijé
  extraordinaire et plentipotentiaire de leur haute puissance a la our de Naple
reizen:
- teding-van-berkhout-1739-41-reis
instelling: nationaal-archief
signatuur: FA Teding van Berkhout 353
taal: Frans
datering: 1739-41
beschrijving: 'Verslag van een educatiereis van Jan Teding van Berkhout naar Italië, Frankrijk
  en Engeland in 1739-1741. Hij reisde naar Napels in het gezantschap van Johannes Aegidius
  van Egmond van der Nijenburg (1675-1747). Teding van Berkhout reisde door de Zuidelijke
  Nederlanden naar Frankrijk en trok bij Lyon de Mont Cenis over naar Italië. Hij bezocht
  onder andere Rome, Napels, Florence, Bologna en Venetië. Hij keerde terug en bezocht Zuid-Frankrijk.
  Hij keerde noordelijk naar Parijs en stak het Kanaal over naar Londen. Verschillende pagina’s
  ontbreken (195-210; 227-252; 261-280; 297-308).


  - Dertig aanvullende brieven aan Paulus, 1) Brussel, 2 maart 1739; 2) Lyon, 9 april; 3)
  15 april; 4) 30 april; 5) 25 mei; 6) Napels, 11 augustus; 7) 22 september; 8) 27 oktober;
  9) 17 november; 10) Rome, 12 december; 11) 2 januari 1740; 12) 30 januari; 13) 12 februari;
  14) maart; 15) 9 april; 16) Florence, 16 april; 17) Venetië, 20 mei; 18) 10 juni; 19) Milaan,
  6 juli; 20) Lyon, 20 augustus; 21) Montpellier, 1 oktober; 22) Bordeaux, 19 november; 23)
  Parijs, 23 december; 24) 29 december; 25) 6 februari 1641; 26) 5 maart; 27) 2 april; 28)
  8 april; 29) Londen, 12 mei; 30) 16 juni.


  - Brieven aan zijn broers Pieter (1711-44) en Coenraad (1714-70) uit Landrecy, Lyon, Marseille,
  Livorno, Napels, Rome, Florence, Venetië, Verona, Milaan, Turijn, Genève, Lyon, Montpellier,
  Bordeaux, La Rochelle, Poitiers, Parijs, Londen en Delft (Teding van Berkhout 1739-1744).


  - Aanvullende brieven (Van Aerssens et al. 1739-1741): brieven van Cornelis van Aerssen
  (1646-1728) op Rhijnlust en te Leiden; brieven van zijn broer Coenraad, Johanna Elisabeth
  van der Dussen (1711-40) en zijn zus Susanna Maria Teding van Berkhout te Leiden (1715-79);
  brieven van Paulus Teding van Berkhout te Amsterdam en Leiden; brieven van Susanna Maria
  Teding van Berkhout te Delft en Leiden; een brief van M.M. Bethman te Bordeaux; twee brieven
  van Du Cange te Padua en Venetië; een brief van Johannes Clephane te Lyon; een brief van
  Couderc te Parijs; twee brieven van Adam Philips van der Duyn (1716-39) en G. Schepers te
  Den Haag en op Hofvliet; een brief van A.S. van der Duyn te Den Haag; twee brieven van Johannes
  Aegidius van Egmond van der Nijenburg te Napels; een brief van George Flint te Parijs; twee
  brieven van Giuseppe Guavinone te Rome; een brief van Hooft te Amsterdam; vier brieven van
  C. van der Hoop te Den Haag en Amsterdam; drie brieven van J. Hop te Den Haag; een brief
  van Theodore Jacobsen te Londen; een brief van de anonymus J.K. te Londen; drie brieven
  van de anonymus Lambert uit Parijs; brieven van W. Maltzhan te Napels, Parijs, Leiden en
  Den Haag; drie brieven van Hogguer Scherer, Salomée Scherer en S. Horutener te Lyon; twee
  brieven van Gaspar Scherer te Lyon; een brief van Le Vraij te Leiden; twee brieven van J.
  Williams te Parijs.'
