beschrijving: Verslag van een plezierreis van Balthasar Moretus III naar Den Bosch, Zeeland
  en Brugge in 1668 in het gezelschap van zijn vader Balthasar Moretus II (1615-74), moeder
  Anna Goos (1627-91), zijn broers Joannes Jacobus (1647-1718) en Franciscus (1656-1705) en
  zijn zus Maria Isabella (1655-76). Franciscus, Maria Isabella en Anna Goos keerden terug
  bij Scherpenheuvel. Moretus reisde van Antwerpen naar Den Bosch en Dordrecht en keerde via
  Zeeland naar Brugge en Gent.
