  - Twee brieven aan Pieter (ingelegd bij Vanderscheur), 1) La Rochelle, 15 juli 1648; 2)
  Saumur, 22 augustus. - Een brief aan Augustinus, 1) Saumur, 15 september 1648. - Een brief
  aan twee onbekende heren, 1) Genève, 12 februari 1648. Auteur(s) niet automatisch gekoppeld:
  Huydecoper, Joan (meerdere kandidaten in appendix A).'
