opmerkingen: 'Band/convoluut: Eén verslag in drie banden van Joan Huydecoper (1625-1704).
  Het eerste deel, van Amsterdam tot Genève, en de delen na het bezoek aan Lyon zijn verloren
  gegaan. Zijn verzonden brieven zijn opgenomen in het derde deel en in het aparte jaarregister
  van 1648 (FA Huydecoper 53) - Vierendertig brieven aan zijn vader, Joan Huydecoper sr. (1599-1661),
  1) Genève, 1 januari 1648; 2) 8 januari; 3) 29 januari; 4) 5 februari; 5) 12 februari; 6)
  26 februari; 7) 2 maart; 8) 23 maart; 9) 29 april; 10) 1 mei; 11) Montpellier, 18 mei; 12)
  Toulouse, 26 mei; 13) Bordeaux, 3 juni; 14) La Rochelle, 14 juli; 15) 16 juli; 16) Saumur,
  1 augustus; 17) 25 augustus; 18) 29 augustus; 19) 26 september; 20) 8 oktober; 21) 31 oktober;
  22) 14 november; 23) 14 november; 24) 9 december; 25) 30 december; 26) 20 januari 1649;
  27) 13 maart; 28) 22 maart; 29) 17 april; 30) 24 april; 31) Orléans, 5 mei; 32) Lyon, 18
  mei; 33) 21 mei; 34) Marseille, 4 juni. - Zeven brieven aan zus Leonora (1631-63), 1) Genève,
  2 februari 1648; 2) 26 april; 3) La Rochelle, 17 juli; 4) 19 juli; 5) Saumur, 22 augustus
  6) Saumur, 11 maart 1649; 7) 26 maart. - Een brief aan zus Geertruid (1634-69), 1) Genève,
  2 februari 1648. - Een brief aan zijn zus Maria (1625-1704)), 1) Genève, 7 april 1648. -
  Vijf brieven aan zijn zwager Jacob Hinlopen (1618-71), 1) Genève, 3 maart 1648; 2) 1 mei;
  3) La Rochelle, 19 juli; 4) Saumur, 19 september; 5) Saumur, 26 maart 1649. - Een brief
  aan zijn zus Maria en zijn zwager Jacob Hinlopen, 1) La Rochelle, 16 juli 1648. - Een brief
  aan zijn grootmoeder Elisabeth Gerritsdr. van Gemen (1566-1652), 1) La Rochelle, 18 juli
  1648 - Vier brieven aan zijn neef, 1) Genève, 1 januari 1648; 2) 4 februari; 3) 29 februari;
  4) Saumur, 13 augustus. - Twee brieven aan zijn neef Brouer, 1) Saintes, 10 juni 1648; 2)
  Saumur, 23 april 1649. - Een brief aan zijn neef Kruijtpenningh, 1) La Rochelle, 24 juni
  1648. - Een brief aan zijn neef Vangeelen, 1) La Rochelle, 16 juli 1648. - Een brief aan
  zijn neef Jacob Rotgans, 1) Saumur, 26 september 1648. - Een brief aan zijn neef Dierck
  Jans Schaep (1627-1702), 1) Saumur, 23 januari 1649. - Twee brieven aan zijn oom Coymans
  (Balthasar (1589-1656) of Joan (1601-57)), 1) Genève, 1 mei 1648; 2) Saumur, 16 september.
  - Negen brieven aan de heer Vandesande, 1) Genève, 4 maart 1648; 2) 27 maart; 3) 8 april;
  4) mei; 5) Saumur, 1 augustus; 6) 22 augustus; 7) 19 september; 8) 17 april 1649; 9) 24
  april. - Drie brieven aan de heer Foerendael, 1) Genève, mei 1648; 2) Montpellier, 18 mei;
  3) La Rochelle, 15 juli. - Drie brieven aan de heer Castagne, 1) La Rochelle, 12 juni 1648;
  2) 1 juli; 3) 14 juli. - Drie brieven aan de heer Mestarti, 1) Saumur, 22 augustus 1648;
  2) 4 september; 3) 2 oktober. - Twee brieven aan de heer Boudewijns, 1) La Rochelle, 12
  juni 1648; 2) 1 juli. - Twee brieven aan de heer Calandrini, 1) La Rochelle, 22 juni 1648;
  2) 12 juli; - Twee brieven aan de heer Florencij, 1) La Rochelle, 15 juli 1648; 2) Saumur,
  19 september. - Twee brieven aan de heer Van Rhijn, 1) Saumur, 29 augustus 1648; 2) 24 april
  1649. - Twee brieven aan de heer Van Haveren, 1) Orléans, 4 mei 1649; 2) Lyon, 18 mei. -
  Een brief aan de heer Pagie, 1) Genève, 21 januari 1648. - Een brief aan de heer Lamot,
  1) Genève, 21 januari 1648. - Een brief aan de heer Beckker, 1) Genève, 26 februari 1648.
  - Een brief aan de heren Mewen en Vandesande, 1) Genève, 28 februari 1648. - Een brief aan
  de heer Van Salingen, 1) La Rochelle, 24 juni 1648. - Een brief aan de heer Flandren, 1)
