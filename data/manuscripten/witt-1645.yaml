beschrijving: Ongepagineerd verslag van een educatiereis van Johan (1625-72) en Cornelis de
  Witt (1623-72) naar Frankrijk en Engeland in 1645-47, geschreven door Johan. De Witt ging
  scheep in Hellevoetsluis en arriveerde in Le Havre. Hij reisde naar Parijs en het Loiregebied,
  waar hij drie maanden verbleef in Angers. In Angers promoveerde hij in de rechten. Hij trok
  naar het zuiden en deed La Rochelle, Bordeaux en Montpellier. De Witt ging verder naar Lyon
  en Genève om door te rijden naar Parijs. Na vijf maanden in Parijs te hebben verbleven,
  maakte hij een tweede rond langs de Loire en stak hij het Kanaal over tussen Calais en Dover.
  Vanuit Londen maakte hij verschillende uitstapjes naar Oxford, Bath en Bristol. Hij ging
  scheep in Gravesend en arriveerde in Hellevoetsluis. De Witt verbleef langere tijd in Parijs
  (26 oktober 7-november 1645; 10 oktober 1646-22 maart 1647; 14-29 mei), Angers (20 november
  1645-21 februari 1646), Nantes (11-18 maart), La Rochelle (20-26 maart), Bordeaux (6-14
  april), Montpellier (7 mei-2 juli), Nîmes (2-12 juli), Arles (13-22 juli), Marseille (27
  juli-2 augustus), Orange (12-19 augustus), Pont-Saint-Esprit (19-25 augustus), Grenoble
  (29 augustus-6 september), Lyon (14-24 september), Loudun (5-13 april), Londen (5-14 juni)
  en Marlborough (27 juni-2 juli).
