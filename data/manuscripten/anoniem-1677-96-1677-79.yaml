beschrijving: Onvoltooid verslag naar Italië en Frankrijk in 1677-79. De anonymus reisde door
  Duitsland en Oostenrijk en bezocht in Italië onder meer Venetië, Milaan, Florence, Rome,
  Napels en Genua. Hij reisde via de Mont Cenis naar Frankrijk en bezocht Genève en Lyon.
  Vanaf Florence had de auteur vrijwel niets inhoudelijks te melden.
