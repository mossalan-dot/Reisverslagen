addenda:
- Opmerkingen over Frankrijk, getiteld ‘Mores animadversiones et consuetudines Parisienses,
  Parisiis 1669’ (193-215); opmerkingen over Parijs in het Frans, getiteld ‘On peut voir a
  Paris’ (295-300), kasboekaantekeningen (335), anekdotes die de schrijver uit gesprekken
  haalde, getiteld ‘Les utilitez de ma conversation pendant mon voyage’ (613-744); provenanceaantekening
