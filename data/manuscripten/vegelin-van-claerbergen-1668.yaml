beschrijving: Onvolledig verslag van een educatiereis van Ernst Frederik Vegelin van Claerbergen
  (º1648) naar Frankrijk in 1668-70. Aan de paginering is af te leiden dat verschillende katernen
  ontbreken. Vegelin van Claerbergen reisde van Leeuwarden naar Parijs, waar hij langere tijd
  verbleef.
