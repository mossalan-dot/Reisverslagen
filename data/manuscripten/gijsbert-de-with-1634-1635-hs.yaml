beschrijving: Verslag van een educatiereis van Gijsbert de With (º1611) naar Frankrijk in 1634-1635
  in het gezelschap van Jacob van Beveren (1612-1676), Hendrick van Gouthouven en Mathes Onderwaeter.
  De With ging scheep in Hellevoetsluis en arriveerde in Dieppe. Hij verkende het Loiregebied
  en Parijs en promoveerde in Orléans in de rechten. Hij keerde terug per schip.
