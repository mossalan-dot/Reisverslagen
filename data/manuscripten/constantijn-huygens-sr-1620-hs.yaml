beschrijving: Verslag van een diplomatieke reis naar Venetië door Constantijn Huygens sr. in
  1620 in het gezantschap van François van Aerssen van Sommelsdijk (1572-1641). Naast het verslag
  van Huygens, is er ook een officiële rapportage van Van Aerssen overgeleverd, inclusief de
  minuut en twee kopieën. Huygens vertrok uit Den Haag en reisde via Duitsland en Zwitserland
  naar Venetië. Hij keerde via dezelfde weg terug. Het gezantschap verbleef ca. drie weken in
  Venetië.
