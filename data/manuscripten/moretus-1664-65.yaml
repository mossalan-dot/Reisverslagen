instelling: museum-plantin-moretus
signatuur: M 322
taal: Nederlands
datering: 1664-65
omvang: ff. 153
corpus_gor: M. 084
beschrijving: Onvoltooid verslag van een educatiereis van Balthasar Moretus III naar Italië
  in 1664-65 in het gezelschap van zijn oom Hendrik Hillewerve (1621-94), Jan Tholinx jr.
  (1631-1705), Theodoor Andries van Kessel en neef Pieter Goos (1645-1708). De reis liep van
  Antwerpen door Duitsland via Keulen en Heidelberg. Moretus stak bij Innsbruck de Alpen over
  en bezocht Venetië, waar het verslag eindigt. De rest van de reis wordt in losse aantekeningen
  gemeld.
digitalisering:
  status: onbekend
transcriptie:
  status: onbekend
addenda:
- Kladaantekeningen van de reis door Italië en afschriften van inscripties (ff. 16r-35v; 37r-152v);
  ingelegd vel met reisaantekeningen (f. 36r; [127r-127v]); aangeplakt vel met reisaantekeningen
  (f. 71v).
literatuur:
- Sabbe 1928, 173-203.
opmerkingen: 'Band/convoluut: Vijf verslagen in twee banden van Balthasar Moretus III (1646-96).
  Het tweede manuscript bestaat uit dertien verschillende onderdelen. Onderdelen III-IV, V,
  VII zijn van de hand van Balthasar Moretus III. Delen III en IV zijn samengevoegd. Het gaat
  om de volgende reisverslagen: III-IV) Moretus III (1668); V) Moretus III (1671); VII) Moretus
  III (1680); VIII) Moretus II (1660); IX) Van der Gouw (1653, zie no. 27); XI) Moretus II
  (1663); XII) F.M. Moretus (1739, niet in corpus); XIII) F.M. Moretus (1739, niet in corpus).'
