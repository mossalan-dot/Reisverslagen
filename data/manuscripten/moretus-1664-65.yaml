id: moretus-1664-65
titel_aanduiding: Reijse van Antwerpen op Italien ghedaen door Balthasar Moretus le Jeun in
  compagnie van Mijn heer Hillvenier, mijnheer van Immetseel, mijn heer Toslinckx en mijn
  heer Petrus Goos
reizen:
- moretus-1664-65-reis
auteurs:
