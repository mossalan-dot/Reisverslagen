addenda:
- Aantekeningen in het Frans, getiteld ‘Estat des affaires de la Porte’ (p. [11-14]), Franse
  aantekening over de winst van kerken, getiteld ‘Extrait du Revenu des Eglises de France’
  (p. [15-18]), informatie in het Frans over het faubourg Saint-Germain in Parijs (p. [20-23]),
  Franse apodemische instructies over bezienswaardigheden in Parijs, getiteld ‘On peut voir
  a Paris’ (p. [25-27]).
opmerkingen: 'Band/convoluut: Vijf verslagen van Franco van Bleiswijck (1644-1723) in drie
  banden. De eerste band (Ms. Den Haag, HRvA, FA Van Slingelandt 100), met drie reizen tussen
  1665 en 1667, ontbreekt. Een afschrift van een reis uit 1667 is opgenomen als los katern
  van de derde band.'
