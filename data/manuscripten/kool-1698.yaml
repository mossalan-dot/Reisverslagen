beschrijving: Verslag van een educatiereis van Joannes Kool (1672 – ca. 1708) naar Frankrijk
  en Italië in 1698-99 in het gezelschap van Lucas van Voorst (1670-1738). Kool trok van Utrecht
  via de Zuidelijke Nederlanden naar Parijs, waar hij langere tijd verbleef. Hij trok naar
  Lyon en Genève en stak de Alpen over naar Turijn. In Italië bezocht hij onder andere Genua,
  Milaan, Bologna, Florence en Rome. Vanuit Rome maakte hij een uitstapje naar Napels. Hij
  keerde via de Adriatische kust naar Venetië. Hij stak bij Innsbruck de Alpen over en vervorderde
  zijn tocht noordelijk naar Augsburg, Frankfurt, Keulen en Aken. Hij kopieerde en collationeerde
  onderweg verschillende inscripties voor zijn bewerking van Marquard Gudes Antiquae inscriptiones.
  Hij bezocht Maastricht en Den Bosch en arriveerde in Utrecht. Kool verbleef langere tijd
  in Parijs (49 dagen), Florence (49 dagen), Rome (90 dagen), Venetië (23 dagen).
