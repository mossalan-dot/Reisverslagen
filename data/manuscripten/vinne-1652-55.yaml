addenda:
- 'Schetsboek met Rijnlandschappen (voorh. NHA, Ms. 231); meer dan veertig schetsen en pentekeningen,
  1) plattegrond van Utrecht, ca. 1570-1575, naar onbekend voorbeeld, met tekst van de auteur;
  2) gezicht op Emmerik; 3) tekening van een boerenhuisje vóór Keulen; 4) tekening van de
  klederdracht van magistraten en vrouwen in Keulen; 5) tekening van geestelijken in Keulen;
  6) tekening van monniken in Keulen; 7) tekening van de muizentoren bij Bingen; 8) gezicht
  op Worms; 9) tekening van een monnik te Keulen; 10) figuurstudie van geestelijken te Keulen;
  11) tekening van vrouwendracht te Mainz; 12) tekening van vrouwendracht te Frankfurt am
  Main; 13) tekening van het wijnvat te Heidelberg; 14-15) tekeningen van vrouwendracht te
  Straatsburg; 16) gezicht op Bazel naar Mattheus Merian de Oudere (1593-1650); 17) tekening
  van een stadsdienaar te Bazel; 18) tekening van een voornaam burger te Bazel; 19) tekening
  van een Bazelse wijnmaat; 20) gezicht op Waldenburg naar Merian; 21) tekening van gewapende
  boeren tussen Liestal en Bazel; 22) tekening van de Col de Pierre Pertuis naar Merian; 23)
  tekening van vrouwendracht te Yverdon-les-Bains; 24) gezicht op Nyon naar Merian; 25) tekening
  van Wilhelm Tell naar een kopie van André de Thevet (1502-90) uit 1584; 26) tekening van
  een huis met luifel en winkel te Genève; 27) plattegrond van Genève naar Merian; 28) stadsprofiel
  van Genève; 29-30) tekeningen van vrouwen te Genève; 31-32) wapens van Grenoble; 33) wapen
  van Savoye; 34) wapen van Chambéry; 35) tekening van Tournon aan de Rhône; 36) tekening
  van Anne de Tournon de Meyres, religieuse te Tournon; 37) tekening van Franse vissersvrouwen;
  38) gezicht op Kaub en de burcht Gutenfels (RKD); 39-) diverse slecht reproduceerbare wapenschilden
  en krijttekeningen van graven in de Keulse Sint-Ursulakerk; circa 37 ingelaste prenten en
  gravures, waaronder acht van Merian uit Topographia Archiepicospatuum Moguntinensis, Trevirensis
  et Coloniensis (1646), Topographia Hassiae (1646), Theatrum Europaeum (1639), Topographia
  Palatinatus Rheni (1645) en Topographia Helvetiae, Rhaetiae et Valesiae (1644), 1) gezicht
  op Uerdingen; 2) gezicht op Ehrenbreitstein; 3) gezicht op Boppard; 4) gezicht op Wellmich;
  5) gezicht op de Drachenfels; 6-7) gezichten op Mainz, bezien vanuit het oosten en westen;
  8) gezicht op Höchst; 9) gezicht op Rüsselsheim; 10) gezicht op Frankfurt am Main; 11) gezicht
  op Wiesloch; 12) tekening van de Sankt Peterplatz te Bazel; acht prenten uit Martin Zeillers
  Topographiae Galliae (1662), 1-4) aanzichten van Lyon; 5) een tekening van het stadhuis
  te Lyon; 6) gezicht op het paleis en de haven van Lyon; 7) gezicht op Grenoble; 8) kaart
  van Dauphiné; tien van Jean Boisseau (1631-57) uit C. de Chatillons Topographie françoise
  (1641); prent van Wenceslaus Hollar (1607-77) van de kathedraal te Straatsburg; onbekende
  gravure van een papiermolen te Nantua; onbekende prent naar Merian van Sens; profiel van
  Parijs door Israël Silvestre (1621-91); prent van P. Schut van Heidelberg; de schijndood
  van Richmodis naar Johannes Bussemacher (1604); plattegrond van Haarlem door Pieter Jansz
  Saenredam (1597-1665) uit Samuel Ampzings Beschryvingh ende lof der Stad Haerlem in Holland
  (1628); twee en drie losse bladen van een achttiende-eeuws afschrift, voorheen uit de Amsterdamse
  collectie I.Q. van Regteren Altena, met zeven schetsen gebaseerd op Van der Vinne: 1) gezicht
  op Hammerstein; 2) gezicht op Andernach; 3) gezicht op Koblenz; 4) gezicht op Ehrenbreitstein;
  5) gezicht op Nantua; 6) gezicht op Lyon; 7) gezicht op Auberives-sur-Varèze.'
poezie:
- 'In de lopende tekst zijn elf verschillende gedichten geplaatst: ‘Den autheur’, ‘Inleiding
  ofte voor-reden’, ‘Gebedt’, ‘Op Amsterdam’, ‘Op den selven dito’, ‘In vallende gedachten
  op’, ‘Sang tot troost voor mijn cameraets, gepast op dese voorval’, ‘[Siet oostwaert van
  ons af seer hoornich opwaert steken]’, ‘[En op de lincker hant, soo sietmen in Savooijen]’
  (van Joost Boelen), ‘[De helsche rasernij door bloetdorst aengeprickelt]’ en ‘Rustplaetse
  en inwendigh gedachten’. Andere kortere passages zijn eveneens in rijm geschreven. In een
  ander handschrift zijn de gedichten ‘Ant. Sonnet Aen J. Lourens’ (nabij Keulen, 17 april
  1653), ‘[Ick ben somtijts gedachtich]’ en ‘Op mijn vertreck van Geneven’.'
literatuur:
- Caljé-van den Berg 1973; Van der Vinne 1979, 1-41; Alsteens en Buijs 2008.
