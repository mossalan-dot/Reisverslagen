beschrijving: Verslag van een educatiereis van Johan Thijs naar Frankrijk en Engeland in 1646-48
  in het gezelschap van de oriëntalist Job Ludolf (1624-1704). Thijs ging in 1646 scheep in
  Hellevoetsluis en arriveerde in Dieppe. Hij bezocht Caen en Parijs en reisde langs het Loiregebied.
  Door ziekte werd hij opgehouden in Nîmes. Hij stak het Kanaal over en bezocht Londen. Hij
  ging scheep in Gravesend en arriveerde in Brielle, vanwaar hij doorreisde naar Leiden.
