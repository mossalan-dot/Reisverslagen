beschrijving: Eerste verslag van een educatiereis van Coenraad Ruysch naar Duitsland, Frankrijk
  en Zwitserland in 1674 in het gezelschap van zijn neef Dirck van Hoogeveen. Ruysch trok van
  Amsterdam via Friesland en Groningen naar Hamburg. Hij reisde zuidelijk naar Leipzig, maakte
  een omweg naar Dresden en vervolgde zijn weg naar Augsburg en Ulm. Hij doorkruiste Zwitserland
  en verbleef enkele maanden in Genève. Ruysch verbleef langere tijd in Hamburg (17-24 mei 1674)
  en Dresden (10-16 juni).
