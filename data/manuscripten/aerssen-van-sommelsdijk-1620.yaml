taal: Nederlands
beschrijving: Officiële rapportage van een diplomatieke reis in 1620 naar de republiek Venetië
  van missieleider François van Aerssen van Sommelsdijk (1572-1641), gericht aan de Staten-Generaal.
  In zijn entourage voeren ook zijn zoon Cornelis (1600-62) en Constantijn Huygens (1596-1687)
  mee. De minuut en twee kopieën van het verslag zijn ook in het NA te vinden, evenals zijn
  verbaal over missies naar Engeland in 1621, 1624 en 1625. Huygens hield een eigen verslaglegging
  bij (Huygens 1620). Van Aerssen vertrok uit Den Haag en reisde via Duitsland en Zwitserland
  naar Venetië. Hij keerde via dezelfde weg terug. Het gezantschap verbleef ca. drie weken
  in Venetië.
