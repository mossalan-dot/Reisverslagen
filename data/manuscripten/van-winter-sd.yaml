beschrijving: 'Drie verslagen in één band van Van Winter.


  Journal de mon Second Voyage en France. Delft (NL), 13 april – Delft (NL), 18 september
  1662 (875 dagen). Frans en Nederlands, pp. 16 (1-16). Route: Nederlandse Republiek, Frankrijk,
  Zwitserland, Frankrijk, Italië, Oostenrijk, Duitsland, Oostenrijk, Slowakije, Tsjechië,
  Frankrijk, Luxemburg, Duitsland, Nederlandse Republiek. Educatie.


  Beknopt verslag van een educatiereis van De Winter uit 1660-62, bestaande uit plaatsnamen
  en afgelegde mijlen. Hij bezocht Parijs en de Loirestreek en trok via de westkust naar Bordeaux,
  waar hij de wintermaanden verbleef. Hij bezocht Montpellier en bleef enige maanden in Lyon,
  voordat hij de Mont Cenis besteeg. In Italië bezocht Van Winter onder andere Milaan, Siena
  en Napels. Hij bleef langere tijd in Rome en Venetië. Hij keerde terug via Oostenrijk, vanwaar
  hij doorreisde naar Bratislava en Praag. Hij trok naar Dresden, Frankfurt, Straatsburg en
  Keulen. Van Winter verbleef langere tijd in Parijs (9 mei-7 september 1660), Orléans (8-17
  september), Tours (20 september-4 oktober), La Rochelle (18-25 oktober), Bordeaux (28 oktober-3
  februari 1661), Montpellier (21 februari-25 maart), Lyon (20 april-24 augustus; 1-12 september),
  Rome (30 oktober-5 november; 20 november-10 april 1661), Napels (10-16 november), Venetië
  (29 april-23 mei) en Wenen (20 juni-5 juli).


  Ao. 1671. Voyage d’Over-ijssel et Gueldre que jay fait avec Mr. G Durve medecin à cheval.
  Delft (NL), 13 juli 1671 – Delft (NL), 24 juli 1671 (12 dagen). Frans, p. 1 (12). Route:
  Nederlandse Republiek. Cultuur/vermaak.


  Beknopt verslag van een reis van De Winter uit 1671 naar Overijssel en Gelderland, bestaande
  uit plaatsnamen en afgelegde mijlen, in het gezelschap van dokter G. Durve.


  Hamburgse Reys met Hr. Jac. Halling en E. Bleiswyck. Delft (NL), 22 mei 1682 – Delft (NL),
  3 juli 1682 (41 dagen). Nederlands, p. 1 (15). Route: Nederlandse Republiek, Duitsland,
  Nederlandse Republiek. Cultuur/ vermaak.


  Beknopt verslag van een reis van De Winter uit 1682 naar Hamburg, bestaande uit plaatsnamen
  en afgelegde mijlen, in het gezelschap van dokter Jacobus Halling en E. Bleiswijck.'
