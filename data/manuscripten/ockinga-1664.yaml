beschrijving: Ongepagineerd verslag van een educatiereis van Jarich van Ockinga (1644-1714)
  in 1664-64. Van Ockinga reisde samen met Tinco van Andringa (º1643) van Leeuwarden via Zeeland
  en de Zuidelijke Nederlanden naar Frankrijk. Zij maakten een rondreis door de Loirestreek,
  verbleven ca. vier maanden in Blois en ca. vier maanden in Parijs. Na een bezoek aan Grenoble
  keerde Van Ockinga terug via Genève en Duitsland tot aan Amsterdam. De reiziger verbleef
  langere tijd in Brussel (14-20 juni 1664), Moret-sur-Loing (28 juli-7 augustus), Blois (14
  augustus-14 december), Parijs (19 december-1 mei 1665), Straatsburg (30 mei-5 juni), Mannheim
  en Mainz (7 juni-4 juli).
