addenda:
- Franse scherminstructies, getiteld ‘Exercice de la pique, premierement estant pique plantée
  à commencer’, en een aanvullende tip in het Nederlands ([77-78]);  ([79]); korte biografieën
  in het Frans van de leden van de Académie Française, getiteld ‘Catalogue des Academiciens’,
  waarschijnlijk overgenomen uit Paul Pellisson-Fontaniers Histoire de l’Académie françoise
  […] [1653] ([81-85]); bibliografie met boeken van leden van de Académie Française en boeken
  over het Frans, getiteld ‘Quelques bone liures’ ([86-87]); aanvullende curiosa, nl. a) een
  Franstalig apocrief epitaaf-raadsel dat de eigenaars van een graf bespot als een incestueus
  echtpaar ([88], zie Taylor 1938, 26); b) twee Latijnse anagrammen die de letters husselen
  van de woorden van de priester tijdens de viering van de communie ([88]); c) een Frans gedicht
  over een discussie tussen een priester en de duivel ([88-89]); d) een Frans gedicht, mogelijk
  over kardinaal Richelieu (1585-1642) ([89]).
