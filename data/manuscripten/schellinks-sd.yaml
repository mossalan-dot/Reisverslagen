beschrijving: 'Vier reisverslagen in drie banden van Willem Schellinks (1623-78). Het betreft
  een netversie, deels gebaseerd op Lambert van den Bos’ Wegh-wyser uit 1665, waarschijnlijk
  geschreven tussen 1665 en 1668. Het verslag was waarschijnlijk bedoeld ter uitgave. Een
  zeventiende-eeuwse kopie van de laatste drie verslagen ligt in de Bodleian Library in Oxford
  (Ms. D’Orville 558-560).


  Reisverslag naar Frankrijk. Amsterdam (NL), 7 april 1646 – Amsterdam (NL), 10 oktober 1646
  (183 dagen). Nederlands, pp. 48. Route: Nederlandse Republiek, Frankrijk, Nederlandse Republiek.
  Educatie.


  Verslag van een kunstenaarsreis van Willem Schellinks in 1646 naar Frankrijk. Hij werd vergezeld
  door de kunstenaar Lambert Doomer (1624-1700). Hij ging scheep in Texel en voer naar Nantes.
  Vandaar bezocht hij de Loirestreek en Parijs. Schellinks verbleef langere tijd in Nantes
  (17 mei-3 juli), Saumur (10-18 juli), Parijs (11 augustus-7 september) en Rouen (8-24 september).


  Tijdt en Plaatz wijzer weegens de Reijze gedaan bij Monsr. Jaq. Thierrij junior & Willem
  Schellinks door 1. Engelandt, 2. Vrankrijck, 3. Italia, 4. Sicilien, 5. Malta, 6. Duijslandt,
  7. Zwitzerlant, 8. Nederlandt, etc. Amsterdam (NL), 14 juli 1661 – Dieppe (FR), 19 april
  1663 (635 dagen). Nederlands, pp. 270 (48-317). Route: Nederlandse Republiek, Engeland,
  Frankrijk. Educatie.


  Eerste deel van een verslag van een educatiereis naar Engeland, Frankrijk, Italië, Malta,
  Duitsland en Zwitserland tussen 1661 en 1665 van Willem Schellinks. Dit deel beschrijft
  de reis naar Engeland tussen 1661 en 1663. Schellinks begeleidde de dertienjarige reiziger
  Jacques Thierry jr. (1648-1709) en vervaardigde op verzoek van de advocaat Laurens van der
  Ham (1621-78) honderdtwintig topografische tekeningen, waarvan er 61 werden opgenomen in
  diens Atlas. Schellinks ging scheep in Hellevoetsluis en reisde naar Dover. Hij verbleef
  langere tijd in Londen en bezocht onder andere Hampton Court, Oxford, Bath en Salisbury.
  Hij stak het Kanaal over tussen Rye en Dieppe.


  Dagh-register wegens onse reijsze in en door Vranckrijck, behelzende een korte aentekeninge
  van al het geene wij in onze reijze door het zelve rijck aanmerckelijckst hebben gezien.
  Dieppe (FR), 20 april 1663 – Rome (IT). Nederlands, pp. 473 (318-791). Route: Frankrijk,
  Zwitserland, Frankrijk, Italië. Educatie.


  Tweede deel van het verslag van bovengenoemde educatiereis. Dit deel beschrijft de reis
  naar Frankrijk en Zwitserland tussen 1663 en 1664. Schellinks reisde van Rouen naar Parijs,
  waar hij langere tijd bleef. Hij trok langs de Loirestreek en reisde door naar Bordeaux,
  Montpellier en Marseille. Hij bezocht Genève en Lyon en trok door naar Italië. Het deel
  eindigt in Rome. Schellinks verbleef langere tijd in Rouen (23 april-10 mei), Parijs (11
  mei-28 juni), Bordeaux (7-27 september) en Rome.


  Reis naar Italië, Malta, Oostenrijk en Duitsland. Rome (IT), 1664 – Amsterdam (NL), augustus
  1665. Nederlands, pp. 577 (794-1371). Route: Italië, Malta, Zwitserland, Duitsland, Nederlandse
  Republiek. Educatie.


  Derde deel van het verslag van bovengenoemde educatiereis. Dit deel beschrijft de reis vanaf
  Rome naar Napels, Sicilië en Malta. Schellinks keerde terug via Napels, Rome en Venetië.
  Hij trok de Oostenrijkse Alpen over, bezocht Duitsland en Zwitserland en keerde terug naar
  Amsterdam.'
