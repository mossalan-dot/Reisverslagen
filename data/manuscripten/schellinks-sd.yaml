addenda:
- Latere inhoudsopgave, mogelijk vervaardigd door een nazaat van Schellinks (p. *1); verschillende
  tekeningen van landschappen en stadsgezichten (RKD; Alsteens en Buijs 2008, 71-189).
- Laissez-passer voor de reis naar Frankrijk; aantekeningen over de bezienswaardigheden van
  Londen; verschillende tekeningen van landschappen en stadsgezichten, onder andere van Dover,
  Canterbury en Stonehenge (RKD; Schellinks 1993, 23-28; Alsteens en Buijs 2008, 71-189).
- Lijst van plaatsen in Frankrijk (370-I); gedrukte inventaris uit 1659 van de tombe van Saint-Denis;
  ingebonden reisgidsen; beschrijvingen van Romeinse palazzi; verschillende tekeningen van
  landschappen en stadsgezichten (RKD; Alsteens en Buijs 2008, 71-189).
- Verschillende tekeningen van landschappen en stadsgezichten, onder andere van de Vesuvius,
  Napels, Stromboli, Palermo, de Calabrische kust, Messina, de Etna, Syracuse en Valletta
  (RKD; Alsteens en Buijs 2008, 71-189)
