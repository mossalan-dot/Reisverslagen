beschrijving: "Vier reisverslagen in drie banden van Willem Schellinks (1623-1678). Het betreft\
  \ een netversie, deels gebaseerd op Lambert van den Bos’ Wegh-wyser uit 1665, waarschijnlijk\
  \ geschreven tussen 1665 en 1668. Het verslag was waarschijnlijk bedoeld ter uitgave. Een\
  \ zeventiende-eeuwse kopie van de laatste drie verslagen ligt in de Bodleian Library in Oxford\
  \ (Ms. D’Orville 558-560). \n\nEerste deel van een verslag van een educatiereis naar Engeland,\
  \ Frankrijk, Italië, Malta, Duitsland en Zwitserland tussen 1661 en 1665 van Willem Schellinks.\
  \ Dit deel beschrijft de reis naar Engeland tussen 1661 en 1663. Schellinks begeleidde de\
  \ dertienjarige reiziger Jacques Thierry jr. (1648-1709) en vervaardigde op verzoek van de\
  \ advocaat Laurens van der Ham (1621-1678) honderdtwintig topografische tekeningen, waarvan\
  \ er 61 werden opgenomen in diens Atlas. Schellings ging scheep in Hellevoetsluis en reisde\
  \ naar Dover. Hij verbleef langere tijd in Londen en bezocht onder andere Hampton Court, Oxford,\
  \ Bath en Salisbury. Hij stak het Kanaal over tussen Rye en Dieppe."
