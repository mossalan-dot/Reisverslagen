beschrijving: Onvoltooid verslag van een educatiereis naar Italië en Frankrijk van een lid
  van de adellijke familie De Ridder van Groenesteijn en zijn oom. De anonymus reisde in 1666
  van Gelderland via Duitsland naar Wenen en Bratislava. Hij ging vervolgens door Oostenrijk
  op weg naar Venetië, Bologna en Milaan. In Milaan verbleef hij langere tijd om de intrede
  van keizerin Margaretha Theresia (1651-73), infante van Spanje, te bezichtigen. Vanwege
  een epidemie reisde de anonymus niet zuidelijker dan Bologna en vermeed hij Rome. Na zijn
  bezoek aan Turijn reisde de auteur via de Mont Cenis naar Frankrijk, waar het verslag eindigt
  in Parijs. De reiziger verbleef langere tijd in Wenen (4-14 juli 1666), Venetië (26 juli-5
  augustus) en Milaan (13 augustus-8 oktober).
