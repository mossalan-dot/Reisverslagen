beschrijving: Kort verslag van een plezierreisje per boot naar Overijssel, Friesland, Groningen
  en Emden van Gerard Hinlopen in 1675 in het gezelschap van Dirck Pont. De reis ging naar Harlingen,
  Leeuwarden en Groningen en Emden. Op de terugweg maakte Hinlopen een omweg naar Zwolle en
  Deventer.
