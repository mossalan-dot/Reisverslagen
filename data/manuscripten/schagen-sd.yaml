addenda:
- Een Latijnse verhandeling over Polen (5-12); kopie van een verdrag tussen Zweden en de Republiek,
  afgesloten op 1 september 1640, inclusief een geheim artikel (13-33); tekst in het Latijn
  van het verdrag van Suderoke, afgesloten tussen de Republiek en Zweden op 15 augustus 1645
  (37-42); tekst in het Latijn van het verdrag van Elbing, afgesloten in september 1656 (45-51);
  aantekeningen over de diplomatieke verhoudingen met Zweden (61-67); een Latijnse verhandeling
  over de Zweeds-Poolse troonaanspraken (69-76).
