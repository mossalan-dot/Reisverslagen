beschrijving: Verslag van een plezierreis van Cornelis de Jonge van Ellemeet naar Antwerpen
  en Brussel in 1669 met zijn moeder Margaretha Briel (1617-85), zijn zussen Johanna (1643-94)
  en Cecilia (1645-86), familievriend Agatha de Jong en haar kinderen. De Jonge van Ellemeet
  reisde per boot van Brielle naar Antwerpen en Brussel en keerde terug via Zierikzee.
