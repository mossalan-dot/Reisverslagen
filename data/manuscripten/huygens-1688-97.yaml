beschrijving: 'Verslag van een reis en langdurig verblijf van Constantijn Huygens jr. in Engeland
  in het gevolg van Willem III. Huygens beschreef zijn deelname aan de veldtocht in Ierland
  en de roddels en intriges aan het hof, soms in codetaal.


  - Drieëntwintig brieven van zijn broer Christiaan, 1) Voorburg, 30 december 1688; 2) 5 februari
  1689; 3) 22 maart; 4) 3 september; 5) 9 september; 6) 4 oktober; 7) 18 oktober; 8) Den Haag,
  23 december; 9) 1690; 10) 7 februari; 11) 24 februari; 12) 28 februari; 13) 21 maart; 14)
  24 maart; 15) 2 mei; 16) 5 mei; 17) 12 mei; 18) 16 mei; 19) Voorburg, 1 november; 20) 26
  juli 1691; 21) 16 juli 1693; 17) 1 september; 18) 19 maart 1694; 19) Den Haag, 2 april;
  20) 6 juni; 21) Voorburg, 6 juli; 22) 27 juli; 23) 7 januari 1695.'
