opmerkingen: 'Band/convoluut: Vijf verslagen in twee banden van Balthasar Moretus III (1646-96).
  Het tweede manuscript bestaat uit dertien verschillende onderdelen. Onderdelen III-IV, V,
  VII zijn van de hand van Balthasar Moretus III. Delen III en IV zijn samengevoegd. Het gaat
  om de volgende reisverslagen: III-IV) Moretus III (1668); V) Moretus III (1671); VII) Moretus
  III (1680); VIII) Moretus II (1660); IX) Van der Gouw (1653, zie no. 27); XI) Moretus II
  (1663); XII) F.M. Moretus (1739, niet in corpus); XIII) F.M. Moretus (1739, niet in corpus).'
