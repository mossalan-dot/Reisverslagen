beschrijving: Kopie van een verslag van een educatiereis van Daniel Tjassens (1660-1713) naar
  Engeland, Frankrijk, Italië en Zwitserland in 1683 en 1684. Het verslag eindigt in Engeland.
  De auteur reisde van Groningen naar Franeker en Amsterdam en ging scheep in Rotterdam. Hij
  verbleef langere tijd in Londen.
