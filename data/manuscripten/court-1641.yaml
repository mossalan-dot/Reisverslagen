beschrijving: Verslag van een reis van Pieter de la Court (ca. 1618-85) naar Engeland en Frankrijk
  in 1641-43. De la Court stak het Kanaal over en verbleef vijf maanden in Londen, vanwaar
  hij een uitstapje maakte naar Oxford. Hij had extra aandacht voor de textielhandel. Hij
  ging scheep in Rye en arriveerde in Dieppe. Hij bezocht Parijs en het Loiregebied, waar
  hij langere tijd in Saumur en Angers verbleef. Hij reisde naar Lyon en van daar zuidelijk
  naar Avignon en Marseille. Hij verbleef acht maanden in Genève en één maand in Bazel en
  reisde noordelijk naar Frankfurt en Keulen. De la Court maakte een omweg naar de Zuidelijke
  Nederlanden, waar hij Antwerpen, Brussel en Brugge bezocht. Hij keerde terug via Zeeland.
  De la Court verbleef langere tijd in Londen (9 oktober-8 maart 1642), Rouen (4-17 april),
  Saumur (28 april-2 juli), Angers (2 juli-begin augustus), Valence (6-12 augustus), Marseille
  (18 augustus-1 september), Genève (13 oktober-7 juni 1643), Bazel (12 juni-19 juli), Mainz
  (29 juli-15 augustus), Keulen (18 augustus-5 september).
