beschrijving: Verslag van een educatiereis naar Frankrijk en Italië van Pieter Cornelisz.
  Hooft (1581-1647) in 1599-1601. Na zijn werkzaamheden in La Rochelle reisde Hooft naar het
  Loiregebied en Parijs. Hij reisde zuidwaarts naar Lyon en Marseille en stak per schip over
  naar Genua. In Italië bezocht hij langere tijd Venetië en reisde hij zuidelijk naar Florence,
  Rome en Napels. Hij spendeerde ongeveer een jaar in Florence en Venetië en stak daarna de
  Alpen over. Hij doorkruiste Duitsland via Neurenberg, Frankfurt en Bremen. Hij keerde terug
  naar Amsterdam via Groningen en Friesland. Hooft verbleef langere tijd in La Rochelle (11
  juni 1598-5 februari 1599), Parijs (18 februari-4 maart; 13 maart-22 april), Rouen (5-12
  maart), Lyon (29 april-27 mei), Marseille (1 juni-1 juli), Monaco-Ville (3-10 juli), Padua
  (27 juli-21 augustus), Venetië (21 augustus-4 december; 19 oktober 1600-27 maart 1601),
  Rome (17 december 1599-15 januari 1600), Napels (januari-februari) en Florence (10 maart-19
  oktober).
