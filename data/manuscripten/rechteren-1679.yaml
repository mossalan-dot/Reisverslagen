addenda:
- Kasboekaantekeningen, waaronder aantekening over Van Rechterens eigen reis naar Frankrijk
  ([1-5]), uitgeleende bedragen aan vrienden en familieleden ([6-9]), de reis van zijn broer
  Johan Willem van Rechteren (1658-1718), heer van Verborch, naar Jeruzalem in 1686 ([10-11]),
  de reis van zijn broer Reinhard van Rechteren (1659-1732) naar Venetië ([12-13]), de reis
  van een ander familielid in 1685 ([14-15]).
