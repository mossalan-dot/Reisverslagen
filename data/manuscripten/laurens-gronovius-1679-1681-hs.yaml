beschrijving: Verslag van een academische reis van Laurens Gronovius naar Frankrijk en Italië
  in 1679-1682. Gronovius ging scheep in Brielle en arriveerde in Dieppe. Hij verbleef langere
  tijd in de bibliotheken van Parijs en reisde vervolgens naar Lyon en Genève, waar hij de Mont
  Cenis overstak naar Italië. Daar bezocht hij Milaan en Venetië en besteedde hij langere tijd
  in de bibliotheken van Florence. Hij bezocht Rome en Napels en reisde rond in Noord-Italië,
  waar hij driekwart jaar in Florence verbleef. Hij ging scheep in Genua en arriveerde in Zuid-Frankrijk.
  Hij keerde terug naar Parijs en reisde via de Zuidelijke Nederlanden door naar Amsterdam.
  Gronovius verbleef langere tijd in Rouen (10-27 mei 1679), Parijs (27 mei-28 september), Lyon
  (7-15 oktober), Milaan (2-10 november), Florence (24 november-10 april 1680; 26 juni-6 september
  1681; 15 september-16 november), Rome (14-22 april; 5 mei-14 juni), Venetië (20 november-14
  december), Padua (14-24 december), Livorno (15-25 februari 1682), Genua (26 februari-8 maart)
  en Marseille (17-24 maart.
