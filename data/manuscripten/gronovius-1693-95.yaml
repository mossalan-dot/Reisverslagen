addenda:
- Los katern met afstandstabellen, overgenomen uit een reisgids, boekenlijst met reisliteratuur,
  Franse stadsbeschrijvingen van Acquapendente en Bolsena, kladaantekeningen van 2 november
  tot 24 december 1693.
correspondentie:
- Correspondentie met zijn broer Jacob en Antonio Magliabechi. Brieven over het overlijden
  in Venetie van Andries Bicker van Swieten (1670-96) en diens problemen met een prostituee
  rond 1694 (Targioni-Tazetti 1745, 253). Twee brieven van Laurens Gronovius aan bankier Van
  Teylingen, 1) januari 1694; 2) februari. Een brief van Antonio Magliabechi (1633-1714) aan
  Laurens Gronovius, 1) Florence, 6 juni 1696. Een brief van Laurens Gronovius aan Magliabechi,
  1) 26 mei 1696. Een brief van Laurens aan Jacob Gronovius (1645-1716), 1) 8 april 1700.
poezie:
- Een Latijns gedicht op de reis en promotie van Bicker van Swieten (Wallinga 1997a, 269-271).
