opmerkingen: 'Band/convoluut: Vijf verslagen van Franco van Bleiswijck (1644-1723) in drie
  banden. De eerste band (Ms. Den Haag, HRvA, FA Van Slingelandt 100), met drie reizen tussen
  1665 en 1667, ontbreekt. Een afschrift van een reis uit 1667 is opgenomen als los katern
  van de derde band.'
