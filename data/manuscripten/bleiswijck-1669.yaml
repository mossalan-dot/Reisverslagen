beschrijving: Onvoltooid verslag van Franco van Bleiswijck naar Engeland in 1669. De auteur
  ging scheep in Brielle en arriveerde in Harwich. Vanuit Londen maakte hij uitstapjes naar
  Oxford, Bath en Salisbury. Het verslag eindigt in Calais.
