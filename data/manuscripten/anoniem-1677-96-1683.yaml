beschrijving: Onvoltooid reisverslag naar Engeland in 1683. De anonymus stak in Brielle over
  naar Harwich en reisde naar Londen. Tijdens zijn verblijf in Londen maakte hij verschillende
  uitstapjes naar de universiteitssteden Cambridge en Oxford en de steden Bristol, Bath en
  Salisbury. Het verslag eindigt in Londen.
