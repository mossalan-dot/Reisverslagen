beschrijving: Uitvoerig verslag uit 1683 van predikant Balthasar Bekker (1634-98) naar Engeland
  en Frankrijk in het gezelschap van de heren Sermes en Miering. Hij stak in Duinkerken over
  naar Dover en bezocht in Engeland onder andere Londen, Oxford en Cambridge. Vanuit Calais
  trok hij langs Franse westkust en het Loiregebied naar Parijs. Via de Zuidelijke Nederlanden
  keerde hij terug naar Amsterdam. Bekker verbleef langere tijd in Londen (27 juli-2 augustus
  1683).
