beschrijving: Verslag van een plezierreis van Cornelis de Jonge van Ellemeet naar Friesland,
  Groningen, Overijssel, Gelderland en Kleef in 1666 in het gezelschap van Nicolaas Anthonij
  Flinck en Nicolaas Ruichaever. De Jonge van Ellemeet reisde van Leiden naar Leeuwarden en
  Groningen, doorkruiste Overijssel, maakte een uitstapje naar Kleef en Xanten en keerde terug
  via Den Bosch en Rotterdam.
