beschrijving: Onvoltooid verslag van een educatiereis van Franco van Bleiswijck naar Frankrijk,
  Zwitserland en Duitsland. Het manuscript heeft waterschade opgelopen en is moeilijk leesbaar.
  Het verslag vangt aan in Saint-Cloud bij Parijs en beschrijft vervolgens bezienswaardigheden
  in en rondom Parijs. Na een bezoek aan Zuid-Frankrijk trok de auteur naar Zwitserland en reisde
  via Duitsland terug naar Delft.
