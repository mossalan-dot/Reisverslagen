beschrijving: Verslag van een diplomatieke missie van Lodewijk Huygens naar Engeland in 1651-52
  in het gezantschap van Jacob Cats (1577-1660), Gerard Schaap (1599-1654) en Paulus van der
  Perre (ca. 1598-1653). George de Mey (1628-1712) en Adriaen Schagen (1633-99) (De Mey 1840,
  205-214; Schagen 1651-1652) schreven ook een verslag over de reis. Huygens ging scheep in
  Hellevoetsluis en arriveerde in Gravesend. Hij verbleef ca. drie maanden in Londen, waar
  hij arbeidde als persoonlijk secretaris van het gezantschap. Daarnaast maakte hij uitstapjes
  naar Oxford, Gloucester, Bath en Cardiff. Hij nam dezelfde zeeroute terug. De helft van
  het verslag is in het Frans geschreven.
