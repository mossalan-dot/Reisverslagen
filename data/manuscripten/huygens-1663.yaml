beschrijving: 'Kort verslag van een reis naar Parijs en Londen van Christiaan Huygens in 1663.
  Huygens was in april 1663 in Parijs aangekomen. Begin juni reisde hij naar Londen. In november
  was hij weer in Parijs.


  - Negen brieven aan zijn broer Constantijn, 1) Londen, 15 juni 1663; 2) 23 juni; 3) 29 juni;
  4) 13 juli; 5) 20 juli; 6) 3 augustus; 7) 24 augustus; 8) 31 augustus; 9) 14 september.


  - Vijf brieven aan zijn broer Lodewijk, 1) Londen, 29 juni 1663; 2) 6 juli; 3) 13 juli;
  4) 27 juli; 5) 10 augustus.


  - Een brief aan Robert Moray, 1) Parijs, 1 juni 1663.


  - Een brief aan Henri Louis Habert de Montmor, 1) juli 1663.'
