beschrijving: Verslag van een diplomatieke reis naar Venetië door Constantijn Huygens sr.
  in 1620 in het gezantschap van François van Aerssen van Sommelsdijk (1572-1641). Naast het
  verslag van Huygens, is er ook een officiële rapportage van Van Aerssen overgeleverd. Huygens
  vertrok uit Den Haag en reisde via Duitsland en Zwitserland naar Venetië. Hij keerde via
  dezelfde weg terug. Het gezantschap verbleef ca. drie weken in Venetië.
digitalisering:
  status: onbekend
transcriptie:
  status: onbekend
edities:
- Huygens 2003.
correspondentie:
- Tien brieven aan zijn ouders Christiaan Huygens sr. (1551-1624) en Suzanna Hoefnagel (1561-1633),
  1) Keulen, 1 mei 1620; 2) Frankfurt am Main, 7 mei; 3) Stuttgart, 19 mei; 4) Vicenza, 11
  juni; 5) Venetië, 18 juni; 6) Venetië, 19 juni; 7) Venetië, 25 juni; 8 en 9) Venetië, 2
  juli; 10) Venetië, 4 juli. Een brief aan Dorothea van Dorp (1592-1657), Stuttgart, 18 mei
  1620 (Huygens 1911-1917, I, 44-55).
poezie:
- Vier gedichten (Huygens 1892-1899, I, 185-188; Huygens 2004, 202-207). Drie Latijnse gedichten,
  1) ‘Italia decolor’; 2) ‘Libellus lectori’; 3) ‘Pro eodem’. Een Italiaans gedicht, 1) ‘Passando
  l’Alpi’.
literatuur:
