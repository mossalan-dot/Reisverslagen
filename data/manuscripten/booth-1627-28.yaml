beschrijving: Verslag van een diplomatieke reis van Abraham Booth naar Polen uit 1627-28 in
  het gezantschap van Rochus van den Honert (1572-1638), Andries Bicker (1586-1652) en Simon
  van Beaumont (1574-1654). Booth publiceerde zijn verslag in 1632. In Gdańsk ligt een proefdruk
  met aantekeningen van Booth, inclusief afwijkende pentekeningen in kleur.
