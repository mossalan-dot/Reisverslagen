addenda:
- Apodemische instructies en reisadvies in het Nederlands, Latijn en Italiaans, getiteld ‘Generalia
  haec ubique observanda’ (ff. 1r-6v); afstandstabel van Rome naar Siena met losse opmerkingen
  in het Nederlands, Latijn en Italiaans (f. 7v); lijst van Italiaanse plaatsen, getiteld
  ‘Voornaeme plaetsen in Itaeljen te sien’ (f. 9r-9v); aanvullende lijst van Italiaanse bezienswaardigheden
  en nog onbezochte plaatsen in het Latijn en Italiaans (f. 10r-10v); lijst van bezienswaardigheden
  in Italiaanse en Franse steden in het Latijn (f. 11r-11v); afstandstabellen van Italië en
  Frankrijk (f. 12r); aanvullende lijst in het Latijn van bezienswaardigheden in Italiaanse
  en Franse steden (ff. 12v-15v); afstandstabel van Frankrijk, Zwitserland, Italië, Spanje
  en de Zuidelijke Nederlanden (ff. 15v-17r); lijst van Italiaanse plaatsen die aan rivieren
  liggen (f. 17v); lijst van aanbevolen herbergen in Italië (f. 18r); aanvullende lijst van
  herbergen in Frankrijk (ff. 19r-20v); lijst van appendices (f. 189r); aantekening over metgezellen
  en lijst van aangeschafte kleding (f. 189v); wasinstructies (f. 190r); lijst van contactpersonen
  in Duitsland en Italië (f. 190r-190v); afstandstabel van Italië in het Italiaans (ff. 191r-192r);
  kasboekaantekeningen (ff. 192v-194r); losse aantekeningen (f. 195r); afstandstabel van Zwitserland
  (f. 195v); aantekeningen van aankopen, afstandstabel van Italië en Spanje (f. 196v); sleutel
  van het geheimschrift in het reisverslag, doorgekraste namen (f. 197r); afstandstabel door
  Duitsland en Italië (f. 197v).
literatuur:
- Hellemans Hooft 2001, 1-33; Witte 2002, 177-182; Van de Pol 2011, 43-78; Moss 2015, 92-93.
