beschrijving: Verslag van een educatiereis van Arnout Hellemans Hooft naar Italië en Frankrijk
  in 1649-51 in het gezelschap van de dichter Reyer Anslo (1626-69), Rombout (1620-79) en
  Joannes Hudde (1628-1704), IJsbrand Kieft, Blom en Ooms. De reis liep van Amsterdam naar
  Duitsland, waar Hellemans Hooft de Rijn volgde tot Mainz. Hij vervolgde de weg naar Neurenberg
  en Augsburg en stak de Alpen over bij Innsbruck. In Italië bezocht hij Venetië en de oostkust
  tot aan Ancona. Na een verblijf in Rome, waar hij oog had voor de ceremoniën van het Heilige
  Jaar, en een bezoek aan Napels keerde hij noordwaarts en deed hij Florence, Siena en Milaan
  aan. Hellemans Hooft stak de Alpen over en bezocht Zürich, Bern en Genève. Hij verbleef
  de winter van 1650-51 in Genève. In Frankrijk bezocht hij Avignon en Montpellier en trok
  vervolgens naar het noorden via Bordeaux. Hij bezocht het Loiregebied en Parijs in de zomer
  van 1651 en ging scheep in Le Havre. De reiziger vermeed de Zuidelijke Nederlanden en arriveerde
  per schip in Brielle. Hellemans Hooft verbleef langere tijd in Frankfurt am Main (15-21
  september 1649), Venetië (14 oktober-5 november), Rome (29 november-12 februari 1650; 7
  maart-21 april), Napels (16 februari-3 maart), Florence (25 april-8 mei), Siena (29 mei-22
  juni; 27 juni-17 augustus), Milaan (3-14 september), Lyon (2-10 oktober), Genève (11 oktober-15
  februari 1651), Montpellier (17 maart-19 april), Toulouse (27 april-4 mei), Angers (3-14
  juni), Blain (17 juni-24 juli; 6-20 augustus), Nantes (24 juli-6 augustus) en Parijs (5
  september-15 oktober.
