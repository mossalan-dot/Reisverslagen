beschrijving: Verslag van een plezierreis per jacht van Ignatia Geertruida Timmers (1714-33)
  naar de Zuidelijke Nederlanden in 1729 in het gezelschap van haar ouders Johan (1684-1738)
  en Suzanne Libertine (1684-1732), haar oudere zus Aletta Johanna (1707-75), de heren Van
  Bentinck en Van Schoonheeten, de heer Sloterdijck en zoon en de heer Van Baerle en dochter.
  Timmers reisde van Rotterdam naar Middelburg, Antwerpen en Brussel en keerde terug via Dordrecht.
