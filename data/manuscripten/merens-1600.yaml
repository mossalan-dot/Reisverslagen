beschrijving: Verslag van een reis van Jan Martenz. Merens (1574-1642) naar Frankrijk en Italië
  in 1600. Na een langer verblijf in Calais reisde Merens zuidelijk naar Parijs, Orléans en
  Lyon. Hij maakte een uitstapje naar Genève en vervolgde zijn weg naar Montpellier en Marseille.
  Hij trok per boot naar Livorno en bezocht Florence en Rome. Hij keerde terug via de oostkust
  en deed Ancona en Venetië aan. Merens stak de Alpen over en reisde noordelijk via Frankfurt
  en Bremen. Hij doorkruiste Groningen en arriveerde in Stavoren.
