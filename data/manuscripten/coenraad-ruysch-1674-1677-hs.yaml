beschrijving: Tweede verslag van een educatiereis van Coenraad Ruysch naar Zwitserland, Italië
  en Frankrijk in 1674-1677 in het gezelschap van zijn neef Dirck van Hoogeveen. Na een bezoek
  van een tweeënhalve maand in Genève stak Ruysch de Mont Cenis over naar Italië. Hij bezocht
  Milaan en Bologna en trok naar Rome, waar hij vier maanden verbleef. Hij verbleef vijf maanden
  in Florence en trok opnieuw naar Rome, vanwaar hij een uitstapje maakte naar Napels. Via de
  oostkust reisde Ruysch naar Venetië, waar hij een maand spendeerde. Hij trok naar Milaan en
  Turijn en stak opnieuw de Mont Cenis naar Genève over, waar hij twee maanden bleef. Vanuit
  Lyon maakte hij verschillende uitstapjes en keerde toen naar Zuid-Frankrijk, waar hij Avignon,
  Marseille en Toulouse bezocht. Hij keerde noordelijk naar Bordeaux en het Loiregebied. Hij
  verbleef langere tijd in Nantes vanwege een slepende ziekte. Het verslag eindigt in Saumur.
  De rest van het verslag is recentelijk verloren gegaan. Ruysch verbleef langere tijd in Genève
  (11 juli-27 september 1674; 21 maart-29 mei 1676), Florence (10-27 november 1674; 27 april-12
  september 1675), Rome (11 december-24 april 1675; 29 oktober-6 november; 27 november-9 januari
  1676), Genua (25 september-8 oktober 1675), Livorno (9-15 oktober), Napels (14-23 november),
  Venetië (23 januari-27 februari 1676), Milaan (5-12 maart), Lyon (2 juni-12 juli; 20 augustus-9
  september), Avignon (18-24 september), Marseille (27 september-6 oktober), Montauban (27 oktober-9
  november) en Nantes (8 december-31 maart 1677).
