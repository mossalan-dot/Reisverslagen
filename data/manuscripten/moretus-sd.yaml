beschrijving: 'Twee verslagen in één band van Balthasar Moretus II (1615-74). Het manuscript
  bestaat uit dertien verschillende onderdelen. Onderdelen VIII en XI zijn van de hand van
  Balthasar Moretus II, maar zijn niet chronologisch geordend. Het gaat om de volgende reisverslagen:
  III-IV) Moretus III (1668); V) Moretus III (1671); VII) Moretus III (1680); VIII) Moretus
  II (1660); IX) Van der Gouw (1653, zie no. 19); XI) Moretus II (1663); XII) F.M. Moretus
  (1739, niet in corpus); XIII) F.M. Moretus (1739, niet in corpus).'
