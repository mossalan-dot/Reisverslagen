beschrijving: Onvoltooid reisverslag van een diplomatieke reis van Cornelis van der Dussen (1684-1754)
  naar Engeland in 1706. In Londen werkt hij als persoonlijk secretaris van de gezant Willem
  Buys (1661-1749). Vanuit Londen maakte Van der Dussen uitstapjes naar Cambridge en Oxford.
  Hij verbleef langere tijd in Londen (11 januari-20 maart 1706; 15 april-1 juni) en Oxford
  (31 maart-6 april).
