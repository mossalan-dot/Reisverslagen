beschrijving: Verslag van een plezierreis van Franco van Bleiswijck in 1667 naar Den Bosch
  in het gezelschap van Johanna Doublet en andere leden van de familie Doublet. Het origineel
  ontbreekt. Dit is het afschrift dat als los katern is opgenomen bij de latere reis uit 1670-71.
