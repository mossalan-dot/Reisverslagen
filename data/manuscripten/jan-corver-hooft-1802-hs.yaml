beschrijving: Verslag van een reis van Jan Corver Hooft (1781-1855) naar Hamburg en Londen.
  Corver Hooft reed per koets naar Hamburg en ging daar scheep naar Engeland. In Londen bezocht
  hij verschillende musea en theatervoorstellingen en ontmoette Willem V (1748-1806). Het verslag
  breekt af in Bristol. Het verslag is kopie, vervaardigd door Rudolf Carol Six (1865-1915).
  Aantekeningen van Six zijn in het verslag ingelast.
