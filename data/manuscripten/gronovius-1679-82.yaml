  Graevius (1632-1703), 1) 5 februari 1674, 2) 22 september 1674. Een brief aan Tobias Andreae
  (1604-76), 1) ca. 21 april 1674. Een brief van Jacob Gronovius (1645-1716) aan Antonio Magliabechi
  (1633-1714), 1) Deventer, 1 januari 1675. Verschillende brieven aan zijn broer tijdens zijn
  reis, waaronder tweeëntwintig in de privécollectie Van Asch van Wijck 1) Parijs, 9 juni
  1679; 2) 22 juni; 3) 12 augustus; 4) 27 augustus; 5) 15 september; 6) 25 september; 7) Florence,
  28 november; 8) 5 december; 9) 12 december; 10) 20 maart 1680; 11) Rome, 21 april; 12) 11
  mei; 13) Florence, 5 augustus; 14) 13 augustus; 15) 14 oktober; 16) 11 november; 17) 7 januari
  1681; 18) 30 januari; 19) 12 maart; 20) Rome, 19 mei; 21) Florence, 17 juli); 22) 26 augustus
  (Gronovius 1679-1681). Een brief aan Pierre Daniel Huet (1630-1721), 1) Parijs, 1679 (Gronovius
  1679).
