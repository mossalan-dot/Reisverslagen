id: gronovius-1679-82
titel_aanduiding: Itinerarium Laurentii Theodori Gronovii qui A.C. MDCLXXIX die III maii Haga
  Comitum profectus iter suscepit in Italiam et Lugdunum Batavorum rediit die XXI aprilis
  A.C. MDCLXXXII
