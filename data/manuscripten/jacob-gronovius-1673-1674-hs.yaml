beschrijving: Onvoltooid verslag van een academische reis van Jacob Gronovius naar Italië in
  1673-1674. Gronovius ging in Spanje scheep en arriveerde in Livorno. In Italië bezocht hij
  plaatsen rondom Florence en Pisa. In Florence verbleef hij ca. zes weken. Het verslag eindigt
  in Pisa.
