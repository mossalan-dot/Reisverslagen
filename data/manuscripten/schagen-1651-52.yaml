beschrijving: Verslag van een diplomatieke reis van Adriaen Schagen naar Frankrijk en Engeland
  in 1651-52 in het gezantschap van Jacob Cats (1577-1660), Gerard Schaap (1599-1655) en Paulus
  van der Perre (ca 1598-1653). Lodewijk Huygens (1631-99) en George de Mey (1628-1712) (Huygens
  1651-1652; De Mey 1840, 205-214) schreven ook een verslag over de reis. Het verslag werd
  opgetekend in 1659.
