beschrijving: Verslag uit 1723-1724 naar Frankrijk, Italië en Zwitserland van Jan Alensoon (1683-1769)
  samen met Marcus Drabbe. Als muziekkenner en zanger had Alensoon vooral aandacht voor buitenlandse
  concerten en musici. Hij trok vanuit Leiden door de Zuidelijke Nederland en bezocht Parijs.
  Vanuit Lyon stak hij de Mont Cenis over naar Turijn, vanwaar hij doorreed naar Venetië, Rome
  en Napels. Hij keerde terug via Zwitserland en Duitsland. Alensoon verbleef langere tijd in
  Parijs (18 september-5 oktober 1723); Lyon (10-17 oktober); Turijn (23 oktober-30 december;
  13 juli-9 augustus 1724); Milaan (1-22 januari); Rome (12 april-22 mei) en Genua (10 juni-10
  juli).
