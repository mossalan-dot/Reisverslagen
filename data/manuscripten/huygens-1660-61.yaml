corpus_gor: M. 059
beschrijving: 'Verslag van een reis naar Frankrijk en Engeland van Christiaan Huygens in 1660
  en 1661. Huygens reisde door de Zuidelijke Nederlanden, waar hij stilhield in Antwerpen
  en Brussel. Huygens reisde van Parijs naar Calais en vertrok naar Dover. Hij spendeerde
  langere tijd in Londen, waar hij onder andere de kroning van Karel II (1630-85) bijwoonde.
  Het verslag eindigt in Londen.


  - Negen brieven aan zijn broer Constantijn, 1) Parijs, november 1660; 2) 5 november; 3)
  19 november; 4) 26 november; 5) 28 november; 6) 10 december; 7) 4 februari 1661; 8) 11 februari;
  9) Londen, 12 april.


  - Drie brieven aan zijn broer Lodewijk (1631-99), 1) Parijs, 18 december 1660; 2) 26 januari
  1661; 27 februari.


  - Drie brieven aan Leopoldo de’ Medici, 1) Parijs, 28 november 1660; 2) december; 3) 21
  januari 1661. - Twee brieven aan Nicolaas Heinsius, 1) Parijs, 19 november 1660; 2) 11 februari
  1661.


  - Een brief aan Michael Angelo Ricci (1619-92), 1) Parijs, 18 februari 1661.


  - Een brief aan Carlo Roberto Dati (1619-76), 1) Parijs, 28 november 1660.'
