addenda:
- Negen tekeningen (RKD), 1) De kerk van Sint-Job-in-‘t-Goor, maart 1675; 2) Klooster Bethlehem
  nabij Herent, 8 juni 1675; 3) Norbertijnenabdij van Averbode vanuit het noordwesten, 14
  juni 1675; 4) Het dorp Beverlo, 15 juni 1675; 5) Landhuis met kapel bij Halle, 24 juli 1675;
  6) Marktplaats met met de H. Veronuskerk, te Lembeek, 3 augustus 1675; 7) Gezicht op Braine-le-Comte
  (‘s-Gravenbrakel) met de kerk van Saint-Géry, vanuit het zuidoosten, 21 augustus 1675; 8)
  Het dorp Thieusies, 25 augustus 1675; 9) Gezicht op het dorp Strépy met de St.-Martinuskerk,
  30 augustus 1675.
correspondentie:
- Vier Franstalige brieven van zijn broer Christiaan, 1) Parijs, 24 mei 1675; 2) 5 juli; 3)
  19 juli; 4) 9 augustus (ePistolarium).
opmerkingen: 'Band/convoluut: Acht verslagen in veertien banden van Constantijn Huygens jr.
