beschrijving: Verslag van een plezierreis van Adriana de la Court, geschreven omtrent 1740,
  naar de Zuidelijke Nederlanden. Zij werd vergezeld door haar broer Allard (1688-1755), zus
  Catharina Adriana (1691-1752), schoonzus (en nicht) Catharina Backer (1689-1766) en neef
  en nicht Bogaerd. De reis ging naar Antwerpen en Brussel.
