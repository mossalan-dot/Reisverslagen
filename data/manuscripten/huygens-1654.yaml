id: huygens-1654
titel_aanduiding: Verbael van zyne verrichtinge ende wedervaren tot Eyndoven, Cranendonq,
  Inde Landen van Vyanden, St. Vyth, Butgenbach ende Daesburch, alsmede tot Moers, 1654
reizen:
