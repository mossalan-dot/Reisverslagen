- Huygens 2013.
correspondentie:
- Acht brieven. Vijf brieven van zijn zwager David le Leu de Wilhem (1588-1658), 1) Den Haag,
  3 augustus 1654; 2) 11 augustus; 3) 14 augustus; 4) 18 augustus; 5) augustus. Een brief
  aan Marguérite Claire van Noyelles, 1) Spa, 22 juli 1654. Een brief aan Amalia van Solms-Braunsfels
  (1602-75, 1) Spa, 3 augustus 1654. Een brief aan De Marolles, 1) Vianden, 28 augustus 1654.
poezie:
- Zeven Franse en Latijnse gedichten, 1) ‘Du papier à la fontaine pour Mad.le M. de Merode’
  (Spa, 8 augustus 1654); 2) ‘Le regime de Spa’ (Spa, 14 augustus); 3) ‘Ad Annam Mariam Schurmannam
  civem, ut tum credebatur, coloniensem’ (Trier, 5 september); 4) ‘In Ausonij Mosellam’ (over
  de Moesel, 7 september); 5) ‘In augustam Trevirorum longâ belli calamitate exhaustam’ (over
  Trier, 7 september); 6) ‘In Mosellam’ (Zell, 7 september); 7) ‘Aende vrouw van Merode’ (Dordrecht,
  22 september).
literatuur:
