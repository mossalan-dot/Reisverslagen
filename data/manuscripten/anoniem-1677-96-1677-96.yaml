beschrijving: Drie verslagen van een anonieme inwoner van Amsterdam verzameld in één band.
  De anonymus wordt in secundaire literatuur omwille van zijn paternalistische adviezen ‘de
  Amsterdamse vader’ genoemd. Uitvoerig en zorgvuldig handschrift met weinig exacte data.
