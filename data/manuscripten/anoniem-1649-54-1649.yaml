opmerkingen: 'Onderdeel van een convoluut: Den Haag, KB, 70 H 28. Vier verslagen in één band
  van twee zakenreizen naar Spanje, Portugal en Italië om de belangen te behartigen van een
  Dordtse touwslagerij (lijnbaan) in opdracht van Cornelis van Hoogeveen en Cornelis van de
  Graeff.'
