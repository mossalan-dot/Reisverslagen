beschrijving: Onvolledig en kort verslag van een plezierreis van Cornelia Carolina de Vassy
  naar Den Haag in 1748 in het gezelschap van het echtpaar Thibaut en hun dochters, Leendert
  Bomme en zijn twee zonen, Elias de Haze (1689-1752) en zijn echtgenote Catharina Emants
  (1715-12). Het verslag is in rijmvorm geschreven. De Vassy reisde van Middelburg naar Goes.
  Ze maakte een kort uitstapje naar Bergen op Zoom om de schade van de Oostenrijkse Successieoorlog
  te bezien. Het verslag eindigt nabij Roosendaal.
