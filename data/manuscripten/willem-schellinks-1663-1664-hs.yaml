beschrijving: "Vier reisverslagen in drie banden van Willem Schellinks (1623-1678). Het betreft\
  \ een netversie, deels gebaseerd op Lambert van den Bos’ Wegh-wyser uit 1665, waarschijnlijk\
  \ geschreven tussen 1665 en 1668. Het verslag was waarschijnlijk bedoeld ter uitgave. Een\
  \ zeventiende-eeuwse kopie van de laatste drie verslagen ligt in de Bodleian Library in Oxford\
  \ (Ms. D’Orville 558-560). \n\nNederlands, pp. 473 (318-791).\n\nTweede deel van het verslag\
  \ van bovengenoemde educatiereis. Dit deel beschrijft de reis naar Frankrijk en Zwitserland\
  \ tussen 1663 en 1664. Schellinks reisde van Rouen naar Parijs, waar hij langere tijd bleef.\
  \ Hij trok langs de Loirestreek en reisde door naar Bordeaux, Montpellier en Marseille. Hij\
  \ bezocht Genève en Lyon en trok door naar Italië. Het deel eindigt in Rome. Schellinks verbleef\
  \ langere tijd in Rouen (23 april-10 mei), Parijs (11 mei-28 juni), Bordeaux (7-27 september)\
  \ en Rome."
