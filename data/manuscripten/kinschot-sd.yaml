beschrijving: Verslag van een educatiereis van Caspar van Kinschot (1622-49) naar Frankrijk
  in 1643 en 1644. Van Kinschot ging scheep in Hellevoetsluis en arriveerde in Boulogne-sur-Mer.
  Zijn verslag eindigt in Midden-Frankrijk.
