correspondentie:
- Een brief aan Nicolaas Heinsius (1620-81), 1) Rouen, 26 april 1645 (Van Kinschot 1645).
poezie:
- 'Latijnse gedichten over Frankrijk en Franse geschiedenis, postuum uitgegeven door Jacob
  Gronovius (1645-1716) (Van Kinschot 1685). Het gaat om 22 gedichten, 1) ‘Pugna Rocrojana’;
  2) ‘In Galliam’; 3) ‘In statuam equestrem Parisiensem Henrici Quarti’ (over het ruiterstandbeeld
  van Hendrik IV (1553-1610) in Parijs); 4) ‘De eadem ad Sequanam’ (over de Seine); 5) ‘In
  urbem Blaesensem’ (over Blois); 6) ‘Rupella’; 7) ‘In Burdigalam’ (over Bordeaux); 8) ‘In
  cubiculum natale Josephi Scaligeri’ (over de woonplaats van de geleerden Julius Caesar (1484-1558)
  en Josephus Justus Scaliger (1540-1609) in Agen); 9) ‘In cranium Jul. Caes. Scaligeri’;
  10) ‘Monspelium’ (over Montpellier); 11) ‘Amphiteatrum Nemausense’ (over het amfitheater
  van Nîmes); 12) ‘In fontem Nemausensem prope templum Dianae’ (over de aquaduct bij Nîmes);
  13) ‘Pons Gardonius’ (over de Pont du Gard); 14) ‘In Massiliam’ (over Marseille); 15) ‘Aquae
  Sextiae’ (over Aix-en-Provence); 16) ‘Ad Sorgam fl. de Petrarcha et Laura’ (over het huis
  van Petrarca (1304-1374) bij Fontaine-de-Vaucluse); 17) ‘Ad Lauram’; 18) ‘In arcem Arausionensem’
  (over de triomfboog van Orange); 19) ‘Ad illustres reip. Tigurinae proceres’; 20) ‘Regiacum
  Atrebatum urbs fortissima à Ludovico justo occupata’ (over Arras); 21) ‘In rosas a Gallis
  captas’, 22) ‘Iter Toxandricum sermone serpente, & stylo pedestri scriptum, ad Goesios fratres’
  (over de reis door Zeeland). Een Latijns gedicht van Nicolaas Heinsius (1620-81), ‘Elegia
  IV: Pausilipus. Ad Casparem Kinschotium’ (aan Caspar van Kinschot, over Napels) (Heinsius
  1666).'
