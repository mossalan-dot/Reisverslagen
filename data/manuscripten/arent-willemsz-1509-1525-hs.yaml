beschrijving: Verslag van een pelgrimstocht van Delft naar Jeruzalem, via Maastricht, Keulen,
  Trente, Venetië, Kreta, Candia (thans Iraklion), Cyprus en Jaffa en terug. De auteur maakte
  de reis in gezelschap van zeven anderen. Gevolgd door aantekeningen betreffende het gezin
  van de auteur. Voorts genealogische aantekeningen betreffende het geslacht Van Overschie (1623-1697).
