beschrijving: Verslag van Cornelis van Beveren (1591-1663) uit 1612-1613 van een educatiereis
  naar Frankrijk in het gezelschap van Gaspar van Kinschot (1592-1654), Van Blockhusen, Wouter
  van Clootwijck en diens zwager. Van Beveren reisde langs het Loiregebied, waar hij aan de
  universiteit van Orléans promoveerde in de rechten. Hij keerde terug via Zwitserland en Duitsland.
