addenda:
- Vier tekeningen, 1) Gezicht op de stad Düren, gezien vanuit het zuiden, oktober/november
  1673; 2) Gezicht op Königshoven met centraal de St.-Petruskerk, 26 oktober 1673; 3) Panorama
  met links Solingen, rechts van het midden Keulen en uiterst rechts het Siebengebirge, vermoedelijk
  27 oktober 1673; 4) Gezicht op Bonn, vanuit het zuidwesten, 9 november 1673.
opmerkingen: 'Band/convoluut: Acht verslagen in veertien banden van Constantijn Huygens jr.
