korte_typering: 'Maakte rond 1674-1675 een educatiereis naar Italië. Eerste reis: 01-01-1674
  (24 jaar)'
biografie: Zoon van thesaurier-generaal Coenraad Burgh (1619-1699), heer van Kortenhoef, en
  Christina Hellemans Hooft (1628-1681). Leerling of bekende van Baruch Spinoza (1632-1677)
  in Leiden. Maakte een educatiereis tussen 1674 en 1675 en bekeerde zich tot het katholicisme,
  tot groot schandaal van de Republiek en de Nederlandse gemeenschap in Italië. Maakte noviciaat
  in het klooster van de Reformella van de Zalige Minderbroeder Bonaventura de Barcinone en
  nam de naam Franciscus de Hollandia aan. Ontving in 1682 de priesterweiding en bekleedde enkele
  ambten bij de minderbroeders. Werd meermaals kandidaat gesteld voor het apostolisch vicarisschap
  in Neercassel.
