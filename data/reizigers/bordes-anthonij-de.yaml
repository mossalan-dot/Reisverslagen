korte_typering: Amsterdam, 1615 – Amsterdam, 1678. Maakte rond 1648 een educatiereis naar
  Italië (ca. 33 jaar).
biografie: Werkte als linnenkoopman in Amsterdam met zijn oudere broer Boudewijn. Maakte rond
  1648 een educatiereis naar Italië en liet zichzelf portretteren door de Brusselse schilder
  Michiel Sweerts (1618-64).
