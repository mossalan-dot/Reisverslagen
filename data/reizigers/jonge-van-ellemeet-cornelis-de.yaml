id: jonge-van-ellemeet-cornelis-de
naam: Jonge van Ellemeet, Cornelis de
geboren:
  jaar: 1646
  datum: 6 mei 1646
  plaats: Brielle
overleden:
  jaar: 1721
  datum: 12 maart 1721
  plaats: Den Haag
korte_typering: Heer van Ellemeet, in Elkerzee, van Poortvliet, Kloetinge, Schipluiden, Hodenpijl,
  St. Maartensrecht en Dalem. Brielle, 6 mei 1646 – Den Haag, 12 maart 1721. Maakte in 1666
  een plezierreis naar Gelderland en Kleef (20 jaar).
biografie: Zoon van Jacob de Jonge van Ellemeet (1601-50) en Magdalena Briel (1617-85), broer
  van Johanna (1643-93) en Cecilia (1648-86). Studeerde filosofie in Leiden en promoveerde
  in de rechten in Angers. Reisde in 1666 naar Gelderland en Kleef. Maakte in 1666 en 1667
  een educatiereis naar Frankrijk en Engeland in het gezelschap van neef Pieter Pieterson,
  Justus van der Cijs en (vanaf Parijs) neef Cornelis de Jonge van Oosterland (1645-94). In
  1669 maakte hij een plezierreis naar Antwerpen en Brussel. Was leenman en heemraad van Voorne
  en pensionaris van Brielle en Rotterdam. Werd in 1674 benoemd tot ontvanger-generaal van
  de Verenigde Nederlanden. Verder speculeerde hij in effecten en landerijen. Tussen 1680
  en 1682 liet hij het landgoed Duinrell in Wassenaar aanleggen.
reizen_vermeld:
