id: assendelft-maria-van-2
naam: Assendelft, Maria van (2)
korte_typering: Dochter van Adriaan Gerrits van Assendelft (1664-1742) en Maria Magdalena
  van Beresteijn (1667-1715). In 1696 maakte zij samen met haar ouders, haar zus Catharina,
  haar tante Maria (†1744) en oom Willem (†1744) een plezierreis naar Nijmegen, Kleef en paleis
  Het Loo.
reizen_vermeld:
- Juli 1696, Nijmegen, Kleef en Het Loo.
verslagen_vermeld:
- Assendelft 1696.
bronnen:
- gemaakt-op-reis
