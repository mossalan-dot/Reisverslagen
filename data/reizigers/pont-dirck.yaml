id: pont-dirck
naam: Pont, Dirck
korte_typering: Maakte in 1675 een plezierreis per boot naar Overijssel, Friesland, Groningen
  en Emden en naar de Zuidelijke Nederlanden met Gerard Hinlopen (1644-91).
reizen_vermeld:
- Mei 1675, Duitsland; juni-juli 1675, Zuidelijke Nederlanden.
verslagen_vermeld:
- Hinlopen 1675a.
bronnen:
- gemaakt-op-reis
