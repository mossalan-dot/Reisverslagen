id: soetens-michiel
naam: Soetens, Michiel
korte_typering: Den Haag, º1626. Maakte in 1650-57 een kunstenaarsreis naar Italië (24 jaar).
biografie: Was een leerling van Alexander le Petit (ca. 1612-ca. 1658) en was lid van het
  Haagse schildersgilde. Reisde tussen 1650 en 1657 door Italië, onder anderen met de dichter
  Joannes Six van Chandelier (1620-95). Bezocht de Brennerpas, Bolzano, Venetië en Rome. Was
  mogelijk lid van de Bentvueghels met de bentnaam Spreeuwbek.
reizen_vermeld:
- ca. 1650-57, Italië..
poezie:
- 'Drie gedichten van Joannes Six van Chandelier op Soetens, 1) ‘Berouw op de weeromreis van
  Venecie, aan Michiel Soetens schilder’, 2) ‘Op de reise door Tirool, met Michiel Soetens
  schilders: aan den selven’, 3) ‘Op geschildert marmer, door Michiel Soetens’ (Six van Chandelier
  1991).'
literatuur:
- Hoogewerff 1950, 92-94; Hoogewerff 1952, 143; RKD.
bronnen:
- gemaakt-op-reis
