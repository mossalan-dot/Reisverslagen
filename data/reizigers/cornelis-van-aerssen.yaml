korte_typering: 'Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk, Italië en Spanje.
  Eerste reis: 01-01-1651 (14 jaar)'
biografie: "Zoon van Cornelis van Aerssen van Sommelsdijk (1600-1662) en Lucia van Walta (1610-1674),\
  \ broer van François (1630-1658). Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk,\
  \ Italië en Spanje in het gezelschap van zijn broer, Justinus II van Nassau (1633-1658) en\
  \ tutor Antoine de Brunel (1622-1696). Mogelijk schoof hij, gezien zijn jonge leeftijd, later\
  \ aan. Verbleef in 1656 in Frankrijk met zijn neven Philips (1636-1689) en François de Zoete\
  \ van Laecke (1637-1720). Werd in 1671 ritmeester en in 1680 kolonel. In 1683 kocht hij grote\
  \ delen van Suriname van de West-Indische Compagnie en reorganiseerde daar het bestuur. In\
  \ 1688 werd hij tijdens een soldatenoproer door muiters vermoord. \n\nVerslagen: De Zoete\
  \ van Laecke 1656-1658; De Brunel 1665; De Zoete van Laecke 1862; Van Aerssen van Sommelsdijk\
  \ 1903, 177-256."
