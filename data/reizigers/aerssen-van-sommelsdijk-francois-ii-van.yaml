id: aerssen-van-sommelsdijk-francois-ii-van
naam: Aerssen van Sommelsdijk, François II van
geboren:
  jaar: 1630
  datum: 29 oktober 1630
overleden:
  jaar: 1658
  datum: 14 november 1658
  plaats: Zierikzee
korte_typering: Heer van de Plaat. 29 oktober 1630 – Zierikzee, 14 november 1658. Reisde door
  Frankrijk en studeerde in Bourges in 1646 (16 jaar).
biografie: Zoon van Cornelis van Aerssen van Sommelsdijk (1600-62) en Lucia van Walta (1610-74),
  broer van Cornelis (1637-88). Verbleef in 1646 in Bourges. Maakte tussen 1651 en 1655 een
  educatiereis naar Frankrijk, Italië en Spanje in het gezelschap van zijn broer, Justinus
  II van Nassau (1633-58) en tutor Antoine de Brunel (1622-96). Reisde in 1658 naar Engeland.
  Verdronk tijdens de terugreis voor de kust van Zierikzee.
reizen_vermeld:
- 1646, Bourges; 1651-55, Frankrijk, Italië en Spanje; 1658, Engeland.
verslagen_vermeld:
- Van Aerssen van Sommelsdijk 1903, 177-256; De Brunel 1665.
poezie:
- Een Latijns gedicht van Constantijn Huygens sr. (1596-1687) en Constantijn Huygens jr. (1628-87)
  aan vader Cornelis, 1) ‘Nobilissimi naufragi Francisci Arssenij plat. toparchae epitaphium’
  (12 januari 1659, over de schipbreuk en het overlijden van de reiziger) (Huygens 1896, 257).
literatuur:
- BNW, I, 113; Van Aerssen van Sommelsdijk 1903, 173-177; Hoogewerff 1944, 153-157; Frank-van
  Westrienen 1983, 325.
bronnen:
