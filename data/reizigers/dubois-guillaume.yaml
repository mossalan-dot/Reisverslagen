id: dubois-guillaume
naam: Dubois, Guillaume
naamsvarianten:
- Bois, Guillam du
korte_typering: Haarlem, 6 juli 1625 – Haarlem, juli 1680. Maakte in 1652-53 een kunstenaarsreis
  naar Duitsland (29 jaar).
biografie: Lid van het Haarlemse schildersgilde. Maakte tussen 1652 en 1653 een kunstenaarsreis
  naar Duitsland, Zwitserland en Frankrijk in het gezelschap van Vincent Laurensz van der
  Vinne (1628-1702), Dirck Helmbreeker (1633-96), Cornelis Bega (1631-64) en de schoenmakersgezel
  Joost Boelen (ºca. 1633). Van der Vinne hield een verslag bij.
reizen_vermeld:
- Augustus 1652-maart 1653, Duitsland.
verslagen_vermeld:
- Van der Vinne 1652-1655; Stelling-Michaud 1937, 54-72; Van der Vinne 1979.
addenda:
- Verschillende schilderijen van landschappen (RKD).
literatuur:
- RKD; Gilthay 1977, 144-165.
bronnen:
- gemaakt-op-reis
