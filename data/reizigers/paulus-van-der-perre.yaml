korte_typering: 'Maakte in 1651-1652 een diplomatieke reis naar Engeland. Eerste reis: 20-12-1651
  (53 jaar)'
biografie: Zoon van Adriaan van der Perre en Adriana Dircx Hayman. Was tussen 1636 en 1653 schepen,
  raad, burgemeester, secretaris en pensionaris van Middelburg. Maakte in 1651 en 1652 een diplomatieke
  missie naar Engeland in het gezelschap van Jacob Cats (1577-1660) en Gerard Schaap (1599-1655).
  De reis wordt beschreven door Adriaen Schagen (1633-1699), Lodewijk Huygens (1631-1699) en
  George de Mey (1628-1712).
