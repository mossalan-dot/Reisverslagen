korte_typering: 'Maakte in 1664-1665 een educatiereis naar Italië. Eerste reis: 30-09-1664 (24
  jaar)'
biografie: Zoon van André van Kessel en Catherine de Bruyne van Aalst. Maakte in 1664 en 1665
  een educatiereis naar Italië onder leiding van tutor Hendrik Hillewerve (1621-1694) en samen
  met Balthasar Moretus III (1646-1696), Jan Tholinx jr. (1631-1705) en Pieter Goos (1645-1708).
  Was schepen en in 1688 burgemeester van Antwerpen.
