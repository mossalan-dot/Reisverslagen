biografie: Zoon van burgemeester Arnoldus Vollenhove en Geertruy Alten. Ging school in Kampen
  en studeerde theologie in Utrecht en Groningen. Werd achtereenvolgens predikant in Vledder,
  Zwolle en Den Haag. In 1674 reisde hij als predikant naar Londen in het diplomatieke gezantschap
  van Coenraad van Beuningen (ca. 1622-1693), Willem Adriaan van Nassau-Odijck (ca. 1632-1705),
  Willem van Haren (1626-1708) en Frederik van Reede tot Renswoude (ca. 1630-1715). Werd in
  1681 curator van de Latijnse school in Den Haag. Publiceerde verschillende gedichten en preken,
  waaronder in de bundels Poëzy (1686) en de postume uitgaven Kruistriomf en gezangen (1750)
  en De heerlykheit der rechtvaardigen (1723).
