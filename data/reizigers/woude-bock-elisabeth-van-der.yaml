korte_typering: Nieuwe Niedorp, 11 januari 1657 – Amsterdam, 11 december 1698. Reisde in 1676-77
  naar Frans-Guyana (19 jaar).
biografie: Dochter van Herman Hartman van der Woude (1621-77) en Margarita Blaeuhulck (1621-62).
  Reisde in 1676 en 1677 samen met haar vader, broer Johannes (º1658) en zus Margaretha (1661-87)
  naar Frans-Guyana, waar haar vader gouverneur zou worden. Werd ontvoerd door kapers onder
  bevel van kapitein Jean Bart en werd uiteindelijk bij Bergen in Noorwegen overgedragen aan
  een Nederlandse visser. Trouwde in 1684 met de wijnkoper Adolf Frederick Bock (†1700).
reizen_vermeld:
