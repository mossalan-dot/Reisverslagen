biografie: Zoon van Jan Teding van Berkhout (1547-ca. 1633) en Levina Adriaensdr. van Duivendrecht
  (†1601), vader van Volkert (1601-1632) en Paulus (1609-1672). Studeerde rechten in Leiden.
  Maakte in 1595 een educatiereis naar Frankrijk, waar hij promoveerde in Orléans. Was pensionaris
  en thesaurier van Monnikendam en werd in 1605 rekenmeester van Holland. Werd in 1613 aangesteld
  als lid van de Raad van State en tot raad van het Hof van Holland.
