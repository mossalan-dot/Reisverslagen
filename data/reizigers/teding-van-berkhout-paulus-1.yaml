  datum: 24 juni 1672
  plaats: Den Haag
korte_typering: Den Haag, 23 februari 1609 – Den Haag, 24 juni 1672. Maakte in 1633 een reis
  naar Engeland en Frankrijk (24 jaar).
biografie: Zoon van Adriaan Teding van Berkhout (1571-1620) en Margaretha Duyst van Beresteyn
  (1581-1635), halfbroer van Volkert (1601-32) en vader van Pieter (1643-1713) en Joan (1648-1720).
  Studeerde in Brielle en Leiden. Maakte in 1633 een reis naar Engeland en Frankrijk en promoveerde
  in Angers in de rechten. Werd in 1634 advocaat van het Hof van Holland en in 1635 pensionaris
  van Monnikendam. Werd in 1649 raad en rekenmeester van de Domein- en Rekenkamer van Holland.
reizen_vermeld:
- 1633, Engeland en Frankrijk.
addenda:
- Bul van de universiteit van Angers (Bul als doctor juris 1633-1634).
