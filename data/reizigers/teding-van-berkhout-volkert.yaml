- '- Drie Latijnse brieven van Volkert aan zijn halfbroer Paulus, 1) Parijs, 25 mei [1627];
  2) Rome, 23 juni 1628; 3) Siena, 3 maart 1630 (Teding van Berkhout 1628-1630); vertalingen
  van de brieven, waarschijnlijk vervaardigd door Frank-van Westrienen.'
- '- Een Franse brief aan de zoon van de hertog van Guise, waarschijnlijk François (1612-39),
  prins van Joinville, 1) Marseille, 9 september 1627 (Teding van Berkhout 1627).'
- '- Een Nederlandse brief van Baldoino Breijel, 1) Rome, 13 januari 1629 (Breijel 1629).'
- '- Zeven Italiaanse brieven van Landi, 1) Rome, 21 september 1630; 2) 23 september; 3) 5
  oktober; 4) 7 oktober; 5) 28 oktober; 6) 14 december; 7) 12 juli 1631 (Landi 1631).'
- '- Drie Italiaanse brieven van Georgio Mazio, tolk van de Duitse natie en soldaat in de
  Duitse garde van de groothertog van Toscane, 1) Florence, 20 juli 1631; 2) 20 juli; 3) 22
  juli (Mazio 1731).'
- '- Een brief over het ongeluk van Adriaan van Vrijburch van Nicolaas (1584-1654) aan Maria
  van Reigersberg (1589-1653), 8 april 1629 (De Groot 1928-1969, IV, 487-488).'
