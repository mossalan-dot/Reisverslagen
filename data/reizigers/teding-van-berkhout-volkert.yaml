id: teding-van-berkhout-volkert
naam: Teding van Berkhout, Volkert
korte_typering: 1601 – nabij Neurenberg (D), 5 september 1632. Maakte in 1620 een educatiereis
  naar Frankrijk (19 jaar).
biografie: Zoon van Adriaan Teding van Berkhout (1571-1620) en Geertruyt Volkertsdr. Gael
  (º1571-ca. 1601), halfbroer van Paulus (1609-72). Studeerde filosofie in Leiden en reisde
  in 1620 naar Frankrijk met tutor Thomas Erpenius (1584-1624). Tussen 1621 en 1623 maakte
  hij een diplomatieke reis naar Engeland in het gezantschap van François van Aerssen van
  Sommelsdijk (1572-1641), Diederick Bas (1569-1637) en Hendrik van Tuyll van Serooskerken
  (1574-1627). Was in 1623 edelman in het gevolg van Charles de Lorraine (1571-1640), hertog
  van Guise. Maakte rond 1623-27 een educatiereis naar Italië en werd benoemd tot consul van
  de Natio Germanica in Siena. Werd tot Maltezer ridder geslagen. Werd na een fataal duel
  met Adriaan van Vrijburch (ca. 1605-28) gemeden door zijn familie en probeerde vanuit Italië
  zijn naam te zuiveren. Koos voor een militaire carrière en werd lijfcornet in een ruiterregiment.
  Stierf, waarschijnlijk ten gevolge aan een infectie, na de Slag om Neurenberg in 1632.
reizen_vermeld:
- 1620, Frankrijk; december 1621-februari 1623, Engeland; 1623-32, Frankrijk, Italië en Duitsland.
verslagen_vermeld:
- Boelen 1621-1624.
addenda:
- Verbaal van het gezantschap, hierboven genoemd (SG 8343); notarieel testament en testamentaire
  aantekeningen van Volkert gemaakt voor zijn vertrek naar Frankrijk in 1620 (Teding van Berkhout
  1620); Italiaanse verklaring over het overlijden van Adriaan van Vrijburch, door baljuw
  frater Jacob Christoph ab Andlau (Ab Andlau 1628); verklaring in het Frans van de Romeinse
  gardist Feliciano Primano over het overlijden van Adriaan van Vrijburch, d.d. 10 juli 1629,
  inclusief een contemporaine vertaling) (Primano 1629).
correspondentie:
