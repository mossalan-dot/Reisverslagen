biografie: Zoon van Gullielmo Bartholotti van den Heuvel (1602-1658) en Jacoba Aernouts van
  Erp (1608-1665). Was dijkgraaf en baljuw van Bijlmermeer en kolonel van het regiment van Amstelveen.
  Nam in januari 1674 de leiding over van het Amsterdamse koopmans- en bankiershuis Bartholotti
  van zijn broer Gullielmo (1638-1674). Maakte in datzelfde jaar een diplomatieke reis naar
  Londen in het gezantschap van Coenraad van Beuningen (ca. 1622-1693), Willem van Haren (1626-1708),
  Willem Adriaan van Nassau (ca. 1632-1705) en Frederik baron van Reede tot Renswoude (ca. 1630-1715).
  De reis werd beschreven door predikant Joannes Vollenhove (1631-1708). Zijn zus Jacoba Victoria
  (1639-1718) trouwde later met de missieleider Van Beuningen.
