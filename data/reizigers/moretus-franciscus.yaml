korte_typering: Antwerpen, 19 oktober 1656 – Antwerpen, 27 februari 1705. Katholiek. Maakte
  in 1668 een reis naar Den Bosch (11 jaar).
biografie: Zoon van Balthasar II Moretus (1615-74) en Anna Goos (1627-91), broer van Balthasar
  III (1646-96), Joannes Jacobus (1647-1718) en Maria Isabella (1655-76). Was priester, kanunnik
  en protonotarius apostolicus in de Onze-Lieve-Vrouwekathedraal van Antwerpen vanaf 1681.
  Maakte in 1668 een reis naar Den Bosch met zijn ouders, broers en zussen.
reizen_vermeld:
