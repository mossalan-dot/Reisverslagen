biografie: Zoon van griffier François Fagel (1740-1773) en Anna Maria Boreel (1739-1781). Studeerde
  rechten in Leiden en Göttingen. Maakte in 1781 met zijn moeder een reis naar het kuuroord
  Bad Pyrmont, reisde naar de Elzas en Duitsland in 1783 en maakte een tweede reis naar Duitsland
  in 1785. Trouwde in 1790 met Agneta Boreel (1770-1824). Maakte in 1786 een reis met zijn toekomstige
  echtgenote en haar oom naar Zwitserland en Italië. Werd griffier van de Staten-Generaal. Maakte
  diplomatieke reizen naar Engeland in 1788 en 1794. Ging in 1795 in ballingschap naar Engeland
  en keerde in 1813 terug met Willem I (1772-1843). Maakte in 1796 een voettocht naar Zwitserland.
  Werd in 1814 in de adelstand verheven.
