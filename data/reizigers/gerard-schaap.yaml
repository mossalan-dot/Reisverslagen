korte_typering: 'Reisde en studeerde tussen 1618 en 1622 in Italië en Frankrijk. Eerste reis:
  01-01-1622 (23 jaar)'
biografie: Maakte tussen 1618 en 1622 een reis naar Italië en Frankrijk, waar hij in Orléans
  licentiaat behaalde in de rechten. Was raad van Amsterdam tussen 1638 en 1655 en schepen in
  1638. Maakte in 1644 en 1645 een diplomatieke reis naar Denemarken en Zweden. Maakte in 1651
  en 1652 een diplomatieke missie naar Engeland in het gezelschap van Jacob Cats (1577-1660)
  en Paulus van der Perre (ca. 1598-1653). De reis wordt beschreven door Adriaen Schagen (1633-1699),
  Lodewijk Huygens (1631-1699) en George de Mey (1628-1712).
