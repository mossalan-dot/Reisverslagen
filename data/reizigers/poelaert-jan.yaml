id: poelaert-jan
naam: Poelaert, Jan
geboren:
  jaar: 1653
overleden:
  jaar: 1701
korte_typering: 1653 – 1701. Maakte rond 1698-99 een reis naar Italië (43 jaar).
biografie: Zoon van Allard Poelaert en Adriane van Groenendijck, zwager van Pieter de la Court
  van der Voort (1664-1740). Maakte rond 1698 en 1699 een reis naar Italië en kocht daar verschillende
  schilderijen. Liet zichzelf in Venetië portretteren door Niccolò Cassana (1659-1714).
reizen_vermeld:
- ca. 1698-99, Italië.
addenda:
- Reizigersportret door Niccolò Cassana.
literatuur:
- Mens 1984, 97; Lunsingh Scheurleer, Fock en Dissel 1987, 320-321; Verhoeven 2012, 31-36.
bronnen:
- gemaakt-op-reis
