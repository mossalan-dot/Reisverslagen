biografie: Zoon van Menso Alting (1587-1647) en Dorothea Rufelaar (†1637). Maakte tussen 1656
  en 1662 verschillende reizen naar Duitsland, Zwitserland en Frankrijk. Werkte als secretaris
  en ambtsman te Selwert en als rechter in Sappemeer. Werd tussen 1686 en 1713 aangesteld als
  burgemeester van Groningen. Was incidenteel als cartograaf werkzaam. Publiceerde in 1697 een
  aardrijkskundig werk over Duitsland.
