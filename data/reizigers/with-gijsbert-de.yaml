id: with-gijsbert-de
naam: With, Gijsbert de
naamsvarianten:
- De Witt
korte_typering: ºDordrecht, 19 juli 1611. Maakte in 1634-35 een educatiereis naar Frankrijk
  (23 jaar).
biografie: Zoon van Cornelis de Witt en Elisabeth van Haarlem. Studeerde rechten en promoveerde
  in Leiden. Maakte in 1634 en 1635 een educatiereis naar Frankrijk in het gezelschap van
  Jacob van Beveren (1612-76), Mathes Onderwaeter en Hendrick van Gouthouven. Werkte voor
  de WIC in Brazilië, onder andere als president van de raad van justitie en districtsdirecteur.
  Ondernam diplomatieke reizen naar Portugal in 1657 en 1661.
reizen_vermeld:
- Augustus 1634-augustus 1635, Frankrijk; tussen 1635 en 1657, Brazilië; augustus-november
  1657/augustus-november 1661, Portugal.
verslagen_vermeld:
- De With 1634-1635.
literatuur:
- NNBW, III, 1454; BWN, XX, 368; Bots 1980, 469-492; Verhoeven 2010, 615-634.
bronnen:
- gemaakt-op-reis
