biografie: Zoon van Adriaen Cornelisz. Cats en Leenken Jacob Jan Breydersdr. Studeerde rechten
  in Leiden en Orléans, verbleef enige tijd in Parijs en vestigde zich als advocaat in Den Haag.
  Werd pensionaris van Middelburg en Dordrecht en reisde als diplomaat meermaals naar het Engelse
  hof. Maakte in 1651 en 1652 een diplomatieke reis met Gerard Schaap (1599-1655) en Paulus
  van der Perre (ca. 1598-1653). Lodewijk Huygens (1631-1699), Adriaen Schagen (1633-1699) en
  George de Mey (1628-1712) hielden ook een verslag bij. Publiceerde verschillende gedichten
  en emblematabundels, waaronder Sinne- en minnebeelden (1618) en de Trou-ringh (1637). Ook
  schrijf hij gedichten over reizen.
