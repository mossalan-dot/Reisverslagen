biografie: Zoon van watergeus Maarten Merens (1544-1573) en Maria Theunis Verduyn (º1539). Woonde
  tussen 1594 en 1597 in Lissabon en in 1599 in Calais. Maakte in 1600 een reis naar Italië
  en Frankrijk. Werd in 1603 vroedschap en in 1612, 1614 en 1617 burgemeester van Hoorn. Verbleef
  om handelsbelangen in Engeland tussen 1628 en 1634.
