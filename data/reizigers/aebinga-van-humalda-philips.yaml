id: aebinga-van-humalda-philips
naam: Aebinga van Humalda, Philips
geboren:
  jaar: 1616
  datum: ca. 1616
  plaats: Ee
overleden:
  jaar: 1672
  datum: 21 februari 1672
korte_typering: Heer van Ee en Jouswier. Ee, ca. 1616 – 21 februari 1672. Maakte in 1660-61
  een diplomatieke reis naar Spanje (44 jaar).
biografie: Zoon van de militair Frans van Humalda en Ibel van Meckema. Studeerde in Groningen.
  Werkte als curator van de universiteit van Franeker en raadsheer voor het Hof van Holland.
  Maakte in 1660 en 1661 als gezant een diplomatieke reis naar het hof in Madrid samen met
  Johan van Merode (1607-66) en Godard Adriaan van Reede van Amerongen (1621-91). Lodewijk
  Huygens (1631-99) reisde mee als gentilhomme.
reizen_vermeld:
- Oktober 1660-61, Spanje.
verslagen_vermeld:
- Huygens 1660-1661; Huygens 2005.
correspondentie:
- Een brief van Constantijn Huygens (1596-1687) over zijn zoon Lodewijk, 1) Den Haag, 10 maart
  1661.
literatuur:
- BNW, VIII, 1462; Sickenga 1869, 224-226; Huygens 2005, 354.
bronnen:
