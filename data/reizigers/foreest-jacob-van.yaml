korte_typering: Hoorn, 17 oktober 1640 – Hoorn, 3 januari 1708. Maakte in 1660-61 een educatiereis
  naar Frankrijk (19 jaar).
biografie: Zoon van Dirk (1614-79) en Hester van Foreest (1615-1705). Studeerde in Leiden
  in 1656. Maakte in 1660 en 1661 een educatiereis naar Frankrijk met zijn neef Nanning van
  Loon. Was vroedschap en burgemeester van Hoorn en bewindhebber van de VOC.
