biografie: Dochter van Willem Boreel (1744-1786) en Maria Trip (1740-1813). Trouwde in 1790
  met Hendrik Fagel (1765-1838). Maakte in 1786 een reis naar Zwitserland en Noord-Italië met
  haar oom en toekomstige echtgenoot. Fagel hield ook een verslag bij, dat ook het verblijf
  in Italië beschrijft.
