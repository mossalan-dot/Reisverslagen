id: aerssen-van-sommelsdijk-cornelis-van
naam: Aerssen van Sommelsdijk, Cornelis van
geboren:
  jaar: 1637
  datum: 20 augustus 1637
overleden:
  jaar: 1688
  datum: 19 juli 1688
  plaats: Paramaribo (SU)
korte_typering: Heer van Spijk, markies van Châtillon. 20 augustus 1637 – Paramaribo (SU),
  19 juli 1688. Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk, Italië en Spanje
  (ca. 14 jaar).
biografie: Zoon van Cornelis van Aerssen van Sommelsdijk (1600-62) en Lucia van Walta (1610-74),
  broer van François (1630-58). Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk,
  Italië en Spanje in het gezelschap van zijn broer, Justinus II van Nassau (1633-58) en tutor
  Antoine de Brunel (1622-96). Mogelijk schoof hij, gezien zijn jonge leeftijd, later aan.
  Verbleef in 1656 in Frankrijk met zijn neven Philips (1636-89) en François de Zoete van
  Laecke (1637-1720). Werd in 1671 ritmeester en in 1680 kolonel. In 1683 kocht hij van de
  WIC grond in Suriname. In 1688 werd hij tijdens een soldatenoproer vermoord door muiters.
reizen_vermeld:
- 1651-55, Frankrijk, Italië, Spanje; december 1656-april 1658, Frankrijk.
verslagen_vermeld:
