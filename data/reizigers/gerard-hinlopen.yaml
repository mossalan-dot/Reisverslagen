korte_typering: 'Maakte in 1662 een plezierreisje. Eerste reis: 26-05-1662 (18 jaar)'
biografie: Zoon van Reynier Hinlopen en Trijntje Thijsdr. van Noy. Studeerde rechten in Leiden
  (imm. 14-09-1662). In 1667 en 1668 maakte hij een educatiereis naar Frankrijk in het gezelschap
  van zijn tante Judith de la Bretonnerie en neef Reinier Hinlopen. Hij promoveerde in Orléans
  in de rechten. Tussen 1670 en 1671 maakte hij een lange reis naar Spanje, Italië, Sicilië,
  Griekenland en Istanbul, waarvan hij een bijzonder lang en geïllustreerd verslag bijhield.
  Was schepen van Hoorn in 1677 en 1679 en vervulde daarna verschillende bestuurlijke posities.
  Diende in 1673 in de compagnie van kapitein G. Schagen. Maakte naast bovenstaande reizen verschillende
  plezierreisjes door de Noordelijke en Zuidelijke Nederlanden.
