korte_typering: 'Vluchtte tijdens het Rampjaar naar Hamburg. Eerste reis: 20-06-1672 (3 jaar)'
biografie: Dochter van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707),
  zus van Sara (†1674), Catharina (1666-1723), Pieter (º1677), Abraham jr. (1676-1719) en Arent
  (1683-1768). Vluchtte tijdens het Rampjaar met haar ouders en haar zussen naar Hamburg. Maakte
  in 1703 een handelsreis naar Duitsland in het gezelschap van haar broer Arent, Pieter Boek
  en Giese Mulder. Leefde tussen 1706 en 1716 met haar vader op het Hofslot te Soest.
