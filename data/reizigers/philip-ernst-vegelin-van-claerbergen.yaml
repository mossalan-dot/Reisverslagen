biografie: Zoon van Philip Ernst Vegelin van Claerbergen (1580-1637) en Brigitta Hantes (†1628),
  vader van Ernst Frederik (º1648) en Hessel (1655-1677). Diende samen met zijn vader in het
  leger van de Zweedse koning Gustaaf II Adolf (1594-1632) en trad in 1637 in dienst bij Karel
  Lodewijk (1617-1680), keurvorst van de Palts. Reisde in 1638 in diens gevolg naar Engeland,
  Schotland en Frankrijk. Werd in 1641 benoemd tot secretaris, raad en hofmeester aan het Friese
  stadhouderlijke hof onder stadhouder Willem Frederik (1613-1664), prins van Nassau-Dietz.
  Naast deze functies bekleedde hij de posten van baljuw van Hulsterambacht, kapitein van de
  infanterie en drost van Liesveld. Werd in 1653 geridderd in de orde van St. Michiel. Reisde
  in 1656 naar Hamburg. Maakte in 1677 een reis naar Duitsland met zijn zoon Hessel om de landerijen
  van zijn werkgever Hendrik Casimir (1657-1696), prins van Nassau-Dietz, te inspecteren.
