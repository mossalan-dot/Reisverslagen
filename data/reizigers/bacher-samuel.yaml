id: bacher-samuel
naam: Bacher, Samuel
naamsvarianten:
- De Baccher, Bacchaerus
korte_typering: Antwerpen, º1582. Maakte in 1608-11 een educatiereis naar Frankrijk en Italië
  (26 jaar).
biografie: Zoon van Andreas de Baccher (1546-1616) en Cateleyne de Boyne (1555-90). Studeerde
  in Halberstadt, Stade, Bremen en Leiden. Maakte tussen 1608 en 1611 een educatiereis naar
  Frankrijk en Italië, waarvan hij brieven en een album amicorum naliet. Promoveerde in de
  rechten en werkte als advocaat aan het Hof van Holland in Den Haag.
reizen_vermeld:
- 1608-11, Frankrijk en Italië.
addenda:
- Album amicorum, met 81 inscripties uit onder andere Parijs, Orléans, Blois, Nîmes, Marseille
  en Londen (Bacher 1602-1610).
correspondentie:
- Binnengekomen brieven tijdens zijn educatiereis (De Baccher 1608-1610).
literatuur:
- Scholte 1942, 69-89; Offerhaus 1990, 69-70.
bronnen:
- gemaakt-op-reis
