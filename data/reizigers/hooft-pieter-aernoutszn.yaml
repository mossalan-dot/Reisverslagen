religie: Protestants
korte_typering: Amsterdam, 1656 – 1684. Protestants, daarna katholiek. Maakte een reis in
  1674 (18 jaar).
biografie: 'Zoon van Arnout Hellemans Hooft (1629-80) en Maria van der Houve (1629-63). Bekeerde
  tot het katholicisme. Maakte in 1674 een reis naar Utrecht in het gezelschap van zijn vader.
  In Utrecht werd hij kanunnik van de Sint-Janskerk.


  Hooft, Pieter Cornelisz.Amsterdam, 16 maart 1581 – Den Haag, 21 mei 1647. Maakte in 1598-1601
  een educatiereis naar Frankrijk en Italië (17 jaar).


  Zoon van Cornelis Pietersz. Hooft (1547-1626) en Anna Blaeu. Bezocht de Latijnse school
  in Amsterdam en maakte tussen 1598 en 1601 een educatiereis naar Frankrijk en Italië. Werkte
  aanvankelijk voor het handelskantoor van zijn neef Pieter Jansz. Hooft (ca. 1574-1636) in
  La Rochelle en trok van daar naar Zuid-Frankrijk en Italië. Voltooide na terugkeer zijn
  rechtenstudie. Vervulde verschillende bestuurlijke taken, waaronder die van drost van Muiden,
  baljuw van Gooiland en hoofdofficier van Weesp en Weesperkarspel. Schreef een groot aantal
  gedichten en toneelstukken, vertaalde fragmenten van Tacitus en schreef de Nederlandsche
  Historiën.'
