korte_typering: 'Reisde in 1674 naar Londen. Eerste reis: 01-05-1674'
biografie: Reisde in 1674 naar Londen als secretaris in het gezantschap van Coenraad van Beuningen
  (ca. 1622-1693), Willem van Haren (1626-1708), Willem Adriaan van Nassau-Odijck (ca. 1632-1705)
  en Frederik baron van Reede tot Renswoude (ca. 1630-1715). De reis werd beschreven door Joannes
  Vollenhove (1631-1708). Werd mogelijk tussen 1676 en 1696 aangesteld als raadsheer van de
  Raad van Vlaanderen in Middelburg.
literatuur:
- Vollenhove 2001, 26; RAA.
