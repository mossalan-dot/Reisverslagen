id: court-allard-de-la
naam: Court, Allard de la
geboren:
  jaar: 1688
  datum: 20 juli 1688
  plaats: Leiden
overleden:
  jaar: 1755
  datum: 30 oktober 1755
  plaats: Leiden
korte_typering: Leiden, 20 juli 1688 – Leiden, 30 oktober 1755. Reisde in 1700 naar Frankrijk
  (12 jaar).
biografie: Zoon van de Leidse lakenfabrikant Pieter de la Court van der Voort (1664-1739)
  en Sara Poelaert (1666-1740), broer van Catharina (1691-1752) en Adriana (1696-1748). Werkte
  als grein- en lakenfabrikant en koopman in Leiden en was een kunstverzamelaar. Vergezelde
  zijn vader op zijn twaalfde op diens reis naar Parijs in 1700. Maakte een reis naar Berlijn
  in 1707 en een handelsreis naar Londen in 1710. Maakte in 1724 een reis naar Luik en Kleef
  en in 1740 een plezierreis naar de Zuidelijke Nederlanden met zijn zussen Catharina en Adriana,
  schoonzus Catharina Backer (1689-1766) en neef en nicht Bogaerd.
reizen_vermeld:
- Augustus-september 1700, Frankrijk; maart-juli 1707, Duitsland; april-juli 1710, Engeland;
  augustus 1724, Luik en Kleef; ca. augustus-september 1740, Zuidelijke Nederlanden.
verslagen_vermeld:
- De la Court 1707; De la Court 1710; De la Court 1724; De la Court 1928, 77-118.
correspondentie:
- Vermeld in de correspondentie van zijn ouders uit 1700 (De la Court van der Voort 1928,
  33-75).
literatuur:
