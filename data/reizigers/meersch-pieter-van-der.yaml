id: meersch-pieter-van-der
naam: Meersch, Pieter van der
religie: Doopsgezind
korte_typering: Amsterdam, º1677. Doopsgezind. Reisde naar Lille in 1687 (10 jaar).
biografie: Zoon van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707),
  broer van Anna (1669-1724), Sara (†1674), Catharina (1666-1723), Pieter (º1677), Abraham
  jr. (1676-1719) en Arent (1683-1768). Reisde met zijn ouders en zus Catharina naar Lille
  in 1687. Maakte een handelsreis naar Zeeland en de Zuidelijke Nederlanden in 1700 met zijn
  vader. Opende met zijn broer Pieter in 1707 een zeepziederij in Amersfoort.
reizen_vermeld:
- 1687, Lille; april-mei 1700, Zuidelijke Nederlanden.
verslagen_vermeld:
- Van der Meersch 1700.
literatuur:
- Visser en Zilverberg 1991, 153-187.
bronnen:
- gemaakt-op-reis
