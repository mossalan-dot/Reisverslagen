id: voorst-lucas-van
naam: Voorst, Lucas van
geboren:
  jaar: 1670
overleden:
  jaar: 1738
korte_typering: 1670 – 1738. Maakte in 1698 en 1699 een educatiereis naar Frankrijk en Italië.
biografie: 'Studeerde en promoveerde in Utrecht in 1693. Maakte in 1698 en 1699 een educatiereis
  naar Frankrijk, Zwitserland, Italië, Oostenrijk en Duitsland samen met Joannes Kool (1672-ca.
  1708). Was magistraat in Utrecht in 1701.


  Voort, Michael van der [ook: Michiel; Welgemaeckt]. Antwerpen, 3 januari 1667 – Antwerpen,
  december 1737. Katholiek. Maakte tussen 1690 en 1700 een kunstenaarsreis naar Italië (23
  jaar).


  Werkte als beeldhouwer. Maakte tussen 1690 en 1700 een kunstenaarsreis naar Rome. Zijn bijnaam
  was ‘Welgemaeckt’. Zijn inscriptie is nog te zien in de Santa Costanza.'
reizen_vermeld:
- April 1698-mei 1699, Zuidelijke Nederlanden, Frankrijk, Zwitserland, Italië, Oostenrijk
  en Duitsland.
- 1690-1700, Italië.
verslagen_vermeld:
