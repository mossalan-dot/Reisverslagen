  plaats: Brielle
overleden:
  jaar: 1693
  datum: 5 december 1693
korte_typering: Brielle, 20 oktober 1643 – 5 december 1693. Maakte in 1669 een plezierreis
  naar Antwerpen en Brussel (26 jaar).
biografie: Dochter van Jacob de Jonge van Ellemeet (1601-50) en Magdalena Briel (1617-85),
  zus van Cornelis (1646-1721) en Cecilia (1648-86). Maakte in 1669 een plezierreis naar Antwerpen
  en Brussel in het gezelschap van haar moeder, zus en broer, Agatha de Jong en haar kinderen.
  Trouwde in 1664 met Jacob Verheije (1640-1718), raadpensionaris van Zeeland.
reizen_vermeld:
- Mei 1669, Zuidelijke Nederlanden.
