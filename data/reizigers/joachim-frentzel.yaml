korte_typering: 'Maakte in 1647-1649 een educatiereis naar Frankrijk en Italië. Eerste reis:
  01-01-1647 (36 jaar)'
biografie: Zoon van Andreas Frentzel en Ursula Jenichen. Studeerde in Franeker en gaf privéles
  aan Willem van Haren (1626-1708), wie hij begeleidde tijdens diens reis naar Frankrijk tussen
  1647 en 1649. Vervolgde de reis naar Italië en promoveerde in Padua in de geneeskunde. Werd
  stadsdokter van Grave en in 1651 hoogleraar geneeskunde in Franeker. Schreef het medische
  traktaat Exercitationes anatomicae ad historiam mesenterii (1660).
