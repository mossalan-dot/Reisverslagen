portretten:
- titel: Portret van Joachimus Frencelius
  vervaardiger: anoniem
  bron: Wikipedia; Museum Martena
  link: https://fy.wikipedia.org/wiki/Ofbyld:JoachimusFrencelius.jpg
  beschrijving: 'Portret in olieverf van Joachimus Frencelius, professor in de geneeskunde aan
    de Franeker universiteit van 1651 tot 1669. Frencelius staat afgebeeld in een toga over
    een donker kostuum met een platte vierkante kraag met akers. Hij draagt een kalot. Joachimus
    Frencelius (Camentz 1611 - Franeker na 1671) studeerde voornamelijk geneeskunde in Franeker
    en was tegelijk huisleraar van de zoontjes van Willem van Haren. Hij vergezelde deze jongens
    twee jaar naar Parijs, studeerde en promoveerde vervolgens in Padua en werd stadsdokter
    in Grave. In 1651 werd hij gevraagd hoogleraar geneeskunde in Franeker te worden in de plaats
    van Johannes Antonides van der Linden. (tekst: Museum Materna, Franeker)'
