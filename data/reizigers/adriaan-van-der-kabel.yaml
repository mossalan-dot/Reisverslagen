korte_typering: 'Maakte in 1655-1666 een kunstenaarsreis naar Frankrijk en Italië. Eerste reis:
  01-01-1655 (25 jaar)'
biografie: Zoon van Cornelis Jansz. van der Kabel en Maertje Philipsdr. Was een leerling van
  Jan van Goyen (1596-1656) in Den Haag en leefde tussen 1655 en 1658 in Lyon. Leefde en werkte
  in Rome tussen 1659 en 1666, waar hij meermaals in aanraking kwam met de politie wegens vechtpartijen
  en het verboden bezit van een degen. Zijn jongere broer Engel (ºca. 1641) reisde met hem mee.
  Sloot zich aan bij de Bentvueghels en kreeg de bijnaam ‘Geestigheit’. Vestigde zich in 1668
  in Lyon.
