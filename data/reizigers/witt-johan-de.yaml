korte_typering: Heer van Zuid- en Noord-Linschoten, Snelrewaard, Hekendorp en IJsselvere.
  Dordrecht, 24 september 1625 – Den Haag, 20 augustus 1672. Maakte in 1645-47 een educatiereis
  naar Frankrijk en Engeland (20 jaar).
biografie: 'Zoon van Jacob de Witt (1589-1674) en Anna van den Corput (1599-1645), broer van
  Cornelis (1623-72). Studeerde rechten in Leiden. Maakte tussen 1645 en 1647 een educatiereis
  naar Frankrijk, Zwitserland en Engeland met zijn broer Cornelis en promoveerde in Angers
  in de rechten. Werd in 1650 pensionaris van Dordrecht en in 1653 raadpensionaris van Holland,
  een positie die hij tot zijn dood bekleedde. Werd samen met zijn broer vermoord tijdens
  het Rampjaar.


  Zoon van Johan de Witt (1625-72) en Wendela Bicker (1635-68). Studeerde in Leiden. Maakte
  rond 1685-1686 een educatiereis naar Frankrijk, Italië, Sicilië en Malta met zijn Franse
  knecht Pinabel. Was achtereenvolgens weesmeester, secretaris en veertigraad van Dordrecht.
  Liet een omvangrijke bibliotheek na.


  Wittel, Caspar van [ook: Gaspare Vanvitelli; Gasparo degli Occhuali; Piktoorts; Toorts van
  Amersfoort]. Amersfoort, 1652 – Rome (IT), 13 september 1736. Maakte in 1674 een kunstenaarsreis
  naar Rome (22 jaar).


  Werkte als kunstschilder. Ging in de leer bij Matthias Withoos (1627-1703) en maakte in
  1675 een kunstenaarsreis naar Italië. Vestigde zich als schilder in Rome en was daar succesvol.
  Kreeg de bentnaam ‘Piktoorts’ of ‘Toorts van Amersfoort’. Was een van de grondleggers van
  de vedutetraditie.'
