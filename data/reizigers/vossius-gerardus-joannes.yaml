id: vossius-gerardus-joannes
naam: Vossius, Gerardus Joannes
korte_typering: Reisde in 1674 naar Londen als secretaris in het gezantschap van Coenraad
  van Beuningen (ca. 1622-93), Willem van Haren (1626-1708), Willem Adriaan van Nassau-Odijck
  (ca. 1632-1705) en Frederik baron van Reede tot Renswoude (ca. 1630-1715). De reis werd
  beschreven door Joannes Vollenhove (1631-1708). Werd mogelijk tussen 1676 en 1696 aangesteld
  als raadsheer van de Raad van Vlaanderen in Middelburg.
reizen_vermeld:
- 1674-79, Engeland.
verslagen_vermeld:
- Vollenhove 1674; Vollenhove 2001.
addenda:
- Verbalen van het gezantschap, hierboven genoemd (SG 8588-8590).
literatuur:
- Vollenhove 2001, 26; RAA.
bronnen:
- gemaakt-op-reis
