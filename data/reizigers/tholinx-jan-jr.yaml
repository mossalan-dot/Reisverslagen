id: tholinx-jan-jr
naam: Tholinx, Jan jr.
korte_typering: 1631-1705. Zoon van Jan Tholinx, Antwerpse groothandelaar in tapijten. Maakte
  tussen 1664 en 1665 een educatiereis naar Italië met Hendrik Hillewerve (1621-94), Balthasar
  Moretus III (1646-96), Theodoor Andries van Kessel en Pieter Goos (1645-1708).
biografie: 'Timmers(-Van Zuijlen van Nijevelt), Aletta Johanna. Rotterdam, 18 augustus 1707
  – Rotterdam, 8 april 1775. Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden
  (22 jaar).


  Dochter van Johan Timmers (1684-1738) en Suzanne Libertine van Schinne (1684-1732), zus
  van Ignatia Geertruida (1714-33). Trouwde in 1732 met Jacob van Zuijlen van Nijevelt (1699-1753).
  Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden met haar ouders, zus, Van
  Bentinck en Van Schoonheeten, Sloterdijck en zoon en Van Baerle en dochter.


  Timmers(-Boogaart), Ignatia GeertruidaRotterdam, 18 juni 1714 – Rotterdam, 21 april 1733.
  Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden (15 jaar).


  Dochter van Johan Timmers (1684-1738) en Suzanne Libertine van Schinne (1684-1732), zus
  van Aletta Johanna (1707-75). Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden
  met haar ouders, zus, Van Bentinck en Van Schoonheeten, Sloterdijck en zoon en Van Baerle
  en dochter. Trouwde in 1732 met Paulus Boogaart (1703-89), heer van Alblasserdam.'
