korte_typering: Ferwerd, 3 oktober 1723 – 12 juli 1750. Reisde in 1743 naar Keulen (20 jaar).
biografie: Zoon van Johan Vegelin van Claerbergen (1690-1773 en Isabella van Burum (1703-31).
  Studeerde in Leiden, maar maakte zijn studie niet af. Besloot in 1743 om mee te vechten
  aan het front van de Oostenrijkse Successieoorlog, maar werd door zijn gouverneur in Keulen
  opgewacht en teruggefloten. Was lid van de Staten van Friesland en was grietman van Hakerland.
reizen_vermeld:
- 1743, Keulen.
