korte_typering: Gorinchem, 11 september 1584 – Leiden, 13 november 1624. Maakte rond 1608-12
  een reis naar Engeland, Frankrijk, Italië en Duitsland (ca. 24 jaar).
biografie: Zoon van Gerard Joannes van Erp en Beatrix de Bije. Studeerde in Leiden en specialiseerde
  zich in theologie en Oosterse talen. Maakte tussen 1608 en 1612 een peregrinatio academica
  naar Engeland, Frankrijk, Italië en Duitsland, waar hij onder andere Canterbury, Oxford,
  Parijs, Saumur, Milaan, Venetië en Heidelberg aandeed. Werd hoogleraar in de Oosterse talen
  en het Hebreeuws in Leiden. Reisde in 1620 als begeleider van Volkert Teding van Berkhout
  (1601-32) naar Frankrijk. Overleed aan de pest.
reizen_vermeld:
