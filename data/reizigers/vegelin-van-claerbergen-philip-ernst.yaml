id: vegelin-van-claerbergen-philip-ernst
naam: Vegelin van Claerbergen, Philip Ernst
korte_typering: Neustadt an der Haardt (D), 12 oktober 1613 – Leeuwarden, 6 februari 1693.
  Reisde in 1638 naar Engeland, Schotland en Frankrijk (25 jaar).
biografie: Zoon van Philip Ernst Vegelin van Claerbergen (1580-1637) en Brigitta Hantes (†1628),
  vader van Ernst Frederik (º1648) en Hessel (1655-77). Diende samen met zijn vader in het
  leger van de Zweedse koning Gustaaf II Adolf (1594-1632) en trad in 1637 in dienst bij Karel
  Lodewijk (1617-80), keurvorst van de Palts. Reisde in 1638 in diens gevolg naar Engeland,
  Schotland en Frankrijk. Werd in 1641 benoemd tot secretaris, raad en hofmeester aan het
  Friese hof onder stadhouder Willem Frederik (1613-64), prins van Nassau-Dietz. Naast deze
  functies bekleedde hij de ambten van baljuw van Hulsterambacht, kapitein van de infanterie
  en drost van Liesveld. Werd in 1653 geridderd in de orde van St.-Michiel. Reisde in 1656
  naar Hamburg. Maakte in 1677 een reis naar Duitsland met zijn zoon Hessel om de landerijen
  van zijn werkgever Hendrik Casimir (1657-96), prins van Nassau-Dietz, te inspecteren.
reizen_vermeld:
- 1638, Engeland, Schotland en Frankrijk; 1656, Hamburg; mei-juli 1677, Duitsland.
