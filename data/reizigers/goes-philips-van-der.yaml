id: goes-philips-van-der
naam: Goes, Philips van der
geboren:
  jaar: 1651
overleden:
  jaar: 1707
  datum: 9 juli 1707
korte_typering: 1651 – 9 juli 1707. Reisde tijdens de Spaanse Successieoorlog naar Spanje
  (51 jaar).
biografie: Zoon van Andries van der Goes en Machteld Doublet. Was kapitein bij de landmacht
  en ging in 1678 in dienst als extraordinaris kapitein bij de admiraliteit van Amsterdam.
  Werd in 1697 viceadmiraal en nam deel aan zeeslagen tijdens de Spaanse Successieoorlog.
  In 1702 belegerde hij verdedigingswerken bij Cádiz en nam hij een Spaanse zilvervloot buit
  in de baai van Vigos. De reis werd beschreven door predikant Petrus Zaunslifer (1677-1739)
reizen_vermeld:
- Mei-november 1702, Engeland en Spanje.
verslagen_vermeld:
- Zaunslifer 1702.
literatuur:
- BWN, VII, 258-259; NNBW, V, 208; Hoos 1910, 97-102.
bronnen:
- gemaakt-op-reis
