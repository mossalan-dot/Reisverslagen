biografie: Dochter van de welvarende Leidse lakenfabrikant Pieter de la Court van der Voort
  (1664-1739) en Sara Poelaart (1666-1740), zus van Allard (1688-1755) en Catharina Adriana
  (1691-1752). Trad in 1747 in het huwelijk met Alexander Sweder (1703-1768), rijksvrijheer
  van Spaen. Vergezelde in 1714 haar schoonbroer Johan Meerman (1687-1752) op diens reis naar
  Engeland. Maakte tussen 1732 en 1743 verschillende plezierreizen naar Gelderland, Duitsland
  en de Zuidelijke Nederlanden.
