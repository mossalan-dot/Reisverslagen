korte_typering: Leiden, 1618 – Amsterdam, 25 april 1685. Maakte in 1641-43 een reis naar Engeland
  en Frankrijk (23 jaar).
biografie: Zoon van Pieter de la Court sr. (1593-1657) en Johanna des Planques (1595-1663).
  Studeerde rechten in Leiden. Maakte tussen 1641 en 1643 een reis naar Engeland en Frankrijk.
  Behaalde een bul in de rechten in Orléans en werd advocaat aan het Hof van Holland. Werkte
  als lakenfabrikant in Leiden en was aandeelhouder van de WIC. Publiceerde onder andere het
  republikeinse, anti-orangistische boek Interest van Holland (1662).
reizen_vermeld:
- September 1641-september 1643, Engeland en Frankrijk.
verslagen_vermeld:
