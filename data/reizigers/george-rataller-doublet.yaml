biografie: Zoon van Philips Doublet (†1612) en Cornelia Rataller. Studeerde rechten en letteren
  in Leiden. Maakte tussen 1621 en 1625 een educatiereis naar Engeland, Frankrijk en Italië
  samen met Nicolaas Meerman en Dirk Graswinckel (1600-1666). Was advocaat en rentmeester in
  Den Haag. Werd in 1653 van de Chambre-Mipartie in Mechelen.
