  plaats: Amsterdam
korte_typering: Dordrecht, 1603 – Amsterdam, 1643. Maakte in 1624-26 een educatiereis naar
  Frankrijk en Italië (21 jaar).
biografie: Geïdentificeerd door biograaf Prinsen. Zoon van Aernout van Erp (ca. 1533-1618)
  en Jacomina van Velsen (†1658), zwager van P.C. Hooft (1581-1647). Maakte tussen 1624 en
  1626 een educatiereis naar Frankrijk en Italië in het gezelschap van Willem van den Vondel
  (1603-28), Joost Baeck, Herman Swol, Gerard van den Bergh en A. Moorman.
reizen_vermeld:
- 1624-26, Frankrijk en Italië.
