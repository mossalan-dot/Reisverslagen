id: six-van-chandelier-joannes
naam: Six van Chandelier, Joannes
geboren:
  jaar: 1620
  datum: 19 februari 1620
  plaats: Amsterdam
overleden:
  jaar: 1695
  datum: 16 februari 1695
  plaats: Amsterdam
korte_typering: Amsterdam, 19 februari 1620 – Amsterdam, 16 februari 1695. Maakte in 1649-51
  een reis naar Frankrijk en Italië (29 jaar).
biografie: Zoon van Jacob Six (1593-1639) en Sara Juliens (1596-1669). Bezocht de Latijnse
  school en nam zijn vaders winkel over in Amsterdam. Om handelsbelangen te behartigen reisde
  hij in 1649 naar Zuid-Europa samen met Abraham Grenier (1626-60). Hij reisde naar Parijs,
  Toulouse en Bayonne en bezocht in Spanje Madrid, Cádiz en Granada. In 1650 ging hij scheep
  in Alicante en arriveerde in Genua, vanwaar hij naar Florence, Rome, Napels en Venetië trok.
  In 1651-52 maakte hij een tweede reis naar Italië, ditmaal naar Venetië. In Italië had hij
  contact met de Bentvueghels. Ergens tussen 1652 en 1657 bezocht hij Duitsland. In april
  1654 reisde hij met Grenier naar Engeland en in 1655 maakte hij een tweede reis. In de zomer
  van 1656 verbleef hij negen weken in Spa. In 1657 publiceerde hij zijn bundel Poësy en in
  1674 zijn psalmberijming.
reizen_vermeld:
- 1649-50, Frankrijk, Spanje, Italië; 1651-52, Italië; ca. 1652-57, Duitsland; april 1654/1655,
  Engeland; zomer 1656, Spa.
poezie:
