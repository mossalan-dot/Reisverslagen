  Duitsland en Engeland tussen 1647 en 1657. 1) ‘Op den oploop te Parys, om een drukker van
  een lasterschrift, op de kooninginne en kardinaal, door ‘t volk van de galge verlost’, 2)
  ‘Op een schilderye aan de solderinge eenes kaamers te Fonteinebleau’ (over Fontainebleau),
  3) ‘Op myne eensaame reise, een groot stuk weeghs door Vrankryk’, 4) ‘Op het koopergeld
  in Spanje’, 5) ‘Op des kooninghs weigeringe aan syn soon, versoekende om dry uuren te moogen
  regeeren’, 6) ‘Hoe nietich dat de pracht der kooningen zy’ (over de tocht van het koningspaar
  Filips IV (1605-65) en Maria Anna van Oostenrijk (1634-96)), 7) ‘Blyde welkomst der kooninginne
  te Madrid’ (over Maria Anna van Oostenrijk), 8) ‘Schrobbe aan een onweetenden Spanjaard’
  (over het Escurial in Madrid), 9) ‘Sluikerye in Spanje door behulpsaamheit der paapen’,
  10-19) ‘Op het blanketten van ‘t vrouwvolk in Spanje’, deel I tot X, 20) ‘Op de ongelykmaaticheit
  der bruggen oover de rivieren van Sivilie en Madril’, 21) ‘Op het voorspreekerschap van
  Abraham Grenier den iongen van Middelburgh, te Angiers verdient’ (over zijn reisgenoot Abraham
  Grenier en diens promotie te Angers), 22) ‘Aan Abraham Grenier den jongen, rechtsgeleerden
  van Middelburgh, teegenwoordigh te Angiers’, 23) ‘Sucht naa het vaaderland, op de reise
  door het geberghte Morena’ (over de Sierra Morena), 24) ‘Aanvechtinge geleeden te S. Lukas’
  (over Sanlúcar de Barrameda), 25) ‘Aandacht op myn dertighjaarigen ouderdom en quellycke
