korte_typering: 'Reisde in 1676-1677 naar Frans-Guyana. Eerste reis: 01-08-1676 (15 jaar)'
biografie: Dochter van Herman Hartman van der Woude (1621-1677) en Margarita Blaeuhulck (1621-1662).
  Reisde in 1676 en 1677 samen met haar vader, zus Elisabeth (1657-1698) en broer Johannes (º1658)
  naar Frans-Guyana, waar haar vader gouverneur zou worden. Overleed een dag na aankomst, waarschijnlijk
  aan een ziekte.
