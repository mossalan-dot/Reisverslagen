biografie: Geïdentificeerd door Grabowsky en Verkruijsse. Mogelijk gaat het om zijn broer Hendrick
  (1619-1677) of Jonas (†1653), maar gezien de reisleeftijd is Joannes de meest waarschijnlijke
  kandidaat. Zoon van Gerrit Hendricksz. Hudde (1595-1647) en Maria Witsen (1597-1683). Studeerde
  rechten en geneeskunde in Leiden. Maakte tussen 1649 en 1651 een educatiereis naar Italië,
  Zwitserland en Frankrijk in het gezelschap van Arnout Hellemans Hooft (1629-1680), de dichter
  Reyer Anslo (1626-1669), zijn neef Rombout Hudde (1620-1679), IJsbrand Kieft, Blom en Ooms.
  Maakte als leerling van Frans van Schooten (1615-1660) carrière als wiskundige. Publiceerde
  verschillende wiskundige werken. Mogelijk maakte hij een reis naar Saumur in 1659 om zijn
  studie in de rechten te voltooien. Vervulde verschillende ambten in Amsterdam, waaronder dat
  van vroedschap, schepen en thesaurier-ordinaris. Werd door stadhouder Willem III (1650-1702)
  aangesteld als burgemeester van Amsterdam in 1672, een post die hij tot 1703 meerdere malen
  bekleedde.
