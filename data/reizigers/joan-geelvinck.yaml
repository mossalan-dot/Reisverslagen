biografie: Zoon van Cornelis Geelvinck (1621-1689) en Elisabeth Velecker (1622-1658). Studeerde
  rechten in Leiden en maakte in 1663 en 1664 een educatiereis naar Frankrijk. Werd in 1673
  aangesteld als secretaris van Amsterdam. In 1687 werd hij bewindhebber van de VOC en in 1694
  vroedschap van Amsterdam.
