id: beverningh-hieronymus-van
naam: Beverningh, Hiëronymus van
naamsvarianten:
- van Beverningk
geboren:
  jaar: 1614
  datum: 25 april 1614
  plaats: Gouda
overleden:
  jaar: 1690
  datum: 30 oktober 1690
  plaats: Leiden
korte_typering: Gouda, 25 april 1614 – Leiden, 30 oktober 1690. Maakte rond 1635-45 een educatiereis
  naar Frankrijk (ca. 21 jaar).
biografie: Zoon van kapitein Melchior van Beverningh en Sibilla Standert. Studeerde rechten
  in Leiden en maakte ergens tussen 1635 en 1645 een educatiereis naar Frankrijk. Schotel
  meldt dat hij ook naar Zwitserland en Italië trok en een verslag bijhield, getiteld Recueil
  de l’estat de France, où sont compris les noms des dignitez et familles principales. Werd
  in 1645 schepen van Gouda en gecommitteerde van de Staten van Holland en tussen 1657 en
  1665 thesaurier-generaal van de Republiek. Als gezant reisde hij onder andere naar Londen,
  Kleef, Breda, Aken, Madrid, Keulen en Nijmegen. Hij was betrokken bij de vredesverdragen
  van de Eerste en Tweede Engels-Nederlandse Oorlog en de Hollandse Oorlog. In 1678 reisde
  hij samen met Jacob Hop (1654-1725) naar Frankrijk.
reizen_vermeld:
- Ca. 1635-45, Frankrijk (Zwitserland en Italië); juni 1653-december 1654, Engeland; augustus-oktober
  1664, Brussel; 1665-66, Kleef; februari-maart 1666, Duitsland; mei-september 1667, Breda;
  maart-mei 1668, Aken; november 1670, Brussel; december 1670-september 1671, Spanje; mei
  1673-mei 1674, Aken en Keulen; 1678, Frankrijk.
addenda:
- Verbalen en tussentijdse verbalen van de gezantschappen, hierboven beschreven (SG 8472-8473;
