korte_typering: Amsterdam, 7 juli 1644 – Den Haag, 21 mei 1707. Maakte in 1663-64 een educatiereis
  naar Frankrijk (19 jaar).
biografie: Zoon van Cornelis Geelvinck (1621-89) en Elisabeth Velecker (1622-58). Studeerde
  rechten in Leiden en maakte in 1663 en 1664 een educatiereis naar Frankrijk. Werd in 1673
  aangesteld als secretaris van Amsterdam. In 1687 werd hij bewindhebber van de VOC en in
  1694 vroedschap van Amsterdam.
reizen_vermeld:
- September 1663-december 1664, Frankrijk en Zwitserland.
