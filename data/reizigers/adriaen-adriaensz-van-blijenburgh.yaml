biografie: Zoon van Adriaen van Blijenburgh sr. (1589-1630) en Carolina van Beveren (1589-1625).
  Was schepen en meermaals burgemeester van Dordrecht, evenals lid van de Raad van State en
  gecommitteerde van de Raad van Holland. Reisde in 1646 naar Italië met zijn neef Matthijs
  van der Merwede (ca. 1625-ca. 1677), heer van Clootwijck, en Nicolaas Heinsius (1620-1681).
  Was vanaf 1666 verantwoordelijk voor de opvoeding van Willem III (1650-1702).
