biografie: Zoon van Andries van der Goes en Machteld Doublet. Was kapitein bij de landmacht
  en ging in 1678 in dienst als extraordinaris kapitein bij de admiraliteit van Amsterdam. Werd
  in 1697 viceadmiraal en nam deel aan zeeslagen tijdens de Spaanse Successieoorlog. In 1702
  belegerde hij verdedigingswerken bij Càdiz en nam hij een Spaanse zilvervloot buit in de baai
  van Vigos. De reis werd beschreven door predikant Petrus Zaunslifer (1677-1739)
