biografie: Zoon van Sicke van Eminga (1638-1682) en Frouck van Aylva (1635-1659). Studeerde
  in Groningen. Reisde tussen 1678 en 1682 naar Duitsland, Oostenrijk, Italië en Frankrijk.
  Was een vermogend landbezitter en bevond zich in de kringen van het stadhouderlijk hof van
  Friesland.
