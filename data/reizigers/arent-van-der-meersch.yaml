biografie: Zoon van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707), broer
  van Anna (1669-1724), Sara (†1674), Catharina (1666-1723), Pieter (º1677) en Abraham jr. (1676-1719),
  vader van Guilliam (1732-1809). Maakte in 1703 een handelsreis naar Duitsland in het gezelschap
  van zijn zus Anna, Pieter Boek en Giese Mulder. Werkte als makelaar en keurmeester van zeep.
  Opende met zijn broer Pieter in 1707 een zeepziederij in Amersfoort.
