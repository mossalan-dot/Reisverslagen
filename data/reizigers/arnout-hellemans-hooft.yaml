korte_typering: 'Maakte in 1649-1651 een educatiereis naar Italië en Frankrijk. Eerste reis:
  01-09-1649 (20 jaar)'
biografie: Zoon van de dichter en staatsman Pieter Cornelisz. Hooft (1581-1647) en diens tweede
  vrouw Leonora Hellemans (1595-1661). Studeerde rechten in Leiden en maakte tussen 1649 en
  1651 een educatiereis naar Duitsland, Oostenrijk, Italië, Zwitserland en Frankrijk in het
  gezelschap van de dichter Reyer Anslo (1626-1669), Rombout (1620-1679) en Joannes Hudde (1624-1704),
  IJsbrand Kieft, Blom en Ooms. Werkte als diplomaat in Duitsland en Londen en reisde in 1653
  naar Lübeck voor de vredesonderhandelingen tussen Polen en Zweden samen met Anthonis van Waveren,
  Jacob de Witt (1589-1674) en Nicolaas Vivien (1631-1692). Werd in 1656 commissaris en in 1662
  schepen van Amsterdam en werkte als gouverneur van de WIC. Werd in tet Rampjaar ontslagen
  door stadhouder Willem III (1640-1702) nadat hij Johan de Witt (1625-1672) had ondersteund.
  Verzorgde de uitgave van zijn vaders Nederlandsche Historiën in 1671.
