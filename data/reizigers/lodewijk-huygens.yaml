korte_typering: 'Reisde in 1650 naar Duitsland. Eerste reis: 01-01-1650 (19 jaar)'
biografie: Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Constantijn (1628-1697), Christiaan (1629-1695), Philips (1633-1657) en Susanna (1637-1725).
  Studeerde in Breda. Reisde in het voorjaar van 1650 naar Duitsland samen met William, graaf
  van Craven (1608-1697) en reisde in 1651 en 1652 mee in het gezantschap van Jacob Cats (1577-1660),
  Gerard Schaap (1599-1654) en Paulus van der Perre (ca. 1598-1653). Reisde in 1655 naar Frankrijk
  met zijn broer Christiaan en promoveerde in Angers. In 1660 en 1661 reisde hij naar Spanje
  in het gezantschap van Johan van Merode (1607-1666), Godard Adriaan van Reede van Amerongen
  (1621-1691) en Philips Aebinga van Humalda (ca. 1616-1674). In 1661 reisde hij met zijn vader
  naar Parijs. Bezocht Parijs voor een tweede maal in 1670. In 1672 werd hij benoemd tot drossard
  van Gorinchem en het land van Arkel, maar hij werd aangeklaagd vanwege machtsmisbruik en werd
  veroordeeld voor ene fikse boete. Was vanaf 1686 gecommitteerde raad van de Admiraliteit van
  de Maas.
