korte_typering: 'Maakte in 1646-1649 een educatiereis naar Frankrijk. Eerste reis: 01-01-1646
  (20 jaar)'
biografie: Zoon van Willem van Haren (1581-1649) en Magdalena van Vierssen. Studeerde in Franeker,
  Utrecht en Leiden. Maakte tussen 1646 en 1649 een educatiereis naar Frankrijk met zijn tutor
  Joachim Frentzel (1611-1669). Werd in 1652 grietman van het Bilt en lid van de Raad van State.
  Vervulde diverse diplomatieke missies naar onder andere Denemarken, Zweden en Engeland. Hij
  was betrokken met de onderhandelingen over de Vrede van Nijmegen (1678) en Rijswijk (1697).
  In 1674 reisde hij naar Londen om te onderhandelen over de Vrede van Westminster samen met
  collega-diplomaten Coenraad van Beuningen (ca. 1622-1693), Willem Adriaan van Nassau (ca.
  1632-1705) en Frederik baron van Reede tot Renswoude (ca. 1630-1715). De reis werd beschreven
  door Joannes Vollenhove (1631-1708).
