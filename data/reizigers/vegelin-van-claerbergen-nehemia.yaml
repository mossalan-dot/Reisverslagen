korte_typering: Joure, 13 december 1691 – Den Haag, 3 december 1739. Maakte in 1718-1720 een
  educatiereis naar Frankrijk en Italië (27 jaar).
biografie: Zoon van Hessel Vegelin van Claerbergen (1655-1715) en Anna Maria van Vierssen
  (1653-96), broer van Philip Frederik (1685-1738), Assuerus (1687-1771) en Johan (1690-1773).
  Was grietman van Haskerland. Studeerde rechten en promoveerde in Leiden. Werd raadsheer
  in Raad en Leenhof van Staats-Brabant en de landen van Overmaze. Maakte tussen 1718 en 1720
  een educatiereis naar Frankrijk, Spanje, Italië, Zwitserland en Duitsland.
reizen_vermeld:
- Augustus 1718-juli 1720, Zuidelijke Nederlanden, Frankrijk, Spanje, Italië, Zwitserland
  en Duitsland.
