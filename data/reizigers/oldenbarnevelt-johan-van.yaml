korte_typering: Heer van Groeneveld en Zuidwind, Hoogland, de Tempel, Stoutenburg, Luttekeweede,
  Berkel en Rodenrijs, Gunterstein en Bakkum. Amersfoort, 14 september 1547 – Den Haag, 13
  mei 1619. Remonstrants. Maakte in 1566-1569 een educatiereis naar Frankrijk, Duitsland en
  Italië (19 jaar).
biografie: 'Zoon van koopman Gerrit van Oudenbarnevelt (1516-89) en Deliana van Weede (ca.
  1524-1587). Studeerde rechtsgeleerdheid in Leuven, Bourges, Keulen en Heidelberg en Padua.
  Maakte tussen 1566 en 1569 een educatiereis naar Frankrijk, Duitsland, Zwitserland en Italië.
  Studeerde in Heidelberg en Padua. Werd in 1569 advocaat voor het Hof van Holland en sloot
  zich in 1572 aan bij Willem van Oranje (1533-84) in Delft. Werd in 1576 pensionaris van
  Rotterdam en in 1586 landsadvocaat en raadpensionaris van de Staten van Holland. Maakte
  in 1598 een diplomatieke missie naar Engeland, samen met zijn zoon Reinier (1588-1623).
  Raakte in conflict met Maurits van Oranje (1567-1625), werd vervolgd en geëxecuteerd.


  Oldenbarnevelt, Reinier van [ook: Groenveld, Reinier van]. Heer van den Tempel, ambachtsheer
  van Groeneveld, Brandwijk en Gijbelaud. 1588 – Den Haag, 29 maart 1623. Reisde in 1598 naar
  Engeland (10 jaar).


  Zoon van Johan van Oldenbarnevelt (1547-1619) en Maria van Utrecht (ºca. 1551), broer van
  Willem (1590-1634). Vergezelde zijn vader op diens missie naar Engeland in 1598. Maakte
  een tweede reis naar Engeland met zijn broer in 1603, waar hij werd geridderd door Jacobus
  I (1566-1625). Maakte tussen 1606 en 1608 een educatiereis met zijn broer en tutor Johannes
  Meursius (1579-1639), eerst in het gevolg van keurvorst Ernst van Keulen (1554-1612) naar
  het hof in Praag, daarna naar Duitsland, Genève en Frankrijk. Studeerde in Heidelberg en
  Genève. Werd in Parijs begeleid door François van Aerssen (1572-1641) en werd geridderd
  door Hendrik IV (1553-1610). Bekleedde het ambt van houtvester van Holland en hoogheemraad
  van Delfland. Na de berechting van zijn vader beraamde hij met zijn broer een aanslag op
  prins Maurits (1567-1625). De aanslag mislukte en hij werd berecht en onthoofd in 1623.'
