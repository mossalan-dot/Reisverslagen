id: bicker-andries
naam: Bicker, Andries
religie: Protestants
korte_typering: Heer van Engelenburg. Amsterdam, september 1586 – 24 juni 1652. Protestants.
  Maakte in 1627 een diplomatieke reis naar Polen en Zweden (41 jaar).
biografie: 'Zoon van Gerrit Pietersz. Bicker (1554-1604) en Alyd Andriesdr. Boelens (1557-1630).
  Was koopman in de pelshandel in Rusland. Was bewindhebber van de VOC, gedeputeerde van de
  Staten-Generaal en kolonel in de schutterij. Was vanaf 1616 vroedschap, schepen en burgemeester
  van Amsterdam. Maakte in 1627 een diplomatieke reis naar Polen met medegezanten Rochus van
  den Honert (1572-1638) en Simon van Beaumont (1574-1654). De reis werd vastgelegd door Abraham
  Booth (1606-36).


  Bicker van Swieten, Andries [ook: Bicker van Zwieten]. Amsterdam, 1670 – Venetië (IT), 1696.
  Maakte in 1693-95 een educatiereis naar Duitsland, Oostenrijk en Italië (23 jaar).


  Zoon van Gerardus Bicker van Swieten (†1718). De reiziger wordt door Hoogewerff geïdentificeerd.
  Maakte tussen 1693 en 1695 een educatiereis naar Duitsland, Oostenrijk, Italië en Tsjechië
  onder supervisie van tutor Laurens Gronovius (1648-1724). Hij werd vergezeld door baron
  Jacob Emmery van Wassenaar van Obdam (1672-1724), Jan Pieter Alderwerelt (º1663) en Keyser
  uit Lüneburg. Behaalde een bul in de rechten in Padua in 1694. Scheidde op de terugweg van
  zijn tutor en keerde terug naar Italië. Overleed tijdens het Venetiaanse carnaval.'
