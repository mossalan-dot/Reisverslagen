korte_typering: Heer van Oosterland. Middelburg, 9 januari 1645 – Middelburg, 31 december
  1694. Maakte in 1666-67 een educatiereis naar Frankrijk en Engeland (21 jaar).
biografie: Zoon van Johan Bonifacius de Jonge (1614-54) en Levina Stavenisse (1622-56). Maakte
  in 1666 en 1667 een educatiereis naar Frankrijk en Engeland in het gezelschap van Pieter
  Pieterson, Justus van der Cijs en neef Cornelis de Jonge van Ellemeet (1646-1721). Was raad
  en schepen van Middelburg.
reizen_vermeld:
