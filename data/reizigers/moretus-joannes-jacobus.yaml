korte_typering: Antwerpen, 20 juli 1647 – Antwerpen, 25 februari 1718. Katholiek (jezuïet).
  Maakte in 1668 een reis naar Den Bosch (21 jaar).
biografie: Zoon van Balthasar II Moretus (1615-74) en Anna Goos (1627-91), broer van Balthasar
  III (1646-96), Franciscus (1656-1705) en Maria Isabella (1655-76). Werd jezuïet. Maakte
  in 1668 een reis naar Den Bosch met zijn ouders, broers en zussen.
