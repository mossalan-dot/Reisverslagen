biografie: Zoon van Pieter Teding van Berkhout (1688-1729) en Johanna Susanna Ghijs (1688-1717).
  Was veertigraad van Delft tussen 1742 en 1766. Maakte in 1738 een plezierreis naar Breda en
  maakte tussen 1739 en 1741 een educatiereis naar Italië, Frankrijk en Engeland, aanvankelijk
  in het gezantschap van Johannes Aegidius van Egmond van der Nijenburg (1693-1747).
