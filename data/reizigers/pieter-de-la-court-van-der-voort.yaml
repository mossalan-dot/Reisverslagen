biografie: Zoon van Pieter de la Court jr. (1618-1685) en Catharina van der Voort (1622-1674).
  Studeerde in Leiden en promoveerde in de rechten. Werkte als lakenfabrikant in Leiden en was
  een kunstverzamelaar. Publiceerde over tuinarchitectuur. Maakte in 1700 een handelsreis naar
  Parijs, waarover hij verschillende brieven schreef aan zijn echtgenote Sara Poelaart (1666-1740).
