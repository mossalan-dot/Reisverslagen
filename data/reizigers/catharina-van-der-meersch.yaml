biografie: Dochter van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707),
  zus van Anna (1669-1724), Sara (†1674), Pieter (º1677), Abraham jr. (1676-1719) en Arent (1683-1768).
  Vluchtte met haar ouders en zussen naar Hamburg tijdens het Rampjaar. Maakte in 1687 een reisje
  naar Lille in het gezelschap van haar ouders en broer Pieter.
