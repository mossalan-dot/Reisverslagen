biografie: Zoon van Arent van der Meersch (1601-1667) en Sara de Veer (1604-1667), vader van
  Sara (†1674), Catharina (1666-1723), Anna (1669-1724), Pieter (º1677), Abraham jr. (1676-1719)
  en Arent (1683-1768). Werkte als koopman en was een actief lid van de doopsgezinde gemeenschap
  in Amsterdam, waarvoor hij tot tweemaal toe beëdigd werd als diaken. Maakte in 1662 een handelsreis
  naar Spanje en begon zijn eigen bedrijf in 1664. Reisde in 1664 naar Engeland en Frankrijk.
  Vluchtte tijdens het Rampjaar naar Hamburg met zijn gezin. In 1674 ondernam hij een handelsreis
  naar Denemarken en Zweden in het gezelschap van Philips en Jan van Halmael, Abraham Vorsterman
  en de knecht Frederik Paran. Maakte in 1687 een reisje naar Lille in het gezelschap van zijn
  vrouw, kinderen Catharina en Pieter en reisde in 1700 naar de Zuidelijke Nederlanden met zijn
  zoon Pieter. Schreef een autobiografie voor zijn kleinzoon Abraham Arent (1720-1791), getiteld
  De laatste vaderlijke lessen.
