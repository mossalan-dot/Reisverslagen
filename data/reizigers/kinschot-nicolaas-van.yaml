id: kinschot-nicolaas-van
naam: Kinschot, Nicolaas van
geboren:
  jaar: 1585
  datum: 29 maart 1585
  plaats: Delft
overleden:
  jaar: 1660
  datum: 13 oktober 1660
  plaats: Den Haag
korte_typering: Delft, 29 maart 1585 – Den Haag, 13 oktober 1660. Maakte in 1602 een educatiereis
  naar Duitsland (17 jaar).
biografie: Zoon van Jasper van Kinschot (1552-1603) en Josina Pijll, broer van Gaspar (1592-1654).
  Studeerde en promoveerde in de rechten in Leiden. Maakte een educatiereis naar Duitsland
  in 1603, waarvoor zijn vader apodemische instructies schreef. Mogelijk werd hij uit het
  land gestuurd zodat zijn vader Anna Bruininckx (†1603) het hof kon maken, een geliefde van
  zijn zoon. Schreef in 1603 een ode op Maurits van Oranje (1567-1638), de Oratio Panegyrica.
  Werd in 1614 aangesteld tot advocaat-fiscaal van Holland en in 1638 tot pensionaris van
  Delft. Nam in 1651 het raadpensionarisschap van Jacob Cats over (1577-1660).
reizen_vermeld:
- 1603, Duitsland.
addenda:
- Instructie van Jasper van Kinschot voor zijn zoon ter gelegenheid van zijn reis naar Duitsland,
  met latere aantekeningen (FA Van Kinschot 140).
poezie:
- Briefgedicht van Hugo de Groot (1583-1645), gericht aan Jasper van Kinschot over diens affaire
  met Bruininckx, getiteld ‘Epistola Palladii ad Thamantiam patri suo nubentem’ (De Groot
  1670, 144-149).
literatuur:
- NNBW, X, 464; Van Kinschot 1915, 244-247; Eyffinger 1990, 174.
bronnen:
