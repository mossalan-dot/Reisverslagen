korte_typering: 'Maakte in 1614-1628 een kunstenaarsreis naar Frankrijk en Italië. Eerste reis:
  01-01-1614 (18 jaar)'
biografie: Maakte in 1614 een kunstenaarsreis naar Frankrijk en Italië, waar hij onder andere
  Arras, Amiens, Parijs, Aix-en-Provence, Marseille, Genua, Livorno, Rome, Mantua en Venetië
  aandeed. Hij was een van de oprichters van de Bentvueghels en had de bijnaam ‘Nestelghat’.
  Kreeg in Italië ook de bijnaam ‘Leonardo della Notte’ vanwege zijn vele nachttaferelen. Keerde
  in 1628 terug in Delft en werd toegelaten tot het Sint-Lucasgilde. Werd lid van de schutterij.
  Maakte verschillende fresco’s, muurschilderingen en wandtapijten, onder andere voor Frederik
  Hendrik (1584-1647). Maakte rond 1648 een tweede reis naar Rome.
