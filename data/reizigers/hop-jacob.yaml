id: hop-jacob
naam: Hop, Jacob
korte_typering: Baron van het Heilige Roomse Rijk.Amsterdam, 31 juli 1654 – Amsterdam, 27
  oktober 1725. Maakte in 1678 een diplomatieke reis naar Frankrijk (24 jaar).
biografie: Zoon van Cornelis Hop (1620-1704) en Anthonia Cloeck. Reisde in 1678 naar Frankrijk
  in het diplomatiek gezantschap van Hiëronymus van Beverningh (1614-90). Diende tussen 1680
  en 1685 als pensionaris van Amsterdam en vervulde tussen 1687 en 1700 verschillende diplomatieke
  zendingen, onder andere naar Berlijn en Wenen. Werd in 1699 baron van het Heilige Roomse
  Rijk. Maakte in 1702 en 1703 militaire reizen in het gezelschap van zijn zoon Cornelis (1685-1762).
  Was tussen 1703 en 1712, gedurende de Spaanse Successieoorlog, gedeputeerde te velde.
reizen_vermeld:
- 1678, Frankrijk; augustus 1687-augustus 1689, Duitsland; september 1689-maart 1692, Engeland;
  november 1692-maart 1693/augustus-november 1693, Denemarken; augustus 1696-augustus 1697,
  Duitsland; augustus 1698-oktober 1700, Wenen; augustus 1702, Utrecht, Gelderland en Overijssel;
  juli-september 1703, Zeeland en Gelderland; februari 1709-april 1710, Lille; juni-juli 1710,
  Brussel.
verslagen_vermeld:
- Hop 1702; Hop 1703.
