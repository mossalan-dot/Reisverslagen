korte_typering: 'Maakte in 1698 en 1699 een educatiereis naar Italië in het gezelschap van Lucas
  van Voorst. Eerste reis: 29-05-1694'
biografie: Vermoedelijk uit Amersfoort. Studeerde en promoveerde in Utrecht bij de filoloog
  Johann Graevius (1632-1703). Was werkzaam als filoloog en archeoloog en publiceerde verschillende
  boeken. Maakte in 1698 en 1699 een educatiereis naar Italië in het gezelschap van Lucas van
  Voorst. Mogelijk trok hij in 1694 naar Duitsland en Oostenrijk met de heren Doornekroon, Ewijck
  en Hasecamp.
