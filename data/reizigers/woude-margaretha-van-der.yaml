id: woude-margaretha-van-der
naam: Woude, Margaretha van der
geboren:
  jaar: 1661
  plaats: Nieuwe Niedorp
overleden:
  jaar: 1677
  datum: 7 februari 1677
  plaats: Frans-Guyana
korte_typering: Nieuwe Niedorp, 1661 – Frans-Guyana, 7 februari 1677. Reisde in 1676-77 naar
  Frans-Guyana (15 jaar).
biografie: Dochter van Herman Hartman van der Woude (1621-77) en Margarita Blaeuhulck (1621-62).
  Reisde in 1676 en 1677 samen met haar vader, zus Elisabeth (1657-98) en broer Johannes (º1658)
  naar Frans-Guyana, waar haar vader gouverneur zou worden. Overleed een dag na aankomst,
  waarschijnlijk aan een ziekte.
reizen_vermeld:
- December 1676-februari 1677, Frans-Guyana.
verslagen_vermeld:
- Van der Woude 1676-1677; Van der Woude 1928, 214-236; Van der Woude 2001.
literatuur:
- DVL; LSD; Van der Woude 2001; Barend-van Haeften 2005, 91-98.
bronnen:
