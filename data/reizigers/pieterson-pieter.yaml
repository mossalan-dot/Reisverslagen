id: pieterson-pieter
naam: Pieterson, Pieter
korte_typering: Maakte in 1666 en 1667 een educatiereis naar Frankrijk en Engeland in het
  gezelschap van neef Cornelis de Jonge van Ellemeet (1646-1721), Cornelis de Jonge van Oosterland
  (1645-94) en Justus van der Cijs.
reizen_vermeld:
- September 1666-november 1667, Zuidelijke Nederlanden, Frankrijk, Zwitserland en Engeland.
verslagen_vermeld:
- De Jonge van Ellemeet 1666-1667.
bronnen:
- gemaakt-op-reis
