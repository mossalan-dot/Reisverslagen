biografie: Zoon van Nicolaas Ewoutsz. van der Dussen (1636-1719) en Lydia van Beveren (º1647),
  broer van Pieter (1673-1726) en Cornelis (1684-1754). Maakte met Pieter een educatiereis naar
  Duitsland, Italië en Zwitserland in 1699 en 1700. Werd schepen van Dordrecht in 1696, raad
  in 1705 en burgemeester in 1717.
