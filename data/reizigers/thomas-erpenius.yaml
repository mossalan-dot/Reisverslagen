  Eerste reis: 01-01-1608 (24 jaar)'
biografie: Zoon van Gerard Joannes van Erp en Beatrix de Bije. Studeerde in Leiden en specialiseerde
  zich in godgeleerdheid en Oosterse talen. Maakte tussen 1608 en 1612 een peregrinatio academica
  naar Engeland, Frankrijk, Italië en Duitsland, waar hij onder andere Canterbury, Oxford, Parijs,
  Saumur, Milaan, Venetië en Heidelberg aandeed. Werd hoogleraar in de Oosterse talen en het
  Hebreeuws in Leiden. Reisde in 1620 als begeleider van Volkert Teding van Berkhout (1601-1632)
  naar Frankrijk. Overleed aan de pest.
