biografie: Zoon van Thomas van Wesel Rochusz. en Ida de Jonge Willemsdr. Studeerde in Leiden
  en reisde in 1591 naar Duitsland, waar hij een graad in de rechtsgeleerdheid behaalde. Was
  advocaat voor het Hof van Holland en in 1596 pensionaris van Dordrecht. Functioneerde als
  commissaris politiek tijdens de Synode van Dordrecht in 1618 en 1619, evenals die in Hoorn
  in 1623 en Enkhuizen in 1624. Maakte in 1627 een diplomatieke reis naar Polen en Zweden met
  medegezanten Andries Bicker (1586-1652) en Simon van Beaumont (1574-1654). De reis werd vastgelegd
  door Abraham Booth (1606-1636). Reisde in 1635 voor een tweede maal naar Polen en Zweden met
  Albert Joachimi (1560-1654) en Joan Huydecoper (1599-1661). Schreef Latijnse tragediën en
  epigrammen.
