biografie: Dochter van Jacob de Jonge van Ellemeet (1601-1650) en Magdalena Briel (1617-1685),
  zus van Cornelis (1646-1721) en Cecilia (1648-1686). Maakte in 1669 een plezierreis naar Antwerpen
  en Brussel in het gezelschap van haar moeder, zus en broer, familievriend Agatha de Jong en
  haar kinderen. Trouwde in 1664 met Jacob Verheije (1640-1718), raadpensionaris van Zeeland.
