id: alting-menso
naam: Alting, Menso
korte_typering: Emden (D), 2 augustus 1636 – Groningen, 2 augustus 1712. Maakte tussen 1656
  en 1662 verschillende reizen naar Duitsland, Zwitserland en Frankrijk (20 jaar).
biografie: Zoon van Menso Alting (1587-1647) en Dorothea Rufelaar (†1637). Maakte tussen 1656
  en 1662 verschillende reizen naar Duitsland, Zwitserland en Frankrijk. Werkte als secretaris
  en ambtsman te Selwert en als rechter in Sappemeer. Werd tussen 1686 en 1713 aangesteld
  als burgemeester van Groningen. Was incidenteel als cartograaf werkzaam. Publiceerde in
  1697 een aardrijkskundig werk over Duitsland.
reizen_vermeld:
- 1656-62, Duitsland, Zwitserland en Frankrijk.
verslagen_vermeld:
