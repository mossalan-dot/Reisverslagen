korte_typering: Heer van Burg en Kraaienstein. Middelburg, 1 april 1622 – Den Haag, 7 januari
  1695. Maakte in 1656 een diplomatieke reis naar Polen (34 jaar).
biografie: Zoon van Anthony Anthonisz. de Huybert (ca. 1585-ca. 1630) en Johanna Haecx (º1591).
  Studeerde in Leiden en werd in 1655 ambassadeur extraordinaris in het gezantschap naar de
  Zweedse koning. Maakte een diplomatieke reis naar Polen in 1656 samen met Govert van Slingelandt
  (1623-90), Frederik van Dorp (1612-79) en Johan Isbrandtsz (1621-1702). Adriaen Schagen
  (1633-99) deed verslag. Was lid van meerdere diplomatieke missies, onder andere naar Zweden
  in 1659. Werd in 1659 benoemd tot secretaris van de Staten van Zeeland en bekleedde tussen
  1664 en 1687 het ambt van raadpensionaris van Zeeland. Onderhandelde tijdens de Vrede van
  Breda in 1667.
reizen_vermeld:
- 1656, Polen en Zweden; juni 1659-januari 1660, Denemarken.
