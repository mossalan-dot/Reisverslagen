korte_typering: Heer van Bovignies. Den Haag, 26 juli 1631 – Dordrecht, 1692. Maakte in 1653
  een diplomatieke reis naar Lübeck (21 jaar).
biografie: 'Zoon van Anthony Vivien (º1603) en Anthonia van den Corput (1607-56), neef van
  Johan (1625-72) en Cornelis de Witt (1623-72). Studeerde rechten in Utrecht. Maakte in 1653
  een diplomatieke reis naar Lübeck samen met Anthony Oetgens van Waveren (1585-1658) en Jacob
  de Witt (1589-1674). Arnout Hellemans Hooft (1629-80) deed kort verslag. Maakte tussen 1653
  en 1655 een educatiereis naar Duitsland, Zwitserland en Frankrijk en promoveerde in december
  1654 in de rechten in Angers. Werkte als advocaat in Den Haag. Werd in 1664 pensionaris
  van Dordrecht en viel tussen 1665 en 1666 meermaals in als raadpensionaris. Werd na de dood
  van De Witt niet meer benoemd tot hoge bestuurlijke posities.


  Zoon van burgemeester Arnoldus Vollenhove en Geertruy Alten. Ging school in Kampen en studeerde
  theologie in Utrecht en Groningen. Werd achtereenvolgens predikant in Vledder, Zwolle en
  Den Haag. In 1674 reisde hij als predikant naar Londen in het diplomatiek gezantschap van
  Coenraad van Beuningen (ca. 1622-93), Willem Adriaan van Nassau-Odijck (ca. 1632-1705),
  Willem van Haren (1626-1708) en Frederik van Reede tot Renswoude (ca. 1630-1715). Werd in
  1681 curator van de Latijnse school in Den Haag. Publiceerde verschillende gedichten en
  preken.'
