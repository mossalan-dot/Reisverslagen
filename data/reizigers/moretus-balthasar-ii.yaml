korte_typering: Antwerpen, 9 december 1615 – Antwerpen, 26 maart 1674. Katholiek. Maakte in
  1660 een reis naar Parijs (44 jaar).
biografie: Zoon van Jan II Moretus (1576-1618) en Maria de Sweert (1588-1655), echtgenoot
  van Anna Goos (1627-91) en vader van Balthasar III (1646-96), Joannes Jacobus (1647-1718),
  Franciscus (1656-1705) en Maria Isabella (1655-76). Studeerde in Antwerpen en Doornik. Nam
  in 1641 de uitgeverij Plantijn over en maakte de onderneming winstgevend. Werd in 1647 benoemd
  tot deken in het Antwerpse Sint-Lucasgilde. Reisde in 1660 naar Parijs met zijn zoon Balthasar
  III. Maakte een korte reis naar Ieper, Lille en Doornik in 1663 met zijn zonen Balthasar
  III en Joannes Jacobus. Maakte een korte reis naar Den Bosch in 1668 met zijn echtgenote
  en kinderen.
reizen_vermeld:
