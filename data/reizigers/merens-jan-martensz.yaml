id: merens-jan-martensz
naam: Merens, Jan Martensz.
naamsvarianten:
- Jan Maertsz.
geboren:
  jaar: 1574
  datum: 14 januari 1574
  plaats: Hoorn
overleden:
  jaar: 1642
  datum: 22 januari 1642
korte_typering: Hoorn, 14 januari 1574 – 22 januari 1642. Reisde en woonde in 1594-1597 in
  Portugal (20 jaar).
biografie: Zoon van watergeus Maarten Merens (1544-73) en Maria Theunis Verduyn (º1539). Woonde
  tussen 1594 en 1597 in Lissabon en in 1599 in Calais. Maakte in 1600 een reis naar Italië
  en Frankrijk. Werd in 1603 vroedschap en in 1612, 1614 en 1617 burgemeester van Hoorn. Verbleef
  vanwege handelsbelangen in Engeland tussen 1628 en 1634.
reizen_vermeld:
- 1594-1597, Lissabon; 1599, Calais; maart-oktober 1600, Frankrijk, Zwitserland, Italië, Oostenrijk
  en Duitsland; 1628-34, Engeland.
verslagen_vermeld:
- Merens 1600; Merens 1937.
literatuur:
- BWN, XII, 631-632; RAA; Hoogewerff 1932, 139-148; Merens 1939, 193-207; Avery 1991, 147-154;
  Bonke en Bossaers 2002, 138.
bronnen:
