id: clootwijck-wouter-van
naam: Clootwijck, Wouter van
korte_typering: Maakte in 1612-13 een educatiereis naar Frankrijk met Cornelis van Beveren
  (1591-1663), Gaspar van Kinschot (1592-1654) en Van Blockhusen. Mogelijk verwant aan Matthijs
  van der Merwede (ca. 1625-ca. 1677).
biografie: 'Zoon van predikant Andreas Colvius (1594-1671) en Anna van der Myle. Studeerde
  in Leiden. Maakte in 1654 een educatiereis naar Frankrijk. Raadpensionaris Johan de Witt
  (1625-72) verzocht ambassadeur Willem Boreel (1591-1668) te assisteren. Was predikant van
  de Waalse gemeente, in 1655 in Dordrecht en vanaf 1656 in Amsterdam. Zijn vader reisde in
  1620 met een diplomatiek gezantschap naar Venetië, in het gezelschap van Constantijn Huygens
  (1596-1687).


  Maakte rond 1664 een educatiereis naar Frankrijk. Zijn tante Erkenraet Berck (1610-86) verzocht
  raadpensionaris Johan de Witt (1625-72) om ambassadeur Coenraad van Beuningen (ca. 1622-93)
  aan te sporen om een oogje in het zeil te houden.'
