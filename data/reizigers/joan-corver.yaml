biografie: Zoon van Dirck Corver en Maria Overrijn van Schoterbos. Werd in 1652 aangesteld als
  stadssecretaris. Reisde in 1655 met Joan sr. (1599-1661) en Joan jr. Huydecoper (1625-1704)
  en Pieter de Graeff (1638-1707) naar het hof van Brandenburg om te spreken over een bondgenootschap
  tegen Zweden en op te treden als peetoom bij de doop van Karel Emiel (1655-1674), keurvorst
  van Brandenburg. Maakte in 1674 en 1675 een diplomatieke missie naar Engeland. Was raad, schepen
  en tussen 1681 en 1715 vrijwel onafgebroken burgemeester van Amsterdam. Was raad van de Admiraliteit
  van Amsterdam, kolonel van de schutterij, bewindhebber van de VOC en curator van het Athenaeum
  Illustre.
