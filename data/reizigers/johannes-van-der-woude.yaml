korte_typering: 'Reisde in 1676-1677 naar Frans-Guyana. Eerste reis: 01-01-1676 (18 jaar)'
biografie: Zoon van Herman Hartman van der Woude (1621-1677) en Margarita Blaeuhulck (1621-1662).
  Reisde in 1676 en 1677 samen met zijn vader en zussen Elisabeth (1657-1698) en Margaretha
  (1661-1677) naar Frans-Guyana, waar zijn vader gouverneur zou worden. Bleef na het overlijden
  van zijn vader en jongste zus in Frans-Guyana.
