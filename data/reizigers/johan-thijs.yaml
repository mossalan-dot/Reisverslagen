biografie: Zoon van Antoni Thijs en Elisabeth de Bacher. Studeerde letteren en rechten in Leiden.
  Maakte in 1646 een diplomatieke reis naar Münster. Tussen 1646 en 1648 maakte hij een educatiereis
  naar Frankrijk en Engeland samen met de oriëntalist Job Ludolf (1624-1704). Promoveerde in
  Angers. Werkte als advocaat in Leiden en legde een bijzonder grote boekverzameling aan, de
  Bibliotheca Thysiana.
