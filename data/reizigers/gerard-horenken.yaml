biografie: Zoon van Egbert Horenken (1632-1679) en Sibilla Horenken tot Dijksterhuis (1641-1679).
  Studeerde in Groningen, Leiden en Utrecht. Maakte tussen 1680 en 1683 een educatiereis naar
  Frankrijk, Zwitserland, Italië, Duitsland en Engeland in het gezelschap van zijn tutor Carolus
  Casparus Neander. Was lid van de Hoge Justitiekamer in Groningen en curator van de hogeschool
  aldaar, evenals bewindhebber van de WIC.
