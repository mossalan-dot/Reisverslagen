id: boelen-paul
naam: Boelen, Paul
korte_typering: Geboren in Den Haag rond 1599. Zoon van Johan Boelen en Catharina Jansdr Halling.
  Studeerde rechten in Leiden in 1621. Reisde tussen 1621 en 1624 mee met het diplomatiek
  gezantschap van François van Aerssen (1572-1641), Diederick Bas (1569-1637) en Hendrik van
  Tuyll van Serooskerken (1574-1627) naar Engeland en Frankrijk. Studeerde rechten in Orléans
  en bezocht de rijschool in Angers.
reizen_vermeld:
- December 1621-24, Engeland en Frankrijk.
verslagen_vermeld:
- Boelen 1621-1624.
addenda:
- Zie appendix B.
literatuur:
