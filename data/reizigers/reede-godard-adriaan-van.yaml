  plaats: Amerongen
overleden:
  jaar: 1691
  datum: 9 oktober 1691
  plaats: Kopenhagen (DE)
korte_typering: Baron van Reede, vrijheer van Amerongen, heer van Ginkel, Elst en Lievendael.
  Amerongen, 6 januari 1621 – Kopenhagen (DE), 9 oktober 1691. Maakte een diplomatieke reis
  naar Denemarken in 1655. (34 jaar)
biografie: Zoon van Godard van Reede (1593-1641) en Geertruid van Nijenrode. Was heemraad
  van Lekdijk Bovendams, afgevaardigde voor de Staten-Generaal en in 1689 lid van de Raad
  van State. Maakte verschillende diplomatieke missies, onder andere naar Denemarken, Zweden,
  Polen en Aken. Werd door koning Christiaan V (1646-99) in de Deense adelstand verheven.
  Maakte in 1660 en 1661 als gezant een diplomatieke reis naar het hof in Madrid samen met
  Philips Aebinga van Humalda (ca. 1616-72) en Johan van Merode (ca. 1607-66). De reis werd
  beschreven door Lodewijk Huygens (1631-99). Zijn woonplaats, kasteel Amerongen, werd tijdens
  het Rampjaar door de Fransen vernietigd.
