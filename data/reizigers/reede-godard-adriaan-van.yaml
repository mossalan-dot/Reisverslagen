addenda:
- Verbalen en brievenboeken van de gezantschappen, hierboven genoemd (SG 8507-8509; 8525-8527;
  8539; 8557-8558; 8563-8564; 8587; 8607-8609; 8633-8634; 9182; 12553.50). Declaraties van
  de missie naar Denemarken en zijn reis langs de hoven van de bisschop van Münster en de
  hertog van Holstein van april 1690 tot november 1691, opgesteld namens zijn weduwe door
  Abraham Lanssel (Lanssel 1690-1691).
correspondentie:
- Een brief aan Constantijn Huygens (1596-1687) over zijn zoon Lodewijk tijdens de reis naar
  Spanje in 1660, 1) Zelzate (ZN), 12 november 1660 (ePistolarium). Brieven tijdens de jaren
  1671-72 (Van der Bijl en Quarles van Ufford 1991). Brieven met zijn zoon Godard van Reede
  (1674-1730) (McCullagh 2003) tijdens zijn reis naar Denemarken in 1690-91.
