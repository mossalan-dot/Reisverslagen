korte_typering: Heer van Petten en Nolmerban, van de Egmonden en van Schoorl en Camp. Alkmaar,
  1695 – Alkmaar, 1740. Protestants. Maakte in 1724 een reis naar Engeland (29 jaar).
biografie: 'Zoon van Cornelis Egmond van der Nijenburg (1651-1708) en Catharina van Panhuys
  (º1657). Maakte in 1724 een reis naar Engeland met zijn broer Johannes Aegidius (1693-1747).
  Was vroedschap, schepen en burgemeester van Alkmaar.


  Egmond van de(r) Nijenburg, Johannes Aegidius van [ook: Jan Aegidius]. Heer van de Egmonden.
  Alkmaar, maart-april 1693 – Leiden, 11 oktober 1747. Reisde in 1718-1722 naar Italië en
  Turkije (25 jaar).


  Zoon van Cornelis Egmond van der Nijenburg (1651-1708) en Catharina van Panhuys (ª1657),
  broer van Dirk (1695-1740). Promoveerde in de rechten in Leiden en was werkzaam als advocaat.
  Maakte tussen 1718 en 1723 met Samuel van de Putte (1690-1745) een educatiereis naar Italië,
  gevolgd door een grote reis naar het Midden-Oosten. Zijn verslag, bewerkt door Johannes
  Heyman (1708-88), werd postuum uitgegeven als Reizen door een gedeelte van Europa, klein
  Asien (...). Maakte in juli 1724 een reis naar Engeland met zijn broer Dirk (1695-1740).
  Was schepen en raad in Leiden. Werd in 1739 als extraordinaris gezant naar Napels gezonden
  om koning Karel VII (1716-88) te feliciteren met zijn huwelijk met Maria Amalia van Saksen
  (1724-60) en een handelsverslag te ondertekenen. Jan Teding van Berkhout (1713-66) reisde
  mee.'
