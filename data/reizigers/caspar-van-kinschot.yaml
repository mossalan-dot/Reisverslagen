korte_typering: 'Maakte in 1643-1644 een educatiereis naar Frankrijk. Eerste reis: 25-09-1643
  (21 jaar)'
biografie: Zoon van Louis van Kinschot (1595-1647) en Maria de Jonge (1603-1630). Studeerde
  rechten in Utrecht en Leiden. Schreef Neolatijnse gedichten. Maakte in 1643 en 1644 een educatiereis
  naar Frankrijk en promoveerde vermoedelijk in Orléans in 1645. In 1646 reisde hij in een diplomatiek
  gezantschap mee Duitsland om te onderhandelen over de Vrede van Münster. Overleed aan de gevolgen
  van tuberculose. Zijn gedichten werden postuum uitgebracht.
