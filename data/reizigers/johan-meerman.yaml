biografie: Zoon van Gerard Meerman (1650-1710) en Catharina Wijnina van Rijn (ca. 1660-1703).
  Studeerde en promoveerde in de rechten in Leiden. Werkte als advocaat in Leiden en trad in
  1714 tot het stadsbestuur. Maakte in 1714 een reis naar Engeland in het gezelschap van zijn
  schoonzus Adriana de la Court (1696-1748).
