biografie: Zoon van Paulus Louwrens en Eva Buys. Studeerde rechten in Leiden en Orléans en werd
  in 1684 advocaat van het Hof van Holland. Werd in 1691 stadsadvocaat en directeur van de Sociëteit
  van Suriname en de kolonie Berbice tussen 1701 en 1717. Verbeterde de diplomatieke relatie
  met Engeland in 1705 en 1706 en was een van de onderhandelaars bij de Vrede van Utrecht in
  1713. Maakte in 1706 een diplomatieke reis naar Londen met Cornelis van der Dussen (1654-1754).
  Werd in 1714 aangesteld als buitengewoon ambassadeur in Frankrijk. Was eerste rang secretaris
  van de Staten van Holland tussen 1726 en 1749 en raadspensionaris van Holland in 1746.
