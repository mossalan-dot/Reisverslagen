biografie: Zoon van Willem van Beveren (1556-1631) en Emmerentia van der Eynde (†1632), vader
  van Jacob (1612-1676). Reisde tussen 1612 en 1613 naar Frankrijk, Zwitserland en Duitsland
  samen met Gaspar van Kinschot (1592-1654), Van Blockhusen en Wouter van Clootwijck. Promoveerde
  in Orléans in de rechten. Tussen 1618 en 1642 was hij rentmeester-generaal van Zuid-Holland
  en later dijkgraaf van Hendrik-Ido-Ambacht. Was tussen 1627 en 1650 meermaals schepen en burgemeester
  van Dordrecht. Werd in 1635 door Lodewijk XIII (1601-1643) geridderd in de orde van St. Michiel.
  Ondernam als ambassadeur diplomatieke missies naar Denemarken en Hamburg en Engeland. Schreef
  naar verluid de niet-overgeleverde tragedie Mithridates en de ‘Reize’, een gedicht op zijn
  diplomatieke missie naar Neurenberg.
