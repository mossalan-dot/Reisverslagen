id: hudde-rombout
naam: Hudde, Rombout
korte_typering: Amsterdam, augustus 1620 – Amsterdam, oktober 1679. Maakte in 1649-51 een
  educatiereis naar Italië en Frankrijk (29 jaar).
biografie: Zoon van Hendrick Hudde (1591-1637) en Clara Nijs (1599-1648). Maakte tussen 1649
  en 1651 een educatiereis naar Italië, Zwitserland en Frankrijk in het gezelschap van Arnout
  Hellemans Hooft (1629-80), de dichter Reyer Anslo (1626-69), zijn neef Joannes Hudde (1628-1704),
  IJsbrand Kieft, Blom en Ooms. Werkte als advocaat en werd onder andere aangesteld als raad
  en schepen van Amsterdam tussen 1674 en 1679.
reizen_vermeld:
- September 1649-november 1651, Duitsland, Oostenrijk, Italië, Zwitserland en Frankrijk.
verslagen_vermeld:
- Hellemans Hooft 1649-1651; Hellemans Hooft 2001.
literatuur:
- Elias 1902-1905, II, 578; Hellemans Hooft 2001, 22.
bronnen:
- gemaakt-op-reis
