id: geest-wybrand-de
naam: Geest, Wybrand de
geboren:
  jaar: 1592
  datum: 16 augustus 1592
  plaats: Leeuwarden
overleden:
  jaar: 1661
  datum: ca. 1661
  plaats: Leeuwarden
religie: Katholiek
korte_typering: Leeuwarden, 16 augustus 1592 – Leeuwarden, ca. 1661. Katholiek. Maakte in
  1614-18 een kunstenaarsreis naar Rome (22 jaar).
biografie: Zoon van de glasschilder Simon Juckesz. en Wyts Wybrantsdr. Ging in de leer bij
  Abraham Bloemaert (ca. 1564-1651) en maakte tussen 1614 en 1618 een kunstenaarsreis naar
  Frankrijk en Italië. Kreeg de bentnaam ‘De Friesche Adelaer’. Werkte in Leeuwarden aan het
  hof, waar hij portretten van de Friese stadhouders vervaardigde.
reizen_vermeld:
- 1614-18, Frankrijk en Italië.
addenda:
- Album amicorum met inscripties uit onder andere Den Bosch, Parijs, Aix-en-Provence en Rome
  (De Geest 1613-1617).
literatuur:
- NNBW, III, 439; RKD, Rus 2014, 31-59.
bronnen:
