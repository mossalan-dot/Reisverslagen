korte_typering: 'Maakte in 1634-1635 een educatiereis naar Frankrijk. Eerste reis: 30-08-1634
  (23 jaar)'
biografie: Zoon van Cornelis de Witt en Elisabeth van Haarlem. Studeerde rechten en promoveerde
  in Leiden. Maakte in 1634 en 1635 een educatiereis naar Frankrijk in het gezelschap van Jacob
  van Beveren (1612-1676), Mathes Onderwaeter en Hendrick van Gouthouven. Werkte voor de WIC
  in Brazilië, onder andere als president van de raad van justitie en districtsdirecteur. Ondernam
  diplomatieke reizen naar Portugal in 1657 en 1661.
