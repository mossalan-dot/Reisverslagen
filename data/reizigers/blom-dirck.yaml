id: blom-dirck
naam: Blom, Dirck
korte_typering: Geïdentificeerd door Grabowsky en Verkruijsse. Mogelijk Dirck Blom (ºca. 1623).
  Maakte tussen 1649 en 1651 een educatiereis naar Italië samen met Arnout Hellemans Hooft
  (1629-80), Reyer Anslo (1626-69), Rombout (1620-79) en Joannes Hudde (1624-1704), IJsbrand
  Kieft en Ooms.
biografie: 'Blijenburgh, Adriaen Adriaensz van [ook: Blyenburch, Adrianus]. Heer van Naaldwijk,
  ridder in de orde van St.-Michiel. Dordrecht, november 1616 – Dordrecht, 10 september 1682.
  Maakte in 1646 een reis naar Italië (30 jaar).


  Zoon van Adriaen van Blijenburgh sr. (1589-1630) en Carolina van Beveren (1589-1625). Was
  schepen en meermaals burgemeester van Dordrecht, evenals lid van de Raad van State en gecommitteerde
  van de Raad van Holland. Reisde in 1646 naar Italië met zijn neef Matthijs van der Merwede
  (ca. 1625-ca. 1677) en Nicolaas Heinsius (1620-81). Was vanaf 1666 verantwoordelijk voor
  de opvoeding van Willem III (1650-1702).'
reizen_vermeld:
- September 1649-november 1651, Duitsland, Oostenrijk, Zwitserland, Frankrijk.
- 1646, Italië.
verslagen_vermeld:
- Hellemans Hooft 1649-1651.
correspondentie:
- Drie brieven van Matthijs van der Merwede, o.a. uit Parijs en Rome (Van der Merwede 1639-1648).
