id: thijs-johan
naam: Thijs, Johan
naamsvarianten:
- Thysius, Johannes
korte_typering: Amsterdam, augustus 1621 – Leiden, oktober 1653. Maakte in 1646 een diplomatieke
  reis naar Münster (25 jaar).
biografie: Zoon van Antoni Thijs en Elisabeth de Bacher. Studeerde letteren en rechten in
  Leiden. Maakte in 1646 een diplomatieke reis naar Münster. Tussen 1646 en 1648 maakte hij
  een educatiereis naar Frankrijk en Engeland samen met de oriëntalist Job Ludolf (1624-1704).
  Haalde zijn licentiaat in Angers. Werkte als advocaat in Leiden en legde een bijzonder grote
  boekverzameling aan, de Bibliotheca Thysiana.
reizen_vermeld:
- Augustus-september 1646, Münster; oktober 1646-mei 1648, Frankrijk en Engeland.
verslagen_vermeld:
