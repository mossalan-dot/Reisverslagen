id: alderwerelt-jan-pieter
naam: Alderwerelt, Jan Pieter
korte_typering: º9 april 1663. Maakte tussen 1693 en 1695 een educatiereis naar Italië (30
  jaar).
biografie: Wordt door Hoogewerff geïdentificeerd. Zoon van Pieter van Alderwerelt (1619-81)
  en Clara van Bueren (1626-1704). Telg uit een Amsterdams koopmansgezin. Maakte tussen 1693
  en 1695 een educatiereis naar Italië in het gezelschap van de Leidse baron Jacob Emmery
  van Wassenaar van Obdam (1673-1724), Andries Bicker van Swieten (ºca. 1670-96), Keyser uit
  Lüneburg en tutor Laurens Gronovius (1648-1724).
reizen_vermeld:
- November 1693-april 1695, Duitsland, Oostenrijk, Italië, Tsjechië.
verslagen_vermeld:
- Gronovius 1693-95.
literatuur:
- Hoogewerf 1942a, 37-38.
bronnen:
- gemaakt-op-reis
