biografie: Geïdentificeerd door biograaf Prinsen. Zoon van Aernout van Erp (ca. 1533-1618) en
  Jacomina van Velsen (†1658), zwager van P.C. Hooft (1581-1647). Maakte tussen 1624 en 1626
