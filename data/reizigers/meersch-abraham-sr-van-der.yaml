id: meersch-abraham-sr-van-der
naam: Meersch, Abraham sr. van der
religie: Doopsgezind
korte_typering: Amsterdam, 22 oktober 1643 – ‘s-Graveland, 14 september 1728. Doopsgezind.
  Maakte in 1662 een handelsreis naar Spanje (19 jaar).
biografie: Zoon van Arent van der Meersch (1601-67) en Sara de Veer (1604-67), vader van Sara
  (†1674), Catharina (1666-1723), Anna (1669-1724), Pieter (º1677), Abraham jr. (1676-1719)
  en Arent (1683-1768). Werkte als koopman en was een actief lid van de doopsgezinde gemeenschap
  in Amsterdam, waarvoor hij tot tweemaal toe beëdigd werd als diaken. Maakte in 1662 een
  handelsreis naar Spanje en begon zijn eigen bedrijf in 1664. Reisde in 1664 naar Engeland
  en Frankrijk. Vluchtte tijdens het Rampjaar naar Hamburg met zijn gezin. In 1674 ondernam
  hij een handelsreis naar Denemarken en Zweden in het gezelschap van Philips en Jan van Halmael,
  Abraham Vorsterman en de knecht Frederik Paran. Maakte in 1687 een reis naar Lille met zijn
  vrouw Elisabeth Bouttens (1643-1706), Catharina en Pieter en reisde in 1700 naar de Zuidelijke
  Nederlanden met zijn zoon Pieter. Schreef een autobiografie voor zijn kleinzoon Abraham
  Arent (1720-91), getiteld De laatste vaderlijke lessen.
reizen_vermeld:
- 1662, Frankrijk en Spanje; 1664, Engeland en Frankrijk; juni 1672-73, Hamburg; februari-april
  1674, Duitsland, Denemarken en Zweden; 1687, Lille; april-mei 1700, Zuidelijke Nederlanden.
verslagen_vermeld:
- Van der Meersch 1672-1674; Van der Meersch 1687; Petersen 1906.
literatuur:
- Visser en Zilverberg 1991, 153-187, Lindeman, Scherf en Dekker 2016, 88.
bronnen:
