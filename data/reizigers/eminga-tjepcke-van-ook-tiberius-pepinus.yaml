id: eminga-tjepcke-van-ook-tiberius-pepinus
naam: 'Eminga, Tjepcke van [ook: Tiberius Pepinus].'
geboren:
  jaar: 1657
  datum: ca. 1657
  plaats: Goutum
overleden:
  jaar: 1733
religie: Katholiek
korte_typering: Goutum, ca. 1657 – 1733. Katholiek. Maakte in 1678-82 een educatiereis naar
  Italië en Frankrijk (21 jaar).
biografie: Zoon van Sicke van Eminga (1638-82) en Frouck van Aylva (1635-59). Studeerde in
  Groningen. Reisde tussen 1678 en 1682 naar Duitsland, Oostenrijk, Italië en Frankrijk. Was
  een vermogend landbezitter en bevond zich in de kringen van het stadhouderlijk hof van Friesland.
reizen_vermeld:
- April 1678-februari 1682, Duitsland, Tsjechië, Oostenrijk, Slowakije, Oostenrijk, Italië,
  Frankrijk, Zuidelijke Nederlanden.
verslagen_vermeld:
- Van Eminga 1678-1682; Van Eminga 2014.
literatuur:
- Six 1869, 169-170; Reinalda en Otten 1998, 8-16; Huisman 2016, 165-180.
bronnen:
- gemaakt-op-reis
