biografie: Zoon van Jacob de Witt (1589-1674) en Anna van den Corput (1599-1645), broer van
  Johan (1625-1672). Studeerde rechten in Leiden. Maakte tussen 1645 en 1647 een educatiereis
  naar Frankrijk, Zwitserland en Engeland met zijn broer Johan en promoveerde in Angers in de
  rechten. Werd lid van de vroedschap, ruwaard van Putten en baljuw van de Beijerlanden. In
  1666 en 1667 was hij burgemeester van Dordrecht. Was in 1667 als gevolmachtigde aanwezig bij
  de Tocht naar Chatham. Werd tijdens het Rampjaar verdacht van hoogverraad, verbannen en gelyncht.
