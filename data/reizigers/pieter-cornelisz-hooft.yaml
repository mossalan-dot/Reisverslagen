biografie: Zoon van Cornelis Pietersz. Hooft (1547-1626) en Anna Blaeu. Bezocht de Latijnse
  school in Amsterdam en maakte tussen 1598 en 1601 een educatiereis naar Frankrijk en Italië.
  Werkte aanvankelijk voor het handelskantoor van zijn neef Pieter Jansz. Hooft (ca. 1574-1636)
  in La Rochelle en trok van daar naar Zuid-Frankrijk en Italië. Voltooide na terugkeer zijn
  rechtenstudie. Vervulde verschillende bestuurlijke taken, waaronder die van drost van Muiden,
  baljuw van Gooiland en hoofdofficier van Weesp en Weesperkarspel. Schreef een groot aantal
  gedichten en toneelstukken, vertaalde fragmenten van Tacitus en bereidde de Nederlandsche
  Historiën voor.
