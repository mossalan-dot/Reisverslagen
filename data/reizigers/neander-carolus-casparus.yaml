id: neander-carolus-casparus
naam: Neander, Carolus Casparus
korte_typering: Geboren rond 1655. Studeerde in Leiden in 1680. Maakte tussen 1680 en 1683
  een educatiereis naar Frankrijk, Zwitserland, Italië, Duitsland en Engeland als tutor van
  Gerard Horenken (1663-1712).
reizen_vermeld:
- April 1680-september 1683, Zuidelijke Nederlanden, Frankrijk, Zwitserland, Italië en Engeland.
verslagen_vermeld:
- Neander 1680-1683.
literatuur:
- Herfkens 1998, 20-22.
bronnen:
