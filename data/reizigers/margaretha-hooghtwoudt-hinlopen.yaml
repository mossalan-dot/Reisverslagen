biografie: Dochter van Cornelis Claesz Hooghtwoudt en Grietje Coninck. Trouwde in 1674 met Daniël
  de Marez (1641-1681) en hertrouwde na diens overlijden in 1683 met Gerard Hinlopen (1644-1691).
  Maakte in 1683 een plezierreis naar de Zuidelijke Nederlanden in het gezelschap van haar echtgenoot
  en de gezinnen van Gerard van Tongen en Rutger Groot.
