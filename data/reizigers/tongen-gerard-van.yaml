id: tongen-gerard-van
naam: Tongen, Gerard van
korte_typering: Maakte in 1683 een plezierreis naar de Zuidelijke Nederlanden in het gezelschap
  van zijn gezin, Gerard Hinlopen (1644-91), Margaretha Hooghtwoudt (1648-84) en het gezin
  van Rutger Groot.
reizen_vermeld:
- Juni 1683, Zuidelijke Nederlanden.
verslagen_vermeld:
- Hinlopen 1683.
bronnen:
- gemaakt-op-reis
