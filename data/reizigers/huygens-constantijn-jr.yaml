korte_typering: Heer van Zuilichem. Den Haag, 10 maart 1628 – Den Haag, 2 november 1697. Maakte
  in 1649 een diplomatieke reis naar Engeland (21 jaar).
biografie: Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Christiaan (1629-95), Lodewijk (1631-99), Philips (1633-57) en Susanna (1637-1725).
  Studeerde rechten in Leiden en hielp zijn vader tijdens diens post als secretaris van Frederik
  Hendrik (1584-1647) en Willem II (1626-50). Reisde in februari en maart 1649 naar Engeland
  in het gezantschap van Adriaan Pauw (1585-1653). Maakte een educatiereis naar Frankrijk,
  Zwitserland en Italië tussen 1649 en 1651. Assisteerde zijn broer Christiaan bij zijn natuurwetenschappelijke
  onderzoek. Werd secretaris van Willem III (1650-1702) in 1672 en bekleedde die positie tot
  zijn dood. Deed verslag van verschillende militaire expedities in die jaren.
reizen_vermeld:
- Februari-maart 1649, Engeland; mei 1649-51, Frankrijk, Zwitserland en Italië; september-december
  1673/mei oktober 1675, Zuidelijke Nederlanden; april-september 1676/maart-september 1677,
  Zuidelijke Nederlanden en Frankrijk; maart-augustus 1678, Zuidelijke Nederlanden; september-november
  1681, Zuidelijke Nederlanden en Duitsland; oktober 1688-september 1696, Engeland.
