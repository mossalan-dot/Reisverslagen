korte_typering: Maakte een diplomatieke reis naar Zweden in 1656. (-1623 jaar)
biografie: Zoon van Barthoud van Slingelandt (1590-1638) en Geertruid van Beaumont (1592-1652).
  Steunde zijn achterneef Johan de Witt (1625-1672). Studeerde en promoveerde in de rechten
  in Leiden. Maakte een diplomatieke reis naar Zweden in 1656 met medegezanten Frederik van
  Dorp (1612-1679), Pieter de Huybert (1622-1695) en Johan Isbrandtsz (1621-1702). Reisde naar
  Zweden en Polen in 1659 en 1660. Was pensionaris van Dordrecht en vanaf 1664 secretaris van
  de Raad van State. Was kunstliefhebber en schreef en publiceerde gedichten.
