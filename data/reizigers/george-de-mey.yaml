korte_typering: 'Maakte in 1651-1652 een reis naar Engeland. Eerste reis: 20-12-1651 (23 jaar)'
biografie: Zoon van Jan de Mey en Eva Rou. Studeerde in Leiden. Reisde in 1651 en 1652 naar
  Engeland als predikant in het gezelschap van Jacob Cats (1577-1660), Gerard Schaap (1599-1655)
  en Paulus van der Perre (ca. 1598-1653). Ook Adriaen Schagen (1633-1699) en Lodewijk Huygens
  (1631-1699) hielden een journaal bij. Was predikant in Leidschendam, Steenwijk, Gorinchem
  en Gouda en schreef over de verschillen tussen de katholieke en protestantse kerk.
