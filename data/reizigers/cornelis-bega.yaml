biografie: Zoon van de edelsmid Pieter Jansz. Begeyn en Maritge, bastaarddochter van de schilder
  Cornelis Cornelisz (1562-1638). Was werkzaam als schilder, tekenaar en etser. Leerling van
  Adriaen van Ostade (1610-1685). Ondernam tussen 1652 en 1653 een kunstenaarsreis naar Duitsland,
  Frankrijk en Zwitserland in het gezelschap van de Haarlemse schilders Vincent Laurensz. van
  der Vinne (1628-1702), Guillaume Dubois (1623-1664) en Dirck Helmbreeker (1633-1696) en de
  schoenmakersgezel Joost Boelen. Maakte verschillende tekeningen onderweg. Trad in 1654 toe
  tot het schildersgilde van Haarlem
