id: graeff-pieter-de
naam: Graeff, Pieter de
geboren:
  jaar: 1638
  datum: 14 augustus 1638
overleden:
  jaar: 1707
  datum: 3 juni 1707
korte_typering: Heer van Zuid-Polsbroek, Purmerland en Ilpendam. 14 augustus 1638 – 3 juni
  1707. Maakte in 1655 een diplomatieke reis naar Duitsland (16 jaar).
biografie: Zoon van Cornelis de Graeff (1599-1664) en Catharina Hooft (1618-91). Maakte in
  1655 een diplomatieke reis naar Duitsland in het gezantschap van Joan Corver (1628-1716),
  Joan Huydecoper (1599-1661) en diens zoon Joan (1625-1704). Maakte tussen 1658 en 1660 een
  educatiereis naar Engeland en Frankrijk en ontving een licentiaat in de rechten in Orléans.
  Was schepen van Amsterdam, bewindhebber van de VOC en raadsman van zijn neef en zwager Johan
  de Witt (1625-72).
reizen_vermeld:
- April-juni 1655, Duitsland; 1658-60, Engeland en Frankrijk.
