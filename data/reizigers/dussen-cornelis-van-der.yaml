id: dussen-cornelis-van-der
naam: Dussen, Cornelis van der
korte_typering: Dordrecht, 22 september 1684 – Dordrecht, mei 1754. Maakte in 1706 een reis
  naar Londen (22 jaar).
biografie: Zoon van Nicolaas Ewoutsz. van der Dussen (1636-1719) en Lydia van Beveren (º1647),
  broer van Jacob (1671-1728) en Pieter (1673-1726). Maakte in 1706 een reis naar Londen als
  persoonlijk secretaris van Willem Buys (1661-1749). Werd bewindhebber van de VOC in 1726.
  Werd raad van Dordrecht in 1728 en burgemeester in 1747.
reizen_vermeld:
- Januari-juni 1706, Engeland.
verslagen_vermeld:
- Van der Dussen 1706; Van der Dussen 2016.
addenda:
