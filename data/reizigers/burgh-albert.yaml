id: burgh-albert
naam: Burgh, Albert
geboren:
  jaar: 1650
  plaats: Amsterdam
overleden:
  jaar: 1708
religie: Protestants
korte_typering: Amsterdam, 1650 – 1708. Protestants, daarna katholiek. Maakte rond 1674-75
  een educatiereis naar Italië (ca. 24 jaar).
biografie: Zoon van ontvanger-generaal Coenraad Burgh (1619-99) en Christina Hellemans Hooft
  (1628-81). Leerling of bekende van Baruch Spinoza (1632-77) in Leiden. Maakte een educatiereis
  tussen 1674 en 1675 en bekeerde zich tot het katholicisme, tot groot schandaal van de Republiek
  en de Nederlandse gemeenschap in Italië. Maakte noviciaat in het klooster van de Reformella
  van de Zalige Minderbroeder Bonaventura de Barcinone en nam de naam Franciscus de Hollandia
  aan. Ontving in 1682 de priesterwijding en bekleedde enkele ambten bij de minderbroeders.
  Werd meermaals kandidaat gesteld voor het apostolisch vicariaat.
reizen_vermeld:
- Ca. 1674-75, Italië.
verslagen_vermeld:
- Ruysch 1674-1677.
correspondentie:
- Drie brieven. Een brief aan Spinoza, 1) Florence, 3 september 1675. Een brief van Spinoza,
  1) Den Haag, 1675. Een gepubliceerde brief van Friedrich Spanheim jr. (1631-1701), 1676
  (Spinoza 1977; Spanheim 1676).
literatuur:
