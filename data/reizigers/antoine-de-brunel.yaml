korte_typering: 'Maakte tussen 1651 en 1656 reizen naar Frankrijk, Italië en Spanje. Eerste
  reis: 01-01-1651 (29 jaar)'
biografie: Verarmde hugenoots edelman. Werkte als tutor en begeleidde Cornelis (1638-1688) en
  François van Aerssen van Sommelsdijk (1630-1658), Justinus II van Nassau (1633-1658) en Philips
  (1636-1689) en François de Zoete van Laecke (1637-1720) tussen 1651 en 1658 op hun educatiereis
  naar Frankrijk, Italië en Spanje. In 1665 publiceerde hij zijn verslag van de reis naar Spanje,
  Voyage d’Espagne, curieus, historique et politique, mogelijk gebaseerd op het verslag van
  de vroeggestorven François van Aerssen.
