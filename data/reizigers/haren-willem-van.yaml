korte_typering: Leeuwarden, 17 oktober 1626 – Leeuwarden, 15 april 1708. Maakte in 1646-49
  een educatiereis naar Frankrijk (20 jaar).
biografie: Zoon van Willem van Haren (1581-1649) en Magdalena van Vierssen. Studeerde in Franeker,
  Utrecht en Leiden. Maakte tussen 1646 en 1649 een educatiereis naar Frankrijk met zijn tutor
  Joachim Frentzel (1611-69). Werd in 1652 grietman van het Bilt en lid van de Raad van State.
  Vervulde diverse diplomatieke missies naar onder andere Denemarken, Zweden en Engeland.
  Was betrokken bij de onderhandelingen over de Vrede van Nijmegen (1678) en Rijswijk (1697).
  In 1674 reisde hij naar Londen om te onderhandelen over de Vrede van Westminster samen met
  Coenraad van Beuningen (ca. 1622-93), Willem Adriaan van Nassau (ca. 1632-1705) en Frederik
  baron van Reede tot Renswoude (ca. 1630-1715). De reis werd beschreven door Joannes Vollenhove
  (1631-1708).
reizen_vermeld:
- 1646-49, Frankrijk; juni 1659-januari 1660, Denemarken; maart 1662-oktober 1663, Aken; mei
  1673-mei 1674, Aken en Keulen; 1674-79/mei-augustus 1703, Engeland.
verslagen_vermeld:
- Vollenhove 1674; Vollenhove 2001.
