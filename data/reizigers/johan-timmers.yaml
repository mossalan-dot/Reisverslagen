biografie: Zoon van Pieter Timmers en Ignatia van Zoelen, vader van Aletta Johanna (1707-1775)
  en Ignatia Geertruida (1714-1733). Trouwde in 1703 met Suzanne Libertine van Schinne (1684-1732).
