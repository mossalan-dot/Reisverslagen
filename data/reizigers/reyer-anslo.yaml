biografie: Zoon van Reyer Claesz Anslo en Hestertje Willems (º1597). Schreef sinds 1645 poëzie,
  waaronder de Parysche Bruiloft (1649) en De pest tot Napels (1656). Reisde in 1649 naar Italië
  in het gezelschap van Arnout Hellemans Hooft (1629-1680), Rombout (1620-1679) en Joannes Hudde
  (1624-1704), IJsbrand Kieft, Blom en Ooms. Hij bekeerde zich tot de katholieke kerk, ontving
  de tonsuur (1656) en werd subdiaken (1666). In Rome verkeerde hij de kring rondom Christina
  van Zweden (1626-1689), van wie hij evenals van paus Innocentius X (1574-1655) een eremedaille
  ontving. Zijn werk verscheen postuum in Nederland.
