korte_typering: Brouwershaven, 10 november 1577 – Den Haag, 12 juni 1660. Reisde en studeerde
  in Frankrijk rond 1595 (ca. 18 jaar).
biografie: Zoon van Adriaen Cornelisz. Cats en Leenken Jacob Jan Breydersdr. Studeerde rechten
  in Leiden en Orléans, verbleef enige tijd in Parijs en vestigde zich als advocaat in Den
  Haag. Werd pensionaris van Middelburg en Dordrecht en reisde als diplomaat meermaals naar
  het Engelse hof. Maakte in 1651 en 1652 een diplomatieke reis met Gerard Schaap (1599-1655)
  en Paulus van der Perre (ca. 1598-1653). Lodewijk Huygens (1631-99), Adriaen Schagen (1633-99)
  en George de Mey (1628-1712) hielden verslagen bij. Publiceerde verschillende gedichten
  en emblematabundels, waaronder Sinne- en minnebeelden (1618) en de Trou-ringh (1637). Ook
  schreef hij gedichten over het reizen.
reizen_vermeld:
- Ca. 1595, Frankrijk; maart 1627-augustus 1627/december 1651-juli 1652, Engeland.
verslagen_vermeld:
- Schagen 1651-1652; Huygens 1651-1652; De Mey 1840, 204-214; Huygens 1982.
addenda:
- Verbalen van de gezantschappen, hierboven beschreven (SG 8354; 8460-8462).
poezie:
