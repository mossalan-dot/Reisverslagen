id: aerssen-van-sommelsdijk-francois-van
naam: Aerssen van Sommelsdijk, François van
korte_typering: Heer van Sommelsdijk, heer van de Plaat en Den Bommel, ambachtsheer van Sint
  Adolfsland. Brussel (ZN), 1572 – Den Haag, 27 december 1641. Reisde en studeerde in Frankrijk
  in 1594 (22 jaar).
biografie: Zoon van Cornelis Aerssens (1543-1627) en Emmerentiana de Regniers (1549-1627).
  Diplomaat en raadpensionaris van de Republiek. Studeerde in Leuven, Leiden en Parijs en
  maakte een Italiëreis in 1596 en 1597. Begon zijn carrière aan het Franse hof en werd onder
  het koningschap van Hendrik IV (1553-1610) aangesteld als diplomatiek vertegenwoordiger
  van de Staten-Generaal, waar hij onder meer onderhandelde over het Twaalfjarig Bestand.
  Begeleidde in 1608 en 1609 de broers Reinier (1588-1623) en Willem van Oldenbarnevelt (1590-1634)
  door Parijs. Werd door Lodewijk XIII (1601-43) in 1612 geridderd in de orde van St.-Michiel.
  Ondernam in 1620 een diplomatieke missie naar Venetië, die door hem en door gentilhomme
  Constantijn Huygens sr. (1596-1687) werd vastgelegd.
reizen_vermeld:
- 1594, Frankrijk; 1596-1597, Italië; 1598/1608-09 Frankrijk; april-augustus 1620, Venetië;
  december 1621-februari 1623/februari-juli 1624/juni-oktober 1624, Engeland; oktober 1625-mei
  1626, Frankrijk; december 1627-maart 1629, Frankrijk en Engeland; november 1639-maart 1640/januari-juni
  1641, Engeland.
verslagen_vermeld:
- Van Aerssen van Sommelsdijk 1853, 45-137; Huygens 2003.
addenda:
- Zie appendix B voor de reis in 1620. Rapporten, verbalen en concept-verbalen van zijn diplomatieke
  missies, hierboven beschreven (SG 8343-8344; 8346; 8350-8352; 8359-8360; 8386; 8391-8392;
  LO 56-57), instructies van de Staten-Generaal voor het gezantschap in 1621 en 1639-40 (SG
  12589.36; 12576.45).
correspondentie:
- Vijf Nederlandse brieven van Johan van Oldenbarnevelt (1547-1619) tijdens de reis van zijn
  zoon Willem (1590-1634) (Veenendaal 1962), 1) Den Haag, 25 mei 1608; 2) 27 juli; 3) Antwerpen,
  3 april 1609; 4) Antwerpen, 9 april; 5) Den Haag, 22 september.
literatuur:
