naam: Perre, Paulus van de(r)
geboren:
  jaar: 1598
overleden:
  jaar: 1653
  datum: 14 december 1653
  plaats: Londen (EN)
korte_typering: Ca. 1598 – Londen (EN), 14 december 1653. Maakte in 1651-52 een diplomatieke
  reis naar Engeland (ca. 53 jaar).
biografie: Zoon van Adriaan van der Perre en Adriana Dircx Hayman. Was tussen 1636 en 1653
  schepen, raad, burgemeester, secretaris en pensionaris van Middelburg. Maakte in 1651 en
  1652 een diplomatieke missie naar Engeland in het gezelschap van Jacob Cats (1577-1660)
  en Gerard Schaap (1599-1655). De reis werd beschreven door Adriaen Schagen (1633-99), Lodewijk
  Huygens (1631-99) en George de Mey (1628-1712).
reizen_vermeld:
- December 1651-juli 1652/juni-december 1653, Engeland.
verslagen_vermeld:
- De Mey 1840, 204-214; Huygens 1651-1652; Schagen 1651-1652; Huygens 1982.
addenda:
