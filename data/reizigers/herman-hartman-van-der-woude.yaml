korte_typering: 'Reisde in 1676-1677 naar Frans-Guyana. Eerste reis: 01-08-1676 (55 jaar)'
biografie: Echtgenoot van Margarita Blaeuhulck (1621-1662), vader van Elizabeth (1657-1698),
  Johannes (º1658) en Margaretha (1661-1677). Was in 1646 hoofdofficier en dijkgraaf van de
  Nieuwdorper Koggen en werd in 1673 schout van Opmeer. Werd in 1676 aangesteld door de Staten
  van Holland als gouverneur van de Nederlandse kolonie aan de Oyapock in Frans-Guyana. Reisde
  in 1676 en 1677 samen met zijn kinderen naar Frans-Guyana, maar overleed onderweg op het Kaapverdische
  eiland Santiago. Werd vanwege zijn protestantisme heimelijk begraven.
