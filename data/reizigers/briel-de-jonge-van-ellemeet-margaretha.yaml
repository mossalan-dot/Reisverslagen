korte_typering: Brielle, 29 april 1617 – Brielle, 26 maart 1685. Maakte in 1669 een plezierreis
  naar de Zuidelijke Nederlanden (52 jaar).
biografie: Dochter van Cornelis Briel (1582-1625) en Cecilia van Beresteijn (1589-1661). Trouwde
  in 1643 met Jacob de Jonge van Ellemeet (1601-50). Maakte in 1669 een plezierreis naar Antwerpen
  en Brussel met haar kinderen Johanna (1643-93), Cornelis (1646-1721) en Cecilia (1648-86),
  Agatha de Jong en haar kinderen.
reizen_vermeld:
- Mei 1669, Zuidelijke Nederlanden.
