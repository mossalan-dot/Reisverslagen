biografie: Zoon van Joan Huydecoper (1559-1661) en Maria Coymans (1603-1647). Studeerde in Utrecht
  en promoveerde in Leiden in de rechten. Maakte tussen 1647 en 1649 een educatiereis naar Frankrijk,
  Zwitserland en Italië, maar bleef in Genève steken. Reisde in 1655 als gezant naar het hof
  van Brandenburg in 1655 in het gezelschap van zijn vader, Joan Corver (1628-1716) en Pieter
  de Graeff (1638-1707). Bekleedde verschillende posities in Amsterdam, waaronder die van schepen
  en raad. Was dertien keer burgemeester tussen 1672 en 1693.
