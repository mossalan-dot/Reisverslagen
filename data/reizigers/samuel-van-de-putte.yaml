korte_typering: 'Maakte in 1718 een reis naar Italië. Eerste reis: 01-01-1718 (28 jaar)'
biografie: Zoon van viceadmiraal Carel van de Putte (1634-1695) en Johanna Constantia Samuels
  Biscop. Studeerde in Leiden en werd in 1715 schepen van Vlissingen. Maakte in 1718 samen met
  Johannes Aegidius van Egmond van der Nijenburg (1693-1747) een educatiereis naar Italië, waar
  hij in Padua promoveerde in de geneeskunde. Reisde tussen 1719 en 1723 naar Constantinopel,
  India en Tibet. Het verslag van Van Egmond van der Nijenburg werd bewerkt door Johannes Heyman
  (1708-1788) en postuum uitgegeven als Reizen door een gedeelte van Europa, klein Asien (...).
  Verbleef lange tijd in Llhasa en vervolgde in 1731 zijn weg naar China en India. Vestigde
  zich in 1743 in Batavia (Jakarta) in Indonesië.
