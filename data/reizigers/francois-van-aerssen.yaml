biografie: Zoon van Cornelis Aerssens (1543-1627) en Emmerentiana de Regniers (1549-1627). Diplomaat
  en raadspensionaris van de Republiek. Studeerde in Leuven, Leiden en Parijs en maakte een
  Italiëreis in 1596 en 1597. Begon zijn carrière aan het Franse hof en werd onder het koningschap
  van Hendrik IV (1553-1610) aangesteld als diplomatiek vertegenwoordiger van de Staten-Generaal,
  waar hij onder meer onderhandelde over het Twaalfjarig Bestand. Begeleidde in Parijs de broers
  Reinier (1588-1623) en Willem van Oldenbarnevelt (1590-1634). Werd door Lodewijk XIII (1601-1643)
  in 1612 geridderd in de orde van St. Michiel. Ondernam in 1620 een diplomatieke missie naar
  Venetië, die door hem en door Constantijn Huygens sr. (1596-1687) werd vastgelegd.
