korte_typering: Antwerpen, 1621 – Antwerpen, 1694. Katholiek. Begeleidde in 1664-65 een educatiereis
  naar Italië (43 jaar).
biografie: Zoon van Cornelis Hillewerve en Mechteld Tholinx, schoonbroer van Balthasar II
  Moretus (1615-74). Werd in 1660 tot het priesterschap gewijd en werd priester in de Sint-Jacobuskerk
  in Antwerpen. In 1664 en 1665 vergezelde hij als tutor de educatiereis van zijn neven Balthasar
  III Moretus (1646-96) en Pieter Goos (1645-1708), Jan Tholinx jr. (1631-1705) en Theodoor
  Andries van Kessel. Werd in 1675 tot de adelstand verheven en beëdigd tot apostolisch protonotaris.
  Was eigenaar van het tegenwoordige Rubenshuis en kasteel Ravenhof.
reizen_vermeld:
