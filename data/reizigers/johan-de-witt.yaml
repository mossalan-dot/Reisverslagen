biografie: Zoon van Jacob de Witt (1589-1674) en Anna van den Corput (1599-1645), broer van
  Cornelis (1623-1672). Studeerde rechten in Leiden. Maakte tussen 1645 en 1647 een educatiereis
  naar Frankrijk, Zwitserland en Engeland met zijn broer Cornelis en promoveerde in Angers in
  de rechten. Werd in 1650 pensionaris van Dordrecht en in 1653 raadpensionaris van Holland,
  een positie die hij tot zijn dood bekleedde. Werd samen met zijn broer vermoord tijdens het
  Rampjaar.
