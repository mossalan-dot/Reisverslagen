korte_typering: Deventer, 1598 – Amsterdam, 1657. Maakte in 1619-29 een kunstenaarsreis naar
  Italië (21 jaar).
biografie: Werkte als schilder en maakte een kunstenaarsreis naar Rome tussen 1619 en 1629.
  Was een van de eerste Bentvueghels. Had de bijnaam ‘Het Fret’.
