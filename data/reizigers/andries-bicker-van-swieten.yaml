  Eerste reis: 3-11-1693 (23 jaar)'
biografie: Zoon van Gerardus Bicker van Swieten (†1718), hoogheemraad van Rijnland. De reiziger
  wordt door Hoogewerff geïdentificeerd. Maakte tussen 1693 en 1695 een educatiereis naar Duitsland,
  Oostenrijk, Italië en Tsjechië onder supervisie van tutor Laurens Gronovius (1648-1724). Hij
  werd vergezeld door baron Jacob Emmery van Wassenaar van Obdam (1672-1724) en Jan Pieter Alderwerelt
  (1648-1724) en Keyser uit Lüneburg. Promoveerde in de rechten in Padua in 1694. Scheidde op
  de terugweg van zijn tutor en keerde terug naar Italië. Overleed tijdens het Venetiaanse carnaval.
