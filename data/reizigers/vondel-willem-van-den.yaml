id: vondel-willem-van-den
naam: Vondel, Willem van den
naamsvarianten:
- Guilam
- Guilhelmus
korte_typering: Amsterdam, 1603 – Amsterdam, januari 1628. Mogelijk katholiek. Reisde in 1624-25
  naar Frankrijk en Italië (21 jaar).
biografie: Zoon van Joost van den Vondel en Sara Cranen, broer van de beroemde Joost van den
  Vondel (1587-1679). Studeerde rechten in Leiden. Tussen 1624 en 1626 maakte hij een educatiereis
  naar Frankrijk en Italië in het gezelschap van Jacob Baeck, Jacob van Erp (1603-43), Herman
  Swol, Gerard van den Bergh en A. Moorman. Promoveerde in de rechten in Orléans. Bezocht
  Rome tijdens het Heilige Jaar 1625. Was assessor van de Natio Germanica. Zijn reisverslag,
  getiteld Voyagie door Vranckrijk en Italien... gedaan in ‘t jaar 1624, is volgens biograaf
  Prinsen na een boekverkoping verdwenen. Vestigde zich in 1626 als advocaat in Amsterdam.
  Overleed aan een ziekte in 1628, hoewel biografen speculeren over een vergiftiging in Italië.
reizen_vermeld:
- 1624-26, Frankrijk en Italië.
correspondentie:
- Drie brieven (Vondel 1936, 26-32). Twee brieven aan zijn moeder, 1) Rome, 1 maart 1625;
  2) 15 maart. Een Latijnse brief aan zijn broer Joost, 1) Rome, maart 1625; Nederlandse vertaling.
poezie:
- Schreef een gedicht tijdens zijn educatiereis, 1) ‘Afscheit op de Alpes zingende genomen
  van Italie’ (Vondel 1929, 828). Een tweede gedicht, een ‘klepperdicht te Siëna op ‘‘t paardeloopen’,
  is verloren gegaan (Vondel 1929, 179). Een Latijns derde gedicht op het Heilige Jaar en
  paus Urbanus VIII (1568-1644) is verloren gegaan, maar werd door zijn broer vertaald als
  ‘Op Vrbaen den Achtsten’ (Vondel 1929, 495).
literatuur:
- BWN, XIX, 343; NNBW, IX, 1228-1230; Van der Valk 1913, 47-50; Sterck 1913, 178-183; Frank-van
  Westrienen 1983, 7; 332; Sterck 1986, 76-77; Porteman 1997, 123-134.
bronnen:
- gemaakt-op-reis
