biografie: Dochter van Johan Timmers (1684-1738) en Suzanne Libertine van Schinne (1684-1732),
  zus van Ignatia Geertruida (1714-1733). Trouwde in 1732 met Jacob van Zuijlen van Nijevelt
  (1699-1753). Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden met haar ouders,
  zus, de heren Van Bentinck en Van Schoonheeten, de heer Sloterdijck en zoon en de heer Van
  Baerle en dochter.
