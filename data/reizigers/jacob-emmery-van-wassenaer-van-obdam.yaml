biografie: Zoon van Jacob van Wassenaer (1646-1707) en barones Jacoba van Liere. Was magistraat
  van Leiden. Was hoofdman van de schutterij en tussen 1701 en 1724 schepen, veertigraad en
  burgemeester. Maakte tussen 1693 en 1695 een educatiereis naar Italië met tutor Laurens Gronovius
  (1648-1724), Andries Bicker van Swieten (1670-1696), Jan Pieter Alderwerelt en Keyser uit
  Lüneburg.
