id: dussen-pieter-van-der
naam: Dussen, Pieter van der
geboren:
  jaar: 1673
  datum: 9 april 1673
  plaats: Dordrecht
overleden:
  jaar: 1726
  datum: 17 juni 1726
korte_typering: Dordrecht, 9 april 1673 – 17 juni 1726. Maakte in 1699-1700 een educatiereis
  (26 jaar).
biografie: Zoon van Nicolaas Ewoutsz. van der Dussen (1636-1719) en Lydia van Beveren (º1647),
  broer van Jacob (1671-1728) en Cornelis (1684-1754). Maakte met Jacob een educatiereis naar
  Duitsland, Italië en Zwitserland in 1699 en 1700. Werd schepen van Dordrecht in 1717 en
  burgemeester en raad van Leiden in 1720.
reizen_vermeld:
- Augustus 1699-juli 1700, Duitsland, Oostenrijk, Italië, Zwitserland.
verslagen_vermeld:
- Van der Dussen 1699-1700.
literatuur:
- Ferwerda 1763; Nagtegaal 2005, 301-338; Van de Pol 2011, 79-81.
bronnen:
