biografie: Zoon van Andreas de Baccher (1546-1616) en Cateleyne de Boyne (1555-1590). Studeerde
  in Halberstadt, Stade, Bremen en Leiden. Maakte tussen 1608 en 1611 een educatiereis naar
  Frankrijk en Italië, waarover hij brieven en een album amicorum naliet. Promoveerde in de
  rechten en werkte als advocaat aan het Hof van Holland in Den Haag.
