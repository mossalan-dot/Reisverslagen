korte_typering: 'Maakte in 1672-1673 een reis naar Hamburg. Eerste reis: 20-06-1672 (29 jaar)'
biografie: Dochter van Guilliam Bouttens en Cathalina Daniels. Trouwde in 1666 met Abraham van
  der Meersch (1643-1728). Tijdens het Rampjaar vluchtte ze met haar echtgenoot, haar twee dochters
  Anna (1669-1724) en Sara (†1674) en een groot gedeelte van de doopsgezinde Amsterdamse gemeenschap
  naar Hamburg. In 1687 ondernam ze met haar echtgenoot en zonen Arent (1683-1768) en Pieter
  (º1677) nog een tweede reis naar Lille.
