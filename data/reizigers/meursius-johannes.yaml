korte_typering: Loosduinen, 1579 – Sora (DE), 20 september 1639. Maakte in 1606-08 een educatiereis
  naar Frankrijk (27 jaar).
biografie: Zoon van predikant Jacob Cornelisz. van Meurs. Studeerde op jonge leeftijd Grieks
  en geschiedenis in Leiden en Den Haag en publiceerde uitgebreid over beide onderwerpen.
  Begeleidde tussen 1606 en 1608 de broers Reinier (1588-1623) en Willem van Oldenbarnevelt
  (1590-1634) tijdens hun educatiereis naar Praag, Duitsland, Genève en Frankrijk. Promoveerde
  in 1608 in Orléans in de rechten. Werd in 1610 hoogleraar in de geschiedenis en de Griekse
  taal in Leiden en geschiedschrijver van de Staten van Holland. Na de berechting van Johan
  van Oldenbarnevelt (1547-1619) reisde hij in 1625 naar Denemarken, waar hij in Sora werd
  benoemd tot hoogleraar.
reizen_vermeld:
- 1606-07, Duitsland, Tsjechië, Zwitserland en Frankrijk; 1625, Denemarken.
correspondentie:
