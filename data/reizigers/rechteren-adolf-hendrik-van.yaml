id: rechteren-adolf-hendrik-van
naam: Rechteren, Adolf Hendrik van
geboren:
  jaar: 1656
  datum: 10 maart 1656
  plaats: Zwolle
overleden:
  jaar: 1741
  datum: 15 maart 1741
  plaats: Almelo
korte_typering: Graaf van het Heilige Roomse Rijk, heer van Almelo, Vriezenveen en de Vellner.
  Zwolle, 10 maart 1656 – Almelo, 15 maart 1741. Maakte in 1679 een educatiereis naar Frankrijk
  (23 jaar).
biografie: Zoon van Joachim Adolf van Rechteren (1627-86) en Margaretha van Haersolte (1628-82),
  broer van Johan Willem (1658-1718) en Reinhard (1659-1732). Studeerde in Leiden in 1673.
  Maakte in 1679 een educatiereis naar Frankrijk. Was drost van Vollenhove, Twente en Salland
  en afgevaardigde van de Staten-Generaal. Maakte verschillende diplomatieke reizen naar Duitsland
  en Oostenrijk.
reizen_vermeld:
- Maart-najaar 1679, Zuidelijke Nederlanden en Frankrijk; november-december 1702, Luik; juli-november
  1703, Zuidelijke Nederlanden; 1705, Wenen; mei 1708-april 1709, Zuidelijke Nederlanden;
  1710, Frankrijk; september 1714-april 1716, Antwerpen.
verslagen_vermeld:
- Van Rechteren 1679.
addenda:
- Zie appendix B voor zijn educatiereis. Verbalen van de gezantschappen, hierboven genoemd
  (SG 8668-8669; 8675; 8929; 9185); paspoort uit 1710, afgegeven door de Franse autoriteiten
  om te mogen reizen ten noorden van de rivieren Somme en Oise (Paspoort 1710).
literatuur:
- BWN, XVI, 124-125; NNBW, II, 1174-1175; RAA.
bronnen:
