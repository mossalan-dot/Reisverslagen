korte_typering: 'Reisde in 1610 naar Engeland. Eerste reis: 16-04-1610 (50 jaar)'
biografie: Was pensionaris van Goes en vanaf 1600 lid van de Zeeuwse delegatie in de Staten-Generaal.
  Was in 1610 gezant in Engeland en werd door Jacobus I (1566-1625) geridderd. Maakte deel uit
  van verschillende gezantschappen, onder andere naar Zweden en Rusland in 1615 en 1616, Duitsland
  in 1621 en Engeland in 1624 en 1625. Was vanaf 1625 ambassadeur in Londen. Maakte een diplomatieke
  reis naar Polen en Zweden in het gezantschap van Rochus van den Honert (1572-1638) en Joan
  Huydecoper sr. (1599-1661) in 1635, waar hij onderhandelde over de vrede.
