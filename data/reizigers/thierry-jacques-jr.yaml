korte_typering: Amsterdam, 1648 – Amsterdam, 1709. Maakte in 1661-65 een educatiereis naar
  Engeland, Frankrijk, Italië en Malta (13 jaar).
biografie: Zoon van Jacques Thierry sr. (1604-77) en Maria van Rijn (º1609). Maakte tussen
  1661 en 1665 een educatiereis naar Engeland, Frankrijk, Duitsland, Zwitserland, Italië en
  Malta met zijn tutor Willem Schellinks (1623-78). Bestuurder van het Oude Mannenhuis en
  Oude Vrouwenhuis in Amsterdam tussen 1682 en 1690.
reizen_vermeld:
- 1661-65, Engeland, Frankrijk, Italië, Malta, Duitsland en Zwitserland.
verslagen_vermeld:
- Schellinks 1661-1663; Schellinks 1663-1664; Schellinks 1663-1665; Schellinks 1993; Schellinks
  2008, 346-437.
literatuur:
- Aikema 1983, 1-20; Schellinks 1993, 9-16.
bronnen:
