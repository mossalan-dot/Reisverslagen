id: woude-johannes-van-der
naam: Woude, Johannes van der
korte_typering: ºNieuwe Niedorp, 1658. Reisde in 1676-77 naar Frans-Guyana (18 jaar).
biografie: Zoon van Herman Hartman van der Woude (1621-77) en Margarita Blaeuhulck (1621-62).
  Reisde in 1676 en 1677 samen met zijn vader en zussen Elisabeth (1657-98) en Margaretha
  (1661-77) naar Frans-Guyana, waar zijn vader gouverneur zou worden. Bleef na het overlijden
  van zijn vader en jongste zus in Frans-Guyana.
reizen_vermeld:
- December 1676-februari 1677, Frans-Guyana.
verslagen_vermeld:
- Van der Woude 1676-1677; Van der Woude 1928, 214-236; Van der Woude 2001.
literatuur:
- DVL; LSD; Van der Woude 2001; Barend-van Haeften 2005, 91-98.
bronnen:
- gemaakt-op-reis
