korte_typering: Durlach (D), ca. 1582 – Harderwijk, 4 december 1649. Maakte in 1602-07 een
  educatiereis (ca. 20 jaar).
biografie: Zoon van de Harderwijkse burgemeester Alphert Brinck en Christina Böss. Studeerde
  in Leiden en maakte tussen 1602 en 1607 een educatiereis naar Duitsland, Frankrijk en Zwitserland.
  Studeerde in Parijs bij Isaac Casaubon (1559-1614) en diende in de koninklijke garde van
  Hendrik IV (1554-1610). Werkte tussen 1612 en 1615 als persoonlijk secretaris van Cornelis
  Haga (1578-1654), de Nederlandse ambassadeur te Constantinopel en verkende Turkije, Italië
  en Oostenrijk. Bekleedde vanaf 1618 functies als rentmeester, schepen en burgemeester in
  Harderwijk. Had contact met tal van binnen- en buitenlandse geleerden, legde een uitgebreid
  rariteitenkabinet aan en werkt mee aan verschillende boeken. Zijn contacten zijn geboekstaafd
  in zijn drie alba amicorum.
reizen_vermeld:
