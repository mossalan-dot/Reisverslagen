id: horenken-gerard
naam: Horenken, Gerard
korte_typering: Heer van Dijksterhuis. Groningen, februari 1663 – Groningen, 6 september 1712.
  Maakte in 1680-83 een educatiereis naar Frankrijk, Zwitserland en Italië (17 jaar).
biografie: Zoon van Egbert Horenken (1632-79) en Sibilla Horenken tot Dijksterhuis (1641-79).
  Studeerde in Groningen, Leiden en Utrecht. Maakte tussen 1680 en 1683 een educatiereis naar
  Frankrijk, Zwitserland, Italië, Duitsland en Engeland in het gezelschap van zijn tutor Carolus
  Casparus Neander (ºca. 1655). Was lid van de Hoge Justitiekamer in Groningen en curator
  van de hogeschool aldaar, evenals bewindhebber van de WIC.
reizen_vermeld:
- April 1680-september 1682, Zuidelijke Nederlanden, Frankrijk, Zwitserland, Italië en Engeland.
verslagen_vermeld:
- Neander 1680-1683.
literatuur:
