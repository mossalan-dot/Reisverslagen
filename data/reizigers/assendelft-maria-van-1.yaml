id: assendelft-maria-van-1
naam: Assendelft, Maria van (1)
religie: Protestants
korte_typering: Amsterdam, †23 januari 1744. Protestants. Maakte in 1696 een korte plezierreis
  (50 jaar).
biografie: Dochter van Gerard van Assendelft en Agneta Hoppesteyn van Leeuwen. Ging in 1692
  in ondertrouw met Willem van Assendelft (†1744). In 1696 maakte zij samen met haar echtgenoot,
  haar broer Adriaan (1664-1742), diens echtgenote Maria Magdalena van Beresteijn (1667-1715)
  en kinderen een plezierreis naar Nijmegen, Kleef en paleis Het Loo.
reizen_vermeld:
- Juli 1696, Nijmegen, Kleef en Het Loo.
verslagen_vermeld:
- Assendelft 1696.
literatuur:
- NNBW, VII, 43.
bronnen:
- gemaakt-op-reis
