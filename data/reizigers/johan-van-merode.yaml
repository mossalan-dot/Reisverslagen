biografie: Zoon van Floris van Merode en Margaretha van Gent. Was kolonel van een regiment Groningers
  in 1647 en gouverneur van Ravesteyn in 1650. Maakte in 1660 en 1661 als gezant een diplomatieke
  reis naar het hof in Madrid samen met Philips Aebinga van Humalda (ca. 1616-1672) en Godard
  Adriaan van Reede van Amerongen (1621-1691). De reis werd beschreven door Lodewijk Huygens
  (1631-1699).
