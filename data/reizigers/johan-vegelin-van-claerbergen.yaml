biografie: Zoon van Hessel Vegelin van Claerbergen (1655-1715) en Anna Maria van Vierssen (1653-1696),
  broer van Philip Frederik (1685-1738), Assuerus (1687-1771) en Nehemia (1691-1739). Werd in
  1708 rentmeester van de geestelijke goederen in Kempenland in de meijerij van Den Bosch en
  in 1720 raad in het Hof van Friesland. Maakte in 1707 een plezierreis per schip naar Amsterdam
  met zijn broer Assuerus, Wijnout Leffring en diens vrouw, Anne Bijters en zijn gezien en Geringa
  en zijn vrouw. Maakte tussen 1708 en 1716 verschillende dienstreizen en militaire reizen,
  die deels in geheimschrift zijn overgeleverd. Werd in 1722 grietman van Doniawarstal en in
  1732 gedeputeerde van de Staten van Friesland. Was cartograaf en schreef over de veengraverijen
  van Friesland.
