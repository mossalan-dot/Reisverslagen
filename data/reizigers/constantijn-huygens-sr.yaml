korte_typering: 'Maakte in 1618 een diplomatieke reis naar Engeland. Eerste reis: 01-01-1618
  (22 jaar)'
biografie: Zoon van Christiaan Huygens (1551-1624) en Susanna Hoefnagel (1561-1633), vader van
  Constantijn (1628-1697), Christiaan (1629-1695), Lodewijk (1631-1699), Philips (1633-1657)
  en Susanna (1637-1725). Studeerde rechten in Leiden en werkte als advocaat. Maakte in 1618
  een reis naar het Engelse hof, waar hij de vorst Jacobus I (1566-1625) ontmoette, die hem
  enkele jaren tot ridder sloeg. In 1620 reisde hij naar Venetië in het gezantschap van François
  van Aerssen (1572-1641). Tussen 1621 en 1624 reisde hij als diplomaat naar Engeland in het
  gezantschap van François van Aerssen, Diederick Bas (1569-1637) en Hendrik van Tuyll van Serooskerken
  (1574-1627). In 1625 werd hij secretaris van Frederik Hendrik (1584-1647), een post die hij
  tot diens dood vervulde. In 1654 inspecteerde hij de landerijen van de Oranjes in Luxemburg,
  in 1656 en 1657 werd hij als gezant naar Brussel gezonden en 1661 naar Parijs samen met zijn
  zoon Lodewijk. Was eerste raad en rekenmeester van Willem III (1650-1702). Had grote belangstelling
  voor poëzie, muziek en de beeldende kunsten en publiceerde verschillende toneelstukken en
  gedichten.
