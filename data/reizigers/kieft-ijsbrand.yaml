id: kieft-ijsbrand
naam: Kieft, IJsbrand
korte_typering: Maakte in 1649-51 een educatiereis naar Italië in het gezelschap van Arnout
  Hellemans Hooft (1629-80), Reyer Anslo (1626-69), Rombout (1620-79) en Joannes Hudde (1628-1704),
  Blom, Ooms en zijn neef Andries Kieft.
reizen_vermeld:
- 1649-51, Italië.
verslagen_vermeld:
- Hellemans Hooft 1649-1651; Hellemans Hooft 2001.
bronnen:
- gemaakt-op-reis
