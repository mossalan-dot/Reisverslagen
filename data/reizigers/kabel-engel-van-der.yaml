id: kabel-engel-van-der
naam: Kabel, Engel van der
naamsvarianten:
- Corydon
religie: Protestants
korte_typering: Rijswijk, ca. 1641. Protestants, daarna katholiek. Maakte in 1660-68 een kunstenaarsreis
  naar Italië (ca. 19 jaar).
biografie: Zoon van Cornelis Jansz. van der Kabel en Maertje Philipsdr. Maakte tussen 1660
  en 1668 een kunstenaarsreis naar Rome samen met zijn broer Adriaan (ca. 1630-1705). Kreeg
  de bentnaam ‘Corydon’. Vestigde zich samen met zijn broer in Lyon, waar hij meermaals bestuurslid
  van het kunstenaarsgilde werd.
reizen_vermeld:
- 1660-68, Italië.
literatuur:
- RKD; Salverda 2009.
bronnen:
- gemaakt-op-reis
