naam: Groot, Rutger
korte_typering: Maakte in 1683 een plezierreis naar de Zuidelijke Nederlanden met zijn gezin,
  Gerard Hinlopen (1644-91), Margaretha Hooghtwoudt (ca. 1648-84) en het gezin van Gerard
  van Tongen.
