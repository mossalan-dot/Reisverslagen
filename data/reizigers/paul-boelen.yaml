biografie: Zoon van Johan Boelen en Catharina Jansdr Halling. Studeerde rechten in Leiden in
  1621. Reisde tussen 1621 en 1624 mee met het diplomatieke gezantschap van François van Aerssen
  (1572-1641), Diederick Bas (1569-1637) en Hendrik van Tuyll van Serooskerken (1574-1627) naar
  Engeland en Frankrijk. Studeerde rechten in Orléans en bezocht de paardrijschool in Angers.
