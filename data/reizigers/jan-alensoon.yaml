biografie: Zoon van koopman Caspar Alensoon (1657-1714) en Johanna du Pré. Studeerde in Leiden
  en werkte als advocaat. Maakte in 1723 en 1724 een reis naar Frankrijk, Zwitserland, Italië
  en Duitsland in het gezelschap van Marcus Drabbe. Als muziekkenner en zanger had hij met name
  interesse in concerten en buitenlandse componisten. Werd in 1729 in Leiden aangesteld als
  ontvanger extraordinaris verponding en als weeshuisregent.
