korte_typering: Oostzaan, 1677 – Amsterdam, 15 mei 1739. Maakte in 1702 een militaire reis
  naar Spanje (25 jaar).
biografie: 'Zoon van predikant Johannes Albertusz. Zaunslifer. Studeerde in Leiden. Diende
  in 1702 als predikant op het schip van viceadmiraal Philips van der Goes (1651-1707) en
  reisde naar Spanje. Werd in 1707 predikant van Zoelen en in 1717 van Vianen.


  Zoete van Laecke, François de [ook: De Soete de Laeke]. Heer van Villers en Potsbroek. 24
  april 1637 – Den Haag, 14 oktober 1720. Maakte in 1656-58 een educatiereis naar Frankrijk
  (19 jaar).


  Zoon van Alexander de Zoete van Laecke (1595-1678) en Adriana van Aerssen (º1595), broer
  van Philips (1636-89). Studeerde in Leiden. Maakte tussen 1656 en 1658 een educatiereis
  naar Frankrijk onder leiding van gouverneur Antoine de Brunel (1622-96), samen met zijn
  broer en neef Cornelis van Aerssen van Sommelsdijk (1637-88).


  Zoete van Laecke, Philips de [ook: De Soete de Laeke, Philippe]. Heer van Villers en Zevender.
  29 januari 1636 – ca. 21 maart 1689. Maakte in 1656-58 een educatiereis naar Frankrijk (20
  jaar).


  Zoon van Alexander de Zoete van Laecke (1595-1678) en Adriana van Aerssen (º1595), broer
  van François (1637-1720). Studeerde in Leiden. Maakte tussen 1656 en 1658 een educatiereis
  naar Frankrijk onder leiding van gouverneur Antoine de Brunel (1622-96), samen met zijn
  broer en neef Cornelis van Aerssen van Sommelsdijk (1637-88). Was gecommitteerde van de
  Raad van State tussen 1666 en 1675 en 1681 en 1689.'
