biografie: Zoon van Godard van Reede (1593-1641) en Geertruid van Nijenrode. Was heemraad van
  Lekdijk bovendams, afgevaardigde voor de Staten-Generaal en in 1689 lid van de Raad van State.
  Maakte verschillende diplomatieke missies, onder andere naar Denemarken, Zweden, Polen en
  Aken. Werd door koning Christiaan V (1646-1699) in de Deense adelstand verheven. Maakte in
  1660 en 1661 als gezant een diplomatieke reis naar het hof in Madrid samen met Philips Aebinga
  van Humalda (ca. 1616-1672) en Johan van Merode (ca. 1607-1666). De reis werd beschreven door
  Lodewijk Huygens (1631-1699). Zijn woonplaats, kasteel Amerongen, werd tijdens het Rampjaar
  door de Fransen vernietigd.
