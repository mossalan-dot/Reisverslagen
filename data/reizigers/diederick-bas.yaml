biografie: Zoon van Jacob Claesz. Bas. Studeerde in Leiden, Heidelberg, Padua, Siena en Bazel.
  Was schepen en meermaals burgemeester van Amsterdam tussen 1610 en 1637. Nam deel aan de oprichting
  van de VOC. Reisde tussen 1611 en 1615 als diplomatiek gezant naar Denemarken, Noorwegen,
  Zweden en Rusland. Werd in 1616 in de adelstand verheven door Gustaaf Adolf van Zweden (1594-1632).
  Reisde in 1621 en 1623 naar Engeland om te onderhandelen van de walvisvaart, de VOC en de
  WIC, de koning van Bohemen en een hernieuwde alliantie met Engeland. Paul Boelen reisde mee.
