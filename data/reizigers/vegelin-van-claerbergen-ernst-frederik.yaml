id: vegelin-van-claerbergen-ernst-frederik
naam: Vegelin van Claerbergen, Ernst Frederik
korte_typering: Geboren rond 1648. Zoon van Philip Ernst Vegelin van Claerbergen (1613-93)
  en Fokje van Sminia (1615-58), broer van Hessel (1655-1715). Studeerde in Franeker in 1666.
  Maakte tussen 1668 en 1670 een educatiereis naar Frankrijk.
reizen_vermeld:
- September 1668-70, Frankrijk.
