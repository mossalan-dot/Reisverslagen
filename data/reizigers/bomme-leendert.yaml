id: bomme-leendert
naam: Bomme, Leendert
korte_typering: Maakte in 1748 een plezierreis naar Bergen op Zoom met zijn twee zonen, het
  echtpaar Thibaut en hun dochters, Elias (1689-1752) en Catharina de Haze (1715-82) en Cornelia
  Carolina de Vassy. De Vassy schreef een reisverslag op rijm.
reizen_vermeld:
- Juni 1748, Bergen op Zoom.
verslagen_vermeld:
- De Vassy 1748; De Vassy 2017.
bronnen:
- gemaakt-op-reis
