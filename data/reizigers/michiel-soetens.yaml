korte_typering: 'Maakte in 1650-1657 een kunstenaarsreis naar Italië. Eerste reis: 01-01-1650
  (24 jaar)'
biografie: Was een leerling van Alexander le Petit (ca. 1612-ca. 1658) en was lid van het Haagse
  schildersgilde. Reisde tussen 1650 en 1657 door Italië, onder anderen met de dichter Joannes
  Six van Chandelier (1620-1695). Bezocht de Brennerpas, Bolzano, Venetië en Rome. Was mogelijk
  lid van de Bentvueghels met de bentnaam Spreeuwbek.
