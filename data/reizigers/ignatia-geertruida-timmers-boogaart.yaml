biografie: Dochter van Johan Timmers (1684-1738) en Suzanne Libertine van Schinne (1684-1732),
  zus van Aletta Johanna (1707-1775). Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden
  met haar ouders, zus, de heren Van Bentinck en Van Schoonheeten, de heer Sloterdijck en zoon
  en de heer Van Baerle en dochter. Trouwde in 1732 met Paulus Boogaart (1703-1789), heer van
  Alblasserdam
