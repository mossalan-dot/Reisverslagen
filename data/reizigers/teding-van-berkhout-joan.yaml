id: teding-van-berkhout-joan
naam: Teding van Berkhout, Joan
geboren:
  jaar: 1648
  datum: 14 januari 1648
  plaats: Den Haag
overleden:
  jaar: 1720
  datum: 28 maart 1720
  plaats: Den Haag
korte_typering: Ridder van het Heilige Roomse Rijk, heer van Sliedrecht. Den Haag, 14 januari
  1648 – Den Haag, 28 maart 1720. Maakte een diplomatieke reis naar Aken in 1668 (20 jaar).
biografie: Zoon van Paulus Teding van Berkhout (1608-72) en Jacomina van der Vorst (1611-65),
  broer van Pieter (1643-1713). Studeerde geschiedenis en letteren in Leiden. Reisde in 1668
  als edelman mee naar Aken in de ambassade van Hieronymus van Beverningh (1614-90). Maakte
  in 1672 een tweede reis naar Duitsland. Was achtereenvolgens pensionaris, raad, burgemeester
  en schout van Monnikendam, baljuw en dijkgraaf van Waterland, schout van Katwoude en gedeputeerde
  van de Staten van Holland.
reizen_vermeld:
- Maart-mei 1668, Aken; 1672, Duitsland.
addenda:
- Verbalen van het gezantschap, hierboven genoemd (SG 8536-8538), apodemische instructies
  van zijn vader, getiteld ‘Aenmaeninge ende Memorie’.
literatuur:
- NNBW, IV, 131-132; RAA.
bronnen:
- gemaakt-op-reis
