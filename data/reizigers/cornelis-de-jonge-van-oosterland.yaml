biografie: Zoon van Johan Bonifacius de Jonge (1614-1654) en Levina Stavenisse (1622-1656).
  Maakte in 1666 en 1667 een educatiereis naar Frankrijk en Engeland in het gezelschap van Pieter
  Pieterson, Justus van der Cijs en neef Cornelis de Jonge van Ellemeet (1646-1721). Was raad
  en schepen van Middelburg.
