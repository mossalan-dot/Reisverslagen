korte_typering: Alkmaar, 1633 – Alkmaar, 8 april 1699. Maakte een diplomatieke reis naar Engeland
  in 1651-52 (18 jaar).
biografie: Zoon van Cornelis Schagen en Lijfvijntge Adriaendr. du Gardijn. Studeerde rechten
  in Leiden. Maakte in 1651 en 1652 een diplomatieke reis naar Engeland in het gezantschap
  van Jacob Cats (1577-1660), Paulus van der perre (ca. 1598-1653) en Gerard Schaap (1599-1655).
  Een tweede diplomatieke reis, dit keer naar Polen en Denemarken, maakte hij in 1656, in
  het gezantschap van Frederik van Dorp (1612-79), Govert van Slingelandt (1623-90), Pieter
  de Huybert (1622-95) en Johan Isbrandtsz (1621-1702). Reisde naar Breda in 1660 en naar
  Spa in de zomers van 1661 en 1662. Tussen 1657 en 1672 was hij schepen en tussen 1674 en
  1682 pensionaris van Alkmaar. Was rentmeester van de grafelijkheden Vroon-en-Zijpelanden
  en der Egmonden en tussen 1684 en 1699 burgemeester van Alkmaar.
