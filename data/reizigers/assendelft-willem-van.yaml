id: assendelft-willem-van
naam: Assendelft, Willem van
korte_typering: Trouwde in 1692 met Maria van Assendelft (†1744) en nam haar achternaam aan.
  Werd aangesteld als thesaurier en rentmeester-generaal van stadhouder Willem III (1650-1702).
  Bekleedde in Den Haag onder andere het ambt van schepen, postmeester en burgemeester. In
  1696 maakte hij samen met zijn echtgenote en schoonfamilie een plezierreis naar Nijmegen,
  Kleef en paleis Het Loo. Overleed in 1744.
reizen_vermeld:
- Juli 1696, Nijmegen, Kleef en Het Loo.
verslagen_vermeld:
- Assendelft 1696.
literatuur:
- NNBW, VII, 43.
bronnen:
- gemaakt-op-reis
