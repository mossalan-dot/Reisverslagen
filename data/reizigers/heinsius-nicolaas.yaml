id: heinsius-nicolaas
naam: Heinsius, Nicolaas
naamsvarianten:
- Nicolaus
- Heins, Nicolaas
geboren:
  jaar: 1620
  datum: 20 juli 1620
  plaats: Leiden
overleden:
  jaar: 1681
  datum: 7 oktober 1681
  plaats: Den Haag
korte_typering: Leiden, 20 juli 1620 – Den Haag, 7 oktober 1681. Maakte in 1641 een reis naar
  Engeland (21 jaar).
biografie: Zoon van de geleerde Daniël Heinsius (1580-1655) en Ermgard Rutgers (†1633). Schreef
  en publiceerde al op jonge leeftijd Latijnse gedichten. Reisde in 1641 en 1642 naar Engeland
  en tussen 1644 en 1647 naar de Zuidelijke Nederlanden, Spa, Frankrijk en Italië, waar hij
  verschillende bibliotheken en geleerden bezocht. In Italië was hij in het gezelschap van
  Adriaen van Blijenburgh (1616-82) en Matthijs van der Merwede (ca. 1625-ca. 1677). Studeerde
  in Padua in 1647. In 1649 trok hij op verzoek van Christina van Zweden (1626-89) naar Stockholm,
  waar hij samen met Isaac Vossius (1618-89) de koninklijke bibliotheek reorganiseerde. Op
  haar verzoek maakten zij tussen 1651 en 1653 een reis naar Italië om handschriften op te
  sporen. Werd in 1654 benoemd tot resident in Stockholm en in 1656 tot stadshistoricus in
  Amsterdam. In 1660 werd hij voor een tweede maal resident in Stockholm. Reisde als diplomaat
  in 1669 en 1670 naar Moskou en in 1672 naar Oost-Friesland en Bremen. Publiceerde veelvuldig
  over de klassieke literatuur en bereidde uitgaves voor.
reizen_vermeld:
- 1641-42, Engeland; 1644-47, Zuidelijke Nederlanden, Spa, Frankrijk en Italië; 1649, Stockholm;
  1651-53, Italië; 1669-70, Rusland; 1672, Bremen.
addenda:
- Kort Latijns verslag omtrent het gezantschap naar Rusland in 1670 (SG 12569.185).
correspondentie:
- Groot aantal brieven doorgaans aan collega-geleerden (ePistolarium; EMLO). Twaalf brieven
  aan zijn vader tijdens zijn reis naar Engeland in 1641 (Boex en Bots 2004, 222-268).
poezie:
- 'Verschillende Latijnse gedichten over zijn reizen, waaronder vier delen Italica, gebundeld
  in de heruitgave van zijn Poemata uit 1666 (Heinsius 1666). Voorbeelden zijn: 1) ‘Elegia
  II: Ad Tiberim’, 2) ‘Elegia IV: Pausilipus. Ad Casparem Kinschotium’ (aan Caspar van Kinschot
  (1622-49), over Napels), 3) ‘Elegia VII: Cum Neapoli Libernum navigaret’, 4) Elegia X: Cum
  Venetias jam pervenisset’, 5) ‘Elegia XII: Italia & Musis valedicit’, 6) ‘Ode: De agro Neapolitano’,
  7) ‘Elegia VIII: Ad Fontes Spadanos’ (over de wateren van Spa), 8) ‘De arce Puteanea, ad
  peregrinos Lovanium visentes’, 9) ‘Votu ad fontes Spadanos’.'
literatuur:
- BWN, VIII, 457-461; NNBW, II, 557-560; Kugener 1928, 225-238; Blok 1949; Poelhekke en Hoogewerff
  1961, 331; Blok 1984; Boex en Bots 2004, 222-258.
bronnen:
- gemaakt-op-reis
