biografie: Zoon van kapitein Melchior van Beverningh en Sibilla Standert. Studeerde rechten
  in Leiden en maakte ergens tussen 1635 en 1645 een educatiereis naar Frankrijk. Schotel meldt
  dat hij ook naar Zwitserland en Italië trok en een verslag bijhield, getiteld Recueil de l’estat
  de France, où sont compris les noms des dignitez et familles principales. Werd in 1645 schepen
  van Gouda en gecommitteerde van de Staten van Holland en tussen 1657 en 1665 thesaurier-generaal
  van de Republiek. Als gezant reisde hij onder andere naar Londen, Kleef, Breda, Aken, Madrid,
  Keulen en Nijmegen. Hij was onder andere betrokken met de vredesverdragen van de Eerste en
  Tweede Engels-Nederlandse Oorlogen en de Hollandse Oorlog. In 1678 reisde hij naar Frankrijk
  samen met Jacob Hop (1654-1725).
