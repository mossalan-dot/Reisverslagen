  beschrijving: "olieverf op doek, h 156cm × b 121,5cm Meer \n\nDit lijkt een vorstelijk portret.\
    \ Toch had Hieronymus van Beverningk slechts de functie van ambassadeur van de Staten-Generaal\
    \ der Nederlanden. Met veel succes had hij deelgenomen aan vredesonderhandelingen, waar\
    \ de staatsdocumenten op tafel van getuigen. De prachtige lijst onderstreept de waardigheid\
    \ van de geportretteerde, wiens lijfspreuk onderaan te lezen valt: ‘Zoek jezelf niet buiten\
    \ jezelf.’"
