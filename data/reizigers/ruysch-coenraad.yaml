korte_typering: Dordrecht, 22 oktober 1650 – Leiden, 23 maart 1731. Maakte in 1674-77 een
  educatiereis naar Frankrijk, Zwitserland en Italië (23 jaar).
biografie: Zoon van Nicolaas Ruysch (1610-70) en Maria Paedts (1621-70). Studeerde in Leiden
  en promoveerde in Poitiers. Maakte tussen 1674 en 1677 een educatiereis naar Duitsland,
  Frankrijk, Zwitserland en Italië met zijn neef Dirck van Hoogeveen. Was kapitein van de
  schutterij en vroedschap in Leiden in 1679. Maakte een reis naar Engeland in 1679 en 1680
  met Diderik van Leijden van Leeuwen (1628-82). Werd tussen 1684 en 1730 meermaals beëdigd
  als burgemeester. Nam tussen 1687 en 1720 herhaaldelijk zitting in het college van de gecommitteerde
  Raden van Holland en West-Friesland. Was lid van de Staten-Generaal in 1696 en 1697.
