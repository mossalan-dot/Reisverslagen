korte_typering: Heer van Dubbeldam. Dordrecht, 12 januari 1623 – Den Haag, 3 juli 1690. Maakte
  een diplomatieke reis naar Zweden in 1656 (33 jaar).
biografie: Zoon van Barthoud van Slingelandt (1590-1638) en Geertruid van Beaumont (1592-1652).
  Steunde zijn achterneef Johan de Witt (1625-72). Studeerde en promoveerde in de rechten
  in Leiden. Maakte een diplomatieke reis naar Polen in 1656 met medegezanten Frederik van
  Dorp (1612-79), Pieter de Huybert (1622-95) en Johan Isbrandtsz (1621-1702). Reisde naar
  Zweden en Polen in 1659 en 1660. Was pensionaris van Dordrecht en vanaf 1664 secretaris
  van de Raad van State. Was kunstliefhebber en publiceerde gedichten.
