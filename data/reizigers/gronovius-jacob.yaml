addenda:
- Een alba amicorum met zevenentachtig inscripties tijdens zijn peregrinatio, onder andere
  uit Londen, Oxford, Parijs, Canterbury, Saumur, Parijs, Angers, Bordeaux, Toulouse, Béziers,
  Pisa, Florence, Siena, Rome, Bologna, Venetië, Wenen, Bazel, Genève, München, Augsburg,
  Grenoble, Orange, Avignon, Nîmes, Dijon, Rouen en Caen (Gronovius 1634-1646).
