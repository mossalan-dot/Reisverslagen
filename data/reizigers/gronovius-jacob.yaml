korte_typering: Deventer, 10 oktober 1645 – Leiden, 21 oktober 1716. Reisde in 1670 naar Engeland
  (25 jaar).
biografie: 'Zoon van Johannes Frederik Gronovius (1611-71) en Aleida ten Nuyl (1619-56), broer
  van Laurens (1648-1724). Studeerde rechten en klassieke talen in Deventer en Leiden. Zette
  in 1670 zijn studie voort in Oxford en Cambridge en reisde in 1671 naar Parijs. Maakte tussen
  1672 en 1674 een peregrinatio academica naar Spanje en Italië, aanvankelijk in het gevolg
  van de extraordinaris gezant Adriaen Paets (1631-86). Werd in 1674 op aanbeveling van de
  geleerde Antonio Magliabechi (1633-1714) benoemd tot hoogleraar in de rechtsgeleerdheid
  in Pisa, maar stapte na een geschil op. In 1679 werd hij hoogleraar in de geschiedenis en
  het Grieks in Leiden en in 1692 ontving hij daarnaast het domein van de welsprekendheid.
  Publiceerde verschillende filologische werken over de klassieke literatuur, waaronder het
  twaalfdelige Thesaurum Graecarum Antiquitatum (1697-1702).


  Gronovius, Johannes Frederik [ook: Gronow, Johann Friedrich, Joannes Fredericus]. Hamburg
  (D), 8 september 1611 – Leiden, 28 december 1671. Maakte in 1639-42 een peregrinatio academica
  (28 jaar).


  Zoon van David Gronow en Margaretha Langermann, vader van Jacob (1645-1716) en Laurens (1648-1724).
  Studeerde rechten aan de universiteit van Altdorf. Werkte als huisleraar in Amsterdam en
  Den Haag. Maakte tussen 1639 en 1642 een peregrinatio academica naar Engeland, Frankrijk
  en Italië. Hij promoveerde in de rechten aan de universiteit van Angers. Publiceerde verschillende
  filologische werken over de klassieke literatuur. Werd in 1642 benoemd tot hoogleraar welsprekendheid
  en geschiedenis aan het Athenaeum Illustre in Deventer en tot hoogleraar taal en geschiedenis
  in Leiden, als opvolger van Daniël Heinsius (1580-1655).


  Gronovius, Laurens [ook: Laurentius Theodorus; Gronow, Laurens]. Deventer, oktober 1648
  – Deventer, 20 januari 1724. Maakte een peregrinatio academica in 1679-82 (30 jaar).


  Zoon van Johannes Frederik Gronovius (1611-71) en Aleida ten Nuyl (1619-56), broer van Jacob
  (1645-1716). Studeerde geschiedenis en rechten in Leiden. Promoveerde in 1675 in Franeker
  en werkte als advocaat voor het Hof van Holland. Maakte tussen 1679 en 1682 een peregrinatio
  academica naar Frankrijk en Italië, waar hij in de bibliotheken werkte aan wetenschappelijke
  publicaties voor zijn broer en zichzelf. Reisde tussen 1693 en 1695 naar Italië als tutor
  van Andries Bicker van Swieten (1670-96), baron Jacob Emmery van Wassenaar van Obdam (1672-1724),
  Jan Pieter Alderwerelt (º1663) en Keyser uit Lüneburg. Publiceerde verschillende werken,
  maar wist geen universitaire positie te bemachtigen.'
