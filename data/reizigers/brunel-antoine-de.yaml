id: brunel-antoine-de
naam: Brunel, Antoine de
korte_typering: Heer van Saint-Maurice-en-Trièves. 1622-96. Maakte tussen 1651 en 1656 reizen
  naar Frankrijk, Italië en Spanje (29 jaar).
biografie: Verarmde hugenootse edelman. Werkte als tutor en begeleidde Cornelis (1638-88)
  en François van Aerssen van Sommelsdijk (1630-58), Justinus II van Nassau (1633-58) en Philips
  (1636-89) en François de Zoete van Laecke (1637-1720) tussen 1651 en 1658 op hun educatiereis
  naar Frankrijk, Italië en Spanje. In 1665 publiceerde hij zijn verslag van de reis naar
  Spanje, Voyage d’Espagne, curieus, historique et politique, mogelijk gebaseerd op het verslag
  van de vroeg gestorven François van Aerssen.
reizen_vermeld:
- 1651-58, Frankrijk, Italië en Spanje.
verslagen_vermeld:
- De Zoete van Laecke 1656-1658; De Brunel 1665; De Zoete van Laecke 1862; Van Aerssen van
  Sommelsdijk 1903, 173-256.
literatuur:
- Revillout 1880; Bijlsma 1933, 254-259; Hoogewerff 1944, 153-157.
bronnen:
- gemaakt-op-reis
