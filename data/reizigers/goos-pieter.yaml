korte_typering: Antwerpen, 7 januari 1645 – Antwerpen, 12 januari 1708. Katholiek. Maakte
  in 1664-65 een educatiereis naar Italië (19 jaar).
biografie: Zoon van Jacob Goos (1590-1666) en Susanna van der Goes, neef van Balthasar Moretus
  III (1646-96). Lid van de Antwerpse elite. Maakte in 1664 en 1665 een educatiereis naar
  Italië in het gezelschap van zijn oom Hendrik Hillewerve (1621-94), Jan Tholinx jr. (1631-1705),
  Theodoor Andries van Kessel en neef Balthasar.
reizen_vermeld:
- September 1664-65, Duitsland, Oostenrijk en Italië.
