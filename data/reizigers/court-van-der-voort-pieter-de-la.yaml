id: court-van-der-voort-pieter-de-la
naam: Court van der Voort, Pieter de la
geboren:
  jaar: 1664
  datum: 25 mei 1664
  plaats: Leiden
overleden:
  jaar: 1739
  datum: 12 september 1739
  plaats: Leiden
korte_typering: Leiden, 25 mei 1664 – Leiden, 12 september 1739. Maakte in 1700 een reis naar
  Frankrijk (36 jaar).
biografie: Zoon van Pieter de la Court (1618-85) en Catharina van der Voort (1622-74). Studeerde
  in Leiden en promoveerde in de rechten. Werkte als lakenfabrikant in Leiden en was een kunstverzamelaar.
  Publiceerde over tuinarchitectuur. Maakte in 1700 een handelsreis naar Parijs, waarover
  hij verschillende brieven schreef aan zijn echtgenote Sara Poelaert (1666-1740).
reizen_vermeld:
- Augustus-september 1700, Frankrijk.
correspondentie:
- Twaalf brieven aan zijn echtgenote Sara Poelaert, 1) nabij Antwerpen, 1 augustus 1700; 2)
  Gent, 3 augustus; 3) Lille, 6 augustus; 4) nabij Lille, 8 augustus; 5) Parijs, 15 augustus;
  6) 16 augustus; 7) 21 augustus; 8) 26 augustus; 9) 29 augustus; 10) 31 augustus; 11) Valenciennes,
  6 september; 12) Brussel, 8 september (De la Court van der Dussen 1928, 33-75).
literatuur:
- NNBW, VII, 337; Driessen 1945, 150-164; Fock 1983, 261-182.
bronnen:
- gemaakt-op-reis
