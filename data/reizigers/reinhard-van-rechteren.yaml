biografie: Zoon van Joachim Adolf (1627-1686), heer van Rechteren, en Margaretha van Haersolte
  (1628-1682), vrouwe van Westerveld, broer van Adolf Hendrik (1656-1741) en Johan Willem (1658-1718).
  Reisde rond 1685 naar Italië en trad in dienst bij het leger van de republiek Venetië. Bekleedde
  verschillende militaire functies in de Republiek tussen 1699 en 1727.
