korte_typering: Middelburg, 15 maart 1693 – Middelburg, 29 oktober 1761. Maakte een plezierreis
  naar Leiden in 1712 (19 jaar).
biografie: 'Zoon van Daniël Radermacher en Maria Beeckman. Was griffier en meermaals schepen,
  thesaurier en burgemeester van Middelburg tussen 1726 en 1759. Was vanaf 1730 bewindhebber
  van de VOC.


  Rataller Doublet, George [ook: Burmania, Simon van]. Den Haag, 1600 – Den Haag, 30 april
  1655. Maakte in 1621-25 een educatiereis naar Engeland, Frankrijk en Italië (21 jaar).


  Zoon van Philips Doublet (†1612) en Cornelia Rataller. Studeerde rechten en letteren in
  Leiden. Maakte tussen 1621 en 1625 een educatiereis naar Engeland, Frankrijk en Italië samen
  met Nicolaas Meerman en Dirk Graswinckel (1600-66). Was advocaat en rentmeester in Den Haag.
  Werd in 1653 van de Chambre-Mipartie in Mechelen.'
reizen_vermeld:
- April 1712, Leiden; mei 1712, Noord-Holland; mei 1712, Enkhuizen en Alkmaar; juni 1712,
  Amsterdam, Utrecht en Dordrecht; juni 1712, Den Haag en Delft; augustus 1712, Zeeland; oktober
  1717, Zuidelijke Nederlanden.
- 1621-25, Engeland, Frankrijk en Italië; december 1653-maart 1655, Zuidelijke Nederlanden.
