biografie: Zoon van de organist Cornelis Helmbreecker (1590-1654). Was een leerling van de kunstschilder
  Pieter de Grebber (ca. 1600-ca. 1652) en schreef zich in 1652 in in het Haarlemse kunstenaarsgilde.
  Maakte in 1652 een kunstenaarsreis naar Keulen in het gezelschap van de schilders Guillaume
  Dubois (1623-1661), Vincent Laurensz van der Vinne (1628-1702) en Cornelis Bega (1631-1664)
  en de schoenmakersgezel Joost Boelen. In 1654 reisde hij naar Venetië, waar hij werkte voor
  de literator Gian Francesco Loredano (1607-1661), en trok tussen 1654 en 1656 naar Rome, Lyon
  en Parijs. In 1659 vestigde hij zich in Rome, waar hij lid werd van de Bentvueghels. Schilderde
  onder andere in Rome, Napels, Turijn en Florence.
