biografie: Zoon van Lodewijk van Nassau-Beverweerd (1602-1665) en Isabella, rijksgravin van
  Horne (ca. 1608-1664). Studeerde in Parijs en nam dienst bij de cavalerie. Werd in 1668 benoemd
  als eerste edele van Zeeland. Nam deel aan verschillende diplomatieke gezantschappen, waaronder
  naar Keulen en Nijmegen. Maakte in 1674 een diplomatieke reis naar Londen met medegezanten
  Coenraad van Beuningen (ca. 1622-1693), Willem van Haren (1626-1708) en Frederik baron van
  Reede tot Renswoude (ca. 1630-1715). De reis wordt beschreven door Joannes Vollenhove (1631-1708)
