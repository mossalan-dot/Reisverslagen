id: backer-de-la-court-catharina
naam: Backer-(De la Court), Catharina
korte_typering: Amsterdam, 22 september 1689 – Leiden, februari 1766. Maakte rond 1740 een
  korte plezierreis (ca. 51 jaar).
biografie: Dochter van Willem Backer (1656-81) en Magdalena de la Court (1662-1731). Trouwde
  in 1711 met haar neef Allard de la Court (1688-1755). Was voor haar huwelijk een amateurschilder
  en tekenares. Rond 1740 maakte ze een plezierreis naar Antwerpen en Brussel met haar echtgenoot
  en schoonzussen Catharina (1691-1752) en Adriana de la Court (1696-1748).
reizen_vermeld:
- Ca. augustus-september 1740, Zuidelijke Nederlanden.
verslagen_vermeld:
- De la Court [1740].
literatuur:
