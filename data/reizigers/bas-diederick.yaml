id: bas-diederick
naam: Bas, Diederick
naamsvarianten:
- Dirck
korte_typering: Emden (D), 1569 – Amsterdam, 17 augustus 1637. Maakte in 1611-15 een diplomatieke
  reis naar Denemarken, Noorwegen, Zweden en Rusland (42 jaar).
biografie: 'Zoon van Jacob Claesz. Bas. Studeerde in Leiden, Heidelberg, Padua, Siena en Bazel.
  Was schepen en meermaals burgemeester van Amsterdam tussen 1610 en 1637. Nam deel aan de
  oprichting van de VOC. Reisde tussen 1611 en 1615 als diplomatiek gezant naar Denemarken,
  Noorwegen, Zweden en Rusland. Werd in 1616 in de adelstand verheven door Gustaaf Adolf van
  Zweden (1594-1632). Reisde in 1621 en 1623 naar Engeland om te onderhandelen over de walvisvaart,
  de VOC en de WIC, de koning van Bohemen en een hernieuwde alliantie met Engeland. Paul Boelen
  deed hiervan verslag.


  Beaumont, Simon van [ook: Bellimontius, Simon; Schoonenberg; Schoonbergius]. Dordrecht,
  1574 – Den Haag, 20 juni 1654. Reisde en studeerde rond 1595 in Frankrijk (ca. 21 jaar).


  Zoon van Herbert van Beaumont en Cornelia van Slingelandt. Studeerde rechten in Leiden en
  Orléans. Werkte vanaf 1601 als advocaat in Middelburg. Was pensionaris van Middelburg tussen
  1606 en 1634 en van Rotterdam tussen 1634 en 1649. Maakte in 1627 een diplomatieke reis
  naar Polen en Zweden met medegezanten Andries Bicker (1586-1652) en Rochus van den Honert
  (1572-1638). De reis werd vastgelegd door Abraham Booth (1606-36). Schreef petrarkistisch-erotische
  sonnetten.'
