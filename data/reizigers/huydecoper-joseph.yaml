korte_typering: Heer van Maarsseveen en Neerdijk. Amsterdam, 17 maart 1667 – Amsterdam, 11
  januari 1709. Maakte rond 1688 een educatiereis naar Frankrijk (21 jaar).
biografie: Zoon van Joan Huydecoper (1625-1704) en Sophia Coymans (1636-1714). Maakte rond
  1688 een educatiereis naar Frankrijk. Was secretaris en schepen van Amsterdam en werd in
  1705 bewindhebber van de Oost-Indische Compagnie.
reizen_vermeld:
- 1688, Frankrijk.
addenda:
- Paspoort voor de terugreis naar de Republiek, 1688 (Paspoort van de koning 1688)
