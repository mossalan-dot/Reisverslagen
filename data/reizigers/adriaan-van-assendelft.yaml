biografie: Zoon van Gerard van Assendelft en Agneta Hoppesteyn van Leeuwen. Studeerde in Leiden
  en bekleedde verschillende bestuurlijke ambten in Delft, waaronder als schepen (1699-1708),
  thesaurier (1709-1714) en burgemeester (meerdere keren tussen 1722-1732). Trouwde in 1687
  met Maria Magdalena van Beresteijn (1667-1715). Werd in 1717 bewindhebber van de West-Indische
  Compagnie. In 1696 maakte hij samen met zijn echtgenote, zijn dochters Catarina en Maria,
  zijn zus Maria van Assendelft (1646-1715) en zijn zwager Willem (†1744) een plezierreisje
  naar Nijmegen, Kleef en paleis Het Loo.
