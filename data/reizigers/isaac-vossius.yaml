biografie: Zoon van Gerhard Vossius (1577-1689) en Elisabeth Junius (1585-1659). Studeerde klassieke
  literatuur in Leiden. Maakte tussen 1641 en 1644 een peregrinatio academica naar Engeland,
  Frankrijk, Italië en Zwitserland. Verbleef achtereenvolgens in Londen, Cambridge, Parijs,
  Lyon, Marseille, Florence, Rome, Napels, Venetië, Milaan en Genève. Promoveerde in Orléans
  in 1644. Werd in 1646 door de Staten van Holland aangesteld als historiograaf. Vertrok op
  uitnodiging van Christina van Zweden (1626-1689) naar Stockholm, waar hij werkte als tutor
  en bibliothecaris. Maakte tussen 1651 en 1653 een twede reis naar Italië om handschriften
  voor haar op te sporen, samen met collega Nicolaas Heinsius (1620-1681). Vestigde zich in
  1655 in Den Haag en in 1670 in Londen, waar hij de positie van kanunnik opnam. Publiceerde
  als classicus veelvuldig over de klassieke literatuur en bereidde uitgaves voor.
