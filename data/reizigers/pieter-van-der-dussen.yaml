korte_typering: 'Maakte in 1699-1700 een educatiereis. Eerste reis: 28-08-1699 (26 jaar)'
biografie: Zoon van Nicolaas Ewoutsz. van der Dussen (1636-1719) en Lydia van Beveren (º1647),
  broer van Jacob (1671-1728) en Cornelis (1684-1754). Maakte met Jacob een educatiereis naar
  Duitsland, Italië en Zwitserland in 1699 en 1700. Werd schepen van Dordrecht in 1717 en burgemeester
  en raad van Leiden in 1720.
