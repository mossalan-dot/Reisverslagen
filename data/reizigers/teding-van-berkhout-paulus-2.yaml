id: teding-van-berkhout-paulus-2
naam: Teding van Berkhout, Paulus (2)
geboren:
  jaar: 1676
  datum: 22 mei 1676
  plaats: Delft
overleden:
  jaar: 1757
  datum: 25 maart 1757
  plaats: Delft
korte_typering: Delft, 22 mei 1676 – Delft, 25 maart 1757. Maakte in 1719 een reis naar Frankrijk
  (42 jaar).
biografie: Zoon van Pieter Teding van Berkhout (1643-1713) en Elisabeth Ruysch (1645-1704).
  Studeerde in Leiden. Was veertigraad, schepen en meermaals burgemeester van Delft, hoogheemraad
  van Delfland en bewindhebber van de VOC. Maakte in 1719 een reis naar Frankrijk.
reizen_vermeld:
- 1719, Frankrijk.
addenda:
- Laissez-passer van de magistraat van Delft (Van der Goes 1719).
literatuur:
- NNBW, IV, 134.
bronnen:
- gemaakt-op-reis
