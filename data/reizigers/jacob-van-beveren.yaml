korte_typering: 'Maakte in 1634-1635 een educatiereis naar Frankrijk. Eerste reis: 30-8-1634
  (22 jaar)'
biografie: Zoon van Cornelis van Beveren (1591-1663) en Christina Pijl (ª1601). Maakte in 1634
  en 1635 een educatiereis naar Frankrijk in het gezelschap van Gijsbert de With (º1611), Hendrick
  van Gouthouven en Mathes Onderwaeter. Was schepen, raad en schout van Dordrecht tussen 1639
  en 1662 en burgemeester in 1662 en 1663 en 1670 en 1671. Daarnaast bekleedde hij de post van
  dijkgraaf, watergraaf en gedeputeerde van de Staten van Holland.
