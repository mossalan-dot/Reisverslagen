id: schellinger-voljard
naam: Schellinger, Voljard
korte_typering: Maakte in 1678 een plezierreis per boot naar Utrecht, Zuid-Holland en Gelderland
  in het gezelschap van Nanning en Gerard Hinlopen (1644-91). Maakte een tweede plezierreis
  naar Den Bosch in 1681 met Gerard Hinlopen en Dirk Molenwerff.
reizen_vermeld:
- Juli-augustus 1678, Utrecht, Zuid-Holland en Gelderland; juni 1681, Dordrecht en Den Bosch.
verslagen_vermeld:
- Hinlopen 1678; Hinlopen 1681.
bronnen:
- gemaakt-op-reis
