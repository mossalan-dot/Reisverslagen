naam: Kessel, Theodoor Andries van
geboren:
  jaar: 1640
  plaats: Antwerpen
overleden:
  jaar: 1690
  plaats: Antwerpen
religie: Katholiek
korte_typering: Antwerpen, 1640 – Antwerpen, 1690. Katholiek. Maakte in 1664-65 een educatiereis
  naar Italië (24 jaar).
biografie: Zoon van André van Kessel en Catherine de Bruyne van Aalst. Maakte in 1664 en 1665
  een educatiereis naar Italië onder leiding van tutor Hendrik Hillewerve (1621-94), samen
  met Balthasar Moretus III (1646-96), Jan Tholinx jr. (1631-1705) en Pieter Goos (1645-1708).
  Was schepen en in 1688 burgemeester van Antwerpen.
reizen_vermeld:
- September 1664-65, Duitsland, Oostenrijk en Italië.
verslagen_vermeld:
- Moretus III 1664-1665.
