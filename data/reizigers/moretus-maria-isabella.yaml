korte_typering: Antwerpen, 2 september 1655 – Antwerpen, 5 mei 1676. Maakte in 1668 een reis
  naar Den Bosch (12 jaar).
biografie: Dochter van Balthasar II Moretus (1615-74) en Anna Goos (1627-91), zus van Balthasar
  III (1646-96), Franciscus (1656-1705) en Joannes Jacobus (1647-1718). Maakte in 1668 een
  reis naar Den Bosch met haar ouders, broers en zussen.
reizen_vermeld:
- September-oktober 1668, Den Bosch.
verslagen_vermeld:
- Moretus III 1668; Moretus III 1924.
