biografie: Zoon van Johan van Oldenbarnevelt (1547-1619) en Maria van Utrecht (ºca. 1551), broer
  van Willem (1590-1634). Vergezelde zijn vader op diens missie naar Engeland in 1598. Maakte
  een tweede reis naar Engeland met zijn broer in 1603, waar hij werd geridderd door Jacobus
  I (1566-1625). Maakte tussen 1606 en 1608 een educatiereis met zijn broer en tutor Johannes
  Meursius (1579-1639), eerst in het gevolg van keurvorst Ernst van Keulen (1554-1612) naar
  het hof in Praag, daarna naar Duitsland, Genève en Frankrijk. Studeerde in Heidelberg en Genève.
  Werd in Parijs begeleid door François van Aerssen (1572-1641) en werd geridderd door Hendrik
  IV (1553-1610). Bekleedde het ambt van houtvester van Holland en hoogheemraad van Delfland.
  Na de berechting van zijn vader beraamde hij met zijn broer een aanslag op prins Maurits (1567-1625).
  De aanslag mislukte en hij werd berecht en onthoofd in 1623.
