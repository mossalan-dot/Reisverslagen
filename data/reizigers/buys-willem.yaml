korte_typering: Amsterdam, 27 mei 1661 – Amsterdam, 18 februari 1749. Reisde en studeerde
  in Frankrijk rond 1679-84 (ca. 18 jaar).
biografie: Zoon van Paulus Louwrens en Eva Buys. Studeerde rechten in Leiden en Orléans en
  werd in 1684 advocaat van het Hof van Holland. Werd in 1691 stadsadvocaat en directeur van
  de Sociëteit van Suriname en de kolonie Berbice tussen 1701 en 1717. Verbeterde de diplomatieke
  relatie met Engeland in 1705-1706 en was een van de onderhandelaars bij de Vrede van Utrecht
  in 1713. Maakte in 1706 een diplomatieke reis naar Londen met Cornelis van der Dussen (1684-1754).
  Werd in 1714 aangesteld als extraordinaris ambassadeur in Frankrijk. Was secretaris van
  de Staten van Holland tussen 1726 en 1749 en raadpensionaris van Holland in 1746.
