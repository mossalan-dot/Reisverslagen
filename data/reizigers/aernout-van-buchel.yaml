korte_typering: Maakte in 1584-1585 een educatiereis naar Frankrijk (-1565 jaar)
biografie: Buitenechtelijk kind van kanunnik Arend van Buchell en Brigitta Jans. Volgde de Latijnse
  school in Utrecht en Arnhem en studeerde daarna rechten in Leiden. Reisde in 1584-1585 naar
  Frankrijk, waar hij in Douai en Parijs studeerde. Kwam in Frankrijk in contact met verschillende
  geleerden. Maakte een tweede reis naar Duitsland en Italië in 1587-1588 en verbleef in Rome.
  Werd in 1590 en 1591 secretaris van Walraven van Brederode-Kloetinge (†1614) en ging daarna
  in dienst van Johan van Hornes, met wie hij een reis door Duitsland maakte. Promoveerde in
  de rechten in Leiden in 1593 en schreef zich in als advocaat te Utrecht. Huwde in 1593 met
  Claesje van Voorst. In 1599-1600 maakte hij een reis naar Keulen. Na de dood van zijn zoon
  in 1611 leed hij een teruggetrokken leven als geleerde, hoewel hij enige reizen naar de Zuidelijke
  Nederlanden maakte. Stond in contact met onder andere Scaliger, Heinsius, Vossius en Barlaeus
  en deed onderzoek naar de kronieken van Beka en Heda. Was ouderling en bewindhebber van de
  VOC.
