korte_typering: Groningen, 6 december 1621 – Groningen, 1 april 1679. Reisde en studeerde
  in Frankrijk rond 1636-43 (ca. 15 jaar).
biografie: Zoon van Hieronymus Isbrandtsz en Hylke Noorthoorn. Studeerde in Groningen en Orléans
  en promoveerde in Groningen. Bekleedde verschillende ambten, waaronder die van gecommitteerde
  van de Staten-Generaal, gedeputeerde der provincie en lid van de Raad van State. Maakte
  een diplomatieke reis naar Polen in 1656 samen met medegezanten Govert van Slingelandt (1623-90),
  Frederik van Dorp (1612-79) en Pieter de Huybert (1622-95). De reis werd beschreven door
  Adriaen Schagen (1633-99). Reisde als diplomaat in 1665 naar Zweden en was in 1668 onderhandelaar
  bij de Triple Alliantie. Maakte in 1673 en 1674 een diplomatieke reis naar Aken en Keulen.
reizen_vermeld:
- Ca. 1636-43, Frankrijk; maart-juni 1656, Zweden en Polen; 1665, Zweden; mei 1673-mei 1674,
  Aken en Keulen.
verslagen_vermeld:
- Schagen 1656; Schagen 1968.
