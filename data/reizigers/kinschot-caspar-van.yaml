korte_typering: Den Haag, 12 november 1622 – Middelburg, 31 december 1649. Maakte in 1643-44
  een educatiereis naar Frankrijk (21 jaar).
biografie: Zoon van Lodewijk van Kinschot (1595-1647) en Maria de Jonge (1603-30). Studeerde
  rechten in Utrecht en Leiden. Schreef Latijnse gedichten. Maakte in 1643 en 1644 een educatiereis
  naar Frankrijk en promoveerde vermoedelijk in Orléans in 1645. In 1646 reisde hij in een
  diplomatiek gezantschap mee naar Duitsland om te onderhandelen over de Vrede van Münster.
  Reisde naar Frankfurt in 1647. Overleed aan de gevolgen van tuberculose. Zijn gedichten
  werden postuum uitgebracht.
reizen_vermeld:
- September 1643-44, Frankrijk; voorjaar 1646, Münster; Frankfurt, 1647.
