biografie: Zoon van de welvarende Leidse lakenfabrikant Pieter de la Court van der Voort (1664-1739)
  en Sara Poelaart (1666-1740), broer van Catharina (1691-1752) en Adriana (1696-1748). Werkte
  als grein- en lakenfabrikant en koopman in Leiden en was een kunstverzamelaar. Vergezelde
  zijn vader op zijn twaalfde op diens reis naar Parijs in 1700. Maakte een reis naar Berlijn
  in 1707 en een handelsreis naar Londen in 1710. Maakte in 1740 een plezierreis naar de Zuidelijke
  Nederlanden met zijn zussen Catharina en Adriana, schoonzus Catharina Backer (1689-1766) en
  neef en nicht Bogaerd.
