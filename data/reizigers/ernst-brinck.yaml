korte_typering: 'Maakte in 1602-1607 een educatiereis. Eerste reis: 02-06-1602 (20 jaar)'
biografie: Zoon van de Harderwijkse burgemeester Alphert Brinck en Christina Böss. Studeerde
  in Leiden en maakte tussen 1602 en 1607 een educatiereis naar Duitsland, Frankrijk en Zwitserland.
  Studeerde in Parijs bij Isaac Casaubon (1559-1614) en diende in de koninklijke garde van Hendrik
  IV (1554-1610). Werkte tussen 1612 en 1615 als persoonlijk secretaris van Cornelis Haga (1578-1654),
  de Nederlandse ambassadeur te Constantinopel en verkende Turkije, Italië en Oostenrijk. Bekleedde
  vanaf 1618 functies als rentmeester, schepen en burgemeester in Harderwijk. Had contact met
  tal van binnen- en buitenlandse geleerden, legde een uitgebreid rariteitenkabinet aan en werkt
  mee aan verschillende boeken, zoals de atlassen van Blaeu en Mercator. Zijn contacten zijn
  geboekstaafd in zijn drie alba amicorum.
