korte_typering: 'Maakte in 1674 een kunstenaarsreis naar Rome. Eerste reis: 01-01-1674 (22 jaar)'
biografie: Werkte als kunstschilder. Ging in de leer bij Matthias Withoos (1627-1703) en maakte
  in 1675 een kunstenaarsreis naar Italië. Vestigde zich als schilder in Rome en was daar succesvol.
  Werd lid van de Bentvueghels en kreeg de bijnaam ‘Piktoorts’ of ‘Toorts van Amersfoort’. Was
  een van de grondleggers van de vedutetraditie.
