korte_typering: 'Maakte een reis naar Nijmegen in 1787. Eerste reis: 28-08-1787 (21 jaar)'
biografie: Dochter van de Rotterdamse bestuurder Willem van Hogendorp (1735-1784) en Carolina
  Wilhelmina van Haren. Vluchtte in 1787 naar het stadhouderlijk hof in Nijmegen met haar moeder,
  zus Geertruida (ca. 1765-1800) en nicht Lucie van Sandick (†1791). Haar zus hield ook een
  verslag bij. Maakte een tweede reis naar Bonn in 1792.
