korte_typering: Groningen, 3 september 1633 – Groningen, 23 mei 1719. Maakte in 1655-57 een
  educatiereis naar Frankrijk, Zwitserland en Engeland (21 jaar).
biografie: Studeerde letteren en theologie in Groningen. Maakte tussen 1655 en 1657 een educatiereis
  naar Duitsland, Zwitserland, Frankrijk, Engeland en de Zuidelijke Nederlanden met Louis
  Wolzogen de Meningstorf (1631-90) en Johannes Hotton. Hij bezocht onder andere Keulen, Heidelberg,
  Bazel, Genève, Nîmes, Montpellier, Bordeaux, het Loiregebied, Parijs, Londen en Oxford.
  Was predikant in Haren en Groningen vanaf 1657 en schreef verschillende theologische werken,
  waaronder de concordantie op de Statenvertaling (1672-91). Schreef over zijn reis in zijn
  autobiografie. Ontving in 1717 een eredoctoraat van Groningen.
reizen_vermeld:
- April 1655-mei 1657, Duitsland, Zwitserland, Frankrijk, Engeland, Zuidelijke Nederlanden.
verslagen_vermeld:
- Gedrukt verslag in zijn autobiografie, getiteld ‘Bevindingen van hem selven geduirende syn
  levens-loop tot soo verre hy hadde opgetekent ende by een versamelt (Trommius 1720).
