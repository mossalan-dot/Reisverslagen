korte_typering: 'Maakte rond 1740 een korte plezierreis. Eerste reis: 13-08-1740 (51 jaar)'
biografie: Dochter van Willem Backer (1656-1681) en Magdalena de la Court (1662-1731). Trouwde
  in 1711 met haar neef Allard de la Court (1688-1755). Was voor haar huwelijk een amateurschilder
  en tekenares. Rond 1740 maakte ze een plezierreisje naar Antwerpen en Brussel met haar echtgenoot
  en schoonzussen Catharina (1689-1766) en Adriana de la Court (1696-1748).
