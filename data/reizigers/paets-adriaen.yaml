id: paets-adriaen
naam: Paets, Adriaen
geboren:
  jaar: 1631
  datum: 3 juli 1631
  plaats: Leiden
overleden:
  jaar: 1686
  datum: 5 oktober 1686
  plaats: Rotterdam
religie: Remonstrants
korte_typering: Leiden, 3 juli 1631 – Rotterdam, 5 oktober 1686. Remonstrants. Maakte in 1672-73
  een diplomatieke reis naar Spanje (40 jaar).
biografie: Studeerde rechten in Leiden en werkte als advocaat en notaris. Werd in 1664 vroedschap
  van Rotterdam en in 1668 bewindhebber van de VOC-kamer Rotterdam. Maakte in 1672 een diplomatieke
  reis naar Madrid als ambassadeur van de Staten-Generaal. Jacob Gronovius reisde (1645-1716)
  met hem mee. Werd in 1675 herbenoemd tot vroedschap.
reizen_vermeld:
- Juni 1672-73, Zuidelijke Nederlanden, Frankrijk en Spanje; januari 1685-april 1686, Engeland.
verslagen_vermeld:
- Gronovius 1672-1673.
addenda:
- Verbaal van het gezantschap in 1685-85, hierboven genoemd (SG 8612).
literatuur:
- BWN, XV, 17-20; RAA.
bronnen:
- gemaakt-op-reis
