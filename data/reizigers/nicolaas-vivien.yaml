biografie: Zoon van Anthony Vivien (º1603) en Anthonia van den Corput (1607-1656), neef van
  Johan (1625-1672) en Cornelis de Witt (1623-1672). Studeerde rechten in Utrecht. Maakte in
  1653 een diplomatieke reis naar Lübeck samen met Anthony Oetgens van Waveren (1585-1658) en
  Jacob de Witt (1589-1674). Arnout Hellemans Hooft (1629-1680) deed kort verslag. Maakte tussen
  1653 en 1655 een educatiereis naar Duitsland, Zwitserland en Frankrijk en promoveerde in december
  1654 in de rechten in Angers. Werkte als advocaat in Den Haag. Werd in 1664 pensionaris van
  Dordrecht en viel tussen 1665 en 1666 meermaals in als raadpensionaris. Werd na de dood van
  De Witt niet meer benoemd tot hoge bestuurlijke posities.
