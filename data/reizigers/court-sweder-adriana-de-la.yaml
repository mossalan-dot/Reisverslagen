id: court-sweder-adriana-de-la
naam: Court(-Sweder), Adriana de la
geboren:
  jaar: 1696
  datum: 16 mei 1696
  plaats: Leiden
overleden:
  jaar: 1748
  datum: 11 augustus 1748
  plaats: Leiden
korte_typering: Leiden, 16 mei 1696 – Leiden, 11 augustus 1748. Reisde in 1714 naar Engeland
  (18 jaar).
biografie: Dochter van de welvarende Leidse lakenfabrikant Pieter de la Court van der Voort
  (1664-1739) en Sara Poelaert (1666-1740), zus van Allard (1688-1755) en Catharina Adriana
  (1691-1752). Trouwde in 1747 met Alexander Sweder (1703-68), rijksvrijheer van Spaen. Vergezelde
  in 1714 haar schoonbroer Johan Meerman (1687-1752) op zijn reis naar Engeland. Maakte tussen
  1732 en 1743 verschillende plezierreizen naar Gelderland, Duitsland en de Zuidelijke Nederlanden.
reizen_vermeld:
- 1714, Engeland; juli-november 1732, Zuidelijke Nederlanden; juni-juli 1733, Maastricht,
  Spa en Kleef; ca. augustus-september 1740, Zuidelijke Nederlanden; juni-september 1743,
  Hamburg.
verslagen_vermeld:
- De la Court 1732; De la Court 1733; De la Court [1740]; De la Court 1743.
addenda:
- Zie appendix B. Portret gemaakt in Engeland in 1714 door Michaël Dahl (1656-1743).
literatuur:
- Verhoeven 2017a, 185-202; Verhoeven 2018, 66-78; Moss 2018, 99-112.
bronnen:
