korte_typering: Leeuwarden, 18 februari 1644 – 7 november 1714. Maakte in 1664 en 1665 een
  educatiereis naar Frankrijk, Zwitserland en Duitsland (20 jaar).
biografie: Zoon van Here Jarichs van Ockinga (1610-82) en Magdalena Sybrants Burmania (1619-92).
  Werd in 1651 aangesteld als kapitein van de infanterie. Maakte een educatiereis naar Frankrijk,
  Zwitserland en Duitsland tussen 1664 en 1665 in het gezelschap van Tinco van Andringa (º1643).
  Werd in 1666 raad van het hof van Friesland en werd later curator van de academie te Franeker.
  Was een van de rijkste inwoners van Friesland. Werd in 1700 eigenaar van de state Twixel.
reizen_vermeld:
- Juni 1664 – juli 1665, Zuidelijke Nederlanden, Frankrijk, Zwitserland en Duitsland.
