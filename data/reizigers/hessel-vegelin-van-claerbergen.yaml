korte_typering: 'Maakte in 1677 een reis naar Duitsland. Eerste reis: 30-05-1677 (22 jaar)'
biografie: Zoon van Philip Ernst Vegelin van Claerbergen (1613-1693) en Fokje van Sminia (1615-1658),
  broer van Ernst Frederik (º1648) en vader van Philip Frederik (1685-1738), Assuerus (1687-1771),
  Johan (1690-1773) en Nehemia (1691-1739). Studeerde in Franeker. Was grietman van Utingeradeel
  en Haskerland. Was gedeputeerde van de Staten van Friesland. Maakte in 1677 een reis naar
  Duitsland met zijn vader om de landerijen van diens werkgever Hendrik Casimir (1657-1696),
  prins van Nassau-Dietz, te inspecteren.
