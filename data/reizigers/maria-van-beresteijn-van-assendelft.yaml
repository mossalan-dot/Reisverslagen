biografie: Trouwde in 1687 met Adriaan Gerrits van Assendelft (1644-1742). In 1696 maakte zij
  samen met haar echtgenoot, haar dochters Catarina en Maria, haar schoonzus Maria van Assendelft
  (1646-1715) en zwager Willem (†1744) een plezierreisje naar Nijmegen, Kleef en paleis Het
