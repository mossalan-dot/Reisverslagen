biografie: Zoon van Adriaan Teding van Berkhout (1571-1620) en Geertruyt Volkertsdr. Gael (º1571-ca.
  1601), halfbroer van Paulus (1609-1672). Studeerde filosofie in Leiden en reisde in 1620 naar
  Frankrijk met tutor Thomas Erpenius (1584-1624). Tussen 1621 en 1623 maakte hij een diplomatieke
  reis naar Engeland in het gezantschap van François van Aerssen van Sommelsdijk (1572-1641),
  Diederick Bas (1569-1637) en Hendrik van Tuyll van Serooskerken (1574-1627). Was in 1623 edelman
  in het gevolg van Charles de Lorraine (1571-1640), hertog van Guise. Maakte rond 1623-1627
  een educatiereis naar Italië en werd benoemd tot consul van de Natio Germanica in Siena. Werd
  tot Maltezer ridder geslagen. Werd na een fataal duel met Adriaan van Vrijburch (†ca. 1605-628)
  gemeden door zijn familie en probeerde vanuit Italië zijn naam te zuiveren. Koos voor een
  militaire carrière en werd lijfcornet in een ruiterregiment. Stierf, waarschijnlijk ten gevolge
  aan een infectie, na de Slag om Neurenberg in 1632.
