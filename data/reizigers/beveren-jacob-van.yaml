korte_typering: Heer van Zwijndrecht. Dordrecht, 27 juni 1612 – Dordrecht, 30 januari 1676.
  Maakte in 1634-35 een educatiereis naar Frankrijk (22 jaar).
biografie: Zoon van Cornelis van Beveren (1591-1663) en Christina Pijl (º1601). Maakte in
  1634 en 1635 een educatiereis naar Frankrijk in het gezelschap van Gijsbert de With (º1611),
  Hendrick van Gouthouven en Mathes Onderwaeter. Was schepen, raad en schout van Dordrecht
  tussen 1639 en 1662 en burgemeester in 1662-63 en 1670-71. Daarnaast bekleedde hij de post
  van dijkgraaf, watergraaf en gedeputeerde van de Staten van Holland.
