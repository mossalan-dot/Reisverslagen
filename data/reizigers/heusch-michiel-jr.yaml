id: heusch-michiel-jr
naam: Heusch, Michiel jr.
korte_typering: Hamburg (D), oktober 1641 – Hamburg, oktober/november 1668. Maakte in 1664-65
  een educatiereis naar Italië en Frankrijk (22 jaar).
biografie: Zoon van de koopman Michiel Heusch sr. (1601-84) en Elisabeth Bosschaert (1609-79).
  Maakte tussen 1664 en 1665 een educatiereis naar Duitsland, Italië en Frankrijk en bezocht
  onder andere Neurenberg, Venetië, Rome, Napels, Florence, Livorno en Genua.
