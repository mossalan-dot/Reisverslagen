id: weenix-jan-baptist
naam: Weenix, Jan Baptist
naamsvarianten:
- Ratel
korte_typering: Amsterdam, 1621 – De Haar, april 1659. Maakte in 1643-47 een kunstenaarsreis
  naar Frankrijk en Italië (22 jaar).
biografie: 'Zoon van de schilder Jan Jansz. Weynes. Was een leerling van Abraham Bloemaert
  (ca. 1564-1651) en maakte een kunstenaarsreis naar Frankrijk en Italië. Verbleef in Rome
  tussen 1643 en 1647. Zijn bentnaam was ‘Ratel’. Was bestuurslid van het St.-Lucasgilde in
  Utrecht.


  Wijnen, Domenicus van [ook: Dominicus; Ascanias]. Amsterdam, 1661 – Amsterdam, december
  1698. Maakte tussen 1680 en 1690 een kunstenaarsreis naar Italië (ca. 19).


  Was een leerling van de historieschilder Willem Doudijns (1630-97). Maakte tussen 1680 en
  1690 een kunstenaarsreis naar Duitsland en Italië. Zijn bijnaam was ‘Ascanias’.'
