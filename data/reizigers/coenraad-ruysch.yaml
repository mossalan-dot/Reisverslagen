korte_typering: 'Maakte in 1674-1677 een educatiereis naar Frankrijk, Zwitserland en Italië.
  Eerste reis: 03-05-1674 (24 jaar)'
biografie: Zoon van Nicolaas Ruysch (1610-1670) en Maria Paedts (1621-1670). Studeerde in Leiden
  en promoveerde in Poitiers. Maakte tussen 1674 en 1677 een educatiereis naar Duitsland, Frankrijk,
  Zwitserland en Italië met zijn neef Dirck van Hoogeveen. Was kapitein van de schutterij en
  vroedschap in Leiden in 1679. Maakte een reis naar Engeland in 1679 en 1680 met Diderik van
  Leijden van Leeuwen (1628-1682). Werd tussen 1684 en 1730 meermaals beëidigd als burgemeester.
  Had tussen 1687 en 1720 herhaaldelijk zitting in het college van de gecommitteerde Raden van
  Holland en Westfriesland. Was lid van de Staten-Generaal in 1696 en 1697. Was een verzamelaar
  van munten.
