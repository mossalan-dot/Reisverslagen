id: wolzogen-de-meningstorf-louis
naam: Wolzogen de Meningstorf, Louis
naamsvarianten:
- Ludovicus
geboren:
  jaar: 1633
  plaats: Amersfoort
overleden:
  jaar: 1690
  datum: 13 november 1690
  plaats: Amsterdam
korte_typering: Baron. Amersfoort, 1633 – Amsterdam, 13 november 1690. Maakte in 1655-57 een
  educatiereis naar Frankrijk, Zwitserland en Engeland (22 jaar).
biografie: Zoon van Johannes Ludovicus Wolzogen, vrijheer van Neuhausen. Studeerde in Utrecht
  in de theologie. Maakte tussen 1655 en 1657 een educatiereis naar Duitsland, Zwitserland,
  Frankrijk, Engeland en de Zuidelijke Nederlanden met Abraham Trommus (1633-1719) en Johannes
  Hotton. Was tot 1664 predikant in Groningen en Middelburg. Werd hoogleraar kerkgeschiedenis
  in Utrecht en Amsterdam.
reizen_vermeld:
- April 1655-mei 1657, Duitsland, Zwitserland, Frankrijk, Engeland, Zuidelijke Nederlanden.
verslagen_vermeld:
- Gedrukt verslag van Trommius in zijn autobiografie, getiteld ‘Bevindingen van hem selven
  geduirende syn levens-loop tot soo verre hy hadde opgetekent ende by een versamelt (Trommius
  1720).
literatuur:
- BWN, XX, 415-417; NNBW, X, 1234-1236; Van Miert 2017, 59.
bronnen:
- gemaakt-op-reis
