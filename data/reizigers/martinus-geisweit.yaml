biografie: Zoon van Willem Geisweit en Johanna van den Broek. Was werkzaam als cadet en promoveerde
  in 1736 in Leiden in de geneeskunde. Reisde in 1736 naar Parijs om operaties bij te wonen
  en met medici mee te lopen. Studeerde bij terugkomst in Amsterdam en opende een praktijk in
  Den Haag. Trouwde in 1737 met Anna Catharina van der Kemp (1713-1742).
