id: hotton-johannes
naam: Hotton, Johannes
korte_typering: Zoon van predikant Godfroy Hotton. Maakte tussen 1655 en 1657 een educatiereis
  naar Duitsland, Zwitserland, Frankrijk, Engeland en de Zuidelijke Nederlanden met Abraham
  Trommius (1633-1710) en Louis Wolzogen de Meningstorf (1631-90).
reizen_vermeld:
- April 1655-mei 1657, Duitsland, Zwitserland, Frankrijk, Engeland, Zuidelijke Nederlanden.
verslagen_vermeld:
- Gedrukt verslag van Trommius in zijn autobiografie, getiteld ‘Bevindingen van hem selven
  geduirende syn levens-loop tot soo verre hy hadde opgetekent ende by een versamelt (Trommius
  1720).
literatuur:
- Van Miert 2017, 59.
bronnen:
- gemaakt-op-reis
