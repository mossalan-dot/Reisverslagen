korte_typering: 'Maakte in 1652-1655 een kunstenaarsreis naar Duitsland, Zwitserland en Frankrijk.
  Eerste reis: 21-08-1652 (24 jaar)'
biografie: Was in 1647 een leerling van Frans Hals (ca. 1682-1666) en schreef zich in 1649 in
  in het Haarlemse schildersgilde. Werkte als schilder en tekenaar. Maakte tussen 1652 en 1653
  een kunstenaarsreis naar Duitsland, Zwitserland en Frankrijk in het gezelschap van collega-kunstenaars
  Guillaume Dubois (1625-1680), Dirck Helmbreeker (1633-1696) en Cornelis Bega (1631-1664) en
  de schoenmakersgezel Joost Boelen. Maakte in 1680 een plezierreis naar Utrecht en Rotterdam.
