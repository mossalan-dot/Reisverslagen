id: reepmaker-johan
naam: Reepmaker, Johan
korte_typering: Amsterdam, 20 januari 1647 – ‘s-Gravendeel, 21 januari 1686. Maakte tussen
  1666 en 1671 een educatiereis naar Duitsland, Italië en Frankrijk (ca. 19 jaar).
biografie: Zoon van Jacob Reepmaker (1599-1651) en Maria Trip (1617-72). Zijn vader was bewindhebber
  van de WIC. Maakte tussen 1666 en 1671 een educatiereis naar Duitsland, Italië en Frankrijk,
  waar hij een audiëntie had met Lodewijk XIV (1638-1715). Trouwde met Christina de Beveren
  (1653-1728) en woonde in het Dordtse kasteel Develstein.
reizen_vermeld:
- 1666-1671, Duitsland, Italië en Frankrijk.
verslagen_vermeld:
- Reepmaker 1666-1671.
literatuur:
- NNBW, III, 1046; Schotel 1840, 53-128.
bronnen:
- gemaakt-op-reis
