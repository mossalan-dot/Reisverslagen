biografie: Zoon van Dirck van Beuningen (1588-1648) en Catharina Burgh (1591-1667). Studeerde
  en promoveerde in de rechten in Leiden en werd in 1642 door Hugo de Groot (1583-1645), Zweeds
  gezant te Parijs, aangesteld als secretaris. In 1643 werd hij benoemd tot stadssecretaris
  van Amsterdam. In 1660 werd hij vroedschap, in 1668 schepen en tussen 1669 en 1684 meermaals
  burgemeester. In 1681 werd hij bewindhebber van de VOC. Als diplomaat ondernam hij verschillende
  missies, onder andere naar Zweden, Stade en Bremen, Frankrijk en Engeland. In 1674 reisde
  hij naar Londen om te onderhandelen over de Vrede van Westminster samen met collega-diplomaten
  Willem van Haren (1626-1708), Willem Adriaan van Nassau (ca. 1635-1705) en Frederik baron
  van Reede tot Renswoude (ca. 1630-1715). Predikant Joannes Vollenhove (1631-1708) deed verslag
  van de reis. In 1686 trouwde hij met Jacoba Victoria Bartholotti van den Heuvel (1639-1718).
  Na een groot financieel verlies in VOC-aandelen verslechterde zijn geestelijke gezondheid.
  Werd uiteindelijk onder curatele gesteld.
