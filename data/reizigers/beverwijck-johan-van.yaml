id: beverwijck-johan-van
naam: Beverwijck, Johan van
naamsvarianten:
- Beverovicius
geboren:
  jaar: 1594
  datum: 17 november 1594
  plaats: Dordrecht
overleden:
  jaar: 1647
  datum: 19 januari 1647
  plaats: Dordrecht
korte_typering: Dordrecht, 17 november 1594 – Dordrecht, 19 januari 1647. Maakte in 1615-16
  een educatiereis naar Frankrijk en Italië (21 jaar).
biografie: Zoon van Bartholomeus van Beverwijck en Maria Boot van Wezel. Studeerde geneeskunde
  in Leiden en maakte in 1615 en 1616 een studiereis naar Frankrijk en Italië, waar hij onder
  andere Parijs, Montpellier, Padua, Rome en Napels bezocht. Promoveerde in Padua. Vestigde
  zich omsteeks 1618 als arts in Dordrecht. Publiceerde verschillende medische werken, waaronder
  de zeer populaire Schat der gesontheyt (1636) en Schat der ongesontheyt (1643).
reizen_vermeld:
- 1615-1616, Frankrijk en Italië.
literatuur:
- BWN, II, 500-503; NNBW, I, 327-332; Van Gemert 1992, 99-106; Van Beverwijck 1992, 164-180.
bronnen:
