id: court-meerman-catharina-adriana-de-la
naam: Court(-Meerman), Catharina Adriana de la
geboren:
  jaar: 1691
  datum: 2 februari 1691
  plaats: Leiden
overleden:
  jaar: 1752
  datum: 4 november 1752
  plaats: Leiden
korte_typering: Leiden, 2 februari 1691 – Leiden, 4 november 1752. Maakte rond 1740 een korte
  plezierreis (ca. 49 jaar).
biografie: Dochter van de Leidse lakenfabrikant Pieter de la Court van der Voort (1663-1739)
  en Sara Poelaert (1666-1740), zus van Allard (1688-1755) en Adriana (1696-1748). Trouwde
  met Johan Meerman (1687-1746). Maakte in 1740 een plezierreis naar de Zuidelijke Nederlanden
  met haar broer en zus, schoonzus Catharina Backer (1689-1766) en neef en nicht Bogaerd.
