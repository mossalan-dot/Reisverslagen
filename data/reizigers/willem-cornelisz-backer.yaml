korte_typering: 'Maakte in 1679 een educatiereis naar Italië. Eerste reis: 01-01-1679 (23 jaar)'
biografie: Zoon van Cornelis Backer (1633-1681) en Christine le Gillon (1633-1658). Maakte rond
  1679 een educatiereis naar Italië, waar hij zich liet portretteren. Trouwde in 1682 met Magdalena
  de la Court (1661-1712). Werkte als advocaat en koopman en was een kunstverzamelaar. Was in
  Amsterdam luitenant en kapitein van de burgerij en kerkmeester van de Amstelkerk.
