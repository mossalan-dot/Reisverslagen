  beschrijving: "Onderdeel van een reeks van vier portretminiaturen die met een schoefdraad\
    \ op elkaar te bevestigen zijn. Het geheel kan aan de bovenzijde worden afgesloten met een\
    \ schroefdeksel waarop het wapen van de familie Backer.\n\nDrager/materiaal papier, tempera\n\
    Vorm/maten staand ovaal 80 x 65 mm \nmaat met ronde omlijsting ca 100 mm\n\nVolgens de boedelpapieren\
    \ collectie Willem Backer (1656-1731) (zie literatuur) zou het origineel door Bombelli zijn\
    \ vervaardigd toen de voorgestelde rond 1679 op grand tour naar Italië reisde."
