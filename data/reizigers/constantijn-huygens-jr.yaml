korte_typering: 'Maakte in 1649 een diplomatieke reis naar Engeland. Eerste reis: 01-02-1649
  (21 jaar)'
biografie: Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Christiaan (1629-1695), Lodewijk (1631-1699), Philips (1633-1657) en Susanna (1637-1725).
  Studeerde rechten in Leiden en hielp zijn vader tijdens diens post als secretaris van Frederik
  Hendrik (1584-1647) en Willem II (1626-1650). Reisde in februari en maart 1649 naar Engeland
  in het gezantschap van Adriaan Pauw (1585-1653). Maakte een educatiereis naar Frankrijk, Zwitserland
  en Italië tussen 1649 en 1651. Assisteerde zijn broer Christiaan bij diens natuurwetenschappelijke
  onderzoek. Werd secretaris van Willem III (1650-1702) in 1672 en bekleedde die positie tot
  zijn dood. Deed verslag van verschillende militaire expedities in die jaren.
