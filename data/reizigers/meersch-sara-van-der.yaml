id: meersch-sara-van-der
naam: Meersch, Sara van der
religie: Doopsgezind
korte_typering: Amsterdam, †1674. Doopsgezind. Vluchtte tijdens het Rampjaar naar Hamburg.
biografie: Dochter van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707),
  zus van Anna (1669-1724), Catharina (1666-1723), Pieter (º1677), Abraham jr. (1676-1719)
  en Arent (1683-1768). Vluchtte tijdens het Rampjaar met haar ouders en haar zussen naar
  Hamburg. Stierf op jonge leeftijd.
reizen_vermeld:
- Juni 1672-73, Hamburg.
verslagen_vermeld:
- Van der Meersch 1672-1674.
literatuur:
- Visser en Zilverberg 1991, 153-187.
bronnen:
- gemaakt-op-reis
