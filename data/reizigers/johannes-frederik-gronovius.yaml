biografie: Zoon van David Gronow en Margaretha Langermann, vader van Jacob (1645-1716) en Laurens
  (1648-1724). Studeerde rechten aan de universiteit van Altdorf. Werkte als huisleraar in Amsterdam
  en Den Haag. Maakte tussen 1639 en 1642 een peregrinatio academica naar Engeland, Frankrijk
  en Italië, waar hij in de rechten promoveerde aan de universiteit van Angers. Publiceerde
  verschillende filologische werken over de klassieke literatuur. Werd in 1642 benoemd tot hoogleraar
  welsprekendheid en geschiedenis aan het Athenaeum Illustre in Deventer en tot hoogleraar taal
  en geschiedenis in Leiden, als opvolger van Daniël Heinsius (1580-1655).
