id: alensoon-jan
naam: Alensoon, Jan
korte_typering: September 1683 – Leiden, 1769. Maakte in 1723-1724 een reis naar Frankrijk,
  Zwitserland, Italië en Duitsland (40 jaar).
biografie: Zoon van koopman Caspar Alensoon (1657-1714) en Johanna du Pré. Studeerde in Leiden
  en werkte als advocaat. Maakte in 1723 en 1724 een reis naar Frankrijk, Zwitserland, Italië
  en Duitsland in het gezelschap van Marcus Drabbe. Als muziekkenner en zanger had hij met
  name interesse in concerten en buitenlandse componisten. Werd in 1729 in Leiden aangesteld
  als ontvanger extraordinaris verponding en als weeshuisregent.
reizen_vermeld:
- September 1723-september 1724, Zuidelijke Nederlanden, Frankrijk, Zwitserland, Italië en
  Duitsland.
verslagen_vermeld:
- Alensoon 1723-1724; Alensoon 2013; Alensoon 2014.
