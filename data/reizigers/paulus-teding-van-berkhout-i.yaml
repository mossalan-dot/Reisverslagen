korte_typering: 'Maakte in 1633 een reis naar Engeland en Frankrijk. Eerste reis: 01-01-1633
  (24 jaar)'
biografie: Zoon van Adriaan Tedng van Berkhout (1571-1620) en Margaretha Duyst van Beresteyn
  (1581-1635), halfbroer van Volkert (1601-1632) en vader van Pieter (1643-1713) en Joan (1648-1720).
  Studeerde in Brielle en Leiden. Maakte in 1633 een reis naar Engeland en Frankrijk en promoveerde
  in Angers in de rechten. Werd in 1634 advocaat van het Hof van Holland en in 1635 pensionaris
  van Monnikendam. Werd in 1649 raad en rekenmeester van de Domein- en Rekenkamer van Holland.
