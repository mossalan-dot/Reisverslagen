id: enno-lodewijk
naam: Enno Lodewijk
korte_typering: Graaf van Oost-Friesland. Aurich (D), 29 oktober 1632 – Aurich (D), 4 april
  1660. Maakte tussen 1646 en 1650 een educatiereis (14 jaar).
biografie: Zoon van Ulrich II (1605-48), graaf van Oost-Friesland en Juliana van Hessen-Darmstadt
  (1606-60). Reisde naar Frankrijk in 1646 om van zijn slechte manieren af te komen onder
  begeleiding van tutor Jacob von Wangenheim. Deze tutor werd later vervangen door Levin Claus
  Moltke. Verbleef met Constantijn Huygens jr. (1628-97) in Genève in 1649 en 1650. Na zijn
  terugkeer liet hij hofmeester Johan Marenholz, de geliefde van zijn moeder, na een schijnproces
  onthoofden.
reizen_vermeld:
- 1646, Frankrijk; 1649-50, Genève.
verslagen_vermeld:
- Huygens 1649-1650; Huygens 1888, 87-162.
correspondentie:
- Zes brieven van Juliana van Hessen-Darmstadt aan Constantijn Huygens sr. (1597-1687) over
  Enno Lodewijk, 1) Aurich, 30 maart 1649; 2) 7 april (over zijn broers Georg Christian en
  Edzard Ferdinand); 3) Sandhorst/Aurich, 22 september; 4) Sandhorst, 17 januari 1650; 5)
  31 januari; 6) 28 februari (ePistolarium).
literatuur:
- Frank-van Westrienen 1983, 69-70.
bronnen:
