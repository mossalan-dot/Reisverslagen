biografie: Zoon van predikant Everard Booth (1577-1610) en Alida Ruysch (†1616). Maakte in 1627
  als secretaris een diplomatieke reis naar Polen onder leiding van de gezanten Simon van Beaumont
  (1574-1654). Andries Bicker (1586-1652) en Rochus van den Honert (1572-1638). Publiceerde
  in 1632 een verslag van deze reis. Maakte tussen 1628 en 1629 een tweede reis naar Engeland
  in het gezantschap van de VOC, onder leiding van Albert Joachimi (1560-1654). Was secretaris
  van Wijk bij Duurstede.
