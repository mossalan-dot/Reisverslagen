id: merode-johan-van
naam: Merode, Johan van
geboren:
  jaar: 1607
overleden:
  jaar: 1666
  datum: 25 augustus 1666
korte_typering: Heer van Rummen, Sevenich en Oudelandsambacht, baljuw van Kennemerland. Ca.
  1607 – 25 augustus 1666. Maakte in 1660-61 een diplomatieke reis naar Spanje (ca. 53 jaar).
biografie: 'Zoon van Floris van Merode en Margaretha van Gent. Was kolonel van een regiment
  Groningers in 1647 en gouverneur van Ravesteyn in 1650. Maakte in 1660 en 1661 als gezant
  een diplomatieke reis naar het hof in Madrid samen met Philips Aebinga van Humalda (ca.
  1616-72) en Godard Adriaan van Reede van Amerongen (1621-91). De reis werd beschreven door
  Lodewijk Huygens (1631-99).


  Merwede, Matthijs van der [ook: M.V.M. [Hr.] V. Cl.] Heer van Clootwijck. Geertruidenberg,
  ca. 1625 – Geertruidenberg, ca. 1677. Maakte in 1646-50 een reis naar Engeland, Frankrijk
  en Italië. (ca. 21 jaar).


  Zoon van Johan van der Merwede en Cornelia van Beveren. Studeerde in Leiden. Reisde naar
  Engeland in 1646 en naar Frankrijk en Italië tussen 1646 en 1650 in het gezelschap van Adriaen
  van Blijenburgh (1616-82) en Nicolaas Heinsius (1620-81). Studeerde in Siena en Padua in
  1647. In Italië verbleef hij in het gezelschap van Nederlandse schilders, Arnout Hellemans
  Hooft (1629-80) en Reyer Anslo (1626-69). Bij thuiskomst publiceerde hij de dichtbundels
  Roomsche Min-Triomfen (1651) en Geestelijke Minne-vlammen (1653). De eerste bundel, die
  libertijnse gedichten over seks met jonge meisjes bevatte, leidde tot veel ophef. Vertaalde
  onder andere Vergilius en Petrarca. Volgens sommige biografen nam hij dienst bij de VOC
  en overleed hij in 1664 voor de kust van Vietnam.'
reizen_vermeld:
- Oktober 1660-augustus 1661, Spanje; augustus-oktober 1664, Brussel; september-december 1665,
  Duitsland juli-augustus 1666, Zuidelijke Nederlanden.
- 1646-50, Italië; 1664, Vietnam.
verslagen_vermeld:
- Huygens 1660-1661; Huygens 2005.
addenda:
- Verbalen, rapporten, minuten en kopieën van instructies van de gezantschappen, hierboven
  genoemd (SG 8507-8509; 8972-8975; 9058-9059; 9177-9178); brieven van recredentie uit Spanje
  (SG 12588.68).
- 'Portret door Jan Gerritsz. van Bronckhorst (1620-95) (RKD). Ook Johan Hendrik Schoenfeldt
  portretteerde hem in Italië, blijkens het gedicht ‘Op mijn Schildery van Hans Henrik Schoon-veld,
  Hoogduyts Edelm: ende Schilder / die sijn linker-hand / en sijn rechter-oog alleen tot sijn
  wil had / gemaekt in’t lest van Octob: 1649. Nae dat ik drie-mael in Holland, ende eens
  te Romen, van Swart heel slecht was getroffen’.'
correspondentie:
- Een brief aan Constantijn Huygens (1596-1687) (ePistolarium), 1) Madrid, 4 februari 1661.
  Twee brieven van Constantijn Huygens, 1) Den Haag, 14 januari 1660; 2) 17 februari 1661.
- Drie brieven aan Adriaen van Blijenburgh, o.a. uit Parijs en Rome (Van der Merwede 1639-48).
poezie:
- De bundel Uyt-heemsen oorlog ofte Roomse min-triomfen (1651), met circa honderdzestig Nederlandse
  gedichten geschreven in Italië, waaronder 1) ‘Dell’istessa, & ho scritti stiversi fuor ch’il
  fine in su la sponda del Tevere, fuor’ della Porta del Popolo’ (in Rome), 2) ‘Checha mourij,
  à fatto fatta Republica’ (in Rome), 3) ‘Quello che si passó colla mia Checha, nella Vignandi
  Papa Gjulio, fuor’ del popolo’ (over Rome), 4) ‘Dell’istessa’ (over Londen), 5) ‘La mia
  malinconia nel Carnovale dell’anno 1650’ (over Venetië), 6) ‘Sonnet. Op den Tyber, ende
  de Dong’ (over Rome), 7) ‘Een verachting van Roomen’, 8) ‘Wel-levens Leeringen’ (aan Nicolaas
  Heinsius), 9) ‘De Pastey-bakker, naest onse deur alla Fiamma d’oro, ontrent de Post van
  Venetien, zeder het schriklijk overloopen van den Tyber, niet gebakken’ (over Rome), 10)
  ‘Den Vloek van Napels en Napolitanen, hebbende niet uytmuntends onder haer gevonden als
  ongeachte Fransse pokken, en zijnde in’t Quartier van het Popel eens in levens-gevaer geweest,
  ende int’t wederkeeren na Romen, over Zee in handen van 9. Banditen, alle Napolitanen, ontrent
  Nettuno, een Zee-plaetsken, op’t strand’ gevallen; maer door een list en geluk ons besloten
  verderf en dood ontkomen, in de Maend April 1649’ (over Napolitaanse bandieten), 11) ‘Op
  de Guglie of Piramida van Donn’ Olimpia, Swagerinne van Paus Innocent, op-gericht in ‘t
  jaer 1649. op de Piazza Navonna, veel Menschen als doen te Romen van honger stervende’ (over
  Olimpa Maidalchini (1591-1657)), 12) ‘Aen den Adel van Venetien’ (Frans).
- '- Daarnaast mogelijk een gedicht van Joannes Six van Chandelier (1620-95), 1) ‘Seltsaame
  dronkenschap, van V.M.’'
