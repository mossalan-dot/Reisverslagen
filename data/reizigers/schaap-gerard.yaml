  datum: 22 juni 1655
  plaats: Amsterdam
korte_typering: 31 juli 1599 – Amsterdam, 22 juni 1655. Reisde en studeerde in 1622 in Frankrijk
  (23 jaar).
biografie: Maakte tussen 1618 en 1622 een reis naar Italië en Frankrijk, waar hij in Orléans
  het licentiaat behaalde in de rechten. Was raad van Amsterdam tussen 1638 en 1655 en schepen
  in 1638. Maakte in 1644 en 1645 een diplomatieke reis naar Denemarken en Zweden. Maakte
  in 1651 en 1652 een diplomatieke missie naar Engeland in het gezelschap van Jacob Cats (1577-1660)
  en Paulus van der Perre (ca. 1598-1653). De reis werd beschreven door Adriaen Schagen (1633-99),
  Lodewijk Huygens (1631-99) en George de Mey (1628-1712).
reizen_vermeld:
- 1622, Frankrijk; juni 1644-oktober 1645, Denemarken en Zweden; december 1651-juli 1652,
  Engeland.
verslagen_vermeld:
- De Mey 1840, 204-214; Huygens 1651-1652; Schagen 1651-1652; Schagen 1968; Huygens 1982.
addenda:
- Verbalen en tussentijdse verbalen van de gezantschappen, hierboven genoemd (SG 8402-8403;
  8460-8462).
literatuur:
- Elias 1902-1905, I, 415-416.
bronnen:
