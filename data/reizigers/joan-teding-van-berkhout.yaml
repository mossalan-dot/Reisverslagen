biografie: Zoon van Paulus Teding van Berkhout (1608-1672) en Jacomina van der Vorst (1611-1665),
  broer van Pieter (1643-1713). Studeerde geschiedenis en letteren in Leiden. Reisde in 1668
  als edelman mee naar Aken in de ambassade van Hieronymus van Beverningh (1614-1690). Maakte
  in 1672 een tweede reis naar Duitsland. Was achtereenvolgens pensionaris, raad, burgemeester
  en schout van Monnikendam, baljuw en dijkgraaf van Waterland, schout van Katwoude en gedeputeerde
  van de Staten van Holland.
