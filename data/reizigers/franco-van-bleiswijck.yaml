biografie: Zoon van Evert van Bleiswijck (1609-1662) en Sara van der Burch (1619-1692). Studeerde
  filosofie in Leiden. Was raad en burgemeester van Delft. Maakte in 1667 een plezierreis naar
  Den Bosch met Johanna en de rest van de familie Doublet. Ondernam tussen 1669 en 1671 een
  educatiereis naar Frankrijk en Engeland.
