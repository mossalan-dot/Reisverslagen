biografie: Zoon van Johannes Frederik Gronovius (1611-1671) en Aleida ten Nuyl (1619-1656),
  broer van Laurens (1648-1724). Studeerde rechten en klassieke talen in Deventer en Leiden.
  Zette in 1670 zijn studies voort in Oxford en Cambridge en reisde in 1671 naar Parijs. Maakte
  tussen 1672 en 1674 een peregrinatio academica naar Spanje en Italië, aanvankelijk in het
  gevolg van de buitengewone gezant Adriaen Paets (1631-1686). Werd in 1674 op aanbeveling van
  de Florentijnse geleerde Antonio Magliabechi (1633-1714) benoemd tot hoogleraar in de rechtsgeleerdheid
  in Pisa, maar stapte na een geschil op. In 1679 werd hij professor in de geschiedenis en het
  Grieks in Leiden en in 1692 ontving hij daarnaast het domein van de welsprekendheid. Publiceerde
  verschillende filologische werken over de klassieke literatuur, waaronder het twaalfdelige
  Thesaurum Graecarum Antiquitatum (1697-1702).
