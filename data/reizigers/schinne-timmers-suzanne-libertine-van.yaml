id: schinne-timmers-suzanne-libertine-van
naam: Schinne(-Timmers), Suzanne Libertine van
geboren:
  jaar: 1684
  datum: 19 december 1684
  plaats: Rotterdam
overleden:
  jaar: 1732
  datum: 12 december 1732
  plaats: Rotterdam
korte_typering: Rotterdam, 19 december 1684 – Rotterdam, 12 december 1732. Maakte in 1729
  een plezierreis naar de Zuidelijke Nederlanden (44 jaar).
biografie: Dochter van Isaac van Schinne en Aletta de Bitter, moeder van Aletta Johanna (1707-75)
  en Ignatia Geertruida (1714-33). Trouwde in 1703 met Johan Timmers (1684-1738). Maakte in
  1729 een plezierreis naar de Zuidelijke Nederlanden met haar echtgenoot en kinderen, de
  heren Van Bentinck en Van Schoonheeten, de heer Sloterdijck en zoon en de heer Van Baerle
  en dochter.
reizen_vermeld:
- Augustus-september 1729, Zuidelijke Neder-landen.
verslagen_vermeld:
- Timmers 1729.
literatuur:
- Moss 2018, 99-112.
bronnen:
