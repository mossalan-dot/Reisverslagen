korte_typering: 'Maakte in 1684-1686 een reis naar Italië en Jeruzalem. Eerste reis: 01-01-1684
  (26 jaar)'
biografie: Zoon van Joachim Adolf (1627-1686), heer van Rechteren, en Margaretha van Haersolte
  (1628-1682), vrouwe van Westerveld, broer van Adolf Hendrik (1656-1741) en Reinhard (1659-1732).
  Was in 1683 vrijwilliger bij de zeedienst en woonde verschillende tochten bij. Maakte tussen
  1684 en 1686 een reis naar Italië en Jeruzalem. In 1693 werd hij kapitein en in 1694 werd
  hij bevelhebber voor Duinkerken. Streed in 1704 in de zeeslag bij Malaga.
