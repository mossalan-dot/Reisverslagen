korte_typering: Heer van Stavenisse en Rijnhuizen. 1574 – 26 mei 1627. Maakte tussen 1621
  en 1623 een diplomatieke reis naar Engeland (47 jaar).
biografie: Zoon van Philipbert van Tuyll van Serooskerke. Werd lid van de Raad van State in
  1625. Maakte tussen 1621 en 1623 een diplomatieke reis naar Engeland met medegezanten François
  van Aerssen (1572-1641) en Diederick Bas (1569-1637).
