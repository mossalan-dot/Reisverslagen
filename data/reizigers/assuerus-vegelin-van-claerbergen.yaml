korte_typering: 'Maakte in 1707 een plezierreis naar Amsterdam. Eerste reis: 15-06-1707 (20
  jaar)'
biografie: Zoon van Hessel Vegelin van Claerbergen (1655-1715) en Anna Maria van Vierssen (1653-1696),
  broer van Johan (1690-1773), Philip Frederik (1685-1738) en Nehemia (1691-1739). Studeerde
  wiskunde in Franeker. Maakte in 1707 een plezierreis per schip naar Amsterdam met zijn broer
  Johan, Wijnout Leffring en diens vrouw, Anne Bijters en zijn gezien en Geringa en zijn vrouw.
  Was kolonel in een regiment infanterie en volgde in 1739 zijn broer Philip Frederik op als
  grietman van Haskerland.
