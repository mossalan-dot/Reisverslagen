korte_typering: Den Haag, 15 november 1643 – Delft, 5 februari 1713. Maakte in 1658 een reis
  naar Spa (15 jaar).
biografie: Zoon van Paulus Teding van Berkhout (1609-72) en Jacomina van der Vorst (1611-65),
  broer van Joan (1648-1720). Maakte een reis naar Spa in 1658 en reisde naar Breda in 1660
  om Karel II (1630-85) te verwelkomen. Adriaen Schagen (1633-99) schreef een verslag over
  dat ontvangst. Reisde in 1660 naar Frankrijk. Maakte in 1664 een tweede reis naar Frankrijk
  en een tweede diplomatieke reis naar Breda in 1667. Was luitenant en kapitein van de schutterij
  van Delft en trok in 1672 naar Goejanverwellenssluis. Was veertigraad, schepen, weesmeester
  en meermaals burgemeester van Delft.
reizen_vermeld:
- 1658, Spa; mei-juni 1660, Breda; 1660, Frankrijk; juni-najaar 1664, Zuidelijke Nederlanden
  en Frankrijk; 1667, Breda.
verslagen_vermeld:
