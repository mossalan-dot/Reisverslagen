biografie: Zoon van Jean [Jan] van den Branden (1660-1694), heer van Reet, en Anna Catherine
  T’santele (†1708). Groeide op in Kasteel van Laer. Voltooide in 1712 zijn opleiding in kerkelijk
  en burgerlijk recht in Leuven. Werkte als advocaat in Mechelen. Tussen 1713 en 1715 maakte
  hij een educatiereis naar Italië. In 1731 maakte hij een reis naar Engeland en 1736 een reis
  naar Parijs.
