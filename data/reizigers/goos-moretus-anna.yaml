id: goos-moretus-anna
naam: Goos(-Moretus), Anna
geboren:
  jaar: 1627
  datum: 20 september 1627
  plaats: Antwerpen
overleden:
  jaar: 1691
  datum: 30 september 1691
  plaats: Antwerpen
religie: Katholiek
korte_typering: Antwerpen, 20 september 1627 – Antwerpen, 30 september 1691. Katholiek. Maakte
  in 1668 een plezierreis naar de Republiek (41 jaar).
biografie: Dochter van Jacob Goos (1590-1666) en Clara Bosschaert. Echtgenote van Balthasar
  Moretus II (1615-74) en moeder van Balthasar III (1646-96), Joannes Jacobus (1647-1718),
  Franciscus (1656-1705) en Maria Isabella (1655-76). Nam na het overlijden van haar man de
  leiding van zijn Antwerpse drukkerij over. In 1668 maakte zij met haar man en kinderen een
  plezierreis naar Den Bosch, Dordrecht en Zeeland.
reizen_vermeld:
- September 1668, Zuidelijke Nederlanden.
verslagen_vermeld:
- Moretus III 1668; Moretus III 1924.
literatuur:
