overleden:
  jaar: 1715
  datum: 23 augustus 1715
korte_typering: Baron van Reede, heer van de Lier, eerder van Schonauwen. Ca. 1630 – 23 augustus
  1715. Maakte in 1672-73 een geheime zending naar Engeland (42 jaar).
biografie: Zoon van Johan van Reede tot Renswoude (1593-1682) en Jacomina van Eeden. Was kapitein
  en luitenant-kolonel. Bekleedde de functie van kanunnik en raad voor de dom van Utrecht.
  Was in 1672 en 1673 belast met geheime zendingen naar Engeland. In 1674 reisde hij naar
  Londen om te onderhandelen over de Vrede van Westminster samen met collega-diplomaten Coenraad
  van Beuningen (ca. 1622-93), Willem Adriaan van Nassau-Odijck (ca. 1632-1705) en Willem
  van Haren (1626-1708). De reis werd beschreven door Joannes Vollenhove (1631-1708).
reizen_vermeld:
- 1672-73/1674-79/mei-augustus 1703, Enge-land.
verslagen_vermeld:
