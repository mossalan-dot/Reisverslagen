biografie: Zoon van Alexander de Zoete van Laecke (1595-1678) en Adriana van Aerssen (º1595),
  broer van François (1637-1720). Studeerde in Leiden. Maakte tussen 1656 en 1658 een educatiereis
  naar Frankrijk onder leiding van gouverneur Antoine de Brunel (1622-1696), samen met zijn
  broer en neef Cornelis van Aerssen van Sommelsdijk (1637-1688). Was gecommitteerde van de
  Raad van State tussen 1666 en 1675 en 1681 en 1689.
