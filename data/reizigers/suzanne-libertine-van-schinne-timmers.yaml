biografie: Dochter van Isaac van Schinne en Aletta de Bitter, moeder van Aletta Johanna (1707-1775)
  en Ignatia Geertruida (1714-1733). Trouwde in 1703 met Johan Timmers (1684-1738). Maakte in
  1729 een plezierreis naar de Zuidelijke Nederlanden met haar echtgenoot en kinderen, de heren
  Van Bentinck en Van Schoonheeten, de heer Sloterdijck en zoon en de heer Van Baerle en dochter.
