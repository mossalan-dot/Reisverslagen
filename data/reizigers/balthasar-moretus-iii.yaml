biografie: Zoon van Balthasar II Moretus (1615-1674) en Anna Goos (1645-1674), broer van Joannes
  Jacobus (1647-1718), Franciscus (1656-1705) en Maria Isabella (1655-1676). Werd in 1660 naar
  Parijs gestuurd om daar te studeren. Reisde in 1663 naar Ieper, Lille en Doornik met zijn
  vader en broer Joannes Jacobus. Maakte tussen 1664 en 1665 een educatiereis naar Italië in
  het gezelschap van zijn oom Hendrik Hillewerve (1621-1694), Jan Tholinx jr. (1631-1705), Theodoor
  Andries van Kessel en neef Pieter Goos (1645-1708). Begon bij terugkomst te werken in de uitgeverij
  van Plantijn. Maakte in 1668 een plezierreis naar Den Bosch met zijn ouders, broers en zussen.
  Reisde door de Republiek in 1671. Na de dood van zijn vader begeleidde hij zijn moeder met
  de werkzaamheden. Maakte een handelsreis naar Spanje in 1680. Nam de zaak over in 1681. Kreeg
  in 1691 de adellijke titel van jonkheer.
