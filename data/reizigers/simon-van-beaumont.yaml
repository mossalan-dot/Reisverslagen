biografie: Zoon van Herbert van Beaumont en Cornelia van Slingelandt. Studeerde rechten in Leiden
  en Orléans, waar hij promoveerde. Werkte vanaf 1601 als advocaat in Middelburg. Was pensionaris
  van Middelburg tussen 1606 en 1634 en van Rotterdam tussen 1634 en 1649. Maakte in 1627 een
  diplomatieke reis naar Polen en Zweden met medegezanten Andries Bicker (1586-1652) en Rochus
  van den Honert (1572-1638). De reis werd vastgelegd door Abraham Booth (1606-1636). Schreef
  petrarkistische-erotische sonnetten.
