id: jong-agatha-de
naam: Jong, Agatha de
korte_typering: Maakte in 1669 een plezierreis naar Antwerpen en Brussel in het gezelschap
  van haar kinderen, Margaretha Briel (1617-85) en haar kinderen Cornelis (1646-1721), Johanna
  (1643-94) en Cecilia de Jonge van Ellemeet (1645-86).
biografie: 'Jonge van Ellemeet(-Van Bredehoff van Oosthuijzen, Cecilia de. Brielle, 24 januari
  1645 – 14 augustus 1686. Maakte in 1669 een plezierreis naar Antwerpen en Brussel (24 jaar).


  Dochter van Jacob de Jonge van Ellemeet (1601-150) en Magdalena Briel (1617-85), zus van
  Johanna (1643-93) en Cornelis (1646-1721). Maakte in 1669 een plezierreis naar Antwerpen
  en Brussel in het gezelschap van haar moeder, zus en broer, familievriend Agatha de Jong
  en haar kinderen. Trouwde in 1682 met François van Bredehoff van Oosthuijzen (º1641).'
