  beschrijving: 'Deze prent is oorspronkelijk bedoeld als aanvulling op Jan Wagenaars ‘Vaderlandsche
    historie’* en was zo vanaf 1796 verkrijgbaar bij Johannes Allart te Amsterdam. Voor de advertentie
    waarin Allart de 60 portretten en 7 platen, allen gegraveerd door Houbraken, ter aanvulling
    op Wagenaars ‘Vaderlandsche historie’ aanbiedt, zie RP-P-OB-77.766. *Van dit werk zijn in
    de achttiende eeuw meerdere uitgaves verschenen, zoals: Wagenaar, Jan. Vaderlandsche historie,
    vervattende de geschiedenissen der Vereenigde Nederlanden (…). 21 delen. Amsterdam: Isaak
    Tirion, 1749-1759. Wagenaar, Jan. Vaderlandsche historie, vervattende de geschiedenissen
    der nu Vereenigde Nederlanden (…). 21 delen. Amsterdam: weduwe Isaak Tirion, 1770. Wagenaar,
    Jan. Vaderlandsche historie, vervattende de geschiedenissen der nu Vereenigde Nederlanden
    (…). 21 delen. Amsterdam, Leiden, Dordrecht en Harlingen: P. Schouten e.a., 1782. Wagenaar,
    Jan. Vaderlandsche historie, vervattende de geschiedenissen der nu Vereenigde Nederlanden
    (…). 21 delen. Amsterdam: Johannes Allart, 1790-1796.'
