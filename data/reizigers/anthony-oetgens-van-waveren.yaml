biografie: Werd in 1634 aangesteld als lid van de gecommitteerde raden van Holland en het Zuiderkwartier.
  Was gedeputeerde van de Staten-Generaal tussen 1655 en 1658. Maakte een diplomatieke reis
  naar Denemarken en Hamburg in 1631 en 1632, waar hij werd geridderd door keizer Ferdinand
  II (1578-1637). Maakte in 1653 een diplomatieke reis naar Lübeck samen met medegezant Jacob
  de Witt (1589-1674). Arnout Hellemans Hooft (1629-1680) deed kort verslag.
