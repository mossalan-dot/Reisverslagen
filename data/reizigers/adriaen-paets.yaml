biografie: Studeerde rechten in Leiden en werkte als advocaat en notaris. Werd in 1664 vroedschap
  van Rotterdam en in 1668 bewindhebber van de VOC-kamer Rotterdam. Maakte in 1672 een diplomatieke
  reis naar Madrid als ambassadeur van de Staten-Generaal. Jacob Gronovius reisde (1645-1716)
  met hem mee. Werd in 1675 herbenoemd tot vroedschap.
