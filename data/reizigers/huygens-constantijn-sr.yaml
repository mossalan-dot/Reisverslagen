id: huygens-constantijn-sr
naam: Huygens, Constantijn sr.
geboren:
  jaar: 1596
  datum: 4 september 1596
  plaats: Den Haag
overleden:
  jaar: 1687
  datum: 26 maart 1687
  plaats: Den Haag
korte_typering: Heer van Zuilichem. Den Haag, 4 september 1596 – Den Haag, 26 maart 1687.
  Maakte in 1618 een diplomatieke reis naar Engeland (21 jaar).
biografie: 'Zoon van Christiaan Huygens sr. (1551-1624) en Susanna Hoefnagel (1561-1633),
  vader van Constantijn (1628-97), Christiaan (1629-95), Lodewijk (1631-99), Philips (1633-57)
  en Susanna (1637-1725). Studeerde rechten in Leiden en werkte als advocaat. Maakte in 1618
  een reis naar het Engelse hof, waar hij de vorst Jacobus I (1566-25) ontmoette, die hem
  enkele jaren later tot ridder sloeg. In 1620 reisde hij naar Venetië in het gezantschap
  van François van Aerssen (1572-1641). Tussen 1621 en 1624 reisde hij als diplomaat naar
  Engeland in het gezantschap van François van Aerssen, Diederick Bas (1569-1637) en Hendrik
  van Tuyll van Serooskerken (1574-1627). In 1625 werd hij secretaris van Frederik Hendrik
  (1584-1647), een post die hij tot diens dood vervulde. In 1654 inspecteerde hij de landerijen
  van de Oranjes in Luxemburg. In 1656 en 1657 werd hij als gezant naar Brussel gezonden en
  in 1661 naar Parijs samen met zijn zoon Lodewijk. Was eerste raad en rekenmeester van Willem
  III (1650-1702). Had grote belangstelling voor poëzie, muziek en de beeldende kunsten en
  publiceerde verschillende toneelstukken en gedichten.


  Vier Nederlandse en Latijnse gedichten over zijn diplomatieke reizen tussen 1621 en 1624,
  1) ‘Sonnet tot afscheyt, staende opde reyse naer Engelandt, aen heere P.C. Hooft’ (17 januari
  1621, aan P.C. Hooft (1581-1647)); 2) ‘Academiae Oxoniensi perpetuum florere’ (over Oxford);
  3) ‘Muyden, ick kom’; 4) ‘Op een’ mis-luckte Muydsche reyse, vermits het afwesen des heeren
  drossarts Hooft’. Een gedicht van Hooft tijdens deze jaren: ‘Behouden reis, naer Engeland
  door den heere Drossart Hooft, aen mij’.


  Twee Latijnse gedichten over zijn reis naar Frankrijk in 1661, 1) ‘In villam amoenissimam
  d. Hesselini, Essonae, cujus portae insculptum est Parva qvidem, sed’ (27 november 1661,
  over het kasteel van Essone); 2) ‘La mode de roy’ (2 december 1661).


  Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer van Constantijn
  (1628-97), Christiaan (1629-95), Philips (1633-57) en Susanna (1637-1725). Studeerde in
  Breda. Reisde in 1650 naar Duitsland samen met William, graaf van Craven (1608-97) en reisde
  in 1651 en 1652 mee in het gezantschap van Jacob Cats (1577-1660), Gerard Schaap (1599-1654)
  en Paulus van der Perre (ca. 1598-1653). Reisde in 1655 naar Frankrijk met zijn broer Christiaan
  en behaalde in Angers zijn licentiaat. In 1660 en 1661 reisde hij naar Spanje in het gezantschap
  van Johan van Merode (1607-66), Godard Adriaan van Reede van Amerongen (1621-91) en Philips
  Aebinga van Humalda (ca. 1616-74). Bezocht Parijs voor een tweede maal in 1670. In 1672
  werd hij benoemd tot drossard van Gorinchem en het land van Arkel, maar hij werd aangeklaagd
  en veroordeeld voor machtsmisbruik. Was vanaf 1686 gecommitteerde raad van de Admiraliteit
  van de Maas.


  Zes brieven van Christiaan tijdens Lodewijks reis naar Parijs in 1661, 1) Den Haag, 9 juni
  1661; 2) 21 juli; 3) 16 november; 4) 23 november; 5) 30 november; 6) 7 december.


  Elf Franse brieven van Constantijn jr. tijdens Lodewijks reis naar Parijs in 1670, 1) Den
  Haag, 10 april 1670; 2) 17 april; 3) 17 april; 4) 2 mei; 5) 8 mei; 6) 22 mei; 7) 29 mei;
  8) 4 juni; 9) 10 juli; 10) 10 juli; 11) 14 augustus. Een brief van Lodewijk aan Constantijn
  jr., 1) Parijs, mei 1670.'
