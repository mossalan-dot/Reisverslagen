addenda:
- Zie appendix B voor de reis in 1621-24. Verslagen, verbalen en concept-verbalen van zijn
  diplomatieke reizen, hierboven genoemd (SG 8326-8327; 8343-8344).
- Zie appendix B.
correspondentie:
- Zie appendix B. Zestien Nederlandse en Franse brieven tijdens zijn reis naar Engeland in
  1618, van zijn ouders (15) en van zijn oom Maurits Huygens (1595-1642). Circa 156 brieven
  tijdens zijn diplomatieke reis naar Engeland in 1621-24, waaronder negenenzestig brieven
  met zijn ouders, veertien brieven met zijn oom Maurits, veertien brieven met Jacob Cats
  (1577-1660), negen brieven met Daniël Heinsius (1580-1655) en zeven brieven van Dorothea
  van Dorp (1592-1657). Verschillende ambtelijke brieven van zijn reizen in 1656-1757 en 1661.
- Zie appendix B. De reis van Lodewijk in 1650 wordt vermeld in een brief van Christiaan (1629-95)
  aan Constantijn jr. (1628-97), 1) Den Haag, 24 januari 1650 (ePistolarium).
poezie:
- Zie appendix B. Vier Latijnse gedichten over zijn reis naar Engeland in 1618, 1) ‘Ad iuventutum
  Ziriciaeam elegia apologetica (Zierikzee, 31 maart 1618; 2) ‘Constantini Huygens in Angliam
  abituri ad patriam tumultuantem ἀπόταξις’ (25 mei 1618), 3) ‘Coram rege Britanniae cithara
  canturus’ (over zijn ontmoeting met Jacobus I); 4) ‘Constantinus Huygens ex magna Britannia
  redux patriam salutat’.
