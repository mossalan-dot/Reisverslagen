biografie: Dochter van Cornelis Briel (1582-1625) en Cecilia van Beresteyn (1589-1661). Huwde
  in 1643 met Jacob de Jonge van Ellemeet (1601-1650). Maakte in 1669 een plezierreis naar Antwerpen
  en Brussel met haar kinderen Johanna (1643-1693), Cornelis (1646-1721) en Cecilia (1648-1686),
  Agatha de Jong en haar kinderen.
