id: bouttens-van-der-meersch-elisabeth
naam: Bouttens(-van der Meersch), Elisabeth
geboren:
  jaar: 1643
  datum: 26 maart 1643
  plaats: Middelburg
overleden:
  jaar: 1706
  datum: 10 december 1706
  plaats: Amersfoort
religie: Doopsgezind
korte_typering: Middelburg, 26 maart 1643 – Amersfoort, 10 december 1706. Doopsgezind. Vluchtte
  in 1672-73 naar Hamburg (30 jaar).
biografie: 'Dochter van Guilliam Bouttens en Cathalina Daniels. Trouwde in 1666 met Abraham
  van der Meersch (1643-1728). Tijdens het Rampjaar vluchtte ze met haar echtgenoot, haar
  dochters Catharina (1666-1723), Anna (1669-1724) en Sara (†1674) en een groot gedeelte van
  de doopsgezinde gemeenschap van Amsterdam naar Hamburg. In 1687 ondernam ze met haar echtgenoot
  en zonen Arent (1683-1768) en Pieter (º1677) een reis naar Lille.


  Bramer, Leonard [ook: Leonaert; Nestelghat; Leonardo della notte]. Delft, 24 december 1596
  – Delft, februari 1674. Maakte in 1614-28 een kunstenaarsreis naar Frankrijk en Italië (17
  jaar).


  Maakte in 1614 een kunstenaarsreis naar Frankrijk en Italië, waar hij onder andere Arras,
  Amiens, Parijs, Aix-en-Provence, Marseille, Genua, Livorno, Rome, Mantua en Venetië aandeed.
  Hij was een van de eerste Bentvueghels en had de bijnaam ‘Nestelghat’. Kreeg in Italië ook
  de bijnaam ‘Leonardo della Notte’ vanwege zijn vele nachttaferelen. Keerde in 1628 terug
  in Delft en werd toegelaten tot het Sint-Lucasgilde. Werd lid van de schutterij. Maakte
  verschillende fresco’s, muurschilderingen en wandtapijten, onder andere voor Frederik Hendrik
  (1584-1647). Maakte rond 1648 een tweede reis naar Rome.


  Branden, Corneille-Jean-Marie van den [ook: Cornelis Joannes Maria]. Heer van Reet. Antwerpen
  (ZN), 14 augustus 1690 – Mechelen (ZN), 8 februari 1761. Maakte in 1713-1715 een educatiereis
  (23 jaar).


  Zoon van Jean [Jan] van den Branden (1660-94) en Anna Catherine T’santele (†1708). Groeide
  op in Kasteel van Laer. Voltooide in 1712 zijn opleiding in kerkelijk en burgerlijk recht
  in Leuven. Werkte als advocaat in Mechelen. Tussen 1713 en 1715 maakte hij een educatiereis
  naar Italië. In 1731 maakte hij een reis naar Engeland en in 1736 een reis naar Parijs.'
