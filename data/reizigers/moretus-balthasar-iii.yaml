korte_typering: Antwerpen, 24 juli 1646 – Antwerpen, 8 juli 1696. Katholiek. Reisde en studeerde
  in 1660 in Frankrijk (14 jaar).
biografie: Zoon van Balthasar II Moretus (1615-74) en Anna Goos (1627-91), broer van Joannes
  Jacobus (1647-1718), Franciscus (1656-1705) en Maria Isabella (1655-76). Werd in 1660 naar
  Parijs gestuurd om daar te studeren. Reisde in 1663 naar Ieper, Lille en Doornik met zijn
  vader en broer Joannes Jacobus. Maakte tussen 1664 en 1665 een educatiereis naar Italië
  met zijn oom Hendrik Hillewerve (1621-94), Jan Tholinx jr. (1631-1705), Theodoor Andries
  van Kessel en neef Pieter Goos (1645-1708). Begon bij terugkomst te werken in de uitgeverij
  van Plantijn. Maakte in 1668 een plezierreis naar Den Bosch met zijn ouders, broers en zussen.
  Reisde door de Republiek in 1671. Na de dood van zijn vader hielp hij zijn moeder met de
  werkzaamheden. Maakte een handelsreis naar Spanje in 1680. Nam de zaak over in 1681. Werd
  in 1691 jonkheer.
