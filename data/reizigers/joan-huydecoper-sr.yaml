korte_typering: 'Maakte in 1635 een diplomatieke reis naar Polen en Zweden. Eerste reis: 26-04-1635
  (36 jaar)'
biografie: Zoon van Jan Jacobsz. Bal (ca. 1541-1625) en Lijsbeth Gerritsdr. van Gemen (1566-1652).
  Was bewindhebber van de VOC en raad en schepen van Amsterdam. Was zesmaal burgemeester tussen
  1651 en 1660. Maakte een diplomatieke reis naar Polen en Zweden in het gezantschap van Rochus
  van den Honert (1572-1638) en Albert Joachimi (1560-1654) in 1635, waar hij onderhandelde
  over de vrede tussen Polen en Zweden. Werd door Christina van Zweden (1626-1689) in 1637 in
  de ridderstand verheven. In 1655 reisde hij met zijn zoon Joan (1625-1704), Joan Corver (1628-1718)
  en Pieter de Graeff (1638-1707) naar het hof van Brandenburg om te spreken over een bondgenootschap
  tegen Zweden en op te treden als peetoom bij de doop van Karel Emiel (1655-1674), keurvorst
  van Brandenburg.
