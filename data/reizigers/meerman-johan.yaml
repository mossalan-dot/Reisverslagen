  datum: 28 maart 1746
korte_typering: Leiden, 11 juli 1687 – 28 maart 1746. Maakte in 1714 een reis naar Engeland
  (27 jaar).
biografie: Zoon van Gerard Meerman (1650-1710) en Catharina Wijnina van Rijn (ca. 1660-1703).
  Studeerde en promoveerde in de rechten in Leiden. Werkte als advocaat in Leiden en trad
  in 1714 tot het stadsbestuur. Maakte in 1714 een reis naar Engeland met zijn schoonzus Adriana
  de la Court (1696-1748).
reizen_vermeld:
- 1714, Engeland.
literatuur:
- BWN, XII, 495-496.
bronnen:
- gemaakt-op-reis
