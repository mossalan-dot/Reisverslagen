biografie: Zoon van de geleerde Daniël Heinsius (1580-1655) en Ermgard Rutgers (†1633). Schreef
  en publiceerde al op jonge leeftijd Neolatijnse gedichten. Reisde in 1641 en 1642 naar Engeland
  en tussen 1644 en 1647 naar de Zuidelijke Nederlanden, Spa, Frankrijk en Italië, waar hij
  verschillende bibliotheken en geleerden bezocht. In Italië was hij in het gezelschap van Adriaen
  van Blijenburgh (1616-82) en Matthijs van der Merwede (ca. 1625-ca. 1677). Studeerde in Padua
  1647. In 1649 trok hij op verzoek van Christina van Zweden (1626-1689) naar Stockholm, waar
  hij samen met Isaac Vossius (1618-1689) de koninklijke bibliotheek reorganiseerde. Op haar
  verzoek maakten zij tussen 1651 en 1653 een tweede reis naar Italië om handschriften op te
  sporen. Werd in 1654 benoemd tot resident in Stockholm en in 1656 als stadshistoricus in Amsterdam.
  In 1660 werd hij voor een tweede maal resident in Stockholm. Reisde als diplomaat in 1669
  en 1670 naar Moskou en in 1672 naar Oostfriesland en Bremen. Publiceerde als classicus veelvuldig
  over de klassieke literatuur en bereidde uitgaves voor.
