id: rechteren-reinhard-van
naam: Rechteren, Reinhard van
geboren:
  jaar: 1659
overleden:
  jaar: 1732
korte_typering: Heer van Westerveld. 1659 – 1732. Maakte rond 1685 een reis naar Venetië (ca.
  26 jaar).
biografie: Zoon van Joachim Adolf van Rechteren (1627-86) en Margaretha van Haersolte (1628-82),
  broer van Adolf Hendrik (1656-1741) en Johan Willem (1658-1718). Reisde rond 1685 naar Italië
  en trad in dienst bij het leger van de republiek Venetië. Bekleedde verschillende militaire
  functies in de Republiek tussen 1699 en 1727.
reizen_vermeld:
- Ca. 1685, Italië.
addenda:
- Stukken betreffende de indiensttreding in het leger van Venetië (Van Rechteren 1685); kasboekaantekeningen
  in het reisverslag van zijn broer Adolf Hendrik van de reis naar Venetië (Van Rechteren
  1679, [12-13]).
bronnen:
- gemaakt-op-reis
