id: boelen-joost
naam: Boelen, Joost
korte_typering: Geboren in Haarlem rond 1633. Zoon van schoenmaker Pieter Boelen en Martijntje
  Lijbaerts. Werkte als schoenmakersgezel. Maakte tussen 1652 en 1655 een reis naar Duitsland,
  Zwitserland en Frankrijk in het gezelschap van de Haarlemse kunstenaars Vincent Laurensz.
  van der Vinne (1628-1702), Guillaume Dubois (1623-61), Dirck Helmbreeker (1633-96) en Cornelis
  Bega (1631-64). Huwde in 1656 met Trijntje Adriaens Ton. Zijn reisgezel Van der Vinne schreef
  hier een bruiloftsdicht voor (Van der Vinne 1656).
reizen_vermeld:
- 1652-55, Duitsland, Zwitserland en Frankrijk.
verslagen_vermeld:
- Van der Vinne 1652-1655; Stelling-Michaud 1937, 54-72; Van der Vinne 1979.
literatuur:
- Van der Vinne 1979, 28-29.
bronnen:
- gemaakt-op-reis
