id: tassin-dalonne-abel
naam: Tassin d’Alonne, Abel
korte_typering: Ca. 1646-1723. Maakte in 1674 een diplomatieke reis naar Engeland (ca. 28
  jaar).
biografie: 'Zoon van Jeanne de Bommert Silvercron en, zo ging het gerucht, stadhouder Willem
  II (1626-50). Maakte in 1674 als secretaris een diplomatieke reis naar Engeland in het gezantschap
  van Coenraad van Beuningen (ca. 1622-93), Willem Adriaan van Nassau-Odijck (ca. 1632-1705),
  Willem van Haren (1626-1708) en Frederik van Reede tot Renswoude (ca. 1630-1715). De reis
  werd beschreven door Joannes Vollenhove (1631-1708).


  Zoon van Jan Teding van Berkhout (1547-ca. 1633) en Levina Adriaensdr. van Duivendrecht
  (†1601), vader van Volkert (1601-32) en Paulus (1609-72). Studeerde rechten in Leiden. Maakte
  in 1595 een educatiereis naar Frankrijk, waar hij promoveerde in Orléans. Was pensionaris
  en thesaurier van Monnikendam en werd in 1605 rekenmeester van Holland. Werd in 1613 aangesteld
  als lid van de Raad van State en tot raad van het Hof van Holland.'
reizen_vermeld:
- 1674-79/1691/1698, Engeland.
- 1595, Frankrijk.
verslagen_vermeld:
