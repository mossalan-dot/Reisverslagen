id: nassau-justinus-ii-van
naam: Nassau, Justinus II van
korte_typering: Jonker van Nassau, erfheer van Grimhuizen. Den Haag, januari 1633 – Frankrijk,
  1655. Maakte in 1651-55 een educatiereis naar Frankrijk, Italië en Spanje (18 jaar).
biografie: 'Zoon van Willem Maurits van Nassau (1603-38) en Maria van Aerssen van Sommelsdijk
  (†1641). Maakte tussen 1651 en 1655 een educatiereis naar Frankrijk, Italië en Spanje met
  de broers François (1630-58) en Cornelis van Aerssen (1637-88), heer van Sommelsdijk, en
  tutor Antoine de Brunel (1622-96). Stierf op de terugweg in Frankrijk, mogelijk aan de kinderpokken.


  Nassau-Odijck, Willem Adriaan van [ook: Willem Hadriaan]. Heer van Odijk, Kortgene, van
  Zeist en Driebergen. Ca. 1632 – Den Haag, 21 september 1705. Maakte rond 1657 een educatiereis
  naar Frankrijk (ca. 25 jaar).


  Zoon van Lodewijk van Nassau-Beverweerd (1602-65) en Isabella, rijksgravin van Horne (ca.
  1608-64). Studeerde in Parijs en nam dienst bij de cavalerie. Werd in 1668 benoemd als eerste
  edele van Zeeland. Nam deel aan verschillende gezantschappen, waaronder naar Keulen en Nijmegen.
  Maakte in 1674 een diplomatieke reis naar Londen met medegezanten Coenraad van Beuningen
  (ca. 1622-93), Willem van Haren (1626-1708) en Frederik van Reede tot Renswoude (ca. 1630-1715).
  De reis werd beschreven door Joannes Vollenhove (1631-1708).'
