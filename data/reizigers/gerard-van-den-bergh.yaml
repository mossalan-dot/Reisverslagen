biografie: Kwam uit Amsterdam. Maakte tussen 1624 en 1626 een educatiereis naar Frankrijk en
  Italië in het gezelschap van Willem van den Vondel (1603-28), Jacob van Erp (1603-43), Herman
  Swol, Jacob Baeck en A. Moorman. Studeerde in Padua. In een brief van Vondel gaat het om Herman
  van den Bergh. Mogelijk betreft het dezelfde reiziger.
