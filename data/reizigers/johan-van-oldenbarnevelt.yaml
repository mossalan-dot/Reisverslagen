biografie: Zoon van koopman Gerrit van Oudenbarnevelt (1516-1589) en Deliana van Weede (ca.
  1524-1587). Studeerde rechtsgeleerdheid in Leuven, Bourges, Keulen en Heidelberg en Padua.
  Maakte tussen 1566 en 1569 een educatiereis naar Frankrijk, Duitsland, Zwitserland en Italië.
  Studeerde in Heidelberg en Padua. Werd in 1569 advocaat voor het Hof van Holland en sloot
  zich in 1572 aan bij Willem van Oranje (1533-1584) in Delft. Werd in 1576 pensionaris van
  Rotterdam en in 1586 landsadvocaat en raadpensionaris van de Staten van Holland. Maakte in
  1598 een diplomatieke missie naar Engeland, samen met zijn zoon Reinier (1588-1623). Raakte
  in conflict met Maurits van Oranje (1567-1625), werd vervolgd en geëxecuteerd.
