biografie: Zoon van Laurens Schellinks en Catalijntje Cousenaer. Studeerde mogelijk bij Karel
  Dujardin (1626-1678). Maakte in 1646 een kunstenaarsreis naar Frankrijk met Lambert Doomer
  (1624-1700). Werd sterk beïnvloedt door de Italiaanse kunststroming. Reisde tussen 1661 en
  1665 naar Engeland, Frankrijk, Duitsland, Zwitserland en Italië als tutor van de dertienjarige
  Jacques Thierry jr. (1648-1709). Op verzoek van de advocaat Laurens van der Ham (1621-1678)
  maakte hij honderdtwintig topografische tekeningen, waarvan 61 werden opgenomen in zijn Atlas.
