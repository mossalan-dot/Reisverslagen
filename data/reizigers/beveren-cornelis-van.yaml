korte_typering: Heer van Strevelshoek, West-Ysselmonde en de Lindt. Dordrecht, 1591 – Dordrecht,
  17 juli 1663. Arminiaans. Reisde tussen 1612 en 1613 naar Frankrijk, Duitsland en Zwitserland
  (21 jaar).
biografie: Zoon van Willem van Beveren (1556-1631) en Emmerentia van der Eynde (†1632), vader
  van Jacob (1612-76). Reisde tussen 1612 en 1613 naar Frankrijk, Zwitserland en Duitsland
  samen met Gaspar van Kinschot (1592-1654), Van Blockhusen en Wouter van Clootwijck. Behaalde
  in Orléans zijn licentiaat in de rechten. Tussen 1618 en 1642 was hij rentmeester-generaal
  van Zuid-Holland en later dijkgraaf van Hendrik-Ido-Ambacht. Was tussen 1627 en 1650 meermaals
  schepen en burgemeester van Dordrecht. Werd in 1635 door Lodewijk XIII (1601-43) geridderd
  in de orde van St.-Michiel. Ondernam als ambassadeur missies naar Denemarken en Hamburg
  en Engeland. Schreef naar verluid de niet-overgeleverde tragedie Mithridates en de ‘Reize’,
  een gedicht op zijn diplomatieke missie naar Neurenberg.
reizen_vermeld:
- April 1612-oktober 1613, Zuidelijke Nederlanden, Frankrijk en Zwitserland; augustus 1631-februari
  1632, Duitsland en Denemarken; maart 1636-augustus 1637, Engeland.
