id: wangenheim-jacob-von
naam: Wangenheim, Jacob von
korte_typering: Was in 1645 kapitein. Begeleidde Enno Lodewijk (1632-60), graaf van Oost-Friesland,
  op zijn educatiereis naar Frankrijk en Zwitserland. Werd in 1650 vervangen door Levin Claus
  Moltke.
biografie: 'Wassenaer van Obdam, Jacob Emmery van [ook: Wassenaer van Duivenvoorde]. Heer
  van Zuid-Waddinxveen. 1674 – 26 november 1724. Maakte in 1693-95 een educatiereis naar Italië
  (18 jaar).


  Zoon van Jacob van Wassenaer (1646-1707) en barones Jacoba van Liere. Was magistraat van
  Leiden. Was hoofdman van de schutterij en tussen 1701 en 1724 schepen, veertigraad en burgemeester.
  Maakte tussen 1693 en 1695 een educatiereis naar Italië met tutor Laurens Gronovius (1648-1724),
  Andries Bicker van Swieten (1670-96), Jan Pieter Alderwerelt (º1663) en Keyser uit Lüneburg.'
reizen_vermeld:
- 1646, Frankrijk; 1649-50, Genève.
- November 1693-april 1695, Duitsland, Oostenrijk, Italië en Tsjechië.
verslagen_vermeld:
- Huygens 1649-1650; Huygens 1888, 87-162.
- Gronovius 1693-1695.
correspondentie:
- Zes brieven van Juliana van Hessen-Darmstadt (1606-60) aan Constantijn Huygens sr. (1597-1687)
  over Enno Lodewijk, 1) Aurich, 30 maart 1649; 2) 7 april; 3) Sandhorst/Aurich, 22 september;
  4) Sandhorst, 17 januari 1650; 5) 31 januari; 6) 28 februari (ePistolarium).
literatuur:
