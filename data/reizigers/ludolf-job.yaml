id: ludolf-job
naam: Ludolf, Job
naamsvarianten:
- Ludolff, Hiob
- Leutholf, Job
religie: Katholiek
korte_typering: Erfurt (D), 15 juni 1624 – Frankfurt am Main (D), 8 april 1704. Katholiek.
  Reisde in 1646-48 naar Frankrijk en Engeland (22 jaar).
biografie: Studeerde in Erfurt en Leiden en specialiseerde zich in Oosterse talen. Werkte
  als oriëntalist en publiceerde verschillende wetenschappelijke werken. Reisde tussen 1646
  en 1648 naar Frankrijk en Engeland in het gezelschap van Johan Thijs (1621-53). Trad in
  1648 in dienst als tutor van de kinderen van baron van Rosenhahn, de Zweedse gezant in Parijs,
  en reisde op verzoek van Christina van Zweden (1626-89) naar Rome, waar hij zich toelegde
  op het Ethiopisch. Was tussen 1652 en 1678 in dienst als secretaris, tutor en raadsman van
  hertog Ernst I van Saksen-Gotha (1601-75). Vergezelde in 1673 prins Albert van Gotha op
  diens reis door Noord-Europa. Publiceerde onder andere Sciagraphia historiae aethiopicae
  (1676) en Historia aethiopica (1681). Ondernam in 1683 en 1684 een reis naar de Republiek,
  Engeland en Frankrijk om te lobbyen voor handelscontact met Ethiopië. Werd in 1690 aangesteld
  als president van het Collegium Imperiale Historicum in Frankfurt.
reizen_vermeld:
- Oktober 1646-mei 1648, Frankrijk en Engeland; najaar 1648-49, Frankrijk, Italië en Zweden;
  1673, Noord-Europa; 1683-84, Republiek, Engeland en Frankrijk.
verslagen_vermeld:
- Thijs 1646-1648; De Jonge 1975, 32-73.
correspondentie:
- Zes brieven tijdens zijn reis in 1683-84. Vier brieven aan Isaac Vossius (1618-89), 1) Londen,
  29 september 1683; 2) 29 september; 3) 27 oktober; 4) 27 oktober. Twee brieven aan Elias
  Ashmole (1617-92), 1) Londen, 24 oktober 1683; 2) Parijs, 21 december (EMLO).
literatuur:
- BWN, XI, 704-708; Fellman 2012a, 377-380; Waterman 1978, 3-11; Tubach 1993, 317-325; Fellman
  2002b, 207-221.
bronnen:
- gemaakt-op-reis
