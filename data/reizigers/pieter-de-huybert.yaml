biografie: Zoon van Anthony Anthonisz. de Huybert (ca. 1585-ca. 1630) en Johanna Haecx (º1591).
  Studeerde in Leiden en werd in 1655 aangesteld als extraordinaris ambassadeur in het gezantschap
  naar de Zweedse koning. Maakte een diplomatieke reis naar Polen in 1656 samen met medegezanten
  Govert van Slingelandt (1623-1690), Frederik van Dorp (1612-1679) en Johan Isbrandtsz (1621-1702).
  Adriaen Schagen (1633-1699) deed verslag van de reis. Was onderdeel van meerdere diplomatieke
  missies, onder andere naar Zweden in 1659. Werd in 1659 benoemd tot secretaris van de Staten
  van Zeeland en bekleedde tussen 1664 en 1687 de post van raadpensionaris van Zeeland. Onderhandelde
  tijdens de Vrede van Breda in 1667.
