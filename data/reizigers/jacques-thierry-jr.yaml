biografie: Zoon van Jacques Thierry sr. (1604-1677) en Maria van Rijn (º1609). Maakte tussen
  1661 en 1665 een educatiereis naar Engeland, Frankrijk, Duitsland, Zwitserland, Italië en
  Malta met zijn tutor Willem Schellinks (1623-1678). Bestuurder van het Oude Mannenhuis en
  Oude Vrouwenhuis in Amsterdam tussen 1682 en 1690.
