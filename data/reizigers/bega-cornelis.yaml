id: bega-cornelis
naam: Bega, Cornelis
korte_typering: Haarlem, november 1620 – Haarlem, 27 augustus 1664. Maakte in 1652-53 een
  kunstenaarsreis naar Duitsland en Frankrijk (32 jaar).
biografie: Zoon van de edelsmid Pieter Jansz. Begeyn en Maritge, dochter van de schilder Cornelis
  Cornelisz (1562-1638). Was werkzaam als schilder, tekenaar en etser. Leerling van Adriaen
  van Ostade (1610-85). Ondernam tussen 1652 en 1653 een kunstenaarsreis naar Duitsland, Frankrijk
  en Zwitserland in het gezelschap van de Haarlemse schilders Vincent Laurensz. van der Vinne
  (1628-1702), Guillaume Dubois (1623-64) en Dirck Helmbreeker (1633-96) en de schoenmakersgezel
  Joost Boelen (ºca. 1633). Van der Vinne hield een verslag bij. Maakte verschillende tekeningen
  onderweg. Trad in 1654 toe tot het schildersgilde van Haarlem.
reizen_vermeld:
- Augustus 1652-juni 1653, Duitsland, Frankrijk en Zwitserland.
verslagen_vermeld:
- Van der Vinne 1652-1654; Stelling-Michaud 1937, 54-72; Van der Vinne 1979.
addenda:
- Verschillende schilderijen en tekeningen (RKD).
literatuur:
- BWN, II, 265-266; NNBW, II, 114-115; RKD; Begheyn 1979, 270-278; Van Thiel-Stroman 2006,
  100-102.
bronnen:
