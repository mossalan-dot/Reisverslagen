id: kieft-andries
naam: Kieft, Andries
korte_typering: Studeerde in Utrecht in 1645. Reisde tussen 1649 en 1651 naar Italië, gedeeltelijk
  in het gezelschap van Arnout Hellemans Hooft (1629-80), Reyer Anslo (1626-69), Rombout (1620-79)
  en Joannes Hudde (1628-1704), Blom, Ooms en zijn neef IJsbrand Kieft. Promoveerde in Padua
  in augustus 1650.
reizen_vermeld:
- September 1649-ca. 1651, Duitsland, Oostenrijk, Italië.
verslagen_vermeld:
- Hellemans Hooft 1649-1651; Hellemans Hooft 2001.
literatuur:
- Frank-van Westrienen 1983, 142; Poelhekke en Hoogewerff 1961, 332.
bronnen:
- gemaakt-op-reis
