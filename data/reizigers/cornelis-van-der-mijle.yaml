korte_typering: 'Maakte in 1597-1603 een educatiereis naar Frankrijk en Italië. Eerste reis:
  01-01-1597 (18 jaar)'
biografie: Zoon van Adriaan van der Myle en Magdalena van Egmond van de Nijenburg. Studeerde
  in Leiden en maakte tussen 1597 en 1603 een educatiereis naar Frankrijk, Italië en Duitsland.
  Studeerde rechten in Padua in 1599.Werd raad van prins Maurits (1567-1625) en lid van de ridderschap
  van Holland. Trad in het huwelijk met Maria Johanna (1582-1657), dochter van Johan van Oldenbarnevelt
  (1547-1619), en wist door die verbintenis verschillende hoge posities te bekleden. Vergezelde
  Van Oldenbarnevelt naar Bergen op Zoom en Antwerpen in 1603 om het Bestand te sluiten. Werd
  benoemd tot buitengewoon gezant in Venetië en begeleidde Willem van Oldenbarnevelt (1590-1634)
  tijdens diens reis door Italië in 1609 en 1610. Reisde in 1610 als gezant naar Frankrijk.
  Was ambassadeur in Venetië en Parijs, hoogheemraad van Schieland en curator van de Leidse
  universiteit. Werd na de berechting van Van Oldenbarnevelt verbannen uit de Republiek.
