korte_typering: Amsterdam, 11 februari 1624 – Amsterdam, 2 juli 1700. Maakte in 1646 een kunstenaarsreis
  naar Frankrijk (ca. 22 jaar).
biografie: 'Zoon van Herman Doomer (ca. 1595-1650) en Baertje Martens. Voltooide rond 1640
  zijn opleiding tot meubelmaker bij zijn vader en ging vervolgens waarschijnlijk in de leer
  bij Rembrandt van Rijn (1606-69). Maakte in 1646 een reis naar Frankrijk en Engeland, deels
  in gezelschap van medekunstenaar Willem Schellinks (1623-78). Ondernam een tweede reis naar
  Duitsland en Zwitserland in 1663. Maakte verschillende tekeningen.


  Officier in Staatse dienst. Klom op tot de positie van kwartiermeester-generaal en luitenant-generaal.
  Verdedigde de Republiek tijdens de Spaanse Successieoorlog. Reisde in 1707 naar Duitsland
  en Oostenrijk.'
reizen_vermeld:
