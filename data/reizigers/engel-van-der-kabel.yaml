korte_typering: 'Maakte in 1660-1668 een kunstenaarsreis naar Italië. Eerste reis: 01-01-1660
  (19 jaar)'
biografie: Zoon van Cornelis Jansz. van der Kabel en Maertje Philipsdr. Maakte tussen 1660 en
  1668 een kunstenaarsreis naar Rome samen met zijn broer Adriaan (ca. 1630-1705). Trad net
  als zijn broer toe tot de Bentvueghels en kreeg de bijnaam ‘Corydon’. Vestigde zich samen
  met zijn broer in Lyon, waar hij meermaals bestuurslid van het kunstenaarsgilde werd.
