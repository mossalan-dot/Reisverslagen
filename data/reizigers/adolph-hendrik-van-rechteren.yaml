korte_typering: 'Maakte in 1679 een educatiereis naar Frankrijk. Eerste reis: 31-03-1679 (23
  jaar)'
biografie: Zoon van Joachim Adolf (1627-1686), heer van Rechteren, en Margaretha van Haersolte
  (1628-1682), vrouwe van Westerveld, broer van Johan Willem (1658-1718) en Reinhard (1659-1732).
  Maakte in 1679 een educatiereis naar Frankrijk. Was drost van Vollenhove, Twente en Salland
  en afgevaardigde van de Staten-Generaal. Maakte verschillende diplomatieke reizen naar Duitsland
  en Oostenrijk.
