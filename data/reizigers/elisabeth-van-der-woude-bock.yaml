korte_typering: 'Reisde in 1676-1677 naar Frans-Guyana. Eerste reis: 01-08-1676 (19 jaar)'
biografie: Dochter van Herman Hartman van der Woude (1621-1677) en Margarita Blaeuhulck (1621-1662).
  Reisde in 1676 en 1677 samen met haar vader, broer Johannes (º1658) en zus Margaretha (1661-1687)
  naar Frans-Guyana, waar haar vader gouverneur zou worden. Werd ontvoerd door Duinkerker kapers
  onder bevel van kaperkapitein Jean Bart en werd uiteindelijk bij Bergen in Noorwegen overgedragen
  aan een Nederlandse visser. Trouwde in 1684 met de wijnkoper Adolf Frederick Bock (†1700).
