korte_typering: Heer van Zeelhem. Den Haag, 14 april 1629 – Voorburg, 8 juli 1695. Maakte
  in 1649 een reis naar Denemarken (20 jaar).
biografie: 'Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Constantijn (1628-97), Lodewijk (1631-99), Philips (1633-57) en Susanna (1637-1725).
  Studeerde rechten en wiskunde in Leiden en zette zijn studie voort in Breda. Was een vooraanstaande
  wiskundige, natuurkundige en deed verschillende wetenschappelijke uitvindingen en ontdekkingen,
  waaronder de uitvinding van het slingeruurwerk. Publiceerde verschillende wetenschappelijke
  werken. Trad in 1649 op als secretaris van graaf Hendrik van Nassau-Siegen (1611-52) tijdens
  diens reis naar Denemarken. Reisde in 1655 naar Frankrijk met zijn broer Lodewijk, waar
  hij zijn licentiaat behaalde in Angers. Reisde naar Frankrijk en Engeland tussen 1660 en
  1661 en bezocht Londen in 1663. Kreeg in 1666 een positie aan de Académie Française en verbleef
  in Parijs tot 1681.


  Twintig Franse brieven over zijn reis naar Frankrijk in 1655.


  - Zeven brieven aan Constantijn jr., 1) Parijs, 23 juli 1655; 2) 1 oktober; 3) 22 oktober;
  4) 22 oktober; 5) 29 oktober; 6) 29 oktober; 7) 6 november.


  - Vijf brieven aan zijn vader, 1) Parijs, augustus 1655; 2) 6 augustus; 3) 24 september;
  4) 10 oktober; 5) 26 november.


  - Een brief aan Diderik van Leiden van Leeuwen (1628-82), 1) Parijs, 1 oktober 1655.


  - Vijf brieven van Constantijn, 1) Den Haag, 12 augustus 1655; 2) 2 september; 3) 23 september;
  4) Voorburg, 14 oktober; 5) 28 oktober.


  - Een brief van Valentin Conrart (1603-75) aan Christiaan Huygens, 1) Parijs, 30 november
  1655.


  - Een brief van Gottfried Aloys Kinner van Löwenthurn (º1610), 1) Wroclaw (P), 11 november
  1655.'
