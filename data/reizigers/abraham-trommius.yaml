korte_typering: 'Maakte in 1655-1657 een educatiereis naar Frankrijk, Zwitserland en Engeland.
  Eerste reis: 01-04-1655 (22 jaar)'
biografie: Studeerde filosofie, letteren en theologie in Groningen. Maakte tussen 1655 en 1657
  een educatiereis naar Duitsland, Zwitserland, Frankrijk, Engeland en de Zuidelijke Nederlanden
  met Louis Wolzogen de Meningstorf (1631-1690) en Johannes Hotton. Hij bezocht onder andere
  Keulen, Heidelberg, Bazel, Genève, Nîmes, Montpellier, Bordeaux, het Loiregebied, Parijs,
  Londen en Oxford. Was predikant in Haren en Groningen vanaf 1657 en schreef verschillende
  theologische werken, waaronder de concordantie op de Statenvertaling (1672-1691). Schreef
  over zijn reis in zijn autobiografie. Ontving in 1717 een eredoctoraat van Groningen.
