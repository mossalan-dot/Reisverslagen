biografie: Zoon van Hessel Vegelin van Claerbergen (1655-1715) en Anna Maria van Vierssen (1653-1696),
  broer van Philip Frederik (1685-1738), Assuerus (1687-1771) en Johan (1690-1773). Was grietman
  van Haskerland. Studeerde rechten en promoveerde in Leiden. Werd raadsheer in Raad en Leenhof
  van Staats-Brabant en de landen van Overmaze. Maakte tussen 1718 en 1720 een educatiereis
  naar Frankrijk, Spanje, Italië, Zwitserland en Duitsland.
