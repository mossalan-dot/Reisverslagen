id: lintelo-johanna-agnes-van
naam: Lintelo, Johanna Agnes van
korte_typering: †1696. Maakte in 1690 een reis van Madrid naar de Republiek.
biografie: Dochter van Johan van Lintelo (1603-52) en Agnes Reininza van Schele (1610-82).
  Trouwde met Pieter Battier (1637-90), buitengewoon gezant in Spanje. Maakte in 1690 een
  reis van Madrid naar Holland om het stoffelijk overschot van haar man over te brengen.
reizen_vermeld:
- '1690: Spanje, Republiek.'
addenda:
- Aantekenboek, met losse aantekeningen en brieven (Van Lintelo 1690).
literatuur:
- Sanders 2013, 91-92
bronnen:
