biografie: Zoon van Jan Six en Anna Wymer. Maakte tussen 1641 en 1643 een educatiereis naar
  Frankrijk. Was schepen, raad van de vroedschap en in 1691 burgemeester van Amsterdam. Was
  een groot kunstverzamelaar en mecenas. Publiceerde onder andere het treurspel Medea (1648)
  en het blijspel Onschuld (1654).
