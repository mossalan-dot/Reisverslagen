korte_typering: 'Maakte in 1614-1618 een kunstenaarsreis naar Rome. Eerste reis: 01-01-1614
  (22 jaar)'
biografie: Zoon van de glasschilder Simon Juckesz. en Wyts Wybrantsdr. Ging in de leer bij Abraham
  Bloemaert (ca. 1564-1651) en maakte tussen 1614 en 1618 een kunstenaarsreis naar Frankrijk
  en Italië. Was in Rome lid van de Bentvueghels en kreeg de bijnaam ‘De Friesche Adelaer’.
  Werkte in Leeuwarden aan het hof, waar hij portretten van de Friese stadhouders vervaardigde.
