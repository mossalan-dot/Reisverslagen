korte_typering: 'Maakte in 1668 een reis naar Den Bosch. Eerste reis: 14-09-1668 (12 jaar)'
biografie: Zoon van Balthasar II Moretus (1615-1674) en Anna Goos (1645-1674), broer van Balthasar
  III (1646-1696), Joannes Jacobus (1647-1718) en Maria Isabella (1655-1676). Was priester,
  kanunnik en protonotarius apostolicus in de Onze-Lieve-Vrouwekathedraal van Antwerpen vanaf
  1681. Maakte in 1668 een reis naar Den Bosch met zijn ouders, broers en zussen, maar maakte
  al rechtsomkeert bij het nabijgelegen Scherpenheuvel.
