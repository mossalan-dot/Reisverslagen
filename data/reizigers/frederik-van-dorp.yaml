korte_typering: 'Maakte in 1656-1658 een diplomatieke reis naar Polen en Zweden. Eerste reis:
  03-03-1656 (44 jaar)'
biografie: Zoon van Frederik van Dorp (1547-1612) en Sara van Trello (1583-1648). Studeerde
  rechten in Leiden. Kreeg in 1642 zitting in het Hof van Holland, Zeeland en Westfriesland.
  Reisde tussen 1656 en 1658 met de diplomaten Govert van Slingelandt (1623-1690), Pieter de
  Huybert (1622-1695) en Johan Isbrandtsz (1621-1702) naar Polen en Zweden ter bemiddeling van
  de vrede. De reis werd ook beschreven door Adriaen Schagen (1633-1699). Werd curator van de
  Leidse universiteit en werd in 1670 benoemd tot hoogbaljuw en dijkgraaf van Rijnland. Publiceerde
  stichtelijke poëzie.
