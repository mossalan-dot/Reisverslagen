korte_typering: 'Maakte tussen 1607 en 1613 een educatiereis naar Frankrijk, Engeland en Italië.
  Eerste reis: 01-01-1607 (18 jaar)'
biografie: Zoon van Cornelis de Witt (1545-1622) en Johanna Heijmans (1547-1602), vader van
  Johan (1625-1672) en Cornelis (1623-1672). Studeerde rechten in Leiden en maakte een educatiereis
  naar Duitsland, Frankrijk, Italië en Engeland. Werd in 1618 penningmeester van de Dordtse
  Synode en bekleedde verschillende bestuurlijke ambten, waaronder dat van curator van de Illustere
  School, veertigraad en schepen van Dordrecht en dijkgraaf van Mijnsheerenland. Werd meermaals
  burgemeester van Dordrecht. Reisde in 1644-1645 als ambassadeur naar Denemarken. Reisde in
  1653 als gezant naar Lübeck met Anthony Oetgens van Waveren (1585-1658) en Nicolaas Vivien
  (1631-1692). Arnout Hellemans Hooft (1629-1680) deed kort verslag. Werd op bevel van Willem
  II (1626-1650) gevangengenomen in 1650. Werd in 1657 rekenmeester van de domeinen van Holland.
