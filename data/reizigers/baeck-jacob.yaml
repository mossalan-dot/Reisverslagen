id: baeck-jacob
naam: Baeck, Jacob
korte_typering: Maakte tussen 1624 en 1626 een educatiereis naar Frankrijk en Italië in het
  gezelschap van Willem van den Vondel (1603-28), Jacob van Erp (1603-43), Herman Swol, Gerard
  van den Bergh en A. Moorman.
biografie: 'Bartholotti van den Heuvel, Johannes Baptista Heer van Hoekenburg. Amsterdam,
  ca. 1643 – Amsterdam, 6 januari 1703. Maakte in 1674 een diplomatieke reis naar Engeland
  (31 jaar).


  Zoon van Gullielmo Bartholotti van den Heuvel (1602-58) en Jacoba Aernouts van Erp (1608-65).
  Was dijkgraaf en baljuw van Bijlmermeer en kolonel van het regiment van Amstelveen. Nam
  in januari 1674 de leiding over van het Amsterdamse koopmans- en bankiershuis Bartholotti
  van zijn broer Gullielmo (1638-74). Maakte in datzelfde jaar een diplomatieke reis naar
  Londen in het gezantschap van Coenraad van Beuningen (ca. 1622-93), Willem van Haren (1626-1708),
  Willem Adriaan van Nassau (ca. 1632-1705) en Frederik baron van Reede tot Renswoude (ca.
  1630-1715). De reis werd beschreven door predikant Joannes Vollenhove (1631-1708). Zijn
  zus Jacoba Victoria (1639-1718) trouwde later met de missieleider Van Beuningen.'
reizen_vermeld:
