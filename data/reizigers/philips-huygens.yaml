korte_typering: 'Maakte in 1656 een diplomatieke reis naar Zweden en Polen. Eerste reis: 03-03-1656
  (23 jaar)'
biografie: Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Constantijn (1628-1697), Christiaan (1629-1695), Lodewijk (1631-1699) en Susanna (1637-1725).
  Reisde in 1656 naar Polen en Zweden in het gezantschap van Govert van Slingelandt (1623-1690),
  Frederik van Dorp (1612-1679), Pieter de Huybert (1622-1695) en Johan Isbrandtsz (1621-1702).
  De reis wordt beschreven door Adriaen Schagen (1633-1699). Stierf onderweg.
