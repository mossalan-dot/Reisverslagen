biografie: Zoon van Reynier Pauw en Cornelia Michielsdr. de Lange. Studeerde rechten in Leiden.
  Was koopman in Amsterdam en bekleedde tussen 1611 en 1627 het pensionarisschap van de stad.
  Was tussen 1618 en 1641 bewindhebber van de VOC en vanaf 1631 raadpensionaris van Holland.
  Was tussen 1627 en 1652 rekenmeester van Holland en West-Friesland. Maakte verschillende diplomatieke
  reizen, waaronder naar het hof van Denemarken in 1618, samen met de jonge Constantijn Huygens
  (1596-1687), Frankrijk in 1621 en 1624 en Engeland in 1627. Reisde in februari en maart 1649
  naar Engeland in het gezelschap van Constantijn Huygens jr. (1628-1697). Droeg bij aan de
  Vrede van Münster. Werd in 1613 geridderd door Jacobus I (1566-1625) en werd door Lodewijk
  XIII (1601-1643) geridderd in de orde van St. Michiel in 1624.
