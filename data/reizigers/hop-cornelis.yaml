korte_typering: Amsterdam, 3 juni 1685 – Amsterdam, 14 juli 1762. Reisde in 1702 door de Republiek
  (17 jaar).
biografie: Zoon van de Amsterdamse pensionaris Jacob Hop (1654-1725) en Isabella Maria Hooft
  (1659-1701). Reisde in 1702 en 1703 met zijn vader door de Republiek en vergezelde in 1707
  luitenant-generaal Daniël van Dopff (ca. 1655-1718) tijdens diens reis naar Duitsland en
  Oostenrijk. Reisde in 1711 naar Duitsland en Denemarken. Werd in 1715 bewindhebber van de
  WIC en in 1720 directeur van de Sociëteit van Suriname. Was tussen 1718 en 1725 ambassadeur
  in Frankrijk. Bekleedde verschillende bestuurlijke posities in Amsterdam, waaronder die
  van schepen, raad en burgemeester (tussen 1653 en 1762).
reizen_vermeld:
- Augustus 1702, Utrecht, Gelderland en Overijssel; juli-september 1703, Zeeland en Gelderland;
  januari-maart 1707, Duitsland en Oostenrijk; juli-oktober 1711, Duitsland en Denemarken;
  oktober 1718-december 1725, Frankrijk; juni 1728-april 1731, Frankrijk.
