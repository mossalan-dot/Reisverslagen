biografie: Studeerde in Erfurt en Leiden en specialiseerde zich in Oosterse talen. Werkte als
  oriëntalist en publiceerde verschillende wetenschappelijke werken. Reisde tussen 1646 en 1648
  naar Frankrijk en Engeland in het gezelschap van Johan Thijs (1621-1653). Trad in 1648 in
  dienst als tutor van de kinderen van baron van Rosenhahn, de Zweedse gezant in Parijs, en
  reisde op verzoek van Christina van Zweden (1626-1689) naar Rome, waar hij zich toelegde op
  het Ethiopisch. Was tussen 1652 en 1678 in dienst als secretaris, tutor en raadsman van hertog
  Ernst I van Saksen-Gotha (1601-1675). Vergezelde in 1673 prins Albert van Gotha op diens reis
  door Noord-Europa. Publiceerde onder andere Sciagraphia historiae aethiopicae (1676) en Historia
  aethiopica (1681). Ondernam in 1683 en 1684 een reis naar de Republiek, Engeland en Frankrijk
  om te lobbyen voor handelscontact met Ethiopië. Werd in 1690 aangesteld als president van
  het Collegium Imperiale Historicum in Frankfurt.
