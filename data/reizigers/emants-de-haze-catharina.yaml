id: emants-de-haze-catharina
naam: Emants(-de Haze), Catharina
geboren:
  jaar: 1715
overleden:
  jaar: 1782
  datum: 2 maart 1782
korte_typering: 1715 – 2 maart 1782. Maakte in 1748 een plezierreis naar Den Haag (33 jaar).
biografie: Dochter van Johan Emants (1678-1742) en Sara Marie Bruinstein (ca. 1674-1763).
  Trouwde met Elias de Haze (1689-1752) en hertrouwde na diens dood met Daniël Livius van
  Andringa de Kempenaer (1713-72). In 1748 maakte zij een plezierreis naar Den Haag in het
  gezelschap van haar echtgenoot, de families Thibaut en Bomme en Cornelia Carolina de Vassy.
reizen_vermeld:
- Juni 1748, Bergen op Zoom.
verslagen_vermeld:
- De Vassy 1748; De Vassy 2017.
bronnen:
- gemaakt-op-reis
