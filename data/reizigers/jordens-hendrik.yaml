korte_typering: Deventer, 1663 – Deventer, 1715. Maakte in 1684-85 een educatiereis naar Engeland,
  Frankrijk en Zwitserland (21 jaar).
biografie: Zoon van burgemeester Joan Jordens (1639-93) en Geertruid Steenbergen. Maakte in
  1684 en 1685 een educatiereis naar Engeland, Frankrijk, Zwitserland en Duitsland in het
  gezelschap van zijn neef Antoni Eeckholt. Werd in 1685 stadsecretaris van Deventer en in
  1693 griffier van de Gedeputeerde Staten van Overijssel. Later bekleedde hij het ambt van
  ontvanger-generaal van Twente.
