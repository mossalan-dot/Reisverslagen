id: lieshoud-johannes
naam: Lieshoud, Johannes
korte_typering: Amsterdam, november 1628 – Amsterdam, februari 1663. Reisde in 1652 naar Italië
  (23 jaar).
biografie: Zoon van de boekdrukker François Lieshoud en Sara Lieshoud. Maakte in 1652 een
  educatiereis naar Duitsland, Oostenrijk en Italië met Nicolaas Langendeijk.
reizen_vermeld:
- April 1652-najaar 1652, Duitsland, Oostenrijk en Italië.
verslagen_vermeld:
- Lieshoud 1652; Lieshoud 2005.
literatuur:
- Lieshoud 2005, 1-53.
bronnen:
