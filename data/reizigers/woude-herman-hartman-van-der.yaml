id: woude-herman-hartman-van-der
naam: Woude, Herman Hartman van der
geboren:
  jaar: 1621
  datum: 25 juli 1621
  plaats: Munnikenland
overleden:
  jaar: 1677
  datum: 8 januari 1677
  plaats: Santiago (RK)
korte_typering: Munnikenland, 25 juli 1621 – Santiago (RK), 8 januari 1677. Reisde in 1676-77
  naar Frans-Guyana (55 jaar).
biografie: Echtgenoot van Margarita Blaeuhulck (1621-62), vader van Elizabeth (1657-98), Johannes
  (º1658) en Margaretha (1661-77). Was in 1646 hoofdofficier en dijkgraaf van de Nieuwdorper
  Koggen en werd in 1673 schout van Opmeer. Werd in 1676 aangesteld door de Staten van Holland
  als gouverneur van de Nederlandse kolonie aan de Oyapock in Frans-Guyana. Reisde in 1676
  en 1677 samen met zijn kinderen naar Frans-Guyana, maar overleed onderweg op het Kaapverdische
  eiland Santiago. Werd vanwege zijn protestantisme heimelijk begraven.
reizen_vermeld:
- December 1676-januari 1677, Santiago (RK).
verslagen_vermeld:
- Van der Woude 1676-1677; Van der Woude 1928, 214-236; Van der Woude 2001.
literatuur:
- NNBW, III, 1490; DVL; LSD; Van der Woude 2001; Barend-van Haeften 2005, 91-98.
