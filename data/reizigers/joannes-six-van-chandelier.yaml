korte_typering: 'Maakte in 1649-1651 een reis naar Frankrijk en Italië. Eerste reis: 01-01-1649
  (29 jaar)'
biografie: Zoon van Jacob Six (1593-1639) en Sara Juliens (1596-1669). Bezocht de Latijnse school
  en nam zijn vaders winkel over in Amsterdam. Om handelsbelangen te behartigen reisde hij in
  1649 naar Zuid-Europa samen met Abraham Grenier (1626-1660). Hij reisde naar Parijs, Toulouse
  en Bayonne en bezocht in Spanje Madrid, Cádiz en Granada. In 1650 ging hij scheep in Alicante
  en arriveerde in Genua, vanwaar hij naar Florence, Rome, Napels en Venetië trok. In 1651-1652
  maakte hij een tweede reis naar Italië, ditmaal naar Venetië. In Italië had hij contact met
  de Bentvueghels. Ergens tussen 1652 en 1657 bezocht hij Duitsland. In april 1654 reisde hij
  met Grenier naar Engeland en in 1655 maakte hij een tweede reis. In de zomer van 1656 verbleef
  hij negen weken in Spa. In 1657 publiceerde hij zijn bundel Poësy en in 1674 zijn psalmberijming.
