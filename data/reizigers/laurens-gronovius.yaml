biografie: Zoon van Johannes Frederik Gronovius (1611-1671) en Aleida ten Nuyl (1619-1656),
  broer van Jacob (1645-1716). Studeerde geschiedenis en rechten in Leiden. Promoveerde in 1675
  in Franeker en werkte als advocaat voor het Hof van Holland. Maakte tussen 1679 en 1682 een
  peregrinatio academica naar Frankrijk en Italië, waar hij in de bibliotheken werkte aan wetenschappelijke
  publicaties voor zijn broer en zichzelf. Reisde tussen 1693 en 1695 naar Italië als tutor
  van Andries Bicker van Swieten (1670-1696), baron Jacob Emmery van Wassenaar van Obdam (1672-1724),
  Jan Pieter Alderwerelt en Keyser uit Lüneburg. Publiceerde verschillende werken, maar wist
  geen universitaire positie te bemachtigen.
