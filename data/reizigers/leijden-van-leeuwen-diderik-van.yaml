  datum: 23 mei 1682
korte_typering: Brielle, 1628 – 23 mei 1682. Maakte in 1679 een diplomatieke reis naar Engeland
  (51 jaar).
biografie: Was lid van de vroedschap van Brielle en burgemeester van Leiden. Werd in 1678
  als gezant naar Engeland gezonden om over de vrede te onderhandelen samen met Coenraad Ruysch
  (1650-1731).
reizen_vermeld:
- 1678-82, Engeland.
correspondentie:
- Een brief van Constantijn Huygens (1596-1687), 1) Den Haag, 1 juni 1679 (ePistolarium).
literatuur:
- BWN, XI, 265-266; RAA.
bronnen:
- gemaakt-op-reis
