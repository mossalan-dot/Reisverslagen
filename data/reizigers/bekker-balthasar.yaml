naam: Bekker, Balthasar
geboren:
  jaar: 1634
  datum: 20 maart 1634
  plaats: Metslawier
overleden:
  jaar: 1698
  datum: 11 juni 1698
  plaats: Amsterdam
korte_typering: Metslawier, 20 maart 1634 – Amsterdam, 11 juni 1698. Maakte in 1683 een reis
  naar Engeland en Frankrijk (49 jaar).
biografie: Zoon van Henricus Bekker. Studeerde theologie in Groningen en Franeker. Predikte
  achtereenvolgens in Oosterlittens, Franeker, Loenen en Weesp en week in 1679 uit naar Amsterdam.
  Reisde in 1683 naar Engeland en Frankrijk. Schreef meerdere boeken, waaronder Onderzoek
  van de betekeninge der kometen (1683) en het vierdelige De betoverde wereld (1691-93), waarin
  hij zich fel uitliet tegen bijgeloof en heksenvervolging. Werd in 1692 afgezet als predikant,
  maar bleef werkzaam in Amsterdam.
reizen_vermeld:
- Juli-september 1683, Engeland, Frankrijk, Zuidelijke Nederlanden.
verslagen_vermeld:
- Bekker 1683; Bekker 1998.
literatuur:
