biografie: Zoon van Pieter de la Court sr. (1593-1657) en Johanna des Planques (1595-1663).
  Studeerde rechten in Leiden. Maakte tussen 1641 en 1643 een reis naar Engeland en Frankrijk.
  Promoveerde in de rechten in Orléans en werd advocaat aan het Hof van Holland. Werkte als
  lakenfabrikant in Leiden en was aandeelhouder van de WIC. Publiceerde onder andere het republikeinse,
  anti-orangistische boek Interest van Holland (1662).
