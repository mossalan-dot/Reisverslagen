id: honingh-johannes
naam: Honingh, Johannes
geboren:
  jaar: 1635
overleden:
  jaar: 1692
korte_typering: 1635 – 1692. Maakte in 1662 een reis naar Frankrijk en Zwitserland (27 jaar).
biografie: Magistraat van Middelburg. Maakte in 1662 een reis naar Frankrijk en Zwitserland
  en in 1664 een reis naar Hamburg. Had contacten met Jacob Cats (1577-1660), Daniël Heinsius
  (1620-81) en Christiaan Huygens (1629-95).
reizen_vermeld:
- 1662, Frankrijk en Zwitserland; 1664, Duitsland.
addenda:
- Album amicorum, met inscripties uit o.a. Antwerpen, Parijs, Moulin, Genève, Grenoble, Bazel,
  Sedan, Metz, Calais en Hamburg (Honingh 1654-1685).
literatuur:
- Offerhaus 1990, 85-86.
bronnen:
- gemaakt-op-reis
