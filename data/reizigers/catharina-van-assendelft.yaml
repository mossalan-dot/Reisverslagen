korte_typering: 'Maakte in 1696 een korte plezierreis. Eerste reis: 14-07-1696 (1696 jaar)'
biografie: Dochter van Adriaan Gerrits van Assendelft (1664-1742) en Maria Magdalena van Beresteijn
  (1667-1715). In 1696 maakte zij samen met haar ouders, haar zus Maria, haar tante Maria (1646-1744)
  en oom Willem (†1744) een plezierreisje naar Nijmegen, Kleef en paleis Het Loo.
