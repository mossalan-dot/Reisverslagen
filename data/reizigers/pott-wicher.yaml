id: pott-wicher
naam: Pott, Wicher
naamsvarianten:
- Wicherus
korte_typering: Groningen, oktober 1661 – Groningen, 13 december 1716. Maakte een educatiereis
  naar Engeland, Frankrijk, Italië en Zwitserland tussen 1684 en 1686 (22 jaar).
biografie: Zoon van Pieter Pott (†1691) en Margaretha Froon (ºca. 1635). Studeerde in Leiden.
  Maakte tussen 1684 en 1686 een educatiereis naar Engeland, Frankrijk, Italië, Zwitserland
  en Duitsland. Promoveerde in 1686 in Padua. Zijn verslag, in zijn correspondentie aangeduid
  als de Notula, is zoek. Was ambtsman van het Goorecht, raadsheer in Groningen en lid van
  de Staten-Generaal in 1706 en 1709.
reizen_vermeld:
- Zomer 1684-oktober 1686, Engeland, Frankrijk, Italië, Zwitserland en Duitsland.
correspondentie:
- Zesentwintig Nederlandse brieven. Vijf brieven aan zijn vader en moeder (zaliger), 1) Londen,
  7 juli 1684, 2) 18 juli, 3) 9 augustus, 4) 13 augustus, 5) september. Twintig brieven aan
  zijn vader, 1) Orléans, 18 augustus 1685, 2) 22 augustus, 3) 31 augustus, 4) 27 september,
  5) Agen, 24 oktober, 6) Genua, 18 december, 7) Florence, 5 januari 1686, 8) Rome, 31 januari,
  9) 1 maart, 10) 23 maart, 11) 6 april, 12) 20 april, 13) Venetië, 18 mei, 14) 4 juni, 15)
  28 juni, 16) Turijn, 28 juli, 17) Genève, 20 augustus, 18) Straatsburg, 9 september, 19)
  Frankfurt am Main, 25 september, 20) Nijmegen, 5 oktober. Een brief aan zijn broer, 1) Orléans,
  18 augustus 1685 (Pott 1684-1685; Pott 1685-1686).
literatuur:
- Poelhekke en Hoogewerff 1961, 339; Frank-van Westrienen 1983, 331; Herfkens 1998, 20-30.
bronnen:
