id: leffring-wijnout
naam: Leffring, Wijnout
korte_typering: Maakte in 1707 een plezierreis per boot naar Amsterdam in het gezelschap van
  zijn vrouw, Assuerus (1687-1771) en Johan Vegelin van Claerbergen (1690-1773) en de gezinnen
  van Anne Bijters en Geringa. Maakte in 1708 een zakenreis naar Den Haag met Johan Vegelin
  van Claerbergen.
reizen_vermeld:
- Juni 1707, Amsterdam; april 1708, Den Haag.
verslagen_vermeld:
- Vegelin van Claerbergen 1707; Vegelin van Claerbergen 1708a.
bronnen:
- gemaakt-op-reis
