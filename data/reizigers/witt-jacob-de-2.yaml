korte_typering: 29 november 1653 – Wenen, 22 juni 1675. Maakte tussen 1672 en 1675 een educatiereis
  naar Italië (ca. 18 jaar).
biografie: Zoon van Cornelis de Witt (1623-72) en Maria van Berckel (1632-1706). Vertrok zes
  dagen na de moord op zijn vader en oom Johan de Witt (1625-72) op educatiereis. Promoveerde
  in 1675 in Padua. Overleed in Wenen.
reizen_vermeld:
- 1672-1675, Italië en Oostenrijk.
