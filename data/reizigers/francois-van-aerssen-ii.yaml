biografie: Zoon van Cornelis van Aerssen van Sommelsdijk (1600-1662) en Lucia van Walta (1610-1674),
  broer van Cornelis (1637-1688). Verbleef in 1646 in Bourges. Maakte tussen 1651 en 1655 een
  educatiereis naar Frankrijk, Italië en Spanje in het gezelschap van zijn broer, Justinus II
  van Nassau (1633-1658) en tutor Antoine de Brunel (1622-1696). Reisde in 1658 naar Engeland
  en verdronk tijdens de terugreis voor de kust van Zierikzee.
