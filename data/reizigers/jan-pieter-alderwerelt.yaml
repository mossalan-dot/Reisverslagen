korte_typering: 'Maakte tussen 1693 en 1695 een educatiereis naar Italië. Eerste reis: 3-11-1693
  (30 jaar)'
biografie: Wordt door Hoogewerff geïdentificeerd als mogelijke reiziger. Zoon van Pieter van
  Alderwerelt (1619-1681) en Clara van Bueren (1626-1704). Telg van een Amsterdams koopmansgezin.
  Maakte tussen 1693 en 1695 een educatiereis naar Italië in het gezelschap van de Leidse baron
  Jacob Emmery van Wassenaar van Obdam (1673-1724), Andries Bicker van Swieten (ºca. 1670-1696),
  Keyser uit Lüneburg en tutor Laurens Gronovius (1648-1724).
