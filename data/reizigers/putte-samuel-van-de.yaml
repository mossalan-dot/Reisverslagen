id: putte-samuel-van-de
naam: Putte, Samuel van de
geboren:
  jaar: 1690
  plaats: Vlissingen
overleden:
  jaar: 1745
  datum: 27 september 1745
  plaats: Jakarta (IN)
korte_typering: Vlissingen, 1690 – Jakarta (IN), 27 september 1745. Maakte in 1718 een educatiereis
  naar Italië (28 jaar).
biografie: Zoon van viceadmiraal Carel van de Putte (1634-95) en Johanna Constantia Samuels
  Biscop. Studeerde in Leiden en werd in 1715 schepen van Vlissingen. Maakte in 1718 samen
  met Johannes Aegidius van Egmond van der Nijenburg (1693-1747) een educatiereis naar Italië,
  waar hij in Padua promoveerde in de geneeskunde. Reisde tussen 1719 en 1723 naar Constantinopel,
  India en Tibet. Het verslag van Van Egmond van der Nijenburg werd bewerkt door Johannes
  Heyman (1708-88) en postuum uitgegeven als Reizen door een gedeelte van Europa, klein Asien
  (...). Verbleef lange tijd in Llasa en vervolgde in 1731 zijn weg naar China en India. Vestigde
  zich in 1743 in Batavia (Jakarta) in Indonesië.
reizen_vermeld:
- 1718, Italië; 1719-1724, Turkije, Griekenland, India, Tibet en Syrië; 1726, Tibet en Mongolië;
  1739, India; 1745, Indonesië.
verslagen_vermeld:
- Van Egmond van der Nijenburg en Heyman 1757-1758.
literatuur:
