korte_typering: 'Maakte in 1649-1651 een educatiereis naar Italië en Frankrijk. Eerste reis:
  01-09-1649 (29 jaar)'
biografie: Zoon van Hendrick Hudde (1591-1637) en Clara Nijs (1599-1648). Maakte tussen 1649
  en 1651 een educatiereis naar Italië, Zwitserland en Frankrijk in het gezelschap van Arnout
  Hellemans Hooft (1629-1680), de dichter Reyer Anslo (1626-1669), zijn neef Joannes Hudde (1628-1704),
  IJsbrand Kieft, Blom en Ooms. Werkte als advocaat en werd onder andere aangesteld als raad
  en schepen van Amsterdam tussen 1674 en 1679.
