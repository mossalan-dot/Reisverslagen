id: oetgens-van-waveren-anthony
naam: Oetgens van Waveren, Anthony
geboren:
  jaar: 1585
overleden:
  jaar: 1658
  datum: 25 augustus 1658
korte_typering: Ridder van het Heilige Roomse Rijk, heer van Waveren en Botshol en Ruige Wilnis.
  1585 – 25 augustus 1658. Maakte in 1631-32 een diplomatieke reis naar Denemarken en Hamburg
  (46 jaar).
biografie: Werd in 1634 aangesteld als lid van de gecommitteerde raden van Holland en het
  Zuiderkwartier. Was gedeputeerde van de Staten-Generaal tussen 1655 en 1658. Maakte een
  diplomatieke reis naar Denemarken en Hamburg in 1631 en 1632, waar hij werd geridderd door
  keizer Ferdinand II (1578-1637). Maakte in 1653 een diplomatieke reis naar Lübeck samen
  met medegezant Jacob de Witt (1589-1674). Arnout Hellemans Hooft (1629-80) deed kort verslag.
reizen_vermeld:
- Augustus 1631-februari 1632, Denemarken en Hamburg; januari-april 1653, Lübeck.
verslagen_vermeld:
- Hellemans Hooft 1653.
addenda:
