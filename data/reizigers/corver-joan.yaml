id: corver-joan
naam: Corver, Joan
geboren:
  jaar: 1628
  datum: 15 februari 1628
  plaats: Amsterdam
overleden:
  jaar: 1716
  datum: 17 mei 1716
  plaats: Amsterdam
korte_typering: Amsterdam, 15 februari 1628 – Amsterdam, 17 mei 1716. Maakte in 1655 een diplomatieke
  reis naar Duitsland (27 jaar).
biografie: Zoon van Dirck Corver en Maria Overrijn van Schoterbos. Werd in 1652 aangesteld
  als stadssecretaris. Reisde in 1655 met Joan sr. (1599-1661) en Joan jr. Huydecoper (1625-1704)
  en Pieter de Graeff (1638-1707) naar het hof van Brandenburg om te spreken over een bondgenootschap
  tegen Zweden en op te treden als peetoom bij de doop van Karel Emiel (1655-74), keurvorst
  van Brandenburg. Maakte in 1674 en 1675 een diplomatieke missie naar Engeland. Was raad,
  schepen en tussen 1681 en 1715 vrijwel onafgebroken burgemeester van Amsterdam. Was raad
  van de Admiraliteit van Amsterdam, kolonel van de schutterij, bewindhebber van de VOC en
  curator van het Athenaeum Illustre.
reizen_vermeld:
- April-juni 1655, Duitsland; juli 1674-april 1675, Engeland.
verslagen_vermeld:
- De Graeff 1655; De Graeff 1918, 149-168.
addenda:
- Stukken over de ambassade naar Berlijn in 1655 (Huydecoper 1655); verbaal van het gezantschap
  naar Engeland (SG 8580-8581).
literatuur:
- BWN, III, 745-746.
bronnen:
- gemaakt-op-reis
