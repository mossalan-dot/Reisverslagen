korte_typering: Amersfoort, 1672 – ca. 1708. Maakte een educatiereis naar Frankrijk en Italië
  tussen 1698 en 1699 (26 jaar).
biografie: Zoon van Jan Kool (†1705). Studeerde en promoveerde in Utrecht bij de filoloog
  Johann Graevius (1632-1703) en voerde een uitgebreide correspondentie met de Harderwijkse
  geleerde Theodorus Janssonius van Amsteloveen (1657-1712). Maakte in 1698 en 1699 een educatiereis
  naar Italië in het gezelschap van Lucas van Voorst (1670-1738). Was werkzaam als filoloog
  en werkte tijdens zijn reis aan een nieuwe editie van de Antiquae Inscriptiones van Marquard
  Gude (1635-89). Was schepen van Amersfoort in 1700, 1701 en van 1703 tot 1706. Zijn boekenverzameling
  werd in 1712 geveild.
reizen_vermeld:
- April 1698-mei 1699, Zuidelijke Nederlanden, Frankrijk, Zwitserland, Italië, Oostenrijk
  en Duitsland.
verslagen_vermeld:
- Kool 1698-1699.
literatuur:
