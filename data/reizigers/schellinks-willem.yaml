id: schellinks-willem
naam: Schellinks, Willem
korte_typering: Amsterdam, januari 1623 – Amsterdam, 1678. Maakte in 1646 een kunstenaarreis
  naar Frankrijk (23 jaar).
biografie: Zoon van Laurens Schellinks en Catalijntje Cousenaer. Studeerde mogelijk bij Karel
  Dujardin (1626-78). Maakte in 1646 een kunstenaarsreis naar Frankrijk met Lambert Doomer
  (1624-1700). Reisde tussen 1661 en 1665 naar Engeland, Frankrijk, Duitsland, Zwitserland
  en Italië als tutor van de dertienjarige Jacques Thierry jr. (1648-1709). Op verzoek van
  de advocaat Laurens van der Ham (1621-78) maakte hij honderdtwintig topografische tekeningen,
  waarvan 61 werden opgenomen in zijn Atlas.
reizen_vermeld:
- April-oktober 1646, Frankrijk; 1661-65, Engeland, Frankrijk, Italië, Malta, Duitsland en
  Zwitserland.
verslagen_vermeld:
