korte_typering: Rotterdam, 19 mei 1684 – Rotterdam, 21 februari 1738. Maakte in 1729 een plezierreis
  naar de Zuidelijke Nederlanden (45 jaar).
biografie: Zoon van Pieter Timmers en Ignatia van Zoelen, vader van Aletta Johanna (1707-75)
  en Ignatia Geertruida (1714-33). Trouwde in 1703 met Suzanne Libertine van Schinne (1684-1732).
  Maakte in 1729 een plezierreis naar de Zuidelijke Nederlanden met zijn echtgenote en kinderen,
  Van Bentinck en Van Schoonheeten, Sloterdijck en zoon en Van Baerle en dochter.
reizen_vermeld:
- Augustus-september 1729, Zuidelijke Neder-landen.
