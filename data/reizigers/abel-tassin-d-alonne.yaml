korte_typering: 'Maakte in 1674 een diplomatieke reis naar Engeland. Eerste reis: 17-05-1674
  (28 jaar)'
biografie: Zoon van Jeanne de Bommert Silvercron en, zo ging het gerucht, stadhouder Willem
  II (1626-1650). Maakte in 1674 als secretaris een diplomatieke reis naar Engeland in het gezantschap
  van Coenraad van Beuningen (ca. 1622-1693), Willem Adriaan van Nassau-Odijck (ca. 1632-1705),
  Willem van Haren (1626-1708) en Frederik van Reede tot Renswoude (ca. 1630-1715). De reis
  werd beschreven door Joannes Vollenhove (1631-1708).
