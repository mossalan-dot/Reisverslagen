biografie: Dochter van de welvarende Leidse lakenfabrikant Pieter de la Court van der Voort
  (1666-1740) en Sara Poelaart (1666-1740), zus van Allard (1688-1755) en Adriana (1696-1748).
  Trouwde met Johan Meerman (1687-1746). Maakte in 1740 een plezierreis naar de Zuidelijke Nederlanden
  met haar broer en zus, schoonzus Catharina Backer (1689-1766) en neef en nicht Bogaerd.
