korte_typering: 'Maakte in 1649 een reis naar Denemarken. Eerste reis: 01-09-1649 (20 jaar)'
biografie: Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Constantijn (1628-1697), Lodewijk (1631-1699), Philips (1633-1657) en Susanna (1637-1725).
  Studeerde rechten en wiskunde in Leiden en zette zijn studie voort in Breda. Was een vooraanstaande
  wiskundige, natuurkundige en deed verschillende wetenschappelijke uitvindingen en ontdekkingen,
  waaronder de uitvinding van het slingeruurwerk. Publiceerde verschillende wetenschappelijke
  werken. Trad in 1649 als secretaris van graaf Hendrik van Nassau-Siegen op tijdens diens reis
  naar Denemarken in 1649. Reisde in 1655 naar Frankrijk met zijn broer Lodewijk, waar hij promoveerde
  in Angers. Reisde naar Frankrijk en Engeland tussen 1660 en 1661 en bezocht Londen in 1663.
  Kreeg in 1666 een positie aan de Académie Française en verbleef in Parijs tot 1681.
