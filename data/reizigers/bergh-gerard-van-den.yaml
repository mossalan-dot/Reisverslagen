id: bergh-gerard-van-den
naam: Bergh, Gerard van den
naamsvarianten:
- Montanus, Gerardus
korte_typering: Kwam uit Amsterdam. Maakte tussen 1624 en 1626 een educatiereis naar Frankrijk
  en Italië in het gezelschap van Willem van den Vondel (1603-28), Jacob van Erp (1603-43),
  Herman Swol, Jacob Baeck en A. Moorman. Studeerde in Padua. In een brief van Vondel gaat
  het om Herman van den Bergh. Mogelijk betreft het dezelfde reiziger.
reizen_vermeld:
- 1624-26, Frankrijk en Italië.
correspondentie:
- Een Latijnse brief van Joost van den Vondel (1587-1679) aan diens broer Willem, onder andere
  over de reiziger, 1) Rome, 1 maart 1625 (Vondel 1936, 26-32).
literatuur:
- NNBW, IX, 1228-1230; Poelhekke 1966, 320.
bronnen:
- gemaakt-op-reis
