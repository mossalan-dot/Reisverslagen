biografie: Zoon van Johan van Oldenbarnevelt (1547-1619) en Maria van Utrecht (ºca. 1551), broer
  van Reinier (1588-1623). Reisde mogelijk naar Engeland in 1603 met zijn broer. Maakte tussen
  1606 en 1608 een educatiereis met zijn broer en tutor Johannes Meursius (1579-1639), eerst
  in het gevolg van keurvorst Ernst van Keulen (1554-1612) naar het hof in Praag, daarna naar
  Duitsland, Genève en Frankrijk. Studeerde in Heidelberg en Genève. Werd door Hendrik IV (1553-1610)
  aangenomen als edelman. Vervolgde zonder zijn broer zijn reis naar Italië in 1609 en 1610,
  onder begeleiding van zijn zwager Cornelis van der Mijle (1579-1642), gezant te Venetië. Studeerde
  in Padua en Siena en keerde terug via Frankrijk en Engeland, waar hij in 1611 door Jacobus
  I (1566-1625) werd geridderd. Was ritmeester in dienst van de Staten van Overijssel en werd
  in 1617 benoemd tot gouverneur van Bergen op Zoom. Na de berechting van zijn vader beraamde
  hij met zijn broer een aanslag op prins Maurits (1567-1625). De aanslag mislukte en hij wist
  te vluchten naar Brussel. Reisde in 1623 naar Frankrijk en Italië en keerde terug naar Brussel,
  waar hij door aartshertogin Isabella (1566-1633) in zijn onderhoud werd voorzien.
