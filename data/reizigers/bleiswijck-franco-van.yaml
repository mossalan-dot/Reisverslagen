korte_typering: Delft, 3 november 1644 – Delft, 12 maart 1723. Maakte in 1667 een plezierreis
  naar Den Bosch (22 jaar)
biografie: 'Zoon van Evert van Bleiswijck (1609-62) en Sara van der Burch (1619-92). Was raad
  en burgemeester van Delft. Maakte in 1667 een plezierreis naar Den Bosch met Johanna en
  de rest van de familie Doublet. Ondernam tussen 1669 en 1671 een educatiereis naar Frankrijk
  en Engeland.


  Bloemen, Jan Frans van [ook: Vanblommen, Gian Francesco; Horisont; Orizzonte]. Antwerpen
  (ZN), mei 1665 – Rome (IT), juni 1749. Katholiek. Maakte in 1682 een kunstenaarsreis naar
  Parijs (17 jaar).


  Werkte als landschapschilder. Was een leerling van Anton Goubau (1616-98) in Antwerpen.
  Reisde naar Parijs in 1682 en verbleef daar enkele jaren, alvorens door te reizen naar Lyon
  en Rome. Werkte en schilderde in Italië. Zijn bentnaam was Horisont.'
