  Vrijburch, Adriaan van [Vrijburg; Avrijburch, Adrianus]. Alkmaar, ca. 1605 – Rome (IT),
  19 december 1628. Maakte tussen 1627 en 1628 een educatiereis naar Frankrijk en Italië (ca.
  22 jaar).


  Zoon van Pieter van Vrijburch en Ariaantje Jansdr Quintingh. Studeerde filosofie in Leiden.
  Maakte tussen 1627 en 1628 een educatiereis naar Frankrijk en Italië. Studeerde rechten
  in Orléans in 1626-1627 en bezocht de rijschool in Angers in 1627. Overleed in 1628 na een
  duel in Rome met Volkert Teding van Berkhout (1601-32). Een grafmonument werd geplaatst
  in de Santa Maria dell’Anima.'
