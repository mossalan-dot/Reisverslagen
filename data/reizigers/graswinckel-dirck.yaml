id: graswinckel-dirck
naam: Graswinckel, Dirck
geboren:
  jaar: 1600
  plaats: Delft
overleden:
  jaar: 1666
  datum: 12 oktober 1666
  plaats: Mechelen (ZN)
korte_typering: Heer van Holy. Delft, 1600 – Mechelen (ZN), 12 oktober 1666. Maakte in 1621-25
  een educatiereis naar Engeland en Frankrijk (21 jaar).
biografie: Zoon van Jan Graswinckel en A. Basius. Was advocaat in Leiden en maakte tussen
  1621 en 1625 een educatiereis naar Engeland en Frankrijk samen met Nicolaas Meerman en George
  Rataller Doublet (1600-55). Assisteerde Hugo de Groot (1583-1645) in Parijs. Werd benoemd
  tot ridder van San Marco na zijn verdediging van de rechten van Venetië. Werkte als advocaat-fiscaal
  van de grafelijkheidsdomeinen van Holland en later als griffier van de Chambre Mipartie
  in Mechelen. Publiceerde verschillende wetenschappelijke werken en gedichten.
reizen_vermeld:
- 1621-25, Engeland, Frankrijk en Italië.
correspondentie:
- Twee Latijnse brieven aan Hugo de Groot, 1) Leiden, 16 oktober 1624; 2) 28 oktober (De Groot
  1928-1969, II, 403-404; 407-408).
literatuur:
- BWN, VII, 366-369; NNBW, III, 489-490; RAA.
bronnen:
