id: mijle-cornelis-van-der
naam: Mijle, Cornelis van der
korte_typering: Heer van de Mijle, Dubbeldam, Bakkum, Alblas, Bleskensgraaf en St. Anthonispolder.
  Den Haag, 1579 – Den Haag, november 1642. Maakte in 1597-1603 een educatiereis naar Frankrijk
  en Italië (18 jaar).
biografie: Zoon van Adriaan van der Myle en Magdalena van Egmond van de Nijenburg. Studeerde
  in Leiden en maakte tussen 1597 en 1603 een educatiereis naar Frankrijk, Italië en Duitsland.
  Studeerde rechten in Padua in 1599. Werd raad van prins Maurits (1567-1625) en lid van de
  ridderschap van Holland. Trad in het huwelijk met Maria Johanna (1582-1657), dochter van
  Johan van Oldenbarnevelt (1547-1619), en wist door die verbintenis verschillende hoge posities
  te bekleden. Vergezelde Van Oldenbarnevelt naar Bergen op Zoom en Antwerpen in 1603 om het
  Bestand te sluiten. Werd benoemd tot buitengewoon gezant in Venetië en begeleidde Willem
  van Oldenbarnevelt (1590-1634) tijdens diens reis door Italië in 1609 en 1610. Reisde in
  1610 als gezant naar Frankrijk. Was ambassadeur in Venetië en Parijs, hoogheemraad van Schieland
  en curator van de Leidse universiteit. Werd na de berechting van Van Oldenbarnevelt verbannen
  uit de Republiek.
reizen_vermeld:
- 1597-1603, Frankrijk, Italië en Duitsland; 1603, Zuidelijke Nederlanden; 1609-10, Italië
  en Frankrijk; maart-mei 1614, Frankrijk.
addenda:
- Album amicorum van zijn educatiereis, met inscripties uit onder andere Orléans, Angers en
  Genève (Van der Mijle 1594-1607); verbalen en rapporten van zijn gezantschappen, hierboven
  genoemd (SG 8313-8314; 8316-8318; 8321).
correspondentie:
- Twee Latijnse brieven van Franciscus Junius (1545-1602) uit 1602.
literatuur:
- BWN, XII, 1213-1217; NNBW, VIII, 1191-1198; Van der Vecht 1907; Schulz 2003, 57-69.
bronnen:
- gemaakt-op-reis
