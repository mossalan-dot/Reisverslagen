korte_typering: Ambachtsheer van Dorp, heer van Maasdam. Tholen, 4 juni 1612 – Den Haag, 29
  augustus 1679. Maakte in 1656 een diplomatieke reis naar Polen (44 jaar).
biografie: Zoon van Frederik van Dorp (1547-1612) en Sara van Trello (1583-1648). Studeerde
  rechten in Leiden. Kreeg in 1642 zitting in het Hof van Holland, Zeeland en West-Friesland.
  Reisde in 1656 met de diplomaten Govert van Slingelandt (1623-90), Pieter de Huybert (1622-95)
  en Johan Isbrandtsz (1621-1702) naar Polen ter bemiddeling van de vrede. De reis werd beschreven
  door Adriaen Schagen (1633-99). Werd curator van de Leidse universiteit en werd in 1670
  benoemd tot hoogbaljuw en dijkgraaf van Rijnland. Publiceerde stichtelijke poëzie.
