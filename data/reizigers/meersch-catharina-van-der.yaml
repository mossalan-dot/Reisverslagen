id: meersch-catharina-van-der
naam: Meersch, Catharina van der
geboren:
  jaar: 1666
  plaats: Amsterdam
overleden:
  jaar: 1723
religie: Doopsgezind
korte_typering: Amsterdam, 1666 – 1723. Doopsgezind. Vluchtte tijdens het Rampjaar naar Hamburg
  (6 jaar).
biografie: Dochter van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707),
  zus van Anna (1669-1724), Sara (†1674), Pieter (º1677), Abraham jr. (1676-1719) en Arent
  (1683-1768). Vluchtte met haar ouders en zussen naar Hamburg tijdens het Rampjaar. Maakte
  in 1687 een reis naar Lille met haar ouders en broer Pieter.
reizen_vermeld:
- Juni 1672-73, Hamburg; 1687, Lille
verslagen_vermeld:
- Van der Meersch 1672-1674; Van der Meersch 1700, 13-14.
bronnen:
- gemaakt-op-reis
