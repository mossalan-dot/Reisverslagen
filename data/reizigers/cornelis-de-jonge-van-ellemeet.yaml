biografie: Zoon van Jacob de Jonge van Ellemeet (1601-1650) en Magdalena Briel (1617-1685),
  broer van Johanna (1643-1693) en Cecilia (1648-1686). Studeerde filosofie in Leiden (imm.
  20-09-1662) en promoveerde in de rechten in Angers. Reisde in 1666 naar Gelderland en Kleef.
  Maakte in 1666 en 1667 een educatiereis naar Frankrijk en Engeland in het gezelschap van neef
  Pieter Pieterson, Justus van der Cijs en (vanaf Parijs) neef Cornelis de Jonge van Oosterland
  (1645-1694). In 1669 maakte hij een plezierreis naar Antwerpen en Brussel. Was leenman en
  heemraad van Voorne en pensionaris van Brielle en Rotterdam. Werd in 1674 benoemd tot ontvanger-generaal
  van de Verenigde Nederlanden, een lucratieve positie die hem een royaal inkomen verschafte.
  Verder speculeerde hij in effecten en landerijen. Tussen 1680 en 1682 liet hij het landgoed
  Duinrell in Wassenaar aanleggen.
