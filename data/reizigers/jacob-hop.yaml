biografie: Zoon van Cornelis Hop (1620-1704) en Anthonia Cloeck. Reisde in 1678 naar Frankrijk
  in het diplomatieke gezantschap van Hiëronymus van Beverningh (1614-1690) waar vredesonderhandelingen
  plaatsvonden. Diende tussen 1680 en 1685 als pensionaris van Amsterdam en vervulde tussen
  1687 en 1700 verschillende diplomatieke zendingen, onder andere naar Berlijn en Wenen. Werd
  in 1699 verheven tot baron van het Heilige Roomse Rijk. Maakte in 1702 en 1703 militaire reizen
  in het gezelschap van zijn zoon Cornelis (1685-1762). Was tussen 1703 en 1712, gedurende de
  Spaanse Successieoorlog, gedeputeerde te velde.
