naam: Haze, Elias de
geboren:
  jaar: 1689
  datum: 6 maart 1689
  plaats: Middelburg
overleden:
  jaar: 1752
  datum: 26 februari 1752
  plaats: Den Haag
korte_typering: Middelburg, 6 maart 1689 – Den Haag, 26 februari 1752. Maakte in 1748 een
  plezierreis naar Den Haag (59 jaar).
biografie: Zoon van Hubrecht de Haze (1644-1705) en Anna Catharina de la Porte (1656-1736).
  Had een bestuurlijke carrière in Nederlands-Indië. Was tussen 1731 en 1735 gouverneur van
  Ternate op de Molukken en werd in 1738 president van de schepenen in Batavia. Was raad van
  Nederlands-Indië tussen 1739 en 1741. Werd op last van de gouverneur-generaal in 1740 gevangengenomen,
  maar later vrijgesproken. In 1748 maakte hij een plezierreis naar Den Haag in het gezelschap
  van zijn echtgenote Catharina Emants (1715-82), de families Thibaut en Bomme en Cornelia
  Carolina de Vassy.
reizen_vermeld:
- Juni 1748, Bergen op Zoom.
verslagen_vermeld:
- De Vassy 1748; De Vassy 2017.
bronnen:
