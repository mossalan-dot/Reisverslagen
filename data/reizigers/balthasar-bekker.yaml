biografie: Zoon van Henricus Bekker. Studeerde theologie in Groningen en Franeker en promoveerde
  daar in 1665. Predikte achtereenvolgens in Oosterlittens, Franeker, Loenen en Weesp en week
  in 1679 uit naar Amsterdam. Reisde in 1683 naar Engeland en Frankrijk. Schreef meerdere boeken,
  waaronder Onderzoek van de betekeninge der kometen (1683) en het vierdelige De betoverde wereld
  (1691-1693), waarin hij zich fel uitliet tegen bijgeloof en de heksenvervolging. Werd in 1692
  afgezet als predikant, maar bleef niettemin werkzaam in Amsterdam.
