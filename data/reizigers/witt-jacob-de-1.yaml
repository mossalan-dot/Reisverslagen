korte_typering: Heer van Manizee, Melissant en en Cromstrijen. Dordrecht, 7 februari 1589
  – Dordrecht, 10 januari 1674. Maakte tussen 1607 en 1613 een educatiereis naar Frankrijk,
  Engeland en Italië (18 jaar).
biografie: Zoon van Cornelis de Witt (1545-1622) en Johanna Heijmans (1547-1602), vader van
  Johan (1625-72) en Cornelis (1623-72). Studeerde rechten in Leiden en maakte een educatiereis
  naar Duitsland, Frankrijk, Italië en Engeland. Werd in 1618 penningmeester van de Dordtse
  Synode en bekleedde verschillende bestuurlijke ambten, waaronder dat van curator van de
  Illustere School, veertigraad en schepen van Dordrecht en dijkgraaf van Mijnsheerenland.
  Werd meermaals burgemeester van Dordrecht. Reisde in 1644 en 1645 als ambassadeur naar Denemarken.
  Reisde in 1653 als gezant naar Lübeck met Anthony Oetgens van Waveren (1585-1658) en Nicolaas
  Vivien (1631-92). Arnout Hellemans Hooft (1629-80) deed kort verslag. Werd op bevel van
  Willem II (1626-50) gevangengenomen in 1650. Werd in 1657 rekenmeester van de domeinen van
  Holland.
reizen_vermeld:
- Ca. 1607-ca. 1613, Duitsland, Frankrijk, Italië en Engeland; juni 1644-mei 1645, Denemarken;
