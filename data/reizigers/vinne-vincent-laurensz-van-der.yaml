korte_typering: Haarlem, 11 oktober 1628 – Haarlem, 27 juli 1702. Doopsgezind. Maakte in 1652-55
  een kunstenaarsreis naar Duitsland, Zwitserland en Frankrijk (24 jaar).
biografie: Zoon van Laurensz Gillesz. van der Vinne (º1585) en Maijke Vincents Verfalje. Was
  in 1647 een leerling van Frans Hals (ca. 1682-66) en schreef zich in 1649 in in het Haarlemse
  schildersgilde. Werkte als schilder en tekenaar en was actief lid van Haarlemse rederijkerskamers.
  Maakte tussen 1652 en 1653 een kunstenaarsreis naar Duitsland, Zwitserland en Frankrijk
  in het gezelschap van collega-kunstenaars Guillaume Dubois (1625-80), Dirck Helmbreeker
  (1633-96) en Cornelis Bega (1631-64) en de schoenmakersgezel Joost Boelen (ºca. 1633). Maakte
  in 1680 een plezierreis naar Utrecht en Rotterdam.
reizen_vermeld:
