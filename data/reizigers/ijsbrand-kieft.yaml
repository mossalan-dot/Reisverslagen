korte_typering: 'Maakte in 1649-1651 een educatiereis naar Italië. Eerste reis: 01-09-1649'
biografie: Studeerde in Utrecht in 1645. Maakte in 1649-1651 een educatiereis naar Italië in
  het gezelschap van Arnout Hellemans Hooft (1629-1680), de dichter Reyer Anslo (1626-1669),
  Rombout (1620-1679) en Joannes Hudde (1628-1704), Blom en Ooms. Promoveerde in Padua in augustus
  1650.
