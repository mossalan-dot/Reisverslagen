biografie: Zoon van de Haagse burgemeester Adriaan van der Goes en Cornelia Martina Vlaardingerwout.
  Studeerde in Harderwijk. Bezocht in 1773 Parijs en maakte in 1775 en 1776 een reis naar Frankrijk
  en Italië. Werkte als jurist, secretaris van Den Haag, en gezant in Kopenhagen en Madrid.
  Was lid van de patriottenpartij en was tussen 1798 en 1807 achtereenvolgens secretaris van
  Staat van Buitenlandse Zaken, minister van Buitenlandse Zaken en minister van Justitie en
  Politie. Was vanaf 1815 lid van de Eerste Kamer.
