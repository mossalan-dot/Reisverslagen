id: olfertsz-cornelis
naam: Olfertsz., Cornelis
korte_typering: †Hoorn, 24 mei 1672. Maakte in 1662 een plezierreis naar de Zuidelijke Nederlanden.
biografie: Werd in 1672 aangesteld als admiraliteit van Hoorn. Maakte in 1662 een plezierreis
  naar de Zuidelijke Nederlanden in het gezelschap van Gerard Hinlopen (1644-91) en Cornelis
  Jacobs Segen.
reizen_vermeld:
- Mei-juni 1662, Zuidelijke Nederlanden.
verslagen_vermeld:
- Hinlopen 1662; Hinlopen 2014a.
bronnen:
- gemaakt-op-reis
