id: andringa-tinco-van
naam: Andringa, Tinco van
geboren:
  jaar: 1643
overleden:
  jaar: 1689
  datum: 29 juli 1689
korte_typering: 1643 – 29 juli 1689. Maakte tussen 1664 en 1665 een educatiereis naar Frankrijk
  (21 jaar).
biografie: 'Zoon van Renger van Andringa (1621-71) en Dedje Lycklama (1615-86). Was grietman
  van Lemsterland. Maakte tussen 1664 en 1665 een educatiereis naar Frankrijk met Jarich van
  Ockinga (1644-1714).Reizen: Juni 1664-juli 1665, Zuidelijke Nederlanden, Frankrijk en Zwitserland.


  Zoon van Reyer Claesz Anslo en Hestertje Willems (º1597). Schreef vanaf 1645 poëzie, waaronder
  de Parysche Bruiloft (1649) en De pest tot Napels (1656). Reisde in 1649 naar Italië in
  het gezelschap van Arnout Hellemans Hooft (1629-80), Rombout (1620-79) en Joannes Hudde
  (1624-1704), IJsbrand Kieft, Blom en Ooms. Hij bekeerde zich tot de katholieke kerk, ontving
  de tonsuur (1656) en werd subdiaken (1666). In Rome verkeerde hij de kring rondom Christina
  van Zweden (1626-89), van wie hij, evenals van paus Innocentius X (1574-1655), een eremedaille
  ontving. Zijn werk verscheen postuum.


  Assendelft, Adriaan Gerrits vanDelft, 31 augustus 1664 – Delft, 2 augustus 1742. Maakte
  in 1696 een korte plezierreis (32 jaar).


  Zoon van Gerard van Assendelft en Agneta Hoppesteyn van Leeuwen. Studeerde in Leiden en
  bekleedde verschillende bestuurlijke ambten in Delft, waaronder die van schepen (1699-1708),
  thesaurier (1709-14) en burgemeester (meerdere keren tussen 1722-1732). Trouwde in 1687
  met Maria Magdalena van Beresteijn (1667-1715). Werd in 1717 bewindhebber van de WIC. In
  1696 maakte hij samen met zijn echtgenote, zijn dochters Catarina en Maria, zijn zus Maria
  van Assendelft (†1744) en zijn zwager Willem (†1744) een plezierreis naar Nijmegen, Kleef
  en paleis Het Loo.'
