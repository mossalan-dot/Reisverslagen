poezie:
- Twee gedichten van Anslo, 1) ‘Afscheit van Amsterdam’ (12 september 1649, geschreven in
  Bingen), 2) ‘Antwoord, op mijn klinkdicht, van Rynbrand Anslo, te Rome’ (aan Joannes Six
  van Chandelier (1620-95) (Anslo 1713, 273-274; Six van Chandelier 1991, 468-469). Vier gedichten
  over Reyer Anslo van Six van Chandelier, 1) ‘Afscheid uit Rome van R. Anslo. aan den selven’;
  2) ‘Myn antwoord, aan den selven’; 3) ‘Op het kontrefeitsel, van R. Anslo. Door Bronkhorst,
  te Venecie, aan den selven’; 4) ‘Brief, aan R. Anslo, te Rome’ (Six van Chandelier 1991,
  82; 439-440; 453; 793-796).
