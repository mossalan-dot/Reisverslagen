korte_typering: 'Reisde in 1624-1625 naar Frankrijk en Italië. Eerste reis: 01-01-1624 (21 jaar)'
biografie: Zoon van Joost van den Vondel en Sara Cranen, broer van de beroemde Joost van den
  Vondel (1587-1679). Studeerde rechten in Leiden. Tussen 1624 en 1626 maakte hij een educatiereis
  naar Frankrijk en Italië in het gezelschap van Jacob Baeck, Jacob van Erp (1603-1643), Herman
  Swol, Gerard van den Bergh en A. Moorman. Promoveerde in de rechten in Orléans. Bezocht Rome
  tijdens het Heilige Jaar 1625. Was assessor van de Natio Germanica. Zijn reisverslag, getiteld
  Voyagie door Vranckrijk en Italien... gedaan in ‘t jaar 1624, is volgens biograaf Prinsen
  na een boekverkoping verdwenen. Vestigde zich in 1626 als advocaat in Amsterdam. Overleed
  aan een ziekte in 1628, hoewel biografen speculeren over een vergiftiging in Italië.
