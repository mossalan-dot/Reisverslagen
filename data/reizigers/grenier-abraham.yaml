id: grenier-abraham
naam: Grenier, Abraham
geboren:
  jaar: 1626
  plaats: Middelburg
overleden:
  jaar: 1660
  datum: 11 februari 1660
  plaats: Middelburg
korte_typering: Middelburg, 1626 – Middelburg, 11 februari 1660.. Maakte in 1649 een educatiereis
  naar Frankrijk (23 jaar).
biografie: Studeerde rechten in Leiden. Reisde in 1649 naar Frankrijk samen met Joannes Six
  van Chandelier (1620-95). Promoveerde in Angers. Was schepen van Middelburg.
reizen_vermeld:
- 1649, Frankrijk.
poezie:
- Vier reisgedichten van Six van Chandelier, 1) ‘Op het voorspreekerschap van Abraham Grenier
  den iongen van Middelburgh, te Angiers verdient’ (over zijn promotie te Angers), 2) ‘Aan
  Abraham Grenier den jongen, rechtsgeleerden van Middelburgh, teegenwoordigh te Angiers’,
  3) ‘Aan Abraham Grenier den iongen rechtgeleerden te Middelburgh’, 4) ‘Blyde begroetinge,
  aan Abraham Grenier den ouden, oover de weederwelvaarentheit van synen soone’ (Six van Chandelier
  1991).
literatuur:
- BWN, VII, 396-397; NNBW, VII, 496.
bronnen:
- gemaakt-op-reis
