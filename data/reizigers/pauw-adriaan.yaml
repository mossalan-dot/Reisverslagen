  plaats: Amsterdam
overleden:
  jaar: 1653
  datum: 21 februari 1653
  plaats: Den Haag
korte_typering: Heer van Heemstede, Hoogersmilde, Bennebroek en Nieuwerkerk. Amsterdam, 1
  november 1585 – Den Haag, 21 februari 1653. Maakte in 1618 een diplomatieke reis naar Engeland
  (32 jaar).
biografie: Zoon van Reynier Pauw en Cornelia Michielsdr. de Lange. Studeerde rechten in Leiden.
  Was koopman in Amsterdam en bekleedde tussen 1611 en 1627 het pensionarisschap van de stad.
  Was tussen 1618 en 1641 bewindhebber van de VOC en vanaf 1631 raadpensionaris van Holland.
  Was tussen 1627 en 1652 rekenmeester van Holland en West-Friesland. Maakte verschillende
  diplomatieke reizen, waaronder naar het hof van Denemarken in 1618, samen met Constantijn
  Huygens (1596-1687), Frankrijk in 1621 en 1624 en Engeland in 1627. Reisde in februari en
  maart 1649 naar Engeland in het gezelschap van Constantijn Huygens jr. (1628-97). Droeg
  bij aan de Vrede van Münster. Werd in 1613 geridderd door Jacobus I (1566-1625) en werd
  door Lodewijk XIII (1601-43) geridderd in de orde van St.-Michiel in 1624.
reizen_vermeld:
- Mei-augustus 1618, Denemarken en Duitsland; januari-april 1621/1624, Frankrijk; 1627/februari
  en maart 1649, Engeland.
addenda:
- Verbalen, verslagen en rapporten van de gezantschappen, hierboven genoemd (SG 8326-8327;
  8335).
literatuur:
