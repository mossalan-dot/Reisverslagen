    Andries Bicker, koopman op Rusland en handelaar in specerijen, was een bestuurlijk zwaargewicht.
    Hij werd tien keer tot burgemeester van Amsterdam gekozen, vertegenwoordigde de stad in
    de Staten-Generaal en was bovendien ambassadeur van de Scandinavische landen, Polen en Brandenburg.
    Toen de befaamde Amsterdamse portrettist Van der Helst hem portretteerde, was de familie
    Bicker het machtigste geslacht van Amsterdam.


    Portret van Andries Bicker, koopman op Rusland en burgemeester van Amsterdam. Ten halven
    lijve, staand, de rechterhand in de zij, in de linkerhand een boekje. Pendant van het portret
    van zijn echtgenote Trijntje Jans Tengnagel te Dresden.'
