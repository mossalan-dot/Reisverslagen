biografie: Zoon van Gerrit Pietersz. Bicker (1554-1604) en Alyd Andriesdr. Boelens (1557-1630).
  Was koopman en dreef pelshandel in Rusland. Was bewindhebber van de VOC, gedeputeerde van
  de Staten-Generaal en kolonel in de schutterij. Was vanaf 1616 vroedschap, schepen en burgemeester
  van Amsterdam. Maakte in 1627 een diplomatieke reis naar Polen en Zweden met medegezanten
  Rochus van den Honert (1572-1638) en Simon van Beaumont (1574-1654). De reis werd vastgelegd
  door Abraham Booth (1606-1636).
