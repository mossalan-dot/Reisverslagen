id: beresteijn-van-assendelft-maria-magdalena-van
naam: Beresteijn(-van Assendelft), Maria Magdalena van
geboren:
  jaar: 1667
  datum: 22 juli 1667
overleden:
  jaar: 1715
  datum: 14 september 1715
korte_typering: 22 juli 1667 – 14 september 1715. Maakte in 1696 een korte plezierreis (29
  jaar).
biografie: Trouwde in 1687 met Adriaan Gerrits van Assendelft (1644-1742). In 1696 maakte
  zij samen met haar echtgenoot, haar dochters Catarina en Maria, haar schoonzus Maria van
  Assendelft (1646-1715) en zwager Willem (†1744) een plezierreis naar Nijmegen, Kleef en
  paleis Het Loo.
reizen_vermeld:
- Juli 1696, Nijmegen, Kleef en Het Loo.
verslagen_vermeld:
- Van Assendelft 1696.
literatuur:
- NNBW, VII, 26.
bronnen:
- gemaakt-op-reis
