biografie: Zoon van Jan Graswinckel en A. Basius. Was advocaat in Leiden en maakte tussen 1621
  en 1625 een educatiereis naar Engeland, Frankrijk en Italië samen met Nicolaas Meerman en
  George Rataller Doubleth (1600-1655). Assisteerde Hugo de Groot (1483-1645) in Parijs. Werd
  benoemd tot ridder van San Marco na zijn verdediging van de rechten van Venetië. Werkte als
  advocaat-fiscaal van de grafelijkheidsdomeinen van Holland en later als griffier van de Chambre
  Mipartie in Mechelen. Publiceerde verschillende wetenschappelijke werken en gedichten.
