id: hooghtwoudt-hinlopen-margaretha
naam: Hooghtwoudt(-Hinlopen), Margaretha
geboren:
  jaar: 1648
  datum: 13 december 1648
  plaats: Hoorn
overleden:
  jaar: 1684
  datum: 20 februari 1684
korte_typering: Hoorn, 13 december 1648 – 20 februari 1684. Maakte in 1683 een plezierreis
  naar de Zuidelijke Nederlanden (34 jaar).
biografie: Dochter van Cornelis Claesz Hooghtwoudt en Grietje Coninck. Trouwde in 1674 met
  Daniël de Marez (1641-81) en hertrouwde na diens overlijden in 1683 met Gerard Hinlopen
  (1644-91). Maakte in 1683 een plezierreis naar de Zuidelijke Nederlanden in het gezelschap
  van haar echtgenoot en de gezinnen van Gerard van Tongen en Rutger Groot.
reizen_vermeld:
- Juni 1683, Zuidelijke Nederlanden.
verslagen_vermeld:
- Hinlopen 1683.
literatuur:
- Hinlopen 2009, 31; Moss 2018, 99-112.
bronnen:
- gemaakt-op-reis
