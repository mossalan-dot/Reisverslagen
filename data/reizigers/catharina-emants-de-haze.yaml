biografie: Dochter van Johan Emants (1678-1742) en Sara Marie Bruinstein (ca. 1674-1763). Trouwde
  met Elias de Haze (1689-1752) en hertrouwde na diens dood met Daniël Livius van Andringa de
  Kempenaer (1713-1772). In 1748 maakte zij een plezierreisje naar Den Haag in het gezelschap
  van haar echtgenoot, de families Thibaut en Bomme en Cornelia Carolina de Vassy.
