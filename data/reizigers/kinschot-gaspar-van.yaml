id: kinschot-gaspar-van
naam: Kinschot, Gaspar van
geboren:
  jaar: 1592
  datum: 29 januari 1592
  plaats: Den Haag
overleden:
  jaar: 1654
  datum: 5 juli 1654
  plaats: Den Haag
korte_typering: Den Haag, 29 januari 1592 – Den Haag, 5 juli 1654. Maakte in 1612-13 een educatiereis
  naar Frankrijk (20 jaar).
biografie: Zoon van Jasper van Kinschot (1552-1603) en Josina Pijll (1562-1601), broer van
  Nicolaas (1585-1660) Maakte waarschijnlijk een educatiereis naar Frankrijk in 1612 en 1613
  in het gezelschap van Cornelis van Beveren (1591-1663), Van Blockhusen, Wouter van Clootwijck
  en diens zwager. Was schepen, burgemeester en vroedschap van Den Haag.
reizen_vermeld:
- April 1612-oktober 1613, Zuidelijke Nederlanden, Frankrijk, Zwitserland en Duitsland.
verslagen_vermeld:
- Van Beveren 1612-1613.
bronnen:
- gemaakt-op-reis
