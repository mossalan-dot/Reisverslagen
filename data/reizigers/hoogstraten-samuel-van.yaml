korte_typering: Dordrecht, 2 augustus 1627 – Dordrecht, 19 oktober 1678. Doopsgezind. Maakte
  in 1651-55 een kunstenaarsreis naar Duitsland, Oostenrijk en Italië (24 jaar).
biografie: Zoon van de schilder Dirck van Hoogstraten (ca. 1595-1640) en Mayke de Coninck
  (1598-1645). Werkte als leerling in het atelier van Rembrandt van Rijn (1606-69). Maakte
  een kunstenaarsreis naar Duitsland, Oostenrijk en Italië tussen 1651 en 1655 en deed onderweg
  onder andere Keulen, Regensburg, Wenen, Venetië, Milaan, Genua, Rome, Napels en Florence
  aan. In Wenen stelde hij zijn werken tentoon aan keizer Ferdinand III (1608-57). Kreeg in
  Rome in 1652 de bijnaam ‘Batavier’. Tussen 1662 en 1667 werkte hij in Londen. Publiceerde
  in 1678 het kunsttheoretische traktaat Inleyding tot de hooge schoole der schilderkonst.
reizen_vermeld:
- Mei 1651-55, Duitsland, Oostenrijk, Italië; mei 1622-67, Engeland.
