biografie: Zoon van Cornelis de Graeff (1599-1664), heer van Polsbroek, en Catharina Hooft (1618-1691).
  Maakte in 1655 een diplomatieke reis naar Duitsland in het gezantschap van Joan Corver (1628-1716),
  Joan Huydecoper (1599-1661) en diens zoon Joan (1625-1704). Maakte in 1658-1660 een educatiereis
  naar Engeland en Frankrijk en ontving een licentiaat in de rechten aan de universiteit van
  Orléans. Was schepen van Amsterdam, bewindhebber van de VOC en raadsman van raadpensionaris
  van zijn neef en zwager Johan de Witt (1625-1672).
