korte_typering: Rijswijk, ca. 1630 – Lyon (FR), 15 januari 1705. Protestants, daarna katholiek.
  Maakte in 1655-66 een kunstenaarsreis naar Frankrijk en Italië (ca. 15 jaar).
biografie: Zoon van Cornelis Jansz. van der Kabel en Maertje Philipsdr. Was een leerling van
  Jan van Goyen (1596-1656) in Den Haag en leefde tussen 1655 en 1658 in Lyon. Leefde en werkte
  in Rome tussen 1659 en 1666, waar hij meermaals in aanraking kwam met de politie wegens
  vechtpartijen en het verboden bezit van een degen. Zijn jongere broer Engel (ºca. 1641)
  reisde met hem mee. Kreeg de bentnaam ‘Geestigheit’. Vestigde zich in 1668 in Lyon.
reizen_vermeld:
- 1656-58, Frankrijk; 1659-66, Italië.
