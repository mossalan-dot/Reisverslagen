korte_typering: Amsterdam, 21 maart 1656 – Amsterdam, 14 januari 1731. Maakte rond 1679 een
  educatiereis naar Italië (ca. 23 jaar).
biografie: Zoon van Cornelis Backer (1633-81) en Christine le Gillon (1633-58). Maakte rond
  1679 een educatiereis naar Italië, waar hij zich liet portretteren. Trouwde in 1682 met
  Magdalena de la Court (1661-1712). Werkte als advocaat en koopman en was een kunstverzamelaar.
  Was in Amsterdam luitenant en kapitein van de burgerij en kerkmeester van de Amstelkerk.
