korte_typering: 'Maakte in 1696 een korte plezierreis. Eerste reis: 14-07-1696'
biografie: Trouwde in 1692 met Maria van Assendelft (1646-1744) en nam haar achternaam aan.
  Werd aangesteld als thesaurier en rentmeester-generaal van stadhouder Willem III (1650-1702).
  Bekleedde in Den Haag onder andere het ambt van schepen, postmeester en burgemeester. In 1696
  maakte hij samen met zijn echtgenote en schoonfamilie een plezierreisje naar Nijmegen, Kleef
  en paleis Het Loo. Overleed in 1744.
