biografie: Zoon van Johan van Reede tot Renswoude (1593-1682) en Jacomina van Eeden. Was kapitein
  en luitenant-kolonel. Bekleedde de functie van kanunnik en geëligeerde raad voor de dom van
  Utrecht. Was in 1672 en 1673 belast met geheime zendingen naar Engeland. In 1674 reisde hij
  naar Londen om te onderhandelen over de Vrede van Westminster samen met collega-diplomaten
  Coenraad van Beuningen (ca. 1622-1693), Willem Adriaan van Nassau-Odijck (ca. 1632-1705) en
  Willem van Haren (1626-1708). De reis werd beschreven door Joannes Vollenhove (1631-1708).
