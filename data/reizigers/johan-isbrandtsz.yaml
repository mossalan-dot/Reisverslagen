biografie: Zoon van Hieronymus Isbrandtsz en Hylke Noorthoorn. Studeerde in Groningen en Orléans
  en promoveerde in Groningen. Bekleedde verschillende ambtelijke posities, waaronder gecommitteerde
  ter Staten-Generaal, gedeputeerde der provincie en lid van de Raad van State. Maakte een diplomatieke
  reis naar Polen in 1656 samen met medegezanten Govert van Slingelandt (1623-1690), Frederik
  van Dorp (1612-1679) en Pieter de Huybert (1622-1795). De reis wordt beschreven door Adriaen
  Schagen (1633-1699). Reisde als diplomaat in 1665 naar Zweden en was in 1668 onderhandelaar
  bij de Triple Alliantie. Maakte in 1673 en 1674 een diplomatieke reis naar Aken en Keulen.
