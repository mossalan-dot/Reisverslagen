id: ripperda-johan-willem-van
naam: Ripperda, Johan Willem van
religie: Katholiek
korte_typering: Hertog van Ripperda, Grande der eerste klasse, heer van Jensema, Poelgeest
  en Koudekerk. Oldehove, 7 maart 1682 – Tétouan (MA), november 1737. Katholiek, protestants
  en later weer katholiek. Reisde als ambassadeur naar Spanje in 1714 (32 jaar).
biografie: Zoon van Ludolph Luurdt Ripperda tot Winsum (ca. 1647-1721) en Maria Isabella van
  Deest (†ca. 1737). Studeerde bij de jezuïeten in Emmerik en Keulen en bekeerde tot het protestantisme.
  Was lid van de Staten van Stad en Lande en grietman van Humsterland en Oosterdeel-Langewold.
  Werd in 1711 afgevaardigd naar de Staten-Generaal. In 1714 werd hij aangesteld als gezant
  en ambassadeur te Madrid, waar hij zich tot het katholicisme bekeerde. Reisde in 1719 naar
  Frankrijk in het gezelschap van Nehemia Vegelin van Claerbergen (1691-1739). Maakte in 1725
  een diplomatieke reis naar Wenen, waar hij het Verdrag van Wenen tot stand wist te brengen.
  Werd in Spanje verheven tot eerste minister. Na het falen van het Verdrag, werd hij in Spanje
  beschuldigd van hoogverraad. Wist na twee jaar opsluiting te ontsnappen via Portugal naar
  Engeland. Werd minister en generaal in dienst van een Marokkaanse sultan.
reizen_vermeld:
- April 1715-1718; Spanje; juli-december 1719, Frankrijk; 1719-1725, Spanje; 1723-1725, Wenen;
  1728-oktober 1730, Portugal en Engeland; september 1731-november 1737, Marokko.
verslagen_vermeld:
- Vegelin van Claerbergen 1719.
addenda:
- Verbaal van het gezantschap, hierboven genoemd (SG 8699); uitgegeven Engelse memoires van
  Ripperda (Campbell 1740).
correspondentie:
- Brieven aan Johan Gabriël Albert Sloet (1677-1765), baron Sloet tot Warmelo, tijdens zijn
  verblijf in Spanje in 1715-1717 (Nepveu 1884, 91-114); correspondentie over zijn verblijf
  in Wenen (9); brieven van het Spaanse hof over de onderhandelingen in Wenen (11-12); correspondentie
  over zijn werkzaamheden in Marokko, inclusief afschriften en aantekeningen, tussen 1724
  en 1732 (10); brief van Gabriel Lanaci aan Ripperda, 1735 (15).
literatuur:
- BWN, XVI, 350-353; NNBW, II, 1212-1214; Van Verschuer 1861; Nepveu 1884, 91-114; Naber 1909,
  208-271; Bussemaker 1911, 89-134; Van Alkemade 1968; De Preter 1982, 99-119; Van der Veen
  1999, 13-28; Van der Veen 2007.
