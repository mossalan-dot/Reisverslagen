id: rechteren-johan-willem-van
naam: Rechteren, Johan Willem van
geboren:
  jaar: 1658
overleden:
  jaar: 1719
  datum: 18 november 1719
korte_typering: Heer van Verborch. 1658 – 18 november 1719. Maakte in 1684-86 een reis naar
  Italië en Jeruzalem (26 jaar).
biografie: Zoon van Joachim Adolf van Rechteren (1627-86) en Margaretha van Haersolte (1628-82),
  broer van Adolf Hendrik (1656-1741) en Reinhard (1659-1732). Was in 1683 vrijwilliger bij
  de zeedienst en woonde verschillende tochten bij. Maakte tussen 1684 en 1686 een reis naar
  Italië en Jeruzalem. In 1693 werd hij kapitein en in 1694 werd hij bevelhebber voor Duinkerken.
  Streed in 1704 in de zeeslag bij Malaga.
reizen_vermeld:
- 1684-86, Italië en Jeruzalem; 1694, Engeland; 1704, Malaga.
addenda:
- Stukken betreffende de reis in 1684-86 (Van Rechteren 1684-1685); scheepsjournalen en kasboeken
  tussen 1691 en 1702 (Van Rechteren 1691-1702); kasboekaantekeningen in het reisverslag van
  zijn broer Adolf Hendrik van de reis naar Jeruzalem in 1686 (Van Rechteren 1679, [10-11]).
literatuur:
- NNBW, IV, 1126; RAA.
bronnen:
- gemaakt-op-reis
