  jaar: 1661
  datum: 25 oktober 1661
  plaats: Amsterdam
korte_typering: Ridder in de orde van St.-Michiel, heer van Thamen, Blokland, Uithoorn en
  Kudelstaart, van Maarsseveen en Neerdijk. Amsterdam, 1599 – Amsterdam, 25 oktober 1661.
  Maakte in 1635 een diplomatieke reis naar Polen en Zweden (36 jaar).
biografie: Zoon van Jan Jacobsz. Bal (ca. 1541-1625) en Lijsbeth Gerritsdr. van Gemen (1566-1652).
  Was bewindhebber van de VOC en raad en schepen van Amsterdam. Was zesmaal burgemeester tussen
  1651 en 1660. Maakte een diplomatieke reis naar Polen in het gezantschap van Rochus van
  den Honert (1572-1638) en Albert Joachimi (1560-1654) in 1635, waar hij onderhandelde over
  de vrede tussen Polen en Zweden. Werd door Christina van Zweden (1626-89) in 1637 in de
  ridderstand verheven. In 1655 reisde hij met zijn zoon Joan (1625-1704), Joan Corver (1628-1718)
  en Pieter de Graeff (1638-1707) naar het hof van Brandenburg om te spreken over een bondgenootschap
  tegen Zweden en op te treden als peetoom bij de doop van Karel Emiel (1655-74), keurvorst
  van Brandenburg.
reizen_vermeld:
- April-oktober 1635, Polen; april-juni 1655, Duitsland.
verslagen_vermeld:
- De Graeff 1655; De Graeff 1918, 149-168.
addenda:
- Verbalen van de gezantschappen, hierboven genoemd (8375-8378); stukken over de ambassade
  naar Berlijn in 1655 (Huydecoper 1655).
correspondentie:
- Zie appendix B.
poezie:
- Een gedicht van Jan Vos (1612-67) over de reis naar Brandenburg in 1655, 1) ‘Yvoore kop,
  door zyn Keurvorstelyke Doorluchtigheidt van Brandenburg gedreit, en aan den Ed. Heer Joan
  Huidekooper, Ridder, Heer van Maarsseveen, &c Gezant weegens Amsterdam, te Berlyn vereert’
  (Vos 1662, 217-218).
