biografie: Zoon van predikant Johannes Albertusz. Zaunslifer. Studeerde in Leiden. Diende in
  1702 als predikant op het schip van viceadmiraal Philips van der Goes (1651-1707) en reisde
  naar Spanje. Werd in 1707 predikant van Zoelen en in 1717 van Vianen.
