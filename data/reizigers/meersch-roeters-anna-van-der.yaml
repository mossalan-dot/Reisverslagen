id: meersch-roeters-anna-van-der
naam: Meersch(-Roeters), Anna van der
geboren:
  jaar: 1669
  plaats: Amsterdam
overleden:
  jaar: 1724
religie: Doopsgezind
korte_typering: Amsterdam, 1669 – 1724. Doopsgezind. Vluchtte tijdens het Rampjaar naar Hamburg
  (3 jaar).
biografie: Dochter van Abraham van der Meersch (1643-1728) en Elisabeth Bouttens (1643-1707),
  zus van Sara (†1674), Catharina (1666-1723), Pieter (º1677), Abraham jr. (1676-1719) en
  Arent (1683-1768). Vluchtte tijdens het Rampjaar met haar ouders en haar zussen naar Hamburg.
  Maakte in 1703 een handelsreis naar Duitsland met haar broer Arent, Pieter Boek en Giese
  Mulder. Leefde tussen 1706 en 1716 met haar vader op het Hofslot te Soest.
reizen_vermeld:
- Juni 1672-73, Hamburg; april-december 1703, Duitsland.
verslagen_vermeld:
- Van der Meersch 1672-1674; Van der Meersch 1703.
literatuur:
- Visser en Zilverberg 1991, 153-187.
bronnen:
- gemaakt-op-reis
