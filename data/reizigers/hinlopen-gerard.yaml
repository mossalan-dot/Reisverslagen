  1674, Zuidelijke Nederlanden; mei 1675, Friesland en Groningen; juni-juli, Zuidelijke Nederlanden;
  juli-augustus 1678, Utrecht en Gelderland; juli 1680/juni 1681, Den Bosch; juni 1683, Zuidelijke
  Nederlanden.
