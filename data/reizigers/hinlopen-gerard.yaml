korte_typering: Hoorn, 30 september 1644 – Hoorn, 2 oktober 1691. Maakte in 1662 een plezierreis
  (17 jaar).
biografie: Zoon van Reynier Hinlopen en Trijntje Thijsdr. van Noy. Studeerde rechten in Leiden.
  In 1667 en 1668 maakte hij een educatiereis naar Frankrijk in het gezelschap van zijn tante
  Judith de la Bretonnerie en neef Reinier Hinlopen. Hij behaalde in Orléans zijn licentiaat
  in de rechten. Tussen 1670 en 1671 maakte hij een lange reis naar Spanje, Italië, Sicilië,
  Griekenland en Istanbul, waarvan hij een bijzonder lang en geïllustreerd verslag bijhield.
  Was schepen van Hoorn in 1677 en 1679 en vervulde daarna verschillende bestuurlijke posities.
  Diende in 1673 in de compagnie van kapitein G. Schagen. Maakte naast bovenstaande reizen
  verschillende plezierreizen door de Nederlanden.
reizen_vermeld:
- Mei-juni 1662, Zuidelijke Nederlanden; juni 1667-april 1668, Frankrijk en Engeland; juni
