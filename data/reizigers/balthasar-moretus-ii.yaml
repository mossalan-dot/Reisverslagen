biografie: Zoon van Jan II Moretus (1576-1618) en Maria de Sweert (1588-1655), echtgenoot van
  Anna Goos (1645-1674) en vader van Balthasar III (1646-1696), Joannes Jacobus (1647-1718),
  Franciscus (1656-1705) en Maria Isabella (1655-1676). Studeerde in Antwerpen en Doornik. Nam
  in 1641 de uitgeverij Plantijn over en maakte de onderneming winstgevend. Werd in 1647 benoemd
  tot deken in het Antwerpse Sint-Lucasgilde. Reisde in 1660 naar Parijs in het gezelschap van
  zijn zoon Balthasar III. Maakte een korte reis naar Ieper, Lille en Doornik in 1663 in het
  gezelschap van zijn zonen Balthasar III en Joannes Jacobus. Maakte een korte reis naar Den
  Bosch in 1668 met zijn echtgenote en kinderen.
