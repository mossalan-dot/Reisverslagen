biografie: Zoon van Gerrit Corver Hooft (1744-1807) en Margaretha Straalman (1747-1816). Maakte
  in 1802 een reis naar Londen en Hamburg. Bekleedde verschillende hof- en bestuursfuncties.
  Was in 1808 dienstdoend kamerheer van koning Lodewijk Napoleon (1778-1846). Werd in 1824 gekozen
  tot Tweede Kamerlid en was in 1829-1830 kamervoorzitter. Was in 1849 en 1850 lid van de Eerste
  Kamer.
