korte_typering: Utrecht, ca. 1595 – Utrecht, 21 februari 1624. Maakte in 1612-20 een kunstenaarsreis
  naar Italië (17 jaar).
biografie: Zoon van Jaspar van Baburen en Margareta van Doyenburch. Ging in 1611 in de leer
  bij de kunstschilder Paulus Moreelse (1571-1638). Maakte tussen 1612 en 1620 een kunstenaarsreis
  naar Italië, waar hij langere tijd in Parma en Rome verbleef. Hij was een van de eerste  Bentvueghels.
  Zijn bijnaam was ‘Biervlieg’. Werkte onder anderen voor kardinaal Scipione Borghese (1577-1633)
  en vervaardigde voor de Spaanse diplomaat Pierro Cussida het schilderwerk in de San Pietro
  in Montorio in Rome.
reizen_vermeld:
- 1612-20, Italië.
