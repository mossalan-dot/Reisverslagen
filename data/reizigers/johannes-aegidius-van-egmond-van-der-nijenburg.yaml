biografie: Zoon van Cornelis Egmond van der Nijenburg (1651-1708) en Catharina van Panhuys (ª1657).
  Promoveerde in Leiden in de rechten en was werkzaam als advocaat. Maakte tussen 1718 en 1723
  met Samuel van de Putte (1690-1745) een educatiereis naar Italië, gevolgd door een grote reis
  naar het Midden-Oosten. Zijn verslag, bewerkt door Johannes Heyman (1708-1788), werd postuum
  uitgegeven als Reizen door een gedeelte van Europa, klein Asien (...). Maakte in juli 1724
  een reis naar Engeland met zijn broer Dirk (1695-1740). Was schepen en raad in Leiden. Werd
  in 1739 als buitengewoon gezant naar Napels gezonden om koning Karel VII (1716-1788) te feliciteren
  met zijn huwelijk met Maria Amalia van Saksen (1724-1760) en een handelsverslag te ondertekenen.
  Jan Teding van Berkhout (1713-1766) reisde mee.
