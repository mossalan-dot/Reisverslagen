biografie: Zoon van Jasper van Kinschot (1552-1603) en Josina Pijll. Studeerde en promoveerde
  in de rechten in Leiden. Maakte een educatiereis naar Duitsland in 1603, waarvoor zijn vader
  apodemische instructies opschreef. Mogelijk werd hij uit het land gestuurd zodat vader Jasper
  Anna Bruininckx (†1603) het hof kon maken, een geliefde van zijn zoon. Schreef in 1603 een
  ode op Maurits van Oranje (1567-1638), de Oratio Panegyrica. Werd in 1614 aangesteld tot advocaat-fiscaal
  van Holland en in 1638 tot pensionaris van Delft. Nam in 1651 het raadspensionarisschap van
  Jacob Cats over (1577-1660).
