id: kies-van-wissen-adrianus-de
naam: Kies van Wissen, Adrianus de
korte_typering: Zoon van Johan de Kies van Wissen (1633-1705) en Agatha van der Dussen (1662-1717).
  Maakte in 1708-1709 een educatiereis naar Italië.
reizen_vermeld:
- 1708-1709, Italië.
correspondentie:
- Vier brieven aan zijn moeder, 1) Rome, 23 juni 1708, 2) 22 september, 3) 2 februari 1709,
  4) april 1709 (FA Van Brienen).
bronnen:
- gemaakt-op-reis
