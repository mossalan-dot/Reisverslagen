id: hellemans-hooft-arnout
naam: Hellemans Hooft, Arnout
korte_typering: Amsterdam, december 1629 – Amsterdam, februari 1680. Maakte in 1649-51 een
  educatiereis naar Italië en Frankrijk (19 jaar).
biografie: 'Zoon van de dichter en staatsman Pieter Cornelisz. Hooft (1581-1647) en Leonora
  Hellemans (1595-1661). Studeerde rechten in Leiden en maakte tussen 1649 en 1651 een educatiereis
  naar Duitsland, Oostenrijk, Italië, Zwitserland en Frankrijk met de dichter Reyer Anslo
  (1626-69), Rombout (1620-79) en Joannes Hudde (1624-1704), IJsbrand Kieft, Blom en Ooms.
  Schreef zich in aan de universiteit van Siena. Werkte als diplomaat in Duitsland en Londen
  en reisde in 1653 naar Lübeck voor de vredesonderhandelingen tussen Polen en Zweden samen
  met Anthonis van Waveren, Jacob de Witt (1589-1674) en Nicolaas Vivien (1631-92). Werd in
  1656 commissaris en in 1662 schepen van Amsterdam en werkte als gouverneur van de WIC. Werd
  in het Rampjaar ontslagen door stadhouder Willem III (1640-1702) nadat hij Johan de Witt
  (1625-72) had ondersteund. Verzorgde de uitgave van zijn vaders Nederlandsche Historiën
  in 1671.


  Helmbreeker, Dirck [ook: Helmbreecker, Theodoor; Fiammingo, Teodoro; Monsu, Teodoro] Haarlem,
  1633 – Rome, 1696. Maakte in 1652 een kunstenaarsreis naar Duitsland (19 jaar).


  Zoon van de organist Cornelis Helmbreeker (1590-1654). Was een leerling van de kunstschilder
  Pieter de Grebber (ca. 1600-ca. 1652) en schreef zich in 1652 in in het Haarlemse kunstenaarsgilde.
  Maakte in 1652 een kunstenaarsreis naar Keulen in het gezelschap van de schilders Guillaume
  Dubois (1623-61), Vincent Laurensz van der Vinne (1628-1702) en Cornelis Bega (1631-64)
  en de schoenmakersgezel Joost Boelen (ºca. 1633). In 1654 werkte hij in Venetië voor de
  literator Gian Francesco Loredano (1607-61). Werkte tussen 1654 en 1656 naar Rome, Lyon
  en Parijs. In 1659 vestigde hij zich in Rome. Schilderde onder andere in Rome, Napels, Turijn
  en Florence.'
