biografie: Dochter van Jacob Goos (1590-1666) en Clara Bosschaert. Echtgenote van Balthasar
  Moretus II (1615-1674) en moeder van Balthasar III (1646-1696), Joannes Jacobus (1647-1718),
  Franciscus (1656-1705) en Maria Isabella (1655-1676). Nam na het overlijden van haar man de
  leiding van zijn Antwerpse drukkerij over. In 1668 maakte zij met haar man en kinderen een
  plezierreis naar Den Bosch, Dordrecht en Zeeland. Zij, Franciscus en Maria Isabella maakten
  rechtsomkeert bij Scherpenheuvel.
