biografie: Zoon van Pieter Pott en Margaretha Froon. Studeerde in Leiden. Maakte tussen 1684
  en 1686 een educatiereis naar Engeland, Frankrijk, Italië, Zwitserland en Duitsland. Promoveerde
  in 1686 in Padua. Zijn verslag, in zijn correspondentie aangeduid als de Notula, is zoek.
  Was ambtsman van het Goorecht, raadsheer in Groningen en lid van de Staten-Generaal in 1706
  en 1709.
