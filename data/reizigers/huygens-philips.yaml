id: huygens-philips
naam: Huygens, Philips
geboren:
  jaar: 1633
  datum: 12 oktober 1633
  plaats: Den Haag
overleden:
  jaar: 1657
  datum: 14 mei 1657
  plaats: Malbork (P)
korte_typering: Den Haag, 12 oktober 1633 – Malbork (P), 14 mei 1657. Maakte in 1656 een diplomatieke
  reis naar Polen (23 jaar).
biografie: Zoon van Constantijn Huygens (1596-1687) en Suzanna van Baerle (1599-1637), broer
  van Constantijn (1628-97), Christiaan (1629-95), Lodewijk (1631-99) en Susanna (1637-1725).
  Reisde in 1656 naar Polen in het gezantschap van Govert van Slingelandt (1623-90), Frederik
  van Dorp (1612-79), Pieter de Huybert (1622-95) en Johan Isbrandtsz (1621-1702). De reis
  werd beschreven door Adriaen Schagen (1633-99). Stierf onderweg aan buikloop.
reizen_vermeld:
- Maart-mei 1656, Polen.
verslagen_vermeld:
- Schagen 1656; Schagen 1968.
addenda:
- Minuut van het journaal van het gezantschap, hierboven beschreven (SG 8493).
correspondentie:
- Twee brieven aan zijn broer Christiaan, 1) Gdańsk, 6 mei 1656; 2) Malbork, 30 mei. Over
  zijn dood wordt gesproken in een brief van Christiaan aan David van Baerle (1595-1671) (ePistolarium).
literatuur:
- RKD; Schagen 1968, 19.
bronnen:
- gemaakt-op-reis
