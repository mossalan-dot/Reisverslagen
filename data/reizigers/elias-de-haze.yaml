biografie: Zoon van Hubrecht de Haze (1644-1705) en Anna Catharina de la Porte (1656-1736).
  Had een bestuurlijke carrière in Nederlands-Indië. Was tussen 1731 en 1735 gouverneur van
  Ternate op de Molukken en werd in 1738 president van de schepenen in Batavia. Was raad van
  Nederlands-Indië tussen 1739 en 1741. Werd op last van de gouverneur-generaal in 1740 gevangen
  genomen, maar werd later vrijgesproken. In 1748 maakte hij een plezierreisje naar Den Haag
  in het gezelschap van zijn echtgenote Catharina Emants (1715-1782), de families Thibaut en
  Bomme en Cornelia Carolina de Vassy.
