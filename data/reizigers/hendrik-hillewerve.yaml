biografie: Zoon van Cornelis Hillewerve en Mechteld Tholinx, schoonbroer van Balthasar II Moretus
  (1615-1674). Wordt door Verhoeven per abuis geïdentificeerd als Hillewernen. Werd in 1660
  tot het priesterschap gewijd en werd priester in de Sint-Jacobuskerk in Antwerpen. In 1664
  en 1665 vergezelde hij als tutor de educatiereis van zijn neven Balthasar III Moretus (1646-1696),
  Pieter Goos (1645-1708) en Jan Tholinx jr. (1631-1705) en Theodoor Andries van Kessel. Werd
  in 1675 tot de adelstand verheven en beëdigd tot apostolisch protonotaris. Was eigenaar van
  het tegenwoordige Rubenshuis en kasteel Ravenhof.
