id: hudde-joannes
naam: Hudde, Joannes
geboren:
  jaar: 1628
  datum: 23 april 1628
  plaats: Amsterdam
overleden:
  jaar: 1704
  datum: 15 april 1704
  plaats: Amsterdam
korte_typering: Heer van Waveren, Botshol en Ruige Wilnis. Amsterdam, 23 april 1628 – Amsterdam,
  15 april 1704. Maakte in 1649-51 een educatiereis naar Italië en Frankrijk (21 jaar).
biografie: Geïdentificeerd door Grabowsky en Verkruijsse. Mogelijk gaat het om zijn broer
  Hendrick (1619-77) of Jonas (†1653), maar gezien de reisleeftijd is Joannes de meest waarschijnlijke
  kandidaat. Zoon van Gerrit Hendricksz. Hudde (1595-1647) en Maria Witsen (1597-1683). Studeerde
  rechten en geneeskunde in Leiden. Maakte tussen 1649 en 1651 een educatiereis naar Italië,
  Zwitserland en Frankrijk in het gezelschap van Arnout Hellemans Hooft (1629-80), Reyer Anslo
  (1626-69), zijn neef Rombout Hudde (1620-79), IJsbrand Kieft, Blom en Ooms. Maakte als leerling
  van Frans van Schooten (1615-60) carrière als wiskundige. Publiceerde verschillende wiskundige
  werken. Mogelijk maakte hij een reis naar Saumur in 1659 om zijn studie in de rechten te
  voltooien. Vervulde verschillende ambten in Amsterdam, waaronder dat van vroedschap, schepen
  en thesaurier-ordinaris. Werd door stadhouder Willem III (1650-1702) aangesteld als burgemeester
  van Amsterdam in 1672, een ambt dat hij tot 1703 meerdere malen bekleedde.
reizen_vermeld:
- September 1649-november 1651, Duitsland, Oostenrijk, Italië, Zwitserland en Frankrijk; 1659,
